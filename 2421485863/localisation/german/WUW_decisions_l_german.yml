GER_exploit_the_gombos_treaty_desc: "Der Handelsvertrag, den der ungarische Ministerpräsident Gyula Gömbös 1934 mit uns unterzeichnete, ist wichtig für die Ankurbelung der ungarischen Wirtschaft und die Erholung von der großen Depression, aber er hat auch große Nachteile für die Ungarn. Obwohl das Abkommen ihnen einen günstigen Preis für den Verkauf von Weizen einräumt, muss das verdiente Geld auf einem Konto in Deutschland verbleiben und darf nur für den Kauf deutscher Industriegüter verwendet werden. Wir könnten also das Konto, das sie in unserem Land angelegt haben, leeren, um unsere eigene Wirtschaft zu unterstützen, aber um den Preis, einen potenziellen Verbündeten zu verlieren."
