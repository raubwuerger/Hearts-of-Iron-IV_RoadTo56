GER_a_fourth_silesian_uprising_cat_desc: "Aufgrund der jüngsten Instabilität und des Bürgerkriegs in unserer Nation haben diejenigen, die ein unabhängiges Schlesien wollen, mit der Agitation begonnen und bereiten sich auf einen möglichen Aufstand vor, sollte sich die Gelegenheit bieten. Es wäre klug, diese Illusionen so schnell wie möglich zu zerschlagen."
