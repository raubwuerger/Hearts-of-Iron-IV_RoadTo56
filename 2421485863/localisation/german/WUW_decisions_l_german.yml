antilles_category: "Die Antilleschen Konföderation"
antilles_category_desc: "Die Antillen-Konföderation war die vehemente Idee von Ramón Emeterio Betances, dass sich die Ureinwohner der Karibik zu einer regionalen Einheit zusammenschließen sollten, um die Souveränität und das Wohlergehen der Antillen-Nationen zu bewahren. Die Unterstützung war in den 1850er Jahren bis zum Spanisch-Amerikanischen Krieg am stärksten und ist seither weitgehend erloschen, aber es ist noch nicht alles verloren. Indem wir den Geist unseres gemeinsamen Weges beschwören, können wir versuchen, ein für alle Mal eine Konföderation der Antillen zu gründen. Die Antillen für die Antillianer!"
