GER_USA_is_monroe_actor_d: "Wir sind darauf aufmerksam geworden, dass es ziemlich weitreichende [GER.GetAdjective] Pläne gibt, die Monroe-Doktrin zu destabilisieren. Damit würden sie den Konflikt in unseren eigenen Hinterhof tragen. Das können wir nicht zulassen."
GER_GER_is_monroe_actor_d_usa_resistance: "Es scheint, dass die [USA.GetAdjective] beschlossen haben, unsere Versuche zur Destabilisierung der Monroe-Doktrin zu bekämpfen. Wenn wir schnell handeln, sollten wir dennoch in der Lage sein, die Torheit dieser Doktrin schnell zu beseitigen."
