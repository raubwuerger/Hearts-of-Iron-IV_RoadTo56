GER_hilfskreuzer_cat_desc: "Unseren Feinden Rohstoffe und wichtige Ressourcen zu entziehen, wird den Krieg verkürzen und unseren Sieg garantieren. Es ist daher von größter Wichtigkeit, dass wir über genügend Handelsschiffe verfügen, die in der Lage sind, die feindliche Handelsflotte zu versenken, selbst wenn dies bedeutet, dass wir unsere eigenen Konvois umrüsten müssen, um an den Überfällen teilzunehmen."
