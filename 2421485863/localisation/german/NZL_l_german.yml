NZL_massey_university_concern:	"Massey Universität für Landwirtschaft"
NZL_railways_department:	"New Zealand Railways Department"
NZL_army_review:	"[GetYear] Überprüfung der Armee"
NZL_army_review_desc:	"Da die globalen Spannungen zunehmen, sollten wir die militärische Führung dazu ermutigen, eine umfassende Überprüfung der Armee der Nation einzuleiten, um die Vorteile und Schwächen unserer bestehenden Struktur, Ausrüstung und Strategien zu bewerten."
NZL_a_reinvigorated_force:	"Eine wiedererstarkte Armee"
NZL_a_reinvigorated_force_desc:	"Unsere Armee ist vielleicht nicht die stärkste Streitkraft der Welt, aber mit höheren Investitionen in Ausrüstung, moderne Ausbildungsprogramme und strategische Planung sind wir in einer deutlich stärkeren Position. Die neuseeländische Armee ist zwar klein, aber sie wird zu einer fähigeren und professionelleren Truppe, die bereit ist, unser Land zu verteidigen und zur globalen Stabilität beizutragen."
NZL_adopt_blitskrieg_tactics:	"Übernehmen Sie die Blitzkrieg-Taktik"
NZL_adopt_blitskrieg_tactics_desc:	""
NZL_the_horses_are_better:	"Kavallerie-basierte Armee"
NZL_the_horses_are_better_desc:	""
NZL_new_zealand_will_not_fall:	"Neuseeland wird nicht fallen"
NZL_improve_the_radars:	"Verbessern Sie unser Radar"
NZL_improve_the_radars_desc:	"Unsere RADARS sind unglaublich veraltet, und da sich die Seekriegsführung weiterentwickelt, sollte dies auch für unsere Technologie gelten."
NZL_waiouru_excercises:	"Waiouru Militärübungen abhalten"
NZL_waiouru_excercises_desc:	"Die Waiouru Training Grounds sind ein grundlegender Bestandteil der Ausbildung unserer Armee. Angesichts der laufenden Überprüfung der Armee sollten wir unsere Streitkräfte in einer ausgedehnten Übung trainieren, um sicherzustellen, dass sie auf die harte Realität des unangenehmen Terrains vorbereitet sind und dabei ihre volle Kampfkraft und Gelassenheit beibehalten."
NZL_conscript_the_sheep:	"Schicken Sie die Schafe rein!"
NZL_conscript_the_sheep_desc:	""
NZL_open_ties_with_washington:	"Offene Beziehungen zu Washington"
NZL_open_ties_with_washington_desc:	"Die Amerikaner spielen in der modernen Welt eine entscheidende Rolle. Der Aufbau engerer Beziehungen zu ihnen würde sich zweifellos als vorteilhaft erweisen, da sie Möglichkeiten zur Zusammenarbeit und Zugang zu wertvollen Ressourcen und Unterstützung bieten."
NZL_reaffirm_commonwelth_commitments:	"Commonwealth-Engagements"
NZL_reaffirm_commonwelth_commitments_desc:	""
NZL_ford_munition_plant:	"Ford Munitionsfabrik"
NZL_ford_munition_plant_desc:	"Die Beauftragung amerikanischer Unternehmen mit dem Bau von Munitionsfabriken für unser Land würde unsere industriellen Kapazitäten stärken, die Versorgung mit lebenswichtigen Rüstungsgütern sicherstellen und gleichzeitig von ihrem Know-how und ihren fortschrittlichen Fertigungstechniken profitieren."
NZL_anzus_treaty:	"Unterzeichnung des ANZUS-Vertrags"
NZL_anzus_treaty_desc:	""
NZL_mutual_aid_agreement:	"Abkommen über gegenseitige Hilfe"
NZL_mutual_aid_agreement_desc:	""
NZL_australian_nzl_agreement:	"ANZAC-Abkommen"
NZL_australian_nzl_agreement_desc:	"Um unsere Interessen im Pazifik zu wahren, ist eine enge Zusammenarbeit mit unseren Nachbarstaaten unerlässlich. Die rasche Kriegsgefahr und die Expansion von Imperien erfordern gemeinsame Anstrengungen, um regionale Stabilität, Sicherheit und den Schutz gemeinsamer Werte und Souveränität zu gewährleisten."
NZL_serving_the_empire:	"Im Dienste des Imperiums"
NZL_serving_the_empire_desc:	"Ein weiser Franzose bemerkte einmal: Die Tyrannei ist wie die Hölle nicht leicht zu überwinden; doch wir haben diesen Trost: Je härter der Kampf, desto großartiger der Sieg. Und so wird unsere Entschlossenheit niemals schwanken - wir werden der Tyrannei entgegentreten, wo immer sie existiert und wo immer sie entstehen mag."
NZL_adapt_to_the_jungles:	"Anpassung an die Dschungelkriegsführung"
NZL_adapt_to_the_jungles_desc:	"Wir müssen unsere Streitkräfte darauf vorbereiten, in den schwierigen Dschungelgebieten des Pazifiks effektiv zu kämpfen. Durch die Entwicklung spezieller Trainingsprogramme, die Ausstattung unserer Soldaten mit geeigneter Ausrüstung und die Anwendung von Taktiken, die für das dichte und unnachgiebige Terrain geeignet sind, können wir sicherstellen, dass unsere Truppen auf diese einzigartige Herausforderung vorbereitet sind."
NZL_the_second_nzl_volunteer_force:	"Die zweite Freiwilligenarmee"
NZL_the_second_nzl_volunteer_force_desc:	"Im Falle eines Krieges muss Neuseeland Truppen aufstellen, um sich und seine Verbündeten zu schützen."
NZL_new_zealand_special_forces:	"1. neuseeländisches S.A.S.-Regiment"
NZL_new_zealand_special_forces_desc:	"Spezialtruppen haben heutzutage ihren Platz in der Kriegsführung, sie zu übernehmen wäre ein hervorragender Schachzug."
NZL_hot_climate_equipment:	"Beschaffung von Ausrüstung für heißes Klima"
NZL_hot_climate_equipment_desc:	"Wir sollten uns Ausrüstungen für heißes Klima beschaffen, da unsere Einheiten im Falle eines Krieges in Gebieten eingesetzt werden könnten, die diese benötigen."
NZL_supply_food_stuffs:	"Sorgen Sie für die Ausrüstung vor"
NZL_supply_food_stuffs_desc:	"Auch wenn wir nicht über die Mittel verfügen, eine große Anzahl von Soldaten zu entsenden oder große Mengen an Ausrüstung zu schicken, können wir wertvolle Unterstützung in Form von Nahrungsmitteln anbieten. Diese Vorräte könnten eine wichtige Form der Hilfe sein und möglicherweise sogar einen Handel oder Tausch gegen notwendige Ausrüstung ermöglichen."
NZL_army_of_thieves:	"''Eine Armee von Dieben''"
NZL_army_of_thieves_desc:	"Einige unserer Divisionen an der Front haben sich die Ausrüstung des Feindes angeeignet. Manche mögen uns als Diebe bezeichnen, wir ziehen es vor, dies als Beschaffung vor Ort und Reduzierung der logistischen Belastung durch bewaffnete Kämpfe zu bezeichnen. Dieser Geist des Einfallsreichtums muss sich in unseren Streitkräften verbreiten!"
NZL_train_new_officers:	"Neue Offiziere ausbilden"
NZL_train_new_officers_desc:	"Wir müssen unser derzeitiges Marinekommando neu besetzen, um unsere Fähigkeiten zu verbessern."
NZL_solidify_the_new_zealand_division:	"Auf dem Weg zu einer unabhängigen Marine"
NZL_solidify_the_new_zealand_division_desc:	"Derzeit ist unsere Marine nichts, was man bewundern könnte, aber wir können Maßnahmen ergreifen, um sie zu verbessern."
NZL_naval_profit:	"Die Gewinnmargen der Marine erhöhen"
NZL_naval_profit_desc:	"Die Marineindustrie hat unserem Land großen Nutzen gebracht. Wenn wir sie weiter ausbauen könnten, würde sich das sicher auszahlen."
NZL_form_the_new_zealand_navy:	"Die königliche neuseeländische Marine"
NZL_form_the_new_zealand_navy_desc:	"In der Vergangenheit war unsere Marine nichts weiter als eine kleine Flotte von Reserveschiffen, jetzt können wir sie zu einer eigenständigen Streitmacht machen."
NZL_destroyer_production:	"Schützen Sie unsere Gewässer"
NZL_destroyer_production_desc:	"Unsere Gewässer sind das Lebenselixier unserer Nation, und es ist zwingend notwendig, dass wir entschlossen handeln, um sie zu schützen. Durch die Schaffung einer eigenen Küstenverteidigungsflotte werden wir eine beeindruckende Streitmacht aufbauen, die in der Lage ist, unsere Küsten vor jeder Bedrohung zu verteidigen."
NZL_advanced_convoy_escorts:	"Geleitschiffe für Konvois"
NZL_advanced_convoy_escorts_desc:	"Um unsere Konvois und die unserer Verbündeten weiterhin effizient eskortieren zu können, müssen wir eine moderne Flotte von Zerstörern unterhalten, die in der Lage sind, Plünderer abzufangen und unsere verwundbaren Schiffe vor Luftangriffen zu schützen."
NZL_submarine_production:	"Konzentration auf die Unterbindung des Handels auf See"
NZL_submarine_production_desc:	"In der modernen Seekriegsführung sind U-Boote ein entscheidender Faktor, wir sollten den Bau eigener U-Boote in Erwägung ziehen."
NZL_supply_the_new_zealand_navy_divsion:	"Beantragen Sie begrenzte Autonomie der Marine"
NZL_supply_the_new_zealand_navy_divsion_desc:	"Unsere Marine benötigt die nötige Ausrüstung und Ressourcen, um sich selbst zu erhalten und sicherzustellen, dass sie unsere Küsten verteidigen und mit größerer Unabhängigkeit operieren kann. Um unsere maritimen Fähigkeiten zu stärken, sollten wir an die Admiralität appellieren, die neuseeländische Division durch die Bereitstellung zusätzlicher Schiffe zu stärken."
NZL_expand_devonport:	"Den Marinestützpunkt Devonport ausbauen"
NZL_expand_devonport_desc:	"Um uns auf die Anforderungen der modernen Seekriegsführung vorzubereiten, müssen wir die Einrichtungen des Marinestützpunkts Devonport ausbauen. Durch die Modernisierung der Docks, Werkstätten und der Infrastruktur werden wir den Bau und die Wartung größerer, modernerer Kriegsschiffe ermöglichen."
NZL_support_ships:	"Beschaffung von zivilen Schiffen"
NZL_support_ships_desc:	"Die Beschaffung von zivilen Schiffen für militärische Zwecke hat ihre Vorteile: Wir können folgende Schiffe beschaffen "
NZL_light_cruiser_effort:	"Überwasserjäger"
NZL_light_cruiser_effort_desc:	"Der Erfolg der deutschen Überwasserjäger während des Ersten Weltkriegs hat gezeigt, welch verheerende Wirkung schnelle, gut bewaffnete Schiffe auf die feindlichen Handelsrouten haben. Diese Schiffe versetzten die Handelsflotten in Angst und Schrecken, unterbrachen kritische Versorgungslinien und lenkten feindliche Ressourcen ab. Wenn wir in Überwasserjäger investieren, sollten wir versuchen, ihre Effektivität zu wiederholen, indem wir Geschwindigkeit und Feuerkraft nutzen."
NZL_submarine_hunters:	"Engagierte U-Boot-Jäger"
NZL_submarine_hunters_desc:	"Um unsere Seewege zu schützen und feindliche Übergriffe zu verhindern, müssen wir spezielle U-Boot-Jägereinheiten entwickeln und einsetzen. Diese Streitkräfte werden mit fortschrittlichen Sonarsystemen, Wasserbomben und modernen U-Boot-Abwehrtechnologien ausgestattet, um Bedrohungen unter der Wasseroberfläche aufzuspüren und auszuschalten."
NZL_subs:	"U-Boot-Entwicklungsanstrengungen"
NZL_subs_desc:	"Das U-Boot ist das Nonplusultra der Seekriegsführung. Es kann sich lautlos an seine Beute heranpirschen und mit verheerender Wirkung zuschlagen. Wenn wir unsere Investitionen in die Forschung und Entwicklung von U-Booten erhöhen, können wir neue Technologien entwickeln, um ihre Reichweite, Tarnkappe und Feuerkraft zu verbessern. Dies wird sicherstellen, dass unsere Flotte die Tiefen beherrscht und zu einem entscheidenden Faktor für die Überlegenheit der Marine wird."
NZL_unrestricted_submarine_warfare:	"Uneingeschränktes kommerzielles Raiding einführen"
NZL_unrestricted_submarine_warfare_desc:	"Die Ozeane sind riesig, und unter ihrer Oberfläche liegt der Schlüssel zur Unterbrechung der feindlichen Nachschubwege. Mit einer Politik der uneingeschränkten U-Boot-Kriegsführung werden wir unsere U-Boot-Flotte einsetzen, um feindliche Konvois ohne Vorwarnung anzugreifen, ihren Handel zu stören und ihre Kriegsanstrengungen zu schwächen."
NZL_long_range_patrols:	"Marine-Patrouillenflugzeuge"
NZL_long_range_patrols_desc:	"Um unsere Seegrenzen zu sichern und die Sicherheit unserer Gewässer zu gewährleisten, müssen wir in die Entwicklung und den Erwerb moderner Marine-Patrouillenflugzeuge investieren. Diese Flugzeuge werden uns in die Lage versetzen, Langstreckenaufklärung, U-Boot-Abwehr und Überwachung über ausgedehnten Ozeangebieten durchzuführen."
NZL_shore_defences:	"Festigung der Marineknotenpunkte"
NZL_shore_defences_desc:	"Das Verteidigungsministerium hat vorgeschlagen, einen allgemeinen Befehl zur Verstärkung aller Marinestützpunkte in Neuseeland zu erlassen. Durch den Bau von Küstenforts und die Verstärkung unserer Küstenverteidigung will das Verteidigungsministerium lebenswichtige Infrastrukturen schützen und unsere Nation gegen mögliche feindliche amphibische Landungen absichern."
NZL_munition_companies_investments:	"Erweitern Sie die koloniale Munitionsfabrik"
NZL_munition_companies_investments_desc:	"Unser erster Schritt zur Schaffung einer besseren Armee besteht darin, in Unternehmen zu investieren, die Ausrüstung für unsere Soldaten liefern und herstellen."
NZL_remember_anzac:	"Lehren aus dem Großen Krieg"
NZL_remember_anzac_desc:	"Die Opfer der ANZAC-Truppen im Großen Krieg erinnern uns an die Kosten eines Konflikts. Die Lehren aus Feldzügen wie Gallipoli prägen die laufenden Verbesserungen der militärischen Strategie, wobei Flexibilität, Vorbereitung und intelligentere Taktiken im Vordergrund stehen. Wir ehren ihr Andenken, indem wir uns bemühen, unser Militär zu stärken und voranzubringen, damit wir es nicht vergessen."
NZL_womens_auxiliary_army:	"Armee-Hilfskorps der Frauen"
NZL_womens_auxiliary_army_desc:	"Die Einrichtung des Women's Army Auxiliary Corps wird es Frauen ermöglichen, wichtige Aufgaben außerhalb des Kampfes zu übernehmen, wie z.B. Büroarbeit, Logistik, Mechanik und Kommunikation, um die militärischen Operationen zu stärken und mehr Männern den Dienst an der Front zu ermöglichen."
NZL_motorization_efforts:	"Motorisierung der Armee"
NZL_motorization_efforts_desc:	"Mit dem Aufbau eines erweiterten Nachschubkorps und den wachsenden Anforderungen unserer Armee an effizientere Transportmethoden wäre eine gezielte Anstrengung zur Motorisierung von großem Nutzen. Die Verbesserung der Mobilität durch moderne Fahrzeuge würde die Logistik rationalisieren, die Effizienz der Versorgungskette verbessern und einen schnelleren Einsatz der Ressourcen an der Front gewährleisten."
NZL_new_charlton_automatic_rifles:	"Neue automatische Charlton-Gewehre"
NZL_new_charlton_automatic_rifles_desc:	"Wir müssen neue Gewehre für jeden möglichen zukünftigen Konflikt einführen."
NZL_expand_our_tank_warfare:	"Das Konzept der gepanzerten Kriegsführung"
NZL_expand_our_tank_warfare_desc:	"Unser Land ist nicht gerade für seine Kompetenz in der mechanisierten Kriegsführung bekannt, aber der Bauminister hat ein ehrgeiziges und einfallsreiches Konzept vorgelegt. Angesichts der weltweiten Ausrüstungsknappheit schlägt er die Entwicklung eines einheimischen gepanzerten Fahrzeugs unter Verwendung lokal verfügbarer Materialien und Erfindungsgabe vor. Obwohl dieses Vorhaben unkonventionell ist, spiegelt es unsere Entschlossenheit wider, unsere Verteidigung zu stärken."
NZL_pursue_indigenous_designs:	"Der Schofield-Prototyp"
NZL_pursue_indigenous_designs_desc:	"Wir sollten den Schofield-Panzer weiterverfolgen, eine einheimische Entwicklung zum Schutz unseres Landes. Sein einzigartiges Rad- und Kettensystem bietet Flexibilität auf unterschiedlichem Terrain und ist damit ideal für unsere vielfältige Landschaft. Im Gegensatz zu ausländischen Konstruktionen verkörpert der Schofield-Panzer einen eigenständigen Ansatz, der auf unsere spezifischen Bedürfnisse und unser Umfeld zugeschnitten ist."
NZL_abandon_and_combat_enemy_armour:	"Kampf gegen feindliche Panzerung"
NZL_abandon_and_combat_enemy_armour_desc:	"Wir sollten unser Streben nach Panzerkriegsführung aufgeben und uns stattdessen auf die Entwicklung effektiver Strategien zur Bekämpfung feindlicher Panzer konzentrieren. Durch Investitionen in fortschrittliche Panzerabwehrwaffen, wie leistungsfähige Artillerie, Raketenwerfer und spezialisierte Infanterietaktiken, können wir die Bedrohung durch gepanzerte Einheiten effizienter neutralisieren."
NZL_bren_transport_carrier:	"Der Bren-Transportträger"
NZL_bren_transport_carrier_desc:	"Das Verteidigungsministerium hat die Entwicklung von vielseitigen Kettenfahrzeugen wie dem Bren Transport Carrier vorgeschlagen, um den Herausforderungen schwierigen Geländes zu begegnen. Diese Fahrzeuge werden eine effiziente Bewegung von Truppen, Munition und Nachschub gewährleisten."
NZL_foundations_of_an_aritllery_regiment:	"Die Grundlagen eines Artillerieregiments"
NZL_foundations_of_an_aritllery_regiment_desc:	"Ein Artillerieregiment ist in jedem Militär wichtig, wir sollten unser eigenes Regiment aufstellen."
NZL_the_charlton_rifle:	"Das Charlton-Gewehr"
NZL_the_charlton_rifle_desc:	"Philip Charlton, ein Konstrukteur, hat vorgeschlagen, überschüssige Lee-Enfield-Gewehre in halbautomatische Waffen umzuwandeln, um den Mangel an moderner Feuerkraft in unserem Land zu beheben. Sein innovatives Design bietet mehr Effizienz und Feuerkraft. Wir sollten seinen Vorschlag prüfen, um unsere militärischen Fähigkeiten mit begrenzten Mitteln zu stärken."
NZL_engineer_and_supply_corp:	"Die Ingenieur- und Nachschubtruppe"
NZL_engineer_and_supply_corp_desc:	"Lassen Sie uns unsere Armee noch weiter ausbauen, indem wir neue Zweige hinzufügen, die sich als nützlich erweisen könnten."
NZL_construct_the_whenuapai_base:	"Bauen Sie die Whenuapai-Basis"
NZL_construct_the_whenuapai_base_desc:	"Unsere Flugzeuge brauchen einen Ort für Training und Wartung, und der Bau neuer oder die Modernisierung bestehender Flugplätze wird diese Anforderungen erfüllen."
NZL_bomber_production:	"Entwickeln Sie Flugzeuge für das Commonwealth"
NZL_bomber_production_desc:	"Die Entfernung zu Europa macht unser Land zu einem idealen Ort für die Entwicklung von Flugzeugen im Falle eines Krieges."
NZL_goverment_funded_aircraft_production:	"Erhöhen Sie die Produktionskapazitäten für Flugzeuge"
NZL_goverment_funded_aircraft_production_desc:	""
NZL_commonwealth_training_idea:	"Empire Air Training Scheme"
NZL_commonwealth_training_idea_desc:	"Als wichtiger Beitrag zum Commonwealth Air Training Scheme haben wir unsere Ressourcen für die Ausbildung und Ausrüstung einer neuen Generation von qualifiziertem Flugpersonal eingesetzt."
NZL_close_air_support:	"Luftnahes Unterstützungsflugzeug"
NZL_close_air_support_desc:	"Um die Effektivität unserer Bodentruppen zu erhöhen und schnelle Reaktionsfähigkeit zu gewährleisten, müssen wir spezialisierte Luftnahunterstützungsflugzeuge entwickeln und einsetzen."
NZL_tactical_bombing:	"Strategische Zerstörungsflugzeuge"
NZL_tactical_bombing_desc:	"Um die Fähigkeit unserer Feinde zu untergraben, den Kampf fortzusetzen, müssen wir Flugzeuge entwickeln und einsetzen, die in der Lage sind, feindliche Gebiete zu erreichen und strategisch zu zerstören. Wenn wir die Entwicklung von Langstreckenflugzeugen vorantreiben, werden wir in der Lage sein, tief hinter den feindlichen Linien anzugreifen und kritische Infrastrukturen, Versorgungsketten und Kommandozentralen ins Visier zu nehmen."
NZL_allocate_resources_to_the_rnzf:	"Ressourcen für die RNZAF bereitstellen"
NZL_allocate_resources_to_the_rnzf_desc:	"Wir müssen mehr Flugzeuge einsetzen, um unsere Zahl zu erhöhen und unsere Position zu stärken, damit wir eine bessere Chance haben, zu überleben und uns zu verteidigen. Indem wir unsere Luftwaffe aufstocken, können wir sicherstellen, dass wir über die notwendigen Ressourcen verfügen, um alle anstehenden Herausforderungen zu meistern und unsere Erfolgschancen insgesamt zu verbessern."
NZL_aircraft_research_group:	"Produktion von Flugzeugen im Inland vorantreiben"
NZL_aircraft_research_group_desc:	"Wir müssen unsere Flugzeuge modernisieren und uns auf die inländische Produktion konzentrieren, denn wir wissen, dass es in einem zukünftigen Konflikt nicht möglich sein wird, sich ausschließlich auf den Kauf von Flugzeugen von unseren Verbündeten zu verlassen. Um unsere Souveränität und Sicherheit zu gewährleisten, ist es von entscheidender Bedeutung, dass wir unsere eigenen Fähigkeiten zur Entwicklung und Herstellung moderner Flugzeuge entwickeln."
NZL_into_the_jet_age:	"Aufbruch ins Jet-Zeitalter"
NZL_into_the_jet_age_desc:	"Mit dem Eintritt in das Jet-Zeitalter sollten wir uns verpflichten, fortschrittliche Jet-Technologie zu verfolgen, um unsere Verteidigungsfähigkeiten zu stärken und in der modernen Kriegsführung an der Spitze zu bleiben. Angesichts der rasanten Entwicklung in der Luftfahrt müssen wir sicherstellen, dass unsere Luftwaffe über die Geschwindigkeit, Wendigkeit und Präzision verfügt, um unsere Feinde zu bekämpfen."
NZL_pilot_recruitment_drive:	"Rekrutierungskampagne für Piloten"
NZL_pilot_recruitment_drive_desc:	"Um sicherzustellen, dass unsere Luftwaffe über genügend Personal verfügt, müssen wir das Wachstum einer neuen Generation von engagierten, qualifizierten Piloten und Hilfspersonal fördern, die sich für den Schutz des Himmels unserer Nation einsetzen."
NZL_strenghten_british_ties:	"Stärkung der [ENG.GetAdjective] Bindungen"
NZL_strenghten_british_ties_desc:	"In Anerkennung der historischen Bedeutung unserer Beziehungen haben unsere Landsleute ihre Unzufriedenheit mit den Grenzen der Autonomie innerhalb des Empire zum Ausdruck gebracht, und einige stellen in Frage, inwieweit wir eng mit Großbritannien verbunden bleiben sollten. Indem wir jedoch unsere Verpflichtung gegenüber der Krone bekräftigen, können wir einen Weg in die Zukunft sichern, der unsere nationalen Interessen mit den Vorteilen einer fortgesetzten Partnerschaft in Einklang bringt."
NZL_develop_anti_air_capabilities:	"Anti-Air-Entwicklung"
NZL_develop_anti_air_capabilities_desc:	""
NZL_empire_air_training_scheme:	"'Der Plan'"
NZL_empire_air_training_scheme_desc:	"Als Reaktion auf den wachsenden Bedarf an geschultem Flugpersonal für die Verteidigung des Himmels werden wir gemeinsam mit unseren Verbündeten im Commonwealth ein groß angelegtes Ausbildungsprogramm für die Luftfahrt einrichten. Indem wir zum Commonwealth Air Training Scheme beitragen, werden wir eine hochqualifizierte Generation von Piloten, Navigatoren und Luftunterstützungspersonal ausbilden."
NZL_womens_auxiliary_air_force:	"Die Frauen-Hilfsluftwaffe"
NZL_womens_auxiliary_air_force_desc:	"\N"
NZL_form_the_new_zealand_air_force:	"Eine sich entwickelnde Luftwaffe"
NZL_form_the_actual_new_zealander_airforce:	"Die RNZAF gründen"
NZL_form_the_actual_new_zealander_airforce_desc:	"Angesichts der wachsenden Bedeutung der Luftwaffe und des Bedarfs an einer eigenen Luftwaffe ist es an der Zeit, die Royal New Zealand Air Force als eigenständigen Militärdienst zu etablieren. Die RNZAF ist nicht mehr nur ein verlängerter Arm der Armee, sondern wird mit einer eigenen Kommandostruktur und eigenen Ressourcen operieren."
NZL_formed_the_new_zealand_air_force:	"Die königlich neuseeländische Luftwaffe"
NZL_aircraft_engine_upgrades:	"Neue Motorenprototypen"
NZL_aircraft_engine_upgrades_desc:	""
NZL_taranaki_oil_field:	"Die Taranaki Ölfelder ausbeuten"
NZL_taranaki_oil_field_desc:	"Angesichts der wachsenden Luftpräsenz in unserem Land und der rapide zur Neige gehenden Treibstoffreserven stehen wir vor dringenden Herausforderungen. Unsere nationalen Ressourcen sind zwar begrenzt, aber wir verfügen über kleinere Ölfelder, die, wenn sie ausgebeutet werden, wichtige Vorräte liefern könnten. Die Erschließung dieser Felder könnte eine wichtige Lösung sein, um die Ressourcen zu sichern, die wir in diesen dringenden Zeiten sowohl für unser Überleben als auch für unsere Verteidigung benötigen."
NZL_industrialization_fund:	"Richten Sie den Industrialisierungsfonds ein"
NZL_industrialization_fund_desc:	"Die wirtschaftliche Zukunft unseres Landes hängt von mutigen Maßnahmen zur Modernisierung der Industrie ab. Ein solcher Fonds wird die notwendigen Mittel zur Verfügung stellen, um die Modernisierung voranzutreiben, den Bau neuer Fabriken zu unterstützen, die veraltete Infrastruktur zu modernisieren und die privaten Investitionen zu steigern."
NZL_end_sustenance_work:	"Beenden Sie die Programme zur Sicherung des Lebensunterhalts"
NZL_end_sustenance_work_desc:	"Die Notstandsprogramme der Großen Depression waren eine wichtige Hilfe in schwierigen Zeiten, aber sie sind keine nachhaltige Lösung für unsere Arbeitskräfte mehr. Es ist an der Zeit, von temporären Überbrückungsmaßnahmen zu stabilen, langfristigen Beschäftigungsmöglichkeiten überzugehen."
NZL_modernize_railways:	"Revitalisieren Sie die Eisenbahn"
NZL_modernize_railways_desc:	"Das veraltete Schienennetz muss dringend modernisiert werden, um den Anforderungen einer wachsenden Nation gerecht zu werden. Durch den Ausbau der Gleise, die Erhöhung der Frachtkapazitäten und die Einführung moderner Lokomotiven können wir den Schienenverkehr zu einem schnelleren und zuverlässigeren System machen."
NZL_connect_the_nation:	"Finanzierung des National Roads Board"
NZL_connect_the_nation_desc:	"Unsere Straßen müssen dringend modernisiert werden, um der Nation besser zu dienen. Durch die Verbesserung der Infrastruktur können wir den Reiseverkehr sowohl für zivile als auch für militärische Zwecke effizienter gestalten."
NZL_modernize_hydroelectric_power:	"Wasserkraft modernisieren"
NZL_modernize_hydroelectric_power_desc:	"Das Kraftwerk Waitaki, ein Eckpfeiler des frühen neuseeländischen Wasserkraftnetzes, birgt ungenutztes Potenzial für eine Modernisierung. Durch die Modernisierung der Infrastruktur und die Ausweitung des Betriebs auf die südlichen Regionen können wir eine zuverlässige, erneuerbare Energieversorgung für ländliche Gemeinden und aufstrebende Industrien sicherstellen."
NZL_aquire_foreign_machinery:	"Moderne Maschinen anschaffen"
NZL_aquire_foreign_machinery_desc:	"Um mit den Anforderungen einer wachsenden Wirtschaft Schritt zu halten, müssen wir in moderne Maschinen für unsere städtischen Industrien investieren. Durch die Modernisierung veralteter Ausrüstung und die Einführung fortschrittlicher Fertigungstechniken können wir die Produktionseffizienz erheblich steigern und unsere industriellen Kapazitäten erweitern."
NZL_the_wairarapa_sheep_cattle_farm:	"Die Viehwirtschaft in Wairarapa ausbauen"
NZL_the_wairarapa_sheep_cattle_farm_desc:	"Die fruchtbaren Ebenen von Wairarapa sind seit langem ein Eckpfeiler des landwirtschaftlichen Erfolgs Neuseelands und werden von florierenden Schafzuchtbetrieben dominiert. Durch die Diversifizierung der Betriebe in Richtung Großviehhaltung können wir neue wirtschaftliche Möglichkeiten in der Rindfleisch- und Milchproduktion erschließen."
NZL_new_zealand_steel_works:	"Neuseeländische Stahlwerke"
NZL_new_zealand_steel_works_desc:	"Der Stahl unseres Landes kann für eine Vielzahl von Zwecken verwendet werden, so dass wir ihn ernten müssen. "
NZL_resource_imports:	"Neue Handelsdoktrinen einführen"
NZL_prioritize_rural_growth:	"Investitionen in ländliche Regionen bevorzugen"
NZL_prioritize_rural_growth_desc:	"Wir sollten das Wachstum des ländlichen Neuseelands fördern, indem wir uns auf die Wiederbelebung unseres Agrarsektors und die Stärkung der Gemeinden, die von ihm abhängen, konzentrieren. Indem wir die Infrastruktur verbessern, die Landwirte mit modernen Techniken unterstützen und in die lokale Industrie investieren, können wir sicherstellen, dass unsere ländlichen Gebiete florieren."
NZL_prioritize_city_growth:	"Städtische Gebiete stärken"
NZL_prioritize_city_growth_desc:	"Wir sollten dem Ausbau und der Entwicklung von Handelszentren in ganz Neuseeland Priorität einräumen. Wenn wir uns auf das Wachstum unserer Städte konzentrieren, können wir das Wirtschaftswachstum fördern, Investitionen anziehen und Arbeitsplätze schaffen. Die Stärkung der städtischen Gebiete wird Handel, Industrie und Innovation erleichtern."
NZL_industrialize_christchurch:	"Industrialisierung von Christchurch"
NZL_industrialize_christchurch_desc:	"Wir sollten uns darauf konzentrieren, Christchurch als ein weiteres wichtiges industrielles Zentrum Neuseelands zu entwickeln. Durch Investitionen in Schlüsselsektoren wie Fertigung, Infrastruktur und technologische Innovation können wir die Stadt in eine treibende Kraft für das nationale Wirtschaftswachstum verwandeln."
NZL_expand_auckland_industrial_park:	"Industriepark Auckland"
NZL_expand_auckland_industrial_park_desc:	"Wir sollten den Auckland Industrial Park zu einem wichtigen Zentrum für die kommerzielle Schifffahrt und den Handel machen. Durch die Entwicklung fortschrittlicher Slipanlagen für den Schiffbau und die Schiffswartung sowie den Ausbau der Hafenanlagen können wir Auckland zu einem führenden Zentrum für den internationalen Handel und die maritime Industrie machen."
NZL_open_pike_river_mine:	"Bergbau ausbauen"
NZL_open_pike_river_mine_desc:	"Wir müssen uns darauf konzentrieren, unsere Anstrengungen im Kohlebergbau in der Region zu verstärken, um die Industrialisierung voranzutreiben und das Wirtschaftswachstum zu unterstützen. Indem wir den Betrieb ausweiten, können wir die Produktion ankurbeln, Arbeitsplätze schaffen und die lokale Industrie stärken, während wir gleichzeitig nachhaltige Praktiken und Sicherheitsstandards gewährleisten."
NZL_resource_imports_desc:	"Wenn wir irgendeine Art von Produktion aufrechterhalten wollen, müssen wir überprüfen, in welche Bereiche unsere natürlichen Ressourcen investiert werden."
NZL_the_inudtrial_segment:	"Ländliche Gemeinden industrialisieren"
NZL_the_inudtrial_segment_desc:	"Neuseeland verfügt immer noch über erstklassige Grundstücke für den Bau neuer Städte und Industriezentren. Das sollten wir ausnutzen."
NZL_the_wairarapa_sheep_farms:	"Die Wairarapa-Schafsfarmen"
NZL_the_wairarapa_sheep_farms_desc:	"Wir können die Gewinne, die wir mit unseren reichhaltigen Farmen erwirtschaften, zur Unterstützung der Kriegsanstrengungen umleiten. Indem wir den durch die Landwirtschaft erzeugten Reichtum nutzen, haben wir die einmalige Gelegenheit, wichtige militärische Bedürfnisse, von der Versorgung bis zur Infrastruktur, zu finanzieren, ohne die Wirtschaft des Landes zu überlasten."
NZL_industrial_awakening:	"Umfassendes Urbanisierungsprogramm"
NZL_industrial_awakening_desc:	"Mehrere Hafenstädte haben einen Wachstumsschub erlebt, sowohl in wirtschaftlicher Hinsicht als auch in Bezug auf die Bevölkerung. Wenn wir dieses Wachstum fortsetzen könnten, wäre das für die Nation von Vorteil."
NZL_distribute_the_national_defense_budget:	"Verteilen Sie das Budget für die Landesverteidigung"
NZL_distribute_the_national_defense_budget_desc:	"Eine Aufstockung des Budgets für unsere Verteidigungskräfte ist angesichts des internationalen Klimas von heute notwendig."
NZL_the_tsunami_project:	"Das Tsunami-Projekt"
NZL_the_tsunami_project_desc:	"Die Zusammenarbeit mit den Amerikanern bei der Entwicklung einer revolutionären Waffe, wie der Tsunami-Bombe im Rahmen des Projekts Seal, könnte zu einer Priorität werden. Diese experimentelle Initiative zielte darauf ab, eine leistungsstarke Bombe zu entwickeln, die in der Lage ist, massive Flutwellen auszulösen und so ein innovatives Mittel zur Verteidigung unserer Insel gegen potenzielle Bedrohungen zu bieten."
NZL_hire_physicists:	"Direkte Finanzierung der Universität Auckland"
NZL_hire_physicists_desc:	"Um das wissenschaftliche Wissen zu erweitern und um bei militärischen Projekten zu helfen, sollten wir Physiker einstellen."
NZL_massey_university:	"Zuweisung von Mitteln an die Massey Universität"
NZL_massey_university_desc:	"N/A"
NZL_trust_in_the_opposition:	"Vertrauen in die Opposition"
NZL_trust_in_the_opposition_desc:	"McMillan wurde gewählt, um die Labor Party zu führen. Damit er Erfolg hat, braucht er das Vertrauen der Nation."
NZL_public_health_service:	"Öffentlicher Gesundheitsdienst"
NZL_public_health_service_desc:	"Die Einrichtung eines öffentlichen Gesundheitsdienstes ist ein wichtiger Schritt im Rahmen des Wohlfahrtsprogramms der Labor Party."
NZL_research_grants:	"Zuschüsse für die Forschung"
NZL_research_grants_desc:	"Labor ist der Ansicht, dass die Forschung ein entscheidender Aspekt für das Wachstum der Nation ist, und wird daher ihr Budget erhöhen."
NZL_review_the_prison_system:	"Überprüfung des Gefängnissystems"
NZL_review_the_prison_system_desc:	"Das Gefängnissystem in unserem Land hat fundamentale Mängel. Wir sollten versuchen, es zu verbessern."
NZL_reconcile_political_opponents:	"Politische Kontrahenten versöhnen"
NZL_reconcile_political_opponents_desc:	"John A. Lee war immer ein talentierter Anführer, wir könnten ihn versöhnen, wenn wir dadurch seine Fähigkeiten nutzen können."
NZL_denounce_conservative_politicians:	"Prangern Sie konservative Politiker an"
NZL_denounce_conservative_politicians_desc:	"Konservative Ideale bremsen den Fortschritt unserer Nation. Wir müssen alle unsere Ressourcen nutzen, um sie zum Schweigen zu bringen."
NZL_frasers_leadership:	"Frasers Führungsqualitäten"
NZL_frasers_leadership_desc:	"Peter Fraser hat sich als fähige Führungspersönlichkeit erwiesen, die es verdient hat, unsere Nation durch diese schwierigen Zeiten zu führen."
NZL_begin_lobbying_for_reforms:	"Beginnen Sie mit der Lobbyarbeit für Reformen"
NZL_begin_lobbying_for_reforms_desc:	"Beginnen Sie mit der Lobbyarbeit für Reformen bei der neu gewählten Labour-Regierung."
NZL_rally_the_opponents:	"Versammeln Sie die Gegner"
NZL_rally_the_opponents_desc:	"Wir müssen mit allen Gegnern zusammenarbeiten, auch mit denen außerhalb der Labour Party, um die Nation voranzubringen."
NZL_attempt_at_a_war_economy:	"Versuch einer Kriegswirtschaft"
NZL_attempt_at_a_war_economy_desc:	"Die neuseeländische Wirtschaft war nie auf einen größeren Konflikt ausgerichtet, aber jetzt ist es wichtiger denn je, dass wir es zumindest versuchen."
NZL_lower_labor_wages:	"Niedrigere Arbeitslöhne"
NZL_lower_labor_wages_desc:	"Um unsere Mobilisierung zu unterstützen, müssen wir einige Löhne kürzen, um unsere Wirtschaft noch mehr wachsen zu lassen."
NZL_silence_the_discontent:	"Bringen Sie die Unzufriedenheit zum Schweigen"
NZL_silence_the_discontent_desc:	"Es scheint, dass einige mit unseren härteren Mobilisierungsgesetzen unzufrieden sind. Wir müssen sie zensieren, bevor diese Ideale in die breite Öffentlichkeit gelangen."
NZL_fight_for_control_over_our_soldiers:	"Führen Sie die Wehrpflicht ein"
NZL_fight_for_control_over_our_soldiers_desc:	"Unser Land braucht mehr Männer, die im Falle eines Konflikts dienen. Auch wenn es unpopulär ist, ist es vielleicht an der Zeit, die Wehrpflicht wieder einzuführen."
NZL_the_labour_partys_reform:	"Das Savage-Kabinett"
NZL_the_labour_partys_reform_desc:	"Michael Savage und die Labor Party haben den Bewohnern Neuseelands einiges versprochen. Es ist nun an der Zeit, mit der Umsetzung dieser Reformen zu beginnen."
NZL_critize_uk_foreign_policy:	"Appeasement kritisieren"
NZL_critize_uk_foreign_policy_desc:	"Appeasement ist keine legitime Form der Diplomatie. Auch wenn wir mit dieser Aussicht alleine dastehen, ist es wichtig, dass wir dies dem Vereinigten Königreich mitteilen."
NZL_universal_medical_benefits:	"Universelle medizinische Leistungen"
NZL_universal_medical_benefits_desc:	"Die Bereitstellung einer medizinischen Grundversorgung für alle Bürger ist ein Schritt nach vorn zur Verabschiedung des Gesetzes."
NZL_nationalize_commerical_broadcasting:	"Verstaatlichung des kommerziellen Rundfunks"
NZL_nationalize_commerical_broadcasting_desc:	"Die Regierung muss die Kontrolle über die Radiosender haben, um ethische Werbung zu gewährleisten."
NZL_state_controlled_bank:	"Staatlich kontrollierte Zentralbanken einrichten"
NZL_state_controlled_bank_desc:	"Wir haben unsere Lehren aus der Depression gezogen. Eine davon ist, die Sicherheit der Banken zu gewährleisten."
NZL_the_social_security_acts:	"Das Sozialversicherungsgesetz"
NZL_the_social_security_acts_desc:	"Die Labor Party verspricht schon seit einiger Zeit, dieses Gesetz zu verabschieden. Damit wird sichergestellt, dass Neuseeland fortschrittliche Programme für alle zur Verfügung hat."
NZL_the_goodwill_mission:	"Goodwill-Mission"
NZL_the_goodwill_mission_desc:	"Wir sollten Gespräche mit der Mau-Bewegung in Samoa aufnehmen, um den Weg zur Unabhängigkeit, die Rückkehr von Olaf Nelson aus dem Exil und andere wichtige Fragen zu erörtern. Ziel dieser Gespräche ist es, einen friedlichen Übergang zu gewährleisten und die Beziehungen zwischen Samoa und Neuseeland zu stärken."
NZL_unenmployment_benefit:	"Arbeitslosenunterstützung"
NZL_unenmployment_benefit_desc:	"Ein Aspekt des Gesetzes zur sozialen Sicherheit ist ein Arbeitslosengeld, um die Armutsquote zu senken."
NZL_construct_state_housing:	"Staatliche Wohnungen errichten"
NZL_construct_state_housing_desc:	"Wohnraum für diejenigen, die zu verarmt sind, um ein eigenes Haus zu kaufen, ist für jede modernisierte Nation notwendig."
NZL_old_age_pension:	"Altersrente"
NZL_old_age_pension_desc:	"Es ist die Aufgabe der Regierung, für ihre älteren Bürger zu sorgen, die ihr Leben dieser Nation gewidmet haben."
NZL_dedicate_men:	"Männer für die Kriegsanstrengungen abstellen"
NZL_national_party_triumphant:	"Die Nationale Partei triumphiert"
NZL_national_party_triumphant_desc:	"Zu lange schon hat die Labor Party leere Programme versprochen. Die Nationale Partei kann ihre Ziele tatsächlich erreichen und die Fehler der Labor Party beheben."
NZL_appeal_rural_communities:	"Appell an ländliche Gemeinden"
NZL_appeal_rural_communities_desc:	"Die Hauptbasis unserer Partei liegt in den kleinen ländlichen Städten auf dem Lande in Neuseeland. Wir müssen an sie appellieren, um unsere Position zu halten."
NZL_condem_intervention:	"Verurteilen Sie die Einmischung der Regierung"
NZL_condem_intervention_desc:	"Die Regierung sollte sich aus privaten Unternehmen heraushalten und sich überhaupt nicht in die Wirtschaft einmischen."
NZL_absorb_conservative_remains:	"Konservative Parteien absorbieren"
NZL_absorb_conservative_remains_desc:	"Einige Mitglieder der Labor Party haben Sympathien für einige der Politiken unserer Partei. Vielleicht können wir ihre Fähigkeiten nutzen."
NZL_equality_conscription:	"Gleichheit durch Wehrpflicht"
NZL_equality_conscription_desc:	"Auch Einheimische müssen eingezogen werden, ihr Status schützt sie nicht vor der Pflicht gegenüber ihrem Land."
NZL_fight_militant_worker_union:	"Kämpfen Sie gegen militante Arbeitergewerkschaften"
NZL_fight_militant_worker_union_desc:	"Manche Gewerkschaften lassen sich nicht so leicht durch höhere Löhne unterkriegen. Wenn wir sie also verhaften müssen, dann soll es so sein."
NZL_tackle_inflation:	"Inflation abwehren"
NZL_tackle_inflation_desc:	"Wir müssen Maßnahmen gegen die Inflation ergreifen, bevor sie wirklich zu einem Problem wird."
NZL_war_council:	"Beratender Kriegsrat"
NZL_war_council_desc:	"Die Einrichtung eines Kriegsrats zwischen allen Parteien könnte die Leistungsfähigkeit unseres Militärs verbessern."
NZL_open_up_to_free_market:	"Öffnen Sie sich dem freien Markt"
NZL_open_up_to_free_market_desc:	"Die Öffnung für den freien Markt ist das Hauptziel unserer Partei. Nach unserem Wahlerfolg können wir dieses Ziel nun endlich erreichen."
NZL_combined_intelligence_centre:	"Kombiniertes Geheimdienstzentrum"
NZL_combined_intelligence_centre_desc:	"Wir müssen mit dem Vereinigten Königreich zusammenarbeiten, um verschlüsselte Nachrichten zu sichern und zu knacken. "
NZL_construct_shore_fortification:	"Küstenbefestigungen errichten"
NZL_construct_shore_fortification_desc:	"Wir müssen unsere Küsten gegen jegliche Aggressoren vorbereiten und unsere Sicherheit gewährleisten."
NZL_unite_communist_movements:	"Kommunistische Bewegungen vereinigen"
NZL_unite_communist_movements_desc:	"Die kommunistische Bewegung in Neuseeland ist nichts weiter als ein Haufen von Höhlenbewohnern, die Artikel drucken und protestieren. Wenn wir die Macht erlangen wollen, müssen wir uns zu einer Partei zusammenschließen."
NZL_lobby_soviet:	"Lobby in der Sowjetunion"
NZL_lobby_soviet_desc:	"Die Sowjetunion wird unser wichtigster Investor sein, wenn wir an die Macht kommen. Wir müssen uns ihre Unterstützung sichern."
NZL_the_peoples_voice:	"Die Stimme des Volkes"
NZL_the_peoples_voice_desc:	"Die Stimme des Volkes ist unser mächtigstes Instrument, um unsere Ideale unter den Massen zu verbreiten. Lassen Sie uns dafür sorgen, dass sie weiterhin gedruckt wird."
NZL_invite_radical_labour_exiles:	"Laden Sie radikale Exilanten der Arbeiterbewegung ein"
NZL_invite_radical_labour_exiles_desc:	"John A. Lee und Bill Barnard mögen Sympathien für unsere Sache haben, ihre Fähigkeiten und ihr Einfluss sollten nicht übersehen werden."
NZL_new_wave_of_feminism:	"Neue Welle des Feminismus"
NZL_new_wave_of_feminism_desc:	"In unserem neuen Staat müssen alle vor dem Gesetz gleich sein, einschließlich beider Geschlechter."
NZL_maori_equality:	"Māori-Gleichstellung"
NZL_maori_equality_desc:	"Das Volk der Māori ist schon viel zu lange unterdrückt worden. Sie verdienen die gleichen Rechte wie alle unsere anderen Bürger."
NZL_nationalize_bank:	"Verstaatlichung der Bank of New Zealand"
NZL_nationalize_bank_desc:	"Die Bank of New Zealand muss verstaatlicht werden, um ein anhaltendes Wirtschaftswachstum zu gewährleisten."
NZL_public_housing:	"Dem öffentlichen Wohnungsbau Vorrang geben"
NZL_public_housing_desc:	"Wenn wir Bürgern, die es sich nicht leisten können, die Grundbedürfnisse des Lebens zur Verfügung stellen, zeigt dies die Fortschrittlichkeit unserer Nation."
NZL_encourage_selfless_citizens:	"Selbstlose Bürger ermutigen"
NZL_encourage_selfless_citizens_desc:	"Selbstlosigkeit und Tugendhaftigkeit sind Eigenschaften, die alle Bewohner haben müssen, wenn wir in dieser Welt überleben wollen. Wir haben keinen Platz für Feigheit."
NZL_join_sov:	"Bündnis mit der Union"
NZL_join_sov_desc:	"Wir sind unterlegen und von feindlichen Nachbarn umgeben. Um unser Überleben zu sichern, müssen wir uns mit den Verfechtern des Kommunismus verbünden."
NZL_neutral:	"Innere Angelegenheiten stabilisieren"
NZL_neutral_desc:	"Die Festigung unserer eigenen Herrschaft über das Land ist wichtiger als sich in fremde Angelegenheiten einzumischen."
NZL_increased_defense_spending:	"Erhöhte Ausgaben für die Verteidigung"
NZL_increased_defense_spending_desc:	"Der Krieg erfordert moderne Ausrüstung und wir können uns nicht nur auf die Erkenntnisse unserer Verbündeten verlassen."
NZL_central_research_planning:	"Zentrale Forschungsplanung"
NZL_central_research_planning_desc:	"Die Planung der Wirtschaft bedeutet auch, die Wissenschaftler auf die Technologien auszurichten, die der Staat in der Zukunft braucht, als ob ein großer Geist die Zukunft sieht und die besten Optionen auswählt."
NZL_national_research_grants:	"Nationale Forschungsgelder"
NZL_national_research_grants_desc:	"Wir müssen uns auf unsere Innovationen verlassen, die ausländischen Innovationen notorisch überlegen sind. So haben die Bewohner dieser Inseln gefährliche Vögel eliminiert, anstatt gegen sie zu verlieren."
NZL_corporate_innovations:	"Unternehmensinnovationen"
NZL_corporate_innovations_desc:	"Der private Sektor weiß, wie man neue Technologien entwickelt, und der Wettbewerb wird das Beste aus unserem Land zum Vorschein bringen. NZL_paratrooper_units: Fallschirmjäger im Fokus"
NZL_paratrooper_units_desc:	"Wir sind vielleicht nicht in der Lage, über das Meer in den Feind einzudringen, aber die Luft ist immer eine weitere Möglichkeit."
NZL_naval_equipment:	"Marineausrüstung"
NZL_naval_equipment_desc:	"Ein moderner Schiffsrumpf ist nichts ohne moderne Ausrüstung."
NZL_memories_of_the_great_war:	"Erinnerungen an den Großen Krieg"
NZL_memories_of_the_great_war_desc:	"Mit Tausenden von Söhnen und Vätern Neuseelands, die auf fremden Feldern begraben sind, lastet der verheerende Tribut der vergangenen Konflikte schwer auf der Nation. Viele in der Öffentlichkeit und in der Regierung lehnen es entschieden ab, Streitkräfte als Schachfiguren in den ihrer Meinung nach sinnlosen europäischen Kriegen einzusetzen. Sie geben den nationalen Interessen und dem Schutz von Menschenleben Vorrang vor der Einmischung in ferne Streitigkeiten."
NZL_white_feather_movement:	"Die Weiße-Feder-Bewegung"
NZL_the_white_feather_movement_desc:	"Die Weiße Feder, ein Symbol für Feigheit in Großbritannien während des Großen Krieges, wurde oft von Frauen an Männer in Uniform verteilt, um sie öffentlich zu beschämen, damit sie sich melden. Angesichts des sich anbahnenden globalen Konflikts hat sich in unserer Nation eine ähnliche Praxis entwickelt. Dieser Geist wird verschwinden, wenn wir nicht in einen Konflikt verwickelt sind."
NZL_fighting_tyranny:	"Die Tyrannei bekämpfen, wo immer sie auch liegen mag"
NZL_reinvigorated_spirit:	"Wiedererstarkter Kampfgeist"
NZL_hot_climate_equipment_idea:	"Ausrüstung für heißes Klima"
NZL_charlton_conversion_idea:	"Charlton-Gewehr-Konvertierung"
NZL_charlton_conversion_idea_desc:	"Wir haben das bewährte Lee-Enfield-Gewehr in ein halbautomatisches Modell umgewandelt, um unsere Feuerkraft zu erhöhen. Der Umbau des Charlton-Gewehrs ermöglicht es uns, wirksame Infanteriewaffen effizienter herzustellen, Ressourcen zu sparen und gleichzeitig die Zuverlässigkeit im Einsatz zu gewährleisten. Diese Innovation beweist unseren Einfallsreichtum bei der Überwindung von Ausrüstungsengpässen und stellt sicher, dass unsere Soldaten besser für den bevorstehenden Kampf gerüstet sind."
