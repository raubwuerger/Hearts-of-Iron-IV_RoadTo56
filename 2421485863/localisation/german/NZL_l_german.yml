NZL_the_wairarapa_sheep_farms_lesser:	"Wairarapa Schafzuchtbetriebe"
NZL_the_wairarapa_sheep_farms_lesser_desc:	"Unter dem Druck des Krieges wurden unsere Schafherden von der Wollproduktion auf die Fleischproduktion umgestellt, um der Versorgung der Truppen Vorrang vor den traditionellen Textilexporten zu geben und sich an die dringenden Anforderungen des Krieges anzupassen."
NZL_sustenace_relief_work:	"Arbeitsprogramme für die Verpflegung"
new_zealand.1.t:	"Michael Savage wird krank, neuer Premierminister soll ernannt werden"
new_zealand.1.d:	"Angesichts der zunehmenden Spannungen und der Zersplitterung der Labor Party müssen wir einen Nachfolger für den immer kränklicheren Michael Joseph Savage wählen. Peter Fraser hat sich als mehr als fähige Führungspersönlichkeit erwiesen und wurde sowohl von Walter Nash als auch von Premierminister Savage hoch gelobt. Das hält Savages Opposition unter der Führung von Gervan McMillan jedoch nicht davon ab, ihre Agenda noch weiter voranzutreiben. McMillan, die umstrittenere Wahl, hat Sympathien für das ausgelieferte Labor-Mitglied John A. Lee geäußert, was ihn äußerst unpopulär macht."
new_zealand.1.a:	"Peter Fraser ist die beste Lösung für die Leiden der Laborpartei."
new_zealand.1.b:	"Die Mäßigung von Gervan McMillan wird die Laborpartei heilen."
new_zealand.1.c:	"Die Partei ist zu gespalten, um zu wählen, wir brauchen mehr Zeit, um uns zu entscheiden."
new_zealand.2.t:	"Michael Joseph Savage ist verstorben"
new_zealand.2.d:	"Premierminister Michael Savage ist heute verstorben. Er hat erklärt, dass Neuseeland an der Seite Großbritanniens stehen wird und seine Unterstützung für die Nation bekundet. Er war ein Held und eine große Führungspersönlichkeit, die sich nicht scheute, das zu kritisieren, was er für falsch hielt, und wir werden ihn vermissen. Jetzt muss sich die Labor Party auf sein Ableben einstellen und sich darauf vorbereiten, die Nation zu führen."
new_zealand.2.a:	"Ruhe in Frieden."
new_zealand.2.b:	"Lassen Sie die Partei ihre Vorkehrungen treffen, jetzt ist die Zeit für eine neue Zukunft."
new_zealand.3.t:	"Die Parlamentswahlen 1938"
new_zealand.3.d:	"Die beiden großen Parteien, die bei dieser Wahl gegeneinander antreten, haben beide immer größere Angebote gemacht, um die Öffentlichkeit zu überzeugen. Die Labor Party führt die Nation schon seit geraumer Zeit an und hat versprochen, den Social Security Act zu verabschieden, der Altersrenten und Arbeitslosenunterstützung vorsieht. Dies hat sich als hervorragendes Druckmittel gegenüber der National Party erwiesen, die die Politik der Labor Party offen kritisiert. Die Nationale Partei ist zwar neu, hat aber im Laufe der Jahre an Popularität gewonnen und sich die Schwächen der Labor-Regierung zunutze gemacht, um Unterstützung zu gewinnen. Obwohl die Wahl höchstwahrscheinlich zu Gunsten der Labor Party ausfällt, besteht die Möglichkeit, dass die National Party das Gegenteil beweisen kann."
new_zealand.3.a:	"Die Labor Party muss ihre Versprechen einhalten."
new_zealand.3.b:	"Die Labor-Partei hat ihre Zeit gehabt, die Nation muss die notwendigen Veränderungen vornehmen."
new_zealand.3.c:	"Neuseeland wird seine eigene Zukunft schmieden, die des Volkes."
new_zealand.3.e:	"Die Legion wird Neuseeland zu Ruhm und Ehre führen."
new_zealand.4.t:	"Überbleibsel der Legion erzwingen Rücktritt von Labor"
new_zealand.4.d:	"Nach dem Tod des Labor-Premierministers Michael Savage haben die Anhänger der Legion unter der Führung von John Ormond damit begonnen, die Rücktritte namhafter Labor-Funktionäre wie Peter Fraser und Walter Nash zu fordern. Die Labor-Regierung, die durch den Tod ihres Vorsitzenden geschwächt ist und keinen klaren Ersatz hat, scheint Ormonds Forderungen ohne großen Widerstand zu erfüllen. Nur die Zeit wird zeigen, ob die Legion eine wichtige Partei in Neuseelands Zukunft werden kann."
new_zealand.4.a:	"Die Legion ist die beste Hoffnung für die Zukunft Neuseelands."
new_zealand.5.t:	"Kommunistische Zeitungen verbreiten sich im ganzen Land"
new_zealand.5.d:	"In den großen Städten verbreiten sich zunehmend seltsame Zeitungen, die für ein neues System eintreten, das den Idealen der Legion Remnants und der Labor Party direkt entgegensteht. Niemand kann die Quelle dieser Zeitungen ausfindig machen, und es wird vermutet, dass sie aus möglichen Verstecken auf dem Land stammen. Einige von ihnen sind daraufhin in Aufruhr geraten. Im ganzen Land sind Unruhen ausgebrochen, die die Absetzung aller Regierungsbeamten sowie das Ende der Legion und ihres Anführers Ormond fordern. Die führerlose Labor Party scheint der Forderung nachzukommen, doch Ormond hat damit gedroht, die Unruhen mit seinen eigenen Anhängern zurückzuschlagen."
new_zealand.5.a:	"Treten Sie zurück, die Kommunisten sind in der Überzahl."
new_zealand.5.b:	"Gehen Sie sofort gegen diese Unruhen vor, sie werden unsere Lage nur noch verschlimmern."
new_zealand.6.t:	"Generalgouverneur ruft Loyalisten zusammen"
new_zealand.6.d:	"Da der Status Neuseelands als Dominion in Frage gestellt wird und die Monarchie in Großbritannien wieder an die Macht kommt, schlagen viele Parteien die Unabhängigkeit vor. Eine starke loyalistische Bewegung unter der Führung von Generalgouverneur George Monckton-Arundell versucht jedoch, die Kontrolle über das Land zu festigen. Diese Bewegung hat bereits zu offenen Kämpfen zwischen den radikalen Parteien in den Straßen von Wellington geführt, was einige dazu veranlasst, die Sicherheit der Nation in Frage zu stellen."
new_zealand.6.a:	"Lassen Sie den Gouverneur seine Forderungen stellen, Neuseeland steht an der Seite Großbritanniens."
new_zealand.6.b:	"Gehen Sie gegen alle loyalistischen Bewegungen vor, sie sind eine Gefahr für unsere Sicherheit."
new_zealand.9.t:	"Kommunisten verdrängen Labor und Legion"
new_zealand.9.d:	"Mit der zunehmenden Popularität der kommunistischen Partei haben die Menschen gegen die wiederbelebte Legion randaliert, insbesondere nach dem Zusammenbruch der Labor-Regierung. In Unterzahl trat Mr. Ormond zurück und überließ die Zukunft Neuseelands der Kommunistischen Partei."
new_zealand.10.t:	"Sidney Holland übernimmt die Kontrolle"
new_zealand.10.d:	"Adam Hamilton ist heute vom Vorsitz der Nationalen Partei und vom Amt des Premierministers zurückgetreten und hat den Posten Sidney Holland überlassen. Holland hat sich als würdiger Nachfolger erwiesen und erklärt, die Agenda der National Party fortzuführen."
new_zealand.10.a:	"Holland ist sehr vielversprechend."
