NZL_the_stance_on_maori:	"Der Umgang mit den Māori Unruhen"
NZL_the_stance_on_maori_desc:	"Die Situation der Māori in Neuseeland ist ungewiss, und ihre Zukunft steht am Scheideweg. Sollen ihre Traditionen und ihre Lebensweise bewahrt werden, um ihre Kultur zu respektieren und sicherzustellen, dass sie ein wichtiger Teil der Nation bleiben? Oder wird sich ihre Rolle in der Gesellschaft verändern?"
NZL_integrate_maori_into_new_zealand:	"Integration der Māori"
NZL_integrate_maori_into_new_zealand_desc:	"Unsere gemeinsame Geschichte mit dem Volk der Māori ist von Spannungen und Kämpfen geprägt, aber das ist für uns jetzt nicht von Bedeutung. Was vor uns liegt, ist die Notwendigkeit ihrer Integration in die neuseeländische Gesellschaft, ein Schritt, der ohne Rücksicht auf ihre Wünsche oder ihren Widerstand getan werden muss."
NZL_respect_maori_culture:	"Gleichberechtigung der Māori"
NZL_respect_maori_culture_desc:	"Das Volk der Māori wurde viel zu lange unterdrückt und ihm wurden die Rechte und die Anerkennung verweigert, die es wirklich verdient. Es ist an der Zeit, diese Ungerechtigkeiten zu korrigieren und sicherzustellen, dass sie die gleichen Rechte und Privilegien erhalten wie alle anderen Bürger. Auf diese Weise können wir eine gerechtere und geeinte Nation aufbauen, in der jeder Einzelne unabhängig von seiner Herkunft gleich viel wert ist."
NZL_maori_autonomy:	"Māori-Autonomie"
NZL_maori_autonomy_desc:	"Obwohl unsere Geschichte mit den Māori problematisch ist und ihre Unzufriedenheit mit unserer jüngsten Politik weiter wächst, ist es vielleicht an der Zeit, sich mit den Ureinwohnern Neuseelands zu versöhnen und darauf hinzuarbeiten, unsere angespannte Beziehung zu verbessern."
NZL_protect_maori_land:	"Nützliches Māori-Land konfiszieren"
NZL_protect_maori_land_desc:	"Die Māori kontrollieren mehrere Schlüsselregionen, die für die natürliche Ausdehnung unserer Nation unerlässlich sind. Es ist an der Zeit, dieses Land zurückzufordern und dafür eine faire Entschädigung anzubieten. Auch wenn dies zu Spannungen führen kann, ist es ein notwendiger Schritt, um die für unser Wachstum benötigten Ressourcen zu sichern."
NZL_minor_native_representation_in_gov:	"Geringe Vertretung der Ureinwohner"
NZL_minor_native_representation_in_gov_desc:	"Einer ausgewählten Gruppe von Ureinwohnern eine Stimme in der neuseeländischen Regierung zu geben, könnte helfen, einen Teil der wachsenden Unzufriedenheit zu beseitigen. Indem wir ihnen eine Vertretung gewähren, können wir die Spannungen abbauen und die Proteste beruhigen, ein Gefühl der Einbeziehung fördern und ihre Bedeutung für die Zukunft der Nation anerkennen."
NZL_the_maori_division:	"Die Māori-Abteilung"
NZL_the_maori_division_desc:	"Das stolze kriegerische Erbe des Māori-Volkes ist seit langem ein prägender Aspekt ihrer Kultur, und ihre Tapferkeit in vergangenen Konflikten ist ein Zeugnis ihrer Stärke. Durch die Einrichtung einer eigenen Māori-Division innerhalb unserer Streitkräfte können wir diesen Kampfgeist kanalisieren, um der Nation auf dem Schlachtfeld zu dienen."
NZL_maori_into_economy:	"Ankurbelung der Māori-Industrie"
NZL_maori_into_economy_desc:	"Da die Māori von unserer Politik unabhängig bleiben, ist es nur fair, dass wir sie mit den notwendigen Ressourcen und der Unterstützung für den Aufbau einer stabilen Wirtschaft versorgen. Indem wir sie mit den Instrumenten für wirtschaftliches Wachstum ausstatten, können wir ihren Wohlstand sichern und gleichzeitig eine friedliche und produktive Beziehung aufrechterhalten."
NZL_the_natives_of_new_zealand:	"Die Ureinwohner Neuseelands"
NZL_the_natives_of_new_zealand_desc:	"Wir haben den Māori die Autonomie gewährt, die sie seit langem gefordert haben. Mit dieser Geste werden wir von anderen polynesischen Nationen in diesen schwierigen Zeiten vielleicht als freundlicherer und vertrauenswürdigerer Partner wahrgenommen. Dies könnte den Weg für engere Beziehungen ebnen, möglicherweise sogar zur Bildung einer Föderation führen und unseren Einfluss und unsere Einheit im Pazifik stärken. "
NZL_inlist_the_maori:	"Ziehen Sie die Māori hinzu"
NZL_inlist_the_maori_desc:	"Da die Spannungen zunehmen und die Gefahr eines Krieges am Horizont auftaucht, ist es an der Zeit, die Māori zur Verteidigung unserer Nation an unsere Seite zu holen. Ihr kriegerischer Geist und ihre erwiesene Tapferkeit machen sie zu unschätzbaren Verbündeten. Indem wir sie anrufen, ehren wir nicht nur ihr Erbe, sondern stärken auch unsere Streitkräfte."
NZL_john_a_lee:	"John A. Lee"
NZL_john_a_lee_desc:	"John A. Lee, der den Spitznamen Bolshie Lee trägt, hat sich mit seinem feurigen Charisma in den Reihen der Arbeiterpartei hochgearbeitet. Doch Lees kühne Kritik an Savages vorsichtiger Herangehensweise an Wirtschaftsreformen hat zu Instabilität geführt, da sein aggressiver Vorstoß für eine radikalere Politik zu einer Spaltung unter den Kollegen führt. Während die einen in ihm einen Visionär sehen, der sich für die Arbeiterklasse einsetzt, betrachten ihn andere als eine destabilisierende Kraft, deren unerbittliche Opposition die Einheit und den Fokus der Regierung bedroht."
