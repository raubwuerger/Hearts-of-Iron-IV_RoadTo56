NZL_devaluated_currency_desc:	"Um unsere Mobilisierung zu unterstützen, müssen wir einige Löhne kürzen, und das geht am besten durch eine Abwertung des neuseeländischen Dollars."
NZL_defend_our_islands:	"Unsere Inseln verteidigen"
NZL_defend_our_islands_desc:	"Wir müssen auf einen Angriff auf unser Inselparadies von See aus vorbereitet sein. Marinebomber können Landungsboote abfangen und angreifen oder sogar große Schiffe ins Visier nehmen."
