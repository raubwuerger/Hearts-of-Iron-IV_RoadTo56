TON_salote_tupou_iii:0	"Sālote Tupou III."
TON_salote_tupou_iii_desc:0	"Sālote Mafile'o Pilolevu wurde 1900 als Tochter von König George Tupou II und seiner Frau Lavinia Veiongo geboren. Da sie wegen der Gefahren in ihrer Heimat in Neuseeland aufwuchs, erhielt sie eine westliche Erziehung, die ihre Weltanschauung stark beeinflusste, was sich in den kommenden Jahren als unschätzbar erweisen sollte. Später wurde sie von tonganischen Häuptlingen nach Tonga zurückbeordert, wo sie bis zum Tod ihres Vaters, der an Tuberkulose erkrankt war, die Erbin wurde. \n\n Im Jahr 1917, kurz vor seinem Tod, hatte Sālote's Vater in dem Bestreben, den Thron für seine Tochter zu sichern, eine Ehe zwischen Sālote und einem der damals mächtigsten Häuptlinge Tongas, Viliami Tungī Mailefihi, arrangiert, der später die vertraute rechte Hand der Königin werden sollte. Nach dem Tod ihres Vaters bestieg sie den Thron und wurde offiziell zur Königin des Königreichs Tonga, obwohl sie erst 18 Jahre alt war. \n\n Ihre charismatische und liebenswürdige Persönlichkeit machte sie sowohl im In- als auch im Ausland zu einer beliebten Figur. Als geschickte Diplomatin vertrat sie Tonga auf der Weltbühne, während sie ihr Land in schwierigen Zeiten modernisierte und führte. Trotz des Drucks ausländischer Mächte ist es ihr gelungen, die Unabhängigkeit ihres Landes zu bewahren, und sie ist schließlich zum Gesicht des Königreichs Tonga geworden."
TON_sioape_kaho:0	"Sioape Kaho"
TON_the_eternal_kingdom_desc:0	"Sioape Kaho [ROOT.GetNameDefCap] existiert seit Jahrhunderten als unabhängiges Gebilde und steht erst seit kurzem unter dem Schutz der Briten. Diese langjährige Souveränität hat den Tonganern ein tiefes Gefühl des Stolzes eingeflößt und eine starke kulturelle Identität und Loyalität zu ihren Traditionen und ihrer Monarchie geformt."
