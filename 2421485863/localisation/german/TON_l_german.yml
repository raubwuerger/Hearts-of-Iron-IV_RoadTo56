form_polynesia_category_desc:0	"Die Länder Ozeaniens sind seit über einem Jahrtausend bewohnt, noch vor der Invasion der Schrift des alten Sumeriens. Obwohl Ozeanien eine Region ist, die sich über Tausende von Kilometern des Ozeans erstreckt, sind sich die Menschen dort paradoxerweise sehr ähnlich, sowohl in kultureller als auch in politischer Hinsicht."
