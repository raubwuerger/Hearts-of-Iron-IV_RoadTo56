PLY_UNIFIED_polynesian_unifacation:0	"Polynesische Einigung vollzogen"
PLY_UNIFIED_polynesian_unifacation_desc:0	"Nach einem langen Kampf gegen die Kolonialmächte in Polynesien ist es uns gelungen, die Region ein für alle Mal zu vereinen!"
PLY_UNIFIED_connect_the_villages:0	"Verbinden Sie die Dörfer"
PLY_UNIFIED_connect_the_villages_desc:0	"Die meisten unserer Inseln sind unterentwickelt und verfügen über keine ausreichende Infrastruktur. Es sollte in unserem ureigensten Interesse sein, das zu ändern."
PLY_UNIFIED_first_steps_towards_modernisation:0	"Schritte in Richtung Industrialisierung"
PLY_UNIFIED_first_steps_towards_modernisation_desc:0	"Unser Land ist bei der Industrialisierung weit im Rückstand, so dass wir nicht mit unseren Nachbarn konkurrieren können. Aber wir können das ändern, indem wir ein Industrialisierungsprogramm zur Modernisierung unserer Industrien auflegen."
PLY_UNIFIED_connect_the_islands:0	"Unsere Inseln ausbauen"
PLY_UNIFIED_connect_the_islands_desc:0	"Um den Handelspartnern den Export und Import zu erleichtern, müssen wir Maßnahmen zum Bau von Häfen auf unseren Inseln ergreifen und dafür sorgen, dass der Handel sicher in unser Land ein- und ausreisen kann."
PLY_UNIFIED_develop_taiwan:0	"Entwickeln [524.GetName]"
PLY_UNIFIED_develop_taiwan_desc:0	""
PLY_UNIFIED_exploit_the_fijian_goldmines:0	"Ausbeutung der fidschianischen Goldminen"
PLY_UNIFIED_exploit_the_fijian_goldmines_desc:0	"Fidschi verfügt über große Goldvorkommen, die wir zu unserem Vorteil und zum Wachstum unserer Wirtschaft nutzen könnten."
PLY_UNIFIED_exploit_the_nauruan_phosphate_mines:0	"Ausbeutung der Phosphatminen auf Nauru"
PLY_UNIFIED_exploit_the_nauruan_phosphate_mines_desc:0	"Nauru verfügt über große Phosphatvorkommen auf seiner Insel, die nachweislich die höchste Phosphatqualität der Welt aufweisen. Es wäre verschwenderisch, dieses Phosphat nicht zu unserem eigenen Vorteil zu nutzen."
PLY_UNIFIED_seize_japanese_assets:0	"Japanische Vermögenswerte beschlagnahmen"
PLY_UNIFIED_seize_japanese_assets_desc:0	"Nach der Beschlagnahmung der mikronesischen Inseln haben die Japaner ihr Vermögen ungeschützt gelassen. Wir könnten diese Vermögenswerte beschlagnahmen und unsere Wirtschaft ausbauen."
PLY_UNIFIED_educational_reform:0	"Bildungsreform"
PLY_UNIFIED_educational_reform_desc:0	"Einem großen Teil unserer Bevölkerung mangelt es aufgrund der Vernachlässigung durch ihre früheren europäischen Oberherren an Bildung. Wir müssen ihnen das geben, was ihnen fehlte, und dafür sorgen, dass die jetzigen und künftigen Generationen unseres Landes gut ausgebildet sind."
