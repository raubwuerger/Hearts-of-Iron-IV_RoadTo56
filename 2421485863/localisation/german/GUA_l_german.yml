 GUA_integrate_state_map_area:0 "Wähle aus, welcher Staat in [ROOT.GetNameDef] integriert werden soll."

#Events ""
 r56_guatemala.1.t:0 "Der kleine Napoleon der Tropen ..."
 r56_guatemala.1.d:0 "Seit seinem Aufstieg zur Macht hat [GUA.GetLeader] gelegentlich dem Glauben gefrönt, er sei die Reinkarnation von Napoléon Bonaparte, dem ehemaligen Kaiser von Frankreich. Eine Zeit lang wurde diese "Fantasie" als bloße Arroganz abgetan, die meisten hielten sie für das Geschwätz eines Verrückten. Die jüngsten Ereignisse haben jedoch Besorgnis erregt. Ein weiterer Bonapartist hat in Paris die Kontrolle übernommen, und da [GUA.GetLeader] eine Reihe von militärischen Siegen in Mittelamerika errungen hat, sind seine Wahnvorstellungen immer offensichtlicher geworden. Was einst als Ego abgetan wurde, lastet nun schwer auf seinem Geist. In Momenten der Einsamkeit ist ein Flüstern zu hören, ein Echo von Napoléons eigenen Worten: "Ruhm ist vergänglich, aber Unbekanntheit ist für immer ...""
 r56_guatemala.1.a:0 "Ich bin Napoléon! Die Welt soll meinen Zorn fürchten!"
 r56_guatemala.1.b:0 "Señor Ubico, bringen wir Sie ins Bett..."
