r56_guatemala.1.t:0		"Der kleine Napoleon der Tropen..."
r56_guatemala.1.d:0		"Seit seinem Aufstieg an die Macht hat [GUA.GetLeader] gelegentlich dem Glauben gefrönt, er sei die Reinkarnation von Napoléon Bonaparte, dem ehemaligen Kaiser von Frankreich. Eine Zeit lang wurde diese 'Fantasie' als bloße Arroganz abgetan, die meisten hielten sie für das Geschwätz eines Verrückten. Die jüngsten Ereignisse haben jedoch Besorgnis erregt. Ein anderer Bonapartist hat die Macht in Paris übernommen, und mit [GUA.GetLeader], der eine Reihe von militärischen Siegen in Mittelamerika errungen hat, sind seine Wahnvorstellungen immer deutlicher geworden. Was einst als Ego abgetan wurde, lastet nun schwer auf seinem Gemüt. In Momenten der Einsamkeit kann man ein Flüstern hören, ein Echo von Napoléons eigenen Worten: 'Der Ruhm ist vergänglich, aber die Dunkelheit ist ewig...'"
r56_guatemala.1.a:0		"'Ich bin Napoléon! Die Welt soll meinen Zorn fürchten!'"
r56_guatemala.1.b:0		"'Señor Ubico, bringen wir Sie ins Bett...'"
