 GUA_the_central_american_detente:0 "Die Entspannung in Zentralamerika # In den 30er Jahren einigten sich die Staatsoberhäupter von Guatemala, El Salvador, Honduras und Nicaragua auf eine Entspannung, indem sie im Grunde die Feindseligkeiten einstellten und sich gegenseitig gegen den gemeinsamen Feind, die in all diesen Ländern aktiven Kommunisten, unterstützten"
 GUA_settle_the_belize_dispute:0 "Beilegung des Belize-Streits # 1936 schlug Guatemala Großbritannien vor, den Belize-Streit beizulegen, indem es den Briten anbot, ihnen die Hälfte zu überlassen und ihnen eine Menge Geld zu zahlen, denn 1884 oder so Guatemala hatte einen Vertrag mit Großbritannien, der dem Vereinigten Königreich den Bau einer Eisenbahnstrecke von Belize nach Guatemala-Stadt garantierte, aber das geschah nie, sodass die Guatemalteken eine Zahlung dafür verlangten (da die Briten nie taten, was sie versprochen hatten). #https://en.wikipedia.org/wiki/Belizean%E2%80%93Guatemalan_territorial_dispute#1930s%E2%80%931975"
