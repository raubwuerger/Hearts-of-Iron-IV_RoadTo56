Guatemala_Focus:0		"Nationaler Fokus Guatemala"
GUA_GATHERING_STORM_DESC:0		"Nach seinem Wahlsieg, bei dem er der einzige Kandidat war, wurde Jorge Ubico zum Herrscher Guatemalas. Er zeichnete sich durch die Militarisierung zahlreicher Institutionen aus, darunter auch der Post, und setzte Militärs in hohe Positionen ein, während er eine zunehmend pro-amerikanische Politik verfolgte und die United Fruit Company stärkte, die einen großen Teil des Landes, die einzige Eisenbahn und die Stromerzeugung kontrollierte. \n\nDoch seine Bewunderung für Napoleon könnte Ubico dazu veranlassen, seine pro-amerikanische und pro-Status-Quo-Politik zu überdenken und eine stärker nationalistische und pan-zentralamerikanische Politik zu entwickeln."
