GUA_banana_republic:0		"Bananenrepublik"
GUA_banana_republic_desc:0		"[GUA.GetNameDefCap] wird stark von der United Fruit Company dominiert, einem [USA.GetAdjective]-basierten Unternehmen unter der Führung von Samuel Zemurray. Das Unternehmen kontrolliert fast 80% des privaten Grundbesitzes im Land und ist damit der größte Grundbesitzer in Guatemala. Diese enorme wirtschaftliche Macht ermöglicht es dem Unternehmen, erheblichen Einfluss auf die Regierungspolitik auszuüben und die Verwaltung zu zwingen, seinen meist unersättlichen, eigennützigen Interessen zu dienen."
GUA_police_state:0		"Repressiver Polizeistaat"
GUA_police_state_desc:0		"Seit dem von der United Fruit Company unterstützten Putsch von 1921 herrscht in Guatemala anhaltende Instabilität. Dies begann sich jedoch fast ein Jahrzehnt später mit dem Aufstieg von Jorge Ubico zu ändern. Während seiner ersten fünfjährigen Amtszeit verwandelte Ubico das Land in einen politisch stabilen Staat, indem er die politische Unterdrückung geschickt einsetzte, die er während seiner Amtszeit bei der Policía de Investigación, der Geheimpolizei [GUA.GetAdjective], verfeinert hatte. Sein Regime setzte Taktiken wie Pressezensur, politische Einschüchterung, umfassende Überwachung und die Durchsetzung des Ley de Fugas ein, ein Gesetz, das die außergerichtliche Hinrichtung von Gefangenen erlaubte. Unter seiner Herrschaft ist niemand vor dem Zugriff des Staates sicher... Jeden Moment könnte er mitten in der Nacht an Ihre Tür klopfen."
GUA_indigenous_military:0		"Indigenes Militär in der Überzahl"
GUA_indigenous_military_desc:0		"Zwar wird von jedem arbeitsfähigen Guatemalteken erwartet, dass er mindestens ein Jahr im Militär dient, doch die Durchsetzung dieser Vorschrift hat sich als schwierig erwiesen. Viele entziehen sich dem Dienst durch Bestechungsgelder an rangniedere Militärangehörige. Diese Möglichkeit steht jedoch der indigenen Bevölkerung nicht zur Verfügung, die aufgrund ihres niedrigeren sozioökonomischen Status überproportional häufig zum Militärdienst eingezogen wird. Ihre kulturelle Ehrerbietung gegenüber Autoritäten führt zu einer unerschütterlichen Loyalität gegenüber den oberen Rängen des Militärs und trägt so zur Stabilität in Guatemala bei. Leider ist diese Loyalität oft ihr einziger Trumpf, denn viele indigene Wehrpflichtige sind schlecht ausgebildet, eine beträchtliche Anzahl kann weder lesen noch schreiben, und vor allem fehlt es ihnen an militärischem Grundwissen."
