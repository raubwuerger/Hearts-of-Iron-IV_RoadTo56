#Focuses ""
 GUA_GATHERING_STORM_DESC:0 "Nach seinem Sieg in einer Wahl, bei der er der einzige Kandidat war, wurde Jorge Ubico zum Herrscher Guatemalas. Er zeichnete sich durch die Militarisierung einer Vielzahl von Institutionen aus, darunter die Post, und besetzte hohe Positionen mit Militäroffizieren, während er eine zunehmend proamerikanische Politik verfolgte und die United Fruit Company, die einen Großteil des Landes, die einzige Eisenbahnlinie und die Stromerzeugung kontrollierte, stärkte."

