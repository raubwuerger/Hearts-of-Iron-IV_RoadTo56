 GUA_banana_republic:0 "Die Bananenrepublik"
 GUA_banana_republic_desc:0 "[GUA.GetNameDefCap] wird stark von der United Fruit Company dominiert, einem in den USA ansässigen Unternehmen, das von Samuel Zemurray geleitet wird. Mit einem Anteil von fast 80 % am privaten Landbesitz des Landes ist es der größte Landbesitzer in Guatemala. Diese enorme wirtschaftliche Macht ermöglicht es dem Unternehmen, erheblichen Einfluss auf die Regierungspolitik auszuüben und die Verwaltung zu zwingen, seinen in der Regel unersättlichen, eigennützigen Interessen zu dienen."

 GUA_police_state:0 "Repressiver Polizeistaat"
 GUA_police_state_desc:0 "Seit dem von der United Fruit Company unterstützten Staatsstreich von 1921 leidet Guatemala unter anhaltender Instabilität. Dies begann sich jedoch fast ein Jahrzehnt später mit dem Aufstieg von Jorge Ubico zu ändern. Während seiner ersten fünfjährigen Amtszeit verwandelte Ubico das Land durch seinen geschickten Einsatz politischer Repressionen, die er während seiner Amtszeit bei der Policía de Investigación, der [GUA.GetAdjektiv] Geheimpolizei, verfeinert hatte, in einen politisch stabilen Staat. Sein Regime setzte Taktiken wie Pressezensur, politische Einschüchterung, umfassende Überwachung und die Durchsetzung des "Ley de Fugas" ein, eines Gesetzes, das die außergerichtliche Hinrichtung von Gefangenen effektiv zuließ. Unter seiner Herrschaft ist niemand vor dem Zugriff des Staates sicher ... jederzeit könnten sie mitten in der Nacht an deine Tür klopfen.""

 GUA_indigenous_military:0 "Militärische Dominanz der Ureinwohner"
 GUA_indigenous_military_desc:0 "Zwar wird von jedem wehrfähigen Mann in Guatemala erwartet, mindestens ein Jahr Militärdienst abzuleisten, doch hat sich die Durchsetzung dieser Anforderung als schwierig erwiesen. Viele entziehen sich dem Dienst durch Bestechung von Militärangehörigen mit niedrigerem Rang. Diese Möglichkeit steht der indigenen Bevölkerung jedoch nicht zur Verfügung, die aufgrund ihres niedrigeren sozioökonomischen Status überproportional häufig zum Militärdienst eingezogen wird. Ihre kulturelle Ehrerbietung gegenüber Autoritätspersonen führt zu einer unerschütterlichen Loyalität gegenüber den oberen Rängen des Militärs, was zur Stabilität in Guatemala beiträgt. Leider ist diese Loyalität oft ihr einziger Vorteil, da viele indigene Wehrpflichtige schlecht ausgebildet sind, eine beträchtliche Anzahl nicht lesen oder schreiben kann und es ihnen vor allem an militärischem Grundwissen mangelt."
