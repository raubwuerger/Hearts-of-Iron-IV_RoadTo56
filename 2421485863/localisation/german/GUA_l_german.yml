GUA_french_decisions:0		"Die Rückkehr der Verbannten"
GUA_french_decisions_desc:0		"Die Zeit ist gekommen, den französischen Thron von diesen unwürdigen Prätendenten zurückzufordern. [GUA.GetLeader]s militärisches Genie und seine politische Vision werden Frankreich zu seinem früheren Ruhm und darüber hinaus verhelfen. Die Welt wird Zeuge der Wiedergeburt eines Imperiums, und die Fehler von Waterloo werden für immer aus der Geschichte getilgt sein!"
