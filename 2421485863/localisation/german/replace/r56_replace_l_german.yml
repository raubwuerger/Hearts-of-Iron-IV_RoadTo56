CHI_GATHERING_STORM_DESC:0					"China, einst die mächtigste Nation der Welt, wurde durch fast ein Jahrhundert westlichen Imperialismus und interne Streitigkeiten zu Fall gebracht.\n\nChiang Kai-shek und die Kuomintang, die Zentralregierung Chinas, sehen sich nun sowohl vom japanischen Kaiserreich, das bereits einen großen Teil Chinas annektiert hat, als auch von Maos Kommunisten bedroht, die sich derzeit in den Hügeln von Shaanxi verschanzt haben. Von allen Seiten umzingelt, bereitet Chiang China nun auf einen Krieg vor, wie ihn das Land noch nie gesehen hat."
PRC_GATHERING_STORM_DESC:0					"Die Kommunistische Partei Chinas steht am Rande der Vernichtung. Nach einer gescheiterten Revolution sind die kommunistischen Armeen an allen Fronten von der KMT zerschlagen worden, die Kommunisten sind von ihren Stützpunkten in Südchina zu ihrer neuen Basis in Shaanxi geflohen. Aus dieser Katastrophe ging ein neuer Führer für die Partei hervor: Mao Zedong. \n\nMao brachte eine radikal neue Vision des Kommunismus und eine neue Strategie für das Überleben und die Expansion mit. Vielleicht könnten sich die Kommunisten mit ihren ehemaligen Feinden gegen einen größeren Feind verbünden..."
GER_mefo_bills_modifier:0					"MEFO-Scheine"
GER_mefo_bills_modifier_desc:0					"MEFO-Wechsel waren Schuldscheine, die von Hjalmar Schacht geschaffen wurden, um der Regierung die Finanzierung der Aufrüstung zu ermöglichen, wobei sie über die Bilanzgesellschaft Metallurgische Forschungsgesellschaft handelte, um diese Aufrüstung vor französischen und britischen Augen zu verbergen. Diese Rechnungen müssen um sechs Monate verlängert werden, oder ihre Empfänger müssen bei Fälligkeit bezahlt werden. \n\n§Yer Eintritt in den Krieg wird die Abhängigkeit von den MEFO-Rechnungen beseitigen und ihre Begleichung bis zum Ende des Krieges hinauszögern.§!"
GER_wolfpack_tactics:0					"Wolfsrudel-Taktik"
GER_wolfpack_tactics_desc:0					"Durch die Aufteilung unserer U-Boot-Flotte in 'Rudel' haben sie sich als noch tödlicher erwiesen, als wir uns vorzustellen wagten."
HOL_propose_benelux_unification_tt:0					"§Alle müssen dem Abkommen zustimmen, damit die Boni in Kraft treten können."
SWE_folkhemmet_desc:0					"Folkhemmet, auch bekannt als das 'Gute Heim', ist die Idee einer Gesellschaft, in der es keine Privilegierten oder Unglücklichen gibt, keine Bevorzugten oder Unerwünschten, keine Ausbeutung von Bedürftigen, sondern eine Gesellschaft, in der Gleichheit, Freundlichkeit und Zusammenarbeit herrschen."
MAN_low_legitimacy:0					"Geringe Legitimität"
MAN_low_legitimacy_5_desc:0					"Die [MAN.GetName] leidet unter einer geringen internationalen Legitimität, da die [JAP.GetName] die einzige Nation ist, die ihre Unabhängigkeit anerkennt. Die mandschurische Regierung muss entweder versuchen, die Situation zu lösen, wenn sie versucht, ihre Autorität über China auszuüben."
