HOL_heavy_cruiser_1_desc:0	"Der niederländische Kreuzer Soerabaja, ursprünglich De Zeven Provinciën genannt, war ein Küstenverteidigungsschiff ("Panterschip"), das vor dem Ersten Weltkrieg in den Niederlanden gebaut und in Dienst gestellt wurde. Er hatte eine Verdrängung von über 6.500 Tonnen und war mit zwei 280-mm- und vier 150-mm-Kanonen als Hauptbewaffnung ausgerüstet. Er war während des Zweiten Weltkriegs im Einsatz, bis er 1942 von japanischen Bombern versenkt wurde."
sp_air_supersonic_jet_desc:	"Fortschritte in der Strahltriebwerkstechnologie erfordern Flugzeugzellen, die den neu erreichbaren Geschwindigkeiten standhalten können."
