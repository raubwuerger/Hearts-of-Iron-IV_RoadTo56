news.296.a:0		"Die Demokratie siegt! "
news.301.t:0		"Transsilvanien kehrt zu [155.Owner.GetName] zurück "
news.301.desc:0		"\nRumänien hat angekündigt, dass es die [155.Owner.GetName] Forderungen nach einer Rückgabe Siebenbürgens akzeptieren wird. Damit ist das Gebiet nun wieder mit dem Land vereint, was dessen Größe und Stärke erheblich steigert. Es ist unwahrscheinlich, dass ein Erfolg dieser Größenordnung die [155.owner.GetAdjective] davon abhalten wird, weitere Forderungen für ihre restlichen verlorenen Gebiete zu stellen. "
news.302.t:0		"Rumänien lehnt [155.Owner.GetNameDef]-Forderungen ab "
news.302.desc:0		"Die Frist des Ultimatums ist ohne rumänische Antwort verstrichen. Empörte [155.Owner.GetName]-Beamte haben die rumänische Regierung bereits angeprangert und behauptet, sie würde die Region mit ihrem Beharren auf der Einhaltung „ungesetzlicher Verträge“ destabilisieren. Beide Nationen scheinen sich auf einen Krieg vorzubereiten, der jeden Tag ausbrechen kann. "
news.310.t:0		"[From.GetNameDefCap] gibt vor Ungarn nach "
news.320.e:0		"Steht der Krieg bevor? "
stability.38.desc:0		"In der Morgendämmerung führten sie ihn zur Mauer. Er verweigerte eine letzte Zigarette, akzeptierte aber die Augenbinde. Seine letzten Worte waren eine Entschuldigung an seine Mutter, weil er ihr so viel Schmerz zugefügt hatte. Das Erschießungskommando zielte gut. Wenige Minuten später erklärte ihn der anwesende Arzt für tot.\n\n Auch wenn die Behörden nicht alle Wehrdienstverweigerer erwischen konnten, gelang es ihnen doch, eine Reihe von Verhaftungen vorzunehmen. In Anbetracht der ernsten Lage, in der wir uns befinden, hat das Kriegsministerium beschlossen, dass diese Männer nach dem Militärrecht verurteilt werden, weil sie sich nicht zum Dienst gemeldet haben. Die erste Serie von Todesurteilen wurde verhängt und die Verurteilten wurden durch ein Erschießungskommando hingerichtet. Diese Maßnahmen haben offensichtlich die gewünschte Wirkung gezeigt. Es scheint, dass die meisten Menschen die Möglichkeit des Todes auf dem Schlachtfeld der Gewissheit eines unehrenhaften Todes als Feigling vorgezogen haben." "
strikes_event.7.desc:0		"Die Truppen versammelten sich in der Nacht außerhalb der Städte und hielten Lärm und leichte Disziplin ein, um das Überraschungsmoment zu wahren. Als die Sonne über den Horizont kroch und die Arbeiter, die die Barrikaden in den Fabriken besetzten, auf Ablösung durch die Tagesschicht warteten, rückten die Angriffskolonnen an. Die müden Arbeiter waren zu träge, um den Widerstand zu organisieren und wurden schnell überwältigt. Die Truppen, die eine kleine Abteilung zur Bewachung der Gefangenen zurückließen, durchkämmten die Stadt und verhafteten alle auf der Liste der bekannten Fabrikarbeiter. Bis zum Mittag hatte das Militär die volle Kontrolle über die Städte übernommen und eine Ausgangssperre verhängt. Es wird kein weiterer Widerstand erwartet. Die Mehrheit der Arbeiter wird demnächst unter der Bedingung freigelassen, dass sie an ihren Arbeitsplatz zurückkehren, die Anführer des Rings werden festgenommen und vor Gericht gestellt. Es wird erwartet, dass Todesurteile verhängt werden. "
strikes_event.8.desc:0		"Die Truppen versammelten sich in der Nacht außerhalb der Städte, aber schlechtes Licht und Lärmdisziplin verrieten die Überraschung. Als die Truppen anrückten, trafen sie auf die Arbeiter, die auf sie vorbereitet waren. Der erste Angriff scheiterte an einem Hagel von Steinen. Ein zweiter Angriff mit aufgepflanzten Bajonetten wurde in brutalen Nahkämpfen zurückgeschlagen, wobei Dutzende von Toten und Sterbenden auf den Straßen zurückblieben.\n\n Die verantwortlichen Offiziere haben sich zurückgezogen, um ihre Kräfte zu konsolidieren, während die Arbeiter ihre Befestigungen ausbauen und sich mit den beim Rückzug zurückgelassenen Waffen bewaffnen. Für morgen wird ein zweiter Kampftag erwartet, aber das Militärische Oberkommando hält einen Sieg nicht mehr für wahrscheinlich. "
mutiny_event.2.desc:0		"Der Versuch, die Meuterer zur Unterwerfung zu bewegen, ging spektakulär nach hinten los, da die Truppen kaum Angst vor den Einheiten zeigten, die zu ihrer Unterdrückung entsandt wurden. Mit ihren an der Front erworbenen Fähigkeiten haben sie schnell eine Verteidigung ihrer Stellungen organisiert, die jeden Versuch, sie zu besiegen, sehr kostspielig machen würde. \n\n Die Offiziere, die für die loyalistischen Einheiten verantwortlich sind, haben sich zurückgezogen und warten auf weitere Befehle, aber dieser kleine Erfolg hat zweifellos die Entschlossenheit der Meuterer gestärkt. "
mutiny_event.5.desc:0		"Das Kriegsministerium tut zwar sein Bestes, um zu verhindern, dass die derzeitige Meuterei in der Armee bekannt wird, aber die Zensur von Briefen kann nur begrenzt helfen. Die beurlaubten Soldaten verbreiten schnell die Nachricht, dass die Armee nicht länger bereit ist, in diesem Krieg unnötig zu bluten.\n\nDie Versuche der Regierung, die Flut einzudämmen, sind völlig gescheitert. Berichte der Geheimpolizei deuten darauf hin, dass die Meuterer einen starken Rückhalt in der Bevölkerung haben, was es unwahrscheinlich macht, dass wir sie isolieren und unterdrücken können. "
news.334.a:0		"Hat [JAP.GetNameDef] keine Grenzen? "
generic.19.t:0		"[From.GetNameDefCap] schickt industrielle Unterstützung "
usa.401.desc:0		"Der britische Premierminister [From.GetLeader] hat signalisiert, dass er die Bedingungen des Destroyers for Bases Agreement akzeptiert. Eine Gruppe von [From.GetAdjective] Marineoffizieren ist eingetroffen, um die Zerstörer zu inspizieren und die Überführung zu überwachen.\n\n Es gibt offensichtlich noch einiges zu tun, denn einige [From.GetAdjective] Offiziere scheinen ein wenig besorgt über die schiere Menge und Dicke von Guano und Rost auf den zu überführenden Schiffen. "
