war_justification.214.d:0				"[ROOT.GetNameDefCap] mögen sich für moderner und fortschrittlicher halten als wir, aber die Wahrheit ist, dass ihre Nation nicht so getestet wurde wie die unsere, noch sind sie auf die Bedrohungen vorbereitet, die jetzt am Horizont zu sehen sind. Durch ihre Verachtung uns gegenüber und dadurch, dass sie uns daran hindern, uns das zu nehmen, was uns rechtmäßig gehört, haben sie uns zu einer dieser Bedrohungen für sich selbst gemacht. Ihre schwache und gespaltene Nation wird unseren Ansprüchen kaum widerstehen.'\n\nDie spöttische Meinung über [ROOT.GetName], die lange Zeit von den [From.GetRulingParty] vertreten wurde, hat sich von Kritik zu Feindseligkeit entwickelt. Obwohl die allgemeine Meinung ist, dass das [ROOT.GetAdjective] Volk einen Krieg vermeiden will, behauptet [From.GetLeader], dass unsere gewählten Führer ihn durch ihre Arroganz provoziert haben. "
