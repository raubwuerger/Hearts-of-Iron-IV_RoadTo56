generic.5.t:0			"[From.GetNameDefCap] lädt [Root.GetNameDef] zu [r56_generic5_faction] ein "
news.296.a:0			"Die Demokratie siegt! "
news.301.t:0			"Transsilvanien kehrt zu [155.Owner.GetName] zurück "
news.301.desc:0			"\nRumänien hat angekündigt, dass es die [155.Owner.GetName] Forderungen nach einer Rückgabe Siebenbürgens akzeptieren wird. Damit ist das Gebiet nun wieder mit dem Land vereint, was dessen Größe und Stärke erheblich steigert. Es ist unwahrscheinlich, dass ein Erfolg dieser Größenordnung die [155.owner.GetAdjective] davon abhalten wird, weitere Forderungen für ihre restlichen verlorenen Gebiete zu stellen. "
news.302.t:0			"Rumänien lehnt [155.Owner.GetNameDef]-Forderungen ab "
news.302.desc:0			"Die Frist des Ultimatums ist ohne rumänische Antwort verstrichen. Empörte [155.Owner.GetName]-Beamte haben die rumänische Regierung bereits angeprangert und behauptet, sie würde die Region mit ihrem Beharren auf der Einhaltung „ungesetzlicher Verträge“ destabilisieren. Beide Nationen scheinen sich auf einen Krieg vorzubereiten, der jeden Tag ausbrechen kann. "
news.310.t:0			"[From.GetNameDefCap] gibt vor Ungarn nach "
news.320.e:0			"Steht der Krieg bevor? "
stability.38.desc:0			"In der Morgendämmerung führten sie ihn zur Mauer. Er verweigerte eine letzte Zigarette, akzeptierte aber die Augenbinde. Seine letzten Worte waren eine Entschuldigung an seine Mutter, weil er ihr so viel Schmerz zugefügt hatte. Das Erschießungskommando zielte gut. Wenige Minuten später erklärte ihn der anwesende Arzt für tot.\n\n Auch wenn die Behörden nicht alle Wehrdienstverweigerer erwischen konnten, gelang es ihnen doch, eine Reihe von Verhaftungen vorzunehmen. In Anbetracht der ernsten Lage, in der wir uns befinden, hat das Kriegsministerium beschlossen, dass diese Männer nach dem Militärrecht verurteilt werden, weil sie sich nicht zum Dienst gemeldet haben. Die erste Serie von Todesurteilen wurde verhängt und die Verurteilten wurden durch ein Erschießungskommando hingerichtet. Diese Maßnahmen haben offensichtlich die gewünschte Wirkung gezeigt. Es scheint, dass die meisten Menschen die Möglichkeit des Todes auf dem Schlachtfeld der Gewissheit eines unehrenhaften Todes als Feigling vorgezogen haben." "
strikes_event.7.desc:0			"Die Truppen versammelten sich in der Nacht außerhalb der Städte und hielten Lärm und leichte Disziplin ein, um das Überraschungsmoment zu wahren. Als die Sonne über den Horizont kroch und die Arbeiter, die die Barrikaden in den Fabriken besetzten, auf Ablösung durch die Tagesschicht warteten, rückten die Angriffskolonnen an. Die müden Arbeiter waren zu träge, um den Widerstand zu organisieren und wurden schnell überwältigt. Die Truppen, die eine kleine Abteilung zur Bewachung der Gefangenen zurückließen, durchkämmten die Stadt und verhafteten alle auf der Liste der bekannten Fabrikarbeiter. Bis zum Mittag hatte das Militär die volle Kontrolle über die Städte übernommen und eine Ausgangssperre verhängt. Es wird kein weiterer Widerstand erwartet. Die Mehrheit der Arbeiter wird demnächst unter der Bedingung freigelassen, dass sie an ihren Arbeitsplatz zurückkehren, die Anführer des Rings werden festgenommen und vor Gericht gestellt. Es wird erwartet, dass Todesurteile verhängt werden. "
strikes_event.8.desc:0			"Die Truppen versammelten sich in der Nacht außerhalb der Städte, aber schlechtes Licht und Lärmdisziplin verrieten die Überraschung. Als die Truppen anrückten, trafen sie auf die Arbeiter, die auf sie vorbereitet waren. Der erste Angriff scheiterte an einem Hagel von Steinen. Ein zweiter Angriff mit aufgepflanzten Bajonetten wurde in brutalen Nahkämpfen zurückgeschlagen, wobei Dutzende von Toten und Sterbenden auf den Straßen zurückblieben.\n\n Die verantwortlichen Offiziere haben sich zurückgezogen, um ihre Kräfte zu konsolidieren, während die Arbeiter ihre Befestigungen ausbauen und sich mit den beim Rückzug zurückgelassenen Waffen bewaffnen. Für morgen wird ein zweiter Kampftag erwartet, aber das Militärische Oberkommando hält einen Sieg nicht mehr für wahrscheinlich. "
mutiny_event.2.desc:0			"Der Versuch, die Meuterer zur Unterwerfung zu bewegen, ging spektakulär nach hinten los, da die Truppen kaum Angst vor den Einheiten zeigten, die zu ihrer Unterdrückung entsandt wurden. Mit ihren an der Front erworbenen Fähigkeiten haben sie schnell eine Verteidigung ihrer Stellungen organisiert, die jeden Versuch, sie zu besiegen, sehr kostspielig machen würde. \n\n Die Offiziere, die für die loyalistischen Einheiten verantwortlich sind, haben sich zurückgezogen und warten auf weitere Befehle, aber dieser kleine Erfolg hat zweifellos die Entschlossenheit der Meuterer gestärkt. "
mutiny_event.5.desc:0			"Das Kriegsministerium tut zwar sein Bestes, um zu verhindern, dass die derzeitige Meuterei in der Armee bekannt wird, aber die Zensur von Briefen kann nur begrenzt helfen. Die beurlaubten Soldaten verbreiten schnell die Nachricht, dass die Armee nicht länger bereit ist, in diesem Krieg unnötig zu bluten.\n\nDie Versuche der Regierung, die Flut einzudämmen, sind völlig gescheitert. Berichte der Geheimpolizei deuten darauf hin, dass die Meuterer einen starken Rückhalt in der Bevölkerung haben, was es unwahrscheinlich macht, dass wir sie isolieren und unterdrücken können. "
news.334.a:0			"Hat [JAP.GetNameDef] keine Grenzen? "
generic.19.t:0			"[From.GetNameDefCap] schickt industrielle Unterstützung "
usa.401.desc:0			"Der britische Premierminister [From.GetLeader] hat signalisiert, dass er die Bedingungen des Destroyers for Bases Agreement akzeptiert. Eine Gruppe von [From.GetAdjective] Marineoffizieren ist eingetroffen, um die Zerstörer zu inspizieren und die Überführung zu überwachen.\n\n Es gibt offensichtlich noch einiges zu tun, denn einige [From.GetAdjective] Offiziere scheinen ein wenig besorgt über die schiere Menge und Dicke von Guano und Rost auf den zu überführenden Schiffen. "
bftb_turkey.134.j:0			"İsmet İnönü wird dort weitermachen, wo Atatürk aufgehört hat!"
bftb_turkey.24.k:0			"İsmet İnönü wird dort weitermachen, wo Atatürk aufgehört hat!"
turkey.1.b:0			"Durch Stärke wird Mareşal Çakmak die Republik vorwärts führen!"
bftb_turkey.24.l:0			"Mareşal Çakmak wird die Republik durch seine Stärke voranbringen!"
bftb_turkey.134.k:0			"Durch Stärke wird Mareşal Çakmak die Republik voranbringen!"
germany.4.d:0		"Die wiederholten Aufstände in [AUS.getNameDef] zeigen deutlich, dass sich die Menschen dort nach einer Vereinigung mit unserer Nation sehnen. Es ist nun an der Zeit, zu handeln und den Willen des Volkes zum Ausdruck zu bringen. \Denn was durch den Vertrag von Saint Germain und den Vertrag von Versailles verboten wurde, soll nun der Welt als der endgültige und unbestreitbare Wille unserer beiden Nationen offenbart werden: die Vereinigung von [GER.getAdjective]-[AUS.getAdjective] soll vollzogen werden, die der erste Schritt zur Vereinigung aller germanischen Völker unter einem Nationalstaat sein wird!"
germany.4.a:0		"Wie kann jemand sagen, dass Österreich nicht [GER.getAdjective] ist? "
germany.5.d:1		"Die ständige Rhetorik von [GER.getNameDef] und seine Führung, eine einheitliche Front gegen die Ausbreitung der roten Bedrohung zu errichten, haben die Kabinette der am meisten isolierten Regierungseinrichtungen unserer Nation erreicht. \n\nUnsere Beamten haben bereits viele freudige Vorschläge und einige besorgte Anfragen bezüglich einer solchen Angleichung an [GER.getNameDef] erhalten. \n\nDas geheime Telegramm wurde heute Morgen zugestellt, in dem [GER.getLeader] vorschlägt, dass wir einen Pakt unterzeichnen, um das Ziel der Komintern, den Kommunismus weltweit zu verbreiten, durch den Einsatz von Subversion und Gewalt zu bekämpfen. Durch die Unterzeichnung dieses Paktes stimmen wir zu, Informationen über die kommunistische Bedrohung auszutauschen und in enger Zusammenarbeit gegen diese Bedrohung vorzugehen. \n\n Auf der anderen Seite wird in dem Vorschlag nur die gemeinsame Nutzung nachrichtendienstlicher Erkenntnisse erwähnt und die Möglichkeit eines gemeinsamen Militärbündnisses oder einer wie auch immer gearteten Zusammenarbeit bei der gegenseitigen Verteidigung nur sehr kurz angerissen. Indem wir uns der offiziellen Teilnahme an dem Pakt widersetzen, werden wir unsere Beziehungen zu [GER.getNameDef] verschlechtern, aber es könnte uns vor der Entfremdung und Vergeltung durch [SOV.getNameDef] bewahren. "
germany.6.d:0		"Die Unterzeichner betrachten es als Voraussetzung für einen dauerhaften Frieden, dass alle Nationen in der Welt jeder ihren eigenen Platz erhalten, haben beschlossen, einander bei ihren Bemühungen in Großostasien und in den Regionen Europas beizustehen und zusammenzuarbeiten, wo es ihr Hauptziel ist, eine neue Ordnung der Dinge zu schaffen und aufrechtzuerhalten, die den gegenseitigen Wohlstand und das Wohlergehen der betroffenen Völker fördert. "
germany.11.d:0		"Das [GER.getAdjective] Außenministerium hat einen Nichtangriffspakt zwischen unseren beiden Nationen vorgeschlagen. Dieser Vertrag wird unseren gegenseitigen Handel und unsere Geschäfte erheblich steigern und gleichzeitig [SOV.getAdjective] Forschungseinrichtungen mit fehlenden Spezialisten und technologischen Fortschritten von [GER.getNameDef] versorgen. \nEin zusätzliches geheimes Protokoll schlägt die Aufteilung Osteuropas in [GER.getAdjective] und [SOV.getAdjective] Einflusssphären vor. \n\nAuch wenn die [GER.GetRulingIdeology] in Berlin aus nachvollziehbaren Gründen nicht vertrauenswürdig sind, wird uns dieser Pakt erlauben, mit [FIN.getNameDef], den baltischen Staaten und [ROM.getNameDef] zu verhandeln, ohne eine Einmischung von außen befürchten zu müssen. Die östlichen Gebiete von [POL.getNameDef] werden im Falle eines [POL.getAdjective]-Zusammenbruchs ebenfalls an uns fallen. "
germany.11.a.tt:0		"§NWährend der Pakt in Kraft ist, wird die Handelspolitik der Geschlossenen Wirtschaft nicht verfügbar sein.\nDer Schwerpunkt Krieg mit Deutschland wird für zwei Jahre nicht verfügbar sein.§!\n "
germany.11.b:0		"Keine Deals mit den [GER.GetRulingIdeology]s! "
germany.12.d:0		"Die offizielle Antwort der [SOV.getNameDef]-Beamten kam relativ spät, wenn man die Länge und Bedeutung des von uns vorgeschlagenen Abkommens bedenkt. Der offizielle [SOV.getAdjective]-Botschafter in Berlin übergab die unterzeichnete Kopie des Dokuments an den zuständigen [GER.getAdjective]-Diplomaten. \n\nDie Notiz besagt, dass [SOV.getNameDef] angesichts von [SOV.getLeader] zugestimmt hat, unseren Nichtangriffspakt zu unterzeichnen und die Bestimmungen des Vertrages bis zum letzten Wort und gemäß allen offiziellen Protokollen, die in dem Papier erwähnt werden, befolgen wird. \n\nDas bedeutet, dass wir frei sind, ohne das Risiko einer [SOV.getAdjective] Intervention zu handeln und [SOV.getAdjective] Ressourcen zu unserer Verfügung stehen, sollten wir irgendeine Art von militärischer oder ziviler Kampagne starten. \n\n Unglücklicherweise stellen einige unserer Freunde jetzt [GER.getNameDef]s Engagement für die endgültige Zerstörung des Kommunismus in Frage. Wenn die Angelegenheiten mit [POL.getNameDef] und [FRA.getNameDef] geklärt sind, müssen wir diesen Vertrag vielleicht wieder aufgreifen, aber das ist eine Diskussion für ein anderes Mal... "
germany.13.d:0		"Jüngste Nachrichten von unseren Spionen in Moskau und Umgebung deuten darauf hin, dass [SOV.getNameDef] sich geweigert hat, unseren Nichtangriffspakt zu unterzeichnen. \n\nDarüber hinaus hat [SOV.getLeader] heute Morgen eine offizielle Rede vor der Bevölkerung des Landes gehalten, in der er unseren Vorschlag von Frieden und Wohlstand in Osteuropa als ...einen minderwertigen Versuch der mickrigen [GER.getAdjective]-Führung bezeichnete, das Vertrauen des [SOV.getAdjective]-Volkes zu gewinnen, nur um uns zu verraten, solange unsere Hilfe nicht benötigt wird... „ \n\nWährend er den Bericht las, wurde [GER.getLeader] weiß im Gesicht, seine Hände zitterten und er erwähnte etwas von “Verräter....Verräter„ \nDas verkompliziert die Dinge, da wir nicht entschlossen mit [POL.getNameDef] oder [FRA.getNameDef] umgehen können, ohne zu riskieren, dass die [SOV.getAdjective]s sich einmischen.“ "
germany.14.c:0		"Die [SOV.GetAdjective] werden mit Litauen entschädigt werden. "
germany.14.d:0		"Wir werden uns an die ursprünglichen Vertragsbestimmungen halten. "
germany.15.t:0		"[GER.getNameDefCap] ehrt den Pakt "
germany.15.d:0		"In Übereinstimmung mit dem Molotow-Ribbentrop-Pakt haben [GER.GetAdjective] Truppen Ostpolen evakuiert und unsere eigenen Truppen sind eingezogen, um das Gebiet zu besetzen. "
germany.16.t:0		"[GER.getNameDefCap] verrät den Pakt "
germany.16.d:0		"[GER.getNameDefCap] hat sich geweigert, Polen mit uns zu teilen, was eine eklatante Verletzung des Molotow-Ribbentrop-Paktes darstellt! Dieser Verrat hat unseren Vertrag mit ihnen null und nichtig gemacht! "
germany.16.a:0		"Wir waren dumm, den [GER.GetRulingIdeology]s zu vertrauen! "
germany.20.d:0		"In der Erkenntnis, dass in Europa eine neue Ordnung entstanden ist, wurden wir von [HUN.getNameDef] und [ROM.getNameDef] gebeten, in einem Territorialstreit zwischen den beiden Ländern zu schlichten. Siebenbürgen wurde von [HUN.getNameDef] genommen und in [ROM.getNameDef] eingegliedert, in einer der vielen schlecht durchdachten Änderungen, die der Welt in Versailles aufgezwungen wurden. Sollte Nordsiebenbürgen unter die Kontrolle von [HUN.getAdjective] zurückgegeben werden? "
germany.20.a:0		"Geben Sie [HUN.getNameDef] Nordtranssylvanien. "
germany.20.b:0		"Gebt [HUN.getNameDef] ganz Transsylvanien. "
germany.20.c:0		"Siebenbürgen soll in [ROM.getNameDef] bleiben. "
germany.21.t:0		"[ROM.getNameDefCap] lehnt unser Verdikt ab "
germany.21.d:0		"[ROM.getNameDefCap] hat sich geweigert, sich an die Entscheidung zu halten, die wir im Zweiten Wiener Schiedsspruch getroffen haben! Ihre Delegation wurde nach Bucharest zurückgerufen, und kein Gebiet wurde an [HUN.getNameDef] abgetreten. "
germany.21.a:0		"Der Wille von [GER.getNameDef] muss befolgt werden! "
germany.22.t:0		"Memel - [188.controller.getNameDef] faltet "
germany.22.d:0		"Die [188.controller.getAdjective]-Regierung hat unseren Forderungen zugestimmt, und Memel wird wieder in Ostpreußen eingegliedert werden. Eine weitere unrechtmäßig gestohlene Provinz ist der [GER.getAdjective] Nation zurückgegeben worden! "
germany.23.t:0		"Memel - [188.controller.GetNameDef] lehnt Forderung ab "
germany.23.d:0		"Die [188.controller.getAdjective] Regierung hat unsere Forderungen abgelehnt! Sie versteckt sich hinter der Klaipeda-Konvention und behauptet, dass [GER.getNameDef] keinen Rechtsanspruch auf das Memelgebiet hat. Wir werden ihnen unsere Position mit anderen Mitteln erklären müssen... "
germany.24.t:0		"[GER.getNameDefCap] Militärische Mission in China "
germany.24.d:0		"[GER.getNameDefCap] hat seit dem Ende des letzten Weltkrieges gute Beziehungen zu China, trotz des Verlustes unserer chinesischen Besitztümer. Eine [GER.getAdjective] Militärmission ist seit einigen Jahren in China präsent, und Alexander von Falkenhausen hat große Fortschritte bei der Reformierung von Teilen der Kuomintang-Armee gemacht. \n\n Dies ist natürlich für die [JAP.getAdjective] angesichts ihres derzeitigen Krieges gegen China von einiger Bedeutung. Sie fordern den sofortigen Abzug aller [GER.getAdjective]-Unterstützung für die [CHI.getAdjective]. "
germany.24.c:0		"Nein, unsere Berater werden bleiben, so wie wir es dem [CHI.getAdjective] versprochen haben. "
germany.28.t:0		"Anschluss "
germany.28.d:0		"Es ist geschehen.\n\n Niemand hat daran gezweifelt, dass dieser Moment kommen würde, aber trotzdem hat sich ein Schock in der Nation ausgebreitet.\n\nBereits heute hat [GER.GetLeader] unserer Regierung eine Liste von Forderungen geschickt, die unsere Nation nur dem Namen nach an die ihre angliedern würde. Im ganzen Land sind Unruhen ausgebrochen, die den Anschluss unterstützen, und unser Militär desertiert zu den Nazis.\n\nDa die Frist abläuft und die Nazi-Truppen bereit sind, in unser Gebiet einzumarschieren, müssen wir jetzt eine Entscheidung treffen.\n\nIst ein unabhängiges Österreich nur eine künstliche Schöpfung, oder ist es etwas Größeres? "
germany.28.a:0		"Wir wurden allein gelassen... "
germany.28.b:0		"Wir lassen uns nicht so einfach unterkriegen! Rot-Weiß-Rot bis in den Tod! "
germany.28.c:0		"Wir lassen uns nicht so leicht unterkriegen! Schwarz über Gelb bis zum Tod! "
germany.29.t:0		"[AUS.getNameDef] verweigert den Anschluss! "
germany.29.b:0		"Vielleicht ist es das Beste, nicht weiterzumachen. "
germany.51.d:0		"Die Tschechoslowakei ist ein Krebsgeschwür im Herzen Europas, und endlich haben die Deutschen beschlossen, entschieden gegen sie vorzugehen. Das Sudetenland ist bereits an Deutschland abgetreten worden, und nun soll als Folge des Münchner Abkommens das tschechoslowakische Gebiet, das rechtmäßig zu Ungarn gehört, an uns zurückgegeben werden. "
germany.70.d:0		"In der Überzeugung, dass Hitler Deutschland in eine Situation gebracht hat, aus der es sich nicht mehr erholen kann, hat eine Gruppe hoher Offiziere der Wehrmacht einen Putsch gestartet! Er scheint von Oberst Hans Oster von der Abwehr inszeniert worden zu sein, aber auch die Generäle Beck, von Brauchitsch, Halder und Admiral Canaris wurden als Beteiligte bestätigt!\n\nSchwer bewaffnete Männer, die in mehreren Berliner Wohnungen auf der Lauer liegen, haben sich vor wichtigen Regierungsgebäuden versammelt und beabsichtigen, das derzeitige Regime zu stürzen. Derzeit finden zahlreiche heftige Feuergefechte statt. Die aktuelle Lage des Führers ist unklar, aber loyale Armeeeinheiten kämpfen um die Kontrolle über Berlin. "
germany.71.d:0		"SS-Truppen und loyale Armeeeinheiten haben es geschafft, alle verräterischen Kommandos zu töten oder gefangen zu nehmen, und konnten die Situation vollständig unter Kontrolle bringen. Der Führer wurde jedoch durch die Hand der Verschwörer tot aufgefunden!\n\n Die überlebenden Verschwörer werden für ihr abscheuliches Verbrechen vor Gericht stehen, aber jetzt wird ein neuer Führer benötigt. Wer soll der nächste Führer werden? "
germany.72.d:0		"SS-Truppen und loyale Armeeeinheiten haben es geschafft, alle verräterischen Kommandos zu töten oder gefangen zu nehmen, und die Situation gilt als völlig unter Kontrolle. Hitler selbst leitete die Säuberungsaktion mit seiner treuen Luger.\n\nDie überlebenden Verschwörer werden einen hohen Preis für ihre Illoyalität zahlen, und Hitler ist nun noch mehr entschlossen, den deutschen Erfolg zu sichern! "
germany.73.d:0		"Die schweren Kämpfe in Berlin haben die Hauptstadt in eine brennende Ruine verwandelt. Obwohl eine große Anzahl von SS-Soldaten und loyalen Heereseinheiten kämpften, schlossen sich den Verschwörern loyale Heereseinheiten dem Kampf an und erwiesen sich als entscheidend. Es wurde bestätigt, dass der Führer getötet wurde, und die Verschwörer haben erfolgreich alle Regierungsgebäude in Berlin gestürmt.\n\n Ein großer Teil der Wehrmacht ist auf die andere Seite übergelaufen, aber viele Offiziere sind immer noch NSDAP-treu. Wer sollte sie anführen? "
germany.75.t:0		"[GER.GetAdjective]-[SOV.GetAdjective] Vertrag "
germany.76.t:0		"[SOV.GetLeader] Nimmt den deutsch-[SOV.GetAdjective] Vertrag an "
germany.77.t:0		"[SOV.GetLeader] Lehnt den deutsch-[SOV.GetAdjective] Vertrag ab "
germany.79.d:0		"Da Griechenland unter der Fuchtel von Deutschland steht, hat [From.GetLeader] Druck auf unsere Regierung ausgeübt, sich ihnen anzuschließen. Das [SOV.GetAdjective]-Bündnis hat uns in eine Lage gebracht, in der Neutralität keine Option mehr ist, und nun ist ein Ultimatum aus Berlin eingetroffen, in dem gefordert wird, dass wir unsere östlichen Territorien an ihre sowjetischen Verbündeten abtreten und uns genau dem Pakt anschließen, mit dem sie uns unter Druck setzen wollen.\n\nAuch wenn wir die Neutralität nicht aufrechterhalten können, gibt es andere Möglichkeiten. Die Unterstützung Großbritanniens zu suchen ist eine, sich zu behaupten eine andere. Keine davon kann jedoch die Zukunft der Republik mit Sicherheit sichern. "
china.101.d:0		"Jüngste Berichte von der [CHI.GetAdjective]-[JAP.GetAdjective] Nordgrenze deuten darauf hin, dass der hitzige Streit um die entmilitarisierte Zone und die territorialen Rechte beider Länder um Peking zu einem offenen bewaffneten Konflikt zwischen zwei Ländern geführt hat. \n\n In seiner jüngsten Rede hat [CHI.GetLeader] alle chinesischen Bürger des ehemaligen Kaiserreichs aufgerufen, sich im Kampf gegen die eindringenden japanischen Streitkräfte zu vereinen. Wenn wir sicherstellen wollen, dass es eine Zukunft für China in seiner jetzigen Form gibt, müssen wir kleinliche Streitigkeiten beiseite lassen und als ein starkes, vereintes China kämpfen! \n\n Die Japaner hingegen behaupten, dass es die [CHI.GetAdjective] waren, die den Vorfall ausgelöst und eskaliert haben. Aus ihrer Sicht wird [CHI.GetName] sicherlich versuchen, uns und unseren noch zerbrechlichen Staat zu zerstören, sobald sie die Gelegenheit dazu haben. Wir können uns Zeit lassen und abwarten, wie sich die Situation entwickelt. \n\n Wie wird die Entscheidung von [Root.GetLeader] ausfallen?  "
china.101.c:0		"Im Moment sind wir besser auf uns allein gestellt. "
china.103.d:0		"[From.GetNameDefCap] hat sich entschieden, sich uns im Kampf gegen die Japaner anzuschließen. Vereint werden wir den Eindringling zurückdrängen. "
china.104_PRC_SOV_reinforcements:0		"Wird 10 Divisionen von [SOV.GetNameDef] erhalten. "
china.104.tt:0		"\nNordchina und die Mandschurei können nun im Namen von [Root.GetNameDef] befreit werden.\n "
china.106.d:0		"[From.GetNameDefCap] hat sich [Root.GetFactionName] angeschlossen und ist bereit zu kämpfen. "
china.108.d:0		"Unsere Rolle im Kampf gegen die verhassten japanischen Hunde hat der KPCh viel Prestige verliehen. Immer mehr Menschen sehen, dass wir die Zukunft Chinas sind, besonders im Vergleich zur korrupten Kuomintang. Die Parteikader sind bereits dabei, diese Menschen zu einer neuen Armee zu organisieren, die das Meer der Bauern durchschwimmen wird. "
china.111.d:0		"[Root.GetFactionName] hat seinen Zweck erfüllt. Es gibt keinen Feind mehr, gegen den man vereint antreten kann. Wir haben die Zeit klug genutzt, um unsere Unterstützung in ganz Nordchina und der Mandschurei aufzubauen, und jetzt ist es an der Zeit, unsere Kontrolle in dieser Region zu festigen. "
spain.4.a.tt:0		"[From.GetNameDefCap] wird uns dankbar sein, wenn wir während des Krieges ein Lend-Lease arrangieren. "
france.17.b:0		"[Root.GetNameDefCap] geht seinen eigenen Weg. "
france.18.t:0		"[From.GetNameDefCap] schließt sich der französischen Fraktion an "
france.19.t:0		"[From.GetNameDefCap] lehnt französisches Bündnis ab "
france.35.title:0		"Kommunisten dominieren die Volksfront "
france.35.desc:0		"Die politische Landschaft von [FRA.GetNameDef] hat sich nach dem Wahlsieg der Kommunisten deutlich verändert. Zuvor spielten die Kommunisten im Linksbündnis nur eine begrenzte Rolle, da sie keine Regierungspositionen einnahmen, aber das wird sich mit ihrem Aufstieg zweifellos ändern. "
france.35.a:0		"Sie sollten sich besser an die Regeln halten. "
france.35.b:0		"Das französische Volk hat weise gewählt. "
france.35.c:0		"Können wir ihnen noch trauen? "
soviet.4.t:0		"[78.controller.GetNameDefCap] kapituliert in Bessarabien "
soviet.4.d:0		"Die [78.controller.getAdjective] haben sich weise unseren Forderungen gebeugt. Ihr Botschafter in Moskau hat heute Morgen die Entschuldigung für ihre verspätete Antwort an unsere Beamten überreicht. \n\nUnsere verstärkten Grenzpatrouillen melden den Rückzug der [78.controller.getAdjective]-Kräfte an der gesamten Grenze zu Bessarabien. Einige der abenteuerlustigen Soldaten haben bereits einige der Außenposten jenseits des Dnjestr besetzt.  \n\n Wir werden das Gebiet in [SOV.getNameDef] eingliedern und [MOL.getAdjective]s die gewünschte Autonomie innerhalb unseres Staates gewähren. Es wird erwartet, dass die Bukowina wieder in den [UKR.getAdjective]-Staat eingegliedert wird, damit ihre Bürger nun die Vorteile der Vereinigung mit ihren Brüdern und Schwestern genießen können. "
soviet.5.t:0		"[78.Owner.getNameDefCap] lehnt unsere Forderungen ab "
soviet.5.d:0		"Die [78.Owner.getAdjective] haben sich geweigert, auf unsere Forderungen einzugehen! Es sieht so aus, als müssten wir ihre Besatzungstruppen mit Gewalt aus Bessarabien vertreiben. "
soviet.6.t:0		"[EST.getNameDefCap] unterwirft sich "
soviet.6.d:0		"[EST.getNameDefCap] hat sich unseren Forderungen unterworfen. Wir haben die dekadente Regierung in Tallinn durch eine Pro-[SOV.getAdjective]-Regierung ersetzt, die einstimmig beschlossen hat, [SOV.getNameDef]-Beamte um eine Wiedereingliederung ihres Staates in den unseren zu bitten. Nach langem„ Zögern hat der Oberste [SOV.getAdjective] beschlossen, diese Bitte anzunehmen.“ "
soviet.6.a:0		"Willkommen zurück im Mutterland. "
soviet.7.t:0		"[EST.getNameDefCap] lehnt unser Angebot ab "
soviet.7.d:0		"[EST.getNameDefCap] hat unverschämterweise beschlossen, unser großzügiges Angebot eines Beistandspaktes abzulehnen! Der kriegslüsterne und rebellische Anführer aus Tallinn hat außerdem die Frechheit besessen, eine Erklärung abzugeben, in der er fordert, dass wir die territoriale Integrität seiner Nation respektieren!"
soviet.7.a:0		"Wir müssen die [EST.getAdjective]s vor sich selbst schützen. "
soviet.8.t:0		"[LAT.getNameDefCap] unterwirft sich "
soviet.8.d:0		"Die [LAT.getAdjective]-Regierung in Riga hat unseren Forderungen zugestimmt, und wir haben ihre korrupte Herrschaft durch eine weniger zurückhaltende und für Alternativvorschläge offene ersetzt. Dieses Gremium hat einstimmig beschlossen, die Mitgliedschaft in unserer großen Union als integralen Bestandteil unseres Staates zu beantragen. Wir haben gnädigerweise zugestimmt, diese Bitte zu erfüllen. "
soviet.8.a:0		"Sie sind jetzt in unserer Sphäre! "
soviet.9.t:0		"[LAT.getNameDefCap] lehnt unser Angebot ab "
soviet.9.d:0		"Die Unterdrücker und Tyrannen, die [LAT.getNameDef] regieren, haben beschlossen, jede Vernunft aufzugeben. Sie haben unseren großzügigen Beistandspakt abgelehnt und fordern den sofortigen Rückzug aller [SOV.getAdjective]-Kräfte, die sich entlang ihrer Grenze ‚sammeln‘. "
soviet.9.a:0		"Das [LAT.getAdjective] Volk muss befreit werden. "
soviet.10.t:0		"[LIT.getNameDefCap] legt vor "
soviet.10.d:0		"Unserem Ersuchen um Militärbasen in [LIT.getNameDef] wurde stattgegeben, aber leider ist ihre Regierung zusammengebrochen. Wir haben ein neues Parlament eingesetzt, um Anarchie zu vermeiden, und es hat einstimmig beschlossen, den Obersten [SOV.getAdjective] um die Mitgliedschaft in unserer Union zu bitten. Diesem Antrag wurde stattgegeben. "
soviet.10.a:0		"Wir werden euch vor einer weiteren politischen Katastrophe bewahren. "
soviet.11.t:0		"[LIT.getNameDefCap] lehnt unser Angebot ab "
soviet.11.d:0		"[LIT.getNameDefCap] scheint auf Selbstzerstörung aus zu sein, und die Narren in ihrer Regierung verweigern unseren Truppen den Zugang zu ihrem Land. Denken sie, dass es ihnen unter den [GER.getAdjective] besser gehen würde? Ihre selbstsüchtigen Führer begehen ein Verbrechen gegen das Volk, indem sie ihren Bürgern ihren wahren Willen verweigern. "
soviet.11.a:0		"Das [LIT.getAdjective] Volk hat genug gelitten. "
soviet.12.t:0		"[FROM.getNameDefCap] Nimmt unsere Forderungen an "
soviet.12.d:0		"Die überwältigenden Kräfte, die wir entlang ihrer Grenzen gesammelt haben, haben die [FROM.getAdjective]-Regierung davon überzeugt, unsere bescheidene Forderung nach einer Revision ihrer Grenzen zu akzeptieren. Wir haben die Kontrolle über die strategischen Regionen erlangt, die in die [KAR.getAdjective] Verwaltungsregion eingegliedert werden, und die Position unserer Nordgrenze ist jetzt viel sicherer. "
soviet.13.t:0		"[FROM.getNameDefCap] lehnt unsere Forderungen ab "
soviet.13.d:0		"Die [FROM.getAdjective] Regierung hat unsere Forderungen zurückgewiesen, aber das war zu erwarten. Wenn wir Karelien wollen, müssen wir es mit Gewalt nehmen. Es ist an der Zeit, den starrköpfigen Narren eine Lektion zu erteilen, die sie nicht vergessen werden! "
japan.3.t:0		"Grenzscharmützel: [SOV.GetAdjective] Sieg "
romania.1.t:1		"[FROM.GetNameDefCap] Fordert Bessarabien "
baltic.5.a:0		"Unsere Zukunft ist am besten gesichert, wenn wir wirklich mit dem Mutterland eins werden. "
bulgaria.2.d:0		"Die rumänische Regierung hat unser Angebot, alle Streitigkeiten zu beenden, abgelehnt! Sie behauptet, dass die Süddobrudscha nun ein integraler Bestandteil ihrer Nation ist, den sie niemals aufgeben wird. "
italy.1.t:0		"[ALB.GetNameDefCap] gibt nach "
italy.1.d:0		"Die Behörden von [ALB.getAdjective] haben unseren Forderungen zugestimmt, und [ALB.GetLeader] wurde gezwungen, die Petition zu unterzeichnen, die [ALB.GetNameDef] offiziell als Protektoratsregion von [ITA.GetNameDef] integriert. \n\nAb jetzt und bis zum Ende der Zeit wird [ITA.GetNameDef] seine Positionen an der Adria sichern! "
italy.2.t:0		"[ALB.GetLeader] lehnt das Ultimatum ab "
italy.2.d:0		"Trotzig bis zum Schluss hat [ALB.GetLeader] unser Ultimatum abgelehnt. Er und seine Berater versuchen nun, jede noch so klägliche Verteidigung zusammenzukratzen, die [ALB.GetNameDef] aufbringen kann. Wir müssen Tirana besetzen und dieser Farce ein Ende setzen! "
italy.2.a:0		"Wir hätten das auch auf die einfache Art tun können! "
italy.3.t:0		"[ITA.getAdjective] Ultimatum "
italy.3.d:0		"[ITA.getAdjective] Diplomaten haben uns ein Ultimatum gestellt, in dem sie fordern, dass wir uns ihrer Besetzung unterwerfen! [ALB.GetNameDefCap] soll in einer Personalunion unter dem [ITA.getAdjective] König regiert werden! "
italy.3.b:0		"Das wird nicht geschehen! Sammelt euch für [ALB.GetLeader]! "
news.1.d:0		"Hohe Spannungen an der Grenze zwischen den [JAP.getAdjective] und [CHI.getAdjective] Streitkräften haben zu Schießereien geführt, nachdem einer der [JAP.getAdjective] Soldaten angeblich nicht auf den Regimentskommandeur reagierte und das Untersuchungsteam die Durchsuchung der Wanping-Festung forderte. Nach dem Abbruch der Verhandlungen lieferten sich beide Seiten ein ergebnisloses Gefecht um die strategisch wichtige Marco-Polo-Brücke südwestlich von Peking. \n\n[CHI.GetNameDefCap] hat die Forderungen von [JAP.GetNameDef] nach einer Entschuldigung und territorialen Zugeständnissen zurückgewiesen und stattdessen behauptet, dass die „Sollbruchstelle“ der japanischen Aggression erreicht worden sei. \n\nDiplomaten befürchten, dass die instabile Situation jederzeit zu einem Krieg führen könnte. "
news.5.d:0		"Unter Ausnutzung der Schwäche von [FRA.getAdjective] angesichts des Kampfes in Europa und ihres schwachen Griffs nach Kolonialbesitz in der ganzen Welt, hat [JAP.GetNameDef] die neue Regierung gezwungen, die Kontrolle über ihre Kolonie in Indochina aufzugeben! \n[JAP.getAdjective] Truppen haben bereits alle wichtigen Stützpunkte in der Region besetzt, einschließlich der strategischen Einrichtungen um Tonkin und Saigon. Aufgrund mangelnder Kommunikation kam es in den Gebieten um Dong-Dang, Lang-Son und Haiphong zu Scharmützeln, die einige Tage andauerten. \n\nExperten befürchten, dass die Kolonie als Ausgangspunkt für künftige Militärexpeditionen genutzt werden könnte. "
news.6.d:0		"In dem Versuch, die Schwäche Frankreichs angesichts der Niederlage in Europa auszunutzen, hat [JAP.GetNameDef] kürzlich die neue französische Regierung aufgefordert, vollständigen Zugang zu ihren Stützpunkten in Indochina zu gewähren. \n\n Dies würde bedeuten, die Kontrolle über die gesamte Kolonie an Japan zu übertragen, was die Franzosen nicht akzeptieren konnten. Nach dem Scheitern der Verhandlungen ziehen beide Seiten Truppen in dem Gebiet auf. Die Kolonialverwaltung hat bereits das Kriegsrecht verhängt und die allgemeine Mobilmachung erklärt!  \n\nExperten halten es für wahrscheinlich, dass diese Entscheidung zu Vergeltungsmaßnahmen des japanischen Militärs führen wird. "
news.7.t:0		"[SOV.GetAdjective] - Japanisches Scharmützel "
news.7.d:0		"[SOV.GetAdjective] und japanische Streitkräfte sind vor kurzem in einem großen Scharmützel entlang der mandschurischen Grenze zusammengestoßen. \n\n Ein bedeutender [SOV.GetAdjective]-Angriffstrupp, der von mongolischer Kavallerie unterstützt wurde, überraschte die Japaner offenbar und fügte ihnen schwere Verluste zu. \n\nDie Stimmung in Tokio wird als angespannt bezeichnet, aber es ist noch zu früh, um zu sagen, ob der Konflikt zu einem offenen Krieg eskalieren wird. "
news.7.c:0		"Wir haben eine Botschaft an die Welt gesendet. "
news.8.d:0		"[SOV.GetAdjective] und japanische Streitkräfte sind vor kurzem in einem großen Gefecht entlang der mandschurischen Grenze aufeinander getroffen. \n\nAus Berichten über die Schlacht geht hervor, dass die Japaner die Sowjets in einer Zangenbewegung erwischten, als sie über die Grenze angriffen, und die Überlebenden zwangen, sich verwirrt zurückzuziehen. \n\nWird dieser Vorfall Moskau dazu veranlassen, weitere Truppen in den russischen Fernen Osten zu entsenden? "
news.9.t:0		"[SOV.GetAdjective] Rückzug "
news.9.d:0		"Nach einer Aufstockung der japanischen Streitkräfte in der Mandschurei scheint die [SOV.GetNameDef] unerwartet Einheiten abgezogen zu haben, die direkt an der Grenze stationiert waren. \n\n Dies könnte ein Versuch Moskaus sein, eine zukünftige Konfrontation mit Japan zu vermeiden, möglicherweise ausgelöst durch die schmerzliche Erinnerung an die Niederlage, die Russland im Russisch-Japanischen Krieg erlitten hat. "
news.10.t:0		"[SOV.GetNameDefCap] Beansprucht Bessarabien "
news.10.d:0		"\Nachdem [SOV.GetNameDef] seine Streitkräfte entlang der rumänischen Grenze zusammengezogen hat, stellt er der Regierung in Bukarest ein Ultimatum für die sofortige Übergabe Bessarabiens unter seine Kontrolle. \n\nWährend des russischen Bürgerkriegs erklärten die lokalen Behörden ihre Unabhängigkeit und äußerten den Wunsch, in Rumänien eingegliedert zu werden, was [SOV.GetNameDef] als unzureichende Rechtsgrundlage ansieht und außerdem behauptet, dass die Stimmen der ukrainischen Minderheit nicht berücksichtigt wurden„.\n\nRumänien hat erklärt, dass es keine andere Wahl hat, als beizutreten, und seine Streitkräfte wurden aus Bessarabien und der Nordbukowina abgezogen.“ "
news.11.t:0		"[78.controller.GetNameDefCap] lehnt [SOV.GetAdjective] Forderungen ab "
news.11.d:0		"[SOV.GetNameDefCap] hat erhebliche Kräfte entlang seiner Grenze zu [78.controller.GetNameDef] konzentriert, und heute stellte Moskau ein Ultimatum an die [78.controller.GetAdjective]-Regierung, in dem es die sofortige Übergabe Bessarabiens an seine Kontrolle forderte. Die Region gehörte einst zum Russischen Reich, was [SOV.GetNameDef] als ausreichende Rechtsgrundlage für ihre Forderungen ansieht.\n\nIn einer trotzigen Bewegung haben die lokalen Behörden beschlossen, alle [SOV.GetAdjective] territorialen Forderungen zurückzuweisen, und die vollständige Mobilisierung wurde angeordnet. \n\nInternationale Beobachter erwarten, dass [SOV.GetAdjective] Kräfte jeden Moment die Grenze überschreiten werden. "
news.12.t:0		"[146.controller.GetNameDefCap] lehnt [SOV.GetAdjective] Forderungen ab "
news.12.d:0		"\n[SOV.GetAdjective] Diplomaten haben der Regierung von [146.controller.GetNameDef] ein Ultimatum gestellt, in dem sie Grenzanpassungen in der Region Karelien, die Verpachtung der Halbinsel Hanko für die nächsten 30 Jahre und die Abtretung einiger Inseln im Finnischen Meerbusen im Austausch für die Siedlungen Repola und Porajärvi in Ostkarelien fordern. \n\nTrotz einer beträchtlichen Aufstockung der sowjetischen Streitkräfte an der Grenze hat Helsinki diese Forderungen zurückgewiesen und erklärt, dass kein einziger Meter finnischen Bodens den russischen Aggressoren freiwillig überlassen wird". \n\nInternationale Beobachter befürchten, dass eine [SOV.GetAdjective]-Invasion unmittelbar bevorstehen könnte." "
news.13.t:0		"[FIN.GetNameDefCap] Akzeptiert [SOV.GetAdjective] Forderungen "
news.13.d:0		"Nach langer Debatte hat die Regierung von [FIN.GetNameDef] beschlossen, [SOV.GetAdjective] Forderungen nach Grenzanpassungen in der Region Karelien zu akzeptieren. \n\n[SOV.GetNameDefCap] begründet dies mit der Notwendigkeit, eine Pufferzone zu schaffen, um die Sicherheit von Leningrad zu verbessern, das nur 30 Kilometer von der ehemaligen finnischen Grenze entfernt liegt. \n\n Viele Beobachter hatten befürchtet, dass eine umfassende sowjetische Invasion Finnlands unmittelbar bevorstehe, aber diese diplomatische Lösung sollte diese Befürchtungen ausräumen. "
news.14.d:0		"In einer Presseerklärung gab Moskau heute die formelle Annexion von [TAN.GetNameDef] und die Eingliederung des Autonomen Gebiets Tuwa in die UdSSR bekannt. \n\n Der Oberste [SOV.GetAdjective] hat einem Antrag des neu reformierten Zentralkomitees der TPRP auf Mitgliedschaft in der UdSSR zugestimmt. \n\nDas kleine [TAN.GetName], das nur von [SOV.GetNameDef] und der Mongolei offiziell anerkannt worden war, hat in den letzten Jahren immer engere administrative, militärische und wirtschaftliche Beziehungen zum großen Bruder [SOV.getAdjective] entwickelt. "
news.19.d:0		"Angesichts der angriffsbereiten deutschen Truppen an der Grenze hat [188.controller.GetNameDef] einem [GER.GetAdjective]-Ultimatum nachgegeben, das die Abtretung des alten preußischen Territoriums Memel fordert.\n\nMemel gehörte einst zu Ostpreußen und wurde nach dem Versailler Vertrag offizielles Völkerbundmandat, um 1923 von Litauen annektiert zu werden, nachdem Klaipeda-Rebellen die Kontrolle über die Region übernommen hatten. Es wird angekündigt, dass das erworbene Gebiet wieder in die Region Ostpreußen eingegliedert werden soll. \n\nHaben wir das Ausmaß der deutschen territorialen Ambitionen in Europa schon erreicht? Experten sind skeptisch... "
news.20.t:0		"[188.controller.GetNameDefCap] lehnt deutsche Forderungen ab "
news.20.d:0		"\[188.controller.GetNameDef] hat ein Ultimatum Berlins für die Rückgabe des Memelgebiets zurückgewiesen, obwohl deutsche Truppen an der Grenze stehen. \n\nMemel gehörte einst zu Ostpreußen und [GER.GetAdjective] sieht darin eine legitime Grundlage für ihre Forderungen. Es sei die Integrität des Vertrages, sagte [188.controller.GetLeader], die es zu schützen gelte, als die [188.controller.GetAdjective] Regierung ihre Ablehnung ankündigte.\n\nInternationale Beobachter erwarten nun, dass Deutschland versuchen könnte, das Gebiet mit Gewalt zu nehmen... "
news.22.t:0		"[ALB.getLeader] unterwirft sich Italien "
news.22.d:0		"Vor wenigen Tagen wurde der [ALB.getAdjective]-Regierung von [ITA.getAdjective]-Diplomaten ein Ultimatum gestellt, in dem sie aufgefordert wurde, sich der vollständigen militärischen Besetzung zu unterwerfen. \n\nHeute Morgen haben alle [ALB.getAdjective] Radiosender eine Nachricht ausgestrahlt, in der [ALB.getLeader] einer Armee befohlen hat, die Waffen niederzulegen, nachdem sie die Sinnlosigkeit des Widerstands erkannt hat, da [ALB.getName] nun in einer Personalunion unter [ITA.getLeader] regiert wird. [ITA.getAdjective] Flugzeuge wurden gesichtet, die am Himmel patrouillieren, während Transportschiffe der Regia Marina bereits die ersten [ITA.getAdjective] Soldaten auf [ALB.getAdjective] Boden ausschiffen. \n\n[ITA.GetNameDefCap] blickt auf den Balkan... "
news.22.a:0		"Ein weiteres Opfer von [ITA.getLeader]s Ambitionen. "
news.23.t:0		"[ALB.getLeader] Trotzig "
news.23.d:0		"Diplomaten von [ITA.GetNameDef] haben [ALB.GetNameDef] ein Ultimatum gestellt und dessen Anschluss an Großitalien gefordert. \n\nIn einem mutigen Akt der nationalen Führung hat sich [ALB.getLeader] geweigert, den Forderungen von [ITA.getAdjective] nachzugeben, und das [ALB.getAdjective] Volk aufgefordert, dem Druck von [ITA.GetNameDef] zu widerstehen. \n\nAllerdings sind sich ausländische Militärexperten einig, dass [ALB.GetNameDef] kaum eine Chance hat, einer Invasion zu widerstehen. "
news.23.c:0		"Es lebe [ALB.getLeader]! "
news.25.d:0		"Deutschland hat 20.000 Wehrmachtssoldaten im Rheinland, nahe der französischen und belgischen Grenze, stationiert und damit eindeutig gegen den Vertrag von Versailles und den Locarno-Vertrag verstoßen. \n\n Die lokale Bevölkerung jubelte den deutschen Soldaten zu, und im ganzen Land wurden wilde Feiern veranstaltet. Es wird erwartet, dass das gesamtdeutsche Referendum über die allgemeine Zustimmung der Bevölkerung zur Remilitarisierung in der nächsten Woche abgehalten wird. \n\nDie diplomatischen Reaktionen Frankreichs und Großbritanniens sind bisher verhalten ausgefallen. Es ist nicht mehr, als wenn die Deutschen in ihren eigenen Hinterhof gehen", bemerkte ein politischer Kommentator in Großbritannien."
news.28.t:0		"Himmler übernimmt die Führung! "
news.28.d:0		"Nach dem Tod von Adolf Hitler fragten sich viele, wer die Nation in seine Fußstapfen treten würde. Heute Morgen wurde Heinrich Himmler als neuer Führer des Deutschen Reiches vereidigt, und wir haben nun eine Antwort auf diese Frage. \n\n In einer Rede vor dem Reichstag beschuldigte Himmler Großbritannien und Frankreich, hinter der Ermordung Hitlers zu stecken, und erklärte, dass Deutschland unmissverständlich zur völligen Vernichtung beider Nationen verpflichtet sei. "
news.29.t:0		"Göring übernimmt die Führung! "
news.29.d:0		"Nach dem Tod von Adolf Hitler fragten sich viele, wer die Nation in seine Fußstapfen treten würde. Heute Morgen wurde Hermann Göring als neuer Führer des Deutschen Reiches vereidigt, und wir haben nun eine Antwort auf diese Frage. \n\n In einer Rede vor dem Reichstag beschuldigte Göring Großbritannien und Frankreich, hinter der Ermordung Hitlers zu stecken, und erklärte Deutschlands unmissverständliches Engagement für die völlige Vernichtung beider Nationen. "
news.30.d:0		"Eine Gruppe von Wehrmachtsoffizieren, die gegen das derzeitige Regime sind, hat in Berlin einen Putsch gegen Hitler gestartet. Eine unbekannte Gruppe bewaffneter Männer stürmte wichtige Regierungsgebäude, wurde aber von Mitgliedern der SS und anderen loyalen Armeeeinheiten erfolgreich abgewehrt.\nGestapo-Agenten haben alle Verschwörer verhaftet, darunter hochrangige Offiziere wie Ludwig Beck und Wilhelm Canaris. \n\n In einer Rede vor dem Reichstag schwor Hitler Rache an Frankreich und Großbritannien, die hinter diesem „hinterhältigen Anschlag“ auf sein Leben steckten. "
news.31.d:0		"Eine Gruppe von Wehrmachtsoffizieren, die mit der derzeitigen Situation in [GER.GetNameDef] nicht einverstanden sind, hat einen Putsch gegen die Nazis in Berlin gestartet.\n\n Den Verschwörern ist es gelungen, den größten Teil Berlins unter ihre Kontrolle zu bringen, und viele Wehrmachtseinheiten sind auf ihre Seite übergelaufen. Die den Nazis noch treu ergebenen Truppen haben sich unter neuer Führung versammelt und geschworen, Deutschland von den „kommunistischen Dissidenten und ausländischen Agenten, die derzeit Berlin besetzen“, zu säubern. "
news.33.t:0		"[SOV.GetAdjective] Streitkräfte besetzen Ostpolen "
news.33.d:0		"[SOV.GetAdjective] Truppen haben Ostpolen besetzt, offiziell mit dem Ziel, weißrussische und ukrainische Minderheiten vor dem Chaos zu schützen, das dem Zusammenbruch der [POL.GetAdjective] Regierung folgte. \n\n[GER.GetAdjective] Truppen haben sich ordnungsgemäß aus diesen Gebieten zurückgezogen, was zu einer effektiven Aufteilung Polens zwischen den beiden Mächten führte. Viele Experten sprachen schnell von der „Vierten Teilung Polens“ und äußerten große Zweifel an der Existenz eines unabhängigen Staates in naher Zukunft. \n\nNur die Zeit wird zeigen, wie lange diese neue Weltordnung Bestand haben wird..." "
news.37.d:0		"Lew Trotzki, einst oberster Leutnant und präsumtiver Erbe von Wladimir Iljitsch Lenin, starb heute in einem Krankenhaus in Mexiko-Stadt. Er wurde in seinem Haus mit einem Eispickel von einem Spanier angegriffen, von dem man annimmt, dass er in den Diensten des NKWD stand. Nach einem gescheiterten Machtkampf mit $SOV_iosif_stalin$ und seinen Verbündeten um die Kontrolle über die Kommunistische Partei der Sowjetunion verbrachte Trotzki die dreißiger Jahre im Exil, lebte in der Türkei, Frankreich und Norwegen, bevor er sich schließlich in Mexiko niederließ. \n\n Er blieb ein ständiger Kritiker Stalins und des „degenerierten ‚Arbeiterstaats‘ der Sowjetunion“. "
news.101.d:0		"Während anderswo in [FRA.GetNameDef] noch gekämpft wird, gibt es Berichte über den Einzug von [ROOT.GetAdjective]-Truppen in Paris. \n\n Die Hauptstadt wurde von den französischen Streitkräften kurz vor dem Rückzug ihrer letzten Einheiten zur offenen Stadt erklärt. Mehrere Kolonnen deutscher Truppen stellten die preußische Siegesparade von 1871 nach und marschierten die Champs-Élysées hinunter, während die Pariser fassungslos zusahen. \n\nMilitärexperten sagen voraus, dass der Zusammenbruch von [FRA.GetNameDef] unmittelbar bevorsteht."
news.101.a:0		"[ROOT.GetNameDefCap] scheint unaufhaltsam zu sein! "
news.103.d:0		"[195.GetCapitalVictoryPointName], die Wiege der russischen Revolution, ist an die vorrückenden deutschen Truppen gefallen. \n\nIn einigen Vororten sind noch sporadische Kämpfe zu hören, aber über dem Rest der zerstörten Stadt scheint eine seltsame Ruhe eingekehrt zu sein.\n\nHeute früh marschierten Kolonnen deutscher Soldaten an der Isaakskathedrale vorbei, deren große Kuppel von Ingenieuren der Roten Armee grau gestrichen wurde, um die Aufmerksamkeit marodierender Bomber der Luftwaffe zu vermeiden. \Trotz ihrer Bemühungen ist sie mit Einschusslöchern und Schrapnell-Einschlägen übersät. "
news.113.d:0		"Jubelnde italienische Soldaten drangen heute in Kairo ein, kurz nachdem sich die letzten britischen Einheiten aus der Stadt zurückgezogen hatten. \n\nEine Siegesparade wurde sofort organisiert, und italienische Soldaten strömten zu den Großen Pyramiden von Gizeh, um sich vor den berühmten Wahrzeichen fotografieren zu lassen.\n\nMit Kairo unter seiner Kontrolle ist [ITA.GetLeader] nun einen Schritt näher daran, Italienisch-Ostafrika mit Italienisch-Libyen zu verbinden und eine zusammenhängende Kolonie in Afrika zu bilden. "
news.158.t:0		"[From.From.GetNamedefCap] interveniert in [From.GetAdjective] Krieg "
news.158.d:0		"Vor ein paar Tagen hat [From.GetNamedef] dem [From.From.From.GetNamedef] den Krieg erklärt. Kurze Zeit später stellte [From.From.GetNameDef] ein Ultimatum, in dem es erklärte, dass es mit [From.GetNameDef] in den Krieg ziehen würde, wenn sie nicht alle Aggressionen einstellen und einen Friedensvertrag unterzeichnen würden. [From.GetLeader] erklärt, dass ihre Gründe für den Krieg gerecht waren, hat sich aber entschieden, zu demobilisieren und dem Frieden zuzustimmen. "
news.159.t:0		"Die Morgendämmerung der [From.GetFactionName] "
news.159.d_01:0		"[From.GetLeader] gab heute bekannt, dass [From.GetNamedef] die Hand ausstreckt, um ein neues Bündnis zu bilden. Die im [From.GetFactionName] zusammengeschlossenen Länder haben ihre Absicht bekannt gegeben, im Falle eines Krieges zusammenzuarbeiten.\n\n Obwohl große Koalitionen vor Aggressionen abschrecken können, haben wir gesehen, welche Folgen sie haben, wenn es zu einem Konflikt kommt. Über die Absichten der verschiedenen Parteien, die sich an diesem neuen Bündnis beteiligen, lässt sich noch streiten, aber welchem Zweck es letztendlich dienen soll, wissen vielleicht nicht einmal seine Initiatoren. "
news.159.d_03:0		"Selbst [From.GetNamedef], berühmt für seinen Glauben an die Stärke und Überlegenheit seines Volkes und seiner Nation, ist nicht bereit, Bündnisse mit denen einzugehen, die sie respektieren. [From.GetLeader] gab heute bekannt, dass die endgültigen Vereinbarungen über die [From.GetFactionName] getroffen wurden, eine militärische Koalition, die angeblich nur ehrenhaften Nationen Platz bietet, die nach Größe streben.\n\nOb diese Größe durch den Aufbau der idealen Gesellschaft innerhalb der Grenzen der jeweiligen Nationen oder durch die Zusammenarbeit bei der Expansion über diese Grenzen hinaus erreicht werden soll, wird die Welt vielleicht erst erfahren, wenn es zu spät ist. "
news.185.t:0		"[From.GetNameDefCap] Strebt weitreichenden Militärpakt an "
news.185.a:0		"[From.GetNameDefCap] führt den Weg! "
news.187.a:0		"Sicherlich teilt [GRE.GetName] unsere Interessen. "
news.188.t:0		"[ITA.GetNameDefCap] sucht die Versöhnung mit [TUR.GetName] "
news.188.a:0		"[ITA.GetNameDefCap]s Einfluss wächst "
news.194.t:0		"Ostpolen wird an [From.GetNameDef] abgetreten "
news.194.d:0		"\nDurch unbekannte politische Machenschaften hat die Führung von [From.GetNameDef] ihre östlichen Regionen an die [From.GetName] abgetreten. \n\nEs ist noch unbekannt, welche Versprechungen oder Drohungen von [From.GetName] gemacht wurden, um diesen politischen Sieg zu erreichen. Wir werden es vielleicht nie erfahren, da [Poland.GetLeader] über die Ankündigung des Abkommens hinaus noch kein Wort gesagt hat. "
news.194.a:0		"[From.GetNameDefCap] erkennt die Stärke des [From.GetFactionName] an! "
news.194.b:0		"[From.GetNameDefCap] verzehrt alles, was sich ihm in den Weg stellt. "
news.194.c:0		"[POL.GetNameDefCap] muss keine andere Wahl gehabt haben. "
news.195.t:0		"[From.GetNameDefCap] gewährte Ostdeutschland "
news.195.d:0		"Nach der Besetzung Deutschlands durch [SOV.GetAdjective] erhält [SOV.GetNameDef] den größten Teil Ostdeutschlands, darunter auch das umstrittene Gebiet Ostpreußen.\n Es scheint, dass dies das Ergebnis einer geheimen Klausel im sowjetisch-polnischen Vertrag ist. Polen erhält deutsches Land als Entschädigung für das, was es an die [Soviet.GetName] abtreten musste.\n\nPolen hat mit dem höchsten Einsatz gespielt, und während viel verloren wurde, ist nun auch viel gewonnen worden. "
news.195.a:0		"[SOV.GetNameDefCap] hält sich an seine Verträge. "
news.197.t:0		"[From.GetNameDefCap] gibt dem [Soviet.GetAdjective] Ultimatum nach "
news.197.d:0		"[From.GetNameDefCap] hat einem [Soviet.GetAdjective]-Ultimatum nachgegeben und die Kontrolle über die Ägäischen Inseln an [Soviet.GetNameDef] abgetreten.\n\nDamit verstärkt [Soviet.GetNameDef] seine Präsenz im Mittelmeer und stärkt sich als Seemacht in der Region. "
news.198.d:0		"[From.GetName] hat die Forderungen in einem [SOV.GetAdjective] gestellten Ultimatum über die Ägäischen Inseln abgelehnt. Da [SOV.GetNameDef] immer größeren Einfluss auf die Region ausübt, hat [From.GetLeader] verkündet, dass die Überlassung einer einzigen Insel in der Ägäis damit enden würde, dass sie das gesamte Mittelmeer erobern. Da das Ultimatum abgelehnt wurde, steht [From.GetName] am Rande eines Krieges und kann nur darauf warten, dass [SOV.GetNameDef] den Abzug betätigt. "
news.199.t:0		"[bessarabia_ultimatum_victim.GetNameDefCap] zediert Bessarabien an [From.GetNameDef]. "
news.199.d:0		"\n\n[bessarabia_ultimatum_victim.GetNameDef] hat sich gezwungen gesehen, einem Ultimatum von [78.controller.GetNameDef] nachzugeben. Die Gebiete von Bessarabien sind unter die Kontrolle von [From.GetAdjective] übergegangen, und der Staat [bessarabia_ultimatum_victim.GetAdjective] steht mit geschrumpften Grenzen da.\n\nEs bleibt abzuwarten, wie [bessarabia_ultimatum_victim.GetAdjective] weitere Verluste vermeiden wird. "
news.199.c:0		"[bessarabia_ultimatum_victim.GetNameDefCap] ist in einer unglücklichen Lage. "
news.204.d:0		"In Anbetracht der Forderungen schien es unvermeidlich. \n\n[From.GetNameDefCap] würde gezwungen sein, Danzig an Deutschland abzutreten, und ein polnischer Bevollmächtigter würde nach Berlin geschickt werden, um weitere Bedingungen auszuhandeln. [From.GetLeader] wies auf [GER.GetNameDef]s jüngste Aktionen hin, als er erklärte, dass es offensichtlich sei, dass Deutschland sich nicht mit Danzig allein zufrieden geben würde.\n\nDie deutschen und polnischen Streitkräfte sind auf einen Krieg vorbereitet, und es kommen bereits Berichte über Zusammenstöße an der Grenze herein. Wieder einmal herrscht Krieg in Europa. "
news.249.d:0		"[USA.GetAdjective] Politiker wachten heute Morgen mit besorgniserregenden Nachrichten auf, als [CAN.GetNameDef] und [MEX.GetNameDef] einen neuen Verteidigungspakt ankündigten, der sich darauf konzentriert, unmittelbare Bedrohungen für die fortdauernde Souveränität unserer beiden Länder zu bekämpfen und einzudämmen." Die kaum verhüllte Drohung verschleiert kaum die Absicht, die militärischen Anstrengungen von [USA.GetNameDef] auf dem amerikanischen Kontinent und möglicherweise darüber hinaus zu behindern.\n\nPolitische Kommentatoren vergleichen die Situation mit der Europas vor dem Ersten Weltkrieg: zwei Seiten, die alles zu verlieren haben und keine Möglichkeit, die Spannungen abzubauen. Die Frage scheint weniger zu sein, wer für wen die größere Bedrohung darstellt, sondern vielmehr, welche Seite als erste einen Präventivschlag führen wird." "
news.254.d:0		"[AST.GetNameDefCap], der seine völlige Unabhängigkeit behauptet, hat begonnen, seinen Einfluss auf den Südpazifik auszuüben. In diesem Zusammenhang forderte die [AST.GetAdjective]-Regierung, alle ehemaligen Kolonialstaaten Ozeaniens unter ihre Autorität zu stellen.\n\nNatürlich widerwillig leisteten die bedrängten Regierungen von [ENG.GetAdjective] und Neuseeland zunächst diplomatischen Widerstand. Da sie jedoch keine Basis hatten, um die Autorität des Imperiums in der Region zu demonstrieren - eine Rolle, die zuvor Australien innehatte - war es nur eine Frage der Zeit, bis [AST.GetNameDef] ein Ultimatum stellte, das mit Gewalt untermauert wurde.\nNeuseeland ist heute die östlichste Provinz von [AST.GetNameDef]. "
ace_promoted.1.d:0		"Wenige gehen so viele Risiken ein wie die mutigen Piloten der [Root.GetAdjective] Air Force. [From.GetNameDefCap] [From.GetSurname], ein erfahrener Pilot, der unter dem Rufzeichen [From.GetCallsign] bekannt ist, hat sich bei [From.GetHerselfHimself] dadurch ausgezeichnet, dass er nicht nur lebend von der jüngsten Mission über [From.GetMissionRegion] zurückgekehrt ist, sondern in vielen kritischen Begegnungen bedeutende Siege errungen hat.\n\nAls leuchtendes Beispiel für [Root.GetAdjective] Mut wurde [From.GetName]s jüngste Beförderung in der Öffentlichkeit stark beachtet. Auch wenn die Menschen den Krieg eher als Hölle denn als Ruhm betrachten, sind viele froh, dass es noch Helden gibt, hinter denen sie sich versammeln können. "
ace_promoted.1.d_major:0		"Nur wenige gehen so viele Risiken ein wie die tapferen Piloten der [Root.GetAdjective] Air Force. [From.GetNameDefCap] [From.GetSurname], ein erfahrener Pilot, der unter dem Rufzeichen [From.GetCallsign] bekannt ist, hat sich [From.GetHerselfHimself] dadurch ausgezeichnet, dass er nicht nur lebend zurückgekehrt ist, sondern [From.GetHerHis] [From.GetWing] mit ungeheurem Geschick geflogen hat. Kürzlich war [From.GetName] auf einer Mission über [From.GetMissionRegion] und trug maßgeblich zum Erfolg dieser kritischen Begegnung bei.\n\nAls leuchtendes Beispiel für [Root.GetAdjective] Mut wurde die kürzliche Beförderung von [From.GetName] in der Öffentlichkeit stark beachtet. Auch wenn die Menschen den Krieg eher als Hölle denn als Ruhm betrachten, sind viele froh, dass es noch Helden gibt, hinter denen sie sich versammeln können. "
ace_died.1.d:0		"Einer von [From.Owner.GetNameDef]s berühmtesten [From.GetAceType]-Assen, [From.GetFullName], ist während eines Einsatzes über [From.GetMissionRegion] in Flammen aufgegangen. Leider ist das Ableben von [From.GetCallsign] für die vielen Menschen, die zu [From.GetHerHim] aufschauten, sehr demoralisierend, da [From.GetSheHe] schon lange eine öffentliche Person war. Wir wünschten, es gäbe einen Weg, dieses Ereignis vor den Menschen zu verbergen, aber das Fehlen von öffentlichen Auftritten von [From.GetName] würde bald Verdacht erregen. Letztendlich ist [From.GetHerHis] Tod ein weiterer Teil einer Legende, die hoffentlich noch lange nach unseren aktuellen Problemen weiterleben wird. "
ace_died.1.d_major:0		"Einer von [From.Owner.GetNameDef]s berühmtesten [From.GetAceType]-Assen, [From.GetFullName], ist in Ausübung seiner Pflicht gefallen. Piloten, die von der Mission zurückkehren, berichten, dass sie [From.GetHerHis] [From.GetWingShort] über [From.GetMissionRegion] in Flammen aufgehen sahen, nachdem sie unter schwerem feindlichen Beschuss standen. Unglücklicherweise ist das Ableben von [From.GetCallsign] für die vielen Menschen, die zu [From.GetHerHim] aufgeschaut haben, sehr demoralisierend, da [From.GetSheHe] schon lange eine öffentliche Figur war.\n\nWir wünschen uns zwar, dass es einen Weg gibt, dieses Ereignis vor der Bevölkerung zu verbergen, aber das Fehlen von öffentlichen Auftritten von [From.GetName] würde bald Verdacht erregen. Letztendlich ist [From.GetHerHis] Tod ein weiterer Teil einer Legende, die hoffentlich noch lange nach unseren aktuellen Problemen weiterleben wird. "
election.3.d:0		"Der andauernde Krieg, der sich unseren Grenzen nähert, hat die bevorstehende Wahl überschattet, und viele Wähler sind besorgt, dass [Root.GetNameDef] nicht darauf vorbereitet ist, in diesen Konflikt hineingeworfen zu werden oder was auch immer daraus entstehen mag. Sie fordern, dass wir unsere Vorsichtsmaßnahmen erhöhen und sicherstellen, dass unsere Nation für einen Krieg bereit ist. Die Mehrheit unterstützt zwar immer noch [Root.GetRulingParty], aber wir könnten sie an radikalere Elemente verlieren, wenn wir ihre Befürchtungen nicht zerstreuen. "
election.4.d:1		"In [Root.GetNameDef] ist ein aggressiver Nationalismus gewachsen, der mehrere Parteien hervorgebracht hat, die faschistische Ideale vertreten: ein Staat, der seine Macht mit Gewalt durchsetzt. Vor allem eine dieser Parteien hat bei den aktuellen Wahlen gewonnen, was zu Diskussionen innerhalb der [Root.GetRulingParty]-Partei darüber geführt hat, ob wir versuchen sollten, bei der Bildung unserer Regierung mit ihnen zusammenzuarbeiten oder nicht. Obwohl sie die demokratischen Ideale, die die Grundlage unseres Staates bilden, offen ablehnen, verleiht die Tatsache, dass sie sich an der Wahl selbst beteiligen, unseren Ansichten eine gewisse Glaubwürdigkeit, und die Anerkennung ihrer öffentlichen Unterstützung könnte sie von gewalttätigen Aktionen abhalten. "
election.5.d:0		"Die kommunistische Bewegung in [Root.GetNameDef], die sich aus einer breiten Unzufriedenheit in der Arbeiterklasse und radikalen Tendenzen unter den Akademikern speist, ist groß genug geworden, um zur Gründung mehrerer Parteien zu führen. Nachdem eine dieser Parteien bei den aktuellen Wahlen beträchtliche Unterstützung erhalten hat, haben die Politiker in [Root.GetRulingParty] begonnen, darüber zu debattieren, ob sie ihre Unterstützung bei der Regierungsbildung suchen sollen oder nicht. Obwohl sie unsere demokratischen Institutionen für wenig mehr als eine bürgerliche Tyrannei halten, scheinen sie darauf erpicht zu sein, die von ihnen gewünschten Veränderungen durch eine Zusammenarbeit mit der Regierung zu erreichen, anstatt sie zu stürzen. "
election.6.d:0		"Die Politik in [Root.GetNameDef] hat sich zunehmend radikalisiert. Wo es früher eine breite Unterstützung für die Parteien gab, die demokratische Ideale und [Root.GetNameDef]s repräsentative Institutionen unterstützten, haben sich bei dieser Wahl mehr Wähler den politischen Extremen zugewandt. Die Parteien der politischen Mitte bilden, selbst wenn sie ihre Differenzen beiseite schieben, keine Mehrheit mehr. Um eine schwache Minderheitsregierung zu vermeiden, haben wir keine andere Wahl als entweder mit den Faschisten oder den Kommunisten zusammenzuarbeiten. "
election.6.a:0		"Wir werden mit den Faschisten zusammenarbeiten, um [Root.GetNameDef] zu stärken. "
election.8.b:0		"Der Weg dorthin ist die Auflösung von [Root.GetNameDef] selbst. "
election.11.a:0		"Es ist ein schwarzer Tag für [Root.GetNameDef], aber das Volk hat gesprochen. "
election.13.b:0		"Wir können uns nicht auf die Faschisten verlassen, um [Root.GetNameDef] zu entwickeln und zu schützen. "
election.14.d:0		"[Root.GetNameDefCap] befindet sich im Kriegszustand. Normalerweise würde zu diesem Zeitpunkt eine Wahl abgehalten werden, aber da man sich mitten in einem wichtigen Konflikt befindet, argumentieren viele, dass man es sich nicht leisten kann, Zeit für einen politischen Wahlkampf oder einen Führungswechsel zu verwenden, falls dieser eintreten sollte. Andere wiederum behaupten, dass die Erklärung des laufenden Krieges zu einem triftigen Grund für das Auslassen von Wahlen der erste Schritt zur Aushöhlung der Demokratie sei. Denn wenn man militärischen Angelegenheiten Vorrang vor dem Einfluss des Volkes einräumt, könnte man sich auf eine schiefe Bahn begeben. "
election.15.d:0		"Angesichts der bevorstehenden Wahlen beginnen die Menschen an der Fähigkeit der derzeitigen Regierung zu zweifeln, den laufenden Krieg fortzusetzen. [Root.GetNameDefCap] hat stark gelitten und die öffentliche Meinung hat sich gegen diejenigen gewandt, die unsere Nation in die Niederlage zu führen scheinen. Unser Volk ist zwar entschlossen, den Krieg zu Ende zu führen, aber es würde lieber eine andere Regierung sehen, die ihn beendet. "
political.1.d:0		"Während sich die Arbeiter auf der ganzen Welt gegen ihre Unterdrücker erheben, sitzen diejenigen, die behaupten, in [Root.GetNameDef] Klassenbewusstsein erlangt zu haben, untätig herum und warten darauf, dass der Wandel aus dem Innern eines politischen Systems kommt, das so durch und durch korrupt ist, dass nur eine Revolution uns davor bewahren könnte!'\n\nSo sprechen neue Stimmen in der kommunistischen Bewegung [Root.GetAdjective]. Sie bezeichnen die Herrschaft von [Root.GetRulingParty] als Diktatur der Bourgeoisie und fordern, dass sie mit allen Mitteln gestürzt wird. Ob diese Mittel von innen oder von außen kommen werden, bleibt abzuwarten. "
political.15.a:0		"Die Bewegung scheint in Abwesenheit von Repressionen auf natürliche Weise zu wachsen. "
britain.8.d:0		"[From.GetNameDefCap] hat unsere Forderung, den Handel mit Deutschland einzustellen, abgelehnt. "
germany.93.d:0		"Unser Vorschlag zur friedlichen Lösung des [SLV.GetAdjective]-Problems beinhaltete ein Treffen mit Vertretern von [ENG.GetAdjective], [FRA.GetAdjective] und [ITA.GetAdjective]. Und während [ITA.GetNameDef] mehrheitlich dafür war, die aggressive Rhetorik und die unterdrückerische Herrschaft der [YUG.GetAdjective]-Regierung zu zähmen, wurde deutlich, dass die Siegermächte des Großen Krieges diese Meinung in dieser Angelegenheit nicht teilen. \n\nDie an Paris und London gesendete Einladung wurde von Beamten beider Länder zerrissen, in der es heißt: „Die Integrität von [YUG.GetNameDef] wird weder im Rahmen des Völkerbundes noch in irgendwelchen privaten Gesprächen in Frage gestellt, von niemandem!“. Beide Länder haben ihre Delegationen aus unserem Land abgezogen, was deutlich zeigt, dass die Beamten dieser Länder auf alle Maßnahmen vorbereitet sind, die wir ergreifen könnten, um das von uns geforderte Gebiet zu erhalten. \n\nAusgedehnte Bewegungen der [ENG.GetAdjective]-Flotte wurden in der Hohen See gesichtet, [FRA.GetAdjective]-Aufklärungsflugzeuge verletzen den Luftraum über dem Rheinland und Maginot-Befestigungsgarnisonen scheinen erweitert und bereit zu sein für etwas, das ein Zangenangriff gegen unsere Bunker der Sigfried-Linie zu sein scheint. \n\n Der Krieg steht bevor, doch ist er unter diesen Umständen eine Option?" "
germany.93.d_FRA_abandoned_yugoslavia:0		"Die Londoner Konferenz hätte als Erfolg unserer Diplomaten gewertet werden können, wenn nicht nach dem zweiten Verhandlungstag ein kleines Problem aufgetreten wäre. Nachdem die [FRA.GetAdjective]-Beamten ihre kleinen Entente-Bindungen mit [YUG.GetNameDef] aufgekündigt hatten, warf die [ENG.GetAdjective]-Delegation die Frage nach der Verteidigungspolitik auf dem Balkan auf. \n\nDie besagte Politik, die in ihrem neuesten Vorschlag des Völkerbundes vorgestellt wurde, scheint die territoriale Integrität des Balkans unter dem Schutz von [ENG.GetAdjective] zu begünstigen. Von [FRA.GetNameDef] im Stich gelassen, waren die [YUG.GetAdjective]-Behörden mehr als zufrieden, sich auf einen neu unterzeichneten gegenseitigen Schutzpakt mit [ENG.GetNameDef] zu verlassen. \n\nDiplomatische Probleme lassen sich leicht militärisch lösen, und wir werden unsere Vorteile nutzen, bevor sich jemand anderes zum ‚Beschützer des Balkans‘ ausruft. "
germany.94.d:0		"Durch hervorragende diplomatische Manöver und die pazifistische Rhetorik unserer Delegation konnten wir die Hauptakteure der Londoner Viererkonferenz davon überzeugen, dass unsere Annexion von [AUS.GetNameDef] nichts anderes als eine Geste des freien Willens zwischen unseren beiden Ländern war. Unsere politische Agenda für die Wiedervereinigung mit den rechtmäßigen deutschen Gebieten in Krain hat diesen Glauben nur noch verstärkt. \n\nDie heute Morgen abgeschlossenen Gespräche mit [ENG.GetNameDef], [FRA.GetNameDef] und [ITA.GetNameDef] haben ihre Unterstützung für die friedliche Integration des deutschen Teils Sloweniens in [GER.GetNameDef] ergeben. \n\nDie [YUG.GetAdjective]-Regierung unter Führung von [YUG.GetLeader] hat heftigen Protest geäußert, da sie zu der Konferenz nur eingeladen wurde, um die neue Resolution zu unterzeichnen. [YUG.GetAdjective] Truppen haben bereits ihre Grenzbefestigungen aufgegeben und sich auf die [CRO.GetAdjective] Gebiete ihres Staates zurückgezogen. \n\n In einem weiteren Triumph des Mutes und der Tat wurde Slowenien, das bald in Krain umbenannt werden soll, in seine rechtmäßige Heimat in [GER.GetNameDef] zurückgeführt. [SLV.GetAdjective] Menschen haben unsere Truppen bei den Feierlichkeiten in Ljubljana und Maribor bejubelt! "
germany.94.a:0		"Integrieren Sie diese Staaten direkt! "
germany.94.b:0		"Wir werden Slowenien von nun an schützen! "
germany.95.t:0		"[YUG.GetNameDefCap] weigert sich "
germany.95.d:0		"Unsere Spione in [YUG.GetNameDef] haben berichtet, dass die Regierungsbeamten die Ergebnisse der Londoner Viererkonferenz zusammen mit unserer Forderung, Slowenien abzutreten, am Vortag erhalten haben. Die [SLV.GetAdjective]-Frage sollte innerhalb von 24 Stunden gelöst werden, da Ungehorsam unsere beiden Länder in einen Krieg verwickeln würde. \n\nZwei Stunden vor Mitternacht vor Ablauf des Ultimatums hat [YUG.GetLeader] eine Notfallsendung über alle Radiostationen des Landes ausgestrahlt, in der erklärt wird, dass [YUG.GetNameDefCap] sich der kriegstreiberischen Ambitionen von [GER.GetNameDef] voll bewusst ist und eine solch aggressive Haltung der [GER.GetAdjective]-Führung nicht tolerieren wird." \n\nEs wurde ein landesweiter allgemeiner Mobilmachungsbefehl erlassen, mit dem [YUG.GetAdjective] Armee den klaren Befehl erhielt, nach Belieben zu schießen. Wenige unserer Grenzpatrouillen gerieten bereits in einen Hinterhalt, als sie die Demarkationslinie zwischen [GER.GetAdjective] Österreich und [YUG.GetAdjective] Slowenien überwachten. \n\nDie Spannungen nehmen zu, da [YUG.GetAdjective] Luftwaffe den [GER.GetAdjective] Luftraum verletzt und mehr [YUG.GetAdjective] Truppen die [SLV.GetAdjective] Grenzbefestigung verstärken. \n\nDer Krieg wird kommen, aber fühlen wir uns dafür bereit?" "
germany.95.b:0		"Wir sind keine Kriegstreiber, lasst sie in Ruhe "
germany.96.d:0		"Während der Londoner Viererkonferenz waren unsere Diplomaten erfreut, freundliche Gespräche mit den Delegationen von [ENG.GetAdjective] und [FRA.GetAdjective] zu führen, da die Verhandlungsatmosphäre für eine friedliche Lösung des [SLV.GetAdjective]-Problems günstig zu sein schien. \n\nAm dritten Tag der Konferenz haben unsere diplomatischen Beziehungen zu [ITA.GetNameDef] jedoch einen schweren Rückschlag erlitten, als ihr Außenminister während der Verhandlungen unsere Delegation beleidigte und die Frage aufwarf, ob die Balkan-Ambitionen von [GER.GetNameDef] in Slowenien enden werden oder ob sie weiter in den Süden vordringen und die territoriale Integrität von [ITA.GetNameDef] bedrohen werden", woraufhin im Konferenzraum Totenstille herrschte. \n\nUnsere beleidigten Diplomaten verließen die Konferenz zusammen mit [ENG.GetAdjective] und [FRA.GetAdjective], da eine solche Provokation von keinem respektvollen Land toleriert werden kann. \n\nAls nächsten Schritt ihres diplomatischen Manövers unterzeichneten [ITA.GetNameDef] und [YUG.GetNameDef] einen Beistandsvertrag und stellten ein Ultimatum, in dem sie den Abzug unserer Truppen aus Tirol und die Entmilitarisierung des deutschen Österreichs forderten. \n\nDie unerhörte Haltung der [ITA.GetAdjective]-Behörden kann um keinen Preis toleriert werden! Unser Generalstab versichert uns, dass diese lästigen [ITA.GetAdjective] zum letzten Mal gegen unseren Willen laufen." "
germany.97.d:0		"Unsere Einmischung in die [YUG.GetAdjective]-Angelegenheiten stieß auf den erbitterten Widerstand der [FRA.GetAdjective]-Beamten, die auf die veralteten Abkommen der Kleinen Entente mit den Balkanstaaten als Eckpfeiler ihrer Sicherheitspolitik auf dem Balkan verwiesen. \n\n[ENG.GetAdjective] und [ITA.GetAdjective] Beamte haben das diplomatische Manöver von [FRA.GetNameDef] bereits angeprangert und es als ...imperiale Ambitionen bezeichnet, die mit denen von Karl dem Großen oder Napoleon vergleichbar sind". \n\nDie Konferenz wurde abrupt beendet, als sich herausstellte, dass [FRA.GetAdjective] Behörden versuchen, Zeit zu schinden, damit ihr Militär sich an der Maginot-Linie verstärken und verschanzen kann, während sie gleichzeitig hinter unserem Rücken mit [YUG.GetAdjective] Generalstabsmaterial Gespräche über den gleichzeitigen Angriff auf die industriellen Gebiete von [GER.GetAdjective] Österreich und unser Rheinland führen. \n\nDer Befehl zur allgemeinen Mobilmachung ist im ganzen Lande ergangen, und alle Einheiten sind in voller Bereitschaft für den kommenden Sturm, der sich bald in Europa zeigen wird. Glauben die wirklich, dass ihre leeren Drohungen uns etwas bedeuten?" "
germany.98.d:1		"Wir haben immer gewusst, dass der jugoslawische Staat, der aus dem Habsburger Reich hervorgegangen ist, ein künstliches Land ist, das niemals Bestand haben wird. Die ethnischen Ressentiments, die unter der Oberfläche schwelen, sind übergekocht und der Staat zerfällt. Wir müssen eingreifen, um die Situation zu bereinigen. "
germany.99.t:0		"Griechenland aufteilen "
germany.99.d:0		"Da unser Einfluss auf dem Balkan zunimmt, können wir Italien vielleicht einen Teil der von ihm beanspruchten Gebiete in Griechenland zugestehen, ohne einen Krieg auszulösen. "
germany.99.a:0		"Wir sollten unsere Partnerschaft stärken. "
germany.99.b:0		"Wir haben andere Pläne für diese Gebiete "
germany.100.t:0		"Griechenland aufteilen "
germany.101.t:0		"Griechenland abtrennen "
germany.106.d_second_vienna_accepted_all:0		"Mit dem Gewinn Siebenbürgens durch Ungarn hat uns Bulgarien an seinen langjährigen Grenzstreit mit Rumänien über die südliche Dobrudscha erinnert, die 1913 von Rumänien erobert wurde. "
war_justification.1.t:0		"[Root.GetLeader] spricht sich gegen [From.GetNameDef] aus"
war_justification.1.d:0		"Gehört [From.GetNameDef] zu den [From.GetAdjective]? Wir sollten uns eine bessere Frage stellen: Gehört die Zukunft dem [From.GetAdjective] oder gehört sie dem [ROOT.GetNameDef]?'\n\n[ROOT.GetLeader] hat in seiner heutigen Rede angedeutet, dass [ROOT.GetName] auf dem Weg zum Krieg ist. Die politischen Spannungen haben in den letzten Monaten zugenommen, und es scheint, dass das [ROOT.GetAdjective]-Volk langsam akzeptiert, dass ein Krieg unvermeidlich ist. "
war_justification.1.a:0		"Die Zukunft gehört [Root.GetNameDef]! "
war_justification.2.a:0		"[Root.GetNameDefCap] steht geeint unter [Root.GetLeader]. "
war_justification.4.t:0		"[Root.GetNameDefCap] bereitet sich auf den großen Kampf vor "
war_justification.5.t:0		"[ROOT.GetLeader] bringt die Revolution nach [From.GetNameDefCap] "
war_justification.5.d:0		"Während wir die sozialistische Gesellschaft in [ROOT.GetNameDefCap] konsolidiert haben, leiden viele Nationen noch unter den Despoten von einst. Die Arbeiter von [From.GetNameDefCap] haben keine Stimme, keine Möglichkeit, sich zu organisieren, und jeder Versuch, den Sozialismus einzuführen, wird vom [From.GetLeader]-Regime brutal niedergeschlagen. Wir können nicht darauf warten, dass sich die Zahnräder der internationalen Revolution für das [From.GetAdjective] Volk drehen. Mit der Revolution haben wir bewiesen, dass wir die kapitalistischen Unterdrücker hier zermalmen konnten, und wir werden auch die Unterdrücker in [From.Capital.GetNameDefCap] zermalmen!'\n\n[ROOT.GetLeader] hat alle Versuche einer diplomatischen Rhetorik gegenüber dem von [From.GetRulingParty] kontrollierten [From.GetNameDefCap] aufgegeben. Das Bestreben, alle Grenzen zu beseitigen, konzentriert sich jetzt ausschließlich auf die Beseitigung ihrer Grenzen. "
war_justification.8.d:0		"Gibt es eine Gesellschaft, die der Zukunft der Revolution noch mehr zuwider ist, die der Notlage des Arbeiters noch fremder ist als das faschistische Regime von [From.GetNameDef]? Indem sie das Volk auffordern, sich fanatisch der maroden Institution des Nationalstaates hinzugeben, haben sie uralte Methoden der Grausamkeit in ein modernes Gewand gekleidet und versuchen, sich als alternative Zukunft zum unvermeidlichen internationalen Sieg der Arbeiterklasse zu präsentieren. Es ist nur eine Frage der Zeit, bis sie gegen uns oder unsere Verbündeten zuschlagen. Lasst uns zuerst zuschlagen.'\n\Niemand hat weniger als gegenseitige Verachtung zwischen uns und den [From.GetAdjective] erwartet, aber die Feindseligkeit hat sich in letzter Zeit verschärft. Es scheint nun, dass es eher früher als später zu einem Konflikt kommen wird. "
war_justification.9.t:0		"Diplomatie mit [From.GetNameDef] scheitert "
war_justification.9.d:0		"Trotz unserer Versuche, eine diplomatische Lösung für unseren Konflikt mit [From.GetNameDef] zu finden, sind die Verhandlungen wieder einmal gescheitert, so dass wir nur begrenzte Möglichkeiten haben. Das autoritäre [From.GetLeader]-Regime hat in dieser Angelegenheit eine unvernünftige Haltung an den Tag gelegt, die typisch für Führer ist, die ihrem Volk gegenüber nicht rechenschaftspflichtig sind. Wenn die Politik der [From.GetAdjective]-Führung nicht völlig umschlägt, bleibt uns nichts anderes übrig, als zu kämpfen.'\n\n[ROOT.GetAdjective] Intervention in [From.GetName] war ein heißes Thema, wobei einige Politiker der Opposition behaupteten, dass [ROOT.GetRulingParty] von Anfang an eine hawkistische Politik verfolgt hat. Was auch immer ihre ursprüngliche Absicht war, ein zukünftiger Krieg scheint jetzt plötzlich sehr real und unvermeidlich. "
war_justification.10.t:0		"[ROOT.GetLeader] ruft zur Intervention in [From.GetNameDef] auf "
war_justification.10.d:0		"Schweren Herzens müssen wir uns der Realität unserer Situation stellen: Eine Invasion von [From.GetNameDef] könnte unsere einzige Möglichkeit sein. Es ist von zu großem strategischem Vorteil, in unserer gegenwärtigen Situation irgendeine andere Lösung zu versuchen. Obwohl wir darauf vertrauen, dass weder die [ROOT.GetAdjective] noch das [From.GetAdjective] Volk einen Krieg wollen, hat uns die Geschichte an diesen Punkt geführt und unsere Möglichkeiten sind begrenzt. Wir können nur hoffen, dass wir durch diese Behauptung unserer militärischen Macht weiteres Blutvergießen in der Zukunft vermeiden können.'\n\nObwohl es eine weit verbreitete Theorie ist, dass Demokratien nicht gegen andere Demokratien in den Krieg ziehen, deuten die jüngsten Entwicklungen auf eine [ROOT.GetAdjective]-Invasion in [From.GetNameDef] in der Zukunft hin. Die Geschichte könnte uns noch überraschen. "
war_justification.10.a:0		"[From.GetNameDef] ist ohnehin eine zweifelhafte Demokratie. "
war_justification.11.d:0		"Der [From.GetNameDef]-Kommunismus ist zweifellos eine der größten Bedrohungen für Freiheit und Ordnung in diesem Zeitalter. Unerbittlich und rücksichtslos droht er nicht nur die Hoffnung des [From.GetAdjective] Volkes auf eine blühende, demokratische Gesellschaft zu verschlingen, sondern auch die seiner Nachbarn. Wenn wir jetzt nicht handeln, könnte es gut sein, dass dieser erste Dominostein zu spät fällt und weitere gescheiterte soziale Experimente hinterlässt. Wie viele müssen noch sterben, bevor wir eingreifen?'\n\nDie Gefahr subversiver Aktivitäten, die unsere Demokratie untergraben und von [From.GetAdjective]-Ambitionen angeheizt werden, ist in letzter Zeit zu einem heiß diskutierten Thema geworden. Während Vertreter der Opposition dies als Rote Angst bezeichnet haben, die auf einen Krieg mit [From.GetNameDef] abzielt, war die Rhetorik der [ROOT.GetRulingParty] bisher sehr erfolgreich. "
war_justification.12.d:0		"In der modernen Geschichte, vielleicht sogar in der Geschichte insgesamt, hat es keine schlimmere Tyrannei gegeben als den eisernen Griff, in dem [From.GetRulingParty] jetzt [From.GetNameDef] hält. Die Leute mögen argumentieren, dass wir keinen Konflikt provozieren sollten, dass wir darauf vertrauen sollten, dass [From.GetLeader] in Zukunft Verträge und Versprechen einhält, aber diese Leute übersehen, dass Verträge, die unter der Herrschaft des Faschismus geschlossen wurden, nutzlos sind. Für diese ehrlosen Lügner macht Macht Recht, und das Papier, auf dem ein Abkommen geschrieben ist, verbrennt genauso leicht wie die Bücher ihrer Gegner.'\n\nDie Leute, die lange gehofft haben, eine direkte Konfrontation mit [From.GetName] zu vermeiden, sind jetzt von [ROOT.GetLeader] heftig angefeindet worden, der argumentiert, dass wir in machiavellistischer Weise den Krieg zum Vorteil des Feindes nur hinausschieben. Bei diesem Tempo werden wir vielleicht doch noch den ersten Schlag ausführen. "
war_justification.13.t:0		"[ROOT.GetLeader] ruft zum Krieg gegen [From.GetNameDef] auf "
war_justification.14.d:0		"[From.GetNameDef] mag sich für moderner und fortschrittlicher halten als wir, aber die Wahrheit ist, dass ihre Nation nicht so geprüft wurde wie die unsere, noch sind sie auf die Bedrohungen vorbereitet, die sich jetzt am Horizont abzeichnen. Durch ihre Verachtung uns gegenüber und dadurch, dass sie uns daran hindern, uns das zu nehmen, was uns rechtmäßig gehört, haben sie uns zu einer dieser Bedrohungen für sich selbst gemacht. Ihre schwache und gespaltene Nation wird unseren Ansprüchen kaum widerstehen.'\n\nDie spöttische Meinung über [From.GetNameDef], die lange Zeit von den [ROOT.GetRulingParty] vertreten wurde, hat sich von Kritik zu Feindschaft entwickelt. Obwohl die Bevölkerung der Meinung ist, dass [From.GetAdjective] einen Krieg vermeiden will, behauptet [ROOT.GetLeader], dass ihre gewählten Führer ihn durch ihre Arroganz provoziert haben. "
war_justification.15.t:0		"[ROOT.GetLeader] will die Ordnung in [From.GetNameDef] wiederherstellen "
war_justification.15.d:0		"Der [ROOT.GetAdjective] Nationalgeist ist stark, aber nicht alle Nationen haben so viel Glück. Bei [From.GetName] wurden die Traditionen zerstört und die rechtmäßigen Herrscher längst ermordet und begraben, alles im Namen der Idee der großen marxistischen Revolution. Es ist unsere Pflicht, die Ordnung in dieser von blutrünstigen Usurpatoren in die Irre geführten Welt wiederherzustellen und die Stärke von [ROOT.GetNameDef] gegen diese Bedrohung zu behaupten.'\n\nWährend sich [ROOT.GetRulingParty] schon immer gegen den Kommunismus gewehrt hat, war [From.GetNameDef] in den letzten Reden ein besonderes Ziel von Angriffen. Unabhängig davon, ob der Angriff der Kommunisten auf die [ROOT.GetAdjective] Nation eine reale Bedrohung darstellt oder nicht, ist der Präventivschlag gegen den [From.GetAdjective] Kommunismus bereits in Arbeit. "
war_justification.16.d:0		"Meine Gegner wollen Sie glauben machen, dass meine Herrschaft wie die der [From.GetRulingParty] in [From.GetNameDef] ist. Sie könnten sich nicht mehr irren. Während die Erfolge der [From.GetLeader] das Ergebnis einer neuen Modeerscheinung sind, einer zerstörerischen Massenbewegung, die andere Nationen zur Unterwerfung zwingen will, steht die [ROOT.GetRulingParty] in Opposition zu dieser Bewegung als diejenigen, die sich nicht unterwerfen werden. Ich bin bereit, alles zu tun, was notwendig ist, um diese Bedrohung zu beseitigen, selbst wenn es Krieg bedeutet.'\n\nDas [ROOT.GetLeader]-Regime hat eine feindliche Politik gegenüber der [From.GetAdjective]-Nation verfolgt. Wie auch immer unsere Führer genannt werden mögen, faschistisch ist ein Wort, das für unsere Feinde reserviert ist. "
war_justification.17.d:0		"Wer bestimmt die Grenzen einer Nation und wie werden sie bestimmt? Was auch immer die Menschen in der Vergangenheit gefunden haben, um zu rechtfertigen, wo [ROOT.GetNameDef] endet und [From.GetNameDef] beginnt, wir leben in einer neuen Ära. Die strategische Bedeutung dieser Grenze kann gar nicht hoch genug eingeschätzt werden, und es ist unser gutes Recht, sie zu verschieben, um die Sicherheit unseres Volkes zu gewährleisten.'\n\nNach den jüngsten Reden von [ROOT.GetLeader] scheint eine Invasion von [From.GetNameDef] unmittelbar bevorzustehen. Anderslautende Stimmen haben sich dagegen ausgesprochen, aber die öffentliche Unterstützung für den Krieg nimmt zu. "
war_justification.18.t:0		"[ROOT.GetLeader] fragt nach den Motiven von [From.GetNameDef] "
war_justification.18.d:0		"Es besteht kein Zweifel, dass [From.GetNameDef] sich auf einen Krieg vorbereitet. Die Veränderungen in der Wirtschaftspolitik machen deutlich, dass die [From.GetAdjective] kein Volk des Friedens sind, sondern auf die richtige Gelegenheit warten, um gegen uns zuzuschlagen. Werden wir untätig zusehen, wie sie sich bewaffnen, während [ROOT.GetName] unverteidigt ist? Oder werden wir diese Bedrohung entwaffnen, bevor sie über unsere Macht hinauswächst?'\n\nDie Falken in der [ROOT.GetRulingParty] haben ihre Augen auf [From.GetName] gerichtet und argumentieren, dass Angriff die beste Verteidigung ist. Ihr Standpunkt gewinnt an Boden und [ROOT.GetName] bereitet sich auf den Krieg vor. "
war_justification.19.d:0		"Diese naiven Bürger von [ROOT.GetNameDef], die sich die [From.GetAdjective] als ein Volk des Friedens vorstellen, sind völlig realitätsfremd. Diejenigen, die an unserer Grenze leben, können sich solche Illusionen nicht leisten, denn sie sehen ihre Truppen direkt hinter der Grenze auf uns zukommen. Dieser Bedrohung können wir nicht tatenlos zusehen. Mit jedem Tag, der vergeht, bereitet sich [From.GetName] auf einen Krieg vor. Es wäre Wahnsinn, wenn wir nicht dasselbe täten.'\n\nDie [From.GetAdjective]-Militärpräsenz in der Nähe unseres Territoriums hat wachsende Besorgnis ausgelöst, da diese Nation mehr und mehr als Feind des [ROOT.GetRulingParty] erscheint. Ob es die Ursache oder die Wirkung ihrer Polemik ist, darüber lässt sich streiten. "
war_justification.20.t:0		"[ROOT.GetLeader] befürwortet Invasion von [From.GetNameDef] "
war_justification.20.d:0		"Wenn wir im absehbaren, um nicht zu sagen unvermeidlichen Krieg mit [From.GetNameDef] den strategischen Vorteil haben wollen, gibt es keinen Raum zum Zögern. Es geht darum, die Zukunft unserer Kinder zu sichern und dafür zu sorgen, dass [ROOT.GetName] auch morgen noch einen Platz in der Welt hat. Es geht um die Hingabe an unsere Sache und die Ideale, die wir für selbstverständlich halten. Es ist Zeit zu handeln.'\n\nEine Reihe mitreißender Reden von [ROOT.GetRulingParty]-Führern, allen voran [ROOT.GetLeader], hat die Öffentlichkeit dazu aufgerufen, eine Invasion von [From.GetName] zu unterstützen. Die geopolitischen Motive hinter der Invasion stehen in der Rhetorik weniger im Vordergrund als patriotische Gefühle, aber diese Kampagne scheint sehr effizient zu sein, wenn es darum geht, die Öffentlichkeit von ihrer Notwendigkeit zu überzeugen. "
war_justification.201.t:0		"[From.GetLeader] spricht sich gegen [ROOT.GetNameDef] aus "
war_justification.201.d:1		"Gehört [ROOT.GetNameDef] zu den [ROOT.GetAdjective]? Wir sollten uns eine bessere Frage stellen: Gehört die Zukunft dem [ROOT.GetAdjective] oder gehört sie dem [From.GetName]?'\n\n[From.GetLeader] hat in seiner heutigen Rede angedeutet, dass [From.GetName] auf dem Weg zum Krieg ist. Die politischen Spannungen haben in den letzten Monaten zugenommen, und es scheint, dass das [From.GetAdjective]-Volk akzeptiert hat, dass ein Krieg unvermeidlich ist. [ROOT.GetName] muss sich auch vorbereiten. "
war_justification.204.t:0		"[From.GetNameDefCap] Bereitet sich auf großen Kampf vor "
war_justification.205.t:0		"[From.GetLeader] bringt die Revolution nach [ROOT.GetNameDef] "
war_justification.205.d:0		"Während wir die sozialistische Gesellschaft in [From.GetNameDef] konsolidiert haben, leiden viele Nationen noch unter den Despoten von einst. Die Arbeiter von [ROOT.GetNameDef] haben keine Stimme, keine Möglichkeit, sich zu organisieren, und jeder Versuch, den Sozialismus einzuführen, wird von dem [ROOT.GetLeader]-Regime brutal niedergeschlagen. Wir können nicht darauf warten, dass sich das Räderwerk der internationalen Revolution für das [ROOT.GetAdjective] Volk dreht. Wir haben bewiesen, dass wir die kapitalistischen Unterdrücker hier vernichten konnten, und wir werden auch die Unterdrücker in [ROOT.Capital.GetName] vernichten!'\n\n[From.GetLeader] hat alle Versuche der Diplomatie mit unserer Regierung aufgegeben. Die kommunistische Aufgabe, alle Grenzen auszulöschen, konzentriert sich jetzt strikt auf die Auslöschung unserer Grenzen. "
war_justification.208.d:0		"Gibt es eine Gesellschaft, die der Zukunft der Revolution noch mehr zuwider ist, die der Notlage des Arbeiters noch fremder ist, als das faschistische Regime von [ROOT.GetNameDef]? Indem sie das Volk dazu auffordern, sich fanatisch der maroden Institution des Nationalstaates hinzugeben, haben sie uralte Methoden der Grausamkeit in ein modernes Gewand gekleidet und versuchen, sich als alternative Zukunft zum unvermeidlichen internationalen Sieg der Arbeiterklasse zu präsentieren. Es ist nur eine Frage der Zeit, bis sie gegen uns oder unsere Verbündeten zuschlagen. Lasst uns zuerst zuschlagen.'\n\nNiemand hat weniger als gegenseitige Verachtung zwischen uns und der [ROOT.GetAdjective] erwartet, aber die Feindseligkeit hat sich in letzter Zeit verschärft. Wenn man [From.GetLeader] sprechen hört, scheint es, dass es eher früher als später zu einem Konflikt kommen wird. "
