URG_statism_desc:			"Ein klarer und starker Staat mit zentraler Kontrolle über soziale und wirtschaftliche Angelegenheiten ist in diesen Zeiten ein Muss."
MEX_focus_royal_dutch_shell_desc:			"Royal Dutch Shell ist ein britisch-niederländisches Unternehmen, das 60 % der mexikanischen Ölkonzessionen hält. Durch einen Kompromiss mit den ausländischen Ölgesellschaften in der Frage der Arbeitskonflikte können wir eine für beide Seiten vorteilhafte Lösung finden. "
MEX_focus_purchase_belize_desc:			"Dieses kleine Gebiet wurde in der Kolonialzeit lange Zeit von der spanischen Krone beansprucht, jedoch nie von peninsulares besiedelt. Nach dem Verlust des spanischen Kolonialreichs während der napoleonischen Kriege festigte Großbritannien allmählich seinen Einfluss auf das Gebiet, was 1862 in der Gründung der Kolonie Britisch-Honduras gipfelte. Das Gebiet sollte als Geste des guten Willens an Mexiko übergeben werden. "
MEX_focus_triumph_over_the_cristeros:			"Triumph über die Cristeros "
MEX_focus_depoliticised_army_desc:			"Die Generäle haben keinen Anspruch auf die Loyalität ihrer Soldaten. Die letzte Quelle der Legitimität ist der mexikanische Staat. Wir sollten die Generäle daran hindern, an eine Rebellion zu denken, indem wir sie zwischen den Provinzen rotieren lassen, damit sie keine Patronagenetzwerke aufbauen oder sich die persönliche Loyalität ihrer Soldaten sichern können. "
MEX_focus_the_gold_shirts_desc:			"General Nicolás Rodríguez Carrasco gründete 1933 die Goldhemden, um kommunistische Verräter zu bekämpfen, die gegen die Regierung arbeiteten. Die paramilitärische Gruppe sollte ein Flügel der Regierung werden, da ihr Ziel bewundernswert und ihre Methoden notwendig sind. "
ENG_withdraw_from_contested_territories_desc:			"Eine Reihe von Gebieten auf der ganzen Welt, die als Teil der britischen Überseegebiete gelten, werden von Nachbarstaaten beansprucht. Dies führt zu diplomatischen Spannungen, so dass es vielleicht besser wäre, ihren Status als unter britischer Gerichtsbarkeit stehend neu zu bewerten. "
ENG_bermuda_invasion_launch_point_desc:1			"Eine Invasion Nordamerikas wird keine leichte Aufgabe sein. Wir müssen unsere Besitztümer auf den Bermudas ausbauen, um die Invasionstruppe so lange wie nötig aufnehmen zu können, bevor sie dann ausgesandt werden kann, um die Revolution direkt an die amerikanischen Küsten zu bringen. "
HOL_finish_the_noordoostpolder_desc:			"Die 1936 begonnene Polderisierung des an die Provinz Overijssel angrenzenden IJsselmeeres steht endlich vor dem Abschluss. Aber auch danach wird es noch ungenutztes Land sein, das besiedelt und ausgebeutet werden muss.  "
HOL_pre_empt_venezuelan_aggression:			"Der venezolanischen Aggression zuvorkommen  "
HOL_overturn_military_budget_cuts_desc:			"Die Wirtschaft hat sich erstaunlich schnell erholt, nachdem wir den Goldstandard aufgegeben haben... Die Kürzungen im Militärhaushalt, die wir vornehmen mussten, um eine Abwertung des Gulden zu verhindern, können nun rückgängig gemacht werden. "
HOL_volk_en_vaderland:			"Das Volk und das Vaderland populär machen""
HOL_de_jeugdstorm:			"Beginn der Rekrutierung von De Jeugdstorm "
HOL_placate_the_japanese:			"Zugeständnisse an [JAP.GetNameDef] "
HOL_placate_the_japanese_desc:			"Es ist bekannt, dass die [JAP.GetAdjective] es auf unsere wohlhabenden Kolonien im Osten abgesehen haben. Unsere Streitkräfte wären nicht in der Lage, diese Bedrohung abzuwehren. Vielleicht könnten wir ein günstiges Abkommen schließen."
HOL_taking_back_french_flanders:			"Rückeroberung [29.controller.GetAdjective] Flanderns"
HOL_taking_back_french_flanders_desc:			"Die historische Ausdehnung der niederen Länder ist inzwischen von den sie umgebenden Großmächten aufgeteilt worden. Davon besitzt [29.controller.GetNameDef] noch immer eine beträchtliche Menge an Land, das als Teil des historischen Flanderns betrachtet wird. Wir sind jetzt stark genug, um es zurückzuerobern, und das sollten wir auch."
HOL_pre_empt_western_intervention:			"Der westlichen Intervention zuvorkommen "
HOL_oranje_boven:			"Zurück zu Oranje Boven! "
HOL_go_with_britain:			"Mit Großbritannien gehen "
HOL_de_vaarplicht:			"Führt De Vaarplicht wieder ein "
HOL_lead_the_minor_democracies_desc:			"Da die Großmächte unserer Zeit auf einen weiteren Krieg zuzusteuern scheinen, bleibt es den kleinen Demokratien Europas überlassen, die Welt vor dem Brand zu bewahren, wie eine Menschenmenge zwei Kämpfer voneinander fernhält. Wir werden die anderen anführen und einen Block der Neutralität gegen die Kriegstreiber bilden. "
china_warlord_focus:			"Chinesischer Warlord Fokus Baum"
china_nationalist_focus:			"Nationaler Fokus der Republik China "
CHI_labor_reform_desc:1			"Die Methoden und Bräuche der Arbeit in China haben sich über Jahrtausende entwickelt. Es ist an der Zeit, sie in das moderne Zeitalter zu überführen. "
CHI_complete_horgos_hami_road:			"Vollendung der Hargos-Hami-Straße"
CHI_complete_horgos_hami_road_desc:			"Die industrielle Entwicklung unseres Landes wird durch seine unterentwickelte Infrastruktur gebremst. Die Verbindung der westlichen Industriegebiete mit den rückständigen Regionen des Ostens wird den freien Verkehr von Waren und Menschen im Lande ermöglichen."
CHI_give_falkenhausen_citizenship_desc:			"Die deutschen Berater haben sich um den Wiederaufbau und die Modernisierung unseres Militärs verdient gemacht. Wir sollten dafür sorgen, dass sie hier bleiben können, ganz gleich, wie sich die politische Lage entwickeln wird. "
CHI_chinese_general_staff_desc:			"Ein gut organisierter Generalstab ist der Schlüssel zur Planung komplexer Operationen. Wir sollten von dem deutschen Beispiel lernen und eine ähnliche Organisation schaffen. "
CHI_experimental_mechanised_unit:			"Experimentelle mechanisierte Einheit "
CHI_combined_arms_warfare_desc:			"Während Lastwagen für die ersten Experimente in der modernen mechanisierten Kriegsführung gut genug sind, sind sie aufgrund ihrer schlechten Geländegängigkeit und fehlenden Panzerung für den Einsatz an der Front nicht geeignet. "
CHI_elite_mountaineers_desc:			"Die alpine Kriegsführung ist etwas völlig anderes als der Kampf im Flachland. Wir sollten spezialisierte Divisionen in dieser Kunst ausbilden, um unser Terrain optimal zu nutzen. "
CHI_integrate_tibet_desc:			"Das Experiment der [TIV.GetAdjective]-Unabhängigkeit ist vorbei. Eine militärische Invasion ist eine Option, aber wir sollten versuchen, sie mit friedlichen Mitteln wieder in den Schoß zu holen. "
CHI_imperial_legacy_desc:			"China ist seit Jahrtausenden die beherrschende Kraft im Osten und Garant für Frieden und Stabilität in der Region. Es ist an der Zeit, dass wir unsere frühere Position zurückerobern. "
CHI_naval_aviation_desc:			"Die Zukunft der Seekriegsführung ist der Flugzeugträger. Wir werden niemals als echte Seemacht angesehen werden, wenn wir nicht über eigene Flugzeugträger verfügen. "
CHI_modern_submarines_desc:			"Die Japaner sind nicht bereit, uns das technische Wissen zur Verfügung zu stellen, um ihre Flotte in offenen Gefechten herauszufordern, aber sie betrachten die U-Boot-Kriegsführung als einen Hilfsarm. Wir müssen diese Meinung natürlich nicht unbedingt teilen. "
CHI_coastal_patrol_planes_desc:			"Unsere langen Küstenlinien können nur aus der Luft wirksam patrouilliert werden. Moderne Seebomber werden es uns ermöglichen, unsere Küsten zu verteidigen, ohne zu viele Ressourcen zu verbrauchen. "
CHI_refugee_resettlement_desc:			"Die Millionen von verzweifelten und obdachlosen Flüchtlingen, die der Krieg hervorgebracht hat, müssen irgendwo untergebracht werden. Wenn wir ihnen auf unserem Territorium Unterkunft gewähren, können wir sie als Rekrutierungspool für unsere Armee und die Wirtschaft behalten. "
CHI_rural_schooling_desc:			"Eine gut ausgebildete Bevölkerung ist der Schlüssel zur Modernisierung einer Nation. Wir können uns nicht auf eine kleine Handvoll gebildeter Verwaltungsbeamter verlassen, sondern müssen den Geist des Wissens und der Wissenschaft in jedes Dorf tragen. "
CHI_inter_party_coordination_council_desc:			"Ein erster Schritt, um unser Land in eine funktionierende Mehrparteiendemokratie zu verwandeln und die notwendige Bevormundung des Volkes zu beenden, wird eine Organisation sein, die anderen interessierten Parteien die Möglichkeit gibt, bei der Politikgestaltung mitzureden. "
CHI_judicial_yuan_desc:			"Dr. Sun Yat-Sen schwebte eine moderne Republik mit Gewaltenteilung vor. Unsere Justiz muss unabhängig von äußeren Einflüssen sein und Fälle auf der Grundlage des Gesetzes, und nur des Gesetzes, entscheiden. "
CHI_control_yuan_desc:			"Korruption ist in jeder Regierung unvermeidlich. Eine wirksame Regierung muss sich bemühen, sie in Schach zu halten. Wir werden eine separate Regierungsbehörde schaffen, die der Legislative, Exekutive und Judikative gleichgestellt ist. "
CHI_examination_yuan_desc:			"Jahrtausendelang wurden chinesische Bürokraten in strengen Prüfungen ausgewählt. Auch wenn sich die erforderlichen Texte geändert haben mögen, das Prinzip ist dasselbe geblieben. "
CHI_foreign_threats_desc:			"Vor ein paar Jahren haben uns die Japaner die Mandschurei entrissen und einen Marionettenstaat geschaffen. Sie werden nicht aufhören, bis sie ganz China unterjocht haben. Wir müssen bereit sein, ihnen die Stirn zu bieten, auch wenn das bedeutet, dass wir mit lokalen Machthabern paktieren müssen. "
CHI_unified_industrial_planning_desc:			"Unser aggressives Programm der Industrialisierung darf nicht aufgeschoben werden. "
CHI_expand_the_academica_sinica_desc:			"Seit Jahrtausenden ist China weltweit führend in der Entwicklung von Kunst und Wissenschaft. Die Aufstockung der Mittel für unsere Universitäten ist nur der erste Schritt, um diese Position zurückzuerobern. "
PRC_strengthen_the_central_secretariat_desc:			"Nach dem Langen Marsch müssen wir unsere politische Organisation umgestalten, um einen Staat zu schaffen, der mit den Nationalisten konkurrieren kann. "
PRC_soviet_economic_aid_desc:			"Die Verwüstungen des Langen Marsches wären ohne Hilfe von außen erst nach Generationen zu überwinden. Wir sollten uns an die Sowjets wenden und um wirtschaftliche Hilfe bitten. "
PRC_internationalism_desc:			"Die Arbeiter und Bauern der Welt müssen sich vereinen, um ihre Fesseln abzustreifen. Schulter an Schulter werden wir eine bessere Zukunft aufbauen. "
PRC_agrarian_socialism_desc:			"China ist nicht wie die Industrienationen der Welt. Wer eine kommunistische Revolution erwartet, wie Marx sie sich vorstellte, verkennt die Lage, in der sich unser Land befindet. "
PRC_socialism_with_chinese_characteristics:			"Sozialismus mit chinesischen Merkmalen "
GER_improve_the_logistics_system:			"Verbesserung des Logistiksystems"
SWE_revoke_anti_militia_laws:		"Anti-Milizen-Gesetze aufheben "
SWE_hemvarnet:		"Hemvärnet"
SWE_hemvarnet_desc:		"Die Idee der Nationalgarde, oder Hemvärnet, ist eine, die wir ausbauen müssen. Sollten wir angegriffen werden, müssen wir in der Lage sein, schnell eine größere Armee zu mobilisieren, um die Eindringlinge zurückzuschlagen. "
SWE_rationing:		"Rationierung"
SWE_rationing_desc:		"Auch wenn die Vorstellung, Lebensmittel und Wasser rationieren zu müssen, nicht gerade aufregend ist, so ist es doch wichtig, dass jeder weiß, wie man richtig rationiert, wenn wir angegriffen werden und unser Zugang zum Handel mit der Außenwelt abgeschnitten ist. "
NORDIC_nuclear_research:		"Nukleare Forschung "
ETH_african_central_bank_2_tt:0		"$MODIFIER_STABILITY_FACTOR$: §R-5%§! \n$modifier_production_speed_industrial_complex_factor$: §R-10%§! \n$modifier_production_speed_infrastructure_factor$: §R-10%§! "
ITA_balkan_ambition:0		"Forderungen an Jugoslawien "
ITA_setting_course:0		"Kurs setzen  "
ITA_mafia_abroad:0		"Mafia im Ausland  "
ITA_liberate_the_workers_of_africa:0		"Befreit die Arbeiter in Afrika  "
SWI_national_redoubt_desc:0		"Henri Guisan schlägt einen anderen Weg vor, um [ROOT.GetName] zu verteidigen. Anstatt zu versuchen, die Grenzen unseres Landes um jeden Preis zu verteidigen, können wir das Schweizer Mittelland strategisch abtreten und uns in die Alpen zurückziehen, wo wir es dem Feind teuer machen können, uns zu besetzen.  "
SWI_adopt_romansh_desc:0		"[ROOT.GetName] ist kein Land, das aus [GER.GetAdjective], [FRA.GetAdjective] und [ITA.GetAdjective] Regionen besteht, die von unseren gierigen Nachbarn beansprucht werden können. [ROOT.GetName] ist eine einzige, unteilbare multikulturelle Nation. Die Annahme von Rumantsch, einer Sprache, die nur in den Bergen unserer [ROOT.GetAdjective] Alpen gesprochen wird, wird ihnen zeigen, dass unsere Kultur und unsere Werte sich von ihren unterscheiden, unabhängig von der Sprache.  "
SWI_citizen_supply_mandate_desc:0		"Wir wissen nicht, wie eine Invasion ablaufen würde, und selbst wenn wir uns auf ein zentralisiertes Versorgungsnetz verlassen könnten, ist das mit unserer Kommandostruktur nicht vereinbar. Deshalb muss jeder [ROOt.GetAdjective] Haushalt einen Vorrat von mindestens 2 Monaten im eigenen Haus lagern, sowohl für sich selbst als auch für die lokalen Milizen.  "
SWI_take_a_stance_desc:0		"Der faschistische [?SWI_biggest_fascist.GetNonIdeologyName] besitzt das ekelhafteste und miserabelste politische System. [?SWI_biggest_fascist.GetNameDefCap] ist der Todfeind des neuen [ROOT.GetName]; deshalb müssen wir uns wehren und unsere Demokratie mit allen Mitteln verteidigen. "
GRE_open_foreign_subsidized_factories_tt:0		"Eine §YMilitärische Fabrik§! und eine §YZivile Fabrik§! wird für jedes der folgenden Länder hinzugefügt, das sich nicht in einem Bürgerkrieg§! befindet und eine §YMeinung§! von §YGriechenland§! hat, die größer ist als §G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, und §Y[SOV.GetNameDef]§!.  "
GRE_bedrock_of_balkan_financial_stability_tt:0		"Wir erhalten eine §YCivilian Factory§! für jedes Startland im §YWestlichen Balkan§!, dem §YÖstlichen Balkan§! und dem §YNördlichen Balkan§!, das mehr als §Y50§! §Yopinion§! von uns hat. Dies gilt auch für §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, und §Y[TUR.GetNameDef]§!. "
SMB_navy_default:		"Marineproduktion erneuern  "
CHL_expand_the_forestry_decision_tt:		"Schaltet Entscheidungen zu §YAusbau der Forstwirtschaft§! in §Y[1063.GetName]§! und §Y[279.GetName]§! frei. \n "
CHL_found_national_steelworks_tt:		"Schaltet die Entscheidung §Y$CHL_expand_araucanian_steelworks_decision$§! frei, mehr §YSteel§! in §Y[1063.GetName]§! zu gewinnen  "
CHL_propose_closer_cooperation_desc:		"Die kommunistischen Staaten in unserer Umgebung teilen zwar unsere Ideologie, aber sie sind strategisch verstreut und haben keine Koordination. Wir sollten sie unter unsere Fittiche nehmen und helfen, sie besser zu führen. "
CHL_align_with_the_russian_soviet:		"Sich mit den [SOV.GetAdjective]s verbünden "
CHL_enforce_the_chilean_identity_tt:		"Wenn der nationale Geist §Y$CHL_ancestral_mapuche_resistance$§! entfernt ist, gewinne den Kern auf [1063.GetName] zurück.  "
BRA_anaue_tt:		"Schaltet Entscheidungen zur Rekrutierung von Integralisten-Milizdivisionen in Staaten frei, nachdem ihr dort Kundgebungen abgeschlossen habt. \nRekrutiert einen neuen General mit der Eigenschaft §Y$militias_officer$§!: \n Verteidigung der Miliz §G+5%§! \n Geschwindigkeit der Miliz §G+5%§! \n Organisation der Miliz §G+5%§!  "
ARG_maintain_neutrality:		"Neutralität aufrechterhalten "
ARG_end_operation_bolivar_desc:		"Wir haben einen kontinuierlichen Strom von Spionagemissionen entdeckt, die von der [GER.GetName] ins Land geschleust wurden. Sie nannten dies scherzhaft ‚Operation Bolívar‘. Das ist inakzeptabel, und wir müssen sofort alle [GER.GetAdjective] Operationen in [ARG.GetName] stoppen. "
ARG_conquer_paraguay:		"Erobern Sie [PAR.GetName] "
ARG_reach_out_to_the_soviet_union:		"Erreichen Sie die [SOV.GetAdjective] "
ARG_reach_out_to_the_soviet_union_tt:		"Wenn wir uns darauf konzentrieren, wird die §YVanguardia Socialista§!-Divisionsvorlage freigeschaltet, wenn der §YBürgerkrieg§! ausbricht, und wird §Yfünf§! Vanguardia Socialista-Einheiten in §Y[1067.GetName]§! rekrutieren. "
ARG_unite_the_workers_of_argentina_desc:		"Wenn wir [ARG.GetNameDef] zum Besseren verändern wollen, müssen wir das Proletariat unserer Nation davon überzeugen, dass radikale Verbesserungen notwendig sind, um ihr Leiden zu beenden. Lasst uns die Arbeiter aller Berufe vereinen und der Regierung zeigen, dass der Status quo beendet werden muss!  "
ARG_a_red_south_america:		"Ein rotes Südamerika "
ARG_unify_south_america:		"Vereinigt Südamerika "
GUAY_rekindle_old_gripes_ARG_PAR_tt:		"Wenn wir §Y[1069.GetName]§! innerhalb von §Y365 Tagen§! nach Ausbruch des Krieges kontrollieren, wird [ARG.GetName] den Frieden weiß machen müssen oder einen katastrophalen Moralverlust erleiden.  "
GUAY_national_academy_of_sciences_3:		"Universitäten für alle auf dem ganzen Kontinent "
PAR_request_weapons:		"Fordern Sie [USA.GetAdjective] Waffen an "
PAR_purge_the_military_of_dissent:		"Säubert das Militär von Andersdenkenden "
URG_brou:		"Banco de la República Oriental del Uruguay "
URG_pluna_desc:		"Primeras Líneas Uruguayas de Navegación Aérea "
URG_establish_the_german_uruguayan_cultural_center:		"Ermächtigung des [GER.GetAdjective]-[URG.GetAdjective] Kulturzentrums  "
URG_break_diplomatic_relations_with_the_axis_desc:		"Obwohl sie ihre Neutralität erklärt haben, ist klar geworden, dass die Achse nicht länger toleriert werden kann. Die Winde des Krieges sind strikt zugunsten der Alliierten, und es ist nicht ratsam, auf der Verliererseite zu stehen. "
URG_legacy_of_batlle_desc:		"Der Schatten der Präsidentschaft von José Batlle y Ordóñez liegt weiterhin auf Uruguay und prägt die Innen- und Außenpolitik des Landes. Als Architekt weitreichender sozialer und wirtschaftlicher Reformen legte Batlle den Grundstein für einen modernen Wohlfahrtsstaat und förderte eine Kultur des Progressivismus und der staatlichen Intervention. Dennoch ist sein Erbe nicht unumstritten. Während viele für seine Vision eines demokratischen und egalitären Uruguay eintreten, sehen andere seine Politik als Ursache für wirtschaftliche Stagnation und politische Instabilität... "
URG_statism_desc:		"Ein klarer und starker Staat mit zentraler Kontrolle über soziale und wirtschaftliche Angelegenheiten ist in diesen Zeiten ein Muss."
MEX_focus_royal_dutch_shell_desc:		"Royal Dutch Shell ist ein britisch-niederländisches Unternehmen, das 60 % der mexikanischen Ölkonzessionen hält. Durch einen Kompromiss mit den ausländischen Ölgesellschaften in der Frage der Arbeitskonflikte können wir eine für beide Seiten vorteilhafte Lösung finden. "
