CZE_sudeten_german_quandary_modifier_tt:	" §YPassiver Effekt§!:\nWenn §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! oder ein anderes (z. B. [BAY.GetFlag] [SAX.GetFlag]) §Ydeutsches Land§!, das an uns grenzt, rechtfertigt oder erhält ein §RKriegsziel§! gegen uns, während entweder §Y[69.GetName]§!, §Y[1078.GetName]§! oder §Y[74.GetName]§! von uns kontrolliert werden:\n - (§YAlle kontrollierten Sudetenstaaten§!):\n    Füge §Y$CZE_sudetenland_paramilitaries_modifier$§! hinzu, was Folgendes gewährt: \n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10 %§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-1 0,0 %§!\n       $modifier_state_repair_speed_bunker_factor$: §R -10,00 %§!\n\n - Dieser §YEffekt§! kann nur einmal auftreten"
