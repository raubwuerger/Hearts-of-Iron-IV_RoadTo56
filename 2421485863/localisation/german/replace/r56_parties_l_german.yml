marhaenism:0			"Marhaenismus"
marhaenism_desc:0			"Das frühe 20. Jahrhundert brachte zahlreiche Veränderungen in der politischen Landschaft Ostindiens mit sich. Die Ethische Politiek schuf eine neue Klasse einheimischer indonesischer Intellektueller, die Boemipoetras, und damit einhergehend die Suche nach einer neuen nationalen Identität, um sich sowohl von den Niederländern als auch von den früheren regionalen Nationalisten abzugrenzen. Vieles war bereits vorhanden, wie der Islamismus und sogar der Marxismus, aber sie waren entweder zu radikal in ihren eigenen Kämpfen, was die mehrheitlich verwestlichten Boemipoetras entfremdete, oder zu vage in ihren Prämissen. \n\n Im Jahr 1926 formulierte ein junger Archithektur-Absolvent namens Soekarno seine eigene politische Theorie, die die drei wichtigsten ideologischen Strömungen der Bömipoetras, den säkularen §ONationalismus§!, den §GIslam§!, und §YMarxismus§! - die Soekarno seit seiner Jugend beeinflusst hatten - zu einer verbindlichen Ideologie der Indonesier zusammenfasste, die er §YMarhaenismus§! nannte, den indonesischen Sozialismus in der Praxis."
neutrality:0			"Autoritär"
neutrality_noun:0			"Autoritarismus"
neutrality_desc:0			"Autoritäres Regime"
despotism:0			"Zivile Diktatur"
despotism_desc:0			"§Als die alte monarchistische Ordnung Europas der neuen Ära des Republikanismus Platz machte, nahm sie die Autokratie nicht mit, und in einigen Nationen wurden die alten monarchistisch-absolutistischen Regime lediglich durch neue §YCivilian Dictatorships§! ersetzt. \n\nDie Besonderheiten der zivilen Diktaturen sind von Land zu Land verschieden, doch die meisten sind dadurch gekennzeichnet, dass der Diktator seine Macht nicht auf den Einsatz des Militärs stützt, sondern mit den Befugnissen regiert, die ihm von einer Verfassung verliehen werden§!."
oligarchism:0			"Oligarchismus"
oligarchism_desc:0			"§Da derjenige, der die Lebensmittel kontrolliert, auch das Volk kontrolliert, gibt es den Oligarchismus als Regierungsform schon seit den ersten menschlichen Zivilisationen.\n\nOligarchismus ist keine definierte Ideologie, so dass die Art und Weise, wie er ausgeübt wird, von Land zu Land variiert, aber er ist in der Regel dadurch gekennzeichnet, dass eine Gruppe einflussreicher Persönlichkeiten die Nation mit nahezu diktatorischen Befugnissen anführt§!.§!\n"
conservatism:0			"Demokratischer Konservatismus"
conservatism_desc:0			"§Als die Ereignisse der Amerikanischen und der Französischen Revolution eine Schockwelle durch die westliche Welt schickten, gab es viele, die sich immer noch gegen eine radikale Veränderung der gesellschaftlichen Ordnung wehrten. Die Werke von Persönlichkeiten wie Edmund Burke und Joseph de Maistre, die sich der neuen liberalen Ordnung entgegenstellten, sollten sich später in der Ideologie des Konservatismus konsolidieren§!. \n\nAls §9reaktionäre§! Ideologie unterscheiden sich die Besonderheiten der konservativen Bewegungen von Land zu Land, doch die Hauptprinzipien des Konservatismus drehen sich in der Regel um die §3Erhaltung zahlreicher Institutionen§! wie §2organisierte Religion§!, den §2Nationalstaat§! und die §2Kernfamilie§!.§!n"
liberalism:0			"Liberalismus"
liberalism_desc:0			"§Als die Aufklärung im Westen immer mehr an Popularität gewann, endeten auch die alten Normen des Erbprivilegs, der Staatsreligion und der göttlichen Monarchen. Die neue Ideologie des Liberalismus, die aus dem Chaos der Amerikanischen und der Französischen Revolution hervorging, breitete sich in ganz Europa aus, als die alten Monarchien eine nach der anderen gestürzt wurden. \n\nDer Liberalismus vertrat die Ansicht, dass der Zweck des Staates nicht darin bestand, als verlängerter Arm des Monarchen zu dienen, sondern die Freiheiten der Bevölkerung zu schützen. Er stellte die alte konservative und autoritäre Weltordnung in Frage und vertrat die Ansicht, dass jeder Mensch natürliche Rechte auf Leben, Freiheit und Wohlstand hat."
socialism:0			"Die Sozialdemokratie"
socialism_desc:0			"§Als die radikale Politik des Marxismus bei vielen europäischen Sozialisten in Ungnade fiel, lösten sich einige führende sozialistische Persönlichkeiten wie Moses Hess und Eduard Bernstein von der aggressiven revolutionären Haltung von Marx und konsolidierten ihre Sicht des Sozialismus in einer neuen Ideologie, die sie §YSoziale Demokratie§! nannten.\n\n Im Gegensatz zum Marxismus glaubten die Befürworter der Sozialdemokratie, dass ein §Rsozialistisches System§! durch §3graduelle Reformen§! der maroden europäischen Monarchien erreicht werden könnte. In ihren Augen konnte eine inhärent revolutionäre Ideologie keinen Bestand haben und nur weitere Revolutionen anheizen. Daher konnte wahre Gleichheit nur durch ein funktionierendes demokratisches System überleben.§!\n"
marxism:0			"Marxismus"
marxism_desc:0			"§A Während die Flammen des Völkerfrühlings in ganz Europa loderten, veröffentlichte ein an der Revolution beteiligter deutscher Sozialist namens Karl Marx inmitten des Chaos das Kommunistische Manifest. In diesem Werk, das zu einem der einflussreichsten Bücher des Jahrhunderts werden sollte, schrieb Marx die Grundlage der Ideologie nieder, die später den Namen Marxismus erhielt. In radikaler Abkehr von der liberalen Volksbewegung, die Europa seit der Französischen Revolution beherrscht hatte, plädiert der Marxismus dafür, die Geschichte durch die Brille des Klassenkampfes zu betrachten, und glaubt, dass die vielen Konflikte in der europäischen Geschichte als Kampf zwischen den unteren und oberen Klassen der Gesellschaft erklärt werden können. Als solcher tritt der Marxismus für die §Revolutionäre Umwandlung der Gesellschaft§! in eine Gesellschaft mit §RGemeineigentum an den Produktionsmitteln§! ein."
leninism:0			"Leninismus"
leninism_desc:0			"§Als die Trommeln an der Ostfront des Großen Krieges verstummten, begannen die inneren Konflikte im besiegten Russland erst. Nach einem Putsch gegen die kaiserliche Regierung im Februar 1917 sollten Wahlen abgehalten werden. Die Bolschewiki von Wladimir Lenin verloren jedoch die Wahl gegen die agrarsozialistische Sozialrevolutionäre Partei von Viktor Tschernow. Unzufrieden mit dem Ergebnis putschten die Bolschewiki die Regierung und versuchten, die neue Sowjetunion als Einparteienstaat zu regieren und vollendeten damit die Transformation der Revolution vom Marxismus zum Jeninismus. \n\nIn Abgrenzung zu den älteren sozialistischen Ideologien tritt der Leninismus dafür ein, dass der §Revolutionäre Staat§! von einer §Revolutionspartei§! regiert wird, die eine §Rdiktatur des Proletariats§! bildet.§!\n"
stalinism:0			"Stalinismus"
stalinism_desc:0			"§Mit dem Ende des Regimes von Lenin nach dessen Tod war die Zukunft der neuen Sowjetunion ungewiss. Als Generalsekretär der Union nutzte der georgische Bolschewik Joseph Stalin seine Macht, um seine Loyalisten in Machtpositionen zu bringen und seine Herrschaft durch eine neue totalitäre Ideologie zu zementieren, die später §YStalinismus§! genannt wurde. \n\nEine noch autoritärere Form des Leninismus, der Stalinismus, der von Stalins extremer Paranoia geprägt war, fördert die gewaltsame §8Säuberung der Gesellschaft von Bedrohungen, die der Staat§! als revisionistisch ansieht, durch Massenverhaftungen und Schauprozesse. Er befürwortet auch die §Rasche Industrialisierung§! der Nation und den §Rmilitanten Atheismus§!.§!\n"
anti_revisionism:0			"Anti-Revisionismus"
anti_revisionism_desc:0			"Als Reaktion auf die vielen Ideologien, die behaupten, Nachfolger des Marxismus zu sein, tritt §YAnti-Revisionismus§! für die Beibehaltung von Schlüsselelementen der ursprünglichen revolutionären Theorie ein. Die Ideologie wendet sich vor allem gegen die Einbeziehung kapitalistischer Wirtschaftselemente in sozialistische Staaten und definiert sich ebenso sehr durch das, was sie nicht ist, wie durch das, was sie ist."
anarchist_communism:0			"Anarchistischer Kommunismus"
anarchist_communism_desc:0			"Eine Ideologie, die die Idee des Kommunismus als staatenlose Gesellschaft vertritt. Der Anarchokommunismus lehnt das Konzept eines sozialistischen Übergangsstaates ab und befürwortet eine Gemeinschaft, die auf freiwilligen Vereinigungen und gegenseitiger Hilfe beruht."
nazism:0			"Nationaler Sozialismus"
nazism_desc:0			"§APreußen und später Deutschland als Ganzes waren lange Zeit stolz auf ihre militärische Überlegenheit und ihre Tradition, und diese Werte wurden zu einem integralen Bestandteil der Kultur des Deutschen Reiches. Als die alliierten Armeen nach der Niederlage im Ersten Weltkrieg in ein geschlagenes und zerschlagenes Deutschland einmarschierten, konnten viele Nationalisten einfach nicht akzeptieren, dass das einst große Deutschland verloren hatte. Die Wut und der Hass, die im deutschen Volk verankert waren, wurden von einem ehemaligen Soldaten namens Adolf Hitler genutzt, der sie in eine der extremsten Ideologien verwandelte, die es je gab - den §YNationalen Sozialismus§!.\n\nDer Nationalsozialismus wurzelt in §8extremem Nationalismus§! und wird von den Ideen der §8Rassischen Vorherrschaft§! angetrieben. Er fördert §8aggressiven Expansionismus§!, §8Pan-Germanismus§! und einen §Rtotalitären Staat§!, in dem das Volk unter einem Führer mit absoluter Macht, dem §WFührer§!, vereint ist.§!\n"
fascism_ideology:0			"Faschismus"
fascism_ideology_desc:0			"§Als die Waffen an der italienischen Front des Ersten Weltkriegs schwiegen, warfen viele Nationalisten den westlichen Alliierten vor, Italien in den Rücken zu fallen, da die Nation viele der Gebiete, für die sie gekämpft hatte, nicht erhalten hatte. Dies führte dazu, dass ein ehemaliger Sozialist namens Benito Mussolini zu einer neuen rechtsextremen Ideologie aufstieg, die er §YFascism§!\n\n nannte. Als Ideologie lehnt der Faschismus die Globalisierung der Welt ab und betrachtet stattdessen Imperialismus und Krieg als Mittel zur §8nationalen Verjüngung§!. Infolge dieser extremen Förderung des §8Autoritarismus und des Nationalismus§! fördern viele Abspaltungen des Faschismus auch die Diskriminierung und Gewalt gegen bestimmte ethnische Gruppen, die als Andere angesehen werden.§!\n"
falangism:0			"Falangismus"
falangism_desc:0			"Eine autoritäre Ideologie mit Zügen des Faschismus und des Konservatismus. Der §YFalangismus§! legt Wert auf nationale und §RKatholische Identität§!."
rexism:0			"Rexismus"
rexism_desc:0			"Der §YRexismus§!, der sich sowohl gegen liberale als auch gegen kommunistische Ideale wendet, ist eine streng konservative nationalistische§! Bewegung, die eine korporatistische§! Wirtschaftspolitik befürwortet. Mit einer zunehmend populistischen und autoritären Rhetorik nähern sich ihre Ideale anderen faschistischen Bewegungen an."
moderatism:1			"Nationaler Liberalismus"
moderatism_desc:1			"§Als die Aufklärung im Westen mehr und mehr an Popularität gewann, endeten auch die alten Normen des Erbprivilegs, der Staatsreligion und der göttlichen Monarchen. Die neue Ideologie des Liberalismus, die aus dem Chaos der Amerikanischen und der Französischen Revolution hervorging, breitete sich in ganz Europa aus, als die alten Monarchien eine nach der anderen gestürzt wurden. \n\nIn dem Glauben, dass der Staat nicht als verlängerter Arm des Monarchen dienen sollte, sondern vielmehr die Freiheiten der Bevölkerung§! schützen sollte, forderte der Liberalismus die alte konservative und autoritäre Weltordnung heraus und stellte fest, dass jeder Mensch §Ynatürliche Rechte§! auf §3Leben§!, §3Freiheit§! und §3Wohlstand§! hat. \n\n§YNationaler Liberalismus§!, eine Erweiterung der liberalen Ideologie, teilt die meisten seiner Werte mit dem Mainstream-Liberalismus, fördert jedoch auch §8Nationalismus§! und ist militaristischer als sein Gegenstück.§!\n"
centrism:1			"Zentrismus"
centrism_desc:1			"§YCentrism§! ist eine Regierungsform, die §Ycommon-sense solutions§! anstrebt, die aktuelle und zukünftige Bedürfnisse angemessen berücksichtigen, §Hpublic trust§! unterstützen und dem §Hcommon good§! dienen, wobei Risiken und Kapazitäten im Zusammenhang mit diesen Bedürfnissen berücksichtigt werden."
controlled_democracy:0			"Kontrollierte Demokratie"
controlled_democracy_desc:0			"§Als die Revolutionen in der Welt die alte monarchistische Ordnung stürzten, versprachen sie, Freiheit und Demokratie mit sich zu bringen. Diese neu entstandenen Demokratien waren instabil, was dazu führte, dass viele einflussreiche Gruppen das Chaos nutzten, um sich autoritäre Machtbefugnisse zu sichern und ihr Regime allmählich in eine §YKontrollierte Demokratie§!\n\n Auf den ersten Blick sieht eine Kontrollierte Demokratie genauso aus wie jede andere Demokratie, Ein kurzer Blick zeigt jedoch, dass die herrschende Partei einen §großen Einfluss auf die Medien des Landes hat§! und §die Redefreiheit einschränkt§!. Es mögen Wahlen abgehalten werden, aber das Ergebnis wird die herrschende Partei und die Regierung des Landes nie stark beeinflussen. §!\n"
