l_german:
POR_lackluster_armed_forces:0	"Schwache Streitkräfte"
POR_lackluster_armed_forces_desc:0	"Die katastrophale Intervention im Ersten Weltkrieg und die aus Spargründen vorgenommenen Ausgabenkürzungen haben dazu geführt, dass die portugiesischen Streitkräfte nicht in der Lage sind, die Nation zu verteidigen. Während die Uhr weiter tickt und die Konflikte rund um den Globus immer heißer werden, müssen wir entweder die Mängel unseres Militärs beheben oder alles tun, um es von den Fronten fernzuhalten."
POR_disgruntled_republicans:0	"Verärgerte Republikaner"
POR_disgruntled_republicans_desc:0	"Liberale und Sozialisten in ganz Portugal haben deutlich gemacht, dass sie nicht bereit sind, mit unseren Plänen für die Nation zusammenzuarbeiten. Obwohl sie im Moment bei weitem nicht unsere einzige Sorge sind, hängt die Rückkehr Portugals zur Stabilität davon ab, dass wir diese revolutionären Kräfte zerschlagen, bevor ihre eigenen Versuche, uns zu vernichten, Früchte tragen."
POR_austerity_measures:0	"Sparmaßnahmen"
POR_austerity_measures_desc:0	"Trotz der Großen Depression hat Salazars Finanzpolitik die portugiesische Wirtschaft von der Verschuldung bei den Briten oder Amerikanern befreit, allerdings auf Kosten unseres Lebensstandards und vieler staatlicher Dienstleistungen. Auch wenn sie zweifelsohne erfolgreich war, wird sich bald zeigen, ob wir diese Politik fortsetzen sollen."
POR_towards_a_greater_portugal:0	"Auf dem Weg zu einem Größeren Portugal"
POR_towards_a_greater_portugal_desc:0	"Trotz des jahrhundertelangen Niedergangs des Imperiums hat das Werk der portugiesischen Entdecker unglaubliche Spuren in der Welt hinterlassen. Da sich das Weltgeschehen ständig verändert, ist jetzt vielleicht unsere größte Chance, Lissabons Einfluss in der Welt wiederherzustellen!"
POR_unshackle_galicia:0	"Lösen Sie die Fesseln von Galicien"
POR_unshackle_galicia_desc:0	"Trotz der jahrhundertelangen Vorherrschaft Madrids hat die historische Region Galicien weitaus mehr von ihrer Sprache und Kultur mit dem portugiesischen Volk gemein. Spaniens Abstieg in den Wahnsinn ist zu weit gegangen und hat die Sicherheit und das Leben unserer Brüder zum letzten Mal in Frage gestellt!"
POR_integrate_galicia:0	"Integrieren Sie Galicien"
POR_integrate_galicia_desc:0	"Wir haben den Menschen in Galicien gezeigt, dass sie unter der weisen Führung unserer Nation am besten aufgehoben sind. Wir werden nicht länger warten, um die Provinz in unser [ROOT.GetAdjective] Vaterland zu integrieren!"
POR_restore_the_iberian_union:0	"Stellen Sie die Iberische Union wieder her"
POR_restore_the_iberian_union_desc:0	"Viele Jahrhunderte sind vergangen, seit das portugiesische Volk unter der brutalen Knute Madrids saß. Nachdem die Revolution im eigenen Land gewonnen wurde, haben wir jetzt die größte Chance, uns mit unseren iberischen Brüdern zu vereinen, denen wir alle so ähnlich sind."
POR_gains_claims_on_all_spanish_states_in_europe_tt:0	"Erhebt Anspruch auf alle §YSpanischen§! Staaten in Europa."
POR_restore_the_iberian_union_tt:0	"Schaltet die §YIntegration des spanischen Inneren§! Entscheidungen frei. "
POR_relocate_the_capital_to_madrid:0	"Verlegen Sie die Hauptstadt nach Madrid"
POR_relocate_the_capital_to_madrid_desc:0	"Madrid, die alte spanische Hauptstadt, liegt im Herzen der kastilischen Länder und befindet sich im Zentrum unserer neuen Union. Diese Faktoren machen sie zu einem logischen Ort für unsere neue Verwaltungshauptstadt."
POR_restore_basque_regional_autonomy:0	"Baskische regionale Autonomie wiederherstellen"
POR_restore_basque_regional_autonomy_desc:0	"Obwohl sie lange Zeit unter der Fuchtel Madrids standen, haben sich die baskischen Regionen in ganz Spanien den Assimilierungsbemühungen widersetzt. Den Basken die Autonomie zu gewähren, die sie sich wünschen, würde ihre Integration in eine wahrhaft pan-iberische Nation erheblich beschleunigen."
POR_restore_catalan_regional_autonomy:0	"Wiederherstellung der regionalen Autonomie Kataloniens"
POR_restore_catalan_regional_autonomy_desc:0	"Trotz ihrer vielen Ähnlichkeiten mit den Spaniern und Portugiesen gibt es eine starke katalanische Identität, die einen weiteren zentralisierten Staat fürchtet, der ihre Kultur und Geschichte nur unterdrücken würde. Unser Kampf wurde nicht gewonnen, nur um unsere Brüder auf der Halbinsel zu entfremden!"
POR_reorganize_the_spanish_administration:0	"Reorganisieren Sie die spanische Verwaltung"
POR_reorganize_the_spanish_administration_desc:0	"Jetzt, da die Stabilität auf der Halbinsel wiederhergestellt ist, ist es endlich an der Zeit, den verbliebenen Widerstand zu brechen und die Verwaltung als Teil unserer eigenen zu festigen!"
POR_reorganize_the_spanish_administration_tt:0	"Kontrolliert und hat mindestens 30% Zustimmung in allen Staaten des Festlandes §YSpanish§!"
POR_organize_elections_in_the_hispanic_regions:0	"Organisieren Sie Wahlen in den hispanischen Regionen"
POR_organize_elections_in_the_hispanic_regions_desc:0	"Die Sicherung unserer Kontrolle über die spanischen Ländereien muss nicht mit brutaler Gewalt erfolgen. Wir werden unsere hispanischen Brüder in unsere große, wiederbelebte Demokratie einladen!"
POR_organize_elections_in_the_hispanic_regions_tt:0	"Kontrolliert und hat mindestens 25% Zustimmung in allen §YSpanish§! Staaten des Festlandes"
POR_repudiate_the_1890_british_ultimatum:0	"Lehnen Sie das britische Ultimatum von 1890 ab"
POR_repudiate_the_1890_british_ultimatum_desc:0	"Das britische Ultimatum von 1890 war eine nationale Tragödie für alle in unserem plurikontinentalen Reich. Jetzt haben wir die Chance, unsere afrikanischen Besitztümer endlich wieder zu verbinden!"
POR_continue_the_naval_expansion:0	"Setzen Sie die Marineexpansion fort"
POR_continue_the_naval_expansion_desc:0	"Obwohl die [ROOT.GetAdjective] Marine nach dem Ersten Weltkrieg ausgebaut wurde, sind die Bemühungen aufgrund der Auswirkungen der Großen Depression weitgehend eingestellt worden. Da sich unsere Wirtschaft weitgehend erholt hat, sollten wir den Ausbau der portugiesischen Flotte fortsetzen, bis sie eine Streitmacht ist, die unsere Interessen verteidigen kann."
POR_expand_naval_production:0	"Ausweitung der Marineproduktion"
POR_expand_naval_production_desc:0	"Trotz ihrer jahrhundertelangen Geschichte als herausragende Seemacht ist die [ROOT.GetAdjective] Marine vielen potenziellen Feinden unserer Nation zahlen- und waffenmäßig unterlegen. Wir sollten Mittel bereitstellen, um die portugiesische Marineindustrie wieder auf den Stand zu bringen, den sie braucht!"
POR_expand_the_alfeite_shipyard:0	"Erweitern Sie die Alfeite-Werft"
POR_expand_the_alfeite_shipyard_desc:0	"Die portugiesische Alfeite-Werft gehört zu den besten Marineproduzenten des Landes. Der weitere Ausbau unserer Marineproduktion muss auch die Stärkung dieser wichtigen Werft beinhalten."
POR_expand_northern_repair_facilities:0	"Nördliche Reparatureinrichtungen ausbauen"
POR_expand_northern_repair_facilities_desc:0	"Die nördlichen Provinzen Portugals beherbergen Reparaturanlagen für die Marine, die in einem Krieg, an dem unsere Marine beteiligt wäre, von entscheidender Bedeutung wären. Wir sollten tun, was wir können, um sie auszubauen."
POR_modernize_lisbons_naval_academy:0	"Modernisieren Sie die Marineakademie in Lissabon"
POR_modernize_lisbons_naval_academy_desc:0	"Wenn wir wieder zu einer Seemacht werden wollen, müssen wir uns wie keine andere Nation um die Seekunst kümmern. Lissabon soll wieder zu einem Ort des Prestiges und des Marinestolzes werden!"
POR_experiment_with_radar:0	"Experimentieren Sie mit Radar"
POR_experiment_with_radar_desc:0	"Obwohl das Radar noch in den Kinderschuhen steckt, hat es sich sowohl für zivile als auch für militärische Zwecke als äußerst vielversprechend erwiesen. Während sich die Welt wieder einmal aufheizt, besteht kein Zweifel daran, dass das Radar Portugal vor allem schützen wird, was es bedroht."
POR_expand_the_merchant_fleet:0	"Die Handelsflotte ausbauen"
POR_expand_the_merchant_fleet_desc:0	"Der Große Krieg hat aus erster Hand gezeigt, welche unglaubliche Zerstörung der U-Boot-Krieg für den internationalen Handel bedeuten kann. Wir müssen sicherstellen, dass die [ROOT.GetAdjective] Handelsflotte bereit ist, solchen Störungen zu begegnen."
POR_anti_submarine_weaponry:0	"Anti-U-Boot-Waffen"
POR_anti_submarine_weaponry_desc:0	"Die Technologie zur U-Boot-Bekämpfung hat seit den Tagen des Großen Krieges große Fortschritte gemacht. Wir sollten unsere Marine in diesem Sinne modernisieren."
POR_study_italian_submarines:0	"Studieren Sie italienische U-Boote"
POR_study_italian_submarines_desc:0	"Die italienische Marine hat sich stark entwickelt, obwohl sie wirtschaftlich nicht mit Deutschland oder Großbritannien mithalten kann. Ihr Modell könnte vielleicht ähnliche Ergebnisse für uns zeigen."
POR_the_future_of_naval_deterrence:0	"Die Zukunft der maritimen Abschreckung"
POR_the_future_of_naval_deterrence_desc:0	"Unsere Marine ist zahlenmäßig nicht in der Lage, die Bedrohungen zu bekämpfen, die ein größerer Nachbar für uns darstellen könnte. Neue Technologien, insbesondere die Verlegung von Seeminen, könnten sicherlich zur Verteidigung unseres Landes eingesetzt werden."
POR_restore_our_high_seas_presence:0	"Unsere Präsenz auf hoher See wiederherstellen"
POR_restore_our_high_seas_presence_desc:0	"Portugal ist eine weltumspannende Nation, die sich überall auf der Welt Bedrohungen ausgesetzt sieht. Unser imperiales Erbe ist ein Status, der es wert ist, verteidigt zu werden, und dies erfordert eine starke Flotte auf hoher See!"
POR_advancing_our_tactics:0	"Unsere Taktik vorantreiben"
POR_advancing_our_tactics_desc:0	"Wenn wir wieder zu einer Großmacht auf den Meeren werden wollen, müssen wir den Fortschritten folgen, die Nationen wie Großbritannien, Japan und die Vereinigten Staaten begonnen haben. Die Modernisierung der Marine muss um jeden Preis erfolgen!"
POR_study_amphibious_operations:0	"Studieren Sie amphibische Operationen"
POR_study_amphibious_operations_desc:0	"Die amphibische Kriegsführung ist weder neu in dieser Welt noch etwas, in dem es Portugal an Erfahrung mangelt. Trotzdem ist es klar, dass wir aus den Operationen der Ära des Großen Krieges Lehren ziehen können, Entwicklungen, die wir studieren sollten, um unsere eigenen Strategien zu perfektionieren."
POR_restore_the_naval_guard:0	"Die Seewache wiederherstellen"
POR_restore_the_naval_guard_desc:0	"In einer Welt, in der die Armeen immer professioneller werden, ist die Spezialisierung der Truppen ein wichtiger Bereich für die moderne Kriegsführung. Wir sollten die [ROOT.GetAdjective] Marinewache wiederherstellen, damit sie uns in die entferntesten Marineoperationen folgen kann!"
POR_focus_on_submarine_production:0	"Fokus auf U-Boot-Produktion"
POR_focus_on_submarine_production_desc:0	"Die Deutschen haben bewiesen, dass U-Boote eine entscheidende Komponente sind, um eine größere Seestreitmacht durch wirtschaftliche Zerstörung abzuschrecken. Wir müssen uns auf eine aggressive Beschaffung dieser wichtigen Fahrzeuge konzentrieren."
POR_guide_the_future_of_naval_warfare:0	"Die Zukunft der Seekriegsführung lenken"
POR_guide_the_future_of_naval_warfare_desc:0	"Unsere Reformen bei den Seestreitkräften führen uns rasch zu einer neuen Macht auf dem Meer. Wir müssen Portugal auf alles vorbereiten, was dies mit sich bringen wird!"
POR_complete_the_military_restructuring:0	"Vollenden Sie die militärische Umstrukturierung"
POR_complete_the_military_restructuring_desc:0	"Während die Uhr des europäischen Friedens heruntertickt, müssen wir sicherstellen, dass unsere Streitkräfte in der Lage sind, sowohl die politische Stabilität als auch die Nation als Ganzes vor allen Bedrohungen zu schützen, die sie zu zerstören versuchen."
POR_institute_of_higher_military_studies:0	"Institut für Höhere Militärische Studien"
POR_institute_of_higher_military_studies_desc:0	"Wenn Portugal wieder eine Militärmacht werden soll, ist es an der Zeit, dass wir unsere Militärakademie in ein richtiges Institut umwandeln, das Generationen von mutigen Kämpfern ausbildet, die unsere Nation nach vorne bringen!"
has_researched_elastic_defence_tt:0	"Hat geforscht §YElastic Defense§!"
POR_slowly_modernizing_armed_forces:0	"Langsam modernisierende Streitkräfte"
POR_towards_a_modern_european_army:0	"Auf dem Weg zu einer modernen europäischen Armee"
POR_plan_for_a_defense_of_the_interior:0	"Plan für eine Verteidigung des Inneren"
POR_plan_for_a_defense_of_the_interior_desc:0	"Angesichts der sich weltweit verschärfenden Konflikte könnte es unvermeidlich sein, dass Portugal zum Schauplatz unsäglicher Zerstörung wird. Es ist zwingend erforderlich, dass wir bereit sind."
POR_prepare_for_a_war_of_logistics:0	"Bereiten Sie sich auf einen Krieg der Logistik vor"
POR_prepare_for_a_war_of_logistics_desc:0	"Als eine Nation, die historisch gesehen vier Kontinente umspannt, verstehen wir besser als die meisten anderen die Bedeutung pragmatischer logistischer Systeme. Es muss eine Standardisierung stattfinden, damit unsere tapferen Soldaten immer mit den Mitteln ausgestattet sind, die sie brauchen, um auf dem modernen Schlachtfeld erfolgreich zu sein."
POR_study_flexible_defense_plans:0	"Studieren Sie flexible Verteidigungspläne"
POR_study_flexible_defense_plans_desc:0	"Der schwedische Leutnant Axel Oscar Rappe arbeitet in Zusammenarbeit mit finnischen Kampfingenieuren daran, eine anpassungsfähige Verteidigungslinie an der Grenze zu ihrem viel stärkeren russischen Nachbarn zu errichten. Wenn wir schon nicht die Mittel für eine portugiesische Maginot-Linie haben, so könnten doch kleinere Verteidigungsmaßnahmen wie diese eine entscheidende Abschreckung für unsere Feinde darstellen!"
POR_modernize_our_infantry:0	"Modernisieren Sie unsere Infanterie"
POR_modernize_our_infantry_desc:0	"Trotz allem, was auf die Kriegsführung zukommt, bleibt die Infanterie der König der Schlacht. Wir müssen die defensiven und offensiven Fähigkeiten dieser Streitkräfte verbessern, wenn wir in den kommenden Kriegen bestehen wollen."
POR_utilize_the_inland_terrain:0	"Nutzen Sie das Inlandsterrain"
POR_utilize_the_inland_terrain_desc:0	"Selbst wenn Lissabon, Porto und Beja den Angriffen der Nachbarn zum Opfer fallen sollten, würde es jedem Feind Portugals schwer fallen, unsere östlichen Gipfel zu durchbrechen. Engagierte Gebirgseinheiten würden sich bei der Bemannung dieser natürlichen Festungen sicherlich als entscheidend erweisen."
POR_modernize_our_artillery_systems:0	"Modernisieren Sie unsere Artilleriesysteme"
POR_modernize_our_artillery_systems_desc:0	"Auch wenn neue Waffen auf das Schlachtfeld kommen, ist es wichtig, dass wir versuchen, die schnell alternden Artilleriewaffen zu modernisieren, die wir brauchen, um die Feinde unserer Bodenarmee zu beschießen!"
POR_contenders_on_the_world_stage:0	"Konkurrenten auf der Weltbühne"
POR_contenders_on_the_world_stage_desc:0	"Die [ROOT.GetAdjective]-Armee kann sich wieder als professionelle europäische Bodenarmee bezeichnen. Es bleibt zwar noch einiges zu tun, aber auf dem modernen Schlachtfeld sind wir jetzt eine gefürchtete Kraft!"
POR_study_the_spanish_conflict:0	"Studieren Sie den Spanienkonflikt"
POR_study_the_spanish_conflict_desc:0	"Der Spanische Bürgerkrieg ist zu einem Testfeld für zahllose Innovationen in der modernen Kriegsführung geworden. Die Modernisierung unserer Streitkräfte muss von einem genauen Studium dieser Front abhängen."
POR_learn_from_guerrilla_operations:0	"Lernen Sie von Guerillaoperationen"
POR_learn_from_guerrilla_operations_desc:0	"Die jüngsten asymmetrischen Konflikte, vor allem der spanisch-rifische und der irische Konflikt, zeigen, dass eine schwächere Armee selbst die größten Mächte vernichten kann. Wenn Portugal eine freie Nation bleiben soll, müssen wir von diesen Taten der Hingabe und Tapferkeit lernen!"
POR_adapting_to_the_modern_battlefield:0	"Anpassung an das moderne Schlachtfeld"
POR_adapting_to_the_modern_battlefield_desc:0	"Die letzten drei Jahrzehnte haben der Welt unglaubliche Waffen für die Kriegsführung beschert. Wenn wir jemals auf einen modernen Konflikt vorbereitet sein wollen, müssen wir eigene Gegenmaßnahmen entwickeln, die sowohl gepanzerten als auch luftgestützten Angriffen gewachsen sind."
POR_continue_the_fight_underground:0	"Setzen Sie den Kampf im Untergrund fort"
POR_continue_the_fight_underground_desc:0	"Das Undenkbare kommt auf Portugal zu, aber wir sind noch nicht besiegt! Mit der Unterstützung von Portugals Freunden werden wir unser großes Festland zurückerobern. In der Zwischenzeit werden wir die Widerstandsgruppen mit den nötigen Mitteln versorgen, damit sie den Kampf an der Heimatfront fortsetzen können!"
POR_funding_underground_resistance_groups:0	"Finanzierung von Widerstandsgruppen im Untergrund"
POR_funding_underground_resistance_groups_desc:0	"Das Undenkbare ist über Portugal hereingebrochen, aber wir sind noch nicht besiegt! Mit der Unterstützung von Portugals Freunden werden wir unser großes Festland zurückerobern. In der Zwischenzeit werden wir die Widerstandsgruppen mit den Mitteln versorgen, die sie brauchen, um den Kampf an der Heimatfront fortzusetzen!"
POR_study_mechanized_warfare:0	"Studieren Sie die mechanisierte Kriegsführung"
POR_study_mechanized_warfare_desc:0	"Nationen wie Deutschland und Großbritannien entwickeln in rasantem Tempo mobile Fahrzeuge für die Kriegsführung. Wir sollten unbedingt von ihren Leistungen auf dem Schlachtfeld lernen!"
POR_towards_a_mobile_army:0	"Auf dem Weg zu einer mobilen Armee"
POR_towards_a_mobile_army_desc:0	"Die wichtigste Lehre aus dem laufenden Spanienkonflikt ist, dass der moderne Krieg durch entscheidende, anpassungsfähige Manövrierfähigkeit gewonnen wird. Wenn unsere Berater in Spanien uns diesen Trend schon jetzt mitteilen können, wird er sich mit der Zeit sicherlich noch mehr bewahrheiten."
POR_subsidize_OGME:0	"OGME subventionieren"
POR_subsidize_OGME_desc:0	"Es ist ein unterstützenswertes Ziel, dass wir uns mit unserer Fahrzeugproduktion selbst versorgen. Finanzielle Unterstützung für Unternehmen wie OGME würde sicherlich dazu beitragen, dieses Ziel zu erreichen."
POR_specialized_auxiliary_tanks:0	"Spezialisierte Hilfspanzer"
POR_specialized_auxiliary_tanks_desc:0	"Panzer sind kein zentraler Bestandteil des Schlachtfeldes und werden es auch in Zukunft nicht sein. Der Erste Weltkrieg hat gezeigt, wie sie als unterstützende Einheiten innerhalb von Infanteriebataillonen eingesetzt werden können; dies wird unsere Armee zu einer Kraft machen, mit der man rechnen muss!"
POR_experiment_with_amphibious_vehicles:0	"Experimentieren Sie mit amphibischen Fahrzeugen"
POR_experiment_with_amphibious_vehicles_desc:0	"Es ist endlich an der Zeit, dass Mehrzweckfahrzeuge ihr Debüt auf dem Schlachtfeld geben. Wir müssen Ressourcen für ihre Beschaffung bereitstellen."
POR_a_bastion_of_combined_arms_warfare:0	"Eine Bastion der kombinierten Kriegsführung"
POR_a_bastion_of_combined_arms_warfare_desc:0	"Die jüngsten Entwicklungen haben die [ROOT.GetAdjective] Streitkräfte auf den Weg gebracht, die starke, mobile und anpassungsfähige Armee Iberias zu werden. Wir werden ein neues Erbe für diese Institution der Nation schmieden!"
POR_import_foreign_bombers:0	"Importieren Sie ausländische Bomber"
POR_import_foreign_bombers_desc:0	"Bombenflugzeuge haben sich als entscheidendes Instrument erwiesen, um die Armeen und die Zivilbevölkerung von Nationen, die unseren Interessen feindlich gegenüberstehen, zu zerstören. Wir sollten Flugzeuge aus Ländern wie Großbritannien und Italien importieren, um sie zu studieren und einzusetzen."
POR_study_british_fighters:0	"Britische Kampfflugzeuge studieren"
POR_study_british_fighters_desc:0	"Ganz gleich, ob wir den Himmel kontrollieren oder ihn lediglich vor den Schrecken der Bombardierungen schützen wollen, das Studium der leicht zugänglichen britischen Flugzeuge könnte für unsere eigenen nationalen Entwicklungen von großem Nutzen sein."
POR_experiment_with_torpedo_bombers:0	"Experimentieren Sie mit Torpedobombern"
POR_experiment_with_torpedo_bombers_desc:0	"Die Marinefliegerei ist ein neues, aber unglaublich vielversprechendes Feld für Nationen wie die unsere, die kaum eine große Marineindustrie unterhalten können. Die Anschaffung einer kleinen Flotte von Torpedobombern könnte sicherlich viel dazu beitragen, die Anwendung von Gewalt gegen uns auf See zu verhindern."
POR_modern_engines:0	"Moderne Triebwerke"
POR_modern_engines_desc:0	"Zuverlässige, schnelle Triebwerke sind das Rückgrat eines jeden Kampfflugzeugs. Wir sollten uns auf die Forschung und Entwicklung in diesem Bereich konzentrieren."
POR_experiment_with_heavy_fighters:0	"Experimentieren Sie mit schweren Kampfflugzeugen"
POR_experiment_with_heavy_fighters_desc:0	"Schwere Kampfflugzeuge sind ein wichtiger Bestandteil jeder Luftflotte, die ihre wertvollen Bomber schützen will. Wir sollten eine Flotte dieser Flugzeuge zu deren Verteidigung anschaffen."
POR_grant_autonomy_to_the_airforce:0	"Gewähren Sie der Luftwaffe Autonomie"
POR_grant_autonomy_to_the_airforce_desc:0	"Die Tatsache, dass unsere Luftwaffe ein Anhängsel der Armee ist, schwächt ihre Fähigkeit zu unabhängigem Handeln. Wir sollten dem Trend anderer westlicher Nationen folgen und diesem wichtigen Zweig mehr Autonomie gewähren!"
POR_experiment_with_airborne_divisions:0	"Experimentieren Sie mit Luftlandedivisionen"
POR_experiment_with_airborne_divisions_desc:0	"Die Idee, eine hoch motivierte, gut ausgebildete Armee aus der Luft abzuwerfen, ist eine unglaublich experimentelle Art, moderne Operationen mit kombinierten Waffen durchzuführen. Die Angst, die dies bei den Feinden unserer Nation hervorrufen kann, ist unglaublich!"
POR_air_land_battle:0	"Luft-Land-Schlacht"
POR_air_land_battle_desc:0	"Die Zusammenarbeit zwischen Bombern und unseren Boden- und Seestreitkräften wird ein wichtiger Bestandteil der modernen Kriegsführung sein. Wir sollten uns bemühen, diese Flugzeuge weiter zu modernisieren."
POR_modernize_the_fighter_arsenal:0	"Modernisieren Sie das Kampfflugzeugarsenal"
POR_modernize_the_fighter_arsenal_desc:0	"Es gibt keine Flugzeuge, die zu anpassungsfähig an die Bedrohungen des Himmels sind."
POR_complete_the_separation:0	"Vollenden Sie die Abtrennung"
POR_complete_the_separation_desc:0	"Es ist an der Zeit, eine separate, unabhängige [ROOT.GetAdjective] Luftwaffe zu bilden, die uns zum Sieg am Himmel führt."
POR_continue_the_public_works_r56:0	"Setzen Sie die öffentlichen Arbeiten fort"
POR_continue_the_public_works_r56_desc:0	"Öffentliche Bauvorhaben sind eine kluge Investition in die Nation, die ein wachsendes Portugal auf Jahre hinaus ernähren wird. Die Ausweitung und Schaffung neuer öffentlicher Bauvorhaben würde sich positiv auf unsere Wirtschaft auswirken und zeigen, dass wir eine stabilisierende Kraft für die gesamte Nation sind."
POR_support_continued_educational_expansion:0	"Unterstützen Sie den weiteren Ausbau des Bildungswesens"
POR_support_continued_educational_expansion_desc:0	"Während in weiten Teilen der westlichen Welt kontinuierliche Verbesserungen in der frühkindlichen Bildung zu verzeichnen waren, ist Portugal stark zurückgefallen. Nachdem sich die Lage stabilisiert hat, sollten wir daran arbeiten, diese Schande für unser Land zu modernisieren."
POR_subsidize_rolling_stock_production:0	"Subventionierung der Produktion von rollendem Material"
POR_subsidize_rolling_stock_production_desc:0	"[ROOT.GetAdjective] Die Produktion von rollendem Material ist ein wichtiger Bestandteil, um unsere ehrgeizigen öffentlichen Bauvorhaben voranzutreiben. Wir sollten diese wichtige Industrie weiterhin subventionieren."
POR_finish_the_santa_luzia_dam:0	"Beenden Sie den Santa Luzia Damm"
POR_finish_the_santa_luzia_dam_desc:0	"Die Wasserkraft hat sich in Portugal bisher als unglaublich vielversprechend erwiesen. Der Staudamm Santa Luzia ist unser nächster Schritt auf dem Weg zur Energieunabhängigkeit, und es ist an der Zeit, dieses ehrgeizige Projekt zu vollenden!"
POR_modernize_the_national_rail_network:0	"Modernisieren Sie das nationale Eisenbahnnetz"
POR_modernize_the_national_rail_network_desc:0	"Das nationale Schienennetz, dessen Zentrum in Lissabon liegt, ist ein wichtiger Knotenpunkt, der die iberische Halbinsel mit dem Meer verbindet. Wir sollten weitere Mittel in die Modernisierung dieses Teils unserer Infrastruktur stecken."
POR_modernize_the_rural_regions:0	"Modernisieren Sie die ländlichen Regionen"
POR_modernize_the_rural_regions_desc:0	"Das städtische und das ländliche Portugal sind in vielerlei Hinsicht kaum dasselbe Land. Wir müssen das ländliche Gebiet unseres Landes stärker an die großen Stadtzentren anpassen."
POR_support_food_exporters:0	"Unterstützen Sie die Lebensmittelexporteure"
POR_continue_the_national_electrification:0	"Setzen Sie die nationale Elektrifizierung fort"
POR_continue_the_national_electrification_desc:0	"Die Elektrifizierung eines möglichst großen Teils des Landes wird wichtig sein, wenn wir zu einer der großen wohlhabenden Volkswirtschaften Europas werden wollen."
POR_expand_the_mining_industry:0	"Die Bergbauindustrie ausbauen"
POR_expand_the_mining_industry_desc:0	"Die Geographie des Landes hat uns mit einem Überfluss an natürlichen Ressourcen belohnt, allen voran Wolfram. Weitere Investitionen in den [ROOT.GetAdjective] Bergbau sind eindeutig eine kluge Investition, sowohl für die nationale Sicherheit als auch für die Entwicklung unserer Wirtschaft."
POR_import_foreign_machinery:0	"Ausländische Maschinen importieren"
POR_import_foreign_machinery_desc:0	"Portugal verfügt nicht über alle Werkzeuge, die für die Modernisierung und Industrialisierung des Landes erforderlich sind. Wir sollten uns in Ländern wie Deutschland, Großbritannien und den Vereinigten Staaten nach Ausrüstung umsehen, um unsere industrielle Basis zu stärken."
POR_develop_portuguese_textiles:0	"Entwickeln Sie [ROOT.GetAdjective] Textilien"
POR_develop_portuguese_textiles_desc:0	"Unabhängig davon, ob wir den Weg der Autarkie fortsetzen oder wieder mit der Welt verflochten werden, bleibt die Textilindustrie sowohl für unsere Armee als auch für den zivilen Sektor ein wichtiger Wirtschaftszweig. Wir sollten mehr in diesen wichtigen Bereich investieren."
POR_never_another_la_lys:0	"Nie wieder La Lys"
POR_never_another_la_lys_desc:0	"Der europäische Kontinent entfernt sich rasch von dem Frieden und der Ordnung, für die in Versailles so viele geblutet haben. Jetzt, da die Jahrzehnte der internationalen Beruhigung endlich zu Ende gehen, müssen wir uns darauf vorbereiten, dass sich das einstige Portugal nicht wiederholt. Die Nation darf nie wieder von Konflikten heimgesucht werden!"
POR_never_another_la_lys_tt:0	"Vervollständigt den Fokus §YNever Another Lys§!, der gewährt:"
POR_the_resource_war:0	"Der Ressourcenkrieg"
POR_the_resource_war_desc:0	"Portugal ist eine Nation, die reich an natürlichen Ressourcen ist, vor allem an Wolfram. Da die Kriegsmaschinen Europas nach Ressourcen schreien, muss unsere Wirtschaft bereit sein!"
POR_prepare_wartime_heavy_industry:0	"Bereiten Sie die Schwerindustrie für den Krieg vor"
POR_prepare_wartime_heavy_industry_desc:0	"Die Schrecken des Krieges haben in ganz Europa eine neue Nachfrage nach der Schwerindustrie geschaffen. Wir sollten uns diese neue Nachfrage zunutze machen und Portugal zu einer sich schnell industrialisierenden Wirtschaft machen!"
POR_support_an_aerial_expansion:0	"Unterstützen Sie eine Expansion aus der Luft"
POR_support_an_aerial_expansion_desc:0	"Die jüngsten Konflikte haben gezeigt, welche verheerenden Auswirkungen Flugzeuge auf dem Schlachtfeld und auf den Meeren haben. Eine deutliche Ausweitung der Luftfahrzeugproduktion ist unsere beste Chance, die Zukunft unseres Landes zu sichern!"
POR_rejuvenate_the_land_forces:0	"Verjüngen Sie die Landstreitkräfte"
POR_rejuvenate_the_land_forces_desc:0	"Trotz des unglaublichen technologischen Fortschritts ist die Infanterie das Herzstück des Schlachtfelds geblieben. Bevor wir uns auf neue, unerprobte Innovationen einlassen, müssen wir die Bedürfnisse des einfachen Soldaten bis zur Perfektion verfeinern."
POR_rejuvenating_the_land_forces:0	"Die Verjüngung der Landstreitkräfte"
POR_rejuvenating_the_land_forces_desc:0	"Trotz des unglaublichen technologischen Fortschritts ist die Infanterie das Herzstück des Schlachtfelds geblieben. Bevor wir uns auf neue, unerprobte Innovationen einlassen, müssen wir die Bedürfnisse des einfachen Soldaten bis zur Perfektion ausfeilen."
POR_renew_the_portuguese_armada:0	"Erneuern Sie die [ROOT.GetAdjective] Armada"
POR_renew_the_portuguese_armada_desc:0	"Als eine Nation, die mehrere Kontinente umspannt, wird eine starke und fähige Marine immer im Mittelpunkt unserer nationalen Sicherheit stehen. Wir müssen unbedingt alles tun, um unsere Macht auf den Meeren wiederherzustellen!"
POR_renewing_the_portuguese_armada:0	"Erneuerung der [ROOT.GetAdjective] Armada"
POR_renewing_the_portuguese_armada_desc:0	"Als eine Nation, die mehrere Kontinente umspannt, wird eine starke und fähige Marine immer das Herzstück unserer nationalen Sicherheit sein. Wir müssen unbedingt alles tun, um unsere Macht auf den Meeren wiederherzustellen!"
POR_strengthen_the_colonial_administration:0	"Stärken Sie die Kolonialverwaltung"
POR_strengthen_the_colonial_administration_desc:0	"Mehr als die Hälfte unserer Bevölkerung lebt in unseren vielen überseeischen Gebieten, und diese Zahl wird mit der Zeit noch weiter wachsen. Während sich die anderen Nationen des Westens in Richtung Autonomie und Unabhängigkeit bewegen, müssen wir unsere Kolonien weiterhin zu einer Quelle des wirtschaftlichen Wachstums und des Prestiges der Nation machen."
POR_strengthen_the_colonial_administration_tt:0	"Schaltet das Besatzungsrecht in allen §YNnichteuropäischen§! Staaten frei:"
POR_strengthen_the_colonial_administration_trigger:0	"Hat den Schwerpunkt §YDie Frage unserer Kolonien§! abgeschlossen, ohne sich §RRückzug§! aus ihnen"
POR_develop_the_angolan_interior:0	"Entwickeln Sie das angolanische Innere"
POR_develop_the_angolan_interior_desc:0	"Angola ist, wie unsere vielen Kolonien, nach wie vor sehr verarmt. Wenn wir die Kontrolle über dieses riesige Land behalten wollen, müssen wir seine Wirtschaft mit der des portugiesischen Festlands in Einklang bringen."
POR_develop_mozambique_r56:0	"Mosambik entwickeln"
POR_develop_mozambique_r56_desc:0	"Mosambik ist die bevölkerungsreichste unserer vielen Kolonien und ist trotz der Erträge, die es für unsere Nation hat, sehr arm. Investitionen in die lokale Wirtschaft wären ein gutes Zeichen für unsere nationale Wirtschaft und würden die Akzeptanz unserer Herrschaft erhöhen."
POR_expand_overseas_recruitment:0	"Expandieren Sie die Rekrutierung in Übersee"
POR_expand_overseas_recruitment_desc:0	"Als größte Quelle der Bevölkerung unseres Reiches könnten die überseeischen Provinzen die Grundlage unserer nationalen Armee werden. Die Rekrutierung von Einheimischen muss sofort ausgeweitet werden!"
POR_bolster_the_colonial_garrison:0	"Verstärken Sie die koloniale Garnison"
POR_bolster_the_colonial_garrison_desc:0	"Unsere globale Macht darf nicht an ausländische Eindringlinge oder andere Quellen von Aufständen der Einheimischen verloren gehen. Unsere koloniale Garnison muss eine professionelle Truppe bleiben, die sowohl einheimische als auch europäische Soldaten einsetzt, um unsere globale Reichweite zu erhalten!"
POR_unite_against_salazar:0	"Vereint gegen Salazar"
POR_unite_against_salazar_desc:0	"Salazars Regime des Estado Novo hat jedes Versprechen einer portugiesischen Republik in eine Verankerung von Despotismus und Rückständigkeit verwandelt. Um Portugal so voranzubringen, wie wir es einst taten, muss seine Herrschaft beendet werden."
POR_unite_against_salazar_tt:0	"Entriegelt §YGemeinsam gegen Salazar§! Beschlüsse"
POR_together_against_salazar:0	"Gemeinsam gegen Salazar!"
POR_battle_nationalist_paramilitaries:0	"Nationalistische Paramilitärs bekämpfen"
POR_distribute_propaganda_pamphlets:0	"Verteilen Sie Propaganda-Pamphlete"
POR_call_for_general_strike:0	"Aufruf zum Generalstreik"
POR_seek_international_support:0	"Suchen Sie internationale Unterstützung"
POR_seek_international_support_desc:0	"Wir sind mit unseren Klagen gegen Salazar und sein Regime nicht allein. Wir müssen alles tun, was nötig ist, um ausländische Interessen auf unsere Seite zu ziehen!"
POR_seek_international_support_tt:0	"Entriegelt §YSuchen Sie internationale Unterstützung§! Beschlüsse"
POR_join_forces_with_the_spanish_popular_front:0	"Verbünden Sie sich mit der Spanischen Volksfront"
POR_join_forces_with_the_spanish_popular_front_desc:0	"Die spanische Gesellschaft verzehrt sich durch die Schrecken des Bürgerkriegs, und wir haben die Möglichkeit, einzugreifen. Die Republik ist die rechtmäßige, legitime Regierung Spaniens, und wir werden ihr die Hilfe geben, die sie braucht, um das Blatt zu wenden!"
POR_join_forces_with_the_spanish_popular_front_tt:0	"Wenn sich §YSpain§! nach Abschluss von §YStorm the National Assembly§! in einem Bürgerkrieg befindet, werden wir uns mit ihnen verbünden und die folgenden Effekte erzielen:"
POR_request_soviet_assistance:0	"Bitte um sowjetische Unterstützung"
POR_request_soviet_assistance_tt:0	"Wenn sie im Frieden sind, werden die §YSoviets§! geneigt sein, §YVolunteers§! auf unsere Seite des Bürgerkrieges zu schicken"
portugal.46.t:0	"Portugiesische Sozialisten bitten um sowjetische Unterstützung"
portugal.46.d:0	"In den letzten Tagen sind Mitglieder mehrerer portugiesischer sozialistischer Gruppen in Moskau eingetroffen, um sowjetische Unterstützung für ihre Operationen zu erhalten. Während unsere Unterstützung für ihr Regime für Moskaus Machtprojektion ein gutes Zeichen wäre, ist ihr Kampf wirklich eine Sache, für die es sich zu kämpfen lohnt?"
portugal.46.a:0	"Wenn die Zeit gekommen ist, werden sie unsere Unterstützung haben."
POR_NKVD_activity:0	"NKVD-Aktivität"
portugal.46.b:0	"Wir haben wichtigere Dinge, um die wir uns kümmern müssen."
POR_ally_anti_colonial_resistance:0	"Verbündeter antikolonialer Widerstand"
POR_ally_anti_colonial_resistance_desc:0	"Unser plurikontinentales Imperium ist reif für nationale Befreiungskämpfe. Die Koordinierung unserer Sache mit kolonialen Rebellengruppen wäre sicherlich ein gutes Zeichen, um Salazars Herrschaft über Portugal zu brechen."
POR_ally_anti_colonial_resistance_tt:0	"Wenn unser §YBürgerkrieg§! beginnt, wird der Widerstand in unseren Kolonien deutlich zunehmen und die Aufstellung mehrerer Divisionen für die gegnerische Seite verhindern."
POR_storm_the_national_assembly:0	"Stürmen Sie die Nationalversammlung"
POR_storm_the_national_assembly_desc:0	"Endlich sind wir in der Lage, den Mann zu stürzen, der für so viele Jahre des verlorenen Fortschritts verantwortlich ist! Wir werden sofort Lissabon stürmen, Salazar und seine reaktionären Verbündeten absetzen und Portugal die Zukunft geben, die wir verdienen!"
POR_storm_the_national_assembly_tt:0	"§Yer Bürgerkrieg wird beginnen!§! Das Verhältnis der Einheiten unter unserem Kommando wird von der Unterstützung für die herrschende Regierung abhängen."
portugal.45.t:0	"Stürmung der Nationalversammlung"
portugal.45.d:0	"Heute ist ein neuer Tag für Portugal. Portugal soll nicht länger das Hinterland Westeuropas bleiben! Nicht länger wird Salazar unser Volk tyrannisieren. An die große portugiesische Arbeiterklasse:"
portugal.45.a:0	"Die Zeit für die Rückeroberung unserer Nation ist gekommen!"
POR_reactionary_resistance:0	"Reaktionärer Widerstand"
POR_divided_revolution:0	"Geteilte Revolution"
POR_maintaining_the_fire:0	"Das Feuer aufrechterhalten!"
POR_maintaining_the_fire_desc:0	"Jetzt, da Salazar Portugal verlassen hat, müssen wir entschlossen handeln, wenn wir unsere revolutionäre Herrschaft über die Nation sichern wollen."
POR_answer_the_question_of_our_colonies:0	"Beantworten Sie die Frage unserer Kolonien"
POR_answer_the_question_of_our_colonies_desc:0	"Unsere Revolution hat mit einem Triumph geendet, und wir haben unsere Macht auf dem Festland gesichert. Wir müssen uns nun um interne Angelegenheiten kümmern, von denen die wichtigste unsere Kolonialbesitzungen in Afrika und Asien sind. Sollen wir uns aus diesen lang besetzten Regionen zurückziehen?"
POR_align_the_british_communist_alternative:0	"Verbinden Sie die britische kommunistische Alternative"
POR_align_the_british_communist_alternative_desc:0	"Die Briten waren lange Zeit unsere Beschützer, und auch jetzt streben sie eine Hinwendung zu wahren sozialistischen Idealen an. Wieder vereint, werden Portugal und Großbritannien niemals auseinandergerissen werden!"
POR_align_with_moscow:0	"Verbünden Sie sich mit Moskau"
POR_align_with_moscow_desc:0	"Auch wenn wir in einigen Schlüsselbereichen große Meinungsverschiedenheiten haben, bleibt die Sowjetunion die wichtigste sozialistische Macht in Europa. Die Zukunft unserer Ideale in Westeuropa hängt von der Vertiefung unserer Beziehungen zu Moskau ab."
POR_support_the_spanish_republic_r56:0	"Unterstützen Sie die Spanische Republik"
POR_support_the_spanish_republic_r56_desc:0	"Die Spanische Republik kämpft einen Überlebenskampf gegen das Übel der Reaktion und des Faschismus, und sie wird in diesem Kampf unsere Hilfe brauchen. Die Republik ist die rechtmäßige Regierung Spaniens, und wir werden bis zum Ende an ihrer Seite kämpfen!"
POR_end_the_popular_front:0	"Beendet die Volksfront"
POR_grant_womens_suffrage:0	"Gewähren Sie den Frauen das Wahlrecht"
POR_loosen_censorship_policies:0	"Lockerung der Zensurpolitik"
POR_the_question_of_our_colonies:0	"Die Frage unserer Kolonien"
POR_the_question_of_our_colonies_desc:0	"Unsere Revolution hat mit einem Triumph geendet, und wir haben die Kontrolle über das Festland erlangt. Wir müssen uns nun um die internen Angelegenheiten kümmern. Die wichtigste davon sind unsere Kolonialbesitzungen in Afrika und Asien. Sollen wir uns aus diesen lang besetzten Regionen zurückziehen?"
portugal.47.t:0	"Die Frage unserer Kolonien"
portugal.47.desc:0	"Mehrere Jahrhunderte lang hat Portugal daran gearbeitet, ein weitreichendes, plurikontinentales Imperium zu errichten. Jetzt, da unsere Revolution zu Hause triumphiert, müssen wir unserem Volk die Frage beantworten, ob wir uns aus den riesigen historischen Besitzungen Portugals zurückziehen sollen."
portugal.47.a:0	"Unsere Sache ist eine!"
portugal.47.a_tt:0	"Wenn ihre Staaten von uns kontrolliert werden, wird §Yede beginnende afrikanische Kolonie als unabhängige kommunistische Nationen§! entlassen."
portugal.47.b:0	"Vielleicht würde eine gewisse Autonomie ausreichen?"
portugal.47.b_tt:0	"Wenn ihre Staaten von uns kontrolliert werden, werden §Y[ANG.GetNameDef]§!, §Y[MZB.GetNameDef]§!, und §Y[GNB.GetNameDef]§! unser §YProtektorat§! werden."
portugal.47.c:0	"Was das angeht..."
portugal.47.d:0	"Hmm... nein."
portugal.48.t:0	"Portugal zieht sich aus Macau zurück"
portugal.48.desc:0	"In den letzten Tagen hat die portugiesische Regierung nach einer bewaffneten Revolution in der Nation mehrere ihrer weltweiten Kolonien aufgegeben. Was sollen wir angesichts dieser Chance tun?"
portugal.48.a:0	"Dann werden wir einziehen!"
portugal.49.t:0	"Portugal zieht sich aus Goa zurück"
portugal.50.t:0	"Portugal zieht sich aus Timor-Leste zurück"
POR_address_the_new_spain:0	"Adressieren Sie das neue Spanien"
POR_address_the_new_spain_desc:0	"Spanien hat wie wir die Schrecken des Krieges und jahrzehntelange Bürgerkriege im Namen der Befreiung durchgestanden. Da es unwahrscheinlich ist, dass sich die Spanier auf Jahre hinaus erholen und unsere Revolution zu Hause gewonnen hat, müssen wir uns fragen, was wir von der Situation in unserem weitaus größeren Nachbarland halten sollen."
portugal.51.desc:0	"Spanien hat wie wir die Schrecken des Krieges und jahrzehntelange Bürgerkriege im Namen verschiedener nicht geteilter Werte durchgestanden. Da es unwahrscheinlich ist, dass sich die Spanier in den nächsten Jahren erholen werden, und unsere Macht im eigenen Land gefestigt ist, müssen wir uns fragen, was wir von der Situation in unserem weitaus größeren Nachbarn halten sollen."
portugal.51.t:0	"Der Umgang mit dem neuen Spanien"
portugal.51.a:0	"Gemeinsam haben wir unglaubliche Entschlossenheit bewiesen! Die pan-iberische Einheit ist unser Weg nach vorne!"
portugal.51.b:0	"Wir sollten daran arbeiten, die Freundschaft, die wir bereits aufgebaut haben, auszubauen!"
portugal.51.c:0	"Trotz unserer Differenzen ist es das Beste für uns beide, unsere Beziehungen zu normalisieren."
portugal.51.d:0	"Dieses neue Spanien ist eine Bedrohung für alles, wofür wir stehen!"
portugal.52.t:0	"Portugal bittet um einen Vertrag über Freundschaft und Nichtangriffsrechte"
portugal.52.d:0	"Unser Botschafter in Madrid wurde soeben von seinem [POR.GetAdjective] Zeitgenossen kontaktiert, der uns über den Wunsch der Nation informiert hat, einen offiziellen Vertrag über Nichtangriff und gegenseitige Verteidigung mit uns abzuschließen. Die Lage auf dem europäischen Kontinent verdüstert sich zusehends. Was sollen wir unseren langjährigen Freunden aus Lissabon sagen?"
portugal.52.a:0	"Ja, natürlich! Wir werden die Freundschaft, die wir bereits aufgebaut haben, festschreiben!"
portugal.52.b:0	"Wir sind nicht an ihren Angelegenheiten interessiert!"
portugal.53.t:0	"Die Spanier akzeptieren unser Bündnis!"
portugal.53.d:0	"Der spanische Botschafter hat auf unsere Anfrage geantwortet und zugestimmt, dass eine gegenseitige Zusammenarbeit auf der Halbinsel nur zum Wohle unserer Nationen sein kann. Heute ist ein guter Tag für den Frieden."
portugal.54.t:0	"Die Spanier haben abgelehnt!"
portugal.54.d:0	"Der spanische Botschafter hat auf unsere Anfrage geantwortet und unsere Bitte um eine engere Zusammenarbeit abgelehnt. Das ist zweifellos enttäuschend für uns alle."
portugal.55.t:0	"Portugal bittet um einen Nichtangriffspakt"
portugal.55.d:0	"Der portugiesische Außenbotschafter hat sich kürzlich an seinen Zeitgenossen in Madrid gewandt und offiziell um einen Nichtangriffspakt und eine vollständige Normalisierung der luso-spanischen Beziehungen gebeten. Was sollen wir unseren Brüdern von der Halbinsel sagen?"
portugal.55.a:0	"Ja, natürlich! Es ist in unser aller Interesse, einen Krieg auf der Halbinsel zu vermeiden!"
portugal.55.b:0	"Wir sind nicht an ihren Angelegenheiten interessiert!"
portugal.56.t:0	"Die Spanier haben eingewilligt!"
portugal.56.a:0	"Ausgezeichnet!"
portugal.57.t:0	"Die Spanier haben abgelehnt!"
portugal.57.a:0	"Unglücklich."
POR_consolidate_the_revolution:0	"Konsolidieren Sie die Revolution"
POR_consolidate_the_revolution_desc:0	"Die reaktionären Kräfte haben Portugal um Jahrzehnte zurückgeworfen. Trotz unserer bisherigen Siege ist die Revolution erst dann siegreich, wenn wir jede Bedrohung durch die Reaktion für immer beseitigt haben!"
POR_reopen_the_national_propaganda_secretariat:0	"Wiedereröffnung des Nationalen Propagandasekretariats"
POR_reopen_the_national_propaganda_secretariat_desc:0	"Auch wenn unsere Revolution auf dem Schlachtfeld gesiegt hat, müssen wir wachsam sein, denn die Bedrohung durch die Konterrevolution ist noch nicht gebannt!"
POR_repurposing_the_spn:0	"Wiederverwendung der SPN"
POR_covert_return_to_the_world_stage:0	"Heimliche Rückkehr auf die Weltbühne"
POR_covert_return_to_the_world_stage_desc:0	"Als Nation an der westlichsten Spitze Europas befinden wir uns in einer erstklassigen Position, um zu einer Bastion des Kommunismus auf dem europäischen Kontinent zu werden. Wir dürfen keine Kompromisse bei der Zerstörung der drei großen Übel dieses Kontinents eingehen: Imperialismus, Kapitalismus und Faschismus!"
POR_diplomatic_pragmatism:0	"Diplomatischer Pragmatismus"
POR_diplomatic_pragmatism_desc:0	"Als eine Nation, die sich noch immer von den Schrecken des Krieges erholt, müssen wir uns davor hüten, uns in fremde Angelegenheiten einzumischen, die nicht im Interesse von [ROOT.GetNameDef] sind."
POR_join_the_global_fight_against_fascism:0	"Schließen Sie sich dem weltweiten Kampf gegen den Faschismus an"
POR_join_the_global_fight_against_fascism_desc:0	"Wir können nicht tatenlos zusehen, wie die Geißel des Faschismus auf unserem Kontinent Wurzeln schlägt. Bis die Zeit reif ist, ist die bürgerliche Demokratie ein notwendiges Übel und ein potenzieller Verbündeter in unserem Kampf gegen die faschistische Bedrohung in Europa!"
POR_the_red_army_of_the_west:0	"Die Rote Armee des Westens"
POR_the_red_army_of_the_west_desc:0	"Wenn wir wieder auf der Weltbühne stehen wollen, müssen wir unsere revolutionären Brigaden unbedingt in ein modernes, stark zentralisiertes Militär umwandeln. Die Rote Armee hat uns ein schlaues Beispiel dafür geliefert, wie wir dies tun können."
POR_the_red_army_of_the_west_tt:0	"Die Entscheidungen von §YEmpower Socialist Organizations§! werden §GUpgrade§! diesen nationalen Geist"
POR_integrating_socialist_militias:0	"Integration der sozialistischen Milizen"
POR_protectors_of_the_revolution:0	"Beschützer der Revolution"
POR_the_iberian_social_revolution:0	"Die iberische soziale Revolution"
POR_the_iberian_social_revolution_desc:0	"Schon vor der grausamen Führung von Salazars Estado Novo lag Portugal Jahrzehnte hinter den anderen Nationen Westeuropas zurück. Wir müssen diese ungleiche Ordnung zu Fall bringen, die Symbole der Unterdrückung, die er benutzte, zerstören und unserer großen Arbeiterklasse einen neuen revolutionären Eifer einflößen!"
POR_promote_revolutionary_artwork:0	"Fördern Sie revolutionäre Kunstwerke"
POR_suppress_symbols_of_portuguese_aristocracy:0	"Beseitigen Sie die Symbole der portugiesischen Aristokratie"
POR_empower_socialist_organizations:0	"Stärken Sie sozialistische Organisationen"
POR_empower_socialist_organizations_desc:0	"Jugendbewegungen sind im 20. Jahrhundert das Rückgrat unzähliger Ideologien und Regierungen. [ROOT.GetAdjective] Sozialistische Bewegungen gibt es weit und breit in jedem Winkel Portugals; sie sollen die Unterstützung bekommen, die sie brauchen, um sicherzustellen, dass unsere Ideen die Nation regieren!"
POR_tap_aligned_laborer_organizations:0	"Zapfen Sie verbündete Arbeiterorganisationen an"
POR_arm_anti_fascist_militias:0	"Bewaffnen Sie antifaschistische Milizen"
POR_arm_anti_fascist_militias_tt:0	"§GRemoves§! alle verbleibende §YAuthoritarian§! und §YFascism§! Unterstützung"
POR_towards_institutional_atheism:0	"Auf dem Weg zum institutionellen Atheismus"
POR_towards_institutional_atheism_desc:0	"Der Status der Kirche in der Politik in ganz [ROOT.GetName] ist inakzeptabel. Wir müssen handeln, um die Herrschaft der Kirche über unsere großen Arbeiter zu sichern!"
POR_appropriate_church_riches:0	"Reichtümer der Kirche aneignen"
POR_stamp_out_clergy_influence:0	"Den Einfluss des Klerus zurückdrängen"
POR_portugals_path_to_marxism_leninism:0	"Portugals Weg zum Marxismus-Leninismus"
POR_portugals_path_to_marxism_leninism_desc:0	"In einem Zeitraum von weniger als 20 Jahren hat Wladimir Lenin Russland von einer der rückständigsten Nationen Europas zu einer vom Westen gefürchteten Bastion der Revolution gemacht. Es besteht kein Zweifel, dass wir von seinen unglaublichen Errungenschaften lernen und sie wiederholen müssen."
POR_portugals_path_to_socialism:0	"Portugals Weg zum Sozialismus"
POR_solidify_the_economic_reforms:0	"Festigen Sie die Wirtschaftsreformen"
POR_solidify_the_economic_reforms_desc:0	"Unsere Wirtschaftspolitik hat unsere Arbeiter auf den Weg zu Wohlstand und Gleichheit gebracht. Es ist an der Zeit, dass wir die wirtschaftliche Stabilisierung an die erste Stelle setzen und in dieser Hinsicht eine kohärente Politik betreiben."
POR_our_path_to_economic_development_decisions_taken_6_or_greater_tt:0	"Hat §Y6§! oder mehr §YOUR Path to Economic Development§! Beschlüsse umgesetzt (Aktueller Fortschritt ist §Y[?POR_our_path_to_economic_development_decisions_taken]/6§!)"
POR_socialist_market_economy:0	"Sozialistische Marktwirtschaft"
POR_the_portuguese_new_economic_policy:0	"Die neue portugiesische Wirtschaftspolitik"
POR_the_red_industrial_revolution:0	"Die rote industrielle Revolution"
POR_pave_the_path_to_progress:0	"Den Weg zum Fortschritt ebnen"
POR_pave_the_path_to_progress_desc:0	"Unsere Sache wird niemals wirklich triumphieren, wenn die Siege von heute zu einer weiteren Konstante von morgen werden. Wir müssen dafür sorgen, dass der Fortschritt Portugals niemals endet!"
POR_advance_the_cause_for_equality:0	"Die Sache der Gleichheit vorantreiben"
POR_advance_the_cause_for_equality_desc:0	"Aufgrund unserer gesellschaftlichen Stellung sind wir in einer starken Position, um die Unterstützung der [ROOT.GetAdjective] Frauen zu gewinnen, insbesondere in den städtischen Zentren. Das sollten wir ausnutzen und uns für echte Fortschritte bei der Gleichstellung einsetzen!"
POR_forge_portugals_own_five_year_plan:0	"Schmieden Sie Portugals eigenen Fünfjahresplan"
POR_forge_portugals_own_five_year_plan_desc:0	"Jahrhunderte schlechter Entwicklungspolitik und Salazars stumpfsinnige Besessenheit von Sparmaßnahmen haben in der portugiesischen Wirtschaft Bedingungen geschaffen, die ein hartes Eingreifen des Staates erfordern. Wir müssen einen Plan aufstellen, um echten Wohlstand für die Arbeiter unseres Landes zu schaffen!"
POR_forge_portugals_own_five_year_plan_tt:0	"Unlocks §YDie Frage der Verstaatlichung§! Beschlüsse"
POR_the_question_of_nationalization:0	"Die Frage der Verstaatlichung"
POR_transitioning_to_a_mixed_economy:0	"Der Übergang zu einer gemischten Wirtschaft"
POR_slow_collectivization:0	"Langsame Kollektivierung"
POR_heavy_handed_central_planning:0	"Schwerfällige zentrale Planung"
POR_looming_economic_disaster:0	"Das drohende wirtschaftliche Desaster"
POR_our_path_to_economic_development:0	"Unser Weg zur wirtschaftlichen Entwicklung"
POR_our_path_to_economic_development_desc:0	"Öffentliche Bauprojekte sind eine kluge Investition in die Nation, die ein wachsendes Portugal auf Jahre hinaus ernähren wird. Die Ausweitung und Schaffung neuer öffentlicher Bauprojekte würde sich positiv auf unsere Wirtschaft auswirken und zeigen, dass wir eine stabilisierende Kraft für die gesamte Nation sind."
POR_sell_off_seized_assets:0	"Verkaufen Sie beschlagnahmte Vermögenswerte"
POR_sell_off_seized_assets_desc:0	"Vielleicht sind wir mit der Beschlagnahmung von kapitalistischen Vermögenswerten zu weit gegangen - auf Kosten der wirtschaftlichen Stabilität. Wir sollten alle beschlagnahmten Vermögenswerte veräußern, um die Bemühungen zur Wiederherstellung unserer wirtschaftlichen Position zu finanzieren."
POR_support_private_collectives:0	"Unterstützen Sie private Kollektive"
POR_support_private_collectives_desc:0	"Private Kollektive sind wichtige Organisationen, um das Wirtschaftswachstum zu fördern und gleichzeitig gute Arbeitsbedingungen zu gewährleisten. Wir sollten Maßnahmen ergreifen, um die weitere Bildung solcher Organisationen zu unterstützen."
POR_land_redistribution:0	"Umverteilung von Land"
POR_land_redistribution_desc:0	"Die Landverteilung in [ROOT.GetNameDef] ist seit langem entsetzlich ungleich. Um diese unglaubliche Ungleichheit zu beseitigen, müssen wir radikale Maßnahmen ergreifen, um den Grundbesitz in unserer neuen Republik anzugleichen!"
POR_restore_the_social_state:0	"Stellen Sie den Sozialstaat wieder her"
POR_restore_the_social_state_desc:0	"Salazar und seine Wirtschaftspolitik haben das portugiesische Sicherheitsnetz im Namen der Sparsamkeit beschnitten und bedrohen damit den Lebensstandard von uns allen. Wir sollten diesen Kahlschlag sofort rückgängig machen!"
POR_subsidize_rural_farming:0	"Ländliche Landwirtschaft subventionieren"
POR_subsidize_rural_farming_desc:0	"Die Landwirte sind das Rückgrat der [ROOT.GetAdjective] Wirtschaft, und sie brauchen unsere Unterstützung, um weiterhin wirtschaftlichen Erfolg zu haben. Wir sollten ihnen die Mittel geben, die sie brauchen, um ihre Praktiken zu modernisieren und unserer Wirtschaft große Erträge zu bescheren!"
POR_invest_in_public_education:0	"Investieren Sie in die öffentliche Bildung"
POR_invest_in_public_education_desc:0	"Zum Wohle unserer Nation sollten wir weiter in die Bildung der Jugend von [ROOT.GetNameDef] investieren. Geringe Mittel für die Beseitigung des Analphabetismus einzusetzen, ist sicherlich ein nobles Ziel."
POR_end_the_educational_abyss:0	"Beenden Sie den Bildungsabgrund"
POR_end_the_educational_abyss_desc:0	"Wir können nicht länger hinnehmen, dass Portugal eine der hartnäckigsten Analphabeten-Nationen in Europa bleibt. Programme, die in die öffentliche Bildung investieren, sind eine Notwendigkeit, wenn wir jemals zu den anderen Nationen der westlichen Welt aufschließen wollen."
POR_escalate_the_industrialization:0	"Eskalieren Sie die Industrialisierung"
POR_escalate_the_industrialization_desc:0	"Es ist eine Schande, dass wir trotz der Ausplünderung der Welt und unseres früheren Status als Kontinentalmacht beim industriellen Fortschritt immer noch ein Jahrhundert hinter den Briten und Deutschen zurückliegen. Wir werden nie wieder eine moderne Nation sein, wenn wir diese anhaltende Rückständigkeit tolerieren!"
POR_factory_recruitment_drive:0	"Anwerbung von Fabriken"
POR_direct_farmland_to_industrial_projects:0	"Leiten Sie Ackerland an Industrieprojekte weiter"
POR_prepare_for_a_war_of_annihilation:0	"Bereiten Sie sich auf einen Vernichtungskrieg vor"
POR_prepare_for_a_war_of_annihilation_desc:0	"Es besteht kein Zweifel, dass die Nationen des Westens unsere Vernichtung anstreben. Wir müssen sicherstellen, dass die Nation bereit ist, unsere revolutionären Werte zu schützen!"
POR_restore_civil_liberties:0	"Bürgerliche Freiheiten wiederherstellen"
POR_restore_civil_liberties_desc:0	"Wir haben nicht nur Salazar in einer blutigen Revolution besiegt, um dann einer weiteren tyrannischen Regierung zu unterliegen. Wir müssen uns dafür einsetzen, dass die Arbeiter unseres großen Landes das bekommen, was sie wirklich verdienen: Freiheit und Gerechtigkeit!"
POR_portugals_road_to_democracy:0	"Portugals Weg zur Demokratie"
POR_restore_civil_liberties_tt:0	"Unlocks §YRestore Civil Liberties§! Decisions"
POR_foment_peace_with_the_church:0	"Frieden mit der Kirche stiften"
POR_foment_peace_with_the_church_desc:0	"Die Beziehungen zwischen der katholischen Kirche und [ROOT.GetAdjective] republikanischen Regierungen waren selten produktiv. Es gibt keinen besseren Zeitpunkt als jetzt, um Schritte zur Beilegung unserer Differenzen zu unternehmen und den Einzelnen entscheiden zu lassen, welche Rolle die Religion in seinem Leben spielen soll."
POR_foment_peace_with_the_church_flag:0	"Hat Entscheidung abgeschlossen §YFörderung des Friedens mit der Kirche§!"
POR_curb_political_militias:0	"Politische Milizen eindämmen"
POR_curb_political_militias_desc:0	"Politische Milizen haben die Stabilität unserer Nation bedroht und werden dies auch weiterhin tun, bis wir ihnen Einhalt gebieten. Da unsere Revolution zu Hause gewonnen hat, ist es klar, dass die Zeit dafür jetzt gekommen ist."
POR_unity_and_reconciliation:0	"Einigkeit und Versöhnung"
POR_unity_and_reconciliation_desc:0	"Wir können nicht zulassen, dass die Spaltungen der ersten Republik unsere Nation auseinanderreißen. Es ist unerlässlich, dass Solidarität und Einheit gefördert werden und dass die von Salazar geförderten Spaltungen sofort überwunden werden!"
POR_end_the_political_trials:0	"Beenden Sie die politischen Prozesse"
POR_call_for_reconciliation:0	"Rufen Sie zur Versöhnung auf"
POR_hold_fair_elections:0	"Halten Sie faire Wahlen ab"
POR_hold_fair_elections_desc:0	"Es ist endlich an der Zeit, dass Portugal zur Demokratie zurückkehrt. Wir dürfen nicht länger warten, um dem Volk das zu geben, was es wirklich verdient hat!"
POR_loosen_censorship_policies_flag:0	"Hat die Entscheidung §YLockern Sie die Zensurpolitik§! abgeschlossen"
POR_end_the_political_trials_flag:0	"Hat die Entscheidung §YEnd the Political Trials§! abgeschlossen"
portugal.58.t:0	"Die [GetYear] [ROOT.GetAdjective] Parlamentswahlen"
portugal.58.d:0	"Nach mehr als einem Jahrzehnt der Diktatur und vielen weiteren Jahren des politischen Chaos und der Ungewissheit besteht kein Zweifel: Heute ist die Zeit gekommen, dem portugiesischen Volk wahre Freiheit zu bringen. Zu den wichtigsten Kandidaten für das Amt des Ministerpräsidenten gehören:\n\nJosé Norton de Matos, ehemaliger Kriegsminister und Hochkommissar von Angola. Er ist ein gemäßigter Politiker, der dem politischen Liberalismus und der Rechtsstaatlichkeit den Vorrang geben würde, während er die sozialistische Wirtschaftspolitik weitgehend aufgibt.\n\nJosé Domingues dos Santos, ehemaliger Premierminister in den Jahren der Ersten Republik, der auch viele andere prominente Positionen in republikanischen Regierungen innehatte. Ähnlich wie Norton de Matos würde er wahrscheinlich versuchen, die demokratischen Institutionen zu stärken und sich gleichzeitig für einen starken Sozialstaat und eine Arbeitsreform einsetzen, wenn auch unter Aufgabe der Zwangsverstaatlichung und einiger anderer radikaler wirtschaftspolitischer Maßnahmen.\n\nBento António Gonçalves, der derzeitige Regierungschef, der die Regierung von Salazar gestürzt hat. Obwohl er lange Zeit autoritäre sozialistische Ideologien unterstützt hat, hat er in einer Welle demokratischer Reformen seine Bereitschaft gezeigt, Reformen durchzusetzen, die ein solches System betreffen. Es besteht auch wenig Zweifel daran, dass er seine Wirtschaftspolitik weitgehend fortsetzen würde, aber der Status des politischen Gleichgewichts und die Geschwindigkeit seines sozialistischen Übergangs bringen eine gewisse Unsicherheit mit sich.\n\nDie Frage müssen die Menschen in Portugal beantworten. Wer soll uns durch unser neues goldenes Zeitalter führen?"
portugal.58.a:0	"Matos und sein unerschütterliches Engagement für die Nation werden ein helleres Morgen schmieden!"
portugal.58.b:0	"Santos' Vermächtnis einer exzellenten Regierungsführung wird Portugal voranbringen!"
portugal.58.c:0	"Gonçalves' rot gefärbte Demokratie wird unserem Volk ein besseres Morgen bescheren!"
POR_restore_economic_stability:0	"Wirtschaftliche Stabilität wiederherstellen"
POR_restore_economic_stability_desc:0	"Es ist an der Zeit, dass wir radikale, destabilisierende Wirtschaftsreformen ad acta legen. Unser Weg nach vorne ist eine wirklich faire Wirtschaft, die die Bedingungen unserer Arbeiter verbessert!"
POR_our_path_to_economic_development_decisions_taken_4_or_greater_tt:0	"Hat §Y4§! oder mehr §YOUR Path to Economic Development§! Beschlüsse umgesetzt (Aktueller Fortschritt ist §Y[?POR_our_path_to_economic_development_decisions_taken]/4§!)"
POR_upgrades_the_effects_of_all_our_path_to_economic_development_decisions_tt:0	"§GVerbessert§! die Auswirkungen aller §YOUR Path to Economic Development§! Entscheidungen."
POR_portuguese_mixed_economy:0	"Portugiesische gemischte Wirtschaft"
POR_democratic_collectivization:0	"Demokratische Kollektivierung"
POR_merit_above_ideology:0	"Verdienst vor Ideologie"
POR_merit_above_ideology_desc:0	"Der Frieden auf dem europäischen Kontinent schwindet zusehends, und Portugal muss bereit sein. Ob es uns gefällt oder nicht, der Schutz der Nation geht weit über die Vorteile einer weiteren Politisierung unserer Streitkräfte."
POR_restoring_the_portuguese_armed_forces:0	"Wiederherstellung der [ROOT.GetAdjective] Streitkräfte"
POR_expand_civil_amnesty:0	"Ausweitung der zivilen Amnestie"
POR_reintegrate_former_officers:0	"Ehemalige Offiziere reintegrieren"
POR_reintegrate_former_officers_flag:0	"Hat die Entscheidung §YReintegrate Former Officers§! abgeschlossen"
POR_depoliticized_military:0	"Entpolitisierte Armee"
POR_western_europes_model_democracy:0	"Westeuropas Musterdemokratie"
POR_red_tinted_democracy:0	"Rot gefärbte Demokratie"
POR_rehabilitate_the_armed_forces:0	"Rehabilitierung der Streitkräfte"
POR_rehabilitate_the_armed_forces_desc:0	"Die Konsolidierung unserer Revolution wird nicht wegen einer laxen Aufsicht über unser Offizierskorps enden. Wir dürfen nicht aufhören, bis alle, die unsere Ideale bedrohen, nicht mehr an der Macht sind!"
POR_protectors_of_portuguese_democracy:0	"Beschützer der [ROOT.GetAdjective]Demokratie"
POR_demand_oaths_of_loyalty:0	"Verlangen Sie Loyalitätsschwüre"
POR_clamp_down_on_anti_revolutionary_dissent:0	"Gegen anti-revolutionären Dissens vorgehen"
POR_clamp_down_on_anti_democratic_leftists:0	"Hartes Durchgreifen gegen antidemokratische Linke"
POR_army_of_the_revolution:0	"Armee der Revolution"
POR_modernize_the_junta_institutions:0	"Modernisierung der Junta-Institutionen"
POR_modernize_the_junta_institutions_desc:0	"Wenn wir unseren Status unter den anderen europäischen Nationen wiederherstellen wollen, müssen wir den Übergang zu einer freien Zivilregierung fortsetzen."
POR_a_new_status_for_the_colonies:0	"Ein neuer Status für die Kolonien"
POR_organize_guinean_provincial_elections:0	"Organisieren Sie die Wahlen in den Provinzen Guineas"
POR_organize_mozambican_provincial_elections:0	"Organisieren Sie mosambikanische Provinzwahlen"
POR_organize_angolan_provincial_elections:0	"Organisieren Sie Wahlen in den Provinzen von Angola"
POR_create_a_constitutional_judiciary:0	"Schaffung eines verfassungsmäßigen Justizwesens"
POR_continue_popular_reform:0	"Fortsetzung der Volksreform"
POR_continue_popular_reform_desc:0	"Die Konsolidierung unserer Herrschaft und, was noch wichtiger ist, der [ROOT.GetAdjective] Demokratie, sollte nicht mit der Waffe am Kopf des Volkes erfolgen. Die wahre Unterstützung des Volkes zu gewinnen, ist unser bester Weg nach vorne!"
POR_fortify_portuguese_democracy:0	"Befestigen Sie [ROOT.GetAdjective] die Demokratie"
POR_fortify_portuguese_democracy_desc:0	"Unsere revolutionäre Demokratie ist nicht die erste, die Portugal hat. Wir müssen uns weiterhin für den Schutz unserer neuen Werte einsetzen."
POR_continue_salazars_policies:0	"Die Politik von Salazar fortsetzen"
POR_continue_salazars_policies_desc:0	"Trotz jahrzehntelanger Instabilität und der erschütternden Auswirkungen der Großen Depression hat Salazars Estado Novo dem Land sowohl politischen als auch wirtschaftlichen Erfolg gebracht. Es bleibt noch viel zu tun, aber Salazar hat mehr als bewiesen, dass es der Nation unter seiner weisen Führung am besten geht!"
POR_deus_patria_e_familia:0	"Deus, Pátria e Familia"
POR_deus_patria_e_familia_desc:0	"Trotz jahrzehntelanger Instabilität und der erschütternden Auswirkungen der Großen Depression hat Salazars Estado Novo der Nation sowohl politischen als auch wirtschaftlichen Erfolg gebracht. Es bleibt noch viel zu tun, aber Salazar hat mehr als bewiesen, dass es der Nation unter seiner weisen Führung am besten geht!"
POR_support_the_spanish_nationalists_aut:0	"Unterstützen Sie die spanischen Nationalisten"
POR_support_the_spanish_nationalists_aut_desc:0	"Die spanische Gesellschaft driftet von Tag zu Tag weiter ins Chaos ab. Die Gefahr eines sozialistischen Staates auf der iberischen Halbinsel ist eine unannehmbare Möglichkeit, die immer realistischer wird, je länger wir nichts tun. Es ist pragmatisch und logisch, die Nationalisten in ihrem rechtschaffenen Kampf zu unterstützen!"
POR_found_the_portuguese_legion:0	"Gründung der Portugiesischen Legion"
POR_found_the_portuguese_legion_desc:0	"Die lange Destabilisierung der [ROOT.GetAdjective] Politik hat gezeigt, dass eine staatlich geführte Organisation für diejenigen, die dem Regime gegenüber äußerst loyal sind, notwendig ist. Portugal wird mit unserer Unterstützung sein eigenes Freikorps gegen die rote Bedrohung haben!"
POR_the_portuguese_legion:0	"Die Portugiesische Legion"
POR_employ_the_propaganda_secretariat:0	"Setzen Sie das Propagandasekretariat ein"
POR_employ_the_propaganda_secretariat_desc:0	"Das nationale Propagandasekretariat Portugals hat das Potenzial, eine entscheidende Kraft gegen alle Feinde des Regimes zu sein. Wir sollten ihm die Mittel geben, die es braucht, um an dieser Front erfolgreich zu sein."
POR_incite_fearmongering:0	"Schüren Sie Ängste"
POR_incite_fearmongering_desc:0	""
POR_propagandize_success_by_the_regime:0	"Propagieren Sie den Erfolg des Regimes"
POR_propagandize_success_by_the_regime_desc:0	"In nur wenigen Jahren hat sich [ROOT.GetNameDef] von einer instabilen, hoch verschuldeten Nation zu einem Fundament exzellenter, bescheidener Regierungsführung entwickelt. Wir werden diese Siege dem Volk bekannt machen!"
POR_extend_PVDE_security_duties:0	"PVDE Sicherheitspflichten ausweiten"
POR_extend_PVDE_security_duties_desc:0	"Liberale, Syndikalisten und kleinere Flügel der Monarchisten haben deutlich gemacht, dass sie nicht bereit sind, mit unseren Plänen für die Nation zu kooperieren. Bevor die derzeitige politische Situation erneut in den Wahnsinn abgleitet, muss unsere PVDE entschieden gegen diese Kräfte der Instabilität vorgehen."
POR_cooperation_with_the_armed_forces:0	"Zusammenarbeit mit den Streitkräften"
POR_cooperation_with_the_armed_forces_desc:0	"Unsere laufende Umstrukturierung hat unseren Streitkräften Erfolg und Loyalität gebracht. Mit ihnen und den klugen Augen unserer PVDE an unserer Seite haben die Feinde des Estado Novo keine Chance!"
POR_send_in_the_army:0	"Schickt die Armee rein"
POR_silence_militant_revolutionaries:0	"Militante Revolutionäre zum Schweigen bringen"
POR_silence_militant_revolutionaries_desc:0	"Da die Lage zu unseren Gunsten ist, werden wir den Einsatz von Gewalt gegen Syndikalisten, ausländische Marionetten und alle anderen Bedrohungen für die Stabilität des Regimes ausweiten!"
POR_ligering_republican_unrest:0	"Anhaltende republikanische Unruhen"
POR_ligering_republican_unrest_desc:0	"Obwohl ihr Einfluss in unserer Gesellschaft immer noch spürbar ist, ist die Instabilität und die Bedrohung des Regimes durch verärgerte Sozialisten deutlich zurückgegangen. Wir können endlich verkünden, dass die Stabilität in der Nation wiederhergestellt ist."
POR_utilize_the_budget_surplus:0	"Nutzen Sie den Haushaltsüberschuß"
POR_utilize_the_budget_surplus_desc:0	"Durch unsere kluge Finanzpolitik haben wir in Portugal einen Haushaltsüberschuss erwirtschaftet, der für den Wohlstand der Nation investiert werden kann. Wir sollten unsere treuen Untertanen für all das, was wir erreicht haben, belohnen!"
POR_fight_price_instability:0	"Bekämpfen Sie die Preisinstabilität"
POR_fight_price_instability_desc:0	"Wenn wir unsere Popularität bei den verschiedenen Bevölkerungsschichten unseres Landes erhalten wollen, müssen wir weiterhin aggressiv gegen die drohende Preisinstabilität vorgehen."
POR_push_forward_modest_social_benefits:0	"Bescheidene Sozialleistungen vorantreiben"
POR_push_forward_modest_social_benefits_desc:0	"Wir sollten einen Teil unseres Steuerüberschusses in einen bescheidenen Sozialstaat investieren, der die Werte des Regimes fördert."
POR_support_for_portuguese_landowners:0	"Unterstützung für [ROOT.GetAdjective] Landeigentümer"
POR_support_for_portuguese_landowners_desc:0	"Die portugiesische Aristokratie ist seit langem eine loyale Kraft des Regimes und eine Einnahmequelle für unsere umfangreichen öffentlichen Arbeiten. Wir sollten sie für ihre Loyalität belohnen, indem wir ihnen weiterhin versichern, dass wir nicht versuchen, den lukrativen Status quo zu unterbrechen."
POR_limited_economic_populism:0	"Begrenzter Wirtschaftspopulismus"
POR_limited_economic_populism_desc:0	"Wenn unser Regime inmitten des Einflusses der sozialistischen Ideologien auf der iberischen Halbinsel die Unterstützung der Bevölkerung aufrechterhalten soll, müssen wir unserer Arbeiterklasse weiterhin versprechen, dass wir ihre Interessen fördern wollen. Wir werden die Grundlagen unserer Wirtschaft nicht zerstören, aber wir können sicherlich mehr geben, um unsere loyalen, starken Untertanen zu belohnen."
POR_expand_ministerial_control:0	"Die ministerielle Kontrolle ausweiten"
POR_expand_ministerial_control_desc:0	"Unsere weise Herrschaft hat Portugal in einen Zustand erhöhter Stabilität gebracht, wie es ihn zu Zeiten der Republik nicht gegeben hat. Auch wenn dies einige interne Widerstände hervorruft, dürfen wir keine Zeit damit verschwenden, unsere Reichweite zu vergrößern, damit wir die Loyalen belohnen und alle Verräter Portugals vernichten können."
POR_tighten_the_regime:0	"Das Regime straffen"
POR_tighten_the_regime_desc:0	"Wir sollten die Gelegenheit nutzen, um unsere Herrschaft zu festigen und die verbleibende Opposition zu zerschlagen."
POR_make_examples_of_the_opposition:0	"Exempel an der Opposition statuieren"
POR_crush_lingering_leftist_opposition_AUT:0	"Zerschlagen Sie die verweilende linke Opposition"
POR_modernize_our_security_apparatus:0	"Modernisieren Sie unseren Sicherheitsapparat"
POR_modernize_our_security_apparatus_desc:0	"Ob MI6, NKVD oder antikoloniale Rebellenorganisationen - für eine Nation wie die unsere wird es immer wichtiger, über die Sicherheitsinfrastruktur zu verfügen, die wir brauchen, um Bedrohungen für unsere nationale Sicherheit aufzuspüren und zu vernichten."
POR_strengthen_the_portuguese_youth:0	"Stärken Sie die portugiesische Jugend"
POR_strengthen_the_portuguese_youth_desc:0	"Die portugiesische Jugend ist ein wichtiger Ableger der portugiesischen Legion, der viel dazu beitragen wird, eine Kultur der Loyalität und Hingabe an die Nation zu fördern. Wir sollten sie stärken und ihre Ähnlichkeiten mit anderen ausländischen Vorbildern verringern."
POR_secretariat_of_national_information:0	"Sekretariat für nationale Information"
POR_secretariat_of_national_information_desc:0	"In einer Zeit, in der die Propaganda die Unabhängigkeit der Nationen untergräbt, müssen wir über ein eigenes Institut verfügen, das bereit ist, die Errungenschaften des Estado Novo zu verteidigen."
POR_government_of_national_consensus:0	"Regierung des nationalen Konsenses"
POR_government_of_national_consensus_desc:0	"Durch entschlossenes Handeln und das Bekenntnis zu einer konsensorientierten Politik haben wir die Unterstützung des Volkes erlangt, die wir brauchen, um unsere gerechte Herrschaft über Portugal wirklich zu festigen."
POR_does_not_have_national_spirit_disgruntled_republicans_tt:0	"Hat keinen nationalen Geist §YVerärgerte Republikaner§!"
POR_solidify_popular_support:0	"Unterstützung des Volkes festigen"
POR_solidify_popular_support_desc:0	"Während wir bei unseren Streitkräften und internen Fraktionen große Loyalität genießen, müssen wir uns weiter für eine Politik einsetzen, die die Unterstützung des Volkes in ganz Portugal stärkt."
POR_promote_national_catholicism:0	"Nationalen Katholizismus fördern"
POR_promote_national_catholicism_desc:0	"Portugals Identität als katholische Nation ist wichtig für den einfachen Mann. Während atheistische Regime die Leitprinzipien ihres Volkes niederreißen, werden wir zu den Prinzipien stehen, die unser Volk leiten!"
POR_seek_concordat_with_the_holy_see:0	"Streben Sie ein Konkordat mit dem Heiligen Stuhl an"
POR_embrace_pluricontinentalism_aut:0	"Umfassen Sie den Plurikontinentalismus"
POR_embrace_pluricontinentalism_aut_desc:0	"Unsere afrikanischen Kolonien sind seit langem von entscheidender Bedeutung für den Erfolg der [ROOT.GetAdjective] Wirtschaft, und unsere Zivilisationsmission hat in beiden Ländern großen Erfolg gezeigt, indem sie die portugiesische Sprache unterrichtet und jedes andere Symbol unserer außergewöhnlichen Kultur gefördert hat. Wenn wir an diesen Symbolen unglaublichen Prestiges festhalten wollen, sollten wir uns zu unserer plurikontinentalen Identität bekennen und die Idee vorantreiben, dass die afrikanischen Ureinwohner, die in unseren vielen Kolonien leben, das Potenzial haben, ebenso [ROOT.GetAdjective] zu werden."
POR_long_term_economic_planning:0	"Langfristige Wirtschaftsplanung"
POR_long_term_economic_planning_desc:0	"Nachdem die Große Depression weitgehend überwunden und die Stabilität in ganz Portugal wiederhergestellt ist, müssen wir eine Politik fördern, die Portugal in der Welt nach vorne bringt und den Menschen in unserem Land das gibt, was sie für ihre anhaltende Tapferkeit verdient haben."
POR_tackle_demands_from_urban_centers:0	"Anforderungen der städtischen Zentren bewältigen"
POR_tackle_demands_from_urban_centers_desc:0	"Wenn wir weiterhin eine erträgliche Unterstützung aus den städtischen Zentren erhalten wollen, sollten wir bereit sein, diesen Regionen das zu geben, was sie brauchen, um der Nation Erfolg und Ansehen zu bringen."
POR_protectors_of_the_countryside:0	"Beschützer des ländlichen Raums"
POR_protectors_of_the_countryside_desc:0	"Das größte Verbrechen der frühen portugiesischen Republik war es, den einfachen Bauern dem Chaos einer übereilten, auf die Städte ausgerichteten Politik und einem unwillkommenen Säkularismus zu überlassen. Wir werden die Sache unserer großen bäuerlichen Klasse an die Spitze unserer Wirtschaftspolitik stellen!"
POR_protectors_of_the_countryside_tt:0	"§Yerbessert§! die Auswirkungen von §YSubventionierung der bäuerlichen Landwirtschaft§! und §YMaternalistische Wohlfahrt§!"
POR_plan_for_popular_education:0	"Plan für Volksbildung"
POR_plan_for_popular_education_desc:0	"Es gibt keinen vernünftigen Grund dafür, dass eine ehemalige Großmacht und wohlhabende Nation Westeuropas eine Alphabetisierungsrate aufweisen sollte, die ein Jahrhundert hinter der Großbritanniens oder Deutschlands zurückliegt. Wir müssen einen vernünftigen, aber entschlossenen Plan vorantreiben, um ganz Portugal einen grundlegenden Standard der Bildung und Alphabetisierung zu ermöglichen!"
POR_evaluate_the_changing_global_order:0	"Bewerten Sie die sich verändernde globale Ordnung"
POR_evaluate_the_changing_global_order_desc:0	"Die globale Ordnung löst sich durch die Launen von Radikalismus und Expansionismus rasch auf. Wenn Portugal in den kommenden Unruhen gewappnet sein will, müssen wir vorsichtig und pragmatisch bleiben."
POR_evaluate_the_changing_global_order_tt:0	"Entscheiden Sie sich für §YAuf das neue Spanien§!"
POR_come_to_britains_aid:0	"Kommen Sie Großbritannien zu Hilfe!"
POR_come_to_britains_aid_desc:0	"Die Briten sind seit langem unsere Beschützer und sie werden in den kommenden Unruhen unsere Hilfe brauchen. Wir werden alles tun, was wir können, um unsere langjährigen Freunde zu unterstützen!"
POR_contain_JAP:0	"Enthalten [JAP.GetNameDef]"
POR_contain_JAP_desc:0	"Der japanische Expansionismus in Ostasien wird zu einer entscheidenden Bedrohung für den regionalen Frieden und das Überleben unserer Präsenz in Übersee. Wir sollten entscheidende Maßnahmen ergreifen, um diese Bedrohung einzudämmen."
POR_portugal_first:0	"Portugal zuerst!"
POR_portugal_first_desc:0	"Der größte Fehler des 20. Jahrhunderts in Portugal war unser katastrophaler Eintritt in den Ersten Weltkrieg, der zu unsäglicher Instabilität und dem Sturz der Zivilregierung von Costa führte. Der Estado Novo wird nicht wie ein Hund sterben!"
POR_expand_the_resource_trade:0	"Erweitern Sie den Rohstoffhandel"
POR_expand_the_resource_trade_desc:0	"Wir sind in der Lage, von den Kriegsbedürfnissen der verschiedenen europäischen Mächte in hohem Maße zu profitieren. Wir sollten unsere Wirtschaft weiterhin offen für die Volkswirtschaften betreiben, die nach unseren Ressourcen schreien."
POR_embrace_the_capital_of_espionage:0	"Umarmen Sie die Hauptstadt der Spionage"
POR_embrace_the_capital_of_espionage_desc:0	"Lissabon ist die Heimat vieler Agenten ausländischer Mächte, von denen viele ein größeres Interesse an den Aktivitäten anderer Nationen haben als an den Angelegenheiten Portugals. Wenn sie keine Bedrohung für unsere nationale Sicherheit darstellen, sollten wir ausländische Aktivitäten in Portugal tolerieren, damit wir von ihrer Präsenz lernen können."
POR_reenter_international_affairs:0	"Wiedereintritt in internationale Angelegenheiten"
POR_reenter_international_affairs_desc:0	"Portugals größter Fehler während des Großen Krieges war die schwache Diplomatie unserer Regierung, die dazu führte, dass wir unvorbereitet in den Konflikt eintraten. Wir müssen bereit sein und uns sofort wieder in die internationalen Angelegenheiten einmischen!"
POR_integrate_with_the_western_economies:0	"Integrieren Sie sich in die westlichen Volkswirtschaften"
POR_integrate_with_the_western_economies_desc:0	"Unsere Verbündeten unter den westeuropäischen Nationen verfügen über ein großes wirtschaftliches Potenzial, um wichtige Handelspartner Portugals zu werden. Wir sollten die wirtschaftliche Verflechtung zu unserem beiderseitigen Wohl vorantreiben."
POR_economic_interdependency:0	"Wirtschaftliche Interdependenz"
POR_economic_interdependency_desc:0	"In dem Bewusstsein, dass der Handel zwischen Verbündeten für unsere Kriegsanstrengungen von gegenseitigem Nutzen ist, verfolgen wir eine Wirtschaftspolitik, die die gegenseitige Abhängigkeit fördert."
POR_allied_intelligence_cooperation:0	"Alliierte nachrichtendienstliche Zusammenarbeit"
POR_allied_intelligence_cooperation_desc:0	"Wir und unsere Verbündeten können viel von einer technologischen Zusammenarbeit miteinander profitieren. Eine weitere Zusammenarbeit zwischen unseren Nationen sollte so bald wie möglich erfolgen."
POR_international_and_state_defense_force:0	"Internationale und staatliche Verteidigungskräfte"
POR_international_and_state_defense_force_desc:0	"Das Portugal von heute ist eine plurikontinentale Nation mit zahllosen Bedrohungen für seine effektive Unabhängigkeit. Die daraus resultierenden Bedürfnisse sollen in der Bildung einer ultimativen Organisation zum Wohle unserer Geheimdienstbedürfnisse gipfeln."
POR_restore_valiance_to_the_nation:0	"Der Nation wieder Geltung verschaffen"
POR_restore_valiance_to_the_nation_desc:0	"Trotz der Stabilität, die der Estado Novo Portugal gebracht hat, erstickt Salazars Bescheidenheit das Potenzial Portugals: eine Großmacht, die die Geißel des Kommunismus auf der ganzen Welt herausfordern kann. Wir haben die Gelegenheit, ein neues Portugal zu schaffen, das zum Leuchtturm des Faschismus auf der Iberischen Halbinsel werden kann!"
POR_the_battle_for_the_nation:0	"Der Kampf um die Nation"
POR_restore_valiance_to_the_nation_category:0	"Die Wiederherstellung der Tapferkeit in Portugal"
POR_restore_valiance_to_the_nation_category_desc:0	"Trotz der Stabilität, die der Estado Novo Portugal gebracht hat, erstickt Salazars Bescheidenheit das Potenzial Portugals: eine Großmacht, die die Geißel des Kommunismus auf der ganzen Welt herausfordern kann. Wir haben die Gelegenheit, ein neues Portugal zu schaffen, das zum Leuchtturm des Faschismus auf der Iberischen Halbinsel werden kann!"
POR_one_revolution_to_end_them_all:0	"Eine Revolution, um sie alle zu beenden"
POR_one_revolution_to_end_them_all_desc:0	"Mit jedem Monat, den Salazars Herrschaft über Portugal andauert, verschärft sich der Klassenkonflikt, während die Nation insgesamt stagniert. Es ist klar, was geschehen muss: Salazars Herrschaft muss gewaltsam beendet werden, durch schnelles und entschlossenes Handeln!"
POR_one_revolution_to_end_them_all_tt:0	"Nach Abschluss des §YMarsches auf Lissabon§! wird §Ra Bürgerkrieg beginnen!§!"
POR_utilize_fascist_labor_organizations:0	"Nutzen Sie die faschistischen Arbeiterorganisationen"
POR_utilize_fascist_labor_organizations_desc:0	"Das 20. Jahrhundert hat neue politische Taktiken in den Mainstream vieler Länder gebracht. Ob es sich um Jugendbewegungen, politisch ausgerichtete Gewerkschaften oder etwas anderes handelt, die vielen politischen und sozialen Organisationen im ganzen Land könnten zum Zentrum der Gewinnung unserer Brüder gemacht werden."
POR_arm_fascist_trade_unions:0	"Bewaffnen Sie faschistische Gewerkschaften"
POR_sway_leftist_factory_workers:0	"Beeinflussen Sie linksgerichtete Fabrikarbeiter"
POR_mobilize_countryside_support:0	"Mobilisieren Sie Unterstützung auf dem Land"
POR_mobilize_countryside_support_desc:0	"Obwohl [ROOT.GetAdjective] ländliche Zentren das derzeitige Regime unterstützen, könnte die Verabschiedung einer Politik, die ihren sozialen und wirtschaftlichen Interessen entspricht, sicherlich dazu beitragen, ihre Unterstützung zu gewinnen."
POR_affirm_support_for_land_reform:0	"Unterstützung für die Landreform bekräftigen"
POR_radicalize_salazars_allies:0	"Radikalisierung von Salazars Verbündeten"
POR_radicalize_salazars_allies_desc:0	"Der Estado Novo ist ein Zusammenschluss zahlloser Ideologien, für deren Zusammenhalt Salazar zu inkompetent ist. Vielleicht könnte eine Einheit der Rechten gebildet werden, indem man sich seine schwache, möglicherweise fehlende Unterstützung für die Monarchie zunutze macht."
POR_center_stage_against_communism:0	"Zentrale Bühne gegen den Kommunismus"
POR_center_stage_against_communism_desc:0	"Die politische Rechte in Portugal steht geschlossen hinter einer Tatsache: dass der Sozialismus die größte Bedrohung für unsere Lebensweise und die Idee einer portugiesischen Nation darstellt. Wir sind die einzige Kraft in der Nation, die die Klasseninteressen durchsetzen und gleichzeitig die nationale Einheit Portugals schützen kann!"
POR_antagonize_socialist_organizations:0	"Sozialistische Organisationen gegeneinander aufbringen"
POR_integrate_the_monarchist_opposition:0	"Integrieren Sie die monarchistische Opposition"
POR_integrate_the_monarchist_opposition_desc:0	"In seinem Estado Novo wächst die Unterstützung gegen Salazar. Unser letzter Schritt, um seine schwache, gespaltene Union zu stürzen, besteht darin, sie hinter drei Dingen zu vereinen: Gott, Land und König! Nieder mit der Republik!"
POR_tap_monarchist_organizations:0	"Monarchistische Organisationen anzapfen"
POR_march_on_lisbon:0	"Marsch auf Lissabon"
POR_march_on_lisbon_desc:0	"Salazars Unterstützung innerhalb der Nation bröckelt schnell. Jetzt ist es an der Zeit, Lissabon zu stürmen und diese Ära der Schwäche und der Kompromisse zu beenden!"
POR_half_of_current_authoritarian_support_is_applied_as_a_stability_penalty_tt:1	"Die Hälfte der derzeitigen §YAuthoritarian§! Unterstützung wird als §RStability§! Strafe eingesetzt:\n"
POR_march_on_lisbon_tt:0	"Wenn der Fokus §YOne Revolution to End Them All§! abgeschlossen ist:"
portugal.43.t:0	"Blueshirts stürmen die Nationalversammlung"
portugal.43.d:0	"Als Salazars Griff um die Macht immer mehr ins Wanken geriet, gingen sozialistische und faschistische Organisationen in Lissabon auf die Straße. Salazar nutzte die Gelegenheit und rief die Nationale Armee herbei, um unsere rechtschaffene Sache zu zerschlagen. Nach vielen chaotischen Stunden des Kampfes meuterten große Teile der Armee für unsere Sache und die kommunistische Bedrohung war endgültig besiegt!"
portugal.43.a:0	"Der heutige Tag ist nur der Beginn von Portugals neuem goldenen Zeitalter!"
portugal.44.d:0	"Als Salazars Griff um die Macht ins Wanken geriet, gingen sozialistische und faschistische Organisationen in Lissabon auf die Straße. Salazar nutzte die Gelegenheit und rief die Nationale Armee herbei, um die verschiedenen Paramilitärs, die um die Nation kämpften, zu zerschlagen. Frieden kann es in unserem Portugal nicht mehr geben, das haben die Realitäten von heute deutlich gemacht:"
POR_economic_shocks:0	"Wirtschaftliche Schocks"
POR_economic_shocks_desc:0	"Das politische Chaos und die jüngste Rückgängigmachung der bewährten Finanzpolitik von Salazar verursachen ernste Probleme für die [ROOT.GetAdjective] Wirtschaft. Es ist an der Zeit, dass wir Portugal auf einen neuen wirtschaftlichen Weg bringen, wenn wir dem Land Erfolg bringen wollen."
POR_brawling_in_urban_centers:0	"Schlägereien in den Stadtzentren"
POR_brawling_in_urban_centers_desc:0	"Trotz unserer wachsenden Kontrolle über das Land führen militante, vor allem sozialistische Gruppen überall in unserem Land Konflikte und versuchen, uns alle zu spalten. Diese Verräter müssen um jeden Preis vernichtet werden!"
POR_faltering_rural_support:0	"Schwindende Unterstützung auf dem Land"
POR_faltering_rural_support_desc:0	"Die [ROOT.GetAdjective] Landbevölkerung ist weitgehend desinteressiert an der Politik der Nationalen Syndikalisten. Wir müssen sie für uns gewinnen, wenn wir einen verheerenden Konflikt im Landesinneren vermeiden wollen."
POR_apathy_throughout_rural_regions:0	"Apathie in den ländlichen Regionen"
POR_growing_rural_support:0	"Wachsende Unterstützung auf dem Land"
POR_unifier_of_the_countryside:0	"Vereinheitlichung des ländlichen Raums"
POR_march_on_lisbon_category:0	"Der Nation ihren Mut zurückgeben"
POR_march_on_lisbon_category_desc:0	"Dass Salazar Portugal verlassen hat, ist nur der Anfang unserer großen Ambitionen für die Nation. Angesichts der anhaltenden kommunistischen Bedrohung und der drohenden Gefahr interner Unruhen müssen wir schnell handeln, um Portugal wieder zu neuem Mut zu verhelfen!"
POR_all_against_the_bolshevik_threat:0	"Alle gegen die bolschewistische Bedrohung"
POR_all_against_the_bolshevik_threat_desc:0	"Trotz unserer Erfolge an der Front ist der Teufel des Bolschewismus noch immer in unserem Land unterwegs. Wir müssen unsere Aufmerksamkeit sofort auf diese Bedrohung richten!"
POR_embark_upon_the_european_continent:0	"Auf den europäischen Kontinent vorstoßen"
POR_embark_upon_the_european_continent_desc:0	"Nachdem der spanische Konflikt beigelegt und die Größe unserer Nation wiederhergestellt ist, müssen wir uns den Angelegenheiten zuwenden, die unseren Kontinent verschlingen."
portugal.62.t:0	"Die galicische Frage angehen"
portugal.62.d:0	"Nach dem Ende des Spanischen Bürgerkriegs ist es an der Zeit, dass wir langfristige Beziehungen zu einer neuen Regierung in Madrid planen. Insbesondere müssen wir die galicische Frage beantworten: Was sollen wir mit unseren nördlichen Brüdern machen, die so lange unter der Fuchtel Madrids gestanden haben?"
portugal.62.a:0	"Vergessen Sie es. Das neue Regime in Madrid könnte in der kommenden Zeit ein wichtiger Verbündeter sein!"
portugal.62.b:0	"Wenn sich uns die Gelegenheit bietet, werden wir unseren Anspruch geltend machen!"
portugal.63.t:0	"Portugal fordert Galicien!"
portugal.64.t:0	"[FROM.GetName] Verweigert die Übergabe Galiciens"
portugal.64.d:0	"Obwohl das Land rechtmäßig uns gehört, hat die Regierung von [FROM.GetName] die Übertragung der Souveränität über Galicien an uns verweigert. Was sollen wir von dieser Entwicklung halten?"
portugal.64.a:0	"Sie kennen die Konsequenzen."
portugal.64.b:0	"Vergessen Sie es. Eine winzige Provinz ist es nicht wert, dass wir unsere Unabhängigkeit behalten."
portugal.65.t:0	"[FROM.GetName] Gönnt uns Galizien"
portugal.65.d:0	"Es ist ein großartiger Tag für ganz Portugal, denn [FROM.GetName] hat sich offiziell unseren Forderungen nach einem vollständigen Rückzug der galicischen Provinz gebeugt."
portugal.65.a:0	"Unsere nördlichen Brüder sind endlich zu Hause!"
POR_forcefully_nationalize_the_blueshirts:0	"Zwangsweise Verstaatlichung der Blueshirts"
POR_forcefully_nationalize_the_blueshirts_desc:0	"Obwohl sie ein wichtiger Teil unseres Erfolges sind, destabilisieren die anhaltenden Aktivitäten der Blueshirts die Nation. Wenn wir die Stabilität des Landes wiederherstellen wollen, müssen wir gegen weitere paramilitärische Aktivitäten vorgehen."
POR_restore_the_portuguese_legion_in_our_image:0	"Stellen Sie die Portugiesische Legion nach unserem Vorbild wieder her"
POR_crush_moderate_defiance:0	"Vernichten Sie gemäßigten Widerstand"
POR_crush_moderate_defiance_desc:0	"Die Marionetten von Salazar schwächen trotz der Bedrohung, die der Kommunismus für Portugal darstellt, unsere Nation weiter. Wir müssen ihren Widerstand beenden, bevor ihr rückgratloses Handeln unser Ende bedeutet."
POR_harass_reactionary_corporatists:0	"Bedrängen Sie reaktionäre Korporatisten"
POR_sponsor_blueshirt_activity:0	"Unterstützen Sie Blueshirt-Aktivitäten"
POR_sponsor_blueshirt_activity_desc:0	"Die Blueshirts sind für unsere Ideologie die größte Quelle politischen Kapitals gegen die Kräfte der Reaktion und des Sozialismus. Es ist nur logisch, ihre Rekrutierung und Finanzierung zu unterstützen, damit sie zu einer Kraft werden können, die in der Lage ist, die Nation zu schützen!"
POR_cement_the_dictatorship:0	"Zementieren Sie die Diktatur"
POR_cement_the_dictatorship_desc:0	"Wir müssen ganz Portugal klarmachen, dass Pretos Diktatur eine Kraft für das Gute ist, und eine Kraft, die bleiben wird, bis seine Mission für die Nation erfüllt ist. Jede weitere Opposition, ob innerhalb oder außerhalb der Regierung, muss unterdrückt werden."
POR_strengthen_the_secret_police:0	"Verstärken Sie die Geheimpolizei"
POR_utilize_the_propaganda_ministry:0	"Setzen Sie das Propagandaministerium ein"
POR_western_europes_anti_communist_baston:0	"Westeuropas antikommunistische Bastion"
POR_forge_a_cult_of_personality:0	"Schmieden Sie einen Personenkult"
POR_forge_a_cult_of_personality_desc:0	"Jeder Untertan unseres großen Reiches wird Preto als den außergewöhnlichen, willensstarken Mann anerkennen, der er ist. Portugals großer Niedergang ist gestoppt und wird sich unter seiner kompromisslosen Herrschaft noch umkehren!"
charismatic_dictator:0	"Charismatischer Diktator"
POR_reorientate_the_economy:0	"Neuausrichtung der Wirtschaft"
POR_reorientate_the_economy_desc:0	"Während Salazars Herrschaft wurden die Mittel für den portugiesischen Sozialstaat und die stolzen Streitkräfte massiv gekürzt. Unsere sich erneuernde Nation darf nicht länger von dieser untauglichen Finanzpolitik erdrosselt werden!"
POR_heavy_handed_development:0	"Schwerfällige Entwicklung"
POR_heavy_handed_development_desc:0	"Wenn wir die Industrialisierung Portugals ernsthaft vorantreiben wollen, ist es an der Zeit, dass der Staat in der Wirtschaft eine härtere Gangart einlegt. Wir können die rückständigen Regionen unseres Landes nicht länger im Stich lassen!"
POR_draft_portugals_own_labor_charter:0	"Entwerfen Sie Portugals eigene Arbeitscharta"
POR_draft_portugals_own_labor_charter_desc:0	"Es ist an der Zeit, dass wir unserer starken städtischen Arbeiterklasse zu verstehen geben, dass wir einen Plan haben, der ihre Bedürfnisse in den Vordergrund stellt, während wir unsere Macht weiter festigen. Portugal wird unter unserer klugen Herrschaft eine Nation der Zukunft sein!"
POR_towards_a_national_syndicalist_state:0	"Auf dem Weg zu einem nationalen syndikalistischen Staat"
POR_support_fascist_labor_organizations:0	"Unterstützen Sie faschistische Arbeiterorganisationen"
POR_support_fascist_labor_organizations_desc:0	"Gewerkschaftsorganisationen, die von der Partei unterstützt werden, sind ein Symbol der Stärke und des Prestiges für die großen Werte unseres Regimes. Wir sollten dafür sorgen, dass diese Gruppen den nötigen Rückhalt haben, um die Unterstützung des Regimes im Volk zu fördern."
POR_nationalize_struggling_industries:0	"Verstaatlichen Sie angeschlagene Industrien"
POR_syndicalize_the_vital_sectors:0	"Syndikalisieren Sie die wichtigen Sektoren"
POR_syndicalize_the_vital_sectors_desc:0	"Der [ROOT.GetAdjective] Arbeiter hat zum letzten Mal in einem erbärmlichen Zustand der Ausbeutung gelegen. Wir müssen daran arbeiten, die Bereiche der Wirtschaft zu syndikalisieren, die unsere Nation leiten, damit unsere großartigen Arbeiter die Rechte genießen können, die sie verdienen, während wir ihnen unsere Unterstützung anbieten, solange sie in unserem Interesse sind."
POR_syndicalization_of_national_industry:0	"Syndikalisierung der nationalen Industrie"
POR_syndicalize_the_vital_sectors_tt:0	"§Yereint§! die Auswirkungen von §YSyndikalisierung der lebenswichtigen Sektoren§! und §YAuf dem Weg zu einem nationalen syndikalistischen Staat§! zu einem stärkeren nationalen Geist"
POR_safeguard_rural_welfare:0	"Ländliche Wohlfahrt sichern"
POR_safeguard_rural_welfare_desc:0	"Wer wären wir, dass wir uns als Retter der [ROOT.GetAdjective] Arbeiterklasse bezeichnen, wenn wir unsere Brüder vom Lande vernachlässigen, wie es Salazar getan hat? Wir müssen radikale Programme vorantreiben, um den Lebensstandard unserer lange verarmten Landbevölkerung zu sichern."
POR_maternalistic_welfare:0	"Maternalistische Wohlfahrt"
POR_maternalistic_welfare_desc:0	"Wer wären wir, wenn wir uns als Beschützer unseres Volkes bezeichnen würden, wenn wir die Bedürfnisse des Rückgrats unserer Nation vernachlässigen? Jede Mutter in unserem [ROOT.GetNameDef] soll das bekommen, was sie braucht, um eine lebendige, wohlhabende Jugend zu schaffen!"
POR_prioritize_economic_stability:0	"Priorisieren Sie wirtschaftliche Stabilität"
POR_prioritize_economic_stability_desc:0	"Portugal wird unter unserer starken Herrschaft nicht untergehen. Wir können die Interessen unserer Arbeiterklasse voranbringen, ohne die bestehende Wirtschaftsordnung zu zerstören, wie es die Regime vor uns getan haben."
POR_prioritizing_economic_stability:0	"Vorrang für wirtschaftliche Stabilität"
POR_prioritize_economic_stability_tt:0	"§Yie Auswirkungen von §YPriorisierung der wirtschaftlichen Stabilität§! und §YHin zu einem nationalen syndikalistischen Staat§! werden zu einem stärkeren nationalen Geist zusammengeführt"
POR_revanchist_rearmament:0	"Revanchistische Wiederaufrüstung"
POR_revanchist_rearmament_desc:0	"Durch die rasche Aufkündigung des Friedens von Versailles treibt Europa sich selbst wieder voran! Damit [ROOT.GetNameDef] sich dieser Beschleunigung anschließen kann, müssen wir die Streitkräfte mutig und schnell stärken und diese Ära des Friedens und der Schwäche beenden!"
POR_eradicate_rural_illiteracy:0	"Beseitigung des Analphabetismus auf dem Land"
POR_eradicate_rural_illiteracy_desc:0	"Investitionen in die Bildung auf dem Lande sind nicht nur ein Recht, das den Menschen in unserem Land zusteht, sondern auch eine pragmatische Methode, um Innovation in dieses lange Zeit rückständige Portugal zu bringen."
POR_restore_the_empire:0	"Das Reich wiederherstellen"
POR_restore_the_empire_desc:0	"Unser Hauptanliegen, die Erlösung Portugals, hängt davon ab, dass die Brigantine-Dynastie wieder an die Macht kommt! Durch Gott, Land und König wird Portugal die Weltbühne wieder betreten!"
POR_king_duarte_nuno:0	"König Duarte Nuno"
POR_request_axis_membership:0	"Achsenmitgliedschaft beantragen"
POR_request_axis_membership_desc:0	"Unsere langjährige Freundschaft mit den Briten hat uns weit gebracht, und jetzt gerät sie in direkten Konflikt mit unseren Interessen. Die Deutschen wollen auf dem gesamten Kontinent eine neue Ordnung errichten, an der sich auch das neue Portugal beteiligen wird!"
POR_align_with_rome:0	"Verbünden Sie sich mit Rom"
POR_align_with_rome_desc:0	"Unsere langjährige Freundschaft mit den Briten hat uns zwar weit gebracht, aber es wird immer deutlicher, dass sie die Bedürfnisse Portugals nicht vertreten haben. Die Italiener haben hart daran gearbeitet, Einfluss im gesamten Mittelmeerraum zu gewinnen; eine solche Vereinbarung entspricht eindeutig den [ROOT.GetAdjective] Interessen!"
POR_avenge_our_overseas_losses:0	"Rache für unsere Verluste in Übersee"
POR_avenge_our_overseas_losses_desc:0	"Für Portugal ist es an der Zeit, den Blick nach außen zu richten und nicht länger hinzunehmen, wie kläglich unser imperialer Status geworden ist. Die Gelegenheit für eine aggressive Remilitarisierung und eine Stärkung unseres großen imperialen Erbes muss sofort kommen!"
portugal.66.t:0	"Die Frage der rosafarbenen Karte"
portugal.66.desc:0	"Jetzt, da die Briten im Niedergang begriffen sind und unsere große Nation wieder auf dem Vormarsch ist, ist es zweifellos an der Zeit, sich mit unseren alternden afrikanischen Kolonialansprüchen zu befassen. Sollen wir uns erneut um die Gebiete bemühen, die Mosambik mit Angola verbinden?"
portugal.66.a:0	"Ein Krieg mit London wäre unser Untergang. Wir dürfen diesen Anspruch im Moment nicht verfolgen."
portugal.66.b:0	"Die Lage Londons ist prekär. Vielleicht kann diese Tatsache von uns ausgenutzt werden..."
portugal.66.c:0	"Wir werden nicht die erste Nation sein, die die Briten demütigt. Wir werden auch nicht die letzte sein!"
portugal.66.d:0	"Großbritanniens Macht in der Region schwindet. Lassen Sie uns die Zeit abwarten."
portugal.66.e:0	"Jetzt, da Großbritannien aus der Region verschwunden ist, wer sollte uns jetzt noch aufhalten?"
portugal.67.t:0	"Portugal bietet Freundschaft für historische Kolonialansprüche"
portugal.67.d:0	"Während viele unserer ehemaligen Herrschaftsgebiete im Chaos versinken, haben wir einen unerwarteten Besuch des portugiesischen Botschafters erhalten. Als Gegenleistung für die Rückgabe der portugiesischen Ansprüche auf Afrika aus dem 19. Jahrhundert haben sie uns ein umfassendes Bündnis in globalen Angelegenheiten angeboten, was in unserem Kampf um die Rückeroberung der restlichen Gebiete unseres Reiches sicherlich ein gutes Zeichen sein könnte. Was sollen wir unseren langjährigen portugiesischen Freunden sagen?"
portugal.67.a:0	"Die anglo-portugiesische Allianz soll gestärkt werden!"
portugal.67.b:0	"Das ist lächerlich, natürlich werden wir das nicht tun!"
POR_prepare_the_african_theater:0	"Bereiten Sie das afrikanische Theater vor"
POR_prepare_the_african_theater_desc:0	"Wir haben die Entschlossenheit und die Kraft, unser verlorenes Land zurückzuerobern, aber es fehlt uns an der nötigen Infrastruktur. Wir müssen in unseren Kolonien aggressiv militärisch aufrüsten, wenn wir sie jemals miteinander verbinden wollen!"
POR_abandoned_african_colonial_claims_flag:0	" Hat §RAbandoned§! historische Ansprüche in diesen Ländern, oder hat sie bereits erhalten"
POR_submit_an_ultimatum_to_britain:0	"Stellen Sie ein Ultimatum an Großbritannien"
POR_conquer_rhodesia:0	"Erobern Sie Rhodesien"
POR_subjugate_malawi:0	"Malawi unterjochen"
POR_end_zambian_independence:0	"Beendet die sambische Unabhängigkeit"
POR_prepare_the_african_theater_tt:0	"Entschließt sich zu §RDemand§! Kontrolle über §YZambia§!, §YRhodesien§! und §YMalawi§!"
r56_logistical_buildup:0	"Logistische Aufrüstung"
portugal.68.t:0	"Portugal fordert afrikanische Konzessionen"
portugal.68.d:0	"Der portugiesische Botschafter hat offiziell ein Ultimatum an [ENG.GetLeader] gestellt und den freundlichen Vorschlag gemacht, dass wir unsere kolonialen Garnisonen in Portugals historisch beanspruchten Kolonialgebieten im südlichen Afrika aufgeben sollten. Was sollen wir angesichts einer festgestellten portugiesischen Mobilisierung auf ihre Kriegsdrohungen antworten?"
portugal.68.a:0	"Glauben diese Narren, dass sie sich gegen uns behaupten können?"
portugal.68.b:0	"Bei unserem Stand der Dinge haben wir keine andere Wahl."
portugal.69.t:0	"Großbritannien hat sich aus den von uns beanspruchten Gebieten zurückgezogen!"
portugal.69.d:0	"Heute hat sich Großbritannien offiziell aus den von uns beanspruchten Gebieten in Afrika zurückgezogen und begründet dies mit der 'Belastung' für seine nationale Sicherheit."
portugal.69.a:0	"Ein großer Triumph für unsere Nation!"
portugal.70.t:0	"Großbritannien weigert sich, sich zurückzuziehen!"
portugal.70.d:0	"Großbritannien hat uns eine offizielle diplomatische Antwort geschickt, in der es uns klar macht, dass es sich unter keinen Umständen aus den umstrittenen Gebieten im südlichen Afrika zurückziehen wird."
portugal.71.b:0	"Wir haben nicht für unsere Unabhängigkeit gekämpft, nur um uns erneut zu versklaven!"
portugal.72.t:0	"[FROM.GetName] Unterwirft sich unserer Herrschaft!"
portugal.72.d:0	"[FROM.GetName] hat heute offiziell vor unserer Forderung nach vollständiger Unterwerfung unter die portugiesische Krone kapituliert. Dies ist ohne Zweifel ein großer Sieg für unsere Nation!"
portugal.73.t:0	"[FROM.GetName] hat sich geweigert!"
portugal.73.d:0	"Die schwache und erbärmliche Nation von [FROM.GetName] hat offiziell unser Ultimatum für ihre Unterwerfung abgelehnt. Diese Narren werden den ultimativen Preis für ihren Ungehorsam zahlen."
POR_destabilize_brazil:0	"Destabilisieren Sie Brasilien"
POR_destabilize_brazil_desc:0	"In Brasilien gibt es zahllose Ursachen und ethnische Gruppen, die Lissabon zwar nicht wohlgesonnen sind, aber dennoch gut funktionieren würden, um das derzeitige Regime zu schwächen und uns die Annexion dieses weitaus größeren Gebiets zu ermöglichen."
r56_gains_claim_on_all_brazilian_states_and_all_states_owned_by_them_tt:0	"Erhebt Ansprüche auf alle §YBrazilian§! Kerne und Staaten, die ihnen gehören"
portugal.59.t:0	"Portugal erhebt Anspruch auf Kronland über Brasilien!"
portugal.59.d:0	"In einer aufrührerischen Rede vor einer Menschenmenge in Lissabon hat Portugals [POR.GetLeader] Äußerungen gemacht, die darauf hindeuten, dass die brasilianische Zivilisation als ein Produkt der portugiesischen Zivilisation kein Recht auf weitere Selbstbestimmung hat. Es wird immer deutlicher, dass dieses neue, chauvinistische, expansionistische Regime zu einer Bedrohung für die globale Stabilität wird."
portugal.59.a:0	"Und ich dachte, meine Witze wären schlecht."
POR_host_a_royal_wedding_in_brazil:0	"Veranstalten Sie eine königliche Hochzeit (Brasilien)"
POR_host_a_royal_wedding_in_brazil_desc:0	""
POR_host_a_royal_wedding_in_brazil_tt:0	"Nach Abschluss von §YA Rache der Katastrophe von 1821§! wird in Brasilien ein §RBürgerkrieg§! ausbrechen!"
POR_avenge_the_1821_disaster:0	"Rächen Sie die Katastrophe von 1821!"
POR_avenge_the_1821_disaster_desc:0	"Das 19. Jahrhundert hat Portugal von einer untergehenden zu einer sterbenden Macht gemacht. Trotz unserer großen Demütigung werden wir der Welt zeigen, was wir wirklich noch werden können, indem wir das brasilianische Kernland zurückerobern!"
POR_avenge_the_1821_disaster_tt:0	"In §YBrasilien§! wird ein pro-monarchistischer Bürgerkrieg beginnen, in den wir hineingezogen werden!§!"
POR_avenge_the_1821_disaster_2_tt:0	"Wenn die Entscheidung §YHost a Royal Wedding in Brazil§! vollzogen wird, wird in §YBrazil§! ein pro-monarchistischer Bürgerkrieg beginnen, §Rdraging us into it!§!"
POR_proclaim_porto_brazilian_reunification:0	"Proklamieren Sie die portugiesisch-brasilianische Wiedervereinigung"
POR_proclaim_porto_brazilian_reunification_desc:0	"Mit unserem vernichtenden Sieg über das kurzzeitig geschiedene Brasilien ist die Zeit gekommen, unsere Errungenschaft zu verkünden: Unser Kronjuwel ist wieder in unserer Hand!"
portugal.61.t:0	"Portugal fordert die direkte Integration"
portugal.61.a:0	"Wir haben keine andere Wahl als nachzugeben"
POR_integrate_the_brazilian_administration:0	"Integrieren Sie die brasilianische Verwaltung"
POR_integrate_the_brazilian_administration_desc:0	"Mit der zunehmenden Zustimmung zu unserer Herrschaft in Brasilien ist es vielleicht an der Zeit, diese lange zerrissenen Länder endlich zu integrieren. Durch Gott, Land und König sind unsere Völker wieder geeint!"
POR_integrate_the_brazilian_administration_tt:0	"Kontrolliert und hat mindestens 40% Zustimmung in allen Küstenstaaten §YBrazilian§!."
POR_proclaim_the_fifth_empire:0	"Rufen Sie das Fünfte Reich aus"
POR_proclaim_the_fifth_empire_desc:0	"Als eine Bastion der Zivilisation auf allen Kontinenten sind wir in der Lage, unsere große portugiesische Nation in geistiger, kultureller und sprachlicher Hinsicht zur globalen Hegemonie zu führen. Wie die Griechen und Römer vor uns werden auch wir dieser Welt unser eigenes Erbe hinterlassen!"
POR_the_fifth_empirer56:0	"Das Fünfte Reich"
POR_the_fifth_empirer56_desc:0	"Als eine Bastion der Zivilisation auf allen Kontinenten sind wir in der Lage, unsere große portugiesische Nation in geistiger, kultureller und sprachlicher Hinsicht zur globalen Hegemonie zu führen. Wie die Griechen und Römer vor uns werden wir ein eigenes Vermächtnis auf dieser Welt hinterlassen!"
POR_gains_claim_on_all_INS_states_tt:0	"Erhebt Anspruch auf alle §Y[INS.GetAdjective]§! Staaten"
POR_gains_claim_on_singapore_brunei_and_all_MAL_states_tt:0	"Erhebt Anspruch auf §YSingapore§!, §YBrunei§! und alle §Y[MAL.GetAdjective]§! Staaten"
POR_direct_farmland_to_industrial_projects_desc:0	"Es ist eine kalte Wahrheit, dass die Landwirtschaft als Einkommensquelle der Vergangenheit angehört. Wenn wir eine wirklich industrialisierte, entwickelte Nation werden wollen, müssen wir den Besitz von lebenswichtigem Land zum Zwecke der Beschleunigung unserer Industrialisierung einschränken."
POR_portugals_road_to_democracy_desc:0	"Es wäre eine unannehmbare Tragödie, wenn unser Kampf gegen die Tyrannei von Salazar zu einem weiteren brutalen Regime führen würde. Wir müssen daran arbeiten, eine Regierung zu schaffen, die wirklich aus dem Volk kommt, das so hart für unsere Sache gekämpft hat!"
POR_call_for_reconciliation_desc:0	"Wenn wir die bürgerlichen Freiheiten wiederherstellen und die politische Gewalt beenden wollen, müssen wir uns gegen alle auf beiden Seiten stellen, die zu Gewalt und Vergeltung aufrufen. Frieden ist unser bester Weg nach vorne, und das Volk soll diese Wahrheit erfahren!"
POR_portuguese_mixed_economy_desc:0	"Auch wenn der Estado Novo keine Wirtschaft betrieben hat, die gut für unsere Arbeiter war, müssen wir unbedingt die Bereiche anerkennen, in denen das Regime erfolgreich war. Eine stabile Wirtschaft, die denjenigen, die am produktivsten sind, ein gewisses Maß an Belohnung gewährt, ist wichtig für unsere nationale Entwicklung."
POR_democratic_collectivization_desc:0	"Auch wenn viele unserer revolutionären Brüder zu plump vorgehen, ist es klar, dass entschlossenes Handeln erforderlich ist, um [ROOT.GetNameDef] auf einen tragfähigen wirtschaftlichen Weg zu bringen. Eine starke Planwirtschaft ist eine notwendige Komponente, um unsere industriellen Ziele zu erreichen und gleichzeitig die Rechte der Arbeiter an allen Ecken und Enden zu fördern."
POR_accommodate_europes_balance_of_power:0	"Das europäische Gleichgewicht der Kräfte berücksichtigen"
POR_accommodate_europes_balance_of_power_desc:0	"Trotz der Arbeit, die in Versailles geleistet wurde, ist revanchistischer Expansionismus zur Außenpolitik von viel zu vielen Nationen geworden. Jede Ordnung auf dem Kontinent, egal wie zerbrechlich sie ist, muss um jeden Preis geschützt werden."
POR_western_europes_model_democracy_desc:0	"In nur wenigen Jahren haben wir [Root.GetNameDef] von einem Rückstau in Westeuropa zu einer modernen Demokratie geführt, die bürgerliche Freiheiten und ein Gleichgewicht der Kräfte fördert. Wir sind das strahlende Licht inmitten der Dunkelheit auf unserem Kontinent!"
POR_red_tinted_democracy_desc:0	"In nur wenigen Jahren haben wir [Root.GetNameDef] von einem Rückstau in Westeuropa zu einer modernen Demokratie gebracht, die den einfachen Menschen verteidigt. Wir werden ein Beispiel für alle sein, die unter reaktionären Diktaturen leiden!"
POR_refuse_the_naval_blockade_decision_tt:0	"Wenn dieser Beschluss freigeschaltet ist, werden Länder, die sich im Krieg mit §Y[ENG.GetNameDef]§! befinden, Beschlüsse freischalten, um unsere Konvois zu nutzen, um ihre §YWar Support§! im Austausch für offmap §YCivilian Factories§! zu erhöhen."
portugal.63.d:0	"Trotz unseres langjährigen, rechtmäßigen Anspruchs auf das Territorium hat die [FROM.GetAdjective]-Regierung unserem ausländischen Botschafter ein Ultimatum gestellt und den vollständigen Rückzug aus der galicischen Provinz gefordert. Was sollen wir von dieser lächerlichen Forderung halten?"
POR_direct_farmland_to_industrial_projects_desc:0	"Es ist eine kalte Wahrheit, dass die Landwirtschaft als Einkommensquelle der Vergangenheit angehört. Wenn wir eine wirklich industrialisierte, entwickelte Nation werden wollen, müssen wir den Besitz von lebenswichtigem Land zum Zwecke der Beschleunigung unserer Industrialisierung einschränken."
