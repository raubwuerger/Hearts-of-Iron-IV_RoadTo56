POR_the_portuguese_new_economic_policy_desc:0	"Der sowjetische Übergang vom Kriegskommunismus zu Lenins Neuer Wirtschaftspolitik brachte ihm die Unterstützung der russischen Agrargesellschaft, die er brauchte, um den Bürgerkrieg zu gewinnen. Auch wenn unsere wirtschaftliche Entwicklung noch lange nicht abgeschlossen ist, hat sich die Neue Wirtschaftspolitik als ein großartiger Rahmen erwiesen, auf dem wir später aufbauen können!"
POR_the_red_industrial_revolution_desc:0	"Eine moderate Wirtschaftspolitik reicht nicht aus, um die schnelle Industrialisierung zu erreichen, die wir für die kommenden Kämpfe benötigen. Wir brauchen eine starke zentrale Planung, um die sozialistische Industriewirtschaft einzuführen, die unsere Arbeiter brauchen."
POR_the_question_of_nationalization_desc:0	"Wir haben zwar allgemeine Erklärungen zum wirtschaftlichen Wandel abgegeben, aber wir müssen noch zeigen, wie unsere genaue Politik aussehen wird. Dazu sollten wir bald mehr sagen, wenn wir die Unterstützung unseres Volkes gewinnen wollen!"
POR_transitioning_to_a_mixed_economy_desc:0	"Ein gemischtes Wirtschaftsmodell, das die freie Wirtschaft fördert und gleichzeitig die Rechte der Menschen schützt, ist eine Politik, die nachweislich funktioniert und Innovationen auf allen Ebenen fördern wird."
POR_slow_collectivization_desc:0	"Eine Wirtschaftspolitik mit moderaten Eingriffen zur Unterstützung des industriellen Wachstums könnte schnell zu wirtschaftlichem Fortschritt führen und gleichzeitig wirtschaftliche Schocks vermeiden, die anderswo zu beobachten waren."
POR_heavy_handed_central_planning_desc:0	"Eine rigorose zentrale Planung könnte den raschen Wandel herbeiführen, der für unsere Industrialisierung und die von uns geforderte Stärkung der Arbeitnehmerrechte notwendig ist. Es besteht zwar das Risiko wirtschaftlicher Instabilität oder eines kurzfristigen Absinkens des Lebensstandards, aber am Ende wird es sich lohnen."
POR_looming_economic_disaster_desc:0	"Unsere Wirtschaftspolitik ist zu weit gegangen und beeinträchtigt die Stabilität unseres Landes erheblich. Wir sollten von der aggressiven Kollektivierungspolitik abrücken, wenn wir einen Staatskollaps vermeiden wollen."
POR_factory_recruitment_drive_desc:0	"Die Fabriken, die unsere Kriegsindustrie antreiben, brauchen dringend Arbeiter, um ihre Reihen zu füllen. Wir werden mit allen uns zur Verfügung stehenden Mitteln Rekrutierungsaktionen durchführen und unserer Rüstungsindustrie die Männer bringen, die sie braucht, um ihre Produktion zu steigern!"
POR_end_the_political_trials_desc:0	"Die Fortsetzung der politischen Prozesse trägt nur dazu bei, die Gräben zwischen den Revolutionären und denjenigen zu vertiefen, die berechtigte Beschwerden hatten, die Salazars Aufstieg begünstigten. Um die Polarisierung unserer Gesellschaft zu beenden, müssen diese Prozesse beendet werden, die unser Volk gegeneinander aufhetzen."
POR_protectors_of_portuguese_democracy_desc:0	"Die [ROOT.GetAdjective] Streitkräfte müssen zu einer weitgehend unpolitischen Kraft werden, die nur in den Staat eingreift, um unsere demokratischen Werte zu schützen. Antidemokratische Aktionen von Kräften jeglicher Ideologie können also keinen Erfolg haben, solange die Fahnen unserer Streitkräfte durch unseren Himmel wehen!"
POR_demand_oaths_of_loyalty_desc:0	"Reaktionäre in unseren Streitkräften beeinträchtigen ihre Funktionalität. Wir müssen unbedingt dafür sorgen, dass unsere revolutionären Ideale in unsere militärischen Einrichtungen einfließen. Wir sollten von allen, die eine Gefahr für die Revolution darstellen könnten, sofort einen Treueeid auf die Sache verlangen."
POR_clamp_down_on_anti_revolutionary_dissent_desc:0	"Die Ablehnung der Revolution ist in unseren Streitkräften immer noch weit verbreitet. Wir müssen uns mehr anstrengen, um unseren Einfluss auf diese für die Verteidigung unserer Nation wichtigen Institutionen zu stabilisieren."
POR_clamp_down_on_anti_democratic_leftists_desc:0	"Uneinigkeit im Militär könnte eine ernsthafte Bedrohung für die Stabilität unserer Nation darstellen, wenn verschiedene antidemokratische Kräfte Teile unseres Militärs in ihre Gewalt bringen. Wir müssen Maßnahmen ergreifen, um sicherzustellen, dass die Rechtsstaatlichkeit und der Liberalismus in unseren Streitkräften Unterstützung finden."
POR_army_of_the_revolution_desc:0	"Die Streitkräfte der Nation haben sich zu standhaften Verteidigern der Volksrevolution entwickelt. Zivile Unruhen durch reaktionäre und faschistische Kräfte werden nie wieder Erfolg haben, solange die Fahnen unserer Streitkräfte durch unseren Himmel wehen!"
POR_a_new_status_for_the_colonies_desc:0	"Wir haben zwar ein beeindruckendes Maß an sprachlicher Integration erreicht und eine große, zivilisierte Mestizo-Bevölkerung in unseren Kolonien geschaffen, aber wir müssen auch erkennen, dass die zivilisatorische Mission gescheitert ist. Der Übergang zu echter Autonomie für unsere Kolonien ist, zumindest im Moment, der einzige Weg, um unsere Herrschaft über diese weit entfernten, bevölkerungsreichen Überseeprovinzen zu sichern."
POR_create_a_constitutional_judiciary_desc:0	"Nachdem sich unsere Revolution gefestigt hat, müssen wir die Konsolidierung der liberalen Institutionen gewährleisten. Ein unpolitisches Gericht, das sich mit der Auslegung von Gesetzen befasst, würde einen großen Beitrag zur Beilegung von Streitigkeiten leisten, die unsere Nationalversammlung in Anspruch nehmen würden."
POR_the_portuguese_legion_desc:0	"Die Portugiesische Legion ist eine von Salazars Estado Novo geschaffene paramilitärische Einheit, deren Aufgabe es ist, das geistige Erbe der Nation zu verteidigen und die linke Gewalt zu bekämpfen, die unser Volk bedroht. In häufiger Zusammenarbeit mit der Geheimpolizei ist sie eine wichtige Verteidigungslinie für Salazars Kontrolle über die Nation."
POR_send_in_the_army_desc:0	"Die Bedrohung durch revolutionäre Milizen belastet das tägliche Leben unseres Volkes und stellt eine Gefahr für die Nation dar. Bei Bedarf kann das Militär hinzugezogen werden, um Gewaltandrohungen dieser Organisationen zu zerstreuen."
POR_make_examples_of_the_opposition_desc:0	"Unfrieden, Aufrufe zur Gewalt, Aufrufe zum Umsturz der Ordnung, die wir so hart erkämpft haben - sind das die Werte, für die unser Volk kämpfen soll? Bescheidenheit und Stabilität sind alles, was wir brauchen, um unser Land zum Wohlstand zu führen!"
POR_crush_lingering_leftist_opposition_AUT_desc:0	"Die Bedrohung des [ROOT.GetAdjective]-Volkes durch den Zorn des Sozialismus schwindet von Tag zu Tag, aber das bedeutet nicht, dass wir es dulden können, dass sie weiter besteht. Jetzt, wo die Beute des Sieges so nah ist, müssen wir unsere Maßnahmen gegen diese Bedrohung verdoppeln, bevor diese Narren sich neu organisieren können!"
POR_seek_concordat_with_the_holy_see_desc:0	"Der Katholizismus bleibt im Leben der [ROOT.GetAdjective] Menschen sehr wichtig. Wenn wir uns Nationen wie Italien, Jugoslawien und Österreich anschließen, um ein Konkordat mit dem Vatikan zu schließen, würde das unsere Herrschaft über die Nation erheblich legitimieren."
POR_come_to_britains_aid_dem_desc:0	"Die Briten waren lange unsere Beschützer und sind die besten Beschützer unserer Werte, die wir uns wünschen können. Unsere langjährigen Freunde werden unsere unerschütterliche Unterstützung gegen die Welle des Radikalismus haben, die unseren Kontinent überschwemmt!"
POR_arm_fascist_trade_unions_desc:0	"Die faschistischen Gewerkschaftsorganisationen in ganz Portugal sind der beste Verbündete, den wir gegen die Behauptung haben, wir würden für irgendjemanden kämpfen, nur nicht für den einfachen Mann. Während Salazar jede Gelegenheit nutzt, die organisierte Arbeiterschaft zu zerschlagen, werden wir mit aller Entschlossenheit zuschlagen!"
POR_sway_leftist_factory_workers_desc:0	"Auch wenn der Kommunismus zweifellos eine böse Ideologie ist, so gibt es doch eine Unzahl von Beschwerden, die unsere großen Industriearbeiter gegen die Auswirkungen des Kapitalismus in Portugal haben. Wir sollten gleich am ersten Tag einen Plan verkünden, wie wir Tag und Nacht für das Wohlergehen der tapferen Männer in unserer Industrie arbeiten werden."
POR_affirm_support_for_land_reform_desc:0	"Das [ROOT.GetAdjective] Land ist immer noch bettelarm, obwohl die Auswirkungen der Depression weitgehend überwunden sind. Das ist der Beweis, den unsere großen Arbeiter brauchen, um zu zeigen, dass Salazars Estado Novo sich nicht um ihre Lage kümmert! Wir werden einen breit angelegten Plan zur Landreform für die Nation ankündigen, der jedes Potenzial des kommunistischen Einflusses zur Zerstörung unserer Nation zerschneidet, während die Unterstützung für unsere Sache wächst!"
POR_antagonize_socialist_organizations_desc:0	"Kommunisten und Liberale, nicht nationale Syndikalisten, sind die größte Bedrohung für unsere Lebensweise. Allein, dass wir friedlich durch unsere Straßen marschieren, reicht aus, um bei diesen roten Teufeln einen Aufschrei auszulösen, der uns Sympathien einbringt, wenn wir ihre erbärmliche Ideologie von der Halbinsel tilgen."
POR_tap_monarchist_organizations_desc:0	"Salazar hat einen beunruhigenden Mangel an Unterstützung für den rechtmäßigen König von [ROOT.GetNameDef] gezeigt. Indem wir unsere Loyalität zur Sache betonen, können wir vielleicht die materielle und politische Unterstützung gewinnen, die wir brauchen, um unsere ideologische Unterstützung zu stärken."
POR_peace_with_the_salazaristas:0	"Frieden mit den Salazaristas"
POR_peace_with_the_salazaristas_desc:0	"Da wir die Kontrolle über die Nation haben, haben wir bereits eine unglaubliche Leistung für unsere große Ideologie vollbracht. Eine Teilung der Nation im Gegenzug für die totale Kontrolle ist es nicht wert, dafür zu kämpfen."
POR_restore_the_portuguese_legion_in_our_image_desc:0	"Die Portugiesische Legion ist eine vielversprechende Organisation, um die nationale Einheit zu fördern und [ROOT.GetAdjective] Menschen aller Klassen zu vereinen! Wenn wir unsere Ideale in dieser Organisation fördern, könnte das unsere Kontrolle über die Regierung weit voranbringen."
POR_harass_reactionary_corporatists_desc:0	"Reaktionäre im Estado Novo sind eine Plage, die wir ausrotten müssen, wenn wir unsere Ziele für die Nation voranbringen wollen. Diese Narren sollten nicht besser behandelt werden als die Bolschewiken!"
POR_strengthen_the_secret_police_desc:0	"Die Geheimpolizei ist eines unserer besten Werkzeuge gegen sozialistische, reaktionäre und liberale Aufwiegler gleichermaßen. Wir sollten sie mit den nötigen Mitteln ausstatten, damit sie weiterhin gegen alle Bedrohungen der inneren Stabilität vorgehen kann."
POR_utilize_the_propaganda_ministry_desc:0	"Propaganda ist ein Instrument, das das vorherige Regime nicht leichtfertig eingesetzt hat. Wir sollten daraus lernen, was Salazar gelungen ist. Der Einsatz des Propagandaministeriums könnte viel dazu beitragen, die Unterstützung der Bevölkerung für unsere Sache zu gewinnen!"
POR_western_europes_anti_communist_baston_desc:0	"Wir, das [ROOT.GetAdjective] Volk, gehören zu den größten Verteidigern der Welt gegen die bolschewistische Geißel, die unser aller Leben bedroht. Die ganze Welt soll unseren gerechten Kampf kennen und spüren!"
POR_nationalize_struggling_industries_desc:0	"Viele [ROOT.GetAdjective] Organisationen haben unter der jüngsten Instabilität gelitten. Wir sollten die Gelegenheit nutzen, die sich uns dadurch bietet, um unsere Kontrolle über die Wirtschaft zu festigen!"
POR_submit_an_ultimatum_to_britain_desc:0	"Die Gelegenheit wird kommen, unsere rechtmäßigen Kolonien zurückzufordern, aber zuerst sollten wir versuchen, unser rechtmäßiges Land friedlich zurückzuerobern. Wir werden London ein Ultimatum stellen, in dem wir unsere Forderungen an die britische Regierung deutlich machen: Ziehen Sie sich vollständig aus unseren rechtmäßigen Kolonien zurück und erkennen Sie unsere gerechte Herrschaft über diese neuen überseeischen Provinzen an!"
POR_conquer_rhodesia_desc:0	"Die Existenz eines völlig unabhängigen [ZIM.GetAdjective] Staates ist eindeutig eine Bedrohung für unsere Präsenz in Übersee. Wir werden diesen Narren ein Ultimatum stellen und ihre vollständige Unterwerfung unter unser großes [ROOT.GetAdjective]-Imperium fordern!"
POR_subjugate_malawi_desc:0	"Mit ihrem unglaublichen Zugang zu einer der größten Süßwasserquellen der Welt wären die neuen unabhängigen Länder, die [MLI.GetNameDef] umfassen, eine hervorragende Ergänzung für unser Reich! Was sollte uns jetzt noch davon abhalten, unseren historischen Anspruch auf dieses Land geltend zu machen?"
POR_end_zambian_independence_desc:0	"Die [ZAM.GetAdjective] Länder sind das Haupthindernis für die Landverbindung unserer wichtigen afrikanischen Kolonien. Jetzt, da sie unabhängig sind, müssen wir der regierenden Autorität dieser Länder klar machen: Sie werden sich unserer Herrschaft unterwerfen!"
