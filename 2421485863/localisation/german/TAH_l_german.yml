tahiti.plan.1.t:0	"Mysteriöser Fremder kommt an"
tahiti.plan.1.d:0	"Eine kleine Gruppe von Menschen ist mit einem Dampfschiff von einem unbekannten Ort in [USA.GetNonIdeologyName] zu unseren Ufern gekommen. Ihr Anführer, ein gut gekleideter Mann, hat sich bereits in die Gunst von [ROOT.GetLeader] gespielt und sie davon überzeugt, ihnen Asyl zu gewähren, zusammen mit ihrem Vermögen in Bargeld und Gold, das sie vor einigen Jahrzehnten "erlangt" haben. Er behauptet, dass dies von Anfang an sein Plan war und dass sie nun in unserem Land wohnen und auf einer Plantage Mangos pflücken werden."
tahiti.plan.1.a:0	"Alles läuft nach dem gottverdammten Plan."
TAH_mangoes:0	"Mangos"
TAH_mangoes_desc:0	"Vielleicht hat sich ein Leben als Verbrecher doch nicht gelohnt. Wer liebt denn keine Mangos?"
