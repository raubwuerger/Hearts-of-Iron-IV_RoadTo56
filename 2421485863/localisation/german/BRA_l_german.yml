BRA_pedro_henrique_iii:0	"Dom Pedro III."
BRA_R56_the_second_communist_putsch:0	"Der zweite kommunistische Putsch"
BRA_R56_the_second_communist_putsch_desc:0	"Die Nationale Allianz der Befreiung hat einen Putschversuch gegen Präsident Vargas unternommen. Jetzt haben die Marxisten die Möglichkeit, mit der Unterstützung der Arbeiter und des Volkes in Brasilien eine glorreiche, egalitäre sozialistische Republik zu schmieden!"
BRA_R56_non_dvcor_dvco:0	"Non Dvcor Dvco"
BRA_R56_non_dvcor_dvco_desc:0	"Nach mehr als einem Jahrhundert des konstitutionellen Lebens und des Liberalismus hat sich Brasilien in eine Diktatur ohne Bremsen und ohne Grenzen zurückentwickelt, die uns vor der zivilisierten Welt degradiert und verarmt!"
BRA_R56_usiminas:0	"USIMINAS"
BRA_R56_usiminas_desc:0	"Usinas Siderurgicas de Minas Gerais SA wird ein führendes Stahlunternehmen in der Produktion und Vermarktung von warm- und kaltgewalztem Stahl, Coils, Brammen und beschichtetem Stahl, hauptsächlich für den Investitionsgüter- und Konsumgütersektor sowie für die Automobilindustrie."
BRA_R56_a_revolta_da_armada:0	"A Revolta da Armada"
BRA_R56_a_revolta_da_armada_desc:0	"Wir müssen das Verhalten der [BRA.GetAdjective] Schiffe und die Taktik der Marinekommandeure an die moderne Seekriegsführung anpassen. Wir können die Marine-Revolte von 1893 als Erfahrung nehmen."
BRA_R56_analyze_the_paulista_war:0	"Analysiere den Paulista-Krieg"
BRA_R56_analyze_the_paulista_war_desc:0	"Der brasilianische Bürgerkrieg hat sich als Testfeld für mögliche effektive Kampftaktiken erwiesen."
BRA_R56_minas_gerais_war_doctrine:0	"Die Kriegsdoktrin von Minas Gerais"
BRA_R56_minas_gerais_war_doctrine_desc:0	"Während des Konflikts waren sich die Truppen von Minas Gerais und die Offiziere von Minas Gerais, die die Armee anführten, bewusst, dass Sao Paulo nicht in der Lage war, den Krieg lange aufrechtzuerhalten. Also gruben die Mineiros. Fest installierte Maschinengewehre unterstützten ihre Gräben, und das Feuer der nationalen Artillerie half ihnen bei ihrem langsamen, aber sicheren Vormarsch."
BRA_R56_sao_paulos_war_doctrine:0	"Die Kriegsdoktrin von São Paulo"
BRA_R56_sao_paulos_war_doctrine_desc:0	"Die öffentlichen Streitkräfte Paulistas übernahmen während des Konflikts den mobilen Krieg und den Blitzkrieg. Die Pläne des Staates São Paulo sahen eine schnelle und fulminante Bewegung in Richtung Rio de Janeiro durch das Paraíba-Tal vor, wobei die Nachhut durch die Unterstützung der anderen Staaten gesichert werden sollte."
BRA_R56_heavy_artillery:0	"Schwere Artillerie"
BRA_R56_heavy_artillery_desc:0	"Die Union verfügte über mehr Ressourcen als ihr Gegner und importierte Artillerie aus dem Ausland. Die präzisen Kanonen löschten einen ganzen Paulista-Trupp mit einem Treffer aus. Wir können unseren militärisch-industriellen Unternehmen helfen, ihre Industriezentren auf ein nie gekanntes Niveau auszubauen."
BRA_R56_the_voice_of_brazil:0	"Sende 'A Voz do Brasil'"
BRA_R56_the_voice_of_brazil_desc:0	"Die Stimme Brasiliens ist ein staatliches, radiophones Pflichtprogramm, das täglich in allen [BRA.GetAdjective] Medien ausgestrahlt wird und zur Verbreitung nationalistischer Propaganda dient."
BRA_R56_stufy_the_war_of_attrition:0	"Studiere den Zermürbungskrieg"
BRA_R56_stufy_the_war_of_attrition_desc:0	"Mit Geduld, technologischer Überlegenheit und dem Einsatz von Kugeln und nicht von Menschen waren die Truppen von Minas Gerais die effizientesten des Krieges und bescherten Brasilien einen schnellen Sieg über die Paulistas. Wir sollten das Vermächtnis der Mineiros nicht leugnen."
BRA_R56_federal_economic_bank:0	"Federal Economical Bank"
BRA_R56_federal_economic_bank_desc:0	"Die Caixa Econômica Federal (CEF), auch bekannt als Caixa Econômica Federal oder Caixa, ist ein Finanzinstitut in Form eines öffentlichen Unternehmens der [BRA.GetAdjective] Bundesregierung. Ihr Vermögen und ihre Verwaltungsautonomie haben Niederlassungen im ganzen Land."
BRA_R56_construct_the_belem_naval_dockyard:0	"Bau der Marinewerft Belém"
BRA_R56_construct_the_belem_naval_dockyard_desc:0	"Mit dem Bau des Hafens von Belém erhält das Land einen strategischen Stützpunkt im Norden, der die riesigen Flotten der Föderation unterstützen und als Basis für Invasionsoperationen nördlich des Äquators dienen kann."
BRA_R56_shock_and_awe:0	"Schock und Ehrfurcht"
BRA_R56_shock_and_awe_desc:0	"Die Paulistas haben uns allen bewiesen, dass selbst bei einem zahlenmäßigen Nachteil die Schnelligkeit und Eigenständigkeit der Truppen den Erfolg im Kampf garantieren. Lasst uns diese Taktiken übernehmen, um eine bessere Kampfeffizienz und einen überwältigend schnellen Sieg über unsere Feinde zu gewährleisten!"
BRA_R56_bndes:0	"BNDES"
BRA_R56_bndes_desc:0	"Die Nationale Bank für wirtschaftliche und soziale Entwicklung wird ein staatliches öffentliches Unternehmen mit Sitz in Rio de Janeiro sein, dessen Hauptziel die Finanzierung langfristiger Investitionen in allen Bereichen der Wirtschaft, im sozialen, regionalen und ökologischen Bereich ist."
BRA_R56_eduardo_gomes_doctrine:0	"Die Doktrin von Eduardo Gomes"
BRA_R56_eduardo_gomes_doctrine_desc:0	"Obwohl sie von der Union während des Bürgerkriegs eingesetzt wurden, sind die Bomber präziser und tödlicher geworden, seit Brasilien sie das letzte Mal eingesetzt hat. Brigadegeneral Eduardo Gomes bombardierte während dieses Krieges Campinas und schwächte mit seinem Geschwader einen Großteil der Infrastruktur der Stadt. Wir werden ihn als Anführer der Luftwaffe einsetzen."
BRA_R56_a_new_federal_capital_brasilia:0	"Eine neue Bundeshauptstadt: Brasília"
BRA_R56_a_new_federal_capital_brasilia_desc:0	"Die Verlegung der Hauptstadt ins Landesinnere war eines der nationalen Ziele seit dem Kaiserreich von Pedro II. Es wäre nicht nur für die nationale Sicherheit von Interesse, da es die Hauptstadt vor Seeangriffen schützen würde, sondern auch als Garantie für die Entwicklung des Landesinneren. Beginnen wir nun mit dem Bau dieser neuen Hauptstadt."
BRA_R56_a_new_federal_capital_brasilia_tooltip:0	"Wir wechseln in die mittlere republikanische Ära. Die neuen politischen Parteien sind etabliert und eine neue politische Klasse ist geboren."
BRA_R56_the_brazilian_action:0	"Die Brasilianische Aktion"
BRA_R56_the_brazilian_action_desc:0	"Ähnlich wie die Action Française ist die Brasilianische Gesamtaktion eine brasilianische reaktionäre Bewegung, die sich an den großen Ruhm und die vergangenen Traditionen dieser Nation anlehnt. Seine Diskussion über das Bildungs- und Kulturzentrum des Landes wird sich als wichtig für die national-patriotische Identität erweisen."
BRA_R56_ministry_of_aeronautics:0	"Ministerium für Luftfahrt"
BRA_R56_ministry_of_aeronautics_desc:0	"Mit der Gründung des Luftfahrtministeriums kann die Regierung diesen neuen Zweig der Streitkräfte der Republik verwalten."
BRA_R56_close_air_support:0	"Luftnahunterstützung"
BRA_R56_close_air_support_desc:0	"Die Reaktivierung und Modernisierung unserer Flugzeugfabrik in Lagoa Santa in der Metropolregion von Belo Horizonte wird uns helfen, die Größe unserer Luftwaffe zu erhöhen."
BRA_R56_the_sugar_belt:0	"Der Zuckergürtel"
BRA_R56_the_sugar_belt_desc:0	"Mit der Einführung von Kalkung und lokaler Bewässerung können wir trotz saurer Böden und trockener Luft im Triângulo Mineiro und Baixo Goiás eine neue Hyperregion für den Zuckerrohranbau schaffen. Der seit Jahrhunderten veraltete Zuckerrohranbau hat Zukunftspotenzial, denn es gibt Prognosen für die Verwendung von Alkohol in Industrieanlagen und als Kraftstoff."
BRA_R56_the_soy_belt:0	"Der Sojagürtel"
BRA_R56_the_soy_belt_desc:0	"Mit der Einführung fortschrittlicher Entwässerungsmethoden und der Mechanisierung der Landwirtschaft auf nationaler Ebene ist es möglich, in Mato Grosso, einer isolierten Region, Sojabohnen anzubauen. Soja wurde noch nie auf nationalem Boden angebaut. Sie hat das Potenzial, als Nahrungsmittel exportiert zu werden und als Methode für die Besiedlung des Landesinneren zu dienen."
BRA_R56_support_heavy_industry_in_sao_paulo:0	"Unterstützung der Schwerindustrie in São Paulo"
BRA_R56_support_heavy_industry_in_sao_paulo_desc:0	"Der Großraum São Paulo ist das größte Industriezentrum des Landes, Lateinamerikas und, mit staatlicher Unterstützung, eines der größten, wenn nicht sogar das größte Amerikas."
BRA_R56_grande_valley_military_complex:0	"Militärkomplex Grande Valley"
BRA_R56_grande_valley_military_complex_desc:0	"Die Regierung subventioniert den Bau eines Industriekomplexes für Kriegswaffen im Rio Grande-Tal, das das West-Paulista- und Mineiro-Dreieck umfasst."
BRA_R56_military_complex_of_the_parana_valley:0	"Militärkomplex im Paraná-Tal"
BRA_R56_military_complex_of_the_parana_valley_desc:0	"Die Regierung kann den Bau eines Industriekomplexes für Kriegswaffen im Paraná-Tal subventionieren, das den südlichen Teil von São Paulo und fast die gesamte Region Paraná umfasst."
BRA_R56_military_complex_of_the_parnaiba_valley:0	"Militärkomplex im Parnaíba-Tal"
BRA_R56_military_complex_of_the_parnaiba_valley_desc:0	"Die Regierung kann den Bau eines Industriekomplexes für Kriegswaffen im Tal des Parnaíba-Flusses im Nordosten Brasiliens subventionieren."
BRA_R56_national_defense_council:0	"Nationaler Verteidigungsrat"
BRA_R56_national_defense_council_desc:0	"Der Nationale Verteidigungsrat ist ein Beratungsgremium des brasilianischen Präsidenten für nationale Sicherheit, Außenpolitik und Verteidigungsstrategien, das vom letzten Präsidenten der Ersten Republik, Washington Luis, gegründet wurde. Er hat die Aufgabe, den Präsidenten im Falle einer Kriegserklärung oder eines Friedensschlusses, bei der Verhängung des Verteidigungs- oder Belagerungszustandes oder bei föderalen Interventionen zu beraten."
BRA_R56_under_a_single_banner:0	"Unter einem einzigen Banner"
BRA_R56_under_a_single_banner_desc:0	"[BRA.GetNameDefCap]s kulturelle und ethnische Vielfalt und seine Vorreiterrolle in sozialliberalen und neomarxistischen Bewegungen sind einer seiner Vorteile als Bastion der Arbeiterrevolution. Die Indoktrination des gramscistischen Denkens durch das nationale Bildungssystem wird dem revolutionären Staat zugute kommen."
BRA_R56_encouracados:0	"Encouraçados"
BRA_R56_encouracados_desc:0	"Brasilien hat seit seiner Unabhängigkeit die größten Bestien der Meere in seinem Arsenal gehabt. Wir werden es nicht anders machen."
BRA_R56_council_for_economics_and_finances:0	"Rat für Wirtschaft und Finanzen"
BRA_R56_council_for_economics_and_finances_desc:0	"Der Technische Rat für Wirtschaft und Finanzen wurde gegründet, um den Präsidenten bei den wirtschaftlichen und strategischen Entscheidungen des Landes zu unterstützen."
BRA_R56_the_october_manifesto:0	"Das Oktobermanifest"
BRA_R56_the_october_manifesto_desc:0	"Die [BRA.GetAdjective] Nation muss organisiert, geeint, unteilbar, stark, mächtig, reich, wohlhabend und glücklich sein. Dafür brauchen wir alle [BRA.GetAdjective], die vereint sind. Aber [BRA.GetNameDef] kann die innige und vollkommene Vereinigung seiner Kinder nicht erreichen, solange es Staaten im Staat und politische Parteien gibt, die die Nation spalten."
BRA_R56_modernize_the_electrical_infrastructure:0	"Die elektrische Infrastruktur ausbauen"
BRA_R56_modernize_the_electrical_infrastructure_desc:0	"Der Ausbau des Stromnetzes in allen Landeshauptstädten und städtischen Zentren wie Paulista West und Espírito Santo wird die Lebensqualität der [BRA.GetAdjective] und die Effizienz der nationalen Industrie verbessern."
BRA_R56_expand_the_high_voltage_grid:0	"Ausweitung des Hochspannungsnetzes"
BRA_R56_expand_the_high_voltage_grid_desc:0	"Die Ausweitung des Stromnetzes auf industriell knappe Regionen wie den Triângulo Mineiro, Paraná und Bahia könnte neue Produktionszentren schaffen, die den Fortschritt unserer Nation weiter vorantreiben."
BRA_R56_end_the_occupation:0	"Beende die Besatzung"
BRA_R56_end_the_occupation_desc:0	"Die Bundesstaaten [498.GetName] und [1004.GetName] stehen unter Kriegsrecht, seit die kommunistischen Aufstände in der Region Ende 1935 niedergeschlagen wurden. Jetzt, da die Stabilität in den Bundesstaaten wiederhergestellt ist, ist es an der Zeit, dass das normale Leben dort wieder aufgenommen wird."
BRA_R56_legacy_of_martinelli:0	"Das Erbe Martinellis"
BRA_R56_legacy_of_martinelli_desc:0	"Der Einwanderer Giuseppe Martinelli verdiente sein Geld in Brasilien mit dem transatlantischen Handel. In São Paulo hatte Martinelli das Ziel, das höchste Gebäude Lateinamerikas zu bauen. Er schaffte es durch Anpassungen in der Anlage, die zwar überlastet waren, aber nicht zuließen, dass die Fundamente gelegt wurden. So sparte er Zeit und Ressourcen und garantierte den Bau des Monuments. Daraus können wir eine Menge lernen."
BRA_R56_imbel:0	"IMBEL"
BRA_R56_imbel_desc:0	"Anstatt ihre Infanterie zu motorisieren, steigerten die Mineiros ihre Kampfeffizienz. Die Ausrüstung der legalistischen Infanterie war im Vergleich zu den Paulistas moderner, schneller und präziser, was die Verteidigung der Gräben erleichterte. Wir können Verträge mit unseren Waffenherstellern abschließen, um unsere Infanterie wieder zu modernisieren."
BRA_R56_the_estado_novo:0	"Der Estado Novo"
BRA_R56_the_estado_novo_desc:0	"In seiner ganzen Weisheit und industriellen Pionierarbeit ist ein Zentralstaat in der Lage, für das allgemeine Wohlergehen der Bürgerinnen und Bürger der Nation und den Wohlstand der Unternehmerinnen und Unternehmer zu sorgen. Dieses ewige Band zwischen den Arbeitern, Kriegern und willensstarken Geschäftsleuten der Republik soll eine dauerhafte [BRA.GetAdjective] Union garantieren."
BRA_R56_the_brazilian_expeditionary_force:0	"Die [BRA.GetAdjective] Expeditionsstreitkräfte"
BRA_R56_the_brazilian_expeditionary_force_desc:0	"Wir haben die logistische Fähigkeit, taktische, organisatorische, industrielle und zahlenmäßige Expeditionen im Ausland zu organisieren, um die Interessen der Republik gegen diejenigen zu verteidigen, die es wagen zuzuschlagen."
BRA_R56_strengthen_local_governments:0	"Lokale Regierungen stärken"
BRA_R56_strengthen_local_governments_desc:0	"[BRA.GetNameDefCap] ist kulturell, geografisch und wirtschaftlich geteilt. Das Zugeständnis einer relativen Autonomie unter der Bundesregierung an die verschiedenen föderativen Einheiten der Nation ist ein wirksames Mittel, um die Freiheit ihrer Bürger und die Fülle ihrer verfassungsmäßigen Rechte zu garantieren."
BRA_R56_federal_institutes:0	"Föderale Institutionen"
BRA_R56_federal_institutes_desc:0	"Die Föderalen Institute sind Ableger der Universitäten, die sich ausschließlich der praktischen technologischen Innovation widmen."
BRA_R56_federal_universities:0	"Föderale Universitäten"
BRA_R56_federal_universities_desc:0	"Föderale Universitäten sind sowohl Bildungszentren als auch Keimzellen für technologische Innovationen. Die ordnungsgemäße Verwertung ihrer Gewinne in technologischer Hinsicht ist für die Bemühungen der Regierung attraktiv."
BRA_R56_fiesp:0	"FIESP"
BRA_R56_fiesp_desc:0	"Die Föderation der Industrien des Bundesstaates São Paulo vertritt Tausende von Gewerkschaften und Unternehmen im ganzen Bundesstaat und artikuliert die Pläne der Regierung neben ihrem Willen, die Wirtschaft mit dem Vergnügen zu vereinen."
BRA_R56_gerdau:0	"GERDAU"
BRA_R56_gerdau_desc:0	"Gerdau S.A., auch Gerdau Gruppe genannt, ist ein [BRA.GetAdjective] Stahlkonzern. Die Einstellung von Gerdau zum Ausbau unseres Stahlsektors und der transindustriellen Infrastruktur ist im Gespräch."
BRA_R56_industrial_innovations:0	"Industrielle Innovationen"
BRA_R56_industrial_innovations_desc:0	"Unsere inzwischen umfassend modernisierte Industrie ist bereit, die Herausforderungen unserer Zeit zu meistern: Sie entwirft und produziert moderne Ausrüstung, um unseren Sieg auf dem Feld zu sichern."
BRA_R56_matarazzo_united_industries:0	"Matarazzo United Industries"
BRA_R56_matarazzo_united_industries_desc:0	"Die Industrias Reunidas Factories Matarazzo wurden von dem Einwanderer Franscesco Matarazzo im Jahr 20 gegründet. Die Gruppe besteht aus 360 Fabriken, die verschiedene Waren herstellen und den größten Teil der industriellen Nachfrage im Land abdecken können."
BRA_R56_support_the_itabira_mines:0	"Unterstütze die Itabira-Minen"
BRA_R56_support_the_itabira_mines_desc:0	"Die Minen in Itabira, Minas Gerais, sind Teil des Quadrilátero Ferrífero, der größten Eisen- und Bauxitlagerstätte des Landes und einer der größten der Welt. Wenn wir sicherstellen, dass die dort gewonnenen Mineralien nur von [BRA.GetNameDef] genutzt werden, garantieren wir unsere Rohstoffsouveränität."
BRA_R56_establish_the_commerce_ministry:0	"Das Handelsministerium einrichten"
BRA_R56_establish_the_commerce_ministry_desc:0	"Das Ministerium für Arbeit, Handel und Industrie wird die Regierung in Fragen der industriellen Expansion und Modernisierung unterstützen."
BRA_R56_lobato:0	"Lobato"
BRA_R56_lobato_desc:0	"Ein Zwischenfall zwischen zwei Nachbarn in Lobato, Bahia, widerlegte die Behauptung der Regierung, dass es auf [BRA.GetAdjective] Land kein Öl gibt."
BRA_R56_roll_out_mechanized_vehicles:0	"Mechanisierte Fahrzeuge ausrollen"
BRA_R56_roll_out_mechanized_vehicles_desc:0	"Eine der unglaublichsten Leistungen des Staates São Paulo während des Krieges war der Bau von gepanzerten Zügen. Die Züge waren mit dicken Metallplatten ausgestattet, in ihren Fenstern befanden sich Maschinengewehre und vorne eine Kanone. Wir können einige LKW-Hersteller dabei unterstützen, ein Unternehmen zu gründen, das unseren Bedarf an mechanisierten Einheiten unterdrückt."
BRA_R56_improve_military_education:0	"Verbessere die militärische Ausbildung"
BRA_R56_improve_military_education_desc:0	"Die Höhere Kriegsschule (ESG - Escola Superior de Guerra) hat das Ziel, das Wissen zu entwickeln und zu festigen, das für die Ausübung leitender und beratender Funktionen bei der Planung der Landesverteidigung erforderlich ist."
BRA_R56_the_brazilian_air_force:0	"Die brasilianischen Luftstreitkräfte"
BRA_R56_the_brazilian_air_force_desc:0	"Die Einführung von Luftstreitkräften als wesentlicher Teil der Streitkräfte der Republik ist unerlässlich, um die [BRA.GetAdjective] Macht über den Himmel zu gewährleisten."
BRA_R56_florianismo:0	"Florianismo"
BRA_R56_florianismo_desc:0	"Die Modernisierung der Marine ist wichtig, um die [BRA.GetAdjective] Macht über das Meer zu garantieren. Floriano Peixoto war der erste Admiral und Präsident der Republik. Während seiner Regierungszeit hat er unser großes maritimes Erbe bewahrt. Wir müssen es bewahren."
BRA_R56_modernize_the_madeira_mamore_br230:0	"Modernisiere die Madeira-Mamoré BR-230"
BRA_R56_modernize_the_madeira_mamore_br230_desc:0	"Die Madeira-Mamoré wurde von Percival Farquhar als Teil seines Projekts zur Verbindung quer durch Amerika gebaut Die Modernisierung und Erweiterung ihrer Strecken kann die Mobilität unserer Truppen im Norden erhöhen."
BRA_R56_modernize_the_sorocabana:0	"Die Sorocabana modernisieren"
BRA_R56_modernize_the_sorocabana_desc:0	"Die Sorocabana ist Teil des Schienennetzes im Bundesstaat São Paulo und Paraná und gehört zum größten Schienennetz des Landes. Wenn wir sie ausbauen, können wir die Mobilität unserer Truppen erhöhen."
BRA_R56_restore_the_empire:0	"Das Kaiserreich wiederherstellen"
BRA_R56_restore_the_empire_desc:0	"Seit 1889 wird die Königsfrage in unseren intellektuellen Kreisen diskutiert. Wir können unseren Kaiser dazu aufrufen, Brasilien wieder zu führen."
BRA_R56_expand_the_universities:0	"Baue die Universitäten aus"
BRA_R56_expand_the_universities_desc:0	"Mehr Universitäten bedeuten mehr Lernende und mehr Fortschritt. Die Umwandlung kleiner Hochschulen im Landesinneren in große Bildungszentren sollte eine Priorität der Regierung sein."
BRA_R56_motorize_the_army:0	"Motorisierung der Armee"
BRA_R56_motorize_the_army_desc:0	"Während des Bürgerkriegs mobilisierte die Paulista-Armee die großen Produktionszentren für Automobile in der Hauptstadt. Sie nutzte ihre Produktion, um ihre Soldaten schnell zwischen den legalistischen Schützengräben zu bewegen. Wir können in Duque de Caxias einen neuen Hersteller von Fahrzeugen gründen."
BRA_R56_natal_naval_dockyard:0	"Natal Naval Dockyard"
BRA_R56_natal_naval_dockyard_desc:0	"In Natal soll eine Marinewerft den Nordosten Brasiliens mit einem neuen Fenster zur Weltbühne versehen. Es ist zu erwarten, dass tonnenweise importierte und exportierte Waren über sie transportiert werden. Der Hafen wird vor allem zivil genutzt werden, aber wir können ihn auch für militärische Zwecke verwenden."
BRA_R56_national_institutes:0	"Nationale Institute"
BRA_R56_national_institutes_desc:0	"Die Gründung von Nationalen Instituten als fortschrittliche Forschungszentren wird den technologischen Fortschritt des Landes erheblich beschleunigen."
BRA_R56_national_security_law:0	"Nationales Sicherheitsgesetz"
BRA_R56_national_security_law_desc:0	"Das Nationale Sicherheitsgesetz ist einer der Übergangspunkte zwischen dem rechtlichen Erbe der konstitutionalistischen Revolution und der neuen brasilianischen Politik; wir sollten es im Interesse der nationalen Einheit umsetzen."
BRA_R56_federal_centre_for_nuclear_research:0	"Bundeszentrum für Nuklearforschung"
BRA_R56_federal_centre_for_nuclear_research_desc:0	"Mit einem Kernforschungszentrum kann Brasilien sowohl die Fähigkeit zur Auslöschung seiner Feinde als auch das Potenzial für unendliche Energie entwickeln."
BRA_R56_nationalize_major_infrastructure_hubs:0	"Verstaatlichung wichtiger Infrastrukturknotenpunkte"
BRA_R56_nationalize_major_infrastructure_hubs_desc:0	"Einige Infrastrukturen, die vor allem von den Briten und Amerikanern gebaut wurden, sind für das Land lebenswichtig und sorgen für große Gewinne. Die Regierung muss dafür sorgen, dass die Vorteile der Infrastruktur den Einheimischen zugute kommen und nicht durch Dekrete den Ausländern."
BRA_R56_embolden_patriotism:0	"Patriotismus ermutigen"
BRA_R56_embolden_patriotism_desc:0	"Die [BRA.GetAdjective]-Nation verlangt von den Bürgerinnen und Bürgern in allen Ecken ihres riesigen Gebietes, dass sie sich für ihre Erhaltung, Verteidigung und Entwicklung einsetzen. [BRA.GetAdjective] müssen auf diese Bestrebungen eingehen, egal ob es um das nationale Wohl oder ihre nationalen Freiheiten geht."
BRA_R56_petrobras:0	"Petrobras"
BRA_R56_petrobras_desc:0	"Petrobras ist das staatliche Unternehmen des brasilianischen Erdöls und damit verantwortlich für die Erkundung, Raffination und den Ausbau der Ölquellen im ganzen Land."
BRA_R56_skewer_the_green_hens:0	"Spieß die Grünen Hühner auf"
BRA_R56_skewer_the_green_hens_desc:0	"Die Grünen Hühner (wie wir die Integralisten nennen) widersetzen sich gewaltsam der gerechten Übernahme Brasiliens durch das Volk. Um den Sieg der Revolution zu sichern, müssen unsere Parteiführer persönlich unsere Armeen gegen den Faschismus anführen!"
BRA_R56_institute_the_polaca:0	"Die „Polaca“ einführen"
BRA_R56_institute_the_polaca_desc:0	"Die vierte Verfassung Brasiliens wurde von Getulio Vargas verkündet, um ein System einzuführen, in dessen Mittelpunkt der Präsident steht. Sie gilt als der erste Meilenstein in der Konsolidierung des Neuen Staates."
BRA_R56_polytechnical_colleges:0	"Polytechnische Hochschulen"
BRA_R56_polytechnical_colleges_desc:0	"Der Bau von Polytechnischen Hochschulen in den großen städtischen Zentren des Landes wird Tausende von jungen Menschen ausbilden, die dem Land in ihren jeweiligen produktiven Funktionen dienen können."
BRA_R56_embrace_populism:0	"Mach dir den Populismus zu eigen"
BRA_R56_embrace_populism_desc:0	"Die großen brasilianischen Führer werben durch radikale ideologische Reden, die die kollektive Meinung bewegen, um die Unterstützung großer Massen."
BRA_R56_department_of_press_and_propaganda:0	"Abteilung für Presse und Propaganda"
BRA_R56_department_of_press_and_propaganda_desc:0	"Getúlio Vargas, der großmütige Führer des [BRA.GetNameDef] und [BRA.GetAdjective] Volkes, ist die größte Hoffnung, um das tiefe Wohlergehen unserer Nation und ihres Volkes zu garantieren. Sein Verbleib an der Macht ist für die Entwicklung des Landes und den Wohlstand aller Bürgerinnen und Bürger unerlässlich und wird durch die Maßnahmen des neuen Ministeriums für Presse und Propaganda (DIP) unter der Leitung von Filinto Muller sichergestellt."
BRA_R56_a_collection_of_states:0	"Eine Sammlung von Staaten"
BRA_R56_a_collection_of_states_desc:0	"Am 9. Juli 1932 sah der Staat Sao Paulo, der an den Ergebnissen der Revolution von 1930 erstickt war, keine andere Möglichkeit, als dem Regime von Vargas den Krieg zu erklären. Heute erkennen wir unwiderlegbare Wahrheiten in dem, was die Paulistas aus den Schützengräben schrien. Die Diktatur von Vargas ist ein Affront gegen die Ehre eines Landes, das von der Kultur her so vielfältig und von den Menschen her so frei ist wie [BRA.GetNameDef]: Es ist an der Zeit, die Republik wieder zu demokratisieren."
BRA_R56_plan_salte:0	"Plan Salte"
BRA_R56_plan_salte_desc:0	"Der Plan SALTE (Gesundheit, Ernährung, Transport und Bildung) zielt darauf ab, die Entwicklung des Gesundheits-, Ernährungs-, Transport- und Energiesektors in ganz [BRA.GetNameDef] zu fördern und zu verbessern und so die Lebensbedingungen der [BRA.GetAdjective] Bevölkerung zu unterstützen und zu verbessern."
BRA_R56_national_petroleum_council:0	"Nationaler Erdölrat"
BRA_R56_national_petroleum_council_desc:0	"Die Regierung kann die neu entdeckten Ölquellen in Salvador verstaatlichen und damit die Souveränität des Landes über diese wichtige Ressource garantieren."
BRA_R56_secret_research_department:0	"Geheime Forschungsabteilung"
BRA_R56_secret_research_department_desc:0	"Die Einrichtung von Technologiezentren, die ausschließlich für wichtige Projekte der Streitkräfte zuständig sind, wird sich als entscheidend für die Aufrechterhaltung der nationalen Sicherheit erweisen."
BRA_R56_submarines:0	"U-Boote"
BRA_R56_submarines_desc:0	"U-Boote sind ein effektives Mittel, um die Küsten zu patrouillieren und feindliche Schiffe auf hoher See zu versenken."
BRA_R56_expand_the_private_industry:0	"Die Privatwirtschaft ausbauen"
BRA_R56_expand_the_private_industry_desc:0	"Durch Garantien und Ausnahmen kann die Bundesregierung die Gründung neuer Werkstätten und Hersteller im ganzen Land fördern."
BRA_R56_technical_schools:0	"Technische Schulen"
BRA_R56_technical_schools_desc:0	"Die Förderung von Technischen Schulen durch den Staat wird mehr Techniker und Spezialisten für die industrielle Produktion in [BRA.GetNameDef] ausbilden."
BRA_R56_reinstituite_the_technocratic_system:0	"Wiedereinführung des technokratischen Systems"
BRA_R56_reinstituite_the_technocratic_system_desc:0	"Während der Ersten Republik wurden Meritokratie und Wissenschaften von den privaten und öffentlichen Institutionen des Landes hoch geschätzt. Der wissenschaftliche Fortschritt dieser Zeit ist unbestreitbar, mit der Einführung von Elektrizität und Stahl durch große Unternehmer. Mit dem Aufkommen neuer Technologien wird die Rückbesinnung auf diese Werte für den technischen Fortschritt des Landes von großem Nutzen sein."
BRA_R56_tenenge:0	"TENENGE"
BRA_R56_tenenge_desc:0	"Die National Engineering Technique ist ein Unternehmen für elektromechanischen Maschinenbau und Schwerindustrie, das sich auf Hafeninfrastruktur und Wasserstraßenmanagement in [BRA.GetNameDef] konzentriert. Wir können es beauftragen, die Aktivitäten von Vale do Rio Doce und Petrobrás auf größere Dimensionen auszuweiten."
BRA_R56_federal_installations_in_the_amazon:0	"Bundeseinrichtungen im Amazonasgebiet"
BRA_R56_federal_installations_in_the_amazon_desc:0	"Das Jungle Warfare Instruction Center (CIGS) ist eine militärische Einrichtung der [BRA.GetAdjective] Armee mit Sitz in Manaus, die militärische Führer kleiner Fraktionen, wie z.B. Dschungelkrieger, ausbilden soll. Diese Kämpfer sind in der Lage, Missionen militärischer Natur in den unwirtlicheren Gebieten des brasilianischen Amazonaswaldes sowie in ähnlichen Umgebungen durchzuführen."
BRA_R56_tire_de_guerra:0	"Tiro de Guerra"
BRA_R56_tire_de_guerra_desc:0	"Der „Tiro de Guerra“ wurde 1916 als eine Politik der Armee eingeführt, die in der Grundausbildung der nicht eroberten Reserven des Landes für den Fall der Ausrufung des Belagerungszustandes besteht. Die Ausweitung dieses Programms sorgt dafür, dass die Kolonnen der Armee mit besser ausgebildeten und kampftauglicheren Männern besetzt werden."
BRA_R56_vale_do_rio_doce:0	"Vale do Rio Doce"
BRA_R56_vale_do_rio_doce_desc:0	"Vale do Rio Doce wird das staatliche Unternehmen sein, das die verschiedensten Erze wie Bauxit und Eisen abbaut und zu Aluminium und Stahl weiterverarbeitet."
BRA_R56_the_integral_state:0	"Der integrale Staat"
BRA_R56_the_integral_state_desc:0	"Um in Frieden voranzukommen, seine Anstrengungen fruchtbar zu machen und Ansehen im In- und Ausland zu erlangen, muss sich eine Nation des Prinzips der Autorität vollkommen bewusst sein. Wir brauchen eine Behörde, die in der Lage ist, Initiativen zu ergreifen, die allen Menschen überall zugute kommen."
BRA_R56_duty_free_zone_of_manaus:0	"Die zollfreie Zone von Manaus"
