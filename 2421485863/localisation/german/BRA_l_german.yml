BRA_license_with_the_soviets:					"Lizenzvereinbarungen mit den [SOV.GetAdjective]s"
BRA_license_with_the_soviets_desc:					"Unsere Forschung hinkt hinter den Großmächten hinterher. Es wird lange dauern, die Kapazitäten aufzubauen, um den Rückstand aufzuholen, aber bis dahin könnten wir darauf hinarbeiten, die Erlaubnis zu erhalten, Ausrüstung von [SOV.GetNameDef] in [BRA.GetNameDef] zu produzieren. In Anbetracht der Kosten eines solchen Geschäfts sollten wir versuchen, einen leichten Rabatt auszuhandeln."
BRA_license_with_the_soviets_tt:					"([SOV.GetFlag]§Y[SOV.GetName]§!) Erhält Veranstaltung ‚§Y[BRA.GetNameDefCap] sucht Lizenzproduktionsvertrag§!‘ \n \n Sie werden eher zustimmen, wenn sie eine §Yhohe Meinung von uns haben!§!"
BRA_the_latin_american_socialist_cooperative:					"Die Lateinamerikanische Sozialistische Genossenschaft"
BRA_the_latin_american_socialist_cooperative_desc:					"Es gibt viele andere, die unsere Vorstellungen davon teilen, wie die kommunistische Gesellschaft aussehen sollte. Es ist an der Zeit, dass wir uns für eine Zusammenarbeit mit diesen Nationen öffnen, damit wir gemeinsam für unsere Sache eintreten können!"
BRA_establish_ulasr:					"ULASR gründen"
BRA_establish_ulasr_desc:					"Unsere revolutionäre Bewegung fährt fort, die Strukturen der bürgerlichen Gesellschaft auf dem ganzen Kontinent zu untergraben. Es ist klar, dass wir nicht länger eine Bewegung von [ROOT.GetAdjective]s sind, wir sind eine Bewegung von Südamerikanern und es ist an der Zeit, dass unsere politischen Strukturen diesen Wandel besser repräsentieren."
BRA_end_south_american_capitalism:					"Beendet den südamerikanischen Kapitalismus"
BRA_end_south_american_capitalism_desc:					"Die bürgerliche Demokratie und der Kapitalismus untergraben weiterhin die Rechte und Lebensbedingungen vieler Südamerikaner. Wir müssen alles in unserer Macht Stehende tun, um unsere Genossinnen und Genossen auf dem ganzen Kontinent von ihren Unterdrückern zu befreien."
