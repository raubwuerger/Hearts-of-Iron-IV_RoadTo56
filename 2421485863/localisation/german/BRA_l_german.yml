bra_invite_canada_desc:0					"Als entwickeltes Land, das die Passage zwischen dem Atlantik und dem Indischen Ozean bewacht, könnte Südafrika ein hervorragender Verbündeter sein."
bra_carribean_diplomacy:0					"Diplomatie in der Karibik"
bra_carribean_diplomacy_desc:0					"Die Länder der Karibik sind der Schlüssel zur Kontrolle nicht nur ihrer Umgebung, sondern auch der Sargassosee."

