BRA_uiracu_desc:0					"Die Harpyie, auch Königsbussard und von den Eingeborenen Uiraçu genannt, ist ein größerer, aggressiverer und imposanterer Raubvogel als der Weißkopfseeadler, den die Amerikaner so sehr verehren. Wie der Falke, der unseren Boden umkreist, soll Brasilien das Raubtier seines Lebensraumes sein und das brasilianische Volk der Einiger seines Kontinents."
