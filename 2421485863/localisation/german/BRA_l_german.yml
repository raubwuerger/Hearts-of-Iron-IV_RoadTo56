bra_bandeirantes_mg_1_desc:0					"Das brasilianische Militär wurde weder mit dem Ziel des Imperialismus und der Eroberung organisiert, noch hat es die modernen europäischen Kriegsmethoden übernommen. Die wichtigsten Grundsätze der Armee stammen von den Bandeirantes, den Siedlern und Expeditionskämpfern, die während der Kolonialzeit auf indigenen Wegen und mit Hilfe der einheimischen Bevölkerung Pionierarbeit bei der Besetzung Brasiliens leisteten. Die [BRA.GetAdjective]-Armee ist daher auf den Kampf über und auf [BRA.GetAdjective]-Land spezialisiert, das größtenteils noch von der Zivilisation ungezähmt ist."
