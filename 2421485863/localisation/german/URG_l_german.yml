uruguay.1.t:0			"Die Parlamentswahlen von 1938"
uruguay.1.d:0			"Nach dem Staatsstreich von 1933 setzte Gabriel Terra für dieses Jahr Wahlen an. \n\nDie Hauptkandidaten sind der General und Polizeichef Alfredo Baldomir, der bekannte Politiker Luis Alberto de Herrera und der sozialistische Dichter Emilio Frugoni.\n\nAllerdings haben einige radikalere Parteien ihre Chance in den unruhigen Zeiten genutzt, um ihren Einfluss auszuweiten. Die bekannteste ist die Partido Comunista, aber auch einige nationalistische und faschistische Parteien haben ihre Chance genutzt, allen voran die Acción Revisionista del Uruguay.\n\nWährend die Stimmen ausgezählt werden, wird deutlich, dass..."
uruguay.1.a:0			"Die Partido Colorado sichert sich ihre Wiederwahl!"
uruguay.1.b:0			"Die Partido Nacional geht als Siegerin hervor!"
uruguay.1.e:0			"Das Land gerät in eine Wahlpatt-Situation..."
uruguay.2.t:0			"Das Schicksal des Nationalrats"
uruguay.2.d:0			"Der Consejo Nacional de Administración wurde 1917 von Präsident Baltasar Brum ins Leben gerufen, um ein Exekutivorgan nach dem Vorbild des Schweizer Bundesrats zu schaffen. Dies ermöglichte es den Parteien Colorado und Nacional, die Macht zu teilen und brachte Uruguay Stabilität. \n\nDie Natur des Rates bedeutete jedoch, dass er nur langsam handelte, da jede Maßnahme des Rates von allen Mitgliedern genehmigt werden musste. Diese Untätigkeit führte dazu, dass sich die Auswirkungen der Weltwirtschaftskrise auf die uruguayische Wirtschaft erheblich verschlimmerten, was erst durch die Auflösung des Rates durch den De-facto-Präsidenten Uruguays, Gabriel Terra, im Jahr 1933 gelöst wurde. \n\nNun aber, da die Weltwirtschaftskrise überwunden ist, schlagen viele Politiker die Wiedereinsetzung des Rates vor, um Uruguay die dringend benötigte Stabilität zu bringen."
uruguay.2.a:0			"Stellen Sie den Rat wieder her, Stabilität muss um jeden Preis angestrebt werden..."
uruguay.2.b:0			"Das ist Unsinn, die Ineffizienz des Rates würde die Situation noch verschlimmern!"
uruguay.3.t:0			"Chaos auf den Straßen!"
uruguay.3.d:0			"Die jüngste Wahlniederlage, die erste in unserer Geschichte, hat das Land schwer getroffen. In Montevideo herrscht Chaos, es gibt Proteste, die von Batllistas wie Luis Batlle Berres angeführt werden, und Gerüchte über eine Revolte der Partido Nacional, genau wie im Jahr 1904. Die PCU unter der Führung von Eugenio Gomez nutzt die Gelegenheit und versucht, zum Palacio Legislativo zu marschieren, wird aber von Mitgliedern der Acción Revisionista aufgehalten.\n\nDie Armee und die Polizei sind durch die Proteste und Unruhen gespalten und ausgelaugt, so dass die Reaktion nur schleppend verläuft. In der Nacht wird klar, dass..."
uruguay.3.a:0			"Die ARU besiegt die Kommunisten und kann die Regierung sichern."
uruguay.3.b:0			"Die Communistas besiegen die ARU und stürmen den Palacio Legislativo."
uruguay.3.c:0			"Die Stabilität der Nation muss gewahrt werden, Colorado muss eine Koalition mit der PSU eingehen!"
uruguay.4.t:0			"Koalition mit der PSU?"
uruguay.4.d:0			"Der jüngste Stillstand bei den Wahlen hat Uruguay in einen Zustand starker politischer Instabilität und Gewalt gestürzt. Da aus den Parlamentswahlen von 1938 kein klarer Sieger hervorgegangen ist, nehmen die Spannungen im ganzen Land zu. Die Ungewissheit ist nicht unbemerkt geblieben, und verschiedene Fraktionen haben bereits damit begonnen, Lösungen anzubieten, um den Stillstand zu überwinden. Einer der am meisten diskutierten Vorschläge ist die Bildung einer Koalitionsregierung zwischen der Partido Colorado und der Partido Socialista del Uruguay. Diese Lösung, die sowohl als pragmatisch als auch als notwendig angesehen wird, könnte die Stabilität wiederherstellen und die drohende Gefahr eines Bürgerkriegs oder eines Militärputsches verhindern."
uruguay.4.a:0			"Wir werden keine Kompromisse mit den Socialistas eingehen!"
uruguay.4.b:0			"Die Stabilität der Nation muss erhalten bleiben, wir müssen eine Koalition mit der PSU bilden!"
URG_GATHERING_STORM_DESC:0			"Obwohl Uruguay eines der stabilsten Länder Südamerikas war, war der Staatsstreich von Gabriel Terra ein Schock für die kleine Nation. Die Verfolgungen, die das Regime mit sich brachte, zwangen viele Politiker und Intellektuelle zur Flucht, vor allem nach Argentinien.\n\nDie Diktatur ist jedoch noch lange nicht gefestigt, denn 1935 gab es einen ersten revolutionären Putschversuch, der möglicherweise nicht der letzte war."
