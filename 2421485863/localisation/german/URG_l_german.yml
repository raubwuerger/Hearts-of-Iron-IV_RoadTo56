uruguay.1.e:0		"Das Land befindet sich in einer Wahlpatt-Situation..."
uruguay.2.t:0		"Das Schicksal des Nationalrats"
uruguay.2.d:0		"Der Consejo Nacional de Administración wurde 1917 von Präsident Baltasar Brum ins Leben gerufen, um ein Exekutivorgan nach dem Vorbild des Schweizer Bundesrats zu schaffen. Dies ermöglichte es den Parteien Colorado und Nacional, die Macht zu teilen, und brachte Stabilität nach Uruguay. \Die Natur des Rates bedeutete jedoch, dass er nur langsam handeln konnte, da jede Maßnahme des Rates von allen Mitgliedern genehmigt werden musste. Diese Untätigkeit führte dazu, dass sich die Auswirkungen der Weltwirtschaftskrise auf die uruguayische Wirtschaft erheblich verschlechterten, was erst durch die Auflösung des Rates durch den De-facto-Präsidenten Uruguays, Gabriel Terra, im Jahr 1933 behoben wurde. \n\nNachdem die Weltwirtschaftskrise nun überwunden ist, schlagen viele Politiker die Wiedereinsetzung des Rates vor, um Uruguay die dringend benötigte Stabilität zu bringen."
uruguay.2.a:0		"Den Rat wiederherstellen, Stabilität muss um jeden Preis angestrebt werden..."
uruguay.2.b:0		"Das ist Unsinn, die Ineffizienz des Rates würde die Situation noch verschlimmern!"
uruguay.3.t:0		"Chaos auf den Straßen!"
uruguay.3.d:0		"Die jüngste Patt-Situation bei den Wahlen, die erste in unserer Geschichte, hat das Land in Mitleidenschaft gezogen. In Montevideo herrscht Chaos, mit Protesten, die von Batllistas wie Luis Batlle Berres angeführt werden, und Gerüchten über einen Aufstand der Partido Nacional, wie im Jahr 1904. Die PCU unter der Führung von Eugenio Gomez nutzt die Gelegenheit und versucht, zum Palacio Legislativo zu marschieren, wird aber von Mitgliedern der Acción Revisionista aufgehalten. In der Nacht wird es klar, dass..."
uruguay.3.a:0		"Die ARU besiegt die Kommunisten und kann die Regierung sichern."
uruguay.3.b:0		"Die Communistas besiegen die ARU und stürmen den Palacio Legislativo."
uruguay.3.c:0		"Die Stabilität der Nation muss gewahrt werden, Colorado muss eine Koalition mit der PSU eingehen!"
uruguay.4.t:0		"Koalition mit der PSU?"
uruguay.4.d:0		"Der jüngste Stillstand bei den Wahlen hat Uruguay in einen Zustand großer politischer Instabilität und Gewalt gestürzt. Da aus den allgemeinen Wahlen von 1938 kein eindeutiger Sieger hervorgegangen ist, nehmen die Spannungen im ganzen Land zu. Die Ungewissheit ist nicht unbemerkt geblieben, und verschiedene Gruppierungen haben bereits damit begonnen, Lösungen für die festgefahrene Situation anzubieten. Einer der am meisten diskutierten Vorschläge ist die Bildung einer Koalitionsregierung zwischen der Partido Colorado und der Partido Socialista del Uruguay. Diese Lösung, die als pragmatisch und notwendig angesehen wird, könnte die Stabilität wiederherstellen und die drohende Gefahr eines Bürgerkriegs oder eines Militärputsches verhindern."
uruguay.4.a:0		"Wir werden keine Kompromisse mit den Socialistas eingehen!"
uruguay.4.b:0		"Die Stabilität der Nation muss erhalten bleiben, wir müssen eine Koalition mit der PSU bilden!"
URG_GATHERING_STORM_DESC:0		"Während Uruguay eines der stabilsten Länder Südamerikas war, war der Staatsstreich von Gabriel Terra ein Schock für die kleine Nation. Die Verfolgungen, die das Regime mit sich brachte, zwangen viele Politiker und Intellektuelle zur Flucht, insbesondere nach Argentinien. Die Diktatur ist jedoch noch lange nicht gefestigt, denn 1935 gab es einen ersten revolutionären Putschversuch, der nicht der letzte gewesen sein dürfte."
