URG_aftermath_of_paso_morlan_desc:0		"Der gescheiterte Putschversuch in Paso Morlán hat Uruguay in einen Zustand der Unsicherheit versetzt. Obwohl der Aufstand niedergeschlagen wurde, sind seine Folgen weitreichend. In den Reihen der Militärs herrscht Unzufriedenheit, während sich die politische Spaltung zwischen den Reformwilligen und denjenigen, die an der alten Ordnung festhalten, vertieft. Die Nachwirkungen dieses chaotischen Ereignisses haben das Vertrauen der Öffentlichkeit erschüttert, die Macht der Regierung geschwächt und ausländischen Mächten die Möglichkeit gegeben, sich in die inneren Angelegenheiten Uruguays einzumischen..."
URG_legacy_of_batlle2:0		"Das Erbe von Batlle"
URG_legacy_of_batlle2_desc:0		"Der Schatten der Präsidentschaft von José Batlle y Ordóñez liegt weiterhin auf Uruguay und prägt sowohl die Innen- als auch die Außenpolitik des Landes. Als Architekt weitreichender sozialer und wirtschaftlicher Reformen legte Batlle den Grundstein für einen modernen Wohlfahrtsstaat und förderte eine Kultur des Progressivismus und der staatlichen Intervention. Dennoch ist sein Erbe nicht unumstritten. Während viele für seine Vision eines demokratischen und egalitären Uruguay eintreten, betrachten andere seine Politik als Quelle wirtschaftlicher Stagnation und politischer Instabilität..."
URG_legacy_of_batlle_s:0		"Das Erbe von Batlle"
URG_legacy_of_batlle_s_desc:0		"Der Schatten der Präsidentschaft von José Batlle y Ordóñez liegt weiterhin auf Uruguay und prägt sowohl die Innen- als auch die Außenpolitik des Landes. Als Architekt weitreichender sozialer und wirtschaftlicher Reformen legte Batlle den Grundstein für einen modernen Wohlfahrtsstaat und förderte eine Kultur des Progressivismus und der staatlichen Intervention. Dennoch ist sein Erbe nicht unumstritten. Während viele für seine Vision eines demokratischen und egalitären Uruguay eintreten, betrachten andere seine Politik als Quelle wirtschaftlicher Stagnation und politischer Instabilität..."
