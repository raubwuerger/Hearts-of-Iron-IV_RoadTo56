URG_legacy_of_batlle_s_desc:0			"Der Schatten der Präsidentschaft von José Batlle y Ordóñez liegt weiterhin auf Uruguay und prägt sowohl die Innen- als auch die Außenpolitik des Landes. Als Architekt weitreichender sozialer und wirtschaftlicher Reformen legte Batlle den Grundstein für einen modernen Wohlfahrtsstaat und förderte eine Kultur des Progressivismus und der staatlichen Intervention. Dennoch ist sein Erbe nicht unumstritten. Während viele für seine Vision eines demokratischen und egalitären Uruguay eintreten, betrachten andere seine Politik als Quelle wirtschaftlicher Stagnation und politischer Instabilität..."
