AFG_turkestan_legion_idea_r56:0				"Die Turkestanische Legion"
AFG_form_the_turkestan_legion_r56:0				"Bilden Sie die Turkestanische Legion"
AFG_form_the_turkestan_legion_r56_desc:0				"Die in Zentralasien lebenden Turkvölker werden seit der Oktoberrevolution von den [SOV.GetAdjective]s unterdrückt. Ihr Recht, an den Islam zu glauben und ihn zu praktizieren, wurde ihnen entzogen. Wir müssen den rebellischen Geist dieser Menschen wieder erwecken!"
AFG_enforce_the_pashtunwali_r56:0				"Das Paschtunwali durchsetzen"
AFG_enforce_the_pashtunwali_r56_desc:0				"Das Paschtunwali ist ein Kodex oder eine vollständige Lebensweise des paschtunischen Volkes. Es hat viel mit dem Islam gemeinsam, der Gerechtigkeit und Tapferkeit predigt, aber auch viele andere wichtige Werte, die die paschtunische Kultur ausmachen. Um die öffentliche Ordnung aufrechtzuerhalten, müssen wir diese Werte durchsetzen."
