r56_AFG_hydroelectric_power:0				"Hydroelektrische Energie"
AFG_bank_millie_afghan:0				"Bânk-e Millie Afghân"
AFG_bank_millie_afghan_desc:0				"Die Bânk-e Millie Afghân wurde 1932 als Aktiengesellschaft gegründet, wobei ein großer Teil der Aktien von der Regierung gehalten wird. Sie wird von einem der größten afghanischen Wirtschaftswissenschaftler, Abdul Majid Zabuli, geleitet, der auch ein Sympathisant von Adolf Hitler war. Die Bank fungiert seit vier Jahren als Nationalbank von [AFG.GetNonIdeologyName] und behält ihr Monopol auf den staatlichen Handel bei. Durch ihre enge Zusammenarbeit mit der Regierung, Investitionen in den privaten und öffentlichen Sektor und ein virtuelles Monopol auf die gesamte Industrie und den Import-Export-Handel innerhalb von [AFG.GetNonIdeologyName] hat die Bank einen riesigen Gewinn für etwa zweitausend Aktionäre und die Regierung erwirtschaftet."
AFG_decentralized_economy:0				"Vernachlässigte Wirtschaft"
AFG_decentralized_economy_desc:0				"Die Wirtschaft von [AFG.GetNonIdeologyName] ist weitgehend unterentwickelt und hängt stark vom Handel mit Rohstoffen wie Baumwolle, Karakul, Tabak und Opium ab, der in der Wirtschaft von [AFG.GetAdjective] eine wichtige Rolle spielt. Trotz seiner entscheidenden geographischen Lage als Kreuzung zwischen Europa und Asien war [AFG.GetNonIdeologyName] nicht in der Lage, aus seiner strategischen Lage vollen Nutzen zu ziehen, was durch Isolation und eine rudimentäre Wirtschaftsstruktur behindert wurde."
AFG_decentralized_economy_1:0				"Vernachlässigte Wirtschaft"
AFG_decentralized_economy_1_desc:0				"Die Wirtschaft von [AFG.GetNonIdeologyName] ist weitgehend unterentwickelt und hängt stark vom Handel mit Rohstoffen wie Baumwolle, Karakul, Tabak und Opium ab, der in der Wirtschaft von [AFG.GetAdjective] eine wichtige Rolle spielt. Trotz seiner entscheidenden geographischen Lage als Kreuzung zwischen Europa und Asien war [AFG.GetNonIdeologyName] nicht in der Lage, aus seiner strategischen Lage vollen Nutzen zu ziehen, was durch Isolation und eine rudimentäre Wirtschaftsstruktur behindert wurde."
AFG_decentralized_economy_2:0				"Vernachlässigte Wirtschaft"
AFG_decentralized_economy_2_desc:0				"Die Wirtschaft von [AFG.GetNonIdeologyName] bleibt weitgehend unterentwickelt und ist stark vom Handel mit Rohstoffen wie Baumwolle, Karakul, Tabak und Opium abhängig, der in der Wirtschaft von [AFG.GetAdjective] eine wichtige Rolle spielt. Trotz seiner entscheidenden geographischen Lage als Kreuzung zwischen Europa und Asien war [AFG.GetNonIdeologyName] nicht in der Lage, aus seiner strategischen Lage vollen Nutzen zu ziehen, was durch die Isolation und eine rudimentäre Wirtschaftsstruktur behindert wurde."
AFG_decentralized_economy_3:0				"Wirtschaftlicher Aufschwung"
AFG_decentralized_economy_3_desc:0				"In nur wenigen Jahren hat sich [AFG.GetNonIdeologyName] von einem unterentwickelten Hinterland in eine sich rasch modernisierende und wohlhabende Nation verwandelt. Diese bemerkenswerte Leistung ist ein unbestreitbarer Beweis dafür, dass der einst für unmöglich gehaltene Fortschritt nun zum Greifen nahe ist!"
AFG_bank:0				"Da [AFG.GetNonIdeologyName] Bank"
AFG_bank_improved:0				"Da [AFG.GetNonIdeologyName] Bank"

AFG_illiteracy:0				"Weitverbreitetes Analphabetentum"
AFG_illiteracy_desc:0				"Die [AFG.GetAdjective] Bevölkerung leidet unter weitverbreitetem Analphabetismus. Weniger als zehn Prozent können lesen und schreiben, was vor allem auf die schlechte Lebensqualität und das Missmanagement des Bildungssystems zurückzuführen ist. Dieser gravierende Fachkräftemangel hat dazu geführt, dass höhere Stellen und Regierungsämter entweder unbesetzt bleiben oder von Ausländern wie Türken und Deutschen besetzt werden. Sogar die 1931 neu eröffnete Kābul Universität hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Aufnahme von Studenten hinnehmen müssen."
