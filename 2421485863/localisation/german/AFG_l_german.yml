 afghanistan_focus:0 "[AFG.GetAdjektiv] Nationaler Fokus"
 AFG_GATHERING_STORM_DESC:0 "Afghanistan wurde inmitten der Asche des blutigen Dritten Anglo-Afghanischen Krieges geboren und war jahrhundertelang ein Schlachtfeld der Weltmächte. Das kleine, aber zerbrechliche Land leidet noch immer unter den Narben des Bürgerkriegs von 1929, der die arme Nation auseinanderriss und zu einem starken Niedergang der afghanischen Wirtschaft führte. \n\nSeit der brutalen Ermordung von Nadir Schah im Jahr 1933 wird das Land de facto vom Regentschaftsrat geführt, der die Taten des jungen Muhammad Zahir Schah überwacht. Doch dunkle Wolken ziehen am Horizont auf, und die Zukunft Afghanistans bleibt ungewiss..."

