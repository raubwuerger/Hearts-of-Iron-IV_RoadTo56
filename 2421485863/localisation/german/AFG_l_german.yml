 ######## MILITARY IDEAS ######## ""

AFG_afghan_army:0				"[GetAfghanArmyFocusName]"
AFG_afghan_army_desc:0				"Die ruhmreiche [GetAfghanArmyFocusName] kann stolz darauf sein, dass sie es geschafft hat, in der ganzen Welt ein hohes Ansehen zu erlangen, weil sie besonders schwer zu schlagen ist und einer, wenn nicht sogar der gefährlichste Feind ist, dem man auf dem Schlachtfeld begegnen kann, ganz zu schweigen vom Kampf gegen die [AFG.GetAdjective] in ihrem Heimatgebiet. In Friedenszeiten unterhält die [GetAfghanArmyFocusName] etwa 70 bis 80 Tausend Soldaten, die jederzeit einsatzbereit und voll auf den Krieg vorbereitet sind. Unser Militär ist jedoch in hohem Maße auf ausländische Ausrüstung angewiesen, wobei Nationen wie [ENG.GetNonIdeologyName], [SOV.GetNonIdeologyName] und [GER.GetNonIdeologyName] als wichtige Quellen für moderne Ausrüstung und Militärtechnologie dienen.\n\n'In [AFG.GetNonIdeologyName] sind die Tage lang, die Berge hoch und die Schlachten hart.'"

