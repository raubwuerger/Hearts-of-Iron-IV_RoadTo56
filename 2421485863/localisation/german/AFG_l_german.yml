 ######## LOYA JIRGA EVENTS ######## ""

AFG_loya_jirga.1.t:0				"Die [GetYear] Loya Jirga beginnt"
AFG_loya_jirga.1.desc:0				"Seit Jahrhunderten prägt der paschtunische Gesellschaftskodex die kulturellen und sozialen Normen sowohl des einfachen Volkes als auch der Eliten. Gemäß dieser Tradition halten die Führer der Nation zusammen mit den Stammesoberhäuptern jährlich eine Loya Jirga ab, um den Kurs des Landes in Zeiten der Unsicherheit zu bestimmen. \n\nDie diesjährige Jirga wird sich auf kritische Themen konzentrieren, darunter die soziale Stellung der Frauen, die Industrialisierung von Kābul, die kürzlich eingeführten Bildungsreformen und die Außenpolitik des Landes. Die Ankunft des Königs und seines Kabinetts wird in Kürze erwartet. Die Spannungen nehmen jedoch zu, denn Berichten zufolge sind die Bauern in Nimruz und Farah unzufrieden mit der Verteilung der Vorräte, und die Bewohner des Nordens von Takhar sind besorgt über die jüngsten Überfälle der Basmachi in ihrer Region. Darüber hinaus wird erwartet, dass Fraktionen innerhalb der Armee ihre Unzufriedenheit mit den laufenden militärischen Modernisierungsbemühungen zum Ausdruck bringen werden. \n\n Dem König wurde geraten, in militärischen Fragen eine feste Haltung einzunehmen, aber offen für Zugeständnisse zu sein, wenn die Debatte zu strittig wird. Wir müssen vermeiden, die Fehler der Loya Jirga von 1928 zu wiederholen und die Leidenschaften von Modernisierern und Traditionalisten sorgfältig ausbalancieren, wenn wir vorankommen wollen."
AFG_loya_jirga.1.a:0				"Wir werden dafür sorgen, dass wir das nicht verpassen."

AFG_loya_jirga.2.t:0				"Der Weg zur Modernisierung - Die Frage des Staates"
AFG_loya_jirga.2.desc:0				"51___ ist nach wie vor ein stark dezentralisierter Staat, in dem die Regierung außerhalb der Hauptstadt Kābul nur wenig Macht ausübt. Dies hat zu einer ineffizienten Wirtschaft, einer schwachen Verwaltung und einem unterentwickelten Militär geführt. \n\n Die Modernisierer plädieren für eine Ausweitung der direkten Kontrolle Kābuls über das Land und eine Zentralisierung der Staatsgewalt, was die Regierungsführung straffen, bürokratische Ineffizienzen reduzieren und die Kosteneffizienz verbessern würde. \n\nDieser Wandel würde jedoch das Leben der Afghanen außerhalb von Kābul erheblich beeinträchtigen, da sie an ein solches Maß an staatlicher Kontrolle nicht gewöhnt sind. Daher wird dieser Vorschlag wahrscheinlich auf den Widerstand der Traditionalisten stoßen..."
AFG_loya_jirga.2.a:0				"[AFG.GetNonIdeologyName] muss einen Weg der moderaten Zentralisierung verfolgen."
AFG_loya_jirga.2.b:0				"Die Gewährleistung einer starken, einheitlichen Regierungsführung im ganzen Land ist entscheidend!"

AFG_loya_jirga.3.t:0				"Der Weg zur Modernisierung - Status der Frauen"
AFG_loya_jirga.3.desc:0				"Während [AFG.GetNonIdeologyName] durch die Komplexität der Modernisierung navigiert, ist die Frage der Frauenrechte während der diesjährigen Loya Jirga zu einem dringenden Thema geworden. Die tiefe Kluft zwischen Traditionalisten, die für die Bewahrung kultureller Normen eintreten, und Modernisierern, die die Rechte und Möglichkeiten der Frauen fördern wollen, hat zu hitzigen Diskussionen geführt. \n\n Auf der einen Seite argumentieren die Traditionalisten, dass der paschtunische Sozialkodex weiterhin die Rolle der Frauen bestimmen sollte, indem er die Bedeutung der Familie und der kulturellen Werte hervorhebt. Sie befürchten, dass eine Ausweitung der Rechte die gesellschaftliche Stabilität untergraben und zur Aushöhlung von Bräuchen führen könnte, die das afghanische Leben seit Generationen geprägt haben. \n\nDie Modernisierer hingegen plädieren für tiefgreifende Reformen und schlagen Maßnahmen wie einen verbesserten Zugang zu Bildung, gesetzlichen Rechten und die Teilnahme am öffentlichen Leben vor. Sie argumentieren, dass die Stärkung der Frauen für den Fortschritt des Landes unerlässlich ist und zu einer wohlhabenderen und gerechteren Gesellschaft beitragen wird."
AFG_loya_jirga.3.a:0				"Wir müssen den Status quo aufrechterhalten..."
AFG_loya_jirga.3.b:0				"Die Ermächtigung der Frauen ist entscheidend für [AFG.GetNonIdeologyName]s Zukunft!"

AFG_loya_jirga.4.t:0				"Der Weg zur Modernisierung - Die Frage des Islam"
AFG_loya_jirga.4.desc:0				"Viele wichtige Modernisierer streiten und debattieren seit geraumer Zeit darüber, ob der Islam noch mit den Zielen für [AFG.GetNonIdeologyName]s Zukunft vereinbar ist. Diese zentrale Debatte ist nun endlich auf dem Siedepunkt angelangt, und es ist an der Zeit, dass wir Stellung beziehen und entscheiden, ob der Islam vom Staat getrennt werden sollte oder nicht. \n\nDie Befürworter des Islam argumentieren, dass die Identität des Landes untrennbar mit seinen religiösen Werten verbunden ist und dass die Staatsführung die Lehren des Korans widerspiegeln sollte. Sie sind der Ansicht, dass ein islamischer Rahmen für die Aufrechterhaltung des sozialen Zusammenhalts und der moralischen Integrität unerlässlich ist und gewährleistet, dass die Gesetze mit den Überzeugungen der Mehrheit übereinstimmen. Für sie stellt der Säkularismus eine Abkehr von der Tradition und eine potenzielle Bedrohung für das Gefüge der afghanischen Gesellschaft dar. \n\n Auf der anderen Seite argumentieren die Befürworter des Säkularismus, dass die Trennung von Religion und Staat für die Förderung des Fortschritts und die Gewährleistung gleicher Rechte für alle Bürger, unabhängig von ihrem Glauben, unerlässlich ist. Sie verweisen auf die Vorteile einer säkularen Staatsführung, wie z.B. mehr Meinungsfreiheit, den Schutz von Minderheitenrechten und die Förderung der Gleichberechtigung der Geschlechter. Diese Fraktion glaubt, dass die Annahme des Säkularismus es [AFG.GetNonIdeologyName] ermöglichen wird, sich zu modernisieren und auf der globalen Bühne zu konkurrieren und gleichzeitig die individuellen Freiheiten zu respektieren."
AFG_loya_jirga.4.a:0				"Wir müssen unser Bekenntnis zu den islamischen Prinzipien bekräftigen."
AFG_loya_jirga.4.b:0				"Die Trennung von Religion und Staat ist unerlässlich!"

AFG_loya_jirga.5.t:0				"Der Weg zur Modernisierung - soziale Reformen"
AFG_loya_jirga.5.desc:0				"Das Problem des weit verbreiteten Analphabetismus ist auf der diesjährigen Loya Jirga endlich in den Vordergrund gerückt. Die Delegierten sind geteilter Meinung darüber, wie dieses kritische Problem am besten angegangen werden kann. Die einen plädieren für ein umfassendes Alphabetisierungsprogramm, während die anderen davor warnen, die Traditionalisten mit schnellen Veränderungen zu provozieren. \n\nDie Befürworter eines umfassenden Alphabetisierungsprogramms argumentieren, dass sofortige Maßnahmen notwendig sind, um die Nation aufzurichten und ihren zukünftigen Wohlstand zu sichern. Sie sind der Meinung, dass Investitionen in die Bildung für die Entwicklung qualifizierter Arbeitskräfte, die Stärkung der politischen Teilhabe und die Förderung des Wirtschaftswachstums unerlässlich sind. Dieser ehrgeizige Ansatz sieht eine robuste Initiative zur Bildung der Massen vor, insbesondere der Frauen, die in der Vergangenheit bei den Bildungschancen marginalisiert wurden. \n\nUmgekehrt plädieren vorsichtige Stimmen für ein schrittweises Vorgehen und betonen die Notwendigkeit, kulturelle Empfindlichkeiten und die traditionelle Lebensweise zu respektieren. Sie warnen davor, dass ein plötzlicher Vorstoß für eine umfassende Bildung zu Gegenreaktionen von traditionalistischen Gruppierungen führen könnte, die darin einen Eingriff in ihre Bräuche und Werte sehen könnten. Diese Fraktion schlägt vor, lokalisierte Programme zu implementieren, die auf den bestehenden Gemeindestrukturen aufbauen und so einen sanfteren Übergang zu mehr Alphabetisierung ermöglichen, ohne diejenigen zu verprellen, die dem Wandel misstrauen."
AFG_loya_jirga.5.a:0				"Die schrittweise Abschaffung des Analphabetismus ist entscheidend."
AFG_loya_jirga.5.b:0				"Nonesense, Bildung ist der Hüter der Stabilität!"

AFG_loya_jirga.6.t:0				"Das Ende der [GetYear] Loya Jirga"
AFG_loya_jirga.6.desc:0				"Nachdem sich alle Stammesführer und Redner zu Wort gemeldet haben, ist die [GetYear] Loya Jirga zu Ende gegangen.[GetLoyaJirgaEventDesc]. Es liegt nun in unserer Verantwortung, auf die Vorschläge und Wünsche der Mitglieder der Jirga einzugehen. Wir haben zwar etwas Zeit, um diese Änderungen umzusetzen, aber wenn wir zu lange zögern, könnten wir den Zorn der Stammesführer auf uns ziehen."
AFG_loya_jirga.6.a:0				"Großartig."

AFG_loya_jirga_good:0				"Während der Jirga haben der König und seine Regierung eine versöhnliche und freundliche Haltung gegenüber den Mitgliedern eingenommen und den starken Wunsch nach Zusammenarbeit und der Aufrechterhaltung des Status Quo zum Ausdruck gebracht. Die Kābul Times charakterisierte die diesjährige Jirga als demokratisch und transparent"
AFG_loya_jirga_bad:0				"Während der Jirga nahmen der König und seine Regierung eine aggressive und unfreundliche Haltung gegenüber Reformen und den Mitgliedern der Versammlung ein und forderten sofortige und radikale Reformen. Dieser Ansatz stieß auf erheblichen Widerstand bei den Delegierten und wurde von der Kābul Times und zahlreichen anderen Nachrichtenagenturen scharf kritisiert"

AFG_loya_jirga.10.t:0				"Der Verlauf der Loya Jirga von 1936"
AFG_loya_jirga.10.d:0				"Da die Loya Jirga kurz vor dem Beginn steht, haben wir ein kurzes Zeitfenster, um die politische Richtung der diesjährigen Versammlung zu bestimmen. Die Regentschaft, angeführt von Premierminister Muhammad Hashim Khan und Kriegsminister Shah Mahmud Khan, hat den König gedrängt, die schrittweise Zentralisierung und Modernisierung fortzusetzen und dabei ein empfindliches Gleichgewicht zwischen den Forderungen der Modernisierer und den Bedenken der Traditionalisten anzustreben. In der Vergangenheit ist jeder Versuch einer schnellen Reform auf den starken Widerstand der Stammesbevölkerung gestoßen, die sich gegen Veränderungen wehrt, die sie als Bedrohung des Paschtunwali, ihres angestammten Lebensstils, ansehen. \n\n Diese einfachen Leute wünschen sich Stabilität und Respekt für ihre kulturellen Bräuche. Das Anbieten von Zugeständnissen und die Suche nach Kompromissen mit den Traditionalisten in Bezug auf die lokale Autonomie und die Ratifizierung des Hasht Nafari könnte sie dazu ermutigen, mit der Regierung zusammenzuarbeiten und so ein friedlicheres und einheitlicheres [AFG.GetNonIdeologyName] zu gewährleisten."
AFG_loya_jirga.10.a:0				"[AFG.GetNonIdeologyName] hat keine Zeit zu verlieren, die Reformen müssen schnell umgesetzt werden!"
AFG_loya_jirga.10.b:0				"Wir müssen die Reformen schrittweise umsetzen, um die Traditionalisten nicht zu verärgern..."

