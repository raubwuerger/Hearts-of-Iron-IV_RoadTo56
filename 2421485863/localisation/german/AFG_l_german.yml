AFG_tajikistan_category:0				"Die Eingliederung Tadschikistans"
AFG_tajikistan_category_desc:0				"Die tadschikischen und paschtunischen Stämme haben jahrhundertelang sowohl innerhalb als auch außerhalb der Grenzen von [AFG.GetNonIdeologyName] koexistiert, aber mit der jüngsten Eingliederung der tadschikischen SSR in [AFG.GetNameDefCap] wurden das regionale Gleichgewicht und die Stabilität ein wenig erschüttert, was zu einem plötzlichen, aber langsamen Anstieg des tadschikischen Nationalismus und Separatismus führte. Wenn wir den Tadschiken gewisse Zugeständnisse machen würden, könnten wir vielleicht ihre Gunst gewinnen, anders als das vorherige Regime in [SOV.Capital.GetCapitalVictoryPointName]."
