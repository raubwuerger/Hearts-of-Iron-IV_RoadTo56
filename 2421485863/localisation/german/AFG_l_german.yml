 ######## LOYA JIRGA EVENTS ######## "Orden für militärische Tapferkeit"

 AFG_loya_jirga.1.t:0 ""
 AFG_loya_jirga.1.desc:0 ""
 AFG_loya_jirga.1.a:0 ""

 AFG_loya_jirga.2.t:0 "Die [Jahr einfügen] Loya Jirga beginnt"
 AFG_loya_jirga.2.desc:0 "Seit Jahrhunderten prägt der paschtunische Sozialkodex die kulturellen und sozialen Normen sowohl des einfachen Volkes als auch der Elite. Gemäß dieser Tradition halten die Führer der Nation zusammen mit den Stammeshäuptlingen eine jährliche Loya Jirga ab, um in Zeiten der Unsicherheit den Kurs des Landes festzulegen. Die diesjährige Jirga wird sich auf kritische Themen konzentrieren, darunter der soziale Status von Frauen, die Industrialisierung von Kābul, kürzlich eingeführte Bildungsreformen und die Außenpolitik der Nation. Der König wird zusammen mit seinem Kabinett in Kürze erwartet. Die Spannungen nehmen jedoch zu, da Berichten zufolge die Bauern in Nimruz und Farah mit der Verteilung der Vorräte unzufrieden sind und die Bewohner der nördlichen Provinzen Takhar über die jüngsten Überfälle der Basmachi in ihrer Region besorgt sind. Darüber hinaus wird erwartet, dass Teile der Armee ihre Unzufriedenheit mit den laufenden Bemühungen zur militärischen Modernisierung zum Ausdruck bringen werden. In Kabul hingegen wird mit starker Unterstützung gerechnet, insbesondere nach der kürzlich erfolgten Eröffnung der ersten Universität des Landes. \n\nDem König wurde geraten, in militärischen Fragen eine feste Haltung einzunehmen, aber offen für Zugeständnisse zu bleiben, falls die Debatte zu strittig wird. Wir müssen die Fehler der Loya Jirga von 1928 vermeiden und die Leidenschaften der Modernisierer und Traditionalisten sorgfältig ausbalancieren, während wir voranschreiten."
 AFG_loya_jirga.2.a:0 "Wir werden dafür sorgen, dass wir es nicht verpassen."
 AFG_loya_jirga.2.b:0 ""

 AFG_loya_jirga.3.t:0 "[AFG.GetNonIdeologyName] ist nach wie vor ein stark dezentralisierter Staat, in dem die Regierung außerhalb der Hauptstadt Kabul nur wenig Autorität ausübt. Dies hat zu einer ineffizienten Wirtschaft, einer schwachen Verwaltung und einem unterentwickelten Militär geführt. \n\nDie Modernisierer setzen sich dafür ein, die direkte Kontrolle Kabuls über das Land auszuweiten und die Staatsmacht zu zentralisieren, was die Regierungsführung straffen, bürokratische Ineffizienzen verringern und die Kosteneffizienz verbessern würde. \n\nDiese Verschiebung würde jedoch das Leben der Afghanen außerhalb Kabuls erheblich beeinträchtigen, die an ein solches Maß an staatlicher Aufsicht nicht gewöhnt sind. Daher wird dieser Vorschlag wahrscheinlich auf Widerstand der Traditionalisten stoßen..."
 AFG_loya_jirga.3.desc:0 "[AFG.GetNonIdeologyName] muss einen Weg der moderaten Zentralisierung einschlagen."
 AFG_loya_jirga.3.a:0 "Die Gewährleistung einer starken, einheitlichen Regierungsführung im ganzen Land ist von entscheidender Bedeutung!"
 AFG_loya_jirga.3.b:0 ""

 AFG_loya_jirga.4.t:0 "Während [AFG.GetNonIdeologyName] sich durch die Komplexität der Modernisierung navigiert, hat sich die Frage der Frauenrechte während der diesjährigen Loya Jirga als dringendes Thema herauskristallisiert. Die tiefe Kluft zwischen Traditionalisten, die sich für die Bewahrung kultureller Normen einsetzen, und Modernisierern, die sich für die Förderung der Rechte und Chancen von Frauen einsetzen, hat hitzige Diskussionen ausgelöst. Auf der einen Seite argumentieren Traditionalisten, dass der paschtunische Sozialkodex weiterhin die Rolle der Frau bestimmen sollte, und betonen die Bedeutung familiärer und kultureller Werte. Sie befürchten, dass eine Ausweitung der Rechte die gesellschaftliche Stabilität untergraben und zur Erosion von Bräuchen führen könnte, die das afghanische Leben seit Generationen bestimmen. \n\nDie Modernisierer hingegen setzen sich für umfassende Reformen ein und schlagen Maßnahmen wie einen besseren Zugang zu Bildung, Rechtsansprüchen und zur Teilnahme am öffentlichen Leben vor. Sie argumentieren, dass die Stärkung der Rolle der Frau für den Fortschritt des Landes von entscheidender Bedeutung ist und zu einer wohlhabenderen und gerechteren Gesellschaft beitragen wird."
 AFG_loya_jirga.4.desc:0 "Wir müssen den Status quo aufrechterhalten ..."
 AFG_loya_jirga.4.a:0 "Die Stärkung der Rolle der Frau ist für die Zukunft von [AFG.GetNonIdeologyName] von entscheidender Bedeutung!"
 AFG_loya_jirga.4.b:0 ""

 AFG_loya_jirga.5.t:0 "Viele wichtige Modernisierer haben lange Zeit darüber gestritten und debattiert, ob der Islam noch mit den Zielen für die Zukunft [AFG.GetNonIdeologyName] vereinbar ist. Diese entscheidende Debatte ist nun endlich auf den Punkt gekommen, und es ist an der Zeit, dass wir Stellung beziehen und entscheiden, ob der Islam vom Staat getrennt werden sollte oder nicht. \n\nBefürworter des Islam argumentieren, dass die Identität des Landes untrennbar mit seinen religiösen Werten verbunden ist und dass die Regierungsführung die Lehren des Korans widerspiegeln sollte. Sie behaupten, dass ein islamischer Rahmen für die Aufrechterhaltung des sozialen Zusammenhalts und der moralischen Integrität unerlässlich ist, um sicherzustellen, dass die Gesetze mit den Überzeugungen der Mehrheit übereinstimmen. Für sie bedeutet Säkularismus eine Abkehr von der Tradition und eine potenzielle Bedrohung für das Gefüge der afghanischen Gesellschaft. \n\nAuf der anderen Seite argumentieren Befürworter des Säkularismus, dass eine Trennung von Religion und Staat unerlässlich ist, um den Fortschritt zu fördern und die Gleichberechtigung aller Bürger, unabhängig von ihrem Glauben, zu gewährleisten. Sie verweisen auf die Vorteile einer säkularen Regierungsführung, wie z. B. die Stärkung der Meinungsfreiheit, den Schutz von Minderheitenrechten und die Förderung der Gleichstellung der Geschlechter. Diese Fraktion ist der Ansicht, dass die Einführung des Säkularismus es [AFG.GetNonIdeologyName] ermöglichen wird, sich zu modernisieren und auf der globalen Bühne zu konkurrieren, während gleichzeitig die individuellen Freiheiten respektiert werden."
 AFG_loya_jirga.5.desc:0 "Wir müssen unser Bekenntnis zu islamischen Grundsätzen bekräftigen."
 AFG_loya_jirga.5.a:0 "Die Trennung von Religion und Staat ist unerlässlich!"
 AFG_loya_jirga.5.b:0 ""

 AFG_loya_jirga.6.t:0 "Das Problem des weit verbreiteten Analphabetismus ist endlich in den Vordergrund der diesjährigen Loya Jirga gerückt. Die Delegierten sind sich uneinig, wie dieses kritische Problem am besten angegangen werden kann. Einige befürworten ein umfassendes Alphabetisierungsprogramm, während andere davor warnen, die Traditionalisten durch rasche Veränderungen zu provozieren."
 AFG_loya_jirga.6.desc:0 "Die Befürworter eines groß angelegten Alphabetisierungsprogramms argumentieren, dass sofortige Maßnahmen erforderlich sind, um die Nation zu stärken und ihren zukünftigen Wohlstand zu sichern. Sie behaupten, dass Investitionen in Bildung für die Entwicklung qualifizierter Arbeitskräfte, die Verbesserung der politischen Teilhabe und die Förderung des Wirtschaftswachstums unerlässlich sind. Dieser ehrgeizige Ansatz sieht eine robuste Initiative zur Bildung der Massen vor, insbesondere von Frauen, die in der Vergangenheit bei Bildungschancen benachteiligt wurden. \n\nUmgekehrt befürworten vorsichtige Stimmen einen schrittweisen Ansatz und betonen die Notwendigkeit, kulturelle Empfindlichkeiten und die traditionelle Lebensweise zu respektieren. Sie warnen davor, dass ein plötzlicher Vorstoß für eine umfassende Bildung zu einer Gegenreaktion von traditionalistischen Fraktionen führen könnte, die dies als Eingriff in ihre Bräuche und Werte ansehen könnten. Diese Fraktion schlägt vor, lokale Programme umzusetzen, die auf bestehenden Gemeinschaftsstrukturen aufbauen und einen reibungsloseren Übergang zu einer höheren Alphabetisierung ermöglichen, ohne diejenigen zu verprellen, die Veränderungen skeptisch gegenüberstehen."
 AFG_loya_jirga.6.a:0 "Die schrittweise Beseitigung des Analphabetismus ist von entscheidender Bedeutung."

 AFG_loya_jirga_good:0 ""
 AFG_loya_jirga_bad:0 "Das Ende der [GetYear] Loya Jirga"

 AFG_loya_jirga.10.t:0 "Großartig."
 AFG_loya_jirga.10.d:0 ""
 AFG_loya_jirga.10.a:0 "Während der Jirga nahmen der König und seine Regierung eine versöhnliche und freundliche Haltung gegenüber ihren Mitgliedern ein und drückten den starken Wunsch nach Zusammenarbeit und der Aufrechterhaltung des Status quo aus. Die Kābul Times bezeichnete die diesjährige Jirga als demokratisch und transparent"
 AFG_loya_jirga.10.b:0 "Während der Jirga nahmen der König und seine Regierung eine aggressive und unfreundliche Haltung gegenüber Reformen und den Mitgliedern der Versammlung ein und strebten sofortige und radikale Reformen an. Dieser Ansatz stieß bei den Delegierten auf erheblichen Widerstand und wurde von der Kābul Times und zahlreichen anderen Nachrichtenagenturen scharf kritisiert"

 ######## OTHER EVENTS ######## "Der Verlauf der Loya Jirga 1936"

 afghanistan.1.t:0 "[AFG.GetNonIdeologyName] hat keine Zeit zu verlieren, Reformen müssen schnell umgesetzt werden!"
 afghanistan.1.d:0 "Wir müssen Reformen schrittweise umsetzen, um die Traditionalisten nicht zu verärgern ..."
 afghanistan.1.a:0 ""
 afghanistan.1.b:0 ""

 afghanistan.2.t:0 "Stammesführer bieten Unterstützung an"
 afghanistan.2.d:0 "In unserer Not hat sich ein lokaler Stamm mit dem Angebot an uns gewandt, uns militärisch zu unterstützen. Der Stamm, der für seine Kampfkraft und Loyalität bekannt ist, ist bereit, Soldaten zur Verfügung zu stellen, um die Reihen unserer Armee zu stärken. Dieses Angebot ist jedoch mit möglichen Konsequenzen verbunden. Der Stamm wird eine bevorzugte Behandlung erwarten und möglicherweise eine größere Rolle bei unseren Militäroperationen fordern. Wenn wir dem nachgeben, könnte dies dazu führen, dass unsere Armee stärker von diesen Stämmen abhängig wird, was möglicherweise zu Spannungen mit anderen Fraktionen im Land führt."
 afghanistan.2.a:0 "Wir könnten jede Hilfe gebrauchen, die wir bekommen können."
 afghanistan.2.b:0 "Wir benötigen keine solche Unterstützung."
 afghanistan.2.c:0 ""

 afghanistan.3.t:0 "[AFG.GetNonIdeologyName] fehlen politische Anführer und Revolutionäre, die das Volk und die Hezb-e Khalq anführen. Wir sollten tadschikische Berater nach [AFG.GetNonIdeologyName] schicken, da sie kulturell und sprachlich den Einheimischen ähneln. Wenn wir keine diplomatische und politische Unterstützung schicken, könnte sich [AFG.GetNonIdeologyName] von uns distanzieren und einen anderen Weg einschlagen, der nicht mit [SOV.Capital.GetCapitalVictoryPointName] übereinstimmt!"
 afghanistan.3.d:0 "Schicken Sie Nisar Muhammad Yousafzai, den Helden des dritten anglo-afghanischen Krieges."
 afghanistan.3.a:0 "Dmitri Protopopov, jung, aber loyal, ist genau der richtige Mann für den Job."
 afghanistan.3.b:0 "Sie verdienen unsere kostbare Zeit nicht!"

 afghanistan.4.t:0 "Die Tadschikistan-Frage"
 afghanistan.4.d:0 "Die [AFG.GetAdjektiv]-Regierung hat uns mit einer interessanten Bitte kontaktiert: Sie hat die Übertragung des Eigentums an [742.GetName] an Afghanistan beantragt. Dies geschieht jedoch nicht ohne Grund, denn die Tadschiken und Paschtunen haben in [AFG.GetNonIdeologyName] über Jahrhunderte hinweg in relativem Frieden gelebt und haben viel gemeinsam. Es wäre klug, ihnen dieses Zugeständnis zu machen, da sie wahrscheinlich auf weniger politischen Widerstand von Seiten der Tadschiken stoßen würden."
 afghanistan.4.a:0 "Wir werden [AFG.GetNonIdeologyName] für ihre Loyalität belohnen ..."

 afghanistan.5.t:0 ""
 afghanistan.5.d:0 "Die [SOV.GetAdjective]s akzeptieren unseren Vorschlag"
 afghanistan.5.a:0 "Nach Erhalt des Schreibens vor einigen Tagen hat [SOV.Capital.GetCapitalVictoryPointName] unserem Vorschlag zugestimmt, [742.GetName] in [AFG.GetNonIdeologyName] aufzunehmen. Wir müssen hoffen, dass die Tadschiken sich nicht gegen den neuen Regierungs- und Kommunalwechsel wehren. Allerdings müssen wir in Zukunft sorgfältig zwischen den tadschikischen Gemeinschaften und dem Rest von [AFG.GetNonIdeologyName] abwägen, da [AFG.GetNonIdeologyName] nun auch eine Nation aller Tadschiken ist ..."
 afghanistan.5.b:0 "Tadschiken und Paschtunen, wieder in Harmonie!"

 afghanistan.6.t:0 "[AFG.GetNonIdeologyName] schlägt Invasion von [PER.GetNonIdeologyName] vor"
 afghanistan.6.d:0 "Wir haben einen interessanten Vorschlag von der [AFG.GetAdjektiv] Regierung erhalten. Sie schlagen eine gemeinsame Invasion von [PER.GetNameDef] vor, um die Südfront zu sichern und zu verhindern, dass unerwünschte Einflüsse nach Persien vordringen. Dies würde uns auch dabei helfen, unsere Interessen im Nahen Osten zu fördern und mehr Ölfelder zu sichern sowie unsere eigenen in Baku zu schützen."
 afghanistan.6.a:0 "Brillant! Bereiten Sie die Truppen auf eine Invasion vor!"

 afghanistan.7.t:0 ""
 afghanistan.7.d:0 "[SOV.GetAdjektiv]s lehnen unseren Vorschlag ab"
 afghanistan.7.a:0 "Nachdem [SOV.Capital.GetCapitalVictoryPointName] vor einigen Tagen den Brief erhalten hat, hat er beschlossen, unsere Anfrage abzulehnen. Unser Vertrauen in die [SOV.GetAdjektiv]-Regierung ist erschüttert. Obwohl ein großer Teil der [AFG.GetAdjektiv] Bevölkerung ethnisch tadschikisch ist, wird [AFG.GetNonIdeologyName] niemals in der Lage sein, die tadschikischen Länder zu vereinen!"

 afghanistan.12.t:0 ""
 afghanistan.12.d:0 "Nomaden siedeln sich in [AFG_nomad_state.GetName] an"
 afghanistan.12.a:0 "Viele Nomaden aus benachbarten Wüsten und Tälern haben sich entschlossen, sich in [AFG_nomad_state.GetName] niederzulassen, wie die Wilayat-Gouverneure in [AFG_nomad_state.GetName] berichten. Dies wird natürlich unserer Wirtschaft zugutekommen, aber wir müssen hoffen, dass [AFG_nomad_state.GetName] einen so großen Zustrom von Nomaden in so kurzer Zeit verkraften kann."

 afghanistan.13.t:0 ""
 afghanistan.13.d:0 "Der Staatsbesuch [AFG.GetAdjektiv] in [GER.Capital.GetCapitalVictoryPointName]"
 afghanistan.13.a:0 "Nach ihrem Aufbruch aus Kabul vor vielen Wochen ist die königliche Familie in [GER.Capital.GetCapitalVictoryPointName] angekommen. Bei ihrer Ankunft wurden sie von [GER.GetLeader] höchstpersönlich begrüßt, der sich freute, die königliche Familie von [AFG.GetNonIdeologyName] kennenzulernen. Während des Besuchs zeigte Sardar Muhammad Hashim Khan großes Interesse an der [GER.GetAdjektiv] Lebensweise und den [GER.GetAdjektiv] Traditionen. Während er an einer von [GER.GetFührer] organisierten Gala in [GER.Hauptstadt.GetHauptstadtSiegespunktname] teilnahm, bekundete er sein Interesse an einer verstärkten wirtschaftlichen und militärischen Zusammenarbeit mit [GER.GetNameDef]."

 afghanistan.14.t:0 ""
 afghanistan.14.d:0 "Die [SOV.GetAdjektiv] lehnen Invasion von [PER.GetNonIdeologyName] ab"
 afghanistan.14.a:0 "Die [SOV.GetAdjektiv]-Regierung hat unseren Antrag auf Invasion von [PER.GetNameDef] abgelehnt. Sie haben verkündet, dass die Südfront für sie nicht von großer Bedeutung ist und dass [PER.GetNameDef] keine Bedrohung für die Ölfelder von Baku darstellt."
 afghanistan.14.b:0 "Was für Narren, diese in [SOV.Capital.GetCapitalVictoryPointName] ..."
 afghanistan.14.c:0 ""

 afghanistan.15.t:0 "Der Weg zur Demokratie in [AFG.GetNonIdeologyName] war lang und beschwerlich. Leider wurde er nun beschritten. Die [GetYear] [AFG.GetAdjective] Wahlen sind der Beweis dafür, dass Demokratie in [AFG.GetNonIdeologyName] möglich und erreichbar ist, zumindest sagen das einige. [GetElectionWinner]"
 afghanistan.15.d:0 "Das ist es, was wir gerne sehen würden: freie und vor allem faire Wahlen!"
 afghanistan.15.a:0 "Ein Schritt näher zur wahren Demokratie!"

 afghanistan.16.t:0 ""
 afghanistan.16.d:0 "Die Vorbereitungen für Amanullahs Europareise"
 afghanistan.16.a:0 "Seit seiner Rückkehr nach [AFG.GetNonIdeologyName] vor nicht allzu langer Zeit plant Amanullah eine königliche Europareise. Als er das letzte Mal einen Versuch wagte, wurde er durch einen Bürgerkrieg in [AFG.GetNonIdeologyName] unterbrochen, während er sich im Ausland aufhielt. Daher ging er mit dem Rest der königlichen Familie ins Exil. Dieses Mal hat er geplant, dieselbe Tour wie 1928 zu machen und Kairo, Rom, Paris, [ENG.Capital.GetCapitalVictoryPointName], [GER.Capital.GetCapitalVictoryPointName], Warschau und schließlich Istanbul zu besuchen. Wenn alles nach Plan verläuft, wird Amanullah diese Reise in etwa 6 Monaten abgeschlossen haben. Wir können nur hoffen, dass die Lage in seiner Heimat stabil bleibt und der König sicher zurückkehrt."

 afghanistan.17.t:0 ""
 afghanistan.17.d:0 "Nisar Muhammad Yousafzai kommt aus [SOV.Capital.GetCapitalVictoryPointName] an"
 afghanistan.17.a:0 "Vor wenigen Tagen erreichte der Bericht aus Kabul [SOV.Capital.GetCapitalVictoryPointName] und die Hände von [SOV.GetLeader]. Nachdem er die Nachricht erhalten hatte, berief [SOV.GetLeader] eine Versammlung seiner treuesten Männer ein, die dann sorgfältig und überlegt über den vorgelegten Vorschlag debattierten. Nach vielen langen Stunden hitziger Debatten wurde eine Entscheidung getroffen: Nisar Muhammad Yousafzai, einer der Gründer der ASSR Tadschikistan und Held des Dritten Anglo-Afghanischen Krieges, wird zusammen mit Vitaly Primakov, dem stellvertretenden Befehlshaber des Militärbezirks Leningrad, in Kürze in Kabul eintreffen. Wie vorgeschlagen, wird Nisar Muhammad Yousafzai auch die führende Persönlichkeit der Khalq werden."

 afghanistan.18.t:0 ""
 afghanistan.18.d:0 "Dmitri Protopopov kommt aus [SOV.Hauptstadt.Hauptstadt-Siegpunkt-Name]"
 afghanistan.18.a:0 "Vor wenigen Tagen erreichte der Bericht aus Kābul [SOV.Hauptstadt.Hauptstadt-Siegpunkt-Name] und die Hände von [SOV.GetLeader]. Nach Erhalt der Nachricht berief [SOV.GetLeader] eine Versammlung seiner treuesten Männer ein, die den vorgelegten Vorschlag sorgfältig und wohlüberlegt diskutierten. Nach vielen langen Stunden hitziger Debatten wurde eine Entscheidung getroffen: Dmitri Protopopov, eine prominente und bekannte Persönlichkeit in der tadschikischen Politik, wird zusammen mit Vitaly Primakov, dem stellvertretenden Kommandeur des Militärbezirks Leningrad, in Kürze in Kābul eintreffen. Wie vorgeschlagen, wird Protopopov auch die führende Persönlichkeit der Khalq und der [AFG.GetAdjektiv] Nation werden."

 afghanistan.19.t:0 ""
 afghanistan.19.d:0 "Die [SOV.GetAdjektiv] lehnen unseren Antrag ab!"
 afghanistan.19.a:0 "Vor wenigen Tagen erreichte der Bericht aus Kābul [SOV.Hauptstadt.GetHauptstadtSiegespunktname] und die Hände von [SOV.GetAnführer]. Nach Erhalt der Nachricht berief [SOV.GetAnführer] eine Versammlung seiner treuesten Männer ein, die dann sorgfältig und überlegt über den vorgelegten Vorschlag debattierten. Nach vielen langen Stunden hitziger Debatten, die auf erhebliche Meinungsverschiedenheiten unter den Bolschewiki zurückzuführen waren, wurde keine Entscheidung getroffen. Es scheint, dass [SOV.Capital.GetCapitalVictoryPointName] kein Interesse an [AFG.GetNonIdeologyName] hat. Wir können nur hoffen, dass dies nicht das Ende der Beziehungen zwischen [SOV.GetAdjektiv] und [AFG.GetAdjektiv] bedeutet."
 afghanistan.19.b:0 "Wie können sie es wagen! Das ist inakzeptabel!"

 afghanistan.20.t:0 "Die Ratskrise"
 afghanistan.20.d:0 "Der Revolutionsrat hat schon zu lange keinen Vorsitzenden mehr, wir können nicht erwarten, dass er ohne einen richtigen Ratsvorsitzenden weiter funktioniert. Es ist an der Zeit, einen Vorsitzenden zu wählen, da die [SOV.GetAdjektiv]s es versäumt haben, uns ausreichend Führungskräfte zur Verfügung zu stellen, die den Revolutionsrat leiten könnten. Stabilität und Ordnung müssen innerhalb der Partei aufrechterhalten werden!"
 afghanistan.20.a:0 "Stabilität muss um jeden Preis aufrechterhalten werden!"
 afghanistan.20.b:0 "Begünstigt die Parchamiten..."

 afghanistan.21.t:0 "Jährliches Turkmenisches Sportfest"
 afghanistan.21.d:0 "Der König von [AFG.GetNonIdeologyName], Muhammad Zahir Shah, hat am jährlichen Turkmenischen Sportfest in einer Stadt in der Nähe von Kabul teilgenommen, einem lokalen Pferdefest, das dazu dient, die Menschen in [AFG.GetNon IdeologyName] von der Welt ablenkt, die langsam in Flammen aufgeht. Glücklicherweise müssen sich die [AFG.GetAdjektiv] Menschen keine Sorgen machen, da eine ausländische Invasion von [AFG.GetNonIdeologyName] unwahrscheinlich ist, oder?"
 afghanistan.21.a:0 "Mit dem König an der Macht ist [AFG.GetNonIdeologyName] unbesiegbar!"
 afghanistan.21.b:0 "Er zecht, während die Welt brennt ... Eine Schande!"
 afghanistan.21.c:0 ""

 afghanistan.22.t:0 "Heute wurde eine Razzia in Qiamuddins Haus von der KhAD durchgeführt, er wurde wegen eines mutmaßlichen Komplotts gegen die Regierung und die Partei Afghanistans verhaftet, der Leiter der KhAD hat drei Lösungen für seine Verhaftung vorgeschlagen, seine Hinrichtung wird die Parcham-Fraktion verärgern, aber würde auch einen ihrer einflussreichsten Anführer beseitigen. Ihn einfach zu verhaften und aus der [AFG.GetAdjektiv]-Politik zu entfernen, ist ebenfalls eine gute Wahl. Wir könnten ihn auch freilassen, aber das würde zu Instabilität führen und die Parcham stärken."
 afghanistan.22.d:0 "Ich sage, schickt ihn an den Galgen!"
 afghanistan.22.a:0 "Verhaftet den Verräter, er soll zu lebenslanger Haft verurteilt werden."

 afghanistan.23.t:0 ""
 afghanistan.23.d:0 "Maulana Qiamuddin Khadim stirbt im Gefängnis"
 afghanistan.23.a:0 "Während der Anführer der Parcham, Maulana Qiamuddin Khadim, heute im Gefängnis gestorben ist, haben viele Menschen seine Verhaftung boykottiert und protestiert, seit dies geschehen ist. Es ist uns jedoch gelungen, diese Proteste zu unterdrücken. Viele fragen sich, wie die Parcham ohne ihren Anführer weitermachen wird."

 afghanistan.24.t:0 ""
 afghanistan.24.d:0 "Bildungsreform abgeschlossen"
 afghanistan.24.a:0 "Nach vielen Jahren und Monaten hat [AFG.GetNonIdeologyName] endlich seine Bildungsreform abgeschlossen. Infolgedessen wurden viele ländliche Schulen im ganzen Land eröffnet, um die Menschen zu unterrichten. Fast alle Menschen in [AFG.GetNonIdeologyName] sind jetzt vollständig alphabetisiert, auch viele ältere Menschen. Wir müssen diese Nation so gut wie möglich weiter verbessern. Hoffentlich wird die nächste Generation von [AFG.GetNonIdeologyName]-Denkern unserer Nation den Ruhm und Respekt einbringen, den sie verdient!"
 afghanistan.24.b:0 "Die Zukunft von [AFG.GetNonIdeologyName] sieht rosig aus!"
 afghanistan.24.c:0 ""

 afghanistan.25.t:0 "Über dem üppigen Wakhan-Korridor ist ein Krieg in einem fernen Land ausgebrochen. Gerade heute im Morgengrauen ritten etwa vierzig Männer zu Pferd in Kabul ein, anscheinend kamen sie aus dem Osten, aus der jetzt vom Krieg zerrissenen Region Tunganistan. Erschöpft von vielen Tagen des Reitens, aber immer noch mit viel zu berichten, baten sie sofort darum, mit [AFG.GetLeader] zu sprechen. Nachdem sie sich als die Männer zu erkennen gegeben hatten, die sie wirklich waren, wurde ihrem Wunsch entsprochen. \n\nDer Anführer dieser Expedition war kein anderer als Muhammad Amin Bughra, der im Exil lebende Anführer der Ostturkestanischen Republik. Er und einige seiner Anhänger waren Hunderte von Meilen gereist, um die Nachricht vom Aufstand in Kashgar nach Kabul zu überbringen. Außerdem hatten sie um militärische Unterstützung für Tunganistan gebeten. \n\nNachdem sie dies gehört hatten, rieten viele Generäle und leitende Offiziere der [AFG.GetAdjektiv]-Armee [AFG.GetFührer], die Expeditionsteilnehmer gewähren zu lassen, da unsere Unterstützung für sie sehr viel bedeuten könnte, da es die einzige ist, die sie haben."
 afghanistan.25.d:0 "Unsere volle Unterstützung gehört Ihnen!"
 afghanistan.25.a:0 "Lasst nur die eifrigsten Männer gehen, wir wollen keinen Ärger ..."

 afghanistan.26.t:0 ""
 afghanistan.26.d:0 "Der Flug über das Pamir-Gebirge"
 afghanistan.26.a:0 "Es ist der Morgen des 24. August, drei mutige Männer mit großer Entschlossenheit haben beschlossen, die mutigste Aufgabe zu übernehmen, die Überquerung des Pamir. Nach wochenlanger Vorbereitung haben diese drei Männer, die für Lufthansa, eine Fluggesellschaft, arbeiten, beschlossen, dass heute der Tag ist, an dem sie zu einem Flug über den Pamir aufbrechen, in der Hoffnung, die Berge und Wüsten auf der anderen Seite sicher zu erreichen. Wenn alles gut geht, werden sie voraussichtlich in nicht weniger als zwei Wochen zurückkehren."

 afghanistan.27.t:0 ""
 afghanistan.27.d:0 "Das Verschwinden des Pamir-Flugs"
 afghanistan.27.a:0 "Drei Wochen sind vergangen, und es gibt keine Berichte über den Pamir-Flug. Nach unseren Schätzungen hätten sie bereits vor vier Tagen hier sein sollen, aber sie sind es nicht. Es besteht jedoch noch Hoffnung, da unsere Schätzungen möglicherweise nicht korrekt sind und sie jeden Moment zurückkehren könnten, vielleicht landen sie gerade in Kabul. Wir werden für ihre sichere Rückkehr beten."
 afghanistan.27.b:0 "Oh lieber Gott, was ist mit diesen armen Männern geschehen?"
 afghanistan.27.c:0 ""

 afghanistan.28.t:0 "Nach einem Monat wurde der Pamir-Flug erfolgreich kontaktiert und es wurde bestätigt, dass sie am Leben und wohlauf sind. Einige Tage nach der Herstellung des Funkkontakts mit der Flugbesatzung sind sie in Kabul gelandet und wurden wie Nationalhelden empfangen. Heute wurde eine große Leistung vollbracht: Der erste Flug über den Pamir hat stattgefunden!"
 afghanistan.28.d:0 "Puh ... wenigstens sind sie jetzt in Sicherheit."
 afghanistan.28.a:0 "Sie sollten zu Nationalhelden von [AFG.GetNonIdeologyName] ernannt werden!"

 afghanistan.29.t:0 ""
 afghanistan.29.d:0 "Königliche Familie gefangen"
 afghanistan.29.a:0 "Während das Echo von Kanonen- und Gewehrfeuer in der Stille verebbt, sind Berichte eingegangen, dass die königliche Familie von [AFG.GetNonIdeologyName], einschließlich König Zahir Shah, bei ihrem Fluchtversuch gefangen genommen wurde. Angeblich hatte die königliche Familie vor, das Land auf dem Luftweg zu verlassen, aber unvorhergesehene Umstände führten dazu, dass ihre Pläne von der Roten Armee von [AFG.GetNonIdeologyName] vereitelt wurden. Endlich wird der König mit den Konsequenzen seiner eigenen Handlungen konfrontiert!"
 afghanistan.29.b:0 "Fertig ... Ziel ... Feuer!"

 afghanistan.30.t:0 "Die königliche Familie von [AFG.GetNonIdeologyName] bittet um Asyl"
 afghanistan.30.d:0 "Nach dem jüngsten Staatsstreich in [AFG.GetNameDefCap] und dem endgültigen Untergang des Königreichs [AFG.GetNonIdeologyName] wurden König Zahir Shah und die königliche Familie von [AFG.GetNonIdeologyName] abgesetzt. Glücklicherweise konnten sie den Händen der Kommunisten entkommen und das Land verlassen, woraufhin sie in unserem Gebiet Zuflucht suchten."
 afghanistan.30.a:0 "Sie sind hier mehr als willkommen!"
 afghanistan.30.b:0 "Schickt sie auf den Weg, in [ROOT.Capital.GetCapitalVictoryPointName] ist kein Platz für sie ..."

 afghanistan.31.t:0 "Jamiat-e Islami angesprochen"
 afghanistan.31.d:0 "Nachdem Faqir im jüngsten Kampf gegen den König kontaktiert wurde, ist die Tatsache, dass der König einen vollständig repräsentativen Ansatz gewählt hat, Muhammad Hashim Khan, der Premierminister, eine offensichtlich liberale Regierungsfigur, als die Jamiat angesprochen wurde und Maududi, ein bekannter islamistischer politischer Aktivist, sich bereit erklärt hat, eine Fatwa gegen Hashim Khan zu erlassen und ihn zum "Taghut" oder "Tyrannen" zu erklären, eine Person, gegen die offene Rebellion gerechtfertigt ist"
 afghanistan.31.a:0 "Die Fatwa soll öffentlich sein! Wir werden diese Tyrannei nicht länger hinnehmen!"

 afghanistan.32.t:0 ""
 afghanistan.32.d:0 "Stammesführer versprechen Unterstützung"
 afghanistan.32.a:0 "Als nächsten Schritt zur Schaffung einer Stimmung gegen die Regierung im Land werden wir die weitgehend isolierten Stämme, die nichts von der Politik des Landes wissen, kontaktieren und ihnen versprechen, sie industriell zu entwickeln und politisch präsenter zu machen. So können wir ihre Unterstützung sichern, auch wenn dies Konsequenzen haben könnte, denn wenn wir versuchen, eine Zentralisierung zu erreichen, könnten sie in bestimmten Gebieten rebellieren."

 afghanistan.33.t:0 ""
 afghanistan.33.d:0 "Jamiat-e Islami-Verstärkungen treffen ein"
 afghanistan.33.a:0 "Die Jamiat-e Islami, die wir in unserer Widerstandsgruppe stark unterstützt haben, hat uns dringend benötigte Verstärkung in großer Zahl geschickt. Die islamistischen Kräfte haben die Durand-Linie überschritten und sich dort ihren Landsleuten im Kampf gegen die Tyrannen in Kabul angeschlossen!"

 afghanistan.34.t:0 ""
 afghanistan.34.d:0 "Jamiat-e Islami-Verstärkungen treffen ein"
 afghanistan.34.a:0 "Die Jamiat-e Islami, die wir in unserer Widerstandsgruppe stark unterstützt haben, hat uns dringend benötigte Verstärkung in großer Zahl geschickt. Die islamistischen Kräfte haben die Durand-Linie überschritten und sich ihren Landsleuten im Kampf gegen die Tyrannen in Kabul angeschlossen!"

 afghanistan.35.t:0 ""
 afghanistan.35.d:0 "Unterstützung durch Stämme trifft ein"
 afghanistan.35.a:0 "Die Stämme haben ihr Versprechen, uns zu unterstützen, erfüllt und uns eine große Menge an Waffen geschickt, die unsere Mudschaheddin in ihrem Dschihad gegen die Regierung einsetzen können. Sie mögen alt sein, aber wir brauchen alles, was wir bekommen können."
 afghanistan.35.b:0 "Wunderbar!"
 afghanistan.35.c:0 ""

 afghanistan.36.t:0 "Die Shura, oder "Rat" auf Paschtu, repräsentiert ein frühislamisches Prinzip, das die Einrichtung eines Beratungsgremiums zwischen dem Anführer und bestimmten Beratern fördert, die der König oder Emir in seiner Nähe haben würde. In den frühen Phasen des Islam richteten Kalifate wie die Rashidun Räte von Beratern ein, die in Zeiten der Not versuchten, dem Anführer in Staatsangelegenheiten zu helfen.Das Dilemma, wer genau diese Berater ernennen darf, wurde jedoch jahrhundertelang nie vollständig gelöst. Einige sind der Meinung, dass nur die hohen und mächtigen Eliten des Landes die Entscheidungen des Führers beeinflussen können sollten, andere sind der Meinung, dass der Führer selbst das Recht haben sollte, seinen eigenen Rat zu wählen, während ein modernerer Ansatz an Popularität gewinnt, nämlich die Demokratie, bei der Männer über 25 Jahre das Wahlrecht für Ratsmitglieder haben."
 afghanistan.36.d:0 "Nur die Klügsten und Reichsten haben reine Absichten für die Nation!"
 afghanistan.36.a:0 "Dies ist Sache des Emirs und nur des Emirs!"
 afghanistan.36.b:0 "Der moderne Ansatz scheint den Menschen durchaus zu gefallen ..."
 afghanistan.36.c:0 ""

 afghanistan.37.t:0 "Die Scharia ist das göttliche Gesetz, dem jeder islamische Staat oder jedes Kalifat zu folgen und das umzusetzen sucht, wie es im Koran steht, der vom Gesandten Allahs, dem Propheten Mohammed, Friede sei mit ihm, angeordnet wurde. Sie besteht aus einigen der grundlegendsten zivilen, finanziellen und sozialen Gesetze, die jeder Mensch befolgen muss, oder er muss sich vor einem Gericht islamischer Gelehrter, den Qadis, verantworten. In der Vergangenheit gab es viele Interpretationen und Umsetzungen dieser Gesetze, wobei die drei wichtigsten die Interpretation der Rashidun-Ära sind, die die Loyalität gegenüber dem Anführer und den Militärdienst Dienst als höchste Eigenschaft jedes wehrfähigen Mannes, die Interpretation aus der Ummayaden-Ära, die sich hauptsächlich auf eine radikale und schnelle territoriale Expansion, Herrschaft und anschließende Verbreitung des Islam konzentriert, und schließlich die moderne Interpretation aus der Osmanen-Ära, die sich auf die Verschmelzung des neuen modernen Zeitalters und der neuen Technologien mit den Lehren des Islam konzentriert, aber gleichzeitig die traditionellen islamischen Werte und Traditionen schützt."
 afghanistan.37.d:0 "[AFG.GetNonIdeologyName] soll so gerecht sein wie die Rashidun!"
 afghanistan.37.a:0 "Ein neues goldenes Zeitalter des Islam, das ist das Ziel von [AFG.GetNonIdeologyName]!"
 afghanistan.37.b:0 "Wir streben danach, moderne Technologie mit den Lehren des Islam zu verbinden!"
 afghanistan.37.c:0 ""

 afghanistan.38.t:0 "Die Ulema, die klügsten und religiösesten unter ihnen, spielen in jeder islamischen Nation eine sehr wichtige Rolle, manchmal als Reformtreiber oder als Führungspersönlichkeiten in schwierigen Zeiten, die kommen und gehen. Für eine Nation und insbesondere für ihren Anführer ist es jedoch von größter Bedeutung, dass die Ulema loyal und zufrieden sind. Davon abgesehen kann die Nation die Ulema auf vielfältige Weise nutzen, entweder als Regierungsbeamte und Verwaltungsangestellte, Militärreformer, Modernisierer und Lehrer oder finanziell, durch Banken und Schatzämter, und ihnen eine wichtige Rolle in der Bildung der Nation und ihrer Kinder zuweisen."
 afghanistan.38.d:0 "Die Regierung könnte eine helfende Hand gebrauchen ..."
 afghanistan.38.a:0 "Ein starkes und mächtiges Land braucht eine starke und mächtige Armee!"
 afghanistan.38.b:0 "Die Kinder der Nation sollen nur von den Besten lernen."
 afghanistan.38.c:0 ""

 afghanistan.39.t:0 "Zakat ist ein grundlegendes islamisches Prinzip, das besagt, dass jeder arbeitsfähige Mann einen kleinen Teil seines Gehalts, fast 3 %, als Unterstützung an die Armen und Obdachlosen abgeben soll und muss, die leider nicht in der Lage sind, für sich selbst zu sorgen. Es gibt viele Möglichkeiten, Zakat zu geben, aber es könnte vom Staat durchgeführt werden , als zusätzliche Steuer oder Abgabe eingeführt werden, die die Menschen zahlen müssten, oder sie könnte direkt für die Menschen organisiert werden, was eine viel einfachere Art der Umsetzung wäre, da sie unkompliziert wäre, ohne dass eine Bürokratie erforderlich wäre, und die dritte und letzte Option wäre eine staatlich organisierte Zakat in direkter Zusammenarbeit mit den Menschen, eine Verschmelzung der beiden vorherigen Vorschläge."
 afghanistan.39.d:0 "Nur der Staat kann garantieren, dass solche Dinge richtig gemacht werden!"
 afghanistan.39.a:0 "Direkt und unkompliziert, es besteht keine Notwendigkeit für einen Mittelsmann."
 afghanistan.39.b:0 "Eine Vereinigung der beiden Vorschläge scheint am attraktivsten zu sein ..."
 afghanistan.39.c:0 ""

 afghanistan.40.t:0 "Der Heilige Kampf oder "Dschihad" auf Arabisch ist eines der wichtigsten Prinzipien des Islam, wenn nicht sogar das wichtigste. Der Dschihad ist die wichtigste Waffe jeder islamischen Nation, und das hat sich im Laufe der Geschichte unzählige Male gezeigt. Der Dschihad kann nicht nur den militärischen und physischen Kampf gegen einen Feind bedeuten, sondern sich auch auf den friedlichen und gewaltfreien Widerstand gegen einen Besatzer beziehen, zum Beispiel. Was auch immer wir als Grundlage für den Dschihad betrachten, wird darüber entscheiden, ob das Land [AFG.GetNonIdeologyName] siegt oder untergeht, wie die unzähligen Reiche, die vor ihm zerfielen ..."
 afghanistan.40.d:0 "Nur mit militärischen Mitteln können die Ziele unserer Nation und des Islam erreicht werden!"
 afghanistan.40.a:0 "Das Leben eines jeden Menschen soll sein eigener Dschihad sein!"

 afghanistan.41.t:0 ""
 afghanistan.41.d:0 "Die Verfassung von [AFG.GetNonIdeologyName] wurde ausgearbeitet!"
 afghanistan.41.a:0 "Nach unzähligen hitzigen Diskussionen über verschiedene Themen, die von administrativen über soziale bis hin zu militärischen Themen reichten, hat das Siegel von [AFG.GetNonIdeologyName] endlich die allererste islamische Verfassung von [AFG.GetNonIdeologyName] besiegelt. Mit Unterstützung der Loya Jirga, der Shura und der Qadis und Scheichs wurde die [GetYear]-Verfassung umgesetzt und sofort in Kraft gesetzt. Mögen der Name [AFG.GetNonIdeologyName] und das [AFG.GetAdjektiv]-Volk tausend Jahre und noch tausend Jahre gedeihen, Inshallah!"

 afghanistan.42.t:0 ""
 afghanistan.42.d:0 "Friedliche Kundgebung in [AFG_communist_state_target.GetName]"
 afghanistan.42.a:0 "Die jüngste [PER.GetCommunistParty] Kundgebung in [AFG_communist_state_target.GetName] soll friedlich verlaufen sein und es soll keine Unfälle gegeben haben. Dies wird uns helfen, unser Image erheblich zu verbessern und viele Menschen für unsere Sache zu gewinnen. Wir können nur hoffen, dass es so weitergeht!"

 afghanistan.43.t:0 ""
 afghanistan.43.d:0 "Sozialistische Kundgebung in [AFG_communist_state_target.GetName]"
 afghanistan.43.a:0 "Die letzte [PER.GetCommunistParty] Kundgebung in [AFG_communist_state_target.GetName] soll relativ friedlich verlaufen sein, wobei es zu einigen Unfällen kam. Einige kommunistische Extremisten gerieten mit der Opposition aneinander, was zu einer Schlägerei führte. Die [PER.GetAdjektiv] Polizei musste eingreifen, um die gefährliche Situation zu beruhigen. Wir müssen aufpassen, dass wir keine hitzige Reaktion provozieren."

 afghanistan.44.t:0 ""
 afghanistan.44.d:0 "Gewalttätige Kundgebung in [AFG_communist_state_target.GetName]"
 afghanistan.44.a:0 "Die jüngste [PER.GetCommunistParty] Kundgebung in [AFG_communist_state_target.GetName] soll katastrophal verlaufen sein. Auf beiden Seiten wurden viele Menschen verletzt, einige davon schwer, und wurden anschließend ins nächste Krankenhaus gebracht. Wir müssen diesen Extremismus zerschlagen! Wenn wir das nicht schaffen, könnte ein Bürgerkrieg in [PER.GetNameDef] wahrscheinlicher werden."
 afghanistan.44.b:0 "Das ist ziemlich gefährlich geworden ..."

 afghanistan.45.t:0 "[AFG.GetNonIdeologyName] schlägt einen Waffenstillstand vor"
 afghanistan.45.d:0 "Da die [AFG.GetAdjective]-Truppen Gebiete in [PAK.GetNonIdeologyName] halten, hat unsere Unfähigkeit, sie anzugreifen, zur Erschöpfung unserer Armee geführt, und wir denken, dass es am besten wäre, die von ihnen kontrollierten Gebiete einfach abzutreten, da die Regionen uns nur Ärger bereitet haben und schlecht entwickelt sind."
 afghanistan.45.a:0 "Nein! Wir werden bis zum bitteren Ende weiterkämpfen!"
 afghanistan.45.b:0 "Was auch immer das Beste für die Nation ist ..."

 afghanistan.46.t:0 "[AFG.GetNonIdeologyName] bittet um militärische Unterstützung"
 afghanistan.46.d:0 "Unter Berufung auf die Notwendigkeit, ihre Nation und ihr Volk zu schützen, die in einem sehr wichtigen strategischen Gebiet liegt, und auf die Tatsache, dass die [AFG.GetNonIdeologyName] Regierung von potenziellen Feinden [GER.GetNonIdeologyName] ohne Küste umgeben ist, hat diese gefordert, dass [GER.GetNonIdeologyName] Truppen in ihr Gebiet entsandt werden, um ihre Souveränität, ihre Verteidigung und die [GER.GetNonIdeologyName] Interessen zu gewährleisten."
 afghanistan.46.a:0 "Wir können es uns nicht leisten, einen weiteren Verbündeten zu verlieren."

 afghanistan.47.t:0 ""
 afghanistan.47.d:0 "[GER.GetAdjektiv] Militärische Unterstützung trifft ein"
 afghanistan.47.a:0 "Die [GER.GetAdjective] Regierung hat zugestimmt, fünf Wehrmacht-Abteilungen zu entsenden, um unsere Armee bei der Verteidigung unseres Territoriums zu unterstützen. Sie haben die Notwendigkeit angeführt, [AFG.GetNonIdeologyName] zu schützen, da [AFG.GetNonIdeologyName] für ihre Sache strategisch wichtig sei und als guter Verbündeter der [GER.GetAdjective] in der Region dienen würde."

 afghanistan.48.t:0 ""
 afghanistan.48.d:0 "Die [GER.GetAdjective]s lehnen unsere Anfrage ab"
 afghanistan.48.a:0 "Unter Berufung auf die Verteidigung des [GER.GetAdjective]-Territoriums weigern sich die [GER.GetAdjective]s, Truppen zur Verteidigung [AFG.GetNameDef]s zu entsenden und uns in irgendeiner Form militärische Unterstützung zu leisten. Ist das wirklich der Verbündete, den [AFG.GetNonIdeologyName] an seiner Seite haben möchte?"

 afghanistan.50.t:0 ""
 afghanistan.50.d:0 "Kommunisten stürmen [266.GetName]!"
 afghanistan.50.a:0 "Mitglieder der [PER.GetCommunistParty] haben heute die Hauptstadt und das Parlament von [PER.GetNameDef] gestürmt, die derzeitige Regierung gestürzt und die Sozialistische Republik Iran ausgerufen. Die [PER.GetCommunistParty] hat so viel Unterstützung gewonnen, dass der Widerstand gegen ihren Staatsstreich gegen die Regierung minimal war. Dies ist das Ende des Weges für [PER.GetRulingParty], aber ein Anfang für den Kommunismus in [PER.GetNameDef]."
 afghanistan.50.b:0 "Eine tragische Niederlage!"

 afghanistan.51.t:0 "[AFG.GetNonIdeologyName] drängt auf größere Einheit"
 afghanistan.51.d:0 "Aufgrund unserer ständig zunehmenden wirtschaftlichen und politischen Zusammenarbeit mit [AFG.GetNonIdeologyName] haben sie eine Vereinigung von [ROOT.GetNameDef] mit [AFG.GetNameDef] vorgeschlagen und dabei die Notwendigkeit angeführt, die revolutionäre Flamme im Nahen Osten unter einem Banner zu vereinen. Es liegt jedoch an uns zu entscheiden, ob wir ihren Forderungen nachgeben oder sie ablehnen."
 afghanistan.51.a:0 "Eine brillante Idee!"
 afghanistan.51.b:0 "Auf keinen Fall!"

 afghanistan.52.t:0 "[AFG.GetNonIdeologyName] fordert paschtunische Gebiete!"
 afghanistan.52.d:0 "Die [AFG.GetAdjective] Regierung hat die Kontrolle über die Regionen [444.GetName], [442.GetName] und [445.GetName] gefordert. Als Grund für diese Forderung wird der historische Anspruch [AFG.GetNonIdeologyName]s auf diese Gebiete und die vielen Millionen Paschtunen, die heute dort leben, genannt. Um weiterhin freundschaftliche Beziehungen zu [AFG.GetNonIdeologyName] zu pflegen, sollten wir ihren Forderungen nachgeben."
 afghanistan.52.a:0 "Geben Sie ihren Forderungen nach."
 afghanistan.52.b:0 ""Paschtunische Gebiete", was für ein Unsinn!"

 afghanistan.53.t:0 "König Amanullah kehrt zurück"
 afghanistan.53.d:0 "Da die Bedingungen für seine Rückkehr perfekt sind, wurde Amanullah Khan anschließend eingeladen, nach [AFG.GetNonIdeologyName] zurückzukehren. Er hat die Einladung gerne angenommen, um [AFG.GetNonIdeologyName] zu verbessern und seine früheren Fehler als König von [AFG.GetNonIdeologyName] zu korrigieren, die letztendlich zum Aufstand der Sakkawisten im Jahr 1929 führten. Er hat Haji Mirzali Khan für die Einladung gedankt."
 afghanistan.53.a:0 "Bieten Sie ihm eine wichtige Verwaltungsposition an ..."
 afghanistan.53.b:0 "Der König ist endlich zurückgekehrt, und das Königreich wird es auch sein!"

 afghanistan.54.t:0 "Der zweite [AFG.GetAdjektiv] Bürgerkrieg"
 afghanistan.54.d:0 "In der vergangenen Woche haben sich viele Stammesführer in [AFG.GetNonIdeologyName] gegen den König und die Regentschaft ausgesprochen, die hauptsächlich aus seinen beiden Onkeln, Muhammad Hashim Khan und Shah Mahmud Khan, besteht. In ihren Augen ist die Regierung von [AFG.GetNonIdeologyName] zu modern geworden und hat sich zu weit von den traditionellen Werten und Bräuchen des afghanischen Volkes entfernt. Vor diesem Hintergrund haben sie beschlossen, einen umfassenden Aufstand zu starten, um das Regime zu stürzen. Viele spekulieren, dass der Führer der Jamiat-e Islami, Abul A'la al-Maududi, ebenfalls in den Konflikt verwickelt ist, allerdings wurden keine Beweise gefunden, die diesen Verdacht bestätigen."
 afghanistan.54.a:0 "Es sind immer die [AFG.GetAdjektiv], nicht wahr?"
 afghanistan.54.b:0 "Tod den Tyrannen! Tod dem König!"
 afghanistan.54.c:0 ""

 afghanistan.55.t:0 "Vor einigen Monaten brach in [AFG.GetNonIdeologyName] ein Bürgerkrieg aus. Der Grund dafür war die Unzufriedenheit mit der Regierung, die immer mehr Kontrolle über die Bevölkerung erlangte und die Modernisierung vorantrieb. Sie beschlossen, dass es an der Zeit sei, die vermeintliche Tyrannei der derzeitigen Regierung zu beenden, woraufhin in ganz [AFG.GetNonIdeologyName] weit verbreitete Aufstände ausbrachen. Dieser Konflikt dauert jedoch schon seit geraumer Zeit an, wir könnten dies zu unserem Vorteil nutzen und [AFG.GetNonIdeologyName] angreifen, solange sie schwach und gespalten sind. Was müssen wir tun?"
 afghanistan.55.d:0 "Der Staub wird sich von selbst legen."
 afghanistan.55.a:0 "Materielle Unterstützung sollte ausreichen."

 afghanistan.56.t:0 ""
 afghanistan.56.d:0 "Widerstand in [PAK.GetNonIdeologyName]?"
 afghanistan.56.a:0 "Der Widerstand in [PAK.GetNonIdeologyName] hat in den letzten Wochen ein Allzeithoch erreicht. Der Grund dafür ist unbekannt, aber unsere Agenten konnten die [AFG.GetAdjektiv]-Regierung erfolgreich mit den Widerstandsbewegungen in [PAK.GetNonIdeologyName] in Verbindung bringen, da bei einer Hausdurchsuchung bei einem mutmaßlichen [PAK.GetAdjektiv]-Widerstandskämpfer ein Vorrat an militärischer Ausrüstung beschlagnahmt wurde. Wir konnten bestätigen, dass diese Waffen tatsächlich aus [AFG.GetNonIdeologyName] eingeschmuggelt werden. Ob dies so weitergeht oder nicht, können wir nicht sagen."

 afghanistan.57.t:0 ""
 afghanistan.57.d:0 "Die Royal Tour kommt in Kairo an"
 afghanistan.57.a:0 "Nach dem Auslaufen aus Quetta ist die Royal Tour in Kairo angekommen, wo sie von [EGY.GetLeader] begrüßt wurde. In der Hauptstadt fand eine Militärparade statt, und Amanullah grüßte die [EGY.GetAdjektiv]-Soldaten. [EGY.GetLeader] und Amanullah sprachen dann über die Beziehungen zwischen den beiden Ländern. Nach einer Woche in Kairo stach die Royal Tour erneut in See, diesmal in Richtung Rom."

 afghanistan.58.t:0 ""
 afghanistan.58.d:0 "Die königliche Familie kommt in Rom an"
 afghanistan.58.a:0 "Nach einer Woche in Kairo setzte die Royal Tour die Segel in Richtung Rom. Bei ihrer Ankunft in Rom wurden sie mit einer militärischen Zeremonie und [ITA.GetLeader] begrüßt. Bei seinem letzten Besuch in Rom wurde Amanullah vom König von [ITA.GetNonIdeologyName] mit dem Obersten Orden der Allerheiligsten Verkündigung ausgezeichnet. Amanullah traf auch mit Papst Pius XI. vom Heiligen Stuhl zusammen. Der König war beeindruckt von den industriellen und technologischen Fortschritten, die er in Rom sah. Die königliche Tour verbrachte viel Zeit in Rom, aber nach ein paar Wochen begab sie sich nach Marseille."

 afghanistan.59.t:0 ""
 afghanistan.59.d:0 "Amanullah trifft sich mit [FRA.GetLeader]"
 afghanistan.59.a:0 "Die Royal Tour brach vor etwa einem Monat nach Marseille auf und bestieg anschließend einen Zug in Richtung Paris. In Paris wurden sie von einer Militärparade begrüßt und zu Ehren von König Amanullah wurde eine Salve abgefeuert. [FRA.GetLeader] begrüßte das Königspaar und schenkte ihm einen Peugeot 202 der Spitzenklasse. Nachdem Amanullah eine Woche lang Paris und seine lebendige Atmosphäre erkundet hatte, reiste er nach [GER.Capital.GetCapitalVictoryPointName] weiter."

 afghanistan.60.t:0 ""
 afghanistan.60.d:0 "Der König besucht [GER.Capital.GetCapitalVictoryPointName]"
 afghanistan.60.a:0 "Nach dem Verlassen von Paris bestieg der deutschliebende König einen Zug in Richtung [GER.Capital.GetCapitalVictoryPointName]. Einige Tage später wurde Amanullah auf dem Pariser Platz empfangen, wo er von [GER.GetLeader] begrüßt wurde. Der König war vom [GER.GetAdjektiv] Militär so beeindruckt, dass er um die Lieferung von [GER.GetAdjektiv] Stahlhelmen nach [AFG.GetNonIdeologyName] bat. Amanullah durfte im Reichstag sprechen, wo seine Rede von den Mitgliedern der [GER.GetRulingParty] und [GER.GetLeader] selbst unterstützt wurde. Nachdem er die Architektur und Kunst [GER.GetAdjektiv] bewundert hatte, beschloss Amanullah, [GER.Hauptstadt.GetHauptstadtSiegespunktname] erneut zu verlassen und nach [ENG.Hauptstadt.GetHauptstadtSiegespunktname] zu reisen."

 afghanistan.61.t:0 ""
 afghanistan.61.d:0 "Amanullah trifft in [ENG.Capital.GetCapitalVictoryPointName] ein"
 afghanistan.61.a:0 "Nach dem Verlassen von [GER.Capital.GetCapitalVictoryPointName] reiste das Königspaar an Bord der SS "Maid of Orleans" nach Dover. Bald darauf machten sie sich auf den Weg nach [ENG.Capital.GetCapitalVictoryPointName], wo sie von [ENG.GetLeader] empfangen wurden. Zu Ehren Amanullahs wurde eine militärische Zeremonie abgehalten. Amanullah wies auf die Bedeutung [ENG.GetNameDef]s für [AFG.GetNonIdeologyName] hin, sowohl als militärischer als auch als wirtschaftlicher Partner. [ENG.GetLeader] stimmte zu und erklärte, dass [ENG.GetNameDef] die Zusammenarbeit zwischen den beiden Nationen verbessern werde. Nach einigen Wochen in [ENG.Capital.GetCapitalVictoryPointName] reisten Amanullah und die Royal Tour nach Warschau."

 afghanistan.62.t:0 ""
 afghanistan.62.d:0 "Die königliche Tour besucht Warschau"
 afghanistan.62.a:0 "Nach ihrem Besuch in [ENG.Capital.GetCapitalVictoryPointName] reiste das Königspaar nach Warschau, wo sie nur wenige Wochen später ankamen. In Warschau wurden sie von [POL.GetLeader] begrüßt. Zu Ehren von Amanullah wurde eine militärische Zeremonie abgehalten. Amanullah und [POL.GetLeader] fuhren mit dem Auto durch die Hauptstadt und diskutierten über europäische Politik. Der König wurde dann von polnischen Ministern empfangen, die er herzlich begrüßte. Nach einem kurzen Aufenthalt in Warschau begann die Royal Tour ihre Reise zum Endziel Istanbul."

 afghanistan.63.t:0 ""
 afghanistan.63.d:0 "Amanullah trifft [TUR.GetLeader]"
 afghanistan.63.a:0 "Nach dem anschließenden Besuch in Warschau, wo die Royal Tour nicht viel Zeit verbrachte, verließ Amanullah Polen in Richtung Türkei. Sie kamen eine Woche später in Istanbul an und wurden bei ihrer Ankunft von [TUR.GetLeader] und [TUR.GetAdjektiv]-Soldaten auf einem Marsch zu Ehren Amanullas begrüßt. [TUR.GetLeader] betonte, wie wichtig die Zusammenarbeit im Nahen Osten ist und [TUR.GetAdjektiv] ehrgeizige Ziele für die Region hat. Amanullah stimmte den Aussagen von [TUR.GetLeader] weitgehend zu und brachte offen seine Unterstützung für die Förderung der Zusammenarbeit zwischen [TUR.GetNameDef] und [AFG.GetNonIdeologyName] zum Ausdruck. Da dies das Endziel der Royal Tour of Europe war, wurde viel Zeit in Istanbul verbracht. Nach zwei Wochen verließ Amanullah Istanbul mit dem Zug in Richtung Kabul."

 afghanistan.64.t:0 ""
 afghanistan.64.d:0 "Die königliche Reise kehrt nach [AFG.Hauptstadt.Hauptstadt-Siegpunktname] zurück"
 afghanistan.64.a:0 "Nach sechs Monaten im Ausland sind Amanullah Khan und Königin Soraya Tarzi endlich in Kabul angekommen. Damit endet die königliche Europareise. Amanullah wurde vom Volk in Kabul willkommen geheißen und anschließend zum Darulaman-Palast eskortiert. Nach einem längeren Auslandsaufenthalt kehrt Amanullah mit neuen Ansichten zur Innen- und Außenpolitik zurück. Amanullah hat sich geschworen, [AFG.GetNonIdeologyName] von einem unentwickelten Hinterland in eine moderne westliche Nation zu verwandeln."
 afghanistan.64.b:0 "Endlich kehrt der König zurück ... ein neuer Mann ..."

 afghanistan.66.t:0 "Selbstbestimmung für [442.GetName]?"
 afghanistan.66.d:0 "Die nördlichen Gebiete von [442.GetName], auch als Paschtunkhwa oder Afghania bezeichnet, werden seit Jahrhunderten von Paschtunen und [AFG.GetAdjektiv] gleichermaßen bewohnt. Sie unterscheiden sich natürlich sehr von unserem Volk, und dies hat dazu geführt, dass sie seit über einem Jahrzehnt den Wunsch nach Unabhängigkeit haben. Daher hat sich Afghanistan mit der Bitte an uns gewandt, ein Referendum abzuhalten, bei dem das in Pakistan lebende paschtunische Volk die Möglichkeit hätte, über sein eigenes Schicksal zu entscheiden, sei es, dass es auf unbestimmte Zeit in unserem Land bleibt oder sich seinen Brüdern in Afghanistan anschließt. Wenn wir jedoch wollen, dass [442.GetName] bei uns bleibt, müssten wir den ethnischen Paschtunen, die in der Region leben, große Zugeständnisse machen."
 afghanistan.66.a:0 "Vielleicht könnten wir ein Referendum abhalten ..."

 afghanistan.67.t:0 ""
 afghanistan.67.d:0 "Die Paschtunen befürworten die Abspaltung"
 afghanistan.67.a:0 "Die Paschtunen haben sich nach einem langen und mühsamen Prozess der Beratung und Abwägung schließlich entschieden, sich [AFG.GetNameDef] anzuschließen. Der Anführer der Khidmatgars, Abdul Ghaffar Khan, hat erklärt, dass die Paschtunen aufgrund der Zugeständnisse, die wir ihnen in [442.GetName] versprochen haben, und aufgrund unserer kulturellen Ähnlichkeiten für eine Vereinigung mit [AFG.GetNonIdeologyName] und eine anschließende Abspaltung gestimmt haben. Das Referendum war Berichten zufolge ein schneller Sieg für [AFG.GetNonIdeologyName], wobei [?AFG_percentage] % für die Abspaltung stimmten."
 afghanistan.67.b:0 "Ein weiterer großer Sieg für [AFG.GetNonIdeologyName]!"

 afghanistan.68.t:0 "Die Paschtunen befürworten die Union"
 afghanistan.68.d:0 "Die Paschtunen haben sich nach einem langen und mühsamen Prozess der Beratung und Abwägung schließlich für den Beitritt zu [AFG.GetNameDef] entschieden. Der Anführer der Khidmatgars, Abdul Ghaffar Khan, hat erklärt, dass die Paschtunen, die in [442.GetName] leben, aufgrund unserer versprochenen Zugeständnisse und unserer Bereitschaft, mit ihnen zusammenzuarbeiten, dafür gestimmt haben, Teil unserer Nation zu bleiben, allerdings mit größerer Autonomie. Das Referendum war Berichten zufolge ein schneller Sieg für uns, da [?AFG.RAJ_PAK_percentage] % für den Zusammenschluss stimmten."
 afghanistan.68.a:0 "Ausgezeichnet!"
 afghanistan.68.b:0 "Law aw Bar, Yaw Afghan!"

 afghanistan.69.t:0 "[FROM.GetNameDefCap] lehnt ab"
 afghanistan.69.d:0 "[FROM.GetNameDefCap] hat den Vorschlag für ein Referendum in [442.GetName] abgelehnt, möglicherweise aufgrund ihrer politischen Instabilität oder der insgesamt zunehmenden Spannungen in der globalen Geopolitik. Ihre Ablehnung wurde in [442.GetName] von den Khudai Khidmatgars und anderen Widerstandsgruppen heftig kritisiert."
 afghanistan.69.a:0 "Schande über sie!"

 afghanistan.70.t:0 ""
 afghanistan.70.d:0 "[FROM.GetNameDefCap] akzeptiert"
 afghanistan.70.a:0 "[FROM.GetNameDefCap] hat den Vorschlag für ein Referendum in [442.GetName] akzeptiert. Das ist wunderbar, da es eine freie und demokratische Lösung der [442.GetName]-Frage ermöglichen wird und die dort lebenden ethnischen Paschtunen wieder das Recht auf Selbstbestimmung haben werden. Ihre Zustimmung zum Referendum wurde in [442.GetName] von den Khudai Khidmatgars und anderen Widerstandsgruppen stark unterstützt."

 afghanistan.71.t:0 ""
 afghanistan.71.d:0 "Der [PER.GetAdjektiv] Bürgerkrieg"
 afghanistan.71.a:0 "Unsere Nation hat schon viel zu lange unter Instabilität gelitten, aber so wie Wasser seinen Siedepunkt hat, so hat auch unsere Nation ihren Siedepunkt erreicht. Erst heute wurde berichtet, dass bewaffnete Widerstandsgruppen im ganzen Land zu den Waffen gegriffen haben, um unser Regime im Namen des Sozialismus und Marxismus zu bekämpfen. Das ist das Ende des Weges."

 afghanistan.72.t:0 ""
 afghanistan.72.d:0 "Unterstützung durch Stämme trifft ein"
 afghanistan.72.a:0 "Die Stämme haben ihr Hilfsversprechen erfüllt und uns eine große Menge an Waffen geschickt, die unsere Mudschaheddin in ihrem Dschihad gegen die Regierung einsetzen können. Sie mögen alt sein, aber wir brauchen alles, was wir bekommen können."
 afghanistan.72.b:0 "Wunderbar!"

 afghanistan.73.t:0 "Wiederbelebung der Annäherung Mit [AFG.GetNonIdeologyName]?"
 afghanistan.73.d:0 "Die [AFG.GetAdjective]-Regierung hat sich an uns gewandt, in der Hoffnung, die [GetRajAdjective]-[AFG.GetAdjective]-diplomatischen Beziehungen wiederherzustellen. Sie haben erklärt, dass [AFG.GetNonIdeologyName] [RAJ.GetNameDef] nicht als Feind, sondern als Freund in der regionalen Geopolitik betrachtet. Sie haben einen Freundschaftsvertrag sowie einen gegenseitigen Nichtangriffspakt vorgeschlagen. Die Frage ist, ob wir dieselben Ansichten wie die [AFG.GetAdjektiv] teilen."
 afghanistan.73.a:0 "Wir müssen freundschaftliche Beziehungen zu [AFG.GetNonIdeologyName] pflegen."

 afghanistan.74.t:0 ""
 afghanistan.74.d:0 "[AFG_country_for_pakistan_press.GetNameDefCap] akzeptiert"
 afghanistan.74.a:0 "Die [AFG_country_for_pakistan_press.GetAdjective]-Regierung hat die strategische Entscheidung getroffen, uns die Kontrolle über [444.GetName], [442.GetName] und [445.GetName] zu übertragen. Sie haben den Wunsch nach einer weiteren Zusammenarbeit mit [AFG.GetNonIdeologyName] geäußert und erklärt, dass die Regierung von [AFG_country_for_pakistan_press.GetAdjective] [AFG.GetNonIdeologyName] eher als Verbündeten denn als Feind betrachtet."

 afghanistan.75.t:0 ""
 afghanistan.75.d:0 "[AFG_country_for_pakistan_press.GetNameDefCap] lehnt ab"
 afghanistan.75.a:0 "Die [AFG_country_for_pakistan_press.GetAdjective]-Regierung hat sich bewusst dafür entschieden, uns die Kontrolle über [444.GetName], [442.GetName] und [445.GetName] zu entziehen. Sie haben erklärt, dass diese Gebiete rechtmäßig [AFG.GetNameDef] gehören, hoffen aber auch, dass dies die Beziehungen zwischen [AFG.GetAdjektiv] und [AFG.GetAdjektiv] nicht beeinträchtigt."

 afghanistan.76.t:0 ""
 afghanistan.76.d:0 "[GER.GetAdjective] Unterstützung trifft ein"
 afghanistan.76.a:0 "Mehrere Lieferungen von Waffen und Munition sind heute in [AFG.GetNonIdeologyName] aus [GER.GetNonIdeologyName] eingetroffen. Zusammen mit diesen Waffen kamen viele Wehrmachtssoldaten und Agenten der [GER.GetAdjective] Abwehr. Zusammen mit den Lieferungen kam Carl August von Gablenz, ein berühmter [GER.GetAdjektiv] Militärflieger in [AFG.GetNonIdeologyName]. Die Stammeskrieger haben die dringend benötigte Unterstützung bereits begrüßt, da sie über einen Mangel an Ausrüstung für die Fortsetzung des Krieges berichten, und haben den [GER.GetAdjektiv]s ihren Dank ausgesprochen."
 afghanistan.76.b:0 "Das wurde dringend benötigt!"

 afghanistan.77.t:0 "Der [PER.GetAdjektiv] Bürgerkrieg"
 afghanistan.77.d:0 "In einer überraschenden Wendung der Ereignisse befindet sich Persien in einem heftigen Bürgerkrieg, in dem kommunistische Aufständische vor dem Hintergrund des Krieges mit Regierungstruppen zusammenstoßen. Der Konflikt, der vor einigen Tagen ausgebrochen ist, fügt der ohnehin schon turbulenten internationalen Landschaft eine neue Ebene der Komplexität hinzu. Es liegt an uns zu entscheiden, ob wir eingreifen und unsere Interessen in der Region wahren wollen oder nicht."
 afghanistan.77.a:0 "Mobilisieren Sie die Rote Armee!"
 afghanistan.77.b:0 "Es ist ihre persönliche Angelegenheit."
 afghanistan.77.c:0 ""

 afghanistan.78.t:0 "In einem mutigen und unerwarteten Schritt sind [SOV.GetAdjektiv]-Streitkräfte in die nördlichen Regionen von [PER.GetNameDef] einmarschiert. Die Invasion, die vor einigen Tagen begann, hat in diplomatischen Kreisen Schockwellen ausgelöst und Bedenken hinsichtlich der geopolitischen Folgen für die Region geweckt. [SOV.GetNameDefCap] führt strategische Gründe für diese Operation an und betont die Notwendigkeit, wichtige Versorgungswege zu sichern, die großen Ölfelder im Norden zu erobern und die eigenen Ölreserven in Baku zu schützen."
 afghanistan.78.d:0 "Die Revolution breitet sich aus."
 afghanistan.78.a:0 "Sie sind nur scharf auf das Öl!"

 afghanistan.79.t:0 ""
 afghanistan.79.d:0 "[FROM.GetNameDefCap] akzeptiert"
 afghanistan.79.a:0 "Die [FROM.GetAdjektiv]-Regierung hat unseren Vorschlag zur Versöhnung angenommen, in der Hoffnung, dass dies die [FROM.GetAdjektiv]-[AFG.GetAdjektiv]-diplomatischen Beziehungen verbessern wird. Sie haben erklärt, dass [FROM.GetNameDef] [AFG.GetNonIdeologyName] nicht als Feind, sondern als Freund in der regionalen Geopolitik betrachtet. Sie haben einen Freundschaftsvertrag sowie einen gegenseitigen Nichtangriffspakt vorgeschlagen. Der Frieden an der Durand-Linie soll gewahrt bleiben!"

 afghanistan.80.t:0 ""
 afghanistan.80.d:0 "[FROM.GetNameDefCap] lehnt ab"
 afghanistan.80.a:0 "Die [FROM.GetAdjective]-Regierung hat unseren Versöhnungsvorschlag abgelehnt, vielleicht aufgrund ihrer politischen Instabilität oder aufgrund ihrer aktuellen Haltung gegenüber [AFG.GetNonIdeologyName]. Sie haben sich nicht klar zum Thema Zusammenarbeit mit [AFG.GetNonIdeologyName] und ihren politischen Ambitionen in der Region geäußert. Wir werden sehen, was die Zukunft bringt ..."

 # afghanistan.80.t:0 ""
 # afghanistan.80.d:0 "Schulen in [AFG_illiteracy_state.GetName] eröffnet"
 # afghanistan.80.a:0 "Nach vielen Monaten anstrengender Arbeit sind die Schulen und Bildungseinrichtungen, deren Bau in [AFG_illiteracy_state.GetName] begonnen wurde, endlich fertiggestellt. [AFG.GetLeader] sowie der Bildungsminister, Herr Ahmed Ali Khan, haben es sich zur Aufgabe gemacht, [AFG_illiteracy_state.GetName] zu besuchen und dieses Ereignis zu feiern, indem sie eine der wichtigsten Schulen, nämlich die [AFG_illiteracy_state.GetCapitalVictoryPointName] Secondary School, persönlich einweihen. Somit kommt [AFG.GetNonIdeologyName] seinem Ziel, der Beseitigung des Analphabetismus, einen Schritt näher."

 afghanistan.81.t:0 ""
 afghanistan.81.d:0 "Der Limonadenverkäufer"
 afghanistan.81.a:0 "Für Ayub war es ein ganz normaler Tag. Er war durch die engen Straßen von Kabul gelaufen und hatte seine Limonade verkauft: "Limonade! Hier kaufen, Leute! Nur 30 Afghanis!" Als der Tag langsam vorüberging, konnte Ayub nicht anders, als zu bemerken, dass er fast seine gesamte Limonade verkauft hatte, was nicht alltäglich war. Als die Sonne am fernen Horizont unterging, war es Zeit für ihn, nach Hause zurückzukehren. Auf dem Heimweg fragte er sich jedoch, ob die Menschen in [AFG.GetNonIdeologyName] tatsächlich wohlhabender werden oder ob der heutige Tag wirklich nur ein Zufall war. Als er durch das Fenster seines Zimmers in die Sterne blickte, begann er langsam in das Reich der Träume zu driften. So lösten sich diese Gedanken allmählich in der dichten und heißen Luft auf ... morgen ist nur ein weiterer Tag ..."

 afghanistan.82.t:0 ""
 afghanistan.82.d:0 "Subbhas Chandra Bose verschwindet"
 afghanistan.82.a:0 "Nach seiner Entlassung aus dem Gefängnis vor nicht allzu langer Zeit wurde Subbhas Chandra Bose seitdem nicht mehr in der Öffentlichkeit gesehen. Nachdem die [ROOT.GetAdjektiv]-Polizei jedoch sein Haus aufsuchte, fanden sie es verlassen und von Boses persönlichen Gegenständen befreit vor. Könnte es sein, dass Boses Haus durchsucht wurde und er anschließend entführt wurde, oder handelt es sich um einen hinterlistigen Plan, mit dessen Hilfe er mit Hilfe der [GER.GetAdjektiv] entkommen könnte?"
 afghanistan.82.b:0 "Dieser Bastard!"
 afghanistan.82.c:0 ""

 afghanistan.83.t:0 "Nach seiner vor nicht allzu langer Zeit erfolgten Entlassung aus dem Gefängnis haben wir Informationen von [RAJ.GetNameDef] erhalten, dass Subbhas Chandra Bose entkommen ist und sich auf dem Weg nach [GER.GetNonIdeologyName] befindet. Zuletzt wurde er in Kalkutta in seinem Haus gesehen. Die Behörden [GetRajAdjektiv] haben uns darüber informiert, dass Subbhas Chandra Bose versuchen könnte, über [AFG.GetNonIdeologyName] zu fliehen, um nach [GER.GetNonIdeologyName] zu gelangen. Es heißt, er habe sich als Mitglied eines paschtunischen Stammes verkleidet und werde mit Hilfe der [GER.GetAdjektiv] Abwehr eskortiert. Sollen wir weiter nach Bose Ausschau halten oder die Situation ignorieren?"
 afghanistan.83.d:0 "Die Situation ignorieren."
 afghanistan.83.a:0 "Polizeipräsenz erhöhen, er muss verhaftet werden!"
 afghanistan.83.b:0 "Wir werden ihn rekrutieren."

 afghanistan.84.t:0 "Subbhas Chandra Bose kommt in [ROOT.GetNameDef] an"
 afghanistan.84.d:0 "Mit der Unterstützung unserer Geheimagenten und anderer Korrespondenten hat es Subbhas Chandra Bose, der [RAJ.GetAdjective]-Revolutionär, nach [ROOT.GetNameDef] geschafft. Er hat uns kontaktiert, um uns bei der Invasion von [RAJ.GetNameDef] zu helfen, da er [RAJ.GetNonIdeologyName] unter seinem Kommando befreien möchte. Die Frage ist, ob wir Bose vertrauen können. Schließlich könnte er auch ein [RAJ.GetAdjektiv] Spion sein, der versucht, unsere Reihen zu infiltrieren!"
 afghanistan.84.a:0 "Er ist hier willkommen."
 afghanistan.84.b:0 "Wir brauchen seine Hilfe nicht."

 afghanistan.85.t:0 "Subbhas Chandra Bose gefangen"
 afghanistan.85.d:0 "Bei seinem Versuch, durch [AFG.GetNonIdeologyName] aus [RAJ.GetNameDef] zu fliehen, wurden Subbhas Chandra Bose und seine Begleiter in der Nähe der Stadt Māzar-i-Sharīf gefangen genommen. Der [RAJ.GetAdjective] Revolutionär war auf dem Weg nach Europa, um den Feinden von [RAJ.GetNameDef] in ihrem Kampf zu helfen. Durch seine Gefangennahme stehen wir nun vor einer Entscheidung. Sollen wir Bose den [GetRajAdjektiv]-Behörden übergeben oder ihn seine Reise fortsetzen lassen und ihm und den Feinden von [RAJ.GetAdjektiv] helfen?"
 afghanistan.85.a:0 "Übergeben Sie ihn den [GetRajAdjektiv]-Behörden."

 afghanistan.86.t:0 ""
 afghanistan.86.d:0 "Subbhas Chandra Bose wird von [AFG.GetAdjektiv]-Behörden gefangen genommen"
 afghanistan.86.a:0 "Während seiner Reise durch [AFG.GetNonIdeologyName] wurde Subbhas Chandra Bose von den [AFG.GetAdjektiv]-Behörden gefangen genommen und festgenommen. Sie haben beschlossen, ihn so schnell wie möglich den [ROOT.GetAdjektiv]-Behörden zu übergeben. Wir müssen dankbar sein, dass die [AFG.GetAdjektiv]-Polizei wachsam blieb und ihre Aufgabe, Bose zu fangen, erfüllt hat."
 afghanistan.86.b:0 "Sperrt ihn sofort ein!"

 afghanistan.87.t:0 "Subbhas Chandra Bose trifft in [FROM.GetNameDef] ein"
 afghanistan.87.d:0 "In den letzten Monaten reiste Subbhas Chandra Bose mit dem Ziel, [FROM.GetNameDef] endlich zu erreichen und sie um Hilfe zu bitten. Leider hat er sein Ziel erreicht und arbeitet nun mit dem [FROM.GetAdjektiv] Militär und dem Oberkommando zusammen. Viele [RAJ.GetAdjektiv] Politiker haben ihre Unterstützung für Bose angekündigt, und es werden noch viele folgen. Dies hat die Nation stark destabilisiert, und viele fliehen und schließen sich Bose und seiner Tiger-Legion an!"
 afghanistan.87.a:0 "Na gut ..."

 afghanistan.88.t:0 ""
 afghanistan.88.d:0 "Die innere Krise"
 afghanistan.88.a:0 "Mit jedem Tag wird die Lage in [AFG.GetNonIdeologyName] immer besorgniserregender. Angesichts von Protesten im ganzen Land und öffentlicher Verurteilung der Regierung und des Königs scheint das Land auf einen gefährlichen Weg des Krieges und des Blutvergießens zu geraten. Viele Stammesangehörige, insbesondere Hazara, sind sehr unzufrieden mit den hohen Steuern, die ihnen auferlegt werden, und der zunehmenden Mobilisierung ihrer Mitmenschen. Es scheint, als sei dies tatsächlich der Tropfen gewesen, der das Fass zum Überlaufen brachte."

 afghanistan.89.t:0 "Ein Sturm zieht auf ..."
 afghanistan.89.d:0 ""
 afghanistan.89.a:0 "Bewaffnete Zusammenstöße in [1009.GetName]"

 afghanistan.90.t:0 "Der Wind legt sich..."
 afghanistan.90.d:0 ""
 afghanistan.90.a:0 "Plünderungen in Ghazni"

 afghanistan.91.t:0 "Der Regen beginnt ..."
 afghanistan.91.d:0 ""
 afghanistan.91.a:0 "Königs Amanullahs Rückkehr?"

 afghanistan.92.t:0 "Ein Lichtblick?"
 afghanistan.92.d:0 ""
 afghanistan.92.a:0 "Daoud Khans Loyalität?"
 afghanistan.92.b:0 "Die Unterstützung des Königs hat in allen politischen Aspekten von [AFG.GetNonIdeologyName] nachgelassen. Einst eine Hochburg der Bārakzai, hat sich das Militär politisiert und eine erhebliche Autonomie von der Zentralregierung und dem König erlangt. Daher stellt sich die Frage nach seiner Loyalität... Viele [AFG.GetAdjektiv] Militäroffiziere und Generäle haben Verbindungen zur lokalen Bevölkerung und zu Stammesangehörigen und lassen sich leicht bestechen oder überreden. Es kursieren Gerüchte, dass Muhammad Daoud Khan, der Gouverneur von Nangahar und General der Royal [AFG.GetAdjektiv] Army, einen Regierungsumsturz plane. Ist das Militär vertrauenswürdig?"

 afghanistan.93.t:0 ""
 afghanistan.93.d:0 "Bündnis mit [PAK.GetNonIdeologyName]?"
 afghanistan.93.a:0 "Nach der Gründung von [PAK.GetNameDef] vor nicht allzu langer Zeit und dem darauffolgenden Beginn des Indo-[PAK.GetAdjektiv]-Krieges hat sich [PAK.GetLeader] an [AFG.GetNameDef] gewandt, in der Hoffnung auf ein Militärbündnis zur Niederschlagung der [RAJ.GetAdjektiv]. Sollten wir uns der [PAK.GetAdjektiv]-Regierung anschließen oder nicht, das ist hier die Frage."
 afghanistan.93.b:0 "Vereint!"

 afghanistan.94.t:0 ""
 afghanistan.94.d:0 "[FROM.GetNameDefCap] fordert Unterwerfung"
 afghanistan.94.a:0 "Da [FROM.GetNameDef] unter [FROM.GetLeader] eine panislamistische Doktrin verfolgt und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat [FROM.GetNameDef] offiziell unsere Unterwerfung gefordert. Als Entschuldigung für ihre aggressiven Handlungen berufen sie sich auf unseren gemeinsamen Glauben und andere Gemeinsamkeiten. Ob wir ihre Forderungen annehmen oder ablehnen sollen, das ist die Frage."

 afghanistan.95.t:0 "Brüderliches Blut soll heute nicht vergossen werden."
 afghanistan.95.d:0 ""
 afghanistan.95.a:0 "[FROM.GetNameDefCap] Lehnt Unterwerfung ab"

 afghanistan.96.t:0 "Möge Allah uns zum Sieg führen!"
 afghanistan.96.d:0 ""
 afghanistan.96.a:0 "[FROM.GetNameDefCap] Akzeptiert Unterwerfung"

 afghanistan.97.t:0 "Unter Allah werden wir vereint sein!"
 afghanistan.97.d:0 ""
 afghanistan.97.a:0 "Vereinigung der islamischen Welt"
 afghanistan.97.b:0 "Unser Streben nach einer panislamistischen Doktrin unter [FROM.GetLeader], mit dem Versuch, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat dazu beigetragen, dass [AFG.GetNonIdeologyName] Anspruch auf alle Regionen erhebt, die größtenteils von Muslimen bewohnt werden und einst Teile des Reiches der Rashidun waren! Allah wird uns durch Schlachten und Kämpfe gegen die Imperialisten führen! Wir sind die wahren Erben Mohammeds!"
 afghanistan.97.c:0 "Allahu Akbar!"

 afghanistan.98.t:0 "Wiederherstellung von [From.GetNameDef]"
 afghanistan.98.d:0 "Mit der [From.GetOld Adjektiv] Eroberung dessen, was größtenteils die moderne islamische Welt ausmacht, und dem anhaltenden Streben der Regierung, alle Muslime zu vereinen, haben viele, darunter auch Regierungsbeamte, die offizielle Wiederherstellung eines längst vergessenen Reiches, [From.GetNameDef], gefordert. Daher hat [From.GetLeader], ein direkter Nachkomme des Propheten, beschlossen, dem Druck der Bevölkerung nachzugeben und die Wiederherstellung von [From.GetNameDef] und seine anschließende Inthronisierung als dessen Kalif offiziell zu verkünden. [From.GetOldAdjektiv]-Beamte haben nun bestätigt, dass der offizielle Name der Nation in "[From.GetNameDef]" geändert werden soll."
 afghanistan.98.a:0 "Al-Afghanis Traum ist wahr geworden."
 afghanistan.98.b:0 "Wird dies zu dauerhaftem Frieden in der Region führen?"

 afghanistan.99.t:0 ""
 afghanistan.99.d:0 "[FROM.GetNameDefCap] fordert Land"
 afghanistan.99.a:0 "Da [FROM.GetNameDef] unter [FROM.GetLeader] eine panislamistische Doktrin verfolgt und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat [FROM.GetNameDef] offiziell unseren militärischen Rückzug aus Syrien und die anschließende Übergabe Syriens an [FROM.GetNameDefCap] gefordert. Die Frage ist, ob wir ihre Forderungen annehmen oder ablehnen sollen."
 afghanistan.99.b:0 "Was für lächerliche Forderungen!"

 afghanistan.100.t:0 ""
 afghanistan.100.d:0 "[FROM.GetNameDefCap] lehnt Forderungen ab"
 afghanistan.100.a:0 "Nach unseren Forderungen nach der Übertragung muslimischer Ländereien von [FROM.GetNameDef] hat die [FROM.GetAdjektiv]-Regierung unsere Forderungen abgelehnt. Das ist eine absolute Schande, wir müssen sofort handeln und diese Ländereien selbst übernehmen!"

 afghanistan.101.t:0 "Das bedeutet Krieg!"
 afghanistan.101.d:0 ""
 afghanistan.101.a:0 "[FROM.GetNameDefCap] Gibt Forderungen auf"
 afghanistan.101.b:0 "Nach unseren Forderungen nach der Übertragung muslimischen Landes von [FROM.GetNameDef] hat die [FROM.GetAdjektiv]-Regierung unsere Forderungen akzeptiert, möglicherweise aufgrund unseres überlegenen militärischen oder politischen Drucks und Einflusses, den wir auf ihre Regierung ausgeübt haben. Dies ist ein weiterer Sieg für Muslime auf der ganzen Welt."

 afghanistan.102.t:0 ""
 afghanistan.102.d:0 "[FROM.GetNameDefCap] Fordert Land"
 afghanistan.102.a:0 "Mit [FROM.GetNameDef] verfolgt eine panislamistische Doktrin unter [FROM.GetLeader] und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen. [FROM.GetNameDef] hat offiziell unseren militärischen Rückzug aus Syrien und die anschließende Übergabe Syriens an [FROM.GetNameDefCap] gefordert. Ob wir ihre Forderungen annehmen oder ablehnen, das ist die Frage."

 afghanistan.103.t:0 "Wir müssen nachgeben ..."
 afghanistan.103.d:0 ""
 afghanistan.103.a:0 "[FROM.GetNameDefCap] gibt Forderungen auf"

 afghanistan.104.t:0 "Unter Allah werden wir vereint sein!"
 afghanistan.104.d:0 ""
 afghanistan.104.a:0 "[FROM.GetNameDefCap] akzeptiert Frieden"

 afghanistan.105.t:0 "Gesegnet seien die Friedensstifter!"
 afghanistan.105.a:0 ""
 afghanistan.105.b:0 "[FROM.GetNameDefCap] lehnt Frieden ab"
 afghanistan.105.d:0 "Nachdem unsere Forderungen nach einem vollständigen Waffenstillstand und einem langsamen Übergang in einen Friedenszustand zwischen [FROM.GetNameDefCap] und [ROOT.GetNameDefCap] die [FROM.GetAdjective]-Regierung erreicht hatten, beschloss die [FROM.GetAdjective]-Regierung, unsere Forderungen abzulehnen, möglicherweise aufgrund ihrer Überzeugung, dass sie über ein überlegenes Militär im Vergleich zu unserem verfügen, und sie sahen keinen Grund, Frieden zu schließen."

 afghanistan.106.t:0 ""
 afghanistan.106.a:0 "Der zweite [AFG.GetAdjektiv] Bürgerkrieg"
 afghanistan.106.d:0 "Es sind immer die [AFG.GetAdjektiv]s, nicht wahr?"

 afghanistan.107.t:0 "In der vergangenen Woche haben sich Militärführer in [AFG.GetNonIdeologyName] gegen den König und die Regentschaft ausgesprochen, die hauptsächlich aus seinen beiden Onkeln, Muhammad Hashim Khan und Shah Mahmud Khan, besteht. In ihren Augen ist die Regierung von [AFG.GetNonIdeologyName] sowohl politisch als auch wirtschaftlich zu rückständig geworden, ohne dass für die Zukunft eine Modernisierung geplant ist. Vor diesem Hintergrund haben sie beschlossen, eine umfassende Revolution zu starten, um das Regime zu stürzen und eine sozialistische Republik zu gründen. Viele spekulieren, dass die [SOV.GetAdjective]-Streitkräfte an der Auslösung des Konflikts beteiligt waren, es wurden jedoch keine Beweise gefunden, die diesen Verdacht bestätigen."
 afghanistan.107.a:0 ""
 afghanistan.107.d:0 "[SOV.GetAdjektiv] Unterstützung trifft ein"

 afghanistan.108.t:0 "Während [AFG.GetNonIdeologyName] in Flammen aufgeht und die ganze Nation mobilisiert wird, um für beide Seiten zu kämpfen und zu sterben, haben die [SOV.GetAdjektiv] wie vereinbart beschlossen, uns die sehr geschätzte und nützliche Unterstützung zukommen zu lassen, die das Blatt im Zweiten Afghanischen Bürgerkrieg wenden könnte! Dazu gehören viele [SOV.GetAdjektiv]-Männer, die sich freiwillig gemeldet und sich unserer Sache angeschlossen haben, sowie militärische Ausrüstung, um die Loyalisten abzuwehren!"
 afghanistan.108.a:0 ""
 afghanistan.108.d:0 "Nisar Muhammad Yousafzai schließt sich der Sache an"

 afghanistan.109.t:0 "Während [AFG.GetNonIdeologyName] in Flammen aufgeht und die ganze Nation mobilisiert wird, um für eine der beiden Seiten zu kämpfen und zu sterben, hat Nisar Muhammad Yousafzai, ein Afghane, der im Zweiten Anglo-Afghanischen Krieg gekämpft hat und sein Leben dem Kommunismus und der Entwicklung Tadschikistans gewidmet hat, beschlossen, sich unserer Sache anzuschließen und uns im Kampf gegen die Loyalisten zu helfen!"
 afghanistan.109.a:0 ""
 afghanistan.109.d:0 "Gründung der Nationalen Front!"

 afghanistan.200.t:0 "Nach der Legalisierung der Gewerkschaften hat sich die Studentenvereinigung der Universität Kabul öffentlich für die [AFG.GetCommunistParty] ausgesprochen. Dies hat die [AFG.GetCommunistParty] in der Tat gestärkt, was Abdulrahman Mahmudi, den Anführer der "Khalqisten", dazu veranlasst hat, eine Koalition mit der [AFG.GetDemocraticParty] einzugehen, die den Namen "Nationale Front" trägt. Sie streben eine Demokratisierung der Nation an und wollen den Minderheiten innerhalb von [AFG.GetNonIdeologyName], wie den Tadschiken und Usbeken, Rechte einräumen, um [AFG.GetNonIdeologyName] wirklich zu vereinen."
 afghanistan.200.a:0 ""
 afghanistan.200.d:0 "Krise um den Durand!"

 ######## FOCUSES ######## "Im vergangenen Jahr kam es zu wachsenden Spannungen zwischen der muslimischen, Urdu sprechenden Bevölkerung im Nordwesten Indiens und den hinduistischen, Hindi sprechenden Regionen Indiens. Diese Spannungen sollen mit der Ausrufung der Unabhängigkeit und der Gründung eines neuen Staates im Süden von [AFG.GetNonIdeologyName] namens Pakistan eskaliert sein. Die [RAJ.GetAdjektiv]-Regierung hat die Unabhängigkeitserklärung als illegal bezeichnet, und auf dem indischen Subkontinent ist ein regelrechter Krieg ausgebrochen. Viele Menschen wurden durch den Krieg vertrieben, wobei viele Hindus die Grenze nach Indien überquerten und die Muslime, die auf der hinduistischen Seite leben, genau dasselbe taten. Der besondere Grund, warum dieser Konflikt für die Zukunft von [AFG.GetNonIde ologyName] ist, liegt an den mehrheitlich von Paschtunen bewohnten Gebieten, die [442.GetName] und in gewissem Umfang [445.GetName] sind und einen großen Teil des neuen Staates Pakistan ausmachen. Dieser Konflikt könnte sich als Chance für [AFG.GetNonIdeologyName] erweisen, die Paschtunen endlich in einem Staat zu vereinen und den dringend benötigten Zugang zum Meer zu erlangen, was wiederum den internationalen Handel erheblich erleichtern und der [AFG.GetAdjective]-Wirtschaft zugutekommen würde ... Die Frage ist, wo [AFG.GetNonIdeologyName] in dieser für die Region chaotischen Zeit stehen sollte."

 AFG_first_loya_jirga:0 "Nachwirkungen des [GetYear] Bürgerkriegs"
 AFG_first_loya_jirga_desc:0 "Dies ist besorgniserregend ..."
 AFG_handle_the_king:0 "Nach dem Ende des [GetYear] Bürgerkriegs brechen im ganzen Land Feierlichkeiten aus, die den triumphalen Sieg der Roten Armee über die Royalisten feiern. Doch verfrühte Freude könnte sich als gefährlich erweisen, denn dieser Sieg markiert nicht das Ende, sondern den Beginn eines neuen Kampfes, in dem die Nation gegen ihr eigenes Volk antritt. Es gibt bereits Berichte über Stammeskräfte, die in ganz [AFG.GetNonIdeologyName] Widerstandsnester organisieren. Nur die Zeit wird zeigen, welches Schicksal die Zukunft unserer Nation bereithält ..."
 AFG_handle_the_king_desc:0 ""
 AFG_power_to_the_king:0 ""
 AFG_power_to_the_king_desc:0 ""

 ######## ECONOMY FOCUSES ######## "Die Loya Jirga, was aus dem Paschtunischen übersetzt "Der Große Rat" bedeutet, ist eine alte und primitive Methode zur Lösung von Problemen in [AFG.GetNonIdeologyName]. Loya Jirgas werden in der Regel von den Staatsoberhäuptern einberufen, um Unterstützung für Reformen oder Krönungen zu erhalten. Anwesend sind verschiedene Stammesführer aus ganz [AFG.GetNonIdeologyName], die jeweils ihren eigenen Stamm vertreten und um ihre eigenen Interessen wetteifern ..."

 AFG_begin_westernization:0 "Mit dem König stimmt etwas nicht ... Man spürt, dass sich etwas verändert hat ... Er interessiert sich nicht mehr für die Politik im Königreich ... Tatsächlich hat er selbst viele der Reformen vorangetrieben, die während der Loya Jirga vorgeschlagen wurden ... Vielleicht hat er Ansichten, die zu modern, zu ehrgeizig und zu destabilisierend für dieses arme Land sind ... Es muss etwas getan werden ..."
 AFG_begin_westernization_desc:0 "Macht dem König"
 AFG_start_the_second_seven_year_plan:0 "Ein weiterer Tag, ein weiterer Monat, ein weiteres Jahr vergeht, und die Menschen in [AFG.GetNonIdeologyName] haben den Eindruck, dass sich nichts ändert und auch nichts ändern wird, solange die Menschen selbst nicht wollen, dass sich etwas ändert. Veränderung ist die Mutter allen Übels und allen Guten, und wenn sich nichts ändert, wird niemand verletzt, oder? Und so vergeht die Zeit, und der Status quo bleibt erhalten ..."
 AFG_start_the_second_seven_year_plan_desc:0 ""
 AFG_import_electronics:0 ""
 AFG_import_electronics_desc:0 ""
 AFG_rural_schools:0 "Fortsetzung des ersten Siebenjahresplans"
 AFG_rural_schools_desc:0 "Wenn [AFG.GetNonIdeologyName] seine Landwirtschaft nicht modernisiert und seine Industrie nicht entwickelt, bleibt seine Wirtschaft von anderen Ländern abhängig, was wiederum die Unabhängigkeit [AFG.GetNonIdeologyName] gefährden könnte. Die Industrialisierung ist für das Überleben unseres Staates und die Verbesserung unserer Wirtschaft von entscheidender Bedeutung!"
 AFG_develop_hydroelectric_power:0 "Beginn des zweiten Siebenjahresplans"
 AFG_develop_hydroelectric_power_desc:0 ""
 AFG_aquire_foreign_machinery:0 "Import von Elektronik"
 AFG_aquire_foreign_machinery_desc:0 "[AFG.GetNameDefCap] muss viel Elektronik aus anderen Ländern wie [GER.GetName] oder [SOV.GetName] importieren, wenn wir unsere öffentlichen Arbeiten und die Verwaltung verbessern und von der uns zur Verfügung gestellten Technologie lernen wollen."
 AFG_improve_national_infra:0 "Verbesserung der Bildung auf dem Land"
 AFG_improve_national_infra_desc:0 "Die ländlichen Regionen, die von Kabul und der Zentralverwaltung von [AFG.GetNameDefCap] abgeschnitten sind, tragen am meisten zum Analphabetismusproblem bei, mit dem [AFG.GetNameDefCap] derzeit konfrontiert ist. Wir müssen unsere Bildungsmethoden auf dem Land verbessern."
 AFG_bolster_the_textile_industry:0 "Entwicklung der Wasserkraft"
 AFG_bolster_the_textile_industry_desc:0 ""
 AFG_monopolize_the_karakul_trade:0 "Anschaffung ausländischer Maschinen"
 AFG_monopolize_the_karakul_trade_desc:0 ""
 AFG_railroad_development:0 "Verbesserung der nationalen Infrastruktur"
 AFG_railroad_development_desc:0 ""
 AFG_expand_university:0 "Stärkung der Textilindustrie"
 AFG_expand_university_desc:0 "[AFG.GetNonIdeologyName] hatte vor dem Bürgerkrieg von 1929 und dem Sturz von Amanullah Khan eine bedeutende Textilindustrie. Die Wiederbelebung und Stärkung der Textilindustrie könnte sich als entscheidendes Bindeglied für den Erfolg bei der Verbesserung der [AFG.GetAdjective]-Wirtschaft erweisen!"
 AFG_expand_the_directorate_of_mines:0 "Monopolisierung des Karakulhandels"
 AFG_expand_the_directorate_of_mines_desc:0 ""
 AFG_explore_helmand_uranium_deposits:0 "Die Nation verbinden"
 AFG_explore_helmand_uranium_deposits_desc:0 "[AFG.GetNameDefCap] ist eine Nation ohne Verbindung, ohne Eisenbahn und ohne Wissen darüber. Wir müssen an der Verbesserung des Eisenbahnnetzes arbeiten, wenn wir die Wirtschaft effizienter gestalten und den Warenfluss aufrechterhalten wollen."
 AFG_rejuvenate_the_gold_mines:0 "Die Kabuler Universität erweitern"
 AFG_rejuvenate_the_gold_mines_desc:0 "Die Universität Kabul [AFG.GetNonIdeologyName] wurde 1932 eröffnet und hat viele Menschen gesehen, die sie besucht haben. In diesem Land besteht eine hohe Nachfrage nach Bildung, und wir müssen sie decken. Deshalb ist die Erweiterung der Universität Kabul ein guter Anfang."
 AFG_intensify_copper_mining:0 "Erweiterung der Bergbaudirektion"
 AFG_intensify_copper_mining_desc:0 "[AFG.GetNameDefCap] ist ein Land, das sehr reich an Ressourcen wie Stahl, Öl und Chrom ist. Wir können dies zu unserem Vorteil nutzen und ausländische Unternehmen einladen, in diese Länder zu kommen und unsere Ressourcen abzubauen, um so unsere Wirtschaft zu verbessern."
 AFG_womens_education:0 "Erkundung der Uranvorkommen in Helmand"
 AFG_womens_education_desc:0 ""
 AFG_afghanistan_bank:0 "Wiederbelebung der Goldminen"
 AFG_afghanistan_bank_desc:0 ""
 AFG_free_trade_focus:0 "Intensivierung des Kupferabbaus"
 AFG_free_trade_focus_desc:0 ""
 AFG_coffee_plantations:0 "Bildung für Frauen"
 AFG_coffee_plantations_desc:0 "Derzeit nehmen alle afghanischen Schulen im Land nur Männer auf, wobei etwa 80–90 % der Schulen reine Jungenschulen sind. Wir müssen auch die Frauen von [AFG.GetNonIdeologyName] ausbilden."
 AFG_begin_rearmament:0 "Öffnung der Bank von [AFG.GetNonIdeologyName]"
 AFG_begin_rearmament_desc:0 "Der Bankensektor von [AFG.GetNameDefCap] hat in den vergangenen Jahren keine großen Verbesserungen erfahren. Mit der Eröffnung der "Da [AFG.GetNonIdeologyName] Bank", einer neuen Zentralbank des Landes, werden wir in der Lage sein, unseren Bankensektor und unsere Wirtschaft zu verbessern."
 AFG_establish_ammunition_factories:0 "Öffnung der Märkte"
 AFG_establish_ammunition_factories_desc:0 "[AFG.GetNameDefCap] war über weite Teile seiner Geschichte ein sehr isolierter Staat, und es ist an der Zeit, dies zu ändern. [AFG.GetNonIdeologyName] muss seine Märkte für die Welt öffnen, wenn wir mehr Investoren und Menschen anziehen wollen."
 AFG_kabul_arsenal:0 "Kaffeeplantagen"
 AFG_kabul_arsenal_desc:0 "[AFG.GetNonIdeologyName] ist ein perfekter Ort für Kaffeeplantagen und wir brauchen viele davon. Wir müssen unser Land optimal nutzen, wenn wir unsere Wirtschaft verbessern wollen."
 AFG_the_nomad_population:0 "Wiederaufrüstung beginnen"
 AFG_the_nomad_population_desc:0 ""
 AFG_afghan_miracle:0 "Munitionsfabriken sanieren"
 AFG_afghan_miracle_desc:0 ""

 ######## MILITARY FOCUSES ######## "[AFG.GetNonIdeologyName] fehlt es an qualifiziertem Personal und den Ressourcen, die für die Herstellung militärischer Ausrüstung benötigt werden. Wir müssen jedoch daran arbeiten, unsere militärischen Produktionskapazitäten zu verbessern, da dies uns eine größere Autonomie von ausländischen Mächten ermöglichen würde, die als einzige Waffenquelle für [AFG.GetNonIdeologyName] fungiert haben."

 AFG_afghan_royal_army:0 "In [AFG.GetNonIdeologyName] gibt es viele Menschen, die den modernen Lebensstil ablehnen. Diese Nomaden machen einen großen Teil der Bevölkerung aus, nehmen jedoch nicht an der Wirtschaft von [AFG.GetNonIdeologyName] teil. Daher wäre es klug, die große Anzahl von Nomaden endlich in die Wirtschaft einzubeziehen und sie so zu stärken."
 AFG_afghan_royal_army_desc:0 "Das [AFG.GetAdjective] Wunder"
 AFG_afghan_royal_army_army:0 "Nach vielen Jahren, in denen wir langsam in unsere Wirtschaft investiert und sie durch diese schweren Zeiten geführt haben, ist [AFG.GetNameDefCap] stärker denn je daraus hervorgegangen und hat auch etwas vorzuweisen!"
 AFG_afghan_royal_army_army_desc:0 ""
 AFG_afghan_army_focus:0 ""
 AFG_afghan_army_focus_desc:0 ""
 AFG_army_modernization:0 "[GetAfghanArmyFocusName]"
 AFG_army_modernization_desc:0 "[GetAfghanArmyFocusDesc]"
 AFG_army_status_quo:0 "Royal [AFG.GetAdjektiv] Army"
 AFG_army_status_quo_desc:0 "Die Royal [AFG.GetAdjektiv] Army ist so alt wie [AFG.GetNameDef] selbst und wurde bereits im 18. Jahrhundert gegründet. Die Royal Army of [AFG.GetNonIdeologyName] hat in ihrer Vergangenheit viele Herausforderungen gemeistert. Sie hat viele Kriege geführt und gewonnen, wie den Dritten Anglo-Afghanischen Krieg, in dem [AFG.GetNonIdeologyName] seine Unabhängigkeit erlangte und die [ENG.GetAdjektiv] vertrieb!"
 AFG_form_the_paratrooper_brigade:0 "[AFG.GetAdjektiv] Streitkräfte"
 AFG_form_the_paratrooper_brigade_desc:0 "Die [AFG.GetAdjektiv] Streitkräfte sind so alt wie [AFG.GetNameDef] selbst und wurden bereits im 18. Jahrhundert gegründet. Die [AFG.GetAdjective] Streitkräfte haben in ihrer Vergangenheit viele Herausforderungen gemeistert. Sie haben viele Kriege geführt und gewonnen, wie den Dritten Anglo-Afghanischen Krieg, in dem [AFG.GetNonIdeologyName] seine Unabhängigkeit erlangte und die [ENG.GetAdjective] vertrieb!"
 AFG_legacy_of_cavalrymen:0 "Weiter Modernisierung der Armee"
 AFG_legacy_of_cavalrymen_desc:0 "Die [GetAfghanArmyFocusName] verfügt über veraltete Ausrüstung, es mangelt an ausgebildeten Soldaten und insgesamt befindet sie sich in einem desolaten Zustand. Eine Militärreform ist erforderlich, um die [GetAfghanArmyFocusName] zu einer modernen Armee zu entwickeln, die selbst den technologisch fortschrittlichsten Armeen der Welt gewachsen ist. Die Zeit für eine Modernisierung ist jetzt!"
 AFG_arms_purchase:0 "Aufrechterhaltung des Status quo"
 AFG_arms_purchase_desc:0 "Harte und schnelle Veränderungen in [AFG.GetNameDefCap] haben nachweislich viele schreckliche Folgen gehabt, bei denen viele Menschen gestorben sind und das Land gelitten hat. Wir können es uns nicht leisten, aufgrund solcher Veränderungen einen weiteren Bürgerkrieg zu riskieren. Der Status quo muss beibehalten werden!"
 AFG_tank_purchase:0 "Soldaten des Himmels"
 AFG_tank_purchase_desc:0 "Da wir durch den Kauf von Flugzeugen von den [ENG.GetAdjektiv] vor nicht allzu langer Zeit bereits über einige Kenntnisse im Bereich der Luftfahrt verfügen, sollten wir eine spezielle Fallschirmjägereinheit einrichten, um unsere militärischen Fähigkeiten zu verbessern!"
 AFG_develop_domestic_designs:0 "Vermächtnis der Kavalleristen"
 AFG_develop_domestic_designs_desc:0 "Das Vermächtnis der Kavallerie [AFG.GetNonIdeologyName] und der Einsatz von Pferden im Militär reichen viele tausend Jahre zurück. Unsere Vorfahren waren großartige Kavalleristen, wir werden in ihre Fußstapfen treten!"
 AFG_motorized_research:0 "Ausrüstung kaufen"
 AFG_motorized_research_desc:0 "[AFG.GetNameDefCap] hat die Möglichkeit, [ENG.GetAdjective] oder [SOV.GetAdjective] Ausrüstung zu kaufen, um seine Armee zu versorgen, aber wir müssen vorsichtig sein, bei wem wir kaufen, da es gefährlich sein könnte, uns an einen einzigen Lieferanten zu binden!"
 AFG_improve_our_logistics:0 "Ausländische Panzer importieren"
 AFG_improve_our_logistics_desc:0 "Der Import von [SOV.GetAdjektiv]-Panzern wäre für die Nation von großem Nutzen und wir könnten die Panzer untersuchen und sie auch in unseren eigenen Fabriken produzieren!"
 AFG_prussians_orient:0 "Entwicklung einheimischer Designs"
 AFG_prussians_orient_desc:0 "[AFG.GetNameDefCap] war bisher nicht in der Lage, eigene Gewehre und militärische Ausrüstung herzustellen, aber das hat sich geändert. Wir müssen lokale Hersteller fördern und mit der Produktion eigener Waffen beginnen, um unser Land von ausländischem militärischem Einfluss unabhängig zu machen!"
 AFG_first_afghani_navy:0 "Motorisierung des Militärs"
 AFG_first_afghani_navy_desc:0 "[AFG.GetNameDefCap] verlässt sich hauptsächlich auf seine Kavallerie für schnelle Angriffe und Vorstöße, aber auch für die Versorgung der Armee. Durch die Motorisierung der Armee können wir eine bessere Versorgungsabdeckung und schnellere Vorstöße und Angriffe erreichen, um den Feind unvorbereitet zu erwischen!"
 AFG_build_convoys:0 "Verbesserung unserer Logistik"
 AFG_build_convoys_desc:0 ""
 AFG_submarines:0 "Die Preußen des Orients"
 AFG_submarines_desc:0 "[AFG.GetNameDefCap] haben ihr Militär stark verbessert und sich sogar den Titel "Preußen des Orients" verdient, der ihnen von vielen Ausländern verliehen wurde. [AFG.GetNameDefCap] haben eine glänzende militärische Zukunft vor sich!"
 AFG_destroyers:0 "Erste [AFG.GetAdjektiv] Marine"
 AFG_destroyers_desc:0 "[AFG.GetNameDefCap] hat Zugang zum Meer erlangt, jetzt ist es an der Zeit, es zu meistern und eine Seemacht zu werden. Dazu müssen wir uns auf den Bau unserer Marinehäfen und Werften entlang der Küste konzentrieren!"
 AFG_cruisers:0 "Handelsflotte erweitern"
 AFG_cruisers_desc:0 "Jetzt, da wir eine Küste haben, können wir uns auf den Seehandel mit ausländischen Mächten konzentrieren, was uns viel Geld sparen wird. Ohne guten Schutz könnten jedoch viele Menschen auf diesen Handelsschiffen ihr Leben verlieren."
 AFG_battleships:0 "Entwicklung einer U-Boot-Flotte"
 AFG_battleships_desc:0 "Eine U-Boot-Flotte, die für Handelsabhörungen und viele andere verdeckte Missionen eingesetzt werden kann, ist das, was [AFG.GetNameDefCap] braucht."
 AFG_naval_building:0 "Entwicklung einer Zerstörerflotte"
 AFG_naval_building_desc:0 "Eine Flotte von Zerstörern, die für das Auslegen von Minen und Nahkämpfe eingesetzt werden kann, ist das, was [AFG.GetNameDefCap] braucht."
 AFG_under_the_radar:0 "Kreuzer entwickeln"
 AFG_under_the_radar_desc:0 "Eine Flotte leichter Kreuzer, die zum Schutz unserer anderen Marinegüter und für Nahkämpfe eingesetzt werden können, ist das, was [AFG.GetNameDefCap] braucht."
 AFG_protect_our_convoys:0 "Schlachtschiffe entwickeln"
 AFG_protect_our_convoys_desc:0 "Eine Flotte von Schlachtschiffen, die zum Schutz unserer anderen Marinegüter und für Langstreckenkämpfe eingesetzt werden können, ist das, was [AFG.GetNameDefCap] braucht."
 AFG_naval_defense_fund:0 "Förderung des zivilen Schiffbaus"
 AFG_naval_defense_fund_desc:0 "Durch die Förderung des Schiffbaus können wir gute lokale Hersteller finden, die bereit sind, der Regierung von [AFG.GetNameDefCap] zu helfen."
 AFG_naval_bombers:0 "Unter dem Radar kreuzen"
 AFG_naval_bombers_desc:0 "Um eine effiziente U-Boot-Einsatztruppe zu entwickeln, müssen wir an der Verbesserung und Ausbildung unserer Marinebesatzungen arbeiten. Auf diese Weise können wir hoffentlich sicher unter dem Radar feindlicher Schiffe kreuzen und sie von innen heraus zerstören!"
 AFG_royal_air_force:0 "Untersuchen Sie die U-Boot-Bekämpfung"
 AFG_royal_air_force_desc:0 "Wir dürfen uns nicht darauf konzentrieren, feindliche Schiffe zu zerstören, sondern müssen vielmehr unsere eigenen Konvois und Handelsschiffe schützen. Dies wird unserer Wirtschaft helfen und den Seehandel fördern!"
 AFG_royal_air_force_royal:0 "Richten Sie den Marineverteidigungsfonds ein"
 AFG_royal_air_force_royal_desc:0 "Wir sollten das Budget neu ausbalancieren und einen Marineverteidigungsfonds einrichten, aus dem wir unsere Schiffbau-Eskapaden finanzieren. Wir müssen erhebliche Maßnahmen ergreifen, um unsere Marinepräsenz und -stärke zu erhalten oder sogar zu erhöhen!"
 AFG_air_force_focus:0 "Verbesserung der Koordination von Marine und Luftwaffe"
 AFG_air_force_focus_desc:0 "Um in Seeschlachten einen Vorteil zu erzielen, müssen wir die Lufthoheit über dem Schlachtfeld aufrechterhalten. Daher müssen wir daran arbeiten, unsere eigene Luftwaffe aus Marinebombern und -jägern aufzubauen!"
 AFG_train_our_personnel_abroad:0 "[GetAfghanAirFocusName]"
 AFG_train_our_personnel_abroad_desc:0 "[GetAfghanAirFocusDesc]"
 AFG_import_planes:0 "Königliche [AFG.GetAdjective] Luftwaffe"
 AFG_import_planes_desc:0 "Die Royal [AFG.GetAdjective] Air Force wurde 1921 gegründet und hat in den letzten fünfzehn Jahren eine kleine Anzahl von Flugzeugen sowie ausländische Techniker und Bediener angesammelt. Leider wurde ein großer Teil der [AFG.GetAdjective] Flugzeuge aufgrund der jüngsten Kriege wie dem [AFG.GetAdjective] Bürgerkrieg, der 1929 stattfand, abgeschossen oder verschrottet."
 AFG_invite_foreign_instructors:0 "Die [AFG.GetAdjektiv] Luftwaffe"
 AFG_invite_foreign_instructors_desc:0 "Die [AFG.GetAdjective] Luftwaffe wurde 1921 gegründet und hat in den letzten fünfzehn Jahren eine kleine Anzahl von Flugzeugen sowie ausländische Techniker und Bediener angesammelt. Leider wurde ein großer Teil der [AFG.GetAdjective] Flugzeuge aufgrund der jüngsten Kriege wie dem [AFG.GetAdjective] Bürgerkrieg, der 1929 stattfand, abgeschossen oder verschrottet."
 AFG_import_italian_fighters:0 "Unser Personal im Ausland schulen"
 AFG_import_italian_fighters_desc:0 ""
 AFG_import_british_fighters:0 "Kauf ausländischer Flugzeuge"
 AFG_import_british_fighters_desc:0 ""
 AFG_kabul_air_college:0 "Einladung ausländischer Ausbilder"
 AFG_kabul_air_college_desc:0 ""
 AFG_purhcase_czech_weaponry:0 "[ITA.GetAdjective]-Made-Jäger"
 AFG_purhcase_czech_weaponry_desc:0 "Während eines Wettbewerbs mit der [ENG.GetNameDefCap] hat uns [ITA.GetNameDefCap] ein Paket von [ITA.GetAdjective] CR.32-Jägern und mehreren erfahrenen Bedienern und Technikern angeboten, um seine Märkte in [AFG.GetNameDefCap] zu erweitern"
 AFG_redesign_military_curriculum:0 "[ENG.GetAdjective]-Made-Bomber"
 AFG_redesign_military_curriculum_desc:0 "Während eines Wettbewerbs mit der [ENG.GetNameDefCap] hat uns die [ENG.GetNameDefCap] ein Paket von [ENG.GetAdjective] Fairey Gordon-Leichtbombern und mehreren qualifizierten Bedienern und Technikern angeboten, um ihre Märkte in [AFG.GetNameDefCap] zu erweitern. [AFG.GetNameDefCap] hat in der Vergangenheit von der [ENG.GetAdjective] gekauft, sie haben sich als sehr gute Geschäftspartner erwiesen."
 AFG_develop_the_tank_industry:0 "Eröffnung der Kabul Aviation Academy"
 AFG_develop_the_tank_industry_desc:0 "[AFG.GetNameDefCap] muss seine eigenen Techniker ausbilden, um nicht auf ausländische angewiesen zu sein, die jederzeit beeinflusst und zurückgerufen werden können. Daher muss eine Luftfahrtakademie in Kabul eröffnet werden!"
 AFG_bolster_national_arms_manufacturing:0 "Kauf von [CZE.GetAdjektiv] Waffen"
 AFG_bolster_national_arms_manufacturing_desc:0 ""
 AFG_finance_army_mechanization:0 "Neugestaltung des militärischen Lehrplans"
 AFG_finance_army_mechanization_desc:0 ""
 AFG_introduce_new_uniforms:0 "Entwicklung der Panzerindustrie"
 AFG_introduce_new_uniforms_desc:0 ""
 AFG_know_thy_enemy:0 "Unterstützung der nationalen Waffenherstellung"
 AFG_know_thy_enemy_desc:0 ""
 AFG_modernize_military_hospitals:0 "Finanzierung der Mechanisierung der Armee"
 AFG_modernize_military_hospitals_desc:0 ""
 AFG_study_the_blitzkrieg:0 "Einführung neuer Uniformen"
 AFG_study_the_blitzkrieg_desc:0 ""
 AFG_victory_through_firepower:0 "Kenne deinen Feind"
 AFG_victory_through_firepower_desc:0 ""
 AFG_expand_military_airports:0 "Modernisierung von Militärkrankenhäusern"
 AFG_expand_military_airports_desc:0 ""
 AFG_the_242nd_parachute_battalion:0 "Studium der Manöverkriegsführung"
 AFG_the_242nd_parachute_battalion_desc:0 ""

 ######## COMMUNIST FOCUSES ######## ""

 AFG_form_weekh_zalmian:0 ""
 AFG_form_weekh_zalmian_desc:0 "Das 242. Fallschirmjägerbataillon"
 AFG_approach_the_soviets:0 ""
 AFG_approach_the_soviets_desc:0 ""
 AFG_form_worker_communes:0 ""
 AFG_form_worker_communes_desc:0 ""
 AFG_utilize_the_military:0 "The Weekh Zalmiān"
 AFG_utilize_the_military_desc:0 "The Weekh Zalmiān ist eine sozialistische politische Bewegung in [AFG.GetNonIdeologyName], die von Mawlana Qiamuddin Khadim, einem bekannten Dichter, und Dr. Abdulrahman Mahmudi, einem Arzt, angeführt wird. Die Bewegung fordert eine umfassende Modernisierung und mehr Rechte für Frauen und ist in eine pro-[SOV.GetAdjektiv]- und eine anti-[SOV.GetAdjektiv]-Fraktion, die Khalq und die Parcham, gespalten."
 AFG_depose_the_king:0 "Annäherung an die [SOV.GetAdjektiv]s"
 AFG_depose_the_king_desc:0 "Die Annäherung an die [SOV.GetAdjektiv]s ist entscheidend für einen Putsch gegen den König. Nur mit Gewalt und ausländischer Unterstützung können wir die derzeitige Regierung stürzen und durch unsere eigene ersetzen."
 AFG_national_front:0 "Gewerkschaften gründen"
 AFG_national_front_desc:0 "Die Menschen in [AFG.GetAdjektiv] müssen über ihre sozialen und Arbeitsrechte aufgeklärt werden. Durch die Gründung von Gewerkschaften und Arbeitergenossenschaften werden wir den Menschen die Augen für die völlige Missachtung und Vernachlässigung der Arbeiter in [AFG.GetNonIdeologyName] durch die Regierung öffnen."
 AFG_soviet_expedition:0 "Das Militär einsetzen"
 AFG_soviet_expedition_desc:0 ""
 AFG_purge_the_bourgeoisie:0 "Nieder mit dem König!"
 AFG_purge_the_bourgeoisie_desc:0 "Endlich ist der Tag gekommen, an dem das von der Bourgeoisie eingesetzte autoritäre Regime zu Ende geht und die Flammen der Revolution in ganz [AFG.GetNonIdeologyName] lodern und ein Revolutionskomitee unter der Leitung von Mawlana Qiamuddin Khadim eingesetzt wird!"
 AFG_form_khad:0 "Die Nationale Front"
 AFG_form_khad_desc:0 "Die Nationale Befreiungsfront, kurz NLB, ist eine politische Koalition, die viele ihrer Ansichten mit der Parcham-Fraktion unter der Führung von Mawlana Qiamuddin Khadim und Ghulam Muhammad Ghubar von der Demokratischen Volkspartei von [AFG.GetNonIdeologyName] teilt."
 AFG_arrest_qiamuddin:0 "Einladung an [SOV.GetAdjektiv] Gesandte"
 AFG_arrest_qiamuddin_desc:0 "Die [SOV.GetAdjektiv] sind sehr fasziniert von dem jüngsten kommunistischen Putsch in [AFG.GetNonIdeologyName], bei dem die Bourgeoisie abgesetzt und stattdessen das Proletariat an die Macht gebracht wurde. Sie haben militärische, wirtschaftliche und politische Unterstützung angeboten. Vielleicht sollten wir ihr Angebot annehmen."
 AFG_socialist_education:0 "Säuberung der Bourgeoisie"
 AFG_socialist_education_desc:0 "Nach dem Putsch in [AFG.GetNonIdeologyName] ist ein großer Teil der feigen Bourgeoisie aus Angst vor dem neuen Regime aus dem Land geflohen und hat in [PAK.GetNonIdeologyName] und im Iran Zuflucht gesucht, während sie versucht, ihren Reichtum zu bewahren. Wir müssen uns jedoch mit dem immer noch bedeutenden Teil befassen, der beschlossen hat, im Land zu bleiben."
 AFG_begin_colectivization:0 "Einrichtung des KhAD"
 AFG_begin_colectivization_desc:0 "Jedes kommunistische Regime braucht eine Möglichkeit, die Menschen in Schach zu halten, wenn sie aus der Reihe tanzen. Durch die Gründung des Khadamat-e Aetla'at-e Dawlati ist es uns erlaubt, dies zu tun und die Sicherheit des Staates zu gewährleisten."
 AFG_universal_suffarage:0 "Die Parchamiten säubern"
 AFG_universal_suffarage_desc:0 "Der Anführer der Parcham, Mawlana Qiamuddin Khadim, kann sich für unser Regime als sehr gefährlich erweisen. Es ist äußerst wichtig, dass wir ihn auf jede erdenkliche Weise ausschalten und ihn von der politischen Bühne entfernen. Dies wird die Parcham natürlich verärgern, aber dies ist der einzige Weg, um den Platz der Khalq in der Regierung zu sichern."
 AFG_give_hazara_rights:0 "Islam und Marxismus miteinander verbinden"
 AFG_give_hazara_rights_desc:0 "Der Islam spiegelt zwar nicht die Gedanken und Ansichten des Marxismus wider, ist aber ein gutes Instrument zur Orientierung. Wir sollten darauf hinarbeiten, den Islam zu bewahren und ihn mit unserer eigenen Ideologie zu vereinen. Die Zusammenarbeit mit den Madrasas wird sicherlich den Weg dafür ebnen."
 AFG_crush_hazara_nationalism:0 "Beginn der industriellen Kollektivierung"
 AFG_crush_hazara_nationalism_desc:0 "Der landwirtschaftliche und industrielle Sektor von [AFG.GetNameDefCap] erweist sich als sehr einfach und traditionell, mit alten Werkzeugen und Techniken. Damit unsere Wirtschaft florieren kann, müssen wir sie modernisieren und unsere landwirtschaftlichen und industriellen Sektoren mit neuen modernen Geräten und Produktionsweisen ausstatten."
 AFG_marxist_thought:0 "Den Status der Frau verbessern"
 AFG_marxist_thought_desc:0 "In den rauen Bergen von [AFG.GetNonIdeologyName] machte sich eine entschlossene Gruppe von Menschen daran, eine neue Ära einzuläuten. Vor dem Hintergrund alter Traditionen ebneten sie den Weg zum allgemeinen Wahlrecht, bei dem die Stimme jedes Afghanen wie ein mächtiger Windstoß durch die Täler fegte und das Schicksal einer Nation, die sich nach einer integrativen Regierungsführung sehnt, demokratisch gestaltete."
 AFG_socialist_constitution:0 "Schutz der Rechte der Hazara"
 AFG_socialist_constitution_desc:0 "Das Volk der Hazara, das überwiegend in [1009.GetName] lebt, war von der Regierung sehr isoliert, da [AFG.GetNonIdeologyName] ein sehr abgelegenes Land ist, in dem es schwierig ist, jeden Stamm zu erreichen. Indem wir den Hazara mehr Rechte einräumen, hoffen wir, die Revolution und den marxistischen Gedanken auch zu ihnen zu bringen."
 AFG_invite_pakistani_military:0 "Unterdrückung des Hazara-Nationalismus"
 AFG_invite_pakistani_military_desc:0 "Die Hazara-Stämme leben an einem sehr abgelegenen Ort im Land und kommen nicht mit anderen Stämmen in Kontakt, geschweige denn mit der Regierung. Das bedeutet, dass sie ihre Art des Tribalismus und Nationalismus bewahrt haben und die Revolution in [AFG.GetNonIdeologyName] nicht vollständig angenommen haben."
 AFG_reform_the_education_system:0 "Festigung marxistischer Gedanken"
 AFG_reform_the_education_system_desc:0 "Um eine neue Generation von [AFG.GetAdjektiv] Freidenkern heranzuziehen, müssen wir die marxistischen Gedanken in den Köpfen der einfachen [AFG.GetAdjektiv] Menschen festigen. Nur wenn wir Eltern dazu ermutigen, ihre Kinder zu erziehen, können wir unser Ziel erreichen, unsere nächsten Generationen auf die schlimmen Zeiten vorzubereiten, die irgendwann kommen werden!"
 AFG_persecute_believers:0 "Festigung der neuen Verfassung"
 AFG_persecute_believers_desc:0 "Da [AFG.GetNonIdeologyName] ein abgelegenes Land ist, fehlt es an einem Rechtssystem und auch an den Mitteln, um dieses durchzusetzen. Wir sollten eine andere Verfassung anstreben, aber eine sozialistischere."
 AFG_afghan_ssr:0 "[PAK.GetAdjektiv] Sympathisanten einladen"
 AFG_afghan_ssr_desc:0 "Wir müssen [PAK.GetAdjektiv] kommunistische Generäle und Offiziere einladen, sich unserer Sache anzuschließen, um die Revolution im gesamten Orient zu verbreiten. Vereint!"
 AFG_incorporate_tajikistan:0 "Das Bildungssystem reformieren"
 AFG_incorporate_tajikistan_desc:0 "Auch wenn [AFG.GetNonIdeologyName] vielleicht nicht die beste Bildung bietet, können wir die politischen Ansichten der nächsten Generationen sicherlich formen, indem wir den Samen der Revolution in ihren Köpfen säen. Die Revolution wird niemals aussterben."
 AFG_loyalty_to_moscow:0 "Staatlichen Atheismus durchsetzen"
 AFG_loyalty_to_moscow_desc:0 "Kommunismus und Islam können nicht nebeneinander existieren, da der jeweils andere von Natur aus böse ist in seinem Versuch, die menschliche Bevölkerung und den Fortschritt der Menschheit zu kontrollieren. Schließlich wurden alle Religionen von der Bourgeoisie für die Bourgeoisie gegründet."
 AFG_afghan_workers_program:0 "Knie beugen"
 AFG_afghan_workers_program_desc:0 "Der Klassenkampf ist die ultimative Spaltung der Völker, es gibt keine größere Kluft als die des Klassenkampfes, daher müssen wir die beiden Revolutionen in [AFG.GetNonIdeologyName] und [SOV.GetNonIdeologyName] zu einer einzigen vereinen. Indem wir eine sowjetische Sozialistische Republik werden, geben wir unsere Freiheit und Autonomie auf, stärken aber letztendlich die Revolution."
 AFG_our_own_path:0 "Die Tadschikistan-Frage lösen"
 AFG_our_own_path_desc:0 "Die tadschikischen und paschtunischen Stämme haben jahrhundertelang sowohl innerhalb als auch außerhalb der Grenzen von [AFG.GetNonIdeologyName] koexistiert, aber mit der jüngsten Integration der tadschikischen SSR in [AFG.GetNameDefCap] müssen wir daran arbeiten, die Zusammenarbeit zwischen unseren beiden Völkern zu verbessern, indem wir den Tadschiken gewisse Zugeständnisse machen, um ihre Gunst zu gewinnen, im Gegensatz zum vorherigen Regime in [SOV.Capital.GetCapitalVictoryPointName]."
 AFG_persian_socialism:0 "Die Loyalität gegenüber [SOV.Capital.GetCapitalVictoryPointName]"
 AFG_persian_socialism_desc:0 "[SOV.GetNameDefCap] hat sich als guter Verbündeter des [AFG.GetAdjektiv] Volkes erwiesen, indem es dazu beitrug, das Regime in [AFG.GetNonIdeologyName] aufrechtzuerhalten und die Wirtschaft unseres einst armen Landes zu verbessern. Daher können wir nur wählen, unser Versprechen an unser Volk zu halten und der Regierung in [SOV.Capital.GetCapitalVictoryPointName] treu zu bleiben."
 AFG_soviet_menace:0 "Start des Arbeiteraustauschprogramms"
 AFG_soviet_menace_desc:0 "Die [SOV.GetAdjektiv]s und [AFG.GetAdjektiv]s sind seit der Unabhängigkeit [AFG.GetNonIdeologyName]s im Jahr 1919 eng miteinander verbunden. Nach dem dritten Anglo-[ AFG.GetNonIdeologyName] Krieg stattfand, nach der Integration unserer Nation in die Union, haben wir diese Bindungen nur noch gestärkt. Durch den Austausch und die Entsendung unserer Arbeitskräfte ins Ausland werden wir die Zusammenarbeit und die Bindungen zwischen unseren beiden Nationen noch weiter verbessern."
 AFG_revolution_through_belief:0 "Gründung der [AFG.GetAdjektiv] Sozialistischen Front"
 AFG_revolution_through_belief_desc:0 "Es ist an der Zeit, dass sich die Revolutionen unter dem Banner der [AFG.GetNonIdeologyName] vereinen. Durch die Gründung der [AFG.GetAdjektiv] Sozialistischen Front wollen wir die Revolution auf die Nachbarländer ausweiten, aber nicht unter dem Banner der [SOV.GetAdjektiv]en, wird im gesamten Nahen Osten und Zentralasien eine neue Flamme entzündet und die in [SOV.Capital.GetCapitalVictoryPointName] wird erlöschen!"
 AFG_revolution_through_force:0 "Belebt die Dschungelbewegung wieder"
 AFG_revolution_through_force_desc:0 "Wir müssen die Flammen der Revolution in Persien entzünden und damit die Saat des Sozialismus und Kommunismus in den fruchtbaren Boden der [PER.GetAdjektiv]-Herzen und -Köpfe säen. Es ist unsere Pflicht, den [PER.GetAdjektiv] Menschen die Augen zu öffnen!"
 AFG_secure_the_corridor:0 "Enthüllt die Schattenseiten des Bären"
 AFG_secure_the_corridor_desc:0 "[AFG.GetNonIdeologyName] befindet sich in einer unglaublich nützlichen Position, von der aus die Invasion von [SOV.GetNameDef] völlig mühelos und einfach ist. Wir können unsere geografische Lage zu unserem Vorteil nutzen und die [SOV.GetAdjective] dort treffen, wo es ihnen am meisten weh tut; direkt in den Bauch des Bären!"
 AFG_socialist_economic_union:0 "Revolution durch Frieden!"
 AFG_socialist_economic_union_desc:0 "Der Kommunismus ist keine Ideologie des Krieges und des Blutvergießens, sondern eine Ideologie, die Frieden, Brüderlichkeit und Gleichheit für alle fordert. Nur die Extremisten schlagen die gewaltsame Verbreitung des Kommunismus durch Krieg und das Vergießen des Blutes unserer Brüder vor!"
 AFG_socialist_welfare:0 "Revolution durch Blut!"
 AFG_socialist_welfare_desc:0 "Der Kommunismus kann nur durch Gewalt verbreitet werden. Es gibt Kommunisten, die glauben, dass der Kommunismus durch Frieden verbreitet werden muss, und die Brüderlichkeit und Einheit unter allen Menschen fordern, aber das ist einfach falsch und würde uns zum endgültigen Ende des Kommunismus führen!"
 AFG_the_perso_afghan_union:0 "Sicherung des Wakhan-Korridors"
 AFG_the_perso_afghan_union_desc:0 "Der Wakhan-Korridor, das Gebiet, das [AFG.GetNonIdeologyName] und Tunganistan verbindet, wurde [AFG.GetNonIdeologyName] im 19. Jahrhundert gewährt, um die [ENG.GetAdjective] Kolonialbesitzungen in [RAJ.GetNonIdeologyName] und den zentralasiatischen Gebieten Russlands zu trennen. Wir müssen diesen Korridor sichern, indem wir ihn erweitern, um die regionale Stabilität zu erhalten!"
 AFG_land_redistribution:0 "Verbesserung der wirtschaftlichen Zusammenarbeit"
 AFG_land_redistribution_desc:0 "Damit unsere Wirtschaft noch schneller wächst als derzeit, müssen wir niedrigere oder gar keine Steuern auf Importe und Exporte aus unseren sozialistischen Bruderstaaten erheben. Dies wird wiederum unseren Volkswirtschaften sehr zugutekommen."
 AFG_into_pakistan:0 "Modernisierung des [ROOT.GetAdjective] Wohlfahrtsstaates"
 AFG_into_pakistan_desc:0 "Auch wenn wir eine kommunistische Nation sind, gibt es immer noch Klassenunterschiede. Deshalb ist es von größter Bedeutung, dass wir Wohlfahrt für die Unterschicht oder das Proletariat einführen. Alle [AFG.GetAdjektiv] sind in unserem Kampf gegen den Kapitalismus unter einem Banner vereint!"
 AFG_anti_fascist_league:0 "Einigkeit durch Glauben!"
 AFG_anti_fascist_league_desc:0 "Die [AFG.GetAdjektiv] und [PER.GetAdjektiv] sind sich sehr ähnlich, so sehr, dass unsere beiden Nationen praktisch wie ein Land aussehen, das in Bundesstaaten unterteilt ist. Daher ist es nicht so schwierig, diesen kleinen Schritt zu gehen, um unsere beiden Länder endlich vollständig zu vereinen! Alle [AFG.GetAdjektiv]s und [PER.GetAdjektiv]s, vereint, unter einem Banner, unter einer Ideologie, unter einem Glauben!"
 AFG_operation_coutenance:0 "Verabschiedung des Agrarreformgesetzes"
 AFG_operation_coutenance_desc:0 "Der Großteil der Bourgeoisie, der das Land verlassen hat und in benachbarten kapitalistischen Ländern Zuflucht gesucht hat, hat auch große Mengen seines Landes zurückgelassen. Wir können dieses Land den Bauern und Arbeitern von [AFG.GetNonIdeologyName] geben, die es bewirtschaften und den Agrarsektor unserer Nationen verbessern werden. Man muss wissen, dass dieses Land größtenteils unfruchtbar ist und nicht für landwirtschaftliche Zwecke genutzt werden kann."
 AFG_five_year_plan:0 "Die Durand-Linie neu ziehen"
 AFG_five_year_plan_desc:0 "Die üppigen Ebenen und die hohen Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete in [AFG.GetNonIdeologyName] einzugliedern, um unser Volk vor der schrecklichen Misshandlung und dem Kolonialismus zu schützen, denen es seit Jahrhunderten ausgesetzt ist!"
 AFG_combined_training:0 "Das antifaschistische Bollwerk"
 AFG_combined_training_desc:0 "[AFG.GetNonIdeologyName] muss als Bollwerk gegen jeglichen Faschismus im Orient und darüber hinaus stehen! Wir müssen die Ausbreitung des Faschismus um jeden Preis verhindern, egal wie viele Menschenleben das kosten mag!"
 AFG_undermine_moscow:0 "Die [SOV.GetAdjektiv]-[AFG.GetAdjektiv]-Invasion von [PER.GetNonIdeologyName]"
 AFG_undermine_moscow_desc:0 "Um die Südfront zu sichern, müssen wir uns zuerst um das [PER.GetAdjektiv]-Problem kümmern. Neben der Sicherung lebenswichtiger Versorgungslinien und verteidigungsfähiger Stellungen könnte sich die Eroberung der großen Ölreserven im Norden Persiens für uns als sehr nützlich erweisen."
 AFG_sabotage_soviet_railways:0 "Der Fünfjahresplan"
 AFG_sabotage_soviet_railways_desc:0 "Nach der Einstellung von Wirtschaftsexperten ist es endlich an der Zeit für den ersten Fünfjahresplan in [AFG.GetNonIdeologyName]. Dies wird unsere Wirtschaft erheblich ankurbeln und [AFG.GetNonIdeologyName] auf den Weg bringen, eine entwickelte und wohlhabende Nation zu werden!"
 AFG_seize_gun_stockpiles:0 "[SOV.GetAdjektiv]-[AFG.GetAdjektiv] Militärische Ausbildung"
 AFG_seize_gun_stockpiles_desc:0 "Die [AFG.GetAdjektiv]-Armee besteht hauptsächlich aus ungeschulten Stammesangehörigen und Kriegern. Durch gemeinsame Übungen mit der [SOV.GetAdjektiv]-Roten Armee werden unsere Soldaten dringend benötigte Kampferfahrung sammeln, und dasselbe gilt für unsere Militärkommandeure."
 AFG_end_soviet_rule:0 "Unterminieren [SOV.Capital.GetCapitalVictoryPointName]"
 AFG_end_soviet_rule_desc:0 "Seit unserer Unterwerfung unter [SOV.GetNameDef] wurde [AFG.GetNonIdeologyName] vernachlässigt und beiseitegeschoben. Nun, das werden wir nicht länger dulden! Die Zeit ist gekommen für den Aufstieg von [AFG.GetNonIdeologyName] und den anschließenden Fall von [SOV.Capital.GetCapitalVictoryPointName]!"
 AFG_ministry_for_propogation_of_virtue:0 "Sabotage der [SOV.GetAdjektiv] Eisenbahnen"
 AFG_ministry_for_propogation_of_virtue_desc:0 "Damit unsere Invasion gegen die [SOV.GetAdjektiv] erfolgreich ist, müssen wir ihre Versorgungslinien durch Sabotage ihrer Eisenbahnen unterbrechen. Wir werden Spreng- und Sabotagetrupps entsenden, um ihre Bahngleise zu sprengen. Dadurch wird die Versorgung ihrer Truppen sehr erschwert und wir können problemlos in ihr Gebiet einmarschieren."

 ######## HISTORICAL FOCUSES ######## "Jede Armee benötigt Ausrüstung, um ihre Soldaten zu versorgen, und wir auch. Wenn das also tatsächlich der Fall ist, warum beschlagnahmen wir dann nicht die Ausrüstung unserer zukünftigen Feinde in [SOV.GetNameDef]? Die Nähe zu den [SOV.GetAdjektiv]en macht dies ebenfalls viel einfacher."

 AFG_the_regency:0 "Nachdem wir die Vorbereitungen für unsere Invasion in Zentralasien abgeschlossen haben, ist es endlich an der Zeit, dass wir unsere Brüder im Norden dazu aufrufen, die Waffen gegen die Tyrannei von [SOV.GetNameDef] zu erheben! Brüder, erhebt euch für eure Freiheit!"
 AFG_the_regency_desc:0 "Das Ministerium für die Verbreitung der Tugend"
 AFG_appoint_hashim:0 "Die Verbreitung von Tugend und die Verhinderung von Laster ist für unsere Religion von entscheidender Bedeutung, und wenn unser Staat auf unserer Religion aufgebaut werden soll, müssen wir diese Lehre unserer Religion in einer Regierungsinstitution manifestieren."
 AFG_appoint_hashim_desc:0 ""
 AFG_appoint_mahmud:0 ""
 AFG_appoint_mahmud_desc:0 ""
 AFG_institutionalize_pashto:0 "Erhaltung der Regentschaft"
 AFG_institutionalize_pashto_desc:0 "Es ist von größter Bedeutung, dass wir die königliche Regentschaft erhalten, der König ist noch zu jung, um sich um die Innenpolitik zu kümmern, geschweige denn um die Außenpolitik. Dies würde die Nation in diesen dunklen Zeiten stabil halten, oder?"
 AFG_treaty_of_saadabad_hist:0 "Fortsetzung von Hashims Mandat"
 AFG_treaty_of_saadabad_hist_desc:0 "Sardar Muhammad Hashim Khan ist das älteste Mitglied der königlichen Regentschaft und muss daher der Weiseste sein. Er soll [AFG.GetNonIdeologyName] durch dunkle Gewässer führen und für Ordnung im Land sorgen!"
 AFG_visit_berlin:0 "Mahmud zum Minister ernennen"
 AFG_visit_berlin_desc:0 "Im Gegensatz zu seinem Bruder ist Sardar Shah Mahmud Khan eine liberalere Persönlichkeit. Unter seiner Führung wird [AFG.GetNonIdeologyName] zu einer modernen westlichen Nation mit einem demokratischen System und einer florierenden Wirtschaft reformiert werden!"
 AFG_invite_wehrmacht_officers:0 "Paschtu institutionalisieren"
 AFG_invite_wehrmacht_officers_desc:0 "Viele Menschen in [AFG.GetNonIdeologyName] sprechen immer noch Persisch, manchmal als Kommunikationsmittel zwischen verschiedenen Stämmen, und selbst in der heutigen Zeit ist der Einfluss des Persischen in [AFG.GetNonIdeologyName] noch spürbar. Aus diesem Grund ist es unerlässlich, dass eine Landessprache wie Paschtu gestärkt und allen unseren Bürgern beigebracht wird, wenn [AFG.GetNonIdeologyName] als Nation überleben will!"
 AFG_bolster_the_nationalists:0 "Vertrag von Saadabad"
 AFG_bolster_the_nationalists_desc:0 "Der Nahe Osten ist für [AFG.GetNonIdeologyName] von größter Bedeutung, da die politischen Veränderungen in diesen Ländern auch unsere Wirtschaft, unser Militär und unsere Politik stark beeinflussen können. Wir müssen uns dem Osten zuwenden! Vielleicht durch den Vorschlag eines Pakts der Freundschaft und des Nichteinmischens."
 AFG_purge_the_nationalists:0 "Staatsbesuch in [GER.Capital.GetCapitalVictoryPointName]"
 AFG_purge_the_nationalists_desc:0 "[AFG.GetNonIdeologyName] ist zwischen zwei Übeln hin- und hergerissen: Im Norden sind die [SOV.GetAdjective]s, im Süden die [ENG.GetAdjective]. Wir müssen eine dritte einflussreiche Macht in [AFG.GetNonIdeologyName] etablieren, um das Gleichgewicht der Kräfte aufrechtzuerhalten. Daher müssen wir uns an die [GER.GetAdjective] wenden und sie um Unterstützung bitten."
 AFG_acquire_german_radios:0 "Wehrmachtsoffiziere einladen"
 AFG_acquire_german_radios_desc:0 "Die [AFG.GetAdjective] Armee könnte etwas Unterstützung aus dem Ausland gebrauchen, vielleicht von [GER.GetNonIdeologyName]. Während des Ersten Weltkriegs wurde eine [GER.GetAdjektiv] Militärmission nach [AFG.GetNonIdeologyName] geschickt, in der Hoffnung, diplomatische Beziehungen zu [AFG.GetNonIdeologyName] aufzubauen und das Land zum Kriegseintritt zu zwingen. Es wäre klug, den Leiter der Mission, Werner Otto von Hentig, erneut einzuladen."
 AFG_invite_abwehr_agents:0 "Die Nationalisten stärken"
 AFG_invite_abwehr_agents_desc:0 ""
 AFG_enact_censorship:0 "Die Nationalisten ausgrenzen"
 AFG_enact_censorship_desc:0 ""
 AFG_build_up_roads:0 "[GER.GetAdjektiv] Radios beschaffen"
 AFG_build_up_roads_desc:0 ""
 AFG_german_investments_program:0 "Abwehragenten einladen"
 AFG_german_investments_program_desc:0 "Wenn wir die [GER.Adjektiv] Abwehr einladen, eine Vorwärtsbasis in [AFG.GetNonIdeologyName] zu errichten, können wir und der [GER.Adjektiv] Geheimdienst die [ENG.GetAdjektiv] in [RAJ.GetNameDef] und Asien im Auge behalten. Dies würde auch unsere nationale Sicherheit verbessern und wahrscheinlich verhindern, dass Invasionen stattfinden, ohne dass wir es zuerst erfahren."
 AFG_fund_the_army:0 "Medienzensur durchsetzen"
 AFG_fund_the_army_desc:0 "Die Medien sind ein mächtiges Werkzeug, sie dienen als Vermittler zwischen Regierung und Volk. Allerdings muss nicht alles veröffentlicht werden, oder? Vor allem, wenn der Inhalt der Regierung schadet."
 AFG_stabilize_the_currency:0 "Deal mit der Organisation Todt"
 AFG_stabilize_the_currency_desc:0 "Die [GER.GetAdjektiv]s haben ein lukratives Industrieabkommen vorgeschlagen, bei dem die Organisation Todt in Zusammenarbeit mit der [AFG.GetNonIdeologyName] Regierung Straßen in ganz [AFG.GetNonIdeologyName] bauen würde. Dies würde die [AFG.GetNonIdeologyName] Wirtschaft und die Lebensqualität der [AFG.GetNonIdeologyName] Bevölkerung erheblich verbessern."
 AFG_irrigation_scheme:0 "[GER.GetAdjektiv] Investitionsprogramm"
 AFG_irrigation_scheme_desc:0 "Investitionen in [AFG.GetNonIdeologyName] sind für die wirtschaftliche Entwicklung und das Infrastrukturwachstum unseres Landes von entscheidender Bedeutung. Diese Partnerschaften bringen nicht nur finanzielle Unterstützung, sondern stellen auch wertvolles Fachwissen und Technologie bereit und fördern durch für beide Seiten vorteilhafte Kooperationen eine nachhaltige und blühende Zukunft für [AFG.GetNonIdeologyName]."
 AFG_hold_elections:0 "Mittel für das Militär umleiten"
 AFG_hold_elections_desc:0 "Die Finanzierung der afghanischen Armee ist für die Sicherheit und Stabilität des Landes von entscheidender Bedeutung. Es ist die Pflicht jedes Bürgers, zur finanziellen Unterstützung unserer Streitkräfte beizutragen, um sicherzustellen, dass sie gut ausgerüstet und bereit sind, unsere Souveränität gegen jede Bedrohung zu verteidigen."
 AFG_shah_mahmud_prevails:0 "Stabilisierung der Währung"
 AFG_shah_mahmud_prevails_desc:0 "Die Stabilisierung der Währung ist besonders wichtig, um das Vertrauen der Investoren zu gewährleisten. Eine stabile Währung fördert die Entwicklung, zieht ausländische Investitionen an und trägt zum allgemeinen wirtschaftlichen Wohlstand und zum sozialen Wohlergehen unserer Bürger bei."
 AFG_fatherland_party_triumph:0 "Unterzeichnung des Vier-Punkte-Programms"
 AFG_fatherland_party_triumph_desc:0 "Unsere Bauern im Westen genießen nicht die Privilegien wie einige aus dem Osten. Diese Unterschiede sind es letztendlich, die eine Nation und ein Volk auseinanderreißen. Wir dürfen das nicht zulassen. Vielleicht können wir durch den Bau moderner Bewässerungssysteme für diese benachteiligten Bauern ihre Unterstützung gewinnen."
 AFG_infrastructure_privatization:0 "Die [GetYear] Parlamentswahlen"
 AFG_infrastructure_privatization_desc:0 "In seiner Geschichte hatte [AFG.GetNonIdeologyName] nie auch nur annähernd etwas, das einem demokratischen System ähnelte. Heute wird sich das ändern. Heute wird es zum ersten Mal in der Geschichte [AFG.GetNonIdeologyName] freie Wahlen geben, bei denen alle Bürger wählen und ihre Meinung äußern können!"
 AFG_british_exchange_program:0 "Wiederwahl für die Konservativen"
 AFG_british_exchange_program_desc:0 "Wir dürfen uns nicht zu weit von unserem derzeitigen System entfernen. Es ist wichtig, dass wir die Grundwerte von [AFG.GetNonIdeologyName] bewahren. Die von Sardar Shah Mahmud Khan angeführte Konservative Partei scheint in dieser Hinsicht sehr vielversprechend zu sein."
 AFG_liberal_constitution:0 "Die Vaterlandspartei triumphiert"
 AFG_liberal_constitution_desc:0 "Die Demokratie darf nicht durch unsere Kultur und unsere rückständigen Ansichten über die moderne Welt eingeschränkt werden! Unter der Führung von Ghulam Muhammad Ghubar soll die Vaterlandspartei [AFG.GetNonIdeologyName] zu einem Leuchtturm der liberalen Demokratie im Orient werden!"
 AFG_the_afghan_new_deal:0 "Privatisierung der nationalen Infrastruktur"
 AFG_the_afghan_new_deal_desc:0 "Die Privatisierung der Infrastruktur und der Autobahnen ist für die Regierung von entscheidender Bedeutung, um das Wirtschaftswachstum im öffentlichen Sektor anzukurbeln. Durch die Förderung der Beteiligung des Privatsektors wollen wir die langfristige Nachhaltigkeit unserer Verkehrsnetze sicherstellen."
 AFG_form_watan_party:0 "Das [ENG.GetAdjective] Austauschprogramm"
 AFG_form_watan_party_desc:0 "Der Austausch von Militärtechnologien und -fortschritten mit [ENG.GetNameDef] ist von entscheidender Bedeutung, um die Verteidigungsfähigkeiten unseres Militärs zu stärken. Wir hoffen, dass dies auch die guten Beziehungen und die Zusammenarbeit mit [ENG.GetNameDef] fördern wird."
 AFG_economic_privatization:0 "Verabschiedung einer liberalen Verfassung"
 AFG_economic_privatization_desc:0 "[AFG.GetNonIdeologyName] hatte einst unter König Amanullah eine einigermaßen liberale Verfassung, die von der Loya Jirga und der Öffentlichkeit unterstützt wurde. Wir sollten versuchen, eine ähnliche Verfassung wieder einzuführen, wobei wir viele der gleichen Werte beibehalten, sie aber auch so umstrukturieren sollten, dass sie den heutigen Standards entspricht."
 AFG_reapproachment_with_RAJ:0 "Der [AFG.GetAdjective] New Deal"
 AFG_reapproachment_with_RAJ_desc:0 "Ähnlich wie der [USA.GetAdjektiv] New Deal, der von [USA.GetAdjektiv] Präsident Franklin D. Roosevelt eingeführt wurde, plant [AFG.GetNonIdeologyName], eine ähnliche Reihe von Wirtschaftsprogrammen einzuführen, um die Arbeitslosigkeit und andere Probleme zu bekämpfen, in der Hoffnung, die [AFG.GetAdjektiv] Wirtschaft anzukurbeln."
 AFG_join_axis:0 "Gründung der Vaterlandspartei"
 AFG_join_axis_desc:0 "Die Gründung der Watan-Partei ist für [AFG.GetNonIdeologyName] von entscheidender Bedeutung, da sie ein Bekenntnis zu demokratischen Grundsätzen und einer integrativen Regierungsführung darstellt. Diese politische Einheit soll eine Plattform für alle Stimmen von [AFG.GetNonIdeologyName] bieten, zur demokratischen Entwicklung der Nation beitragen und eine Regierung sicherstellen, die die Bestrebungen und Interessen der gesamten Nation vertritt."
 AFG_from_the_leopard_corps:0 "Privatisierung des Industriesektors"
 AFG_from_the_leopard_corps_desc:0 "Die Privatisierung des Industriesektors ist für die Regierung von entscheidender Bedeutung, um das Wirtschaftswachstum anzukurbeln und eine wettbewerbsfähige Wirtschaft zu schaffen. Durch die Förderung von Privateigentum und -verwaltung wollen wir eine sich selbst tragende Wirtschaft schaffen, die von privaten Unternehmen und Konzernen angetrieben wird."
 AFG_operation_tiger:0 "Annäherung an den Raj"
 AFG_operation_tiger_desc:0 "Um die regionale Stabilität und den Frieden zu wahren, ist es von größter Bedeutung, dass wir freundschaftliche Beziehungen zu [RAJ.GetNameDef] aufrechterhalten. Wir müssen [RAJ.GetNameDef] die Hand reichen, zum Wohle [AFG.GetNonIdeologyName] und der [AFG.GetAdjektiv]-Bevölkerung!"
 AFG_operation_blue_mosque:0 "Tritt der Achse bei"
 AFG_operation_blue_mosque_desc:0 "Die Achsenmächte haben uns Größe und Sicherheit versprochen, wenn wir uns ihnen anschließen. Die Zeit, in der [AFG.GetNonIdeologyName] von [ENG.GetNameDef] und [SOV.GetNameDef] abhängig war, ist vorbei. Die Zeit eines modernen, entwickelten und politisch unabhängigen [AFG.GetNonIdeologyName] hat gerade erst begonnen!"
 AFG_neutrality_reaffirmed:0 "Gründung des Leopard Corps"
 AFG_neutrality_reaffirmed_desc:0 "Das Snow Leopard Volunteer Corps wird dazu beitragen, die Interessen von [AFG.GetNonIdeologyName] in der Region zu fördern und zu schützen."
 AFG_deterrence_focus:0 "Operation Tiger"
 AFG_deterrence_focus_desc:0 "Die fruchtbaren Ebenen und hohen Berge [PAK.GetNonIdeologyName]s werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete in [AFG.GetNonIdeologyName] einzugliedern, um unser Volk vor der schrecklichen Misshandlung und Kolonialisierung zu schützen, der es seit Jahrhunderten ausgesetzt ist!"
 AFG_implement_autarky:0 "Operation Blaue Moschee"
 AFG_implement_autarky_desc:0 "Um die Westgrenze zu sichern, müssen wir uns um die [PER.GetAdjective]-Frage kümmern. Neben der Sicherung lebenswichtiger Versorgungslinien und der Beseitigung unerwünschter Einflüsse in Persien könnte sich die Eroberung der großen Ölreserven im Norden Persiens für uns als sehr nützlich erweisen."
 AFG_combat_foreign_influence:0 "Neutralität bekräftigen"
 AFG_combat_foreign_influence_desc:0 "[AFG.GetNonIdeologyName] ist seit dem Krieg von 1919, als es seine Unabhängigkeit durch einen brutalen und blutigen Konflikt gegen das damals größte und fortschrittlichste Imperium, das Britische Empire, erlangte, neutral. Was nicht kaputt ist, muss man auch nicht reparieren."
 AFG_fortify_the_durand_line:0 "Verteidigung des Vaterlandes"
 AFG_fortify_the_durand_line_desc:0 "Die Verhinderung militärischer Invasionen ist ein vorrangiges Ziel der afghanischen Regierung, um die Souveränität und Sicherheit unserer Nation zu gewährleisten. Durch die Stärkung unserer Verteidigungsfähigkeiten wollen wir eine Abschreckung gegen Bedrohungen von außen schaffen und so das Wohlergehen unserer Bürger schützen. Für das Vaterland!"
 AFG_the_uneasey_border:0 "Autarkie umsetzen"
 AFG_the_uneasey_border_desc:0 "Wir müssen Autarkie umsetzen, um wirtschaftliche Selbstversorgung zu erreichen und unsere Abhängigkeit von externen Ressourcen zu verringern. Durch die Priorisierung der lokalen Produktion wollen wir die Widerstandsfähigkeit unserer Nation angesichts globaler wirtschaftlicher Unsicherheiten stärken."
 AFG_join_allies:0 "Der Geist der Neutralität"
 AFG_join_allies_desc:0 "Die Aufrechterhaltung des Geistes der Neutralität ist für die afghanische Regierung von entscheidender Bedeutung, um die Unabhängigkeit unserer Nation von [SOV.GetAdjektiv] oder [ENG.GetAdjektiv] Einfluss zu bewahren."
 AFG_press_for_pakistan:0 "Verstärkung der Durand-Linie"
 AFG_press_for_pakistan_desc:0 "Die Verstärkung der Durand-Linie, der Grenze zu [RAJ.GetNameDef], ist unerlässlich, um die Sicherheit zu gewährleisten, grenzüberschreitende Aktivitäten zu regulieren und die Südgrenze [AFG.GetNonIdeologyName] zu schützen. Durch die Verstärkung dieser Grenze wollen wir unsere militärische Bereitschaft erhöhen, falls es jemals zu einem Konflikt mit dem [GetRajAdjektiv]-Militär kommen sollte."
 AFG_aquire_british_ships:0 "Die unsichere Grenze befestigen"
 AFG_aquire_british_ships_desc:0 "Die Befestigung der [SOV.GetAdjektiv]-[AFG.GetAdjektiv]-Grenze ist von äußerster Wichtigkeit, um die territoriale Integrität zu wahren und die Nation vor externen Bedrohungen zu schützen. Die Stärkung der Grenzverteidigung zielt darauf ab, unsere militärische Bereitschaft zu erhöhen, falls es jemals zu einem Konflikt mit [SOV.GetAdjektiv] kommen sollte."
 AFG_operation_red_mosque:0 "Den Alliierten beitreten"
 AFG_operation_red_mosque_desc:0 "Die Alliierten, ein Symbol für Stabilität, Frieden und vor allem Demokratie, sind seit geraumer Zeit ein Diskussionsthema unter [AFG.GetAdjektiv] Politikern. Es besteht jedoch Einigkeit darüber, dass [AFG.GetNonIdeologyName] viele seiner Ansichten und Werte mit den alliierten Nationen teilt. Vor diesem Hintergrund ist es nur richtig, dass [AFG.GetNonIdeologyName] den Alliierten beitritt!"
 AFG_increase_school_funding:0 "Presse für [PAK.GetNonIdeologyName]"
 AFG_increase_school_funding_desc:0 "Die üppigen Ebenen und die hohen Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete in [AFG.GetNonIdeologyName] einzugliedern, um unser Volk vor der schrecklichen Misshandlung und dem Kolonialismus zu schützen, denen es seit Jahrhunderten ausgesetzt ist!"
 AFG_beacon_of_the_orient:0 "Erwerb von [ENG.GetAdjective] Marineschiffen"
 AFG_beacon_of_the_orient_desc:0 "Der Erwerb von Marineschiffen von [ENG.GetNameDef] ist von entscheidender Bedeutung, um die maritimen Sicherheitsfähigkeiten der [AFG.GetAdjective] Marine zu verbessern. Dies kann uns jedoch eine große Summe Geld kosten, die wir uns derzeit möglicherweise nicht leisten können."
 AFG_legacy_of_the_yellow_expedition:0 "Operation Rote Moschee"
 AFG_legacy_of_the_yellow_expedition_desc:0 "Der Kommunismus ist eine bösartige Ideologie, die nichts als Tod und Zerstörung bringt, wo immer sie Fuß fasst, oder zumindest glauben wir das. Es ist unsere Pflicht, dem Kommunismus ein für alle Mal ein Ende zu setzen und zu verhindern, dass Menschen auf der ganzen Welt in Zukunft unter seinem Deckmantel leiden. Wir müssen die [SOV.GetAdjektiv] Bedrohung im Norden bekämpfen!"
 AFG_grant_land_concessions:0 "Erhöhung der Schulfinanzierung"
 AFG_grant_land_concessions_desc:0 "Die Erhöhung der Schulfinanzierung hat oberste Priorität, um unserem Land eine bessere Zukunft zu sichern. Durch die Bereitstellung von mehr Mitteln für die Bildung wollen wir die Qualität der Schulen verbessern und unsere Jugend mit dem Wissen und den Fähigkeiten ausstatten, die sie benötigt, um zur sozialen und wirtschaftlichen Entwicklung [AFG.GetNonIdeologyName] beizutragen."
 AFG_specialization_of_units_focus:0 "Leuchtfeuer des Orients"
 AFG_specialization_of_units_focus_desc:0 "Die Wahrung der Demokratie im Orient ist von größter Bedeutung, da sie unser Engagement für Freiheit und Einheit symbolisiert. Durch die Wahrung demokratischer Grundsätze wollen wir Stabilität gewährleisten und zur umfassenderen Förderung demokratischer Werte im Orient und darüber hinaus beitragen!"
 AFG_ramp_up_military_production:0 "Vermächtnis der Gelben Expedition"
 AFG_ramp_up_military_production_desc:0 "Die Gelbe Expedition von 1932, angeführt von vier Männern, die Citroën vertraten, reiste durch [AFG.GetNonIdeologyName], wo sie ihre neue Ausrüstung, den P17 Kégresse, bewarben. Die Möglichkeit, diese Halbkettenfahrzeuge zu kaufen, wurde nie ausgeschlossen, sodass wir sie immer noch kaufen könnten, wenn wir dies wünschen würden."
 AFG_study_our_surroundings:0 "Landkonzessionen gewähren"
 AFG_study_our_surroundings_desc:0 "Die Vergabe von Landkonzessionen an Regionen, die über große Ölvorkommen verfügen, an [USA.GetAdjektiv]-Unternehmen in [AFG.GetNonIdeologyName] ist für die Steigerung der wirtschaftlichen Entwicklung von entscheidender Bedeutung. Hoffentlich wird dies ausländische Investitionen anziehen und unsere wirtschaftliche Zusammenarbeit mit [USA.GetNameDef] verbessern."
 AFG_mass_produce_equipment:0 "Spezialisierte Einheiten"
 AFG_mass_produce_equipment_desc:0 "Es stimmt zwar, dass wir viele Infanteriedivisionen und -bataillone haben können, die schlecht ausgebildet und ausgerüstet sind, aber es wäre hilfreich, wenn wir Spezialeinheiten für den Kampf in unterschiedlichem Gelände entwickeln könnten. Da [AFG.GetNonIdeologyName]s Gelände überwiegend bergig ist, wäre es doch am sinnvollsten, sich auf Bergkämpfe und -schlachten zu spezialisieren, oder?"
 AFG_live_off_the_land:0 "Steigerung der Militärproduktion"
 AFG_live_off_the_land_desc:0 "Die militärische Produktion von [AFG.GetNonIdeologyName] ist praktisch nicht vorhanden. Dies macht den Schutz unserer Nation vor externen Bedrohungen und Einflüssen äußerst schwierig, da wir bei der militärischen Ausrüstung von anderen Nationen abhängig sind. [AFG.GetNonIdeologyName] muss mit der Produktion eigener Waffen beginnen, um seiner Souveränität und Sicherheit willen!"
 AFG_terror_of_the_sea:0 "Anpassung an unsere Umgebung"
 AFG_terror_of_the_sea_desc:0 "Um uns besser verteidigen zu können, müssen wir unsere Umgebung studieren und Taktiken entwickeln, die uns einen bedeutenden Vorteil gegenüber ausländischen Invasoren verschaffen. Durch die Nutzung unserer Landschaft können wir unserem Feind viele Verluste zufügen, ohne selbst viele Verluste zu erleiden!"
 AFG_destroyer_of_worlds:0 "Massenproduktion von Ausrüstung"
 AFG_destroyer_of_worlds_desc:0 "Um unsere militärische Stärke zu erhalten, müssen wir uns auf die Anzahl der Soldaten konzentrieren, die in der Armee dienen, und jeden einzelnen von ihnen ausrüsten. Zwei Männer mit schlechten Gewehren sind immer besser als ein Mann mit einem überlegenen Gewehr!"

 ######## ALT MONARCHIST FOCUSES ######## "Wir müssen Taktiken entwickeln, die unseren Truppen helfen, kalte und harte Winter zu überleben oder in Situationen, in denen es schwierig ist, Vorräte zu beschaffen. Sie müssen darauf trainiert werden, mit dem auszukommen, was ihnen gegeben wird!"

 AFG_abolish_the_regency:0 "Der Schrecken der Meere, ein Schiff, so groß und massiv, ein Schiff, das viele Flugzeuge trägt, die feindliche Schiffe angreifen und ihnen verheerende Schläge versetzen! Wir müssen daran arbeiten, ein solches Schiff zu bauen, denn es wird uns mit Sicherheit den Sieg in jedem Seekampf sichern, an dem wir teilnehmen!"
 AFG_abolish_the_regency_desc:0 "Zerstörer der Welten"
 AFG_backtrack_on_reforms:0 "Es ist der Traum eines jeden Wissenschaftlers, die Kraft des Atoms endlich nutzen zu können. Diese immense Menge an Energie könnte zur vollständigen Zerstörung ganzer Städte und Regionen führen. Wir müssen vorsichtig sein, da die Kernenergie eine größere Bedrohung als einen Nutzen für die Menschheit darstellen könnte."
 AFG_backtrack_on_reforms_desc:0 ""
 AFG_continute_nadir_shahs_reforms:0 ""
 AFG_continute_nadir_shahs_reforms_desc:0 ""
 AFG_construct_the_great_north_road:0 "Die Regentschaft abschaffen"
 AFG_construct_the_great_north_road_desc:0 "Der König soll [AFG.GetNonIdeologyName] zu Ruhm und Wohlstand führen! Mit seiner Leitung der Loya Jirga hat er gezeigt, dass er tatsächlich in der Lage ist, die Außen- und Innenpolitik [AFG.GetNonIdeologyName] zu leiten. Wir können nur hoffen, dass ihm die Macht nicht zu Kopf steigt."
 AFG_foreign_economic_aid:0 "Nadir Shahs Reformen aufheben"
 AFG_foreign_economic_aid_desc:0 "Die Regierung von [AFG.GetNonIdeologyName] war in der Vergangenheit zu ehrgeizig, was Modernisierung und Reformen angeht. Wir dürfen nicht zulassen, dass Modernisierung und Reformen unsere Nation erneut auseinanderreißen, wie es 1929 unter König Amanullah der Fall war. Der Fortschritt ist es, der unsere Nation letztendlich auseinanderreißen wird!"
 AFG_centralize_the_bank_of_afg:0 "Nadir Shahs Reformen fortsetzen"
 AFG_centralize_the_bank_of_afg_desc:0 "Immer weiter so! Wir müssen uns für langsame Reformen einsetzen, die die Lebensweise der einfachen Leute nicht zu sehr beeinträchtigen. Der Fortschritt muss aufrechterhalten werden. Ein gutes Beispiel für die Bedeutung dessen ist die Herrschaft des verstorbenen Vaters von König Muhammad Zahir Shah, König Nadir Shah. In seine Fußstapfen soll sein Sohn treten!"
 AFG_push_army_reforms:0 "Bau der Great North Road"
 AFG_push_army_reforms_desc:0 "[1011.GetName] wurde viel zu lange nicht ausgebaut. Daher ist es wichtig, sie zu urbanisieren und zu industrialisieren. Und wie könnte man dies besser erreichen als durch den Bau einer Autobahn, die den Norden mit Kabul verbindet!"
 AFG_annul_the_hasht_nafari:0 "Ausländische Investitionen anstreben"
 AFG_annul_the_hasht_nafari_desc:0 "[AFG.GetNonIdeologyName] ist ein armes Land, das müssen wir zugeben. Aber das muss nicht so bleiben! Um unserem Volk wirtschaftlichen und sozialen Wohlstand zu bringen, ist es von größter Bedeutung, dass wir Beziehungen zu den wichtigsten ausländischen Mächten der Welt aufbauen. Es könnten große Vorteile auf uns warten."
 AFG_introduce_new_taxes:0 "Zentralisierung der Bank von [AFG.GetNonIdeologyName]"
 AFG_introduce_new_taxes_desc:0 "Der [AFG.GetNonIdeologyName] Bankensektor ist derzeit sehr unterentwickelt. Dies ist auf den Mangel an Reformen und Modernisierung sowie auf den allgemeinen Mangel an einem Bankensystem aufgrund des Kapitalmangels zurückzuführen. Wenn [AFG.GetNonIdeologyName] die Weltbühne betreten oder eine entwickelte Nation werden will, ist es notwendig, den Bankensektor zu entwickeln."
 AFG_amend_the_constitution:0 "Einführung weiterer Armeereformen"
 AFG_amend_the_constitution_desc:0 "Auch wenn die Stammesführer und Mitglieder der Loya Jirga dies nicht gutheißen mögen, ist es notwendig, begrenzte Armeereformen voranzutreiben. Die königliche [AFG.GetAdjektiv] Armee ist schwach, aber wenn wir diese Armeereformen vorantreiben, werden wir sie stärken!"
 AFG_the_generals_coup:0 "Aufhebung des Hasht Nafari"
 AFG_the_generals_coup_desc:0 "Vor vielen Jahren und Jahrzehnten, während der Herrschaft von Abdur Rahman Khan, dem großen Emir von [AFG.GetNonIdeologyName], wurde ein Abkommen zwischen der Regierung und den Stammesführern geschlossen. Dieses Abkommen, das als "Hasht Nafari" oder "Acht Personen" bezeichnet wird, besagt, dass jede von den Stammesführern ausgewählte achtköpfige Gruppe für eine gewisse Zeit im Militär dienen muss. Um die Armee zu modernisieren, muss dieses unausgesprochene Gesetz aufgehoben werden!"
 AFG_the_exiled_king:0 "Einführung neuer Steuern"
 AFG_the_exiled_king_desc:0 "Wo ist das Ende unserer Macht? [AFG.GetNonIdeologyName] ist unter König Muhammad Zahir Shah zu einer Diktatur geworden. Mit dem König an der Spitze scheint alles möglich zu sein. Hoffentlich wiederholt sich die Geschichte nicht, sonst könnte [AFG.GetNonIdeologyName] erneut auf dem Weg ins Chaos sein."
 AFG_university_in_herat:0 "Änderung der Verfassung von 1931"
 AFG_university_in_herat_desc:0 "Die Zeit ist endlich gekommen, König Muhammad Zahir Shah soll sich erheben und der König werden, zu dem sein Vater ihn erzogen hat! Die Loya Jirga, die Regentschaft, sie alle werden bald verschwunden sein, und der König wird [AFG.GetNonIdeologyName] erneut mit eiserner Faust führen! Mit nur einem Federstrich wird er zum Ruhm aufsteigen!"
 AFG_adopt_constitutional_monarchy:0 "Der Staatsstreich des Generals"
 AFG_adopt_constitutional_monarchy_desc:0 "[AFG.GetNonIdeologyName] ist derzeit tief gespalten. Einige sind nach wie vor treue Anhänger des Königs, während andere seinen Untergang kaum erwarten können. Daoud Khan, der die Chance gekommen sieht, hat seinen Staatsstreich im Stillen geplant und lauert im Verborgenen ..."
 AFG_treaty_of_saadabad:0 "Der verbannte König"
 AFG_treaty_of_saadabad_desc:0 "Da die Lage in [AFG.GetNonIdeologyName] katastrophal ist und sich von Minute zu Minute verschlimmert, scheint es, als könne niemand das Land aus den Klauen der Instabilität und des Unfriedens befreien ... [AFG.GetNonIdeologyName] ist für immer zu einem instabilen Schicksal verdammt! Es kursieren jedoch Gerüchte, dass der im Exil lebende König und Emir Amanullah Khan nach [AFG.GetNonIdeologyName] eingereist ist und plant, den König zu stürzen! Ob dies wirklich wahr ist, kann nur Gott sagen."
 AFG_nationalize_banks:0 "Gründung der Universität Herat"
 AFG_nationalize_banks_desc:0 "[AFG.GetNonIdeologyName] hat in Sachen Bildung nicht viel zu bieten. Deshalb ist es unsere Aufgabe, dies zu ändern! Durch die Gründung einer Universität in [415.GetName], einer sehr bevölkerungsreichen Stadt im Westen, hoffen wir, die allgemeine Bildungsqualität zu verbessern und unseren zukünftigen Studenten eine Alternative zur Universität Kabul zu bieten!"
 AFG_ban_political_parties:0 "Bekräftigung des konstitutionellen Monarchismus"
 AFG_ban_political_parties_desc:0 "Unter König Muhammad Zahir Shah wird [AFG.GetNonIdeologyName] zu einer konstitutionellen Monarchie mit alle vier Jahre stattfindenden Wahlen. Obwohl der König den Großteil seiner Macht behält, ist dies ein beachtlicher Fortschritt auf dem Weg zu einem demokratischen und freien [AFG.GetNonIdeologyName]!"
 AFG_disband_the_jirga:0 "Vertrag von Saadabad"
 AFG_disband_the_jirga_desc:0 "Die Länder des Nahen Ostens sind für [AFG.GetNonIdeologyName] von größter Bedeutung, da die politischen Veränderungen in diesen Ländern auch unsere Wirtschaft, unser Militär und unsere Politik stark beeinflussen können. Wir müssen uns dem Osten zuwenden! Vielleicht durch den Vorschlag eines Pakts der Freundschaft und des Nichtangriffs."
 AFG_amanullahs_visit_to_europe:0 "Verstaatlichung der [AFG.GetAdjective] Banken"
 AFG_amanullahs_visit_to_europe_desc:0 "Obwohl [AFG.GetNonIdeologyName] keinen großen Bankensektor besitzt, sollten wir die wenigen Banken, die in [AFG.GetNonIdeologyName] tätig sind, verstaatlichen. Durch die direkte Verwaltung des Bankensektors können wir unsere Wirtschaft hoffentlich effizienter verbessern."
 AFG_restore_the_constitution:0 "Politische Aktivitäten verbieten"
 AFG_restore_the_constitution_desc:0 "In dieser schweren Zeit für [AFG.GetNonIdeologyName] besteht keine Notwendigkeit für politische Pluralität! Die Zulassung mehrerer Parteien in [AFG.GetNonIdeologyName] wird nur zu weiterer Instabilität und Spaltung der Nation führen! Dies würde uns letztendlich in einen weiteren Bürgerkrieg führen ..."
 AFG_establish_radio_kabul:0 "Auflösung der Loya Jirga"
 AFG_establish_radio_kabul_desc:0 "Unsere Regierung hat die volle Unterstützung des Militärs, sodass wir die Loya Jirga ohne großen Widerstand der Stammesführer auflösen können. Wir hoffen, dass wir auf diese Weise die Nation weiter stabilisieren und den Einfluss der Stämme auf die Regierung vorübergehend beseitigen können!"
 AFG_export_based_economy:0 "Königliche Europareise"
 AFG_export_based_economy_desc:0 "Seit seiner Rückkehr nach [AFG.GetNonIdeologyName] vor nicht allzu langer Zeit plant Amanullah eine königliche Europareise. Amanullahs vorheriger Versuch, Europa zu bereisen, löste einen Bürgerkrieg in [AFG.GetNonIdeologyName] aus, während er im Ausland war. Hoffentlich wiederholt sich die Geschichte nicht!"
 AFG_subvert_soviet_influence_focus:0 "Wiederherstellung der Verfassung von 1921"
 AFG_subvert_soviet_influence_focus_desc:0 "Die Verfassung von 1921, die erste liberale Verfassung von [AFG.GetNonIdeologyName], die erklärte, dass jeder [AFG.GetAdjektiv] gleich behandelt werden sollte, unterstützte die Gleichberechtigung. Es ist wichtig, diese Werte auch in der neuen Verfassung beizubehalten!"
 AFG_army_reform:0 "Gründung von Radio Kabul"
 AFG_army_reform_desc:0 "Mit dem technologischen Fortschritt werden fortschrittlichere Methoden der Kommunikation mit den Menschen entdeckt. So haben wir mit der Erfindung des Radios die Möglichkeit, einen Radiosender einzurichten, den alle [AFG.GetNonIdeologyName] hören können! Dies wird uns bei unserem Ziel helfen, unsere politischen Ansichten und Informationen zu verbreiten!"
 AFG_the_non_aligned_movement:0 "Exportorientierte Wirtschaft"
 AFG_the_non_aligned_movement_desc:0 "Obwohl [AFG.GetNonIdeologyName] nicht viele Ressourcen besitzt, haben wir große Überschüsse an mechanischer Ausrüstung und anderen Fabrikwaren. Diese Überschüsse sollten natürlich gewinnbringend exportiert werden. Um unsere Wirtschaft zu stärken, müssen wir den Export unserer Waren fördern!"
 AFG_turkish_subsidized_factories:0 "Untergrabung des Einflusses von [SOV.GetAdjektiv]"
 AFG_turkish_subsidized_factories_desc:0 "Wir können nicht zulassen, dass die [SOV.GetAdjektiv] [AFG.GetNonIdeologyName] beeinflussen, da dies für unsere Regierung und Nation tödlich sein könnte. [AFG.GetNonIdeologyName] muss eine souveräne Nation mit einer eigenen unabhängigen Außenpolitik bleiben. Wir werden die Herren unseres eigenen Schicksals sein!"
 AFG_ally_with_the_young_afghans:0 "Mobilisierung der Armee"
 AFG_ally_with_the_young_afghans_desc:0 "Um jegliche ausländische Mächte von einer Invasion [AFG.GetNonIdeologyName] abzuhalten, müssen wir unsere Streitkräfte mobilisieren und die Einsatzbereitschaft unseres Militärs für mögliche Kriege verbessern."
 AFG_secular_education:0 "Die Bewegung der Blockfreien"
 AFG_secular_education_desc:0 "Viele Nationen auf dieser Welt stehen allein da, ohne Verbündete, blockfrei und neutral, könnte man sagen. Wir müssen eine Gemeinschaft für die blockfreien Nationen der Welt schaffen und uns so in diesen schwierigen Zeiten gegenseitig schützen! Für Frieden und Wohlstand!"
 AFG_the_hazara_question:0 "[TUR.GetAdjektiv] Subventionierte Fabriken"
 AFG_the_hazara_question_desc:0 "Mit der Fortsetzung unserer Politik der verstärkten Zusammenarbeit mit dem Nahen Osten sollten wir [TUR.GetAdjektiv] Investoren und Geschäftsleute einladen, Fabriken in [AFG.GetNonIdeologyName] zu subventionieren. Dies würde die wirtschaftliche Zusammenarbeit zwischen [AFG.GetNonIdeologyName] und [TUR.GetNameDef] immens steigern!"
 AFG_implement_autarky_daoud:0 "Verbündete die jungen Afghanen"
 AFG_implement_autarky_daoud_desc:0 "Die Jungen Afghanen sind eine politische Gruppe in [AFG.GetNonIdeologyName] und die treibende Kraft hinter der fortgesetzten Verwestlichung und Modernisierung von [AFG.GetNonIdeologyName]! König Amanullah unterhält seit seiner Krönung enge Beziehungen zu dieser Organisation. Seit dem Bürgerkrieg von 1929 sind diese Beziehungen jedoch angespannt. Wir müssen daran arbeiten, sie wiederherzustellen!"
 AFG_the_kabul_pact:0 "Einführung einer säkularen Bildung"
 AFG_the_kabul_pact_desc:0 "Es ist wichtig, Religion und Bildung voneinander zu trennen, da sich diese beiden in Kombination als tödliche Mischung erwiesen haben. Um die Bildung unserer Bevölkerung zu verbessern, müssen wir den Islam aus allen Klassenzimmern in [AFG.GetNonIdeologyName] entfernen!"
 AFG_self_determination_for_pakistan:0 "Die Hazara-Frage"
 AFG_self_determination_for_pakistan_desc:0 "Religiöse Unterschiede innerhalb von [AFG.GetNonIdeologyName] bestehen in der Tat immer noch. Die Hazaras sind eine Volksgruppe, die in [1009.GetName] lebt und hauptsächlich Schiiten sind. Um Kämpfe innerhalb der Gruppe zu verhindern, müssen wir die schiitischen und sunnitischen Gemeinschaften von [AFG.GetNonIdeologyName] vereinen. Kein Glaube im Islam ist minderwertig!"
 AFG_continue_railway_development:0 "Autarkie umsetzen"
 AFG_continue_railway_development_desc:0 "Wir müssen Autarkie umsetzen, um wirtschaftliche Selbstversorgung zu erreichen und unsere Abhängigkeit von externen Ressourcen zu verringern. Durch die Förderung der heimischen Industrie und die Priorisierung der lokalen Produktion wollen wir die Widerstandsfähigkeit unserer Nation angesichts globaler wirtschaftlicher Unsicherheiten stärken."
 AFG_attaturks_legacy:0 "Der Kabul-Pakt"
 AFG_attaturks_legacy_desc:0 "Heute werden wir das vorletzte Ziel erreichen, den Nahen Osten unter einem Banner, unter einem gemeinsamen Ziel zu vereinen! Durch die Unterzeichnung des Kabuler Pakts mit der Türkei, dem Irak und dem Iran werden wir die bestehenden Gräben, die uns trennen, überbrücken und wieder zu einer wichtigen Kraft in der Regionalpolitik werden!"
 AFG_deal_with_the_devil:0 "Selbstbestimmung"
 AFG_deal_with_the_devil_desc:0 "Die üppigen Ebenen und die hohen Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, zu versuchen, diese Gebiete einzubeziehen. Vielleicht können wir dies erreichen, indem wir ein Referendum in [442.GetName] von der [GetRajAdjektiv] fordern!"
 AFG_maintain_neutrality:0 "Eisenbahnausbau fortsetzen"
 AFG_maintain_neutrality_desc:0 "Das [AFG.GetAdjektiv] Eisenbahnnetz ist praktisch nicht vorhanden, da nur einige kleinere Eisenbahnen in [AFG.GetNonIdeologyName] existieren, die schlecht gewartet werden. Wir müssen unsere Pläne zur Anbindung der Nation fortsetzen! Je besser unsere Bevölkerung vernetzt ist, desto weniger Spaltung gibt es unter ihnen!"
 AFG_form_the_afghan_red_crescent:0 "Das Vermächtnis Atatürks ehren"
 AFG_form_the_afghan_red_crescent_desc:0 "Der verstorbene Mustafa Kemal Atatürk, Revolutionär, General und Vater der Türkei. Er hat viel für sein Land getan und geopfert. Amanullah kann nur danach streben, für [AFG.GetNonIdeologyName] zu erreichen, was Atatürk bereits für die Türkei erreicht hat! Amanullah soll sein Vermächtnis weiterführen!"
 AFG_reclaim_our_land:0 "Mit dem Teufel im Bunde"
 AFG_reclaim_our_land_desc:0 "Manchmal muss man mit dem Teufel im Bunde sein, um seine Ziele zu erreichen. Um unser verlorenes Land in [PAK.GetNonIdeologyName] zurückzugewinnen und [AFG.GetNonIdeologyName] wieder groß zu machen, müssen wir uns mit dem Feind unseres Feindes verbünden. Schließlich ist der Feind meines Feindes mein Freund, oder?"
 AFG_greater_afghanistan:0 "Neutralität wahren"
 AFG_greater_afghanistan_desc:0 "[AFG.GetNonIdeologyName] ist seit dem Krieg von 1919, als es seine Unabhängigkeit durch einen brutalen und blutigen Konflikt gegen das damals größte und fortschrittlichste Imperium, das Britische Empire, erlangte, neutral. Was nicht kaputt ist, muss man nicht reparieren."

 ######## FASCIST FOCUSES ######## "In diesen schweren Zeiten müssen wir menschlich bleiben und helfen. Helfen Sie den Menschen in [AFG.GetNonIdeologyName], die ein Dach über dem Kopf oder medizinische Behandlung benötigen. Wir müssen die [AFG.GetAdjective] Rothalbmond-Gesellschaft gründen! Per humanitatem ad pacem!"

 AFG_contact_faqir:0 "Die üppigen Ebenen und die hohen Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete mit [AFG.GetNonIdeologyName] zu vereinen, um unser Volk vor der schrecklichen Misshandlung und dem Kolonialismus zu schützen, denen es seit Jahrhunderten ausgesetzt ist!"
 AFG_contact_faqir_desc:0 "Groß-Afghanistan"
 AFG_waaidu:0 "Endlich ist der Traum eines vereinten Landes für alle [AFG.GetAdjektiv] wahr geworden. Dies ist unser Land und es ist an der Zeit, dass wir die Welt wissen lassen, dass wir dafür kämpfen und sterben werden. Ehre sei Afghanistan!"
 AFG_waaidu_desc:0 ""
 AFG_contact_tribes:0 ""
 AFG_contact_tribes_desc:0 ""
 AFG_invite_jamaat_islami:0 "Das Vermächtnis des Aufstands in Khost"
 AFG_invite_jamaat_islami_desc:0 "In den letzten zwei Jahrzehnten der Unabhängigkeit [AFG.GetAdjective] von [ENG.GetAdjective] hat [AFG.GetNonIdeologyName] viele Aufstände, Aufruhre und Staatsstreiche erlebt, darunter den Aufstand in Khost im Jahr 1924 gegen die radikalen Reformen von König Amanullah. Auch wenn der Aufstand damals niedergeschlagen worden sein mag, lebt der Geist weiter."
 AFG_maududi_as_sheikhulislam:0 "Wa'aidu!"
 AFG_maududi_as_sheikhulislam_desc:0 "Wa'aidu ist ein Zitat aus dem Koran, das, einfach übersetzt, "Sei bereit" bedeutet. Wir haben lange genug auf diesen Moment gewartet, und jetzt ist es endlich soweit: Das Volk [AFG.GetAdjektiv] wird sich gegen die Diktatur erheben, die von den Tyrannen in Kābul aufgezwungen wurde, und der König wird nicht mehr herrschen! Allahu Akbar!"
 AFG_mirzali_as_emir:0 "Sichern Sie sich die Unterstützung der Stämme"
 AFG_mirzali_as_emir_desc:0 "Die isolierten Stämme, die keine politischen Sorgen haben und keine Ahnung von Politik haben, da diese hauptsächlich in Kabul stattfindet, sind sehr daran interessiert, unseren Kampf zu verfolgen, mit dem Versprechen von Reichtum, der Rückkehr der Scharia und der Rücknahme der radikalen Reformen, die von der Regentschaft durchgeführt wurden."
 AFG_widen_perspective_of_religion:0 "Kontakt Abul A'la al-Maududi"
 AFG_widen_perspective_of_religion_desc:0 "Abul A'la al-Maududi ist ein sehr bekannter Theologe und islamischer Gelehrter in [PAK.GetNonIdeologyName], er könnte sich als sehr nützlich in unserem Kampf erweisen, die Menschen zu mobilisieren und unseren Dschihad gegen den König und seine Regierung zu legitimieren."
 AFG_persecute_hazaras:0 "Die Führung der Jamiat"
 AFG_persecute_hazaras_desc:0 "Ohne Abul A'la al-Maududi hätte der Funke der Rebellion nicht gezündet und die Menschen in [AFG.GetNonIdeologyName] würden für immer unter einem tyrannischen Regime leben. Seine großartigen organisatorischen Fähigkeiten haben uns alle zusammengebracht, um für unsere Überzeugungen und unsere Traditionen zu kämpfen! Er muss zum Scheich ernannt werden!"
 AFG_the_constitution_question:0 "Der Goldene Emir"
 AFG_the_constitution_question_desc:0 "Haji Mirzali Khan hat sich als treu gegenüber dem Volk von [AFG.GetNonIdeologyName] erwiesen und auf dem Schlachtfeld mit großer Tapferkeit und Leidenschaft gegen unsere Feinde gekämpft. Aus diesem Grund wurde er von vielen in unseren Reihen gelobt und verehrt! Die einzige Möglichkeit, ihn für das, was er für den Kampf und unsere Sache getan hat, zu belohnen, besteht darin, ihn zum Emir des Islamischen Emirats von [AFG.GetNonIdeologyName] zu ernennen!"
 AFG_tulaia_mutaharrika:0 "Die Perspektive der Religion erweitern"
 AFG_tulaia_mutaharrika_desc:0 "In seiner letzten Predigt erklärte der Prophet, dass kein Mensch dem anderen überlegen sei, außer im Glauben, und die schiitische Bevölkerung der Hazara hisst das Banner der Einheit Gottes, genau wie wir, und deshalb müssen wir über unsere Unterschiede hinwegsehen und ihnen die gleichen Rechte und Möglichkeiten einräumen, insbesondere beim Militärdienst."
 AFG_mix_sciences_with_religion:0 "Hazara vom Militärdienst ausschließen"
 AFG_mix_sciences_with_religion_desc:0 "Die Hazara-Schiiten sind sehr unzuverlässig, da sie unseren Staat mehrfach verraten haben, und sie sind kultischer als unser eigener Glaube an den Islam. Daher wäre es klug, sie nicht im Militärdienst einzusetzen, da dies nicht nur zu einer moralischen Katastrophe führen, sondern auch in Zukunft politische Probleme mit sich bringen könnte."
 AFG_international_mujahideen:0 "Entwurf einer islamischen Verfassung"
 AFG_international_mujahideen_desc:0 "Eine Verfassung in unserem Land mag für einige zunächst verwirrend klingen, wenn man bedenkt, dass unsere islamischen Lehren die Scharia befürworten. Eine Verfassung oder irgendeine Form von Gesetz ist jedoch notwendig, um die Ordnung im Land und die Rechte der Menschen zu wahren. Dennoch wird die Scharia das oberste Gesetz von [AFG.GetNameDefCap]"
 AFG_you_cannot_kill_a_believer:0 "Auf den Spuren von Tulaia Mutaharrika"
 AFG_you_cannot_kill_a_believer_desc:0 "Die Tulaia Mutaharrika, oder "Mobile Wache" auf Arabisch, waren Eliteeinheiten der frühen Rashidun-Kalifate, und um die Tugend und die Anbetung, die für Gott kämpft, weiter zu verbreiten, werden wir mit der Rekrutierung und Ausbildung dieser Elitetruppen beginnen."
 AFG_utilize_the_sufis:0 "Religiöse und wissenschaftliche Bildung miteinander verbinden"
 AFG_utilize_the_sufis_desc:0 "Wir treten in die Fußstapfen vieler Theologen wie Hassan al-Banna, Said Nursi und Shakib Arslan, die sich für einen Lehrplan einsetzen, der eine Mischung aus Religion und Wissenschaft ist, und dass sich diese nicht gegenseitig ausschließen. Wir werden diese Ideen umsetzen und die Trennung zwischen Medresse und Schule aufheben, auch wenn dies möglicherweise nicht möglich ist, da wir bereits einigen starrköpfigen Ulema Bildungsbefugnisse erteilt haben."
 AFG_tunganistan:0 "Internationale Mudschaheddin"
 AFG_tunganistan_desc:0 "Um den afghanischen Einfluss in der Region zu vergrößern, werden wir unsere Mudschaheddin ins Ausland schicken, um unsere Brüder in anderen Teilen der Welt zu unterstützen!"
 AFG_request_german_reinforcements:0 "Religiösen Fanatismus stärken"
 AFG_request_german_reinforcements_desc:0 "Um unseren Einfluss und unsere Kontrolle über die Armee zu stärken und Tapferkeit und Moral aufrechtzuerhalten, werden wir Kampagnen zur Ermutigung und Indoktrination unserer Truppen starten, bis sie keine Angst mehr vor dem Schlachtfeld haben!"
 AFG_seize_royal_assets:0 "Die Sufis nutzen"
 AFG_seize_royal_assets_desc:0 ""
 AFG_kabul_military_college:0 "Befreit die Muslime im Osten"
 AFG_kabul_military_college_desc:0 "Seit vielen Jahren leidet das Volk der Uiguren unter dem [CHI.GetAdjektiv]-Regime, aber damit ist jetzt Schluss! Wir müssen unsere Brüder von ihren Unterdrückern befreien. Wir müssen den Bedürftigen helfen, und im Gegenzug wird uns geholfen werden."
 AFG_german_equipment:0 "Militärische Unterstützung anfordern"
 AFG_german_equipment_desc:0 "Das Militär [AFG.GetAdjektiv] kann sich nicht als modern bezeichnen, geschweige denn als stark. Es besteht größtenteils aus Stammessöldnern und Kriegern, die untrainiert und schlecht ausgerüstet sind. Es scheint jedoch, dass die [DEU.Adjektiv] bereit wären, uns bei der Verbesserung unseres Militärs zu helfen. Vielleicht sollten wir um Unterstützung bitten?"
 AFG_support_the_palestinians:0 "Königlichen Besitz beschlagnahmen"
 AFG_support_the_palestinians_desc:0 "Nachdem der König feige aus dem Land geflohen ist, hat er einen Großteil seines Privatbesitzes und seiner Vermögenswerte in [AFG.GetNonIdeologyName] zurückgelassen. Wir sollten diese Vermögenswerte beschlagnahmen und neu verteilen, da der König sie eindeutig nicht mehr benötigt."
 AFG_invite_amin_al_husseini:0 "Eröffnung der Militärschule in Kabul"
 AFG_invite_amin_al_husseini_desc:0 "Der [AFG.GetAdjektiv] Militärstab ist unerfahren, viele sind ungebildet und verstehen nicht einmal die grundlegendsten Aspekte der Kriegsführung. Wir müssen eine Militärakademie eröffnen, um unseren Militärstab auszubilden und zu verbessern."
 AFG_approach_mubashir:0 "Kauf von [GER.GetAdjektiv] Ausrüstung"
 AFG_approach_mubashir_desc:0 "Die Rüstungsindustrie [AFG.GetNonIdeologyName]s ist weitgehend unterentwickelt und kann den Bedarf der [AFG.GetNonIdeologyName] Streitkräfte nicht decken. Daher ist [AFG.GetNonIdeologyName] gezwungen, militärische Ausrüstung im Ausland zu kaufen. Wir könnten ein lukratives Waffengeschäft mit den [GER.GetNonIdeologyName]s abschließen."
 AFG_form_the_turkestan_legion:0 "Unterstützung der Palästinenser"
 AFG_form_the_turkestan_legion_desc:0 ""
 AFG_nationalize_spiznar:0 "Amin al-Husseini einladen"
 AFG_nationalize_spiznar_desc:0 "Der Großmufti von Jerusalem hat [AFG.GetNonIdeologyName] bereits viele Male besucht. Wir könnten ihn noch einmal einladen, diesmal, um in [AFG.GetNonIdeologyName] zu bleiben und den [PAL.GetAdjektiv] Widerstand von [AFG.GetNonIdeologyName] aus zu leiten und vielleicht auch der [AFG.GetNonIdeologyName]-Regierung zu helfen."
 AFG_cooperate_with_hazaras:0 "Kontaktaufnahme mit Mubashir al-Tarazi"
 AFG_cooperate_with_hazaras_desc:0 "Nachdem Mubashir al-Tarazi im April 1930 aus Kasachstan verbannt worden war, suchte er Zuflucht in [AFG.GetNonIdeologyName], wo er seinen Widerstand gegen die [SOV.GetAdjektiv] fortsetzen konnte. Während der Regierungszeit von Nadir Schah wurden ihm hohe Positionen übertragen und er genoss hohes Ansehen. Es ist von entscheidender Bedeutung, dass wir seine Unterstützung gewinnen."
 AFG_form_muslim_youth:0 "Gründung der Turkestanischen Legion"
 AFG_form_muslim_youth_desc:0 "Die in Zentralasien lebenden Turkvölker werden seit der Oktoberrevolution von den [SOV.GetAdjektiv] unterdrückt. Ihr Recht, den Islam zu glauben und zu praktizieren, wurde ihnen genommen. Wir müssen den rebellischen Geist dieser Menschen wiedererwecken!"
 AFG_eradicate_communism:0 "Verstaatlichung der Baumwollindustrie"
 AFG_eradicate_communism_desc:0 "Die Sherkat-e Ettehadiya-ye Velayat-e Shomal beschäftigt mehr als 12.000 Menschen. Wenn die Fabrik in die Hände der Regierung übergeht, würden wir viele Vorteile genießen, und das [AFG.GetAdjektiv] Volk auch."
 AFG_revive_the_basmachi_movement:0 "Zusammenarbeit mit den Hazaras"
 AFG_revive_the_basmachi_movement_desc:0 "Religiöse Unterschiede innerhalb [AFG.GetNonIdeologyName] bestehen in der Tat noch immer. Die Hazaras sind eine Bevölkerungsgruppe, die in [1009.GetName] lebt und hauptsächlich Schiiten sind. Um Kämpfe innerhalb der Gruppe zu verhindern, müssen wir die schiitischen und sunnitischen Gemeinschaften von [AFG.GetNonIdeologyName] vereinen. Keine Glaubensrichtung im Islam ist minderwertig!"
 AFG_end_the_revolution:0 "Gründung der Muslim Youth"
 AFG_end_the_revolution_desc:0 "Um den Islam zu verbreiten, müssen wir die Saat des Islam in den Köpfen der Jugend säen. Die Gründung einer Jugendorganisation wäre dabei sehr effektiv und nützlich."
 AFG_the_fate_of_imperialism:0 "Ausrottung des Kommunismus"
 AFG_the_fate_of_imperialism_desc:0 "Ist der Kommunismus wirklich die Wurzel allen Übels? Wir wissen es nicht, aber es ist besser, wir finden es nicht auf die harte Tour heraus, schließlich fürchten Menschen Dinge, die sie nicht verstehen. Daher ist es am besten, wir beseitigen diese böse Lehre, um der Menschheit willen, oder?"
 AFG_proclaim_pashtunistan:0 "Die Basmatschi-Bewegung wiederbeleben"
 AFG_proclaim_pashtunistan_desc:0 "Die in Zentralasien lebenden Turkvölker werden seit der Oktoberrevolution von den [SOW. GetAdjektiv] unterdrückt. Ihr Recht, den Islam zu glauben und zu praktizieren, wurde ihnen genommen. Wir müssen den rebellischen Geist dieser Menschen wiedererwecken! Erhebt euch, Brüder!"
 AFG_pillars_of_islam:0 "Beendet die Revolution"
 AFG_pillars_of_islam_desc:0 "Der Kommunismus ist eine verwerfliche Ideologie, die nichts als Tod und Zerstörung bringt, wo auch immer sie Fuß fasst, oder zumindest glauben wir das. Es ist unsere Pflicht, dem Kommunismus ein für alle Mal ein Ende zu setzen und zu verhindern, dass Menschen auf der ganzen Welt in Zukunft unter seinem Deckmantel leiden. Wir müssen die [SOV.GetAdjektiv] Bedrohung im Norden bekämpfen!"
 AFG_enforce_the_pashtunwali:0 "Das Schicksal des Imperialismus"
 AFG_enforce_the_pashtunwali_desc:0 "Im vergangenen Jahrhundert wurde [AFG.GetNonIdeologyName] von Imperialisten in [ENG.Capital.GetCapitalVictoryPointName] und [SOV.Capital.GetCapitalVictoryPointName] viele Male missbraucht und überfallen. Wir werden uns diesen imperialen Mächten nicht länger unterwerfen, die Zeit für Rache ist gekommen!"
 AFG_islamic_cooperation:0 "Förderung des Paschtunismus"
 AFG_islamic_cooperation_desc:0 "Endlich ist der Traum eines vereinten Landes für alle Paschtunen wahr geworden. Dies sind unsere Länder und es ist an der Zeit, dass wir die Welt wissen lassen, dass wir dafür kämpfen und sterben werden. Es lebe Paschtunistan!"
 AFG_the_ten_lost_tribes:0 "Die Säulen des Islam"
 AFG_the_ten_lost_tribes_desc:0 "Wir müssen uns auf den Kern unserer Religion konzentrieren und darauf, was uns von anderen unterscheidet. Um ein Haus zu bauen, braucht man ein starkes Fundament. Dies gilt auch für den Islam."
 AFG_return_of_the_king:0 "Durchsetzung des Paschtunwali"
 AFG_return_of_the_king_desc:0 "Der Paschtunwali ist ein Kodex oder eine vollständige Lebensweise des paschtunischen Volkes. Er hat viel mit dem Islam gemeinsam, der Gerechtigkeit und Tapferkeit predigt, aber auch viele andere wichtige Werte, die die paschtunische Kultur ausmachen. Um die öffentliche Ordnung aufrechtzuerhalten, müssen wir diese Werte durchsetzen."
 AFG_peace_through_islam:0 "Verbesserung der interislamischen Zusammenarbeit"
 AFG_peace_through_islam_desc:0 "Getrennt sind wir schwach, vereint sind wir stark. Wenn der Islam gedeihen soll, müssen wir die wirtschaftliche Zusammenarbeit zwischen unseren Verbündeten durch mehr Handel und Investitionen verbessern."
 AFG_approach_pakistani_resistance:0 "Rache für die zehn verlorenen Stämme"
 AFG_approach_pakistani_resistance_desc:0 "Die Ursprünge des paschtunischen Volkes sind unbekannt. Einige glauben, dass die Paschtunen Nachkommen der Hunnen sind, während andere glauben, dass wir die Nachkommen der Paktyer sind. Eine Legende hat sich jedoch über Jahrhunderte hinweg gehalten, nämlich dass die Paschtunen ihren Ursprung in den zehn verlorenen Stämmen Israels haben. Wenn dies tatsächlich der Fall ist, haben wir Anspruch auf das Land Israel als unsere Heimat."
 AFG_global_islamic_revolution:0 "Die Rückkehr des Königs"
 AFG_global_islamic_revolution_desc:0 "König Amanullah wurde seit dem Bürgerkrieg der Sakkawiten im Jahr 1929 ins Exil geschickt. Es ist an der Zeit, ihn wieder nach [AFG.GetNonIdeologyName] einzuladen, hoffentlich hat er seine Lektion gelernt."
 AFG_german_junker_purchase:0 "Islam in einer Nation"
 AFG_german_junker_purchase_desc:0 "Es gibt keinen anderen Weg zum Weltfrieden als die vollständige Vereinigung aller Menschen unter dem Islam. Nur durch Allah können wir vollkommenen Frieden und Wohlstand für die Menschheit erreichen."
 AFG_bury_the_hatchet:0 "Nähern Sie sich dem [PAK.GetAdjektiv] Widerstand"
 AFG_bury_the_hatchet_desc:0 "Unsere muslimischen Brüder im Süden sind immer noch von den Imperialisten besetzt! Wir müssen über die Durand-Linie marschieren und sie von ihren Fesseln befreien. Brüder, erhebt euch!"
 AFG_in_alexanders_footsteps:0 "Fortsetzung der dritten Waziristan-Kampagne"
 AFG_in_alexanders_footsteps_desc:0 "Ein Dschihad gegen die Imperialisten ist der einzige Weg, um unsere Völker zu vereinen. Viele Schlachten wurden in der Vergangenheit geschlagen und viele müssen noch geschlagen werden, bis alle Paschtunen wieder vereint sind. Heute werden wir kämpfen und unser Leben in Seinem Namen geben, morgen werden wir gedeihen."
 AFG_break_the_six_arrows:0 "Kauf von Junkers"
 AFG_break_the_six_arrows_desc:0 "Die Luftwaffe ist praktisch nicht existent. Um sie zu verbessern, müssen wir ausländische Flugzeuge kaufen. Vielleicht können uns die Deutschen dabei helfen. Schließlich hat Afghanistan bereits viele Luftfahrttechniker und Piloten."

 ######## DECISIONS ######## "Religiöse Unterschiede innerhalb des Islams existieren noch immer, die Perser sind eine Gruppe von Menschen, die hauptsächlich Schiiten sind. Um Kämpfe untereinander zu verhindern, müssen wir die schiitischen und sunnitischen Gemeinschaften Persiens und [AFG.GetNonIdeologyName] vereinen. Keine Glaubensrichtung im Islam ist minderwertig!"

 AFG_reinstall_the_king:0 "Es war einmal vor fast zwei Jahrtausenden, als Alexander der Große mit seinen Phalanxen durch diese Länder marschierte. Auf diesen Ländereien schritt er, während er sie eroberte. Sein Vermächtnis hat unsere Kultur und Geschichte stark geprägt."
 AFG_invite_fakhri_pasha:0 "Zerschmettert die sechs Pfeile des Kemalismus"
 AFG_imprison_political_opponents:0 "Säkularismus ist eine Schande für die Erde. Die Trennung der Regierung vom Islam ist sowohl lächerlich als auch verachtenswert. Wir müssen diese Ideologie wie Unkraut aus einem Garten ausrotten!"
 AFG_rescind_the_turkish_afghan_defense_treaty:0 ""

 AFG_for_what_was_taken_from_us:0 ""
 AFG_for_what_was_taken_from_us_desc:0 "Den [AFG.GetAdjektiv] König wieder einsetzen"
 AFG_reintegrate_peshawar:0 "Fakhri Pascha einladen"
 AFG_restore_pashtun_rule_in_quetta:0 "Politische Gegner einsperren"
 AFG_cooperate_with_the_balochis:0 "Den [TUR.GetAdjektiv]-[AFG.GetAdjektiv] Verteidigungsvertrag aufkündigen"
 AFG_pashtunize_karachi:0 ""
 AFG_integrate_the_railway_network:0 "für das, was uns genommen wurde ..."
 AFG_proclaim_pashtunsitan_decision:0 "Die kulturellen, religiösen und traditionellen Bindungen, die die Menschen der fruchtbaren Indus-Ebene mit [AFG.GetNonIdeologyName] teilen, sind unbestreitbar und stellen nur das Ergebnis einer jahrhundertelangen Verbindung dar, die zwischen diesen Ländern entstanden ist. Das Einzige, was unsere Völker wirklich trennt, sind imaginäre Linien auf imaginären Karten ..."

