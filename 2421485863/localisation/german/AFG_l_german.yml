 # INFILTRATE PAKISTAN # ""
AFG_inflitrate_pakistan_category:0				"Paschtunischer Widerstand in [PAK.GetNonIdeologyName]"
AFG_inflitrate_pakistan_category_desc:0				"Die üppigen Ebenen und steilen Berge von [PAK.GetNonIdeologyName] dienten als Wiege der paschtunischen Zivilisation. Die paschtunische Kultur und Lebensweise hat sich vor vielen tausend Jahren in dieser Region entwickelt! Doch bis zum heutigen Tag leidet unser Volk unter dem Druck fremder Mächte. Aber keine Sorge, unsere Zeit ist endlich gekommen!"
