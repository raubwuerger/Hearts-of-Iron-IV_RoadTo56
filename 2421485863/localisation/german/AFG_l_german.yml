 # afghanistan.80.t:0 "Der Limonadenverkäufer"
 # afghanistan.80.d:0 "Für Ayub war es ein ganz normaler Tag. Er war durch die engen Straßen von Kābul gelaufen und hatte seine Limonade verkauft: Limonade! Kaufen Sie sie hier, Leute! Nur 30 Afghanis!. Als der Tag langsam verging, konnte Ayub nicht umhin festzustellen, dass er fast seine gesamte Limonade verkauft hatte, was nicht alltäglich war. Als die Sonne hinter dem fernen Horizont unterging, war es für ihn an der Zeit, nach Hause zu gehen. Auf dem Weg nach Hause fragte er sich jedoch, ob die Menschen in [AFG.GetNonIdeologyName] tatsächlich reicher werden, oder ob der heutige Tag wirklich nur ein Zufall war? \n\n Während er durch das Fenster seines Zimmers auf die Anfänge blickte, begann er langsam in das Reich der Träume abzudriften, und so lösten sich diese Gedanken allmählich in der dichten und heißen Luft auf... morgen ist nur ein weiterer Tag..."
 # afghanistan.80.a:0 "Sehr interessant..."































 ######## FOCUSES ######## ""

AFG_first_loya_jirga:0				"Die [GetYear] Loya Jirga"
AFG_first_loya_jirga_desc:0				"Die Loya Jirga, was einfach aus dem Paschtunischen übersetzt 'Großer Rat' bedeutet, ist eine uralte und primitive Methode zur Lösung von Problemen in [AFG.GetNonIdeologyName]. Loya Jirga's werden in der Regel von den Staatsoberhäuptern veranstaltet, um Unterstützung für Reformen oder Krönungen zu erhalten. Anwesend sind verschiedene Stammesführer aus ganz [AFG.GetNonIdeologyName], die jeweils ihren eigenen Stamm vertreten und um ihre eigenen Interessen kämpfen..."
AFG_handle_the_king:0				"Erledigen Sie den König"
AFG_handle_the_king_desc:0				"Irgendetwas ist mit dem König nicht in Ordnung... Es ist zu spüren, dass sich etwas verändert hat... Er ist nicht mehr desinteressiert an der Politik im Königreich... Tatsächlich hat er sich selbst für viele der Reformen eingesetzt, die während der Loya Jirga vorgeschlagen wurden... Vielleicht sind seine Ansichten zu modern, zu ehrgeizig, zu destabilisierend für dieses arme Land... Es muss etwas getan werden..."
AFG_power_to_the_king:0				"Alle Macht dem König"
AFG_power_to_the_king_desc:0				"Während ein weiterer Tag, ein weiterer Monat, ein weiteres Jahr vergeht, scheint es den Menschen in [AFG.GetNonIdeologyName], dass sich nichts ändert und auch nicht ändern wird, solange die Menschen selbst nicht wollen, dass sich etwas ändert. Veränderung ist die Mutter allen Übels und des Guten, wenn sich also nichts ändert, tut das niemandem weh, oder? Und so geht die Zeit weiter, und der Status Quo wird beibehalten..."

 ######## ECONOMY FOCUSES ######## ""

AFG_begin_westernization:0				"Den ersten Siebenjahresplan fortsetzen"
AFG_begin_westernization_desc:0				"Wenn [AFG.GetNonIdeologyName] seine Landwirtschaft nicht modernisiert und industrialisiert, würde seine Wirtschaft von anderen Ländern abhängig bleiben, was wiederum die Unabhängigkeit von [AFG.GetNonIdeologyName] gefährden könnte. Die Industrialisierung ist entscheidend für das Überleben unseres Staates und die Verbesserung unserer Wirtschaft!"
AFG_start_the_second_seven_year_plan:0				"Starten Sie den zweiten Siebenjahresplan"
AFG_start_the_second_seven_year_plan_desc:0				""
AFG_import_electronics:0				"Elektronik importieren"
AFG_import_electronics_desc:0				"[AFG.GetNameDefCap] muss viel Elektronik aus anderen Nationen wie [GER.GetName] oder [SOV.GetName] importieren, wenn wir unsere öffentlichen Arbeiten und unsere Verwaltung verbessern und von der uns zur Verfügung stehenden Technik lernen wollen."
AFG_rural_schools:0				"Verbessern Sie die ländliche Bildung"
AFG_rural_schools_desc:0				"Die ländlichen Regionen, die von Kābul und der zentralen Verwaltung von [AFG.GetNameDefCap] abgekoppelt sind, tragen am meisten zu dem Analphabetenproblem bei, mit dem [AFG.GetNameDefCap] derzeit zu kämpfen hat. Wir müssen unsere Methoden der ländlichen Bildung verbessern."
AFG_develop_hydroelectric_power:0				"Entwickeln Sie die Wasserkraft"
AFG_develop_hydroelectric_power_desc:0				""
AFG_aquire_foreign_machinery:0				"Ausländische Maschinen anschaffen"
AFG_aquire_foreign_machinery_desc:0				""
AFG_improve_national_infra:0				"Die nationale Infrastruktur verbessern"
AFG_improve_national_infra_desc:0				""
AFG_bolster_the_textile_industry:0				"Die Textilindustrie ausbauen"
AFG_bolster_the_textile_industry_desc:0				"[AFG.GetNonIdeologyName] hatte vor dem Bürgerkrieg 1929 und dem Sturz von Amanullah Khan eine bedeutende Textilindustrie. Die Wiederbelebung und Stärkung der Textilindustrie könnte sich als wichtiges Bindeglied für den Erfolg bei der Verbesserung der [AFG.GetAdjective] Wirtschaft erweisen!"
AFG_monopolize_the_karakul_trade:0				"Monopolisieren Sie den Karakul-Handel"
AFG_monopolize_the_karakul_trade_desc:0				""
AFG_railroad_development:0				"Verbinden Sie die Nation"
AFG_railroad_development_desc:0				"[AFG.GetNameDefCap] ist eine abgeschnittene Nation ohne Eisenbahnen und ohne Wissen darüber. Wir müssen an der Verbesserung des Eisenbahnnetzes arbeiten, wenn wir die Wirtschaft effizienter machen und den Warenfluss aufrechterhalten wollen."
AFG_expand_university:0				"Erweitern Sie die Kābul Universität"
AFG_expand_university_desc:0				"Die Kābul Universität ist seit 1932 geöffnet und hat viele Menschen gesehen. Es gibt eine große Nachfrage nach Bildung in diesem Land und wir müssen sie befriedigen, weshalb der Ausbau der Universität von Kābul ein guter Anfang ist."
AFG_expand_the_directorate_of_mines:0				"Erweiterung der Bergbaudirektion"
AFG_expand_the_directorate_of_mines_desc:0				"[AFG.GetNameDefCap] ist ein Land, das sehr reich an Ressourcen wie Stahl, Öl und Chrom ist. Wir können dies zu unserem Vorteil nutzen und ausländische Unternehmen einladen, in dieses Land zu kommen und unsere Ressourcen zu fördern und so unsere Wirtschaft zu verbessern."
AFG_explore_helmand_uranium_deposits:0				"Erkunden Sie die Uranvorkommen in Helmand"
AFG_explore_helmand_uranium_deposits_desc:0				""
AFG_rejuvenate_the_gold_mines:0				"Verjüngen Sie die Goldminen"
AFG_rejuvenate_the_gold_mines_desc:0				""
AFG_intensify_copper_mining:0				"Intensivierung des Kupferabbaus"
AFG_intensify_copper_mining_desc:0				""
AFG_womens_education:0				"Bildung für Frauen"
AFG_womens_education_desc:0				"Gegenwärtig werden in allen afghanischen Schulen nur Männer aufgenommen, etwa 80-90% der Schulen sind reine Männerschulen. Wir müssen auch die Frauen von [AFG.GetNonIdeologyName] ausbilden."
AFG_afghanistan_bank:0				"Eröffnen Sie die Bank von [AFG.GetNonIdeologyName]"
AFG_afghanistan_bank_desc:0				"Der Bankensektor von [AFG.GetNameDefCap] hat sich in den vergangenen Jahren kaum verbessert. Mit der Eröffnung der 'Da [AFG.GetNonIdeologyName] Bank', einer neuen Zentralbank des Landes, werden wir in der Lage sein, unseren Bankensektor und unsere Wirtschaft zu verbessern."
AFG_free_trade_focus:0				"Öffnen Sie die Märkte"
AFG_free_trade_focus_desc:0				"[AFG.GetNameDefCap] war über weite Strecken seiner Geschichte ein sehr isolierter Staat und es ist an der Zeit, dass wir das ändern. [AFG.GetNonIdeologyName] muss seine Märkte für die Welt öffnen, wenn wir mehr Investoren und Menschen anziehen wollen."
AFG_coffee_plantations:0				"Kaffeeplantagen"
AFG_coffee_plantations_desc:0				"[AFG.GetNonIdeologyName] ist ein perfekter Ort für Kaffeeplantagen, und davon brauchen wir jede Menge. Wir müssen unser Land voll ausnutzen, wenn wir unsere Wirtschaft verbessern wollen."
AFG_begin_rearmament:0				"Beginnen Sie die Aufrüstung"
AFG_begin_rearmament_desc:0				""
AFG_establish_ammunition_factories:0				"Munitionsfabriken wiederaufbauen"
AFG_establish_ammunition_factories_desc:0				""
AFG_kabul_arsenal:0				"Wiederbelebung des Kābul-Arsenals"
AFG_kabul_arsenal_desc:0				"[AFG.GetNonIdeologyName] fehlt es an qualifiziertem Personal und den notwendigen Ressourcen für die Produktion von militärischer Ausrüstung. Wir müssen jedoch daran arbeiten, unsere militärischen Produktionskapazitäten zu verbessern, denn das würde uns eine größere Unabhängigkeit von ausländischen Mächten ermöglichen, die bisher die einzige Waffenquelle für [AFG.GetNonIdeologyName] waren."
AFG_the_nomad_population:0				"Integrieren Sie die Nomadenbevölkerung"
AFG_the_nomad_population_desc:0				"Es gibt viele Menschen in [AFG.GetNonIdeologyName], die die moderne Lebensweise abgelehnt haben. Diese Nomaden machen einen großen Prozentsatz der Bevölkerung aus, beteiligen sich aber nicht an der Wirtschaft von [AFG.GetNonIdeologyName]. Es wäre also klug, die große Zahl der Nomaden endlich in die Wirtschaft einzubeziehen und sie damit zu stärken."
AFG_afghan_miracle:0				"Das [AFG.GetAdjective]-Wunder"
AFG_afghan_miracle_desc:0				"Nach vielen Jahren, in denen wir langsam in unsere Wirtschaft investiert und sie durch diese harten Zeiten geführt haben, ist [AFG.GetNameDefCap] stärker denn je und hat auch etwas vorzuweisen!"

 ######## MILITARY FOCUSES ######## ""

AFG_afghan_royal_army:0				"[GetAfghanArmyFocusName]"
AFG_afghan_royal_army_desc:0				"[GetAfghanArmyFocusDesc]"
AFG_afghan_royal_army_army:0				"Königliche [AFG.GetAdjective] Armee"
AFG_afghan_royal_army_army_desc:0				"Die Königliche [AFG.GetAdjective] Armee ist so alt wie [AFG.GetNameDef] selbst und wurde bereits im 18. Die Königliche Armee von [AFG.GetNonIdeologyName] hat sich in ihrer Vergangenheit vielen Herausforderungen gestellt. Sie hat viele Kriege geführt und gewonnen, wie zum Beispiel den Dritten Anglo-Afghanischen Krieg, in dem [AFG.GetNonIdeologyName] seine Unabhängigkeit erlangte und die [ENG.GetAdjective] vertrieb!"
AFG_afghan_army_focus:0				"[AFG.GetAdjective] Bewaffnete Streitkräfte"
AFG_afghan_army_focus_desc:0				"Die [AFG.GetAdjective] Streitkräfte sind so alt wie [AFG.GetNameDef] selbst und wurden bereits im 18. Jahrhundert gegründet. Die [AFG.GetAdjective] Armed Forces haben in ihrer Vergangenheit viele Herausforderungen gemeistert. Sie haben viele Kriege geführt und gewonnen, wie zum Beispiel den Dritten Anglo-Afghanischen Krieg, in dem [AFG.GetNonIdeologyName] seine Unabhängigkeit erlangte und die [ENG.GetAdjective] vertrieb!"
AFG_army_modernization:0				"Modernisierung der Armee fortsetzen"
AFG_army_modernization_desc:0				"Die [GetAfghanArmyFocusName] hat veraltete Ausrüstung, es fehlt an ausgebildeten Soldaten und ist insgesamt in einem desolaten Zustand. Eine Militärreform ist notwendig, um die [GetAfghanArmyFocusName] zu einer modernen Armee auszubauen, die es auch mit den technologisch fortschrittlichsten Armeen der Welt aufnehmen kann. Die Zeit für die Modernisierung ist jetzt!"
AFG_army_status_quo:0				"Beibehaltung des Status Quo"
AFG_army_status_quo_desc:0				"Harte und schnelle Veränderungen in [AFG.GetNameDefCap] haben erwiesenermaßen viele schreckliche Folgen, bei denen viele Menschen gestorben sind und die Nation gelitten hat. Wir können es uns nicht leisten, wegen solcher Veränderungen erneut einen Bürgerkrieg zu riskieren, der Status Quo muss erhalten bleiben!"
AFG_form_the_paratrooper_brigade:0				"Soldaten des Himmels"
AFG_form_the_paratrooper_brigade_desc:0				"Da wir nach dem Kauf von Flugzeugen der [ENG.GetAdjective] vor nicht allzu langer Zeit bereits über einige Kenntnisse in der Luft verfügen, sollten wir eine spezielle Fallschirmjägereinheit aufstellen, um unsere militärischen Fähigkeiten zu verbessern!"
AFG_legacy_of_cavalrymen:0				"Das Vermächtnis der Kavalleristen"
AFG_legacy_of_cavalrymen_desc:0				"Das Erbe der [AFG.GetNonIdeologyName] Kavallerie und der Einsatz von Pferden im Militär reichen bis in die Zeit vor vielen tausend Jahren zurück. Unsere Vorfahren waren große Kavalleristen, wir werden in ihre Fußstapfen treten!"
AFG_arms_purchase:0				"Ausrüstung kaufen"
AFG_arms_purchase_desc:0				"[AFG.GetNameDefCap] hat die Möglichkeit, [ENG.GetAdjective] oder [SOV.GetAdjective] Ausrüstung zu kaufen, um seine Armee zu versorgen, aber wir müssen vorsichtig sein, bei wem wir kaufen, denn es könnte gefährlich sein, uns an einen Lieferanten zu binden!"
AFG_tank_purchase:0				"Importieren Sie ausländische Panzer"
AFG_tank_purchase_desc:0				"Der Import von [SOV.GetAdjective] Panzern wäre für die Nation von großem Nutzen und wir könnten die Panzer studieren und sie in unseren eigenen Fabriken produzieren!"
AFG_develop_domestic_designs:0				"Entwickeln Sie einheimische Designs"
AFG_develop_domestic_designs_desc:0				"[AFG.GetNameDefCap] war nicht in der Lage, eigene Gewehre und militärische Ausrüstung zu produzieren, aber es ist an der Zeit, dass sich das ändert. Wir müssen einheimische Hersteller fördern und mit der Produktion unserer eigenen Waffen beginnen, um unser Land unabhängig von ausländischem militärischem Einfluss zu machen!"
AFG_motorized_research:0				"Motorisieren Sie das Militär"
AFG_motorized_research_desc:0				"[AFG.GetNameDefCap] verlässt sich hauptsächlich auf seine Kavallerie für schnelle Angriffe und Vorstöße, aber auch für die Versorgung der Armee. Durch die Motorisierung der Armee können wir eine bessere Versorgung und schnellere Vorstöße und Angriffe erreichen, um den Feind zu überrumpeln!"
AFG_improve_our_logistics:0				"Verbessern Sie unsere Logistik"
AFG_improve_our_logistics_desc:0				""
AFG_prussians_orient:0				"Preußen des Orients"
AFG_prussians_orient_desc:0				"[AFG.GetNameDefCap] hat sein Militär stark verbessert und sich damit sogar den Titel Preußen des Orients verdient, der ihm von vielen Ausländern verliehen wurde. [AFG.GetNameDefCap] hat eine glänzende militärische Zukunft vor sich!"
AFG_first_afghani_navy:0				"Erstens [AFG.GetAdjective] Marine"
AFG_first_afghani_navy_desc:0				"[AFG.GetNameDefCap] hat sich Zugang zum Meer verschafft, nun ist es an der Zeit, es zu beherrschen und eine Seemacht zu werden. Dazu müssen wir uns auf den Ausbau unserer Marinehäfen und Dockanlagen entlang der Küste konzentrieren!"
AFG_build_convoys:0				"Erweitern Sie die Handelsflottille"
AFG_build_convoys_desc:0				"Jetzt, da wir eine Küstenlinie erreicht haben, können wir uns auf den Seehandel mit ausländischen Mächten konzentrieren, was uns eine Menge Geld einsparen wird. Ohne guten Schutz könnten diese Handelsschiffe jedoch viele Menschenleben verlieren."
AFG_submarines:0				"Entwickeln Sie eine U-Boot-Flotte"
AFG_submarines_desc:0				"Was [AFG.GetNameDefCap] braucht, ist eine U-Boot-Flotte, die zum Abfangen von Handelsgeschäften und für viele andere Stealth-Missionen eingesetzt werden kann."
AFG_destroyers:0				"Entwickeln Sie eine Zerstörerflotte"
AFG_destroyers_desc:0				"Eine Flotte von Zerstörern, die zum Minenlegen und für den Nahkampf eingesetzt werden können, ist das, was [AFG.GetNameDefCap] braucht."
AFG_cruisers:0				"Entwickeln Sie Kreuzer"
AFG_cruisers_desc:0				"[AFG.GetNameDefCap] braucht eine Flotte von leichten Kreuzern, die zum Schutz unserer anderen Seestreitkräfte und im Nahkampf eingesetzt werden können."
AFG_battleships:0				"Schlachtschiffe entwickeln"
AFG_battleships_desc:0				"[AFG.GetNameDefCap] braucht eine Flotte von Schlachtschiffen, die zum Schutz unserer anderen Seestreitkräfte und für den Fernkampf eingesetzt werden können."
AFG_naval_building:0				"Förderung des zivilen Schiffbaus"
AFG_naval_building_desc:0				"Die Förderung des Schiffbaus wird uns helfen, gute lokale Hersteller zu finden, die bereit sind, die Regierung von [AFG.GetNameDefCap] zu unterstützen."
AFG_under_the_radar:0				"Unter dem Radar kreuzen"
AFG_under_the_radar_desc:0				"Um eine effiziente U-Boot-Einsatztruppe zu entwickeln, müssen wir an der Verbesserung und Ausbildung unserer Schiffsbesatzungen arbeiten. Auf diese Weise werden wir hoffentlich sicher unter dem Radar der feindlichen Schiffe kreuzen und sie von innen heraus zerstören!"
AFG_protect_our_convoys:0				"Studieren Sie die Anti-U-Boot-Kriegsführung"
AFG_protect_our_convoys_desc:0				"Wir müssen uns nicht auf die Zerstörung feindlicher Schiffe konzentrieren, sondern auf den Schutz unserer eigenen Konvois und unserer Handelsschiffe. Das wird unserer Wirtschaft helfen und den Seehandel fördern!"
AFG_naval_defense_fund:0				"Richten Sie einen Verteidigungsfonds für die Marine ein"
AFG_naval_defense_fund_desc:0				"Wir sollten den Haushalt wieder ins Gleichgewicht bringen und einen Marineverteidigungsfonds einrichten, aus dem wir unsere Schiffbau-Eskapaden finanzieren werden. Wir müssen erhebliche Maßnahmen ergreifen, um unsere Marinepräsenz und -stärke zu erhalten oder sogar zu erhöhen!"
AFG_naval_bombers:0				"Verbessern Sie die Marine-Luft-Koordination"
AFG_naval_bombers_desc:0				"Um in Seeschlachten einen Vorteil zu erlangen, müssen wir die Überlegenheit in der Luft gegenüber den Gefechtsfeldern aufrechterhalten. Daher müssen wir an der Aufstellung eines eigenen Luftgeschwaders aus Marinebombern und -jägern arbeiten!"
AFG_royal_air_force:0				"[GetAfghanAirFocusName]"
AFG_royal_air_force_desc:0				"[GetAfghanAirFocusDesc]"
AFG_royal_air_force_royal:0				"Königliche [AFG.GetAdjective] Luftwaffe"
AFG_royal_air_force_royal_desc:0				"Die Königliche [AFG.GetAdjective] Luftwaffe wurde 1921 gegründet und hat in den letzten fünfzehn Jahren eine kleine Anzahl von Flugzeugen und ausländischen Technikern und Bedienern angehäuft. Leider wurde ein großer Teil der [AFG.GetAdjective] Flugzeuge abgeschossen oder verschrottet, was auf die jüngsten Kriege zurückzuführen ist, wie z.B. den [AFG.GetAdjective] Bürgerkrieg, der 1929 stattfand."
AFG_air_force_focus:0				"Die [AFG.GetAdjective] Luftwaffe"
AFG_air_force_focus_desc:0				"Die [AFG.GetAdjective] Air Force wurde 1921 gegründet und hat in den letzten fünfzehn Jahren eine kleine Anzahl von Flugzeugen und ausländischen Technikern und Bedienern angehäuft. Leider wurde ein großer Teil der [AFG.GetAdjective] Flugzeuge abgeschossen oder verschrottet, was auf die jüngsten Kriege zurückzuführen ist, wie z.B. den [AFG.GetAdjective] Bürgerkrieg, der 1929 stattfand."
AFG_train_our_personnel_abroad:0				"Unser Personal im Ausland ausbilden"
AFG_train_our_personnel_abroad_desc:0				""
AFG_import_planes:0				"Kaufen Sie ausländische Flugzeuge"
AFG_import_planes_desc:0				""
AFG_invite_foreign_instructors:0				"Ausländische Ausbilder einladen"
AFG_invite_foreign_instructors_desc:0				""
AFG_import_italian_fighters:0				"[ITA.GetAdjective]-gefertigte Kampfflugzeuge"
AFG_import_italian_fighters_desc:0				"Während eines Wettbewerbs mit der [ENG.GetNameDefCap] hat uns [ITA.GetNameDefCap] ein Paket von [ITA.GetAdjective] CR.32-Jagdflugzeugen und mehrere qualifizierte Bediener und Techniker angeboten, um seine Märkte in [AFG.GetNameDefCap] zu erweitern"
AFG_import_british_fighters:0				"[ENG.GetAdjective]-gefertigte Bomber"
AFG_import_british_fighters_desc:0				"Während eines Wettbewerbs mit den [ITA.GetNameDefCap] hat uns [ENG.GetNameDefCap] ein Paket von [ENG.GetAdjective] Fairey Gordon Leichtbombern und mehrere qualifizierte Operatoren und Techniker angeboten, um seine Märkte in [AFG.GetNameDefCap] zu erweitern. [AFG.GetNameDefCap] hat in der Vergangenheit bei den [ENG.GetAdjective] gekauft, die sich als sehr gute Geschäftspartner erwiesen haben."
AFG_kabul_air_college:0				"Eröffnen Sie die Kābul Aviation Academy"
AFG_kabul_air_college_desc:0				"[AFG.GetNameDefCap] muss seine eigenen Techniker ausbilden, um nicht auf ausländische angewiesen zu sein, die jederzeit beeinflusst und abberufen werden können, eine Fliegerakademie in Kābul muss eröffnet werden!"
AFG_purhcase_czech_weaponry:0				"Kaufen Sie [CZE.GetAdjective] Waffen"
AFG_purhcase_czech_weaponry_desc:0				""
AFG_redesign_military_curriculum:0				"Neugestaltung des militärischen Curriculums"
AFG_redesign_military_curriculum_desc:0				""
AFG_develop_the_tank_industry:0				"Entwickeln Sie die Panzerindustrie"
AFG_develop_the_tank_industry_desc:0				""
AFG_bolster_national_arms_manufacturing:0				"Nationale Rüstungsproduktion ausbauen"
AFG_bolster_national_arms_manufacturing_desc:0				""
AFG_finance_army_mechanization:0				"Finanzierung der Mechanisierung der Armee"
AFG_finance_army_mechanization_desc:0				""
AFG_introduce_new_uniforms:0				"Neue Uniformen einführen"
AFG_introduce_new_uniforms_desc:0				""
AFG_know_thy_enemy:0				"Kenne deinen Feind"
AFG_know_thy_enemy_desc:0				""
AFG_modernize_military_hospitals:0				"Militärkrankenhäuser modernisieren"
AFG_modernize_military_hospitals_desc:0				""
AFG_study_the_blitzkrieg:0				"Manövrierfähige Kriegsführung studieren"
AFG_study_the_blitzkrieg_desc:0				""
AFG_victory_through_firepower:0				"Sieg durch Feuerkraft"
AFG_victory_through_firepower_desc:0				""
AFG_expand_military_airports:0				"Militärflughäfen ausbauen"
AFG_expand_military_airports_desc:0				""
AFG_the_242nd_parachute_battalion:0				"Das 242. Fallschirmjägerbatallion"
AFG_the_242nd_parachute_battalion_desc:0				""

 ######## COMMUNIST FOCUSES ######## ""

AFG_form_weekh_zalmian:0				"Die Weekh Zalmiān"
AFG_form_weekh_zalmian_desc:0				"Die Weekh Zalmiān ist eine sozialistische politische Bewegung in [AFG.GetNonIdeologyName] unter der Führung von Mawlana Qiamuddin Khadim, einem bekannten Dichter, und Dr. Abdulrahman Mahmudi, einem Arzt. Die Bewegung fordert eine umfassende Modernisierung und mehr Rechte für Frauen und ist in eine pro-[SOV.GetAdjective] und eine anti-[SOV.GetAdjective] Fraktion, die Khalq und Parcham, gespalten."
AFG_approach_the_soviets:0				"Annäherung an die [SOV.GetAdjective]"
AFG_approach_the_soviets_desc:0				"Die Annäherung an die [SOV.GetAdjective]s ist entscheidend für einen Putsch gegen den König. Nur mit Gewalt und ausländischer Unterstützung können wir die derzeitige Regierung stürzen und durch unsere eigene ersetzen."
AFG_form_worker_communes:0				"Gewerkschaften gründen"
AFG_form_worker_communes_desc:0				"Das [AFG.GetAdjective] Volk muss aufgeklärt werden, wenn es um seine sozialen und beruflichen Rechte geht. Durch die Gründung von Gewerkschaften und Arbeitergenossenschaften werden wir dem Volk die Augen öffnen, dass die Regierung die Arbeiter von [AFG.GetNonIdeologyName] völlig missachtet und vernachlässigt."
AFG_utilize_the_military:0				"Setzen Sie das Militär ein"
AFG_utilize_the_military_desc:0				""
AFG_depose_the_king:0				"Nieder mit dem König!"
AFG_depose_the_king_desc:0				"Der Tag ist endlich gekommen, an dem das von der Bourgeoisie errichtete autoritäre Regime ein Ende findet und die Flammen der Revolution in ganz [AFG.GetNonIdeologyName] brennen und ein revolutionäres Komitee unter der Führung von Mawlana Qiamuddin Khadim eingesetzt wird!"
AFG_national_front:0				"Die Nationale Front"
AFG_national_front_desc:0				"Die Nationale Befreiungsfront, kurz NLB, ist eine politische Koalition, die viele ihrer Ansichten mit der Parcham-Fraktion unter Führung von Mawlana Qiamuddin Khadim und Ghulam Muhammad Ghubar von der Demokratischen Volkspartei von [AFG.GetNonIdeologyName] teilt."
AFG_soviet_expedition:0				"Laden Sie [SOV.GetAdjective] Gesandte ein"
AFG_soviet_expedition_desc:0				"Die [SOV.GetAdjective] waren sehr interessiert an dem jüngsten kommunistischen Putsch in [AFG.GetNonIdeologyName], der die Bourgeoisie abgesetzt und das Proletariat an ihre Stelle gesetzt hat. Sie haben militärische, wirtschaftliche und politische Unterstützung angeboten, vielleicht sollten wir auf ihr Angebot eingehen."
AFG_purge_the_bourgeoisie:0				"Säubern Sie die Bourgeoisie"
AFG_purge_the_bourgeoisie_desc:0				"Nach dem Putsch in [AFG.GetNonIdeologyName] ist ein großer Teil der feigen Bourgeoisie aus dem Land geflohen und hat Zuflucht in [PAK.GetNonIdeologyName] und im Iran gesucht, weil sie Angst davor haben, was ihnen unter dem neuen Regime passieren könnte, während sie versuchen, ihren Reichtum zu bewahren, aber wir müssen uns mit dem immer noch bedeutenden Teil befassen, der beschlossen hat, im Land zu bleiben."
AFG_form_khad:0				"Die KhAD einrichten"
AFG_form_khad_desc:0				"Jedes kommunistische Regime benötigt eine Möglichkeit, das Volk in Schach zu halten, wenn es aus der Reihe tanzt. Durch die Gründung der Khadamat-e Aetla'at-e Dawlati können wir dies tun und die Sicherheit des Staates aufrechterhalten."
AFG_arrest_qiamuddin:0				"Säubern Sie die Parchamiten"
AFG_arrest_qiamuddin_desc:0				"Der Führer der Parcham, Mawlana Qiamuddin Khadim, kann sich als sehr gefährlich für unser Regime erweisen. Es ist äußerst wichtig, dass wir uns mit ihm auf jede erdenkliche Weise auseinandersetzen und ihn von der politischen Bühne entfernen."
AFG_socialist_education:0				"Islam und Marxismus verschmelzen"
AFG_socialist_education_desc:0				"Der Islam, auch wenn er nicht die Gedanken und Ansichten des Marxismus widerspiegelt, ist ein gutes Instrument zur Orientierung. Wir sollten darauf hinarbeiten, den Islam zu bewahren und ihn mit unserer eigenen Ideologie zu vereinen, die Zusammenarbeit mit den Madrasas wird sicherlich den Weg dafür ebnen."
AFG_begin_colectivization:0				"Beginnen Sie mit der industriellen Kollektivierung"
AFG_begin_colectivization_desc:0				"Der Landwirtschafts- und Industriesektor des Landes erweist sich als sehr einfach und traditionell, mit alten Werkzeugen und Techniken. Damit unsere Wirtschaft floriert, müssen wir sie modernisieren und unseren Landwirtschafts- und Industriesektor mit neuen modernen Geräten und Produktionsmethoden ausstatten."
AFG_universal_suffarage:0				"Den Status der Frauen aufwerten"
AFG_universal_suffarage_desc:0				"In den zerklüfteten Bergen von [AFG.GetNonIdeologyName] hat sich eine entschlossene Gruppe von Menschen auf den Weg gemacht, um eine neue Ära einzuleiten. Vor dem Hintergrund alter Traditionen bahnten sie sich einen Weg zum allgemeinen Wahlrecht, bei dem die Stimme eines jeden Afghanen wie ein kräftiger Windstoß durch die Täler fegte und das demokratische Schicksal einer Nation prägte, die sich nach einer integrativen Regierungsführung sehnte."
AFG_give_hazara_rights:0				"Schutz der Rechte der Hazara"
AFG_give_hazara_rights_desc:0				"Das Volk der Hazara, das überwiegend in [1009.GetName] lebt, war von der Regierung sehr isoliert. Da [AFG.GetNonIdeologyName] ein sehr abgelegenes Land ist, ist es schwer, alle Stämme zu erreichen. Wenn wir den Hazara mehr Rechte geben, hoffen wir, die Revolution und den marxistischen Gedanken auch zu ihnen zu bringen."
AFG_crush_hazara_nationalism:0				"Hazara-Nationalismus unterdrücken"
AFG_crush_hazara_nationalism_desc:0				"Da die Hazara-Stämme sehr abgelegen im Land leben, kommen sie nicht in Kontakt mit anderen Stämmen, geschweige denn mit der Regierung. Das bedeutet, dass sie ihren Stammes- und Nationalismus bewahrt haben und die Revolution in [AFG.GetNonIdeologyName] nicht vollständig angenommen haben."
AFG_marxist_thought:0				"Marxistisches Gedankengut zementieren"
AFG_marxist_thought_desc:0				"Um eine neue Generation von [AFG.GetAdjective] Freidenkern heranzuziehen, müssen wir das marxistische Denken in den Köpfen der einfachen [AFG.GetAdjective] Menschen zementieren. Nur wenn wir die Eltern ermutigen, ihre Kinder zu erziehen, können wir unser Ziel erreichen, unsere nächsten Generationen auf die schlimmen Zeiten vorzubereiten, die schließlich kommen werden!"
AFG_socialist_constitution:0				"Formalisieren Sie die neue Verfassung"
AFG_socialist_constitution_desc:0				"Da [AFG.GetNonIdeologyName] ein abgelegenes Land ist, dem ein Rechtssystem fehlt und das auch nicht über die Mittel verfügt, es durchzusetzen, sollten wir eine andere Verfassung anstreben, aber eine sozialistischere."
AFG_invite_pakistani_military:0				"Laden Sie [PAK.GetAdjective] Sympathisanten ein"
AFG_invite_pakistani_military_desc:0				"Wir müssen [PAK.GetAdjective] kommunistische Generäle und Offiziere einladen, sich unserer Sache anzuschließen, um die Revolution im ganzen Orient zu verbreiten.Vereint!"
AFG_reform_the_education_system:0				"Reformieren Sie das Bildungssystem"
AFG_reform_the_education_system_desc:0				"Auch wenn [AFG.GetNonIdeologyName] vielleicht nicht die beste Ausbildung bietet, so können wir doch die politischen Ansichten der nächsten Generationen prägen, indem wir die Saat der Revolution in ihre Köpfe pflanzen - die Revolution wird niemals aussterben."
AFG_persecute_believers:0				"Staatlichen Atheismus durchsetzen"
AFG_persecute_believers_desc:0				"Der Kommunismus und der Islam können nicht nebeneinander existieren, da der jeweils andere von Natur aus böse ist, weil er versucht, die menschliche Bevölkerung und den Fortschritt der Menschheit zu kontrollieren. Schließlich wurden alle Religionen von der Bourgeoisie für die Bourgeoisie gegründet."
AFG_afghan_ssr:0				"Das Knie beugen"
AFG_afghan_ssr_desc:0				"Der Klassenkampf ist die ultimative Spaltung der Völker, es gibt keine größere Spaltung als die des Klassenkampfes, deshalb müssen wir die beiden Revolutionen in [AFG.GetNonIdeologyName] und [SOV.GetNonIdeologyName] zu einer vereinen, indem wir eine sowjetische sozialistische Republik werden, geben wir unsere Freiheit und Autonomie auf, aber das wird die Revolution letztlich verlängern."
AFG_incorporate_tajikistan:0				"Lösen Sie die Tadschikistan-Frage"
AFG_incorporate_tajikistan_desc:0				"Die tadschikischen und paschtunischen Stämme haben jahrhundertelang sowohl innerhalb als auch außerhalb der Grenzen von [AFG.GetNonIdeologyName] koexistiert, aber mit der kürzlichen Integration der tadschikischen SSR in [AFG.GetNameDefCap] müssen wir daran arbeiten, die Zusammenarbeit zwischen unseren beiden Völkern zu verbessern. Indem wir den Tadschiken bestimmte Zugeständnisse machen, würden wir die Gunst der Tadschiken gewinnen, anders als das vorherige Regime in [SOV.Capital.GetCapitalVictoryPointName]."
AFG_loyalty_to_moscow:0				"Loyalität gegenüber [SOV.Capital.GetCapitalVictoryPointName]"
AFG_loyalty_to_moscow_desc:0				"[SOV.GetNameDefCap] hat sich als guter Verbündeter des [AFG.GetAdjective]-Volkes erwiesen, indem es geholfen hat, das Regime in [AFG.GetNonIdeologyName] aufrechtzuerhalten und die Wirtschaft unserer einst armen Nation zu verbessern. Daher können wir uns nur dafür entscheiden, unser Versprechen gegenüber unserem Volk zu halten und der Regierung in [SOV.Capital.GetCapitalVictoryPointName] gegenüber loyal zu bleiben."
AFG_afghan_workers_program:0				"Starten Sie das Worker's Exchange Programm"
AFG_afghan_workers_program_desc:0				"Die [SOV.GetAdjective] und [AFG.GetAdjective] sind eng miteinander verbunden, seit [AFG.GetNonIdeologyName] 1919 nach dem Dritten Anglo-[AFG.GetAdjective] Krieg seine Unabhängigkeit erlangte. Nach der Integration unserer Nation in die Union haben wir diese Verbindungen nur noch verstärkt, durch den Austausch und die Entsendung unserer Arbeiter ins Ausland werden wir die Zusammenarbeit und die Verbindungen zwischen unseren beiden Nationen noch einmal verbessern."
AFG_our_own_path:0				"Gründet die [AFG.GetAdjective] Sozialistische Front"
AFG_our_own_path_desc:0				"Es ist an der Zeit, dass sich die Revolutionen unter dem Banner der [AFG.GetNonIdeologyName] vereinigen. Mit der Gründung der [AFG.GetAdjective] Sozialistischen Front wollen wir die Revolution in die Nachbarländer tragen, aber nicht unter dem Banner der [SOV.GetAdjective], eine neue Flamme wird im gesamten Nahen Osten und in Zentralasien entzündet werden, und die in [SOV.Capital.GetCapitalVictoryPointName] wird erlöschen!"
AFG_persian_socialism:0				"Die Dschungelbewegung wiederbeleben"
AFG_persian_socialism_desc:0				"Wir müssen die Flammen der Revolution in Persien entfachen und so die Saat des Sozialismus und Kommunismus in den fruchtbaren Boden der [PER.GetAdjective] Herzen und Köpfe säen. Es ist unsere Pflicht, die Augen der [PER.GetAdjective] Menschen zu öffnen!"
AFG_soviet_menace:0				"Enthüllen Sie den Unterleib des Bären"
AFG_soviet_menace_desc:0				"[AFG.GetNonIdeologyName] befindet sich in einer unglaublich nützlichen Position, von der aus die Invasion von [SOV.GetNameDef] völlig mühelos und einfach ist. Wir können unsere geographische Lage zu unserem Vorteil nutzen und die [SOV.GetAdjective] dort treffen, wo es ihnen am meisten weh tut: direkt in den Bauch des Bären!"
AFG_revolution_through_belief:0				"Revolution durch Frieden!"
AFG_revolution_through_belief_desc:0				"Der Kommunismus ist keine Ideologie des Krieges und des Blutvergießens, sondern eine Ideologie, die zu Frieden, Brüderlichkeit und Gleichheit unter allen aufruft. Es sind nur die Extremisten, die die gewaltsame Verbreitung des Kommunismus durch Krieg und das Vergießen des Blutes unserer Brüder vorschlagen!"
AFG_revolution_through_force:0				"Revolution durch Blut!"
AFG_revolution_through_force_desc:0				"Der Kommunismus kann nur mit Gewalt verbreitet werden. Es gibt Kommunisten, die glauben, dass der Kommunismus durch Frieden verbreitet werden muss, indem sie zu Brüderlichkeit und Einheit unter allen Menschen aufrufen, aber das ist einfach unwahr und würde uns zum endgültigen Ende des Kommunismus führen!"
AFG_secure_the_corridor:0				"Sichern Sie den Wakhan-Korridor"
AFG_secure_the_corridor_desc:0				"Der Wakhan-Korridor, das Gebiet, das [AFG.GetNonIdeologyName] und Tunganistan verbindet, wurde [AFG.GetNonIdeologyName] zugesprochen, um die [ENG.GetAdjective] Kolonialbesitzungen in [RAJ.GetNonIdeologyName] und die zentralasiatischen Gebiete Russlands im 19. Jahrhundert zu trennen. Wir müssen diesen Korridor sichern, indem wir ihn ausbauen, um die regionale Stabilität zu erhalten!"
AFG_socialist_economic_union:0				"Verbessern Sie die wirtschaftliche Zusammenarbeit"
AFG_socialist_economic_union_desc:0				"Damit unsere Volkswirtschaften noch schneller wachsen können als bisher, müssen wir die Steuern auf Importe und Exporte aus unseren sozialistischen Nachbarländern senken oder sogar ganz abschaffen. Dies wird wiederum unseren Volkswirtschaften sehr zugute kommen."
AFG_socialist_welfare:0				"Modernisieren Sie den [ROOT.GetAdjective] Wohlfahrtsstaat"
AFG_socialist_welfare_desc:0				"Auch wenn wir eine kommunistische Nation sind, gibt es immer noch Klassenunterschiede. Deshalb ist es von größter Bedeutung, dass wir den Wohlfahrtsstaat für die Unterschicht, das Proletariat, einführen. Alle [AFG.GetAdjective]s vereint unter einem Banner in unserem Kampf gegen den Kapitalismus!"
AFG_the_perso_afghan_union:0				"Einheit durch Glaube!"
AFG_the_perso_afghan_union_desc:0				"Die [AFG.GetAdjective] und die [PER.GetAdjective] sind sich sehr ähnlich, das geht so weit, dass unsere beiden Nationen prinzipiell einem Land ähneln, das in föderale Aras aufgeteilt ist. Es ist also gar nicht so schwer, den kleinen Schritt zu tun, um unsere beiden Länder endlich vollständig zu vereinen! Alle [AFG.GetAdjective]s und [PER.GetAdjective]s, vereint, unter einem Banner, unter einer Ideologie, unter einem Glauben!"
AFG_land_redistribution:0				"Verabschieden Sie das Agrarreformgesetz"
AFG_land_redistribution_desc:0				"Der große Teil der Bourgeoisie, der die Nation auf der Suche nach Zuflucht in den benachbarten kapitalistischen Ländern verlassen hat, hat auch große Mengen seines Landes zurückgelassen. Wir können dieses Land den Bauern und Arbeitern von [AFG.GetNonIdeologyName] geben, die es kultivieren und den Agrarsektor unserer Nation verbessern werden, wobei man wissen muss, dass dieses Land größtenteils unfruchtbar ist und nicht für landwirtschaftliche Zwecke genutzt werden kann."
AFG_into_pakistan:0				"Ziehen Sie die Durand-Linie neu"
AFG_into_pakistan_desc:0				"Die üppigen Ebenen und hoch aufragenden Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete mit [AFG.GetNonIdeologyName] zu vereinen, um unser Volk vor den schrecklichen Misshandlungen und dem Kolonialismus zu schützen, dem es seit Jahrhunderten ausgesetzt ist!"
AFG_anti_fascist_league:0				"Der antifaschistische Schutzwall"
AFG_anti_fascist_league_desc:0				"[AFG.GetNonIdeologyName] muss als Bollwerk gegen jeden Faschismus im Orient und darüber hinaus stehen! Wir müssen die Ausbreitung des Faschismus um jeden Preis verhindern, egal wie viele Menschenleben das kosten mag!"
AFG_operation_coutenance:0				"Die [SOV.GetAdjective]-[AFG.GetAdjective] Invasion von [PER.GetNonIdeologyName]"
AFG_operation_coutenance_desc:0				"Um die Südfront zu sichern, müssen wir uns zuerst um das [PER.GetAdjective]-Problem kümmern. Neben der Sicherung lebenswichtiger Nachschublinien und verteidigungsfähiger Stellungen könnte sich die Eroberung der großen Ölreserven im Norden Persiens als sehr nützlich für uns erweisen."
AFG_five_year_plan:0				"Der Fünfjahresplan"
AFG_five_year_plan_desc:0				"Nachdem wir Wirtschaftsexperten hinzugezogen haben, ist nun endlich die Zeit für den ersten Fünfjahresplan in [AFG.GetNonIdeologyName] gekommen. Dieser wird unsere Wirtschaft erheblich ankurbeln und [AFG.GetNonIdeologyName] auf den Weg bringen, eine entwickelte und wohlhabende Nation zu werden!"
AFG_combined_training:0				"[SOV.GetAdjective]-[AFG.GetAdjective] Militärische Ausbildung"
AFG_combined_training_desc:0				"Die [AFG.GetAdjective] Armee besteht größtenteils aus unausgebildeten Stammesangehörigen und Kriegern. Durch gemeinsame Übungen mit der [SOV.GetAdjective] Roten Armee werden unsere Soldaten die dringend benötigte Kampferfahrung sammeln und das Gleiche gilt für unsere Militärkommandeure."
AFG_undermine_moscow:0				"Untergraben Sie [SOV.Capital.GetCapitalVictoryPointName]"
AFG_undermine_moscow_desc:0				"Seit unserer Unterwerfung unter [SOV.GetNameDef] wurde [AFG.GetNonIdeologyName] vernachlässigt und beiseite geschoben. Nun, das werden wir nicht länger dulden! Die Zeit ist reif für [AFG.GetNonIdeologyName]s Aufstieg und [SOV.Capital.GetCapitalVictoryPointName]s anschließenden Fall!"
AFG_sabotage_soviet_railways:0				"Sabotage [SOV.GetAdjective] Eisenbahnen"
AFG_sabotage_soviet_railways_desc:0				"Damit unsere Invasion gegen die [SOV.GetAdjective] erfolgreich sein kann, müssen wir ihre Nachschublinien unterbrechen, indem wir ihre Eisenbahnen sabotieren. Wir werden Spreng- und Sabotageteams losschicken, um ihre Gleise in die Luft zu jagen. Das wird die Versorgung ihrer Truppen sehr erschweren und uns einen leichten Einmarsch in ihr Gebiet ermöglichen."
AFG_seize_gun_stockpiles:0				"Beschlagnahme von [SOV.GetAdjective] Waffenlagern"
AFG_seize_gun_stockpiles_desc:0				"Jede Armee benötigt Ausrüstung, um ihre Soldaten zu versorgen, und das tun wir auch. Wenn das also tatsächlich der Fall ist, warum beschlagnahmen wir dann nicht die Ausrüstung unserer baldigen Feinde in [SOV.GetNameDef]. Da wir enge Untertanen der [SOV.GetAdjective] sind, ist das auch viel einfacher."
AFG_end_soviet_rule:0				"Ende der [SOV.GetAdjective]-Herrschaft"
AFG_end_soviet_rule_desc:0				"Nachdem wir die Vorbereitungen für unsere Invasion in Zentralasien abgeschlossen haben, ist nun endlich die Zeit gekommen, unsere Brüder im Norden aufzurufen, die Waffen gegen die Tyrannei von [SOV.GetNameDef] zu ergreifen! Brüder, erhebt euch, für eure Freiheit!"
AFG_ministry_for_propogation_of_virtue:0				"Das Ministerium für die Propagierung der Tugend"
AFG_ministry_for_propogation_of_virtue_desc:0				"Die Verbreitung von Tugend und die Verhinderung von Lastern ist ein wesentlicher Bestandteil unserer Religion, und wenn unser Staat auf unserer Religion aufgebaut werden soll, müssen wir diese Lehre unserer Religion in einer staatlichen Institution manifestieren."

 ######## HISTORICAL FOCUSES ######## ""

AFG_the_regency:0				"Bewahren Sie die Regentschaft"
AFG_the_regency_desc:0				"Es ist von größter Wichtigkeit, dass wir die königliche Regentschaft bewahren. Der König ist noch zu jung, um die Innen- geschweige denn die Außenpolitik zu führen. Das würde die Nation in diesen dunklen Zeiten stabil halten, oder?"
AFG_appoint_hashim:0				"Hashims Mandat fortsetzen"
AFG_appoint_hashim_desc:0				"Sardar Muhammad Hashim Khan ist das älteste Mitglied der königlichen Regentschaft, also muss er auch der weiseste sein. Er soll [AFG.GetNonIdeologyName] durch dunkle Gewässer führen, er soll für Ordnung im Land sorgen!"
AFG_appoint_mahmud:0				"Mahmud zum Minister ernennen"
AFG_appoint_mahmud_desc:0				"Im Gegensatz zu seinem Bruder ist Sardar Shah Mahmud Khan eine eher liberale Figur. Unter seinen Händen wird [AFG.GetNonIdeologyName] zu einer modernen westlichen Nation mit einem demokratischen System und einer florierenden Wirtschaft umgebaut werden!"
AFG_institutionalize_pashto:0				"Institutionalisieren Sie Paschtu"
AFG_institutionalize_pashto_desc:0				"Viele in [AFG.GetNonIdeologyName] sprechen immer noch Persisch, manchmal als Mittel zur Verständigung zwischen verschiedenen Stämmen, und selbst in der heutigen Zeit ist der Einfluss des Persischen in [AFG.GetNonIdeologyName] noch zu spüren. Aus diesem Grund ist es unerlässlich, dass eine Landessprache wie Paschtu gestärkt und allen unseren Bürgern beigebracht wird, wenn [AFG.GetNonIdeologyName] als Nation überleben will!"
AFG_treaty_of_saadabad_hist:0				"Vertrag von Saadabad"
AFG_treaty_of_saadabad_hist_desc:0				"Der Nahe Osten ist für [AFG.GetNonIdeologyName] von größter Bedeutung, da die Veränderungen in der Politik dieser Länder auch unsere Wirtschaft, unser Militär und unsere Politik stark beeinflussen können. Wir müssen dem Osten die Hand reichen! Vielleicht indem wir einen Pakt der Freundschaft und der Nichtangriffsbereitschaft vorschlagen."
AFG_visit_berlin:0				"Staatsbesuch bei [GER.Capital.GetCapitalVictoryPointName]"
AFG_visit_berlin_desc:0				"[AFG.GetNonIdeologyName] ist zwischen zwei Übeln hin- und hergerissen, im Norden gibt es die [SOV.GetAdjective]s, im Süden die [ENG.GetAdjective]. Wir müssen eine dritte einflussreiche Macht in [AFG.GetNonIdeologyName] etablieren, um das Gleichgewicht der Kräfte zu erhalten. Wir müssen also auf die [GER.GetAdjective] zugehen und sie um Unterstützung bitten."
AFG_invite_wehrmacht_officers:0				"Laden Sie Offiziere der Wehrmacht ein"
AFG_invite_wehrmacht_officers_desc:0				"Die [AFG.GetAdjective] Armee könnte etwas ausländische Unterstützung gebrauchen, vielleicht von [GER.GetNonIdeologyName]. Während des Ersten Weltkriegs wurde eine [GER.GetAdjective] Militärmission nach [AFG.GetNonIdeologyName] entsandt, in der Hoffnung, dass wir diplomatische Beziehungen zu [AFG.GetNonIdeologyName] aufbauen und sie zwingen könnten, sich dem Krieg anzuschließen. Es wäre klug, den Leiter der Mission, nämlich Werner Otto von Hentig, wieder einzuladen."
AFG_bolster_the_nationalists:0				"Unterstützen Sie die Nationalisten"
AFG_bolster_the_nationalists_desc:0				""
AFG_purge_the_nationalists:0				"Schieben Sie die Nationalisten beiseite"
AFG_purge_the_nationalists_desc:0				""
AFG_acquire_german_radios:0				"Beschaffen Sie [GER.GetAdjective] Radios"
AFG_acquire_german_radios_desc:0				""
AFG_invite_abwehr_agents:0				"Abwehr-Agenten einladen"
AFG_invite_abwehr_agents_desc:0				"Indem wir die [GER.Adjective] Abwehr einladen, einen Stützpunkt in [AFG.GetNonIdeologyName] zu errichten, könnten wir und der [GER.Adjective] Geheimdienst die [ENG.GetAdjective] in [RAJ.GetNameDef] und Asien im Auge behalten. Dies würde auch unsere nationale Sicherheit verbessern und würde wahrscheinlich Invasionen verhindern, ohne dass wir davon erfahren."
AFG_enact_censorship:0				"Durchsetzung der Medienzensur"
AFG_enact_censorship_desc:0				"Die Medien sind ein mächtiges Instrument, sie dienen als Vermittler zwischen der Regierung und dem Volk. Aber nicht alles muss veröffentlicht werden, oder? Vor allem dann nicht, wenn der Inhalt für die Regierung schädlich ist."
AFG_build_up_roads:0				"Deal mit Organisation Todt"
AFG_build_up_roads_desc:0				"Die [GER.GetAdjective] haben einen lukrativen Industriedeal vorgeschlagen, bei dem die Organisation Todt in Zusammenarbeit mit der [AFG.GetAdjective] Regierung Straßen in ganz [AFG.GetNonIdeologyName] bauen würde. Dies würde die [AFG.GetAdjective] Wirtschaft und die Lebensqualität der [AFG.GetAdjective] Menschen stark ankurbeln."
AFG_german_investments_program:0				"[GER.GetAdjective] Investitionsprogramm"
AFG_german_investments_program_desc:0				"[GER.GetAdjective] Investitionen in [AFG.GetNonIdeologyName] sind für die wirtschaftliche Entwicklung und das Wachstum der Infrastruktur unseres Landes von entscheidender Bedeutung. Diese Partnerschaften bringen nicht nur finanzielle Unterstützung mit sich, sondern stellen auch wertvolles Fachwissen und Technologie zur Verfügung und fördern so eine nachhaltige und florierende Zukunft für [AFG.GetNonIdeologyName] durch für beide Seiten vorteilhafte Kooperationen."
AFG_fund_the_army:0				"Leiten Sie Gelder an das Militär um"
AFG_fund_the_army_desc:0				"Die Finanzierung der afghanischen Armee ist für die Sicherheit und Stabilität des Landes von größter Bedeutung. Es ist die Pflicht eines jeden Bürgers, zur finanziellen Unterstützung unserer Streitkräfte beizutragen, um sicherzustellen, dass sie gut ausgerüstet und darauf vorbereitet bleiben, unsere Souveränität gegen jede Bedrohung zu verteidigen."
AFG_stabilize_the_currency:0				"Stabilisieren Sie die Währung"
AFG_stabilize_the_currency_desc:0				"Die Stabilisierung der Währung ist besonders wichtig, um das Vertrauen der Investoren zu sichern. Eine stabile Währung fördert die Entwicklung, zieht ausländische Investitionen an und trägt zum allgemeinen wirtschaftlichen Wohlstand und sozialen Wohlergehen unserer Bürger bei."
AFG_irrigation_scheme:0				"Unterzeichnen Sie das Vier-Punkte-Programm"
AFG_irrigation_scheme_desc:0				"Unsere Landwirte im Westen genießen nicht solche Privilegien wie manche im Osten. Diese Kluft ist es, die eine Nation und ein Volk letztlich auseinanderreißt. Wir dürfen das nicht zulassen. Vielleicht können wir durch den Bau moderner Bewässerungssysteme für diese unterprivilegierten Bauern ihre Unterstützung gewinnen."
AFG_shah_mahmud_prevails:0				"Wiederwahl für die Konservativen"
AFG_shah_mahmud_prevails_desc:0				"Wir dürfen uns nicht zu weit von unserem derzeitigen System entfernen. Es ist wichtig, dass wir die Grundwerte von [AFG.GetNonIdeologyName] beibehalten. Die Konservative Partei unter der Führung von Sardar Shah Mahmud Khan scheint in diesem Bestreben sehr vielversprechend zu sein."
AFG_fatherland_party_triumph:0				"Die Vaterlandspartei triumphiert"
AFG_fatherland_party_triumph_desc:0				"Die Demokratie darf nicht durch unsere Kultur und unsere rückständigen Ansichten über die moderne Welt eingeschränkt werden! Unter der Führung der Vaterlandspartei von Ghulam Muhammad Ghubar soll [AFG.GetNonIdeologyName] zu einem Leuchtturm der liberalen Demokratie im Orient werden!"
AFG_infrastructure_privatization:0				"Nationale Infrastruktur privatisieren"
AFG_infrastructure_privatization_desc:0				"Die Privatisierung von Infrastruktur und Autobahnen ist für die Regierung unerlässlich, um das Wirtschaftswachstum im öffentlichen Sektor anzukurbeln. Indem wir die Beteiligung des privaten Sektors fördern, wollen wir die langfristige Nachhaltigkeit unserer Verkehrsnetze sicherstellen."
AFG_british_exchange_program:0				"Das [ENG.GetAdjective] Austauschprogramm"
AFG_british_exchange_program_desc:0				"Der Austausch von militärischen Technologien und Fortschritten mit [ENG.GetNameDef] ist entscheidend für die Stärkung der Verteidigungsfähigkeiten unseres Militärs. Wir hoffen, dass dies auch die guten Beziehungen und die Zusammenarbeit mit [ENG.GetNameDef] fördern wird."
AFG_liberal_constitution:0				"Verabschiedung einer liberalen Verfassung"
AFG_liberal_constitution_desc:0				"[AFG.GetNonIdeologyName] hatte einst unter König Amanullah eine einigermaßen liberale Verfassung, die von der Loya Jirga und der Öffentlichkeit unterstützt wurde. Wir sollten uns bemühen, eine ähnliche Verfassung wieder einzuführen und dabei viele der gleichen Werte beizubehalten, sie aber auch so umzugestalten, dass sie den heutigen Standards entspricht."
AFG_the_afghan_new_deal:0				"Der [AFG.GetAdjective] New Deal"
AFG_the_afghan_new_deal_desc:0				"Ähnlich wie der [USA.GetAdjective] New Deal, der von [USA.GetAdjective] Präsident Franklin D. Roosevelt eingeführt wurde, plant [AFG.GetNonIdeologyName] eine ähnliche Reihe von Wirtschaftsprogrammen, um die Arbeitslosigkeit und andere Probleme zu bekämpfen, in der Hoffnung, die [AFG.GetAdjective] Wirtschaft anzukurbeln."
AFG_form_watan_party:0				"Die Gründung der Vaterlandspartei"
AFG_form_watan_party_desc:0				"Die Gründung der Watan-Partei ist für [AFG.GetNonIdeologyName] von entscheidender Bedeutung, da sie ein Bekenntnis zu demokratischen Prinzipien und einer integrativen Regierungsführung darstellt. Dieses politische Gebilde soll eine Plattform für alle Stimmen von [AFG.GetNonIdeologyName] bieten, zur demokratischen Entwicklung der Nation beitragen und eine Regierung sicherstellen, die die Bestrebungen und Interessen der gesamten Nation vertritt."
AFG_economic_privatization:0				"Privatisierung des Industriesektors"
AFG_economic_privatization_desc:0				"Die Privatisierung des Industriesektors ist für die Regierung entscheidend, um das Wirtschaftswachstum anzukurbeln und eine wettbewerbsfähige Wirtschaft zu schaffen. Indem wir privates Eigentum und Management fördern, wollen wir eine sich selbst tragende Wirtschaft schaffen, die von privaten Unternehmen und Konzernen getragen wird."
AFG_reapproachment_with_RAJ:0				"Wiederannäherung an den Raj"
AFG_reapproachment_with_RAJ_desc:0				"Um die Stabilität und den Frieden in der Region aufrechtzuerhalten, ist es von äußerster Wichtigkeit, dass wir freundschaftliche Beziehungen zu [RAJ.GetNameDef] pflegen. Wir müssen [RAJ.GetNameDef] einen Olivenzweig reichen, zum Wohle von [AFG.GetNonIdeologyName] und dem [AFG.GetAdjective] Volk!"
AFG_from_the_leopard_corps:0				"Bilden Sie das Leoparden-Korps"
AFG_from_the_leopard_corps_desc:0				"Das Schneeleoparden-Freiwilligenkorps wird helfen, die Interessen von [AFG.GetNonIdeologyName] in der Region zu fördern und zu schützen."
AFG_operation_tiger:0				"Operation Tiger"
AFG_operation_tiger_desc:0				"Die üppigen Ebenen und hoch aufragenden Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete mit [AFG.GetNonIdeologyName] zu vereinen, um unser Volk vor den schrecklichen Misshandlungen und dem Kolonialismus zu schützen, dem es seit Jahrhunderten ausgesetzt ist!"
AFG_operation_blue_mosque:0				"Operation Blaue Moschee"
AFG_operation_blue_mosque_desc:0				"Um die Westgrenze zu sichern, müssen wir uns um das [PER.GetAdjective]-Problem kümmern. Neben der Sicherung lebenswichtiger Nachschublinien und der Beseitigung jeglichen unerwünschten Einflusses in Persien könnte sich die Inbesitznahme der großen Ölreserven im Norden Persiens als sehr nützlich für uns erweisen."
AFG_neutrality_reaffirmed:0				"Neutralität bekräftigen"
AFG_neutrality_reaffirmed_desc:0				"[AFG.GetNonIdeologyName] ist seit dem Krieg von 1919 neutral, als es seine Unabhängigkeit durch einen brutalen und blutigen Konflikt gegen das damals größte und fortschrittlichste Empire, das Britische Empire, erlangte. Wenn es nicht kaputt ist, sollte man es nicht reparieren."
AFG_deterrence_focus:0				"Verteidigen Sie das Vaterland"
AFG_deterrence_focus_desc:0				"Die Abschreckung militärischer Invasionen ist für die afghanische Regierung ein vorrangiges Ziel, um die Souveränität und Sicherheit unseres Landes zu gewährleisten. Durch die Stärkung unserer Verteidigungskapazitäten wollen wir eine Abschreckung gegen externe Bedrohungen schaffen und so das Wohlergehen unserer Bürger sichern. Für das Vaterland!"
AFG_implement_autarky:0				"Autarkie einführen"
AFG_implement_autarky_desc:0				"Wir müssen die Autarkie einführen, um wirtschaftliche Autarkie zu erreichen und unsere Abhängigkeit von externen Ressourcen zu verringern. Indem wir die lokale Produktion in den Vordergrund stellen, versuchen wir, die Widerstandsfähigkeit unserer Nation angesichts der globalen wirtschaftlichen Unsicherheiten zu stärken."
AFG_combat_foreign_influence:0				"Der Geist der Neutralität"
AFG_combat_foreign_influence_desc:0				"Die Aufrechterhaltung des Geistes der Neutralität ist für die afghanische Regierung von wesentlicher Bedeutung, um die Unabhängigkeit unserer Nation von [SOV.GetAdjective] oder [ENG.GetAdjective] Einfluss zu bewahren."
AFG_fortify_the_durand_line:0				"Die Durand-Linie befestigen"
AFG_fortify_the_durand_line_desc:0				"Die Stärkung der Durand-Linie, der Grenze zu [RAJ.GetNameDef], ist unerlässlich, um die Sicherheit zu gewährleisten, grenzüberschreitende Aktivitäten zu regulieren und die Südgrenze von [AFG.GetNonIdeologyName] zu schützen. Durch die Befestigung dieser Grenze wollen wir unsere militärische Bereitschaft erhöhen, falls es jemals zu einem Konflikt mit dem [GetRajAdjective] Militär kommen sollte."
AFG_the_uneasey_border:0				"Die unsichere Grenze befestigen"
AFG_the_uneasey_border_desc:0				"Die Befestigung der [SOV.GetAdjective]-[AFG.GetAdjective] Grenze ist von äußerster Wichtigkeit, um die territoriale Integrität zu wahren und die Nation gegen äußere Bedrohungen zu schützen. Die Stärkung der Grenzverteidigung zielt darauf ab, unsere militärische Bereitschaft zu erhöhen, falls es jemals zu einem Konflikt mit den [SOV.GetAdjective] kommen sollte."
AFG_expand_the_welfare_state:0				"Den Wohlfahrtsstaat ausbauen "
AFG_expand_the_welfare_state_desc:0				""
AFG_join_allies:0				"Schließen Sie sich den Alliierten an"
AFG_join_allies_desc:0				"Die Alliierten, ein Symbol der Stabilität, des Friedens und vor allem der Demokratie, sind schon seit geraumer Zeit ein Diskussionsthema unter [AFG.GetAdjective] Politikern. Der Konsens ist jedoch, dass [AFG.GetNonIdeologyName] viele seiner Ansichten und Werte mit den alliierten Nationen teilt. In diesem Sinne ist es nur richtig, dass [AFG.GetNonIdeologyName] sich den Alliierten anschließt!"
AFG_press_for_pakistan:0				"Presse für [PAK.GetNonIdeologyName]"
AFG_press_for_pakistan_desc:0				"Die üppigen Ebenen und hoch aufragenden Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete mit [AFG.GetNonIdeologyName] zu vereinen, um unser Volk vor den schrecklichen Misshandlungen und dem Kolonialismus zu schützen, dem es seit Jahrhunderten ausgesetzt ist!"
AFG_aquire_british_ships:0				"Erwerben Sie [ENG.GetAdjective] Marineschiffe"
AFG_aquire_british_ships_desc:0				"Der Erwerb von Marineschiffen von [ENG.GetNameDef] ist wichtig, um die maritimen Sicherheitsfähigkeiten der [AFG.GetAdjective] Navy zu verbessern. Dies kann uns jedoch eine große Summe Geld kosten, die wir uns im Moment vielleicht nicht leisten können."
AFG_operation_red_mosque:0				"Operation Rote Moschee"
AFG_operation_red_mosque_desc:0				"Der Kommunismus ist eine böse Ideologie, die nichts als Tod und Zerstörung bringt, wo immer sie Fuß fasst, zumindest glauben wir das. Es ist unsere Pflicht, dem Kommunismus ein für alle Mal ein Ende zu bereiten und zu verhindern, dass Menschen auf der ganzen Welt in Zukunft unter seinem Deckmantel leiden müssen. Wir müssen die [SOV.GetAdjective]-Bedrohung im Norden bekämpfen!"
AFG_increase_school_funding:0				"Erhöhung der Schulgelder"
AFG_increase_school_funding_desc:0				"Die Erhöhung der Mittel für die Schulen hat oberste Priorität, um eine bessere Zukunft für unser Land zu gewährleisten. Indem wir mehr Mittel für die Bildung bereitstellen, wollen wir die Qualität der Schulen verbessern und unsere Jugend mit dem Wissen und den Fähigkeiten ausstatten, die sie braucht, um zur sozialen und wirtschaftlichen Entwicklung von [AFG.GetNonIdeologyName] beizutragen."
AFG_beacon_of_the_orient:0				"Leuchtturm des Orients"
AFG_beacon_of_the_orient_desc:0				"Die Wahrung der Demokratie im Orient ist von größter Bedeutung, denn sie symbolisiert unser Engagement für Freiheit und Einheit. Indem wir die demokratischen Prinzipien hochhalten, versuchen wir, die Stabilität aufrechtzuerhalten und zu einer breiteren Förderung der demokratischen Werte im Orient und darüber hinaus beizutragen!"
AFG_legacy_of_the_yellow_expedition:0				"Das Vermächtnis der Gelben Expedition"
AFG_legacy_of_the_yellow_expedition_desc:0				"Die Gelbe Expedition von 1932, angeführt von vier Männern, die Citroën repräsentierten, reiste durch [AFG.GetNonIdeologyName], wo sie für ihre neue Ausrüstung, die P17 Kégresse, warben. Die Möglichkeit zum Kauf dieser Halbkettenfahrzeuge wurde nie ausgeschlossen, so dass wir sie immer noch erwerben könnten, wenn wir den Wunsch dazu hätten."
AFG_grant_land_concessions:0				"Erteilung von Landkonzessionen"
AFG_grant_land_concessions_desc:0				"Die Vergabe von Landkonzessionen an Regionen, die über reichlich Öl verfügen, an die [USA.GetAdjective]-Unternehmen in [AFG.GetNonIdeologyName] ist für die Steigerung der wirtschaftlichen Entwicklung von entscheidender Bedeutung. Dies wird hoffentlich ausländische Investitionen anziehen und unsere wirtschaftliche Zusammenarbeit mit [USA.GetNameDef] verbessern."
AFG_specialization_of_units_focus:0				"Spezialisierte Einheiten"
AFG_specialization_of_units_focus_desc:0				"Es stimmt zwar, dass wir viele Infanteriedivisionen und Bataillone haben können, die schlecht ausgebildet und ausgerüstet sind, aber es wäre hilfreich, wenn wir spezialisierte Einheiten für den Kampf in unterschiedlichem Terrain entwickeln könnten. Da das Terrain von [AFG.GetNonIdeologyName] überwiegend gebirgig ist, macht es am meisten Sinn, sich auf den Kampf in den Bergen zu spezialisieren, oder?"
AFG_ramp_up_military_production:0				"Die Militärproduktion hochfahren"
AFG_ramp_up_military_production_desc:0				"Die Militärproduktion von [AFG.GetNonIdeologyName] ist praktisch nicht vorhanden. Das macht den Schutz unserer Nation vor äußeren Bedrohungen und Einflüssen extrem schwierig, da wir bei der militärischen Ausrüstung auf andere Nationen angewiesen sind. [AFG.GetNonIdeologyName] muss um seiner Souveränität und Sicherheit willen anfangen, seine eigenen Waffen zu produzieren!"
AFG_study_our_surroundings:0				"Anpassung an unsere Umgebung"
AFG_study_our_surroundings_desc:0				"Um uns besser verteidigen zu können, müssen wir unsere Umgebung studieren und Taktiken entwickeln, die uns einen entscheidenden Vorteil gegenüber fremden Eindringlingen verschaffen. Indem wir unsere Landschaft ausnutzen, können wir unserem Feind viele Verluste zufügen, ohne selbst viele Verluste zu erleiden!"
AFG_mass_produce_equipment:0				"Massenproduktion von Ausrüstung"
AFG_mass_produce_equipment_desc:0				"Um unsere militärische Stärke aufrechtzuerhalten, müssen wir uns auf die Anzahl der Soldaten konzentrieren, die wir in der Armee haben, und jeden einzelnen von ihnen ausrüsten. Zwei Männer mit schlechten Gewehren werden immer besser sein als ein Mann mit einem überlegenen Gewehr!"
AFG_live_off_the_land:0				"Vom Land leben"
AFG_live_off_the_land_desc:0				"Wir müssen an Taktiken arbeiten, die unseren Truppen helfen, kalte und harte Winter zu überstehen oder in Situationen, in denen die Versorgung schwer zu bekommen ist. Sie müssen darauf trainiert werden, von dem zu leben, was ihnen gegeben wird!"
AFG_terror_of_the_sea:0				"Terror der See"
AFG_terror_of_the_sea_desc:0				"Die Terror of the Sea, ein Schiff, das so groß und massiv ist, ein Schiff, das viele Flugzeuge an Bord hat, die feindliche Schiffe angreifen und vernichtende Schläge austeilen! Wir müssen an der Herstellung eines solchen Schiffes arbeiten, denn es wird uns mit Sicherheit den Sieg in jeder Seeschlacht sichern, an der wir teilnehmen!"
AFG_destroyer_of_worlds:0				"Zerstörer der Welten"
AFG_destroyer_of_worlds_desc:0				"Es ist der Traum eines jeden Wissenschaftlers, endlich die Kraft des Atoms zu nutzen. Diese immense Energiemenge könnte die totale Zerstörung ganzer Städte und Regionen verursachen. Wir müssen vorsichtig sein, denn die Atomkraft könnte eine größere Bedrohung als einen Nutzen für die Menschheit darstellen."

 ######## ALT MONARCHIST FOCUSES ######## ""

AFG_abolish_the_regency:0				"Abschaffung der Regentschaft"
AFG_abolish_the_regency_desc:0				"Der König soll [AFG.GetNonIdeologyName] zu Ruhm und Wohlstand führen! Mit seiner Leitung der Loya Jirga hat er gezeigt, dass er tatsächlich in der Lage ist, die Außen- und Innenpolitik von [AFG.GetNonIdeologyName] zu steuern. Wir können nur hoffen, dass ihm die Macht nicht zu Kopf steigt."
AFG_backtrack_on_reforms:0				"Nadir Shahs Reformen rückgängig machen"
AFG_backtrack_on_reforms_desc:0				"Die Regierung von [AFG.GetNonIdeologyName] war in der Vergangenheit zu ehrgeizig mit Modernisierung und Reformen. Wir dürfen nicht zulassen, dass Modernisierung und Reformen unsere Nation erneut auseinander treiben, wie es 1929 unter König Amanullah geschah. Der Fortschritt ist es, der unsere Nation letztlich zerreißen wird!"
AFG_continute_nadir_shahs_reforms:0				"Die Reformen von Nadir Shah fortsetzen"
AFG_continute_nadir_shahs_reforms_desc:0				"So langsam wie sie ist! Wir müssen uns für langsame Reformen einsetzen, die die Lebensweise des [AFG.GetAdjective] einfachen Volkes nicht zu sehr beeinträchtigen. Der Fortschritt muss beibehalten werden. Ein gutes Beispiel dafür ist die Herrschaft des verstorbenen Vaters von König Muhammad Zahir Shah, König Nadir Shah. In seine Fußstapfen soll sein Sohn treten!"
AFG_construct_the_great_north_road:0				"Bauen Sie die Große Nordstraße"
AFG_construct_the_great_north_road_desc:0				"[1011.GetName] ist schon viel zu lange unterentwickelt. Daher ist es wichtig, sie zu urbanisieren und zu industrialisieren. Und was gibt es Besseres, als eine Autobahn zu bauen, die den Norden mit Kābul verbindet!"
AFG_foreign_economic_aid:0				"Suchen Sie nach ausländischen Wirtschaftsinvestitionen"
AFG_foreign_economic_aid_desc:0				"[AFG.GetNonIdeologyName] ist eine arme Nation, das müssen wir zugeben. Aber das muss es nicht bleiben! Um unserem Volk wirtschaftlichen und sozialen Wohlstand zu bringen, ist es von größter Bedeutung, dass wir Beziehungen zu den großen ausländischen Mächten der Welt aufbauen. Große Vorteile könnten uns durchaus erwarten."
AFG_centralize_the_bank_of_afg:0				"Zentralisieren Sie die Bank von [AFG.GetNonIdeologyName]"
AFG_centralize_the_bank_of_afg_desc:0				"Der [AFG.GetAdjective] Bankensektor ist derzeit sehr unterentwickelt. Das liegt an den fehlenden Reformen und der mangelnden Modernisierung, aber auch daran, dass das Bankensystem aufgrund des Kapitalmangels generell nicht benötigt wird. Wenn [AFG.GetNonIdeologyName] die Weltbühne betreten oder eine entwickelte Nation werden will, ist es notwendig, den Bankensektor zu entwickeln."
AFG_push_army_reforms:0				"Weitere Armeereformen einleiten"
AFG_push_army_reforms_desc:0				"Auch wenn die Stammesführer und Mitglieder der Loya Jirga dies nicht gutheißen mögen, ist es notwendig, begrenzte Armeereformen voranzutreiben. Die königliche [AFG.GetAdjective]-Armee ist schwach, wenn wir diese Armeereformen vorantreiben, werden wir sie stärken!"
AFG_annul_the_hasht_nafari:0				"Annullieren Sie das Hasht Nafari"
AFG_annul_the_hasht_nafari_desc:0				"Vor vielen Jahren und Jahrzehnten, während der Herrschaft von Abdur Rahman Khan, dem großen Emir von [AFG.GetNonIdeologyName], wurde ein Abkommen zwischen der Regierung und den Stammesführern geschlossen. Dieses Abkommen, das Hasht Nafari oder Acht Personen genannt wird, besagt, dass jede achte Person, die von den Stammesführern ausgewählt wird, zumindest für eine gewisse Zeit im Militär dienen muss. Um die Armee zu modernisieren, muss dieses unausgesprochene Gesetz außer Kraft gesetzt werden!"
AFG_introduce_new_taxes:0				"Neue Steuern einführen"
AFG_introduce_new_taxes_desc:0				"Wo ist das Ende unserer Macht? [AFG.GetNonIdeologyName] ist unter König Muhammad Zahir Shah zu einer Diktatur geworden. Es scheint, als wäre alles möglich, wenn der König das Sagen hat. Hoffentlich wiederholt sich die Geschichte nicht, sonst könnte [AFG.GetNonIdeologyName] wieder auf dem Weg ins Chaos sein."
AFG_amend_the_constitution:0				"Änderung der Verfassung von 1931"
AFG_amend_the_constitution_desc:0				"Die Zeit ist endlich gekommen, König Muhammad Zahir Shah soll sich erheben und der König werden, zu dem ihn sein Vater erzogen hat! Die Loya Jirga, die Regentschaft, sie alle werden bald verschwunden sein, und der König wird [AFG.GetNonIdeologyName] wieder mit eiserner Faust führen! Mit nur einem Federstrich wird er zu Ruhm und Ehre aufsteigen!"
AFG_the_generals_coup:0				"Der Coup des Generals"
AFG_the_generals_coup_desc:0				"[AFG.GetNonIdeologyName] ist derzeit tief gespalten. Einige sind noch immer treue Anhänger des Königs, während andere seinen Sturz kaum erwarten können. Daoud Khan sieht, dass sich eine günstige Gelegenheit auftut, und plant seinen Putsch im Stillen, im Verborgenen..."
AFG_the_exiled_king:0				"Der verbannte König"
AFG_the_exiled_king_desc:0				"Angesichts der katastrophalen Lage in [AFG.GetNonIdeologyName], die sich von Minute zu Minute verschlechtert, scheint es, als könne niemand das Land aus den Klauen von Instabilität und Zwietracht retten... [AFG.GetNonIdeologyName] ist für immer zu einem unstabilen Schicksal verdammt! Es gibt jedoch Gerüchte, dass der im Exil lebende König und Emir, Amanullah Khan, in [AFG.GetNonIdeologyName] eingetreten ist und plant, den König zu stürzen! Ob das wirklich wahr ist, kann nur Gott sagen."
AFG_university_in_herat:0				"Gründung der Universität von Herat"
AFG_university_in_herat_desc:0				"[AFG.GetNonIdeologyName] hat nicht viel zu bieten, wenn es um Bildung geht. Deshalb ist es unsere Aufgabe, das zu ändern! Durch die Gründung einer Universität in [415.GetName], einer sehr bevölkerungsreichen Stadt im Westen, hoffen wir, die allgemeine Qualität der Bildung zu erhöhen und unseren zukünftigen Studenten eine Alternative zur Kābul-Universität zu bieten!"
AFG_adopt_constitutional_monarchy:0				"Bekräftigen Sie den konstitutionellen Monarchismus"
AFG_adopt_constitutional_monarchy_desc:0				"Unter König Muhammad Zahir Shah wird [AFG.GetNonIdeologyName] in eine konstitutionelle Monarchie übergehen, in der alle 4 Jahre Wahlen abgehalten werden. Obwohl der König die meisten seiner Befugnisse behalten wird, ist dies ein beträchtlicher Fortschritt auf dem Weg zu einem demokratischen und freien [AFG.GetNonIdeologyName]!"
AFG_treaty_of_saadabad:0				"Vertrag von Saadabad"
AFG_treaty_of_saadabad_desc:0				"Der Nahe Osten ist für [AFG.GetNonIdeologyName] von größter Bedeutung, da die Veränderungen in der Politik dieser Länder auch unsere Wirtschaft, unser Militär und unsere Politik stark beeinflussen können. Wir müssen dem Osten die Hand reichen! Vielleicht, indem wir einen Pakt der Freundschaft und Nichtangriffslust vorschlagen."
AFG_nationalize_banks:0				"Verstaatlichen Sie [AFG.GetAdjective] Banken"
AFG_nationalize_banks_desc:0				"Obwohl [AFG.GetNonIdeologyName] keinen großen Bankensektor besitzt, sollten wir die wenigen Banken, die es in [AFG.GetNonIdeologyName] gibt, verstaatlichen. Indem wir den Bankensektor direkt verwalten, können wir hoffentlich unsere Wirtschaft effizienter verbessern."
AFG_ban_political_parties:0				"Politische Aktivitäten verbieten"
AFG_ban_political_parties_desc:0				"In dieser schwierigen Zeit für [AFG.GetNonIdeologyName] gibt es keinen Grund für politische Pluralität! Wenn wir zulassen, dass sich mehrere Parteien in [AFG.GetNonIdeologyName] bilden, wird das nur zu weiterer Instabilität und Spaltung der Nation führen! Dies würde uns letztlich in einen weiteren Bürgerkrieg führen..."
AFG_disband_the_jirga:0				"Lösen Sie die Loya Jirga auf"
AFG_disband_the_jirga_desc:0				"Unsere Regierung hat die volle Unterstützung des Militärs. Das ermöglicht es uns, die Loya Jirga ohne großen Widerstand der Stammesführer aufzulösen. Wir hoffen, auf diese Weise die Nation weiter zu stabilisieren und den Einfluss der Stämme auf die Regierung vorübergehend zu beseitigen!"
AFG_amanullahs_visit_to_europe:0				"Königliche Tour durch Europa"
AFG_amanullahs_visit_to_europe_desc:0				"Seit seiner Rückkehr nach [AFG.GetNonIdeologyName] vor nicht allzu langer Zeit hat Amanullah eine königliche Tour durch Europa geplant. Amanullahs früherer Versuch, Europa zu bereisen, endete mit einem Bürgerkrieg in [AFG.GetNonIdeologyName], während er im Ausland war. Hoffentlich wiederholt sich die Geschichte nicht!"
AFG_restore_the_constitution:0				"Die Verfassung von 1921 wiederherstellen"
AFG_restore_the_constitution_desc:0				"Die Verfassung von 1921, die erste liberale Verfassung von [AFG.GetNonIdeologyName], die erklärte, dass jeder [AFG.GetAdjective] gleich behandelt werden sollte, unterstützte die Gleichheit. Es ist wichtig, diese Werte auch in der neuen Verfassung beizubehalten!"
AFG_establish_radio_kabul:0				"Errichten Sie Radio Kābul"
AFG_establish_radio_kabul_desc:0				"Mit dem Fortschritt der Technik werden immer fortschrittlichere Methoden der Kommunikation mit den Menschen entdeckt. So haben wir mit der Erfindung des Radios die Möglichkeit, einen Radiosender zu gründen, den alle [AFG.GetNonIdeologyName] hören können! Das wird uns bei unserem Ziel helfen, unsere politischen Ansichten zu verbreiten und Informationen zu verbreiten!"
AFG_export_based_economy:0				"Exportgestützte Wirtschaft"
AFG_export_based_economy_desc:0				"Obwohl [AFG.GetNonIdeologyName] nicht viele Ressourcen besitzt, haben wir große Überschüsse an mechanischen Geräten und anderen fabrikmäßig hergestellten Waren. Diese Überschüsse sollten natürlich gewinnbringend exportiert werden. Um unsere Wirtschaft wachsen zu lassen, müssen wir den Export unserer Waren fördern!"
AFG_subvert_soviet_influence_focus:0				"Untergraben Sie den [SOV.GetAdjective]-Einfluss"
AFG_subvert_soviet_influence_focus_desc:0				"Wir dürfen nicht zulassen, dass die [SOV.GetAdjective] Einfluss auf [AFG.GetNonIdeologyName] nehmen, denn das könnte sich als tödlich für unsere Regierung und unsere Nation erweisen. [AFG.GetNonIdeologyName] muss eine souveräne Nation mit einer eigenen unabhängigen Außenpolitik bleiben. Wir werden die Herren unseres eigenen Schicksals sein!"
AFG_army_reform:0				"Mobilisieren Sie die Armee"
AFG_army_reform_desc:0				"Um ausländische Mächte davon abzuhalten, in [AFG.GetNonIdeologyName] einzumarschieren, müssen wir unsere Streitkräfte mobilisieren und die Bereitschaft unseres Militärs für mögliche Kriege verbessern."
AFG_the_non_aligned_movement:0				"Die Bewegung der Blockfreien"
AFG_the_non_aligned_movement_desc:0				"Viele Nationen auf dieser Welt stehen alleine da, ohne Verbündete, blockfrei und neutral sozusagen. Wir müssen eine Gemeinschaft für die bündnisfreien Nationen der Welt schaffen und uns so in diesen schwierigen Zeiten gegenseitig schützen! Für Frieden und Wohlstand!"
AFG_turkish_subsidized_factories:0				"[TUR.GetAdjective] Subventionierte Fabriken"
AFG_turkish_subsidized_factories_desc:0				"Bei der Fortsetzung unserer Politik der verstärkten Zusammenarbeit im Nahen Osten sollten wir [TUR.GetAdjective] Investoren und Geschäftsleute einladen, Fabriken in [AFG.GetNonIdeologyName] zu subventionieren. Dies würde die wirtschaftliche Zusammenarbeit zwischen [AFG.GetNonIdeologyName] und [TUR.GetNameDef] immens steigern!"
AFG_ally_with_the_young_afghans:0				"Verbünden Sie sich mit den Jungen Afghanen"
AFG_ally_with_the_young_afghans_desc:0				"Die Jungen Afghanen sind eine politische Gruppe innerhalb von [AFG.GetNonIdeologyName] und sie sind die treibende Kraft für die weitere Verwestlichung und Modernisierung von [AFG.GetNonIdeologyName]! König Amanullah unterhält seit seiner Krönung enge Beziehungen zu dieser Organisation. Doch seit dem Bürgerkrieg von 1929 sind diese Beziehungen angespannt. Wir müssen daran arbeiten, sie wiederherzustellen!"
AFG_secular_education:0				"Führen Sie eine säkulare Erziehung ein"
AFG_secular_education_desc:0				"Es ist wichtig, Religion und Bildung zu trennen, denn beide haben sich in Kombination als tödliche Mischung erwiesen. Um die Bildung unserer Bevölkerung zu verbessern, müssen wir den Islam aus allen Klassenzimmern in [AFG.GetNonIdeologyName] entfernen!"
AFG_the_hazara_question:0				"Die Hazara-Frage"
AFG_the_hazara_question_desc:0				"Religiöse Unterschiede innerhalb von [AFG.GetNonIdeologyName] gibt es in der Tat immer noch. Die Hazaras sind eine Volksgruppe, die in [1009.GetName] lebt und hauptsächlich schiitisch ist. Um Kämpfe zu verhindern, müssen wir die schiitischen und sunnitischen Gemeinschaften von [AFG.GetNonIdeologyName] vereinen. Kein Glaube im Islam ist minderwertig!"
AFG_implement_autarky_daoud:0				"Autarkie einführen"
AFG_implement_autarky_daoud_desc:0				"Wir müssen die Autarkie einführen, um wirtschaftliche Autarkie zu erreichen und unsere Abhängigkeit von externen Ressourcen zu verringern. Durch die Förderung einheimischer Industrien und die Bevorzugung lokaler Produktion versuchen wir, die Widerstandsfähigkeit unserer Nation angesichts der globalen wirtschaftlichen Unsicherheiten zu stärken."
AFG_the_kabul_pact:0				"Der Kabuler Pakt"
AFG_the_kabul_pact_desc:0				"Heute werden wir das vorletzte Ziel erreichen, den Nahen Osten unter einem Banner zu vereinen, unter einem gemeinsamen Ziel! Durch die Unterzeichnung des Kabul-Pakts mit der Türkei, dem Irak und dem Iran werden wir die bestehenden Gräben, die uns trennen, überbrücken und wieder eine wichtige Kraft in der regionalen Politik sein!"
AFG_self_determination_for_pakistan:0				"Selbstbestimmungsrecht für [442.GetName]"
AFG_self_determination_for_pakistan_desc:0				"ie üppigen Ebenen und hoch aufragenden Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, zu versuchen, diese Gebiete einzugliedern. Vielleicht können wir das erreichen, indem wir ein Referendum in [442.GetName] von den [GetRajAdjective] fordern!"
AFG_continue_railway_development:0				"Entwicklung der Eisenbahn fortsetzen"
AFG_continue_railway_development_desc:0				"Das [AFG.GetAdjective]-Eisenbahnnetz ist praktisch nicht existent, und nur einige kleinere Eisenbahnen, die es in [AFG.GetNonIdeologyName] gibt, sind schlecht gewartet. Wir müssen unsere Pläne zur Vernetzung der Nation fortsetzen! Je mehr unsere Menschen miteinander verbunden sind, desto geringer ist die Kluft zwischen ihnen!"
AFG_attaturks_legacy:0				"Ehren Sie das Erbe Atatürks"
AFG_attaturks_legacy_desc:0				"Der verstorbene Mustafa Kemal Atatürk, Revolutionär, General und der Vater der Türkei. Er hat viel für sein Land getan und geopfert. Amanullah kann nur danach streben, für [AFG.GetNonIdeologyName] zu erreichen, was Atatürk bereits für die Türkei erreicht hat! Amanullah wird sein Erbe weiterführen!"
AFG_deal_with_the_devil:0				"Handel mit dem Teufel"
AFG_deal_with_the_devil_desc:0				"Manchmal muss man, um seine Ziele zu erreichen, einen Pakt mit dem Teufel schließen. Um unser verlorenes Land in [PAK.GetNonIdeologyName] zurückzuerobern und [AFG.GetNonIdeologyName] wieder groß zu machen, müssen wir uns mit dem Feind unseres Feindes verbünden. Schließlich ist der Feind meines Feindes mein Freund, nicht wahr?"
AFG_form_the_afghan_red_crescent:0				"Gründen Sie den [AFG.GetAdjective] Roten Halbmond"
AFG_form_the_afghan_red_crescent_desc:0				"In diesen schweren Zeiten müssen wir menschlich bleiben und helfen. Helfen Sie den Menschen in [AFG.GetNonIdeologyName], die ein Dach über dem Kopf oder eine medizinische Versorgung brauchen. Wir müssen die [AFG.GetAdjective] Red Crescent Society gründen! Per humanitatem ad pacem!"
AFG_reclaim_our_land:0				"Unser Land zurückerobern"
AFG_reclaim_our_land_desc:0				"Die üppigen Ebenen und hoch aufragenden Berge von [PAK.GetNonIdeologyName] werden seit Jahrtausenden von Paschtunen bewohnt. Daher ist es unsere absolute Pflicht, diese mehrheitlich paschtunischen Gebiete in [AFG.GetNonIdeologyName] einzugliedern, um unser Volk vor den schrecklichen Misshandlungen und dem Kolonialismus zu schützen, dem es seit Jahrhunderten ausgesetzt ist!"
AFG_greater_afghanistan:0				"Großes Afghanistan"
AFG_greater_afghanistan_desc:0				"Endlich ist der Traum von einem geeinten Land für alle [AFG.GetAdjective] verwirklicht worden. Dies ist unser Land und es ist an der Zeit, dass wir der Welt zeigen, dass wir dafür kämpfen und sterben werden. Ruhm für Afghanistan!"

 ######## FASCIST FOCUSES ######## ""

AFG_contact_faqir:0				"Das Vermächtnis der Rebellion in Chost"
AFG_contact_faqir_desc:0				"In den letzten zwei Jahrzehnten der Unabhängigkeit von [AFG.GetAdjective] von der [ENG.GetAdjective] hatte [AFG.GetNonIdeologyName] mit vielen Rebellionen, Aufständen und Putschen zu kämpfen. Eine davon war die Rebellion von Khost im Jahr 1924 gegen die radikalen Reformen von König Amanullah, auch wenn die Rebellion damals niedergeschlagen wurde, lebt der Geist weiter."
AFG_waaidu:0				"Wa'aidu!"
AFG_waaidu_desc:0				"Wa'aidu ist ein Zitat aus dem Koran, das einfach übersetzt 'Sei bereit' bedeutet. Wir haben lange genug auf diesen Moment gewartet, und nun ist er endlich da, das [AFG.GetAdjective] Volk wird sich gegen die Diktatur der Tyrannen in Kābul erheben, und der König wird nicht mehr herrschen! Allahu Akbar!"
AFG_contact_tribes:0				"Unterstützung der Stämme sichern"
AFG_contact_tribes_desc:0				"Die isolierten Stämme, die weder politische Sorgen haben noch etwas von Politik verstehen, da sie sich hauptsächlich auf Kābul konzentrieren, sind sehr daran interessiert, unseren Kampf mit den Versprechungen von Reichtum, der Rückkehr zur Scharia und der Rückgängigmachung der von der Regentschaft durchgeführten radikalen Reformen zu unterstützen."
AFG_invite_jamaat_islami:0				"Kontakt zu Abul A'la al-Maududi"
AFG_invite_jamaat_islami_desc:0				"Abul A'la al-Maududi ist ein sehr bekannter Theologe und islamischer Gelehrter in [PAK.GetNonIdeologyName]. Er könnte sich als sehr nützlich erweisen in unserem Kampf, die Menschen zu mobilisieren und unseren Dschihad gegen den König und seine Regierung zu legitimieren."
AFG_maududi_as_sheikhulislam:0				"Die Führung der Jamiat"
AFG_maududi_as_sheikhulislam_desc:0				"Ohne Abul A'la al-Maududi wäre der Funke der Rebellion nicht übergesprungen und das Volk von [AFG.GetNonIdeologyName] würde für immer unter einem tyrannischen Regime leben. Sein großartiges Organisationstalent hat uns alle zusammengebracht, um für unsere Überzeugungen und unsere Traditionen zu kämpfen! Er muss zum Scheich ernannt werden!"
AFG_mirzali_as_emir:0				"Der Goldene Emir"
AFG_mirzali_as_emir_desc:0				"Haji Mirzali Khan hat sich als loyal gegenüber dem Volk von [AFG.GetNonIdeologyName] erwiesen, indem er auf dem Schlachtfeld mit großer Tapferkeit und Leidenschaft gegen unsere Feinde gekämpft hat. Aus diesem Grund wurde er von vielen in unseren Reihen gepriesen und verehrt! Der einzige Weg, ihn für das zu belohnen, was er für den Kampf und unsere Sache getan hat, ist, ihn zum Emir des Islamischen Emirats von [AFG.GetNonIdeologyName] zu ernennen!"
AFG_widen_perspective_of_religion:0				"Erweitern Sie die Sichtweise der Religion"
AFG_widen_perspective_of_religion_desc:0				"In seiner letzten Predigt erklärte der Prophet, dass kein Mensch dem anderen überlegen ist, außer im Glauben. Die schiitische Hazara-Bevölkerung hält das Banner der Einheit Gottes hoch, genau wie wir, und deshalb müssen wir über unsere Unterschiede hinwegsehen und ihnen die gleichen Rechte und Möglichkeiten zugestehen, insbesondere im Militärdienst."
AFG_persecute_hazaras:0				"Hazaras vom Militärdienst ausschließen"
AFG_persecute_hazaras_desc:0				"Die schiitische Hazara-Bevölkerung ist sehr unzuverlässig, da sie unseren Staat mehrfach verraten hat und sie sind kultischer als unser eigener islamischer Glaube. Daher wäre es klug, sie nicht zum Militärdienst heranzuziehen, da dies nicht nur zu einer moralischen Katastrophe führen könnte, sondern auch für politische Probleme in der Zukunft sorgen könnte."
AFG_the_constitution_question:0				"Entwerfen Sie eine islamische Verfassung"
AFG_the_constitution_question_desc:0				"Eine Verfassung in unserem Land mag für manche zunächst verwirrend klingen, wenn man bedenkt, dass unsere islamischen Lehren für die Scharia eintreten. Eine Verfassung oder irgendeine Form von Gesetz ist jedoch notwendig, um die Ordnung im Land und die Rechte der Menschen zu bewahren, dennoch wird die Scharia das oberste Gesetz des [AFG.GetNameDefCap] bleiben."
AFG_tulaia_mutaharrika:0				"Die Fußstapfen der Tulaia Mutaharrika"
AFG_tulaia_mutaharrika_desc:0				"Die Tulaia Mutaharrika, oder 'Mobile Garde' auf Arabisch, waren Eliteeinheiten des frühen Raschidun-Kalifats. Um die Tugendhaftigkeit und die Verehrung des Kampfes um Gottes willen weiter zu fördern, werden wir mit der Rekrutierung und Ausbildung dieser Eliten beginnen."
AFG_mix_sciences_with_religion:0				"Religiöse und wissenschaftliche Bildung mischen"
AFG_mix_sciences_with_religion_desc:0				"Auf den Spuren vieler Theologen wie Hassan al-Banna, Said Nursi und Shakib Arslan, die dafür plädieren, dass der Lehrplan eine Mischung aus Religion und Wissenschaften sein sollte und dass diese sich nicht gegenseitig ausschließen, werden wir diese Ideen in die Tat umsetzen und die Madrasa-Schule einreißen, auch wenn dies vielleicht nicht möglich ist, wenn wir einigen hartnäckigeren Ulema bereits Erziehungsbefugnisse übertragen haben."
AFG_international_mujahideen:0				"Internationale Mudschaheddin"
AFG_international_mujahideen_desc:0				"Um den Einfluss Afghanistans in der Region zu stärken, werden wir damit beginnen, unsere Mudschaheddin ins Ausland zu schicken, um unsere Brüder in anderen Regionen der Welt zu unterstützen!"
AFG_you_cannot_kill_a_believer:0				"Religiösen Fanatismus eindämmen"
AFG_you_cannot_kill_a_believer_desc:0				"Um unseren Einfluss und die Kontrolle über die Armee zu stärken sowie Tapferkeit und Moral aufrechtzuerhalten, werden wir Kampagnen zur Ermutigung und Indoktrination unserer Truppen starten, bis sie keine Angst mehr vor dem Schlachtfeld haben!"
AFG_utilize_the_sufis:0				"Setzen Sie die Sufis ein"
AFG_utilize_the_sufis_desc:0				""
AFG_tunganistan:0				"Befreien Sie die östlichen Muslime"
AFG_tunganistan_desc:0				"Viele Jahre lang hat das uigurische Volk unter dem [CHI.GetAdjective]-Regime gelitten, nun ist Schluss damit! Wir müssen unsere Brüder von ihren Unterdrückern befreien. Wir müssen denen helfen, die in Not sind, und uns wird im Gegenzug geholfen werden."
AFG_request_german_reinforcements:0				"Bitte um [GER.GetAdjective] Militärische Unterstützung"
AFG_request_german_reinforcements_desc:0				"Das [AFG.GetAdjective] Militär kann sich nicht als modern, geschweige denn als stark bezeichnen. Es besteht größtenteils aus Stammessöldnern und Kriegern, die untrainiert und schlecht ausgerüstet sind. Es scheint jedoch, dass die [GER.Adjective] bereit sein könnten, uns bei der Verbesserung unseres Militärs zu helfen. Vielleicht sollten wir sie um Unterstützung bitten?"
AFG_seize_royal_assets:0				"Königliche Güter beschlagnahmen"
AFG_seize_royal_assets_desc:0				"Nachdem der König feige aus dem Land geflohen ist, hat er einen Großteil seiner privaten Besitztümer und Vermögenswerte in [AFG.GetNonIdeologyName] zurückgelassen. Wir sollten diese Vermögenswerte beschlagnahmen und umverteilen, da der König sie offensichtlich nicht mehr benötigt."
AFG_kabul_military_college:0				"Öffnen Sie die Kābul-Militärakademie"
AFG_kabul_military_college_desc:0				"Der [AFG.GetAdjective] Militärstab ist unerfahren, viele sind ungebildet und verstehen nicht einmal die einfachste Kriegsführung. Wir müssen eine Militärakademie eröffnen, um unser Militärpersonal auszubilden und zu verbessern."
AFG_german_equipment:0				"Kaufen Sie [GER.GetAdjective] Ausrüstung"
AFG_german_equipment_desc:0				"Die Militärindustrie von [AFG.GetNonIdeologyName] ist weitgehend unterentwickelt und kann den Bedarf der [AFG.GetAdjective] Streitkräfte nicht decken. Daher ist [AFG.GetNonIdeologyName] gezwungen, militärische Ausrüstung aus dem Ausland zu kaufen. Wir könnten ein lukratives Waffengeschäft mit den [GER.GetAdjective] arrangieren."
AFG_support_the_palestinians:0				"Unterstützen Sie die Palästinenser"
AFG_support_the_palestinians_desc:0				""
AFG_invite_amin_al_husseini:0				"Laden Sie Amin al-Husseini ein"
AFG_invite_amin_al_husseini_desc:0				"Der Großmufti von Jerusalem hat [AFG.GetNonIdeologyName] schon viele Male besucht. Wir könnten ihn noch einmal einladen, dieses Mal, um in [AFG.GetNonIdeologyName] zu bleiben und den [PAL.GetAdjective] Widerstand von [AFG.GetNonIdeologyName] aus anzuführen und vielleicht auch der [AFG.GetAdjective] Regierung zu helfen."
AFG_approach_mubashir:0				"Annäherung an Mubashir al-Tarazi"
AFG_approach_mubashir_desc:0				"Nachdem er im April 1930 aus Kasachstan verbannt worden war, suchte Mubashir al-Tarazi Zuflucht in [AFG.GetNonIdeologyName], wo er seinen Widerstand gegen die [SOV.GetAdjective] fortsetzen konnte. Während der Zeit von Nadir Shah erhielt er hochrangige Positionen und war hoch angesehen, es ist wichtig, dass wir seine Unterstützung gewinnen."
AFG_form_the_turkestan_legion:0				"Bilden Sie die Turkestanische Legion"
AFG_form_the_turkestan_legion_desc:0				"Die in Zentralasien lebenden Turkvölker werden seit der Oktoberrevolution von den [SOV.GetAdjective]s unterdrückt. Ihr Recht, an den Islam zu glauben und ihn zu praktizieren, wurde ihnen entzogen. Wir müssen den rebellischen Geist dieser Menschen wieder erwecken!"
AFG_nationalize_spiznar:0				"Verstaatlichen Sie die Baumwollindustrie"
AFG_nationalize_spiznar_desc:0				"Die Sherkat-e Ettehadiya-ye Velayat-e Shomal beschäftigt mehr als 12000 Menschen. Wenn wir die Fabrik in die Hände der Regierung legen würden, hätten wir viele Vorteile und die [AFG.GetAdjective] Menschen auch."
AFG_cooperate_with_hazaras:0				"Mit Hazaras zusammenarbeiten"
AFG_cooperate_with_hazaras_desc:0				"Religiöse Unterschiede innerhalb der [AFG.GetNonIdeologyName] bestehen in der Tat noch immer. Die Hazaras sind eine Gruppe von Menschen, die in [1009.GetName] leben und hauptsächlich Schiiten sind. Um Kämpfe zu vermeiden, müssen wir die schiitischen und sunnitischen Gemeinschaften von [AFG.GetNonIdeologyName] vereinen. Kein Glaube im Islam ist minderwertig!"
AFG_form_muslim_youth:0				"Bauen Sie die muslimische Jugend auf"
AFG_form_muslim_youth_desc:0				"Um den Islam zu verbreiten, müssen wir die Saat des Islams in die Köpfe der jungen Menschen pflanzen. Die Gründung eines Jugendverbandes würde sich dabei als sehr effektiv und nützlich erweisen."
AFG_eradicate_communism:0				"Den Kommunismus ausrotten"
AFG_eradicate_communism_desc:0				"Ist der Kommunismus wirklich die Wurzel allen Übels? Wir wissen es nicht, aber es ist besser, wenn wir es nicht auf die harte Tour herausfinden, denn schließlich fürchten die Menschen die Dinge, die sie nicht verstehen. Daher ist es am besten, wenn wir diese böse Doktrin ausrotten, um der Menschheit willen, nicht wahr?"
AFG_revive_the_basmachi_movement:0				"Die Basmachi-Bewegung wiederbeleben"
AFG_revive_the_basmachi_movement_desc:0				"Die in Zentralasien lebenden Turkvölker werden seit der Oktoberrevolution von den [SOV.GetAdjective]s unterdrückt. Ihr Recht, an den Islam zu glauben und ihn zu praktizieren, wurde ihnen entzogen. Wir müssen den rebellischen Geist dieser Menschen wieder erwecken! Erhebt euch, Brüder!"
AFG_end_the_revolution:0				"Beendet die Revolution"
AFG_end_the_revolution_desc:0				"Der Kommunismus ist eine böse Ideologie, die nichts als Tod und Zerstörung bringt, wo immer sie Fuß fasst, zumindest glauben wir das. Es ist unsere Pflicht, dem Kommunismus ein für alle Mal ein Ende zu bereiten und zu verhindern, dass Menschen auf der ganzen Welt in Zukunft unter seinem Deckmantel leiden müssen. Wir müssen die [SOV.GetAdjective] Bedrohung im Norden bekämpfen!"
AFG_the_fate_of_imperialism:0				"Das Schicksal des Imperialismus"
AFG_the_fate_of_imperialism_desc:0				"Im vergangenen Jahrhundert wurde [AFG.GetNonIdeologyName] von den Imperialisten in [ENG.Capital.GetCapitalVictoryPointName] und [SOV.Capital.GetCapitalVictoryPointName] immer wieder missbraucht und überfallen. Wir werden uns nicht länger vor diesen imperialen Mächten niederknien, die Zeit der Rache ist gekommen!"
AFG_proclaim_pashtunistan:0				"Fördern Sie den Paschtunismus"
AFG_proclaim_pashtunistan_desc:0				"Endlich ist der Traum von einem vereinten Land für alle Paschtunen wahr geworden. Dies ist unser Land und es ist an der Zeit, dass wir der Welt zeigen, dass wir dafür kämpfen und sterben werden. Ruhm für Paschtunistan!"
AFG_pillars_of_islam:0				"Die Säulen des Islam"
AFG_pillars_of_islam_desc:0				"Wir müssen uns auf den Kern unserer Religion konzentrieren und auf das, was uns von anderen unterscheidet. Um ein Haus zu bauen, braucht man ein starkes Fundament. Das gilt auch für den Islam."
AFG_enforce_the_pashtunwali:0				"Setzen Sie das Paschtunwali durch"
AFG_enforce_the_pashtunwali_desc:0				"Das Paschtunwali ist ein Kodex oder eine vollständige Lebensweise des paschtunischen Volkes. Er hat viel mit dem Islam gemeinsam, der Gerechtigkeit und Tapferkeit predigt, aber auch viele andere wichtige Werte, die die paschtunische Kultur ausmachen. Um die öffentliche Ordnung aufrechtzuerhalten, müssen wir diese Werte durchsetzen."
AFG_islamic_cooperation:0				"Verbessern Sie die interislamische Zusammenarbeit"
AFG_islamic_cooperation_desc:0				"Geteilt sind wir schwach, geeint sind wir stark. Wenn der Islam gedeihen soll, müssen wir die wirtschaftliche Zusammenarbeit zwischen unseren Verbündeten verbessern, indem wir den Handel und die Investitionen steigern."
AFG_the_ten_lost_tribes:0				"Rache für die zehn verlorenen Stämme"
AFG_the_ten_lost_tribes_desc:0				"Die Ursprünge des paschtunischen Volkes sind unbekannt. Einige glauben, dass die Paschtunen Nachfahren der Hunnen sind, während andere glauben, dass wir die Nachfahren der Paktyanen sind. Eine Legende hat sich jedoch jahrhundertelang durchgesetzt, nämlich die, dass die Paschtunen von den Zehn verlorenen Stämmen Israels abstammen. Wenn dies tatsächlich der Fall ist, erheben wir Anspruch auf das Land Israel als unser Heimatland."
AFG_return_of_the_king:0				"Die Rückkehr des Königs"
AFG_return_of_the_king_desc:0				"König Amanullah befindet sich seit dem saqqawistischen Bürgerkrieg im Jahr 1929 im Exil. Es ist an der Zeit, ihn wieder nach [AFG.GetNonIdeologyName] einzuladen, hoffentlich hat er seine Lektion gelernt."
AFG_peace_through_islam:0				"Der Islam in einer Nation"
AFG_peace_through_islam_desc:0				"Es gibt keinen anderen Weg zum Frieden auf der Welt als die vollständige Vereinigung aller Menschen unter dem Islam. Nur durch Allah können wir vollständigen Frieden und Wohlstand für die menschliche Ethnie erreichen."
AFG_approach_pakistani_resistance:0				"Nähern Sie sich dem [PAK.GetAdjective]-Widerstand"
AFG_approach_pakistani_resistance_desc:0				"Unsere muslimischen Brüder im Süden sind immer noch von den Imperialisten besetzt! Wir müssen über die Durand-Linie marschieren und sie von ihren Fesseln befreien. Brüder, erhebt euch!"
AFG_global_islamic_revolution:0				"Setzen Sie die dritte Waziristan-Kampagne fort"
AFG_global_islamic_revolution_desc:0				"Der Dschihad gegen die Imperialisten ist der einzige Weg, um unsere Völker zu vereinen. Viele Schlachten wurden in der Vergangenheit geschlagen und viele müssen noch geschlagen werden, bis alle Paschtunen wieder geeint sind. Heute werden wir kämpfen und unser Leben in Seinem Namen geben, morgen werden wir Erfolg haben."
AFG_german_junker_purchase:0				"Kauf [GER.GetAdjective] Junkers"
AFG_german_junker_purchase_desc:0				"Die [AFG.GetAdjective] Luftwaffe ist praktisch nicht existent, um sie zu verbessern, müssen wir ausländische Flugzeuge kaufen, vielleicht können die [GER.GetAdjective] uns dabei helfen. Immerhin hat [AFG.GetNonIdeologyName] bereits viele [GER.GetAdjective] Lufttechniker und Piloten."
AFG_bury_the_hatchet:0				"Das Kriegsbeil begraben"
AFG_bury_the_hatchet_desc:0				"Es gibt immer noch religiöse Unterschiede innerhalb des Islams. Die Perser sind eine Gruppe von Menschen, die in erster Linie Schiiten sind. Um Kämpfe zu vermeiden, müssen wir die schiitischen und sunnitischen Gemeinschaften in Persien und [AFG.GetNonIdeologyName] vereinen. Kein Glaube im Islam ist minderwertig!"
AFG_in_alexanders_footsteps:0				"Auf den Spuren Alexanders"
AFG_in_alexanders_footsteps_desc:0				"Es war einmal, vor fast zwei Jahrtausenden, da marschierte Alexander der Große mit seinen Phalanxen durch diese Länder. Er betrat diese Länder, während er sie eroberte. Sein Vermächtnis hat unsere Kultur und Geschichte stark geprägt."
AFG_break_the_six_arrows:0				"Brechen Sie die sechs Pfeile des Kemalismus"
AFG_break_the_six_arrows_desc:0				"Der Säkularismus ist eine Schande für die Erde. Die Trennung der Regierung vom Islam ist sowohl lächerlich als auch verachtenswert. Wir müssen diese Ideologie ausrotten wie Unkraut aus einem Garten!"

