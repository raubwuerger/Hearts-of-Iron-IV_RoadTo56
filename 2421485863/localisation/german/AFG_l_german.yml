 AFG_illiteracy_3_desc:0 "Die Bevölkerung [AFG.GetAdjektiv] leidet unter weit verbreitetem Analphabetismus, wobei weniger als zehn Prozent lesen oder schreiben können, was hauptsächlich auf die schlechte Lebensqualität und die Misswirtschaft im Bildungssystem zurückzuführen ist. Dieser gravierende Mangel an Fachkräften hat dazu geführt, dass höhere Positionen und Regierungsposten entweder unbesetzt bleiben oder mit Ausländern wie Türken und Deutschen besetzt werden. Selbst die neu eröffnete Universität Kabul, die 1931 gegründet wurde, hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Zulassung von Studenten hinnehmen müssen."
 AFG_illiteracy_4:0 "Sehr niedrige Analphabetenrate"
 AFG_illiteracy_4_desc:0 "Die Bevölkerung [AFG.GetAdjektiv] leidet unter weit verbreitetem Analphabetismus. Weniger als zehn Prozent können lesen oder schreiben, was hauptsächlich auf die schlechte Lebensqualität und die Misswirtschaft im Bildungssystem zurückzuführen ist. Aufgrund dieses gravierenden Mangels an Fachkräften sind höhere Positionen und Regierungsposten entweder unbesetzt oder werden von Ausländern wie Türken und Deutschen besetzt. Selbst die neu eröffnete Universität Kabul, die 1931 gegründet wurde, hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Zulassung von Studenten hinnehmen müssen."
