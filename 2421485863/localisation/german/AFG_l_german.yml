r56_afghanistan_focus:0				"[AFG.GetAdjective] Nationaler Fokus"
r56_AFG_GATHERING_STORM_DESC:0				"Afghanistan wurde inmitten der Asche des blutigen Dritten Anglo-Afghanischen Krieges geboren und ist seit Jahrhunderten ein Schlachtfeld der Imperien. Das kleine, aber zerbrechliche Land leidet noch immer unter den Narben des Bürgerkriegs von 1929, der die arme Nation zerriss und zu einem starken Rückgang der afghanischen Wirtschaft führte. \n\nSeit der brutalen Ermordung von Nadir Shah im Jahr 1933 wird das Land de facto vom Regentschaftsrat geführt, der die Taten des jungen Muhammad Zahir Shah überwacht. Doch angesichts der dunklen Wolken am Horizont bleibt die Zukunft Afghanistans ungewiss..."
r56_AFG_zahir_shah_idea:0				"Muhammad Zahir Schah"
r56_AFG_zahir_shah_idea_desc:0				"Obwohl er sich nicht für Politik interessiert, ist König Muhammad Zahir Shah immer noch eine sehr wichtige Figur in [AFG.GetNonIdeologyName], die zur Stabilität und zum Prestige von [AFG.GetNonIdeologyName] beiträgt."
r56_AFG_zahir_shah_improved_idea:0				"Muhammad Zahir Schah"
r56_AFG_zahir_shah_improved_idea_desc:0				"Obwohl er sich nicht für Politik interessiert, ist König Muhammad Zahir Shah immer noch eine sehr wichtige Figur in [AFG.GetNonIdeologyName] und trägt zu seiner Stabilität und dem Ansehen von [AFG.GetNonIdeologyName] bei."
r56_afghanistan.1.t:0				"Stammeshäuptlinge bieten Hilfe an"
r56_afghanistan.1.d:0				"In einer Zeit der Not ist ein lokaler Stamm an uns herangetreten und hat uns angeboten, uns militärisch zu unterstützen. Der Stamm, der für seine kämpferischen Fähigkeiten und seine Loyalität bekannt ist, ist bereit, Soldaten zu stellen, um die Reihen unserer Armee zu verstärken. Der Stamm wird eine Vorzugsbehandlung erwarten und möglicherweise eine größere Rolle bei unseren militärischen Operationen verlangen. Wird dies gewährt, könnte dies dazu führen, dass unsere Armee stärker von diesen Stämmen abhängig wird, was zu Spannungen mit anderen Fraktionen im Land führen könnte."
r56_afghanistan.1.a:0				"Wir können jede Hilfe gebrauchen, die wir bekommen können."
r56_afghanistan.1.b:0				"Wir benötigen diese Hilfe nicht."
r56_afghanistan.2.t:0				"[AFG.GetNonIdeologyName] bittet um politische Unterstützung"
r56_afghanistan.2.d:0				"[AFG.GetNonIdeologyName] fehlt es an politischen Führern und Revolutionären, die das Volk und die Hezb-e Khalq anführen können. Wir sollten tadschikische Berater zu [AFG.GetNonIdeologyName] schicken, da sie kulturell und sprachlich den Einheimischen ähnlich sind. Wenn wir uns entscheiden, keine diplomatische und politische Unterstützung zu schicken, könnte [AFG.GetNonIdeologyName] sich von uns distanzieren und einen anderen, von [SOV.Capital.GetCapitalVictoryPointName] getrennten Weg gehen!"
r56_afghanistan.2.a:0				"Schicken Sie Nisar Muhammad Yousafzai, den Helden des dritten anglo-afghanischen Krieges."
r56_afghanistan.2.b:0				"Dmitri Protopopov, jung, aber loyal, ist genau der richtige Mann für diese Aufgabe."
r56_afghanistan.2.c:0				"Sie haben unsere kostbare Zeit nicht verdient!"
r56_afghanistan.3.t:0				"Die Tadschikistan-Frage"
r56_afghanistan.3.d:0				"Die Regierung von [AFG.GetAdjective] ist mit einer interessanten Bitte an uns herangetreten. Sie hat die Übertragung des Eigentums an [742.GetName] an Afghanistan gefordert. Dies geschieht nicht ohne Grund, denn das tadschikische und das paschtunische Volk haben über Jahrhunderte hinweg in relativem Frieden in [AFG.GetNonIdeologyName] gelebt und haben viele Gemeinsamkeiten. Es wäre klug, ihnen dieses Zugeständnis zu gewähren, da sie höchstwahrscheinlich auf weniger politischen Widerstand seitens der Tadschiken stoßen würden."
r56_afghanistan.3.a:0				"Wir werden [AFG.GetNonIdeologyName]s Loyalität belohnen..."
r56_afghanistan.3.b:0				"Das ist lächerlich! Tadschikistan ist ein integraler Bestandteil von [ROOT.GetNameDef]!"
r56_afghanistan.4.t:0				"Die [SOV.GetAdjective] akzeptieren unseren Vorschlag"
r56_afghanistan.4.d:0				"Nachdem wir den Brief vor einigen Tagen erhalten haben, hat [SOV.Capital.GetCapitalVictoryPointName] unserem Vorschlag zugestimmt, [742.GetName] soll in [AFG.GetNonIdeologyName] eingegliedert werden. Wir müssen hoffen, dass sich die Tadschiken nicht gegen den neuen Wechsel in der Regierung und der lokalen Herrschaft wehren. Allerdings werden wir in Zukunft auf ein ausgewogenes Verhältnis zwischen den tadschikischen Gemeinschaften und dem Rest von [AFG.GetNonIdeologyName] achten müssen, denn [AFG.GetNonIdeologyName] ist nun auch eine Nation aller Tadschiken..."
r56_afghanistan.4.a:0				"Tadschiken und Paschtunen, einmal mehr in Harmonie!"
r56_afghanistan.5.t:0				"[AFG.GetNonIdeologyName] schlägt Invasion von [PER.GetNonIdeologyName] vor"
r56_afghanistan.5.d:0				"Wir haben einen interessanten Vorschlag von der [AFG.GetAdjective] Regierung erhalten. Sie schlagen eine gemeinsame Invasion von [PER.GetNameDef] vor, um die Südfront zu sichern und zu verhindern, dass unerwünschte Einflüsse nach Persien eindringen. Dies würde uns auch helfen, unsere Interessen im Nahen Osten zu fördern und mehr Ölfelder zu sichern sowie unsere eigenen in Baku zu schützen."
r56_afghanistan.5.a:0				"Hervorragend! Bereiten Sie die Truppen für eine Invasion vor!"
r56_afghanistan.5.b:0				"Das geht uns derzeit nichts an..."
r56_afghanistan.6.t:0				"[SOV.GetAdjective]s lehnen unseren Vorschlag ab"
r56_afghanistan.6.d:0				"Nachdem wir den Brief vor einigen Tagen erhalten haben, hat [SOV.Capital.GetCapitalVictoryPointName] beschlossen, unseren Antrag abzulehnen. Unser Vertrauen in die [SOV.GetAdjective] Regierung ist erschüttert. Obwohl ein großer Teil der [AFG.GetAdjective] Bevölkerung ethnisch tadschikisch ist, wird [AFG.GetNonIdeologyName] niemals in der Lage sein, die tadschikischen Länder zu vereinen!"
r56_afghanistan.6.a:0				"Schlechte Wahl, Herr [SOV.GetLeader]!"
r56_afghanistan.7.t:0				"Nomaden siedeln sich in [AFG_nomad_state.GetName] an"
r56_afghanistan.7.d:0				"Viele Nomaden aus den benachbarten Wüsten und Tälern haben beschlossen, sich in [AFG_nomad_state.GetName] niederzulassen, wie die Wilayat-Gouverneure in [AFG_nomad_state.GetName] berichten. Das wird natürlich unserer Wirtschaft zugute kommen, aber wir müssen hoffen, dass [AFG_nomad_state.GetName] einen so großen Zustrom von Nomaden in so kurzer Zeit verkraften kann."
r56_afghanistan.7.a:0				"Je mehr, desto besser!"
r56_afghanistan.12.t:0				"Der [AFG.GetAdjective] Staatsbesuch in [GER.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.12.d:0				"Nachdem sie vor vielen Wochen aus Kābul abgereist ist, ist die königliche Familie in [GER.Capital.GetCapitalVictoryPointName] angekommen. Bei ihrer Ankunft wurden sie von [GER.GetLeader] selbst begrüßt, der sich freute, die Königliche Familie von [AFG.GetNonIdeologyName] zu treffen. Während des Besuchs zeigte Sardar Muhammad Hashim Khan großes Interesse an der [GER.GetAdjective] Lebensweise und den [GER.GetAdjective] Traditionen. Während seiner Teilnahme an einer von [GER.GetLeader] organisierten Gala in [GER.Capital.GetCapitalVictoryPointName] bekundete er sein Interesse an einer verstärkten wirtschaftlichen und militärischen Zusammenarbeit mit [GER.GetNameDef]."
r56_afghanistan.12.a:0				"Vielleicht wird [GER.GetNonIdeologyName] der treueste Freund von [AFG.GetNonIdeologyName] sein..."
r56_afghanistan.13.t:0				"Die [SOV.GetAdjective] lehnen eine Invasion von [PER.GetNonIdeologyName] ab"
r56_afghanistan.13.d:0				"Die Regierung von [SOV.GetAdjective] hat unseren Antrag auf eine Invasion von [PER.GetNameDef] abgelehnt. Sie hat verkündet, dass die Südfront für sie nicht von großer Bedeutung sei und dass [PER.GetNameDef] keine Bedrohung für die Ölfelder in Baku darstelle."
r56_afghanistan.13.a:0				"Solche Narren, die in [SOV.Capital.GetCapitalVictoryPointName]..."
r56_afghanistan.14.t:0				"Die [GetYear] [AFG.GetAdjective] Wahlen"
r56_afghanistan.14.d:0				"Der Weg zur Demokratie in [AFG.GetNonIdeologyName] war lang und hart. Aber er wurde erreicht. Die [GetYear] [AFG.GetAdjective] Wahlen sind der Beweis, dass Demokratie in [AFG.GetNonIdeologyName] möglich und erreichbar ist, zumindest sagen das einige. [GetElectionWinner]"
r56_afghanistan.14.a:0				"Das ist es, was wir gerne sehen: freie und vor allem faire Wahlen!"
r56_afghanistan.14.b:0				"Ein Schritt näher zur wahren Demokratie!"
r56_afghanistan.14.c:0				"Fälschen Sie die Stimmen, wir können es uns nicht leisten, die Wahl zu verlieren..."
r56_afghanistan.15.t:0				"Die Vorbereitungen für Amanullahs Europareise"
r56_afghanistan.15.d:0				"Seit seiner Rückkehr nach [AFG.GetNonIdeologyName] vor nicht allzu langer Zeit hat Amanullah eine königliche Tour durch Europa geplant. Als er dies das letzte Mal wagte, wurde er durch einen Bürgerkrieg in [AFG.GetNonIdeologyName] unterbrochen, während er im Ausland war. Daraufhin ging er mit dem Rest der königlichen Familie ins Exil. Dieses Mal hat er geplant, die gleiche Tour wie 1928 zu unternehmen und Kairo, Rom, Paris, [ENG.Capital.GetCapitalVictoryPointName], [GER.Capital.GetCapitalVictoryPointName], Warschau und schließlich Istanbul zu besuchen. Wenn alles wie geplant verläuft, wird Amanullah diese Reise in etwa 6 Monaten abgeschlossen haben. Wir können nur hoffen, dass die Lage zu Hause stabil bleibt und der König sicher zurückkehrt."
r56_afghanistan.15.a:0				"Ich wünsche dem König eine sichere Reise!"
r56_afghanistan.16.t:0				"Nisar Muhammad Yousafzai kommt aus [SOV.Capital.GetCapitalVictoryPointName] an"
r56_afghanistan.16.d:0				"Vor wenigen Tagen erreichte der Bericht aus Kābul [SOV.Capital.GetCapitalVictoryPointName] und die Hände von [SOV.GetLeader]. Nachdem er die Nachricht erhalten hatte, berief [SOV.GetLeader] eine Versammlung seiner treuesten Männer ein, die dann sorgfältig und bedächtig über den vorgelegten Vorschlag debattierten. Nach vielen langen Stunden hitziger Debatten wurde eine Entscheidung getroffen: Nisar Muhammad Yousafzai, einer der Gründer der ASSR Tadschikistan und Held des Dritten Anglo-Afghanischen Krieges, wird zusammen mit Vitaly Primakov, dem stellvertretenden Kommandeur des Leningrader Militärbezirks, in Kürze in Kābul eintreffen. Wie vorgeschlagen, wird auch Nisar Muhammad Yousafzai die führende Figur des Khalq werden."
r56_afghanistan.16.a:0				"Tovarishi, willkommen bei [AFG.Capital.GetCapitalVictoryPointName]!"
r56_afghanistan.17.t:0				"Dmitri Protopopov kommt aus [SOV.Capital.GetCapitalVictoryPointName] an"
r56_afghanistan.17.d:0				"Erst vor wenigen Tagen erreichte der Bericht aus Kābul [SOV.Capital.GetCapitalVictoryPointName] und die Hände von [SOV.GetLeader]. Nachdem er die Nachricht erhalten hatte, berief [SOV.GetLeader] eine Versammlung seiner loyalsten Männer ein, die dann sorgfältig und wohlüberlegt über den vorgelegten Vorschlag debattierten. Nach vielen langen Stunden hitziger Debatten wurde eine Entscheidung getroffen: Dmitri Protopopov, eine prominente und bekannte Persönlichkeit in der tadschikischen Politik, wird zusammen mit Vitaly Primakov, dem stellvertretenden Kommandanten des Leningrader Militärbezirks, in Kürze in Kābul eintreffen. Wie vorgeschlagen, wird Protopopov auch die führende Figur des Khalq und der [AFG.GetAdjective] Nation werden."
r56_afghanistan.17.a:0				"Tovarishi, willkommen bei [AFG.Capital.GetCapitalVictoryPointName]!"
r56_afghanistan.18.t:0				"Die [SOV.GetAdjective] lehnen unseren Antrag ab!"
r56_afghanistan.18.d:0				"Erst vor wenigen Tagen erreichte der Bericht aus Kābul [SOV.Capital.GetCapitalVictoryPointName] und die Hände von [SOV.GetLeader]. Nachdem er die Nachricht erhalten hatte, berief [SOV.GetLeader] eine Versammlung seiner treuesten Männer ein, die dann sorgfältig und bedächtig über den vorgelegten Vorschlag debattierten. Nach vielen langen Stunden hitziger Debatten kam es aufgrund erheblicher Meinungsverschiedenheiten unter den Bolschewiken nicht zu einer Entscheidung. Es scheint, dass [SOV.Capital.GetCapitalVictoryPointName] kein Interesse an [AFG.GetNonIdeologyName] hat, wir können nur hoffen, dass dies nicht das Ende für die Beziehungen zwischen [SOV.GetAdjective] und [AFG.GetAdjective] bedeutet."
r56_afghanistan.18.a:0				"Wie können sie es wagen! Das ist inakzeptabel!"
r56_afghanistan.19.t:0				"Die Krise des Rates"
r56_afghanistan.19.d:0				"Der Revolutionsrat ist schon viel zu lange ohne Vorsitzenden, wir können nicht erwarten, dass er ohne einen richtigen Führer des Rates weiterarbeitet. Es ist an der Zeit, einen Vorsitzenden zu wählen, denn die [SOV.GetAdjective]s haben es versäumt, uns genügend Führungspersönlichkeiten zu geben, die den Revolutionsrat leiten könnten. Stabilität und Ordnung müssen innerhalb der Partei aufrechterhalten werden!"
r56_afghanistan.19.a:0				"Die Stabilität muss um jeden Preis aufrechterhalten werden!"
r56_afghanistan.19.b:0				"Bevorzugen Sie die Parchamiten..."
r56_afghanistan.20.t:0				"Jährliches turkmenisches Sportfest"
r56_afghanistan.20.d:0				"Der König von [AFG.GetNonIdeologyName], Muhammad Zahir Shah, hat an dem jährlichen turkmenischen Sportfest teilgenommen, das in einer Stadt in der Nähe von Kābul veranstaltet wird. Ein lokales Pferdefest, das dazu dient, die Menschen in [AFG.GetNonIdeologyName] von der Welt abzulenken, die langsam in Feuer und Flammen aufgeht. Zum Glück müssen sich die Menschen in [AFG.GetAdjective] nicht grämen, denn eine ausländische Invasion von [AFG.GetNonIdeologyName] ist unwahrscheinlich, oder?"
r56_afghanistan.20.a:0				"Solange der König an der Macht ist, ist [AFG.GetNonIdeologyName] unschlagbar!"
r56_afghanistan.20.b:0				"Er kokettiert, während die Welt brennt... Eine Schande!"
r56_afghanistan.21.t:0				"Mawlana Qiamuddin Khadim verhaftet"
r56_afghanistan.21.d:0				"Die KhAD hat heute eine Razzia in Qiamuddins Haus durchgeführt, er wurde wegen eines mutmaßlichen Komplotts gegen die Regierung und die Partei Afghanistans verhaftet. Der Chef der KhAD hat drei Lösungen für seine Verhaftung vorgeschlagen, seine Hinrichtung würde die Parcham-Fraktion verärgern, aber auch einen ihrer einflussreichsten, wenn nicht sogar den einflussreichsten Führer beseitigen, ihn einfach zu verhaften und ihn aus der Politik zu entfernen ist auch eine gute Wahl, wir könnten ihn auch freilassen, aber das würde Instabilität verursachen und die Parcham stärken."
r56_afghanistan.21.a:0				"Ich sage: Schickt ihn an den Galgen!"
r56_afghanistan.21.b:0				"Nehmen Sie den Verräter fest, er soll zu lebenslanger Haft verurteilt werden."
r56_afghanistan.21.c:0				"Lassen Sie ihn frei, wir müssen die Zusammenarbeit mit den Parchamiten suchen..."
r56_afghanistan.22.t:0				"Mawlana Qiamuddin Khadim stirbt im Gefängnis"
r56_afghanistan.22.d:0				"Der Anführer der Parcham, Mawlana Qiamuddin Khadim, ist heute im Gefängnis gestorben. Viele Menschen haben seine Verhaftung seither boykottiert und dagegen protestiert, aber wir haben diese Proteste erfolgreich unterdrückt."
r56_afghanistan.22.a:0				"Wo ziehen wir die Grenze?"
r56_afghanistan.23.t:0				"Die Bildungsreform ist beendet"
r56_afghanistan.23.d:0				"Nach vielen Jahren und Monaten hat [AFG.GetNonIdeologyName] endlich seine Bildungsreform abgeschlossen. Viele ländliche Schulen im ganzen Land wurden daraufhin eröffnet, um die Menschen zu unterrichten, fast alle Menschen in [AFG.GetNonIdeologyName] können jetzt lesen und schreiben, auch viele ältere Menschen. Wir müssen diese Nation weiter verbessern, so gut wir können. Hoffentlich wird die nächste Generation von [AFG.GetAdjective] Denkern unserer Nation den Ruhm und Respekt verschaffen, den sie verdient!"
r56_afghanistan.23.a:0				"Die Zukunft von [AFG.GetNonIdeologyName] scheint rosig!"
r56_afghanistan.24.t:0				"Muhammad Amin Bughra kommt auf uns zu"
r56_afghanistan.24.d:0				"Über dem üppigen Wakhan-Korridor ist ein Krieg in einem fernen Land ausgebrochen. Gerade heute im Morgengrauen sind etwa vierzig Männer auf Pferden nach Kābul geritten, es scheint, als kämen sie aus dem Osten, aus der jetzt vom Krieg zerrissenen Region Tunganistan. Erschöpft vom tagelangen Ritt, aber immer noch mit viel zu übermitteln, baten sie sofort darum, mit [AFG.GetLeader] zu sprechen. Nachdem sie herausgefunden hatten, wer diese Männer wirklich waren, wurde ihrer Bitte entsprochen. \n\n Der Anführer dieser Expedition war kein anderer als Muhammad Amin Bughra, der im Exil lebende Führer der Republik Ostturkestan. Er und einige seiner Gefolgsleute waren Hunderte von Meilen gereist, um die Nachricht vom Kashgar-Aufstand nach Kābul zu bringen. Dabei hatten sie auch um militärische Unterstützung für Tunganistan gebeten. \n\nNachdem sie dies gehört hatten, rieten viele Generäle und hohe Offiziere der [AFG.GetAdjective] Armee [AFG.GetLeader], den Expeditionsreisenden nachzugeben, unsere Unterstützung könnte ihnen viel bedeuten, da sie die einzige ist, die sie haben."
r56_afghanistan.24.a:0				"Unsere volle Unterstützung gehört Ihnen!"
r56_afghanistan.24.b:0				"Nur... Lassen Sie die eifrigsten Männer gehen, wir wollen den Ärger nicht..."
r56_afghanistan.24.c:0				"[AFG.GetNonIdeologyName] darf sich nicht mit Leuten wie Ihnen abgeben..."
r56_afghanistan.25.t:0				"Der Flug über das Pamirgebirge"
r56_afghanistan.25.d:0				"Es ist der Morgen des 24. August. Drei mutige Männer haben sich entschlossen, die mutigste Aufgabe zu übernehmen: die Überquerung des Pamir. Nach wochenlanger Vorbereitung haben diese drei [GER.GetAdjective] Männer, die für die Lufthansa, eine [GER.GetAdjective] Fluggesellschaft, arbeiten, beschlossen, dass heute der Tag ist, an dem sie zu einem Flug über den Pamir aufbrechen werden, in der Hoffnung, die Berge und Wüsten auf der anderen Seite sicher zu erreichen. Wenn alles gut geht, werden sie voraussichtlich in nicht weniger als zwei Wochen zurückkehren."
r56_afghanistan.25.a:0				"In welch wunderbaren Zeiten wir leben. Ich wünsche ihnen eine sichere Reise!"
r56_afghanistan.26.t:0				"Das Verschwinden des Pamir-Fluges"
r56_afghanistan.26.d:0				"Seit drei Wochen gibt es keine Berichte über den Pamir-Flug. Nach unseren Schätzungen hätten sie schon vor vier Tagen hier sein müssen, aber sie sind nicht da. Es besteht jedoch noch Hoffnung, denn unsere Schätzungen könnten doch nicht stimmen und sie könnten jeden Moment zurückkehren, vielleicht landen sie ja gerade in dieser Sekunde in Kābul.Wir werden für ihre sichere Rückkehr beten."
r56_afghanistan.26.a:0				"Oh lieber Gott, was ist mit diesen armen Männern geschehen?"
r56_afghanistan.27.t:0				"Der Pamirflug landet in [AFG.Capital.GetCapitalVictoryPointName]!"
r56_afghanistan.27.d:0				"Nach einem Monat ist es gelungen, mit der Pamir Flight Kontakt aufzunehmen, und es wurde bestätigt, dass sie gesund und munter sind. Einige Tage nach der Herstellung des Funkkontakts mit der Flugbesatzung sind sie in Kābul gelandet und wurden wie Nationalhelden empfangen. Eine große Leistung wurde heute vollbracht, der erste Flug über den Pamir überhaupt hat stattgefunden!"
r56_afghanistan.27.a:0				"Puh... Wenigstens sind sie jetzt in Sicherheit."
r56_afghanistan.27.b:0				"Sie werden zu Nationalhelden von [AFG.GetNonIdeologyName] ernannt werden!"
r56_afghanistan.27.c:0				"Was für eine wahrhaft historische Leistung! Vielleicht können sie ja auch bei der Luftwaffe mithelfen..."
r56_afghanistan.28.t:0				"Königliche Familie gefangen genommen"
r56_afghanistan.28.d:0				"Während das Echo des Kanonenfeuers und der Gewehrschüsse in der Stille verklingt, wird berichtet, dass die königliche Familie von [AFG.GetNonIdeologyName], einschließlich König Zahir Shah, bei einem Fluchtversuch gefangen genommen wurde. Angeblich hatte die königliche Familie vorgehabt, mit dem Flugzeug zu fliehen, aber unvorhergesehene Umstände führten dazu, dass ihre Pläne von der Roten Armee von [AFG.GetNonIdeologyName] vereitelt wurden. Endlich wird der König mit den Konsequenzen seines eigenen Handelns konfrontiert!"
r56_afghanistan.28.a:0				"Bereit... Anlegen... Feuer!"
r56_afghanistan.29.t:0				"Die königliche Familie von [AFG.GetNonIdeologyName] bittet um Asyl"
r56_afghanistan.29.d:0				"Nach dem jüngsten Putsch in [AFG.GetNameDefCap] und dem endgültigen Untergang des Königreichs [AFG.GetNonIdeologyName] wurden König Zahir Shah und die königliche Familie von [AFG.GetNonIdeologyName] abgesetzt. Glücklicherweise ist es ihnen gelungen, den Händen der Kommunisten zu entkommen und das Land zu verlassen, was sie dazu veranlasst hat, in unserem Land Zuflucht zu suchen."
r56_afghanistan.29.a:0				"Sie sind hier mehr als willkommen!"
r56_afghanistan.29.b:0				"Schicken Sie sie auf den Weg, in [ROOT.Capital.GetCapitalVictoryPointName] ist kein Platz für sie..."
r56_afghanistan.30.t:0				"Jamiat-e Islami kontaktiert"
r56_afghanistan.30.d:0				"Nachdem Faqir im jüngsten Kampf gegen den König kontaktiert wurde, wurde die Jamiat kontaktiert und Maududi, ein bekannter islamistischer politischer Aktivist, hat sich bereit erklärt, eine Fatwa gegen Hashim Khan zu erlassen, in der er ihn zu einem 'Taghut' oder 'Tyrannen' erklärt, eine Person, gegen die eine offene Rebellion gerechtfertigt ist."
r56_afghanistan.30.a:0				"Die Fatwa wird öffentlich sein! Wir werden diese Tyrannei nicht länger hinnehmen!"
r56_afghanistan.30.b:0				"Verteilen Sie die Fatwa behutsam unter den Mitgliedern der Rebellion, um keinen Konflikt zu schüren..."
r56_afghanistan.31.t:0				"Stammeshäuptlinge versprechen Unterstützung"
r56_afghanistan.31.d:0				"Als nächsten Schritt, um eine regierungsfeindliche Stimmung im Land zu erzeugen, werden wir uns an die weitgehend isolierten Stämme wenden, die nichts von der Politik des Landes mitbekommen. Mit dem Versprechen, sie industriell zu entwickeln und politisch präsenter zu machen, können wir uns ihre Unterstützung sichern, auch wenn das Konsequenzen haben könnte, denn wenn wir versuchen, die Regierung zu zentralisieren, könnten sie in bestimmten Gebieten rebellieren."
r56_afghanistan.31.a:0				"Großartig!"
r56_afghanistan.32.t:0				"Jamiat-e Islami - Verstärkung eingetroffen"
r56_afghanistan.32.d:0				"Die Jamiat-e Islami, die wir in unserer Widerstandsgruppe sehr unterstützt haben, hat uns dringend benötigte Verstärkung in großer Zahl zukommen lassen. Die islamistischen Kräfte haben die Durand-Linie überschritten und sich ihren Landsleuten im Kampf gegen die Tyrannen in Kābul angeschlossen!"
r56_afghanistan.32.a:0				"Nur vereint können wir die Tyrannen unseres Volkes bezwingen!"
r56_afghanistan.33.t:0				"Jamiat-e Islami - Verstärkung eingetroffen"
r56_afghanistan.33.d:0				"Die Jamiat-e Islami, die wir in unserer Widerstandsgruppe sehr unterstützt haben, hat uns dringend benötigte Verstärkung in großer Zahl zukommen lassen. Die islamistischen Kräfte haben die Durand-Linie überschritten und sich ihren Landsleuten im Kampf gegen die Tyrannen in Kābul angeschlossen!"
r56_afghanistan.33.a:0				"Nur vereint können wir die Tyrannen unseres Volkes bezwingen!"
r56_afghanistan.34.t:0				"Die Unterstützung der Stämme kommt an"
r56_afghanistan.34.d:0				"Die Stämme haben ihr Hilfsversprechen eingelöst und uns eine große Summe an Waffen geschickt, die unsere Mudschaheddin in ihrem Dschihad gegen die Regierung einsetzen können. Sie mögen zwar alt sein, aber wir brauchen alles, was wir bekommen können."
r56_afghanistan.34.a:0				"Wunderbar!"
r56_afghanistan.35.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] - Die Frage der Schura"
r56_afghanistan.35.d:0				"Die Schura, oder 'Rat' in Paschtu, steht für ein frühes islamisches Prinzip, das die Einrichtung eines beratenden Gremiums zwischen dem Führer und bestimmten Beratern, die dem König oder Emir nahe stehen, fördert. In den frühen Stadien des Islam richteten Kalifate wie die Raschidun Räte von Beratern ein, die in Zeiten der Not versuchen sollten, dem Führer in Staatsangelegenheiten zu helfen.\n\nDas Dilemma, wer genau diese Berater ernennen sollte, ist jedoch seit Jahrhunderten nicht vollständig geklärt. Einige sind der Meinung, dass nur die hohen und mächtigen Eliten des Landes Einfluss auf die Entscheidungen des Führers haben sollten, andere meinen, dass der Führer selbst das Recht haben sollte, seinen eigenen Rat zu wählen, während ein modernerer Ansatz an Popularität gewonnen hat, nämlich die Demokratie, bei der Männer über fünfundzwanzig das Recht haben, Ratsmitglieder zu wählen."
r56_afghanistan.35.a:0				"Nur die Klügsten und Reichsten haben reine Absichten für die Nation!"
r56_afghanistan.35.b:0				"Das ist die Sache des Emirs, und nur des Emirs!"
r56_afghanistan.35.c:0				"Der moderne Ansatz scheint dem Volk durchaus zu gefallen..."
r56_afghanistan.36.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] - Die Umsetzung der Scharia"
r56_afghanistan.36.d:0				"Die Scharia ist das göttliche Gesetz, das jeder islamische Staat oder jedes Kalifat befolgen und umsetzen muss, so wie es im Koran steht und vom Gesandten Allahs, dem Propheten Muhammad, Friede sei mit ihm, angeordnet wurde. Es besteht aus einigen der grundlegendsten zivilen, finanziellen und sozialen Gesetzen, die jeder Mensch befolgen muss, sonst wird er vor einem Gericht islamischer Gelehrter, den Qadis, verurteilt. \n\n In der Vergangenheit gab es viele Interpretationen und Umsetzungen dieser Gesetze. Die drei wichtigsten sind die Interpretation aus der Rashidun-Ära, die die Loyalität zum Führer und den Militärdienst als höchste Qualität eines jeden fähigen Mannes fördert, die Interpretation aus der Ummayad-Ära, die sich hauptsächlich auf die radikale und schnelle territoriale Expansion, die Herrschaft und die anschließende Verbreitung des Islams konzentriert, und schließlich die moderne Interpretation aus der osmanischen Ära, die sich darauf konzentriert, das neue moderne Zeitalter und die Technologien mit den Lehren des Islams zu verschmelzen, aber gleichzeitig die traditionellen islamischen Werte und Traditionen zu schützen."
r56_afghanistan.36.a:0				"[AFG.GetNonIdeologyName] soll so rechtschaffen sein wie die Raschidun!"
r56_afghanistan.36.b:0				"Ein neues goldenes Zeitalter des Islam, das ist das Ziel von [AFG.GetNonIdeologyName]!"
r56_afghanistan.36.c:0				"Wir wollen moderne Technologie mit den Lehren des Islam verbinden!"
r56_afghanistan.37.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] - Die Rolle der Ulema"
r56_afghanistan.37.d:0				"Die Ulema, die klügsten und religiösesten von allen, spielen in jeder islamischen Nation eine sehr wichtige Rolle, manchmal als Motor für Reformen oder als Führer in schwierigen Zeiten, die kommen und gehen. Es ist jedoch für eine Nation und insbesondere für ihren Führer von größter Bedeutung, dass die Ulema loyal und zufrieden sind.\n\n Davon abgesehen kann die Nation die Ulema in vielerlei Hinsicht nutzen, sei es als Regierungsbeamte und Verwaltungsangestellte, militärische Reformer, Modernisierer und Lehrmeister, oder finanziell, durch Banken und Schatzkammern, sowie indem sie ihnen eine wichtige Rolle bei der Erziehung der Nation und ihrer Kinder zugesteht."
r56_afghanistan.37.a:0				"Die Verwaltung könnte eine helfende Hand gebrauchen..."
r56_afghanistan.37.b:0				"Ein starkes und mächtiges Land braucht eine starke und mächtige Armee!"
r56_afghanistan.37.c:0				"Die Kinder der Nation sollen nur von den Besten lernen."
r56_afghanistan.38.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] - Angelegenheiten der Zakat"
r56_afghanistan.38.d:0				"Zakat ist das grundlegende islamische Prinzip, das besagt, dass jeder arbeitsfähige Mann einen kleinen Betrag, fast 3%, seines Gehalts als Unterstützung für die Armen und Obdachlosen, die leider nicht in der Lage sind, für sich selbst zu sorgen, abgeben soll und muss. \n\nEs gibt viele Möglichkeiten, wie die Zakat gegeben werden kann. Sie könnte vom Staat als zusätzliche Steuer oder Gebühr eingeführt werden, die die Menschen zahlen müssten, oder sie könnte direkt für die Menschen organisiert werden, was eine viel einfachere Art der Umsetzung wäre, da es unkompliziert wäre und keine Bürokratie benötigt würde, und die dritte und letzte Option wäre eine staatlich organisierte Zakat in direkter Zusammenarbeit mit den Menschen, eine Verschmelzung der beiden vorherigen Vorschläge."
r56_afghanistan.38.a:0				"Nur der Staat kann garantieren, dass solche Dinge richtig gemacht werden!"
r56_afghanistan.38.b:0				"Direkt und geradlinig, es gibt keine Notwendigkeit für einen Mittelsmann."
r56_afghanistan.38.c:0				"Eine Vereinigung der beiden Vorschläge scheint am attraktivsten zu sein..."
r56_afghanistan.39.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] - Die Grundlagen des Dschihad"
r56_afghanistan.39.d:0				"Der Heilige Kampf oder 'Dschihad' auf Arabisch ist eines der, wenn nicht sogar das wichtigste Prinzip des Islam. Der Dschihad ist die wichtigste Waffe eines jeden islamischen Volkes, und das hat sich im Laufe der Geschichte unzählige Male gezeigt.\n\n Dschihad kann nicht nur den militärischen und physischen Kampf gegen einen Feind bedeuten, sondern sich auch auf den friedlichen und gewaltlosen Widerstand gegen einen Besatzer beziehen. Was auch immer wir als Grundlage für den Dschihad betrachten, wird darüber entscheiden, ob das Land [AFG.GetNonIdeologyName] sich durchsetzt oder untergeht, wie die zahllosen Reiche, die vor ihm zerfielen..."
r56_afghanistan.39.a:0				"Nur mit militärischen Mitteln können die Ziele unserer Nation und des Islam erreicht werden!"
r56_afghanistan.39.b:0				"Das Leben eines jeden Menschen soll sein eigener Dschihad sein!"
r56_afghanistan.39.c:0				"Der Islam hat nur deshalb so lange überlebt, weil er so widerstandsfähig ist, und das wird er auch weiterhin sein!"
r56_afghanistan.40.t:0				"Die Verfassung von [AFG.GetNonIdeologyName] ist ausgearbeitet!"
r56_afghanistan.40.d:0				"Nach zahllosen hitzigen Diskussionen über verschiedene Themen, die von der Verwaltung über die Gesellschaft bis hin zum Militär reichen, hat das Siegel von [AFG.GetNonIdeologyName] endlich die erste islamische Verfassung von [AFG.GetNonIdeologyName] geprägt. Mit der Unterstützung der Loya Jirga, der Shura und der Qadis und Scheichs wurde die [GetYear] Verfassung umgesetzt und sofort in Kraft gesetzt. Möge der Name [AFG.GetNonIdeologyName] und das [AFG.GetAdjective] Volk tausend Jahre lang gedeihen, und noch tausend Jahre mehr, Inshallah!"
r56_afghanistan.40.a:0				"[AFG.GetNonIdeologyName] Zindabad!"
r56_afghanistan.41.t:0				"Friedliche Kundgebung in [AFG_communist_state_target.GetName]"
r56_afghanistan.41.d:0				"Die letzte [PER.GetCommunistParty] Kundgebung in [AFG_communist_state_target.GetName] soll friedlich und ohne Unfälle verlaufen sein. Das wird uns helfen, unser Image erheblich zu verbessern und viele Menschen für unsere Sache zu gewinnen. Wir können nur hoffen, dass das so weitergeht!"
r56_afghanistan.41.a:0				"Wunderbar!"
r56_afghanistan.42.t:0				"Sozialistische Kundgebung in [AFG_communist_state_target.GetName]"
r56_afghanistan.42.d:0				"Die letzte [PER.GetCommunistParty]-Kundgebung in [AFG_communist_state_target.GetName] soll relativ friedlich verlaufen sein, wobei es einige Unfälle gab. Einige kommunistische Extremisten gerieten mit der Opposition aneinander, was zu einer Schlägerei führte. Die [PER.GetAdjective] Polizei war gezwungen einzugreifen, um die gefährliche Situation zu beruhigen. Wir müssen vorsichtig sein, um keine hitzige Reaktion zu provozieren."
r56_afghanistan.42.a:0				"Wir müssen Vorsicht walten lassen."
r56_afghanistan.43.t:0				"Gewalttätige Kundgebung in [AFG_communist_state_target.GetName]"
r56_afghanistan.43.d:0				"Die jüngste [PER.GetCommunistParty] Kundgebung in [AFG_communist_state_target.GetName] soll katastrophal verlaufen sein, viele Menschen wurden auf beiden Seiten verletzt, einige erlitten schwere Verletzungen und Wunden und wurden anschließend in das nächste Krankenhaus gebracht. Wir müssen diesen Extremismus zerschlagen! Wenn wir das nicht tun, könnte ein Bürgerkrieg in [PER.GetNameDef] wahrscheinlicher werden."
r56_afghanistan.43.a:0				"Das ist ziemlich gefährlich geworden..."
r56_afghanistan.44.t:0				"[AFG.GetNonIdeologyName] Schlägt einen Waffenstillstand vor"
r56_afghanistan.44.d:0				"Aufgrund der Tatsache, dass die [AFG.GetAdjective]-Kräfte in [PAK.GetNonIdeologyName] an Land festhalten, hat unsere Unfähigkeit, sie anzugreifen, zur Erschöpfung unserer Armee geführt, und wir halten es für das Beste, das von ihnen kontrollierte Land einfach abzutreten, da die Regionen uns nur Schwierigkeiten bereitet haben und schlecht entwickelt sind."
r56_afghanistan.44.a:0				"Nein! Wir werden bis zum bitteren Ende weiterkämpfen!"
r56_afghanistan.44.b:0				"Was auch immer das Beste für die Nation ist..."
r56_afghanistan.45.t:0				"[AFG.GetNonIdeologyName] bittet um militärischen Beistand"
r56_afghanistan.45.d:0				"Unter Berufung auf die Notwendigkeit, ihre Nation und ihr Volk zu schützen, das in einem sehr wichtigen strategischen Gebiet liegt, und auf die Tatsache, dass die [AFG.GetAdjective]-Regierung von potenziellen Feinden von [GER.GetNonIdeologyName] umgeben ist und keine Küstenlinie hat, hat sie um die Entsendung von [GER.GetAdjective]-Truppen auf ihr Territorium gebeten, um ihre Souveränität, ihre Verteidigung und die Interessen von [GER.GetAdjective] zu gewährleisten."
r56_afghanistan.45.a:0				"Wir können es uns nicht leisten, einen weiteren Verbündeten zu verlieren."
r56_afghanistan.45.b:0				"Unsere Truppen sollen zu Hause bleiben, wo sie hingehören!"
r56_afghanistan.46.t:0				"[GER.GetAdjective] Militärische Hilfe trifft ein"
r56_afghanistan.46.d:0				"Die [GER.GetAdjective] Regierung hat der Entsendung von fünf Wehrmachtsabteilungen zugestimmt, um unsere Armee bei der Verteidigung unseres Territoriums zu unterstützen. Sie begründen dies mit der Notwendigkeit, [AFG.GetNonIdeologyName] zu schützen, und sagen, dass [AFG.GetNonIdeologyName] strategisch wichtig für ihre Sache ist und ein guter Verbündeter der [GER.GetAdjective]s in der Region wäre."
r56_afghanistan.46.a:0				"Ausgezeichnet!"
r56_afghanistan.47.t:0				"Die [GER.GetAdjective] lehnen unsere Bitte ab"
r56_afghanistan.47.d:0				"Die [GER.GetAdjective] haben sich geweigert, Truppen zu entsenden, um [AFG.GetNameDef] zu verteidigen und uns in irgendeiner Form militärisch zu unterstützen, und berufen sich dabei vor allem auf die Priorität, die sie der Verteidigung von [GER.GetAdjective] Territorium einräumen. Ist dies wirklich der Verbündete, den [AFG.GetNonIdeologyName] an seiner Seite haben möchte?"
r56_afghanistan.47.a:0				"Was für eine traurige Ausrede für einen Verbündeten!"
r56_afghanistan.48.t:0				"Kommunisten stürmen [266.GetName]!"
r56_afghanistan.48.d:0				"Mitglieder der [PER.GetCommunistParty] haben gerade heute die Hauptstadt und das Parlament von [PER.GetNameDef] gestürmt, sie haben die derzeitige Regierung gestürzt und die Iranische Sozialistische Republik ausgerufen. Die [PER.GetCommunistParty] haben so viel Unterstützung gewonnen, dass der Widerstand gegen ihren Staatsstreich minimal war. Dies ist das Ende des Weges für [PER.GetRulingParty], aber ein Anfang für den Kommunismus in [PER.GetNameDef]."
r56_afghanistan.48.a:0				"Eine tragische Niederlage!"
r56_afghanistan.50.t:0				"[AFG.GetNonIdeologyName] drängt auf mehr Einheit"
r56_afghanistan.50.d:0				"Aufgrund unserer immer enger werdenden wirtschaftlichen und politischen Zusammenarbeit mit [AFG.GetNonIdeologyName] haben sie eine Vereinigung von [ROOT.GetNameDef] mit [AFG.GetNameDef] vorgeschlagen, um die revolutionäre Flamme im Nahen Osten unter einem Banner zu vereinen. Es liegt jedoch an uns, zu entscheiden, ob wir ihren Forderungen nachgeben oder sie ablehnen."
r56_afghanistan.50.a:0				"Eine brillante Idee!"
r56_afghanistan.50.b:0				"Auf keinen Fall!"
r56_afghanistan.51.t:0				"[AFG.GetNonIdeologyName] Fordert paschtunisches Land!"
r56_afghanistan.51.d:0				"Die [AFG.GetAdjective] Regierung hat die Kontrolle über die Regionen [444.GetName], [442.GetName] und [445.GetName] gefordert. Sie begründen diese Forderung mit dem historischen Anspruch von [AFG.GetNonIdeologyName] auf diese Gebiete und den vielen Millionen Paschtunen, die dort heute leben. Um in herzlichen Beziehungen mit [AFG.GetNonIdeologyName] zu bleiben, sollten wir vielleicht auf ihre Forderungen eingehen."
r56_afghanistan.51.a:0				"Geben Sie ihren Forderungen nach."
r56_afghanistan.51.b:0				"'Paschtunisches Land', was für ein Unsinn!"
r56_afghanistan.52.t:0				"König Amanullah kehrt zurück"
r56_afghanistan.52.d:0				"Da die Bedingungen für seine Rückkehr perfekt sind, wurde Amanullah Khan anschließend eingeladen, nach [AFG.GetNonIdeologyName] zurückzukehren. Er hat die Einladung gerne angenommen und versucht, [AFG.GetNonIdeologyName] zu verbessern und seine früheren Fehler als König von [AFG.GetNonIdeologyName] zu korrigieren, die schließlich zum Aufstand der Saqqawisten im Jahr 1929 führten. Er hat Haji Mirzali Khan seine Dankbarkeit für die Einladung ausgedrückt."
r56_afghanistan.52.a:0				"Bieten Sie ihm einen wichtigen Posten in der Verwaltung an..."
r56_afghanistan.52.b:0				"Der König ist endlich zurückgekehrt, und das Königreich wird es auch sein!"
r56_afghanistan.53.t:0				"Der zweite [AFG.GetAdjective] Bürgerkrieg"
r56_afghanistan.53.d:0				"In der vergangenen Woche haben sich viele Stammesführer in [AFG.GetNonIdeologyName] gegen den König und die Regentschaft ausgesprochen, die hauptsächlich aus seinen beiden Onkeln, Muhammad Hashim Khan und Shah Mahmud Khan, besteht. In ihren Augen ist die Regierung von [AFG.GetNonIdeologyName] zu modern geworden und hat sich zu weit von den traditionalistischen Werten und Bräuchen des afghanischen Volkes entfernt. Aus diesem Grund haben sie beschlossen, eine umfassende Rebellion zu starten, um das Regime zu stürzen. Viele spekulieren, dass der Führer der Jamiat-e Islami, Abul A'la al-Maududi, ebenfalls in den Konflikt verwickelt ist, aber es gibt keine Beweise, die diesen Verdacht bestätigen."
r56_afghanistan.53.a:0				"Es sind immer die [AFG.GetAdjective]s, nicht wahr?"
r56_afghanistan.53.b:0				"Tod den Tyrannen! Tod dem König!"
r56_afghanistan.54.t:0				"Militärische Intervention in [AFG.GetNonIdeologyName]?"
r56_afghanistan.54.d:0				"Erst vor einigen Monaten ist in [AFG.GetNonIdeologyName] ein Bürgerkrieg ausgebrochen. Der Grund dafür war die Unzufriedenheit darüber, dass die Regierung immer mehr Kontrolle über die Bevölkerung erlangte und die Modernisierung immer weiter vorantrieb. Sie beschlossen, dass es an der Zeit war, die vermeintliche Tyrannei der derzeitigen Regierung zu beenden, und in der Folge brachen überall in [AFG.GetNonIdeologyName] Aufstände aus. Dieser Konflikt dauert jedoch schon seit geraumer Zeit an. Wir könnten dies zu unserem Vorteil nutzen und [AFG.GetNonIdeologyName] angreifen, während sie schwach und gespalten sind. Was müssen wir tun?"
r56_afghanistan.54.a:0				"Der Staub wird sich von selbst legen."
r56_afghanistan.54.b:0				"Materielle Unterstützung sollte ausreichen."
r56_afghanistan.54.c:0				"Mobilisieren Sie die Rote Armee!"
r56_afghanistan.55.t:0				"Widerstand in [PAK.GetNonIdeologyName]?"
r56_afghanistan.55.d:0				"Der Widerstand in [PAK.GetNonIdeologyName] hat in den letzten Wochen ein Allzeithoch erreicht. Die Ursache dafür ist unbekannt, aber unseren Agenten ist es gelungen, die [AFG.GetAdjective]-Regierung mit den Widerstandsbewegungen in [PAK.GetNonIdeologyName] in Verbindung zu bringen, da bei einer Hausdurchsuchung bei einem mutmaßlichen [PAK.GetAdjective]-Widerstandskämpfer ein Versteck mit militärischer Ausrüstung erbeutet wurde. Wir konnten bestätigen, dass diese Waffen in der Tat aus [AFG.GetNonIdeologyName] eingeschmuggelt werden. Ob dies weitergeht oder nicht, können wir nicht wissen."
r56_afghanistan.55.a:0				"Wir müssen wachsam bleiben..."
r56_afghanistan.56.t:0				"Die Royal Tour kommt in Kairo an"
r56_afghanistan.56.d:0				"Nach dem Ablegen in Quetta ist die Royal Tour in Kairo angekommen, wo sie von [EGY.GetLeader] empfangen wurde. In der Hauptstadt wurde eine Militärparade abgehalten und Amanullah salutierte vor den [EGY.GetAdjective] Soldaten. Anschließend sprachen [EGY.GetLeader] und Amanullah über die Beziehungen zwischen den beiden Ländern. Nach einem einwöchigen Aufenthalt in Kairo setzte die Royal Tour erneut die Segel, diesmal in Richtung Rom."
r56_afghanistan.56.a:0				"Unsere Länder sind sich sehr ähnlich, wissen Sie?"
r56_afghanistan.57.t:0				"Die königliche Familie kommt in Rom an"
r56_afghanistan.57.d:0				"Nachdem sie eine Woche in Kairo verbracht hatten, setzte die königliche Reisegruppe die Segel in Richtung Rom. Bei ihrer Ankunft in Rom wurden sie mit einer militärischen Zeremonie und [ITA.GetLeader] empfangen. Während seines letzten Besuchs in Rom wurde Amanullah vom König von [ITA.GetNonIdeologyName] mit dem Obersten Orden der Allerheiligsten Verkündigung ausgezeichnet. Amanullah traf sich auch mit Papst Pius XI. vom Heiligen Stuhl. Der König war beeindruckt von den industriellen und technologischen Fortschritten, die er in Rom sah. Die königliche Reise verbrachte viel Zeit in Rom, doch nach ein paar Wochen brachen sie nach Marseille auf."
r56_afghanistan.57.a:0				"Es scheint, dass wir viel von den [ITA.GetAdjective]s lernen können."
r56_afghanistan.58.t:0				"Amanullah trifft sich mit [FRA.GetLeader]"
r56_afghanistan.58.d:0				"Die Royal Tour schiffte sich vor etwa einem Monat in Marseille ein und bestieg dann einen Zug in Richtung Paris. In Paris angekommen, wurden sie mit einer Militärparade empfangen und zu Ehren von König Amanullah wurde eine Salve von Kanonen abgefeuert. [FRA.GetLeader] begrüßte das Königspaar und schenkte ihm einen Peugeot 202 der Spitzenklasse. Nachdem er eine Woche in Paris verbracht und die lebhafte Stadt erkundet hatte, reiste Amanullah nach [GER.Capital.GetCapitalVictoryPointName]."
r56_afghanistan.58.a:0				"Oh, lieber [FRA.GetAdjective], immer von so exquisitem und verschwenderischem Geschmack und großzügig wie immer!"
r56_afghanistan.59.t:0				"Der König zu Besuch bei [GER.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.59.d:0				"Nachdem er Paris verlassen hatte, bestieg der germanophile König einen Zug in Richtung [GER.Capital.GetCapitalVictoryPointName]. Nachdem einige Tage vergangen waren, wurde Amanullah auf dem Pariser Platz empfangen, wo er von [GER.GetLeader] empfangen wurde. Der König war vom [GER.GetAdjective] Militär beeindruckt, so sehr, dass er um eine Lieferung von [GER.GetAdjective] Stahlhelmen an [AFG.GetNonIdeologyName] bat. Amanullah wurde erlaubt, im Reichstag zu sprechen, wo seine Rede von den Mitgliedern des [GER.GetRulingParty] und [GER.GetLeader] selbst unterstützt wurde. Nachdem er die [GER.GetAdjective] Architektur und Kunst bestaunt hatte, beschloss Amanullah, [GER.Capital.GetCapitalVictoryPointName] wieder zu verlassen und nach [ENG.Capital.GetCapitalVictoryPointName] zu reisen."
r56_afghanistan.59.a:0				"[GER.GetNonIdeologyName], wahrhaftig die Spitze der Technologie und der Modernität!"
r56_afghanistan.60.t:0				"Amanullah kommt in [ENG.Capital.GetCapitalVictoryPointName] an"
r56_afghanistan.60.d:0				"Nachdem das Königspaar [GER.Capital.GetCapitalVictoryPointName] verlassen hatte, reiste es an Bord der SS 'Maid of Orleans' nach Dover. Bald darauf machten sie sich auf den Weg nach [ENG.Capital.GetCapitalVictoryPointName], wo sie von [ENG.GetLeader] empfangen wurden. Zu Amanullahs Ehren wurde eine militärische Zeremonie abgehalten. Amanullah bemerkte, wie wichtig [ENG.GetNameDef] für [AFG.GetNonIdeologyName] sei, sowohl als militärischer als auch als wirtschaftlicher Partner. [ENG.GetLeader] stimmte zu und erklärte, dass [ENG.GetNameDef] die Zusammenarbeit zwischen den beiden Nationen verbessern wird. Nachdem er einige Wochen in [ENG.Capital.GetCapitalVictoryPointName] verbracht hatte, reisten Amanullah und die königliche Tour nach Warschau."
r56_afghanistan.60.a:0				"Wunderbar!"
r56_afghanistan.61.t:0				"Die Königliche Tour besucht Warschau"
r56_afghanistan.61.d:0				"Nach seinem Besuch in [ENG.Capital.GetCapitalVictoryPointName] reiste das Königspaar nach Warschau, wo es nur wenige Wochen später eintraf. In Warschau wurden sie von [POL.GetLeader] willkommen geheißen. Zu Amanullahs Ehren wurde eine militärische Zeremonie abgehalten. Amanullah und [POL.GetLeader] fuhren mit dem Auto durch die Hauptstadt und diskutierten dabei über europäische Politik. Der König wurde dann von polnischen Ministern empfangen, die er herzlich begrüßte. Nachdem er nur wenig Zeit in Warschau verbracht hatte, begann die königliche Tour ihre Reise zu ihrem endgültigen Ziel, Istanbul."
r56_afghanistan.61.a:0				"Warschau... war das wirklich nötig?"
r56_afghanistan.62.t:0				"Amanullah trifft sich mit [TUR.GetLeader]"
r56_afghanistan.62.d:0				"Nach dem Besuch in Warschau, wo die Königliche Tour nicht viel Zeit verbrachte, verließ Amanullah Polen in Richtung Türkei. Eine Woche später trafen sie in Istanbul ein. Bei ihrer Ankunft wurden sie von [TUR.GetLeader] und [TUR.GetAdjective] Soldaten auf einem Marsch zu Amanullas Ehren begrüßt. [TUR.GetLeader] betonte, wie wichtig die Zusammenarbeit im Nahen Osten ist und [TUR.GetAdjective] Ambitionen für die Region. Amanullah stimmte den Aussagen von [TUR.GetLeader] weitgehend zu und sprach sich offen für die Förderung der Zusammenarbeit zwischen [TUR.GetNameDef] und [AFG.GetNonIdeologyName] aus. Da dies das letzte Ziel der königlichen Europareise war, würde ein großer Teil der Zeit in Istanbul verbracht werden. So verließ Amanullah Istanbul nach zwei Wochen in einem Zug in Richtung Kābul."
r56_afghanistan.62.a:0				"Ich wette, Sie werden immer eine tolle Zeit haben!"
r56_afghanistan.63.t:0				"Die königliche Tour kehrt zurück nach [AFG.Capital.GetCapitalVictoryPointName]"
r56_afghanistan.63.d:0				"Endlich, nach 6 Monaten im Ausland, sind Amanullah Khan und Königin Soraya Tarzi in Kābul angekommen. Dies markiert das Ende der königlichen Tour durch Europa. Amanullah wurde von den Menschen in Kābul willkommen geheißen und anschließend zum Darulaman-Palast eskortiert. Nachdem er viel Zeit im Ausland verbracht hat, ist Amanullah mit neuen Ansichten zur Innen- und Außenpolitik zurückgekehrt. Amanullah hat geschworen, [AFG.GetNonIdeologyName] von einem unterentwickelten Hinterland in eine moderne westliche Nation zu reformieren."
r56_afghanistan.63.a:0				"Endlich kehrt der König zurück... ein neuer Mann..."
r56_afghanistan.64.t:0				"Selbstbestimmung für [442.GetName]?"
r56_afghanistan.64.d:0				"Die nördlichen Länder von [442.GetName], auch Paschtunkhwa oder Afghanistan genannt, werden seit Jahrhunderten von Paschtunen und [AFG.GetAdjective] gleichermaßen bewohnt. Sie unterscheiden sich natürlich stark von unserem Volk, und das hat dazu geführt, dass sie seit über einem Jahrzehnt nach Unabhängigkeit streben. Deshalb ist die [AFG.GetAdjective] mit der Bitte an uns herangetreten, ein Referendum abzuhalten, bei dem die in [442.GetName] lebenden Paschtunen die Möglichkeit hätten, über ihr eigenes Schicksal zu entscheiden, sei es, dass sie auf unbestimmte Zeit in unserem Land bleiben oder sich ihren [AFG.GetAdjective] Brüdern anschließen. Wenn wir jedoch wollen, dass [442.GetName] unser Land bleibt, müssten wir den ethnischen Paschtunen, die in der Region leben, große Zugeständnisse machen."
r56_afghanistan.64.a:0				"Vielleicht könnten wir ein Referendum abhalten..."
r56_afghanistan.64.b:0				"Niemals, dies ist unser Land!"
r56_afghanistan.66.t:0				"Die Paschtunen sind für die Sezession"
r56_afghanistan.66.d:0				"Die Paschtunen haben sich nach einem langen und mühsamen Prozess der Überlegung und Abwägung endgültig für den Anschluss an [AFG.GetNameDef] entschieden. Der Anführer der Khidmatgars, Abdul Ghaffar Khan, hat erklärt, dass sie aufgrund unserer versprochenen Zugeständnisse an die in [442.GetName] lebenden Paschtunen und unserer kulturellen Gemeinsamkeiten für die Vereinigung mit [AFG.GetNonIdeologyName] und ihre anschließende Abspaltung gestimmt haben. Berichten zufolge war das Referendum ein schneller Sieg für [AFG.GetNonIdeologyName], wobei [?AFG_percentage]% für die Abspaltung stimmten."
r56_afghanistan.66.a:0				"Ein weiterer großer Sieg für [AFG.GetNonIdeologyName]!"
r56_afghanistan.67.t:0				"Die Paschtunen sind für die Union"
r56_afghanistan.67.d:0				"Die Paschtunen haben sich nach einem langen und mühsamen Prozess der Überlegung und Abwägung endgültig für den Beitritt zu [AFG.GetNameDef] entschieden. Der Führer der Khidmatgars, Abdul Ghaffar Khan, hat erklärt, dass sie aufgrund unserer versprochenen Zugeständnisse an die in [442.GetName] lebenden Paschtunen und ihrer Bereitschaft zur Zusammenarbeit mit ihnen dafür gestimmt haben, als Teil unserer Nation zu bleiben, allerdings mit größerer Autonomie. Berichten zufolge war das Referendum ein schneller Sieg für uns: [?AFG.RAJ_PAK_percentage]% stimmten für die Union."
r56_afghanistan.67.a:0				"Ausgezeichnet!"
r56_afghanistan.67.b:0				"Gesetz aw Bar, Yaw Afghan!"
r56_afghanistan.68.t:0				"[FROM.GetNameDefCap] lehnt ab"
r56_afghanistan.68.d:0				"[FROM.GetNameDefCap] hat den Vorschlag für ein Referendum in [442.GetName] abgelehnt, möglicherweise aufgrund ihrer politischen Instabilität oder der allgemein steigenden Spannungen in der globalen Geopolitik. Ihre Weigerung wurde in [442.GetName] von den Khudai Khidmatgars und anderen Widerstandsgruppen scharf kritisiert."
r56_afghanistan.68.a:0				"Schande über sie!"
r56_afghanistan.68.b:0				"Gesetz aw Bar, Yaw Afghan!"
r56_afghanistan.69.t:0				"[FROM.GetNameDefCap] Akzeptiert"
r56_afghanistan.69.d:0				"[FROM.GetNameDefCap] hat den Vorschlag für ein Referendum in [442.GetName] angenommen. Das ist wunderbar, denn es wird eine freie und demokratische Lösung der [442.GetName]-Frage ermöglichen und die dort lebenden ethnischen Paschtunen werden wieder das Recht auf Selbstbestimmung haben. Ihre Zustimmung zum Referendum wurde in [442.GetName] von den Khudai Khidmatgars und anderen Widerstandsgruppen stark unterstützt."
r56_afghanistan.69.a:0				"Ausgezeichnet!"
r56_afghanistan.70.t:0				"Der [PER.GetAdjective] Bürgerkrieg"
r56_afghanistan.70.d:0				"Unser Land hat schon viel zu lange unter der Instabilität gelitten, aber so wie Wasser seine Siedetemperatur hat, so hat auch unser Land seine Siedetemperatur, und es scheint, dass wir sie gerade erreicht haben. Gerade heute wurde berichtet, dass bewaffnete Widerstandsgruppen im ganzen Land zu den Waffen gegriffen haben, um unser Regime im Namen des Sozialismus und des Marxismus zu bekämpfen. Dies ist das Ende des Weges."
r56_afghanistan.70.a:0				"Kämpfen Sie bis zum letzten Mann!"
r56_afghanistan.71.t:0				"Die Unterstützung der Stämme kommt an"
r56_afghanistan.71.d:0				"Die Stämme haben ihr Hilfsversprechen eingelöst und uns eine große Summe an Waffen geschickt, die unsere Mudschaheddin in ihrem Dschihad gegen die Regierung einsetzen können. Sie sind zwar alt, aber wir brauchen alles, was wir bekommen können."
r56_afghanistan.71.a:0				"Wunderbar!"
r56_afghanistan.72.t:0				"Wiederannäherung mit [AFG.GetNonIdeologyName]?"
r56_afghanistan.72.d:0				"Die [AFG.GetAdjective] Regierung ist an uns herangetreten in der Hoffnung, die [GetRajAdjective]-__NS317___ diplomatischen Beziehungen wieder zu versöhnen. Sie haben erklärt, dass [AFG.GetNonIdeologyName] [RAJ.GetNameDef] nicht als Feind, sondern als Freund in der regionalen Geopolitik sieht. Sie haben sowohl einen Freundschaftsvertrag als auch einen gegenseitigen Nichtangriffspakt vorgeschlagen. Die Frage ist, ob wir die gleichen Ansichten teilen wie die [AFG.GetAdjective]s?"
r56_afghanistan.72.a:0				"Wir müssen freundschaftliche Beziehungen zu [AFG.GetNonIdeologyName] unterhalten."
r56_afghanistan.72.b:0				"Das geht nicht, alter Freund."
r56_afghanistan.73.t:0				"[AFG_country_for_pakistan_press.GetNameDefCap] Akzeptiert"
r56_afghanistan.73.d:0				"Die [AFG_country_for_pakistan_press.GetAdjective] Regierung hat eine strategische Entscheidung getroffen, uns die Kontrolle über [444.GetName], [442.GetName] und [445.GetName] zu überlassen. Sie haben den Wunsch geäußert, weiterhin mit [AFG.GetNonIdeologyName] zusammenzuarbeiten und zitieren, dass die [AFG_country_for_pakistan_press.GetAdjective]-Regierung [AFG.GetNonIdeologyName] eher als Verbündeten denn als Feind ansieht."
r56_afghanistan.73.a:0				"Wunderbar!"
r56_afghanistan.74.t:0				"[AFG_country_for_pakistan_press.GetNameDefCap] lehnt ab"
r56_afghanistan.74.d:0				"Die [AFG_country_for_pakistan_press.GetAdjective] Regierung hat eine bewusste Entscheidung getroffen, uns die Kontrolle über [444.GetName], [442.GetName] und [445.GetName] zu verweigern. Sie hat erklärt, dass diese Ländereien rechtmäßig zu [AFG_country_for_pakistan_press.GetNameDef] gehören, aber sie hofft auch, dass dies die Beziehungen zwischen [AFG.GetAdjective] und [AFG_country_for_pakistan_press.GetAdjective] nicht beeinträchtigen wird."
r56_afghanistan.74.a:0				"Schlechte Wahl."
r56_afghanistan.75.t:0				"[GER.GetAdjective] Unterstützung trifft ein"
r56_afghanistan.75.d:0				"Mehrere Sendungen mit Waffen und Munition sind heute in [AFG.GetNonIdeologyName] angekommen, die von [GER.GetNonIdeologyName] kommen. Zusammen mit diesen Waffen kamen viele Wehrmachtssoldaten und Agenten der [GER.GetAdjective] Abwehr. Mit den Sendungen kam auch Carl August von Gablenz, ein berühmter [GER.GetAdjective] Militärberater in [AFG.GetNonIdeologyName]. Die Stammeskrieger haben die dringend benötigte Unterstützung bereits begrüßt, denn sie berichten, dass es ihnen an Ausrüstung fehlt, um den Krieg fortzusetzen, und sie haben ihre Dankbarkeit gegenüber den [GER.GetAdjective] zum Ausdruck gebracht."
r56_afghanistan.75.a:0				"Das war dringend nötig!"
r56_afghanistan.76.t:0				"Der [PER.GetAdjective] Bürgerkrieg"
r56_afghanistan.76.d:0				"In einer atemberaubenden Wendung der Ereignisse befindet sich Persien in einem heftigen Bürgerkrieg, in dem kommunistische Aufständische mit den Regierungstruppen aneinandergeraten. Der Konflikt, der vor einigen Tagen ausgebrochen ist, fügt der bereits turbulenten internationalen Landschaft eine neue Ebene der Komplexität hinzu. Es liegt an uns zu entscheiden, ob wir eingreifen und unsere Interessen in der Region wahren wollen oder nicht."
r56_afghanistan.76.a:0				"Mobilisieren Sie die Rote Armee!"
r56_afghanistan.76.b:0				"Es ist ihre persönliche Angelegenheit."
r56_afghanistan.77.t:0				"[SOV.GetAdjective] Streitkräfte marschieren in Persien ein"
r56_afghanistan.77.d:0				"In einem kühnen und unerwarteten Schritt sind [SOV.GetAdjective] Kräfte in die nördlichen Regionen von [PER.GetNameDef] einmarschiert. Die Invasion, die vor einigen Tagen begann, hat Schockwellen durch diplomatische Kreise geschickt und Sorgen über die geopolitischen Folgen für die Region ausgelöst. [SOV.GetNameDefCap] führt strategische Gründe für diese Operation an und betont die Notwendigkeit, lebenswichtige Versorgungswege zu sichern, die großen Ölfelder im Norden zu erobern und die eigenen Ölreserven in Baku zu schützen."
r56_afghanistan.77.a:0				"Die Revolution breitet sich aus."
r56_afghanistan.77.b:0				"Sie sind nur scharf auf das Öl!"
r56_afghanistan.77.c:0				"Ruhm für die Revolution!"
r56_afghanistan.78.t:0				"[FROM.GetNameDefCap] Nimmt an"
r56_afghanistan.78.d:0				"Die [FROM.GetAdjective] Regierung hat unseren Vorschlag zur Versöhnung akzeptiert, in der Hoffnung, dass dies die [FROM.GetAdjective]-[AFG.GetAdjective] diplomatischen Beziehungen verbessern wird. Sie haben erklärt, dass [FROM.GetNameDef] [AFG.GetNonIdeologyName] nicht als Feind, sondern als Freund in der regionalen Geopolitik sieht. Sie haben einen Freundschaftsvertrag sowie einen gegenseitigen Nichtangriffspakt vorgeschlagen. Der Frieden an der Durand-Linie soll erhalten bleiben!"
r56_afghanistan.78.a:0				"Wunderbar."
r56_afghanistan.79.t:0				"[FROM.GetNameDefCap] lehnt ab"
r56_afghanistan.79.d:0				"Die [FROM.GetAdjective]-Regierung hat unseren Vorschlag zur Versöhnung abgelehnt, vielleicht wegen ihrer politischen Instabilität oder aufgrund ihrer derzeitigen Haltung gegenüber [AFG.GetNonIdeologyName]. Sie ist unklar geblieben, was die Zusammenarbeit mit [AFG.GetNonIdeologyName] und ihre politischen Ambitionen in der Region betrifft. Wir werden sehen, was die Zukunft bringt..."
r56_afghanistan.79.a:0				"Wir müssen auf der Hut sein!"
r56_afghanistan.80.t:0				"Schulen in [AFG_illiteracy_state.GetName] eingeweiht"
r56_afghanistan.80.d:0				"Nach vielen Monaten anstrengender Arbeit sind die Schulen und Bildungseinrichtungen, mit deren Bau in [AFG_illiteracy_state.GetName] begonnen wurde, endlich fertiggestellt worden. Sowohl [AFG.GetLeader] als auch der Bildungsminister, Herr Ahmed Ali Khan, haben es sich zur Aufgabe gemacht, [AFG_illiteracy_state.GetName] zu besuchen und diesen Anlass mit der persönlichen Einweihung einer der wichtigsten vorgesehenen Schulen, nämlich der [AFG_illiteracy_state.GetCapitalVictoryPointName] Secondary School, zu würdigen. Damit ist [AFG.GetNonIdeologyName] seinem Ziel, den Analphabetismus zu beseitigen, einen Schritt näher gekommen."
r56_afghanistan.80.a:0				"Wunderbare Neuigkeiten!"
r56_afghanistan.81.t:0				"Subbhas Chandra Bose verschwindet"
r56_afghanistan.81.d:0				"Nachdem er vor nicht allzu langer Zeit aus dem Gefängnis entlassen wurde, hat man Subbhas Chandra Bose seitdem nicht mehr in der Öffentlichkeit gesehen. Als die [ROOT.GetAdjective] Police Force sein Haus besuchte, fand sie es verlassen und ohne Boses persönliche Gegenstände vor. Könnte es sein, dass Boses Haus überfallen und er anschließend entführt wurde, oder handelt es sich um eine Art hinterlistigen Plan für seine Flucht mit Hilfe der [GER.GetAdjective]s?"
r56_afghanistan.81.a:0				"Dieser Mistkerl!"
r56_afghanistan.82.t:0				"Die Flucht von Subbhas Chandra Bose"
r56_afghanistan.82.d:0				"Nachdem er vor nicht allzu langer Zeit aus dem Gefängnis entlassen wurde, haben wir von [RAJ.GetNameDef] die Information erhalten, dass Subbhas Chandra Bose geflohen ist und sich in Richtung [GER.GetNonIdeologyName] bewegt. Das letzte Mal wurde er gesehen, als er in Kalkutta in seinem Haus war. Die [GetRajAdjective] Behörden haben uns informiert, dass Subbhas Chandra Bose versuchen könnte, über [AFG.GetNonIdeologyName] zu entkommen, um nach [GER.GetNonIdeologyName] zu gelangen. Es heißt, er habe sich als Mitglied eines paschtunischen Stammes verkleidet und werde mit Hilfe der [GER.GetAdjective] Abwehr eskortiert. Sollten wir weiter nach Bose Ausschau halten oder die Augen vor der Situation verschließen?"
r56_afghanistan.82.a:0				"Ein Auge zudrücken."
r56_afghanistan.82.b:0				"Erhöhen Sie die Polizeipräsenz, er muss verhaftet werden!"
r56_afghanistan.82.c:0				"Wir werden ihn rekrutieren."
r56_afghanistan.83.t:0				"Subbhas Chandra Bose kommt in [ROOT.GetNameDef] an"
r56_afghanistan.83.d:0				"Mit der Unterstützung unserer Geheimagenten und anderer Korrespondenten hat es Subbhas Chandra Bose, der [RAJ.GetAdjective] Revolutionär, nach [ROOT.GetNameDef] geschafft. Er hat sich an uns gewandt, um uns bei unserer Invasion von [RAJ.GetNameDef] zu helfen, da er [RAJ.GetNonIdeologyName] unter seinem Kommando befreien will. Die Frage ist, ob wir Bose vertrauen sollten. Schließlich könnte er ein [RAJ.GetAdjective] Spion sein, der versucht, unsere Reihen zu infiltrieren!"
r56_afghanistan.83.a:0				"Er ist hier willkommen."
r56_afghanistan.83.b:0				"Wir brauchen seine Hilfe nicht."
r56_afghanistan.84.t:0				"Subbhas Chandra Bose gefangen genommen"
r56_afghanistan.84.d:0				"Bei seinem Versuch, [RAJ.GetNameDef] durch [AFG.GetNonIdeologyName] zu entkommen, sind Subbhas Chandra Bose und seine Begleiter in der Nähe der Stadt Māzar-i-Sharīf gefangen genommen worden. Der [RAJ.GetAdjective] Revolutionär war auf dem Weg nach Europa, um die Feinde von [RAJ.GetNameDef] in ihrem Kampf zu unterstützen. Doch mit seiner Gefangennahme stehen wir vor einer Entscheidung. Sollen wir Bose den [GetRajAdjective] Behörden ausliefern oder ihn seine Reise fortsetzen lassen und ihm und den Feinden von [RAJ.GetAdjective] helfen!"
r56_afghanistan.84.a:0				"Übergeben Sie ihn an die [GetRajAdjective] Behörden."
r56_afghanistan.84.b:0				"Lassen Sie ihn gehen."
r56_afghanistan.85.t:0				"Subbhas Chandra Bose von [AFG.GetAdjective] Behörden gefangen genommen"
r56_afghanistan.85.d:0				"Während seiner Reise durch [AFG.GetNonIdeologyName] wurde Subbhas Chandra Bose anschließend von [AFG.GetAdjective] Behörden gefangen genommen und festgenommen. Sie haben beschlossen, ihn so schnell wie möglich an die [ROOT.GetAdjective] Behörden auszuliefern. Wir müssen dankbar sein, dass die [AFG.GetAdjective] Polizeikräfte wachsam geblieben sind und ihre Aufgabe, Bose zu fangen, erfüllt haben."
r56_afghanistan.85.a:0				"Nehmen Sie ihn sofort ins Gefängnis!"
r56_afghanistan.86.t:0				"Subbhas Chandra Bose kommt in [FROM.GetNameDef] an"
r56_afghanistan.86.d:0				"In den letzten Monaten war Subbhas Chandra Bose mit dem Ziel unterwegs, endlich [FROM.GetNameDef] zu erreichen und dort um Hilfe zu bitten. Traurigerweise hat er sein Ziel erreicht und arbeitet nun mit dem [FROM.GetAdjective] Militär und dem Oberkommando zusammen. Viele [RAJ.GetAdjective] Politiker haben ihre Unterstützung für Bose angekündigt, und es werden noch viele folgen. Das hat die Nation stark destabilisiert. Viele sind geflohen und haben sich Bose und seiner Tigerlegion angeschlossen!"
r56_afghanistan.86.a:0				"Na gut..."
r56_afghanistan.86.b:0				"Verdammt sei er!"
r56_afghanistan.87.t:0				"Die interne Krise"
r56_afghanistan.87.d:0				"Mit jedem Tag, der vergeht, wird die Situation in [AFG.GetNonIdeologyName] immer beunruhigender. Mit Protesten im ganzen Land und öffentlichen Verurteilungen der Regierung und des Königs scheint das Land auf einen gefährlichen Weg des Krieges und des Blutvergießens zuzusteuern. Viele Stammesangehörige, vor allem Hazaras, sind sehr unzufrieden mit der hohen Besteuerung, die ihnen auferlegt wurde, und mit der zunehmenden Mobilisierung ihrer Stammesgenossen. Es scheint, dass dies tatsächlich der Tropfen war, der das Fass zum Überlaufen brachte. \n\n Die Frage ist, ob es [AFG.GetNonIdeologyName] gelingen wird, sich irgendwie zu erholen und unnötiges Blutvergießen zu vermeiden, oder ob sich die Geschichte noch einmal wiederholen wird..."
r56_afghanistan.87.a:0				"Ein Sturm zieht auf..."
r56_afghanistan.88.t:0				"Bewaffnete Zusammenstöße in [1009.GetName]"
r56_afghanistan.88.d:0				"Vor einigen Tagen sind einige hundert Hazara-Stammesangehörige in [1009.GetName] mit der örtlichen Polizei aneinandergeraten. Etwa 24 Polizisten und Militärangehörige sind bei den Kämpfen mit den Hazara, die schwer bewaffnet gewesen sein sollen, ums Leben gekommen und viele weitere wurden verwundet. Der Grund für diese plötzlichen und brutalen Zusammenstöße mit den Hazaras ist noch nicht bekannt. Ein wahrscheinlicher Grund könnte jedoch die hohe Besteuerung sein, die ihnen kürzlich auferlegt wurde und die nun dazu geführt hat, dass sie sich am offenen Widerstand gegen das Regime beteiligen."
r56_afghanistan.88.a:0				"Der Wind hat sich gelegt..."
r56_afghanistan.89.t:0				"Plünderungszüge in Ghazni"
r56_afghanistan.89.d:0				"Aufgrund der hohen Besteuerung der lokalen Bevölkerung in Ghazni haben die einheimischen Wazir-Stämme zahlreiche Plünderungen in den nahegelegenen Städten und Siedlungen durchgeführt und das gesamte [AFG.GetAdjective]-Land geplündert. Während ihres langen und blutigen Marsches wurden viele unschuldige Zivilisten kaltblütig abgeschlachtet und ermordet, anschließend geplündert und dem Verfall preisgegeben. Harte Zeiten bringen harte Entscheidungen und noch härtere Maßnahmen mit sich..."
r56_afghanistan.89.a:0				"Der Regen beginnt..."
r56_afghanistan.90.t:0				"König Amanullah kehrt zurück?"
r56_afghanistan.90.d:0				"Die Lebensbedingungen und der Lebensstandard in [AFG.GetNonIdeologyName] sinken sekündlich und der König ist direkt dafür verantwortlich. Das Volk braucht einen Helden, einen Retter! Deshalb verbreiten sich Gerüchte über die Rückkehr von König Amanullah nach [AFG.GetNonIdeologyName] seit einigen Tagen wie ein Lauffeuer im Land... Obwohl unbestätigt, ist die Rückkehr Amanullahs immer noch sehr wahrscheinlich, und zwar aufgrund des Widerstands der Stämme und der Unruhen, die das Land heimsuchen. Einige Stammesführer sind paradoxerweise für die Herrschaft Amanullahs über [AFG.GetNonIdeologyName]."
r56_afghanistan.90.a:0				"Ein Lichtblick?"
r56_afghanistan.91.t:0				"Die Loyalität von Daoud Khan?"
r56_afghanistan.91.d:0				"Die Unterstützung des Königs hat in allen politischen Aspekten von [AFG.GetNonIdeologyName] nachgelassen. Einst eine Hochburg der Bārakzai, hat sich das Militär politisiert und eine erhebliche Autonomie gegenüber der Zentralregierung und dem König erlangt. Damit stellt sich die Frage nach seiner Loyalität... Viele [AFG.GetAdjective] Militäroffiziere und Generäle haben Verbindungen zur lokalen Bevölkerung und zu Stammesangehörigen und lassen sich leicht kaufen oder überreden. Es gibt Gerüchte, dass Muhammad Daoud Khan, der Gouverneur von Nangahar und General der königlichen [AFG.GetAdjective] Armee, einen Sturz der Regierung plant. Ist das Militär vertrauenswürdig?"
r56_afghanistan.91.a:0				"Endet der Sturm?"
r56_afghanistan.92.t:0				"Allianz mit [PAK.GetNonIdeologyName]?"
r56_afghanistan.92.d:0				"Nach der Gründung von [PAK.GetNameDef] vor nicht allzu langer Zeit und dem daraus resultierenden Beginn des Indo-[PAK.GetAdjective]-Krieges ist [PAK.GetLeader] an [AFG.GetNameDef] herangetreten und hofft auf ein Militärbündnis, um die [RAJ.GetAdjective] zu besiegen. Sollen wir uns mit der [PAK.GetAdjective] Regierung verbünden oder nicht, das ist die Frage."
r56_afghanistan.92.a:0				"Vereint als Einheit!"
r56_afghanistan.92.b:0				"Es gibt keinen Grund für solche Aktionen."
r56_afghanistan.93.t:0				"[FROM.GetNameDefCap] fordert die Unterwerfung"
r56_afghanistan.93.d:0				"Da [FROM.GetNameDef] unter [FROM.GetLeader] eine panislamistische Doktrin verfolgt und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat [FROM.GetNameDef] formell unsere Unterwerfung gefordert. Als Vorwand für ihr aggressives Vorgehen berufen sie sich auf unseren gemeinsamen Glauben und andere Gemeinsamkeiten. Ob wir ihre Forderungen akzeptieren oder ablehnen, das ist die Frage."
r56_afghanistan.93.a:0				"Was für lächerliche Forderungen!"
r56_afghanistan.93.b:0				"Brüderliches Blut soll heute nicht vergossen werden."
r56_afghanistan.94.t:0				"[FROM.GetNameDefCap] Lehnt Unterwerfung ab"
r56_afghanistan.94.d:0				"Nachdem wir die Unterwerfung von [FROM.GetNameDef] gefordert haben, hat die Regierung von [FROM.GetAdjective] unsere Forderungen abgelehnt und sie für lächerlich erklärt. Das ist eine absolute Schande, wir müssen sofort handeln!"
r56_afghanistan.94.a:0				"Möge Allah uns zum Sieg führen!"
r56_afghanistan.95.t:0				"[FROM.GetNameDefCap] nimmt die Unterwerfung an"
r56_afghanistan.95.d:0				"Nachdem wir die Unterwerfung von [FROM.GetNameDef] gefordert haben, hat die Regierung von [FROM.GetAdjective] unsere Forderungen akzeptiert, möglicherweise aufgrund unseres überlegenen militärischen oder politischen Drucks und Einflusses, den wir auf ihre Regierung ausgeübt haben. Dies ist ein weiterer Sieg für die Muslime auf der ganzen Welt."
r56_afghanistan.95.a:0				"Unter Allah werden wir geeint sein!"
r56_afghanistan.96.t:0				"Die Einigung der islamischen Welt"
r56_afghanistan.96.d:0				"Unser Streben nach einer panislamischen Doktrin unter [FROM.GetLeader], die alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner vereinen soll, hat dazu beigetragen, dass [AFG.GetNonIdeologyName] Anspruch auf alle Regionen erhebt, die mehrheitlich von Muslimen bewohnt sind und einst Teil des Raschidun-Reiches waren! Allah wird uns durch Schlachten und Kämpfe gegen die Imperialisten führen! Wir sind die wahren Erben von Muhammad!"
r56_afghanistan.96.a:0				"Allahu Akbar!"
r56_afghanistan.97.t:0				"Wiederherstellung von [From.GetNameDef]"
r56_afghanistan.97.d:0				"Mit der [From.GetOldAdjective] Eroberung dessen, was größtenteils die moderne islamische Welt ausmacht, und nach dem fortgesetzten Streben der Regierung, alle Muslime zu vereinen, haben viele, darunter auch Regierungsbeamte, die offizielle Wiederherstellung eines längst vergessenen Reiches, [From.GetNameDef], gefordert. So hat [From.GetLeader], ein direkter Nachkomme des Propheten, beschlossen, dem Druck der Bevölkerung nachzugeben und hat offiziell die Wiederherstellung von [From.GetNameDef] und seine anschließende Inthronisierung als dessen Khalif verkündet. [From.GetOldAdjective] Offizielle haben nun bestätigt, dass der offizielle Name der Nation in '[From.GetNameDef]' geändert werden soll."
r56_afghanistan.97.a:0				"Der Traum von Al-Afghani ist wahr geworden."
r56_afghanistan.97.b:0				"Wird dies zu einem dauerhaften Frieden in der Region führen?"
r56_afghanistan.97.c:0				"Er wird nicht lange halten!"
r56_afghanistan.98.t:0				"[FROM.GetNameDefCap] Fordert Land"
r56_afghanistan.98.d:0				"Da [FROM.GetNameDef] unter [FROM.GetLeader] eine panislamistische Doktrin verfolgt und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat [FROM.GetNameDef] formell unseren militärischen Rückzug aus Syrien und die anschließende Übergabe Syriens an [FROM.GetNameDefCap] gefordert. Ob wir ihre Forderungen akzeptieren oder ablehnen, das ist die Frage."
r56_afghanistan.98.a:0				"Was für lächerliche Forderungen!"
r56_afghanistan.98.b:0				"Wir müssen nachgeben..."
r56_afghanistan.99.t:0				"[FROM.GetNameDefCap] lehnt die Forderungen ab"
r56_afghanistan.99.d:0				"Nachdem wir die Übertragung von muslimischem Land von [FROM.GetNameDef] gefordert haben, hat die [FROM.GetAdjective] Regierung unsere Forderungen abgelehnt. Das ist eine absolute Schande. Wir müssen sofort handeln und uns diese Ländereien selbst holen!"
r56_afghanistan.99.a:0				"Unglücklicherweise..."
r56_afghanistan.99.b:0				"Das bedeutet Krieg!"
r56_afghanistan.100.t:0				"[FROM.GetNameDefCap] gibt Forderungen auf"
r56_afghanistan.100.d:0				"Nachdem wir die Abtretung der muslimischen Ländereien von [FROM.GetNameDef] gefordert haben, hat die Regierung von [FROM.GetAdjective] unsere Forderungen akzeptiert, möglicherweise aufgrund unseres überlegenen militärischen oder politischen Drucks und Einflusses, den wir auf ihre Regierung ausgeübt haben. Dies ist ein weiterer Sieg für die Muslime auf der ganzen Welt."
r56_afghanistan.100.a:0				"Unter Allah werden wir geeint sein!"
r56_afghanistan.101.t:0				"[FROM.GetNameDefCap] Fordert Land"
r56_afghanistan.101.d:0				"Da [FROM.GetNameDef] unter [FROM.GetLeader] eine panislamistische Doktrin verfolgt und versucht, alle Anhänger des Wortes Allahs und seines einzigen Gesandten Mohammed unter einem Banner zu vereinen, hat [FROM.GetNameDef] formell unseren militärischen Rückzug aus Syrien und die anschließende Übergabe Syriens an [FROM.GetNameDefCap] gefordert. Ob wir ihre Forderungen akzeptieren oder ablehnen, das ist die Frage."
r56_afghanistan.101.a:0				"Was für lächerliche Forderungen!"
r56_afghanistan.101.b:0				"Wir müssen nachgeben..."
r56_afghanistan.102.t:0				"[FROM.GetNameDefCap] gibt Forderungen nach"
r56_afghanistan.102.d:0				"Nachdem wir die Abtretung der muslimischen Ländereien von [FROM.GetNameDef] gefordert haben, hat die Regierung von [FROM.GetAdjective] unsere Forderungen akzeptiert, möglicherweise aufgrund unseres überlegenen militärischen oder politischen Drucks und Einflusses, den wir auf ihre Regierung ausgeübt haben. Dies ist ein weiterer Sieg für die Muslime auf der ganzen Welt."
r56_afghanistan.102.a:0				"Unter Allah werden wir geeint sein!"
r56_afghanistan.103.t:0				"[FROM.GetNameDefCap] Akzeptiert den Frieden"
r56_afghanistan.103.d:0				"Nachdem unsere Forderungen nach einem vollständigen Waffenstillstand und einem langsamen Übergang in einen Friedenszustand zwischen [FROM.GetNameDefCap] und [ROOT.GetNameDefCap] die [FROM.GetAdjective]-Regierung erreicht haben, hat die [FROM.GetAdjective]-Regierung beschlossen, unsere Forderungen zu akzeptieren, möglicherweise aufgrund unserer überlegenen militärischen Fähigkeiten und der Lage und des Stresses, in den ihre Regierung geraten ist. Dies ist ein weiterer Sieg für [AFG.GetNonIdeologyName]!"
r56_afghanistan.103.a:0				"Gesegnet sind die Friedensstifter!"
r56_afghanistan.104.t:0				"[FROM.GetNameDefCap] lehnt den Frieden ab"
r56_afghanistan.104.d:0				"Nachdem unsere Forderungen nach einem vollständigen Waffenstillstand und einem langsamen Übergang in einen Friedenszustand zwischen [FROM.GetNameDefCap] und [ROOT.GetNameDefCap] die [FROM.GetAdjective]-Regierung erreicht hatten, beschloss die [FROM.GetAdjective]-Regierung, unsere Forderungen abzulehnen. Möglicherweise sah sie keinen Grund, Frieden zu schließen, weil sie glaubt, dass sie im Vergleich zu uns ein überlegenes Militär besitzt."
r56_afghanistan.104.a:0				"Ob klug oder nicht, ihre Entscheidung ist gefallen."
r56_afghanistan.105.t:0				"Der zweite [AFG.GetAdjective] Bürgerkrieg"
r56_afghanistan.105.a:0				"Es sind immer die [AFG.GetAdjective]s, nicht wahr?"
r56_afghanistan.105.b:0				"Nieder mit dem König! Hoch mit dem Proletariat!"
r56_afghanistan.105.d:0				"In der vergangenen Woche haben sich führende Militärs der [AFG.GetNonIdeologyName] gegen den König und die Regentschaft ausgesprochen, die hauptsächlich aus seinen beiden Onkeln, Muhammad Hashim Khan und Shah Mahmud Khan, besteht. In ihren Augen ist die Regierung von [AFG.GetNonIdeologyName] zu rückständig geworden, sowohl politisch als auch wirtschaftlich, ohne dass eine Modernisierung für die Zukunft geplant ist. Vor diesem Hintergrund haben sie beschlossen, eine umfassende Revolution zu starten, um das Regime zu stürzen und eine sozialistische Republik zu errichten. Viele spekulieren, dass die [SOV.GetAdjective] Kräfte den Konflikt angezettelt haben, aber es wurden keine Beweise gefunden, die diesen Verdacht bestätigen."
r56_afghanistan.106.t:0				"[SOV.GetAdjective] Unterstützung kommt an"
r56_afghanistan.106.a:0				"Wir sind Ihnen zu Dank verpflichtet, Kameraden!"
r56_afghanistan.106.d:0				"Während [AFG.GetNonIdeologyName] in Flammen aufgeht und die ganze Nation mobilisiert wird, um für die eine oder andere Seite zu kämpfen und zu sterben, haben die [SOV.GetAdjective] wie vereinbart beschlossen, uns mit einer sehr geschätzten und nützlichen Unterstützung zu versorgen, die das Blatt im Zweiten Afghanischen Bürgerkrieg wenden kann! Dazu gehören viele [SOV.GetAdjective] Männer, die sich freiwillig gemeldet und unserer Sache angeschlossen haben, sowie militärische Ausrüstung, um die Loyalisten abzuwehren!"
r56_afghanistan.107.t:0				"Nisar Muhammad Yousafzai schließt sich der Sache an"
r56_afghanistan.107.a:0				"Wer sein Vaterland liebt, soll für die DRA kämpfen!"
r56_afghanistan.107.d:0				"Während [AFG.GetNonIdeologyName] in Flammen aufgeht und die ganze Nation mobilisiert wird, um für eine der beiden Seiten zu kämpfen und zu sterben, hat Nisar Muhammad Yousafzai, ein Afghane, der im Zweiten Anglo-Afghanischen Krieg gekämpft und sein Leben dem Kommunismus und der Entwicklung Tadschikistans gewidmet hat, beschlossen, sich unserer Sache anzuschließen und uns im Kampf gegen die Loyalisten zu unterstützen!"
r56_afghanistan.108.t:0				"Bildung der Nationalen Front!"
r56_afghanistan.108.a:0				"Eine große Bedrohung oder eine große Chance, wer kann das schon sagen?"
r56_afghanistan.108.d:0				"Nach der Legalisierung der Gewerkschaften ist die Studentengewerkschaft der Kābul Universität an die Öffentlichkeit gegangen und hat sich auf die Seite der [AFG.GetCommunistParty] gestellt. Dies hat in der Tat die [AFG.GetCommunistParty] gestärkt, was Abdulrahman Mahmudi, den Führer der 'Khalqisten', dazu veranlasst hat, eine Koalition mit der [AFG.GetDemocraticParty] einzugehen, die sich Nationale Front nennt. Sie wollen die Nation demokratisieren und den Minderheiten innerhalb der [AFG.GetNonIdeologyName], wie den Tadschiken und Usbeken, Rechte geben, um die [AFG.GetNonIdeologyName] wirklich zu vereinen."
r56_afghanistan.109.t:0				"Krise um den Durand!"
r56_afghanistan.109.a:0				"Das ist besorgniserregend..."
r56_afghanistan.109.d:0				"Im vergangenen Jahr haben die Spannungen zwischen der muslimischen, Urdu sprechenden Bevölkerung im Nordwesten Indiens und den hinduistischen, Hindi sprechenden Regionen Indiens zugenommen. Diese Spannungen sind Berichten zufolge mit der Ausrufung der Unabhängigkeit und der Gründung eines neuen Staates südlich von [AFG.GetNonIdeologyName] namens Pakistan zum Siedepunkt gekommen. Die [RAJ.GetAdjective] Regierung hat die Unabhängigkeitserklärung für illegal erklärt und einen regelrechten Krieg auf dem indischen Subkontinent ausgelöst. Viele Menschen sind durch den Krieg vertrieben worden. Viele Hindus haben die Grenze nach Indien überquert, und die Muslime, die auf der hinduistischen Seite leben, haben genau dasselbe getan.\n\nDer besondere Grund, warum dieser Konflikt für die Zukunft von [AFG.GetNonIdeologyName] von entscheidender Bedeutung ist, liegt in den mehrheitlich von Paschtunen bevölkerten Gebieten, die [442.GetName] und in gewissem Maße auch [445.GetName] sind, die einen großen Teil des neuen Staates Pakistan ausmachen. Dieser Konflikt könnte sich als [AFG.GetNonIdeologyName]s Chance erweisen, die Paschtunen endlich in einem Staat zu vereinen und den dringend benötigten Zugang zum Meer zu erhalten, was wiederum den internationalen Handel erleichtern und der [AFG.GetAdjective]-Wirtschaft großen Nutzen bringen würde... Die Frage ist, wo sollte [AFG.GetNonIdeologyName] in dieser chaotischen Zeit für die Region stehen?"
r56_afghanistan.200.t:0				"Die Nachwirkungen des [GetYear] Bürgerkriegs"
r56_afghanistan.200.a:0				"Das ist besorgniserregend..."
r56_afghanistan.200.d:0				"Nach dem Ende des [GetYear] Bürgerkriegs bricht im ganzen Land Jubel über den triumphalen Sieg der Roten Armee über die Royalisten aus. Doch verfrühtes Feiern könnte sich als gefährlich erweisen, denn dieser Sieg markiert nicht das Ende, sondern den Beginn eines neuen Kampfes, eines Kampfes, in dem sich die Nation gegen ihr eigenes Volk stellt. Es gibt bereits Berichte über Stammeskräfte, die überall in [AFG.GetNonIdeologyName] Widerstandsnester organisieren. Nur die Zeit wird zeigen, was das Schicksal für die Zukunft unserer Nation bereithält..."
AFG_communist_influence_r56:0				"[AFG.GetAdjective] Kommunistischer Einfluss"
AFG_pashtunwali_r56:0				"Pashtunwali erzwungen"
AFG_the_getyear_general_elections:0				"Die [GetYear] Parlamentswahlen"
AFG_the_getyear_general_elections_desc:0				"In seiner Geschichte hat [AFG.GetNonIdeologyName] nie etwas gehabt, das auch nur annähernd einem demokratischen System ähnelt. Heute wird sich das ändern. Heute finden zum ersten Mal in der Geschichte von [AFG.GetNonIdeologyName] freie Wahlen statt, bei denen die gesamte Bevölkerung wählen und ihre Meinung äußern kann!"
AFG_join_the_axis:0				"Schließen Sie sich der Achse an"
AFG_join_the_axis_desc:0				"Die Achsenmächte haben uns Größe und Sicherheit versprochen, wenn wir uns ihnen anschließen. Die Zeit, in der [AFG.GetNonIdeologyName] von [ENG.GetNameDef] und [SOV.GetNameDef] abhängig war, ist vorbei. Die Zeit eines modernen, entwickelten und politisch unabhängigen [AFG.GetNonIdeologyName] hat erst begonnen!"
AFG_maintain_neutrality_r56:0				"Bewahren Sie die Neutralität"
AFG_maintain_neutrality_r56_desc:0				"[AFG.GetNonIdeologyName] ist seit dem Krieg von 1919 neutral, als es seine Unabhängigkeit durch einen brutalen und blutigen Konflikt gegen das damals größte und fortschrittlichste Empire, das Britische Empire, erlangte. Wenn es nicht kaputt ist, sollte man es nicht reparieren."
