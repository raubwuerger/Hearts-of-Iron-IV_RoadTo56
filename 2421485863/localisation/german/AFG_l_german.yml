 ######## ECONOMY IDEAS ######## ""

 AFG_gold_mining:0 "Goldabbau"
 r56_AFG_hydroelectric_power:0 "Wasserkraft"
 AFG_bank_millie_afghan:0 "Bânk-e Millie Afghân"
 AFG_bank_millie_afghan_desc:0 "Die Bânk-e Millie Afghân wurde 1932 als Aktiengesellschaft gegründet, wobei ein Großteil der Aktien von der Regierung gehalten wurde. Sie wird von einem der größten afghanischen Ökonomen, Abdul Majid Zabuli, geleitet, der auch ein Sympathisant Adolf Hitlers war. Die Bank fungiert seit vier Jahren als Nationalbank von [AFG.GetNonIdeologyName] und hält ihr Monopol auf den staatlichen Handel aufrecht. Durch die enge Zusammenarbeit mit der Regierung, Investitionen in den privaten und öffentlichen Sektor und ein Quasi-Monopol auf die gesamte Industrie und den Import-Export-Handel innerhalb von [AFG.GetNonIdeologyName] hat die Bank einen enormen Gewinn für etwa zweitausend Aktionäre sowie für die Regierung erwirtschaftet."
 AFG_decentralized_economy:0 "Vernachlässigte Wirtschaft"
 AFG_decentralized_economy_desc:0 "Die Wirtschaft [AFG.GetNonIdeologyName]s ist nach wie vor weitgehend unterentwickelt und stützt sich stark auf den Handel mit Rohstoffen wie Baumwolle, Karakul, Tabak und Opium, die eine bedeutende Rolle in der Wirtschaft [AFG.GetAdjektiv]s spielen. Trotz seiner entscheidenden geografischen Lage als Knotenpunkt zwischen Europa und Asien ist [AFG.GetNonIdeologyName] nicht in der Lage, seine strategische Lage voll auszunutzen, da es durch Isolation und eine rudimentäre Wirtschaftsstruktur behindert wird."
 AFG_decentralized_economy_1:0 "Vernachlässigte Wirtschaft"
 AFG_decentralized_economy_1_desc:0 "Die Wirtschaft [AFG.GetNonIdeologyName]s ist nach wie vor weitgehend unterentwickelt und stützt sich stark auf den Handel mit Rohstoffen wie Baumwolle, Karakulschafe, Tabak und Opium, die eine bedeutende Rolle in der [AFG.GetAdjektiv] Wirtschaft spielen. Trotz seiner entscheidenden geografischen Lage als Knotenpunkt zwischen Europa und Asien ist [AFG.GetNonIdeologyName] nicht in der Lage, seine strategische Lage voll auszunutzen, da es durch Isolation und eine rudimentäre Wirtschaftsstruktur behindert wird."
 AFG_decentralized_economy_2:0 "Vernachlässigte Wirtschaft"
 AFG_decentralized_economy_2_desc:0 "Die Wirtschaft [AFG.GetNonIdeologyName]s ist nach wie vor weitgehend unterentwickelt und stützt sich stark auf den Handel mit Rohstoffen wie Baumwolle, Karakulschafe, Tabak und Opium, die eine bedeutende Rolle in der [AFG.GetAdjektiv] Wirtschaft spielen. Trotz seiner entscheidenden geografischen Lage als Knotenpunkt zwischen Europa und Asien ist es [AFG.GetNonIdeologyName] nicht gelungen, seine strategische Lage voll auszunutzen, da es durch Isolation und eine rudimentäre Wirtschaftsstruktur behindert wird."
 AFG_decentralized_economy_3:0 "Wirtschaftsboom"
 AFG_decentralized_economy_3_desc:0 "In nur wenigen Jahren hat sich [AFG.GetNonIdeologyName] von einem unterentwickelten Hinterwäldlerstaat in eine sich rasch modernisierende und wohlhabende Nation verwandelt. Diese bemerkenswerte Leistung ist ein unbestreitbarer Beweis dafür, dass Fortschritt, der einst für unmöglich gehalten wurde, nun in greifbare Nähe gerückt ist!"
 AFG_bank:0 "Da [AFG.GetNonIdeologyName] Bank"
 AFG_bank_improved:0 "Da [AFG.GetNonIdeologyName] Bank"

 AFG_illiteracy:0 "Weit verbreiteter Analphabetismus"
 AFG_illiteracy_desc:0 "Die [AFG.GetAdjective] Bevölkerung leidet unter weit verbreitetem Analphabetismus. Weniger als zehn Prozent können lesen oder schreiben, was hauptsächlich auf die schlechte Lebensqualität und die Misswirtschaft im Bildungssystem zurückzuführen ist. Dieser gravierende Mangel an Fachkräften hat dazu geführt, dass höhere Positionen und Regierungsämter entweder unbesetzt bleiben oder mit Ausländern wie Türken und Deutschen besetzt werden. Selbst die neu eröffnete Universität Kabul, die 1931 gegründet wurde, hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Zulassung von Studenten hinnehmen müssen."
 AFG_illiteracy_1:0 "Hohe Analphabetenrate"
 AFG_illiteracy_1_desc:0 "Die Bevölkerung [AFG.GetAdjektiv] leidet unter weit verbreitetem Analphabetismus, wobei weniger als zehn Prozent lesen oder schreiben können, was hauptsächlich auf die schlechte Lebensqualität und die Misswirtschaft im Bildungssystem zurückzuführen ist. Dieser gravierende Mangel an Fachkräften hat dazu geführt, dass höhere Positionen und Regierungsämter entweder unbesetzt bleiben oder mit Ausländern wie Türken und Deutschen besetzt werden. Selbst die neu eröffnete Universität Kabul, die 1931 gegründet wurde, hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Zulassung von Studenten hinnehmen müssen."
 AFG_illiteracy_2:0 "Mäßige Analphabetenrate"
 AFG_illiteracy_2_desc:0 "Die Bevölkerung [AFG.GetAdjektiv] leidet unter weit verbreitetem Analphabetismus. Weniger als zehn Prozent der Bevölkerung sind in der Lage zu lesen oder zu schreiben, was hauptsächlich auf die schlechte Lebensqualität und die Misswirtschaft im Bildungssystem zurückzuführen ist. Dieser gravierende Mangel an Fachkräften hat dazu geführt, dass höhere Positionen und Regierungsposten entweder unbesetzt bleiben oder mit Ausländern wie Türken und Deutschen besetzt werden. Selbst die neu eröffnete Universität Kabul, die 1931 gegründet wurde, hat aufgrund des Mangels an qualifiziertem Personal Verzögerungen bei der Zulassung von Studenten hinnehmen müssen."
