 # ECONOMY DECISIONS # "Ausländische Flugzeuge kaufen"
 AFG_electrify_kabulistan:0 "Nach dem brutalen afghanischen Bürgerkrieg von 1929 war die kleine, noch junge Luftwaffe unter König Amanullah vollständig zerstört und am Boden zerstört. Jetzt, da die Stabilität wiederhergestellt ist, ist [AFG.GetNonIdeologyName] endlich in der Lage, eine neue moderne Luftwaffe zu erwerben und aufzubauen."
 AFG_improve_helmand_irrigation:0 "[GER.GetAdjective] Flugzeuge kaufen"
 AFG_develop_faryab:0 "[ENG.GetAdjective] Flugzeuge kaufen"
 AFG_develop_bamyan:0 "Kauf von [ITA.GetAdjektiv] Flugzeugen"
 AFG_develop_kabul:0 ""
 AFG_develop_unlock_tt:0 ""

 # RURAL SCHOOLS # "Ausbau des Bewässerungsnetzes in Helmand"
 AFG_rural_schools_category:0 "Ausbeutung von [1008.GetName] Ölfeldern"
 AFG_rural_schools_category_desc:0 "Erschließung von [1009.GetName] Stahlminen"
 AFG_illiteracy_decrease_75:0 "Ausbeutung von [267.GetName] Chromvorkommen"
 AFG_illiteracy_decrease_50:0 "Schaltet §YRessourcenpotenzial§ frei! Entscheidungen."
 AFG_open_schools:0 ""

 # INFILTRATE PAKISTAN # "Bau von Schulen auf dem Land"
 AFG_inflitrate_pakistan_category:0 "Die ländlichen Regionen, die von Kabul und der Zentralverwaltung von [AFG.GetNonIdeologyName] abgeschnitten sind, tragen am meisten zum Analphabetismusproblem bei, mit dem [AFG.GetNonIdeologyName] derzeit konfrontiert ist. Wir müssen unsere Bildungsmethoden und deren Verfügbarkeit auf dem Land verbessern."
 AFG_inflitrate_pakistan_category_desc:0 "§YBau von Schulen auf dem Land§! Die Kosten für die politische Entscheidungsfindung §Ywerden§! um §Y30 %§! gesenkt, die §YZeit§! bis zur §YVollendung§! des Beschlusses wird §Yauf §Y75 §! Tage§! reduziert."
 AFG_infiltrate_baluchistan:0 "Die Entscheidung über die politische Macht zur Errichtung ländlicher Schulen wird um 60 % reduziert, die Zeit, die benötigt wird, um die Entscheidung zu treffen, wird auf 60 Tage reduziert."
