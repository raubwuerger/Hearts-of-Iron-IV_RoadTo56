 ######## MILITARY IDEAS ######## ""

 AFG_afghan_army:0 "[GetAfghanArmyFocusName]"
 AFG_afghan_army_desc:0 "Die glorreiche [GetAfghanArmyFocusName] kann stolz darauf sein, dass sie es geschafft hat, sich weltweit einen Ruf als besonders schwer zu besiegender und einer der gefährlichsten Feinde zu erarbeiten, denen man auf dem Schlachtfeld gegenüberstehen kann, ganz zu schweigen vom Kampf gegen die [AFG.GetAdjektiv] auf ihrem Heimatboden. In Friedenszeiten hält die [GetAfghanArmyFocusName] etwa 70.000 bis 80.000 Soldaten jederzeit einsatzbereit und vollständig auf Krieg vorbereitet. Unser Militär ist jedoch stark auf ausländische Ausrüstung angewiesen, wobei Nationen wie [ENG.GetNonIdeologyName], [SOV.GetNonIdeologyName] und [GER.GetNonIdeologyName] als wichtige Quellen für moderne Ausrüstung und Militärtechnologie dienen.In [AFG.GetNonIdeologyName] sind die Tage lang, die Berge hoch und die Schlachten hart."

