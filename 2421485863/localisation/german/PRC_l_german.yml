xian_incident_started:0	"Xi'an Zwischenfall hat begonnen"
cdx_returned:0	"Chen Duxiu ist zurückgekehrt"
PRC_yes_truce:0	"Hat zugestimmt, alle Bürgerkriege zu beenden."
has_pact_with_jap:0	"Hat einen Pakt mit Japan"
PRC_defeatism_1:0	"Defeatismus"
PRC_defeatism_1_desc:0	"Einige unserer Genossen denken, wenn wir gegen die Japaner kämpfen, werden wir das nächste Abessinien. Dieser Gedanke dämpft den Willen unseres Volkes sehr."
PRC_underestimation:0	"Unterschätzen Sie Japan"
PRC_underestimation_desc:0	"Einige unserer Genossen sind übermäßig optimistisch, was die Japaner angeht. Sie behaupten sogar, dass sie niemals nach Shanxi kommen werden. Eine solche Arroganz wird unsere Kriegsanstrengungen stark beeinträchtigen."
PRC_integrated_army:0	"Eingegliederte Armee"
PRC_integrated_army_desc:0	"Die kommunistische Rote Armee hat sich bereit erklärt, in unsere Armee integriert zu werden. Mit dieser kleinen zusätzlichen Unterstützung könnte der Krieg weniger schwierig werden."
PRC_initiative_idea:0	"Initiative in Kriegszeiten"
PRC_initiative_idea_desc:0	"Die Entwaffnung eines Soldaten ist die Folge davon, dass er seine Handlungsfreiheit verliert, weil er in eine passive Position gezwungen wird. Das Gleiche gilt für die Niederlage einer Armee. Aus diesem Grund tun beide Seiten im Krieg alles, um die Initiative zu ergreifen und Passivität zu vermeiden."
PRC_protracted_war_idea:0	"Langwieriger Krieg"
PRC_protracted_war_idea_desc:0	"Wir müssen die Japaner so lange wie möglich aufhalten. Um Zeit für internationale Hilfe abzuwarten."
PRC_devastating_long_march:0	"Die Verheerungen des Langen Marsches"
PRC_devastating_long_march_desc:0	"Nach dem Langen Marsch lassen wir uns endlich in Shaanxi nieder. Doch die klaffende Wunde, die er verursacht hat, ist noch immer nicht verheilt. Wird dies unser Ende sein?"
PRC_devastating_long_march_1:0	"Die Erholung vom Langen Marsch"
PRC_devastating_long_march_1_desc:0	"Wir sind nun wieder auf dem richtigen Weg, die Auswirkungen des Langen Marsches werden bald gemildert sein."
PRC_guerilla_warfare:0	"Guerilla-Kriegsführung"
PRC_guerilla_warfare_desc:0	"Wir sind nicht einmal annähernd als 'Nation' oder 'Land' zu bezeichnen, unsere Bewegung ist lediglich eine Art Guerillakämpfer gegen die Kuomintang. \n"
PRC_lack_skilled_personnel:0	"Mangel an qualifiziertem Personal"
PRC_lack_skilled_personnel_desc:0	"Viele unserer Kameraden sind während des Langen Marsches gestorben, so dass es in unseren Reihen an qualifiziertem Personal mangelt. Das wird es uns schwer machen, technologische Fortschritte zu erzielen."
PRC_swift_victory_idea:0	"Doktrin des raschen Sieges"
PRC_swift_victory_idea_desc:0	"Wenn wir den Krieg gegen die japanischen Invasoren gewinnen wollen, müssen wir schnell handeln und zuschlagen, bevor sie es merken."
propaganda_recruits:0	"Propaganda rekrutiert"
propaganda_recruits_desc:0	"Wir verlassen uns derzeit auf unsere Propaganda, um neues Blut in unsere Reihen zu locken. Das ist zwar nicht sehr effizient, aber es stärkt dennoch den Willen unseres Volkes.\n"
