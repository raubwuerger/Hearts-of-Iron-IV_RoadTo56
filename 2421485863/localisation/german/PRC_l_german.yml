prc_1_tt:0	"3 Infanteriedivisionen und 1 Panzerbrigade werden in Yan'an eintreffen.\n\n"
prc_no_generals_transfer:0	"§Die derzeitigen Generäle werden die Kommunisten nicht dulden und unser Militär verlassen.§!"
prc_sov_reinforcements:0	"Erhalten Sie 8 Divisionen von [SOV.GetName]"
PRC_dongbei_partisans_tt:0	"Übernehmen Sie die Kontrolle über alle Staaten in der Mandschurei, die [CHI.GetName] gehören."
west_expedition_failed_msg:0	"Die Westexpedition der PRC ist gescheitert und die Operation wurde beendet."
PRC_restart_CHI_war:0	"Entweder die VR China oder die Republik China haben sich gegenseitig den Krieg erklärt."
PRC_no_wargoal_to_chi_when_ok_tt:0	"§RWird das Kriegsziel gegen [CHI.GetName] mit §YEnforce Our Goal§! focus.§!\n nicht erreichen."
PRC_random_amount_of_partisan_tt:0	"§Y2 - 6 Guerilla-Einheiten werden unsere Bestechung annehmen und sich unserer Armee anschließen§!\n"
PRC_wait_for_civil_war_tt:0	"Dieses Ereignis wird erneut ausgelöst, wenn das Ereignis Japanischer Bürgerkrieg ausgelöst wird.\n"
PRC_takeover_dongbei_tt:0	"[PRC.GetName] übernimmt die Staaten in der Mandschurei, die [JAP.GetName] oder ihren Marionetten gehören.\n"
KMT_commie_generals_join_tt:0	"§YLin Biao§!, §YZhu De§!, §YChen Yi§! und §YPeng Dehuai§! schließen sich unserer Armee an."
KMT_hundred_flowers_tt:0	"Das ist ein Komplott, um die Übeltäter zu entlarven, aber ihre Kritik kann den Willen unseres Volkes beeinflussen, da es sich eher zu anderen Parteien hingezogen fühlt, bevor wir diese Übeltäter verhaften."
PRC_great_leap_timespan:0	"§Man erwartet, dass der Große Sprung nach vorn§! mehrere§! Jahre dauern wird, aber er könnte nach §Reinem Jahr§! abgebrochen werden, sollte er für unsere Wirtschaft katastrophal sein..."
KMT_leap_stop:0	"Die Politik des §YGroßen Sprungs nach vorn§! ist zu einem Ende gekommen."
PRC_solidifying_our_revolution:0	"Unsere Revolution festigen"
PRC_solidifying_our_revolution_desc:0	"[PRC.getNameDefCap] hatte in den letzten Jahren mit vielen Kämpfen zu kämpfen. Die verräterische Kuomintang hatte 1935 versucht, jede Art von sozialistischer Opposition zu vernichten, was unsere einst populäre Bewegung unter den Bauern dazu zwang, sich zu zerstreuen und über die ländlichen Gebiete der Zentralebene zu verstreuen. Es wird sicherlich Zeit und Mühe kosten, wieder zu Kräften zu kommen, doch wir werden als Siegermacht aus diesem Kampf hervorgehen!"
PRC_question_of_our_capital_decision:0	"Klären Sie die Frage des Kapitals"
PRC_question_of_our_capital_decision_desc:0	"Die Volksrevolution wird noch mehr Unterstützung bei den Arbeitern und Bauern finden, wenn wir offiziell die Gründung von [PRC.getNameDef] in unserer neu gewonnenen Hauptstadt verkünden."
PRC_the_new_communist_beacon:0	"Das neue kommunistische Leuchtfeuer"
PRC_the_new_communist_beacon_desc:0	"Der revolutionäre Kampf wird niemals enden, solange es Unterdrücker, Kolonisatoren, Imperialisten und Feinde des Volkes gibt! \nMit ein paar schnellen Schlägen können wir regierungsfeindliche Zellen außerhalb und innerhalb von [ROOT.getNameDef] vernichten. \nDie Zeit ist gekommen, dass Da Zhonghua Diqu aufsteht und gedeiht!"
PRC_hundred_flowers_campaign_progress:0	"Fortschritt der Hundert-Blumen-Kampagne"
PRC_offer_a_separate_peace_to_japan:0	"Bieten Sie Japan einen Separatfrieden an"
PRC_offer_a_separate_peace_to_japan_desc:0	"Die imperialistische Bedrohung wurde besiegt und wir kontrollieren nun den größten Teil der Nordgrenze Chinas. Da ihre Armeen dezimiert sind und die Nationalisten mit den Kämpfen in der Zentralebene beschäftigt sind, können wir den besiegten Feind dazu zwingen, das Unvermeidliche zu akzeptieren und die Feindseligkeiten einzustellen. Für den Moment."
PRC_defy_sov_order:0	"Sowjetischer Befehl missachtet"
PRC_sov_approve:0	"Die Sowjets haben unseren Vorschlag angenommen"
