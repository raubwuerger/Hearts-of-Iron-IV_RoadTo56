l_german:
PRC_air_innovation_desc:0	"Traditional aerial doctrines and aircraft designs will ultimately fall into disuse. We must find new and more efficient ways to destroy our enemy in the air while they stagnate."
prc_sov_supply_tt:0	"Ist der Nachbar von einem der folgenden:\n §YSoviet Union§!\n Fraktionsmitglied von §YSoviet Union§!\n Kommunist §YSinkiang§! mit positiver Meinung gegenüber §YSoviet Union§!."
prc_sov_supply_eff_tt:0	"§YSowjetische Verstärkung und Nachschub werden in wenigen Tagen in Yan'an eintreffen§!."
prc_long_march_tt:0	"§Wir werden uns schneller von dem Langen Marsch erholen§!\n\n"
prc_west_expedition_tt:0	"Drei für die Expedition vorgesehene Divisionen werden sich in Yan'an versammeln.\n\n"
prc_east_expedition_tt:0	"Zwei für diese Operation vorgesehene Divisionen werden sich in Yan'an versammeln.\n\n"
prc_front_infras_tt:0	"Fügen Sie 2 §YInfrastrukturen§! in allen eigenen Staaten hinzu, die an §YJapan§! und seine Marionetten grenzen."
prc_root_out_defeatism_tt:0	"Die Japaner sind vom Festland vertrieben worden."
prc_set_government_rank:0	"Ändern Sie den Namen des Landes in §YVolksrepublik China§!.\n"
prc_eliminate_iliteracy_tt:0	"Wir werden nach und nach mehr qualifiziertes Personal erhalten."
PRC_zxl_will_become_leader_if_agree:0	"§YZhang Xueliang wird der Führer der Großen Nordwestlichen Union werden, nachdem der entsprechende Schwerpunkt abgeschlossen ist.\n§!"
prc_preserve:0	"Aktiviert §HSelf-Preservation§!\nAlle Infanterie : \n Trickleback : §G+0.2%§!\n Erfahrungsverlust : §G-1.0%§!"
PRC_mountain_training_tt:0	"Ermöglicht §HMountain Warfare§!\nAlle Infanterie : \n §HMountain§!\n Movement: §G+10%§!\n §Hügel§!\n Bewegung: §G+10%§!\n\n§HMarines\n Mountain§!\n Attack: §G+5%§!\n §HHills§!\n Attacke: §G+5%§!\n \n§HMountaineers\n Mountain§!\n Attack: §G+5%§!\n §HHills§!\n Attack: §G+5%§!\n \n§HParatroopers\n Mountain§!\n Attack: §G+5%§!\n §HHills§!\n Attack: §G+5%§!\n\nGewinnen Sie 2 Elite-Bergsteiger-Divisionen.\n"
PRC_yhc_join:0	"§YYang Hucheng§! wird sich unserer Armee anschließen\n"
PRC_resore_dbj_glory_tt:0	"Besitzen und kontrollieren Sie die folgenden Staaten:\n §YJehol§!\n §YLiaotung§!\n §YKirin§!\n §YLiaoning§!\n"
PRC_create_wargoal_for_db_tt:0	"Gewinnen Sie ein Kriegsziel gegen den Besitzer oder Oberherrn des Besitzers der folgenden Staaten: \n §YLiaotung§!\n §YLiaoning§!\n §YJehol§!\n §YKirin§!\n §YSungkiang§!\n §YEast Hulunbuir§!\n §YNorth Xing'an§!\n §YEast Xing'an§!\n §YKanto- shu§!\n §Y-Ost Hebei§!\n §YCahar§!\n §YSüd Cahar§!\n"
PRC_xbj_join_tt:0	"Gewinnen Sie 3 Divisionen\n"
PRC_turn_fascist_when_select_tt:0	"Mao und einige der Kommunisten werden hingerichtet, wenn der Fokus gewählt wird.\n§Wenn dieser Fokus gewählt wird, wird auch die faschistische Partei zur Regierungspartei§!\n\n"
PRC_same_ideology_with_jap:0	"Hat die gleiche Ideologie wie [JAP.GetName]"
PRC_get_wargoal_for_fareast_tt:0	"Gewinnen Sie das Kriegsziel für den Eigentümer oder Oberherrn des Eigentümers der folgenden Staaten:\n §YWladiwostok§!\n §YChabarovsk§!\n §YBirobidschan§!\n §YNikolajewsk§!\n §YAmur§!\n §YNord Sachalin§!\n"
PRC_if_completed_pact_focus_tt:0	"\nWenn der Fokus §YA Pact With Japan§! abgeschlossen ist, wird die Wirkung wie folgt sein:\n\n"
PRC_if_completed_pact_focus_add_tt:0	"\nWenn der Fokus §YA Pact With Japan§! abgeschlossen ist, wird dieser Fokus keinen nationalen Geist gewähren\n\n"
PRC_feng_clique_generals_join_tt:0	"§YMa Zhanshan§!, §YHe Zhuguo§!, §YYu Xuezhong§! und §YZhang Zuoxiang§! werden unserer Armee beitreten.\n\n"
chi_accept_prc71_no_tt:0	"[CHI.GetName] hat unseren Vorschlag nicht angenommen"
