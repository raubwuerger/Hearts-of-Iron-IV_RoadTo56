political_mobilisation_idea:0	"Politische Mobilisierung"
PRC_uncertainty_of_new_theory:0	"Ungewissheit der neuen Doktrin"
PRC_uncertainty_of_new_theory_desc:0	"Die Verabschiedung einer neuen Doktrin, die alle bisherigen Strategien über Bord wirft, hat einige Bedenken aufkommen lassen."
PRC_maybe_theory_is_ok:0	"Vertrauen in die neue Doktrin"
PRC_maybe_theory_is_ok_desc:0	"Die neu angenommene Doktrin hat sich als erfolgreich erwiesen, unsere Armee hat sich vollständig an den neuen Kampfstil gewöhnt. Wenn der Krieg nicht zu Ihren Gunsten verläuft, könnte Ihre Armee das Vertrauen in die Doktrin verlieren."
PRC_enemy_partisan:0	"Feindliche Partisanen hinter unserer Frontlinie"
PRC_enemy_partisan_desc:0	"Die Partisanen unseres Feindes haben sich tief hinter unserer Frontlinie festgesetzt und verursachen Schäden an den Nachschubwegen und verlangsamen unsere Truppen.\n\n§RDieser Nationalgeist wird erlöschen, wenn der Krieg mit der VR China vorbei ist.§!\n\n§RPeriodische Gebäudeschäden in den von uns kontrollierten chinesischen Kernstaaten§!"
PRC_exploit_our_enemys_mistake_idea:0	"Den Fehler unseres Gegners ausnutzen"
PRC_exploit_our_enemys_mistake_idea_desc:0	"Die Operation an der Front unseres Gegners ist nicht sehr gut koordiniert. Wir können dies zu unserem Vorteil nutzen und es so gut wie möglich ausnutzen.\n\n§RDieser nationale Geist wird erlöschen, wenn der Krieg mit Japan vorbei ist.§!"
improper_frontline_command:0	"Schwachstellen der Frontlinienoperation"
improper_frontline_command_desc:0	"Die Schwachstellen in unserer Operation an der Front zeigen sich allmählich, und unser Feind beginnt, sie zu seinem Vorteil zu nutzen."
PRC_until_the_bitter_end:0	"Bis zum besseren Ende"
PRC_land_reform_stimulated_our_farmers:0	"Aufstand der Bauern"
PRC_land_reform_stimulated_our_farmers_desc:0	"Die Landreformpolitik der Kommunisten hat viele Bauern in unserem Land aufgeschreckt. Diese Bauern lehnen sich nun gegen ihre Grundbesitzer auf und schließen sich der kommunistischen Bedrohung an."
prc_plan_for_decisive_battle:0	"Gründliche Planung"
