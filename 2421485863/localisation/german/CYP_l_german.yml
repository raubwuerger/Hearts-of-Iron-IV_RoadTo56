l_german:
cyprus_tree:	"Zypern Fokus Baum"
CYP_shortcut_industry:	"Städtische / Ländliche Entwicklung"
CYP_shortcut_army:	"Die Armee"
CYP_begin_urbanisation_efforts:	"Beginn der Urbanisierungsbemühungen"
CYP_begin_urbanisation_efforts_desc:	"Wir beobachten, wie jedes Land um uns herum uns in der Industrieproduktion überholt. Wir müssen ihrem Beispiel folgen, um nicht zurückzubleiben."
CYP_continue_farming_reliance:	"Weiterhin auf die Landwirtschaft setzen"
CYP_continue_farming_reliance_desc:	"Wenn wir unsere Methoden nicht ändern, können wir unser heimisches Know-how nutzen und eine florierende Wirtschaft aufbauen."
CYP_railways:	"Eisenbahnen importieren"
CYP_railways_desc:	"Auch wenn uns die Mittel fehlen, um selbst ein Eisenbahnsystem zu bauen, können wir die benötigten Materialien importieren und die erste Eisenbahnlinie der Insel bauen."
CYP_urban_investments:	"Städtische Investitionen"
CYP_urban_investments_desc:	"Die Beschleunigung der Urbanisierung ist ein zentrales Ziel unserer Wirtschaftspolitik. Daher sind Investitionen ein logischer Schritt."
CYP_coastal_investments:	"Unsere Küste entwickeln"
CYP_coastal_investments_desc:	"Als Insel braucht [183.GetName] eine ausgebaute Küste, um mit dem Rest der Welt verbunden zu sein und um den Transport rund um die Insel selbst zu gewährleisten."
CYP_subsidise_fruit_farming:	"Subventioniere den Obstanbau"
CYP_subsidise_fruit_farming_desc:	"Unser mediterranes Klima ist perfekt für den Anbau verschiedener Obstsorten. Sie können ein wichtiges Exportgut werden, wenn wir ihre Produktion subventionieren."
CYP_mining_effort:	"Bergbau betreiben"
CYP_mining_effort_desc:	"Obwohl wir uns auf die Landwirtschaft konzentrieren, müssen wir in der Rohstoffproduktion wettbewerbsfähig bleiben."
CYP_construct_power_plants:	"Kraftwerke bauen"
CYP_construct_power_plants_desc:	"Um die wachsenden städtischen Sektoren und Fabriken zu unterstützen, ist ein Ausbau unseres Stromnetzes angebracht."
CYP_link_the_cities:	"Verbinde die Städte"
CYP_link_the_cities_desc:	"Eine Wirtschaft ist nur die Summe ihrer Teile, wenn sie gut miteinander verbunden ist. Dies sollte durch ein stabiles Straßennetz erleichtert werden."
CYP_national_industries:	"Nationale Industrien"
CYP_national_industries_desc:	"Um die Wirtschaft zu kontrollieren und Misswirtschaft zu verhindern, können wir nationale Industrien einrichten."
CYP_natural_build_up:	"Vorrang für natürliches Wachstum"
CYP_natural_build_up_desc:	"Wenn wir die Wirtschaft zu sehr beeinflussen, riskieren wir einen wirtschaftlichen Zusammenbruch. Wir müssen für ein natürliches und allmähliches Wachstum sorgen, um eine solche Katastrophe zu verhindern."
CYP_water_infrastructure:	"Wasserinfrastruktur aufbauen"
CYP_water_infrastructure_desc:	"Das Klima auf der Insel macht ein solides Wassernetz fast zwingend erforderlich, damit die Ernten nicht verdorren."
CYP_rural_infrastructure:	"Ländliche Infrastruktur bereitstellen"
CYP_rural_infrastructure_desc:	"Ländliche Gemeinden sind oft sehr schwer zu erreichen. Um das zu ändern, müssen wir Straßen selbst zu den entlegensten Dörfern bauen."
CYP_resource_prospecting:	"Erkundung von Ressourcen"
CYP_resource_prospecting_desc:	"Wir haben nicht alle verfügbaren Ressourcen auf [183.GetName] erkundet. Das soll nun nachgeholt werden."
CYP_construct_argaka_dam:	"Bau des Argaka-Damms"
CYP_construct_argaka_dam_desc:	"Wir haben einen geeigneten Standort für einen großen Staudamm ausfindig gemacht. Der Bau wird eine Weile dauern, aber es wird sich lohnen."
CYP_develop_heavy_industry:	"Entwickle die Schwerindustrie"
CYP_develop_heavy_industry_desc:	"Wir können unsere Wirtschaft nicht nur auf Dienstleistungen und Veredelung aufbauen. Die Entwicklung einer Schwerindustrie schafft Arbeitsplätze und einen neuen Sektor."
CYP_trade_port:	"Errichte einen Handelshafen"
CYP_trade_port_desc:	"Durch unsere Lage im Mittelmeer haben wir ein großes Potenzial für den Handel. Wir sollten einen Handelshafen bauen, um dieses Potenzial zu erschließen."
CYP_utilise_stengths:	"Nutze unsere Stärken"
CYP_utilise_stengths_desc:	"Indem wir das fortsetzen, was wir seit Jahrtausenden getan haben, kann unser Land zu dauerhaftem Wohlstand gelangen."
CYP_education_effort:	"Bildungsanstrengungen"
CYP_education_effort_desc:	"Die Bildung unseres Volkes sollte immer eine Priorität sein. Unter den Besatzungen der Vergangenheit wurde dies vernachlässigt, deshalb sollten wir eine Bildungskampagne starten."
CYP_research_sector:	"Einen Forschungssektor einrichten"
CYP_research_sector_desc:	"Wir haben die Mittel, um einen eigenen Forschungssektor zu schaffen, der unsere Nation in eine fortschrittliche Wirtschaft und ein fortschrittliches Land verwandeln kann."
CYP_trade_economy:	"Handelswirtschaft"
CYP_trade_economy_desc:	"Der Handel hat Wunder für unsere Wirtschaft bewirkt. Wir sollten seine Wirkung weiter verstärken, indem wir uns stärker auf den Handel stützen."
CYP_educated_nation:	"Eine gebildete Nation"
CYP_educated_nation_desc:	"Unsere Bemühungen haben Wunder bewirkt, und das bisschen Analphabetismus, das es noch gab, ist jetzt fast vollständig verschwunden. Wir haben uns erfolgreich in eine moderne und gebildete Nation verwandelt."
CYP_arms_for_nation_tt:	"\n§HDieser Nationalgeist wird verschwinden, sobald wir zwei Militärfabriken haben.§!"
CYP_professional_army_training_tt:	"Kombiniere §HNaval Invasion Specialisation§!, §H[ROOT.GetAdjectiveCap] Marine Corp§! und §HAggressive General Staff§! zu dem Nationalgeist §HProfessional Army§!."
CYP_found_army:	"Die Armee gründen"
CYP_found_army_desc:	"Da das Land erst kürzlich seine Unabhängigkeit erlangt hat, braucht es eine Armee, um das neue freie Land zu verteidigen."
CYP_across_sea:	"Jenseits des Meeres"
CYP_across_sea_desc:	"Umgeben vom Meer, müssen wir es überqueren, um unsere Schlachten zu schlagen."
CYP_island_defense:	"Vorbereitungen für die Inselverteidigung"
CYP_island_defense_desc:	"Wenn die Zeit gekommen ist, müssen wir die Verteidigung unserer kostbaren Insel vorbereiten."
CYP_general_staff_attack:	"Angriffsorientierter Generalstab"
CYP_general_staff_attack_desc:	"Da die meisten unserer Schlachten in Übersee ausgetragen werden, müssen wir nur wenig verteidigen, so dass sich unsere Taktiker auf die Entwicklung aggressiver Strategien konzentrieren können."
CYP_marine_corp:	"Einen Marinekorps aufstellen"
CYP_marine_corp_desc:	"Eine Seelandung ist selten eine Schlacht für einen einfachen Soldaten. So etwas wird am besten von ausgebildeten Expeditionsstreitkräften durchgeführt, die auf Seeangriffe spezialisiert sind."
CYP_war_mobilisation:	"Für den Krieg mobilisieren"
CYP_war_mobilisation_desc:	"Wenn der Krieg auf [ROOT.GetNameDef] zukommt, müssen wir jeden arbeitsfähigen Mann für den Kampf mobilisieren!"
CYP_equipment_modernisation:	"Modernisiere die Ausrüstung"
CYP_equipment_modernisation_desc:	"Der Großteil unserer Ausrüstung war noch aus der Zeit der britischen Besatzung übrig. Wir sollten neue Waffen kaufen und auch unsere eigenen Feuerwaffen entwickeln."
CYP_grand_defense_plan:	"Entwickle einen großen Verteidigungsplan"
CYP_grand_defense_plan_desc:	"Im Falle einer fremden Invasion muss jedes einzelne Detail des Kampfes berücksichtigt werden und ein Gegenschlag muss vorbereitet werden."
CYP_trench_warfare:	"Nutze den Grabenkrieg"
CYP_trench_warfare_desc:	"Die Schrecken des Großen Krieges haben der Welt wenig gebracht. Aber sie haben gezeigt, dass man für die beste Verteidigung Gräben ausheben muss."
CYP_professional_army_training:	"Professionelle Armeeausbildung"
CYP_professional_army_training_desc:	"Unsere unerfahrene Armee muss regelmäßig trainieren, um im offenen Kampf eine Chance zu haben."
CYP_invasion_plans:	"Pläne für eine Invasion machen"
CYP_invasion_plans_desc:	"Denn wenn die unvermeidliche Invasion von [183.GetName] stattfindet, soll die Bevölkerung ihr Land verteidigen, damit wir eine angemessene Verteidigung vorbereiten können."
CYP_prepare_coastal_defenses:	"Küstenverteidigung vorbereiten"
CYP_prepare_coastal_defenses_desc:	"Unsere Küstenlinie muss um jeden Preis geschützt werden. Wenn sie fällt, steht den feindlichen Streitkräften kaum noch etwas im Weg."
CYP_arms_for_nation:	"Bewaffnung der Nation"
CYP_arms_for_nation_desc:	"Wir als Nation müssen uns bewaffnen!"
CYP_adopt_british_guns:	"Nehmt britische Gewehre an"
CYP_adopt_british_guns_desc:	"Obwohl sie ein Symbol der Besatzung sind, sollten die vielen britischen Waffen, die zurückgelassen wurden, genutzt werden."
CYP_create_armoured_corp:	"Schaffe eine gepanzerte Truppe"
CYP_create_armoured_corp_desc:	"Eine moderne Armee nutzt verschiedene gepanzerte Fahrzeuge, vor allem Panzer, um jeden Gegner auszumanövrieren und zu übertrumpfen."
CYP_deep_defense:	"Tiefe Verteidigung"
CYP_deep_defense_desc:	"Ein tiefer Verteidigungsansatz ist eine innovative Lösung für die Verteidigung von [183.GetName]."
CYP_war_lessons:	"Lektionen aus dem Krieg"
CYP_war_lessons_desc:	"Der beste Lehrmeister ist der Krieg. Wir können eine Menge von ihm lernen."
CYP_guerilla_war:	"Nutze den Guerillakrieg"
CYP_guerilla_war_desc:	"Wie besiegt man einen Feind, der überall ist, nur dann auftaucht, wenn er eine Falle gestellt hat und spurlos verschwindet? Das kann man nicht, und deshalb ist das eine gute Methode, um unser Land zu verteidigen."
CYP_support_equipment:	"[ROOT.GetAdjectiveCap] Unterstützungsausrüstung"
CYP_support_equipment_desc:	"Heutzutage wird der Krieg nicht nur mit Waffen geführt, sondern auch mit Funkgeräten, Zelten und Schaufeln."
CYP_motorisation_drive:	"Motorisierung Antrieb"
CYP_motorisation_drive_desc:	"Autos können als Truppentransporter, Nachschubtransporter und manchmal sogar als Kampffahrzeuge eingesetzt werden. Lastwagen spielen in der modernen Kriegsführung eine immer wichtigere Rolle."
CYP_develop_tank_variants:	"Panzervarianten entwickeln"
CYP_develop_tank_variants_desc:	"Panzer sind ebenso effektiv wie vielseitig. Mit nur relativ geringen Modifikationen können sie gegen Flugzeuge, zur Unterstützung der Infanterie und sogar als technische Fahrzeuge eingesetzt werden."
CYP_island_fortress:	"Eine Inselfestung"
CYP_island_fortress_desc:	"Mit dem richtigen Festungsbau kann [183.GetName] in eine uneinnehmbare Festung verwandelt werden, die selbst die stärksten Feinde in Schach halten kann."
CYP_create_nicosia_arsenal:	"Erschaffe das Arsenal von Nikosia"
CYP_create_nicosia_arsenal_desc:	"Wenn die Waffen in der Hauptstadt gelagert werden, sind sie leicht zugänglich und befinden sich am wichtigsten Ort des Landes."
r56_CYP_aftermath_october_events:	"Die Folgen der Oktober-Ereignisse"
r56_CYP_aftermath_october_events_desc:	"Im Oktober 1931 wurde die Insel [183.GetName] von einem großen Aufstand erschüttert, der von einer gemischten Gruppe griechischer Zyprioten angeführt wurde, die §HEnosis§! forderten. Der damalige Gouverneur Ronald Storrs unterdrückte diese Aktivitäten, was zu einem kurzen Konflikt zwischen den Demonstranten und der örtlichen Polizei führte. Dabei kamen mehrere Zivilisten ums Leben, es gab mehrere Verletzte und die Demonstranten wurden strafrechtlich verurteilt. Außerdem wurden zehn von ihnen ins Exil geschickt. Die britische Regierung machte Aléxis Kýrou, den von der griechischen Regierung nach Limassol entsandten Generalrat, für die Anzettelung des Aufstands verantwortlich. Er hatte im Untergrund eine Opposition gegen die britische Herrschaft aufgebaut, doch die griechische Regierung bestritt jede Verwicklung in seine Aktivitäten. Die griechische Regierung leugnete jedoch jede Beteiligung an seinen Aktivitäten. Deshalb wurde ihm ein anderer Posten zugewiesen: Er wurde Sekretär der griechischen Delegation in Deutschland und nutzte seine außenpolitischen Kenntnisse.\n\nDie Folgen dieser Revolte sind auf der Insel noch immer zu spüren, denn der neu ernannte Gouverneur von [183.GetName], Richmond Palmer, führte eine Periode autokratischer Herrschaft, die auch als „Palmerokratía“ oder „Palmerokratie“ bekannt ist. Obwohl er dazu beitrug, die Gefahr einer Hungersnot nach zwei Dürrejahren zu lindern und den Hafen von Famagusta zu vergrößern, war seine Herrschaft streng und beendete effektiv alle direkten Forderungen nach §HEnosis§!. Um diese nationale Idee zu beseitigen, musst du entweder die Forderungen nach Enosis erfüllen oder eine andere nationale Identität bilden."
r56_CYP_orthodox_church_idea:	"Einfluss der orthodoxen Kirche"
r56_CYP_orthodox_church_idea_desc:	"Der orthodoxe christliche Glaube ist seit dem 1. Jahrhundert n. Chr. ein Teil der zypriotischen Geschichte, als [183.GetName] eines der ersten Länder wurde, das von einem christlichen Führer regiert wurde. Die Religion breitete sich gegen Ende des 4. Jahrhunderts n. Chr. weiter aus und wurde in den folgenden Jahrtausenden zu einem wichtigen Bestandteil der Insel.\n\nHeutzutage spielt sie eine wichtige Rolle für die Identität der Insel und die meisten Bewohner/innen sehen zu ihr auf, um sich zu orientieren. Als die Insel von Großbritannien besetzt wurde, begann auch der örtliche Klerus, eine aktive Rolle in der zypriotischen Politik zu spielen. Im Jahr 1931 rief der Bischof von Kition zu zivilem Ungehorsam auf, bis die §HEnosis§! erreicht war, was ein paar Tage später die Oktoberereignisse auslöste. Derzeit ist der Thron des Erzbischofs von [183.GetName] vakant, da fast alle Bischöfe der Insel als Anstifter des Aufstandes ausgewiesen wurden. Als einziger verbliebener Bischof übt [CYP.CYP_leontios.GetName] das Amt des Erzbischofs als Regent aus, bis ein neuer gewählt wird."
r56_CYP_ideological_turmoil:	"Ideologischer Aufruhr"
r56_CYP_ideological_turmoil_desc:	"Obwohl die zypriotische Bevölkerung im Streben nach §HEnosis§! fast geeint ist, ist sie alles andere als zusammengewachsen. Es gibt viele politische Gedanken, aber nur wenige stimmen miteinander überein. Das hat zu einem ideologischen Kampf um die Insel geführt.\n\n Obwohl der verbotene KKK jahrelange Erfahrung im Untergrund hat und seine Ideen auf der ganzen Insel verbreitet sind, sind sie bei weitem nicht die Mehrheit. Da die orthodoxe Kirche einen großen Einfluss auf die Bevölkerung hat, ist ihre Unterstützung für die demokratische Herrschaft auch am weitesten verbreitet. Die lange und mühsame britische Besatzung hat jedoch viele Menschen radikalisiert. Das hat nationalistische Gruppen gestärkt, die bereit sind, §HEnosis§! über alles zu stellen."
r56_CYP_ethno_religious_conflict:	"Ethnisch-religiöser Konflikt"
r56_CYP_ethno_religious_conflict_desc:	"[183.GetName] ist seit langem die Heimat vieler Menschen, die meisten von ihnen orthodoxe Griechen, aber die lange Herrschaft des Osmanischen Reiches und die Nähe zur anatolischen Halbinsel haben der Insel auch eine beträchtliche türkische Minderheit beschert, die vom Islam dominiert wird. Da sie zahlenmäßig fast zehn zu eins unterlegen sind, bleibt die türkische Bevölkerung meist in ihren eigenen Gemeinden.\n\nDie fast antagonistische Beziehung zwischen Griechenland und der Türkei und die Ereignisse des letzten Jahrzehnts haben ein harmonisches Leben fast unmöglich gemacht. Der starke Ruf nach §HEnosis§! durch die griechische Bevölkerung wird von der türkischen Minderheit als Katastrophe angesehen, während Nationalisten die Insel als griechisches Heimatland und andere Völker als Eindringlinge betrachten. Dieses Aufeinandertreffen hat zu regelmäßigen Konflikten zwischen Türken und Griechen geführt, die selten friedlich enden."
r56_CYP_urbanisation_campaign:	"Urbanisierungskampagne"
r56_CYP_urbanisation_campaign_desc:	"Als eine Insel, die von der Landwirtschaft dominiert wird, ist es an der Zeit, die Industrie in einen stärker entwickelten Zustand zu versetzen."
r56_CYP_hydroelectricity:	"Hydroelektrizität"
r56_CYP_hydroelectricity_desc:	"[ROOT.GetNonIdeologyName] hat aufgrund der geografischen Lage der Insel ein großes Potenzial für Wasserkraft."
r56_CYP_naval_industry:	"[ROOT.GetAdjectiveCap] Marineindustrie"
r56_CYP_naval_industry_desc:	"Als einzige Möglichkeit, große Mengen an Waren zu exportieren, ist die Marineindustrie von [ROOT.GetNonIdeologyName] lebenswichtig für das ganze Land."
r56_CYP_national_industries:	"Mehrere wichtige Unternehmen in [ROOT.GetName] wurden verstaatlicht oder vom Staat gegründet."
r56_CYP_growing_economy:	"Wachsende Wirtschaft"
r56_CYP_growing_economy_desc:	"Da [ROOt.GetName] seine Industrie weiter ausbaut, hat die Wirtschaft eine lange Phase des Wachstums erlebt."
r56_CYP_trade_hub:	"Drehscheibe des Mittelmeerhandels"
r56_CYP_trade_hub_desc:	"[183.GetName] liegt strategisch günstig an einer wichtigen Handelsroute nach Asien. Von diesem Verkehr kann profitiert werden."
r56_CYP_farming_focus:	"Landwirtschaftlicher Schwerpunkt"
r56_CYP_farming_focus_desc:	"Da der Großteil der Bevölkerung im primären Wirtschaftssektor beschäftigt ist, hat die Landwirtschaft in [ROOT.GetName] Priorität."
r56_CYP_mine_expansion:	"Ausbau des Bergbaus"
r56_CYP_mine_expansion_desc:	"[183.GetName] ist reich an Ressourcen, es geht nur darum, sie abzubauen."
r56_CYP_dyn_mod_accessible_countryside:	"Erreichbare Landschaften"
r56_CYP_dyn_mod_accessible_countryside_desc:	"Dank umfangreicher Bemühungen, abgelegene Gemeinden mit dem Rest der Insel zu verbinden, war es noch nie so einfach, sich auf [183.GetName] fortzubewegen."
r56_CYP_agrarian_economy:	"Landwirtschaftliche Wirtschaft"
r56_CYP_agrarian_economy_desc:	"Der Fokus auf die Landwirtschaft und die wirtschaftliche Basis von [ROOT.GetNonIdeologyName] hat zu einem florierenden Agrarsektor geführt, der den Weg für einen wirtschaftlichen Aufschwung ebnet."
r56_CYP_education_initiative:	"Bildungsinitiative"
r56_CYP_education_initiative_desc:	"Die Bevölkerung braucht eine gute Ausbildung, um ihre volle Leistungsfähigkeit zu entfalten, und eine hohe Bildung ist auch ein Zeichen für einen hohen Entwicklungsstand. Diese Dinge werden mit einer Bildungsinitiative verbessert."
r56_CYP_dyn_mod_national_guard:	"[ROOT.GetAdjectiveCap] Nationalgarde"
r56_CYP_dyn_mod_national_guard_desc:	"Die Nationalgarde ist eine militärische Einrichtung zur Verteidigung von [ROOT.GetNonIdeologyName] und kann sich auf diesen Bereich spezialisieren."
CYP_naval_invasion_specialisation:	"Spezialisierung auf die Invasion der Marine"
CYP_naval_invasion_specialisation_desc:	"Die [ROOT.GetAdjectiveCap] Streitkräfte haben sich auf Invasionen in Übersee spezialisiert, was sie zu einem furchterregenden Gegner im östlichen Mittelmeer gemacht hat."
CYP_war_mobilisation_i:	"Mobilisierung"
CYP_war_mobilisation_i_desc:	"Der Krieg hat [ROOT.GetNameDef] getroffen. Es müssen alle Vorbereitungen für den Sieg getroffen werden, damit das Land bestehen bleibt."
CYP_marine_corp_i:	"[ROOT.GetAdjectiveCap] Marine Corp"
CYP_marine_corp_i_desc:	"Die maritimen Spezialkräfte von [ROOT.GetNameDef] sind bestens für Seeangriffe ausgebildet und können mit Leichtigkeit an fast jeder Küste landen."
CYP_war_industrialisation:	"Kriegsindustrialisierung"
CYP_war_industrialisation_desc:	"Eine Nation muss geschützt werden, und wie jeder weiß, schützen Waffen die Nation. Deshalb ist eine Militärindustrie nicht nur für den Schutz der Nation wichtig, sondern auch für eine größere außenpolitische Freiheit.\n\n§Dieser nationale Geist wird verschwinden, sobald wir zwei Militärfabriken haben.§!"
CYP_equipment_modernisation_i:	"Anstrengungen zur Modernisierung der Ausrüstung"
CYP_equipment_modernisation_i_desc:	"Mit veralteter Ausrüstung kann kein Krieg geführt werden!"
CYP_general_staff_attack_i:	"Aggressiver Generalstab"
CYP_general_staff_attack_i_desc:	"Während manche sagen, dass „Eine gute Verteidigung ist ein guter Angriff“ kein guter Weg ist, ein Land zu verteidigen, hat der [ROOT.GetAdjectiveCap] Generalstab dieses Paradigma angenommen."
CYP_professional_army:	"Professionelle Armee"
CYP_professional_army_desc:	"Die [ROOT.GetAdjectiveCap] Streitkräfte haben lange und hart trainiert, um ihren heutigen Stand der Disziplin zu erreichen. Sie sind auf verschiedenen Schlachtfeldern hervorragend, vor allem bei der amphibischen Invasion."
r56_CYP_dyn_mod_coastal_defense_preparations:	"Vorbereitungen für die Küstenverteidigung"
r56_CYP_dyn_mod_coastal_defense_preparations_desc:	"Da unsere Nation mit einer möglichen Invasion konfrontiert ist, werden die [ROOT.GetAdjectiveCap] verstärkt, um eine Landung zur Verteidigung zu erleichtern."
CYP_homeland_defense:	"Heimatverteidigung"
CYP_homeland_defense_desc:	"Jeder fähige Mann sollte an der Verteidigung unserer geliebten Nation mitarbeiten, wenn nicht durch den Militärdienst, dann durch die Unterstützung der Landesverteidigung."
r56_CYP_dyn_mod_island_fortress:	"Insel-Festung"
r56_CYP_dyn_mod_island_fortress_desc:	"Die Insel [183.GetName] ist so stark befestigt, dass es nahezu unmöglich ist, Truppen anzulanden und erst recht, eine Landschlacht auf ihr zu führen."
r56_CYP_mining_corporation:	"[183.GetName] Bergbaugesellschaft"
r56_CYP_mining_corporation_desc:	"Das 1914 von dem Amerikaner Charles G. Gunther gegründete Bergbauunternehmen baut große Mengen Kupfer ab und verkauft es weltweit."
r56_CYP_aetk:	"Archís Esoterikón Tilepikoinonión Kýprou"
r56_CYP_aetk_desc:	"Die AETK oder zypriotische Inlandstelekommunikationsbehörde ist das erste Telekommunikationsunternehmen des Landes. Als halbstaatliches Unternehmen ist sie für die Verbindung Zyperns mit dem Rest der Welt zuständig."
r56_CYP_jp_ltd:	"Ioannou & Paraskevaides Ltd."
CYP_ioannis_kliridis:	"Ioánnis Klirídis"
CYP_giannis_papangelou:	"Giánnis Papangélou"
CYP_themistoklis_dervis:	"Themistoklís Dérvis"
CYP_mehmet_ozkan:	"Mehmet Necati Özkan"
CYP_richmond_palmer:	"Richmond Palmer"
CYP_christodoulos_hadjipavlou:	"Christódoulos Chatzipávlou"
CYP_konstantinos_spyridakis:	"Konstantínos Spyridákis"
CYP_christofis_economides:	"Christofís Oikonomídis"
CYP_leontios:	"Antónios Leontíou"
CYP_dimitrios_dimitriou:	"Dimítrios Dimitríou"
CYP_nikos_christoforou:	"Níkos Pattíchis Christofórou"
CYP_andrea_pavlou:	"Andréa Pávlou"
CYP_ploutis_servas:	"Ploutís Sérvas"
CYP_adam_adamos:	"Adám Adámantos Adámos"
CYP_zinon_rossidis:	"Zínon Rossídis"
CYP_achilleas_aimilianidis:	"Achilléas Aimilianídis"
CYP_savvas_christis:	"Sávvas Chrístis"
CYP_fazil_kucuk:	"Fazıl Küçük"
