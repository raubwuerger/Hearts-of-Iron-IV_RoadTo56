r56_greenland.1.t:0	"Das Hull-Kauffmann-Abkommen"
r56_greenland.1.d:0	"Die [DEN.GetADjective] Regierung ist vor kurzem von faschistischen Armeen besiegt worden, aber das Kolonialgebiet Grönland bleibt frei von faschistischer Einmischung. Passenderweise hat sich ein [DEN.GetADjective] Diplomat namens Henrik Kauffmann vor kurzem an uns gewandt, was die Situation in Grönland angeht. Er handelt ‚im Namen des Königs‘ und der Autorität der kürzlich ins Exil gegangenen [DEN.GetADjective]-Regierung.\n\nNuuk-Beamte haben sich mit dieser Bitte an Kauffmann gewandt, da sie eine [USA.GetADjective]-Besetzung einer möglichen Besetzung durch [ENG.GetNameDef] oder [CAN.GetNameDef] vorziehen würden. Oder noch schlimmer, eine faschistische Macht. Dieses Abkommen mag völkerrechtlich zweifelhaft sein... Aber wir haben die Verantwortung, alles Land und die Menschen in der Neuen Welt vor faschistischen Bedrohungen zu schützen; dazu gehört auch Grönland.\n\nWie sollen wir vorgehen?"
r56_greenland.1.a:0	"Stelle Grönland sofort unter unsere direkte Kontrolle."
r56_greenland.1.b:0	"Lass die lokale Regierung in Nuuk die Kontrolle übernehmen. Allerdings müssen wir für ihre Sicherheit sorgen."
r56_greenland.1.c:0	"Wir sollten uns nicht einmischen."
