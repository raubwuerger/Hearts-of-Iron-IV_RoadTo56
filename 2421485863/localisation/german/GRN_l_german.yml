GRN_neutrality_party:0	"Inspektorat von Grönland"
GRN_the_carrier_which_came_in_from_the_cold:0	"Der Flugzeugträger, der aus der Kälte kam"
GRN_the_carrier_which_came_in_from_the_cold_desc:0	"Unsere geografische Lage erlaubt es uns, einen riesigen Flugzeugträger aus Eis zu entwickeln. Er würde es uns ermöglichen, überall dort zu dominieren, wo die Polarlichter leuchten und die Landung zu unterstützen, um die Küche zu erreichen, in der sich einige von ihnen versteckt halten."
