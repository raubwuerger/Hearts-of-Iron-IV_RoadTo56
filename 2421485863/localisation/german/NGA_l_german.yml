 # IDEAS # ""

 WAF_ethnic_disunity:0 "Ethnische Uneinigkeit"
 WAF_ethnic_disunity_desc:0 "[ROOT.GetNonIdeologyName] wird seit Jahren von einer enormen staatlichen Dysfunktionalität geplagt, die durch die Tatsache verursacht wird, dass sich unsere Nation aus verschiedenen ethnischen Gruppen und Stämmen zusammensetzt, die meistens nicht gut miteinander auskommen. Eines Tages werden die Narben der verschiedenen ethnischen Konflikte beseitigt werden müssen, damit [ROOT.GetNonIdeologyName] in das neue Zeitalter eintreten und gedeihen kann!"
