 # EVENTS # ""

 r56_nigeria.1.t:0 "[ROOT.GetNameDefCap] lädt uns in die Westafrikanische Föderation ein."
 r56_nigeria.1.desc:0 "Die [ROOT.GetAdjective]-Regierung schlägt in ihrem Streben nach einer Art panafrikanischer Politik eine Union zwischen unseren Ländern vor, in der angeblich alle westafrikanischen Nationen zu einer einzigen Föderation zusammengeschlossen werden sollen. Nach den Berichten, die wir derzeit erhalten haben, würde dies die Eingliederung von [ROOT.GetNonIdeologyName] in einen Bundesstaat der vorgeschlagenen westafrikanischen Föderation bedeuten."
 r56_nigeria.1.a:0 "Gemeinsam sind wir stärker!"
 r56_nigeria.1.b:0 "Dies ist nur eine verkappte Annexion."

 r56_nigeria.2.t:0 "[FROM.GetNameDefCap] tritt der Westafrikanischen Föderation bei!"
 r56_nigeria.2.desc:0 "Die Regierung von [FROM.GetAdjective] hat unseren föderalistischen Ansichten zugestimmt und wird sich unserer größeren Bewegung anschließen. Die Vorbereitungen für die Einrichtung von [ROOT.GetAdjective] Institutionen und die Übergabe der Macht haben begonnen. Bald wird [FROM.GetNonIdeologyName] vollständig in unseren Staat integriert sein, der dann hoffentlich zur Westafrikanischen Föderation wird."
 r56_nigeria.2.a:0 "Ausgezeichnet!"

 r56_nigeria.3.t:0 "[FROM.GetNameDefCap] lehnt unseren Vorschlag ab!"
 r56_nigeria.3.desc:0 "Die [FROM.GetAdjective]-Regierung von [FROM.GetLeader] lehnt die Idee einer Föderation ab, was zu Unruhen im eigenen Land führt. Zuvor war man davon ausgegangen, dass die Partei von [FROM.GetLeader] eng mit den Ansichten von [ROOT.GetLeader] verbunden ist, weshalb diese Reaktion für unsere Regierung ein Schock war."
 r56_nigeria.3.a:0 "Nur ein Rückschlag."
