l_german:

# EVENTS
abemama.1.t:0				"Amerikaner besetzen die Insel Canton!"
abemama.1.d:0				"Die Amerikaner haben vor kurzem die Insel Canton im Pazifischen Ozean besetzt. Wir haben uns zwar um die Insel und ihre Umgebung gestritten, aber das ist eindeutig ein Bruch des Status quo! Unsere Kriegsschiffe in der Gegend haben die Amerikaner als Warnzeichen zum Abzug beschossen, aber sie rühren sich nicht."
abemama.1.a:0				"Senden Sie einen diplomatischen Protest"
abemama.1.b:0				"Protest wegen eines Atolls?"

abemama.2.t:0				"Proteste aus London"
abemama.2.d:0				"Nach dem jüngsten Feuergefecht in Canton Island hat das Vereinigte Königreich gegen unseren Umzug protestiert und fordert, dass unsere "Wissenschaftler" auf das amerikanische Festland zurückgebracht werden."
abemama.2.a:0				"Was werden sie dagegen tun?"
abemama.2.b:0				"Es lohnt sich nicht, das Imperium zu testen"

abemama.3.t:0				"Die Amerikaner haben sich zurückgezogen!"
abemama.3.d:0				"Nach unserem diplomatischen Einspruch gegen ihre jüngsten Filme auf der Insel Canton haben sie ihre Wissenschaftler aufgefordert, nach Hause zurückzukehren, wie wir es gefordert hatten. Wenn die Siedler weg sind, können wir unsere Souveränität über die Insel wiederherstellen und die Ordnung wiederherstellen."
abemama.3.a:0				"Die Sonne scheint noch einmal"

abemama.4.t:0				"Amerikaner bleiben!"
abemama.4.d:0				"Unsere jüngsten diplomatischen Proteste haben sich als nichtig erwiesen. Die Amerikaner haben unsere Proteste ignoriert und sich geweigert, ihre Siedler wieder nach Hause zu bringen. wir könnten sie zwar mit Gewalt verscheuchen, aber das würde nichts nützen. lassen wir den Amerikanern ihren Willen."
abemama.4.a:0				"Wenn wir diese Politik fortsetzen, werden wir den Pazifik verlieren!"

