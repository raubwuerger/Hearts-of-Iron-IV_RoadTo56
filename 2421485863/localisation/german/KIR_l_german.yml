canton_island.1.t:0				"[USA.getNameDefCap] Besetzt Canton Island"
canton_island.1.d:0				"Kürzlich wurde eine Gruppe amerikanischer Wissenschaftler auf die Inseln entsandt, um die bevorstehende Sonnenfinsternis zu beobachten. Obwohl ihre ursprüngliche Mission nur darin bestand, die Sonnenfinsternis zu beobachten, haben sie beschlossen, einen Schritt weiter zu gehen und die Inseln zu besetzen."
canton_island.1.a:0				"Wir haben dringendere Angelegenheiten zu erledigen."
USA_contest_canton_island_desc:0				"Die strategische Lage von Canton Island ermöglicht es uns, auf der Insel und in ihrer Umgebung Forschungen durchzuführen, und macht sie gleichzeitig zu einem nützlichen Militärstützpunkt für mögliche Konflikte, die auf uns zukommen könnten."
