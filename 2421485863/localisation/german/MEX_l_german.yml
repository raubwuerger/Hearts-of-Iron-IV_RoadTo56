l_german:
MEX_counter_the_callistas:0	"Counter Callistas"
MEX_counter_the_callistas_desc:0	"The Callistas continue to cause the roots of our nation to rot. It is now time we take the effective measures to counter them and stop them from damaging our institutions any longer."
mexico.2.d:0	"Zeigen Sie Unterstützung für die mexikanischen Arbeiter."
Mexican_focus:0	"Mexikanischer nationaler Fokus"
MEX_force_calles_into_exile:0	"Calles ins Exil zwingen"
MEX_force_calles_into_exile_desc:0	"Calles führt eine Fehde mit dem derzeitigen Präsidenten Lazaro Cardenas und hat eine konservative Basis gegen Cardenas aufgehetzt, indem er Cardenas als Kommunisten darstellte, der eine zweite Sowjetunion schaffen wolle. Die Spannungen sind groß und seine Basis ist gewalttätig geworden. Als die Gewalt zunahm, wurde Calles' ohnehin schon ruinierter Ruf noch weiter geschädigt und er konnte ohne Protest ins Exil gehen."
MEX_oppose_cardenas_liberal_reforms:0	"Gegen die liberalen Reformen von Cardenas"
MEX_oppose_cardenas_liberal_reforms_desc:0	"Cardenas hat die Herrschaft von Calles in den letzten Jahren gestört und es ist inakzeptabel, dass er immer noch seine eigene linksgerichtete Agenda in die Köpfe unseres stolzen Volkes drückt! Wir haben einige der loyalen Caudillos versammelt, die bereit sind, zu handeln, wir brauchen nur den richtigen Zeitpunkt und den richtigen Ort..."
MEX_purge_callistas:0	"Callistas säubern"
MEX_purge_callistas_desc:0	"Auch wenn Calles nach Amerika ins Exil gegangen ist, hat er immer noch Sympathisanten in den obersten Reihen des Militärs, die einen Putsch starten könnten. Um die mexikanische Freiheit zu schützen, müssen wir diese Korruption aus dem Militär entfernen, indem wir diese Offiziere aus ihren Positionen entfernen."
MEX_contain_the_caudillos:0	"Die Caudillos eindämmen"
MEX_contain_the_caudillos_desc:0	"Die Caudillos sind immer noch eine starke Kraft, mit der man rechnen muss. Aber mit der neuen Regierung an der Macht können die Caudillos gespalten und zerstört werden, so dass wir den neuen Kern der Streitkräfte bilden können."
MEX_establish_confederation_of_mexican_workers:0	"Konföderation der mexikanischen Arbeiter gründen"
MEX_establish_confederation_of_mexican_workers_desc:0	"Die Konföderation mexikanischer Arbeiter (CTM) ist der größte Gewerkschaftsverband Mexikos, der in den Jahren nach der Herrschaft von Calles einen entscheidenden Stimmenblock für die PRI bildete."
MEX_fund_national_railway_company:0	"Nationale Eisenbahngesellschaft finanzieren"
MEX_fund_national_railway_company_desc:0	"Unsere Infrastruktur muss dringend modernisiert werden und das derzeitige Eisenbahnnetz ist nicht in der Lage, die ständig wachsende Industrie unseres Landes zu versorgen! Es ist zum Wohle der Allgemeinheit, in den Aufbau einer staatlichen Eisenbahngesellschaft zu investieren."
MEX_enforce_the_land_reforms:0	"Setzen Sie die Landreformen durch"
MEX_enforce_the_land_reforms_desc:0	"Die Regierung hat in den letzten Jahren Landreformen durchgeführt, bei denen insgesamt 45 Millionen Hektar Land umverteilt wurden. 4 Millionen Hektar davon befanden sich im Besitz amerikanischer Agrarunternehmen, die in die rechtmäßigen Hände der mexikanischen Bevölkerung zurückgegeben wurden!"
MEX_cleanse_the_cabinet:0	"Säubern Sie das Kabinett"
MEX_cleanse_the_cabinet_desc:0	"Jetzt, da Calles erledigt ist, können wir die Mitglieder des Kabinetts zum Rücktritt auffordern und neue Kabinettsmitglieder auswählen lassen."
MEX_Selective_Retirement:0	"Selektiver Rücktritt"
MEX_Selective_Retirement_desc:0	"Alternativ können wir auch nur einige Generäle in den Ruhestand versetzen, um einige unserer erfahreneren Männer zu erhalten, aber das würde von paranoiden Caudillos natürlich als Machtübernahme empfunden werden."
MEX_enforce_the_mandatory_retirement:0	"Gesetz zur Zwangsversetzung in den Ruhestand durchsetzen"
MEX_enforce_the_mandatory_retirement_desc:0	"Ironischerweise hat Mexiko viele seiner Generäle und Offiziere gezwungen, sich aus dem aktiven Dienst zurückzuziehen. Dies war ein Versuch, Mexiko zu stabilisieren, indem man die alten Caudillos von der Macht entfernte und gleichzeitig neues Blut in den Club der alten Männer brachte, die sowohl geistig als auch körperlich ihre besten Jahre längst hinter sich hatten. Überraschenderweise wurde dieser Schritt von allen Seiten ohne größere Probleme akzeptiert, sogar von Maximino Avila Camacho."
MEX_secure_the_leftist_support:0	"Sichern Sie sich die Unterstützung der Linken"
MEX_secure_the_leftist_support_desc:0	"Die Kommunisten haben Recht: Um die Probleme Mexikos zu lösen, müssen wir den Kapitalismus aufgeben, der den Mexikanern unter den ausländischen Unternehmen so viel Leid gebracht hat."
MEX_rural_militias_recruitment_draft:0	"Rekrutierungsentwurf der Landmilizen"
MEX_rural_militias_recruitment_draft_desc:0	"Die Agrarunion war eine Idee, die eine Militarisierung der ländlichen Teile Mexikos vorsah und die Eingliederung von registrierten Milizionären in die militärische Reserve, die in Kriegszeiten zum Dienst herangezogen werden sollten. Die mexikanische Regierung schätzte, dass mit dieser Politik etwa 3 Millionen Mexikaner in das Reservesystem aufgenommen werden würden."
MEX_side_with_the_rich:0	"Auf der Seite der Reichen"
MEX_side_with_the_rich_desc:0	"Die Porfiristas haben recht, Mexiko hat sich unter einer Diktatur viel schneller entwickelt und die längste Friedensperiode in unserer Geschichte verursacht. Wir müssen die Wahlen absagen, denn wir wissen, was richtig ist."
MEX_negotiate_with_conservatives:0	"Mit den Konservativen verhandeln"
MEX_negotiate_with_conservatives_desc:0	"Der einzige wirklich richtige Weg, die Probleme Mexikos zu lösen, ist eine wirklich demokratische Abstimmung. Alles andere bedeutet, denselben Fehler zu wiederholen, den Mexiko immer wieder gemacht hat."
MEX_consolidate_the_prm_grip:0	"Den Griff der PRM konsolidieren"
MEX_consolidate_the_prm_grip_desc:0	"Die steigende Popularität der PRM lässt ihr keine andere Wahl, als die Stimme von ganz Mexiko zu werden. Alle vier Flügel der Partei müssen ihre Anstrengungen vereinen, um einen stabilen [ROOT.getAdjective] Staat zu errichten!"
MEX_seize_strategic_businesses:0	"Strategische Unternehmen beschlagnahmen"
MEX_seize_strategic_businesses_desc:0	"Artikel 33 besagt, dass nur mexikanische Staatsbürger Einfluss auf die interne mexikanische Politik nehmen können. Derzeit gibt es viele Personen, die gegen dieses Gesetz verstoßen. Wir sollten es durchsetzen, um unsere politischen Feinde zu beseitigen und unser politisches Monopol zu erhalten."
electric:0	"Comisión Federal de Electricidad"
MEX_oil_the_broken_relationships:0	"Öl - die kaputten Beziehungen"
MEX_oil_the_broken_relationships_desc:0	"Unsere Ölindustrie hat sich auf ausländische Experten verlassen, die nach der Verstaatlichung abgewandert sind und uns mit einer geringeren Ölproduktion zurückgelassen haben. Wir können unser ungenutztes Potenzial an ausländische Mächte weitergeben, die für ihre Kriegsanstrengungen dringend Öl benötigen, und sie davon überzeugen, Experten zu schicken, um unsere Ölfelder zu optimieren und die Gewinne mit geringen Investitionen unsererseits erheblich zu steigern."
MEX_pan_latinism_not_pan_americanism:0	"Pan-Latinismus, nicht Pan-Amerikanismus"
MEX_pan_latinism_not_pan_americanism_desc:0	"Trotz aller Bemühungen der USA, werden sie nicht die dominierende Macht in der Region Lateinamerika sein! Mexiko hatte Pläne für einen neutralen Block lateinamerikanischer Länder, um die einzigartige regionale Identität durchzusetzen und sich dem Imperialismus der Vereinigten Staaten entgegenzustellen."
MEX_ratify_the_pacific_alliance:0	"Ratifizierung der Pazifik-Allianz"
MEX_ratify_the_pacific_alliance_desc:0	"Der mexikanische Geheimdienst wusste, dass sich die Vereinigten Staaten und Japan auf einem Crashkurs in Richtung Krieg befanden, und überlegte, welche Seite er in dieser Realität unterstützen sollte. In Wirklichkeit entschied sich Mexiko gegen Japan und begründete dies mit der mangelnden Fähigkeit der Japaner, die mexikanischen Küsten vor den Bombardements der US-Marine zu schützen."
MEX_distance_from_europe:0	"Entfernung von Europa"
MEX_distance_from_europe_desc:0	"Während des Zweiten Weltkriegs schloss Mexiko einen Verteidigungsvertrag mit den USA unter dem Vorwand, dass die USA Mexiko militärische Ausrüstung leihen würden. Mexiko erhielt nur sehr wenig Unterstützung, und die Vereinbarung wurde nach dem Zweiten Weltkrieg schnell wieder aufgelöst."
MEX_reintroduce_cientificos:0	"Wiedereinführung der Cientificos"
MEX_reintroduce_cientificos_desc:0	"Die Cientificos waren eine Gruppe technokratischer Berater von Porfiro Diaz, die eng mit den reichen Eliten des Landes zusammenarbeiteten und den wachsenden [MEX.getAdjective] Staat sowohl industriell als auch wissenschaftlich unterstützten."
MEX_empower_the_caudillos:0	"Ermächtigung der Caudillos"
MEX_empower_the_caudillos_desc:0	"Caudillos waren die starken Männer Mexikos, Militäroffiziere, die oft auch politische Ämter bekleideten. In einigen Fällen hatte der Caudillo in seinem Heimatstaat mehr Macht als die Bundesregierung. Oft nutzten sie ihre Macht, um ihre persönlichen Ideale zu verfolgen, wie z.B. eine rechte Regierung durch Putsche, oder Wünsche wie höhere Militärausgaben durch Abstimmungen im Kongress, um ihre Macht zu vergrößern."
MEX_strengthen_seccion_primera:0	"Stärkung der Seccion Primera"
MEX_strengthen_seccion_primera_desc:0	"Die DGIPS war die interne Sicherheit Mexikos, ähnlich wie das FBI oder die DEA, bevor sie in D.F.S. umbenannt wurde."
MEX_finish_the_red_transition:0	"Beenden Sie den roten Übergang"
MEX_finish_the_red_transition_desc:0	"Fransisco J. Mugica repräsentiert den linksradikalen Flügel des politischen Regimes von Cardenas. Mit ein paar geeigneten Ersatzleuten kann er der neue Parteivorsitzende werden und es wird egal sein, was die Opposition zu sagen hat!"
MEX_subversive_nationalization:0	"Subversive Verstaatlichung"
MEX_subversive_nationalization_desc:0	"Das Poza Rica Feld in Veracruz ist das produktivste und ergiebigste Ölfeld Mexikos in dieser Ära. Der Besitz dieses Feldes war der Traum vieler mexikanischer Eliten. Das revolutionäre Ideal sah jedoch vor, diese wertvolle Ressource zu vergesellschaften und für den wirtschaftlichen Wohlstand Mexikos zu nutzen."
MEX_subsidize_national_economy:0	"Subventionierung der nationalen Wirtschaft"
MEX_subsidize_national_economy_desc:0	"Ein Teil der Regierungsgelder soll dazu verwendet werden, die industrielle Basis unabhängig von ausländischem Kapital und Einfluss aufzubauen. Zentrale Teile Mexikos sind immer noch schwach industrialisiert und benötigen Unterstützung in diesem Bereich."
MEX_focus_on_civilian_economy:0	"Fokus auf die zivile Wirtschaft"
MEX_focus_on_civilian_economy_desc:0	"Die Weltmächte können sich über die Stücke Land zerfleischen, die niemand braucht. Wir haben unser Land, für das wir arbeiten und an dem wir arbeiten müssen."
MEX_support_militaristic_sentiment:0	"Militaristische Gesinnung unterstützen"
MEX_support_militaristic_sentiment_desc:0	"Unser kostbarer Staat braucht dringend starke Männer und Frauen, die das Land vor fremden Eindringlingen schützen. Die Fabrikschichten müssen ausgeweitet und neue Anlagen errichtet werden, damit wir dem kommenden Sturm standhalten können!"
MEX_enforce_article_27:0	"Artikel 27 durchsetzen"
MEX_enforce_article_27_desc:0	"Artikel 27 ist ein umstrittener Abschnitt der mexikanischen Verfassung, der, wenn er durchgesetzt wird, dem Staat das Eigentum an strategischen Ressourcen überträgt. Diese Klausel der Verfassung war der rechtliche Präzedenzfall für die Gründung von PEMEX."
MEX_socialist_education:0	"Sozialistische Bildung"
MEX_socialist_education_desc:0	"Durch die Einführung von Chancengleichheit für alle sozialen Schichten werden wir in der Lage sein, das Analphabetentum in unserem Land mit großem Tempo zu bekämpfen und endlich eine moderne, fleißige Gesellschaft zu errichten!"
MEX_the_gentleman_agreement:0	"Das Gentlemen-Abkommen"
MEX_the_gentleman_agreement_desc:0	"Es hat sich gezeigt, dass die derzeitige politische Struktur erneut im Chaos versinken wird, wenn wir nicht in der Lage sind, eine Koalitionsregierung zu bilden, die in der Lage ist, vor Ort Kompromisse zu finden. Glücklicherweise haben wir einige Kandidaten, die in der Lage sind, diese Rolle zu übernehmen."
MEX_reassure_investors:0	"Investoren beruhigen"
MEX_reassure_investors_desc:0	"Mexiko verbrachte die nächsten sechs Jahre damit, ausländische Investoren zu beruhigen und Gesetze zum Schutz ausländischer Investitionen zu verabschieden, nachdem das Vertrauen durch die Verstaatlichung von PEMEX verloren gegangen war."
MEX_amend_article_3:0	"Artikel 3 ändern"
MEX_amend_article_3_desc:0	"Artikel 3 enthielt ursprünglich eine Garantie für eine sozialistische Erziehung. Nach 1940 wurde dies gestrichen."
MEX_strengthen_ties_with_industrialists:0	"Stärkung der Beziehungen zu den Industriellen"
MEX_strengthen_ties_with_industrialists_desc:0	"Axel Wenner Gren war ein exzentrischer schwedischer Geschäftsmann, der in den 1930er Jahren als einer der reichsten Männer der Welt galt. Während des Zweiten Weltkriegs versuchte er, den Frieden auszuhandeln, wurde aber von beiden Seiten als Quälgeist betrachtet. Als er versuchte, seinen Einfluss auf Mexiko auszudehnen, verärgerte er die alliierten Mächte und kam unter dem Vorwand von Verhandlungen mit den Nazis auf die schwarze Liste."
MEX_utilize_the_foreign_capital:0	"Nutzen Sie das ausländische Kapital"
MEX_utilize_the_foreign_capital_desc:0	"Die kapitalistische Natur verschiedener rechtsgerichteter Investoren bietet eine perfekte Grundlage für den Aufbau eines gesunden, wirtschaftlich starken Mexikos. Lassen Sie uns ihre Unterstützung so weit wie möglich nutzen und sich später mit den möglichen Konsequenzen befassen."
MEX_export_control_board:0	"Exportkontrollbehörde"
MEX_export_control_board_desc:0	"Axel Wenner Grener hatte die Einrichtung einer Exportkontrollbehörde in Mexiko geplant, die ihn zum Wirtschaftszar Mexikos gemacht hätte. Dies war der Tropfen, der das Fass zum Überlaufen brachte und die Alliierten dazu zwang, ihn auf die schwarze Liste zu setzen."
MEX_assist_the_democratic_cause:0	"Unterstützen Sie die demokratische Sache"
MEX_assist_the_democratic_cause_desc:0	"Der Angriff auf die SS Potrero del Llano und die SS Faja de Oro durch deutsche U-Boote veranlasste Mexiko am 21. Mai 1942, auf der Seite der Alliierten in den Krieg einzutreten."
MEX_sign_the_sinclair_agreements:0	"Unterzeichnung des Sinclair-Abkommens"
MEX_sign_the_sinclair_agreements_desc:0	"Das Sinclair-Abkommen war das erste Abkommen zwischen den Alliierten und Mexiko, das das mexikanische Eigentum an seinem Öl anerkannte. Das Öl sollte an eine zwischengeschaltete Firma namens Sinclair verkauft werden, die es dann für die Kriegsanstrengungen liefern sollte."
MEX_secure_the_coastline:0	"Sicherung der Küstenlinie"
MEX_secure_the_coastline_desc:0	"Die Amerikaner hatten sich bei Mexiko dafür eingesetzt, dass die USA Stützpunkte und Radarstationen in den gefährdeten Gebieten der Westküste errichten durften."
MEX_launch_the_bracero_program:0	"Starten Sie das Bracero-Programm"
MEX_launch_the_bracero_program_desc:0	"Das Bracero-Programm war ein Programm zur Anwerbung mexikanischer Bürger für den Betrieb von Farmen, Fabriken und anderen logistischen Aufgaben zur Unterstützung der Kriegsanstrengungen. Diese Arbeiter sollten für ihren Dienst vertraglich bezahlt werden. Die Bezahlung war jedoch je nach Beruf unregelmäßig, und viele erhielten nicht den vollen Lohn oder überhaupt keinen Lohn. Es wird geschätzt, dass den ehemaligen Braceros noch 500 Millionen Dollar mit Zinsen geschuldet werden."
MEX_international_socialist_union:0	"Internationale Sozialistische Union"
MEX_international_socialist_union_desc:0	"Wir haben unsere Außendiplomatie bisher eingeschränkt, aber wenn unsere Ziele klar definiert sind, ist es vielleicht möglich, dass Länder mit ähnlicher sozialistischer Ausrichtung die gemeinsamen Ziele gemeinsam verfolgen?"
MEX_approach_germany:0	"Annäherung an Deutschland"
MEX_approach_germany_desc:0	"Wir haben viel mit unseren deutschen Freunden gemeinsam, vor allem seit den Zeiten des Ersten Weltkriegs, wo unsere ständige Kommunikation es uns ermöglicht hat, noch engere Beziehungen zu den USA zu knüpfen!"
MEX_solidify_the_davis_deal:0	"Den Davis-Deal festigen"
MEX_solidify_the_davis_deal_desc:0	"Der Davis-Deal war ein Abkommen zwischen Mexiko und den Achsenmächten über den Kauf von Öl von einem amerikanischen Zwischenhändler, der das Öl an Italien verkaufen würde, das es dann an Deutschland liefern würde. Dieses Geschäft machte nur 50% der mexikanischen Gesamtproduktion aus, da Deutschland vertraglich verpflichtet war, Öl von Großbritannien und den Vereinigten Staaten zu kaufen. Als die deutsche Marine versuchte, überschüssiges Öl von Mexiko zu kaufen, wurde sie abgewimmelt. Das Geschäft endete offiziell 1940, als die Royal Navy Italien blockierte."
MEX_joint_mining_expeditions:0	"Gemeinsame Bergbauexpeditionen"
MEX_joint_mining_expeditions_desc:0	"Deutschland bot Bedingungen zur Gründung gemeinsamer deutsch-mexikanischer Bergbauunternehmen an, die den Einfluss der USA im mexikanischen Bergbausektor verdrängen sollten."
MEX_construct_the_salinas_cruz_pipeline:0	"Bau der Salinas Cruz Pipeline"
MEX_construct_the_salinas_cruz_pipeline_desc:0	"Japan hatte den Bau einer Pipeline zwischen der Ostküste und Salinas Cruz über den Isthmus von Tehuantepec in Betracht gezogen. Dieses Megaprojekt wurde jedoch erst zu einem späteren Zeitpunkt in die Tat umgesetzt."
MEX_lay_down_the_cooperative_basis:0	"Legen Sie die kooperative Basis fest"
MEX_lay_down_the_cooperative_basis_desc:0	"Wir werden unsere Märkte für ausländische Investitionen und unsere Politiker für Handelsabkommen öffnen. Nur so können wir die verheerenden Wirtschaftssanktionen der Großmächte verhindern."
MEX_pan_american_highway:0	"Der Panamerikanische Highway"
MEX_pan_american_highway_desc:0	"Ideen für einen Super-Highway quer durch Amerika reichen bis in die späten 1800er Jahre zurück, und zwar in Form einer Eisenbahn, die nie verwirklicht wurde. In den 1920er Jahren wurde die Idee der Superautobahn durch eine Autobahn ersetzt. Am 29. Juli 1937 wurde ein Vertrag unterzeichnet, der den Bau dieser Autobahn vorsah. In den 1950er Jahren war Mexiko das erste lateinamerikanische Land, das den Bau seines Teils der Autobahn abschloss. "
MEX_encourage_foreign_immigration:0	"Förderung der ausländischen Einwanderung"
MEX_encourage_foreign_immigration_desc:0	"Japanische Einwanderer kamen häufig als Arbeitskräfte in den Westen Mexikos und schlossen Freundschaft mit ihren mexikanischen Kollegen. Während des Zweiten Weltkriegs wurden die japanischen Einwanderer gezwungen, in die Städte zu ziehen, damit sie nicht dazu beitragen konnten, einen synarchistischen Aufstand in den ländlichen Teilen des Landes zu organisieren."
MEX_squash_foreign_propaganda:0	"Ausländische Propaganda unterdrücken"
MEX_squash_foreign_propaganda_desc:0	"Ausländische Propaganda ist für Mexiko kein Fremdwort. Das Land war ein Tummelplatz für Propagandanetzwerke aller großen Imperien und Fraktionen der Welt, von den Sowjets über die Deutschen bis hin zu den Europäern. Der eklatanteste Fall war die Franco-Propagandamaschine, die den Auftrag hatte, Dissens in Mexiko zu säen. Fransisco Franco gab jeden Monat viele Tausend Euro für Propagandamaßnahmen aus."
MEX_green_revolution:0	"Die Grüne Revolution"
MEX_green_revolution_desc:0	"Unser Land befindet sich nicht nur politisch, sondern auch wirtschaftlich in einem gewaltigen Umbruch. Die landwirtschaftlichen Betriebe werden massiv ausgebaut, die landwirtschaftlichen Vorräte sind so hoch wie nie zuvor und die gesamte Bevölkerung kommt in den Genuss einer guten Bildung und Gesundheitsversorgung. Eine wahre Grüne Revolution ist auf dem Weg durch Mexiko!"
MEX_finish_the_education_battle:0	"Beenden Sie die Bildungsschlacht"
MEX_finish_the_education_battle_desc:0	"Unsere Alphabetisierungsprogramme waren in den letzten Jahren von großem Erfolg gekrönt! Jetzt ist es an der Zeit, den Kampf zu beenden und das Angebot an Grundschulbildung auf die ländlichen Gebiete unseres Landes auszuweiten!"
MEX_invite_ibec_investors:0	"Laden Sie IBEC-Investoren ein"
MEX_invite_ibec_investors_desc:0	"Das IBEC wurde nach 1945 von Nelson Rockefeller aus Bosheit gegenüber Präsident Harry S. Truman gegründet. Nelson wollte den Lateinamerikanern und insbesondere Truman beweisen, wie man Lateinamerika industrialisieren kann."
MEX_forge_the_pact_of_honor:0	"Den Pakt der Ehre schmieden"
MEX_forge_the_pact_of_honor_desc:0	"Maximino Avila Camacho schuf den so genannten Ehrenpakt, eine Art Schattenregierung, die sich aus Personen und Organisationen zusammensetzte, die er unterwanderte oder überzeugte, sich seiner Sache anzuschließen. Diese Menschen befanden sich oft in einer schlechten Lage und Maximino bot ihnen einen Ausweg, wie zum Beispiel Unternehmen, die durch die Verstaatlichung von PEMEX geschädigt wurden, oder Calles-Unterstützer, die unter dem Zusammenbruch seiner Macht litten."
MEX_subvert_the_political_unions:0	"Unterwanderung der politischen Gewerkschaften"
MEX_subvert_the_political_unions_desc:0	"Maximino war ein Experte im Unterwandern von Gewerkschaften. In Puebla zerschlug und reformierte er die Gewerkschaften in etwas politisch Nützliches, um sich den Anschein zu geben, ein Mann des Volkes zu sein."
MEX_fill_the_loyal_cabinet:0	"Füllen Sie das loyale Kabinett"
MEX_fill_the_loyal_cabinet_desc:0	"So wie Maximino seinen Ehrenpakt hat, hatte Aleman seine eigene Organisation, die von Historikern als Camarilla bezeichnet wird. Historisch gesehen ist Camarilla ein Begriff, der im Zusammenhang mit der spanischen Krone die Männer hinter dem König beschreibt."
MEX_introduce_political_inquisition:0	"Politische Inquisition einführen"
MEX_introduce_political_inquisition_desc:0	"So wie Miguel Aleman dafür bekannt war, dass er dem Tod verdächtig zugeneigt war, so war er auch dafür verantwortlich, seine Feinde mit völlig legalen Mitteln zu vernichten, indem er beispielsweise staatliche Ermittler als Inquisitoren einsetzte."
MEX_a_union_of_unions:0	"Eine Union der Gewerkschaften"
MEX_a_union_of_unions_desc:0	"Mexikos Form des Kommunismus war immer etwas Besonderes. Im Gegensatz zum sowjetischen Kommunismus war der mexikanische Volkskommunismus eine Variante des Syndikalismus. Den Gewerkschaften wurde große Bedeutung und ein wichtiger Platz in der Regierung eingeräumt. Sie sollten den Willen des Volkes widerspiegeln, wobei die Idee, die Minen von den Ausländern zurückzuerobern, um sie den Mexikanern zurückzugeben, ein Wunschdenken war."
MEX_establish_union_regional_offices:0	"Regionale Gewerkschaftsbüros einrichten"
MEX_establish_union_regional_offices_desc:0	"Die syndikalistische Revolution soll dem einfachen Volk in den tiefsten und abgelegensten Teilen unseres Landes nahe gebracht werden! Die Schaffung neuer Arbeitsräume soll genügend Platz für alle bieten, um das neue Schicksal Mexikos anzunehmen!"
MEX_intervene_in_the_us:0	"Intervenieren Sie in den Vereinigten Staaten"
MEX_intervene_in_the_us_desc:0	"Nach den Zoot-Suit-Unruhen und dem Angriff auf Mexikaner durch US-Bürger und Angehörige der Streitkräfte gab es einen breiten Aufschrei der extremen Linken und der extremen Rechten, um zu intervenieren."
mexico_calles.1.t:0	"Rebellen greifen einen zivilen Zug an!"
mexico_calles.1.d:0	"Ein Zug von Mexiko-Stadt nach Veracruz wurde gestern von Dissidenten überfallen, wobei mehrere mexikanische Politiker der Partei PRM getötet wurden. \n\n Der Zug wurde an einer Brücke überfallen, die mit Sprengstoff präpariert war, was einen Raubüberfall durch Banditen als Motiv für den Angriff ausschließt. Das Wrack, das die Beamten entdeckten, wurde durch ein Feuer vollständig zerstört, so dass den Ermittlern nur wenig übrig blieb. [ROOT.getNameDefCap] war in den letzten Jahren mit einer zunehmenden politischen Polarisierung konfrontiert, und nun scheinen politische Extremisten zu Gewalt zu greifen."
mexico_calles.1.a:0	"Tragisch, aber wer könnte dahinter stecken?"
mexico_calles.2.t:0	"Calles gefangen genommen und ins Exil geschickt!"
mexico_calles.2.d:0	"Der ehemalige Präsident Plutarco Elias Calles und 3 seiner rechten Hand wurden auf Befehl von Präsident [MEX.GetLeader] verhaftet. \n\nMexikos Linke haben Calles beschuldigt, zu versuchen, den rechten Flügel gegen Präsident Cardenas, den er als Kommunisten bezeichnet, aufzuwiegeln und das Land möglicherweise in einen Bürgerkrieg zu treiben. \n\nAls die mexikanischen Behörden die Ranch stürmten, nahmen sie Calles fest, als er in seinem Bett lag und eine spanische Übersetzung von Hitlers Buch Mein Kampf las. Calles wurde dann mitten in der Nacht in ein Flugzeug gezwungen, das ihn nach Houston, Texas, bringen sollte, wo er am Morgen ankommen sollte, um nach San Diego zu gehen, wo er mit seiner Schwester leben wird.\n\nEin Waffenlager, vermutlich zur Versorgung von Rebellen, wurde ebenfalls sichergestellt."
mexico_calles.2.a:0	"Calles erhielt die gleiche Behandlung, die er so vielen anderen zuteil werden ließ."
mexico_calles.3.t:0	"Calles Rebellion!"
mexico_calles.3.d:0	"Callista-Anhänger haben in Mexiko eine Revolte gegen die Sowjetisierung Mexikos begonnen, wie sie es nennen. \n\nDurch Plutarcos Rhetorik in einen Rausch versetzt, haben seine Anhänger Mexiko in einen weiteren Bürgerkrieg gestürzt. \n\nEs bleibt abzuwarten, ob diese Rebellion die Brutalität der mexikanischen Revolution erreicht, die Mexiko 10 Jahre lang zerrissen hat."
mexico_calles.3.a:0	"Es ist Zeit, diese Farce zu beenden!"
mexico_pemex.1.t:0	"Ölarbeiterstreiks"
mexico_pemex.1.d:0	"Präsident [Root.GetLeader], die Arbeiter streiken gegen die ungerechte Behandlung durch die ausländischen Unternehmen, die die Ölgesellschaft Aguila aufgekauft haben. Sie haben schon früher eklatant gegen viele unserer Gesetze verstoßen, und der Umgang mit ihnen wird bei den Mexikanern wenig bis gar keine Gegenreaktion hervorrufen. Am besten wäre es, die Ölgesellschaft auf der Grundlage des Verfassungsgesetzes zu verstaatlichen, das uns das Eigentum an allen natürlichen Ressourcen zusichert. Die Verstaatlichung des Öls würde dazu beitragen, die Industrialisierung unseres Landes zu finanzieren, und im Falle eines Krieges würden wir einen erheblichen Gewinn erzielen."
mexico_pemex.1.a:0	"Lassen Sie uns ein Machtspielchen wagen."
mexico_pemex.2.t:0	"Mexiko verstaatlicht die Ölgesellschaften!"
mexico_pemex.2.d:0	"[MEX.GetLeader] hat die Verstaatlichung der Ölgesellschaften in Mexiko angekündigt. Die bisher ausländischen Unternehmen sollen beschlagnahmt und unter die Kontrolle von PEMEX, der staatlichen Ölgesellschaft, gestellt werden. Dies betrifft vor allem britische und niederländische Unternehmen, die von ihren Regierungen verlangen, in den Krieg zu ziehen. Amerika ist sich weitgehend unsicher, ob es die Verstaatlichung gutheißen oder verurteilen soll, denn die Präsenz auf dem mexikanischen Ölmarkt war nicht nur vernachlässigbar, sondern die Verstaatlichung hilft ihrem Geschäft durch die Ausschaltung der ausländischen Konkurrenz."
mexico_pemex.2.a:0	"Das ist Wahnsinn, Mexiko wird einen Krieg beginnen!"
mexico_pemex.2.b:0	"Ungeheuerlich! Sie wagen es, unser Eigentum zu stehlen?!"
mexico_pemex.2.c:0	"Jetzt warten wir ab, wie sie reagieren."
mexico_pemex.3.t:0	"Mexiko verstaatlicht Öl!"
mexico_pemex.3.d:0	"Mexiko hat die Verstaatlichung aller natürlichen Ressourcen des Landes angekündigt. Die Lobbyisten fordern einen Krieg, aber das wird politisch chaotisch, gerade wenn die aufstrebende Macht Deutschlands eine viel deutlichere Bedrohung darstellt. Wenn wir einen Krieg führen, werden wir weniger Arbeitskräfte und Ressourcen haben, um mit Deutschland fertig zu werden. Das Terrain ist unwegsam, und es wird wahrscheinlich ein langwieriger Krieg werden. Unsere andere Option ist ein Embargo und die Rückgabe unserer Beteiligungen, wenn Mexiko merkt, dass es nicht über das Know-how verfügt, um eine Ölgesellschaft zu führen."
mexico_pemex.3.a:0	"Erklären Sie den Krieg"
mexico_pemex.3.b:0	"Hungern Sie sie aus."
mexico_pemex.4.t:0	"Mexiko verstaatlicht das Öl!"
mexico_pemex.4.d:0	"Mexiko hat die Verstaatlichung aller natürlichen Ressourcen des Landes angekündigt. Die Lobbyisten fordern einen Krieg, aber das wird politisch chaotisch, gerade wenn die aufsteigende Macht Deutschlands eine viel deutlichere Bedrohung darstellt. Wenn wir einen Krieg führen, werden wir weniger Arbeitskräfte und Ressourcen haben, um mit Deutschland fertig zu werden. Das Terrain ist unwegsam, und es wird wahrscheinlich ein langwieriger Krieg werden. Unsere andere Option ist ein Embargo und die Rückgabe unserer Beteiligungen, wenn Mexiko merkt, dass es nicht über das Know-how verfügt, um eine Ölgesellschaft zu führen."
mexico_pemex.4.c:0	"Erklären Sie den Krieg"
mexico_pemex.4.e:0	"Hungern Sie sie aus."
mexico_pemex.5.t:0	"Die Vereinigten Staaten verhängen ein Embargo gegen Mexiko!"
mexico_pemex.5.d:0	"Präsident [USA.GetLeader] hat als Reaktion auf die Verstaatlichung der amerikanischen Ölgesellschaften in Mexiko ein Embargo gegen Mexiko angekündigt. Politische Analysten bezeichnen dies als einen Versuch, die staatliche mexikanische Ölgesellschaft PEMEX auszuhungern und Mexiko zu zwingen, die verstaatlichten Vermögenswerte zurückzugeben."
mexico_pemex.5.a:0	"Mal sehen, ob PEMEX das überlebt."
mexico_pemex.5.b:0	"Sie versuchen, uns auszuhungern."
mexico_pemex.6.t:0	"Das Vereinigte Königreich verhängt ein Embargo gegen Mexiko!"
mexico_pemex.6.d:0	"[ENG.GetLeader] hat als Reaktion auf die Verstaatlichung der englischen und niederländischen Ölgesellschaften in Mexiko ein Embargo gegen Mexiko angekündigt. Politische Analysten bezeichnen dies als einen Versuch, die staatliche mexikanische Ölgesellschaft PEMEX auszuhungern und Mexiko zu zwingen, die verstaatlichten Vermögenswerte zurückzugeben."
mexico_pemex.6.a:0	"Mal sehen, ob PEMEX das überlebt."
mexico_pemex.6.b:0	"Sie versuchen, uns auszuhungern."
mexico_pemex.7.t:0	"Die USA erklären Mexiko den Krieg!"
mexico_pemex.7.d:0	"Präsident [USA.GetLeader] hat aus Empörung über die Beschlagnahmung von Ölvermögen amerikanischer Unternehmen eine Kriegserklärung an Mexiko angekündigt. [USA.GetLeader] hat erklärt, dass er die amerikanischen Interessen verteidigen muss und die mexikanische Haltung gegenüber amerikanischen Unternehmen nicht hinnehmen wird. [MEX.GetLeader] hat geantwortet, dass der ausländische Besitz des Öls nach mexikanischem Recht von vornherein nicht legal war und dass jeder zukünftige Präsident das Recht habe, das Gesetz durchzusetzen. [MEX.GetLeader] hat auch erklärt, dass sie dafür kämpfen werden, ihre Verfassung vor ausländischen Interessen zu schützen."
mexico_pemex.7.a:0	"Mein Gott."
mexico_pemex.7.b:0	"Dios Mio."
mexico_pemex.8.t:0	"Großbritannien erklärt Mexiko den Krieg!"
mexico_pemex.8.d:0	"Das Vereinigte Königreich hat Mexiko wegen der Verstaatlichung von über 130 Millionen Dollar an Vermögenswerten den Kriegszustand erklärt. [ENG.GetLeader] hat erklärt, dass es keine Rolle spielt, ob Amerika für oder gegen uns ist, das Vereinigte Königreich wird sich nicht herumschubsen lassen! Es erübrigt sich zu sagen, dass Mexiko in einer sehr schwierigen Lage zu sein scheint."
mexico_pemex.8.a:0	"Mein Gott."
mexico_pemex.8.b:0	"Dios Mio."
mexico_pemex.9.t:0	"Entschädigung"
mexico_pemex.9.d:0	"Jetzt, da wir unter einem Embargo stehen und der Krieg vorübergehend abgewendet wurde, könnte es an der Zeit sein, den Amerikanern, die eine Entschädigung für die betroffenen Unternehmen gefordert haben, eine Entschädigung in Höhe von 29 Millionen Dollar anzubieten. Damit wird der Krieg mit den Vereinigten Staaten vollständig vermieden und das Embargo aufgehoben, aber unser Haushalt wird vorübergehend belastet. Die Ausweitung unserer möglichen Märkte würde diese Strafe jedoch aufwiegen."
mexico_pemex.9.a:0	"Sie wollen eine Entschädigung? Ich würde es gerne sehen, wenn sie es versuchen."
mexico_pemex.9.b:0	"Zahlen Sie ihnen eine Entschädigung und beenden Sie das Ganze."
mexico_minor.2.t:0	"Escobar kehrt nach Mexiko zurück!"
mexico_minor.2.d:0	"José Gonzalo Escobar, der Anführer der gescheiterten Escobar-Rebellion, ist aus seinem Exil zurückgekehrt und kehrt in sein Heimatland Mexiko zurück. \n\n In seiner Rede heute Morgen erklärte er, dass er seinem Land in der Zeit der Not beistehen wolle. Escobar war der Anführer eines gescheiterten Putsches während Mexikos Maximato, wo er zunächst in den Bodenkämpfen erfolgreich war und von Mexikos Luftwaffe vernichtend geschlagen wurde."
mexico_minor.2.a:0	"Es lebe Mexiko!"
mexico_minor.2.b:0	"Wer? Was?"
mexico_minor.4.t:0	"Mexiko empfängt spanische Intellektuelle"
mexico_minor.4.d:0	"[Root.GetLeader] hat angekündigt, dass er die Intellektuellen, die vor dem spanischen Bürgerkrieg fliehen, im mexikanischen Universitätssystem willkommen heißt. Ein neuer Campus mit dem Namen Das Haus Spaniens wird den Intellektuellen die Möglichkeit geben, ihre Arbeit fortzusetzen. Der Campus wurde von einer Koalition aus Banken, Bundesämtern und Sonderinteressen finanziert."
mexico_minor.4.b:0	"Wahrlich ein humanitärer Akt."
mexico_minor.4.a:0	"Bauen Sie es, und sie werden kommen."
mexico_minor.5.t:0	"Caudillo-Zuschüsse"
mexico_minor.5.d:0	"Die Caudillos bitten um Forschungszuschüsse für die Modernisierung unserer Streitkräfte. Welche Zuschüsse sollten wir finanzieren?"
mexico_minor.5.a:0	"Zuschüsse für Infanterieausrüstung"
mexico_minor.5.b:0	"Zuschüsse für die Luftfahrt"
mexico_minor.5.c:0	"Panzer-Zuschüsse"
mexico_article_30.2.t:0	"Englische Diplomaten fordern Jenkins' Verhaftung"
mexico_article_30.2.d:0	"Englische Diplomaten sind empört und fordern, dass wir William Jenkins wegen Verstoßes gegen Artikel 30 der Verfassung verhaften. Sie werfen ihm vor, sich in die mexikanische Politik einzumischen, indem er sein Medienmonopol nutzt, um die Mexikaner gegen das Vereinigte Königreich aufzubringen. Unseren Quellen zufolge weigert sich Jenkins jedoch lediglich, die meisten antideutschen Filme in Mexiko zu veröffentlichen, wobei die jüngsten Ereignisse diesen klugen Schritt unterstützen. Der letzte Film, der veröffentlicht wurde, war The Lion has Wings, ein Film über den RAF-Überfall auf den Nord-Ostsee-Kanal, der einen solchen Zorn hervorrief, dass mexikanische Kinos gezwungen waren, den Film zu entfernen. William Jenkins hat, soweit wir wissen, nichts ausdrücklich falsch gemacht, wenn pro-britische Filme beim mexikanischen Publikum unbeliebt sind. Diese Situation könnte auch dazu genutzt werden, mehr als nur Jenkins oder die Engländer auszuweisen. Wir hätten einen Vorwand, alle Gesetzesbrecher in der Nation auszuweisen, um das Gesicht zu wahren, da wir keiner Partei die Schuld zuschieben würden. Was sollten wir tun?"
mexico_article_30.2.a:0	"William Jenkins ausweisen"
mexico_article_30.2.b:0	"Die Engländer ausweisen"
mexico_article_30.2.c:0	"Alle Gesetzesbrecher ausweisen"
mexico_article_30.3.t:0	"Geheimdienstbericht: William Jenkins "
mexico_article_30.3.d:0	"Britische Diplomaten sind empört und fordern uns auf, William Jenkins wegen Verstoßes gegen Artikel 30 der Verfassung zu verhaften! Sie beschuldigen ihn, sich in die mexikanische Politik einzumischen, indem er sein Medienmonopol nutzt, um die Mexikaner gegen [ENG.getNameDef] aufzubringen. \n\nDer jüngste Bericht der DFS besagt jedoch, dass Jenkins mit Maximino Camacho verbunden ist und dieser Jenkins politisch schützt, um ihm im Gegenzug Geschäftsmöglichkeiten zu bieten. Maximino ist ein bekannter Sympathisant der Achsenmächte und soll ein Foto von Mussolini über seinem Bett in seiner Villa in Pueblo hängen haben. Es ist offensichtlich, dass Maximino seinen Einfluss auf Jenkins nutzt, um zu verhindern, dass nicht-faschistischer Einfluss in Mexiko Fuß fasst. \n\n Pro-UK-Filme sind jedoch beim mexikanischen Publikum äußerst unbeliebt und haben mexikanische Kinos dazu veranlasst, sie in einigen Fällen nicht mehr zu zeigen. Die Entscheidung, pro-britische Filme zuzulassen, würde zwar [ENG.getNameDef] gefallen, aber nicht dem mexikanischen Kinopublikum. \n\nDiese Situation könnte auch genutzt werden, um mehr als nur Jenkins oder die [ENG.getAdjective] auszuweisen. Wir hätten einen Vorwand, alle Gesetzesbrecher des Landes auszuweisen, um das Gesicht zu wahren, da wir keiner Partei die Schuld geben würden. Was sollten wir tun?"
mexico_article_30.3.a:0	"William Jenkins ausweisen"
mexico_article_30.3.b:0	"Die [ENG.getAdjective] ausweisen"
mexico_article_30.3.c:0	"Alle Gesetzesbrecher ausweisen"
mexico_zoot_suit.1.t:0	"Lagunen-Auslöser"
mexico_zoot_suit.1.d:0	"Wie sehen Sie das?"
mexico_zoot_suit.1.a:0	"AKTIVIEREN"
mexico_zoot_suit.2.t:0	"MORDE IN DER SCHLAFENDEN LAGUNE"
mexico_zoot_suit.2.d:0	"In der Sleepy Lagoon, einem beliebten Treffpunkt für mexikanische Teenager, denen der Zutritt zu öffentlichen Schwimmbädern oft verwehrt wird, wurde die Leiche des mexikanischen Staatsbürgers und US-Soldaten José Díaz gefunden. Díaz wurde bewusstlos und betrunken aufgefunden und erlitt ein Trauma durch stumpfe Gewalt. Díaz starb später im Los Angeles General Hospital an seinen Verletzungen. Die Polizei fahndete in der Stadt nach den Tätern und verhaftete den Anführer der 1th Street Gang, Hank Leyvas, seine Freundin Dora Barrios und 1 weiteren mexikanischen Amerikaner unter den 600 mexikanischen Amerikanern, die vom LAPD festgenommen wurden. Hank streitet jede Verbindung zu dem Mord ab. Die Spannungen zwischen den Angelenos und den Pachucos, auch bekannt als Zoot-Suiters, sind in Los Angeles sehr groß und es scheint, als ob die Spannungen in nächster Zeit nicht abgebaut werden können."
mexico_zoot_suit.2.a:0	"Eine widerwärtige Tat."
mexico_zoot_suit.3.t:0	"PROZESS GEGEN SLEEPY LAGOON"
mexico_zoot_suit.3.d:0	"Der Prozess um den Mord in Sleepy Lagoon hat heute begonnen. Hank und 2 andere plädieren auf nicht schuldig. Hank plädierte darauf, dass er und seine Freundin in der Nacht in Sleepy Lagoon von einer Gruppe von Männern angegriffen wurden. Hank nahm an, dass es sich um einen Bandenüberfall handelte und rief seine Bande nach Sleepy Lagoon, um die Räuber zu finden. Sie fanden eine Party in der Nähe des Überfalls und nahmen an, dass es sich um eine rivalisierende Bande handelte, und konfrontierten die Partygäste. Es kam zu einer Schlägerei zwischen der Bande und den Partygästen, die etwa 10 Minuten dauerte. Am Morgen wurde die Leiche von Diaz gefunden. Im Bericht des Gerichtsmediziners heißt es, dass die Verletzungen von Diaz mit denen eines Autounfalls übereinstimmen. Die Staatsanwaltschaft hat E. Duran Ayres, den Chef des Büros für Auslandsbeziehungen des Sheriffs von Los Angeles, vorgeladen, um zu erklären, dass die Mexikaner insgesamt blutrünstig sind und einen von ihren aztekischen Vorfahren überlieferten biologischen Drang zum Töten haben."
mexico_zoot_suit.3.a:0	"Das wird nicht gut ausgehen."
mexico_zoot_suit.4.t:0	"HANK VERURTEILT"
mexico_zoot_suit.4.d:0	"Der Fall Sleepy Lagoon ist abgeschlossen, da Hank und 16 andere wegen Mordes verurteilt worden sind. Die Männer der Bande werden ins Gefängnis von San Quentin geschickt, während ihre Freundinnen unter dem Verdacht der Beihilfe in die berüchtigte Ventura School for Girls, eine Erziehungsanstalt für straffällige und sexuell promiskuitive Mädchen, eingewiesen werden sollen. Ventura genießt einen äußerst schlechten Ruf, und die dort verurteilten Frauen unternehmen oft Selbstmordversuche, bevor sie dorthin verlegt werden. Es wird berichtet, dass ein Mädchen versucht hat, Sicherheitsnadeln zu schlucken, um ihrer Strafe zu entgehen."
mexico_zoot_suit.4.a:0	"Vielleicht werden die Spannungen jetzt nachlassen."
mexico_zoot_suit.5.t:0	"ZOOT-SUIT-UNRUHEN"
mexico_zoot_suit.5.d:0	"Die rassistischen Spannungen sind in Los Angeles explodiert, als eine Auseinandersetzung zwischen einer Gruppe von Pachucos und US-Soldaten in einen Aufstand der Ethnien ausartete. Tausende von US-Soldaten verlassen in Scharen ihre Stützpunkte, um an den Unruhen teilzunehmen. Einige Soldaten haben ihren Posten sogar in Los Vegas verlassen, um in Los Angeles zu randalieren. Soldaten wurden dabei beobachtet, wie sie Bars, Theater und Cafés stürmten und mexikanische Jugendliche, darunter auch Kinder, herauszerrten, um sie nackt auszuziehen und zu verprügeln, während ihre Kleidung verbrannt wurde. Ein kleinerer Mob hat sich auf das schwarze Viertel Watts gestürzt, aber es gibt keine Informationen über das Ausmaß des Schadens, der dort angerichtet wurde. Die LAPD hat sich geweigert, gegen die Unruhen vorzugehen mit der Begründung: Nun, wir haben die öffentliche Meinung vertreten. Viele von uns haben im Ersten Weltkrieg gekämpft, und wir werden uns nicht an Kindern vergreifen, die im Dienst sind. "
mexico_zoot_suit.5.a:0	"Schrecklich."
mexico_zoot_suit.6.t:0	"MEXIKO EMPÖRT"
mexico_zoot_suit.6.d:0	"Mexiko ist empört über den Umgang mit den Zoot-Suit-Unruhen. Nationalisten bezeichnen die Angriffe auf mexikanische Bürger durch die Streitkräfte der Vereinigten Staaten als Kriegshandlung. Die Nationalisten fordern ihre Regierung auf, einzuschreiten und den Krieg zu erklären, um diesen dreisten Akt der Aggression zu beenden. Die kommunistischen und linken Nationalisten unterstützen diese Haltung ebenfalls und sagen, dass das, was getan wurde, nicht verziehen werden kann. Die Situation ist außer Kontrolle geraten, und es ist nicht abzusehen, ob sich die mexikanisch-amerikanische Diplomatie jemals wieder erholen wird."
mexico_zoot_suit.6.a:0	"Die Dinge geraten außer Kontrolle."
mexico_zoot_suit.7.t:0	"Informationen: Los Angeles, Kalifornien"
mexico_zoot_suit.7.d:0	"Wir haben einen Plan ausgearbeitet, um die mexikanischen Einwanderer, die in die Vereinigten Staaten einwandern, als Informanten für unsere Geheimdienste zu nutzen. Viele von ihnen sind vor der Revolution geflohen, und einige sind sogar beim Militär! Es ist möglich, dass wir einige mexikanische Patrioten finden, die wichtige Informationen weitergeben können."
mexico_zoot_suit.7.a:	"Sehen Sie, was Sie tun können."
mexico_communist.1.t:0	"Geheimdienstbericht über Dioniso Encinia"
mexico_communist.1.d:0	"Die PCM wurde von Sowjetrussland gegründet und stark finanziert. Ihr Anführer, Dioniso Encinia, ist eine bekannte sowjetische Marionette und seine Anwesenheit spaltet wie nie zuvor. In den 20er Jahren zersplitterte die PCM in viele gegensätzliche kommunistische Parteien, was ausschließlich auf Dionisos Unsicherheit zurückzuführen war, da er Mitglieder, die seinen Sitz als Führer bedrohen könnten, beseitigte. Nach dem gescheiterten, von den Sowjets unterstützten Putsch von 1929 wurde die PCM schließlich von Cales und seinen Loyalisten verboten. \n\nAngesichts der Tatsache, dass ihr derzeitiger Führer so stark von der sowjetischen Führung und dem Rat seiner weitaus fähigeren Frau abhängt, wäre ein von der PCM geführtes Mexiko nichts anderes als ein buchstäblicher Marionettenstaat der UdSSR in Mittelamerika, während es intern aufgrund der geringen Unterstützung äußerst unpopulär wäre. \n\nDa man sich für die linke Politik entschieden hat, ist die kommunistische Machtübernahme die Realität der nahen Zukunft, aber wir haben immer noch ein Mitspracherecht, wer sie anführen wird. Der Attentatsversuch..."
mexico_communist.1.a:0	"...gelingt es, Dioniso zu töten"
mexico_communist.1.b:0	"...ist ein weniger schöner Traum von machthungrigen Bürokraten!"
mexico_1940.1.t:0	"PRI-Kandidat"
mexico_1940.1.d:0	"Die Wahl rückt näher und wir müssen einen Kandidaten aufstellen, der für die PRI gegen den rechten Flügel antritt. Derzeit gibt es zwei mögliche Kandidaten. Fransisco Mugica ist ein Linker, der eher den sozialistischen Idealen zugeneigt ist. Die Wahl von Mugica wäre ein Risiko, wenn die Popularität für sozialistische Ideale gering ist. Manuel Ávila Camacho ist die eher zentristische Wahl und wird vom rechten Flügel eher akzeptiert. Die Wahl von Camacho würde jedoch jede Hoffnung auf die Verabschiedung von Reformen des linken Flügels zunichte machen."
mexico_1940.1.a:0	"Wählen Sie Fransisco Mugica für die Präsidentschaftskandidatur. (Kommunistische Wahl)"
mexico_1940.1.b:0	"Wählen Sie Manuel Ávila Camacho für das Amt des Präsidenten. (Neutrale Wahl)"
mexico_1940.2.t:0	"Kandidat des rechten Flügels"
mexico_1940.2.d:0	"Der rechte Flügel befindet sich derzeit in einem Bürgerkrieg zwischen Juan Andreu Almazán und Joaquin Amaro darüber, wer der Präsidentschaftskandidat sein soll. Almazán ist eher als bekannter Geschäftsmann denn als Militär bekannt und wird hauptsächlich von wohlhabenden Mexikanern unterstützt. Seine Unterstützung unter den armen Arbeitern ist jedoch miserabel, da man der Meinung ist, dass er ihnen nichts zu bieten hat. Almazáns Außenpolitik ist merklich pro-amerikanisch und entfremdet die Durchschnittsmexikaner noch mehr. Amaro hingegen ist eine berühmte Persönlichkeit des Militärs und wird von den Nationalisten respektiert. Trotzdem wird Almazán als die unvermeidliche Wahl für die Kandidatur des rechten Flügels angesehen und Amaros Kandidatur verliert durch eine Reihe hochkarätiger Abgänge schnell an Unterstützung für Almazáns Kampagne. Es ist klar, dass Amaro unweigerlich verlieren wird, da Juan von US-Interessen unterstützt wird und die Menschen einen Kandidaten wählen, den die USA zu stürzen versuchen würden, ist eine törichte Angelegenheit. Allerdings gibt es in der faschistischen Kabale der mexikanischen Politik Leute, die dafür sorgen wollen, dass Almazán den Wahltag nicht erlebt. Maximino Ávila Camacho, der Bruder von Manuel Ávila Camacho, hat einen Plan ausgearbeitet, um Juan Almazán in Puebla zu ermorden, indem er ein Zugunglück inszeniert."
mexico_1940.2.a:0	"Juan Almazán kandidiert als Präsident. (Demokratische Wahl)"
mexico_1940.2.b:0	"Juan Almazán stirbt, Amaro kandidiert für das Präsidentenamt. (Faschistische Wahl)"
mexico_1940.3.t:0	"MEXIKANISCHER PRÄSIDENTSCHAFTSKANDIDAT GETÖTET!"
mexico_1940.3.d:0	"Juan Almazán, der Spitzenkandidat der Rechten für die Präsidentschaftskandidatur, ist bei einer Zugentgleisung in Puebla ums Leben gekommen und hat alle Insassen getötet. Almazán, eine umstrittene Figur, ist kein Unbekannter, wenn es um Attentate geht, und während des Präsidentschaftswahlkampfs wurden bereits mehrere Anschläge auf ihn verübt. Seine Anhänger haben die PRI selbst beschuldigt, die Entgleisung inszeniert zu haben. Zuvor wurde Almazán von Attentätern angegriffen, die Sarapes trugen, in denen Maschinengewehre versteckt waren, während er sich im Haus von Fransisco Barbosa aufhielt. Seine Kampagne behauptet, dass er von einer Armee von 100 Attentätern angegriffen wurde und dass er daran gehindert werden musste, nach draußen zu rennen, um sie zu bekämpfen. Der ehemalige General Alfredo Serratos erklärte jedoch in einem Interview, dass es nur 5 Attentäter waren."
mexico_1940.3.a:0	"Schrecklich."
mexico_1940.4.t:0	"Mexikanische Wahl"
mexico_1940.4.d:0	"Die Wahl ist da, und die Wahl wird gewonnen von..."
mexico_1940.4.a:0	"Fransisco Mugica (Kommunistische Wahl)"
mexico_1940.4.b:0	"Manuel Ávila Camacho (Neutrale Wahl)"
mexico_1940.4.c:0	"Juan Almazán (Demokratische Wahl)"
mexico_1940.4.e:0	"Joaquin Amaro (Faschistische Wahl)"
MEX_PEMEX_Situation:0	"Das PEMEX-Embargo"
MEX_PEMEX_Situation_desc:0	"Mexiko hat die Folgen des PEMEX-Embargos nicht einfach hingenommen. Mexiko hatte Gegenmaßnahmen ergriffen, um das neu verstaatlichte Öl zu nutzen und seine junge Ölindustrie zu unterstützen."
MEX_Stove:0	"Das Herdgesetz"
MEX_Stove_desc:0	"In einer wohl umweltfreundlichen Haltung förderte Mexiko den Ersatz von Holzöfen durch Öfen, die auf Erdölderivaten wie Kerosin basierten. Dies verlangsamte die Abholzung der Wälder in Mexiko und verschaffte der mexikanischen Ölindustrie einen heimischen Markt."
MEX_Charity:0	"Nationalistische Schenkungen"
MEX_Charity_desc:0	"Als Mexiko die Verstaatlichung von PEMEX verkündete, spendeten einfache Mexikaner alles, was sie hatten, um die mit der Verstaatlichung verbundenen Kosten zu decken. Eine besondere Geschichte handelt davon, dass die Mexikaner einen riesigen Haufen von Gegenständen spendeten, wobei reiche Frauen wertvollen Schmuck einwarfen und Rancheros ihr wertvolles Vieh brachten, um es der Republik zu spenden."
MEX_Camargo:0	"Erschließung des Bauxitvorkommens Camargo"
MEX_Camargo_desc:0	"Die Camargo-Lagerstätte wurde in einem USGS-Bericht aus dem Jahr 1957 erwähnt. Darin heißt es, dass die Lagerstätte seit den 1930er Jahren bekannt war, aber erst später ausgebeutet wurde."
MEX_DGIPS:0	"D.G.I.P.S Operationen"
MEX_DGIPS_desc:0	"Für die einen ist die DGIPS lediglich eine Friedenstruppe, die die mexikanische Politik vor unsichtbaren Bedrohungen schützt, für die anderen ist die DGIPS eine von den Amerikanern ausgebildete Mörderbande, die eine politische Agenda verfolgt. Wie bei allen Dingen, liegt die Wahrheit irgendwo dazwischen."
MEX_arrest_hilde_kruger:0	"Verhaftung von Hilde Krüger"
MEX_arrest_hilde_kruger_desc:0	"Hilde Krüger war ein deutsches Starlet, das sowohl in Amerika als auch in Mexiko arbeitete. Sie war mit den amerikanischen und mexikanischen Eliten und insbesondere mit Präsident Avila Camacho liiert. Als sich der Krieg hinzog, wurde sie eine deutsche Spionin."
MEX_utilize_spy_cells_in_the_usa:0	"Nutzung von Spionagezellen in den Vereinigten Staaten"
MEX_meddling_in_foreign_affairs:0	"Einmischung in auswärtige Angelegenheiten"
MEX_andres_figeroa:0	"Andres Figeroa"
MEX_juan_andreu_almazan:0	"Juan Andreu Almazán"
MEX_maximino_avila_camacho:0	"Maximino Ávila Camacho"
MEX_manuel_gomez_morin:0	"Manuel Gómez Morín"
MEX_gustavo_l_gonzalez:0	"Gustavo González"
MEX_miguel_comacho:0	"Miguel Comacho"
Salinas:0	"Gustavo Adolfo Salinas Camiña"
Salinas_desc:0	"Der erste Flieger, der einen Seeschlag durchführte. Im Jahr 1943 wurde er mit den Worten zitiert: Die Bomben, die ich benutzte, waren selbstgebaut, mit einer Ladung von 52 Stangen Dynamit. So primitiv sie auch waren, sie funktionierten hervorragend. Zu dieser Zeit flog ich eine alte Wright-Schiebemaschine. Mir kam der Gedanke, dass der Tag kommen würde, an dem wir Flugzeuge haben würden, die mehr Gewicht tragen können, als wir uns je erhofft hatten, und dass das Flugzeug dann als militärische Angriffswaffe von fabelhafter Leistung zum Einsatz kommen würde. Dieser Tag ist nun gekommen."
agustin_olachea2:0	"Agustin Aviles Olachea"
agustin_olachea2_desc:0	"Agustin Aviles Olachea baute während des Zweiten Weltkriegs Flugschulen auf und trug dazu bei, die mexikanische Luftwaffe für spätere Generationen zu formalisieren, als die Ära der autodidaktischen revolutionären Luftidole zu Ende ging."
antonio:0	"Antonio Cardenas Rodriguez"
antonio_desc:0	"Antonio Cardenas Rodriguez' entscheidender Moment in seiner militärischen Karriere war die Führung des Geschwaders 201 über den Phillipinen in der Schlussphase des Zweiten Weltkriegs."
Maximino:0	"Maximino Ávila Camacho"
Maximino_desc:0	"Maximino ist der Bruder von Manuel Avila Comacho. Maximino ist nicht nur als Sympathisant der Achsenmächte bekannt, sondern auch als Geschäftspartner von William Jenkins, der ein Monopol auf die mexikanischen Medien hat und den Einfluss der Alliierten vereitelt. Maximinos Einmischung hat die Propagandaversuche Frankreichs und Großbritanniens im Alleingang zunichte gemacht."
MEX_PAB:0	"Pablo Quiroga Trevino"
MEX_PAB_desc:0	"Pablo Quiroga Trevino ist als einer der engsten Verbündeten von Cardenas bekannt. Er ist verantwortlich für die Durchsetzung der umstrittenen sozialistischen Erziehung und setzt sich für die Politik von Cardenas ein. Pablo Quiroga war einer der wenigen Minister des ursprünglichen Kabinetts, die auf der Seite von Cardenas standen."
MEX_SANTA:0	"Miguel G. Santa Ana"
MEX_SANTA_desc:0	"Miguel G. Santa Ana war im Auftrag von S.E.D.E.N.A, dem mexikanischen Heeres- und Marineminister, für die Beschaffung von Ausrüstung, Nachschub und anderen Gütern zuständig."
Castillo:0	"Fransisco Castillo"
Castillo_desc:0	"Castillo war vor allem für seine Tätigkeit als Botschafter im Ausland bekannt, wo er mögliche Handelsabkommen auslotete und allgemein die diplomatischen Beziehungen verbesserte."
agustin_olachea:0	"Agustin Aviles Olachea"
agustin_olachea_desc:0	"Agustin Olachea war für den Bau von allem verantwortlich, was für das Funktionieren der mexikanischen Streitkräfte wichtig war. Er überwachte den Bau vieler militärischer Projekte, von neuen Luftwaffenstützpunkten bis hin zu neuen Kriegsschulen in ganz Mexiko."
MEX_plutarco_e_calles_desc:0	"Plutarco Calles, auch bekannt als El Jefe Maximo, war der populistische Präsident von 1924-1928. Anfänglich war er ein Mann des Volkes mit viel öffentlicher Unterstützung und ein Held der Revolution. Leider hielt er sich, wie der Diktator Porfiro Diaz, gegen den die Revolution gekämpft hatte, bis 1936 mit Hilfe von Marionettenpräsidenten und Unterstützern in der PRM an der Macht in Mexiko. Seine Politik driftete im Laufe der Zeit nach rechts ab, und als seine Politik zum Cristero-Krieg beitrug, war sein Ruf völlig zerstört. Dieser schlechte Ruf gipfelte 1936 in seiner Verbannung nach San Diego."
padilla:0	"Ezequiel Padilla Peñaloza"
padilla_desc:0	"Während seiner Zeit in der Regierung ist Padilla vor allem für seine entschiedene Pro-US-Haltung bekannt. Padilla war ein so überzeugter Verfechter der US-Interessen, dass er den USA regelmäßig streng geheime mexikanische Dokumente übergab."
MEX_eduardo_saurez:0	"Eduardo Saurez"
MEX_eduardo_saurez_desc:0	"Eduardo Saurez war Mexikos Finanzminister von 1935 bis 1946."
MEX_rex_applegate:0	"Rex Applegate"
MEX_rex_applegate_desc:0	"Rex Applegate war ein US-Offizier und Roosevelts persönlicher Leibwächter, der mexikanische Soldaten in Spezialtaktiken, insbesondere im Nahkampf, ausbilden sollte und noch lange nach dem Krieg als Berater diente."
Heriberto:0	"Heriberto Jara Corona"
Heriberto_desc:0	"Heriberto ist der allererste Marineminister Mexikos. Aufgrund der Zentralisierung des Militärs wurde der Marineminister geschaffen, um die politische Macht des Militärs zu brechen."
hector:0	"Hector Meixueiro"
gustavo:0	"Gustavo Adolfo Salinas Camiña"
gustavo_desc:0	"Der erste Flieger, der einen Marineschlag durchführte. Im Jahr 1943 wurde er mit den Worten zitiert: Die Bomben, die ich benutzte, waren selbstgebaut, mit einer Ladung von 52 Stangen Dynamit. So primitiv sie auch waren, sie funktionierten hervorragend. Zu dieser Zeit flog ich eine alte Wright-Schiebemaschine. Mir kam der Gedanke, dass der Tag kommen würde, an dem wir Flugzeuge haben würden, die mehr Gewicht tragen können, als wir uns je erhofft hatten, und dass das Flugzeug dann als militärische Angriffswaffe von fabelhafter Leistung zum Einsatz kommen würde. Dieser Tag ist nun gekommen. "
enrique_estrada:0	"Enrique Estrada"
enrique_estrada_desc:0	"Enrique Estrada war Schüler des berühmten revolutionären Generals Felipe Angeles, bei dem er in der Kunst der Artillerie unterrichtet wurde."
MEX_Manuel_Sandoval_Vallarta:0	"Manuel Sandoval Vallarta"
MEX_Manuel_Sandoval_Vallarta_desc:0	"Vallarta war ein mexikanischer Physiker, der sowohl am MIT als auch an der UNAM lehrte. Sein Fachgebiet war die kosmische Strahlung. 1927 erhielt er ein Gugeinheim-Stipendium, das ihn an die Universitäten von Berlin und Leipzig führte. Dort lernte er von Einstein, Heisenberg, Schrödinger und Planck. 1946 entschied er sich, ganztags an der UNAM zu bleiben und Berater für Wissenschaftspolitik zu werden. Vallarta ist insofern einzigartig, als dass er in den USA Studenten betreute, die später das Manhattan-Projekt abschließen sollten. Zu seinen Schülern gehörten Richard Feynman und Julius Stratton. Er war auch ein Kollege des berühmten belgischen Physikers Georges Lemaître bei der Erforschung der kosmischen Strahlung."
MEX_nationalize_oil_fields:0	"Ölfeld verstaatlichen"
MEX_nationalize_oil_fields_desc:0	"PEMEX ist die verstaatlichte Ölgesellschaft von Mexiko. Ihre Gründung löste eine gewaltige Welle geologischer Entdeckungen, sozialer Entwicklungen und wirtschaftlicher Innovationen aus und war die Hauptantriebskraft für die Industrialisierung Mexikos."
aguila:0	"Aguila Öl"
aguila_desc:0	"Die Sinarquistas, Mexikos Faschisten, waren glühende Kapitalisten, die daran glaubten, dass der mexikanische Markt in mexikanischem Besitz ist. Wenn ein ausländisches Unternehmen in den mexikanischen Markt eintreten wollte, musste es dies über einen unabhängigen mexikanischen Vermittler tun. Unter ihrer Führung würde die ausländische Ölindustrie zwangsweise eingebürgert werden, und wenn PEMEX existierte, wäre sie in Teilen an mexikanische Eliten versteigert worden."
CEMEX:0	"CEMEX"
Azcarate:0	"Azcarate S.A."
Azcarate_desc:0	"Azcarate gründete nach seinem politischen Exil ein kleines Luftfahrtunternehmen, in dem er während des Zweiten Weltkriegs in Partnerschaft mit Lockheed Martin Projekte baute."
baja:0	"Mariscraft S.A."
baja_desc:0	"Mariscraft war ein obskures mexikanisches Luftfahrtunternehmen und produzierte in Wirklichkeit nur 1 Flugzeug, die MA-260. Die MA-260 war angeblich ein mexikanisches Projekt zur Entwicklung eines Langstrecken-Jagdbombers, das auf dem Konzept der 8W Zeus basierte."
Mendoza:0	"Productos Mendoza"
Mendoza_desc:0	"Mendoza ist nach Manuel Mondragon der zweite legendäre mexikanische Waffenentwickler. Sie haben sich auf Maschinengewehre spezialisiert, die von HMGs über SMGs bis hin zu vollautomatischen Gewehren reichen."
Obregon:	"Alejandro Obregón"
Obregon_desc:0	"Obregón ist vor allem für die Obregón .45 Pistole bekannt, die das Design des 1911er Modells vereinfachte. Das Innere der Pistole war völlig anders und enthielt viele vereinfachte Teile. Das machte die Obregón-Pistole zuverlässiger und billiger als die 1911. Die Obregóns gelten als Markenzeichen der Handwerkskunst."
Grupo_Ramirez:0	"Grupo Ramirez"
Grupo_Ramirez_desc:0	"Mexikos erste Autofirma und Erfinder des Rural Ramirez LKW. Sie haben sich auf billige, zuverlässige Autos und Motoren spezialisiert."
Grupo_Ramirez2:0	"Grupo Ramirez"
Grupo_Ramirez2_desc:0	"Mexikos erste Autofirma und Schöpfer des Rural Ramirez-Lastwagens. Sie haben sich auf billige, zuverlässige Autos und Motoren spezialisiert."
VAM:0	"VAM"
VAM_desc:0	"Ein von der Regierung kontrollierter Automobilhersteller, ursprünglich eine amerikanische Jeep-Tochtergesellschaft, die nach einer Übernahme durch die Regierung in ein eigenes Unternehmen umgewandelt wurde."
VAM2:0	"VAM"
VAM2_desc:0	"Ein von der Regierung kontrollierter Automobilhersteller, ursprünglich eine amerikanische Jeep-Tochtergesellschaft, die nach einer Übernahme durch die Regierung in ein eigenes Unternehmen umgewandelt wurde."
TELMEX:0	"TELMEX"
TELMEX_DESC:0	"Telmex ist das mexikanische Telekommunikationsmonopol. Bevor es an private Interessen verkauft wurde, wurde es von der mexikanischen Regierung aufgekauft, um die mexikanischen Kommunikationsnetze zu erneuern."
MEX_ASTIMAR:0	"ASTIMAR"
MEX_ASTIMAR_desc:0	"ASTIMAR ist der von der Regierung geleitete Schiffsbauer. Sie haben sich auf Kanonenboote und die Küstenverteidigung spezialisiert."
AHMSA:0	"AHMSA"
AHMSA_desc:0	"AHMSA ist der größte Eisen- und Kohleförderer in Mexiko und auch der größte Stahlhersteller. Das Unternehmen ist spezialisiert auf Maschinenteile und Stahlteile für die Infrastruktur wie z.B. Brücken."
league:0	"Mexikanische Liga für Radioexperimente"
league_desc:0	"Die Mexikanische Liga für Radioexperimente war eine Gruppe von Wissenschaftlern, darunter einige Wunderkinder, die auf dem Gebiet der Radiokommunikation innovativ waren. Sie sind vor allem für die Erfindung der Technologie bekannt, die das Farbfernsehen ermöglichte."
Echevarrieta:0	"Echevarrieta-Werften"
Echevarrieta_desc:0	"Echevarrieta war eine spanische Werftgesellschaft, die Konvoi-Eskorten nach Mexiko verkaufte."
Odero:0	"Odero-Werften"
Odero_desc:0	"Odero Shipyards war eine italienische Werftgesellschaft, die für den Bau der stärker gepanzerten Schiffe in Mexikos Flotte verantwortlich war."
Angel:0	"Angel Lascurian"
Angel_desc:0	"Angel Lascurian war ein legendärer Flieger in Mexiko. Er baute das fortschrittlichste und futuristischste Flugzeug, das Mexiko je hergestellt hat. Luftfahrt-Enthusiastenmagazine bewunderten, wie er ein einmotoriges, einsitziges Frachtflugzeug mit nur einer simplen Werkbank konstruierte und herstellte. Dieses Flugzeug wurde Aura genannt und Beobachtern zufolge war es für ein Flugzeug seiner Größe unnatürlich wendig."
electridad:0	"Comisión Federal de Electricidad"
electridad_desc:0	"Die Comisión Federal de Electricidad ist das staatliche Energieunternehmen, das auch für die Entwicklung und den Bau der mexikanischen Atomkraftwerke zuständig ist."
yokosuka_naval_arsenal2:0	"Yokosuka Marinearsenal"
MEX_jenkins_blockade:0	"Jenkins-Blockade"
MEX_jenkins_blockade_desc:0	"William O. Jenkins besitzt ein Monopol auf die mexikanischen Medien. Sein stiller Partner dabei war Maximino Avila Comacho, ein Sympathisant der Achsenmächte. Diese Allianz, die von einigen Historikern als Jenkins-Blockade bezeichnet wird, war einer der Hauptfaktoren für das klägliche Scheitern des britisch-französischen Versuchs, den Isolationismus in der Außenpolitik der Vereinigten Staaten auszunutzen und Mexiko in eine europäische Einflusssphäre zu treiben."
MEX_porfiriato_heritage_idea:0	"Porfiriato-Erbe"
MEX_porfiriato_heritage_idea_desc:0	"Der alte Reichtum Mexikos ist stark von den Porfiristas geprägt, die von der Diktatur von Porfiro Diaz profitiert haben. Sie unterstützen Deutschland aus Bosheit gegenüber dem Vereinigten Königreich und vereiteln aktiv die Bemühungen der britischen und französischen Propagandisten. Sie nutzen ihre große politische Präsenz, um Mexiko in die Arme der Achsenmächte zu treiben."
MEX_new_era_of_porfirato:0	"Neue Ära des Porfirato"
MEX_pact_of_honor_idea:0	"Pakt der Ehre"
MEX_conservative_politics_idea:0	"Konservative Politik"
MEX_camarilla_cabinet:0	"Kamarilla-Kabinett"
MEX_active_political_inquisition:0	"Aktive politische Inquisition"
MEX_moderate_oil_concessions:0	"Mäßige Ölkonzessionen"
MEX_industrial_concessions:0	"Industrielle Zugeständnisse"
MEX_PAN7:0	"Perfekte Diktatur"
MEX_state_railroad_company:0	"Mexikanische Nationale Eisenbahngesellschaft"
MEX_state_railroad_company_desc:0	"Diese staatliche Eisenbahngesellschaft, die im Inland als Ferrocarril Nacional Mexicano oder FNM bekannt ist, wurde von der Regierung gegründet, um die schlechten Eisenbahnverbindungen im ganzen Land auszubauen und die bereits bestehenden Strecken zwischen Metropolen wie Mexiko-Stadt, Ciudad Juárez, Nuevo Laredo und Matamoros zu erweitern."
MEX_maximato_legacy:0	"Maximatos Vermächtnis"
MEX_maximato_legacy_desc:0	"Die [ROOT.getAdjective] Regierung ist durchdrungen von Loyalisten von Plutarco Calles, auch bekannt als El Jefe Maximo. Er war von 1924 bis 1928 mexikanischer Präsident und kontrollierte Mexiko durch stellvertretende Präsidenten und Unterstützer in der PRM. Von 1924 bis 1936 war Calles derjenige, der die wahre Macht in Mexiko innehatte. Diese Periode in der mexikanischen Geschichte ist als Maximato bekannt."
MEX_recovering_from_maximato:0	"Die Erholung vom Maximato"
MEX_military_purges:0	"Militärische Säuberungen"
MEX_political_union_support:0	"Unterstützung der politischen Union"
MEX_funding_public_enterprises:0	"Finanzierung öffentlicher Unternehmen"
MEX_funding_public_enterprises_desc:0	"[ROOT.getAdjective] leitet derzeit einen Teil der zur Verfügung stehenden Mittel um, um die Gründung öffentlicher Unternehmen zu unterstützen, wodurch sich die Lebensbedingungen der Bevölkerung erheblich verbessern."
MEX_new_maximato:0	"Neues Maximato"
MEX_political_rearrangements:0	"Politische Umschichtungen"
MEX_leftist_policies:0	"Linksgerichtete Politik"
MEX_syndicalist_policies:0	"Syndikalistische Politik"
MEX_technocrats_in_the_government:0	"Technokraten in der Regierung"
MEX_contributing_to_the_construction_project:0	"Beitrag zum Bauprojekt"
MEX_prm_dominance:0	"PRM-Dominanz"
MEX_internal_security_prioritized:0	"Innere Sicherheit hat Vorrang"
MEX_foreign_affairs:0	"Außenpolitische Angelegenheiten"
MEX_invite_FROM_to_the_treaty:0	"Laden Sie [FROM.getNameDef] zum Vertrag ein"
MEX_invite_FROM_to_the_treaty_tt:0	"Schaltet £decision_icon_small frei, um §Yinvite§! unabhängige lateinamerikanische Länder in unser Bündnis einzuladen!"
MEX_pan_american_highway_tt:0	"Dieser Nationale Geist wird nach der mexikanischen Fertigstellung des Schwerpunkts '§YDie Panamerikanische Autobahn§!' entfernt werden."
fierro:0	"Roberto Fierro"
abelardo:0	"Abelardo Rodriguez"
abelardo_desc:0	"Abelardo war ein mexikanischer Geschäftsmann, mexikanischer General und Interimspräsident Mexikos. Er gründete 80 Unternehmen und war an insgesamt 120 beteiligt. Er gründete Baja California, ein militärisches Luftfahrtunternehmen, und Rodriguez Shipyards in Tijuana."
rodriguez:0	"Rodriguez-Werft"
rodriguez_desc:0	"Rodriguez Shipyard befindet sich in Tijuana und ist im Besitz des Wirtschaftsmagnaten und ehemaligen mexikanischen Präsidenten Abelardo Rodriguez. Nach den wenigen Informationen, die uns vorliegen, hat sich das Unternehmen auf kleinere Schiffe spezialisiert."
MEX_almazan:0	"Juan Almazan"
MEX_almazan_desc:0	"Juan wurde als Geschäftsmann im Gewand eines Generals beschrieben. Sein Hauptgeschäft war das militärische Bauwesen, wo seine Firma in den 20er Jahren in Monterrey für den Bau des besten Militärstützpunkts in Mexiko verantwortlich war."
Maximino2:0	"Maximino Avila Camacho"
Maximino2_desc:0	"Maximino Avila Camacho war der Caudillo von Puebla, wo er die Telegrafen, die Eisenbahnen, die Stromleitungen und den Großteil der Infrastruktur besaß. In dieser Zeit setzte Mexiko die Ingenieure seines Militärs ein, um die Infrastruktur und andere Gebäude schnell zu bauen, und Maximino war daran beteiligt. Aus diesem Grund wäre Maximino ein Logistikexperte, der sein Fachwissen über Versorgungsleitungen und seine Erfahrung im Bau von Infrastrukturen in jeden Krieg einbringen könnte."
Maximino3:0	"Maximino Avila Camacho"
Maximino3_desc:0	"Maximino wurde von mexikanischen Historikern als arrogant, zornig und rachsüchtig beschrieben. Es hieß, Maximino verfolge diejenigen, die ihm in die Quere kamen, mit extremen Vorurteilen."
MEX_MARC:0	"El Compa Nacho"
MEX_MARC_desc:0	"El Compa Nacho, mit richtigem Namen Ignacio Morales, war ein Agent, der sowohl mit der Cardenista- als auch mit der Aleman-Gruppe in Verbindung stand und von diesen mit speziellen Aufträgen betraut wurde. Morales wurde von Almazan-Anhängern beschuldigt, an einem fehlgeschlagenen Attentat auf Alamazan beteiligt gewesen zu sein. Quelle: Der politische Geheimdienst und die Entstehung des modernen Mexiko, 1938-1954, Seite 46."
lopez:0	"Raúl López Sánchez"
pawling1:0	"Alberto J. Pawling"
pawling2:0	"Alberto J. Pawling"
MEX_agrarian_army:0	"Die Agrargemeinschaft"
MEX_agrarian_army_desc:0	""
MEX_constable_army:0	"Konstablerarmee"
MEX_constable_army_desc:0	"Mexikos Armee war lange Zeit auf die interne Polizeiarbeit konzentriert und verfügte nicht über die interne Struktur, um Bedrohungen von außen wirksam zu begegnen. In dieser Ära stellten die Caudillos eine ernsthafte Bedrohung für den nationalen Frieden dar und zwangen die mexikanische Regierung, das Militär für Bauprojekte einzusetzen, um nicht nur Arbeitskräfte zu binden, damit die Caudillos keine Rebellion anzetteln konnten, sondern gleichzeitig auch die nationale Infrastruktur zu verbessern."
MEX_constable_army_caudillos_sided:0	"Caudillos Armeen"
MEX_constable_army_caudillos_sided_desc:0	"Die Ermächtigung der Caudillos hat dazu geführt, dass die Privatarmeen die lokalen Sektoren dominieren. Im Guten wie im Schlechten ist dies zumindest ein Schritt in Richtung einer zuverlässigen Armeestruktur."
MEX_low_literacy_rate:0	"Niedrige Alphabetisierungsrate"
MEX_low_literacy_rate_desc:0	"Im Jahr 1936 lag die Alphabetisierungsrate in Mexiko bei ~40%. Die Hauptursache dafür war die Verteilung der Bevölkerung, die meist in ländlichen Gebieten lebte, im Vergleich zum Zugang zu Bildung, der meist in städtischen Gebieten stattfand."
MEX_heavily_subsidized_rural_education:0	"Stark subventionierte ländliche Bildung"
MEX_conservative_education:0	"Konservative Bildung"
MEX_conservative_education_desc:0	""
MEX_modernize_the_education_system:0	"Das Bildungssystem modernisieren"
MEX_modernize_the_education_system_desc:0	""
MEX_major_economic_sanctions:0	"Große Wirtschaftssanktionen"
MEX_major_economic_sanctions_desc:0	"Die ausländischen Wirtschaftssanktionen haben katastrophale Auswirkungen auf alle Bereiche der wirtschaftlichen und industriellen Landschaft Mexikos."
MEX_small_aviation_industry:0	"Engpass in der Luftfahrtindustrie"
MEX_small_aviation_industry_desc:0	"Die mexikanische Luftfahrtindustrie hatte keinen Mangel an guten Designern, die Flugzeuge entwarfen. Die Industrie litt jedoch unter der mangelnden Fähigkeit, diese Flugzeuge in Serie zu produzieren, weil es nicht nur an Maschinen, sondern auch an qualifizierten Ingenieuren fehlte. Mexikos größtes Hindernis bei der Einführung eigener Konstruktionen war die langsame Produktionszeit."
MEX_idea_expanded_mining_industry:0	"Deutsche Bergbauunternehmen"
MEX_idea_expanded_mining_industry_desc:0	"Deutschland war unter anderem daran interessiert, Bergbauunternehmen in Mexiko zu gründen, um den starken amerikanischen Einfluss in der Branche zu beschneiden."
state_car:0	"Staatlicher Autohersteller"
state_energy:0	"Staatliches Energieunternehmen"
MEX_expelled_diplomats:0	"Ausgewiesene Diplomaten"
MEX_oil_concessions_tt:0	"§Unsere Ölförderanlagen befinden sich in den Händen ausländischer Konzerne!§!"
MEX_strength_of_the_civil_War_depends_on_low_stability_tt:0	"§Geringe Stabilität§! sorgt dafür, dass §Yrebels§! Truppen §Gless§! erhalten!"
MEX_diplomatic_opportunity_tt:0	"Könnte sowohl mit den USA als auch mit Großbritannien einen Krieg beginnen, wenn die Spannungen zu gering sind. Es könnte möglich sein, die USA und Großbritannien gegeneinander auszuspielen, wenn der Zeitpunkt richtig ist."
tt_mexpromotion:0	"Der Präsident von Mexiko gilt aufgrund des Rangsystems als 5-Sterne-General. Daher wird dieser Militärkandidat auf Stufe 5 befördert und erhält Boni, die auf seiner Geschichte basieren.\n"
tt_MEX_racial_tensions:0	"Das wird nicht unbemerkt bleiben und die rassistischen Spannungen in Amerika verschärfen."
juan_is_dead:0	"Tot"
juan_loses:0	"verließ Mexiko nach der Wahlniederlage"
escobar_returns:0	"Escobar kehrt nach Mexiko zurück"
election_1940:0	"1940 Wahlsaison"
riot:0	"Der Zoot-Suit-Aufstand fand statt"
MEX_GATHERING_STORM_DESC:0	"\n\nMexiko befindet sich in den letzten Tagen des Maximato, der Zeit, in der der ehemalige Präsident Plutarco Elias Calles die wahre Macht in Mexiko innehatte, indem er rechte Loyalisten sowohl in der Politik als auch im Militär einsetzte. Seit 1934 hat Lázaro Cárdenas del Río einen politischen Krieg geführt, um Plutarcos Kontrolle über das Land zu beenden und seine eigenen linken Reformen durchzusetzen. Mexiko steht an einem Scheideweg, während sich die Welt auf einen Krieg vorbereitet, denn der linke und der rechte Flügel kämpfen um die Kontrolle über die Zukunft des Landes und seinen Platz in der kommenden neuen Weltordnung."
MEX_BLITZKRIEG_DESC:0	"\n\n Die Maximato ist zu Ende und Calles ist weg, aber der Kampf zwischen dem linken und dem rechten Flügel tobt weiter. Ermutigt durch die wirtschaftliche Not, die durch die PEMEX-Embargos verursacht wurde, hat sich der rechte Flügel polarisiert und befindet sich nun in einem politischen Bürgerkrieg darüber, wer im nächsten Jahr der Kandidat des rechten Flügels für die Präsidentschaft sein wird. Die dominierende PRI hingegen steht nun vor der Wahl, entweder ihre Ideale mit dem gemäßigten Kandidaten Camacho zu kompromittieren oder sich auf den linken Kandidaten Mugica zu stürzen."
POLITICS_DIONISIO_ENCINA_DESC:0	"Dionisio wurde als polarisierende Figur beschrieben, und Historiker fanden oft nur sehr wenig Positives über seine Führung zu sagen. Dionisio war für die Zersplitterung der größten mexikanischen kommunistischen Partei, der PCM, verantwortlich. Er wurde von sowjetischen Agenten unterstützt, die für die Verbreitung des Kommunismus in Mexiko zuständig waren. Er handelte nur auf Befehl und fürchtete, dass seine sowjetischen Handlanger einen geeigneteren Führer für die PCM finden würden. Diese Angst veranlasste ihn, jeden, der über bessere Führungsqualitäten oder Charisma verfügte, aus der PCM zu entfernen, weil er befürchtete, von ihnen ersetzt zu werden. Dadurch entstand in der PCM ein schwerer Mangel an guter Führung und proaktivem Denken."
MEX_rally_the_monarchists:0	"Versammeln Sie die Monarchisten"
MEX_rally_the_monarchists_desc:0	"Die kaiserliche Nostalgie hat in [MEX.GetNameDef] einen Aufschwung erlebt. Angesichts der anhaltenden politischen Instabilität in unserem Land ist es vielleicht überfällig, sich auf die alten Wege zu besinnen."
MEX_royalist_coup:0	"Royalistischer Coup"
MEX_royalist_coup_desc:0	"Die Zeit ist reif. Die Bevölkerung unterstützt die Wiedereinsetzung von Maria Josepha Sophia de Iturbide in ihre rechtmäßige Position als Kaiserin von Mexiko. Das Haus Iturbide wird wieder glorreich sein!"
MEX_formalize_church_land_rights:0	"Formalisierung der kirchlichen Landrechte"
MEX_formalize_church_land_rights_desc:0	"[ROOT.GetLeader], eine gläubige Katholikin, versteht mehr als die meisten anderen, wie wichtig die Sicherung der Landrechte für die Kirche in ihrem Land ist. Wir werden Schritte unternehmen, um ihre Situation zu formalisieren, und haben ihre Unterstützung."
MEX_papal_blessing_of_the_empress:0	"Päpstlicher Segen"
MEX_papal_blessing_of_the_empress_desc:0	"Eine formelle Segnung durch den Papst selbst wird sicherlich jede verbleibende Frage nach der Legitimität der Kaiserin in den Augen der Kirche ausräumen."
MEX_support_the_spanish_carlists:0	"Unterstützen Sie die [SPB.GetAdjective] Carlisten"
MEX_support_the_spanish_carlists_desc:0	""
MEX_focus_soldaderas_2:0	"Soldaderas"
MEX_focus_soldaderas_2_desc:0	"[ROOT.GetAdjective] Die Gesellschaft verändert sich. Dank der gütigen Kaiserin, die als große Einigerin fungiert, steigen die Frauen in der Gesellschaft rasch auf. So gibt es immer mehr weibliche Freiwillige in der Armee, von denen viele sogar den Offiziersstatus erreicht haben."
MEX_reform_the_imperial_army:0	"Reform der kaiserlichen Armee"
MEX_reform_the_imperial_army_desc:0	"Obwohl die kaiserliche Armee von 1864 bis 1867 unter Maximilian I. von Grund auf schwach und ineffektiv war, dient sie als großartiger Ausgangspunkt für eine moderne [ROOT.GetAdjective] kaiserliche Armee. Dieses Mal wird sie stärker sein als je zuvor."
MEX_navy_fit_for_an_empress:0	"Eine kaisertaugliche Marine"
MEX_navy_fit_for_an_empress_desc:0	"Als Kaiserin eines riesigen Reiches ist es nur natürlich, auch eine prestigeträchtige Flotte zu haben."
MEX_legacy_of_1864:0	"Das Vermächtnis von 1864"
MEX_legacy_of_1864_desc:0	"Ohne die Intervention von [FRA.GetAdjective] im Jahr 1863 hätte Maximilian I. nicht die Chance gehabt, die kaiserliche Autorität in [ROOT.GetNonIdeologyName] wiederherzustellen. Mit unserer neu gefundenen Stärke im Imperium wäre es also nur natürlich, dass wir unsere Beziehung zu unserem einstigen Unterstützer wieder aufleben lassen."
MEX_mimic_the_grande_armee:0	"Ahmen Sie die Grande Armée nach"
MEX_mimic_the_grande_armee_desc:0	"In der jüngeren Geschichte hat sich die Grande Armée wiederholt als effektive Kampftruppe erwiesen. Wenn wir unsere eigenen Fähigkeiten verbessern würden, könnten wir viel von ihr lernen."
MEX_the_new_continental_system:0	"Das neue kontinentale System"
MEX_the_new_continental_system_desc:0	""
MEX_legacy_of_new_spain:0	"Das Erbe von Neuspanien"
MEX_legacy_of_new_spain_desc:0	"Obwohl die Erinnerungen an die [SPB.GetAdjective]-Kolonisierung unseres Heimatlandes nicht immer angenehm sind, kann nicht geleugnet werden, dass das Juwel des [SPB.GetAdjective]-Imperiums viel Prestige brachte. Auch wenn es natürlich nicht dasselbe sein wird, können wir in einem formellen Bündnis mit unseren ehemaligen Oberherren einige alte Traditionen wieder aufleben lassen."
MEX_restore_the_viceroyalty_system:0	"Stellen Sie das System der Vizekönigreiche wieder her"
MEX_restore_the_viceroyalty_system_desc:0	"Das Vizekönigreichssystem war trotz seiner Mängel auf vielen Ebenen von gegenseitigem Nutzen. Jetzt, da wir uns mit unseren ehemaligen Oberherren verbündet haben, sollten wir eine Neo-Wiederherstellung dieses Systems anstreben."
MEX_new_mexican_empire:0	"Neues [ROOT.GetAdjective] Reich"
MEX_new_mexican_empire_desc:0	"Unser Schicksal ist das Schicksal von [ROOT.GetNameDef], und nur das unsere. Wir werden einen Kurs einschlagen, der uns nicht an das Leid des alten bindet, denn wir sind ein neues Imperium, stärker denn je."
MEX_reconquer_the_viceroys:0	"Erobern Sie die Viceroyants zurück"
MEX_reconquer_the_viceroys_desc:0	""
MEX_reconquer_the_west_indies:0	"Erobern Sie die Westindischen Inseln zurück"
MEX_reconquer_the_west_indies_desc:0	""
