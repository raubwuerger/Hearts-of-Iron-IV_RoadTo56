l_german:
VIN_dan_toc2_desc:0 "Unser erster und wichtigster Kampf war natürlich die Wiederherstellung der vietnamesischen Nation, unabhängig von jeglichem ausländischen Einfluss. Alle Vietnamesen müssen verstehen, dass die Existenz unserer Nation von ihrem Mut und ihrer Entschlossenheit abhängt, ihr Heimatland zu verteidigen."
Vietnam_focus:0 "Vietnam National Focus"
VIN_fascism_party_long:0 "Cuong De's Fraktion"
VIN_democratic_party_long:0 "Viet Nam Quoc Dan Dang"
VIN_vnqdd_party_long:0 "VNQDD"
VIN_communism_party_long:0 "Kommunistische Partei Vietnams"
VIN_nguyen_dynasty_neutrality_party_long:0 "Nguyen-Dynastie"
VIN_comittee_independent_vietnam_party_long:0 "Komitee für die Wiederherstellung des unabhängigen Vietnam"
VIN_la_lutte_party_long:0 "La Lutte"
vietnam.1.t:0 "[VIN.GetNameDefCap]s Eintritt in die Komintern"
vietnam.1.d:0 "Der Botschafter von [VIN.GetAdjective] in [SOV.GetNameDef] hat soeben eine Anfrage direkt von der Regierung von [VIN.GetAdjective] weitergeleitet. Diese möchte, dass [VIN.GetNameDef] dem Militärbündnis um [SOV.GetNameDef] beitritt, in der Hoffnung, von dem Schutz für ihr Territorium und ihre Revolution selbst zu profitieren."
vietnam.1.a:0 "Sagen Sie Onkel Ho, dass er unseren Schutz hat."
vietnam.1.b:0 "Wir müssen ablehnen."
vietnam.2.t:0 "[SOV.GetNameDefCap] Nimmt an"
vietnam.2.d:0 "[SOV.GetNameDefCap] hat eine positive Antwort auf den Beitritt von [VIN.GetNameDef] zu ihrem Militärbündnis gegeben.\nDamit werden wir die freie Bewegung von Truppen zwischen unseren beiden Territorien einrichten, und letztere werden uns im Falle eines Konflikts helfen."
vietnam.2.a:0 "Ausgezeichnet!"
vietnam.3.t:0 "[SOV.GetNameDefCap] lehnt ab"
vietnam.3.d:0 "[SOV.GetNameDefCap] hat negativ auf ein Militärbündnis zwischen unseren beiden Ländern reagiert. Insbesondere mit dem Hinweis, dass die derzeitige Situation nicht günstig ist und [SOV.GetNameDef] daher die Verteidigung von [VIN.GetNameDef] nicht garantieren kann, haben sie jedoch nicht bestritten, dass ein Bündnis in der Zukunft geschlossen werden kann, wenn sich die Weltlage geändert hat."
vietnam.3.a:0 "Wir können uns nur auf uns selbst verlassen."
vietnam.4.t:0 "Putschversuch der Kommunisten!"
vietnam.4.d:0 "Zahlreiche Milizen, die loyal zur Malayan Races Liberation Army stehen, die ihrerseits mit der Malayischen Kommunistischen Partei verbunden ist, sind soeben in Singapur aufmarschiert und hoffen, die Kontrolle über die Kolonialregierung zu übernehmen, um die [ENG.GetAdjective]-Verwaltung zu zerstören und ein kommunistisches Regime zu errichten.\nDie regierungstreuen Kräfte, die außerhalb der Stadt stationiert sind, bereiten sich darauf vor, sie zurückzuerobern, aber nichts garantiert ihren Sieg."
vietnam.4.a:0 "Der Putsch ist erfolgreich."
vietnam.4.b:0 "Der Putsch scheitert."
vietnam.5.t:0 "Der [MAL.GetAdjective] Putsch ist gescheitert!"
vietnam.5.d:0 "Die kommunistischen Streitkräfte konnten Singapur nicht verteidigen und wurden schließlich nach einer langen Schlacht besiegt. Viele Kader der Malaiischen Kommunistischen Partei wurden gefangen genommen oder getötet, was unsere Chancen, den Kommunismus in Malaysia von innen heraus zu installieren, zunichte gemacht hat."
vietnam.5.a:0 "Wir werden unsere Brüder rächen!"
vietnam.6.t:0 "Hilfe aus dem Süden"
vietnam.6.d:0 "Kuomintang und VNQDD sind seit jeher Verbündete, die beide den Lehren von Sun-Yat-Sen folgen wollen. VNQDD-Kader stehen seit Jahren in [CHI.GetNameDef] unter Schutz, geschützt vor der [FRA.GetAdjective]-Polizei.\nAls [CHI.GetNameDef] sich wieder im Kriegszustand befindet, hat uns die [VIN.GetAdjective]-Regierung um Hilfe gebeten."
vietnam.6.a:0 "Gemeinsam sind wir stärker."
vietnam.6.b:0 "Wir brauchen ihre Hilfe nicht."
ASIAN_LEAGUE_NAME:0 "Asiatische Liga"
vietnam.7.t:0 "[CHI.GetNameDefCap] lehnt unsere Hilfe ab"
vietnam.7.d:0 "Die [CHI.GetAdjective]-Regierung hat unsere Bitte um Hilfe abgelehnt. Wir können uns nicht auf ihren Schutz verlassen, und sie nicht auf unseren."
vietnam.7.a:0 "Wir werden ihre Entscheidung respektieren."
vietnam.8.t:0 "Sieg!"
vietnam.8.d:0 "Während die letzten [FRA.GetAdjective] Truppen gezwungen wurden, die indochinesische Halbinsel zu verlassen, können wir leicht den Sieg erklären. Die [FRA.GetAdjective] Unterdrückung liegt nun hinter uns!"
vietnam.8.a:0 "Hurra!"
vietnam.9.t:0 "Ho Chi Minhs Führerschaft"
vietnam.9.d:0 "Nguyen Ai Quoc, besser bekannt unter seinem Spitznamen Ho-Chi-Minh, Anführer der Viet-Minh und des vietnamesischen Widerstands gegen den Kolonialismus, wurde in der Sowjetunion in marxistischem und leninistischem Gedankengut geschult, bevor er zurückkehrte, um die Rebellion gegen die Kolonialverwaltung zu führen. Er wurde mehr als nur ein Führer; er wurde der neue Vater der [VIN.GetAdjective] Nation. Möge er [VIN.GetNameDef] in ein Zeitalter des Wohlstandes führen."
vietnam.9.a:0 "Hurra!"
vietnam.10.t:0 "Die Führerschaft von La Lutte"
vietnam.10.d:0 "Ta Thu Thau, der Anführer von La Lutte, der monatelang daran gearbeitet hatte, eine echte sozialistische Opposition gegen die [FRA.GetAdjective] Kolonisierung zu organisieren, fand sich zusammen mit seinen trotzkistischen Kollegen an der Spitze der Rebellion wieder, die Vietnam befreite. Als Figur der Hoffnung und der Freiheit hat er die Unterstützung sowohl der Bauern als auch der städtischen Arbeiter gewonnen, so dass er die offensichtliche Wahl für die Führung unserer Nation ist."
vietnam.10.a:0 "Hurra!"
vietnam.11.t:0 "VNQDD-Führung"
vietnam.11.d:0 "Nguyen Tuong Tam, der Führer der VNQDD, einer der ältesten und aktivsten Parteien, die für die Unabhängigkeit Vietnams eintritt, hat es geschafft, die Macht, die seine Partei in der Vergangenheit verloren hatte, wiederherzustellen, indem er sie wieder aufgebaut hat, nachdem die französische Verwaltung sie fast zerstört hatte. Als Anführer der Rebellion ist es ihm gelungen, die Führung des Aufstandes zu übernehmen. Mit der Unterstützung des Volkes, das ihn nun als Nationalhelden sieht, kann er die Politik umsetzen, für die seine Partei schon so lange eintritt."
vietnam.11.a:0 "Hurra!"
vietnam.12.t:0 "Cuong De's Führungsqualitäten"
vietnam.12.d:0 "Während alles darauf hinzudeuten schien, dass die [VIN.GetAdjective] Rebellion von einer Art innerer Revolution, insbesondere der Geburt einer Republik, begleitet sein würde, gewann Cuong De, ein Mitglied der kaiserlichen Dynastie und jahrzehntelanger großer Befürworter der vietnamesischen Unabhängigkeit, die nötige Unterstützung, um die Rebellion anzuführen. Er wird vor allem von den mächtigen Eliten unterstützt, die sich nach dem Sieg der Unabhängigkeitsbefürworter umgedreht haben. Er hat eine ganz eigene Vision von Vietnam und lässt sich dabei von Regimen wie [JAP.GetNameDef] inspirieren, wo es ihm gelungen ist, genügend Unterstützung zu gewinnen, um ihm im Unabhängigkeitskrieg zu helfen."
vietnam.12.a:0 "Hurra!"
vietnam.13.t:0 "Eine gespaltene Führung"
vietnam.13.d:0 "Die Kräfte, die für die Unabhängigkeit Vietnams kämpften, waren zahlreich und hatten jeweils radikal andere Vorstellungen als die anderen, was eine langfristige Zusammenarbeit schlichtweg unmöglich machte. Jetzt, da der Krieg vorbei ist, kann nur einer gewinnen."
vietnam.13.a:0 "Ho-Chi-Minh soll uns führen!"
vietnam.13.b:0 "La Lutte und die Trotzkisten!"
vietnam.13.c:0 "Die VNQDD!"
vietnam.13.e:0 "Cuong De!"
vietnam.14.t:0 "Der Unabhängigkeitskrieg"
vietnam.14.d:0 "Es ist jetzt an der Zeit, den [FRA.GetAdjective] Eindringling zurückzuschlagen. Vietnam wird wieder unabhängig sein!"
vietnam.14.a:0 "Auf den Sieg!"
