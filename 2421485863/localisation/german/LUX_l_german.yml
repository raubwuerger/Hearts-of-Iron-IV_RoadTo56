LUX_ministries_desc_text:0	"Die Regierung von [ROOT.GetNameDef] setzt sich aus mehreren verschiedenen Ministerien zusammen. Jeder Minister hat unterschiedliche Zuständigkeiten, die sich in seinem Titel widerspiegeln.\n\nDie Wahl des richtigen Ministers für den Job kann schwierig sein, aber es ist hilfreich, sich die Fähigkeiten jedes potenziellen Ministers anzusehen, da diese bestimmen, was ein bestimmter Minister erreichen kann. Außerdem spielt die Parteizugehörigkeit§! des Ministers eine entscheidende Rolle. Wenn ein Minister Mitglied einer bestimmten Partei ist, wird diese Partei als Teil der Regierung betrachtet. Einige Parteien §Rerfordern mehr Verhandlungen§!, um ihnen einen Ministerposten zuzuweisen, je nach §HPremierminister§!. Einige Minister haben ihre eigenen Vorstellungen von dem, was sie tun sollen. Viele potenzielle Wirtschaftsminister zum Beispiel sind von ihrer Parteilinie§! geprägt. Achten Sie also darauf, wie die Zuweisung verschiedener Minister den §HFuture Course of the Country§! beeinflussen könnte."
