l_german:
LUX_formalize_our_resistance:0	"Luxemburg Resistance"
luxembourg_tree:0	"Luxemburgischer Nationaler Fokus"
LUX_support_arbed:0	"Unterstützen Sie ARBED"
LUX_support_arbed_desc:0	"ARBED ist ein relativ neues Unternehmen, aber es ist vielversprechend. Die Unterstützung eines so florierenden Unternehmens wird sich auf lange Sicht sicher auszahlen."
LUX_nationalise_railway_companies:0	"Verstaatlichung der Eisenbahngesellschaften"
LUX_nationalise_railway_companies_desc:0	"Unser Eisenbahnnetz befindet sich fast vollständig in Privatbesitz. Das ist aus Sicherheitsgründen eindeutig ein Risiko, da der Staat im Falle eines Krieges einen lebenswichtigen Transportsektor nicht kontrollieren kann."
LUX_establish_national_labour_council:0	"[GetStrikeFocusName]"
LUX_establish_national_labour_council_desc:0	"Die Frage der sozialen Gerechtigkeit ist ein heißes Eisen in Luxemburg. Die Arbeitnehmer sind dafür bekannt, dass sie politisch links stehen, und ein Nachgeben gegenüber ihren Forderungen könnte sie schließlich besänftigen. Allerdings würden wir damit den Sozialisten und Kommunisten nachgeben."
LUX_focus_autocompletion_tt:0	"Dieser Schwerpunkt wird Anfang 1937 umgangen§!.\n"
strike_demands_accepted_tt:0	"Das §HNationale Arbeitsratsgesetz§! wird in Kraft treten.\n\nDies wird unsere §Hzukunftspolitik§! beeinflussen."
delayed_nlc_tt:0	"Das §HNationale Arbeitsratsgesetz§! wird sich weiter verzögern.\n\nDies wird sich auf unsere §Hzukünftige Politik§! auswirken."
LUX_revert_worker_immigration:0	"Einwanderung von Arbeitnehmern umkehren"
LUX_revert_worker_immigration_desc:0	"Die Weltwirtschaftskrise hat Luxemburg nicht so stark getroffen wie andere Länder. Das liegt vor allem an unserer Politik, luxemburgischen Staatsbürgern bei der Besetzung von Arbeitsplätzen den Vorrang zu geben und sogar ausländische Arbeitnehmer in ihr Herkunftsland zurückzuschicken. Wenn wir so weitermachen, wird sich Luxemburg auch in einer Welt, in der der Wiederaufbau nach der Großen Depression erst beginnt, über Wasser halten können."
LUX_strengthen_agricultural_industry:0	"Landwirtschaftliche Industrie stärken"
LUX_strengthen_agricultural_industry_desc:0	"Auch wenn sich das Land im letzten Jahrhundert industrialisiert hat, sind weite Teile Luxemburgs immer noch von der Landwirtschaft und den damit verbundenen Arbeitsplätzen abhängig. Es steht daher außer Frage, dass wir den primären Wirtschaftssektor stärken müssen."
LUX_repair_belgian_relations:0	"Belgische Beziehungen reparieren"
LUX_repair_belgian_relations_desc:0	"Historisch gesehen steht Luxemburg den Niederlanden am nächsten. Die Beziehungen zu seinem Nachbarn Belgien sind jedoch angespannt. Die belgisch-luxemburgische Wirtschaftsunion hat in dieser Angelegenheit etwas geholfen, aber wir können diese Partnerschaft noch weiter vorantreiben."
LUX_begin_election_preparations:0	"Leiten Sie die Wahlsaison ein"
LUX_begin_election_preparations_tt:0	"Wenn Sie sie früher abschließen, haben Sie §Hmehr Zeit§! in der §HCAbgeordnetenkammer§!."
LUX_begin_election_preparations_desc:0	"Die Wahlen von 1937 stehen bald vor der Tür. Sie werden die Zukunft Luxemburgs wohl entscheidend prägen. Da ist es nur natürlich, dass viele Politiker ihren Wahlkampf frühzeitig beginnen."
LUX_unlock_chamberofdeputies_tt:0	"Schaltet die §HC-Abgeordnetenkammer§! frei"
LUX_the_maulkuerfgesetz:0	"Das Maulkuerfgesetz"
LUX_the_maulkuerfgesetz_tt:0	"Dieser Schwerpunkt wird nach Abschluss der Wahlen umgangen. Die Verabschiedung des Maulkuerfgesetzes wird die faschistischen Kraefte im Land erheblich staerken."
LUX_the_maulkuerfgesetz_desc:0	"Joseph Bech hat von Beginn seines Wahlsieges an versucht, kommunistische Einflüsse einzudämmen. Das neueste dieser Bemühungen ist das Maulkuerfgesetz, ein Gesetz, das darauf abzielt, jede Partei zu ächten, die versucht, die Verfassung gewaltsam zu ändern. Wenn dieses Gesetz verabschiedet wird, würde es die KPL, die Kommunistische Partei Luxemburgs, effektiv verbieten."
LUX_maulkuerfgesetz_passed_tt:0	"Das §HMaulkuerfgesetz§! wird §Gpass§!."
LUX_maulkuerfgesetz_didnt_pass_tt:0	"Das Referendum wird §Nicht passieren§! das §HMaulkuerfgesetz§!."
LUX_maulkuerfgesetz_passed:0	"Das Maulkuerfgesetz ist in Kraft getreten"
LUX_elections_over:0	"Die Wahlen sind abgeschlossen"
LUX_appoint_new_prime_minister:0	"Ernennen Sie den neuen Premierminister"
LUX_appoint_new_prime_minister_desc:0	"Die Wahlen sind vorbei, der Sieger steht fest. Die neue Regierung muss das Land mehrere Jahre lang regieren, daher ist es am besten, wenn der Machtwechsel reibungslos vonstatten geht."
LUX_the_dupong_ministry:0	"Das Kabinett Dupong"
LUX_the_dupong_ministry_desc:0	"Nach dem Rücktritt von Joseph Bech hat das neue Ministerium unter der Leitung von Pierre Dupong alle Hände voll zu tun, um die Stabilität der letzten Jahrzehnte zu gewährleisten. Wir wünschen ihnen viel Glück!"
LUX_elections_PD_winner:0	"§HPD§! hat die Wahl gewonnen"
LUX_liberal_victory:0	"Die liberale Fackel leuchtet hell"
LUX_liberal_victory_desc:0	"Die liberalen Parteien in Luxemburg sind seit jeher ein fester Bestandteil der Politik des Landes. Sie waren an Regierungen wie der letzten beteiligt, konnten aber nie eine Mehrheit erringen. Heute wird sich das ändern! Die PRL wird eine großartige Regierungspartei sein."
LUX_elections_PRL_winner:0	"§HPRL§! hat die Wahl gewonnen"
LUX_first_social_democratic_government:0	"Die erste sozialdemokratische Regierung"
LUX_first_social_democratic_government_desc:0	"Die LSAP ist eine alte Partei, aber sie war immer in der Opposition, auch wenn sie mehr als ein Viertel aller Stimmen erhielt. Nach ihrem jüngsten Wahlerfolg konnte die Partei endlich an die Spitze der Regierung aufsteigen."
LUX_elections_LSAP_winner:0	"§HLSAP§! hat die Wahl gewonnen"
LUX_begin_workers_revolution:0	"Beginnen Sie die Arbeiterrevolution"
LUX_begin_workers_revolution_desc:0	"Endlich hat das Warten ein Ende! All die Bemühungen, den Willen des Volkes zu untergraben, waren umsonst, der Sozialismus triumphiert endlich in Luxemburg! Wir werden uns von den Relikten der Vergangenheit befreien und Luxemburg in eine strahlende, sozialistische Zukunft führen."
LUX_elections_KPL_winner:0	"§HKPL§! hat die Wahl gewonnen"
LUX_invalidate_election:0	"Die Wahl für ungültig erklären"
LUX_invalidate_election_desc:0	"Die Wahl war ein Desaster. Die Verfassung erlaubt es der Großherzogin, die Wahl für ungültig zu erklären und selbst zu entscheiden, wie sie dieses Problem lösen will. Wir müssen davon Gebrauch machen und unsere geliebte Herzogin entscheiden lassen, was das Beste für Luxemburg ist."
LUX_invalidate_election_trigger_tt:0	"Weniger als §H20.0%§! Wahlbeteiligung"
LUX_contest_election_results:0	"Wahlergebnisse anfechten"
LUX_elections_indecisive:0	"Wahlergebnisse sind unentschieden"
LUX_contest_election_results_desc:0	"Luxemburg ist deutsch und die Luxemburger wissen das! Daher ist es offensichtlich, dass die Wahl ein Betrug war, um die Fassade der Demokratie aufrechtzuerhalten. Wir müssen die Kontrolle über die Regierung an uns reißen und endlich auch dem Letzten hier bewusst machen, dass er Deutscher ist!"
LUX_maintain_status_quo:0	"Beibehaltung des Status Quo"
LUX_maintain_status_quo_desc:0	"Viele Politikexperten haben erwartet, dass diese Wahl anders ausgehen würde, doch die Konservativen und die Liberalen haben sich nicht beirren lassen. Hoffen wir auf einen reibungslosen Übergang der Macht und eine schnelle Regierungsbildung, damit Luxemburg so schnell wie möglich in die fürsorglichen Hände einer bekannten Regierung kommt."
LUX_socialist_victory:0	"Sieg der Sozialisten"
LUX_socialist_victory_desc:0	"Das Scheitern des Maulkuerfgesetzes und der phänomenale Wahlkampf der Sozialisten haben ihnen ihren wohlverdienten Sieg eingebracht. Eine neue Ära für Luxemburg hat wirklich begonnen!"
LUX_finalise_government_formation:0	"Regierungsbildung abschließen"
LUX_finalise_government_formation_desc:0	"Die Regierung ist gebildet und der Machtwechsel abgeschlossen. Es ist an der Zeit, die Wahlperiode offiziell für beendet zu erklären."
LUX_finalise_government_formation_tt:0	"Sperren Sie §Die Ministerien§! Entscheidungen."
LUX_expand_farm_subsidies:0	"Subventionen für die Landwirtschaft ausweiten"
LUX_expand_farm_subsidies_desc:0	"Die Landwirtschaft ist ein wichtiger Wirtschaftszweig für Luxemburg, vor allem im Norden des kleinen Landes. Subventionen für Landwirte machen nur Sinn, deshalb müssen wir sie ausbauen."
LUX_strengthen_rural_communities:0	"Ländliche Gemeinschaften stärken"
LUX_strengthen_rural_communities_desc:0	"Die Verstädterung des 19. Jahrhunderts hat viele ländliche Gemeinden in Armut und Verschuldung geführt. Wir müssen dem Einhalt gebieten und diesen Dörfern, die von der Industrialisierung zurückgelassen wurden, wieder mehr Aufmerksamkeit schenken."
LUX_invigorate_mining:0	"Beleben Sie die Bergbauindustrie"
LUX_invigorate_mining_desc:0	"Leider ist Luxemburg von Eisenimporten und der belgisch-luxemburgischen Wirtschaftsunion abhängig, um seine heimische Industrie, insbesondere die Stahlindustrie, zu unterstützen. Daher brauchen wir eine eigene Bergbauindustrie."
LUX_another_declaration_of_neutrality:0	"Verstärken Sie unsere Neutralität"
LUX_another_declaration_of_neutrality_desc:0	"Angesichts der prekären Lage, in der sich die Welt befindet, müssen wir auf dem richtigen Weg bleiben und das beibehalten, was für unsere weitere Unabhängigkeit am besten ist."
LUX_reaffirm_treaty_of_london:0	"Bekräftigen Sie den Vertrag von London"
LUX_reaffirm_treaty_of_london_desc:0	"Der 1867 unterzeichnete Vertrag von London war für unser Land sehr hilfreich. Wir müssen sicherstellen, dass er von allen Unterzeichnern aufrechterhalten wird!"
LUX_renegotiate_trade_agreements:0	"Handelsabkommen neu verhandeln"
LUX_renegotiate_trade_agreements_desc:0	"Um unsere wirtschaftliche Abhängigkeit von anderen Ländern zu verringern, müssen wir eine Initiative starten, um unsere Handelsabkommen mit unseren Nachbarn neu zu verhandeln."
LUX_science_funding:0	"Mehr Mittel für die Wissenschaft"
LUX_science_funding_desc:0	"Eine Investition in die Wissenschaft ist eine Investition in die Zukunft. Eine Erhöhung der Wissenschaftsfinanzierung wird unsere Forschungsleistung steigern und [ROOT.GetNonIdeologyName] in die Zukunft bringen."
LUX_policy_of_free_hands:0	"Die Politik der freien Hände"
LUX_policy_of_free_hands_desc:0	"Wir müssen um jeden Preis unabhängig bleiben, auch wenn das bedeutet, dass wir mit Faschisten oder Kommunisten paktieren müssen."
LUX_ban_international_aid:0	"Internationale Hilfe verbieten"
LUX_ban_international_aid_desc:0	"Unsere völlige Neutralität muss unangetastet bleiben. Wenn wir Interventionen in anderen Ländern zulassen würden, würde dies zeigen, dass wir uns nicht zur Neutralität verpflichtet fühlen. Daher müssen wir dies von vornherein verbieten."
LUX_increase_border_security:0	"Erhöhen Sie die Grenzsicherheit"
LUX_increase_border_security_desc:0	"Wir müssen jede mögliche Handlung verhindern, die als aggressiv angesehen werden könnte. Dazu gehört das Verbot der Jagd in den Grenzregionen und eine allgemeine Verstärkung der Grenzpatrouillen."
LUX_control_radio_transmissions:0	"Kontrolle aller Funkübertragungen"
LUX_control_radio_transmissions_desc:0	"Wenn wir zivile Funkübertragungen verbieten, können wir unser Militär leichter koordinieren. Außerdem bietet dies zusätzliche Sicherheit, da wir ausländische Mächte daran hindern können, den Rundfunk für Propaganda oder Kriegshandlungen zu nutzen."
LUX_oust_socialists_trigger_tt:0	"Hat keine §HSozialisten§! in der Regierung."
LUX_demonstrate_our_will:0	"Demonstrieren Sie unseren Willen"
LUX_demonstrate_our_will_desc:0	"Dieses Land hat eine Geschichte des Widerstands und der Beharrlichkeit. Wir haben uns der kulturellen Assimilierung widersetzt und sind nach wie vor eine stolze Nation mit einer eigenen Identität. Lassen Sie uns dafür sorgen, dass das so bleibt!"
LUX_oust_socialists:0	"Sozialisten verdrängen"
LUX_oust_socialists_desc:0	"Das Maulkuerfgesetz hat die Menschen polarisiert. Vor allem die Sozialisten haben ihre Agenda verbreitet und die Einheit der Nation untergraben. Das müssen wir so schnell wie möglich beenden."
LUX_commemorate_independence:0	"Erinnern Sie sich an unsere Unabhängigkeit"
LUX_commemorate_independence_desc:0	"Wir sind ein stolzes Volk mit einer stolzen Geschichte. Wenn es eine Sache gibt, die das Land eint, dann ist es unser kollektiver Wille, frei von fremden Mächten zu sein."
LUX_continue_the_fight:0	"Kämpfen Sie weiter"
LUX_continue_the_fight_desc:0	"Wir haben verloren, aber der Kampf ist noch nicht vorbei. Wir müssen unser Land um jeden Preis befreien!"
LUX_peace_in_our_times:0	"Frieden in unserer Zeit"
LUX_peace_in_our_times_desc:0	"Seit langem herrscht Frieden und es scheint keine unmittelbare Bedrohung für dieses schöne Land zu geben. Wir können jetzt unsere Maßnahmen zur Verteidigung des Landes lockern."
LUX_future_of_europe:0	"Die Zukunft Europas"
LUX_future_of_europe_desc:0	"Europa ist am stärksten, wenn es geeint ist. Als das Herz Europas muss diese Einigung von uns ausgehen."
LUX_privatisation_drive:0	"Je freier die Wirtschaft..."
LUX_privatisation_drive_desc:0	"Endlich eine liberale Regierung zu haben, hat uns in die Lage versetzt, Reformen voranzutreiben, um die Freiheit des Marktes und die Freiheit der Menschen zu erhöhen. Denn je freier der Markt ist, desto freier sind die Menschen."
LUX_open_border_agreements:0	"Abkommen über offene Grenzen abschließen"
LUX_open_border_agreements_desc:0	"Die Abhängigkeit von anderen Ländern hat [ROOT.GetNameDef] schon viel zu lange geplagt. Wir müssen diese Gelegenheit nutzen, um neue Handelsabkommen für bessere Import- und Exportpreise auszuhandeln."
LUX_lower_taxes:0	"Senken Sie die Steuern"
LUX_lower_taxes_desc:0	"Niemand kann argumentieren, dass niedrigere Steuern nicht gut für die Menschen sind. Sie erhöhen das Wirtschaftswachstum und verringern die Armut. Ein echter Gewinn für die Menschen!"
LUX_academy_of_science:0	"Richten Sie eine Akademie der Wissenschaft ein"
LUX_academy_of_science_desc:0	"Um wissenschaftlich an der Spitze zu bleiben, müssen wir in Forschung und Entwicklung investieren. Eine neue Akademie wird uns dabei helfen."
LUX_abandon_neutrality:0	"Geben Sie die Neutralität auf"
LUX_abandon_neutrality_desc:0	"Der Zustand, in dem sich die Welt befindet, ist ein klarer Beweis dafür, dass [ROOT.GetNonIdeologyName] nicht neutral bleiben kann. Wir müssen so schnell wie möglich wieder aufrüsten."
LUX_seek_protection:0	"Suchen Sie Schutz"
LUX_seek_protection_desc:0	"Eine Bedrohung von [ROOT.GetNonIdeologyName] würde unser Militär schnell überfordern. Es ist wichtig, dass wir die Unterstützung einer anderen Nation erhalten, die uns verteidigen kann!"
LUX_begin_rearmament:0	"Beginnen Sie mit der Aufrüstung"
LUX_begin_rearmament_desc:0	"Jahrzehnte der Abrüstung müssen rückgängig gemacht werden, wenn wir den kommenden Sturm überleben wollen."
LUX_research_cooperation:0	"Zusammenarbeit in der Forschung"
LUX_research_cooperation_desc:0	"Es hat sich gezeigt, dass Forschungspartnerschaften die Innovation erheblich steigern. Wir müssen uns zusammentun und wahre Wunder der Wissenschaft und Technik vollbringen."
LUX_join_allies:0	"Schließen Sie sich den Verbündeten an"
LUX_join_allies_desc:0	"Zu lange sind wir [ROOT.GetNameDef] allein gelassen worden. Jetzt werden wir uns den Demokratien Europas anschließen und sie in ihrem Kampf gegen Faschismus und Kommunismus unterstützen."
LUX_extend_maginot:0	"Erweitern Sie die Maginot-Linie"
LUX_extend_maginot_desc:0	"Die Maginot-Linie, die größte Befestigungsanlage Europas, wird uns Sicherheit gegen Bedrohungen aus dem Osten bieten."
LUX_british_funding:0	"Britisches Militär finanzieren"
LUX_british_funding_desc:0	"Das britische Militär ist eines der modernsten der Welt. Wenn wir ihre Unterstützung gewinnen, werden wir in der Schlacht sicher erfolgreich sein."
LUX_arms_purchases:0	"Kauf von Waffen"
LUX_arms_purchases_desc:0	"Mit einer demobilisierten Industrie hatten wir nicht genug Zeit, um die notwendigen Waffen zu produzieren. Zum Glück sind unsere Verbündeten da, um uns zu helfen."
LUX_preventive_intervention:0	"Vorbeugendes Eingreifen"
LUX_preventive_intervention_desc:0	"Wir wissen, was von extremistischen Ideologien ausgeht. Wir müssen jetzt handeln, bevor sie eine Chance hatten, uns selbst anzugreifen."
LUX_benelux_alliance:0	"Benelux-Allianz"
LUX_benelux_alliance_desc:0	"Wir können an Stärke gewinnen, wenn wir uns mit unseren engsten Partnern in den Niederungen verbünden. Gemeinsam können wir uns einer Invasion widersetzen, ohne uns dem Einfluss der westlichen Großmächte zu beugen."
LUX_decentralised_alliance:0	"Dezentralisieren Sie die Allianz"
LUX_decentralised_alliance_desc:0	"Jede Nation ist in irgendetwas gut. Wir können diesen Unterschied nutzen und jedes Mitglied der Benelux-Allianz spezialisieren."
LUX_unified_command:0	"Ein einheitliches Kommando einrichten"
LUX_unified_command_desc:0	"Da die Verteidigung für alle unsere Verbündeten von Interesse ist, müssen wir in dieser Angelegenheit zusammenarbeiten."
LUX_liberate_lowlands:0	"Befreien Sie die Lowlands"
LUX_liberate_lowlands_desc:0	"Unsere Bemühungen, die Lowlands zu vereinen, sind nicht erfüllt worden. Wir sollten die Einigung endlich vollenden."
LUX_expand_the_customs_union:0	"Erweitern Sie die Zollunion"
LUX_expand_the_customs_union_desc:0	"Die belgisch-luxemburgische Wirtschaftsunion hat sich für alle als vorteilhaft erwiesen. Wir sollten einen ähnlichen Pakt in der Benelux-Fraktion einrichten."
LUX_joint_economic_development:0	"Gemeinsame wirtschaftliche Entwicklung"
LUX_joint_economic_development_desc:0	"Unsere vereinten Industrien sind mächtig, doch profitieren wir nur selten von der Industrie des anderen Landes. Mit einem gemeinsamen Investitionsprogramm können wir das ändern."
LUX_united_and_ready:0	"Vereint und bereit"
LUX_united_and_ready_desc:0	"Vereint sind wir stärker, vereinigt sind wir zu allem bereit!"
LUX_strike_the_german_threat:0	"Schlagen Sie die [GER.GetAdjectiveCap]-Bedrohung"
LUX_strike_the_german_threat_desc:0	"[GER.GetNameDefCap] bedroht das Tiefland schon zu lange. Wir werden sofort zuschlagen und uns endlich von der Bedrohung durch die Invasion befreien."
LUX_resisted_federalisation:0	"Hat sich der Föderalisierung widersetzt"
LUX_regional_development:0	"Regionale Entwicklung"
LUX_regional_development_desc:0	"Wir sind auf erste Grenzen für unsere Wirtschaft gestoßen. Es gibt einfach nicht genug erschlossenes Land, um darauf Fabriken zu bauen. Die Erschließung solcher Gebiete hat nun Priorität."
LUX_dreams_of_federation:0	"Träume von einer Föderation"
LUX_dreams_of_federation_desc:0	"Aus der relativen Bedeutungslosigkeit kommend, haben wir nun die Möglichkeit, etwas wirklich Spektakuläres zu tun: Vereinigen Sie die Lowlands zu einem einzigen Land!"
LUX_merge_industries:0	"Fusionieren Sie die Industrien"
LUX_merge_industries_desc:0	"Die neue Nation war lange Zeit getrennt, wir müssen ihre Industrie wieder zusammenführen, damit wir wirklich eins sind."
LUX_fortify_border_regions:0	"Befestigen Sie die Grenzregionen"
LUX_fortify_border_regions_desc:0	"Wir sind von potenziellen Bedrohungen umgeben, bereiten wir uns auf eine Invasion vor, nur für den Fall."
LUX_establish_free_university:0	"Kostenlose Grundschulbildung"
LUX_establish_free_university_desc:0	"Die neue Größe unserer Wirtschaft hat es uns ermöglicht, eine kostenlose Grundschulbildung für alle einzuführen."
LUX_agressive_stance:0	"Aggressive Außenpolitik"
LUX_agressive_stance_desc:0	"Obwohl die wichtigsten Länder der Lowlands vereinigt sind, gibt es immer noch viele Völker, die sich dieser Nation anschließen wollen. Diese Völker müssen wieder geeint werden."
LUX_establish_european_claims:0	"Europäische Ansprüche geltend machen"
LUX_establish_european_claims_desc:0	"Wir sind eine europäische Nation mit vielen unserer Völker in Europa, die von fremden Mächten beherrscht werden. Sie werden befreit und in diese neue Nation aufgenommen."
LUX_announce_colonial_claims:0	"Koloniale Ansprüche ankündigen"
LUX_announce_colonial_claims_desc:0	"Die Niederlande und Belgien standen lange Zeit im Schatten der Großmächte. Jetzt, da wir selbst den Anspruch erheben können, eine zu sein, können wir unseren Einfluss in Übersee ausweiten."
LUX_greater_benelux:0	"Die Große Benelux-Föderation"
LUX_restore_neutrality:0	"Neutralität wiederherstellen"
LUX_restore_neutrality_desc:0	"Wir haben erreicht, was wir wollten. Wir können in den Zustand der Neutralität zurückkehren und wissen, dass wir uns verteidigen können."
LUX_total_neutrality:0	"Vollständige Neutralität einführen"
LUX_total_neutrality_desc:0	"Wenn es uns mit der Neutralität ernst ist, können wir uns nicht zurückhalten und sollten die totale Neutralität erklären, damit wir nicht angegriffen werden."
LUX_fair_economy:0	"Eine faire Wirtschaft"
LUX_fair_economy_desc:0	"Viele entrechtete Menschen haben die Wahl entschieden. Wir müssen auf sie eingehen und die Wirtschaft fairer gestalten, um unsere Wählerbasis zu sichern und einfach das Richtige zu tun."
LUX_promote_small_businesses:0	"Fördern Sie kleine Unternehmen"
LUX_promote_small_businesses_desc:0	"Große Unternehmen brauchen unsere Unterstützung nicht, daher müssen wir uns auf kleinere Unternehmen konzentrieren, um sie über Wasser zu halten."
LUX_expand_social_net:0	"Erweitern Sie das soziale Netz"
LUX_expand_social_net_desc:0	"Den Bedürftigen zu helfen, bringt nicht nur mehr Menschen zurück in die Wirtschaft, sondern ist auch eine populäre Politik."
LUX_ensure_minimum_wage:0	"Den Mindestlohn sichern"
LUX_ensure_minimum_wage_desc:0	"Mindestlöhne bringen Sicherheit für das Einkommen, stabilisieren das Wirtschaftswachstum und helfen allen."
LUX_legislative_reforms:0	"Legislative Reformen"
LUX_legislative_reforms_desc:0	"Wir haben endlich die Möglichkeit, die Verfassung zugunsten des Proletariats zu ändern, so dass es die Möglichkeit erhält, die Zukunft von [ROOT.GetNonIdeologyName] zu gestalten."
LUX_abolish_monarchy:0	"Abschaffung der Monarchie"
LUX_abolish_monarchy_desc:0	"Zu lange haben die Gespenster der Vergangenheit dieses Land heimgesucht. Die Monarchie war ein wesentlicher Faktor, der uns davon abgehalten hat, wahre Gleichheit zu erreichen, wir werden sie jetzt abschaffen."
LUX_erase_monarchist_legacy:0	"Unsere monarchistische Vergangenheit auslöschen"
LUX_erase_monarchist_legacy_desc:0	"Monarchien haben das Proletariat immer unterdrückt, sie verkörpern alles, was wir ablehnen. Jetzt ist es an der Zeit, ihr Erbe endlich zu zerstören."
LUX_grant_citizenship:0	"Gewähren Sie den Royals die Staatsbürgerschaft"
LUX_grant_citizenship_desc:0	"Auch wenn sie das Land seit Jahrtausenden zu Unrecht regiert haben, verdienen sie eine Chance, sich in die sozialistische Vision dieser Nation zu integrieren."
LUX_socialist_volunteers:0	"Sozialistische Freiwillige"
LUX_socialist_volunteers_desc:0	"Wir Sozialisten sind nicht nur eine nationale Bewegung, unsere Ideen erstrecken sich über Kontinente und alle Klassen. Gemeinsam sind wir unaufhaltsam."
LUX_lessons_from_spain:0	"Unterstützen Sie die spanische Sache"
LUX_lessons_from_spain_desc:0	"Wir haben im Spanischen Bürgerkrieg brillant gekämpft, wir können unser gesammeltes Wissen nutzen, um uns zu Hause besser zu verteidigen."
LUX_begin_collective_ownership_campaign_tt:0	"In §H2 Jahren§!, wird dieser nationale Geist §Hupgraded§! zu sein:"
LUX_find_new_trade_partners_tt:0	"Dieser Nationalgeist wird §Hentfernt§! werden, sobald wir §G15§! §HCivilen Fabriken§! haben."
LUX_find_new_trade_partners_autarky_tt:0	"In §H1 Jahr§! wird dieser Nationalgeist §Hreplaced§! by:"
LUX_oust_capitalists:0	"Stürzen Sie die Kapitalisten"
LUX_oust_capitalists_desc:0	"Der Kapitalismus unterdrückt die Arbeiter, stärkt die Autokratie und schafft Klassenkonflikte. Dem müssen wir ein Ende setzen."
LUX_elevate_trade_unions:0	"Erhöhen Sie die Gewerkschaften"
LUX_elevate_trade_unions_desc:0	"Die Gewerkschaften von [ROOT.GetNameDef] kämpfen schon seit langem für die Rechte der Arbeiter. Sie müssen für ihre Arbeit für die Revolution anerkannt und ausgezeichnet werden."
LUX_begin_collective_ownership_campaign:0	"Beginnen Sie mit der Kollektivierung"
LUX_begin_collective_ownership_campaign_desc:0	"Wie Marx selbst gesagt hat: Die Produktionsmittel müssen vom Proletariat beschlagnahmt werden. Jetzt, wo das Proletariat das Land regiert, kann es auch die Wirtschaft regieren."
LUX_struggle_for_equality:0	"Der Kampf um Gleichheit"
LUX_struggle_for_equality_desc:0	"Kein Sieg ist leicht. So ist es auch mit unserem Ziel, wahre Gleichheit zu erreichen. Wir müssen hart kämpfen, um dieses Ziel zu erreichen!"
LUX_find_new_trade_partners:0	"[GetCommunistTradePartnerFocusName]"
LUX_find_new_trade_partners_desc:0	"Um uns ein für alle Mal von unserer wirtschaftlichen Abhängigkeit zu befreien, müssen wir Wege finden, unsere eigenen Rohstoffe zu produzieren oder billigere Handelsabkommen zu schließen."
LUX_peoples_university:0	"Errichten Sie die Volksuniversität"
LUX_peoples_university_desc:0	"Das Bildungswesen ist seit langem ein von der Bourgeoisie dominierter Bereich. Dies kann durch die Gründung einer Akademie für und durch das Volk geändert werden."
LUX_unite_the_country:0	"Das Land vereinen"
LUX_unite_the_country_desc:0	"Nach all den politischen Maßnahmen der letzten Jahre können wir das Land endlich als geeint bezeichnen. Das Volk ist jetzt durch die sozialistische Arbeiterrevolution geeint!"
LUX_abandon_the_foolish_policy:0	"Abkehr von der törichten Politik"
LUX_abandon_the_foolish_policy_desc:0	"Neutralität ist mehr als untauglich in einer Welt der Konflikte und des Klassenkampfes. Diese Politik der Vergangenheit wird das Gedeihen von [ROOT.GetNameDef] und seines Volkes nur behindern."
LUX_european_revolution:0	"Treiben Sie die europäische Revolution voran"
LUX_european_revolution_desc:0	"Wir sind das Herz Europas, wir werden jetzt auch das Herz der europäischen Revolution sein."
LUX_follow_moscow_line:0	"Folgen Sie der Moskauer Linie"
LUX_follow_moscow_line_desc:0	"Der wahre Sozialismus kann nur durch die Zusammenarbeit mit der Internationalen erreicht werden. Wir müssen uns mit [SOV.capital.GetCapitalVictoryPointName] verbünden, damit der Sozialismus erreicht werden kann."
LUX_expand_conscription_tt:0	"Ändern Sie entweder §HPolitisierte Armee§! oder §H[ROOT.GetAdjectiveCap] Rote Armee§! um\nRekrutierbare Bevölkerung: §H+1.50%§!"
LUX_revolutionise_army:0	"Revolutionieren Sie die Armee"
LUX_revolutionise_army_desc:0	"Um unsere Kontrolle über die Armee zu sichern, müssen wir sie in unsere Ideologie einbinden."
LUX_incorporate_political_comissars:0	"Politische Kommissare einbinden"
LUX_incorporate_political_comissars_desc:0	"Als Teil unserer Regierung muss auch die Armee dem Sozialismus unterworfen werden. Wir können uns ihrer Loyalität versichern, indem wir politische Kommissare auf Positionen innerhalb der Streitkräfte ernennen."
LUX_true_red_army:0	"Eine echte Rote Armee"
LUX_true_red_army_desc:0	"Die Hauptaufgabe der Armee ist die Verteidigung des Volkes, des Sozialismus und der internationalen Revolution."
LUX_expand_conscription:0	"Ausweitung der Wehrpflicht"
LUX_expand_conscription_desc:0	"Die Revolution muss sich selbst verteidigen und sie braucht mehr Männer, um sie zu verteidigen. Es lohnt sich, einen Teil der Arbeitskräfte für diese Aufgabe zu verpflichten."
LUX_expand_benelux_trigger_tt:0	"Ist die §HBeneluxian Socialist Union§!"
LUX_found_secret_service:0	"unseren Geheimdienst gegründet"
LUX_found_secret_service_desc:0	"Wir werden unserem großen Verbündeten von [SOV.GetNameDef] folgen und unsere eigene Geheimpolizei gründen, damit die Revolution auf lange Sicht erfolgreich ist."
LUX_expand_via_capabilities:0	"Erweitern Sie die VIA"
LUX_expand_via_capabilities_desc:0	"Wir müssen sicherstellen, dass die VIA über genügend Fähigkeiten verfügt, um Bedrohungen für die internationale Revolution angemessen zu neutralisieren."
LUX_invade_benelux:0	"In die Benelux-Staaten einmarschieren"
LUX_invade_benelux_desc:0	"Als kleines Land werden wir nicht in der Lage sein, uns selbst zu verteidigen, wenn wir nicht expandieren und eine transnationale Einheit bilden."
LUX_bring_revolution_south:0	"Bringen Sie die Revolution in den Süden"
LUX_bring_revolution_south_desc:0	"Als ständige Bedrohung unserer Unabhängigkeit wird [FRA.GetNameDef] jetzt zurücktreten und in die Internationale gebracht werden."
LUX_head_east:0	"Kopf nach Osten"
LUX_head_east_desc:0	"[GER.GetNameDefCap] wird nun von seiner unterdrückerischen Regierung befreit, so dass das Volk endlich frei sein wird."
LUX_expand_benelux:0	"Erweitern Sie unsere Union"
LUX_expand_benelux_desc:0	"Es ist nur natürlich, dass eine Nation, die aus der Vielfalt geboren wurde, in der Lage ist, mehr Land zu integrieren. Wir werden dies mit einigen eroberten Staaten tun."
LUX_socialist_science:0	"Pionier der sozialistischen Wissenschaft"
LUX_socialist_science_desc:0	"Die Wissenschaft soll nun auch eine neue Grenze für den Fortschritt des Volkes in eine strahlende, sozialistische Zukunft sein. Die kapitalistische Vergangenheit muss hinter uns gelassen werden."
LUX_comintern_research_exchange:0	"Kominterner Forschungsaustausch"
LUX_comintern_research_exchange_desc:0	"Als internationale Ideologie arbeiten die Kommunisten zusammen, um etwas zu schaffen, das größer ist als jeder Einzelne für sich. Dies ist besonders für Wissenschaftler nützlich."
LUX_adopt_soviet_policies:0	"Verabschiedung der [SOV.GetAdjectiveCap]-Politik"
LUX_adopt_soviet_policies_desc:0	"Der frühere Vorsitzende der Partei hat bei der Angleichung an die Komintern und ihre Politik nachgeholfen. Das soll sich nun unter dem neuen Vorsitzenden ändern."
LUX_follow_destalinisation:0	"Entstalinisierung verfolgen"
LUX_follow_destalinisation_desc:0	"Der neue Kurs ist klar: Umkehrung aller stalinistischen Politiken der Vergangenheit. Dieser Kurswechsel nach dem Tod von Stalin wird hier in [ROOT.GetNameDef] übernommen."
LUX_establish_personality_cult:0	"Einen Personenkult etablieren"
LUX_establish_personality_cult_desc:0	"Die großen Führer von [ROOT.GetNonIdeologyName] sollen für das geehrt werden, was sie für diese nun große Nation getan haben."
LUX_increase_defense_production:0	"Erhöhen Sie die Verteidigungsproduktion"
LUX_increase_defense_production_desc:0	"Als relativ wehrloses Land ist es unerlässlich, unseren Fortbestand durch eine Verteidigungsinfrastruktur zu sichern."
LUX_bastion_of_antifascism:0	"Bastion des Antifaschismus"
LUX_bastion_of_antifascism_desc:0	"[ROOT.GetNameDefCap] war schon immer ein Schmelztiegel für alle Arten von Ideologien und politischem Aktivismus. Wir müssen noch einen Schritt weiter gehen und offen dazu aufrufen, dass antifaschistische Freiwillige nach [ROOT.GetNonIdeologyName] kommen und unsere Streitkräfte unterstützen."
LUX_lead_the_opposition:0	"Führen Sie die Opposition an"
LUX_lead_the_opposition_desc:0	"Was uns an Einigkeit fehlt, machen wir durch Entschlossenheit wett! Die internationale Opposition gegen [SOV.capital.GetCapitalVictoryPointName] soll jetzt vereint werden, damit wir die [SOV.GetAdjectiveCap] Hegemonie stürzen können."
LUX_destroy_stalinism:0	"Zerstört den Stalinismus"
LUX_destroy_stalinism_desc:0	"Stalin ist ein Faschist und verdient es, wie ein solcher behandelt zu werden. Wir müssen uns zusammentun, um die Bedrohung zu besiegen, die der Stalinismus für die internationale sozialistische Bewegung darstellt."
LUX_attack_alliance_francaise:0	"Greifen Sie die Alliance Française an"
LUX_attack_alliance_francaise_desc:0	"Die Alliance Française ist ein Instrument, das unsere [GER.GetAdjectiveCap] Sprache und unsere Abstammung untergräbt. Sie muss gestoppt werden."
LUX_raid_french_stores:0	"Plündern Sie französische Läden"
LUX_raid_french_stores_desc:0	"Dieses Land wird von Aristokraten regiert, die von [FRA.GetNameDef] unterstützt werden. Wenn wir ihre Machtbasis, die [FRA.GetAdjectiveCap] Läden und Geschäfte, zerstören, können wir davon ausgehen, dass wir auch die Macht der schwachen Regierung untergraben."
LUX_rejuvenate_the_luxembourgish_identity:0	"Die nationale Identität wiederbeleben"
LUX_rejuvenate_the_luxembourgish_identity_desc:0	"Wenn die [LUX.GetNameDef] erhalten bleiben und weiterleben soll, müssen wir die [LUX.GetAdjective] nationale Identität wiederbeleben, denn ohne eine klare [LUX.GetAdjective] nationale Identität gäbe es auch keine [LUX.GetNonIdeologyName]!"
LUX_rejuvenate_the_luxembourgish_identity_tt:0	"Ändern Sie entweder §HAnti-French Sentiments§! oder §HAll-Luxembourgish Societies§! by\nStability: §G+5.00%§!\nTägliche Unterstützung der Demokratie: §R-0.02§!\n\n"
LUX_fully_counter_french_influence:0	"Vollständig gegen [FRA.GetAdjectiveCap]Einfluss"
LUX_fully_counter_french_influence_desc:0	"Um unsere Nation zu bewahren, sind [FRA.GetAdjectiveCap] Einflüsse nicht willkommen, da sie die Identität unserer Nation als Ganzes untergraben. [LUX.GetNonIdeologyName] ist [GER.GetAdjectiveCap]!"
LUX_integrate_french_organisations:0	"Integrieren Sie [FRA.GetAdjectiveCap] Organisationen"
LUX_integrate_french_organisations_desc:0	"Auch wenn diese Organisationen ein Werkzeug der [FRA.GetAdjectiveCap] sind, muss dieses Land die Bedeutung anerkennen, die die [FRA.GetAdjectiveCap] Sprache in unserer Geschichte und Kultur gehabt hat."
LUX_found_lnp:0	"Die LNP gründen"
LUX_found_lnp_desc:0	"Um politische Unterstützung und Anerkennung zu erhalten, brauchen wir einen politischen Flügel unserer Bewegung. Die Gründung einer Partei wird uns helfen, diese Ziele zu erreichen."
LUX_request_german_funding:0	"Beantragen Sie [GER.GetAdjectiveCap] Finanzierung"
LUX_request_german_funding_desc:0	"Da wir bald ein Teil von [GER.GetNameDef] sein werden, können wir diesen Prozess beschleunigen, indem wir Finanzmittel erhalten, um die Vereinheitlichung schneller voranzutreiben."
LUX_utilise_lvj:0	"Unterstützen Sie die LVJ"
LUX_utilise_lvj_desc:0	"Die Luxemburger Volksjugend, oder einfach nur Volksjugend, ist ein Verein der nächsten Generation von guten [GER.GetAdjectiveCap] Kindern, die bereit sind, sich für ihr Volk einzusetzen. Sie haben in der Vergangenheit große Erfolge erzielt, ein Grund mehr, sie zu unterstützen."
LUX_utilise_dennemeyer:0	"Nutzen Sie Dennemeyer"
LUX_utilise_dennemeyer_desc:0	"Camille Dennemeyer ist ein Propaganda-Genie. Er kann die Massen mobilisieren und sie auf Linie bringen. Sein Fachwissen ist unerlässlich, um das Land unter der [GER.GetAdjectiveCap]-Flagge zu vereinen."
LUX_subvert_armed_forces:0	"Unterwandern Sie die Streitkräfte"
LUX_subvert_armed_forces_desc:0	"Jede Regierung braucht die Unterstützung der Armee. Wir auch, also sollten wir sie schon jetzt auf unsere Seite bringen, damit wir später nicht die Kontrolle verlieren."
LUX_organise_street_rallies:0	"Organisieren Sie Straßenkundgebungen"
LUX_organise_street_rallies_desc:0	"In einer Demokratie haben Proteste und Kundgebungen großen Einfluss. Wir können dies nutzen und die Menschen unter der Flagge des [GER.GetAdjectiveCap] Volkes versammeln."
LUX_replace_the_government:0	"Ersetzen Sie die schwache Regierung"
LUX_replace_the_government_desc:0	"Die bisherige Regierung ist schwach und hat nur ihre eigenen Ziele verfolgt. Das hat dazu geführt, dass das Volk zurückgelassen und seiner Identität beraubt wurde. Das muss jetzt geändert werden!"
LUX_politicise_army_tt:0	"Zwei zufällige Generäle gewinnen:§H Politisch verbunden§!\n - Anführer Erfahrung gewinnen: §R-10.0%§!\n - Beförderungskosten: §G-50.0%§!"
LUX_kratzenbergs_luxemburg:0	"Kratzenbergs Luxemburg"
LUX_kratzenbergs_luxemburg_desc:0	"Damian Kratzenberg hat das Volk von [ROOT.GetNameDef] in ein neues Zeitalter geführt, ein Zeitalter des Deutschtums. Er ist der perfekte Kandidat für die weitere Führung von [ROOT.GetNameDef]."
LUX_complete_integration:0	"Vollständige Integration"
LUX_complete_integration_desc:0	"Auch wenn wir eine Geschichte der Unabhängigkeit hinter uns haben, liegt die Zukunft von [ROOT.GetNameDef] in [GER.GetNameDef]. Wir müssen so schnell wie möglich integriert werden, um der totalen [GER.GetAdjectiveCap]-Einigung und Herrschaft näher zu kommen."
LUX_expand_the_gau:0	"Erweitern Sie den Gau"
LUX_expand_the_gau_desc:0	"Unser rechtmäßiger Platz ist in [GER.GetNameDef], doch wir bleiben einigermaßen autonom. Als solcher können wir uns mit anderen [GER.GetAdjectiveCap] westlich des Rheins zusammenschließen, um eine größere industrielle Basis zu erhalten."
LUX_request_further_expansion:0	"Antrag auf weitere Expansion"
LUX_request_further_expansion_desc:0	"Als Gau Moselland können wir viel Kontrolle über die Region ausüben. Wir können sogar noch einflussreicher werden, indem wir die Kontrolle über den nördlichen Rhein beantragen."
LUX_annex_conquered_lands:0	"Eroberte Länder annektieren"
LUX_annex_conquered_lands_desc:0	"Der Krieg läuft großartig, als benachbarte Entität ist es unsere Aufgabe, uns mit den [GER.GetAdjectiveCap] im Westen zu vereinigen."
LUX_industrialise_west_rhine:0	"Industrialisieren Sie den Westrhein"
LUX_industrialise_west_rhine_desc:0	"Die Wälder westlich des Rheins haben viel unindustrialisiertes Land hinterlassen. Wir können das ändern und unsere Industrie und Waffenproduktion ausbauen, indem wir diese leeren Flächen nutzen."
LUX_german_intellect:0	"Nutzen Sie den deutschen Intellekt"
LUX_german_intellect_desc:0	"Wir [GER.GetAdjective]s sind die Spitze des Intellekts, unsere Wissenschaftler können Dinge erreichen, von denen andere nur träumen können. Es ist an der Zeit, dass wir dies nutzen und unsere Forschungslabors ausbauen."
LUX_aid_the_warmachine:0	"Helfen Sie der Warmachine"
LUX_aid_the_warmachine_desc:0	"Da der Krieg weitergeht, müssen wir uns auf die militärische Produktion verlegen. Wenn wir unseren Teil zur Verteidigung des Vaterlandes und zum Ausbau der [GER.GetNonIdeologyName] beitragen, wird der Führer höchst erfreut sein."
LUX_establish_ss:0	"SS aufstellen"
LUX_establish_ss_desc:0	"Die SS ist ein wichtiger Teil des Staatsapparates in [GER.GetNameDef]. Ihr Einfluss muss auf [ROOT.GetNameDef] ausgeweitet werden, damit unsere Feinde ausgerottet werden."
LUX_professionalise_army:0	"Professionalisieren Sie die Armee"
LUX_professionalise_army_desc:0	"Preußen ist gleichbedeutend mit Professionalität. Unsere Geschichte ist geprägt von den großen Soldaten, die für ihr Vaterland gekämpft haben. Dieses Erbe muss geehrt und fortgeführt werden."
LUX_politicise_army:0	"Politisieren Sie die Armee"
LUX_politicise_army_desc:0	"Wir Nationalsozialisten müssen die Armee als eine Erweiterung des Staates und nicht als eine separate Einheit betrachten."
LUX_maneuver_warfare:0	"Manövrierfähige Kriegsführung"
LUX_maneuver_warfare_desc:0	"Die Zukunft der Kriegsführung liegt in Geschwindigkeit und Panzerung. Um den Sieg zu erringen, müssen diese Aspekte unserer Armee gestärkt werden."
LUX_unbeaten_in_battle:0	"Ungeschlagen in der Schlacht"
LUX_unbeaten_in_battle_desc:0	"Wir [GER.GetAdjectiveCap]s haben nicht ein einziges Mal eine Schlacht verloren. Diese Tradition werden wir beibehalten, damit wir den endgültigen Sieg erringen können."
LUX_arrest_dennemeyer:0	"Arrest Dennemeyer"
LUX_arrest_dennemeyer_desc:0	"Auch wenn er ein Befürworter des Nationalsozialismus ist, hat er eine große Anhängerschaft und ist daher gefährlich und muss beseitigt werden."
LUX_kratzenbergs_luxemburg_tt:0	"§RVerhindert uns daran, die Autonomie über§! §HReichsprotektorat§!§R.§!"
LUX_invalidate_election_unfinished_tt:0	"§RDieser Teil des Fokusbaums ist unvollendet und daher derzeit nicht zugänglich. Er wird in einem späteren Update hinzugefügt werden.§!"
LUX_build_luxembourg_city_airport:0	"Bauen Sie [ROOT.capital.GetCapitalVictoryPointName] Flughafen"
LUX_build_luxembourg_city_airport_desc:0	""
LUX_the_monegasque_air_fleet:0	"Die [ROOT.GetAdjective] Luftflotte"
LUX_the_monegasque_air_fleet_desc:0	""
LUX_torpedo_bombers:0	"Torpedo-Bomber"
LUX_torpedo_bombers_desc:0	"Torpedo-Bomber"
LUX_lessons_of_the_great_war:0	"Lehren aus dem Großen Krieg"
LUX_lessons_of_the_great_war_desc:0	""
LUX_weaponary_modernization:0	"Modernisierung der Waffensysteme"
LUX_weaponary_modernization_desc:0	""
LUX_recruit_marines:0	"Marines rekrutieren"
LUX_recruit_marines_desc:0	""
LUX_develop_special_forces:0	"Entwicklung von Spezialkräften"
LUX_develop_special_forces_desc:0	""
LUX_the_luxembourg_industrial_fund:0	"Der [ROOT.GetNonIdeologyName] Industriefonds"
LUX_the_luxembourg_industrial_fund_desc:0	""
LUX_luxembourg_military_insituite:0	"[ROOT.GetNonIdeologyName] Militärisches Institut"
LUX_luxembourg_military_insituite_desc:0	""
LUX_the_grand_university_of_luxembourg_city:0	"Die Große Universität von [ROOT.Capital.GetCapitalVictoryPointName]"
LUX_the_grand_university_of_luxembourg_city_desc:0	""
LUX_economic_mobilization:0	"Wirtschaftliche Mobilisierung"
LUX_economic_mobilization_desc:0	""
LUX_encourage_local_arms_production:0	"Förderung der lokalen Waffenproduktion"
LUX_encourage_local_arms_production_desc:0	""
LUX_resource_commission:0	"Ressourcen-Kommission"
LUX_resource_commission_desc:0	""
LUX_the_roars_of_thunder:0	"Das Brüllen des Donners"
LUX_the_roars_of_thunder_desc:0	""
LUX_introduce_motorization_technologies:0	"Motorisierungstechnologien einführen"
LUX_introduce_motorization_technologies_desc:0	""
LUX_the_steel_lions:0	"Die Stählernen Löwen"
LUX_the_steel_lions_desc:0	""
LUX_develop_our_dockyards:0	"Unsere Werften entwickeln"
LUX_develop_our_dockyards_desc:0	""
LUX_develop_indigenous_models:0	"Einheimische Modelle entwickeln"
LUX_develop_indigenous_models_desc:0	""
LUX_the_big_guns:0	"Die großen Kanonen"
LUX_the_big_guns_desc:0	""
LUX_monegasque_naval_academy:0	"[ROOT.GetAdjective] Marine-Akademie"
LUX_monegasque_naval_academy_desc:0	""
luxembourg.1.t:0	"Eine Einladung in die Benelux-Staaten"
luxembourg.1.d:0	"Luxemburg ist zwar ein kleines Land, hat sich aber in den letzten Jahren aufgrund der zunehmend kriegerischen Haltung seiner Nachbarn politisch sehr engagiert. Premierminister Joseph Bech hat dafür plädiert, dass sich die Flachlandländer zusammenschließen sollten, bevor über unser Schicksal entschieden wird."
luxembourg.1.a:0	"Ein Toast auf die Benelux-Union!"
luxembourg.1.b:0	"Ein Bündnis? Lächerlich!"
luxembourg.2.t:0	"[From.GetName] tritt der Benelux-Union bei"
luxembourg.2.d:0	"[From.GetLeader] hat zugestimmt, der Union beizutreten, unser Bündnis wird stärker!"
luxembourg.2.a:0	"Lasst uns feiern!"
luxembourg.3.t:0	"[From.GetName] Lehnt unser Angebot ab."
luxembourg.3.d:0	"Unsere Diplomaten sind von [From.GetName] mit traurigen Nachrichten zurückgekehrt; trotz unserer Bemühungen wird es kein Bündnis geben."
luxembourg.3.a:0	"Dann können sie alleine sterben."
luxembourg.10.t:0	"Luxemburg will sich uns anschließen"
luxembourg.10.d:0	"Damian Kratzenberg hat Diplomaten nach Berlin geschickt, um die mögliche Mitgliedschaft Luxemburgs in der Achse zu erörtern. Obwohl es sich um eine winzige Nation handelt, sind sie sehr daran interessiert."
luxembourg.10.a:0	"Ein weiterer Verbündeter im Kampf für den deutschen Nationalismus!"
luxembourg.10.b:0	"Ihr Schutz wird sie etwas kosten."
luxembourg.10.c:0	"Luxem- was nun?"
luxembourg.11.t:0	"Deutschland nimmt an!"
luxembourg.11.d:0	"Gesandte aus Berlin sind in Luxemburg-Stadt eingetroffen, um das Bündnis Luxemburgs mit den Achsenmächten zu besprechen, es ist ein Tag großer Feierlichkeiten!"
luxembourg.11.a:0	"Ruhm für den Führer!"
luxembourg.12.t:0	"Deutschland nimmt an..."
luxembourg.12.d:0	"Gesandte aus Berlin sind in Luxemburg-Stadt eingetroffen, um über die teilweise Eingliederung Luxemburgs in das Deutsche Reich zu verhandeln. Es scheint, als hätte sich der Deal geändert."
luxembourg.12.a:0	"Ein kleiner Preis für den Schutz."
luxembourg.13.t:0	"Deutschland lehnt ab."
luxembourg.13.d:0	"Unsere Briefe bleiben unbeantwortet, unsere Diplomaten werden abgewiesen, es scheint, als hätten die Nazis Wichtigeres zu tun als das Schicksal unserer Nation."
luxembourg.13.a:0	"Verdammt seien sie alle."
luxembourg.14.t:0	"Die Wahlen von 1937."
luxembourg.14.d:0	"Trotz der Gewitterwolken, die sich in der ganzen Welt zusammenbrauen, geht es in der luxemburgischen Politik immer weiter. Bei den bevorstehenden Wahlen von 1937 werden die Rietspartei und die Sozialdemokraten eine hohe Wahlbeteiligung erzielen. Das von der konservativen Partei vorgeschlagene Maulkuerfgesetz, das die wachsende Popularität und Stimme der KPL eindämmen soll, hat sich jedoch nicht als so populär erwiesen wie erwartet. [ROOT.GetLeader] hat das Schicksal des Gesetzes von einem Referendum abhängig gemacht. Es wird davon ausgegangen, dass die endgültige Abstimmung für das Referendum hauchdünn ausfallen wird."
luxembourg.14.d.alt:0	"Trotz der Gewitterwolken, die sich in der ganzen Welt zusammenbrauen, geht die Politik in Luxemburg immer weiter. Bei der bevorstehenden Wahl von 1937 werden die Rietspartei und die Sozialdemokraten eine hohe Wahlbeteiligung erreichen. Da die Rietspartei vor kurzem das Maulkuerfgesetz verabschiedet hat, kann [ROOT.GetLeader] mit Hilfe einer der rechten Minderheitsparteien seine Führungsrolle behalten."
luxembourg.14.a:0	"Das Referendum scheitert."
luxembourg.14.b:0	"Das Referendum ist erfolgreich."
luxembourg.14.c:0	"Politik ist ein lustiges Spiel."
luxembourg.200.t:0	"Die Gewerkschaften organisieren sich"
luxembourg.200.d:0	"Nach der Verschiebung des Gesetzes über den Nationalen Arbeitsrat im Dezember letzten Jahres hat die Regierung viel Gegenwind von der Opposition und der Bevölkerung erhalten. Jetzt haben die Gewerkschaften einen Streik organisiert. Dieses Thema hat auch die christlichen und sozialistischen Gewerkschaften vereint, was zu einem großen Protest mit 40.000 Teilnehmern geführt hat. Sie fordern die sofortige Rücknahme der Verzögerung. Das würde die Einrichtung des Nationalen Arbeitsrates, eines Schlichtungsorgans, die gesetzliche Anerkennung der Gewerkschaften sowie eine allgemeine Lohnerhöhung zur Folge haben."
luxembourg.200.a:0	"Sie haben nicht ganz Unrecht."
luxembourg.200.b:0	"Wir lassen uns nicht zur Unterwerfung zwingen."
luxembourg.201.t:0	"Das Referendum über das Maulkuerfgesetz"
luxembourg.201.d:0	"Der Kommunismus ist eine Bedrohung für Luxemburg! Der Premierminister hat den Aufstieg des Kommunismus seit dem Ersten Weltkrieg beobachtet. Die KPL hatte bei den Wahlen 1934 einen ersten Wahlerfolg erzielt, als sie einen Sitz in der Abgeordnetenkammer erringen konnte. Premierminister Bech hatte genug und erklärte das Ergebnis für ungültig.\n\n In dem Versuch, die luxemburgische Politik endgültig von den Kommunisten zu befreien, hat Joseph Bech ein neues Gesetz, das Maulkuerfgesetz, durchgesetzt. Es passierte die Abgeordnetenkammer, aber der Premierminister beschloss, ein Referendum abzuhalten und das Volk über das Schicksal des Gesetzes entscheiden zu lassen. In einer schockierenden Wendung der Ereignisse scheitert das Referendum knapp, wodurch das Gesetz gestoppt und die KPL über Wasser gehalten wird.\n\nJoseph Bech hat sich geäußert und seinen Rücktritt nach der Neuwahl erklärt. Alles in allem war dies ein massiver Rückschlag für die Konservativen."
luxembourg.201.a:0	"Das Volk hat gesprochen."
luxembourg.202.t:0	"Das Maulkuerfgesetz"
luxembourg.202.d:0	"Der Kommunismus ist eine Bedrohung für Luxemburg! Der Premierminister hat den Aufstieg des Kommunismus seit dem Ersten Weltkrieg beobachtet. Die KPL hatte bei den Wahlen 1934 einen ersten Wahlerfolg erzielt, als sie einen Sitz in der Abgeordnetenkammer erringen konnte. Premierminister Bech hatte genug und erklärte das Ergebnis für ungültig.\n\nHeute versucht Joseph Bech erneut, den Kommunismus in Luxemburg zu schwächen. Seine Regierung hat ein Gesetz, das Maulkuerfgesetz, vorgeschlagen, das alle Parteien verbieten würde, die versuchen, die Verfassung zu untergraben, und damit auch die KPL. Die Abgeordnetenkammer hat für das Gesetz gestimmt und es ist damit in Kraft getreten. Aber wir können immer noch ein Referendum abhalten, um festzustellen, ob das Volk es will."
luxembourg.202.a:0	"Es muss verabschiedet werden, zum Teufel mit der Demokratie!"
luxembourg.202.b:0	"Wir müssen das Volk fragen, also bereiten Sie ein Referendum vor."
luxembourg.210.t:0	"Bevorstehende Wahlen"
luxembourg.210.d:0	"Die Wahlen von 1937 rücken näher. Es heißt, dass diese Wahl wie keine andere zuvor über die Zukunft Luxemburgs entscheiden wird. Der Kontinent ist alles andere als friedlich und Luxemburg muss möglicherweise seine Neutralität aufgeben.\n\nZur Wahl stehen die Sitze in der Abgeordnetenkammer, dem Parlament von [ROOT.GetNonIdeologyName]. Die politischen Parteien, die an der Wahl teilnehmen, sind die konservative PD, die derzeit das Land regiert, die sozial-liberale PRL, die ebenfalls an der Regierung ist, die sozialistische/sozialdemokratische LSAP und die kommunistische KPL. Alle diese Parteien können von der Regierung unterstützt werden, was es ihnen ermöglicht, Wahlkampf zu machen. Aber Vorsicht, es ist auch notwendig, die Wahlbeteiligung und das Vertrauen der Wähler aufrechtzuerhalten, denn sonst könnte die Wahl für ungültig erklärt werden, was zum Ausgangspunkt für andere, extremere Ideologien werden könnte, um die [ROOT.GetNonIdeologyName] zu übernehmen.\n Nichtsdestotrotz beginnen die Politiker der verschiedenen Parteien ihre Kampagnen und touren durch das Land. Lassen Sie uns sehen, wie die Wahlen verlaufen."
luxembourg.210.a:0	"Bereiten Sie die Wahllokale vor."
luxembourg.211.t:0	"Rietspartei gewinnt die Wahl!"
luxembourg.211.d:0	"Die Dominanz der Rietspartei hält an. Sie kann nun einen weiteren Wahlerfolg zu ihren Erfolgen zählen.\nDer einzige kleine Dämpfer scheint das Scheitern des Maulkuerfgesetzes und der anschließende Rücktritt von Joseph Bech gewesen zu sein.\n\n Nichtsdestotrotz wird die neue Regierung, die nun von Pierre Dupong geführt wird, auf einen reibungslosen Machtwechsel hoffen können."
luxembourg.211.a:0	"Ein weiterer konservativer Begriff."
luxembourg.212.t:0	"Die Radikal-Liberale Partei gewinnt die Wahl!"
luxembourg.212.d:0	"Mit diesem Wahlerfolg wird die PRL endlich die Partei sein, die die Regierung anführt, während sie in früheren Regierungen, wie z.B. der ehemaligen Bech-Regierung, nur der Junktimpartner war.\nDie Partei wird von dem sozialliberalen Gaston Diderich angeführt, der sich als kompetenter Führer erwiesen hat, seit sich seine Parteilinie gegenüber den eher klassisch-liberalen Einflüssen durchsetzen konnte.\n\nZunächst wird er jedoch gemeinsam mit seiner Partei gefeiert und in den kommenden Wochen als Premierminister vereidigt."
luxembourg.212.a:0	"Die Bemühungen der Partei werden endlich belohnt."
luxembourg.213.t:0	"Die LSAP gewinnt die Wahl!"
luxembourg.213.d:0	"Trotz ihrer Wahlerfolge in der Vergangenheit waren die luxemburgischen Sozialdemokraten noch nie in der Lage, eine Regierung zu führen oder an ihr teilzunehmen. Das ändert sich mit dem heutigen Tag, an dem die LSAP zum ersten Mal überhaupt eine Mehrheit bei einer Wahl erhält.\n Die Parteiführung hat bereits versprochen, ihre Wahlversprechen umzusetzen. Wenn das der Fall ist, scheint die Zukunft für Luxemburg rosig zu sein!"
luxembourg.213.a:0	"Eine neue Ära für das Land!"
luxembourg.214.t:0	"Die KPL gewinnt die Wahl!"
luxembourg.214.d:0	"Die kommunistische Partei hat die jüngsten Wahlen in einer noch nie dagewesenen Art und Weise gewonnen! Da nicht einmal Experten dieses Ergebnis vorausgesagt hatten, sind viele Menschen, vor allem aus der Oberschicht, entweder aus dem Land geflohen oder haben ihr Vermögen ins Ausland verlagert. Es ist ungewiss, wie es mit dem Land weitergehen wird, da Charles Marx ein ausgesprochener Gegner der Monarchie ist."
luxembourg.214.a:0	"Das Volk hat wirklich gesprochen."
luxembourg.215.t:0	"Wahlergebnisse unentschlossen "
luxembourg.215.d:0	"Nach der Wahl haben viele Menschen die Wahlergebnisse in Frage gestellt. Wir haben keine Gewissheit, dass sie repräsentativ für das luxemburgische Volk sind. Nur wenige Menschen können jetzt etwas tun. Wir könnten weitermachen wie bisher, aber das würde zu einer großen öffentlichen Gegenreaktion führen. Wir könnten aber auch die Großherzogin einspringen lassen und die Regierung für eine Weile als Übergangsregierung übernehmen. Oder unsere großen Nachbarn könnten sich einmischen und unsere Situation ausnutzen..."
luxembourg.215.a:0	"Irgendjemand muss eingreifen!"
luxembourg.216.t:0	"Rufen Sie Neuwahlen aus?"
luxembourg.216.d:0	"Nachdem die KPL verboten wurde, wächst die Kritik an der Regierung. Viele haben das Maulkuerfgesetz als undemokratisch oder verfassungswidrig bezeichnet. Es ist klar, dass etwas getan werden muss.\n\nNun nimmt eine neue Idee in der Regierung Gestalt an. [ROOT.GetLeader] könnte eine vorgezogene Neuwahl ausrufen, ohne dass die anderen Parteien viel Zeit hätten, sich darauf vorzubereiten. Da die PD die größte politische Partei von [ROOT.GetNameDef] ist, wäre ihr der Sieg bei einer solchen Wahl fast sicher. Wir müssten uns eine Erklärung für unser Vorgehen einfallen lassen, aber es ist möglich."
luxembourg.216.a:0	"Es ist die einzige Chance für [ROOT.GetNonIdeologyName], so zu überleben, wie wir es kennen."
luxembourg.216.b:0	"Wir sollten uns nicht auf solche schmutzigen Tricks verlassen."
LUX_elections_PD_winner_tt:0	"§2Rietspartei§! hat die Wahl gewonnen!"
LUX_elections_PRL_winner_tt:0	"§YRadikal-Liberale Partei§! hat die Wahl gewonnen!"
LUX_elections_LSAP_winner_tt:0	"§0Lëtzebuerger Sozialistesch Aarbechterpartei§! hat die Wahlen gewonnen!"
LUX_elections_KPL_winner_tt:0	"§tKommunistesch Partei vu Lëtzebuerg§! hat die Wahl gewonnen!"
luxembourg.220.t:0	"[LUX.GetNameDefCap] will den Vertrag von London bekräftigen"
luxembourg.220.d:0	"Nach der stetigen Zunahme der weltweiten Spannungen hat [LUX.GetNameDef] erhebliche Anstrengungen unternommen, um neutral zu bleiben. Jetzt hat es sich an uns gewandt und möchte den Vertrag von London aus dem Jahr 1867 bekräftigen, der die Neutralität des Landes und seine Unabhängigkeit von allen Unterzeichnern garantierte.\n\n Wir können ihrer Bitte nachkommen und den Frieden in [LUX.GetNonIdeologyName] bewahren, aber das würde mit dem Preis einhergehen, das Land im Falle eines Krieges verteidigen zu müssen."
LUX_reaffirm_treaty_of_london_accept_tt:0	"Wir werden §Hgarantieren§! Luxemburg und §Hverteidigen§! im Falle eines §Rkrie§!."
luxembourg.220.a:0	"Natürlich werden wir das akzeptieren."
luxembourg.220.b:0	"Wir können uns jetzt noch nicht festlegen."
luxembourg.221.t:0	"[FROM.GetNameDefCap] hat unseren Vorschlag angenommen."
luxembourg.221.d:0	"Das [FROM.GetAdjectiveCap] Außenministerium hat uns telegrafisch die großartige Nachricht überbracht: Wir haben die Unterstützung von [FROM.GetNameDefCap] erhalten! Ein großer Schritt in Richtung unseres Endziels!"
luxembourg.221.a:0	"Prächtig."
luxembourg.222.t:0	"[FROM.GetNameDefCap] hat unseren Antrag abgelehnt."
luxembourg.222.d:0	"Traurige Nachrichten sind in unserem Außenministerium eingetroffen: [FROM.GetNameDef] wird uns nicht dabei unterstützen, den Vertrag von London zu bekräftigen.\n\n Das bedeutet, dass die ganze Sache nicht zustande kommen wird, da wir die Unterstützung aller ehemaligen Unterzeichner brauchten, um unseren Vorschlag zu legitimieren."
luxembourg.222.a:0	"Verdammte Narren!"
luxembourg.223.t:0	"Bekräftigung des Vertrags von London"
luxembourg.223.d:0	"Unsere Initiative war erfolgreich und wir haben alle ursprünglichen Unterzeichner des Londoner Vertrages von 1867 versammelt, um den Vertrag zu bekräftigen und die fortwährende Unabhängigkeit von [ROOT.GetNonIdeologyName] zu garantieren.\n\nDa [GER.GetNameDef] nicht zu den Unterzeichnern gehörte, werden wir mit ihnen einen separaten Deal abschließen müssen."
luxembourg.223.a:0	"Nichtsdestotrotz ein großer Tag für [ROOT.GetNonIdeologyName]!"
luxembourg.224.t:0	"Scheitern der Reaffirmation"
luxembourg.224.d:0	"Wir waren nah dran, nur nicht nah genug, denn die Gespräche über die Bestätigung des Londoner Vertrags sind gescheitert, da einige ehemalige Unterzeichner unseren Vorschlag nicht unterschreiben wollen.\n\n Wir können jetzt nur hoffen, dass [ROOT.GetNonIdeologyName] eine bessere Zeit mit unserer größten aktuellen Bedrohung, [GER.GetNameDef], haben wird."
luxembourg.224.a:0	"Wir waren so nah dran."
luxembourg.225.t:0	"Bekräftigung des Vertrags von London"
luxembourg.225.d:0	"[LUX.GetNonIdeologyName] hat gerade die erfolgreiche Bestätigung des ursprünglich 1867 unterzeichneten Vertrags von London und die Garantie der immerwährenden Neutralität des kleinen Landes bekannt gegeben. Dies wird dem Land zweifellos helfen, seine Unabhängigkeit zu bewahren, da es nun unter dem Schutz mehrerer Großmächte steht.\n\nDie Hoffnungen sind groß, dass dies den Prozess der Rückkehr Europas zu einem friedlicheren Zustand einleiten wird. Zweifellos werden sich viele andere Länder daran ein Beispiel für ihre eigene diplomatische Ausrichtung nehmen.\n\nDieser Tag gehört [LUX.GetNonIdeologyName] und sie werden ihre neu gefundene Sicherheit feiern."
luxembourg.225.a:0	"Ein großer Schritt für [LUX.GetNonIdeologyName] und ganz Europa."
luxembourg.225.b:0	"Ein notwendiger Schritt für den Frieden."
luxembourg.226.t:0	"Das Scheitern des neuen Vertrags von London"
luxembourg.226.d:0	"Wir wurden nach [LUX.capital.GetCapitalVictoryPointName] eingeladen, um eine mögliche Bestätigung des Londoner Vertrags von 1867 zu diskutieren. Nun hat uns der [LUX.GetAdjectiveCap] Außenminister mitgeteilt, dass der Vertrag nicht zustande kommen wird, da einige potenzielle Unterzeichner sich geweigert haben, ihn zu unterzeichnen.\n\n Wir können nun abreisen und nach [ROOT.capital.GetCapitalVictoryPointName] zurückkehren. Diese Wendung der Ereignisse ist ein Zeichen für die Zukunft Europas, denn ein möglicher Ansatzpunkt zur Beruhigung der Spannungen ist nun nicht mehr vorhanden."
luxembourg.226.a:0	"Wahrlich ein trauriger Tag für Europa als Ganzes."
luxembourg.226.b:0	"[LUX.GetNonIdeologyName] ist ohnehin nicht schützenswert."
luxembourg.228.t:0	"[LUX.GetNameDefCap] ist unter Beschuss"
luxembourg.228.d:0	"Mit dem Angriff auf [LUX.GetNameDef] müssen wir uns entscheiden, ob wir sie verteidigen wollen oder nicht. Als Unterzeichner des Londoner Vertrags sind wir verpflichtet, ihnen zu Hilfe zu kommen und ihnen zu helfen, unabhängig zu bleiben. Damit gehen wir jedoch das Risiko ein, in einen Krieg hineingezogen zu werden, den wir nicht führen können. Wenn wir unbeteiligt bleiben, könnten wir auch als unzuverlässiger Verbündeter bekannt werden, was unsere eigenen Aussichten im Ausland beeinträchtigen kann."
luxembourg.228.a:0	"[LUX.GetNonIdeologyName] soll verteidigt werden!"
luxembourg.228.b:0	"Das geht uns nichts an."
luxembourg.250.t:0	"Die Früchte unserer Arbeit"
luxembourg.250.d:0	"Wir wussten, dass die Umstellung unserer Wirtschaftspolitik auf eine kollektivierte Politik schwierig sein würde. Wir wussten, dass die Menschen eine Eingewöhnungsphase brauchen würden. Wir wussten, dass es bürgerlichen Widerstand gegen die Beschlagnahme der Produktionsmittel geben würde.\n\nDoch wir, das Proletariat von [ROOT.GetNonIdeologyName], haben durchgehalten und uns durchgesetzt. Durch unsere harte Arbeit, durch die Arbeit von Tausenden von talentierten Arbeitern, Intellektuellen und Planern, können wir die revolutionierte Wirtschaft als vollendet bezeichnen."
luxembourg.250.a:0	"Wir existieren im Kontext all dessen, in dem wir leben und was vor uns war."
luxembourg.270.t:0	"Eine neue außenpolitische Doktrin"
luxembourg.270.d:0	"Mit dem Scheitern unserer Verhandlungen über eine mögliche Bestätigung des Londoner Vertrags befindet sich unser Land in einer sehr verwundbaren Lage. Zweifellos gibt es ausländische Pläne, [ROOT.GetNonIdeologyName] entweder zu destabilisieren oder zu erobern. In dem Bemühen, dieses Problem zu lösen, hat sich unser Außenminister an den Premierminister gewandt und eine neue Vorgehensweise vorgeschlagen. Er sieht vor, sowohl [GER.GetNameDef] als auch [FRA.GetNameDef], unsere mächtigsten Nachbarn, anzusprechen und ihre Unterstützung für ein neutrales und unabhängiges [ROOT.GetNameDef] zu gewinnen.\n\nDieser Vorschlag ist jedoch nicht ohne Risiken. Ein weiterer Misserfolg wird uns auf der Weltbühne spürbar schwächen, während ein Erfolg immer noch als Bruch unserer völligen Neutralität ausgelegt werden könnte."
luxembourg.270.a:0	"Lassen Sie uns diese Bemühungen fortsetzen."
luxembourg.270.b:0	"Es ist die Mühe nicht wert."
luxembourg.271.t:0	"[FROM.GetNameDefCap] Fordert Garantie"
luxembourg.271.d:0	"Nach dem kürzlichen Scheitern der Bestätigung des Vertrags von London aus dem Jahr 1867 scheint es, als sei [LUX.GetNameDef] nicht untätig gewesen.\n\n Sie sind an uns herangetreten und haben um eine Garantie ihrer Unabhängigkeit gebeten. Das wäre eine einfache Sache, aber der Vorschlag schließt auch [GER.GetNameDef] mit ein. Wir werden darauf achten müssen, das Gleichgewicht der Kräfte in der Region zu wahren und unsere eigenen Interessen zu fördern."
luxembourg.271.a:0	"Dafür brauchen wir unsere Unterstützung."
luxembourg.271.b:0	"Wir sollten den militärischen Zugang als Ausgleich fordern."
luxembourg.271.c:0	"[ROOT.GetNonIdeologyName] wird [FROM.GetNonIdeologyName] nicht verteidigen."
luxembourg.272.t:0	"[FROM.GetNameDefCap] bittet um Garantie"
luxembourg.272.d:0	"Nach dem jüngsten Scheitern der Bestätigung des Londoner Vertrags von 1867 scheint es, als sei [LUX.GetNameDef] nicht untätig gewesen.\n\nSie sind an uns herangetreten und haben um eine Garantie ihrer Unabhängigkeit gebeten. [FRA.GetNameDefCap] ist neben uns eingeladen. Um sicherzustellen, dass wir auch etwas davon haben, können wir eine Art Wiedergutmachung verlangen, auch wenn sie das vielleicht nicht akzeptieren."
luxembourg.272.a:0	"Ja, wie auch immer."
luxembourg.272.b:0	"Lassen Sie uns dafür sorgen, dass es auch für uns von Vorteil ist."
luxembourg.272.c:0	"Wir werden uns nicht für die Unabhängigkeit eines anderen Landes einsetzen."
luxembourg.273.t:0	"[FROM.GetNameDefCap] hat bedingungslos zugestimmt"
luxembourg.273.d:0	"Es scheint, dass [FROM.GetNameDef] uns nicht im Stich gelassen hat, denn sie haben unsere Bitte akzeptiert, ohne eigene Forderungen zu stellen. Viele unserer Diplomaten sind erleichtert über dieses Ergebnis, denn sie haben vorausgesagt, dass es die größte Hürde sein wird, [FROM.GetNonIdeologyName] zur Unterzeichnung des Paktes zu bewegen."
luxembourg.273.a:0	"Gute Nachrichten."
luxembourg.274.t:0	"[FROM.GetNonIdeologyName] schickt Forderungen"
luxembourg.274.d:0	"Was viele befürchtet hatten, ist eingetreten: [FROM.GetNonIdeologyName] hat sich nicht strikt geweigert, uns zu schützen, aber sie haben Forderungen gestellt, Truppen in [ROOT.GetNonIdeologyName] zu stationieren. In unserem Außenministerium gibt es bereits Stimmen, die den Abbruch der Gespräche fordern, aber auch viele, die davor warnen, dass dies unsere einzige verbleibende Chance ist, weiter zu überleben."
luxembourg.274.a:0	"Wir müssen uns ihren Forderungen beugen."
luxembourg.274.b:0	"Wir können unsere Neutralität nicht aufgeben."
luxembourg.275.t:0	"[FROM.GetNameDefCap] hat sich geweigert, uns zu schützen"
luxembourg.275.d:0	"In den letzten Stunden ist klar geworden, dass [FROM.GetNonIdeologyName] kein Interesse daran hat, unsere kleine Nation zu schützen. Ohne ein bilaterales Abkommen wird jede Garantie von [GER.GetNameDef] nichts zählen."
luxembourg.275.a:0	"Wir könnten jetzt für die Geschichte verloren sein."
luxembourg.276.t:0	"[FROM.GetNameDefCap] hat keine Forderungen gestellt"
luxembourg.276.d:0	"Unerwartete Nachrichten erreichen uns von unseren Diplomaten in [FROM.capital.GetCapitalVictoryPointName]. [FROM.GetNameDefCap] hat sich bereit erklärt, [ROOT.GetNameDef] zu schützen, ohne eigene Forderungen zu stellen. So unerwartet das auch sein mag, es ist auch sehr hilfreich."
luxembourg.276.a:0	"Eine Überraschung, gewiss, aber eine willkommene."
luxembourg.277.t:0	"[FROM.GetNameDefCap] bittet Soldaten"
luxembourg.277.d:0	"Während der Verhandlungen über die Bedingungen des [FROM.GetAdjectiveCap] Schutzes haben sie 2000 Männer gefordert, die in ihrer Armee dienen sollen. Das mag ihnen wie eine kleine Zahl erscheinen, aber für uns ist es eine große. Außerdem werden wir dadurch stärker an ihre zukünftige Politik gebunden, da unsere Bürger in ihrer Armee dienen werden."
luxembourg.277.a:0	"Ein notwendiges Übel für unsere weitere Existenz."
luxembourg.277.b:0	"Wir können solchen Forderungen nicht nachgeben."
luxembourg.277.c:0	"Wir haben einfach nicht die Männer dafür."
luxembourg.278.t:0	"[FROM.GetNameDefCap] wird uns nicht schützen"
luxembourg.278.d:0	"Leider hat [FROM.GetNameDef] angekündigt, dass er uns nicht schützen wird. Auf diesen Ausgang der Verhandlungen haben wir uns vorbereitet, aber wir haben keine andere Wahl. Wir müssen einfach sicherstellen, dass wir auf das vorbereitet sind, was als nächstes kommt."
luxembourg.278.a:0	"Das erwartete Ergebnis."
luxembourg.279.t:0	"Erfolg der Verhandlungen"
luxembourg.279.d:0	"Wir, oder besser gesagt unsere Diplomaten, haben es geschafft. Sie haben [GER.GetNameDef] und [FRA.GetNameDef] dazu gebracht, unsere Unabhängigkeit zu garantieren und uns im Falle eines Krieges zu schützen!\n\nDies hat [ROOT.GetNonIdeologyName] bereits Stabilität gebracht, doch die Zukunftsaussichten unserer Diplomatie werden durch dieses Ergebnis besonders gestärkt. Der Außenminister hat inoffiziell eine Party im Anschluss an seinen Erfolg angekündigt und der Premierminister wird eine Rede in der Abgeordnetenkammer halten.\n\nAlles in allem können wir zuversichtlich feststellen, dass das Scheitern unserer Verhandlungen um den Vertrag von London zwar vorübergehend einen Stich versetzt hat, aber wir haben durchgehalten und eine neue Lösung gefunden."
luxembourg.279.a:0	"Die Zukunft sieht gut aus für [ROOT.GetNameDef]!"
luxembourg.280.t:0	"Scheitern der Verhandlungen"
luxembourg.280.d:0	"Unser Außenministerium hat eine weitere gescheiterte Verhandlungsrunde zu verzeichnen. Als wahrscheinlich wichtigster Vertrag der letzten Jahre wird dieser in die Geschichtsbücher als der letzte Nagel in unserem Sarg eingehen.\n\nWir müssen jedoch weitermachen und sicherstellen, dass wir auf alles vorbereitet sind, was als Nächstes kommen mag. Immerhin: Mir wëlle bleiwe wat mir sinn."
luxembourg.280.a:0	"Ein dunkler Tag für [ROOT.GetNonIdeologyName]"
luxembourg.281.t:0	"Erfolgreiche Gespräche mit [FROM.GetNonIdeologyName]"
luxembourg.281.d:0	"Nachrichten von [FROM.capital.GetCapitalVictoryPointName] haben unsere Hauptstadt erreicht, die Verhandlungen um den Schutz von [FROM.GetNameDef] sind gut verlaufen und es wurden verschiedene Verträge unterzeichnet, die die Zukunft unserer Beziehungen bestimmen.\n\nAuch wenn diese Gespräche riskant sind, haben sie [GER.GetNameDef] und [FRA.GetNameDef] beim Schutz der kleinen Nation zusammengebracht. Es bleibt abzuwarten, ob dies für alle Unterzeichner von Vorteil sein wird oder ob ein zukünftiges Ereignis das Kräfteverhältnis in die eine oder andere Richtung verschiebt."
luxembourg.281.a:0	"Ein wünschenswertes Ergebnis."
luxembourg.282.t:0	"Gescheiterte Gespräche mit [FROM.GetNonIdeologyName]"
luxembourg.282.d:0	"Die Gespräche sind abgeschlossen, aber es wurde noch nichts unterzeichnet. [FROM.GetNameDef] wird noch eine Weile ungeschützt bleiben. Nach den bereits gescheiterten Verhandlungen um den Vertrag von London ist dies ein weiterer Rückschlag für [FROM.GetNameDef].\n\nEs bleibt abzuwarten, wie sich dies auf die Zukunft des Kontinents auswirken wird, wenn überhaupt."
luxembourg.282.a:0	"Nichts ist verloren, nichts ist gewonnen."
LUX_will_fail_negotiations_tt:0	"§Das wird zum Scheitern der Verhandlungen führen.§!"
luxembourg.230.t:0	"[FROM.GetNameDefCap] fordert Garantien"
luxembourg.230.d:0	"[FROM.GetNameDefCap] haben vor kurzem ihre Neutralität aufgegeben, da eine neue Regierung die Wahl gewinnen konnte. Offensichtlich können sie sich nicht selbst verteidigen, was bedeutet, dass sie früher oder später Schutz suchen würden.\n\nDieser Tag scheint gekommen zu sein, denn ein [FROM.GetAdjectiveCap] Diplomat hat [ROOT.GetAdjectiveCap] Schutz gegen Bedrohungen ihrer Unabhängigkeit und Souveränität angefordert."
luxembourg.230.a:0	"Wir werden sie schützen."
luxembourg.230.b:0	"[ROOT.GetNameDefCap] ist nicht bereit, sich zu verpflichten."
luxembourg.231.t:0	"[FROM.GetNameDefCap] hat zugestimmt, uns zu schützen"
luxembourg.231.d:0	"Als unser Diplomat zurückkehrt, teilt er uns mit, dass [FROM.GetNameDef] sich bereit erklärt hat, uns zu beschützen.\n\nDiese großartigen Neuigkeiten verbreiten sich bereits im ganzen Land und es wird erwartet, dass sie morgen auf der Titelseite der Nachrichten erscheinen werden."
luxembourg.231.a:0	"Das ist eine Erleichterung."
luxembourg.232.t:0	"[FROM.GetNameDefCap] wird uns nicht beschützen"
luxembourg.232.d:0	"Die diplomatische Erklärung erreicht uns per Telegraf. [FROM.GetNameDef] hat uns mitgeteilt, dass sie uns nicht schützen werden, da sie nicht bereit sind, sich auf solche Abkommen einzulassen."
luxembourg.232.a:0	"Das ist bedauerlich."
luxembourg.240.t:0	"[FROM.GetNameDefCap] will die Benelux-Länder föderalisieren"
luxembourg.240.d:0	"Die Idee ist schon seit vielen Jahren im Umlauf, aber sie wurde nie umgesetzt. Nach der Gründung der Benelux scheint [FROM.GetAdjectiveCap] nun endlich den Entschluss gefasst zu haben, die Vereinigung der Lowlands voranzutreiben.\n\nEine Annahme eines solchen Vorschlags würde die Existenz von [ROOT.GetNameDef] beenden, könnte aber zu einer Stärkung der Lowlands insgesamt führen.\n Auf jeden Fall müssen wir diese Angelegenheit sorgfältig abwägen, denn hier steht die Zukunft der Lowlands auf dem Spiel."
luxembourg.240.a:0	"Stärke in der Einheit!"
luxembourg.240.b:0	"Wir werden unsere Unabhängigkeit nicht aufgeben."
luxembourg.241.t:0	"[FROM.GetNameDefCap] hat der Föderalisierung zugestimmt"
luxembourg.241.d:0	"Endlich ist der große Tag der Vereinigung gekommen, denn die Delegierten von [FROM.GetNameDef] haben dem Premierminister mitgeteilt, dass sie sich zur Benelux-Föderation zusammenschließen werden.\n\nAuch wenn der grobe Papierkram bereits geregelt ist, gibt es noch einige ungelöste Fragen, wie zum Beispiel die Zukunft der Monarchie."
luxembourg.241.a:0	"Ein großer Tag für uns alle."
luxemourg.242.t:0	"[FROM.GetNameDefCap] wird nicht der Union beitreten"
luxembourg.242.d:0	"Trotz unserer Lobbyarbeit für diese Sache hat [FROM.GetNameDef] den Beitritt zu einer Benelux-Föderation abgelehnt. Wir können nur hoffen, dass ihre Entscheidung sowohl für sie als auch für uns gut ausgeht.\n\nEs gibt noch Hoffnung, dass wir die Lowlands verteidigen können, wir müssen um jeden Preis durchhalten!"
luxembourg.242.a:0	"Unglücklich."
luxembourg.243.t:0	"Die Benelux-Föderation"
luxembourg.243.d:0	"Nach langwierigen Verhandlungen mit unseren Verbündeten konnten wir endlich den Durchbruch erzielen, den wir so dringend benötigten. Die Entscheidung ist gefallen und die Vorbereitungen sind bereits im Gange, die Benelux-Föderation ist endlich gegründet.\n\nEs ist ein Tag von großer Bedeutung für die Zukunft der Lowlands und ganz Europas und wird als ein Tag großer Freude und politischer Zusammenarbeit in die Geschichtsbücher eingehen. Möge es uns gelingen, unseren Nachfolgern eine gute Welt zu schaffen!"
luxembourg.243.a:0	"Benelux-Föderation. Ja, das hört sich gut an."
luxembourg.244.t:0	"Die gescheiterte Föderation"
luxembourg.244.d:0	"Unsere erschöpften Diplomaten kehren von den Gesprächen über die Wiedervereinigung zurück. Sie haben den Premierminister bereits über ihr Scheitern informiert.\n\n Endlich wird [ROOT.GetNonIdeologyName] genau das bleiben, [ROOT.GetNameDef] und nicht etwas Größeres. Jetzt, da unser wichtigstes Ziel nicht erreicht wurde, müssen wir unsere Außenpolitik neu kalibrieren."
luxembourg.244.a:0	"Wir haben versagt."
luxembourg.350.t:0	"Nazi-Übernahme in [LUX.GetNonIdeologyName]"
luxembourg.350.d:0	"Aus [LUX.GetOldNameDef] erreichen uns Nachrichten, dass der großherzogliche Palast von deutschen Nazis gestürmt wurde. Sie konnten dies nur durchziehen, weil diese Gruppe in den letzten Monaten erheblich an Unterstützung gewonnen hat. Es bleibt abzuwarten, ob diese neue Regierung in der Lage sein wird, die Kontrolle über das Land zu behalten. \n\n[GER.GetNameDefCap] hat bereits Truppen in ihrem neuen Vasallenstaat stationiert, den sie eng in ihre Nation integrieren will. Nur die Zeit wird zeigen, ob sich das Kräfteverhältnis in Europa dadurch erheblich verschieben wird und ob [LUX.GetNonIdeologyName] in einigen Jahren überhaupt noch ein Land sein wird."
luxembourg.350.a:0	"Wir wünschen ihnen das Beste."
luxembourg.350.b:0	"Betreffend."
luxembourg.260.t:0	"[FROM.GetNameDefCap] fordert die Invasion von [PREV.GetNameDef]"
luxembourg.260.d:0	""
luxembourg.260.a:0	"Alles für die Revolution."
luxembourg.260.b:0	"Diese Invasion wird nicht zugelassen."
luxembourg.261.t:0	"[FROM.GetNameDefCap] hat der Invasion zugestimmt"
luxembourg.261.d:0	""
luxembourg.261.a:0	"Lang lebe die Revolution!"
luxembourg.262.t:0	"[FROM.GetNameDefCap] will nicht, dass wir einmarschieren"
luxembourg.262.d:0	""
luxembourg.262.a:0	"Wir können nichts tun."
luxembourg.263.t:0	"[FROM.GetNameDefCap] will die Benelux-Staaten einnehmen"
luxembourg.263.d:0	""
luxembourg.400.t:0	"[FROM.GetNameDefCap] will mehr Land verwalten"
luxembourg.400.d:0	""
luxembourg.400.a:0	"Alles für unsere [ROOT.GetAdjectiveCap] Brüder."
luxembourg.400.b:0	"Das würde das [ROOT.GetAdjectiveCap] Volk schwächen."
luxembourg.401.t:0	"[FROM.GetNameDefCap] hat unseren Vorschlag angenommen"
luxembourg.401.d:0	""
luxembourg.401.a:0	"Dann lasst uns an die Arbeit gehen."
luxembourg.402.t:0	"[FROM.GetNameDefCap] hat unseren Vorschlag abgelehnt"
luxembourg.402.d:0	""
luxembourg.402.a:0	"Ein echter Rückschlag für den Gau."
luxembourg.405.t:0	"[FROM.GetNameDefCap] will weiter expandieren"
luxembourg.405.d:0	""
luxembourg.405.a:0	"Alles für unsere [ROOT.GetAdjectiveCap] Brüder."
luxembourg.405.b:0	"Das würde das [ROOT.GetAdjectiveCap] Volk schwächen."
luxembourg.406.t:0	"[FROM.GetNameDefCap] hat unseren Vorschlag angenommen"
luxembourg.406.d:0	""
luxembourg.406.a:0	"Dann lassen Sie uns an die Arbeit gehen."
luxembourg.407.t:0	"[FROM.GetNameDefCap] hat unseren Vorschlag abgelehnt"
luxembourg.407.d:0	""
luxembourg.407.a:0	"Ein echter Rückschlag für den Gau."
luxembourg.410.t:0	"[FROM.GetNameDefCap] fordert die Besetzung von [965.GetName]"
luxembourg.410.d:0	""
luxembourg.410.a:0	"Wir werden die Last auf sie abwälzen."
luxembourg.410.b:0	"[ROOT.GetNameDefCap] braucht alle besetzten Ländereien für sich selbst."
luxembourg.411.t:0	"[FROM.GetNameDefCap] hat [965.GetName] übertragen."
luxembourg.411.d:0	""
luxembourg.411.a:0	"Ein weiterer Schritt in Richtung [ROOT.GetAdjectiveCap] Herrschaft."
luxembourg.412.t:0	"[FROM.GetNameDefCap] wird [965.GetName] nicht übertragen."
luxembourg.412.d:0	""
luxembourg.412.a:0	"Ein kleiner Rückschlag."
luxembourg.415.t:0	"[FROM.GetNameDefCap] fordert die Übertragung unserer [BEL.GetAdjectiveCap] Besatzung"
luxembourg.415.d:0	""
luxembourg.415.a:0	"Wir können ihnen nicht verweigern, was ihnen gehört."
luxembourg.415.b:0	"[BEL.GetAdjectiveCap] Land gehört rechtmäßig [ROOT.GetAdjectiveCap]."
luxembourg.416.t:0	"[FROM.GetNameDefCap] hat ihr [BEL.GetAdjectiveCap] Land übertragen"
luxembourg.416.d:0	""
luxembourg.416.a:0	"Sie haben weise gewählt."
luxembourg.417.t:0	"[FROM.GetNameDefCap] wird sich nicht von [BEL.GetNonIdeologyName] zurückziehen"
luxembourg.417.d:0	""
luxembourg.417.a:0	"Verflucht seien sie!"
luxembourg.420.t:0	"[FROM.GetNameDefCap] will [HOL.GetAdjectiveCap] Land besetzen"
luxembourg.420.d:0	""
luxembourg.420.a:0	"Lasst uns ihnen ihren Wunsch erfüllen."
luxembourg.420.b:0	"Wir werden unsere eroberten Ländereien nicht aufgeben."
luxembourg.421.t:0	"[FROM.GetNameDefCap] hat ihre [HOL.GetAdjectiveCap] Ländereien übertragen"
luxembourg.421.d:0	""
luxembourg.421.a:0	"Prächtig!"
luxembourg.422.t:0	"[FROM.GetNameDefCap] hat unsere Bitte abgelehnt"
luxembourg.422.d:0	""
luxembourg.422.a:0	"Unglücklich."
luxembourg.425.t:0	"[FROM.GetNameDef] hat um [FRA.GetAdjectiveCap] Land gebeten"
luxembourg.425.d:0	""
luxembourg.425.a:0	"Wir haben sowieso keine Verwendung für diese Ländereien."
luxembourg.425.b:0	"Sie werden zu mächtig!"
luxembourg.426.t:0	"[FROM.GetNameDefCap] hat unserer Bitte nachgegeben"
luxembourg.426.d:0	""
luxembourg.426.a:0	"Unsere neuen Ländereien werden die Nation stärken."
luxembourg.427.t:0	"[FROM.GetNameDefCap] hat unsere Bitte ignoriert"
luxembourg.427.d:0	""
luxembourg.427.a:0	"Schade, wir werden sie auf andere Weise bekommen."
LUX_charlotte_desc:0	"Mit der Verfassung von 1919 wurden die Befugnisse der Herzogin auf eine rein zeremonielle Funktion reduziert. Trotzdem bleibt Großherzogin Charlotte eine beliebte Figur der [ROOT.GetNameDef] Demokratie und der fortgesetzten Unabhängigkeit."
r56_LUX_charles_marx:0	"Karl Marx"
LUX_camille_dennemeyer:0	"Camille Dennemeyer"
LUX_prince_jean:0	"Prinz Jean"
r56_LUX_evacuate_the_treasury:0	"Evakuierte Schatzkammer"
r56_LUX_operation_bastogne:0	"Operation Bastogne"
r56_LUX_royalist_militarism:0	"Königlicher Militarismus"
r56_LUX_creative_military_solutions:0	"Fallschirmjäger-Doktrin"
r56_LUX_our_own_destiny:0	"Unser eigenes Schicksal"
r56_LUX_embrace_autarky:0	"Luxemburger Autarkie"
r56_LUX_favor_the_royalist:0	"Royalistische Verschanzung"
r56_LUX_favor_the_fasicts:0	"Eingegliederte Jugendgruppen"
r56_legacy_of_luxembourg_crisis:0	"Das Erbe der Luxemburg-Krise"
r56_legacy_of_luxembourg_crisis_desc:0	"Luxemburg verfolgt seit der Luxemburg-Krise von 1867 eine Politik der Neutralität. Die deutsche Besetzung unseres Landes im Ersten Weltkrieg und die jüngsten Aufrüstungskampagnen haben jedoch dazu geführt, dass die Unterstützung für die Neutralität erodiert ist."
r56_lux_stand_agaisnt_authoritarianism:0	"Widerstand gegen Autoritarismus"
r56_LUX_politcal_safe_heaven:0	"Politischer Schutzhimmel"
r56_LUX_coaltition_with_kpl:0	"Erhöhte Gewerkschaften"
r56_LUX_strengthen_rietspartei_position:0	"Erhöhte Technokraten"
r56_LUX_armed_republic:0	"Gesetz zur Landesverteidigung"
r56_LUX_export_our_doctrine:0	"Luxemburger Politische Agenten"
r56_LUX_export_our_doctrine_native:0	"Unsere Doktrin exportieren"
r56_LUX_export_our_doctrine_native_LaR:0	"Exportieren Unserer Doktrin"
lux_victor_idea:0	"Lux Victor!"
lux_victor_idea_desc:0	"Wir wurden gewogen, gemessen und nicht für unzulänglich befunden. Lang leben die Herzogin und Luxemburg!"
auxiliaries_idea:0	"Hilfskräfte"
auxiliaries_idea_desc:0	"Am Vorabend des Krieges muss jeder kampfbereite Bürger bereit sein. Wenn wir unsere derzeitigen Streitkräfte mit Hilfstruppen verstärken, haben wir vielleicht eine Chance in dem bevorstehenden Konflikt."
gendarmerie_idea:0	"Großherzogliche Gendarmerie"
gendarmerie_idea_desc:0	"Eine Polizeibrigade sorgt für die Sicherheit unserer Zivilisten auf den Straßen und wird im Bedarfsfall zur Verteidigung der Nation herangezogen."
volunteer_army_idea:0	"Freiwillige"
volunteer_army_idea_desc:0	"Jeder Bürger muss seinen Beitrag leisten."
quality_over_quantity_idea:0	"Qualität statt Quantität"
quality_over_quantity_idea_desc:0	"Auch wenn es uns an Platz mangelt, kann die luxemburgische Handwerkskunst mit viel Mühe legendär werden, jede Kugel ein Pinselstrich und jedes Gewehr ein Meisterwerk."
foreign_experts_idea:0	"Ausländische Experten"
foreign_experts_idea_desc:0	"Indem wir die Besten und Klügsten in unsere Hallen einladen, können wir große Fortschritte in der Technologie machen, die unsere größeren Nachbarn weit übertreffen."
LUX_communism_idea:0	"Kommunistischer Einfluss"
LUX_communism_idea_desc:0	"Die Banker und Geschäftsleute der Elite haben das luxemburgische Volk schon zu lange unterdrückt. Jetzt werden wir unser Land zurückerobern!"
LUX_fascism_idea:0	"Faschistischer Einfluss"
LUX_fascism_idea_desc:0	"Unsere Nation ist unter den demokratischen Verträgen und der Demontage, die unser großes Land in eine Lachnummer verwandelt hat, eingeknickt. Nur durch nationalistischen Eifer können wir die Ehre unserer Nation wiederherstellen."
LUX_democratic_idea:0	"Demokratischer Einfluss"
LUX_democratic_idea_desc:0	"Die Zukunft Luxemburgs liegt in der Demokratie. Joseph Bech und die Rietspartei haben unser Land bis jetzt geführt und haben die volle Unterstützung des Landes."
LUX_neutrality_idea:0	"Royalistischer Einfluss"
LUX_neutrality_idea_desc:0	"Neutralität ist seit langem der Weg Luxemburgs, mit wechselndem Erfolg. Diesmal ist es nicht aus freien Stücken, sondern aus der Notwendigkeit heraus, dass wir uns von kommenden Konflikten fernhalten."
communist_neighbours:0	"Kommunistische Nachbarn"
communist_neighbours_desc:0	"Die Anwesenheit einer kommunistischen Nation in der Nähe hat auch dieses Land anfälliger für den Kommunismus gemacht."
LUX_armed_deterrence:0	"Bewaffnete Abschreckung"
LUX_armed_deterrence_desc:0	"Testen Sie Ihre Armeen an den Mauern von Luxemburg, denn es wird keine Kapitulation geben."
BEL_defense_of_the_benelux:0	"Verteidigung der Benelux-Staaten"
LUX_steel_mills:0	"Aciéries Réunies de Burbach-Eich-Dudelange"
LUX_steel_mills_desc:0	"Aciéries Réunies de Burbach-Eich-Dudelange, kurz ARBED, ist ein Stahlkonglomerat, das Anfang dieses Jahrhunderts gegründet wurde. Er entwickelte sich schnell zu einem bedeutenden Produzenten. Er ist heute in mehreren Ländern tätig und nicht nur auf Europa beschränkt."
LUX_sola:0	"Société Luxembourgeoise d'Armes"
LUX_atelier_de_petange:0	"Les Ateliers de Pétange"
LUX_hadir:0	"Hauts-Furneaux et Aciéries de Differdange, St-Ingbert, Rumelange"
LUX_esch_archette_aerodrome:0	"S.A. pour l'Aménagement et l'Exploitation de l'Aérodrome d'Esch/Alzette"
LUX_luxair:0	"Luxair"
LUX_radio_luxembourg:0	"Compagnie Luxembourgeoise de Radiodiffusion"
LUX_radio_luxembourg_desc:0	"Mit der langsamen Einführung des Radios dauerte es nicht lange, bis sich ein halblegaler Rundfunk entwickelte. Die Compagnie Luxembourgeoise de Radiodiffusion, kurz CLR, entstand aus dieser Tätigkeit heraus. Ihre Vorgänger waren wichtige Innovatoren im Bereich der Mehrsprachigkeit, was bedeutet, dass die relativ neu gegründete CLR eine glänzende Zukunft vor sich hat."
LUX_train_manufacturer:0	"Société Nationale des Chemins de Fer Luxembourgeois"
LUX_train_manufacturer_desc:0	"Dieses staatliche Unternehmen wurde gegründet, nachdem mehrere private Eisenbahngesellschaften verstaatlicht und in der Société Nationale des Chemins de Fer Luxembourgeois zusammengeschlossen wurden."
LUX_construction_company:0	"Karp-Kneip Luxemburg"
LUX_construction_company_desc:0	"Dieses 1898 von Corneille Karp-Kneip gegründete Bauunternehmen erwarb sich einen Ruf als zuverlässiger Geschäftspartner, insbesondere im Straßenbau."
LUX_lou_hemmer:0	"Lou Hemmer"
LUX_henri_stein:0	"Henri Stein"
LUX_edouard_kremmer:0	"Edouard Kremmer"
BEL_LUX_customs_union:0	"Belgisch-luxemburgische Wirtschaftsunion"
LUX_prepareforwar:0	"Auf den Krieg vorbereiten"
LUX_prepareforwar_desc:0	"Der Krieg, der alle Kriege beenden sollte, endete nicht. Während sich die Großmächte links und rechts von uns erneut mobilisieren, muss Luxemburg bereit sein, sein Volk zu verteidigen."
LUX_boostindustry:0	"Industrie ankurbeln"
LUX_boostindustry_desc:0	"Eine Nation ohne blühende Industrie wird unter ihrem eigenen Gewicht zusammenbrechen. Angesichts des drohenden Krieges ist es von größter Wichtigkeit, dass Luxemburg über eigene Mittel zur Aufrechterhaltung seiner Verteidigungsanstrengungen verfügt."
LUX_radioluxembourg:0	"Radio Luxemburg"
LUX_radioluxembourg_desc:0	"Radio Luxemburg hat seinen Sitz in unserer großartigen Stadt und ermöglicht es den Sendern, ein Publikum in ganz Europa zu erreichen und das Monopol der British Broadcasting Company zu brechen, indem es das kommerzielle Radio zurück nach Großbritannien und Irland bringt."
LUX_feierwon:0	"Feierwon"
LUX_feierwon_desc:0	"'Kommen Sie aus Frankreich, Belgien, Preußen, wir wollen Ihnen unser Vaterland zeigen, in alle Richtungen, wir wollen bleiben, was wir sind.'"
LUX_realism:0	"Realismus"
LUX_realism_desc:0	"Auch wenn Luxemburgs Geist stark ist, kann es sich nicht leisten, im Krieg eine aggressive Haltung einzunehmen. Wir werden mit großer Rücksicht auf unser Volk und unsere Neutralität vorgehen."
LUX_idealism:0	"Idealismus"
LUX_idealism_desc:0	"Passivität ist der Tod in diesen Zeiten. Wenn wir nicht zuerst handeln, werden wir von einer der Mächte, die auf uns eindringen, überrannt werden. Unter der Führung von Émile Speller wird Luxemburg nicht unterschätzt werden."
LUX_lucilinburhuc:0	" Lucilinburhuc"
LUX_lucilinburhuc_desc:0	"Die Festung Luxemburg ist seit langem der Eckpfeiler unserer Nation. Obwohl wir durch Verträge gezwungen sind, den Großteil unserer Festungsanlagen abzubauen, ist die Sicherheit unserer großen Festung jetzt mehr denn je vonnöten."
LUX_luxvictor:0	"Lux Victor"
LUX_luxvictor_desc:0	"Wir wurden gewogen, gemessen und nicht für unzulänglich befunden. Lang leben die Herzogin und Luxemburg!"
LUX_joseph_schusterline:0	"Schuster-Linie"
LUX_joseph_schusterline_desc:0	"Die Feindseligkeiten aus dem Osten müssen abgewehrt werden. Joseph Schuster hat eine Verteidigungslinie an unserer Ostgrenze ausgearbeitet, um feindliche Soldaten von unserem Territorium fernzuhalten - und unsere Souveränität zu bewahren."
LUX_grandducalgendarmerie:0	"Großherzogliche Gendarmerie"
LUX_grandducalgendarmerie_desc:0	"Eine Polizeibrigade wird die Straßen für die Zivilbevölkerung sicher halten und im Bedarfsfall zur Verteidigung der Nation herangezogen werden."
LUX_restoretheauxiliaries:0	"Wiederherstellung der Auxiliartruppen"
LUX_restoretheauxiliaries_desc:0	"Am Vorabend des Krieges muss jeder kampfbereite Bürger bereit sein. Wenn wir unsere derzeitigen Streitkräfte mit Hilfstruppen verstärken, haben wir in dem kommenden Konflikt vielleicht eine Chance."
LUX_volunteerarmy:0	"Freiwilligenarmee"
LUX_volunteerarmy_desc:0	"Luxemburg ist mehr denn je auf seine tapferen Bürger angewiesen, die sich der Pflicht stellen, unser Land gegen ausländische Bedrohungen zu verteidigen."
LUX_expandthesteelworks:0	"Erweitern Sie die Stahlwerke"
LUX_expandthesteelworks_desc:0	"Unser Land ist seit langem für seinen Qualitätsstahl berühmt. Auch wenn unsere Ressourcen begrenzt sind, wird eine erweiterte Nutzung der Stahlwerke sicherstellen, dass Luxemburg auf dem Weltmarkt wettbewerbsfähig bleibt."
LUX_modernizetherails:0	"Modernisieren Sie die Gleise"
LUX_modernizetherails_desc:0	"Die Identität unseres Landes ist mit der Eisenbahn verflochten. Die transnationalen Schienen verbinden uns mit beiden Großmächten, und es ist in unserem besten Interesse, unser Schienennetz in den kommenden Jahren zu modernisieren."
LUX_sandweilerairport:0	"Airshows unterstützen"
LUX_sandweilerairport_desc:0	"Luxemburg mag zwar klein sein und derzeit nur über eine einzige Landebahn verfügen, aber die Organisation von Flugshows könnte die Begeisterung für die Luftfahrt steigern."
LUX_war:0	"Bereit für den Krieg"
LUX_war_desc:0	"Gott schütze uns alle."
LUX_arcelormittal:0	"ARBED"
LUX_arcelormittal_desc:0	"Durch die Verstaatlichung der Stahlwerke von ARBED wird unsere kleine Nation zum Neid der Welt auf die Industrie."
LUX_beneluxair:0	"Unterstützen Sie lokale Hersteller"
LUX_beneluxair_desc:0	"Unsere einzige Hoffnung, eigene Flugzeuge zu entwickeln, besteht darin, dass wir uns auf eine Handvoll fähiger Erfinder verlassen, die über das nötige Wissen verfügen, um ausländische Konstruktionen zu kopieren und zu verbessern."
LUX_princehenrinetwork:0	"Prinz-Henri-Netzwerk"
LUX_princehenrinetwork_desc:0	"In den letzten hundert Jahren hat das Prinz-Henri-Netzwerk unserem Volk gute Dienste geleistet. Doch in den letzten Jahren sind sowohl die Gewinne gesunken als auch der Wettbewerb gestiegen. Durch die Verstaatlichung der Schienen können wir die große Effizienz erhalten, die unsere Eisenbahn in diesem modernen Jahrhundert braucht."
LUX_maximiseefficiency:0	"Maximieren Sie die Effizienz"
LUX_maximiseefficiency_desc:0	"Effizienz ist der Schlüssel, um den steigenden Bedarf unseres Landes zu decken, von der Kugel bis zum Verband, unsere Fabriken werden ohne Tadel sein."
LUX_qualityoverquantity:0	"Qualität vor Quantität"
LUX_qualityoverquantity_desc:0	"Auch wenn es uns an Platz mangelt, kann die luxemburgische Handwerkskunst mit Mühe legendär werden, jede Kugel ein Pinselstrich und jedes Gewehr ein Meisterwerk."
LUX_militaryfocus:0	"Militärischer Fokus"
LUX_militaryfocus_desc:0	"Wenn wir unsere Kriegsindustrie nicht aufbauen, wird von unserer Nation nichts übrig bleiben. Alle Anstrengungen müssen in die luxemburgische Kriegsmaschinerie fließen."
LUX_civilianfocus:0	"Ziviler Fokus"
LUX_civilianfocus_desc:0	"Unsere Menschen sind wichtiger als die Kriegsmaschinerie. Mit einer starken zivilen Industrie können wir der Bevölkerung ein Leben, wenn nicht sogar die Freiheit sichern."
LUX_foreignexperts:0	"Ausländische Experten"
LUX_foreignexperts_desc:0	"Indem wir die Besten und Klügsten in unsere Hallen einladen, können wir große Fortschritte in der Technologie machen, die unsere größeren Nachbarn weit übertreffen."
LUX_universititvultzebuerg:0	"Universitéit vu Lëtzebuerg"
LUX_universititvultzebuerg_desc:0	"Eine theoretische Universität wurde vorgeschlagen, um die besten Köpfe des Landes zu versammeln. Wir können dies Wirklichkeit werden lassen."
LUX_luxembourgcanintospace:0	"Luxemburg kann ins All"
LUX_luxembourgcanintospace_desc:0	"Wenn wir so weit gegangen sind, gibt es kein Zurück mehr."
LUX_rietspartei:0	"Rietspartei"
LUX_rietspartei_desc:0	"Die Zukunft Luxemburgs liegt in der Demokratie. Joseph Bech und die Rietspartei haben unser Land bis jetzt geführt und haben die volle Unterstützung des Landes."
LUX_strengthenties:0	"Bindungen stärken"
LUX_strengthenties_desc:0	"Die Demokratie kann nicht allein gedeihen. Wenn wir als Nation frei sein und frei bleiben wollen, müssen wir unsere Verbündeten gut auswählen."
LUX_benelux:0	"Benelux"
LUX_benelux_desc:0	"Freunde in der Not..."
LUX_protectorsofliberte:0	"Beschützer der Freiheit"
LUX_protectorsofliberte_desc:0	"Die Alliierten sind sowohl unsere Freunde als auch unsere Beschützer. Ein Bündnis mit den verbündeten Nationen ist die einzige Möglichkeit, unsere Souveränität zu schützen."
LUX_friendsnear:0	"Freunde in der Nähe"
LUX_friendsnear_desc:0	"Die Tieflandnationen sind unsere unmittelbaren Verbündeten und teilen sowohl unsere Kultur als auch unsere Sorgen. Es wäre von Vorteil, eine engere Beziehung zu ihnen aufzubauen."
LUX_friendsafar:0	"Freunde in der Ferne"
LUX_friendsafar_desc:0	"Während wir im letzten Krieg neutral geblieben sind, wurde unsere Souveränität durch die deutsche Besatzung verletzt, und erst durch die Befreiung durch die Alliierten wurden wir wieder frei. Dieses Mal werden wir die richtige Entscheidung treffen."
LUX_bastion_of_democracy:0	"Bastion der Demokratie"
LUX_bastion_of_democracy_desc:0	"Hitlers Schreckensherrschaft bedroht uns alle! Ganz Luxemburg ist geeint in dem Ziel, die Bedrohung durch den Faschismus in Europa zu beenden."
LUX_luxembourgneutrality:0	"Luxemburgs Neutralität"
LUX_luxembourgneutrality_desc:0	"Neutralität ist seit langem der Weg Luxemburgs, mit wechselndem Erfolg. Diesmal ist es nicht aus freien Stücken, sondern aus der Notwendigkeit heraus, dass wir uns von kommenden Konflikten fernhalten."
LUX_luxembourgianrevanchism:0	"Luxemburgischer Revanchismus"
LUX_luxembourgianrevanchism_desc:0	"Auch wenn es heute eine Farce ist, war Luxemburg einst eine bedeutende Nation in der Geschichte Europas, und könnte es das in diesen seltsamen Zeiten nicht wieder sein?"
LUX_theduchess:0	"Die Herzogin"
LUX_theduchess_desc:0	"Die Entscheidung, unserem Monarchen die Macht zu entziehen, war ein Fehler. In diesen unruhigen Zeiten ist der einzig wahre Führer Luxemburgs unsere Herzogin, Fir Gott an Duchesse!"
LUX_easternwinds:0	"Östliche Winde"
LUX_easternwinds_desc:0	"Die Banker und Geschäftsleute der Elite haben das luxemburgische Volk schon zu lange unterdrückt. Jetzt werden wir unser Land zurückerobern!"
LUX_supporttheright:0	"Unterstützen Sie die Rechte"
LUX_supporttheright_desc:0	"Unsere Nation ist unter den demokratischen Verträgen und der Demontage, die unser großes Land in eine Lachnummer verwandelt hat, eingeknickt. Nur durch nationalistischen Eifer können wir die Ehre unserer Nation wiederherstellen."
LUX_deterrence:0	"Abschreckung"
LUX_deterrence_desc:0	"Wir haben für unsere Anstrengungen in den vergangenen Kriegen teuer gelitten, Luxemburg hat seine Lektion gelernt. Von nun an kämpfen wir nur noch für uns selbst."
LUX_armeddeterrence:0	"Bewaffnete Abschreckung"
LUX_armeddeterrence_desc:0	"Deutschland hat nicht die Absicht, unseren neutralen Status zu respektieren, und Frankreich ist schon seit langem erpicht darauf, dass uns unsere Ländereien weggenommen werden."
LUX_kommunisteschparteiltzebuerg:0	"Kommunistische Partei Lëtzebuerg"
LUX_kommunisteschparteiltzebuerg_desc:0	"Moskau ist zu weit weg, um uns etwas zu bieten, Luxemburg und nur Luxemburg wird die Revolution nach Europa bringen."
LUX_frenchinsurrectionists:0	"Französische Insurrektionisten"
LUX_frenchinsurrectionists_desc:0	"Der Geist der Revolution ist in unseren französischen Brüdern stark, die gegenseitige Unterstützung zwischen der KPL und der französischen Kommune ist unserer Sache sicher zuträglich."
LUX_spreadtherevolution:0	"Verbreitet die Revolution"
LUX_spreadtherevolution_desc:0	"Hörst du das, belgischer Bruder und niederländische Schwester? Es ist der Klang der Revolution!"
LUX_friendsveryafar:0	"Freunde SEHR weit weg"
LUX_friendsveryafar_desc:0	"Moskau ist die Heimat des Kommunismus, ein mächtiger Verbündeter und ein würdiger Genosse, obwohl unsere Länder weit entfernt sind, ist unser Geist nahe!"
LUX_rexluxembourg:0	"Regina Luxemburg"
LUX_rexluxembourg_desc:0	"Unsere Herzogin wird sich keinem Diktator beugen! Luxemburgs glorreiche Herrschaft hat endlich begonnen."
LUX_volksdeutschebewegung:0	"Volksdeutsche Bewegung"
LUX_volksdeutschebewegung_desc:0	"Es wurden Gespräche geführt, Pläne geschmiedet. Für die Sicherheit unseres Volkes müssen wir Hitler die Hand reichen, ob wir gleichberechtigt sind oder nicht."
LUX_retakebitburg:0	"Bitburg zurückerobern"
LUX_retakebitburg_desc:0	"Die deutsche Kriegsmaschine schreckt unser tapferes Volk nicht. Wir werden unser Land zurückerobern, das die Preußen gestohlen haben, oder bei dem Versuch sterben!"
LUX_retakemoselle:0	"Mosel zurückerobern"
LUX_retakemoselle_desc:0	"Das Land, das uns gestohlen wurde, ist schon zu lange im Besitz der Franzosen. Fast 400 Jahre später wird Luxemburg dieses Unrecht wiedergutmachen."
LUX_retakeareleland:0	"Areleland zurückerobern"
LUX_retakeareleland_desc:0	"Unser grausamster Verlust durch die belgischen Revolutionäre ist noch nicht vergessen. Auch wenn die Benelux-Staaten uns zusammenhalten, kann dieses Unrecht nicht vergessen werden."
LUX_military:0	"Militärische Anstrengung"
LUX_military_desc:0	"Da unsere Industrie und unsere Infrastruktur nun der Aufgabe gewachsen sind, können wir uns darauf konzentrieren, Luxemburg für die Kunst des modernen Krieges fit zu machen."
LUX_tank:0	"Theoretische Panzerentwürfe"
LUX_tank_desc:0	"Ein Vorteil, wenn man so militaristische Nachbarn hat, ist, dass man die neuesten technologischen Schrecken aus nächster Nähe beobachten kann."
LUX_navy:0	"Bemühungen der Marine"
LUX_navy_desc:0	"Luxemburg war noch nie zur See gefahren, geschweige denn eine Seemacht. Heute schaffen wir Abhilfe."
LUX_destroyer:0	"Zerstörer"
LUX_destroyer_desc:0	"So schön es auch wäre, riesige Marineschiffe zu bauen, die das Meer terrorisieren, lassen Sie uns klein anfangen."
LUX_benelux_military_cooperation:0	"Militärische Zusammenarbeit der Benelux-Staaten"
LUX_benelux_military_cooperation_desc:0	"Da wir von der militärischen Unterstützung unserer Nachbarn abhängig sind, müssen wir einen gemeinsamen Offiziersstab einrichten, der auf die Verteidigung gegen unsere Nachbarn spezialisiert ist, die auch unsere wahrscheinlichen Feinde sind."
r56_LUX_cut_back_workers_rights:0	"Beschneidung der Arbeitnehmerrechte"
r56_LUX_strengthened_agriculture:0	"Landwirtschaft gestärkt"
r56_LUX_ministry_of_economics_i:0	"Wirtschaftsministerium"
r56_LUX_ministry_of_labour_i:0	"Arbeitsministerium"
r56_LUX_ministry_of_interior_i:0	"Innenministerium"
r56_LUX_ministry_of_foreign_affairs_i:0	"Ministerium für Auswärtige Angelegenheiten"
r56_LUX_ministry_of_army_i:0	"Ministerium für die Armee"
r56_LUX_economic_dependence:0	"Wirtschaftliche Abhängigkeit"
r56_LUX_economic_dependence_desc:0	"Die luxemburgische Industrie ist nicht groß genug, um sich selbst zu versorgen. Sie ist daher abhängig von Eisenimporten aus Frankreich und Stahlexporten nach Deutschland."
r56_LUX_polarized_society:0	"Polarisierte Gesellschaft"
r56_LUX_polarized_society_desc:0	"Seit dem Referendum über das Maulkuerfgesetz ist das Land gespalten zwischen denjenigen, die die KPL verbieten wollten, und denjenigen, die gegen solche Maßnahmen sind. Es wird großer Anstrengungen bedürfen, um die entstandene Kluft zu überwinden."
r56_LUX_farm_subsidies:0	"Subventionen für die Landwirtschaft"
r56_LUX_farm_subsidies_desc:0	"Als das Rückgrat eines jeden Landes verdienen die Landwirte die Anerkennung und die Mittel, um ein verlässliches Einkommen zu haben. Diese Subventionen machen dies möglich."
r56_LUX_strengthened_rural_communities:0	"Gestärkte ländliche Gemeinschaften"
r56_LUX_policy_of_free_hands:0	"Politik der freien Hände"
r56_LUX_policy_of_free_hands_desc:0	"Um neutral zu bleiben, müssen wir mit allen verhandeln und dürfen nicht zulassen, dass ideologische Differenzen zwischen uns und der Wahrung unserer Unabhängigkeit stehen."
r56_LUX_defensive_focus:0	"Defensiver Fokus"
r56_LUX_defensive_focus_desc:0	"Wir haben nicht die Möglichkeiten, im Falle eines Krieges anzugreifen, also müssen wir alle unsere Anstrengungen auf die Verteidigung unseres Landes konzentrieren."
r56_LUX_focused_radio_efforts:0	"Gezielte Radar- und Funkanstrengungen"
r56_LUX_focused_radio_efforts_desc:0	"Wir haben die meisten zivilen Funkübertragungen abgeschaltet, damit unser Militär das Land besser verteidigen kann."
r56_LUX_banned_aid:0	"Verbotene internationale Hilfe"
r56_LUX_banned_aid_desc:0	"Um zu zeigen, wie sehr wir uns unserer Neutralität verpflichtet fühlen, haben wir die internationale Hilfe verboten, was bedeutet, dass keine [ROOT.GetAdjectiveCap] Waffen in die Hände von kriegführenden Nationen gelangen."
r56_LUX_union_against_extremism:0	"Union gegen Extremismus"
r56_LUX_union_against_extremism_desc:0	"Die Sozialisten haben das Land polarisiert, sie sind eine Bedrohung für [ROOT.GetNameDef] und dürfen keinen Einfluss haben."
r56_LUX_motto:0	"Mir Wëlle Bleiwe Wat Mir Sinn"
r56_LUX_motto_desc:0	"Das nationale Motto von [ROOT.GetName] geht auf das Jahr 1859 zurück und bedeutet grob übersetzt Wir wollen bleiben, was wir sind."
r56_LUX_continuing_the_fight:0	"Den Kampf fortsetzen"
r56_LUX_continuing_the_fight_desc:0	"Auch wenn wir kapituliert haben, haben wir nicht kapituliert. [ROOT.GetNameDefCap] wird durchhalten und sein Land einst von der Besatzung befreien!"
r56_LUX_peace_in_our_times:0	"Frieden in unserer Zeit"
r56_LUX_peace_in_our_times_desc:0	"Die Jahre der Neutralität haben sich ausgezahlt. [ROOT.GetNonIdeologyName] hat den Frieden bewahrt und für einen dauerhaften Frieden gesorgt."
r56_LUX_capital_of_europe:0	"Hauptstadt Europas"
r56_LUX_capital_of_europe_desc:0	"[ROOT.GetNameDefCap] ist das Herz Europas, hat drei Amtssprachen und spielte eine Schlüsselrolle in der europäischen Diplomatie und im Völkerbund."
r56_LUX_privatising_industry:0	"Privatisierung der Industrie"
r56_LUX_privatising_industry_desc:0	"Die neue liberale Regierung hatte endlich die Möglichkeit, Privatisierungen und Privateigentum voranzutreiben."
r56_LUX_lowered_taxes:0	"Niedriger Steuersatz"
r56_LUX_lowered_taxes_desc:0	"Niedrige Steuern entlasten die Bevölkerung und erhöhen den Kapitalfluss, was letztlich zu Wirtschaftswachstum führt."
r56_LUX_initial_rearmament:0	"Erste Aufrüstung"
r56_LUX_initial_rearmament_desc:0	"Um [ROOT.GetNameDef] zu verteidigen, braucht man ein gutes Militär. Jahrzehntelange Abrüstung hat dazu geführt, dass es fast kein Militär mehr gibt. Wir müssen diesen Prozess umkehren."
r56_LUX_benelux_customs_union:0	"Benelux-Wirtschaftsunion"
r56_LUX_benelux_customs_union_desc:0	"Nach der Gründung der [ROOT.GetFactionName] haben ihre Mitglieder beschlossen, die Grenzkontrollen untereinander zugunsten des freien Handels abzuschaffen."
r56_LUX_unified_command:0	"Einheitliche Kommandostruktur"
r56_LUX_unified_command_desc:0	"Eine gute Kommandostruktur arbeitet so kohärent wie möglich. Das haben wir erreicht, nichts wird uns jetzt aufhalten."
r56_LUX_united_and_ready:0	"Vereint und bereit"
r56_LUX_united_and_ready_desc:0	"Die Lowlands sind stolz auf jeden Gegner, der mit uns im Streit liegt. Wir werden durchhalten und gemeinsam gedeihen."
r56_LUX_beating_the_giant:0	"Den Giganten besiegen"
r56_LUX_beating_the_giant_desc:0	"Alleine sind wir machtlos gegen [GER.GetNameDef]. Gemeinsam jedoch können wir siegen und die östliche Bedrohung endlich beenden."
r56_LUX_benelux_alliance:0	"Mitglied der Benelux-Länder"
r56_LUX_benelux_alliance_desc:0	"Dieses Land hat sich den Benelux-Staaten angeschlossen, um sich und seine Interessen zu verteidigen."
r56_LUX_increased_education_budget:0	"Erhöhter Bildungsetat"
r56_LUX_increased_education_budget_desc:0	"Als Investition in die nächste Generation ist die Bildung die wichtigste Aufgabe des Staates."
r56_LUX_agressive_benelux:0	"Aggressive Außenpolitik"
r56_LUX_agressive_benelux_desc:0	"Wir haben uns vielleicht vereinigt, aber wir haben noch nicht alle Männer und Frauen, die sich Beneluxaner nennen, unter einer Flagge vereinigt."
r56_LUX_fair_economy:0	"Faire Wirtschaft"
r56_LUX_fair_economy_desc:0	"Das Volk sollte nicht der Wirtschaft dienen, sondern die Wirtschaft sollte dem Volk dienen."
r56_LUX_abolished_monarchy:0	"Abgeschaffte Monarchie"
r56_LUX_abolished_monarchy_desc:0	"Wir sind endlich frei von der Tyrannei der Monarchie. Wir haben die Vergangenheit hinter uns gelassen, so dass uns endlich die Zukunft offen steht. "
r56_LUX_socialist_future:0	"Sozialistische Zukunft"
r56_LUX_socialist_future_desc:0	"Die Ketten der Vergangenheit haben wir hinter uns gelassen, das Proletariat ist nun frei, seine eigene Zukunft zu gestalten!"
r56_LUX_republican_humanism:0	"Republikanischer Humanismus"
r56_LUX_republican_humanism_desc:0	"Auch wenn die Monarchie ungerecht über [ROOT.GetNonIdeologyName] geherrscht hat, sind sie immer noch Menschen und verdienen Respekt und Rechte, wie jeder andere Mensch auch."
r56_LUX_socialist_constitution:0	"Sozialistische Verfassung"
r56_LUX_socialist_constitution_desc:0	"Um die Arbeiterrevolution besser voranzutreiben, war es notwendig, die Verfassung zugunsten der Sozialisten und des Proletariats zu ändern."
r56_LUX_volunteers:0	"[ROOT.GetAdjectiveCap] Freiwilligenarmee"
r56_LUX_volunteers_desc:0	"Um unsere Interessen im Ausland zu schützen und unseren Verbündeten zu helfen, müssen wir bereit sein, Truppen in jeden Konflikt zu schicken, der entstehen könnte."
r56_LUX_nationalised_companies:0	"Verstaatlichte Unternehmen"
r56_LUX_nationalised_companies_desc:0	"Viele große Unternehmen haben ihre Arbeiter ausgebeutet, um sich einen Vorteil bei der Kapitalakkumulation zu verschaffen. Ihre Eigentümer müssen sich nun mit dem Proletariat zusammenschließen, da sie diese Unternehmen nicht mehr besitzen."
r56_LUX_struggle_for_equality:0	"Kampf um Gleichheit"
r56_LUX_struggle_for_equality_desc:0	"Gleichheit ist kein Zustand, sie ist ein Prozess, der ständig aufrechterhalten werden muss. Dennoch lohnt sich der Versuch."
r56_LUX_collectivized_economy:0	"Kollektivierte Wirtschaft"
r56_LUX_collectivized_economy_desc:0	"Damit jeder arbeitende Mann und jede arbeitende Frau von der Wirtschaft profitieren kann, müssen ihnen die Fabriken und Betriebe gehören."
r56_LUX_soviet_dominated_trade:0	"Sowjetisch dominierter Handel"
r56_LUX_soviet_dominated_trade_desc:0	"Da [SOV.GetNameDef] ein ideologischer Verbündeter ist, konnten wir mit ihm gute Handelsabkommen aushandeln."
r56_LUX_developing_autarkic_economy:0	"Entwicklung einer autarken Wirtschaft"
r56_LUX_developing_autarkic_economy_desc:0	"Wir werden die Autarkie anstreben, damit wir so unabhängig wie möglich sind."
r56_LUX_autarkic_economy:0	"Autarke Wirtschaft"
r56_LUX_autarkic_economy_desc:0	"Um unsere wirtschaftliche und damit auch politische Unabhängigkeit zu erhalten, haben wir ein autarkes Wirtschaftsmodell gewählt."
r56_LUX_socialist_society:0	"Sozialistische Gesellschaft"
r56_LUX_socialist_society_desc:0	"Wir sind endgültig von einer kapitalistischen Gesellschaft zu einer sozialistischen Gesellschaft übergegangen, ein natürlicher Schritt in unserer Entwicklung hin zu einer kommunistischen Gesellschaft und einem kommunistischen Land."
r56_LUX_via:0	"VIA"
r56_LUX_via_desc:0	"Die VIA, oder das Volkskommissariat für innere Angelegenheiten, ist die Geheimpolizei von [ROOT.GetNameDef], bekannt und gefürchtet in der ganzen Welt."
r56_LUX_socialist_science:0	"Sozialistische Wissenschaft"
r56_LUX_socialist_science_desc:0	"In der modernen Welt ist die Wissenschaft alles. Aber Wissenschaft ist nichts ohne den ideologischen Rahmen des Sozialismus."
r56_LUX_patriotic_constitution:0	"Patriotische Verfassung"
r56_LUX_patriotic_constitution_desc:0	"Um sicherzustellen, dass das Land durch den Kommunismus gesichert ist, muss die Verfassung geeignet sein, die staatliche Kontrolle zu stärken."
r56_LUX_antifascist_volunteers:0	"Antifaschistische Freiwillige"
r56_LUX_antifascist_volunteers_desc:0	"Der wichtigste Kampf heute ist der Kampf gegen den Faschismus. Er bedroht Länder, Völker und die Gleichheit jedes Mannes und jeder Frau."
r56_LUX_agitated_youth:0	"Aufgewühlte Jugend"
r56_LUX_agitated_youth_desc:0	"Die Luxemburger Volksjugend ist eine ähnliche Organisation wie die Hitler-Jugend in [GER.GetNameDef]. Sie verbreitet faschistische Ideen und sichert sich die Unterstützung der nächsten Generation."
r56_LUX_dennemeyers_propaganda:0	"Dennemeyers Propaganda"
r56_LUX_dennemeyers_propaganda_desc:0	"Camille Dennemeyer ist ein Propaganda-Genie. Er versteht es, Menschen zu überzeugen und sie emotional zu erreichen, eine äußerst nützliche Eigenschaft für die Verbreitung des Faschismus."
r56_LUX_political_support:0	"Politische Unterstützung"
r56_LUX_political_support_desc:0	"Mit einer neu gegründeten Partei haben wir die Möglichkeit, die politische Bühne zu betreten und sowohl die Unterstützung des Volkes als auch der Regierung zu gewinnen."
r56_LUX_german_funding:0	"Deutsche Finanzierung"
r56_LUX_german_funding_desc:0	"Die besser entwickelte [GER.GetAdjectiveCap] Industrie kann unserer Industrie helfen, was auch [GER.GetAdjectiveCap] Popularität unter den [ROOT.GetAdjectiveCap] Menschen erhöht."
r56_LUX_anti_french_sentiments:0	"Antifranzösische Sentiments"
r56_LUX_anti_french_sentiments_desc:0	"Frankreich hat die Geschichte von [ROOT.GetNameDef] beeinflusst, das ist klar. Es wird den Menschen auch immer klarer, dass dieser Einfluss die Identität und die Wurzeln der Nation [GER.GetAdjectiveCap] zerstört."
r56_LUX_fascist_army:0	"Rekrutierung der faschistischen Armee"
r56_LUX_fascist_army_desc:0	"Die Armee ist von Faschisten infiltriert worden, die jetzt vor allem Gleichgesinnte rekrutieren."
r56_LUX_all_luxembourgish_societies:0	"All-Luxembourgische Gesellschaften"
r56_LUX_all_luxembourgish_societies_desc:0	"Wir haben ein Wiederaufleben nationalistischer Gesellschaften erlebt, die die Nation und ihre Identität um jeden Preis schützen wollen."
r56_LUX_professional_army:0	"Berufsarmee"
r56_LUX_professional_army_desc:0	"Die Berufsarmee von [GER.GetNonIdeologyName] ist in der Schlacht gefürchtet und in ihrer Kompetenz nahezu konkurrenzlos."
r56_LUX_political_army:0	"Politische Armee"
r56_LUX_political_army_desc:0	"Eine starke Nation braucht eine starke Armee, die der Regierung gegenüber loyal ist und deren Willen ohne Frage durchsetzt."
r56_LUX_unbeaten_in_battle:0	"Ungeschlagen in der Schlacht"
r56_LUX_unbeaten_in_battle_desc:0	"Im Felde Unbesiegt ist ein Motto der [ROOT.GetAdjectiveCap] Streitkräfte, das unsere überwältigende Macht und Willenskraft zum Ausdruck bringt."
r56_LUX_taxes_germany:0	"Steuern für [GER.GetNameDef]"
r56_LUX_taxes_germany_desc:0	"Als integraler Bestandteil von [GER.GetNameDef] wird von uns erwartet, dass wir Steuern an die Zentralregierung zahlen. Mit einer höheren Wirtschaftsleistung können die Auswirkungen dieser Steuern jedoch abgeschwächt werden."
r56_LUX_german_manpower:0	"[GER.GetAdjectiveCap] Arbeitskräfte"
r56_LUX_german_manpower_desc:0	"Um die Kontrolle über das Land zu behalten, schickt [GER.GetNameDef] uns Männer zur Unterstützung unseres Sicherheitsapparates."
r56_LUX_treaty_of_london_signatory:0	"Unterzeichner des Vertrags von London"
r56_LUX_treaty_of_london_signatory_desc:0	"Dieses Land hat [LUX.GetNameDef] seine Unterstützung zugesagt und wird das Land verteidigen müssen, wenn es angegriffen wird."
r56_LUX_treaty_of_london_signatory_tt:0	"§AWenn [LUX.GetNameDef] angegriffen wird, müssen wir es verteidigen oder den Ruf eines nicht vertrauenswürdigen Verbündeten erlangen.§!"
r56_LUX_untrustworthy_ally:0	"Unzuverlässiger Verbündeter"
r56_LUX_untrustworthy_ally_desc:0	"[ROOT.GetNameDefCap] gilt als nicht vertrauenswürdig, da es [LUX.GetNameDef] nicht verteidigt hat, obwohl es dazu verpflichtet war."
r56_LUX_restored_neutrality:0	"Wiederhergestellte Neutralität"
r56_LUX_restored_neutrality_desc:0	"Mit einem verteidigungsfähigen Land hat [ROOT.GetNameDef] seine Neutralität als verlässliche Nation wiederhergestellt."
r56_LUX_total_neutrality:0	"Völlige Neutralität"
r56_LUX_total_neutrality_desc:0	"Als Garant des Friedens wurde die totale Neutralität erklärt."
LUX_looming_strikes:0	"Drohende Streiks"
LUX_looming_strikes_desc:0	"Die Lage in Luxemburg ist angespannt. Die Regierung hat es versäumt, die Fragen der sozialen Gerechtigkeit zu regeln. Die Menschen fordern endlich Taten von ihrer Regierung. Es scheint, als ob ein Streik jetzt unvermeidlich ist."
LUX_chamberofdeputies:0	"Die Abgeordnetenkammer"
LUX_ministries:0	"Die Ministerien"
LUX_form_government_mission:0	"Bilden eine Regierung"
LUX_ally_socialists_tt:0	"Schaltet §Hkommunistische§! und §Hsozialdemokratische Minister§! frei."
LUX_maintain_governmental_positions_tt:0	"Schaltet §Hliberale§! und §Hkonservative Minister§! frei."
LUX_ally_socialists:0	"Verbündete andere Sozialisten"
LUX_allied_socialists:0	"Hat §Bündnis mit anderen Sozialisten§!"
LUX_maintain_governmental_positions:0	"Regierungspositionen beibehalten"
LUX_maintained_governmental_positions:0	"Hat §H Regierungspositionen beibehalten§!"
LUX_start_talks_with_left:0	"Gespräche mit der Linken aufnehmen"
LUX_started_talks_with_left:0	"Hat §HGespräche mit der Linken aufgenommen§!"
LUX_negotiate_with_former_ministers:0	"Mit ehemaligen Ministern verhandeln"
LUX_negotiated_with_former_ministers:0	"Hat §HNachverhandelt mit ehemaligen Ministern§!"
LUX_form_government_mission_trigger:0	"Hat §A 5 Minister eingestellt§!"
LUX_gain_new_iron_sources:0	"Neue Eisenquellen erschließen"
LUX_gain_new_iron_sources_desc:0	"Eisen ist ein Grundpfeiler unserer Industrie und erst recht der Stahlindustrie. Wir müssen eine stetige Versorgung mit dieser wertvollen Ressource sicherstellen, damit unsere Industrie ordnungsgemäß funktioniert."
LUX_find_new_export_partners:0	"Finden Sie neue Exportpartner"
LUX_find_new_export_partners_desc:0	"Unsere Partnerschaft mit Deutschland ist alt, doch wir können sie nicht aufrechterhalten. Wir müssen unsere Exporte diversifizieren, damit wir wirtschaftlich unabhängig bleiben können."
LUX_import_belgian_raw_materials:0	"Importieren Sie Rohstoffe aus Belgien"
LUX_import_belgian_raw_materials_desc:0	"Mit der belgisch-luxemburgischen Wirtschaftsunion hat eine Zeit der Zusammenarbeit zwischen unseren Ländern begonnen. Ein weiterer Schritt in diese Richtung wäre die Verwendung von belgischem Eisen in luxemburgischen Fabriken. Lassen Sie uns das tun!"
LUX_neutrality_balance_convert_factories:0	"Militärische Fabriken umwandeln"
LUX_neutrality_balance_convert_factories_desc:0	"Als neutrale Nation können wir uns auf unsere Zivilbevölkerung konzentrieren, ohne eine militärische Intervention befürchten zu müssen. Daher sollten wir einige Militärfabriken in zivile Fabriken umwandeln."
LUX_neutrality_balance_continue_disarmament:0	"Weiter abrüsten"
LUX_neutrality_balance_continue_disarmament_desc:0	"Wir brauchen kein Militär, denn wir sind neutral und daher nicht anfällig für eine Invasion. Wenn wir unsere Soldaten wieder in den Dienst der Arbeit stellen, können wir davon ausgehen, dass sie zusätzliche Arbeitskräfte für die Wirtschaft bereitstellen."
LUX_neutrality_balance_promise_peace:0	"Versprechen Sie Frieden"
LUX_neutrality_balance_promise_peace_desc:0	"Wenn wir wollen, dass die Menschen in [ROOT.GetNonIdeologyName] die Sache der Neutralität unterstützen, müssen wir sie davon überzeugen, dass sie nicht in Gefahr sind."
LUX_neutrality_balance_strengthen_foreign_office:0	"Stärken Sie das Außenministerium"
LUX_neutrality_balance_strengthen_foreign_office_desc:0	"Der beste Weg, einen Krieg zu gewinnen, ist zu verhindern, dass er ausbricht. Die Diplomatie ist hier das Mittel der Wahl und der beste Weg, um sich auf einen Krieg vorzubereiten."
LUX_neutrality_balance_convert_civilian_factory:0	"Zivile Fabriken umbauen"
LUX_neutrality_balance_convert_civilian_factory_desc:0	"Wir können uns den Luxus einer zivilen Produktion nicht leisten, wenn wir von ausländischen Mächten bedroht werden. Daher sollten sich die zivilen Fabriken jetzt auf die militärische Produktion konzentrieren, um die Unabhängigkeit des Landes zu sichern!"
LUX_neutrality_balance_divert_workers:0	"Arbeiter für die Armee abstellen"
LUX_neutrality_balance_divert_workers_desc:0	"Viele Arbeiter in [ROOT.GetNameDef] sind in Industrien beschäftigt, die keine Zukunft haben, wenn das Land überfallen wird. Diese Menschen müssen in die Armee gebracht werden, damit jeder Mann und jede Frau im Land davon profitieren kann."
LUX_neutrality_balance_prepare_defenses:0	"Bereiten Sie die Verteidigung vor"
LUX_neutrality_balance_prepare_defenses_desc:0	"[ROOT.GetNameDefCap] ist ein sehr verteidigungsfähiges Land, dennoch bleiben wir aufgrund unserer relativ kleinen Bevölkerung und militärischen Stärke verwundbar. Wir können die Verteidigung erleichtern, indem wir geeignete Verteidigungsstrukturen errichten."
LUX_neutrality_balance_prepare_for_war:0	"Auf den Krieg vorbereiten"
LUX_neutrality_balance_prepare_for_war_desc:0	"Auch wenn die Regierung gerne aufrüstet und das Land verteidigt, zögern viele Menschen noch, diesen neuen Kurs zu akzeptieren. Wir müssen diese Menschen davon überzeugen, dass die Wiederbewaffnung im Interesse aller ist."
LUX_open_border_agreement_france:0	"Abkommen über offene Grenzen mit [FRA.GetNonIdeologyName]"
LUX_open_border_agreement_france_desc:0	"[ROOT.GetNonIdeologyName] und [FRA.GetNonIdeologyName] haben im Laufe der Jahre eine erfolgreiche Partnerschaft gepflegt. Jetzt werden wir zusätzliche Handelsabkommen schließen, um unsere Abhängigkeit von ihrem Eisen zu verringern."
LUX_open_border_agreement_belgium:0	"Abkommen über offene Grenzen mit [BEL.GetNonIdeologyName]"
LUX_open_border_agreement_belgium_desc:0	"[BEL.GetNonIdeologyName] ist schon seit geraumer Zeit ein langfristiger Partner für uns. Jetzt ist es an der Zeit, neue Handelsabkommen zu schließen, damit wir ihr Eisen billiger importieren können."
LUX_open_border_agreement_netherlands:0	"Abkommen über offene Grenzen mit den [HOL.GetNonIdeologyName]"
LUX_open_border_agreement_netherlands_desc:0	"Obwohl die [HOL.GetNameDef] seit vielen Jahren über die [ROOT.GetNonIdeologyName] herrschen, haben unsere beiden Länder immer noch gute Beziehungen, die perfekte Voraussetzung für den Aufbau engerer Handelsbeziehungen."
LUX_currently_developing:0	"Derzeit nicht in der Entwicklung"
LUX_regional_development_decision:0	"Regionale Entwicklung in [FROM.GetName]"
LUX_regional_development_decision_desc:0	"Wir müssen dafür sorgen, dass unsere Menschen einen akzeptablen Lebensstandard erreichen können. Um dies zu ermöglichen, können wir in verschiedene Regionen investieren."
r56_LUX_revolutionary_army:0	"Revolutionäre Armee"
r56_LUX_revolutionary_army_desc:0	"Die Armee kann als Mittel zur politischen Neuausrichtung eingesetzt werden. Auf diese Weise stellen wir sicher, dass die Armee sowohl der Regierung als auch der Revolution gegenüber loyal ist."
r56_LUX_politicised_army:0	"Politisierte Armee"
r56_LUX_politicised_army_desc:0	"Wir müssen die Armee als verlängerten Arm des Staates sehen, der den Sozialismus durchsetzt und die Revolution aufrechterhält."
r56_LUX_red_army:0	"[ROOT.GetAdjectiveCap] Rote Armee"
r56_LUX_red_army_desc:0	"Während die Sozialisten ihre Kontrolle über das Land festigen, folgt die Armee als Rote Armee und repräsentiert die sozialistischen Ideale der Nation."
LUX_integrate_western_lands:0	"Westliche Länder einbinden"
LUX_integrate_western_lands_desc:0	"Die Nachbarstaaten im Westen sind kulturell [ROOT.GetAdjectiveCap]. Sie müssen in [GER.GetNameDef] integriert werden."
LUX_fascist_balance_fascist_propaganda:0	"Verbreiten Sie faschistische Propaganda"
LUX_fascist_balance_fascist_propaganda_desc:0	"Unser Propagandaapparat ist hervorragend geeignet, unsere Ideen zu verbreiten und andere davon zu überzeugen, ebenfalls für sie zu kämpfen."
LUX_fascist_balance_fascist_propaganda_tt:0	"Tägliche Veränderung des Kräfteverhältnisses in Richtung §HGerman Identity§!: £BoP_right_texticon §H0.30%§!"
LUX_fascist_balance_continued_army_infiltration:0	"Armee-Infiltration fortsetzen"
LUX_fascist_balance_continued_army_infiltration_desc:0	"Wenn wir nicht die Unterstützung jedes einzelnen Mannes in der Armee haben, besteht eine reelle Chance, dass wir nicht erfolgreich sein werden. Die Loyalität der Armee zu sichern ist daher von entscheidender Bedeutung."
LUX_fascist_balance_additional_funding:0	"Zusätzliche Mittel beschaffen"
LUX_fascist_balance_additional_funding_desc:0	"Auch wenn die meisten unserer Ausgaben von [GER.GetNameDef] bezahlt wurden, bleiben kleine Aktivitäten unserer Organisation weiterhin unbezahlt. Mit zusätzlicher Finanzierung durch die NSDAP kann dies behoben werden."
LUX_fascist_balance_import_nazis:0	"Schmuggeln Sie Deutsche über die Grenze"
LUX_fascist_balance_import_nazis_desc:0	"Wir brauchen qualifiziertes Personal, um die öffentliche Meinung zu Gunsten von [GER.GetNameDef] zu verändern. Mit dem Fachwissen von [GER.GetAdjectiveCap] Parteimitgliedern der NSDAP wird ein solcher Prozess einfach."
LUX_fascist_balance_bind_army_to_country:0	"Sicherstellung der Loyalität der Armee gegenüber [ROOT.GetNonIdeologyName]"
LUX_fascist_balance_bind_army_to_country_desc:0	"Wenn wir verhindern wollen, dass ausländische Einflüsse auf unser geliebtes Land einwirken, muss die Armee ihm gegenüber um jeden Preis loyal bleiben."
LUX_fascist_balance_show_national_unity:0	"Nationale Einheit zeigen"
LUX_fascist_balance_show_national_unity_desc:0	"Dieses Land ist alles andere als national einheitlich, dennoch sind wir ein geeintes Volk. Das müssen die Bevölkerung und diejenigen, die sich gegen uns stellen, verstehen."
LUX_fascist_balance_lobby_for_political_support:0	"Lobbyarbeit für politische Unterstützung"
LUX_fascist_balance_lobby_for_political_support_desc:0	"Eine politische Vertretung ist für unsere Bemühungen unerlässlich. Ohne sie sind wir zum Scheitern verurteilt. Daher sollten wir erhebliche Anstrengungen unternehmen, um sicherzustellen, dass wir politischen Einfluss haben."
LUX_fascist_balance_romanticise_past:0	"Romantisieren Sie unsere Vergangenheit"
LUX_fascist_balance_romanticise_past_desc:0	"Es hat viele Bemühungen gegeben, unsere glorreiche Vergangenheit zu entmystifizieren. Auch sogenannte Historiker haben Lügen über sie verbreitet. Es ist an der Zeit, dass wir zurückfordern, was wir verloren haben."
