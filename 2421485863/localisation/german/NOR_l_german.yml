NOR_adam_egede_nissen_desc:0				"Adam Hjalmar Egede-Nissen was born on a farm in Frol municipality. In his younger years he studied philosophy while working in the postal service, eventually becoming the head of the local distribution center of Vardø in 1897, near the Russian border. In 1900 his political career brought him into the Norwegian Parliament for the first time as a representative of the Liberal Party, Venstre. In 1905 he switched his political allegiance to the Labour Party, where he turned down another period in the Parliament in 1912 in favour of continued work for the Norwegian postal service.\n\nWhile holding experience both with regular jobs and politics, Egede-Nissen was no stranger to more radical approaches to getting things done either, having illegally smuggled and printed revolutionary literature, as well as formed a radical Miner's Union in 1906. His time in Vardø gave him insight into the growing revolutionary sentiment in Russia, which he's since supported to quite a large degree. He was the mayor of Stavanger from 1915 to 1919, during which he was fined for his involvement in the 1919 general strike in support of the Russian revolution. In 1918 he had also went to Russia and met with Lenin, while also attending a meeting dedicated to the formation of the now well known Comintern. When the Labour Party split in 1923, Egede-Nissen followed the more radical politicians and joined the Norwegian Communist Party, NKP."
