MAN_mantetsu_railway_desc:0				"The South Manchuria Railway Company, Ltd., or Mantetsu for short is a large industrial conglomerate which precedes, as on of the only corporations still in operation, the foundation of the [MAN.GetName]. Despite its name, Mantetsu is active in almost all sectors of the civillian economy, therefore holding large influence over the State itself."
