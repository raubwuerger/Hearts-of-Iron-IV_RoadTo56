QUE_tackle_the_economic_issues:0	"Das wirtschaftliche Problem anpacken"
QUE_tackle_the_economic_issues_desc:0	"Die jüngste plötzliche Unabhängigkeit hat gezeigt, wie schlecht die Wirtschaft vorbereitet ist. Wir sind auf uns allein gestellt und müssen nun die nationale Wirtschaft ankurbeln."
QUE_open_the_border:0	"Öffnen Sie die Grenze"
QUE_open_the_border_desc:0	"Jetzt, da sich die diplomatischen Beziehungen zu [CAN.GetNameDef] wieder normalisiert haben und wir unsere diplomatische Haltung auf Zusammenarbeit ausgerichtet haben, können wir über die Öffnung der Grenzen verhandeln."
