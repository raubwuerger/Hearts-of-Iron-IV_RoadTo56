QUE_angus_shop_tank_production_desc:0	"Winter Equipment"
QUE_sorel_industries:0	"Es ist kalt im Winter, das ist eine weithin bekannte Tatsache. Es wäre töricht, unsere Soldaten nicht entsprechend auszustatten, wenn man unsere besonders harten Winter bedenkt."
