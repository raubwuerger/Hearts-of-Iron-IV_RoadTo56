QUE_silent_service:0	"Industrielle Planung"
QUE_stealth_upgrades:0	"Wenn wir unsere Industriesektoren erweitern wollen, sollten wir zunächst ihre Expansionen sowie alle anderen langfristigen Projekte planen."
QUE_carrier_strikes:0	"Sorel Steel and Foundry"
QUE_naval_air_groups:0	"Sorel wird das Herzstück unserer Stahlproduktion sein und Synergien mit dem nahegelegenen Schiffswerft und der geplanten Gunfactory schaffen."
QUE_lessons_for_the_air_force:0	"Ankurbelung der Wirtschaft"
QUE_saguenay_industries:0	"Indem wir Geld in die Wirtschaft pumpen, können wir eine große Wirkung erzielen, die ausreicht, um die Wirtschaft wieder aufblühen zu lassen!"
QUE_saguenay_industries_desc:0	""
QUE_mauricie_development:0	"Mauricie Industrielle Erweiterung"
QUE_mauricie_development_desc:0	""
QUE_cote_nord_expansion:0	"Besiedlung der Cote-Nord"
QUE_cote_nord_expansion_desc:0	""
QUE_army_effort:0	"Reorganisiere die Regimenter in Quebec"
QUE_army_effort_desc:0	"Trotz der zunehmenden Möglichkeiten der Luft- und Seekriegsführung ist der Bodenkampf auch in den Kriegen von morgen entscheidend. Wenn wir uns vorbereiten, können wir die Hölle der Schützengräben vermeiden."
QUE_equipment_effort:0	"Modernisiere die Ausrüstung"
QUE_equipment_effort_desc:0	"Die Grenzen der Ausrüstung, die die Infanterie tragen kann, werden immer weiter verschoben. Wir werden uns darauf konzentrieren, unseren Truppen die besten verfügbaren Werkzeuge zu geben."
QUE_motorization_effort:0	"Motorisierte Unterstützung"
QUE_motorization_effort_desc:0	"Mobilität und Schutz sind entscheidend, um die Infanterie sicher ins und aus dem Feld zu bringen. Wenn wir uns auf diese Entwicklungen konzentrieren, können wir schnell handeln."
QUE_doctrine_effort:0	"Neue Taktiken konzipieren"
QUE_doctrine_effort_desc:0	"Die Militärdoktrinen, die den Bodenkampf im Ersten Weltkrieg bestimmten, sind überholt. Wir müssen unsere besten Köpfe mit der Aufgabe betrauen, das militärische Denken von morgen zu gestalten."
QUE_equipment_effort_2:0	"Reform der Ausrüstung fortsetzen"
QUE_equipment_effort_2_desc:0	"Wir werden unsere Bemühungen fortsetzen, um sicherzustellen, dass unsere Infanterie- und Unterstützungstruppen mit der bestmöglichen Ausrüstung unserer Zeit ausgestattet sind."
QUE_mechanization_effort:0	"Eine mechanisierte Infanterie"
QUE_mechanization_effort_desc:0	"Indem wir die Möglichkeiten der motorisierten Infanterie überdenken, können wir die Grenzen der Fahrzeuge, die wir heute bauen können, verschieben."
QUE_doctrine_effort_2:0	"Groß angelegte Übungen"
QUE_doctrine_effort_2_desc:0	"Das Schlachtfeld hat sich in den Jahren zwischen den beiden Weltkriegen und in den jüngsten Konflikten verändert. Wir müssen unsere Doktrinen ständig neu bewerten, um dies zu berücksichtigen."
QUE_equipment_effort_3:0	"Die Modernisierung des Militärs abschließen"
QUE_equipment_effort_3_desc:0	"Anstatt ausländische Ausrüstung zu imitieren oder zu kaufen, sollten wir bei den Infanteriewaffen weltweit führend werden."
QUE_armor_effort:0	"Gepanzerte Fahrzeuge entwickeln"
QUE_armor_effort_desc:0	"Was wir bei der Mechanisierung unserer Infanterie gelernt haben, können wir auch für die Verbesserung unserer gepanzerten Fahrzeuge nutzen."
QUE_special_forces:0	"Spezialtruppen"
QUE_special_forces_desc:0	"Wir brauchen Elitetruppen; Gebirgsjäger und Fallschirmjäger sollten unsere Priorität sein."
QUE_aviation_effort:0	"Gründung der Quebec Air School"
QUE_aviation_effort_tt:0	"Nicht genug Gebäudeslots für §YAir Base§!"
QUE_aviation_effort_desc:0	"Nirgendwo ist der technologische Fortschritt so rasant wie in der Luftkriegsführung. Die Luftfahrt ist ein Bereich, den jede moderne Nation beherrschen muss."
QUE_fighter_development:0	"Escadrille Alouette"
QUE_fighter_development_desc:0	"Die Luftkämpfe des Großen Krieges sind noch nicht vorbei. Wenn wir bei der Entwicklung von Kampfflugzeugen die Nase vorn haben, werden wir auch in Zukunft im Vorteil sein."
QUE_bomber_focus:0	"Bomber im Fokus"
QUE_bomber_focus_desc:0	"Wenn die Menschen in der Zukunft über die Schrecken der heutigen Kriege sprechen, wird das Feuer, das vom Himmel regnet, im Vordergrund stehen. Wir werden unser Bestes tun, um sicherzustellen, dass unsere Feinde diese Geschichten erzählen."
QUE_aviation_effort_2:0	"Ausländische Taktiken studieren"
QUE_aviation_effort_2_desc:0	"Weitere Fortschritte in der Luftfahrt werden notwendig sein, um unsere Luftwaffe gut mit anderen Teilstreitkräften zu integrieren."
QUE_CAS_effort:0	"Sturzkampfbomber"
QUE_CAS_effort_desc:0	"Eine moderne Armee braucht Unterstützung durch Fahrzeuge am Boden und in der Luft."
QUE_rocket_effort:0	"Raketentriebwerke"
QUE_rocket_effort_desc:0	"Raketen- und Düsentriebwerke ermöglichen nie dagewesene Geschwindigkeiten sowohl für Schiffe ohne Besatzung als auch für solche mit Besatzung. Die Vorreiterrolle bei diesen Technologien ermöglicht es uns, den Feind zu überrumpeln."
QUE_NAV_effort:0	"Seebomber"
QUE_NAV_effort_desc:0	"Genauso wie die neue Seekriegsführung unter der Wasseroberfläche stattfindet, findet ein Teil davon in der Luft über den Gewässern statt."
QUE_naval_effort:0	"Schiffbau finanzieren"
QUE_naval_effort_tt:0	"Nicht genug Bauplätze für §YNaval Dockyards§!"
QUE_naval_effort_desc:0	"Der Ausbau unserer Marine sollte unsere Priorität sein. Setze alle verfügbaren Ressourcen für neue Dockyards und die Erforschung von leichten Überwasserschiffen ein."
QUE_flexible_navy:0	"Flexible Marine"
QUE_flexible_navy_desc:0	"Wenn wir die Seekriegsführung neu erfinden, um den Fortschritten in der U-Boot-Technologie Rechnung zu tragen, können wir effizient gegen feindliche Konvois vorgehen."
QUE_large_navy:0	"Große Marine"
QUE_large_navy_desc:0	"Die Anpassung unserer Marinedoktrinen an große Schiffe und die Gewährleistung der Sicherheit unserer Handelskonvois wird uns viel darüber lehren, welche Art von Schiffen wir brauchen."
QUE_submarine_effort:0	"U-Boot-Kriegsführung"
QUE_submarine_effort_desc:0	"Die U-Boot-Kriegsführung ist die aufregendste Entwicklung in der Marine seit der Erfindung des Torpedoboots. Wir täten gut daran, uns vor U-Booten zu schützen und sie gegen feindliche Schiffe einzusetzen."
QUE_cruiser_effort:0	"Kreuzer konzipieren"
QUE_cruiser_effort_desc:0	"Bevor wir in die fortschrittliche Schlachtschiffforschung einsteigen, müssen die kleineren Kreuzer ersetzt werden."
QUE_destroyer_effort:0	"Zerstörer entwerfen"
QUE_destroyer_effort_desc:0	"Indem wir die Konstruktion und den strategischen Einsatz von U-Booten studiert haben, haben wir auch gelernt, wie wir diese Strategien kontern können. Zerstörer werden dafür entscheidend sein."
QUE_capital_ships_effort:0	"Interesse an Großkampfschiffen"
QUE_capital_ships_effort_desc:0	"Die Nation mit den meisten Schlachtschiffen wird die Weltmeere beherrschen. Schlachtschiffe und Flugzeugträger stehen für die alte und die neue Überlegenheit der Seestreitkräfte."
QUE_industrial_effort:0	"Industrielle Anstrengung"
QUE_industrial_effort_desc:0	"Konzentriere alle unsere politischen Bemühungen auf den Aufbau der zivilen Industrie in einem großen Sprung nach vorn."
QUE_industrial_effort_2:0	"Industrielle Anstrengung II"
QUE_industrial_effort_2_desc:0	"Mit eisernem Willen und einer unerbittlichen Arbeitsmoral können wir die Menschen für eine weitere große industrielle Anstrengung mobilisieren."
QUE_construction_effort_tt:0	"Nicht genug Bauplätze für §YZivile Fabriken§!"
QUE_construction_effort:0	"Montreals Industrien entwickeln"
QUE_construction_effort_desc:0	"„“"
QUE_production_effort:0	"Militärische Werkstätten bauen"
QUE_production_effort_tt:0	"Nicht genug Gebäudeslots für §YMilitärische Fabrik§!"
QUE_production_effort_desc:0	"Wenn du Traktoren bauen kannst, kannst du auch Panzer bauen! Wir dürfen nicht zulassen, dass unsere militärischen Produktionskapazitäten zurückbleiben."
QUE_construction_effort_2:0	"Renovierung der Häfen"
QUE_construction_effort_2_desc:0	"Wenn wir unsere Fabriken weiter ausbauen, können wir die Produktion von Waren für den Handel und weitere Baumaßnahmen beschleunigen."
QUE_production_effort_2:0	"Unterstützung der Schwerfahrzeugindustrie"
QUE_production_effort_3:0	"Integrierte Militärindustrien"
QUE_production_effort_2_desc:0	"Québec befindet sich in einer perfekten Position, um eine auf den Export ausgerichtete Industrie zu entwickeln."
QUE_production_effort_3_desc:0	"Um die Nachfrage nach neuen Ausrüstungen zu befriedigen, müssen wir den Ausbau unserer Militärfabriken weiter vorantreiben."
QUE_infrastructure_effort:0	"Die Eisenbahnen renovieren"
QUE_infrastructure_effort_desc:0	"Ein Land ohne angemessene Infrastruktur kann keine fortschrittlichen Projekte oder Konstruktionen verfolgen."
QUE_infrastructure_effort_tt:0	"Nicht genug Bauplätze für §YInfrastruktur§!"
QUE_synth_oil_effort_tt:0	"Nicht genug Bauplätze für §YSynthetische Raffinerie§!"
QUE_infrastructure_effort_2:0	"Die Straßen renovieren"
QUE_infrastructure_effort_2_desc:0	"Der Ausbau unserer Infrastruktur ermöglicht den Transport und die Kommunikation, die für geheime Hightech-Projekte notwendig sind."
QUE_construction_effort_3:0	"Nördliche Holzfällerindustrie"
QUE_construction_effort_3_desc:0	"Der Ausbau unseres Infrastrukturnetzes hat unsere Baukapazitäten deutlich verbessert."
QUE_nuclear_effort:0	"Moncalm-Projekt"
QUE_nuclear_effort_desc:0	"Wir stehen am Rande einer weltverändernden Entdeckung und können nicht zulassen, dass andere das Feuer entzünden, das eines Tages die Erde verzehren könnte."
QUE_extra_tech_slot:0	"Forschungsstipendien"
QUE_extra_tech_slot_desc:0	"Unsere industrielle Expansion und andere Fortschritte der letzten Zeit könnten es uns ermöglichen, mehr Forschung und Entwicklung parallel zu betreiben."
QUE_extra_tech_slot_2:0	"Gemeinsame Koordinierung der Innovation"
QUE_extra_tech_slot_2_desc:0	"Die schnelle Industrialisierung unseres Landes hat neue Möglichkeiten für Forschung und Entwicklung eröffnet, die wir nutzen sollten."
QUE_technology_sharing:0	"Technologieaustausch"
QUE_technology_sharing_desc:0	"Indem wir technologische Fortschritte mit unseren Verbündeten teilen, wird unsere gesamte Fraktion im Krieg effizienter F&E betreiben."
QUE_secret_weapons:0	"Geheimwaffen"
QUE_secret_weapons_desc:0	"Es ist verlockend, alle zusätzlichen Ressourcen in die Entwicklung von Panzern und Flugzeugen zu stecken, aber das Geheimnis, Kriege zu gewinnen, liegt in ganz neuen Bereichen der Wissenschaft: Elektronik, Raketen und Atomforschung."
QUE_collectivist_ethos:0	"Ermächtige die Syndikate"
QUE_collectivist_ethos_desc:0	"Unsere Feinde mögen kleinere Nationen spalten und erobern, aber unser Volk wird zusammenhalten - alle für einen und einer für alle."
QUE_liberty_ethos:0	"Demokratischer Konsens"
QUE_liberty_ethos_desc:0	"In dieser Zeit der ideologischen Fanatiker, die den menschlichen Geist ersticken wollen, werden wir die individuellen Freiheiten und die Freiheit schützen."
QUE_militarism:0	"Für Quebec!"
QUE_militarism_desc:0	"Diejenigen, die das Militär als notwendiges Übel betrachten, sind dazu verdammt, im Angesicht des Krieges zu zögern. Wir werden den Militarismus in unserer Kultur verankern und ein Volk von Soldaten werden."
QUE_political_correctness:0	"Politische Korrektheit"
QUE_political_correctness_desc:0	"Menschen, die leicht kontroverse oder anderweitig peinliche Meinungen vertreten, scheinen über eine weitreichende Verschwörung gegen sie besorgt zu sein. Das scheint eine ausgezeichnete Idee zu sein."
QUE_neutrality_focus:0	"Fokus auf Neutralität"
QUE_neutrality_focus_desc:0	"Während andere behaupten, dass es Mut und Weisheit erfordert, in einem globalen Konflikt Partei zu ergreifen, wissen wir, dass es mehr erfordert, sich zu verweigern."
QUE_interventionism_focus:0	"Interventionismus Fokus"
QUE_interventionism_focus_desc:0	"Wir schätzen die Freiheit aller Menschen, nicht nur die unserer Bürger/innen. Wenn die Verhinderung von Tyrannei Krieg bedeutet, dann soll es so sein."
QUE_military_youth:0	"Militärische Jugend"
QUE_military_youth_desc:0	"Organisationen zur Förderung von Disziplin und politischer Bildung junger Menschen in unserem Land werden Loyalität und Selbstaufopferung früh fördern."
QUE_deterrence:0	"Abschreckung"
QUE_deterrence_desc:0	"Wenn wir allein dastehen, nützt uns ein Krieg selten. Zum Glück wissen wir, dass die beste Verteidigung so bekannt ist, dass man sie nie anwenden muss."
QUE_volunteer_corps:0	"Freiwilligenkorps"
QUE_volunteer_corps_desc:0	"Unsere Leute zu zwingen, für die Ideale der Freiheit zu sterben, wäre eine Übung in Ironie, aber die Schaffung von Mitteln für diejenigen, die Menschen im Ausland helfen wollen, ist es nicht."
QUE_paramilitarism:0	"Die Milizen einbinden"
QUE_paramilitarism_desc:0	"Militärische Prinzipien lassen sich auch außerhalb des Militärs anwenden. Mehr Menschen werden eine militärische Ausbildung erhalten, wenn wir halbmilitärische Einheiten entwickeln, die unsere Streitkräfte ergänzen."
QUE_indoctrination_focus:0	"Indoktrination"
QUE_indoctrination_focus_desc:0	"Nachdem wir festgestellt haben, dass unsere Ideologie auf der Wahrheit beruht, kann sie als Wahrheit gelehrt werden. Bildung und Medien müssen diese Lektion widerspiegeln."
QUE_foreign_expeditions:0	"Ausländische Expeditionen"
QUE_foreign_expeditions_desc:0	"Da unsere Feinde bereit sind, im Namen ihrer Ideale in ferne Konflikte einzugreifen, müssen wir bereit sein, das Gleiche für unsere Ideale zu tun."
QUE_why_we_fight:0	"Warum wir kämpfen"
QUE_why_we_fight_effect:0	"Wenn wir nicht den Geist der §YNeutralen Außenpolitik§! haben, können wir Uneinigkeit schaffen.\n"
QUE_why_we_fight_desc:0	"Die Welt wird immer unsicherer. Unser Volk muss die Gräueltaten sehen, die von denen begangen werden, die nach Macht streben. Wir werden die Menschen für unsere Sache gewinnen und sicherstellen, dass alle bereit sind, für unsere Freiheit zu kämpfen."
QUE_political_commissars:0	"Politische Kommissare"
QUE_political_commissars_desc:0	"Um sicherzustellen, dass unsere Politik in der militärischen Praxis befolgt wird, werden wir politisch ernannte Beamte in die militärischen Ränge einführen."
QUE_internationalism_focus:0	"Internationalismus im Fokus"
QUE_internationalism_focus_desc:0	"Ideologie kennt keine Grenzen. Eine andere Nation mag sich souverän nennen, aber unsere Überzeugungen stehen über solchen Ansprüchen."
QUE_nationalism_focus:0	"Nationale Partei von Quebec"
QUE_ultra_nationalism_focus:0	"Nationales Erinnern"
QUE_nationalism_focus_desc:0	"Unsere Nation ist einzigartig, und unsere politischen Errungenschaften konnten nur hier entstehen. Wir müssen um jeden Preis für sie kämpfen."
QUE_ideological_fanaticism:0	"Ideologischer Fanatismus"
QUE_ideological_fanaticism_desc:0	"Unsere politisch festgelegten Werte und Ziele sind es genauso wert, für sie zu sterben, wie jeder alte Glaube. Jeder Anhänger sollte bereit sein, dem Tod ins Auge zu sehen, und diejenigen, die abtrünnig werden, sollten besser auf den Tod vorbereitet sein."
QUE_conservatism_focus:0	"Katholische Beeinflussung"
QUE_conservatism_focus_desc:0	"Katholischer Einfluss."
QUE_welfare_focus:0	"Soziale Reformen"
QUE_political_coalition_focus:0	"Politische Koalition"
QUE_political_coalition_focus_desc:0	"Politische Koalition."
QUE_support_steel_industry:0	"Unterstütze die Stahlindustrie"
QUE_support_steel_industry_desc:0	"Unser Boden ist reich an Eisenerz, das ausgebeutet werden muss, um unsere Stahlproduktion zu steigern."
QUE_rearmement_agreement:0	"Aufrüstungsabkommen"
QUE_rearmement_agreement_desc:0	"Da die Spannungen weltweit zunehmen, ist die Verbesserung unserer militärischen Organisation und unserer zivilen Verteidigung unerlässlich."
QUE_mobilize_the_rivers:0	"Mobilisierung der Flüsse"
QUE_mobilize_the_rivers_desc:0	"Unser Land verfügt über ein riesiges Potenzial an Wasserkraft, das genutzt werden sollte, um den Bedarf unserer wachsenden Industrie zu decken."
QUE_saguenay_aluminum:0	"Saguenay Aluminum"
QUE_saguenay_aluminum_desc:0	"Mit Hilfe der Wasserkraft wurde die Stadt Saguenay zu einem wichtigen Zentrum der Aluminiumproduktion."
QUE_military_industrial_cooperation:0	"Militärisch-industrielle Zusammenarbeit"
QUE_military_industrial_cooperation_desc:0	"Die Armee kann ohne Ingenieure und kleine Hände, die moderne Kriegswaffen entwerfen, nicht existieren."
QUE_expanded_research_program:0	"Erweitertes Forschungsprogramm"
QUE_expanded_research_program_desc:0	"Durch die Erweiterung unserer Fähigkeiten können wir jetzt noch mehr Rüstungsprogramme finanzieren"
QUE_vive_le_quebec_libre:0	"§CVive le Québec Libre! §!"
QUE_vive_le_quebec_libre_desc:0	""
QUE_a_standing_army:0	"Ein stehendes Heer"
QUE_a_standing_army_desc:0	"Obwohl die Wehrpflicht in unserer Provinz höchst unpopulär ist, schlagen einige in unserem militärischen Oberkommando vor, dass eine plötzliche Aufstockung der Mittel für das Militär, wenn auch nur vorübergehend, unserer jungen Nation helfen könnte, voll funktionsfähige Streitkräfte zu bekommen"
QUE_political_effort:0	"Analyse der politischen Szene in Quebec "
QUE_political_effort_desc:0	"Unser politisches System ist alles andere als perfekt, es ist sehr anfällig für Korruption. Es ist unsere Pflicht, korrupte Politiker auszumerzen!"
QUE_political_effort_puppet:0	"Vertrauen in unseren Oberbefehlshaber"
QUE_political_effort_puppet_desc:0	""
QUE_trust_in_democracy:0	"Vertrauen in den demokratischen Prozess"
QUE_trust_in_democracy_desc:0	""
QUE_radical_changes:0	"Radikale Veränderungen"
QUE_radical_changes_desc:0	""
QUE_accept_colonial_status:0	"Kolonialen Status akzeptieren"
QUE_accept_colonial_status_desc:0	""
QUE_storm_the_parliament:0	"Sturm auf das Parlament"
QUE_storm_the_parliament_desc:0	""
QUE_communist_uprising:0	"Der Generalstreik"
QUE_communist_uprising_desc:0	"Ob es die englischen Imperialisten oder die unterdrückerische Bourgeoisie sind, die Quebecer Nation wird ihre Tyrannei nicht tolerieren und alle Macht von der unfähigen bürgerlichen Regierung zurück zum Proletariat bringen!"
QUE_use_the_quebecois_nationalists:0	"Nutzt die Nationalisten"
QUE_use_the_quebecois_nationalists_desc:0	""
QUE_the_padlock_law:0	"Das Vorhängeschloss-Gesetz"
QUE_the_padlock_law_desc:0	"Das Vorhängeschloss-Gesetz, das Gesetz zur Beseitigung kommunistischer Elemente aus unserer großartigen Gesellschaft! Wir könnten dieses Gesetz auch auf die Gewerkschaften ausweiten, was unseren Bemühungen, unsere Wirtschaft auszubauen, nur schadet!"
QUE_control_the_medias:0	"Kontrolliert die Medien"
QUE_control_the_medias_desc:0	""
QUE_colonize_the_north:0	"Nördliche Kolonisation"
QUE_colonize_the_north_desc:0	""
QUE_advatageous_foreign_trade_deal:0	"Ausweitung des Handels mit unseren Nachbarn"
QUE_advatageous_foreign_trade_deal_desc:0	""
QUE_the_union_nationale_wins:0	"Die Union Nationale siegt"
QUE_the_union_nationale_wins_desc:0	""
QUE_liberal_in_charge:0	"Wiederwahl der Liberalen"
QUE_liberal_in_charge_desc:0	""
QUE_quebec_on_the_worlds_stage:0	"Quebec auf der Weltbühne"
QUE_quebec_on_the_worlds_stage_desc:0	"Nachdem die innenpolitische Situation geklärt ist, können wir endlich unsere Aufmerksamkeit auf die angespannte Außenwelt richten und vielleicht unsere Unabhängigkeit für immer sichern!"
QUE_labor_laws:0	"Arbeitsschutzgesetze verabschieden"
QUE_labor_laws_desc:0	"Einige Leute in unserer Regierung versuchen, ein Gesetz zu verabschieden, das gewerkschaftliche Aktivitäten und alles, was als "bolschewistische Propaganda" gilt, einschränkt. Obwohl es wichtig ist, uns gegen die Bedrohung durch den Kommunismus zu schützen, müssen wir dafür sorgen, dass unsere Arbeiter an ihrem Arbeitsplatz sicher sind, um zu verhindern, dass sie sich extremen Ideologien zuwenden."
QUE_ally_with_french_state:0	"Bündnis mit dem französischen Staat"
QUE_ally_with_french_state_desc:0	""
QUE_seize_foreign_assets:0	"Ausländische Vermögenswerte beschlagnahmen"
QUE_seize_foreign_assets_desc:0	""
QUE_officialize_our_ambitions_in_canada:0	"Unsere kanadischen Ambitionen offiziell machen"
QUE_officialize_our_ambitions_in_canada_desc:0	""
QUE_take_whats_rightfully_ours:0	"Holen Sie sich zurück, was uns rechtmäßig gehört"
QUE_take_whats_rightfully_ours_desc:0	""
QUE_all_power_to_the_leader:0	"Zentralisieren Sie die Macht"
QUE_all_power_to_the_leader_desc:0	""
QUE_political_nationalism:0	"Nationalistische Propaganda"
QUE_political_nationalism_desc:0	""
QUE_collectivism:0	"Versammlung der Arbeiter"
QUE_collectivism_desc:0	""
QUE_exploit_hydroelectricity:0	"Wasserkraft ausnutzen"
QUE_exploit_hydroelectricity_desc:0	""
QUE_enforce_local_ressource_exploitation:0	"Lokale Ressourcenausbeutung durchsetzen"
QUE_enforce_local_ressource_exploitation_desc:0	""
QUE_remove_the_aristocracy:0	"Entfernt die Aristokraten"
QUE_remove_the_aristocracy_desc:0	"Die Überreste der alten Ordnung sitzen immer noch auf ihren Plätzen, wenn auch ohne die einstmals große Macht, die sie besaßen. Sie haben immer noch ein gefährliches Maß an Einfluss in unserem Land, und wenn man sie nicht kontrolliert, werden sie alles tun, um die Revolution zu stürzen! Was wir vorhaben, §Mag extrem§! sein, aber es ist notwendig für das §Größere Wohl§!."
QUE_the_quebec_red_army:0	"Die Rote Armee von Québecois"
QUE_the_quebec_red_army_desc:0	"Die Revolution mag siegreich sein, aber sie braucht immer noch eine starke Armee, um sich zu behaupten. Trotz einiger Ideen fehlgeleiteter Genossen sollte die Armee an den Staat gebunden sein! Eine große rote Armee wird das Quebécois-Volk zum Sieg führen!"
QUE_communial_defense:0	"Kommunale Verteidigungsstrategien"
QUE_communial_defense_desc:0	"Das Proletariat, das über seinen alten Unterdrücker gesiegt hat, indem es seine eigenen Ketten zerbrochen hat, darf sich nicht in noch mehr Ketten legen. Wir müssen uns immer an unsere demokratischen Wurzeln erinnern, und das muss auch für unsere Streitkräfte gelten! Eine Armee des Volkes, für das Volk, ohne tyrannische Pläne!"
QUE_revolutionary_patriotism:0	"Revolutionärer Patriotismus"
QUE_revolutionary_patriotism_desc:0	"Unter uns sind unterschiedliche Menschen mit unterschiedlichem Hintergrund, aber zwei Dinge verbinden uns: Wir sind Quebécois, aber vor allem sind wir Proletarier, Arbeiter, die die Welt von den Ketten des Imperialismus und des dekadenten Kapitalismus befreien werden!"
QUE_seize_the_royal_assets:0	"Beschlagnahme der königlichen Güter"
QUE_seize_the_royal_assets_desc:0	"Die so genannten Besitztümer der Krone, die meisten Vermögenswerte, die sie fest in der Hand hält, sollen denjenigen entzogen werden, die in unserer ganzen Geschichte versucht haben, uns zu vernichten! Ihr Reichtum soll nun dem Quebécois-Volk dienen und nicht mehr den imperialistischen sogenannten "gottgegebenen" Rechten!"
QUE_collectivize_the_means_of_production:0	"Kollektivierung der Produktionsmittel"
QUE_collectivize_the_means_of_production_desc:0	"Nach Marx wird die Revolution eine klassenlose Gesellschaft hervorbringen. Um dies wirklich zu erreichen, müssen die Produktionsmittel allen gehören, d.h. alle Arbeiter in Québec werden derselben Klasse angehören."
QUE_redistribute_the_church_wealth:0	"Den Reichtum der Kirche umverteilen"
QUE_redistribute_the_church_wealth_desc:0	"Die katholische Kirche hortet zu viel Reichtum für ihr eigenes Wohl! Die Religion darf keine sektiererischen Ausmaße annehmen, und all das Geld, das für sie verschwendet wird, könnte in das Volk reinvestiert werden!"
QUE_educate_the_masses:0	"Die Massen erziehen"
QUE_educate_the_masses_desc:0	""
QUE_purge_the_anglophone:0	"Abschaffung der Zweisprachigkeit"
QUE_purge_the_anglophone_desc:0	""
QUE_united_in_communism:0	"Vereint im Kommunismus"
QUE_united_in_communism_desc:0	""
QUE_total_self_sufficiency:0	"Totale Selbstgenügsamkeit"
QUE_total_self_sufficiency_desc:0	""
QUE_shatter_the_dream:0	"Zerbrich den Traum"
QUE_shatter_the_dream_desc:0	""
QUE_free_the_canadian_workers:0	"Befreit die kanadischen Arbeiter"
QUE_free_the_canadian_workers_desc:0	""
QUE_establish_farmers_coops:0	"Gründung von landwirtschaftlichen Genossenschaften"
QUE_establish_farmers_coops_desc:0	""
QUE_forced_industrialisation:0	"Erzwungene Industrialisierung"
QUE_forced_industrialisation_desc:0	""
QUE_soviet_tank_program:0	"Sowjetisches Panzerprogramm"
QUE_soviet_tank_program_desc:0	""
QUE_align_with_moscow:0	"Angleichung an Moskau"
QUE_align_with_moscow_desc:0	""
QUE_found_hydro_quebec:0	"Found Hydro-Québec"
QUE_found_hydro_quebec_desc:0	""
QUE_reform_the_party:0	"Reform der Partei"
QUE_reform_the_party_desc:0	""
QUE_mandatory_minimum_wage:0	"Obligatorischer Mindestlohn"
QUE_mandatory_minimum_wage_desc:0	""
QUE_enforce_compulsory_education:0	"Obligatorische Schulbildung durchsetzen"
QUE_enforce_compulsory_education_desc:0	""
QUE_enforce_religious_morality:0	"Religiöse Moral in den Lehrplänen verankern"
QUE_enforce_religious_morality_desc:0	""
QUE_found_the_conseil_superieur_du_travail:0	"Found the Supreme Council of Labour"
QUE_found_the_conseil_superieur_du_travail_desc:0	""
QUE_improve_agrarian_laws:0	"Verbesserung der Agrargesetze"
QUE_improve_agrarian_laws_desc:0	""
QUE_encourage_local_participation:0	"Lokale Partizipation ermutigen"
QUE_encourage_local_participation_desc:0	"Am Ende der alten Ordnung war die Beteiligung der Massen an der politischen Szene recht begrenzt. Heutzutage werden wir mehr lokale Ausschüsse einrichten, damit die Menschen im ganzen Land am politischen Leben teilnehmen können!"
QUE_councilism:0	"Rätesystem"
QUE_councilism_desc:0	"Wenn wir stark und geeint bleiben wollen, müssen wir unsere politische Struktur anpassen, um die Demokratie zu einem festen Bestandteil unserer Ideologie zu machen."
QUE_enforce_quotas:0	"Quoten durchsetzen"
QUE_enforce_quotas_desc:0	"Wenn wir stark sein wollen, müssen wir effizient sein! Die Revolution erledigt sich nicht von selbst, wenn wir in der Ecke sitzen und nichts tun! Jeder Proletarier soll für die Revolution arbeiten, und wer das nicht tut, soll erfahren, was mit Konterrevolutionären geschieht!"
QUE_provide_to_the_people:0	"Dem Volk zur Seite stehen"
QUE_provide_to_the_people_desc:0	"Die große Revolution in Québecois war ein Erfolg, keine Frage. Wir müssen jedoch den angehäuften Reichtum nutzen, um all jenen zu geben, die unter der roten Fahne der Arbeit stehen, um sicherzustellen, dass der Sozialismus wirklich dem Volk dient."
QUE_focus_on_family:0	"Fokus auf die Familie"
QUE_focus_on_family_desc:0	"Unser Staat muss nach den Grundsätzen "Travail, Famille, Patrie" geführt werden, eine dieser Säulen ist die Familie, die wieder eine zentrale Rolle in der sozialen Stellung der Bevölkerung von Quebec einnehmen muss!"
QUE_contact_blueshirts:0	"Kontakt zu den Blueshirts"
QUE_contact_blueshirts_desc:0	""
QUE_national_identity_propaganda:0	"Propaganda für die nationale Identität"
QUE_national_identity_propaganda_desc:0	"Der Geist der Québecois ist stark und ihre Kultur ist reich! Wir sollten mehr tun, um ihn in der Bevölkerung zu verbreiten!"
QUE_first_nationalist_congress:0	"Erster Nationalistischer Kongress"
QUE_first_nationalist_congress_desc:0	"Unsere Bewegung hat es zwar geschafft, die Macht zu übernehmen, und wir haben begonnen, die Gesellschaft von Québec zu beherrschen, aber wir sind untereinander sehr gespalten. Zwei große Fraktionen sind aus unserer Herrschaft hervorgegangen: die Anhänger des orthodoxen Faschismus von Paul Bouchard und die Katholizismusbesessenen von Lionel Groulx. Durch die Einberufung eines Kongresses werden wir das Volk seinen zukünftigen Führer wählen lassen!"
QUE_abandon_ultramontanism:0	"Abkehr vom Ultramontanismus"
QUE_abandon_ultramontanism_desc:0	"Lionel Groulx und seine Anhänger haben nicht erkannt, welche Bedrohung ein ultrareligiöser theokratischer Staat für unsere Herrschaft darstellen könnte! Glücklicherweise können wir jetzt, da wir an der Macht sind, jeden potenziellen Schaden, den der theokratische Dreck angerichtet hat, rückgängig machen."
QUE_glorify_clerical_past:0	"Verherrlichung der klerikalen Vergangenheit"
QUE_glorify_clerical_past_desc:0	"Québec und im weiteren Sinne auch Neufrankreich waren beides Länder, die während ihrer Existenz schreckliche Entbehrungen hinnehmen mussten! Jetzt, wo die Anhänger Gottes an der Macht sind, werden wir der Welt beweisen, dass wir ein von Gott auserwähltes Volk sind!"
QUE_disband_parlimentarism:0	"Parlamentarismus auflösen"
QUE_disband_parlimentarism_desc:0	"Was hat uns die so genannte "Demokratie" gebracht, außer uns zu schwächen, zu spalten und zu unterjochen? Wir sollten sie abschaffen, nachdem wir uns unserer Gegner entledigt haben!"
QUE_promote_interventionism:0	"Förderung des wirtschaftlichen Interventionismus"
QUE_promote_interventionism_desc:0	"Die Menschen machen zu lassen, was sie wollen, besonders wenn es um unsere staatliche Wirtschaft geht, wäre so dumm, als würde man ihnen eine geladene Waffe geben! Wir sollten sicherstellen, dass der Staat und nur der Staat die Kontrolle über die Wirtschaft hat."
QUE_patriotic_education:0	"Patriotische Erziehung"
QUE_patriotic_education_desc:0	"Der erste Schritt, um die Liebe zu unserer großen Nation zu vermitteln, ist die Erziehung! Wir sollten sicherstellen, dass die Bildungsprogramme an unseren Standpunkt angepasst werden, selbst wenn wir die Art und Weise, wie die Geschichte geschrieben wurde, ändern müssen..."
QUE_deal_with_opposition:0	"Umgang mit Opposition"
QUE_deal_with_opposition_desc:0	"Viele in unserem Volk sind immer noch gegen unsere Herrschaft, vor allem die Kommunisten und die pro-demokratischen Partisanen. Diese traurige Realität hat uns gezwungen, eine Entscheidung zu treffen: Wir müssen einige Leute beseitigen, §Aber wie viele Leute sollen wir beseitigen?§!"
QUE_integrate_new_england:0	"Neuengland eingliedern"
QUE_integrate_new_england_desc:0	""
QUE_secret_police:0	"Geheimdienste schaffen"
QUE_secret_police_desc:0	"Können wir wirklich darauf vertrauen, dass das Proletariat von Quebec nicht an schädliche Ideologien glaubt? Wir müssen die Überwachung des Staates verstärken, um sicherzustellen, dass Andersdenkende verhaftet werden!"
QUE_a_bright_future_ahead:0	"Die strahlende Zukunft vor uns"
QUE_a_bright_future_ahead_desc:0	"Wir haben gesiegt, der Sozialismus hat gesiegt, und die Idee einer freien Nation Quebecois hat gesiegt! Jetzt, wo unser Volk in Einheit und Sozialismus lebt, müssen wir über unsere Grenzen hinausblicken!"
QUE_toward_utopian_socialism:0	"Auf dem Weg zum utopischen Sozialismus"
QUE_toward_utopian_socialism_desc:0	""
QUE_quebecois_peoples_republic:0	"Quebecer stalinistische Theorie"
QUE_quebecois_peoples_republic_desc:0	""
QUE_bust_down_the_unions:0	"Zerschlagt die Gewerkschaften"
QUE_bust_down_the_unions_desc:0	"Was haben die Gewerkschaften mit uns gemacht? Alles, was sie getan haben, war, die abscheulichen kommunistischen Ideale zu verbreiten und berechtigten faulen Arbeitern zu erlauben, ihre hart arbeitenden rechtmäßigen Chefs zu kontrollieren!"
QUE_carry_on_the_work:0	"Den Kurs fortsetzen"
QUE_carry_on_the_work_desc:0	"Unsere Partei hat unglaublich viel getan, um Québec zu verbessern! Es wäre töricht, alles wegen Illusionen zu ruinieren."
QUE_liberals_legacy_saved:0	"Das Erbe der Liberalen Partei gerettet"
QUE_liberals_legacy_saved_desc:0	"Wir haben es geschafft! Wir haben die Partei gerettet! Das Volk von Québec hat uns für eine weitere Amtszeit das Vertrauen geschenkt, und wir haben unser Bestes gegeben!"
QUE_universal_suffrage:0	"Allgemeines Wahlrecht"
QUE_universal_suffrage_desc:0	"Eine letzte Wahlrechtsreform ist notwendig, bis jeder Erwachsene in Québec wählen darf: das allgemeine Wahlrecht! Mit unserer Mehrheit im Parlament kann uns nichts daran hindern, dies zu verwirklichen!"
QUE_safeguard_the_rights_to_unionize:0	"Das Recht auf gewerkschaftliche Organisierung bewahren"
QUE_safeguard_the_rights_to_unionize_desc:0	"Arbeit ist ein wesentlicher Bestandteil des Lebens, warum sollten wir sie also nicht ein wenig erträglicher machen?"
QUE_institute_social_welfare:0	"Institut für soziale Wohlfahrt"
QUE_institute_social_welfare_desc:0	""
QUE_further_funding_to_culture:0	"Weiterer Fonds Kultur"
QUE_further_funding_to_culture_desc:0	""
QUE_incorporate_hydroquebec_in_the_state:0	"Weitere Investitionen in Hydro-Québec"
QUE_incorporate_hydroquebec_in_the_state_desc:0	"Die liberale Regierung hat nicht nur versprochen, die Elektrizität zu verstaatlichen, sondern den Menschen auch eine ständige Investition in die ländliche Elektrifizierung versprochen."
QUE_enshrine_women_rights:0	"Die Rechte der Frauen verankern"
QUE_enshrine_women_rights_desc:0	""
QUE_promote_french_language:0	"Förderung der französischen Sprache"
QUE_promote_french_language_desc:0	""
QUE_electrify_the_countryside:0	"Elektrifizierung des ländlichen Raums"
QUE_electrify_the_countryside_desc:0	""
QUE_let_the_church_control_education_and_healthcare:0	"Gesundheits- und Bildungswesen in kirchlicher Trägerschaft"
QUE_let_the_church_control_education_and_healthcare_desc:0	""
QUE_subsidies_to_corporations:0	"Subventionen für Unternehmen"
QUE_subsidies_to_corporations_desc:0	""
QUE_abandon_electorialism:0	"Abschaffung des Wahlrechts"
QUE_abandon_electorialism_desc:0	"Wir haben die Gesellschaft von Québec bereits fast vollständig im Griff, warum sollten wir ihn nicht völlig verabsolutieren?"
QUE_limit_economic_government_interference:0	"Begrenzung der staatlichen Einmischung in die Wirtschaft"
QUE_limit_economic_government_interference_desc:0	""
QUE_greater_quebec_concept:0	"Kanadisches Land integrieren"
QUE_greater_quebec_concept_desc:0	""
QUE_democratic_diplomacy:0	"Demokratische Diplomatie"
QUE_democratic_diplomacy_desc:0	""
QUE_diplomatic_neutrality:0	"Diplomatische Neutralität"
QUE_diplomatic_neutrality_desc:0	""
QUE_demand_newfoundlands:0	"Nachfrage Neufundland"
QUE_demand_newfoundlands_desc:0	""
QUE_demand_new_brunswick:0	"Nachfrage New Brunswick"
QUE_demand_new_brunswick_desc:0	""
QUE_consolidate_le_chefs_rule:0	"Die Herrschaft von 'Le Chef' festigen"
QUE_consolidate_le_chefs_rule_desc:0	"Nach der Unterbrechung des Wahlprozesses müssen wir die Nation um Duplessis scharen!"
QUE_spy_the_opposition:0	"Spionage gegen die Opposition"
QUE_spy_the_opposition_desc:0	""
QUE_encourage_traditionalist_economics:0	"Traditionalistische Wirtschaftsideale durchsetzen"
QUE_encourage_traditionalist_economics_desc:0	"Wenn wir die gesamte Geschichte betrachten, sind die Entartung der industriellen Revolution und die Abschaffung der katholischen Lebensweise die beiden Gründe, die zum Niedergang unseres Volkes geführt haben! Wir müssen eine traditionellere Wirtschaftslehre zurückbringen, damit jeder dem Glauben folgen muss, um zu leben!"
QUE_give_power_to_the_clergy:0	"Gebt dem Klerus Macht"
QUE_give_power_to_the_clergy_desc:0	""
QUE_christian_social_security:0	"Christliche Sozialversicherung"
