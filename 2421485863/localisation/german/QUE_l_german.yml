QUE_communism_party:0	"Lokomotivindustrie"
QUE_communism_party_long:0	"Der schnelle Transport von großen Mengen an Gütern über Land kann nur durch Züge erfolgen, also investieren wir in sie!"
QUE_fascism_party:0	"Bombardier-Fahrzeuge"
QUE_fascism_party_long:0	"Bombardier ist für die Erfindung des Schneemobils bekannt, vielleicht könnten wir ihre genialen Ideen und Industrietechniken nutzen, um unseren eigenen Kriegsmaschinen zu helfen."
QUE_democratic_party:0	"Tank-Programm"
QUE_democratic_party_long:0	"Kriege werden nicht mehr von Infanterie und Willenskraft allein gewonnen. Wir werden größere technologische Fortschritte brauchen, um zu triumphieren, und die Gründung eines "Tank Program" wird der erste Schritt sein."
QUE_democratic_party_alternate:0	"Angus Shop Tank Produktion"
QUE_democratic_party_alternate_long:0	"The CPR Angus Shops manufacturies are great producer of various locomotives in the Montréal region. Vielleicht könnten wir ihre Fabriken nutzen, um unseren Militärkomplex zu unterstützen."
QUE_neutrality_party:0	"Sorel Industries"
QUE_neutrality_party_long:0	"Die günstige Lage entlang des St. Lawrence und die Nähe zu den Stahlwerken ist perfekt für die Produktion von schweren militärischen Ausrüstungen wie Artilleriegeschützen."
QUE_communism_party_soviet:0	"Artillerie-Verbesserungen"
QUE_communism_party_soviet_long:0	"Artillerie ist das Rückgrat der Armee, sie zu verbessern ist der logische Schritt nach vorne."
