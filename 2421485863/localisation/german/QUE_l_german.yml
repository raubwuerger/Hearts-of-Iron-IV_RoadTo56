QUE_find_an_alliance_category_desc:0	"Während die Welt in Aufruhr ist, gibt es diejenigen, die an den wahren Werten der Demokratie festhalten. Wir sollten ihnen die Hand reichen und eine Allianz gründen, damit wir gemeinsam die Werte der Freiheit verteidigen und eine vereinte Front gegen den Faschismus bilden können."
QUE_reclaim_our_cores:0	"Unser Land zurückerobern"
QUE_reclaim_our_cores_desc:0	"Der Siebenjährige Krieg und der anschließende Vertrag von Paris im Jahr 1763 beendeten die französische Herrschaft über die Provinz. Durch diesen Führungswechsel wurde Neufrankreich ein Großteil seines Landes entzogen. Vor der Konföderation verfügte Québec nur über die Hälfte des Landes, das es heute besitzt. Obwohl Québec durch Eroberungen oder Verträge Gebiete zurückerobern konnte, sollten diese wieder in Groß-Québec integriert werden."
