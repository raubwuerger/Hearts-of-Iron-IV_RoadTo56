ARG_south_atlantic_islands_desc:		"Die Falkland- und Südgeorgien-Inseln sind souveränes Territorium der [ENG.GetName] und das schon seit vielen Jahren. Trotz unserer eigenen Ansprüche auf die Inseln, die so nahe an [ARG.GetName] liegen, bleiben sie unter [ENG.GetAdjective]-Herrschaft. Mit unserem neuen Bündnis mit der [ENG.GetName] können wir vielleicht eine Übergabe der Inseln an uns aushandeln. Immerhin werden wir sie in diesem Krieg besser schützen können."
