ARG_bolivia_claim_threat:0					"[ARG.GetNameDefCap] Erhebt Anspruch auf Bolivien"
ARG_chile_claim_threat:0					"[ARG.GetNameDefCap] Erhebt Anspruch auf Chile"
ARG_brazil_puppet_threat:0					"[ARG.GetNameDefCap] verkündete seine übergeordneten Ambitionen über [Bra.GetNameDef]"
ARG_the_end_of_justo_political_life:0					"Das Ende des politischen Lebens von Präsident Justo"
ARG_rename_islands:0					"Marsch auf die Malwinen"
latin_peace:0					"Lateinamerikanischer Frieden"
latin_peace_desc:0					"Es ist schwierig, aber nicht unmöglich, in diesen schwierigen Zeiten Frieden zu finden..."
argentina.1.t:0					"Die Suche nach externen Militärberatern"
argentina.1.d:0					"Die Großmächte der Welt haben bedeutende Fortschritte in der Militärtaktik gemacht. Es wäre gut, eine dieser Nationen zu bitten, uns bei unseren Bemühungen um die Modernisierung unseres Militärs zu unterstützen."
argentina.1.eng:0					"Die [ENG.getAdjective]-Armee könnte uns fortschrittliche Planung lehren"
argentina.1.ger:0					"Die [GER.getAdjective] Armee könnte uns lehren, wie man Panzer einsetzt"
argentina.1.sov:0					"Die [SOV.getAdjective]-Armee könnte uns an ihrer Theorie des 'tiefen Kampfes' teilhaben lassen."
argentina.1.usa:0					"Die [USA.getAdjective] Armee könnte uns lehren, wie wir Feuerkraft zu unserem Vorteil nutzen können."
argentina.2.t:0					"[ARG.GetNameDefCap] Fordert die [299.GetName]"
argentina.2.d:0					"In den letzten Monaten haben [ARG.getAdjective] Kräfte im ganzen Land mobil gemacht und mit einem großen Krieg gedroht, wenn wir ihnen die [299.GetName] nicht abtreten."
argentina.2.cede:0					"Es sind sowieso nur ein paar Felsen auf der anderen Seite der Welt..."
argentina.2.deny:0					"Das Imperium muss verteidigt werden!"
argentina.3.t:0					"[ARG.getAdjective] Ultimatum"
argentina.3.d:0					"Mit einer bedrohlichen Anzahl von Truppen an unseren Grenzen haben [ARG.getAdjective] Diplomaten ein Ultimatum gestellt, in dem sie uns auffordern, uns ihrer Besatzung zu unterwerfen, und mit Krieg drohen, falls wir das nicht tun."
argentina.3.cede:0					"Wir müssen das Unvermeidliche akzeptieren."
argentina.3.deny:0					"Wir werden uns den Tyrannen nicht ergeben!"
argentina.4.t:0					"Ein [ARG.getAdjective] Forschungsabkommen?"
argentina.4.d:0					"[ARG.getAdjective] Diplomaten kamen mit einem Vorschlag für ein Forschungsabkommen zwischen unseren Nationen. Dieses Projekt könnte nicht nur für die Forschung von Nutzen sein, sondern uns auch helfen, ein Band zwischen unseren beiden Ländern zu knüpfen."
argentina.4.accept:0					"Akzeptieren Sie den Vorschlag"
argentina.4.refuse:0					"Lehnen Sie das Angebot ab"
argentina.5.t:0					"Die [ARG.getAdjective] Regierung bittet um Unterstützung"
argentina.5.d:0					"Die [ARG.getAdjective] Streitkräfte müssen modernisiert werden. Um dieses Ziel zu erreichen, hat sie uns um Hilfe gebeten. Dies könnte dazu beitragen, unseren Einfluss auf sie zu erhöhen."
argentina.5.help:0					"Schicken Sie Militärberater"
argentina.5.refuse:0					"Lehnen Sie den Vorschlag ab"
argentina.6.t:0					"Die [ARG.getAdjective] Regierung bittet um Unterstützung"
argentina.6.d:0					"Die [ARG.getAdjective] Streitkräfte müssen modernisiert werden. Um dieses Ziel zu erreichen, hat sie uns um Hilfe gebeten. Dies könnte dazu beitragen, unseren Einfluss auf sie zu erhöhen."
argentina.6.help:0					"Schicken Sie Militärberater"
argentina.6.refuse:0					"Lehnen Sie den Vorschlag ab"
argentina.7.t:0					"Die [ARG.getAdjective] Regierung bittet um Unterstützung"
argentina.7.d:0					"Die [ARG.getAdjective] Streitkräfte müssen modernisiert werden. Um dieses Ziel zu erreichen, hat sie uns um Hilfe gebeten. Dies könnte dazu beitragen, unseren Einfluss auf sie zu erhöhen."
argentina.7.help:0					"Schicken Sie Militärberater"
argentina.7.refuse:0					"Lehnen Sie den Vorschlag ab"
argentina.8.t:0					"Die [ARG.getAdjective] Regierung bittet um Unterstützung"
argentina.8.d:0					"Die [ARG.getAdjective] Streitkräfte müssen modernisiert werden. Um dieses Ziel zu erreichen, hat sie uns um Hilfe gebeten. Dies könnte dazu beitragen, unseren Einfluss auf sie zu erhöhen."
argentina.8.help:0					"Schicken Sie Militärberater"
argentina.8.refuse:0					"Lehnen Sie den Vorschlag ab"
argentina.9.t:0					"Die [ARG.getAdjective] Regierung bittet um Unterstützung"
argentina.9.d:0					"Trotz der Bemühungen unserer Diplomaten wurde unserer Nation Hilfe verweigert."
argentina.9.help:0					"Wir könnten eine der anderen möglichen Nationen fragen"
argentina.9.refuse:0					"Dann werden wir es selbst tun..."
argentina.10.t:0					"[ENG.getAdjective] Berater"
argentina.10.d:0					"[ENG.GetNameDefCap] hat sich bereit erklärt, uns Ratschläge zu erteilen und uns bei unserem Streben nach militärischer Modernisierung zu helfen, indem sie uns lehren, was sie aus dem großen Krieg gelernt haben, und das alles im Austausch für ein Mitspracherecht in unserer Innenpolitik."
argentina.10.a:0					"Jede erfolgreiche Operation beginnt mit einem Plan."
argentina.11.t:0					"[GER.getAdjective] Advisers"
argentina.11.d:0					"[GER.GetNameDefCap] hat sich bereit erklärt, uns bei unseren militärischen Modernisierungsbemühungen zu beraten und zu unterstützen, indem er uns seine fortschrittlichen Militärtaktiken zur Verfügung stellt, und das alles im Austausch für ein Mitspracherecht in unserer Innenpolitik."
argentina.11.a:0					"Bewegung ist also der Schlüssel zum Sieg, mhm?"
argentina.12.t:0					"[SOV.getAdjective] Berater"
argentina.12.d:0					"[SOV.GetNameDefCap] hat sich bereit erklärt, unser Militär auszubilden und uns bei der militärischen Modernisierung zu helfen. Dafür werden sie uns beibringen, Männer zu Tausenden zu bewegen, und das alles im Austausch für ein Mitspracherecht in unserer Innenpolitik."
argentina.12.a:0					"Die Tiefe des Feindes muss erreicht und zerstört werden."
argentina.13.t:0					"[USA.getAdjective] Berater"
argentina.13.d:0					"[USA.GetNameDefCap] hat unserer Bitte zugestimmt und erklärt, dass eine militärische Macht in der Region hilfreich wäre, wenn Amerika jemals mit einer äußeren Bedrohung konfrontiert würde. Um uns bei unserer militärischen Modernisierung zu helfen, werden sie uns in größeren Waffenfähigkeiten unterweisen."
argentina.13.a:0					"Wir brauchen mehr Kanonen und mehr Granaten."
argentina.14.t:0					"[ARG.GetNameDefCap] will sich den Achsenmächten anschließen"
argentina.14.d:0					"[ARG.getAdjective] Diplomaten sind heute in Berlin eingetroffen und haben ihre Absichten deutlich gemacht. [ARG.GetNameDefCap] bittet darum, als vollwertiges Mitglied der Achsenmächte aufgenommen zu werden."
argentina.14.a:0					"Wir brauchen mehr Verbündete."
argentina.14.b:0					"Lehnen Sie das Angebot ab."
argentina.15.t:0					"[ARG.GetNameDefCap] bittet um den Beitritt zur Komintern"
argentina.15.d:0					"[ARG.getAdjective] Diplomaten aus Argentinien sind heute in Moskau eingetroffen und haben ihre Absichten deutlich gemacht. [ARG.GetNameDefCap] beantragt formell die Aufnahme in die Komintern"
argentina.15.a:0					"Sie müssen der Internationale beitreten"
argentina.15.b:0					"Lehnen Sie das Angebot ab."
argentina.16.t:0					"[ARG.GetNameDefCap] bittet um die [299.GetName]"
argentina.16.d:0					"[ARG.getAdjective] Diplomaten haben sich heute mit einer besonderen Bitte an uns gewandt. Sie wollen, dass wir ihnen die territoriale Verwaltung der [299.GetName] überlassen. Sie behaupten, dass dies unsere Last erleichtern würde und dass sie das Recht haben, die Inseln zu regieren."
argentina.16.a:0					"Stimmen Sie ihren Forderungen zu"
argentina.16.b:0					"Die [299.GetName] gehören uns!"
argentina.17.t:0					"[ARG.GetNameDefCap] fordert [720.GetName]"
argentina.17.d:0					"Diplomaten von [ARG.GetNameDef] kamen heute mit einer besonderen Bitte. Sie wollen, dass wir die territoriale Verwaltung von [720.GetName] an sie abtreten. Sie behaupten, dass dies unsere Last erleichtern würde und dass sie das Recht haben, die Insel zu regieren."
argentina.17.a:0					"Stimmen Sie ihren Forderungen zu"
argentina.17.b:0					"Verweigern Sie ihnen die Herrschaft über die Insel."
argentina.18.t:0					"[ARG.GetNameDefCap] Forderungen [720.GetName]"
argentina.18.d:0					"Trotz des jüngsten Vertrags, in dem wir die Falkland-Inseln an sie abgetreten haben, scheint [ARG.getLeader] davon besessen zu sein, sich alles Land zu nehmen, von dem sie glauben, dass es seinem Land gehört."
argentina.18.a:0					"Wenn es notwendig ist, um den Frieden zu erhalten..."
argentina.18.b:0					"Es ist britischer Boden!"
argentina.23.t:0					"[ARG.getAdjective] Vorschlag zur Zusammenarbeit"
argentina.23.d:0					"Die Regierung von [ARG.getAdjective] hat ein Team von Fachleuten und Diplomaten entsandt, um einen Vorschlag zu unterbreiten, der für uns beide von Vorteil wäre und die industrielle Entwicklung Südbrasiliens und unserer nordöstlichen Regionen fördern würde."
argentina.23.a:0					"Akzeptieren Sie den Vorschlag"
argentina.23.b:0					"Lehnen Sie das Angebot ab"
argentina.24.t:0					"Ein [ARG.getAdjective] Nichtangriffsvertrag?"
argentina.24.d:0					"[ARG.getAdjective] Diplomaten kamen mit einem Vorschlag für einen Nichtangriffsvertrag und behaupteten, dass dies die politische und wirtschaftliche Stabilität in der Region erhöhen würde."
argentina.24.a:0					"Unterzeichnen Sie den Vertrag"
argentina.24.b:0					"lehnen Sie jedes Abkommen dieser Art ab."
argentina.25.t:0					"[ARG.GetNameDefCap] will sich den Alliierten anschließen"
argentina.25.d:0					"[ARG.getAdjective] Diplomaten kamen heute an und baten darum, mit unserer Regierung gemeinsame Sache zu machen, um zur internationalen Stabilität beizutragen."
argentina.25.a:0					"Jede Hilfe ist willkommen"
argentina.25.b:0					"Wir würden ihre Hilfe lieber nicht annehmen."
argentina.26.t:0					"[299.GetName] Wurde an uns abgetreten!"
argentina.26.d:0					"Da sie dem Druck von [ARG.getAdjective] nicht widerstehen konnten und nicht in einen weiteren Krieg verwickelt werden wollten, wurden die Token-Truppen auf den Malwinen evakuiert und das Gebiet unseren glorreichen Truppen überlassen."
argentina.26.a:0					"¡Las Malvinas son Argentinas!"
argentina.27.t:0					"[299.Owner.GetNameDefCap] Unsere Forderungen in Bezug auf die Malwinen wurden zurückgewiesen!"
argentina.27.d:0					"Trotz unseres starken Militärs und der Bemühungen unserer Diplomaten scheinen die [299.Owner.GetAdjective] nicht bereit zu sein, unseren legitimen Anspruch auf die Malwinen anzuerkennen, so dass uns keine andere Wahl bleibt, als sie mit Gewalt zu erobern."
argentina.27.a:0					"¡Las Malvinas son Argentinas!"
argentina.28.t:0					"[720.GetName] sind an uns abgetreten worden!"
argentina.28.d:0					"Dank unseres starken Militärs und in dem Bemühen, einen Krieg zu vermeiden, wurde [720.GetName] rechtmäßig als Teil unserer mächtigen Nation anerkannt."
argentina.28.a:0					"Das ist ein nationaler Triumph!"
argentina.29.t:0					"[720.Owner.GetNameDefCap] hat unsere Forderungen in Bezug auf die [720.GetName] zurückgewiesen!"
argentina.29.d:0					"Trotz der Rechtmäßigkeit unseres Anspruchs und der Stärke unseres Militärs haben die Briten beschlossen, unser Ultimatum abzulehnen. Wir werden es uns mit Gewalt nehmen müssen."
argentina.29.a:0					"Südgeorgien wird auf die eine oder andere Weise unser sein"
argentina.30.t:0					"Die Briten treten die Malwinen ab"
argentina.30.d:0					"Dank unserer Beziehungen zu Großbritannien und der Arbeit unserer Diplomaten haben die Briten zugestimmt, die Malwinen an uns abzutreten."
argentina.30.a:0					"Die Malwinen sind argentinisch!"
argentina.31.t:0					"Die Briten lehnen unsere Forderung nach den Malwinen ab"
argentina.31.d:0					"Trotz unserer Verbindungen zu Großbritannien und der Arbeit unserer Diplomaten in London haben die Briten entschieden, dass es das Beste ist, wenn die Malwinen unter britischer Herrschaft bleiben."
argentina.31.a:0					"Das werden wir nicht vergessen"
argentina.32.t:0					"Die Briten treten Südgeorgien ab"
argentina.32.d:0					"Dank unserer Beziehungen zu Großbritannien und der Arbeit unserer Diplomaten in London haben die Briten unserer Bitte um die Herrschaft über Südgeorgien entsprochen."
argentina.32.a:0					"Wir bekommen zurück, was uns rechtmäßig gehört"
argentina.33.t:0					"Die Briten lehnen unsere Bitte um Südgeorgien ab"
argentina.33.d:0					"Trotz unserer Verbindungen zu Großbritannien und der Arbeit unserer Diplomaten in London haben die Briten entschieden, dass es das Beste ist, wenn Südgeorgien unter britischer Herrschaft bleibt"
argentina.33.a:0					"Eine Beleidigung für jeden Argentinier"
argentina.34.t:0					"Brasilien akzeptiert Vorschlag zur Zusammenarbeit"
argentina.34.d:0					"Brasilien hat sich bereit erklärt, mit uns zusammenzuarbeiten, um die Industrie in Südamerika anzukurbeln"
argentina.34.a:0					"Vereint sind wir stark"
argentina.35.t:0					"Brasilien lehnt Vorschlag zur Zusammenarbeit ab"
argentina.35.d:0					"Trotz der gegenseitigen Vorteile, die eine Zusammenarbeit zwischen unseren Ländern bringen würde, hat Brasilien kein Interesse an unserer Initiative gezeigt."
argentina.35.a:0					"So soll es sein"
argentina.36.t:0					"Brasilien akzeptiert den Nichtangriffspakt"
argentina.36.d:0					"Die brasilianische Nation hat sich bereit erklärt, einen Nichtangriffspakt mit uns zu unterzeichnen. Dies wird den Frieden fördern und die Spannungen in Südamerika verringern."
argentina.36.a:0					"Dies könnte der Beginn von etwas Größerem sein"
argentina.37.t:0					"Brasilien lehnt Nichtangriffspakt ab"
argentina.37.d:0					"Die brasilianische Nation, die vielleicht an unseren wahren Absichten zweifelt, hat beschlossen, unseren Vorschlag abzulehnen."
argentina.37.a:0					"Schade"
argentina.38.t:0					"Uruguay kapituliert"
argentina.38.d:0					"Dank unseres starken Militärs hat Uruguay beschlossen, unser Ultimatum zu akzeptieren. Wir haben jetzt die Kontrolle über Uruguay."
argentina.38.a:0					"Ausgezeichnet"
argentina.39.t:0					"Uruguay widersetzt sich"
argentina.39.d:0					"Trotz unserer starken Militärpräsenz in der Region haben die uruguayischen Behörden beschlossen, unser Ultimatum abzulehnen "
argentina.39.a:0					"Dann gibt es Krieg"
argentina.40.t:0					"Die Sowjets akzeptieren den Vorschlag"
argentina.40.d:0					"Die Sowjetunion hat beschlossen, unseren Vorschlag für ein Forschungsabkommen zwischen unseren Nationen zu akzeptieren. Die Forschungsgebiete sind hauptsächlich die Elektronik, von der sich unsere beiden Länder große technologische Vorteile erhoffen "
argentina.40.a:0					"Gute Nachrichten"
argentina.41.t:0					"Die Sowjets lehnen den Vorschlag ab"
argentina.41.d:0					"Unsere Diplomaten in Moskau informieren uns, dass die Sowjetunion beschlossen hat, unser vorgeschlagenes Forschungsabkommen abzulehnen."
argentina.41.a:0					"Wie schade"
argentina.42.t:0					"Wir werden in die Achsenmächte aufgenommen"
argentina.42.d:0					"Die große Nation Deutschland hat beschlossen, uns in die Achsenmächte aufzunehmen. Wir hoffen, dass wir durch dieses Bündnis die Größe erreichen werden, die Argentinien verdient."
argentina.42.a:0					"Wir werden gemeinsam viele große Dinge erreichen"
argentina.43.t:0					"Deutschland sagt nein"
argentina.43.d:0					"Trotz unserer engen Verbundenheit und unseres Interesses, Deutschland zu helfen, haben sie beschlossen, dass es nicht in ihrem Interesse liegt, uns in die Achse aufzunehmen"
argentina.43.a:0					"Sie verlieren einen mächtigen Verbündeten"
argentina.44.t:0					"Wir werden in die Komintern aufgenommen"
argentina.44.d:0					"Die Sowjetunion hat beschlossen, uns in die Komintern aufzunehmen, und nun sind wir Teil der dritten Internationale, Faschisten und Kapitalisten haben keine Chance gegen die Macht des Volkes"
argentina.44.a:0					"Wir stehen jetzt zusammen"
argentina.45.t:0					"Die UdSSR sagt nein"
argentina.45.d:0					"Trotz unserer politischen Ausrichtung und unserer guten Beziehungen hat die Sowjetunion entschieden, dass es besser wäre, wenn jede Nation ihren eigenen Weg geht."
argentina.45.a:0					"So soll es sein"
argentina.46.t:0					"Wir werden in die Alliierten aufgenommen"
argentina.46.d:0					"Nachrichten aus London! Großbritannien hat uns in den Kreis der Alliierten aufgenommen. Endlich können wir unseren Beitrag zur Erhaltung des Weltfriedens leisten."
argentina.46.a:0					"Wir werden unser Bestes geben"
argentina.47.t:0					"Großbritannien sagt nein"
argentina.47.d:0					"Trotz unserer Beziehungen zu Großbritannien haben sie entschieden, dass es nicht der richtige Zeitpunkt für einen Beitritt zu den Alliierten ist, vielleicht später"
argentina.47.a:0					"Aber wenn nicht jetzt, wann dann?"
latin.1.t:0					"Antikriegsvertrag"
latin.1.d:0					"Um den Frieden und die Einheit Lateinamerikas zu fördern, veranstaltet Argentinien eine Reihe von Treffen, bei denen Regeln zwischen unseren Ländern festgelegt werden, um militärische Konfrontationen zu vermeiden"
latin.1.a:0					"Unterzeichnen Sie den Vertrag"
latin.1.b:0					"Unterschreiben Sie den Vertrag nicht"
latin.2.t:0					"La Patria Grande"
latin.2.d:0					"Argentinien hat beschlossen, dass Frieden nicht genug ist. Um sich gegen eine immer gefährlicher werdende Welt zu behaupten und jeden Möchtegern-Invasor abzuwehren, schlägt Argentinien ein großes Bündnis zwischen allen lateinamerikanischen Nationen vor. Patria Grande."
latin.2.a:0					"Treten Sie der Patria Grande bei"
latin.2.b:0					"Treten Sie nicht der Patria Grande bei"
