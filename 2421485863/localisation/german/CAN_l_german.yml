r56_CAN_the_big_cut_01:0				"Der große Schnitt"
r56_CAN_the_big_cut_01_desc:0				"Das Budget des [CAN.GetAdjective]-Militärs ist in den letzten Jahren stark gekürzt worden. Das wirkt sich auf die Ausbildung unserer Truppen und die Rüstungsproduktion aus, bis wir es schaffen, unser Budget zu erhöhen."
r56_CAN_the_big_cut_02:0				"Die große Kürzung"
r56_CAN_the_big_cut_02_desc:0				"Das [CAN.GetAdjective] Militär hat in den letzten Jahren starke Budgetkürzungen hinnehmen müssen. Dies wirkt sich auf die Ausbildung unserer Truppen und die Rüstungsproduktion aus, bis es uns gelingt, unser Budget zu erhöhen."
