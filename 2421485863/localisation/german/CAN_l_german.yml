r56_CAN_royal_twenty_centers_angered:0				"[Root.GetTwentyCentersAngeredName]"
r56_CAN_royal_twenty_centers_angered_desc:0				"Aufgrund der Großen Depression§! genehmigte die Regierung ein umstrittenes landesweites System von Lagern, um alleinstehenden, arbeitslosen, obdachlosen [CAN.GetAdjective] Männern Arbeit zu geben. Sie werden die Royal Twenty Centers genannt, weil sie einen Lohn von 20 Cent pro Tag erhalten. Sie arbeiten viele Stunden pro Woche für einen winzigen Lohn, und ihre Arbeitsmoral ist nicht besonders gut. Diese Lager sind für mehrere Aufstände verantwortlich, und es könnte in Zukunft noch mehr davon geben, wenn wir sie nicht schließen.\n\nDa wir Gewalt anwenden, um ihren Aufstand zu beenden, sind die Zwanzig Zentren noch wütender als zuvor. §RMöglicherweise wird es in Zukunft zu schweren Unruhen kommen§!"
