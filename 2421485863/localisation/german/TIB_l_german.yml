l_german:
himalaya_tibet.46.desc:0 "Unsere Streitkräfte waren nicht in der Lage, in der Schlacht von [434.GetName] vorzurücken. Wir haben viele feindliche Angriffe abgewehrt, aber unsere offensiven Angriffe und unsere Moral waren nicht gut genug, um die feindlichen Linien zu durchbrechen. Dennoch können wir aus diesen Scharmützeln noch viel lernen und Informationen sammeln..."
himalaya_tibet.46.a:0 "Eine Verschwendung von Blut und Tränen..."
tibet_focus:0 "Tibetischer Nationaler Fokus"
TIB_generic_infantry_equipment_organization:0 "Abteilung Trabshi Lekhung Arsenal"
TIB_monasteries_up_tt:0 "§NErhöhen§! die Meinung der Klöster.\n"
TIB_monasteries_down_tt:0 "§Reduzierung§! der Meinung der Klöster.\n"
TIB_army_reforms:0 "Reformen der Armee"
TIB_army_reforms_desc:0 "Jahrelang vernachlässigt, war unsere Armee kaum kampffähig. Mit Hilfe westlicher Berater könnten wir jedoch in der Lage sein, eine relativ effektive Kampftruppe aufzustellen."
TIB_apply_neames_guidelines:0 "Wenden Sie die Richtlinien von Neame an"
TIB_professionalize_the_officers:0 "Professionalisieren Sie die Offiziere"
TIB_revise_officers_fighting_techniques:0 "Überarbeitung der Kampftechniken der Offiziere"
TIB_religious_decisions:0 "Religiöse Entscheidungen"
TIB_religious_decisions_desc:0 "Unsere Politik, unsere soziale Struktur und unsere Ziele sind alle von der religiösen Elite motiviert. Die Klöster sind das Herzstück der Wirtschaft und der Politik und weitaus mächtiger als die Aristokratie."
TIB_appease_the_monasteries:0 "Beschwichtigen Sie die Klöster"
TIB_end_the_regency:0 "Beenden Sie die Regentschaft"
search_dalai_lama_denied:0 "Die Suche nach dem Dalai Lama wurde von ausländischen staatlichen Behörden verweigert"
search_dalai_lama_autorized:0 "Die Suche nach dem Dalai Lama wurde vom ausländischen Regime genehmigt"
