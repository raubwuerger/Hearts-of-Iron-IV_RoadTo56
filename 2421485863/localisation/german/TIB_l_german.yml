himalaya_tibet.33.t:0 "Rücktritt von Jamphel Yeshe Gyaltsen"
himalaya_tibet.33.desc:0 "Der Reting Rinpoche, Jamphel Yeshe Gyaltsen, ist heute um 9:15 Uhr von seinem Amt als Regent von Tibet zurückgetreten. Dies ist weder für die Menschen in Tibet noch für die Aristrokraten, die das Land führen, eine Überraschung, denn Jamphel Yeshe Gyaltsen hat bereits vor einiger Zeit erklärt, dass er tatsächlich zurücktreten wird, wenn Trimön Shappe zurücktreten darf und nicht zum Chefminister ernannt wird. Wie es scheint, ist dies tatsächlich geschehen, so dass es nicht verwunderlich ist, dass der Regent sich ebenfalls zum Rücktritt entschlossen hat, was die Regierung jedoch in ein schreckliches Chaos und Verwirrung stürzt. Eine neue Sitzung des Tsongdu, der Nationalversammlung, muss sofort einberufen werden, um die Krise zu lösen!"
himalaya_tibet.33.a:0 "Alles für nichts..."
himalaya_tibet.34.t:0 "Die Tsongdu tagt"
himalaya_tibet.34.desc:0 "Die Tsongdu, die Nationalversammlung Tibets, ist heute zusammengetreten, um die Angelegenheit zu klären und einen neuen Regenten zu wählen, der die Aufgabe hat, den Dalai Lama zu finden und ihn zu betreuen. Dies ist keine leichte Aufgabe, daher ist es wichtig, dass die Wahl weise getroffen wird. Es scheint jedoch, dass die Minister des Tsongdu eine ziemlich hitzige Debatte über zwei mögliche Kandidaten für den Platz des Regenten geführt haben und es scheint, dass eine Einigung oder ein Kompromiss noch in weiter Ferne liegt... Es ist unmöglich zu sagen, was die Zukunft für Tibet bereithält."
himalaya_tibet.34.a:0 "Schluss damit! Beenden Sie diesen Unsinn sofort!"
himalaya_tibet.34.b:0 "In dieser schlimmen Lage ist ein Kompromiss erforderlich."
himalaya_tibet.35.t:0 "[TIB.GetNameDefCap] Bittet um Militärhilfe"
himalaya_tibet.35.desc:0 "Die Tibeter haben nach dem Abschluss des [ENG.GetAdjective] Militärbesuchs in Tibet im Jahr 1936 um militärische Hilfe gebeten. Es könnte klug sein, ihnen ihren Wunsch zu erfüllen, da dies Tibet näher an [ROOT.GetNameDef] heranbringen könnte. Was sollen wir tun?"
himalaya_tibet.35.a:0 "[ENG.GetLeader] ist ein Mann, der sein Wort hält!"
himalaya_tibet.35.b:0 "Wir können zu diesem Zeitpunkt nichts entbehren."
himalaya_tibet.36.t:0 "Die [ENG.GetAdjective] gewähren militärische Hilfe"
himalaya_tibet.36.desc:0 "Die [ENG.GetAdjective] haben zugestimmt, uns militärische Hilfe zu leisten. Das ist wirklich eine wunderbare Nachricht, sowohl für Tibets Außenpolitik als auch für seine Fähigkeit, sich selbst zu verteidigen, denn es ist dank der [ENG.GetAdjective] um einiges gewachsen!"
himalaya_tibet.36.a:0 "Vielen Dank, Herr [ENG.GetLeader]!"
himalaya_tibet.37.t:0 "Die [ENG.GetAdjective] lehnen unseren Antrag ab"
himalaya_tibet.37.desc:0 "Die [ENG.GetAdjective] haben unsere Bitte um militärische Hilfe abgelehnt. Das ist eine wirklich enttäuschende Nachricht, sowohl für die Außenpolitik Tibets als auch für seine Fähigkeit, sich selbst zu verteidigen, denn das könnte bedeuten, dass die [ENG.GetAdjective] kein Interesse an Tibet haben!"
himalaya_tibet.37.a:0 "Wirklich enttäuschend..."
himalaya_tibet.38.t:0 "[FROM.GetNameDefCap] behauptet Kontrolle über [434.GetName]"
himalaya_tibet.38.desc:0 "Vor wenigen Stunden haben einige Mitglieder des [FROM.GetAdjective]-Militärs [TIB.GetAdjective] betreten, das zwar von der [FROM.GetAdjective]-Verwaltung nicht anerkannt wird, aber administrativ als De-facto-Grenze zwischen Tibet und [FROM.GetNameDef] dient. Das ist eine große Überraschung für die tibetische Regierung. Wir müssen auf diese aggressiven Schritte so schnell wie möglich reagieren!"
himalaya_tibet.38.a:0 "Es gibt nichts, was wir tun können."
himalaya_tibet.38.b:0 "Wir müssen diplomatischen Protest einlegen!"
himalaya_tibet.38.c:0 "Mobilisieren Sie sofort die Armee! Dies ist ein Akt der Aggression!"
himalaya_tibet.39.t:0 "[FROM.GetNameDefCap] gibt auf [434.GetName]"
himalaya_tibet.39.desc:0 "Da die Regierung von [434.GetName] keine Hoffnung sieht, [434.GetName] abzuwehren, weder diplomatisch noch militärisch, ist sie zu dem Schluss gekommen, dass sie [434.GetName] an unser Militär abtreten muss. Wahrlich ein großer strategischer Sieg von [ROOT.GetNameDef]."
himalaya_tibet.39.a:0 "In der Tat, sie haben das Richtige getan."
himalaya_tibet.40.t:0 "[FROM.GetNameDefCap] erhebt diplomatischen Protest"
himalaya_tibet.40.desc:0 "Vor einigen Stunden haben einige Mitglieder des [ROOT.GetAdjective] Militärs [434.GetName] Land betreten und es als [ROOT.GetAdjective] beansprucht. Die [FROM.GetAdjective] Regierung hat darauf mit einem diplomatischen Protest reagiert. Aber es gibt keinen Grund zur Sorge, denn wir haben die Oberhand, wenn es um diplomatische Beziehungen geht, und unser Anspruch auf [434.GetName] ist ziemlich stark."
himalaya_tibet.40.a:0 "Sollen sie es doch versuchen..."
himalaya_tibet.41.t:0 "[FROM.GetNameDefCap] mobilisiert Truppen"
himalaya_tibet.41.desc:0 "Vor einigen Stunden haben einige Mitglieder des [ROOT.GetAdjective] Militärs [434.GetName] Land betreten und es als [ROOT.GetAdjective] beansprucht. Die [FROM.GetAdjective] Regierung hat daraufhin die Mobilisierung ihrer Streitkräfte angekündigt. Aber es gibt keinen Grund zur Sorge, unsere Streitkräfte sind den [FROM.GetAdjective] sicherlich überlegen, und unsere Präsenz in [434.GetName] bestärkt uns in dieser Überzeugung."
himalaya_tibet.42.t:0 "[ROOT.GetAdjective] Sieg bei [434.GetName]"
himalaya_tibet.42.desc:0 "Unsere Streitkräfte haben ihre Überlegenheit in der Schlacht von [434.GetName] bewiesen. Wir haben den Feind abgewehrt und sind weiter vorgerückt. Auch von diesen Skrimisch können wir noch viel lernen und Informationen sammeln!"
himalaya_tibet.42.a:0 "Das wird es ihnen zeigen!"
himalaya_tibet.43.t:0 "[ROOT.GetAdjective] Verlust bei [434.GetName]"
himalaya_tibet.43.desc:0 "Unsere militärischen Kräfte wurden in der Schlacht von [434.GetName] dezimiert und besiegt. Wir haben viele feindliche Angriffe abgewehrt, aber ihr Angriff und ihre Moral waren tatsächlich überlegen. Dennoch können wir noch viel lernen und Informationen aus diesen Scharmützeln gewinnen..."
himalaya_tibet.43.a:0 "Wie enttäuschend."
himalaya_tibet.44.t:0 "Pattsituation bei [434.GetName]"
