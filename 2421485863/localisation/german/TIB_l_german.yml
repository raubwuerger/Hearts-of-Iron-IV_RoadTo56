himalaya_tibet.46.desc:0				"Our military forces have not been able to advance in the battle of [434.GetName]. We have fended off many enemy attacks but our offensive charges and morale were not good enough to push through the enemy lines. However, there is still much that we can learn and information we can gather from these skirmishes..."
