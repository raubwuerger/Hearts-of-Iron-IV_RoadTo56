CW_czechoslovak_autonomy_postyalta:	"Gewährt [CZE.GetNonIdeologyName] begrenzte Autonomie"
CW_soviet_occupations:	"Besetzte Territorien"
CW_soviet_occupations_desc:	"[GetNameDefCap] kontrolliert derzeit Ländereien, die es nicht zu behalten gedenkt. Wie wir sie jedoch loslassen, bleibt uns überlassen, was uns einige strategische Möglichkeiten eröffnet."
SOV_release_AZE_puppet:	"Einsetzung einer aserbaidschanischen Regierung im Iran"
SOV_release_AZE_puppet_desc:	"Um unsere Kontrolle über iranische Ländereien zu legitimieren und Druck auf sie auszuüben, um Ölrechte zu erhalten, können wir die Einrichtung einer unabhängigen aserbaidschanischen Regierung in iranischen Gebieten verdeckt unterstützen."
SOV_release_KUR_puppet:	"Einen kurdischen Staat im Iran gründen"
FIN_moscow_armistice_signed:	"Der Moskauer Waffenstillstand wurde zwischen [FIN.GetNonIdeologyName] und [SOV.GetNameDef] unterzeichnet."
SOV_pressure_finnish_government:	"Setzen Sie die [FIN.GetAdjective] Regierung unter Druck"
SOV_pressure_finnish_government_desc:	"Die finnischen Kommunisten sind zu schwach, um die [FIN.GetAdjective] Regierung zu stürzen, aber indem wir sie bewaffnen und Proteste starten und regierungsfeindliche Gerüchte verbreiten, können wir deutlich machen, dass unser Einfluss auf sie zu respektieren ist."
