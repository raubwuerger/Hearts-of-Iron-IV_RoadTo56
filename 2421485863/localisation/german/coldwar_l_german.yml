CZKE_five_year_plan_desc:0	"Es ist eine bedauerliche Tatsache, dass ein großer Teil des Landes nur schwach oder gar nicht industrialisiert ist. Von Prag aus müssen starke zentrale Maßnahmen ergriffen werden, um die wirtschaftliche Kluft einzudämmen, bevor sie unsere Union auseinander reißt."
CZKE_collectivize_key_industries_desc:0	"Die industrielle Elite der Tschechoslowakei hat viel zu lange von der Industrialisierung der tschechischen und deutschsprachigen Regionen des Landes profitiert. Ein aggressives Verstaatlichungsprogramm wird unserer Regierung die Unterstützung des Volkes bringen und den Einfluss der kapitalistischen Industriellen in unserer Regierung beseitigen."
CZKE_suppress_the_church_desc:0	"Der Katholizismus in unserem Land ist eines der größten Hindernisse für den sozialen Fortschritt in unserem Land. Wenn wir eine moderne Nation mit einer einzigartig brillanten Bevölkerung werden wollen, ist ein harter staatlicher Atheismus notwendig, um eine neue revolutionäre Gesellschaft zu fördern!"
CZKE_collectivize_farms_desc:0	"Die Agrarregionen der Tschechoslowakei, die hauptsächlich in den slowakischen Gebieten liegen, wurden auf Kosten unseres nationalen Fortschritts als Werkzeuge der Elite benutzt. Indem wir diesen Sektor unserer Wirtschaft wirtschaftlich zentralisieren, können wir die gesamte Nation voranbringen!"
