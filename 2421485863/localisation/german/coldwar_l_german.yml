CZKE_acquire_soviet_tanks_desc:		"Unsere enge Verbindung mit [SOV.GetNameDef] bedeutet, dass wir unsere Zeit nicht damit verschwenden sollten, brandneue Panzerdesigns auszuprobieren, wenn unser Verbündeter bereits seine eigenen hochmodernen Designs in Serie produziert."
