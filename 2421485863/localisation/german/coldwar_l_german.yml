cold_war.2.t:	"König Yahya ermordet!"
cold_war.2.d:	"Die schreckliche Nachricht von der Ermordung von König Yahya hat die Hauptstadt erreicht. Der notorisch zurückgezogene Anführer wurde während einer kurzen Reise in einen Hinterhalt gelockt und von Mitgliedern des Al-Waziri-Clans erschossen. Der Anführer dieses Clans erhebt nun Anspruch auf den Thron und scheint ungehindert die Hauptstadt einzunehmen, der Thronfolger von König Yahya ist jedoch geflohen und könnte bald mit bewaffneter Unterstützung zurückkehren."
cold_war.2.a:	"Besorgniserregend"
cold_war.3.t:	"Der Yahya-Clan fordert den Thron zurück"
cold_war.3.d:	"Nach einer kurzen Periode der Al-Waziri-Herrschaft hat der Sohn des ermordeten Königs Yahya den Thron zurückerobert, nachdem er schnell die Stämme des nördlichen Jemen zu seiner Hilfe versammelt hatte. Nach einer kurzen Belagerung von [ROOT.Capital.GetCapitalVictoryPointName] wurde [ROOT.GetLeader] gefangen genommen und soll nun hingerichtet werden."
cold_war.3.a:	"Wird die Instabilität ein Ende haben?"
cold_war.4.t:	"[USA.GetNonIdeologyName] bietet Hilfe an"
cold_war.4.d:	"Nach der Unterzeichnung des Foreign Assistance Act of [GetYear] durch Präsident [FROM.GetLeader] wurden wir mit Vorschlägen für [FROM.GetAdjective] Darlehen und Zuschüsse für unsere Nation kontaktiert."
cold_war.4.a:	"Ein wahrer Verbündeter"
cold_war.4.b:	"Nur ein weiterer Plan zur Einflussnahme!"
cold_war.6.t:	"Minister treten in Opposition zurück"
cold_war.6.d:	"Zwölf nicht-kommunistische Minister haben aus Protest gegen die fast vollständige Übernahme der Polizei durch die KSC um ihre Entlassung gebeten. Gottwald hat Pläne für einen Generalstreik angekündigt und Massendemonstrationen von kommunistischen Kräften haben begonnen, die die Einsetzung einer kommunistischen Regierung anstelle der zurücktretenden Minister fordern."
cold_war.6.a:	"Wir sollten die Rücktritte akzeptieren."
cold_war.6.b:	"Mobilisieren Sie die Armee!"
cold_war.9.t:	"[592.owner.GetName] fordert [728.GetName] für die indochinesischen Besitztümer"
cold_war.9.d:	"Unser Verbündeter gegen Japan und den vietnamesischen Aufstand in Indochina, [CHI.GetNameDef], hat uns einen Vorschlag gemacht: Er wird uns den Norden Indochinas zurückgeben, aber nur, wenn wir ihm unseren Vertragshafen [728.GetName] überlassen, der gerade von japanischen Überresten befreit wurde."
cold_war.9.a:	"Gut"
cold_war.9.b:	"Niemals!"
cold_war.23.t:	"[FROM.GetAdjective]s Druck für Militärpakt"
cold_war.23.d:	"Nachdem [FROM.GetNameDef] finnische Kommunisten benutzt hat, um Proteste zu starten und Gerüchte über geheime westliche Beziehungen zu verbreiten, tritt er nun an uns heran, um unsere Nachkriegsbeziehungen zu formalisieren. Insbesondere wollen sie sicherstellen, dass sie nicht über finnisches Land angegriffen werden, indem sie festlegen, dass Finnland [FROM.GetNameDef] schützen wird, wenn es angegriffen wird, während sie [ROOT.GetNameDef] schützen werden, wenn sie jemals bedroht werden."
cold_war.23.a:	"Eine Win-Win-Situation."
cold_war.23.b:	"Wir brauchen ihren Schutz nicht."
cold_war.31.t:	"Tod von George Patton"
cold_war.31.d:	"Der bei einem Autounfall schwer verletzte General George S. Patton ist gestorben. Patton diente bis vor kurzem als Oberbefehlshaber der Streitkräfte in Europa, war aber von anderen Kommandos entbunden worden, nachdem er sich feindselig über [SOV.GetNameDef] geäußert und sich geweigert hatte, bei der Entnazifizierung Deutschlands mitzuwirken."
cold_war.31.a:	"Wir haben einen guten General verloren"
cold_war.37.t:	"Österreich als neutraler Staat?"
cold_war.37.d:	"Die ideologischen Differenzen zwischen den verschiedenen Besatzungsparteien in Österreich bedeuten, dass alle Seiten nervös sind, einen österreichischen Staat zu reformieren, der sich möglicherweise nur einer Seite anschließt. Die offensichtliche Lösung ist die Bildung eines verfassungsmäßig neutralen Österreichs, dessen Regierung jedoch noch zur Debatte steht."
cold_war.37.a:	"Es müssen Wahlen abgehalten werden"
cold_war.37.b:	"Ein Rat mit den demokratischen und kommunistischen Parteien reicht aus"
cold_war.38.t:	"[FROM.GetName] Schlägt ein neutrales Österreich vor"
cold_war.38.a:	"Klingt wie die beste Option"
cold_war.38.b:	"Völlig inakzeptabel"
cold_war.38.d:	"[FROM.GetNameDefCap] hat vorgeschlagen, die Besetzung Österreichs zu beenden und einen verfassungsmäßig neutralen Staat mit demokratischen Wahlen zu errichten. Es liegt an uns und den anderen Besatzungsmächten zu entscheiden, ob diese Zugeständnisse ausreichen, um ein Ende der Besatzung in Betracht zu ziehen."
cold_war.38.d2:	"[FROM.GetNameDefCap] hat vorgeschlagen, die Besetzung Österreichs zu beenden und einen verfassungsmäßig neutralen Staat zu errichten, in dem ein Rat aus kommunistischen und demokratischen Parteiführern über die Politik entscheidet. Es liegt an uns und den anderen Besatzungsmächten zu entscheiden, ob diese Zugeständnisse ausreichen, um eine Beendigung der Besatzung in Betracht zu ziehen."
cold_war.39.t:	"Deutschland als neutraler Staat?"
cold_war.39.d:	"Die ideologischen Unterschiede zwischen den verschiedenen Besatzungsparteien in Deutschland und die Angst vor einem weiteren starken Deutschland führen dazu, dass alle Seiten nervös sind, einen deutschen Staat zu reformieren, der sich mit nur einer Seite verbünden könnte. Die offensichtliche Lösung ist die Bildung eines verfassungsmäßig neutralen Deutschlands, dessen Regierung jedoch noch zur Debatte steht."
cold_war.40.t:	"[FROM.GetName] schlägt ein neutrales Deutschland vor"
cold_war.40.d:	"[FROM.GetNameDefCap] hat vorgeschlagen, die Besetzung Deutschlands zu beenden und einen verfassungsmäßig neutralen Staat mit demokratischen Wahlen zu errichten. Es liegt an uns und den anderen Besatzungsmächten zu entscheiden, ob diese Zugeständnisse ausreichen, um eine Beendigung der Besatzung in Betracht zu ziehen."
cold_war.40.d2:	"[FROM.GetNameDefCap] hat vorgeschlagen, die Besetzung Deutschlands zu beenden und einen verfassungsmäßig neutralen Staat zu errichten, in dem ein Rat aus kommunistischen und demokratischen Parteiführern über die Politik entscheidet. Es liegt an uns und den anderen Besatzungsmächten zu entscheiden, ob diese Zugeständnisse ausreichen, um eine Beendigung der Besatzung zu erwägen."
cold_war.41.t:	"[FROM.GetName] schlägt Zusammenlegung der Besatzungszonen vor"
cold_war.41.d:	"[FROM.GetNameDefCap] ist mit einem Vorschlag zu uns gekommen, die Grenzen zwischen unseren Besatzungszonen in Deutschland zu öffnen."
cold_war.41.a:	"Besser für uns und das deutsche Volk"
cold_war.41.b:	"Man kann ihnen nicht trauen"
cold_war.43.t:	"Das Schicksal der Tschechoslowakei"
cold_war.43.d:	"Nachdem wir einen großen Teil Osteuropas befreit haben, liegt es nun an uns, über die Regierung der [CZE.GetNameDef] zu entscheiden. Wir könnten zwar ein stabiles Marionettenregime installieren, aber ein demokratisches würde uns wahrscheinlich mehr internationale Gunst einbringen."
cold_war.43.a:	"Sie sollen...etwas...Freiheit haben"
cold_war.43.b:	"Sie sind eine zu große Bedrohung"
cold_war.44.t:	"[FROM.GetName] Fordert Panzer"
cold_war.44.d:	"Unsere [FROM.GetAdjective] Brüder, die gerade dabei sind, ihre Armee aufzubauen, haben uns gebeten, ihnen einen Teil unseres großen Panzervorrats zu liefern."
cold_war.44.a:	"Es ist in unserem Interesse, sie zu stärken."
cold_war.44.b:	"Wenn diese in die falschen Hände fallen..."
cold_war.45.t:	"Italien bittet um Hilfspaket"
cold_war.45.d:	"Offizielle der kommunistischen Partei von [ITA.GetNameDef] haben einen einzigartigen Vorschlag gemacht: Um ihre Popularität zu verbessern und nicht auf [USA.GetNameDef] angewiesen zu sein, bitten sie uns um eine Alternative zu der Hilfe, die sie anderen europäischen Nationen gewährt haben."
cold_war.45.a:	"Das könnte sie in unsere Sphäre ziehen."
cold_war.45.b:	"Es gibt keine Hoffnung für den Kommunismus in [ITA.GetNonIdeologyName]"
cold_war.46.t:	"Ein italienischer Bürgerkrieg?"
cold_war.46.d:	"Die [ITA.GetAdjective] kommunistische Partei ist mit einem verblüffenden Vorschlag an uns herangetreten: Nach ihrer Einschätzung könnte es möglich sein, dass die [ITA.GetAdjective] Kommunisten durch einen Bürgerkrieg die Macht abgeben. Offizielle der Partei sind zu uns gekommen, um uns um Zustimmung und Hilfe bei diesem Unterfangen zu bitten."
cold_war.46.a:	"Eine unglaubliche Gelegenheit, den Kommunismus zu verbreiten"
cold_war.46.b:	"Dies würde unserem internationalen Ruf zu sehr schaden"
cold_war.47.t1:	"[FROM.GetName] Bietet Unterstützung für den Bürgerkrieg"
cold_war.47.t2:	"[FROM.GetName] Weigert sich, den Bürgerkrieg zu unterstützen"
cold_war.47.d1:	"Zur Überraschung unserer Delegation hat sich [SOV.GetLeader] für unsere revolutionären Pläne ausgesprochen, und [SOV.GetNameDef] ist bereit, uns materiell zu unterstützen."
cold_war.47.d2:	"Unsere Delegation zu [SOV.GetNameDef] ist mit Neuigkeiten zurückgekehrt: [SOV.GetLeader] wünscht sich keine italienische Revolution. Ob dies aus Angst vor ausländischer Einmischung, vor einer möglichen Niederlage oder aus Furcht vor einer Eskalation auf der Weltbühne geschieht, ist nicht bekannt, aber es liegt nun an uns, ob wir unsere Pläne für eine Revolution weiterverfolgen."
cold_war.47.a:	"Es ist Zeit für eine Revolution"
cold_war.47.b:	"Lassen Sie uns den italienischen Weg zum Sozialismus fortsetzen"
cold_war.48.t:	"Ein Abkommen mit [YUG.GetNameDef]?"
cold_war.48.d:	"Die [ITA.GetAdjective] kommunistische Partei war einzigartig darin, auch nach dem Krieg territoriale Ansprüche aufrechtzuerhalten, in diesem Fall auf [YUG.GetAdjective] Gebiet. Der Verzicht auf diese Ansprüche scheint das perfekte Druckmittel zu sein, um Unterstützung von unseren Nachbarn zu erhalten, die über ein breites Arsenal an erbeuteten Waffen verfügen."
cold_war.48.a:	"Wir müssen gute Beziehungen pflegen"
cold_war.48.b:	"Dies ist unser rechtmäßiges Territorium!"
