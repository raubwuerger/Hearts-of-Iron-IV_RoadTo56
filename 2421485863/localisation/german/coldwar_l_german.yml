operation_ajax_desc:		""
targeted_instigate_protests:		"Proteste anzetteln"
targeted_instigate_protests_desc:		"Infiltratoren zetteln im Namen der H.T.I.-Partei einen Anti-Schah-Protest an, bevor sie zu einem Pro-Schah-Protest der mit dem Schah verbündeten Menschen aufrufen. Der Aufruhr wird eine Machtübernahme durch das Militär ermöglichen, das dann den Schah wieder einsetzen wird."
targeted_instigate_protests_outcome:		"Unser Plan ist genau so aufgegangen wie geplant. Der iranische Klerus fiel sogar auf unsere List herein, indem er die Anti-Schah-Proteste unterstützte, die die vermeintliche Notwendigkeit eines Militärputsches untermauerten. Der Schah ist aus dem Exil zurückgekehrt und hat damit begonnen, die von uns geforderten Schritte zu unternehmen."
