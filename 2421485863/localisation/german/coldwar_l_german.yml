PER_resource_industry_incompetence_desc:		"Aufgrund begrenzter Fördertechnologien und Kenntnisse ist unsere Ölindustrie weitgehend lahmgelegt. Die Erforschung von '§Y$excavation3$§!' wird diese Idee beseitigen"
PER_ineffective_conscription:		"Ineffektive Wehrpflicht"
PER_ineffective_conscription_desc:		"Die iranische Agrarwirtschaft und die Stämme machen die Wehrpflicht durch eine Mischung aus behördlichen Problemen und Widerstand zu einer Herausforderung."
