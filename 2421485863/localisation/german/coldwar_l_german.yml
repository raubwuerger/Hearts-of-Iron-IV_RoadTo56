CW_soviet_occupations_desc:		"[GetNameDefCap] kontrolliert derzeit Gebiete, die es nicht zu behalten gedenkt; wie wir sie loslassen, liegt jedoch noch in unserer Hand, was uns einige strategische Möglichkeiten eröffnet."
SOV_release_AZE_puppet:		"Einsetzung einer aserbaidschanischen Regierung im Iran"
SOV_release_AZE_puppet_desc:		"Um unsere Kontrolle über iranische Gebiete zu legitimieren und Druck auf das Land auszuüben, können wir verdeckt die Einrichtung einer "unabhängigen" aserbaidschanischen Regierung in iranischen Gebieten unterstützen."
SOV_release_KUR_puppet:		"Gründung eines kurdischen Staates im Iran"
FIN_moscow_armistice_signed:		"Der Moskauer Waffenstillstand wurde zwischen [FIN.GetNonIdeologyName] und [SOV.GetNameDef] unterzeichnet"
SOV_pressure_finnish_government:		"Druck auf die [FIN.GetAdjective]-Regierung"
SOV_pressure_finnish_government_desc:		"Die finnischen Kommunisten sind zu schwach, um die [FIN.GetAdjective]-Regierung zu stürzen, aber indem wir sie bewaffnen, Proteste starten und regierungsfeindliche Gerüchte verbreiten, können wir deutlich machen, dass unser Einfluss auf sie respektiert wird."
