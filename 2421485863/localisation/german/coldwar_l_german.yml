cold_war.50.t:	"[FROM.GetName] Fordert Kompromiss bei Öl"
cold_war.50.d:	"Als Reaktion auf die britischen Sanktionen gegen [FROM.GetNameDef] haben sie sich an uns gewandt, um einen Kompromiss zu erreichen. Das iranische Öl wird verstaatlicht bleiben, aber es wird ein günstiges Abkommen geschlossen, bei dem [ROOT.GetAdjective] Unternehmen dieses Öl mit einer 50/50 Gewinnbeteiligung ausbeuten werden."
cold_war.51.t:	"[FROM.GetName] Bitte um Unterstützung"
cold_war.51.d:	"[FROM.GetNameDefCap] hat sich an uns gewandt und um eine Wiederannäherung gebeten, nachdem wir das, was sie als iranisches Territorium betrachten, zuvor besetzt hatten. Aufgrund der angespannten Beziehungen zum Westen streben sie sogar einen diplomatischen Pakt mit unserer Regierung an, der eine gegenseitige Verteidigungsklausel und eine Zusammenarbeit bei der Rohstoffgewinnung vorsieht."
cold_war.51.a:	"Weniger Öl für unsere Feinde"
