CZKE_finish_the_tvp_project:	"Beenden Sie das TVP-Projekt"
CZKE_finish_the_tvp_project_desc:	"Das TVP-Projekt ist ein ehrgeiziges Panzerentwicklungsprogramm, das darauf abzielt, die besten Aspekte von [GER.GetAdjective], [ENG.GetAdjective], [SOV.GetAdjective] und [ROOT.GetAdjective] Designs zu kombinieren."
CZKE_acquire_soviet_tanks:	"Erwerben Sie [SOV.GetAdjective] Panzer"
CZKE_acquire_soviet_tanks_desc:	"Unsere enge Zusammenarbeit mit [SOV.GetNameDef] bedeutet, dass wir unsere Zeit nicht damit verschwenden sollten, brandneue Panzerdesigns auszuprobieren, wenn unser Verbündeter bereits seine eigenen hochmodernen Designs in Serie produziert."
