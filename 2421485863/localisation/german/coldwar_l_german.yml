targeted_instigate_protests_desc:	"Infiltratoren werden im Namen der H.T.I.-Partei einen Anti-Schah-Protest anzetteln, bevor sie zu einem Pro-Schah-Protest der mit dem Schah verbündeten Menschen aufrufen. Der Aufruhr wird eine Machtübernahme durch das Militär ermöglichen, das dann den Schah wieder einsetzen wird."
targeted_instigate_protests_outcome:	"Unser Plan ging genau so auf wie geplant. Der iranische Klerus fiel sogar auf unsere List herein, indem er die Anti-Schah-Proteste unterstützte, die die vermeintliche Notwendigkeit eines Militärputsches unterstützten. Der Schah ist aus dem Exil zurückgekehrt und hat begonnen, die von uns geforderten Schritte zu unternehmen."
