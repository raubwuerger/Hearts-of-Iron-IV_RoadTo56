SOV_release_AZE_puppet:			"Einsetzung einer aserbaidschanischen Regierung im Iran"
SOV_release_AZE_puppet_desc:			"Um unsere Kontrolle über iranische Ländereien zu legitimieren und Druck auf sie auszuüben, können wir verdeckt die Einrichtung einer unabhängigen aserbaidschanischen Regierung auf iranischem Boden unterstützen."
