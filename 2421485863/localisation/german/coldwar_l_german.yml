targeted_instigate_protests_desc:				"Infiltrators will instigate an anti-Shah protest in the name of the H.T.I. party, before encouraging a pro-Shah protest by people aligned with the Shah. The commotion will allow a military takeover, who will then reinstate the Shah."
targeted_instigate_protests_outcome:				"Our plan worked out exactly as planned. The Iranian clergy even fell for our ruse by supporting the anti-Shah protests which supported the perceived need for a military coup. The Shah has returned from exile and has starting taking the steps we demanded."
