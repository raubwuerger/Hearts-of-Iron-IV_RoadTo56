EGY_aristocrat:0 "Aristokrat"
EGY_aristocrat_desc:0 "Dieser Befehlshaber ist Mitglied oder loyal gegenüber der Monarchie und ihren Institutionen."
EGY_brotherhood_sympathiser:0 "Sympathisant der Bruderschaft"
EGY_brotherhood_sympathiser_desc:0 "Dieser Befehlshaber sympathisiert mit der Sache der Muslimbruderschaft und wird sich im Falle einer Rebellion wahrscheinlich auf deren Seite stellen."
EGY_GATHERING_STORM_DESC:0 "Das Königreich Ägypten befindet sich weiterhin im Stillstand. Fast 15 Jahre sind seit der einseitigen Unabhängigkeitserklärung vom Britischen Empire vergangen, doch dieses ist immer noch fest entschlossen, das Land als ständigen Militärstützpunkt zu behalten, um sein globales Imperium zu sichern. Das immer kriegerischere Italien im Westen verstärkt diesen Gedanken nur noch.\n\nÄgyptens Hauptziel war es schon immer, die volle Unabhängigkeit zu erlangen und sich als dominierende Macht in der Region zu etablieren. Vielleicht ist es jetzt an der Zeit, die gewünschten Träume ein für alle Mal zu verwirklichen?"
EGY_FRAGMENTATION_STATUS:0 "@EGY Ägypten Fragmentierung Status"
RULE_OPTION_EGY_FRAGMENTED:0 "Ägypten Fragmentiert"
RULE_OPTION_EGY_FRAGMENTED_DESC:0 "Alle freigabefähigen konstituierenden Nationen, aus denen Ägypten besteht, werden bei Spielbeginn als frei und unabhängig freigegeben."
RULE_OPTION_EGY_DECENTRALIZED:0 "Ägypten Dezentralisiert"
RULE_OPTION_EGY_DECENTRALIZED_DESC:0 "Alle freischaltbaren konstituierenden Nationen, aus denen Ägypten besteht, werden bei Spielbeginn als Marionettennationen freigeschaltet."
EGY_AI_BEHAVIOR:0 "@EGY Ägypten"
EGY_RULE_OPTION_HISTORICAL:0 "Beibehaltung des Status Quo"
EGY_RULE_OPTION_HISTORICAL_AI_DESC:0 "Großbritannien wird bei der anglo-ägyptischen Konferenz bevorzugt und der Status Quo des ägyptischen Protektoratsstatus bleibt erhalten."
EGY_RULE_OPTION_GOV_GENERAL:0 "Ermächtigung des Generalgouverneurs"
EGY_RULE_OPTION_GOV_GENERAL_AI_DESC:0 "Großbritannien wird bei der anglo-ägyptischen Konferenz bevorzugt und der Generalgouverneur wird ermächtigt, was zu einem Bürgerkrieg in der Nation führen könnte."
EGY_RULE_OPTION_NASSERIST:0 "Coup des freien Offiziers"
EGY_RULE_OPTION_NASSERIST_AI_DESC:0 " Ägypten wird bei der anglo-ägyptischen Konferenz bevorzugt und nach der Erlangung der Unabhängigkeit und dem Tod von Faud I. wird der neue König Farouk von den Freien Offizieren unter der Führung von Gamal Abdel Nasser gestürzt."
EGY_RULE_OPTION_DEMOCRATIC:0 "Das Mansoura-Abkommen"
EGY_RULE_OPTION_DEMOCRATIC_AI_DESC:0 "Ägypten wird bei der anglo-ägyptischen Konferenz bevorzugt und nach der Unabhängigkeit einigen sich die demokratischen und monarchistischen Fraktionen und errichten eine konstitutionelle Monarchie."
EGY_RULE_OPTION_KHEDIVE:0 "Wiedereinsetzung des Khedive"
EGY_RULE_OPTION_KHEDIVE_AI_DESC:0 "Ägypten wird in der anglo-ägyptischen Konferenz bevorzugt und wird nach Erlangung der Unabhängigkeit das osmanische Khedivat wiederherstellen."
EGY_RULE_OPTION_MONARCHIST:0 "Farouks Herrschaft"
EGY_RULE_OPTION_MONARCHIST_AI_DESC:0 "Ägypten wird bei der anglo-ägyptischen Konferenz bevorzugt und wird nach Erlangung der Unabhängigkeit die Macht von König Farouk I. stärken."
EGY_RULE_OPTION_ISLAMIST:0 "Islamistischer Putsch"
EGY_RULE_OPTION_ISLAMIST_AI_DESC:0 "Großbritannien wird in der anglo-ägyptischen Konferenz begünstigt, wird aber von den Muslimbrüdern geputscht, die eine islamistische Herrschaft im Staat installieren werden."
FOCUS_FILTER_EGY_SUDANESE_SEPARATISM:0 "Sudanischer Separatismus"
TIRAN_STRAIT:0 "Meerenge von Tiran"
