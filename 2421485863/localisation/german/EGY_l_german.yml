EGY_sudanese_uprising_timer:0 "Drohende [SUD.GetAdjective] Aufstände"
EGY_sudanese_uprising_timer_desc:0 "Angesichts der jüngsten Instabilität im eigenen Land zerfällt unsere ohnehin schon schwache Herrschaft über den Sudan immer schneller. Es ist nur eine Frage der Zeit, bis sie in der Lage sind, sich effektiv zu einer offenen Rebellion zu organisieren."
EGY_atbara_degree:0 "Atbara-Grad"
EGY_atbara_degree_desc:0 "Der Widerstand im Sudan hat eine Bruchstelle erreicht. Wenn wir sicherstellen wollen, dass wir im Falle einer offenen Rebellion die Oberhand behalten, müssen wir der Hauptstadt [551.GetName] eine strenge Militärregierung auferlegen. Dies wird die sudanesische Bevölkerung jedoch mit Sicherheit sehr verärgern."
EGY_standard_suppression_description:0 "Die jüngsten Aktivitäten der Separatisten haben zu einer Eskalation des Widerstands in der Region geführt. Wir sollten eine Truppe losschicken, um sicherzustellen, dass sie nicht zu stark werden."
EGY_suppress_sudanese_separatists_in_khartoum:0 "Unterdrücken Sie die Separatisten in der Region Khartoum"
