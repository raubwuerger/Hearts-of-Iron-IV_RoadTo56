EGY_defender_of_the_arab_world_focus_desc:0 "Es ist an der Zeit, dass die arabische Welt ihr eigenes Schicksal in die Hand nimmt. Wenn dies gelingt, werden wir uns nie wieder von imperialistischen Nationen unterdrücken lassen."
