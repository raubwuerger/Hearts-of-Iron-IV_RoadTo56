EGY_counter_rebels_in_sudan_category:0 "Bekämpfung der Separatisten im Sudan"
EGY_counter_rebels_in_sudan_category_desc:0 "Seit der Gründung des Anglo-[EGY.GetAdjective] Sudan im Jahr 1899 gab es im Sudan viele zivile Unruhen mit häufigen Fällen von offener Rebellion gegen die [EGY.GetAdjective] und [ENG.GetAdjective] Herrschaft der lokalen Bevölkerung, trotz unseres langjährigen Wunsches, die Nation unter einer Union zu halten."
