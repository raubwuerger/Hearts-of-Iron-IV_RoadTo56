EGY_exert_royal_influence_in_upper_nile_region_desc:0 "$EGY_exert_royal_influence_description$\n\n$EGY_high_compliance_reminder$"
EGY_standard_pacify_description:0 "Jetzt, da wir die Organisation haben, die dazu in der Lage ist, können wir unsere Bemühungen nutzen, um einen Keil in den organisierten Widerstand zu treiben und die [SUD.GetAdjective] Region endlich wieder unter unbestrittene Kontrolle zu bringen."
