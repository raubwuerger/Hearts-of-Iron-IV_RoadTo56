EGY_1936_anglo_egyptian_conference:0 "[getYear] Anglo-[EGY.GetAdjective] Konferenz"
EGY_1936_anglo_egyptian_conference_desc:0 "Die Anglo-[EGY.GetAdjective] Konferenz in London ist das erste Mal seit 1922, dass sich die Regierungen von [ENG.getAdjective] und [EGY.getAdjective] feierlich treffen. Im Mittelpunkt der Konferenz steht die Diskussion über die Zukunft von [EGY.GetNonIdeologyName] und seine Beziehung zu Großbritannien und dem Commonwealth."
EGY_conference_warning:0 "Beginn der Konferenz"
EGY_conference_warning_desc:0 "Der Termin für die Konferenz steht kurz bevor, also ist es ideal, dass wir darauf vorbereitet sind."
EGY_conference_duration_timer:0 "Konferenz Fortlaufend"
EGY_extend_the_conference:0 "Die Konferenz verlängern"
EGY_extend_the_conference_desc:0 "Das Ergebnis der Konferenz ist nicht ideal für unsere Partei. Es könnte eine gute Idee sein, das Ende der Konferenz zu verschieben, um uns mehr Zeit für Verhandlungen zu verschaffen. Allerdings wird dies von der Gegenpartei höchstwahrscheinlich als Druckmittel gegen uns eingesetzt werden."
EGY_1936_anglo_egyptian_conference_extended:0 "Die Konferenz wurde verlängert"
EGY_1936_anglo_egyptian_conference_begins:0 "Die Konferenz ist im Gange"
EGY_1936_anglo_egyptian_conference_ended_in_egypts_favor:0 "Die Anglo-[EGY.GetAdjective]-Konferenz endete zu Gunsten Ägyptens"
EGY_1936_anglo_egyptian_conference_ended_in_britains_favor:0 "Die Anglo-[EGY.GetAdjective]-Konferenz endete zu Gunsten Großbritanniens"
EGY_discuss_egypts_future_egyptian:0 "Diskutieren Sie [ROOT.GetNonIdeologyName]s Zukunft"
EGY_theaten_britain_with_italy:0 "Drohen Sie dem [ENG.GetAdjective] mit [ITA.GetNameDef]"
EGY_theaten_britain_with_italy_desc:0 "Wenn [ENG.GetNameDef] sich weigert, seine Position uns gegenüber zu ändern, könnten wir jederzeit eine Delegation zu [ITA.GetNameDef] schicken und diplomatische Beziehungen aufnehmen, um einen weiteren Unterstützer für unsere Sache zu gewinnen..."
EGY_discuss_egyptian_independence:0 "Diskutieren Sie [EGY.GetAdjective] Unabhängigkeit"
EGY_discuss_egyptian_independence_desc:0 "Das Wichtigste, um diese Konferenz in Bezug auf [EGY.GetAdjective] sinnvoll zu gestalten, ist, die große Frage direkt zu stellen, und wir können ihre Antwort beurteilen und von dort aus weitermachen."
EGY_offer_naval_concessions:0 "Bieten Sie Zugeständnisse bei der Marine an"
EGY_offer_naval_concessions_desc:0 "Unsere Nation dient den [ENG.GetAdjective] als wichtiger Knotenpunkt für die Marine. Wenn wir ihnen im Falle der Unabhängigkeit uneingeschränkten Zugang zu unseren Häfen anbieten, werden sie uns eher unterstützen."
EGY_decision_cost_navy_experience:0 "£navy_experience §Y10§!"
EGY_decision_cost_navy_experience_blocked:0 "£navy_experience §R10§!"
EGY_propose_a_legal_alliance:0 "Vorschlag für ein Rechtsbündnis"
EGY_will_stay_in_allies:0 "§YÄgypten wird in [ENG.GetNameDefCap]s Fraktion bleiben, sollte es zur Unabhängigkeit kommen.§!"
EGY_military_negotiations_in_sudan:0 "Militärische Verhandlungen im Sudan"
EGY_military_negotiations_in_sudan_desc:0 "Die Rechte in Bezug auf den Sudan sind kompliziert, technisch unter gemeinsamer Besatzung unter Anglo-[EGY.GetAdjective] Sudan seit 1899 die Frage, was im Falle der [EGY.GetAdjective] Unabhängigkeit aus ihm werden soll. Wenn wir den [ENG.GetAdjective] Zugeständnisse machen, wird das Thema weniger belastend für die Verhandlungen sein."
EGY_decision_cost_army_experience:0 "£army_experience §Y10§!"
EGY_decision_cost_army_experience_blocked:0 "£army_experience §R10§!"
EGY_recognise_the_suez_canal_company:0 "Anerkennung der Suezkanal-Gesellschaft"
EGY_political_concessions:0 "Politische Zugeständnisse"
EGY_political_concessions_desc:0 "Wenn wir bestimmten politischen Zugeständnissen und Bedingungen zustimmen, werden wir bei den Verhandlungen mehr Nachsicht walten lassen."
EGY_discuss_egypts_future_british:0 "Diskutieren Sie [ROOT.GetNonIdeologyName]s Zukunft"
EGY_weapons_for_aid:0 "Waffen für Hilfe"
EGY_industrial_concessions_for_bases:0 "Industrielle Zugeständnisse für Basen"
EGY_mutual_naval_research_treaty:0 "Vertrag über gegenseitige Marineforschung"
EGY_political_concessions_british:0 "Politische Zugeständnisse"
EGY_political_concessions_british_desc:0 "Wenn wir bestimmten politischen Zugeständnissen und Bedingungen zustimmen, wird uns eine größere Nachsicht bei den Verhandlungen gewährt"
EGY_offer_assistance_against_sudanese_rebels:0 "Angebot von Unterstützung gegen [SUD.GetAdjective] Rebellen"
EGY_offer_assistance_against_sudanese_rebels_desc:0 "Die Rechte in Bezug auf den Sudan sind kompliziert. Technisch gesehen ist der Sudan seit 1899 von Anglo-[EGY.GetAdjective] besetzt und es stellt sich die Frage, was im Falle einer [EGY.GetAdjective] Unabhängigkeit aus ihm werden soll. Wenn wir den [EGY.GetAdjective] Zugeständnisse machen, wird das Thema weniger belastend für die Verhandlungen sein."
EGY_return_sudanese_resources:0 "Rückgabe von Ressourcen in [884.GetName]"
EGY_organise_nationalist_factions:0 "Organisieren Sie die nationalistischen Fraktionen"
EGY_organise_nationalist_factions_desc:0 "Die Monarchie hat uns im Stich gelassen. Wenn wir die Demütigung Ägyptens durch die imperialistischen Mächte beenden wollen, haben wir keine andere Wahl, als die Dinge selbst in die Hand zu nehmen und die Kolonisatoren ein für alle Mal aus unserem Land zu vertreiben."
EGY_area_fascists_control:0 "Dies sind die Staaten, die wir derzeit kontrollieren"
EGY_impending_nationalist_uprising:0 "Bevorstehender nationalistischer Aufstand"
EGY_impending_nationalist_uprising_desc:0 "Unsere Sache wächst, die Menschen werden motiviert und wir sind bereit, jederzeit zuzuschlagen, das [EGY.GetAdjective] Volk ist bereit, sich zu befreien."
EGY_fascist_civil_war_start:0 "Der Bürgerkrieg hat begonnen"
EGY_fascist_headquarters:0 "Wurde als unser Hauptquartier eingerichtet"
EGY_establish_our_headquarters_in_aswan:0 "Errichten Sie unser Hauptquartier in [456.GetName]"
EGY_establish_our_headquarters_in_sinai:0 "Errichten Sie unser Hauptquartier in [453.GetName]"
EGY_establish_partisans_tt:0 "Dieser Staat wird bei Ausbruch des Bürgerkriegs unter unserer Kontrolle sein und uns eine einzige Einheit der _YBruderschaft Partisan§! zur Verfügung stellen."
EGY_establish_partisans_in_the_eastern_desert:0 "Stellen Sie Partisanen in der [457.GetName] auf."
EGY_establish_partisans_in_aswan:0 "Etablieren Sie Partisanen in [456.GetName]"
EGY_establish_partisans_in_sinai:0 "Partisanen gründen in [453.GetName]"
EGY_spreading_partisans_currently:0 "Etablierung von Partisanen derzeit"
EGY_sway_sudanese_separatists_tt:0 "Dieser [SUD.GetAdjective] Staat wird bei Ausbruch des Bürgerkriegs unter unserer Kontrolle sein und §Y[SUD.GetAdjective] Partisanen§! werden sich auf unserer Seite erheben, was wiederum §Y[SUD.GetAdjective] Separatismus§! beseitigt."
EGY_sway_sudanese_separatists_in_khartoum_region:0 "Sway [SUD.GetAdjective] Separatisten in der Region Khartoum"
EGY_sway_sudanese_separatists_in_darfur_region:0 "Sway [SUD.GetAdjective] Separatisten in der Region Darfur"
