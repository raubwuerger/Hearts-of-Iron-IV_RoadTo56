EGY_supremacy_over_the_mediterranean:0 "Vorherrschaft über das Mittelmeer"
EGY_supremacy_over_the_mediterranean_desc:0 "Die [EGY.GetAdjective] Marine hat sich als mächtige Kraft etabliert, aber wenn wir die international angesehene Position erreichen wollen, die wir seit langem anstreben, ist es an der Zeit, unsere Reichweite zu vergrößern und das Mittelmeer als [EGY.GetAdjective] Gewässer zu sichern."
EGY_a_humiliation:0 "Eine erschütternde Demütigung"
EGY_a_humiliation_desc:0 "Wir sind gedemütigt worden. Der Sinai und das Ostufer des Suez befinden sich unter israelischer Kontrolle. Es liegt an uns: Kommen wir an den Verhandlungstisch? Oder erobern wir ihn mit Gewalt zurück?"
EGY_three_nos:0 "Die drei Neins"
EGY_three_nos_desc:0 "Kein Frieden.\nKeine Verhandlung.\nKeine Anerkennung."
EGY_egyptian_non_alligment:0 "[EGY.GetAdjective] Blockfreiheit"
EGY_egyptian_non_alligment_desc:0 "Seit dem offiziellen Ende des [ENG.GetAdjective]-Protektorats im Jahr 1922 hat sich [EGY.GetNameDef] auf eine strikte Politik der Neutralität in Konflikten festgelegt. Angesichts der einzigartigen Lage Ägyptens könnte es jedoch schwierig sein, daran festzuhalten."
