EGY_development_in_sudan:0 "Entwicklung im Sudan"
EGY_development_in_sudan_desc:0 "[SUD.GetNonIdeologyName] hat das Potenzial, ein wertvoller Wirtschaftspartner zu werden. Dazu gehört die Erhöhung der Investitionen in den industriellen Sektor des Landes, die Unterstützung bei der Modernisierung von Fabriken und Industrien sowie die Förderung von Kooperationen und Joint Ventures zwischen [SUD.GetAdjective] und [EGY.GetAdjective] Unternehmen. Dies wird dazu beitragen, die wirtschaftlichen Beziehungen zwischen den beiden Nationen zu stärken."
EGY_construct_khartoum_juba_link:0 "[551.GetName]-[884.GetName] Verbindung"
EGY_construct_khartoum_juba_link_desc:0 "Der Bau einer Eisenbahnlinie zwischen Khartum und Juba wird neue wirtschaftliche Möglichkeiten zwischen [SUD.GetNonIdeologyName] eröffnen. Dazu sind Investitionen in den Ausbau der bestehenden Infrastruktur entlang der Strecke erforderlich. Die Eisenbahn wird einen schnelleren und effizienteren Transport von Gütern und Personen zwischen den beiden Nationen ermöglichen und den Handel und die Zusammenarbeit fördern."
EGY_expand_jonglei_aluminum:0 "Entwickeln Sie [884.GetName] Aluminium"
EGY_expand_jonglei_aluminum_desc:0 "Die Region des Oberen Nils verfügt über große Aluminiumvorkommen. Wir werden die Voraussetzungen schaffen, um die Investitionen in den Abbau, die Raffinierung und die Produktion von Aluminium in der Region zu erhöhen und Hilfe bei der Modernisierung der Industrie zu leisten. Durch die Entwicklung der Aluminiumindustrie am Oberen Nil können wir uns den Zugang zu einer lebenswichtigen Ressource für unseren eigenen industriellen Bedarf und für den Export sichern."
EGY_ministry_of_resources:0 "Ministerium für Ressourcen"
EGY_ministry_of_resources_desc:0 "Um den Rohstoffbedarf unseres Landes zu sichern und sein Potenzial zu maximieren, müssen wir die Kapazitäten des Ministeriums für Ressourcen ausbauen. Dazu gehört die Aufstockung der Mittel und des Personals des Ministeriums sowie die Bereitstellung von Schulungen und moderner Ausrüstung."
EGY_misr_for_trade_and_oil:0 "Misr für Handel und Öl"
EGY_misr_for_trade_and_oil_desc:0 "Die Gründung von Misr for Trade and Oil, einem staatlichen Unternehmen, wird dazu beitragen, den Zugang unseres Landes zu lebenswichtigen Ressourcen wie Öl und anderen strategischen Materialien zu sichern und zu erweitern."
EGY_banha_industrial_sectors:0 "Industrielle Sektoren in Banha"
EGY_banha_industrial_sectors_desc:0 "Die Stadt Banha hat das Potenzial, ein wichtiges Industriezentrum für unser Land zu werden. Wir werden uns darauf konzentrieren, in die Infrastruktur zu investieren, die lokale Industrie auszubilden und zu unterstützen und Unternehmen zu ermutigen, sich in der Region anzusiedeln. Durch den Aufbau des Industriesektors in Banha können wir Arbeitsplätze schaffen und das Wirtschaftswachstum in der Region ankurbeln sowie unsere industrielle Basis diversifizieren."
EGY_promote_agricultural_development:0 "Förderung der landwirtschaftlichen Entwicklung"
EGY_promote_agricultural_development_desc:0 ""
EGY_banque_misr:0 "Finanzierung der Banque Misr"
EGY_banque_misr_desc:0 "Die Banque Misr ist eine entscheidende Institution für die wirtschaftliche Stabilität und das Wachstum unseres Landes. Wir werden der Banque Misr die notwendigen Mittel zur Verfügung stellen, um ihre Tätigkeit auszuweiten und ihre Dienstleistungen zu verbessern."
EGY_the_aswan_dam:0 "Der Assuan-Damm"
EGY_the_aswan_dam_desc:0 "Der Bau des Assuan-Staudamms wird unserem Land zahlreiche Vorteile bringen, darunter eine höhere Stromerzeugung aus Wasserkraft, eine bessere Bewässerung für die Landwirtschaft und eine bessere Kontrolle über den Nil. Die neuen Möglichkeiten in diesem Gebiet werden ein drastisches industrielles Wachstum ermöglichen."
EGY_develop_the_east:0 "Entwickeln Sie den Osten"
EGY_develop_the_east_desc:0 "Der [457.GetName] war lange Zeit die am wenigsten entwickelte Region unseres Landes. Es ist nun an der Zeit, dass wir uns bemühen, die Industrie der Region zu entwickeln, um sie auf das Niveau des übrigen Landes zu heben."
EGY_national_defence_funds:0 "Mittel für die Landesverteidigung"
EGY_national_defence_funds_desc:0 "Ein starkes Militär ist entscheidend für den Schutz und die Sicherheit unserer Nation. Dazu gehört die Schaffung eines nationalen Verteidigungsfonds, der die notwendigen Mittel für die Entwicklung und den Unterhalt unserer Streitkräfte bereitstellt."
EGY_rural_education_plan:0 "Ländlicher Bildungsplan"
EGY_rural_education_plan_desc:0 "Ein starkes Militär ist für den Schutz und die Sicherheit unseres Landes von entscheidender Bedeutung. Dazu gehört die Schaffung eines nationalen Verteidigungsfonds, der die notwendigen Mittel für die Entwicklung und den Unterhalt unserer Streitkräfte bereitstellt."
EGY_expand_the_defence_department:0 "Das Verteidigungsministerium ausbauen"
EGY_expand_the_defence_department_desc:0 "Eine starke Verteidigung ist die Grundlage für die Sicherheit jeder Nation. Um die Sicherheit unseres Volkes zu gewährleisten, müssen wir unser Verteidigungsministerium ausbauen und modernisieren. Durch den Ausbau unseres Verteidigungsministeriums werden wir besser gerüstet sein, um den Herausforderungen einer sich ständig verändernden Welt zu begegnen und unsere Nation vor jeder potenziellen Bedrohung zu schützen."
EGY_reinforce_the_north:0 "Verstärken Sie den Norden"
EGY_reinforce_the_north_desc:0 "Als Nation mit einer langen Küstenlinie sind wir anfällig für Angriffe vom Meer aus. Wir müssen unsere Nordküste mit einer Reihe von Verteidigungsanlagen befestigen. Dazu gehören der Bau von Artilleriebatterien an der Küste, die Errichtung von Betonbunkern und die Schaffung von Hindernisfeldern, um feindliche Landungsversuche zu erschweren. Indem wir unsere Nordküste befestigen, werden wir in der Lage sein, potenzielle Invasionen durch die Marine abzuwehren."
EGY_fortify_sudan:0 "Befestigen Sie [SUD.GetNonIdeologyName]"
EGY_fortify_sudan_desc:0 "Wir sind anfällig für Infiltrationen und Angriffe aus dem Süden. Wir müssen unsere südliche Grenze innerhalb von [SUD.GetNonIdeologyName] mit einer Reihe von Verteidigungsanlagen befestigen. Dazu gehören der Bau von Grenzvorposten, Straßensperren und die Schaffung von Hindernisfeldern, um die feindliche Infiltration zu verhindern. Durch die Befestigung unserer südlichen Grenze werden wir in der Lage sein, potenzielle Aufstände oder Einbrüche abzuschrecken."
EGY_the_eastern_frontier:0 "Die Ostgrenze"
EGY_the_eastern_frontier_desc:0 "Die Sinai-Halbinsel ist für uns eine strategisch wichtige Region. Wir müssen die Region mit einer Reihe von Verteidigungsanlagen befestigen. Dazu gehören der Bau von Grenzvorposten, Straßensperren und die Schaffung von Hindernisfeldern, um das Eindringen von Feinden zu verhindern. Indem wir den Sinai befestigen, werden wir in der Lage sein, potenzielle Übergriffe abzuwehren und die Sicherheit unseres Landes zu gewährleisten."
EGY_defence_of_cairo:0 "Verteidigung von Kairo"
EGY_defence_of_cairo_desc:0 "Als unsere Hauptstadt ist Kairo von immenser Bedeutung für unser Land. Sie ist nicht nur das Zentrum unserer Regierung, sondern auch eine Drehscheibe für Kultur, Industrie und Handel. Um die Stadt zu schützen, müssen wir Kairo befestigen und gegen alle potenziellen Bedrohungen verteidigen. Dazu gehört der Aufbau von Luftabwehrsystemen, der Bau von unterirdischen Bunkern und die Schaffung von Hindernisfeldern, um das Vorrücken des Feindes zu verhindern."
EGY_organize_the_egyptian_resistance:0 "Organisieren Sie den [EGY.GetAdjective]Widerstand"
EGY_organize_the_egyptian_resistance_desc:0 "Im Falle einer Invasion unseres Landes dürfen wir nicht die Hoffnung verlieren. Wir müssen unser Volk zusammentrommeln und eine Widerstandsbewegung bilden, um gegen die Besatzungstruppen zu kämpfen. Dazu gehört die Ausbildung und Bewaffnung von Zivilisten, die Organisation von Sabotageaktionen und die Verbreitung von Propaganda, um die Kontrolle des Feindes zu untergraben. Dies wird uns auch auf den Tag vorbereiten, an dem wir unsere Souveränität zurückfordern können."
EGY_evacuate_industrial_reserves:0 "Evakuieren Sie die Industriereserven"
EGY_evacuate_industrial_reserves_desc:0 "Im Falle einer möglichen Invasion oder Besetzung ist es von entscheidender Bedeutung, dass wir unsere industriellen Reserven schützen. Dazu gehört, dass wir kritische Fabriken, Ausrüstung und Personal an sichere Orte innerhalb und außerhalb der Grenzen unseres Landes verlagern. Durch die Evakuierung dieser Reserven können wir sicherstellen, dass sie nicht in die Hände des Feindes fallen und weiterhin kriegswichtiges Material für unser Militär produzieren."
EGY_the_army_in_exile:0 "Die Armee im Exil"
EGY_the_army_in_exile_desc:0 "Im Falle einer Besetzung unseres Landes dürfen wir unser oberstes Ziel nicht aus den Augen verlieren - die Rückgewinnung unserer Souveränität. Um dies zu erreichen, müssen wir eine Exilarmee aufbauen, die aus loyalen und engagierten Soldaten besteht, die für die Befreiung unseres Heimatlandes kämpfen werden. Dazu gehört die Rekrutierung und Ausbildung von Soldaten aus den Reihen der Exilanten und Flüchtlinge, die Beschaffung von Ausrüstung aus verbündeten Nationen und der Aufbau einer Kommandostruktur."
EGY_exile_naval_forces:0 "Exilierte Seestreitkräfte"
EGY_exile_naval_forces_desc:0 "Für den Fall, dass unser Land besetzt wird, können wir unsere Seekräfte nicht zurücklassen. Wir müssen eine Exilmarine aufbauen, die aus loyalen und engagierten Matrosen besteht, die für die Befreiung unseres Heimatlandes kämpfen werden. Dazu gehört die Rekrutierung und Ausbildung von Matrosen aus dem Kreis der Exilanten und Flüchtlinge, die Beschaffung von Ausrüstung aus verbündeten Nationen und der Aufbau einer Kommandostruktur."
EGY_exiles_in_the_air:0 "Exilanten in der Luft"
EGY_exiles_in_the_air_desc:0 "Für den Fall, dass unser Land besetzt wird, dürfen wir unsere Fähigkeiten in der Luft nicht außer Acht lassen. Wir müssen eine Luftwaffe im Exil aufbauen, die aus loyalen und engagierten Piloten besteht, die für die Befreiung unseres Heimatlandes kämpfen werden. Dazu gehört die Rekrutierung und Ausbildung von Piloten aus dem Ausland und von Flüchtlingen, die Beschaffung von Ausrüstung aus verbündeten Nationen und der Aufbau einer Kommandostruktur."
EGY_egyptian_military_academy:0 "[EGY.GetAdjective] Militärakademie"
EGY_egyptian_military_academy_desc:0 "Wir haben die militärische Ausbildung lange Zeit vernachlässigt, aber mit der drohenden Gefahr eines Krieges am Horizont ist der Bedarf an einem modernen und gut ausgebildeten Militär offensichtlich geworden. Mit der Eröffnung einer neuen Militärakademie werden wir in der Lage sein, unsere Offiziere auf höchstem Niveau auszubilden und sicherzustellen, dass sie auf jede Herausforderung vorbereitet sind."
EGY_increase_british_arms_shipments:0 "Erhöhung der [EGY.GetAdjective] Waffenlieferungen"
EGY_increase_british_arms_shipments_desc:0 ""
EGY_continue_army_segregation:0 "Fortsetzung der Trennung der Armee"
EGY_continue_army_segregation_desc:0 "Es ist wichtig, die Integrität und Reinheit des ägyptischen Militärs zu bewahren. Zu diesem Zweck müssen wir die Politik der Trennung zwischen [EGY.GetAdjective] und [SUD.GetAdjective] Soldaten innerhalb der Streitkräfte fortsetzen. Dies wird sicherstellen, dass unsere Soldaten der Nation gegenüber loyal bleiben und sich nicht von äußeren Einflüssen beeinflussen lassen."
EGY_sudanese_volunteers:0 "[SUD.getAdjective] Freiwillige"
EGY_sudanese_volunteers_desc:0 "Wir müssen erkennen, dass ein starkes und effektives Militär nur dann bestehen kann, wenn es die Vielfalt und die Integration seiner Soldaten fördert. Indem wir die Segregation der Streitkräfte aufheben und [EGY.GetAdjective] und [SUD.GetAdjective] Soldaten erlauben, gemeinsam zu dienen, können wir gegenseitiges Verständnis und Respekt fördern und eine stärkere und geschlossenere Truppe schaffen."
EGY_modernize_our_weaponry:0 "Modernisieren Sie unsere Waffensysteme"
EGY_modernize_our_weaponry_desc:0 "Wir sehen die Notwendigkeit, mit der sich schnell verändernden Technologie im Bereich der Waffen Schritt zu halten. Durch die Modernisierung unserer Rüstung werden wir in der Lage sein, unsere Nation besser zu verteidigen und unsere Macht in der Region zu demonstrieren. Diese Konzentration wird es uns ermöglichen, neue und fortschrittliche Waffen zu erforschen und zu entwickeln, die uns in zukünftigen Konflikten einen entscheidenden Vorteil verschaffen."
EGY_field_piece_research:0 "Feldstück-Forschung"
EGY_field_piece_research_desc:0 "Die Artillerie ist das Rückgrat jeder modernen Armee, und unsere Artillerietechnologie braucht dringend ein Update. Durch die Modernisierung unserer Artillerie werden wir in der Lage sein, mehr Feuerkraft auf dem Schlachtfeld einzusetzen und die Effektivität unserer Bodentruppen zu erhöhen."
EGY_logistical_brigades:0 "Logistische Brigaden"
EGY_logistical_brigades_desc:0 "Der Erfolg jeder militärischen Kampagne hängt von der Fähigkeit ab, die Truppen im Feld zu versorgen und zu unterstützen. Durch die Bildung von Logistikbrigaden werden wir in der Lage sein, unsere Truppen besser zu unterstützen, indem wir sie mit dem notwendigen Nachschub und der notwendigen Ausrüstung versorgen. Durch diese Konzentration können wir ein Netzwerk von Nachschubdepots, Transport- und Sanitätseinheiten und andere logistische Unterstützung aufbauen."
EGY_desert_camouflage:0 "Wüsten-Tarnung"
EGY_desert_camouflage_desc:0 "Da der größte Teil unseres Territoriums von Wüste bedeckt ist, ist es unerlässlich, dass unser Militär mit der notwendigen Tarnung ausgestattet ist, um unter diesen Bedingungen effektiv zu operieren. Wenn wir unsere Truppen mit Wüstentarnungen ausstatten, wird es für den Feind schwieriger, sie zu erkennen, und wir haben einen zusätzlichen Vorteil im Wüstenkrieg."
EGY_radio_technologies:0 "Funktechnologien"
EGY_radio_technologies_desc:0 "Die Einführung von Funktechnologien wird die Art und Weise, wie unser Militär auf dem Schlachtfeld kommuniziert, revolutionieren. Durch die Einführung dieser neuen Technologien können wir die Kommunikation und Koordination zwischen unseren Truppen verbessern sowie die Geschwindigkeit und Effizienz der Befehls- und Kontrollfunktionen erhöhen."
EGY_new_military_institute:0 "Neues Militärisches Institut"
EGY_new_military_institute_desc:0 "[EGY.GetNameDefCap] ist seit langem eine Bastion der militärischen Stärke in der Region, und mit der Einrichtung einer neuen Militärakademie können wir sicherstellen, dass diese Tradition fortgesetzt wird. Unsere Offiziere werden nach den höchsten Standards ausgebildet, und unsere Soldaten werden bestens gerüstet sein, um unsere Nation gegen jede Bedrohung zu verteidigen. Indem wir in diese neue Akademie investieren, senden wir der Welt die Botschaft, dass wir eine Macht sind, mit der man rechnen muss, und dass unsere Feinde es sich zweimal überlegen sollten, bevor sie sich mit uns anlegen."
EGY_central_intelligence:0 "Zentrale Intelligenz"
EGY_central_intelligence_desc:0 "In der schnelllebigen Welt von heute ist Wissen Macht. Durch den Aufbau eines zentralen Nachrichtendienstes werden wir in der Lage sein, Informationen aus allen Teilen der Welt zu sammeln und zu analysieren, was uns einen Vorteil gegenüber unseren Feinden verschafft. Von Spionage und verdeckten Operationen bis hin zur Signalaufklärung. Die Investition in dieses Netzwerk wird sicherstellen, dass wir unseren Gegnern immer einen Schritt voraus sind."
EGY_decryption_department:0 "Abteilung für Entschlüsselung"
EGY_decryption_department_desc:0 "Um die Geheimnisse unseres Landes zu wahren und uns vor ausländischer Spionage zu schützen, müssen wir in eine erstklassige Entschlüsselungsabteilung investieren. Diese Abteilung wird darauf spezialisiert sein, feindliche Codes zu knacken und verschlüsselte Kommunikation zu entschlüsseln, was uns einen strategischen Vorteil im Bereich der Nachrichtenbeschaffung verschafft."
EGY_air_defenses:0 "Luftverteidigung"
EGY_air_defenses_desc:0 "Wir haben unsere Befestigungen auf dem Festland ausgebaut, aber jetzt müssen wir uns auf den Schutz unseres Luftraums konzentrieren."
EGY_continue_motorization_of_the_army:0 "Motorisierung der Armee fortsetzen"
EGY_continue_motorization_of_the_army_desc:0 "Das Zeitalter des Fußsoldaten neigt sich dem Ende zu und wir müssen uns anpassen, um der Zeit voraus zu sein. Wenn wir die Motorisierung unserer Armee fortsetzen, werden wir in der Lage sein, uns schnell und effizient auf dem Schlachtfeld zu bewegen, unsere Feinde auszumanövrieren und dort anzugreifen, wo sie es am wenigsten erwarten. Dies wird nicht nur die Mobilität unseres Militärs erhöhen, sondern auch die Feuerkraft, Feuerkraft und Reaktionsfähigkeit."
EGY_develop_egyptian_armour:0 "Entwicklung der [EGY.GetAdjective] Panzerung"
EGY_develop_egyptian_armour_desc:0 "Um unsere Soldaten zu schützen und ihnen einen Vorteil im Kampf zu verschaffen, müssen wir in die Entwicklung fortschrittlicher Panzerungen investieren. Dazu gehören die Erforschung und Herstellung der neuesten Panzer- und Panzerwaffentechnologie sowie die Entwicklung neuer und innovativer Designs, um der Konkurrenz einen Schritt voraus zu sein. Wenn wir in dieses Programm investieren, werden wir in der Lage sein, ein schlagkräftigeres und widerstandsfähigeres Militär aufzustellen, das auch den härtesten Gefechten standhalten kann."
EGY_unit_777:0 "Einheit 777"
EGY_unit_777_desc:0 "Angesichts der wachsenden Bedrohungen von außen müssen wir entschlossen handeln, um unser Land und seine Bevölkerung zu schützen. Zu diesem Zweck müssen wir die Bildung der Einheit 777 vorantreiben - einer hochausgebildeten und spezialisierten Sondereinsatzeinheit."
EGY_study_nuclear_power:0 "ETRR-1 Projekt"
EGY_study_nuclear_power_desc:0 "Es ist unerlässlich, dass wir die Kernenergie studieren und erforschen, um ein tieferes Verständnis dieser mächtigen Technologie und ihrer möglichen Anwendungen zu erlangen. Wenn wir die Wissenschaft der Kernenergie beherrschen, können wir Kernwaffen entwickeln, die auf jeden potenziellen Aggressor abschreckend wirken."
EGY_sameera_moussa:0 "Sameera Moussa"
EGY_the_egyptian_army_idea:0 "Die [EGY.GetAdjective] Armee"
EGY_the_egyptian_army_idea_desc:0 "Jahre der Vernachlässigung durch die Regierung und die Wirtschaft haben die Armee in einen schlechten Zustand versetzt, eine Modernisierung und Reform ist im Falle eines neuen Konflikts notwendig."
