EGY_swaying_fascist_sudan_currently:0 "Sway [SUD.GetAdjective] Separatisten derzeit"
EGY_iron_guard_mobilization:0 "Mobilisierung der Eisernen Garde"
EGY_iron_guard_mobilization_desc:0 "Angesichts unserer verstärkten Aktivitäten gegen die Monarchie mobilisiert die königliche Eiserne Garde, um gegen unsere Macht vorzugehen und unsere Aktivitäten zu unterbinden."
EGY_iron_guard_mobilization_tt:0 "Die gegnerische Seite des Bürgerkriegs wird zu Beginn des Krieges eine zusätzliche Einheit erhalten."
EGY_sway_a_commander_to_the_cause:0 "Beeinflussen Sie einen Kommandanten für die Sache"
EGY_sway_a_commander_to_the_cause_desc:0 "Wir können nicht darauf hoffen, eine erfolgreiche Rebellion mit der Unterstützung von Teilen der Armee durchzuführen. Vielleicht können wir mit genügend Überzeugungskraft die Sympathie und den Rückhalt eines Kommandanten innerhalb der Armee gewinnen."
EGY_political_assassinations:0 "Politische Attentate"
EGY_political_assassinations_desc:0 ""
EGY_guns_for_the_cause:0 "Waffen für die Sache"
EGY_guns_for_the_cause_desc:0 "Für einen erfolgreichen Aufstand brauchen wir einen großen Vorrat an Munition, um unsere Truppen und Partisanen zu versorgen. Glücklicherweise haben wir Sympathisanten im nationalen Arsenal und solche, die bereit sind, Überfälle auf militärische Lagerbestände durchzuführen, um zusätzliche Waffen für unsere Sache zu erlangen."
EGY_guns_for_the_cause_tt:0 "Bei Ausbruch des Bürgerkriegs erhalten wir eine zusätzliche §Y500 Infanterieausrüstung§!."
EGY_suez_canal_operations_category:0 "[911.GetName] Kanaloperationen"
EGY_suez_canal_states:0 "Suez-Kanal-Staaten"
EGY_prepare_to_nationalize_the_canal:0 "Bereiten Sie sich auf die Verstaatlichung des Kanals vor"
EGY_suez_border_war_start:0 "Unmittelbar bevorstehender Grenzkonflikt bei [911.GetName]"
EGY_backed_down_from_albania:0 "Rückzug aus [ALB.GetNonIdeologyName]"
EGY_establish_a_palestinian_potectorate:0 "Errichten Sie ein [PAL.GetAdjective] Potektorat"
EGY_establish_a_palestinian_potectorate_desc:0 "Jetzt, da wir Maßnahmen ergreifen, um das [PAL.GetAdjective] Volk von seinen Unterdrückern zu befreien, ist es ideal, dass wir eine Calloboration-Regierung einrichten, die uns hilft, ihre Selbstverwaltung und anhaltende Sicherheit zu gewährleisten."
EGY_establish_a_palestinian_potectorate_state_tt:0 "Erlangung des Eigentums an allen kontrollierten [PAL.GetAdjective] Staaten."
egypt.1.t:0 "Tod von Fuad I."
egypt.1.d:0 "Fuad I., der 5 Jahre lang als Sultan unserer Nation und dann weitere 14 Jahre als König gedient hat, ist im königlichen Koubbeh-Palast im Schlaf gestorben. Er war 68 Jahre alt.\n\nFuad I. führte unsere Nation durch die späteren Phasen des Großen Krieges und überwachte die [EGY.GetAdjective] Revolution von 1919 und die letztendliche Unabhängigkeitserklärung von [ENG.GetNameDef] im Jahr 1922. Er fuhr dann fort, die Position von [EGY.GetNameDef] weltweit zu stärken und reformierte und formte das Königreich, wie wir es kennen. \n\nMit dem Tod von Fuad wird sein Sohn Farouk als Farouk I. unmittelbarer Thronfolger. Da Farouk zu diesem Zeitpunkt jedoch noch nicht volljährig ist, wird er bis zu seiner Volljährigkeit in einigen Jahren einer Regentschaft unterstellt, die von Aziz Ezzat und mehreren anderen Prinzen geleitet wird."
egypt.1.a:0 "Ein Nationalheld verloren."
egypt.2.t:0 "[getYear] Anglo-[EGY.GetAdjective] Konferenz"
egypt.2.d:0 "Auf Initiative der [EGY.getAdjective] Regierung wurde eine [getYear] Anglo-[EGY.GetAdjective] Konferenz einberufen, auf der sich Delegationen beider Länder in Kairo treffen sollen, um über den Status und den Beitrag von [EGY.getNameDef] als Teil des Commonwealth of Nations und [ENG.getAdjective] Protektorat zu diskutieren. \n\nThemen der Konferenz sind unter anderem die gegenseitige Verteidigung zu Lande und in der Luft im Falle einer ausländischen Invasion, die [EGY.GetAdjective]-[SUD.GetAdjective]-Beziehungen und das problematische Thema Suezkanal in der Hoffnung, einen endgültigen Vertrag abzuschließen. Das wird sicherlich die Zukunft der Beziehungen zwischen [EGY.GetNameDef] und [ENG.GetNameDef] und dem Kaiserreich bestimmen."
egypt.2.a:0 "Sehr gut."
egypt.3.t:0 "Ägypten fordert britischen Militärrückzug"
egypt.3.d:0 "WIP"
egypt.3.a:0 "Es hat wenig Sinn, sich dem Unvermeidlichen zu widersetzen."
egypt.3.b:0 "Ägypten ist zu wichtig, das darf nicht passieren."
egypt.4.t:0 "[EGY.GetNameDefCap] droht uns mit [ITA.GetNameDef]"
egypt.4.d:0 "[EGY.getNameDefCap] hat unserer Delegation kürzlich zu verstehen gegeben, dass sie, wenn die Verhandlungen über die Unabhängigkeit von [EGY.GetAdjective] nicht signifikant vorankommen, diplomatische Beziehungen zu [ITA.getNameDef] aufnehmen wollen, um zu sehen, ob sie mehr erreichen können, wenn sie sich mit anderen europäischen Nationen verbünden.\n\nWährend dies möglicherweise ein Bluff ist, um uns zu Zugeständnissen zu zwingen, könnte die Vorstellung, [EGY.GetAdjective] so drastisch aus unserem Einflussbereich zu verlieren, ein zu großes Risiko darstellen."
egypt.4.a:0 "Diese Drohung sollte ernst genommen werden."
egypt.4.b:0 "Ein reiner Bluff."
egypt.5.t:0 "[ENG.getNameDefCap] geht auf unsere Forderungen ein"
egypt.5.d:0 "Die [ENG.GetAdjective]-Delegation hat unsere Drohung berücksichtigt und im Gegenzug weitere Zugeständnisse gemacht, damit wir uns weiterhin auf sie konzentrieren. Sie sind eindeutig nicht gewillt, zuzulassen, dass rivalisierende Nationen gegen den Willen von [ENG.GetNameDef] Einfluss auf uns ausüben, und sie sind bereit, zusätzliche Schritte zu unternehmen, um sicherzustellen, dass dies nicht geschieht."
egypt.5.a:0 "Sie haben die richtige Entscheidung getroffen."
egypt.6.t:0 "[ENG.getNameDefCap] lässt uns bluffen"
egypt.6.d:0 "Die [ENG.GetAdjective]-Delegation hat unsere Drohung als einfachen Verhandlungstrick abgetan und hat kein Interesse daran, darauf hereinzufallen, da sie glaubt, dass wir ebenso wenig Interesse daran haben, [ITA.GetAdjective] die Hand zu reichen wie sie selbst.\n\nWährend sie uns dieses Mal in Verlegenheit gebracht haben, ist es möglich, dass wir ihre Untätigkeit in Zukunft zu unserem Vorteil nutzen."
egypt.6.a:0 "Das hätte besser laufen können."
egypt.7.t:0 "Vorschlag zur [EGY.getAdjective] Unabhängigkeit"
egypt.7.d:0 "Während der Beratungen unserer Delegation auf der Konferenz mit [EGY.GetNameDef] kamen die [EGY.GetAdjective] direkt zur Sache und fragten uns, was wir von ihrer vollständigen Unabhängigkeit ohne starken Einfluss oder Unterstützung durch [ENG.GetAdjective] hielten.\n\nWährend wir bedeutende Interessen innerhalb von [EGY.GetNameDef] haben, ist es wichtig, dass wir eine klare Haltung zu dem Vorschlag einnehmen, sie vollständig auszuschließen, und inwieweit wir sie wirklich 'unabhängig' sein lassen sollten."
egypt.7.a:0 "Wir sind nicht gegen eine vollständige [EGY.GetAdjective] Unabhängigkeit."
egypt.7.b:0 "Ägypten ist zu wichtig, um es loszulassen."
egypt.8.t:0 "[ENG.getNameDefCap] hat keine Einwände gegen unsere Unabhängigkeit."
egypt.8.d:0 "Die Delegation von [ENG.GetNameDefCap] in der Konferenz hat auf unsere Anfrage zur Aussicht auf unsere vollständige Unabhängigkeit geantwortet und erklärt, dass sie bereit ist, keine Einwände zu erheben, wenn ihre Interessen in unserem Land geschützt und gesichert werden und sie bei Bedarf als strategischer Knotenpunkt erhalten bleibt.\n\nUnd zweifellos hat diese Unterstützung ihren Preis, aber sie ist ein guter Schritt in die richtige Richtung."
egypt.8.a:0 "Eine höchst willkommene Nachricht."
egypt.9.t:0 "[ENG.getNameDefCap] ist gegen unsere Unabhängigkeit."
egypt.9.d:0 "Die Delegation von [ENG.GetNameDefCap] in der Konferenz hat auf unsere Anfrage zur Aussicht auf unsere volle Unabhängigkeit geantwortet und unmissverständlich klar gemacht, dass sie unsere volle Unabhängigkeit verhindern wollen, da sie darin eine große Bedrohung für ihre Interessen und strategischen Ziele in unserem Land sehen.\n\nMit einer solch arroganten Ansicht über die rechtmäßige Unabhängigkeit unseres Landes könnte es zunehmend schwierig werden, mit [ENG.GetAdjective] effektiv zu verhandeln."
egypt.9.a:0 "Arrogante Narren."
egypt.10.t:0 "[ENG.getNameDefCap] schickt uns industrielle Zugeständnisse"
egypt.10.d:0 "Gelder der Bank von [ENG.GetNameDef] wurden in unsere nationale Reserve umgeleitet, um das Wachstum unserer Entwicklung zu unterstützen und unsere finanzielle Zukunft zu sichern. Dies ist wahrscheinlich eine Maßnahme, um uns gegenüber dem [ENG.GetAdjective] weicher zu machen."
egypt.10.a:0 "Annehmbare Bedingungen."
egypt.11.t:0 "[ENG.getNameDefCap] schlägt einen Vertrag über gegenseitige Marineforschung vor"
egypt.11.d:0 "[ENG.GetNameDefCap] hat uns heute vorgeschlagen, dass unsere Seestreitkräfte gemeinsame Marineübungen durchführen und vorübergehend bei der Entwicklung unserer Marinetechnologien zusammenarbeiten. Sie behaupten, dass die Zusammenarbeit zwischen unseren Seestreitkräften die Interessen im Mittelmeer und im Roten Meer für beide Seiten stärken wird."
egypt.11.a:0 "Dies wird für uns beide von Vorteil sein."
egypt.12.t:0 "[EGY.getNameDefCap] fordert mehr Autonomie"
egypt.12.d:0 "WIP"
egypt.12.a:0 "Sie sind loyal und ein zu guter Verbündeter."
egypt.12.b:0 "Sie sind zu wenig vertrauenswürdig."
egypt.13.t:0 "[ENG.getNameDefCap] gewährt uns größere Autonomie"
egypt.13.d:0 "WIP"
egypt.13.a:0 "Ägypten und Großbritannien, für immer vereint."
egypt.14.t:0 "[ENG.getNameDefCap] verweigert uns größere Autonomie"
egypt.14.d:0 "WIP"
egypt.14.a:0 "Ein unvorhergesehener Verrat."
egypt.15.t:0 "Konferenz endet zu Gunsten von [EGY.getNameDef]"
egypt.15.d:0 "Mit dem Ende der Konferenz ist es klar, dass [EGY.GetNameDef] die Oberhand über [ENG.GetNameDef] gewonnen hat. Es ist nun offensichtlich, dass ihr Recht auf Selbstbestimmung und die Vertreibung des Einflusses von [ENG.GetAdjective] zugunsten der vollen Unabhängigkeit von [EGY.GetAdjective] nun Realität ist und dass dies nun ein Prozess ist, den sie als Maßnahme ergreifen können, wenn sie dies wünschen.\n\nTrotz dessen bleibt die Zukunft von [EGY.GetNameDef] unklar."
egypt.15.a:0 "Die Konferenz ist beendet."
egypt.16.t:0 "Konferenz endet zu [ENG.getNameDef]s Gunsten"
egypt.16.d:0 "Mit dem Ende der Konferenz ist es klar, dass [ENG.GetNameDef] die Oberhand über [EGY.GetNameDef] gewonnen hat. Es ist nun offensichtlich, dass die [EGY.GetAdjective] dazu bestimmt sind, den [ENG.GetAdjective] untertänig zu bleiben und dass ihre Vorstellung von Unabhängigkeit lediglich eine Formalität ist, um die globalen Beziehungen zu stärken und die Menschen zu beschwichtigen. Die Interessen von [ENG.GetAdjective] in [EGY.GetNameDef] sind nun mit eisernem Griff gestärkt worden.\n\nDoch mit dieser Entwicklung könnten die Unruhen innerhalb der Nation aufgrund von Anti-[ENG.GetAdjective]-Stimmung zunehmen, nur die Zeit wird zeigen, wie die Zukunft der Nation aussieht."
egypt.16.a:0 "Die Konferenz ist beendet."
egypt.17.t:0 "Konferenz endet ergebnislos"
egypt.17.d:0 "Aufgrund unerwarteter Umstände konnte die Konferenz nicht fortgesetzt werden oder es hat sich keine eindeutige Oberhand ergeben. Es ist unklar, wie es weitergehen wird, aber beide Seiten könnten versuchen, aus diesen Entwicklungen Kapital zu schlagen."
egypt.17.a:0 "Die Konferenz ist beendet."
egypt.18.t:0 "[EGY.getName] bittet um unsere Unterstützung"
egypt.18.d:0 "Die Bewegung der [EGY.GetAdjective] Muslimbruderschaft, die sich derzeit als Guerillabewegung im Untergrund befindet, hat uns um Unterstützung in Form von materieller Hilfe oder sogar Freiwilligen im Falle einer Rebellion gegen die Monarchie und den Einfluss von [ENG.GetAdjective] gebeten, die sie aus ihrem Land vertreiben und einen starken unabhängigen arabischen Staat errichten wollen.\n\nDies könnte eine Gelegenheit sein, ein befreundetes Land im Nahen Osten zu errichten und die Macht von [ENG.GetNameDef] in der Region stark zu schwächen."
egypt.18.a:0 "Wir werden unsere Freunde gegen [ENG.GetNameDef] unterstützen."
egypt.18.a2:0 "Das ist eine Chance für uns."
egypt.18.b:0 "Wir sind nicht interessiert."
egypt.19.t:0 "[GER.getName] sagt seine Unterstützung zu."
egypt.19.d:0 "[GER.GetNameDefCap] hat entschiedene Sympathie für unsere Sache geäußert und die Gelegenheit ergriffen, [ENG.GetAdjective] in Afrika entgegenzutreten und hat uns im Falle einer Rebellion Unterstützung angeboten, sei es in Form von materieller oder personeller Hilfe oder beidem."
egypt.19.a:0 "Ausgezeichnet."
egypt.19_tt:0 "Bei Ausbruch des Bürgerkriegs erhalten wir eine zusätzliche §Y2000 Infanterieausrüstung§!."
egypt.20.t:0 "[GER.getName] nicht von ihrer Unterstützung ab."
egypt.20.d:0 "Obwohl [GER.GetNameDef] mit unserer Sache gegen den Realismus und [ENG.GetNameDef] sympathisiert, wird [GER.GetNameDef] uns keine Unterstützung für unsere Sache zukommen lassen. Vielleicht ein Fehler in den Beziehungen, aber vielleicht gibt es zwischen uns beiden weitere Möglichkeiten, wenn wir uns beweisen können."
egypt.20.a:0 "Unglücklich."
egypt.21.t:0 "Bewaffnete Revolten im Sudan"
egypt.21.d:0 "WIP"
egypt.21.a:0 "Der Konflikt eskaliert."
egypt.22.t:0 "Rebellion im Sudan"
egypt.22.d:0 "Die Spannungen in [SUD.GetNonIdeologyName] nehmen seit Monaten kontinuierlich zu und die Bevölkerung ist zunehmend unzufrieden mit unserer Besatzung. Die von uns auferlegte harte Politik und unser allgemeiner Mangel an Unterstützung haben die Wut und die Unruhe im [SUD.GetAdjective] Volk nur noch weiter angeheizt.\n\nAls Reaktion auf diese Zustände hat sich eine Gruppe von [SUD.GetAdjective] nationalistischen Führern zusammengefunden, um eine bewaffnete Rebellion gegen unsere Besatzung zu starten. Die Rebellion gewinnt schnell an Schwung, da sowohl das [SUD.GetAdjective] Militär als auch die Zivilbevölkerung zu den Waffen greifen, um für ihre Freiheit zu kämpfen."
egypt.22.a:0 "Die Rebellion muss niedergeschlagen werden!"
egypt.22.b:0 "Eine edle Sache."
egypt.23.t:0 "[EGY.getName] bietet an, den Suezkanal zu kaufen"
egypt.23.d:0 "WIP"
egypt.23.a:0 "Ein verlockendes Angebot."
egypt.23.b:0 "Wir würden niemals etwas so Wichtiges verkaufen."
egypt.24.t:0 "[907.Owner.getName] nimmt unser Angebot an"
egypt.24.d:0 "WIP"
egypt.24.a:0 "Die richtige Wahl."
egypt.25.t:0 "[907.Owner.getName] lehnt unser Angebot ab"
egypt.25.d:0 "WIP"
egypt.25.a:0 "Sie weigern sich, das zurückzugeben, was uns rechtmäßig gehört."
egypt.26.t:0 "Farouk I. besteigt den Thron"
egypt.26.d:0 "Als Farouk volljährig wurde, fand seine Krönung im Königspalast in Kairo statt. Er wurde von der Kairoer Polizei und der königlichen Garde eskortiert und bei seiner Ankunft von mehreren Mitgliedern der [EGY.GetAdjective] Regierung und Mitgliedern seines Kabinetts begrüßt. Gleich nach seiner Ankunft wurde er zum König von [EGY.GetNameDef] gekrönt und bestieg den Thron als Farouk I. \n\nFarouk ist der jüngste gekrönte Monarch in der Geschichte unseres Landes und es bleibt abzuwarten, ob er in der Lage ist, das gleiche Prestige und Erbe seines Vaters anzutreten."
egypt.26.a:0 "Lang lebe Farouk I!"
egypt.27.t:0 "[getYear] Anglo-[EGY.GetAdjective] Konferenz"
egypt.27.d:0 "Auf Initiative der [EGY.getAdjective] Regierung wurde eine [getYear] Anglo-[EGY.GetAdjective] Konferenz einberufen, auf der Delegationen beider Länder in Kairo zusammenkommen sollen, um den Status und den Beitrag von [EGY.getNameDef] als Teil des Commonwealth of Nations und [ENG.getAdjective] Protektorat zu erörtern. \n\nThemen der Konferenz sind die gegenseitige Verteidigung zu Lande und in der Luft im Falle einer ausländischen Invasion, die Beziehungen zwischen [EGY.GetAdjective] und [SUD.GetAdjective] und das problematische Thema des Suezkanals in der Hoffnung, einen endgültigen Vertrag zu schließen. Dieser wird sicherlich die Zukunft der Beziehungen Ägyptens zu Großbritannien und dem Empire bestimmen."
egypt.27.a:0 "Sehr gut."
egypt.29.t:0 "[EGY.GetNameDefCap] erörtert alte Bindungen"
egypt.29.d:0 "Die Regierung von [EGY.GetName] ist mit einem Angebot für eine Personalunion zwischen unseren beiden Nationen an uns herangetreten. Sie verweisen auf die gemeinsame Geschichte und die kulturellen Bindungen zwischen uns beiden sowie auf die potenziellen wirtschaftlichen und militärischen Vorteile einer solchen Union.\n\n die [EGY.GetAdjective] argumentieren, dass eine solche Union unseren beiden Nationen mehr Stabilität und Wohlstand bringen würde. Aber soll das auch für uns gelten?"
egypt.29.a:0 "Ein vorteilhafter Vorschlag."
egypt.29.b:0 "Wie lächerlich!"
egypt.30.t:0 "[ALB.GetNameDefCap] stimmt einer Personalunion zu"
egypt.30.d:0 "Die Regierung von [ALB.GetNameDef] hat unseren Vorschlag für eine Personalunion zwischen unseren beiden Nationen angenommen. Wir freuen uns, Ihnen mitteilen zu können, dass [ROOT.GetNonIdeologyName] und [ALB.GetNonIdeologyName] nun unter einem einzigen Herrscher vereint sein werden, was beiden Ländern mehr Stabilität und Wohlstand bringen wird. Dies ist ein weiterer Schritt zur vollständigen und rechtmäßigen Vereinigung unserer beiden Nationen."
egypt.30.a:0 "Eine gute Wahl."
egypt.31.t:0 "Die [ALB.GetName] lehnt unseren Vorschlag ab"
egypt.31.d:0 "Die Regierung von [ALB.GetNameDef] hat unseren Vorschlag für eine Personalunion zwischen unseren beiden Nationen abgelehnt. Es ist klar, dass die [ALB.GetAdjective] sich weiterhin etwas vormachen und das offensichtliche Schicksal zwischen unseren beiden Nationen nicht verwirklichen werden."
egypt.31.a:0 "Wenn das der Fall ist, dann müssen wir nachgeben."
egypt.31.b:0 "Wir haben es auf dem diplomatischen Weg versucht."
egypt.32.t:0 "Die Rückkehr des Khedive"
egypt.32.d:0 "Abbas II., der letzte Khedive unserer Nation, bevor sie 1914 durch die gewaltsame Hand von [ENG.GetNameDef] aufgelöst wurde, ist zurückgekehrt, jetzt, da unser Land seine volle Unabhängigkeit von [ENG.GetAdjective] erlangt hat, und versucht, den Thron wiederzuerlangen, der ihm unrechtmäßig genommen wurde, in dem Glauben, dass [EGY.GetLeader] nur eine weitere [ENG.GetAdjective]-Marionette ist und der Khedive das letzte Beispiel für wahre [EGY.GetAdjective]-Unabhängigkeit war. \n\nAbbas II. wurde vom Volk und einem Großteil der Regierung herzlich willkommen geheißen. Sie glauben, dass er der starke Führer ist, den [EGY.GetNameDef] braucht, um es durch die Zeit nach der vollständigen Unabhängigkeit vom [ENG.GetAdjective] zu führen, sehr zum Entsetzen Farouks."
egypt.32.a:0 "Eine glorreiche neue Ära für [EGY.GetNameDef]!"
egypt.33.t:0 "Der [EGY.GetName] schlägt einen Nichtangriffspakt vor"
egypt.33.d:0 "Der heute anwesende Diplomat von [EGY.GetNameDef] hat uns einen Vorschlag unterbreitet, in dem er vorschlägt, dass unsere beiden Nationen einen Nichtangriffspakt unterzeichnen, um den Wohlstand und die Einheit des Nahen Ostens zu bewahren.\n\n Sollten wir diesen Vorschlag annehmen, könnte er die weitere Zusammenarbeit zwischen den Völkern von [TUR.GetAdjective] und [EGY.GetAdjective] fördern, andernfalls könnte er, wenn wir ihn ablehnen, das Gegenteil bewirken und einen weiteren Keil in den Nahen Osten treiben."
egypt.33.a:0 "Um den Wohlstand im Nahen Osten zu erhalten."
egypt.33.b:0 "Wir sind nicht verwandt, [EGY.GetLeader]."
egypt.34.t:0 "Der [TUR.GetName] nimmt unseren Vorschlag an"
egypt.34.d:0 "[TUR.GetNameDef] hat unseren Vorschlag für einen Nichtangriffspakt zwischen unseren beiden Nationen wärmstens angenommen und sieht darin einen großen Schritt zur Bewahrung des Wohlstands und der Einheit des Nahen Ostens. Dies könnte den Weg zu einer langfristigen Freundschaft zwischen unseren Nationen ebnen und eine weitere Zusammenarbeit in der Zukunft fördern."
egypt.34.a:0 "Wir werden noch Freunde sein."
egypt.35.t:0 "Die [TUR.GetName] lehnt unseren Vorschlag ab"
egypt.35.d:0 "[TUR.GetNameDef] hat unseren Vorschlag für einen Nichtangriffspakt zwischen unseren beiden Nationen abgelehnt und stattdessen beschlossen, ihn abzulehnen und unsere Diplomaten mit leeren Händen zurückzuschicken. Dies könnte darauf hindeuten, dass die Nation [TUR.GetAdjective] nicht mit uns zusammenarbeiten will."
egypt.35.a:0 "[TUR.GetLeader] ist alles andere als ein Realist."
egypt.36.t:0 "Das Mansoura-Abkommen"
egypt.36.d:0 "Heute wurde ein Abkommen zwischen der Wafd-Partei und der Monarchie in der Stadt Mansoura geschlossen. Angesichts der jüngsten politischen Instabilität haben sich beide Parteien darauf geeinigt, dass die Wafd als Regierungspartei unseres Landes gestärkt wird und dass [EGY.GetLeader] auf die Macht eines konstitutionellen Monarchen reduziert wird, der aber immer noch über begrenzte politische Befugnisse verfügt.\n\nDieser Schritt wurde zugesichert, um weitere politische Instabilität zu verhindern und die Anti-Monarchisten zu besänftigen und gleichzeitig Farouk an der Macht zu halten."
egypt.36.a:0 "Eine neue Phase der politischen Stabilität."
egypt.37.t:0 "[SUD.GetNameDefCap] stimmt für die vollständige Integration"
egypt.37.d:0 "Die Wahlen sind abgeschlossen und die [SUD.GetAdjective] haben knapp für die vollständige Integration in die [EGY.GetNameDef] gestimmt, da sie der Meinung sind, dass sie besser mit uns vereint sind, als sich in ihr eigenes Land abzuspalten. Es scheint, dass sich die Reformen und die Entwicklung, die wir ihnen auferlegt haben, ausgezahlt haben."
egypt.37.a:0 "Jetzt leben wir als Europäer."
egypt.38.t:0 "[SUD.GetNameDefCap] stimmt für begrenzte Autonomie"
egypt.38.d:0 "Die [SUD.GetAdjective] haben mehrheitlich für den Status einer begrenzten Autonomie innerhalb von [EGY.GetNameDef] gestimmt. Sie sind der Meinung, dass sie innerhalb unserer Nation besser aufgehoben sind, mit lokalen Behörden und Gesetzen, die von unseren eigenen getrennt sind. Vielleicht sind unsere Reformen und die Entwicklung, die wir ihnen auferlegt haben, nicht weit genug gegangen, um sie davon zu überzeugen, sich vollständig in uns zu integrieren, aber es ist dennoch ein Schritt in die richtige Richtung."
egypt.38.a:0 "Ein wunderbarer Kompromiss."
egypt.39.t:0 "[SUD.GetNameDefCap] stimmt für die Unabhängigkeit"
egypt.39.d:0 "Die [SUD.GetAdjective] haben mit überwältigender Mehrheit dafür gestimmt, die Unabhängigkeit von [EGY.GetNameDef] zu erklären und [SUD.GetNameDef] als ihre eigene Nation zu gründen. Es ist klar, dass wir nicht genug getan haben, um die [SUD.GetAdjective] davon zu überzeugen, die Integration oder Autonomie zu akzeptieren. Wir können dies akzeptieren und sie in Ruhe lassen oder es anfechten und damit möglicherweise alles aufs Spiel setzen, wofür wir gearbeitet haben."
egypt.39.a:0 "Ein unglückliches Ergebnis, aber wir müssen es akzeptieren."
egypt.39.b:0 "Die Befreiung des Sudan ist nahe!"
egypt.39.c:0 "Die Wahl wurde gefälscht, das können wir nicht akzeptieren."
egypt.40.t:0 "Politiker beginnen, [EGY.GetLeader] politische Agenda in Frage zu stellen"
egypt.40.d:0 "Mit der Thronbesteigung von [EGY.GetLeader] begannen Politiker und Parlamentsmitglieder fast sofort, die politische Agenda des neuen Königs in Frage zu stellen. Während sein Vater Fuad I. bei mehreren Gelegenheiten versuchte, seine eigene Macht zu stärken und das Parlament zu untergraben, gelang es ihm, eine große Opposition zu vermeiden, indem er eine nationalistische Figur blieb und eine charismatische Natur hatte. Viele sind unsicher, ob [EGY.GetLeader] in seine Fußstapfen treten wird, und fürchten die Konsequenzen solcher Aktionen mit seiner allgemeinen inkompetenten und abwesenden Natur."
egypt.40.a:0 "Das sind nur Gerüchte."
egypt.41.t:0 "Das Parlament fordert eine Reform"
egypt.41.d:0 "In letzter Zeit ist im [EGY.GetAdjective] Parlament die Opposition gegen die Institutionen der Monarchie und [EGY.GetLeader] aufgrund der langjährigen Korruption und Misshandlung durch die Monarchie stetig gewachsen. Eine große Anzahl von Parlamentsmitgliedern fordert eine weitreichende Reform der Institutionen und Befugnisse der Monarchie, während andere, mutigere Politiker vorschlagen, dass [EGY.GetLeader] ganz auf den Thron verzichten sollte. Sie behaupten, dass die [EGY.GetAdjective] Monarchie ein Symbol der Vergangenheit ist und durch ein neues und modernes System ersetzt werden sollte."
egypt.41.a:0 "Die politischen Grundlagen können nicht ewig bestehen bleiben."
egypt.42.t:0 "Die Unzufriedenheit des Militärs wächst"
egypt.42.d:0 "[EGY.GetLeader] ist in letzter Zeit innerhalb der [EGY.GetAdjective] Armee sehr unpopulär geworden, da er als schwacher und unentschlossener Monarch angesehen wird und auch der große Zustrom von Korruption, der vor allem auf die Aristokratie zurückzuführen ist, hat die Finanzierung und die Moral des Militärs beeinträchtigt und das Vertrauen verloren, so dass prominente Kommandeure wie Mohamed Naguib und Gamal Abdel Nasser offen den Sturz der Monarchie und die Einsetzung eines 'starken Führers' gefordert haben, der unsere Nation regiert."
egypt.42.a:0 "Die Streitkräfte werden immer rebellischer."
egypt.43.t:0 "[EGY.GetNameDefCap] versucht, den [911.GetName]-Kanal zu erobern."
egypt.43.d:0 "Der [EGY.GetAdjective] Führer, [EGY.GetLeader] hat deutlich gemacht, dass der [911.GetName] Kanal ein rechtmäßiger Teil der Nation ist und zurückgegeben werden sollte. Selbst wenn das mit Gewalt geschieht.\n\nDas könnte eine Rechtfertigung für den Kanal sein, also müssen wir auf das Schlimmste vorbereitet sein."
egypt.43.a:0 "Wir müssen etwas tun."
egypt.44.t:0 "[EGY.GetAdjective] Sieg der [911.GetName]"
egypt.44.d:0 "[EGY.GetAdjective] Streitkräfte haben es erfolgreich geschafft, in den [911.GetName] Kanal einzudringen und Port Said zu sichern und haben nun effektiv die absolute Kontrolle über den Kanal und seine Operationen.\n\nWährend wir nun den Suezkanal kontrollieren, nachdem er uns seit seinem Bau vor über 75 Jahren vorenthalten wurde, müssen wir auf die Reaktion der [911.Owner.getAdjective] Regierung vorbereitet sein."
egypt.44.a:0 "Wir haben uns gerade erst genommen, was uns gehört."
egypt.45.t:0 "[911.Owner.getAdjective] Sieg bei [911.GetName]"
egypt.45.d:0 "Den Verteidigern am [911.GetName]-Kanal ist es gelungen, den [EGY.GetAdjective]-Vorstoß aufzuhalten und den Angriff abzuwehren, so dass sich die [EGY.GetAdjective] zurückziehen mussten. Der Kanal bleibt fest in [911.Owner.getAdjective] Hand."
egypt.45.a:0 "Ein großer Misserfolg."
egypt.45.b:0 "Das wird es ihnen zeigen."
egypt.46.t:0 "[EGY.GetAdjective] Sieg bei [911.GetName]"
egypt.46.d:0 "[EGY.GetAdjective] Streitkräfte haben es erfolgreich geschafft, in den [911.GetName] Kanal vorzudringen und Port Said zu sichern und haben nun effektiv die absolute Kontrolle über den Kanal und seine Operationen.\n\nDas ist eine klare Bedrohung für unsere Interessen in der Region, aber wie sollten wir darauf reagieren?"
egypt.46.a:0 "Es ist töricht, das Unvermeidliche hinauszuzögern."
egypt.46.b:0 "Das ist inakzeptabel, wir müssen den Kanal zurückerobern!"
egypt.47.t:0 "Pattsituation bei [911.GetName]"
egypt.47.d:0 "Die Kämpfe am [911.GetName]-Kanal sind zum Stillstand gekommen. Beide Seiten haben keine Fortschritte gemacht, so dass die Situation patt ist. Es ist unklar, wie der Konflikt von hier aus weitergehen wird, aber es hat keine wesentlichen Veränderungen gegeben."
egypt.47.a:0 "Nun gut."
egypt.48.t:0 "Putsch der Freien Offiziere"
egypt.48.d:0 "Am frühen Morgen begannen nationalistische Polizeibeamte damit, Widerstand und Angriffe auf königliche Einheiten in [GetCapitalVictoryPointName] zu schützen und zu fördern. In der Folge zettelten Zellen der Bewegung Freier Offiziere Unruhen an, die zu Brandstiftungen führten. Die Unzufriedenheit innerhalb der Armee hat sie über den Rand getrieben. Kurz darauf stürmten Bataillone das königliche Offiziersgebäude und alle darin befindlichen Kommandeure.\n\nMohamed Naguib und Gamal Abdel Nasser verkündeten gemeinsam die Absetzung Farouks und die Gründung der ägyptischen Republik mit Nasser als ihrem ersten Präsidenten. Farouk musste bald darauf abdanken und ist seitdem ins Exil gegangen.\n\nNasser verspricht die Vertreibung des ausländischen Einflusses in [ROOT.GetNonIdeologyName], um das Land wieder als Macht zu etablieren und als einigende Kraft für die arabische Welt zu wirken."
egypt.48.a:0 "Jetzt können wir ihnen zeigen, was wir wirklich sind."
egypt.49.t:0 "Mitgliedschaft in der Anti-[ISR.GetAdjective]-Koalition"
egypt.49.d:0 "[EGY.GetNameDefCap] hat eine offensive Koalition gegen die zionistische Politik in [ISR.GetNameDef] gebildet und ruft alle arabischen Länder auf, zu den Waffen zu greifen und anzugreifen, um sie zu zerstören. Sie haben bereits Operationen auf dem Land gestartet, sollen wir uns auch diesem Kampf anschließen, um [ISR.GetNameDef] vom Nahen Osten zu befreien?"
egypt.49.a:0 "Wir werden unsere arabischen Brüder unterstützen."
egypt.49.b:0 "Wir sind nicht interessiert."
egypt.50.t:0 "[EGY.GetNameDefCap] verlangt die Kontrolle über [SYR.GetNonIdeologyName] und [LEB.GetNonIdeologyName]."
egypt.50.d:0 "[EGY.GetNameDefCap] hat uns ein Ultimatum gestellt: Gewähren Sie die sofortige Unabhängigkeit von [SYR.GetNameDef] und [LEB.GetNameDef] und ziehen Sie alle unsere Vermögenswerte aus der Nation ab, die ausschließlich unter der Aufsicht von [EGY.GetAdjective] steht, oder riskieren Sie einen Krieg.\n\nDies steht im Einklang mit dem Wunsch von [EGY.GetLeader], seinen Einfluss auf die arabische Welt auszuweiten und sie schließlich zu vereinen, aber wollen wir wirklich einen Krieg um diese Gebiete riskieren?"
egypt.50.a:0 "Wir sind nicht in der Lage, dies zu verteidigen."
egypt.50.b:0 "Es wäre töricht zu glauben, wir würden etwas so Wichtiges aufgeben."
egypt.51.t:0 "[FROM.GetNameDefCap] erfüllt unsere Forderungen"
egypt.51.d:0 ""
egypt.51.a:0 "Die arabische Welt wird stärker."
egypt.52.t:0 "Unsere Forderungen wurden abgelehnt"
egypt.52.d:0 "Der imperialistische Unterjocher von [FROM.GetNameDef], der [SYR.GetNameDef] und [LEB.GetNameDef] niederhält, hat unsere Forderung abgelehnt, die Kontrolle über die Gebiete in unserem rechtmäßigen Bestreben abzutreten, die Imperialisten aus der Region zu vertreiben. Wir können uns jetzt hinlegen und ihre Herrschaft akzeptieren oder die Extrameile gehen und für unsere Vision eines vereinigten arabischen Staates kämpfen."
egypt.52.d2:0 "Der imperialistische Unterjocher von [FROM.GetNameDef], der [LBA.GetNameDef] unterdrückt, hat unsere Forderung abgelehnt, die Kontrolle über die Gebiete in unserem rechtmäßigen Bestreben, die Imperialisten aus der Region zu vertreiben, abzutreten. Wir haben jetzt die Wahl, uns zu fügen und ihre Herrschaft zu akzeptieren oder für unsere Vision eines geeinten arabischen Staates zu kämpfen."
egypt.52.d3:0 "Der imperialistische Unterjocher von [FROM.GetNameDef], der [ALG.GetNameDef] unterdrückt, hat unsere Forderung abgelehnt, die Kontrolle über die Gebiete in unserem rechtmäßigen Bestreben, die Imperialisten aus der Region zu vertreiben, abzutreten. Wir können uns jetzt hinlegen und ihre Herrschaft akzeptieren oder die Extrameile gehen und für unsere Vision eines vereinigten arabischen Staates kämpfen."
egypt.52.a:0 "Sie haben ihre Wahl getroffen."
egypt.52.b:0 "Wenn nicht durch Frieden, dann werden wir durch Krieg geeint!"
egypt.53.t:0 "[EGY.GetNameDefCap] fordert die Kontrolle über [LBA.GetNonIdeologyName]"
egypt.53.d:0 "[EGY.GetNameDefCap] hat uns ein Ultimatum gestellt: Gewähren Sie die sofortige Unabhängigkeit von [LBA.GetNameDef] und ziehen Sie alle unsere Vermögenswerte aus der Nation ab, die ausschließlich unter der Aufsicht von [EGY.GetAdjective] steht, oder riskieren Sie einen Krieg.\n\nDies steht im Einklang mit dem Wunsch von [EGY.GetLeader], seinen Einfluss auf die arabische Welt auszuweiten und sie schließlich zu vereinen, aber wollen wir wirklich einen Krieg um diese Gebiete riskieren?"
egypt.53.a:0 "Wir sind nicht in der Lage, dies zu verteidigen."
egypt.53.b:0 "Es wäre töricht zu glauben, wir würden etwas so Wichtiges aufgeben."
egypt.54.t:0 "[EGY.GetNameDefCap] verlangt die Kontrolle über [ALG.GetNonIdeologyName]"
egypt.54.d:0 "[EGY.GetNameDefCap] hat uns ein Ultimatum gestellt: Gewähren Sie die sofortige Unabhängigkeit von [ALG.GetNameDef] und ziehen Sie alle unsere Vermögenswerte aus der Nation ab, die ausschließlich unter der Aufsicht von [EGY.GetAdjective] steht, oder riskieren Sie einen Krieg.\n\nDies steht im Einklang mit dem Wunsch von [EGY.GetLeader], seinen Einfluss auf die arabische Welt auszuweiten und sie schließlich zu vereinen, aber wollen wir wirklich einen Krieg um diese Gebiete riskieren?"
egypt.54.a:0 "Wir sind nicht in der Lage, dies zu verteidigen."
egypt.54.b:0 "Es wäre töricht zu glauben, wir würden etwas so Wichtiges aufgeben."
egypt.55.t:0 "[EGY.GetNameDefCap] schlägt die Einigung in einem vereinigten arabischen Staat vor"
egypt.55.d:0 "Heute hat uns [EGY.GetNameDefCap] einen formellen Vorschlag unterbreitet, sich zu einem einzigen arabischen Staat mit ihnen an der Spitze zu vereinigen. Er behauptet, dass die arabische Welt schon zu lange von den Imperialisten niedergehalten und durch Rivalität gespalten wurde und dass es nun an der Zeit ist, dass wir uns endlich vereinigen und einen rechtmäßig mächtigen arabischen Staat gründen, bei dessen Bildung die [ROOT.GetAdjective]s helfen können. \n\nWährend dies nach einem edlen und verlockenden Vorschlag klingt, ist zu vermuten, dass dies nur ein Mittel ist, um den Einfluss und die Macht von [EGY.GetAdjective] zu ihrem eigenen Vorteil auszuweiten."
egypt.55.a:0 "Gemeinsam sind wir stärker."
egypt.55.b:0 "Wir werden nicht noch ein weiterer Polizeistaat werden."
egypt.56.t:0 "[EGY.GetNameDefCap] bittet um materielle Hilfe"
egypt.56.d:0 "Diplomaten der [EGY.GetNameDef] sind an uns herangetreten und bitten um amerikanische materielle Hilfe zur Unterstützung der Entwicklung und Modernisierung ihrer Armeen.\n\nWährend wir 1922 nach unserer Unabhängigkeit offiziell Beziehungen zu ihnen aufgenommen haben, wäre dies das erste Mal, dass unsere Nationen eine größere diplomatische Beziehung oder ein Abkommen miteinander haben, und dies könnte eine ausgezeichnete Gelegenheit sein, sowohl ein befreundetes Land im Nahen Osten zu etablieren als auch unsere Interessen in der Region zu unterstützen."
egypt.56.a:0 "Dies wird eine große Chance sein, unsere Beziehungen zu verbessern."
egypt.56.b:0 "Wir haben kein Interesse an [EGY.GetNameDef]."
egypt.57.t:0 "[USA.GetNameDefCap] stimmt zu, unsere materielle Hilfe einzustellen"
egypt.57.d:0 "Unsere Delegation bei [USA.GetNameDef] hat sich mit deren Vertretern darauf geeinigt, uns ein materielles Hilfspaket mit Infanterieausrüstung und Artillerie zukommen zu lassen, um die Entwicklung und Modernisierung unserer Armee zu unterstützen, wir sollten die Ausrüstung bald erwarten."
egypt.57.a:0 "Der Beginn einer Freundschaft."
egypt.58.t:0 "[USA.GetNameDefCap] lehnt unsere Bitte um materielle Hilfe ab"
egypt.58.d:0 "Unsere Delegation in [USA.GetNameDef] hat es nicht geschafft, eine Einigung mit ihren Diplomaten zu erzielen und hat unsere Bitte um materielle Hilfe für die Entwicklung und Modernisierung unserer Armee abgelehnt, wir werden nichts erhalten."
egypt.58.a:0 "Ihr Verlust."
egypt.59.t:0 "Politische Fraktionen untergraben [EGY.GetLeader]'s' Macht"
egypt.59.d:0 "Das Volk und die Regierung von [EGY.GetAdjective] zweifeln zutiefst an der Führungsfähigkeit von [EGY.GetLeader] nach wiederholten Misserfolgen in der Verwaltung und im Management. Mehr denn je gibt es eine beträchtliche Anzahl von Politikern und Armeeoffizieren, die seine Macht beschneiden oder ihn ganz stürzen wollen. \n\nDie Wafd-Partei, die seit langem zu Zeiten der Monarchie an der Macht ist, unterstützt die Idee, Farouks Macht auf die einer konstitutionellen Monarchie zu reduzieren und sich selbst zur stärksten Partei in [EGY.GetNameDef] zu machen, während prominente Armeeangehörige wie Gamal Abdel Nasser und Mohammed Naguib seinen Sturz und die Gründung einer arabischen Republik fordern, um die Tage des ausländischen Imperialismus hinter sich zu lassen.\n\nSollte nicht bald eine Lösung gefunden werden, könnte die Situation außer Kontrolle geraten."
egypt.59.a:0 "Farouks Position ist angeschlagen."
egypt.60.t:0 "[EGY.GetNameDefCap] schickt uns eine diplomatische Mission"
egypt.60.d:0 "Heute hat uns [EGY.GetNameDef] eine diplomatische Mission mit ihren Botschaftern geschickt, in der Hoffnung, unsere diplomatischen Beziehungen auszubauen und eine Freundschaft und mögliche zukünftige Zusammenarbeit in naher Zukunft zu etablieren.\n\nDies wäre die erste größere diplomatische Beziehung, die wir mit [EGY.GetNameDef] seit ihrer Unabhängigkeit im Jahr 1922 haben, und dies könnte eine ausgezeichnete Gelegenheit sein, sowohl ein befreundetes Land im Nahen Osten zu etablieren als auch unsere Interessen in der Region zu unterstützen."
egypt.60.a:0 "Schicken Sie den [EGY.GetAdjective] einige Panzer als Zeichen der Freundschaft."
egypt.60.b:0 "Sie sind für uns nicht von Bedeutung."
egypt.61.t:0 "[SOV.GetNameDefCap] antwortet positiv auf unsere diplomatische Mission"
egypt.61.d:0 "Unsere diplomatische Mission bei [SOV.GetNameDef] wurde mit Akzeptanz und Zustimmung begrüßt, und sie scheinen ebenso wie wir daran interessiert zu sein, freundschaftliche Beziehungen zu knüpfen und weiter zusammenzuarbeiten.\n\n Außerdem haben sie uns angeboten, uns 100 ihrer besten mittleren Panzer als großzügiges Freundschaftsgeschenk zu schicken, das bald eintreffen sollte."
egypt.61.a:0 "Ein großzügiges Geschenk von unseren neuen Freunden."
egypt.62.t:0 "[SOV.GetNameDefCap] weist unsere diplomatische Mission zurück"
egypt.62.d:0 "[SOV.GetNameDefCap], offensichtlich nicht an unserer Delegation interessiert, hat unsere diplomatische Mission abgewiesen und scheint kein Interesse an der Aufnahme diplomatischer Beziehungen oder einer weiteren Zusammenarbeit zu haben.\n\nDamit wurde möglicherweise die einzige Gelegenheit zur Aufnahme solcher Beziehungen vertan."
egypt.62.a:0 "Es war ein törichtes Unterfangen."
egypt.63.t:0 "[EGY.GetNameDefCap] schickt uns materielle Hilfe"
egypt.63.d:0 "Heute hat [EGY.GetNameDefCap] angekündigt, dass sie beabsichtigen, unsere Unabhängigkeit zu schützen und uns bedingungslose Unterstützung anbieten, um jegliche ausländische Bedrohung abzuwehren, die sich uns stellen könnte. Sie haben auch angekündigt, dass sie uns eine große Summe an Ausrüstung als 'Modernisierungspaket' schicken werden, um die Entwicklung unserer Armee zu unterstützen.\n\nWährend dies ein großzügiger und willkommener Beweis der Unterstützung ist, könnte es eher dazu dienen, die Interessen von [EGY.GetAdjective] zu schützen als uns selbst."
egypt.63.a:0 "Wie großzügig von den [EGY.GetAdjective]."
egypt.64.t:0 "[EGY.GetNameDefCap] bittet die Berater"
egypt.64.d:0 "[EGY.GetNameDefCap] ist heute an uns herangetreten und hat uns offiziell gebeten, Offiziere unserer Armee als Attaché in ihre Armee zu entsenden, um sie bei ihren Modernisierungsbemühungen, bei der Ausbildung und in taktischen Fragen zu beraten. Dies könnte eine Gelegenheit sein, freundschaftliche Beziehungen zu [EGY.GetNameDef] aufzubauen und sie in unseren Einflussbereich zu bringen."
egypt.64.a:0 "Das ist eine Chance für uns."
egypt.64.b:0 "Wir sind nicht an den [EGY.GetAdjective] interessiert."
egypt.65.t:0 "[GER.GetNameDefCap] ist damit einverstanden, uns Berater zu schicken."
egypt.65.d:0 "[GER.GetNameDefCap] hat sich bereit erklärt, uns eine Militärmission zu schicken, um unsere Armee zu beraten und sie bei der Modernisierung und Umstellung zu unterstützen. Die [GER.GetAdjective] haben den Infanterieoffizier Wilhelm Fahrmbacher als Leiter dieser Mission entsandt, der in Kürze bei uns eintreffen und einsatzbereit sein wird."
egypt.65.a:0 "Wunderbar."
egypt.66.t:0 "[GER.GetNameDefCap] weigert sich, uns Berater zu schicken"
egypt.66.d:0 "[GER.GetNameDefCap] hat sich geweigert, eine militärische Mission zu uns zu schicken, um unsere Armee zu beraten und ihre Modernisierung und Umstellung zu unterstützen. Es ist unwahrscheinlich, dass wir in Zukunft weitere Zusammenarbeit von [GER.GetNameDef] erwarten können."
egypt.66.a:0 "Wir sind nur Spielfiguren für die [GER.GetAdjective]."
