EGY_sudanese_agitation:0 "[SUD.getAdjective] Aufruhr"
EGY_sudanese_agitation_desc:0 "Die wachsende [SUD.GetAdjective] Unzufriedenheit hat dazu geführt, dass mehr Menschen den Besatzern offen feindlich gegenüberstehen und bereit sind, gewaltsamere Schritte zu unternehmen, um [SUD.GetAdjective] Unabhängigkeit zu erreichen.\n\n§Yutzen Sie Entscheidungen und Schwerpunkte, um [SUD.GetAdjective] Separatismus anzugehen.§!"
