EGY_high_compliance_reminder:0 "§Asollte die Compliance hoch genug werden, wird eine Entscheidung zur Integration dieses Staates in einen Kern zur Verfügung stehen.§!"
EGY_exert_royal_influence_description:0 "Da der königliche Einfluss in den letzten Jahren in [SUD.GetAdjective] Staaten geschwunden ist, werden wir Propagandakampagnen durchführen, um die Menschen in dieser Region daran zu erinnern, wem gegenüber sie loyal sind."
