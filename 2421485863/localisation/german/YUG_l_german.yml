YUG_proclaim_greater_yugoslavia:0	"Großjugoslawien ausrufen"
YUG_proclaim_greater_yugoslavia_desc:0	"Da ein Großteil unseres rechtmäßigen Landes unter der Herrschaft Belgrads steht, ist es an der Zeit, die Gründung eines Großjugoslawien auszurufen! Alle historischen Unterdrücker unseres Volkes sollen angesichts unserer Errungenschaften erzittern!"
YUG_press_bulgarian_claims_on_thrace:0	"Bulgarische Ansprüche auf Thrakien durchsetzen"
YUG_press_bulgarian_claims_on_thrace_desc:1	"Einige Teile Mazedoniens sowie Dobrudscha liegen noch immer außerhalb unserer Grenzen. Da alle Bulgaren Slawen sind, gehören sie zu unserer Nation."
YUG_subjugate_albania:0	"Albanien unterwerfen"
YUG_subjugate_albania_desc:0	"Es gibt bereits eine große Anzahl von Albanern, die unter unserer Zeta-Banovina leben, und auch Albanien selbst soll in die Banovina eingegliedert werden."
YUG_proclaim_greater_yugoslavia_tt:0	"Wir werden bekannt sein als §YGroßjugoslawien§!"
YUG_bulgarian_cores_tt:0	"Gewinnt Kerngebiete auf allen Startfeldern §YBulgarien§! Kerngebiete."
YUG_albanian_claims_tt:0	"Erlangt Anspruch auf alle Startstaaten §YAlbanien§!."
yugoslavia.29.t:0	"Die Frage von Thrakien und Mazedonien"
yugoslavia.29.d:0	"Die Gebiete Thrakien und Mazedonien sind seit langem die Heimat vieler Bulgaren. Bulgarien hat lange versucht, dies zu argumentieren, und nun sendet sein Erbe Botschaften durch seine diplomatischen Gesandten, die unmissverständlich die Übertragung von Thrakien und Mazedonien von [GRE.GetNameDef] an [YUG.GetNameDef] fordern. Wie werden wir darauf reagieren?"
yugoslavia.29.a:0	"Wir akzeptieren."
yugoslavia.29.b:0	"Wir werden Mazedonien nicht abtreten, aber den Jugoslawen als Kompromiss Thrakien anbieten."
yugoslavia.29.c:0	"Absurd! Diese ganze Frage ist Unsinn!"
yugoslavia.30.t:0	"[GRE.GetAdjective] Ablehnung"
yugoslavia.30.d:0	"[GRE.GetNameDefCap] hat unsere Bedingungen bezüglich der Gebietsabtretung von Thrakien und Mazedonien rundweg abgelehnt."
yugoslavia.30.a:0	"Das ist ein Skandal! Berufen Sie den Generalstab ein und bereiten Sie sich auf den Krieg vor!"
yugoslavia.31.t:0	"[GRE.GetNameDefCap] Akzeptiert"
yugoslavia.31.d:0	"Es ist zwar klar, dass [GRE.GetNameDef] mit unseren Forderungen bezüglich Thrakien und Mazedonien nicht einverstanden ist, dennoch haben sie die Bedingungen des Dokuments akzeptiert. "
yugoslavia.31.a:0	"Unser Volk ist wieder vereint!"
yugoslavia.32.t:0	"[GRE.GetAdjective] Gegenangebot"
yugoslavia.32.d:0	"Obwohl sie sich weigern, unsere legitimen Ansprüche auf Mazedonien anzuerkennen, haben sie uns ein Gegenangebot unterbreitet. Dieses beinhaltet die Übertragung von Thrakien in unseren Einflussbereich, und obwohl es nicht ganz unseren Vorstellungen entspricht, könnte es sich dennoch als fruchtbar für unsere Nation erweisen."
yugoslavia.32.a:0	"Wir werden die Übertragung von Thrakien akzeptieren, aber das ist noch nicht das Ende dieser Angelegenheit."
