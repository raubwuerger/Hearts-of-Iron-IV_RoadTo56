YUG_claim_bulgaria:0	"Bulgarien beanspruchen"
YUG_claim_bulgaria_desc:0	"Wir können nicht ruhen, bis alle Südslawen unter unserem Banner vereint sind. Die Bulgaren mögen sich selbst nicht als Teil unserer Nation betrachten, aber wir tun dies ganz sicher."
