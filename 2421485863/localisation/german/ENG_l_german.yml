ENG_challenge_stalinism_desc:0	"Stalins Doktrin ist Tyrannei mit einem roten Schleier!"
ENG_dont_challenge_party_line:0	"Stellen Sie die Parteilinie nicht in Frage"
ENG_dont_challenge_party_line_desc:0	"Die Partei hat immer Recht! Die Internationale wird uns zur Weltrevolution führen!"
ENG_revolutionary_scientific_congress:0	"Revolutionärer wissenschaftlicher Kongress"
ENG_revolutionary_scientific_congress_desc:0	"Die Revolution bietet die einmalige Gelegenheit, den Wissenschaftlern und Arbeitern der Welt die Möglichkeit zu geben, ihr Wissen zu teilen und die reaktionäre Wissenschaft namens Genetik auszurotten."
ENG_retake_the_african_jewel:0	"Das afrikanische Juwel zurückerobern"
ENG_retake_the_african_jewel_desc:0	"Ein unabhängiges Ägypten ist ein zu großes Risiko für unsere asiatischen und afrikanischen Interessen. Wir werden sie wieder unter unsere Kontrolle bringen."
uk_egypt_focus:0	"Entwicklung in Ägypten"
uk_egypt_focus_desc:0	"Die Ägypter stehen im Mittelpunkt unserer Interessen in Afrika und im Mittelmeerraum. Es liegt in unserem besten Interesse, dafür zu sorgen, dass sie über eigene Verteidigungskapazitäten verfügen und gleichzeitig im Falle eines künftigen Konflikts mit ihnen auf gutem Fuß zu stehen."
ENG_take_the_reactionaries_out_of_their_nest:0	"Holen Sie die Reaktionäre aus ihrem Nest"
ENG_take_the_reactionaries_out_of_their_nest_desc:0	"Holen Sie die Reaktionäre aus ihrem Nest"
