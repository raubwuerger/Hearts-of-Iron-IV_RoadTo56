british_alternate_focus:0	"British Empire Fokusbaum"
british_alternate_focus_tt:0	"§Nach Abschluss dieses Fokus wird ein weiterer Fokusbaum geladen, der alle Fokusse von Road to 56 fascist enthält. Es gibt keinen Weg zurück! Wählen Sie weise.§!"
ENG_anti_communist_commanders_exile_tt:0	"§RAristokratische Befehlshaber werden verschwinden oder ins Exil gehen.§!"
revolutionary_scientific_congress_name:0	"Revolutionärer Wissenschaftlicher Kongress"
r56_eng.1.t:0	"Nur der Faschismus kann den Frieden bewahren!"
r56_eng.1.desc:0	"Faschismus bedeutet Frieden, denn nur der Faschismus bekämpft die wahre Ursache des Krieges. Eine starke autarke Politik würde es ermöglichen, dem nicht gewinnbaren Wettbewerb um Märkte zu entkommen, der so viele Kriege verursacht hat. Deshalb sind Frieden und Imperium miteinander vereinbar. Sie gehen Hand in Hand, um die wirtschaftliche Unabhängigkeit zu sichern!"
r56_eng.1.a:0	"Wir werden den Krieg verhindern!"
r56_eng.2.t:0	"Über ausländische Kriege"
r56_eng.2.desc:0	"Briten dürfen nur für Großbritannien kämpfen! Der Anblick der Söhne Großbritanniens, die unsere Küsten verlassen, um in fremden Kriegen zu sterben, muss in Ihre Geschichtsbücher aufgenommen werden. Die Briten dürfen nur für Großbritannien und die Verteidigung des Empire kämpfen."
r56_eng.2.a:0	"Wir werden nicht an fremden Ufern sterben!"
r56_eng.3.t:0	"Britische Militärexilanten fordern Asyl"
r56_eng.3.desc:0	"Ehemalige Mitglieder des britischen Militärs, die vor den Kommunisten geflohen sind, sind eingetroffen und bitten um Asyl. Eigentlich könnten sie sicherlich stattdessen unseren Streitkräften dienen."
r56_eng.3.a:0	"Wir brauchen immer erfahrenes Personal!"
r56_eng.4.t:0	"Überlebende der königlichen Familie suchen Zuflucht in unserem Land"
r56_eng.4.desc:0	"Auf der Flucht vor den tragischen Ereignissen, die die königliche Familie dezimiert haben, haben die Überlebenden darum gebeten, sich in unserem Land niederlassen zu dürfen, in der Hoffnung, dass sie eines Tages in der Lage sein werden, die Monarchie in Großbritannien wiederherzustellen."
r56_eng.4.a:0	"Dies ist nicht Westminster, aber wir werden unser Bestes tun."
r56_eng.7.t:0	"Die Wahlen von [GetYear]"
r56_eng.7.d:0	"Seit den letzten Wahlen sind 5 Jahre vergangen, und es scheint, dass es wieder einmal an der Zeit ist, dass die Menschen in [ENG.GetNameDef] ihre Regierung wählen. In den vergangenen Jahren hat die Labour Party die Unterstützung der Konservativen für Appeasement scharf kritisiert, während die Konservative Partei ihr Handeln damit verteidigte, dass [ENG.GetNameDef] damals noch nicht bereit war, einen Krieg zu führen. Ansonsten folgen die Parteien ihren üblichen Kampagnen, wobei die sozialdemokratische Plattform der Labour-Partei mit der eher rechtsgerichteten Politik der Konservativen kollidiert.\n\nWen werden die Menschen in [ENG.GetAdjective] für geeignet halten, sie zu führen?"
r56_eng.7.a:0	"Die Konservativen wissen, was sie tun."
r56_eng.7.b:0	"Labour wird [ENG.GetNameDef] in die Zukunft führen!"
r56_eng.8.t:0	"Wahlen in Kriegszeiten?"
r56_eng.8.d:0	"5 Jahre sind seit den letzten Wahlen vergangen, und die Zeit zum Wählen ist gekommen. Doch [ENG.GetNameDef] befindet sich im Krieg gegen eine Großmacht, und viele glauben, dass die Abhaltung von Wahlen zu diesem Zeitpunkt nur dazu dienen würde, die Nation in ihrer dunkelsten Stunde zu destabilisieren.\n\nWas sollte man tun?"
r56_eng.8.a:0	"Das Volk hat ein Recht darauf, gehört zu werden."
r56_eng.8.b:0	"Das kann warten, bis wir den Sieg errungen haben."
r56_eng.9.t:0	"[ENG.GetLeader] Gewinnt [ENG.GetAdjective]Wahlen"
r56_eng.9.d.a:0	"Seit den letzten [ENG.GetAdjective] Wahlen sind 5 Jahre vergangen, und gestern ist das [ENG.GetAdjective] Volk erneut zu den Urnen gegangen, um über die Zukunft seiner Regierung zu entscheiden.\n\nNach der Auszählung der Stimmzettel scheint es, dass sich die Labour Party unter Clement Atlee die Macht gesichert hat. Sie hat versprochen, sich gegen Appeasement zu stellen und soziale Reformen in der [ENG.GetAdjective] Gesellschaft voranzutreiben.\n\nDie Zeit wird zeigen, ob sich die neue [ENG.GetAdjective] Regierung halten kann."
r56_eng.9.d.b:0	"Seit den letzten [ENG.GetAdjective] Wahlen sind 5 Jahre vergangen, und gestern sind die [ENG.GetAdjective] Menschen erneut zu den Urnen gegangen, um über die Zukunft ihrer Regierung zu entscheiden.\n\nNach der Auszählung der Stimmzettel scheint es, dass sich die Konservative Partei unter [ENG.GetLeader] die Macht gesichert hat, wobei ihre Kampagne die Fortsetzung der protektionistischen Politik und den Erhalt des Empire zum Ziel hat.\n\nTime will tell if the new [ENG.GetAdjective] government can hold on."
r56_eng.9.a:0	"Eine gute Vorstellung."
r56_eng.9.b:0	"Wird er sich von der vorherigen Regierung unterscheiden?"
r56_eng.11.t:0	"Räumt er die Regierung aus?"
r56_eng.11.d:0	"Mit dem Fall Londons durch [126.controller.GetAdjective] Truppen und der bevorstehenden Kapitulation der britischen Regierung müssen wir entscheiden, ob die Regierung und das Militär in unsere Herrschaftsgebiete evakuiert werden oder bis zum Ende weiterkämpfen."
r56_eng.11.a:0	"Sie werden leben, um einen weiteren Tag zu kämpfen."
r56_eng.11.b:0	"Wir werden zurückkehren. (Spielen Sie als Kanada)"
r56_eng.11.c:0	"Wir werden bis zum Ende kämpfen!"
r56_eng.12.t:0	"Britische Exilanten kommen in [Capital.GetCapitalVictoryPointName] an"
r56_eng.12.d:0	"Nach dem Zusammenbruch des britischen Festlandes haben sich die königliche Familie und die Exilanten der britischen Regierung in unser Land zurückgezogen, um den Kampf fortzusetzen. Doch während sich unsere verbliebenen Armeen aus Europa zurückziehen, werden die Proteste der Kriegsgegner immer lauter und bringen das Land zum Stillstand."
r56_eng.12.a:0	"Wir werden den Kampf fortsetzen!"
r56_eng.12.b:0	"Vielleicht müssen wir uns geschlagen geben."
r56_eng.13.t:0	"Zusammenbruch des britischen Festlandes"
r56_eng.13.d:0	"Nach dem Fall von London und dem Rückzug der königlichen Familie ist das Ende des Empire, wie wir es kennen, gekommen. Wir haben die Kontrolle über die benachbarten britischen Territorien übernommen und warten auf die Entscheidung von [faction_leader.GetNameDef], ob wir weiterkämpfen werden."
r56_eng.13.a:0	"Das Ende einer Ära."
r56_eng.14.t:0	"Zusammenbruch des britischen Festlandes"
r56_eng.14.d:0	"Nach dem Fall Londons und dem Rückzug der königlichen Familie ist das Ende des Empire, wie wir es kennen, gekommen. Wir haben die Kontrolle über benachbarte britische Territorien übernommen, aber die Mehrheit unserer Bevölkerung fordert, dass wir das kollabierende Empire hinter uns lassen und die Unabhängigkeit erklären."
r56_eng.14.a:0	"Wir werden bei unseren treuen Verbündeten bleiben."
r56_eng.14.b:0	"Indien ist endlich frei!"
r56_eng.15.t:0	"Zusammenbruch des britischen Festlandes"
r56_eng.15.d:0	"Nach dem Fall von London und dem Rückzug der königlichen Familie ist das Ende des Empire, wie wir es kennen, gekommen. Wir haben die Kontrolle über benachbarte britische Territorien übernommen, aber die Mehrheit unserer Bevölkerung fordert, dass wir das kollabierende Empire hinter uns lassen und die Unabhängigkeit erklären."
r56_eng.15.a:0	"Wir werden bei unseren loyalen Verbündeten bleiben."
r56_eng.15.b:0	"Wir sehen keinen Grund, diese verlorene Schlacht fortzusetzen."
r56_eng.16.t:0	"Die Einnahme von Las Malvinas?"
r56_eng.16.d:0	"Nach dem Fall Londons und dem Rückzug der königlichen Familie sind die überseeischen Gebiete des britischen Empires reif für die Übernahme. Wir könnten diese Gelegenheit nutzen, um die Inseln Malwinen und Südgeorgien zu erobern, und die Kanadier würden sich vielleicht nicht einmal wehren, aber eine solche Operation birgt das Risiko eines Vergeltungsschlags."
r56_eng.16.a:0	"Die Malwinen sind argentinisch!"
r56_eng.16.b:0	"Lassen Sie uns keinen Krieg beginnen, den wir nicht gewinnen können."
r56_eng.17.t:0	"[ARG.GetNameDefCap] Ergreift die Falklandinseln"
r56_eng.17.d:0	"In Anbetracht unserer Schwäche hat [ARG.GetLeader] eine Militäroperation gestartet, um die Kontrolle über die Falklandinseln zu übernehmen. Es könnte klug sein, keine Vergeltung zu üben, denn die jüngsten Ereignisse haben in unserem Land zu großer Instabilität geführt."
r56_eng.17.a:0	"Wir werden ihnen das Gegenteil beweisen!"
r56_eng.17.b:0	"Leider war ihre Vermutung richtig."
r56_eng.18.t:0	"Zusammenbruch des Britischen Empire"
r56_eng.18.d:0	"Mit dem Fall Londons und der unvermeidlichen Kapitulation des britischen Festlandes haben die Regierung, das Militär und die königliche Familie des Vereinigten Königreichs beschlossen, das Festland zu verlassen.\n\nObwohl der König seit [ENG_commonwealth_successor.Capital.GetCapitalVictoryPointName] erklärt hat, dass das Empire bis zur Befreiung des Festlandes weiterkämpfen wird, sehen viele dies als das Ende des Britischen Empire, wie wir es kennen."
r56_eng.18.a:0	"Die Sonne ist endlich untergegangen."
ENG_collapse_of_the_empire_tt:0	"§Die Regierung und die königliche Familie werden sich auf unser größtes Herrschaftsgebiet zurückziehen, wobei unsere überseeischen Gebiete und ein Teil unserer Armee und Marine von anderen Nationen unseres Reiches übernommen werden, die ihre Unabhängigkeit erlangen werden§!."
ENG_got_territories_from_collapse:0	"§Wir werden die Kontrolle über benachbarte Territorien des Reiches übernehmen§!."
