ENG_embrace_royal_german_heritage:0	"Umarmt das königliche [GER.GetAdjective] Erbe"
ENG_embrace_royal_german_heritage_desc:0	"Zu lange haben wir unsere königlichen Wurzeln zu [GER.GetNameDef] verleugnet. Es ist an der Zeit, dass wir die Maske fallen lassen und zum ursprünglichen und einzig wahren Namen unseres Königshauses zurückkehren."
ENG_speech_against_war:0	"Rede gegen den Krieg"
ENG_speech_against_war_desc:0	"Das Blut unserer besten Jugend wird nicht vergeblich für fremdes Gesindel vergossen werden. Großbritannien muss in Frieden bleiben, wenn es überleben soll. Unsere Stimme muss in jeder Straße zu hören sein. Wir fordern Frieden! Aber wir werden bereit sein, unseren Boden zu verteidigen und uns gegen die ausländischen Invasoren zu wehren. Denjenigen, die behaupten, dass wir Unruhe stiften und Kriege anzetteln wollen, antworten wir mit einer einhelligen Stimme: Großbritannien lebt und marschiert weiter, in Frieden!"
