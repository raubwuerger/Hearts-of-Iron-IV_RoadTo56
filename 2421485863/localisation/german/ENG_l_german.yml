ENG_liberate_the_american_workers:0	"Befreit die amerikanischen Arbeiter"
ENG_welcome_british_exiles:0	"Britische Exilanten willkommen heißen"
ENG_welcome_british_exiles_desc:0	"Sie sind von den Ereignissen, die Großbritannien erschüttern, am Boden zerstört und haben oft alles verloren, aber sie haben nie ihr Talent verloren..."
ENG_recruit_volunteers:0	"Rekrutieren Sie Freiwillige"
ENG_recruit_volunteers_desc:0	"Der Zustrom britischer Flüchtlinge brachte viele Menschen hervor, die bereit waren, für die Rückeroberung des Landes ihrer Kindheit zu kämpfen, anstatt in Übersee zu leben."
ENG_british_agents:0	"Britische Agenten"
ENG_british_agents_desc:0	"Einige dieser Flüchtlinge könnten kompetente Geheimagenten werden."
ENG_landing_exercices:0	"Landeübungen"
ENG_landing_exercices_desc:0	"Eine Invasion durch die Weiten des Meeres ist keine leichte Aufgabe und wir müssen sicher sein, dass wir technologisch, logistisch und moralisch für dieses Unterfangen gerüstet sind."
ENG_reclaim_the_british_isles_exile:0	"Rückeroberung der [ENG.GetAdjective]-Inseln"
ENG_reclaim_the_british_isles_exile_desc:0	"Revolutionäre haben die Monarchie und das Parlament entweiht und Tyrannei und Elend über das [ENG.GetAdjective] Volk gebracht. Als Mitglied des Commonwealth ist es unsere Pflicht, für die Wiederherstellung von Großbritannien zu kämpfen. Man munkelt, dass der König selbst gesagt hat, er wolle sein Geburtsrecht zurückfordern."
ENG_northern_ireland_for_assistance:0	"[119.GetName] für Unterstützung"
ENG_northern_ireland_for_assistance_desc:0	"Angesichts der weltweiten Bedrohungen liegt es nicht in unserem Interesse, unseren Grenzstreit mit [IRE.GetNameDef] fortzusetzen. Vielleicht können wir den [IRE.GetAdjective] das umstrittene Gebiet anbieten, wenn sie sich im Gegenzug dazu verpflichten, uns bei unseren Bemühungen zu unterstützen."
ENG_secure_ireland:0	"Sichern Sie [IRE.GetNonIdeologyName]"
ENG_secure_ireland_desc:0	"Ein [IRE.GetNonIdeologyName], das unter feindlicher Kontrolle oder Einflussnahme steht, dient als perfekter Aufmarschplatz für Angriffe auf unsere Landgrenzen, was völlig inakzeptabel ist. Wir haben den [IRE.GetAdjective] ihre Unabhängigkeit zugestanden, könnten sie ihnen aber genauso gut wieder nehmen."
ENG_the_wartime_cabinet_committee:0	"Der Kabinettsausschuss für Kriegszeiten"
ENG_the_wartime_cabinet_committee_desc:0	"Es sind schlimme Zeiten angebrochen. Wir müssen alle notwendigen Schritte unternehmen, um sicherzustellen, dass unsere Streitkräfte so gut wie möglich organisiert und geführt werden."
ENG_evacuate_colonial_assets:0	"Evakuieren Sie die kolonialen Güter"
ENG_evacuate_colonial_assets_desc:0	"Jetzt, da unsere ehemaligen Kolonien auf dem Weg sind, ist es an der Zeit, unsere Investitionen in sie zurückzugeben."
ENG_unify_the_isles:0	"Vereinigen Sie die Inseln"
ENG_unify_the_isles_desc:0	"[ROOT.GetNonIdeologyName] soll eins sein! Direkte Herrschaft von London aus!"
ENG_elisabeth_ii:0	"Elisabeth II."
r56_eng.5.t:0	"Der Tod von Georges VI"
r56_eng.5.desc:0	"Georges VI. ist auf tragische Weise ums Leben gekommen. Er hat die Nation in tiefer Trauer zurückgelassen. Der Mann, der uns durch diese schwierigen Jahre geführt hat, wird dem britischen Volk in guter Erinnerung bleiben. Es ist nun an Prinzessin Elisabeth, die Nachfolge anzutreten und die kaiserliche Staatskrone zu tragen. Hoffen wir, dass sie die gleichen Fähigkeiten wie Elisabeth und Victoria an den Tag legen wird. Lang lebe die Königin!"
r56_eng.5.a:0	"Lang lebe die Königin"
r56_eng.6.t:0	"Die Zukunft von Neufundland in Frage gestellt"
r56_eng.6.desc:0	"Mit der Wiederaufnahme der wirtschaftlichen Aktivitäten in [NFL.GetNonIdeologyName] ist die Frage nach der Zukunft Neufundlands wieder in den Vordergrund gerückt. In den frühen 1930er Jahren wurde das Land von der großen Depression hart getroffen und forderte im Gegenzug für eine finanzielle Entlastung die Rückkehr zur direkten britischen Herrschaft. Dieses Ereignis beendete die Ära, die gemeinhin als 'verantwortliche Regierung' bekannt ist. Diese Debatte, die durch die Kriegsjahre unterbrochen wurde, lebt nun wieder auf. Das Gebiet steht nun am Scheideweg, denn es könnte entweder ein eigenes Dominion werden oder mit Kanada föderiert werden, was in der Praxis nur dem Namen nach eine Annexion bedeuten würde."
r56_eng.6.a:0	"Das Territorium sollte von Kanada verwaltet werden"
r56_eng.6.b:0	"Wiederherstellung des [NFL.getAdjective] Dominion"
r56_eng.10.t:0	"Gilbert Stephenson"
r56_eng.10.d:0	"Als Gilbert Stephenson 1929 als Konteradmiral aus der Royal Navy ausschied, war er einer ihrer besten Experten für die U-Boot-Bekämpfung. Als der Krieg wieder ausbrach, wurde er zurück in den Dienst gerufen. Trotz seines hohen Alters (er wurde 1878 geboren) blieb er fit, gesund und tatkräftig und war in der Lage, seinen scharfen Verstand auf alles anzuwenden, was die Admiralität ihm auftrug.\n\nHistorisch gesehen war sein wichtigster Beitrag die Leitung der Eskorten-Aufbereitungsanlage in Tobermory (die Tobermory Bay ist unten mit Stephenson abgebildet), wo er und sein Team 911 Schiffe durch 1.132 Trainingskurse führten. Er spielte auch eine Rolle bei der Koordinierung der Evakuierung von Dünkirchen im Jahr 1940 und war schon sehr früh im Krieg als Kommodore auf einer Reihe von Konvois im Einsatz.\n\nTobermory spielte unter Stephensons Leitung eine wichtige Rolle in der Atlantikschlacht, da er die Eskorten schnell und mit einer effektiven Ausbildung in See stechen ließ. Stephensons innovative, aber herausfordernde Techniken beeinflussten die Aufarbeitungsverfahren der Royal Navy in der Nachkriegszeit und brachten ihm auch den Spitznamen 'Der Schrecken von Tobermory' ein."
r56_eng.10.a:0	"Bringen Sie Stephenson dazu, Tobermory zu gründen"
r56_eng.10.b:0	"Geben Sie Stephenson ein Kommando auf See"
ENG_for_the_good_of_the_revolution_idea:1	"Für das Wohl der Revolution"
ENG_for_the_good_of_the_revolution_idea_desc:1	"Alle müssen bereit sein, für das Wohl des Staates Opfer in Sachen Komfort zu bringen. Das [ROOT.getAdjective] Volk wird angesichts der Rationierung den Kopf hochhalten, denn es ist zuversichtlich, dass dies unseren letztendlichen Sieg sichern wird."
newsmod.3.t:0	"Deutschland nimmt das Britische Empire in die Achse auf"
newsmod.3.d:0	"Im vergangenen Jahr explodierten in Großbritannien ultranationalistische faschistische Bewegungen. Die demokratische Lebensweise ist zu einer Minderheit geworden, während die Nation den Faschismus umarmt. Mehr noch - die Briten haben sich entschlossen, ein Bündnis mit Hitler und dem Deutschen Reich einzugehen, was die Stabilität Europas bedroht. Auch die Dominions wurden gezwungen, sich der Achse anzuschließen, aber sie zögern und halten die Zeit für gekommen, sich von Großbritannien zu distanzieren...."
newsmod.3.a:0	"Ein wahrer Wendepunkt in unserer Geschichte!"
newsmod.3.b:0	"Wir heißen unsere britischen Freunde willkommen!"
newsmod.3.c:0	"Wir sind damit nicht einverstanden!"
newsmod.3.e:0	"Besorgniserregend. englandmod.1.t:0 England Asks To Join Axis"
englandmod.1.d:0	"Ein Vertreter von [ENG.GetName] ist soeben eingetroffen. [ENG.GetName] hat kürzlich eine starke ultranationalistische Bewegung erlebt und möchte sich dem Reich und der Achse anschließen, um die Zukunft der Welt zu lenken."
englandmod.1.a:0	"Akzeptieren Sie"
englandmod.1.b:0	"Ablehnen."
englandmod.5.t:0	"Die Briten fordern unsere Annexion"
englandmod.5.d:0	"Ein britischer Delegierter ist heute Morgen in Dublin eingetroffen. Die Auswirkungen der ultranationalistischen Bewegung in Großbritannien sind nun endlich auch bei uns angekommen, denn London fordert unsere sofortige Annexion. Wir wissen nicht, ob die Franzosen oder die Amerikaner sich für uns einsetzen werden und müssen eine schwere Entscheidung treffen."
englandmod.5.a:0	"Geben Sie ihren Forderungen nach."
englandmod.5.b:0	"Die Chance ist gering."
englandmod.6.t:0	"Irland gibt nach!"
englandmod.6.d:0	"Unser Delegierter aus Dublin ist mit fantastischen Neuigkeiten eingetroffen! Die schwachen Iren haben beschlossen, unsere Forderung nach einer sofortigen Annexion zu akzeptieren. Wir können nun zur nächsten Phase unseres Plans übergehen."
englandmod.6.a:0	"Sie haben eine kluge Entscheidung getroffen."
englandmod.7.t:0	"Irland lehnt unsere Forderungen ab!"
englandmod.7.d:0	"In einem erbärmlichen, letzten Versuch der Tapferkeit hat die törichte irische Regierung unsere Forderung nach einer Annexion abgelehnt. Mehr noch, sie hat beschlossen, ihre Streitkräfte für den Fall eines britischen Angriffs zu mobilisieren."
englandmod.7.a:0	"Sind sie selbstmörderisch?"
englandmod.8.t:0	"Die Briten schlagen ein Bündnis vor"
englandmod.8.d:0	"Heute Morgen ist ein britischer Delegierter in Lissabon eingetroffen. Als wäre es nicht schon klar genug, dass sie sich in die spanische Politik einmischen, versuchen sie nun auch noch, unsere Politik zu beeinflussen und bieten uns ein Bündnis an."
englandmod.8.a:0	"Wir nehmen an!"
englandmod.8.b:0	"Wir werden uns nicht daran beteiligen."
englandmod.9.t:0	"Portugal nimmt an!"
englandmod.9.d:0	"Portugal hat unser Bündnisangebot angenommen! Wieder einmal stehen die Portugiesen und die Briten Seite an Seite gegen ihre Widersacher!"
englandmod.9.a:0	"Hurra!"
englandmod.10.t:0	"Portugal lehnt ab!"
englandmod.10.d:0	"Portugal hat unser Bündnisangebot abgelehnt! Sie haben bewiesen, dass sie für uns nutzlos sind!"
englandmod.10.a:0	"Wenn Sie nicht für uns sind, sind Sie gegen uns."
englandmod.11.t:0	"Die Briten schlagen ein Bündnis vor"
englandmod.11.d:0	"Ein britischer Delegierter ist heute Morgen in Rom eingetroffen. Die Briten beginnen, ihre Bemühungen im Mittelmeerraum zu konzentrieren und möchten eine Allianz vorschlagen. Wir wollen sie zwar nicht verärgern, aber wenn wir einer Allianz zustimmen, könnte das einige unserer Ansprüche untergraben..."
englandmod.11.a:0	"Wir nehmen an!"
englandmod.11.b:0	"Auf keinen Fall."
englandmod.12.t:0	"Italien nimmt an!"
englandmod.12.d:0	"Italien hat unser Bündnisangebot angenommen! Gemeinsam werden wir die Hegemonie teilen!"
englandmod.12.a:0	"Hurra!"
englandmod.13.t:0	"Italien lehnt ab!"
englandmod.13.d:0	"Italien hat unser Bündnisangebot abgelehnt! Sie haben bewiesen, dass sie für uns nutzlos sind!"
englandmod.13.a:0	"Wenn Sie nicht für uns sind, sind Sie gegen uns."
englandmod.14.t:0	"Die Briten schlagen ein Bündnis vor"
englandmod.14.d:0	"Ein britischer Delegierter ist heute Morgen in Warschau eingetroffen. Die Briten erwarten, dass die Deutschen irgendwann einem ihrer Nachbarn den Krieg erklären werden, und sie gehen davon aus, dass das wir sein werden. Sie schlagen ein Bündnis vor, um die Deutschen von einem Angriff abzuhalten, aber wir haben auch das Gefühl, dass sie uns auf einen dunklen Pfad führen werden...."
englandmod.14.a:0	"Wir nehmen an!"
englandmod.14.b:0	"Das geht nicht."
englandmod.15.t:0	"Polen nimmt an!"
englandmod.15.d:0	"Polen hat unser Bündnisangebot angenommen! Gemeinsam werden wir die Deutschen besiegen!"
englandmod.15.a:0	"Hurra!"
englandmod.16.t:0	"Polen lehnt ab!"
englandmod.16.d:0	"Polen hat unser Bündnisangebot abgelehnt! Sie haben bewiesen, dass sie für uns nutzlos sind!"
englandmod.16.a:0	"Wenn Sie nicht für uns sind, sind Sie gegen uns."
englandmod.17.t:0	"Britisches Bündnisangebot"
englandmod.17.d:0	"Gestern ist ein britischer Delegierter in Tokio eingetroffen. Offenbar sind die Briten der Meinung, dass eine Erneuerung des japanisch-angloamerikanischen Bündnisses beiden Ländern gut tun würde. Könnte es sein, dass sie auch einen Krieg mit den Vereinigten Staaten in Betracht ziehen?"
englandmod.17.a:0	"Wir sind mit der Erneuerung des Bündnisses einverstanden."
englandmod.17.b:0	"Wir brauchen sie nicht."
englandmod.18.t:0	"Die Japaner sind einverstanden!"
englandmod.18.d:0	"Gute Nachrichten! Japan hat unser Bündnisangebot angenommen! Mit unserer vereinten Kraft werden die Amerikaner sicher fallen!"
englandmod.18.a:0	"Hurra!"
englandmod.19.t:0	"Die Japaner lehnen ab!"
englandmod.19.d:0	"Schlechte Nachrichten! Japan hat unser Bündnisangebot abgelehnt. Ist ihnen nicht klar, dass der schlafende Riese bald erwachen wird?"
englandmod.19.a:0	"Es ist ihr Begräbnis."
englandmod.20.t:0	"Britisches Bündnisangebot"
englandmod.20.d:0	"Gestern traf ein britischer Delegierter in Caracas ein. Offenbar sind die Briten der Meinung, dass ein Militärbündnis zwischen unseren beiden Nationen für beide Seiten von Vorteil wäre. Könnte es sein, dass sie auch einen Krieg mit den Vereinigten Staaten in Betracht ziehen?"
englandmod.20.a:0	"Wir sind bereit, uns anzuschließen!"
englandmod.20.b:0	"Nein danke"
englandmod.21.t:0	"Venezuela nimmt an!"
englandmod.21.d:0	"Gute Nachrichten! Venezuela hat unser Bündnisangebot angenommen! Es wird sich als nützliche Basis erweisen, von der aus wir die westliche Hemisphäre angreifen können."
englandmod.21.a:0	"Hurra!"
englandmod.22.t:0	"Venezuela lehnt ab!"
englandmod.22.d:0	"Schlechte Nachrichten! Venezuela hat unser Bündnisangebot abgelehnt. Begreifen sie nicht, dass der schlafende Riese bald erwachen wird?"
englandmod.22.a:0	"Was auch immer"
englandmod.23.t:0	"Der Status des englischen Faschismus"
englandmod.23.d:0	"Auch wenn unsere ehemaligen englischen Oberherren versucht haben, unserem Land den Faschismus aufzuzwingen, müssen wir eine solche Einmischung nicht mehr dulden. Sollten wir uns des faschistischen Einflusses entledigen, den die Briten in unser Land gebracht haben?"
englandmod.23.a:0	"Ja, es ist an der Zeit, diese dumme Ideologie loszuwerden."
englandmod.23.b:0	"Nein danke, ich mag den Faschismus lieber."
