 ################### EVENTS ################### ""

men.10.t:0	"Das Zhangbei-Treffen"
men.10.d:0	"Während die Angst unter den Eliten steigt und die Japaner langsam eindringen, haben sich Schlüsselfiguren des mongolischen autonomen politischen Komitees und der Kuomintang, Nima-odsor, Ünenbayan, Serengdongrub und Demchugdongrub, in Zhangbei versammelt, um sich mit dem einflussreichen Jodbajab zu treffen. Die Spannungen waren groß, als sie die jüngsten Entwicklungen in der Nordprovinz Chahar besprachen. Mandschurische Truppen unter dem Kommando von Li Shouxin waren in die sechs durch das Qin-Doihara-Abkommen entmilitarisierten Bezirke eingedrungen und hatten den zerbrechlichen Frieden in der Region gestört.\n\nJodbajab enthüllte seine Antwort: eine Stationierung von Kavalleriepolizei, um die verwundbaren nördlichen Grenzen von Chahar zu schützen. Da die Japaner jedoch immer weiter nach Nordchina und Mandschukuo vordrangen, um ihren Einfluss auszuweiten, herrschte bei dem Treffen ein Gefühl der wachsenden Unsicherheit. Jeder der Staats- und Regierungschefs wusste, dass dieser jüngste Bruch der Beginn von etwas viel Größerem sein könnte, das die Fraktionen und Mächte der Region in einen unausweichlichen Konflikt hineinziehen könnte...\n\nAm Ende des Treffens bereiten sich alle Vertreter auf ihre Abreise vor, doch es ist unklar, was sie erwartet, da sie vielleicht nie wieder zurückkommen werden."
men.10.a:0	"Beenden Sie das Treffen, morgen ist ein neuer Tag."
men.10.b:0	"Bleiben Sie wachsam, der Feind lauert in den Schatten..."

men.11.t:0	"Nima-Odsor ermordet"
men.11.d:0	"Eine Tragödie hat die zerbrechliche Clique in der Inneren Mongolei heimgesucht: Nima-Odsor, ein Pro-Kuomintang-Nationalist und eine der Schlüsselfiguren, die für die mongolische Autonomie und den Widerstand gegen die Japaner eintraten, wurde ermordet. Augenzeugenberichten zufolge haben die Japaner diese brutale Tat inszeniert, um die Führung der Region zu schwächen und jeglichen vereinten Widerstand gegen ihren wachsenden Einfluss zu brechen. Der Tod von Nima-odsor löst eine Welle des Schocks und der Angst in der Bewegung aus. Verbündete fragen sich, wer als Nächstes ins Visier genommen werden könnte, während andere sich fragen, ob der Traum von einer unabhängigen und geeinten Mongolei in weite Ferne rückt. In diesen unsicheren Zeiten stehen viele vor einer schweren Entscheidung: Entweder sie stärken ihre Entschlossenheit und wehren sich gegen ausländische Einmischung oder sie riskieren, zum Werkzeug eines fremden Imperiums zu werden."
men.11.a:0	"Fliegen Sie nicht zu nah an die rote Sonne..."

men.12.t:0	"Der Kälgän-Zwischenfall"
men.12.d:0	"Als das Treffen in Zhangbei beendet war, machte sich Nima-odsor auf den Rückweg nach Kälgän, um seine Regierungsgeschäfte wieder aufzunehmen. Um 8:45 Uhr bestieg er einen Bus nach Kälgän, begleitet von zwei Wachen des lokalen Sicherheitskorps. Die Fahrt wurde jedoch abrupt unterbrochen, als zwei japanische Offiziere den Bus anhielten und Einlass verlangten. Innerhalb weniger Sekunden kam es zu einer Schießerei zwischen den mongolischen Wächtern und den japanischen Offizieren. Einem der mongolischen Wächter gelang es, einen der Japaner zu verletzen, so dass diese sich zurückziehen und fliehen mussten. Es gibt bereits Gerüchte, dass es sich um ein Attentat auf Nima-odsor, einen glühenden Patrioten und antijapanischen Provokateur, gehandelt haben könnte, doch glücklicherweise konnte er den Schauplatz unversehrt verlassen."
men.12.a:0	"Eine unerwartete Wendung der Ereignisse..."

men.13.t:0	"Die Nachwirkungen des langen Winters"
men.13.d:0	"Der Winter 1936 war eine Zeit beispiellosen Leids, eine unerbittliche Belagerung durch Eis und Schnee, die die Innere Mongolei und unser Volk in die Knie zwang. Fast drei Monate lang sanken die Temperaturen auf unter -30°C und brachten das tägliche Leben zum Erliegen. Unserem Volk, das ohnehin schon mit Entbehrungen belastet war, drohte der Hungertod, da das Vieh verendete und die Weiden unfruchtbar wurden. Viele Dörfer, die durch dicke Schneewehen isoliert sind, sind nach wie vor von lebenswichtigen Ressourcen abgeschnitten, und die Wirtschaft unseres Landes zittert am Rande des Zusammenbruchs.\n\n Jetzt, wo der Frost zu tauen beginnt, wird der Tribut dieser Tortur deutlich. Ganze Gemeinden sind destabilisiert, die Autorität unserer Führer ist geschwächt, und die Menschen haben Angst vor dem, was vor ihnen liegt. Viele fordern jetzt einen klaren und entschlossenen Wiederaufbauplan, um ihr Überleben in den kommenden Monaten zu sichern. Einige drängen darauf, dass wir uns nach innen wenden und unsere eigenen Ressourcen und Arbeitskräfte stärken, während andere glauben, dass wir Hilfe von ausländischen Mächten suchen müssen, um eine Zukunft zu sichern. In einem Punkt sind sich jedoch alle einig: Wenn die Innere Mongolei überleben soll, müssen wir schnell handeln, um unsere zerbrochene Nation wieder aufzubauen!"
men.13.a:0	"Wir werden diesen Sturm gemeinsam überstehen!"

men.14.t:0	"Das Gambit der Inneren Mongolei"
men.14.d:0	"Während die Kwantung-Armee den Norden Chinas fester im Griff hat, wächst die Unruhe unter den Eliten der Inneren Mongolei. Schlüsselfiguren des Autonomen Politischen Komitees der Mongolei, der Kuomintang und die lokalen Führer Nima-odsor, Ünenbayan, Serengdongrub und Fürst Demchugdongrub werden in nicht weniger als zwei Wochen in Zhangbei zusammenkommen, um mit dem einflussreichen Jodbajab über ihr weiteres Vorgehen zu beraten. Der jüngste Einfall mandschurischer Truppen unter Li Shouxin in die entmilitarisierten Bezirke der Provinz Chahar, der gegen das Qin-Doihara-Abkommen verstößt, hat den ohnehin brüchigen Frieden in der Region erschüttert.\n\nUnter den Stimmen des Widerspruchs hat sich Nima-odsor, ein prominenter mongolischer Nationalist und enger Verbündeter von Chiang Kai-shek, als führender Gegner japanischer Interessen in der Inneren Mongolei hervorgetan. Nima-odsors Einfluss wächst und schürt eine antijapanische Stimmung, die unsere Pläne durchkreuzen könnte. Die Kwantung-Armee hat eine verdeckte Operation ausgearbeitet, um ihn zum Schweigen zu bringen, und alles, was noch fehlt, ist ein endgültiger Befehl zum Handeln.\n\nWerden wir entschlossen handeln, um Japans Kontrolle über die Innere Mongolei zu sichern, oder werden wir es zulassen, dass Nima-odsor seine Anhänger um sich schart und die Kluft zwischen den mongolischen Eliten und unseren Streitkräften vertieft?"
men.14.a:0	"Den Kaiser zu verärgern, ist ein sehr törichter Zug!"
men.14.b:0	"Japans Interessen liegen woanders..."

men.15.t:0	"Nima-Odsor ermordet"
men.15.d:0	"Nima-Odsor, ein mongolischer Nationalist, der für die Kuomintang eintritt und eine der Schlüsselfiguren für die mongolische Autonomie und den Widerstand gegen die Japaner ist, wurde erfolgreich ermordet. Dem Oberkommando von Kwantung wurde berichtet, dass zwei Soldaten einen Bus anhielten und bestiegen, in dem Nima-odsor unterwegs war, in der Hoffnung, nach Kälgän zurückzukehren und dort seinen Dienst wieder aufzunehmen, und ihn zweimal erschossen. Nima-odsors Tod löst eine Welle des Schocks und der Angst in der Region aus, und das ist genau der Effekt, den die Kwantung erwartet hat. Die Eliten der Inneren Mongolei fragen sich nun, wer als nächstes ins Visier genommen werden könnte, während andere sich fragen, ob der Traum von einer unabhängigen und geeinten Mongolei ins Wanken gerät. Vielleicht wird ihnen endlich klar, dass sie nur durch unverbrüchliche Loyalität zu [JAP.Capital.GetCapitalVictoryPointName] ihren Kopf behalten können..."
men.15.a:0	"Fliegen Sie nicht zu nah an die rote Sonne..."

men.16.t:0	"Der Kälgän-Zwischenfall"
men.16.d:0	"Als das Treffen in Zhangbei beendet war, machte sich Nima-odsor auf den Rückweg nach Kälgän, um seine Regierungsgeschäfte wieder aufzunehmen. Um 8:45 Uhr bestieg er einen Bus nach Kälgän, begleitet von zwei Wachen des lokalen Sicherheitskorps. Die Fahrt wurde jedoch abrupt unterbrochen, als zwei japanische Offiziere, die Nima-odsor auf Befehl der Kwantung ermorden sollten, den Bus anhielten und Einlass verlangten. Innerhalb weniger Sekunden kam es zu einer Schießerei zwischen den mongolischen Wachen und den japanischen Offizieren. Einem der mongolischen Wächter gelang es, einen der Japaner zu verletzen, so dass diese sich zurückziehen und fliehen mussten. Es gibt bereits Gerüchte über unsere Beteiligung an einem Attentat auf Nima-odsor, einen glühenden Patrioten und antijapanischen Provokateur, das höchstwahrscheinlich ein Anschlag war. Leider hat er den Tatort unversehrt verlassen."
men.16.a:0	"Verdammt seien diese inkompetenten Bastarde!"
men.16.b:0	"Wir haben es auf die leichte Tour versucht, jetzt ist es Zeit für die harte Tour..."

men.17.t:0	"[MEN.GetNameDefCap] bittet um Kontrolle über [621.GetName] und [746.GetName]"
men.17.d:0	"Ein Ersuchen der [MEN.GetAdjective]-Regierung soll heute bei den [ROOT.GetAdjecitve]-Behörden in [MEN.Capital.GetCapitalVictoryPointName] eingegangen sein und anschließend nach [ROOT.Capital.GetCapitalVictoryPointName] telegrammiert worden sein. Dieses Ersuchen beinhaltet die anschließende Übergabe der Kontrolle über die nördlichen Regionen von [621.GetName] und [746.GetName], zwei sehr wohlhabende und wirtschaftlich vitale Provinzen, von denen unsere Wirtschaft sehr profitiert hat. Es ist unklar, ob diese ‚Bitte‘ in ein Ultimatum umschlagen könnte, wonach [MEN.GetAdjective] selbst in diese Regionen einmarschieren und sie besetzen würde, wenn sie keine Antwort von uns erhält... Die Frage ist also, wie wir mit der Anfrage umgehen sollen."
men.17.a:0	"Vorsichtshalber müssen wir sie akzeptieren..."
men.17.b:0	"Warum sollten wir einen Haufen von Narren unterhalten!"

men.18.t:0	"[FROM.GetNameDefCap] Nimmt an"
men.18.d:0	"Eine Anfrage der [MEN.GetAdjective]-Regierung wurde vor einigen Tagen von den [FROM.GetAdjecitve]-Behörden in [MEN.Capital.GetCapitalVictoryPointName] entgegengenommen und anschließend nach [FROM.Capital.GetCapitalVictoryPointName] telegrammiert. Nach reiflicher Überlegung haben die [FROM.GetAdjecitve] Behörden schließlich beschlossen, dass es das Beste ist, die Kontrolle über die angefragten Gebiete aufzugeben. Sie haben sich dafür entschieden, dies zu tun und uns über ihre Entscheidung zu informieren."
men.18.a:0	"Wunderbar!"

men.19.t:0	"[FROM.GetNameDefCap] lehnt ab"
men.19.d:0	"Eine Anfrage der [MEN.GetAdjective]-Regierung wurde vor einigen Tagen von den [FROM.GetAdjecitve]-Behörden in [MEN.Capital.GetCapitalVictoryPointName] entgegengenommen und anschließend in Richtung [FROM.Capital.GetCapitalVictoryPointName] telegrammiert. Nach reiflicher Überlegung haben die [FROM.GetAdjecitve] Behörden schließlich entschieden, dass sie die Kontrolle über die angefragten Gebiete nicht aufgeben werden, und haben sich daher dafür entschieden, dies zu tun und uns über ihre Entscheidung zu informieren."
men.19.a:0	"Niemand kann sich der mongolischen Einheit in den Weg stellen!"

men.20.t:0	"[MEN.GetNameDefCap] Schlägt mongolische Wiedervereinigung vor"
men.20.d:0	"Da die Kommunisten nun in [MEN.GetNameDefCap] das Sagen haben, hat [MEN.GetLeader], ein prominenter und hochrangiger Revolutionär, die Vereinigung der beiden jeweiligen Regierungen in [MEN.Capital.GetCapitalVictoryPointName] und [MON.Capital.GetCapitalVictoryPointName] vorgeschlagen. Viele sehen darin eine einmalige Chance, endlich einen Staat für alle Mongolen zu schaffen und das zu erreichen, wonach viele unserer Landsleute streben und sich sehnen."
men.20.a:0	"Ein Volk, eine Nation!"
men.20.b:0	"Unsinn, wir werden uns den falschen Heuchlern in [MEN.Capital.GetCapitalVictoryPointName] nicht beugen!"

men.21.t:0	"[FROM.GetNameDefCap] Akzeptiert"
men.21.d:0	"Die [FROM.GetAdjective] Behörden in [MON.Capital.GetCapitalVictoryPointName] haben sich entschieden, unseren Vorschlag zu akzeptieren, und der Prozess der Integration der beiden Systeme in [MEN.Capital.GetCapitalVictoryPointName] und [MON.Capital.GetCapitalVictoryPointName] hat begonnen. Bald wird ein neuer Staat für alle Mongolen entstehen, entweder durch Blut oder durch Frieden!"
men.21.a:0	"Endlich Einigkeit!"

men.22.t:0	"[FROM.GetNameDefCap] geht zurück"
men.22.d:0	"Die [FROM.GetAdjective] Behörden in [MON.Capital.GetCapitalVictoryPointName] haben sich entschieden, unseren Vorschlag abzulehnen, aber der Grund für diese Entscheidung ist nicht öffentlich bekannt. Viele spekulieren schnell, dass es zu einer Spaltung zwischen [MEN.Capital.GetCapitalVictoryPointName] und [MON.Capital.GetCapitalVictoryPointName] gekommen ist, sowohl politisch als auch wirtschaftlich, aber nichts ist sicher..."
men.22.a:0	"Was für ein Haufen von Narren!"

men.23.t:0	"[FROM.GetNameDefCap] fordert mongolische Territorien an"
men.23.d:0	"Die [FROM.GetAdjective] Behörden in [MEN.Capital.GetCapitalVictoryPointName] haben uns um die Kontrolle über, wie sie es ausdrücken, ‚Mongolische Territorien‘ gebeten, was alle Gebiete umfassen würde, die wir derzeit in der Mongolei, in Nordchina oder in anderen von Mongolen bevölkerten Ländern haben. Da die [FROM.GetAdjective] sowohl strategisch, militärisch als auch wirtschaftlich ein wertvoller Partner für unsere Regierung waren, sollten wir darüber diskutieren, ob wir sie mit der Erfüllung ihrer Wünsche belohnen sollten oder nicht."
men.23.a:0	"Sicher, gewähren Sie ihnen ihren Wunsch."
men.23.b:0	"Japan kann zu diesem Zeitpunkt keine ineffiziente Verwaltung riskieren!"

men.24.t:0	"[FROM.GetNameDefCap] Akzeptiert"
men.24.d:0	"Die Behörden von [FROM.GetAdjective] in [JAP.Capital.GetCapitalVictoryPointName] haben beschlossen, unseren Vorschlag anzunehmen. Da unsere Nation dem Kaiser treu ergeben ist und Japan strategisch, militärisch und wirtschaftlich unterstützt hat, haben sie beschlossen, uns den Wunsch zu erfüllen, das mongolische Volk zu vereinen!"
men.24.a:0	"Einen Schritt näher..."

men.25.t:0	"[FROM.GetNameDefCap] lehnt ab"
men.25.d:0	"Die [FROM.GetAdjective] Behörden in [JAP.Capital.GetCapitalVictoryPointName] haben sich entschieden, unseren Vorschlag abzulehnen, aber der Grund für diese Entscheidung ist nicht öffentlich bekannt. Viele spekulieren schnell, dass es zu einer Spaltung zwischen [MEN.Capital.GetCapitalVictoryPointName] und [JAP.Capital.GetCapitalVictoryPointName] gekommen ist, sowohl politisch als auch strategisch, aber nichts ist sicher..."
men.25.a:0	"Schade..."

men.26.t:0	"[SHX.GetAdjective] Truppen ziehen sich aus Suiyuan zurück"
men.26.d:0	"Unsere Streitkräfte haben in der Schlacht von Suiyuan ihre Überlegenheit bewiesen. Wir haben den Feind abgewehrt und sind weiter vorgedrungen, so dass die feindlichen Streitkräfte den Rückzug antreten mussten. Dadurch haben wir die Kontrolle über fast ganz Suiyuan erlangt, konnten aber nicht weiter vorrücken. Es gibt auch viel zu lernen und Informationen, die wir von diesen Skrimish sammeln können!"
men.26.a:0	"Das wird es ihnen zeigen!"

men.27.t:0	"[ROOT.GetAdjective] Truppen ziehen sich aus Suiyuan zurück"
men.27.d:0	"Unsere Streitkräfte wurden in der Schlacht von Suiyuan dezimiert und besiegt. Wir haben viele feindliche Angriffe abgewehrt, aber ihr Angriff und ihre Moral waren in der Tat überlegen. Es gibt jedoch noch viel zu lernen und Informationen, die wir von diesen Skrimish sammeln können..."
men.27.a:0	"Wahrlich eine Katastrophe..."

men.28.t:0	"Pattsituation bei Suiyuan"
men.28.d:0	"Unsere Streitkräfte waren nicht in der Lage, in der Schlacht von Suiyuan vorzurücken. Wir haben viele feindliche Angriffe abgewehrt, aber unsere Offensivkräfte und unsere Moral waren nicht gut genug, um die feindlichen Linien zu durchbrechen. Es gibt jedoch immer noch viel, was wir lernen können und Informationen, die wir von diesen Skrimish sammeln können..."
men.28.a:0	"Eine Verschwendung von Blut und Tränen..."

men.29.t:0	"[MEN.GetAdjective] Truppen ziehen sich aus Suiyuan zurück"
men.29.d:0	"Unsere Streitkräfte haben in der Schlacht von Suiyuan ihre Überlegenheit bewiesen. Wir haben den Feind abgewehrt und sind weiter vorgedrungen, so dass die feindlichen Streitkräfte den Rückzug antreten mussten. Dadurch haben wir die Kontrolle über fast ganz Suiyuan behalten, konnten aber nicht weiter vordringen. Es gibt auch viel zu lernen und Informationen, die wir von diesen Skrimish sammeln können!"
men.29.a:0	"Das wird es ihnen zeigen!"

men.30.t:0	"[ROOT.GetAdjective] Truppen ziehen sich aus Suiyuan zurück"
men.30.d:0	"Unsere Streitkräfte sind in der Schlacht von Suiyuan dezimiert und besiegt worden. Wir haben viele feindliche Angriffe abgewehrt, aber ihr Angriff und ihre Moral waren in der Tat überlegen und zwangen unsere Streitkräfte zu einem massiven Rückzug, wodurch sie die Kontrolle über große Teile der Provinz Suiyuan verloren. Es gibt jedoch noch viel zu lernen und Informationen, die wir von diesen Skrimis sammeln können..."
men.30.a:0	"Wahrlich eine Katastrophe..."

men.31.t:0	"Pattsituation in Suiyuan"
men.31.d:0	"Unsere Streitkräfte waren nicht in der Lage, in der Schlacht von Suiyuan vorzurücken. Wir haben viele feindliche Angriffe abgewehrt, aber unsere Offensivkräfte und unsere Moral waren nicht gut genug, um die feindlichen Linien zu durchbrechen. Es gibt jedoch immer noch viel, was wir lernen können und Informationen, die wir von diesen Skrimish sammeln können..."
men.31.a:0	"Eine Verschwendung von Blut und Tränen..."

men.32.t:0	"Japan mobilisiert die Kwantung!"
men.32.d:0	"Aus verschiedenen Quellen, die unserer Regierung zur Verfügung stehen, wurde berichtet, dass Japan damit begonnen hat, die Kwantung sowie andere paramilitärische Formationen in der Inneren Mongolei zu mobilisieren, wie Li Shouxins 1. und 2. Kavallerie-Armee und Wang Yings Große Han-Gerechte Armee, die alle Verbindungen zu unserem Oberkommando in [MON.Capital.GetCapitalVictoryPointName] gekappt haben. Eine japanische Invasion scheint am Horizont aufzutauchen, wir müssen uns vorbereiten..."
men.32.a:0	"David gegen Goiliath..."

men.33.t:0	"Der [ROOT.GetAdjective] Industrialisierungsplan"
men.33.d:0	"Die jüngsten Pläne zur Industrialisierung, mit denen unser Land von einer Agrarwirtschaft in eine einigermaßen industrialisierte Wirtschaft umgewandelt werden soll, sind vielversprechend, aber sehr kostspielig. Die Pläne, die von einigen der führenden Industriellen in [MEN.Capital.GetCapitalVictoryPointName] vorgeschlagen wurden, weisen viele Ähnlichkeiten mit dem allgemeinen Schema des [SOV.GetAdjective] Fünfjahresplans auf, der bereits anderswo auf der Welt seine Wirksamkeit unter Beweis gestellt hat.\n\nDa wir jedoch ein Land mit begrenzten Ressourcen sind, könnte eine zu lange Ablenkung von unseren Industrialisierungsplänen deren Wirksamkeit erheblich verringern und den Fortschritt verzögern. Wenn wir also zu dem Schluss gekommen sind, dass dies tatsächlich die beste Wahl für [MEN.GetNonIdeologyName] ist, müssen wir alles geben, was wir haben!"
men.33.a:0	"Wir müssen uns für diesen Plan einsetzen!"

 ################### DECISIONS ################### ""

MEN_inner_mongolian_gambit:0	"Inner-mongolisches Gambit"
MEN_inner_mongolian_gambit_desc:0	"Während die Kwantung-Armee ihren Einfluss in Nordchina immer weiter ausbaut und die chinesische Regierung zu schwach ist, um sich dem wachsenden Einfluss Japans zu widersetzen, steht die Innere Mongolei isoliert und schutzlos da - eine reife Chance, die auf diejenigen wartet, die mutig genug sind, sie zu ergreifen. Unsere Ländereien verfügen über verschiedene wertvolle Ressourcen, die von den Japanern begehrt werden, und unsere strategische Lage würde uns ein wichtiges Standbein gegen die Chinesen verschaffen. Doch im Moment ist unsere Zukunft noch ungewiss...."

MEN_imminent_japanese_invasion:0	"Drohende japanische Invasion"

 ################### IDEAS ################### ""

MEN_kwantungs_invisible_hand:0	"Kwantung's unsichtbare Hand"
MEN_kwantungs_invisible_hand_desc:0	"Der Einfluss von Kwantung zieht sich durch alle Bereiche unseres Militärs und unserer Regierung und bindet uns an Japans strategische Pläne. Mit Hilfe von Beratern und verdeckter Kontrolle versucht Kwantung, unsere Nation in einen Marionettenstaat zu verwandeln und sicherzustellen, dass die Streitkräfte, die Wirtschaft und die Führung mit den japanischen Interessen in Einklang stehen. Die militärische Hierarchie ist kompromittiert, japanische Offiziere führen aus dem Schatten heraus Regie, während lokale Führer in Rollen manövriert werden, die Japans expansionistischen Ambitionen in Ostasien dienen. Obwohl unser Land auf dem Papier autonom ist, bleibt der Griff der Kwantung fest, eine unsichtbare Macht, die den Weg nach vorne diktiert."

MEN_mongol_raids:0	"Mongolenüberfälle"
MEN_mongol_raids_desc:0	"Unser Land wird von Hunderten, wenn nicht Tausenden von mongolischen Banditen heimgesucht, die unsere Grenzen überfallen, den Handel stören und unsere Stärke auf Schritt und Tritt auf die Probe stellen. Diese plündernden Gruppen, Überbleibsel eines lange verlorenen Reiches, haben Siedlungen schutzlos zurückgelassen und die lokale Stabilität untergraben. Um unsere Zukunft zu sichern, müssen wir gegen die unerbittlichen Einfälle vorgehen, die unsere Nation zu destabilisieren, unser Volk zu terrorisieren und unsere Autorität zu schwächen drohen."

MEN_disorganized_military:0	"Desorganisiertes Militär"
MEN_disorganized_military_desc:0	"Unsere Streitkräfte sind zwar zahlreich, aber es mangelt ihnen an der Disziplin und dem Zusammenhalt, die für eine effektive Kriegsführung notwendig sind. Schlechte Ausbildung, Uneinigkeit unter den Befehlshabern und ein Mangel an geeigneter Ausrüstung haben zu einer chaotischen Kommandostruktur geführt, die es schwer hat, die Ordnung im Kampf aufrechtzuerhalten. Solange wir nicht in der Lage sind, Disziplin durchzusetzen und unsere Operationen zu rationalisieren, wird unser Militär ein stumpfes Instrument bleiben, das angesichts einer entschlossenen Opposition zusammenbrechen kann."

MEN_the_long_winter:0	"Der lange Winter"
MEN_the_long_winter_desc:0	"Der Winter 1936 war wie kein anderer, eine Zeit der gnadenlosen Kälte, in der die Temperaturen fast drei Monate lang unerbittlich unter -30°C fielen und unser Volk verzweifelt ums Überleben kämpfte; das Vieh verhungerte, während die Weiden unfruchtbar blieben, die Felder lagen unter unnachgiebigem Schnee begraben, und der Verkehr kam fast völlig zum Erliegen. Für diejenigen, die nicht vorbereitet sind, ist das Überleben fast unmöglich geworden, was unsere politische und wirtschaftliche Ruhe stark destabilisiert und die Menschen zunehmend besorgt über die Zukunft macht... Angesichts der weit verbreiteten Notlage muss ein klarer Weg zur Erholung gefunden werden, selbst wenn dies bedeutet, dass wir ausländische Mächte um Hilfe bitten müssen, um wieder aufzubauen und zu überleben."

MEN_aftermath_of_the_long_winter:0	"Nachwirkungen des langen Winters"

MEN_fuel_for_the_war_machine_idea:0	"Treibstoff für die Kriegsmaschine"
MEN_fuel_for_the_war_machine_idea_desc:0	"Unsere Ressourcen sollten das Rückgrat von Japans Ambitionen in Ostasien sein. Unsere Ländereien sollten in riesige Abbaustätten umgewandelt werden, um ihre unersättliche Kriegswirtschaft zu ernähren. Mineralien, Metalle und landwirtschaftliche Erträge werden abgeschöpft, so dass nur wenig für unsere eigene Entwicklung übrig bleibt. Während unser Volk schuftet, um die japanischen Quoten zu erfüllen, wird unsere Wirtschaft immer abhängiger von den japanischen Forderungen und wir geraten in einen Kreislauf der Knechtschaft."

MEN_rapid_industrialization:0	"Rasche Industrialisierung"
MEN_rapid_industrialization_desc:0	"Unter dem Druck ausländischer Mächte und in dem Bestreben, unsere Wirtschaft zu modernisieren, hat unser Land ein ehrgeiziges Programm zur schnellen industriellen Expansion gestartet. Neue Fabriken und Infrastrukturprojekte schießen über Nacht aus dem Boden, da unsere begrenzten Ressourcen auf schnelles Wachstum ausgerichtet sind. Dieser industrielle Aufschwung belastet zwar unsere Menschen und Ressourcen, aber er verspricht, unser Land von einem Rückzugsgebiet zu einem wichtigen Beitrag zur regionalen Produktion zu machen."

MEN_rebuilding_the_disaster_of_suiyan:0	"Lehren aus der Suiyuan-Kampagne"
MEN_rebuilding_the_disaster_of_suiyan_desc:0	""

MEN_the_bank_of_mengjiang:0	"Bank von Chahar"

MEN_the_joint_committee:0	"Gemeinsamer [ROOT.GetAdjective]-Ausschuss für Industrie"
MEN_the_joint_committee_desc:0	"Eine Erweiterung der [ROOT.GETNAME] Regierung, die die Industriepolitik des Landes lenkt. Die Politik ist darauf ausgerichtet, das [JAP.GETNAME]-Militär und seine Unternehmen, die innerhalb unserer Grenzen operieren, zu beschwichtigen."

