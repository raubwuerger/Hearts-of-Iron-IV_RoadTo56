r56_MEN_industry_ns:0	"Unbedeutende nationale Industrie"
r56_MEN_industry_ns_desc:0	"Das bisschen Industrie, das unser Land besitzt, wächst nur langsam, denn weder die [JAP.GetAdjective] noch die [CHI.GetAdjective] sind bereit, Kapital in den Aufbau der verarbeitenden Industrie in unserem Land zu investieren. Das liegt daran, dass sie hoffen, dass sich unsere Bevölkerung und unsere Wirtschaft in erster Linie auf die Produktion von Rohstoffen und/oder landwirtschaftlichen Produkten konzentriert, die [JAP.GetAdjective] oder [CHI.GetAdjective] Verbraucher dann zu billigen Preisen kaufen können, so dass der arme [ROOT.GetAdjective] Bauer leer ausgeht! Die Frage ist, wie lange kann das [ROOT.GetAdjective] Volk diese verdrehte wirtschaftliche Versklavung ertragen?"
r56_MEN_industry_ns_1:0	"[ROOT.GetAdjective] Industrieller Sektor"
r56_MEN_industry_ns_1_desc:0	"Der [ROOT.GetAdjective] Regierung ist klar geworden, dass die wirtschaftliche Entwicklung, insbesondere im industriellen Sektor, dringend notwendig ist, um die vielen [ROOT.GetAdjective] Bauern und Arbeiter aus der Armut zu holen. Daher werden in absehbarer Zeit erhebliche Investitionen, sowohl politischer als auch wirtschaftlicher Art, in den Industriesektor fließen, zum Wohle unseres Volkes und unserer Nation!"

