 ################### EVENTS ################### ""

 men.10.t:0 "Das Treffen in Zhangbei"
 men.10.d:0 "Während die Angst unter den Eliten wächst und die Japaner langsam vordringen, haben sich die Schlüsselfiguren des Mongolischen Autonomen Politischen Komitees und der Kuomintang, Nima-odsor, Ünenbayan, Serengdongrub und Demchugdongrub, in Zhangbei versammelt, um sich mit dem einflussreichen Jodbajab zu treffen. Die Spannungen waren groß, als sie die jüngsten Entwicklungen in der nördlichen Provinz Chahar besprachen. Mandschurische Truppen unter dem Kommando von Li Shouxin waren in die sechs Bezirke eingedrungen, die durch das Abkommen von Qin-Doihara entmilitarisiert worden waren, und brachten den fragilen Frieden in der Region ins Wanken. Jodbajab gab seine Antwort bekannt: die Entsendung von Kavalleriepolizisten zum Schutz der verwundbaren Nordgrenzen von Chahar. Da die japanische Armee jedoch immer weiter in den Norden Chinas und Mandschukuos vordrang, um ihren Einfluss zu vergrößern, herrschte bei dem Treffen eine Atmosphäre wachsender Unsicherheit. Jeder Anführer wusste, dass dieser jüngste Durchbruch der Beginn von etwas viel Größerem sein könnte, das die Fraktionen und Mächte der Region möglicherweise in einen unausweichlichen Konflikt ziehen würde ..."
 men.10.a:0 "Als das Treffen zu Ende geht, bereiten sich alle Vertreter auf die Abreise vor, aber es ist unklar, was sie erwartet, da sie möglicherweise nie zurückkommen werden."
 men.10.b:0 "Beenden Sie das Treffen, morgen ist ein neuer Tag."

 men.11.t:0 ""
 men.11.d:0 "Nima-Odsor ermordet"
 men.11.a:0 "Eine Tragödie hat die zerbrechliche Clique in der Inneren Mongolei getroffen: Nima-odsor, ein Pro-Kuomintang-Nationalist und eine der Schlüsselfiguren, die sich für die Autonomie der Mongolei und den Widerstand gegen die Japaner einsetzten, wurde ermordet. Augenzeugenberichten zufolge haben die Japaner diesen brutalen Akt inszeniert, um die Führung der Region zu schwächen und jeglichen einheitlichen Widerstand gegen ihren wachsenden Einfluss zu unterbinden. Nima-odsors Tod löst in der Bewegung eine Welle des Schocks und der Angst aus. Verbündete fragen sich, wer als Nächstes ins Visier geraten könnte, während andere sich fragen, ob der Traum von einer unabhängigen und geeinten Mongolei in weite Ferne rückt. In diesen unsicheren Zeiten stehen viele vor einer schwierigen Entscheidung: Entweder sie stärken ihre Entschlossenheit und wehren sich gegen ausländische Einmischung oder sie riskieren, zu Werkzeugen eines fremden Imperiums zu werden."

 men.12.t:0 ""
 men.12.d:0 "Der Kälgän-Zwischenfall"
 men.12.a:0 "Nach Abschluss der Sitzung in Zhangbei machte sich Nima-odsor auf den Rückweg nach Kälgän, um seine Regierungsgeschäfte wieder aufzunehmen. Um 8:45 Uhr bestieg er in Begleitung von zwei Wachen des örtlichen Sicherheitskorps einen Bus in Richtung Kälgän. Die Reise wurde jedoch abrupt unterbrochen, als zwei japanische Offiziere den Bus anhielten und um Einlass baten. Innerhalb weniger Sekunden brach ein Schusswechsel zwischen den mongolischen Wachen und den japanischen Offizieren aus. Einer der mongolischen Wachen gelang es, einen der Japaner zu verletzen, sodass sie sich zurückziehen und vom Tatort fliehen mussten. Es kursieren bereits Gerüchte, dass dies ein Anschlag auf Nima-odsor gewesen sein könnte, einen leidenschaftlichen Patrioten und antijapanischen Provokateur, der glücklicherweise unversehrt blieb."

 men.13.t:0 ""
 men.13.d:0 "Nachwirkungen des langen Winters"
 men.13.a:0 "Der Winter 1936 war eine Zeit beispiellosen Leidens, eine unerbittliche Belagerung durch Eis und Schnee, die die Innere Mongolei und unser Volk in die Knie zwang. Fast drei Monate lang fielen die Temperaturen unter -30 °C und brachten das tägliche Leben zum Stillstand. Unser Volk, das bereits mit Entbehrungen zu kämpfen hatte, sah sich dem Hungertod gegenüber, da das Vieh verendete und die Weiden unfruchtbar wurden. Viele Dörfer, die durch dicke Schneewehen isoliert sind, sind weiterhin von lebenswichtigen Ressourcen abgeschnitten, und die Wirtschaft unseres Landes steht kurz vor dem Zusammenbruch.Mit dem Tauwetter wird das Ausmaß dieser Tortur deutlich. Ganze Gemeinden sind destabilisiert, die Autorität unserer Führung ist geschwächt und unsere Bevölkerung fürchtet sich vor dem, was vor uns liegt. Viele fordern nun einen klaren und entschlossenen Sanierungsplan, um ihr Überleben in den kommenden Monaten zu sichern. Einige fordern, dass wir uns nach innen wenden und unsere eigenen Ressourcen und Arbeitskräfte stärken, während andere glauben, dass wir Hilfe von ausländischen Mächten suchen müssen, um eine Zukunft zu sichern. In einem Punkt sind sich jedoch alle einig: Wenn die Innere Mongolei Bestand haben soll, müssen wir schnell handeln, um unsere zerrüttete Nation wieder aufzubauen!"

 men.14.t:0 ""
 men.14.d:0 "Der Schachzug der Inneren Mongolei"
 men.14.a:0 "Während die Kwantung-Armee ihren Griff um Nordchina festigt, macht sich unter den Eliten der Inneren Mongolei Unruhe breit. Wichtige Persönlichkeiten des Mongolischen Autonomen Politischen Komitees, der Kuomintang und die lokalen Anführer Nima-odsor, Ünenbayan, Serengdongrub und Prinz Demchugdongrub sollen in nicht weniger als zwei Wochen in Zhangbei zusammenkommen, um mit dem einflussreichen Jodbajab über ihre zukünftigen Schritte zu beraten. Der jüngste Einfall mandschurischer Truppen unter Li Shouxin in die entmilitarisierten Bezirke der Provinz Chahar, der einen Verstoß gegen das Abkommen von Qin-Doihara darstellt, hat den ohnehin schon brüchigen Frieden in der Region erschüttert. Unter den Stimmen der Opposition hat sich Nima-odsor, ein prominenter mongolischer Nationalist und enger Verbündeter von Chiang Kai-shek, als führender Gegner der japanischen Interessen in der Inneren Mongolei herausgestellt. Nima-odsors Einfluss wächst und schürt antijapanische Gefühle, die unsere Pläne durchkreuzen könnten. Die Kwantung-Armee hat eine verdeckte Operation entwickelt, um ihn zum Schweigen zu bringen, und es fehlt nur noch ein letzter Befehl zum Handeln. Werden wir entschlossen handeln, um Japans Kontrolle über die Innere Mongolei zu sichern, oder werden wir Nima-odsor erlauben, seine Anhänger zu versammeln und die Kluft zwischen den mongolischen Eliten und unseren Streitkräften zu vertiefen?"
 men.14.b:0 "Den Kaiser zu verärgern, ist ein sehr dummer Schachzug!"

 men.15.t:0 ""
 men.15.d:0 "Nima-Odsor ermordet"
 men.15.a:0 "Nima-odsor, ein mongolischer Nationalist, der die Kuomintang unterstützt, und eine der Schlüsselfiguren, die sich für die Autonomie der Mongolei und den Widerstand gegen die Japaner einsetzt, wurde erfolgreich ermordet. Dem Oberkommando der Kwantung wurde berichtet, dass zwei Soldaten einen Bus anhielten und bestiegen, in dem Nima-odsor unterwegs war, in der Hoffnung, nach Kälgän zurückzukehren und dort seine Aufgaben wieder aufzunehmen, und ihn zweimal erschossen. Nima-odsors Tod löst in der gesamten Region eine Welle des Schocks und der Angst aus, was genau die Wirkung ist, die von der Kwantung erwartet wurde. Die Eliten der Inneren Mongolei fragen sich nun, wer als Nächstes ins Visier genommen werden könnte, während andere sich fragen, ob der Traum von einer unabhängigen und vereinten Mongolei in weite Ferne rückt. Vielleicht werden sie endlich erkennen, dass nur die uneingeschränkte Loyalität gegenüber [JAP.Capital.GetCapitalVictoryPointName] der einzige Weg ist, um ihre Köpfe zu retten ..."

 men.16.t:0 ""
 men.16.d:0 "Der Kälgän-Zwischenfall"
 men.16.a:0 "Nach dem Ende des Treffens in Zhangbei machte sich Nima-odsor auf den Rückweg nach Kälgän, um seine Regierungsgeschäfte wieder aufzunehmen. Um 8:45 Uhr bestieg er in Begleitung von zwei Wachen des örtlichen Sicherheitskorps einen Bus in Richtung Kälgän. Die Reise wurde jedoch abrupt unterbrochen, als zwei japanische Offiziere, die von der Kwantung den Befehl erhalten hatten, Nima-odsor zu ermorden, den Bus anhielten und Einlass verlangten. Innerhalb weniger Sekunden brach ein Schusswechsel zwischen den mongolischen Wachen und den japanischen Offizieren aus. Einer der mongolischen Wachen gelang es, einen der Japaner zu verletzen, sodass sie sich zurückziehen und vom Tatort fliehen mussten. Es kursieren bereits Gerüchte über unsere Beteiligung an dem, was höchstwahrscheinlich ein Mordanschlag auf Nima-odsor war, einem leidenschaftlichen Patrioten und antijapanischen Provokateur. Leider blieb er unversehrt."
 men.16.b:0 "Verdammt seien diese unfähigen Bastarde!"

 men.17.t:0 ""
 men.17.d:0 "[MEN.GetNameDefCap] fordert Kontrolle über [621.GetName] und [746.GetName]"
 men.17.a:0 "Ein Antrag der [MEN.GetAdjektiv] Regierung soll heute bei den [ROOT.GetAdjektiv] Behörden in [MEN.Capital.GetCapitalVictoryPointName] eingegangen sein und anschließend nach [ROOT.Capital.GetCapitalVictoryPointName] telegrafiert worden sein. Diese Bitte beinhaltet die anschließende Übergabe der Kontrolle über die nördlichen Regionen von [621.GetName] und [746.GetName], zwei sehr wohlhabende und wirtschaftlich wichtige Provinzen, die unserer Wirtschaft sehr zugutegekommen sind. Es ist unklar, ob diese "Bitte" zu einem Ultimatum werden könnte, wonach [MEN.GetAdjektiv] selbst in diese Regionen einmarschieren und sie besetzen würde, wenn sie keine Antwort von uns erhält ... Die Frage ist also, was wir in Bezug auf die Bitte tun sollen?"
 men.17.b:0 "Aus Vorsicht müssen wir akzeptieren ..."

 men.18.t:0 ""
 men.18.d:0 "[FROM.GetNameDefCap] akzeptiert"
 men.18.a:0 "Vor einigen Tagen ging bei den [FROM.GetAdjecitve]-Behörden in [MEN.Capital.GetCapitalVictoryPointName] ein Antrag der [MEN.GetAdjecitve]-Regierung ein, der anschließend per Telegramm an [FROM.Capital.GetCapitalVictoryPointName] weitergeleitet wurde. Nach sorgfältiger Überlegung haben die [FROM.GetAdjecitve]-Behörden schließlich beschlossen, dass es am besten ist, die Kontrolle über die Antragsgebiete aufzugeben, und haben sich daher dafür entschieden, dies zu tun und uns über ihre Entscheidung zu informieren."

 men.19.t:0 ""
 men.19.d:0 "[FROM.GetNameDefCap] Ablehnungen"
 men.19.a:0 "Vor einigen Tagen ging bei den [FROM.GetAdjecitve]-Behörden ein Antrag der [MEN.GetAdjecitve]-Regierung ein, der anschließend per Telegramm an [FROM.Capital.GetCapitalVictoryPointName] weitergeleitet wurde. Nach sorgfältiger Überlegung haben die [FROM.GetAdjecitve]-Behörden schließlich beschlossen, die Kontrolle über die Antragsgebiete nicht aufzugeben, und haben uns daher über ihre Entscheidung informiert."

 men.20.t:0 ""
 men.20.d:0 "[MEN.GetNameDefCap] schlägt mongolische Wiedervereinigung vor"
 men.20.a:0 "Da die Kommunisten nun die Verantwortung für [MEN.GetNameDefCap] tragen, hat [MEN.GetLeader], ein prominenter und hochrangiger Revolutionär, die Vereinigung der beiden Regierungen in [MEN.Capital.GetCapitalVictoryPointName] und [MON.Capital.GetCapitalVictoryPointName] vorgeschlagen. Viele sehen dies als einzigartige Gelegenheit, endlich einen Staat für alle Mongolen zu schaffen und endlich das zu erreichen, wonach viele unserer Landsleute streben und sich wünschen."
 men.20.b:0 "Ein Volk, eine Nation!"

 men.21.t:0 ""
 men.21.d:0 "[FROM.GetNameDefCap] akzeptiert"
 men.21.a:0 "Die [FROM.GetAdjektiv]-Behörden in [MON.Hauptstadt.Hauptstadt-Siegpunktname] haben beschlossen, unseren Vorschlag anzunehmen, und der Prozess der Integration der beiden Systeme in [MEN.Hauptstadt.Hauptstadt-Siegpunktname] und [MON.Hauptstadt.Hauptstadt-Siegpunktname] hat begonnen. Bald wird ein neuer Staat für alle Mongolen entstehen, entweder durch Blut oder durch Frieden!"

 men.22.t:0 ""
 men.22.d:0 "[FROM.GetNameDefCap] lehnt ab"
 men.22.a:0 "Die [FROM.GetAdjektiv]-Behörden in [MON.Capital.GetCapitalVictoryPointName] haben sich entschieden, unseren Vorschlag abzulehnen, der Grund dafür ist jedoch nicht öffentlich bekannt. Viele spekulieren schnell, dass es zu einer Spaltung zwischen [MEN.Capital.GetCapitalVictoryPointName] und [MON.Capital.GetCapitalVictoryPointName] gekommen ist, sowohl politisch als auch wirtschaftlich, aber es ist nichts Sicheres bekannt ..."
  "Was für ein Haufen Dummköpfe!"
 men.23.t:0 ""
 men.23.d:0 "[FROM.GetNameDefCap] fordert mongolische Gebiete"
 men.23.a:0 "Die [FROM.GetAdjektiv]-Behörden in [MEN.Capital.GetCapitalVictoryPointName] haben uns um die Kontrolle über, wie sie es nennen, "mongolische Gebiete" gebeten, was alle Gebiete umfassen würde, in denen wir uns derzeit in der Mongolei, in Nordchina oder in anderen von Mongolen bewohnten Gebieten befinden. Da die [FROM.GetAdjektiv] sowohl strategisch als auch militärisch und wirtschaftlich ein wertvoller Partner für unsere Regierung waren, sollten wir darüber beraten, ob wir sie mit der Erfüllung ihrer Wünsche belohnen sollten oder nicht."
 men.23.b:0 "Gewiss, erfüllen Sie ihnen ihren Wunsch."

 men.24.t:0 ""
 men.24.d:0 "[FROM.GetNameDefCap] Akzeptiert"
 men.24.a:0 "Die [FROM.GetAdjektiv]-Behörden in [JAP.Capital.GetCapitalVictoryPointName] haben sich entschieden, unseren Vorschlag anzunehmen, möglicherweise weil unsere Nation dem Kaiser treu ergeben war und Japan strategische, militärische und wirtschaftliche Unterstützung geleistet hat. Sie haben beschlossen, uns unseren Wunsch nach Vereinigung des mongolischen Volkes zu erfüllen!"

 men.25.t:0 ""
 men.25.d:0 "[FROM.GetNameDefCap] lehnt ab"
 men.25.a:0 "Die [FROM.GetAdjektiv]-Behörden in [JAP.Capital.GetCapitalVictoryPointName] haben sich dafür entschieden, unseren Vorschlag abzulehnen, der Grund dafür ist jedoch nicht öffentlich bekannt. Viele spekulieren schnell, dass es zu einer Spaltung zwischen [MEN.Capital.GetCapitalVictoryPointName] und [JAP.Capital.GetCapitalVictoryPointName] gekommen ist, sowohl politisch als auch strategisch, aber es ist nichts Sicheres bekannt ..."

 men.26.t:0 ""
 men.26.d:0 "[SHX.GetAdjektiv] Truppen ziehen sich aus Suiyuan zurück"
 men.26.a:0 "Unsere Streitkräfte haben in der Schlacht von Suiyuan ihre Überlegenheit unter Beweis gestellt. Wir haben den Feind abgewehrt und sind weiter vorgerückt, sodass die feindlichen Truppen die Flucht ergriffen und sich in Massen zurückzogen. Infolgedessen haben wir fast die gesamte Kontrolle über Suiyuan erlangt, konnten jedoch nicht weiter vorrücken. Es gibt auch viel, was wir aus diesen Scharmützeln lernen und an Informationen sammeln können!"

 men.27.t:0 ""
 men.27.d:0 "[ROOT.GetAdjektiv] Truppen ziehen sich aus Suiyuan zurück"
 men.27.a:0 "Unsere Streitkräfte wurden in der Schlacht von Suiyuan dezimiert und besiegt. Wir haben viele feindliche Angriffe abgewehrt, aber ihr Angriff und ihre Moral waren in der Tat überlegen. Es gibt jedoch noch viel, was wir lernen können, und Informationen, die wir aus diesen Scharmützeln sammeln können ..."

 men.28.t:0 ""
 men.28.d:0 "Pattsituation bei Suiyuan"
 men.28.a:0 "Unsere Streitkräfte konnten in der Schlacht von Suiyuan nicht vorrücken. Wir haben viele feindliche Angriffe abgewehrt, aber unsere Offensivkräfte und Moral waren nicht gut genug, um die feindlichen Linien zu durchbrechen. Es gibt jedoch noch viel, was wir lernen können, und Informationen, die wir aus diesen Scharmützeln sammeln können ..."

 men.29.t:0 ""
 men.29.d:0 "[MEN.GetAdjektiv] Streitkräfte ziehen sich aus Suiyuan zurück"
 men.29.a:0 "Unsere Streitkräfte haben in der Schlacht von Suiyuan ihre Überlegenheit unter Beweis gestellt. Wir haben den Feind abgewehrt und sind weiter vorgerückt, sodass die feindlichen Streitkräfte die Flucht ergriffen und sich in Massen zurückzogen. Infolgedessen haben wir die Kontrolle über fast ganz Suiyuan behalten, konnten jedoch nicht weiter vorrücken. Es gibt auch viel, was wir aus diesen Gefechten lernen und an Informationen sammeln können!"

 men.30.t:0 ""
 men.30.d:0 "[ROOT.GetAdjektiv] Truppen ziehen sich aus Suiyuan zurück"
 men.30.a:0 "Unsere Streitkräfte wurden in der Schlacht von Suiyuan dezimiert und besiegt. Wir haben viele feindliche Angriffe abgewehrt, aber ihr Angriff und ihre Moral waren in der Tat überlegen, sodass unsere Streitkräfte sich in Massen zurückziehen mussten und infolgedessen die Kontrolle über große Teile der Provinz Suiyuan verloren. Es gibt jedoch noch viel, was wir aus diesen Gefechten lernen und an Informationen sammeln können ..."

 men.31.t:0 ""
 men.31.d:0 "Pattsituation bei Suiyuan"
 men.31.a:0 "Unsere Streitkräfte konnten in der Schlacht von Suiyuan nicht vorrücken. Wir haben viele feindliche Angriffe abgewehrt, aber unsere Offensivkräfte und Moral waren nicht gut genug, um die feindlichen Linien zu durchbrechen. Es gibt jedoch noch viel, was wir lernen können, und Informationen, die wir aus diesen Gefechten sammeln können ..."

 men.32.t:0 ""
 men.32.d:0 "Japan mobilisiert die Kwantung!"
 men.32.a:0 "Unseren Regierungsstellen vorliegenden Berichten verschiedener Quellen zufolge hat Japan mit der Mobilisierung der Kwantung sowie anderer paramilitärischer Formationen in der Inneren Mongolei begonnen, darunter Li Shouxins 1. und 2. Kavalleriearmee und Wang Yings Große Han-Armee der Gerechten, die jegliche Kommunikation mit unserem Oberkommando in [MON.Hauptstadt.Hauptstadt-Siegpunktname] unterbrochen haben. Eine japanische Invasion scheint sich abzuzeichnen, wir müssen uns vorbereiten ..."

 men.33.t:0 ""
 men.33.d:0 "Industrialisierungspläne"
 men.33.a:0 "Die jüngsten Pläne zur Industrialisierung, die unsere Nation von einer Agrarwirtschaft in eine Industrienation verwandeln sollen, sind vielversprechend. Sie folgen ähnlichen Fünfjahresplan-Programmen, die auch anderswo auf der Welt eingesetzt wurden. Da wir jedoch ein Land mit begrenzten Ressourcen sind, könnte eine zu lange Ablenkung von unseren Industrialisierungsplänen deren Wirksamkeit verringern und den Fortschritt verzögern. Wenn wir also unser Land zu einer Industrienation machen wollen, müssen wir uns voll und ganz dafür einsetzen."

