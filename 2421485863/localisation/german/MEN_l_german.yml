 r56_MEN_industry_ns_1:0 "Die wenigen Industriezweige, die es in unserem Land gibt, wachsen nur langsam, da weder die [JAP.GetAdjektiv] noch die [CHI.GetAdjektiv] bereit sind, Kapital in den Aufbau der Fertigungsindustrie in unserem Land zu investieren. Dies liegt daran, dass sie hoffen, dass sich unsere Bevölkerung und Wirtschaft weiterhin hauptsächlich auf die Produktion von Rohstoffen und/oder landwirtschaftlichen Erzeugnissen konzentriert, die [JAP.GetAdjektiv] oder [CHI.GetAdjektiv] Verbraucher dann zu günstigen Preisen kaufen können, sodass der arme [ROOT.GetAdjektiv] Bauer mit nichts dasteht! Die Frage ist, wie lange die [ROOT.GetAdjektiv] Bevölkerung diese verdrehte wirtschaftliche Versklavung ertragen kann."
