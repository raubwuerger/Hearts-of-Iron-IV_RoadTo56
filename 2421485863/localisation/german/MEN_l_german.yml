l_german:
Mengkukuo_focus:0	"Mengkukuo National Focus"
MEN_GATHERING_STORM_DESC:0	"Als die Kriegstrommeln über den sanften Hügeln der Mandschurei verstummten, waren die imperialen Ambitionen Japans ein für alle Mal in Stein gemeißelt und bedrohten das zukünftige Überleben jedes chinesischen Staates. Jahrelange Konflikte und Kämpfe um Einfluss in der Inneren Mongolei haben Japans Griff nur noch fester werden lassen, wobei die Kwantung-Armee als Speerspitze des japanischen Einflusses fungierte.So herrschten jahrelang politische Anarchie und Unordnung in der Nation, was zu weitestgehend unpopulären Entscheidungen und politischer Unentschlossenheit führte ..."

