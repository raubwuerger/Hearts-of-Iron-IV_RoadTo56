l_german:
SER_develop_steel_deposits_desc:0	"The Fledgling Steel Industry of Morava should be developed to provide the steel that the nation will require."
SER_ideological_fanaticism_communism_desc:0	"Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
serbia_focus:0	"Serbischer Nationaler Fokus"
SER_konstantin_musicki:0	"Konstantin Mušicki"
SER_local_developers:0	"Lokale Designer"
SER_local_developers_desc:0	"Serbische Flugzeuge sind die besten Flugzeuge. Hier ist sicher keine Voreingenommenheit im Spiel."
SER_state_guard:0	"Die Srpska Državna Straža gründen"
SER_state_guard_desc:0	"Um die Sicherheit der Nation zu gewährleisten, müssen wir ein stehendes Heer zum Schutz unseres Territoriums aufstellen: die serbische Staatsgarde."
SER_small_arms:0	"Verbessern Sie die Einsatzfähigkeit von Kleinwaffen"
SER_small_arms_desc:0	"Die Grenzen für die Ausrüstung, die die Infanterie tragen kann, werden ständig verschoben. Wir werden uns darauf konzentrieren, unseren Truppen die besten verfügbaren Werkzeuge zur Verfügung zu stellen."
SER_improve_conscripts_equipment:0	"Verbessern Sie die Ausrüstung der Wehrpflichtigen"
SER_improve_conscripts_equipment_desc:0	"Auch wenn Wehrpflichtige nicht mit den besten Waffen ausgestattet werden können, müssen wir dafür sorgen, dass sie über genügend Ausrüstung verfügen, um nach besten Kräften zu kämpfen."
SER_motorization_effort:0	"Motorisierte Korps"
SER_motorization_effort_desc:0	"Mobilität und Schutz sind entscheidend, um die Infanterie sicher ins und aus dem Feld zu bringen. Wenn wir uns auf diese Entwicklungen konzentrieren, können wir schnell handeln."
SER_structured_logistics:0	"Strukturierte Logistik"
SER_structured_logistics_desc:0	"Aufgrund unserer begrenzten Produktionskapazitäten können wir es uns nicht leisten, wertvolle Ausrüstung zu verlieren. Deshalb ist ein strukturiertes und übersichtliches Logistiksystem unerlässlich, um unsere Fähigkeit zur Kriegsführung zu erhalten."
SER_recovery_teams:0	"Bergungsteams"
SER_recovery_teams_desc:0	"Um den Verlust von Ausrüstung weiter zu reduzieren, müssen wir Teams organisieren, die Waffen und Fahrzeuge auf den Schlachtfeldern bergen."
SER_army_maneuvers:0	"Armee-Manöver"
SER_army_maneuvers_desc:1	"Um unsere Armee auf Vordermann zu bringen, müssen neue Manöver abgehalten werden. Die Erfahrungen werden zweifellos auch zu neuen Erkenntnissen über die moderne Kriegsführung führen."
SER_supremacy_of_offense:0	"Vorherrschaft der Offensive"
SER_supremacy_of_offense_desc:1	"Die Offensive ist der Schlüssel zum Sieg und muss daher unsere Gesamtstrategie und die Entwicklung neuer Doktrinen bestimmen."
SER_supremacy_of_defense:0	"Vorherrschaft der Verteidigung"
SER_supremacy_of_defense_desc:1	"Eingekesselt von Feinden auf allen Seiten müssen wir lange genug durchhalten, damit unsere Verbündeten uns den Druck nehmen können. Die Entwicklung neuer Militärdoktrinen muss sich auf die Verteidigung unseres Heimatlandes konzentrieren."
SER_artillery_regiments:0	"Artillerie-Regimenter"
SER_artillery_regiments_desc:1	"Durch die Einführung leistungsfähiger Artillerieregimenter in unseren Divisionen wird deren Kampfkraft insgesamt erheblich gesteigert."
SER_domestic_artillery_production:0	"Inländische Artillerieproduktion"
SER_domestic_artillery_production_desc:1	"Indem wir die Entwicklung moderner, einheimischer Artilleriemodelle fördern, können wir sicherstellen, dass unsere Streitkräfte über die beste Feuerunterstützung verfügen, die wir bieten können."
SER_anti_tank_defenses:0	"Anti-Panzer-Verteidigung"
SER_anti_tank_defenses_desc:1	"Da der Panzer in der modernen Kriegsführung in den Mittelpunkt gerückt ist, sind neue Entwicklungen im Bereich der Panzerabwehrkanonen erforderlich, damit unsere Infanterie diese gepanzerten Ungetüme ausschalten kann."
SER_mountain_brigades:0	"Gebirgsbrigaden"
SER_mountain_brigades_desc:1	"Große Teile unseres Landes bestehen aus Gebirgen, was die Bildung von Spezialbrigaden erfordert, die auf den Kampf in diesem Gelände spezialisiert sind."
SER_armored_cavalry:0	"Gepanzerte Kavallerie"
SER_armored_cavalry_desc:0	"Die Mechanisierung der Kavallerie und der Übergang zu Halbkettenfahrzeugen würde eine hohe Mobilität ermöglichen und den Mitgliedern der Einheiten zusätzlichen Schutz bieten. Diese Umstellung wäre zweifellos mit hohen Produktionskosten verbunden, aber wir müssen alles tun, um einen schnellen Sieg auf dem Feld zu gewährleisten."
SER_tank_conversions:0	"Panzer-Umrüstungen"
SER_tank_conversions_desc:1	"Während wir jetzt vielleicht Panzer benötigen, werden wir im nächsten Monat vielleicht Artilleriepanzer oder Panzerjäger auf demselben Fahrgestell benötigen. Unsere gepanzerte Ausrüstung muss flexibel bleiben und an unsere aktuellen Bedürfnisse angepasst werden können."
SER_modern_tanks:0	"Moderne Panzer"
SER_modern_tanks_desc:1	"Durch die Hinzunahme großkalibriger Hauptwaffen hat sich die Panzertechnologie weit über den einfachen Zweck hinaus entwickelt, Truppen sicher von A nach B zu transportieren. Wir müssen unsere Version moderner Panzer bauen, um mit unseren Nachbarn konkurrieren zu können."
SER_equipment_effort_2:0	"Ausrüstungsbemühungen II"
SER_equipment_effort_2_desc:0	"Wir werden unsere Bemühungen fortsetzen, um sicherzustellen, dass unsere Infanterie- und Unterstützungstruppen mit der bestmöglichen Ausrüstung unserer Zeit ausgestattet sind."
SER_mechanization_effort:0	"Mechanisierungsanstrengungen"
SER_mechanization_effort_desc:0	"Indem wir die Möglichkeiten der motorisierten Infanterie neu überdenken, können wir die Grenzen dessen, was wir heute an Fahrzeugen konstruieren können, verschieben."
SER_doctrine_effort_2:0	"Doktrin Anstrengung II"
SER_doctrine_effort_2_desc:0	"Das Schlachtfeld hat sich in den Jahren zwischen den beiden Weltkriegen und in den jüngsten Konflikten verändert. Wir müssen unsere Doktrinen ständig neu bewerten, um dies zu berücksichtigen."
SER_equipment_effort_3:0	"Ausrüstung Anstrengung III"
SER_equipment_effort_3_desc:0	"Anstatt ausländische Ausrüstung zu imitieren oder zu kaufen, sollten wir bei den Infanteriewaffen weltweit führend werden."
SER_armor_effort:0	"Panzerungsanstrengungen"
SER_armor_effort_desc:0	"Indem wir das anwenden, was wir bei der Mechanisierung unserer Infanterie gelernt haben, können wir auch unsere gepanzerten Fahrzeuge verbessern."
SER_special_forces:0	"Spezialtruppen"
SER_special_forces_desc:0	"Wir brauchen Elitetruppen; Gebirgsjäger und Fallschirmjäger sollten unsere Priorität sein."
SER_aviation_effort:0	"Gründung der Belgrader Luftschule"
SER_aviation_effort_tt:0	"Nicht genügend Gebäudeslots für §YAir Base§!"
SER_aviation_effort_desc:0	"Nirgendwo ist der technologische Fortschritt so rasant wie in der Luftkriegsführung. Die Luftfahrt ist ein Bereich, den jede moderne Nation beherrschen muss."
SER_fighter_focus:0	"Kampfflugzeuge im Fokus"
SER_fighter_focus_desc:0	"Die Luftkämpfe des Großen Krieges sind noch nicht vorbei. Wenn wir bei der Entwicklung von Kampfflugzeugen die Nase vorn haben, werden wir auch in Zukunft im Vorteil sein."
SER_bomber_focus:0	"Bomber-Fokus"
SER_bomber_focus_desc:0	"Wenn die Menschen der Zukunft über die Schrecken der heutigen Kriege sprechen, wird das Feuer, das vom Himmel regnet, im Vordergrund stehen. Wir werden unser Bestes tun, um sicherzustellen, dass unsere Feinde diese Geschichten erzählen."
SER_airplanes_licenses:0	"Lizenzen für Flugzeuge"
SER_airplanes_licenses_desc:0	"Da unsere Konstruktionsmöglichkeiten begrenzt sind, sollten wir versuchen, Lizenzen für Flugzeuge zu erwerben und unsere Luftwaffe mit modernen Kampfflugzeugen auszustatten."
SER_form_mechanics:0	"Bilden Sie Mechaniker-Crews"
SER_form_mechanics_desc:0	"Was macht es letztendlich für einen Unterschied, ob ein Flugzeug durch feindliche Kugeln oder durch einen plötzlichen Motorbrand abgeschossen wird oder ob ein Flugzeug aufgrund mechanischer Defekte flugunfähig ist, wenn wir es nicht reparieren können?  Um das Risiko mechanischer Ausfälle zu verringern, besteht die einzige Lösung darin, engagierte und gut ausgebildete Mechaniker zu haben, die das Innere dieser Flugzeuge besser kennen als ein Chirurg die Anatomie."
SER_aviation_effort_2:0	"Fortgeschrittene Luftfahrt-Doktrin"
SER_aviation_effort_2_desc:0	"Weitere Fortschritte in der Luftfahrt werden notwendig sein, um unsere Luftwaffe gut mit anderen militärischen Bereichen zu integrieren."
SER_CAS_effort:0	"CAS-Bemühungen"
SER_CAS_effort_desc:0	"Eine moderne Armee braucht Unterstützung durch Fahrzeuge am Boden und in der Luft."
SER_rocket_effort:0	"Raketeneinsatz"
SER_rocket_effort_desc:0	"Raketen- und Düsentriebwerke ermöglichen nie dagewesene Geschwindigkeiten sowohl für Schiffe ohne Besatzung als auch für solche mit Besatzung. Die Vorreiterrolle bei diesen Technologien ermöglicht es uns, den Feind zu überrumpeln."
SER_NAV_effort:0	"NAV-Aufwand"
SER_NAV_effort_desc:0	"So wie sich die neue Seekriegsführung unter der Wasseroberfläche abspielt, findet ein Teil davon in der Luft über dem Wasser statt."
SER_ikarus:0	"Ikarus"
SER_ikarus_desc:1	"Unsere älteste Flugzeugindustrie, die Ikarus-Werke in Novi Sad, müssen ausgebaut werden, um sie auf die erhöhte Produktion vorzubereiten, die für unsere neue Luftwaffe erforderlich ist."
SER_designer_tt:0	"Schaltet dieses Unternehmen als Flugzeugkonstrukteur frei.\n"
SER_rogozarski:0	"Rogožarski"
SER_rogozarski_desc:1	"Die kurz nach Ikarus gegründete 'Erste serbische Flugzeugfabrik von Zivojin Rogozarski' muss erweitert werden, wenn sie mit den aktuellen Anforderungen an die Produktion Schritt halten soll."
SER_zmaj:0	"Zmaj"
SER_zmaj_desc:1	"Die Belgrader Flugzeugwerkstätten von Zmaj müssen neue Flächen erhalten, um sich zu vergrößern. Obwohl Zmaj jünger ist als unsere anderen Unternehmen, verfügt es über ein großes Potenzial, um unseren Produktionsbedarf zu decken, wenn es erweitert wird."
SER_expand_the_split_shipyards:0	"Die montenegrinischen Werften ausbauen"
SER_expand_the_split_shipyards_desc:0	"Unsere bereits existierende Schiffbauindustrie in Montenegro ist ein erstklassiger Kandidat für eine Expansion und verfügt über umfangreiche Einrichtungen, die den Bau größerer Kriegsschiffe ermöglichen."
SER_coastal_defense:0	"Küstenverteidigung"
SER_coastal_defense_desc:0	"Wir können nicht darauf hoffen, dass wir die Flotten unserer Gegner in der Adria angreifen können. Stattdessen müssen wir unsere Küsten darauf vorbereiten, mögliche Invasionsversuche von Seiten der Marine abzuwehren."
SER_contest_the_adriatic:0	"Die Adriaküste erobern"
SER_contest_the_adriatic_desc:0	"Die Verteidigung unserer Küsten beginnt in dem Meer, das vor ihnen liegt. Wir müssen neue Seetaktiken und Strategien entwickeln, um die Kontrolle über die Adria zu erlangen oder sie anzufechten."
SER_light_cruiser:0	"Leichte Kreuzer entwerfen"
SER_light_cruiser_desc:1	"Wir brauchen einen neuen, modernen Kreuzer, der das Rückgrat unserer adriatischen Flotte bildet."
SER_naval_bombers:0	"Seebomber"
SER_naval_bombers_desc:1	"Die Adria ist lang, aber schmal, so dass sie für Flugzeuge, die auf unseren Flugplätzen stationiert sind, leicht zugänglich ist. Die Entwicklung spezieller Marinebombermodelle könnte die Chancen unserer Marine gegen stärkere Gegner erheblich verbessern."
SER_heavy_cruiser_project:0	"Projekt schwerer Kreuzer"
SER_heavy_cruiser_project_desc:1	"Um feindliche Marinen angemessen herauszufordern, benötigen wir eine größere Tonnage und schwerere Waffen. Schwere Kreuzer wären ein guter Schritt nach oben gegenüber den leichten Kreuzern, die wir bisher als Hauptstützen unserer Flotte eingesetzt haben."
SER_modern_destroyers:0	"Moderne Zerstörer"
SER_modern_destroyers_desc:1	"Zerstörer sind das Rückgrat einer jeden Marine, und wir müssen sicherstellen, dass unsere eigenen denen unserer Gegner nicht unterlegen sind."
SER_build_the_nation:0	"Bauen Sie die Grundlagen des Industrialismus auf"
SER_build_the_nation_desc:0	"Konzentrieren Sie alle unsere politischen Bemühungen auf den Aufbau der zivilen Industrie in einem großen Sprung nach vorn."
SER_research_collaboration:0	"Jugoslawische Forschungszusammenarbeit"
SER_research_collaboration_desc:0	"Als autonome Region ist es logisch, alle relevanten Entdeckungen mit der jugoslawischen Zentralregierung zu teilen."
SER_prospect_for_resources:0	"Aussichten auf Ressourcen"
SER_prospect_for_resources_desc:0	"Unser Boden birgt Ressourcen, die für den Kampf unserer Zeit hilfreich sein werden. Wir müssen sie so schnell wie möglich freisetzen und sie optimal nutzen."
SER_construction_effort_tt:0	"Nicht genug Bauplätze für §YZivile Fabriken§!"
SER_construction_effort:0	"Machen Sie die ersten Schritte der Industrialisierung"
SER_construction_effort_desc:0	"Machen Sie die ersten Schritte der Industrialisierung"
SER_production_effort:0	"Bewaffnen Sie die Nation"
SER_production_effort_tt:0	"Nicht genug Slots für §YMilitärische Fabriken§!"
SER_production_effort_desc:0	"Wenn Sie Traktoren bauen können, können Sie auch Panzer bauen! Wir dürfen nicht zulassen, dass unsere militärische Produktionskapazität zurückbleibt."
SER_construction_effort_2:0	"Industrialisieren Sie das ländliche Morava"
SER_construction_effort_2_desc:0	"Wenn wir unsere Fabriken weiter ausbauen, können wir die Produktion von Gütern für den Handel und weitere Bauvorhaben beschleunigen."
SER_industrial_planning:0	"Industrielle Planung"
SER_industrial_planning_desc:0	"Um unsere industrielle Entwicklung fortzusetzen, müssen wir langfristige Strategien entwickeln und nach geeigneten Grundstücken suchen."
SER_create_skopje_arsenals:0	"Neue Arsenale in Skopje schaffen"
SER_create_skopje_arsenals_desc:1	"Mazedonien hatte nie wirklich eine Militärindustrie, also ist es an der Zeit, dass wir selbst welche aufbauen."
SER_production_effort_2:0	"Unterstützen Sie die Schwerfahrzeugindustrie"
SER_production_effort_2_desc:0	"Als einer der führenden europäischen Häfen ist Antwerpen hervorragend geeignet, eine auf den Export ausgerichtete Industrie zu entwickeln."
SER_infrastructure_effort:0	"Verbinden Sie Podgorica mit Belgrad"
SER_infrastructure_effort_desc:0	"Ein Land ohne angemessene Infrastruktur kann keine fortschrittlichen Projekte oder Konstruktionen verfolgen."
SER_infrastructure_effort_tt:0	"Nicht genügend Bauplätze für §YInfrastruktur§!"
SER_extract_aluminium:0	"Entwickeln Sie montenegrinisches Aluminium"
SER_extract_aluminium_desc:0	"Aluminium ist unser wichtigster Rohstoff und wir müssen seine Gewinnung unbedingt maximieren."
SER_develop_steel_deposits:0	"Entwickeln Sie Morava's Steel"
SER_expand_the_university_of_belgrade:0	"Erweitern Sie die Universität von Belgrad"
SER_expand_the_university_of_belgrade_desc:0	"Die Universität von Belgrad ist bereits die mit Abstand größte des Landes. Aber wenn wir mehr Ressourcen für ihre Forschung bereitstellen, insbesondere in den Bereichen, die zu militärischen Innovationen führen könnten, könnten wir uns einen entscheidenden Vorteil auf dem Schlachtfeld verschaffen."
SER_develop_macedonia:0	"Entwickeln Sie Mazedonien"
SER_develop_macedonia_desc:0	"Mazedonier gibt es nicht, sie sind einfach nur muslimische Serben. Deshalb wird Mazedonien von Serben bewohnt und sie verdienen genauso viel Fürsorge wie alle anderen Serben..."
SER_construction_effort_3:0	"Industrielle Anstrengung III"
SER_construction_effort_3_desc:0	"Der Ausbau unseres Infrastrukturnetzes hat unsere Baukapazität erheblich verbessert."
SER_nuclear_effort:0	"Kerntechnisches Institut Vinča"
SER_nuclear_effort_desc:0	" "
SER_extra_tech_slot_2:0	"Die F&E-Abteilung ausbauen"
SER_extra_tech_slot_2_desc:0	"Die schnelle Industrialisierung unseres Landes hat neue Möglichkeiten im Bereich Forschung und Entwicklung eröffnet, die wir nutzen sollten."
SER_technology_sharing:0	"Gemeinsame Nutzung von Technologie"
SER_technology_sharing_desc:0	"Indem wir technologische Fortschritte mit unseren Verbündeten teilen, wird unsere gesamte Fraktion Forschung und Entwicklung im Krieg effizienter betreiben."
SER_secret_weapons:0	"Geheimwaffen"
SER_secret_weapons_desc:0	"Es ist verlockend, alle zusätzlichen Ressourcen in die Entwicklung von Panzern und Flugzeugen zu stecken, aber das Geheimnis, Kriege zu gewinnen, liegt in ganz neuen Bereichen der Wissenschaft: Elektronik, Raketentechnik und Atomforschung."
SER_political_effort:0	"Organisieren Sie den neuen Staat"
SER_political_effort_desc:0	"Unser erstes Ziel ist es, die grundlegenden Regierungsvertretungen im ganzen Land aufzubauen."
SER_collectivist_ethos:0	"Syndikate ermächtigen"
SER_collectivist_ethos_desc:0	"Unsere Feinde mögen kleinere Nationen spalten und erobern, aber unser Volk wird geeint sein - alle für einen und einer für alle."
SER_liberty_ethos:0	"Demokratischer Konsens"
SER_liberty_ethos_desc:0	"Wir werden die individuellen Freiheiten und die Freiheit in dieser Zeit der ideologischen Fanatiker, die den menschlichen Geist zu ersticken versuchen, schützen."
SER_militarism:0	"Das Land militarisieren"
SER_militarism_desc:0	"Um den Staatsfeind zu bekämpfen, müssen wir aus unseren Reihen militante Freiwillige rekrutieren, die unsere ideologischen Todfeinde, insbesondere die Kommunisten, bekämpfen."
SER_political_correctness:0	"Politische Korrektheit"
SER_political_correctness_desc:0	"Menschen, die leicht kontroverse oder anderweitig peinliche Meinungen vertreten, scheinen über eine weitreichende Verschwörung gegen sie besorgt zu sein. Das scheint eine ausgezeichnete Idee zu sein."
SER_neutrality_focus:0	"Fokus auf Neutralität"
SER_neutrality_focus_desc:0	"Während andere behaupten, es erfordere Mut und Weisheit, in einem globalen Konflikt Partei zu ergreifen, wissen wir, dass es mehr erfordert, sich zu weigern."
SER_interventionism_focus:0	"Interventionismus Fokus"
SER_interventionism_focus_desc:0	"Wir schätzen die Freiheit aller Menschen, nicht nur unserer Bürger. Wenn die Verhinderung von Tyrannei Krieg bedeutet, dann soll es so sein."
SER_military_youth:0	"Kriegsindoktrination"
SER_military_youth_desc:0	"Organisationen zur Förderung der Disziplin und der politischen Bildung der Menschen in unserem Land werden Loyalität und Selbstaufopferung frühzeitig fördern."
SER_deterrence:0	"Abschreckung"
SER_deterrence_desc:0	"Wenn wir alleine dastehen, profitieren wir selten von einem Krieg. Zum Glück wissen wir, dass die beste Verteidigung so bekannt ist, dass man sie nie anwenden muss."
SER_volunteer_corps:0	"Freiwilligenkorps"
SER_volunteer_corps_desc:0	"Unsere Leute zu zwingen, für die Ideale der Freiheit zu sterben, wäre eine Übung in Ironie, aber die Schaffung von Mitteln für diejenigen, die Menschen im Ausland helfen wollen, ist es nicht."
SER_paramilitarism:0	"Paramilitarismus"
SER_paramilitarism_desc:0	"Militärische Prinzipien finden auch außerhalb des Militärs Anwendung. Mehr Menschen werden eine militärische Ausbildung erhalten, wenn wir halbmilitärische Einheiten entwickeln, die unsere Streitkräfte ergänzen."
SER_indoctrination_focus:0	"Indoktrination"
SER_indoctrination_focus_desc:0	"Nachdem wir festgestellt haben, dass unsere Ideologie auf der Wahrheit beruht, kann sie als Wahrheit gelehrt werden. Bildung und Medien müssen diese Lektion widerspiegeln."
SER_foreign_expeditions:0	"Ausländische Expeditionen"
SER_foreign_expeditions_desc:0	"Da unsere Feinde bereit sind, im Namen ihrer Ideale in weit entfernte Konflikte einzugreifen, müssen wir bereit sein, das Gleiche für unsere Ideale zu tun."
SER_why_we_fight:0	"Warum wir kämpfen"
SER_why_we_fight_effect:0	"Wenn wir nicht den Geist der §Neutralen Außenpolitik§! haben, können wir Fraktionen schaffen.\n"
SER_why_we_fight_desc:0	"Die Welt wird immer unsicherer. Unser Volk muss sehen, welche Gräueltaten diejenigen begehen, die nach Macht streben. Wir werden die Menschen für unsere Sache mobilisieren und sicherstellen, dass jeder bereit ist, für unsere Freiheit zu kämpfen."
SER_political_commissars:0	"Politische Kommissare"
SER_political_commissars_desc:0	"Um sicherzustellen, dass unsere Politik in der militärischen Praxis befolgt wird, werden wir politisch ernannte Beamte in die militärischen Ränge einführen."
SER_organized_partizans:0	"Organisierte Partisanen"
SER_organized_partizans_desc:0	"Um der Bedrohung durch eine Invasion begegnen zu können, müssen wir im Vorfeld Widerstandszellen organisieren. Diese Gruppen werden Verstecke vorbereiten, potenzielle Abwurfplätze vorbereiten und Einheimische rekrutieren, um Informationen zu sammeln. All diese Bemühungen werden dafür sorgen, dass ein Maximum an Druck auf die Rückseite der feindlichen Linien ausgeübt wird."
SER_internationalism_focus:0	"Internationalismus im Fokus"
SER_internationalism_focus_desc:0	"Ideologie kennt keine Grenzen. Eine andere Nation mag sich souverän nennen, aber unsere Überzeugungen stehen über solchen Ansprüchen."
SER_nationalism_focus:0	"Nationale Rettung"
SER_nationalism_focus_desc:0	"In den vergangenen Jahrzehnten war Serbien ein Teil des jugoslawischen Staates, zu dem viele Minderheiten des Balkans wie die Bosnier und Slowenen gehörten, aber diesen Staat gibt es nicht mehr, von nun an werden wir den Balkan als stolze Nation Serbien regieren!"
SER_ideological_fanaticism_communism:0	"Ideologischer Fanatismus"
SER_ideological_fanaticism:0	"Ideologischer Fanatismus"
SER_ideological_fanaticism_desc:0	"Unsere politisch etablierten Werte und Ziele sind es ebenso wert, für sie zu sterben wie jeder alte Glaube. Jeder Anhänger sollte bereit sein, dem Tod ins Auge zu sehen, und diejenigen, die abtrünnig werden, sollten besser auf den Tod vorbereitet sein."
SER_anti_partizan_tactics:0	"Anti-Parteien-Taktik"
SER_anti_partizan_tactics_desc:0	"Die Partisanen müssen bekämpft und aus ihren Bergen vertrieben werden. Um den Kampf in das Herz des Landes unter ihrer Kontrolle zu bringen, müssen regelmäßige Patrouillen die Dörfer sichern, und wir müssen Informationen von loyalen Einheimischen sammeln. Wir haben keine andere Wahl, wenn wir die Kommunisten schlagen und diesen Kampf ein für alle Mal gewinnen wollen."
SER_faithful_ally:0	"Ein treuer Verbündeter"
SER_faithful_ally_desc:0	"Mit unserem Engagement bei der Verteidigung unseres Bodens und dem Blut, das wir für die gemeinsame Sache eines europäischen Sieges gegen den Judentum-Bolschewismus vergossen haben, haben wir es verdient, als tatsächliches Mitglied der Achsenmächte anerkannt zu werden. Erleichtert wurde dies durch die brillante Arbeit unserer Phrenologen, die bewiesen haben, dass wir im Gegensatz zu diesen dreckigen Serben die direkten Nachkommen der Arier sind, die in den Süden eingewandert sind."
SER_catholic_dominance_focus:0	"Katholische Vorherrschaft"
SER_catholic_dominance_focus_desc:0	"Jahrhundertelang wurden die Kroaten von den Lehren der römisch-katholischen Kirche geleitet. Seit unserer Zwangsvereinigung mit Serbien sind viele aus persönlichem Gewinnstreben zur Orthodoxie übergetreten. Das muss aufhören, denn jeder Christ [CRO.GetAdjective] muss die Autorität Seiner Heiligkeit des Papstes akzeptieren."
SER_secularism_focus:0	"Säkularismus"
SER_secularism_focus_desc:0	"Der Glaube darf sich in keiner Weise in die Angelegenheiten des Staates einmischen. Er sollte eine rein private Angelegenheit sein, und religiöses Personal muss vom Betreten der politischen Arena ausgeschlossen werden."
SER_integrate_muslim_croats_focus:0	"Muslimische Kroaten integrieren"
SER_integrate_muslim_croats_focus_desc:0	"Muslime mögen einer anderen Religion angehören, aber sie sind dennoch Teil der Nation und sollten als Kroaten voll akzeptiert werden."
SER_bosnian_muslim_conscription_focus:0	"Einberufung bosnischer Muslime"
SER_bosnian_muslim_conscription_focus_desc:0	"Da die in Bosnien lebenden Muslime Kroaten sind, müssen sie an der Seite ihrer ethnischen Brüder in der Armee dienen."
SER_integrate_orthodox_croats_focus:0	"Integrieren Sie orthodoxe Kroaten"
SER_integrate_orthodox_croats_focus_desc:0	"Wir haben zwar die orthodoxen Kroaten schlecht behandelt. Aber wir müssen anerkennen, dass, auch wenn die guten Kroaten Mitglieder der heiligen römisch-katholischen und apostolischen Kirche sind, Kroaten, die zur Religion der Serben übergetreten sind, dennoch Kroaten sind und in die nationale Gemeinschaft integriert werden müssen."
SER_deny_citizenship_to_muslims_focus:0	"Verweigerung von Rechten für Muslime"
SER_deny_citizenship_to_muslims_focus_desc:0	"Der Katholizismus ist das Kernelement der kroatischen Identität und Muslime, die vorgeben, Kroaten zu sein, haben es nicht verdient, unter uns zu sein."
SER_integrate_religious_minorities_focus:0	"Religiöse Minderheiten integrieren"
SER_integrate_religious_minorities_focus_desc:0	"Unser Land ist die Heimat religiöser Minderheiten und sie sollten in ihren Eigenheiten respektiert werden."
SER_a_king_for_our_people_focus:0	"Ein König für unser Volk"
SER_a_king_for_our_people_focus_desc:0	"Um die Größe des freien kroatischen Königreichs der Vergangenheit wiederherzustellen, müssen wir einen König wählen, der das erneuerte kroatische Volk führen wird."
SER_saviour_of_serbia:0	"Der Überbringer des Heils"
SER_saviour_of_serbia_desc:0	"Der Bringer des Heils"
SER_secure_flanks:0	"Rückeroberung Mazedoniens und Montenegros"
SER_secure_flanks_desc:0	"Rückeroberung Mazedoniens und Montenegros"
SER_advance_north:0	"Rückeroberung des Staates CSS"
SER_advance_north_desc:0	"Rückeroberung des Staates CSS"
SER_join_axis:0	"Verbündeter Deutschland"
SER_join_axis_desc:0	"Verbündete Deutschland."
SER_belgrade_investments_focus:0	"Investitionen in Belgrad"
SER_belgrade_investments_focus_desc:0	"Belgrad ist unsere Hauptstadt und ein wichtiges Industriezentrum, es muss im Zentrum unserer Industriepolitik stehen"
SER_trading_infrastructures:0	"Handelsinfrastrukturen"
SER_trading_infrastructures_desc:0	"Der Weg über das Meer ist der Weg nach vorne. Durch den Ausbau der Häfen an der dalmatinischen Küste werden wir unsere Exporte steigern."
SER_industrial_support:0	"Industrielle Unterstützung"
SER_industrial_support_desc:0	"Wir müssen die Unterstützung der Industriellen gewinnen, um sie zu überzeugen, für das Gemeinwohl der Gesellschaft zu arbeiten."
SER_economic_optimization:0	"Wirtschaftliche Optimierung"
SER_economic_optimization_desc:0	"Einige Sektoren unseres militärisch-industriellen Sektors werden schlecht verwaltet, und wir müssen sie reformieren, um ihre Produktivität zu steigern."
SER_research_grants:0	"Zuschüsse für die Forschung"
SER_research_grants_desc:0	"Wir könnten schneller neue Ausrüstung für unsere Streitkräfte entwickeln, wenn wir Ingenieurbüros finanzieren würden."
SER_yugoslav_scientific_cooperation:0	"Jugoslawische wissenschaftliche Zusammenarbeit"
SER_form_peasant_councils:0	"Bauernrat gründen"
SER_form_peasant_councils_desc:0	"Die Bauern werden seit Jahren überall im Land unterdrückt. Wenn wir sie ermutigen, sich unter unserer ideologischen Führung zusammenzuschließen und zu organisieren, würden wir viele neue Unterstützer gewinnen."
SER_recreate_yugoslavia:0	"Jugoslawien wiederherstellen"
SER_economic_centralization:0	"Wirtschaftliche Zentralisierung"
SER_economic_centralization_desc:0	"Wir müssen die Wirtschaft vollständig umstrukturieren, damit das Proletariat die Macht übernehmen kann."
SER_nationalize_factories:0	"Verstaatlichung der Fabriken"
SER_nationalize_factories_desc:0	"Die Industrialisierung ist der Weg in die Zukunft, und die Kapitalisten behindern sie, indem sie die Arbeitskraft des Proletariats ausbeuten. Um das wahre Potenzial des Proletariats zu entfesseln, müssen wir die bösartigen und unterdrückerischen Kapitalisten von ihrem wirtschaftlichen Einfluss befreien."
SER_local_steel_production:0	"Lokale Stahlproduktion"
SER_local_steel_production_desc:0	"Es ist unerlässlich, unsere Kriegsindustrie durch die Produktion von Stahl vor Ort zu unterstützen. Wir müssen diesen Beschluss des Politischen Zentralkomitees der Kommunistischen Partei auf jede erdenkliche Weise umsetzen."
SER_local_militias:0	"Lokale Milizen"
SER_local_militias_desc:0	"Die Kämpfer der Bauernräte müssen mobilisiert und bewaffnet werden, um das Rückgrat einer ideologisch loyalen Armee zu bilden."
SER_state_guard_tooltip:0	"Es werden 3 Divisionen der Staatsgarde gebildet"
SER_integrate_montenegro:0	"Montenegro integrieren"
