SAM_tumua_and_pule:0			"Tumua ma Pule"
SAM_tumua_and_pule_desc:0			"Die Tumua ma Pule sind für die Wahl eines Königs unerlässlich und bilden das Herzstück der samoanischen Politik, solange Samoa eine Monarchie ist. Es ist besser, sie zu besänftigen, als sie herauszufordern."
SAM_cacao_industry:0			"Cash Crops"
SAM_cacao_industry_desc:0			"Samoas Hauptexportgüter sind Kakao und Kopra. Obwohl sich Samoa als idealer Ort für den Anbau dieser Produkte erweist, befinden sich viele, wenn nicht sogar alle Plantagen in ausländischem Besitz, meist von großen Konzernen oder reichen europäischen Kapitalisten... Die Verstaatlichung der Plantagen könnte auch zu Problemen mit den Besitzern der Plantagen und ihren Herkunftsländern führen."
new_zealand.11.t:0			"Goodwill-Mission"
new_zealand.11.d:0			"Kürzlich hat eine 'Goodwill Mission' in Apia, Samoa, die Mau als legitime politische Organisation anerkannt, die Samoan Offenders Ordinance wurde aufgehoben und Olaf Nelsons Exil wurde widerrufen. Mit all diesen Fortschritten ist es vielleicht an der Zeit, mit der schrittweisen Errichtung eines unabhängigen samoanischen Staates zu beginnen."
new_zealand.11.a:0			"Sie sind noch nicht so weit."
new_zealand.11.b:0			"Die Zeit ist reif."
new_zealand.11.c:0			"Die Zeit ist reif. (Spielen Sie als Samoa)"
samoa.1.t:0			"Samoanische Unabhängigkeit"
samoa.1.desc:0			"Nach einem schrittweisen Prozess der Staatsgründung haben wir endlich unsere lang ersehnte Unabhängigkeit erreicht. Es ist an der Zeit, dass wir entscheiden, wer das Land führen soll."
samoa.1.a:0			"Die Monarchie hat uns im Stich gelassen!"
samoa.1.b:0			"Die Monarchie hat das getan, was das Beste für Samoa war."
samoa.2.t:0			"[SAM.GetNameDef] Wünsche [1088.GetName]"
samoa.2.desc:0			"Samoa möchte sein Volk unter einem Land vereinen. Mit dem Vertrag über die Abtretung von Manu'a und der Abtretungsurkunde von Tutuila haben wir den östlichen Teil Samoas annektiert und ihn bis jetzt als Territorium behalten, wo wir die Wahl haben, ihn der samoanischen Nation und dem samoanischen Volk zurückzugeben oder ihn als unser Territorium zu behalten."
samoa.2.a:0			"Geben Sie ihnen ihre Inseln zurück."
samoa.2.b:0			"Der Vertrag muss aufrechterhalten werden!"
samoa.3.t:0			"Samoa bittet um [643.GetName]"
samoa.3.desc:0			"Im Rahmen seiner jüngsten Politik für ein vereintes Polynesien hat Samoa versucht, [643.GetName] zu erhalten."
samoa.3.a:0			"Was gibt es hier zu verlieren?"
samoa.3.b:0			"Versuchen Sie wieder, unsere Inseln zu erobern, hm?"
samoa.4.t:0			"Samoa bittet [734.GetName]"
samoa.4.desc:0			"Im Rahmen der jüngsten Politik Samoas für ein vereinigtes Polynesien haben sie versucht, [734.GetName] zu erhalten."
samoa.4.a:0			"Sie scheinen vielversprechend zu sein."
samoa.4.b:0			"Tonga wird nicht verloren sein!"
samoa.5.t:0			"Samoa bittet um [641.GetName]"
samoa.5.desc:0			"Im Rahmen der jüngsten Politik Samoas für ein vereintes Polynesien haben sie versucht, [641.GetName] zu erhalten."
samoa.5.a:0			"Sie scheinen vielversprechend."
samoa.5.b:0			"Tahiti für die Tahitianer!"
samoa.6.t:0			"Samoa bittet um [636.GetName]"
samoa.6.desc:0			"Im Rahmen der jüngsten Politik Samoas für ein vereintes Polynesien haben sie sich um [636.GetName] bemüht."
samoa.6.a:0			"Sie scheinen vielversprechend."
samoa.6.b:0			"Fidschi für die Fidschianer!"
samoa.7.t:0			"Samoa bittet um [629.GetName]"
samoa.7.desc:0			"Im Rahmen der jüngsten Politik Samoas für ein vereinigtes Polynesien haben sie versucht, [629.GetName] zu erhalten."
samoa.7.a:0			"Sie scheinen vielversprechend zu sein."
samoa.7.b:0			"Sollen sie doch kommen."
samoa_result.1.t:0			"[PREV.GetNameDef] Nimmt unsere Bitte an!"
samoa_result.1.desc:0			"[PREV.GetNameDef] Hat uns unser gewünschtes Territorium gegeben. Ein Schritt näher zur Vereinigung dieser Region!"
samoa_result.1.a:0			"Nun, das war einfach."
samoa_result.2.t:0			"[PREV.GetNameDef] Lehnt unsere Bitte ab!"
samoa_result.2.desc:0			"[PREV.GetNameDef] Hat unsere Forderungen abgelehnt. Vielleicht sollten wir Gewalt anwenden."
samoa_result.2.a:0			"Wir werden zurückkehren."
samoa_coup.1.t:0			"Tumua ma Pule starten einen Coup!"
samoa_coup.1.desc:0			"Die Tumua ma Pule sind die höchste Autorität in Samoa. Sich ihnen zu widersetzen, würde für alle Beteiligten nicht gut ausgehen. /Auch wenn wir nicht die Absicht hatten, ihre Autorität zu stürzen oder einzuschränken, sehen sie uns aufgrund unserer Politik gegen die Monarchie, das traditionelle politische System Samoas, als Feind an und haben einen Putsch gestartet, um unser Regime zu stürzen, der mit der Unterstützung des Volkes schnell erledigt wurde."
samoa_coup.1.a:0			"Tupua Tamasese scheint eine gute Wahl zu sein."
samoa_coup.1.b:0			"Mata'afa Faumina ist ein besserer Kandidat."
