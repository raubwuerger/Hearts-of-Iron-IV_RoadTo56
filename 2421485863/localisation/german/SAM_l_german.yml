samoa_smuggle_stuffs.1.t:0			"Operativer Erfolg!"
samoa_smuggle_stuffs.1.desc:0			"Unsere jüngste Operation zum Schmuggel von Waffen aus [1088.GetName] war ein Erfolg! \Auch wenn wir nicht in der Lage sind, groß angelegte Schmuggeloperationen durchzuführen und nicht so viele Waffen erbeuten können, wie wir gehofft hatten, werden kleinere Operationen genauso gut funktionieren und uns für den Moment mit der richtigen Menge an Ausrüstung versorgen - auch wenn es nicht viel ist."
samoa_smuggle_stuffs.6.t:0			"Operatives Scheitern!"
samoa_smuggle_stuffs.6.desc:0			"Trotz unserer Bemühungen ist es uns nicht gelungen, die Ausrüstung zu erbeuten und unsere Crew wurde auf der Stelle verhaftet."
samoa_smuggle_stuffs.6.a:0			"Also ab nach Hause..."
samoa_fautasi_race.1.t:0			"Fautasi-Rennen!"
samoa_fautasi_race.1.desc:0			"Heute fand das Fautasi Race in Westsamoa statt. Das Fautasi Race wird jedes Jahr am 1. Juli abgehalten, um die Autonomie Samoas von [NZL.GetName] zu feiern, und heute ist dieser Tag. Mal sehen, wer diese Runde gewinnt."
samoa_fautasi_race.1.a:0			"Und der Gewinner ist...?"
SAM_western_puppet:0			"Westliche Marionette"
SAM_smuggle_operations:0			"Schmuggeloperationen"
SAM_smuggle_operations_desc:0			"Samoa verfügt derzeit nicht über die industriellen Kapazitäten, um eigene Waffen zu produzieren. Um dies zu kompensieren, sollten wir versuchen, Waffen durch Schmuggeloperationen aus dem Osten zu beschaffen, wo die amerikanische Garnison einen Teil ihrer Ausrüstung unbewacht und angreifbar zurücklässt. Indem wir diesen Nachschub sichern, können wir unsere Streitkräfte kurzfristig verstärken. "
SAM_smuggle_operation_decision:0			"Starten Sie eine Schmuggelaktion"
SAM_launch_operation_into_pago_pago:0			"Wir werden eine Schmuggelaktion in [1088.GetName] starten und sehen, ob wir unbewachtes Material einsammeln können."
samoa_smuggle_stuffs.success:0			"Schmuggelaktion: Erfolgreich!"
samoa_smuggle_stuffs.failed:0			"Schmuggel-Aktion: Fehlgeschlagen!"
SAM_request_american_samoa:0			"Anfrage an Amerikanisch-Samoa"
SAM_request_american_samoa_desc:0			"Die Amerikaner mischen sich seit dem 19. Jahrhundert in samoanische Angelegenheiten ein und haben ihre Präsenz durch die Unterzeichnung von Verträgen mit den Häuptlingen in Tutila und Manu'a deutlich gemacht, die die Inseln unter amerikanische Kontrolle stellen. \Aber auch wenn sie unter amerikanischer Aufsicht stehen, sind sie immer noch samoanisch und gehören der samoanischen Nation. Wenn wir Glück haben, können wir einen Deal mit den Amerikanern schließen, damit sie uns die Inseln zurückgeben."
