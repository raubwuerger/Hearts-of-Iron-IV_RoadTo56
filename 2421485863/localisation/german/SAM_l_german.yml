SAM_tumua_and_pule:0			"Tumua ma Pule"
SAM_tumua_and_pule_desc:0			"The Tumua ma Pule are essential to electing a king and have been the core of Samoa's politics for as long as Samoa has been a monarchy. It is better to appease them than challenge them."
samoa.1.desc:0			"After a gradual process of establishing our state, we have finally achieved our long-awaited independence. It is time for us to decide who should lead the country."
samoa.2.t:0			"[SAM.GetNameDef] Requests [1088.GetName]"
samoa.2.desc:0			"Samoa wishes to reunite their people under one country. under the Treaty of Cession of Manu'a, and the Deed of Cession of Tutuila, we annexed the Eastern part of Samoa, and kept it as a territory until now, where we have the choice to return it to the Samoan nation and people or to keep it as ours. the ladder may cause unrest in the territory, considering its holy and historic ties to Samoa."
samoa.2.a:0			"Return them their islands."
samoa.2.b:0			"The treaty must be upheld!"
samoa.3.t:0			"Samoa Requests [643.GetName]"
samoa.3.desc:0			"Under Samoa's recent policy of a united Polynesia, they have sought to obtain [643.GetName]"
samoa.3.a:0			"What is to lose here?"
samoa.3.b:0			"Trying to take our islands again, huh?"
samoa.4.t:0			"Samoa Requests [734.GetName]"
samoa.4.desc:0			"Under Samoa's recent policy of a united Polynesia, they have sought to obtain [734.GetName]"
samoa.4.a:0			"They seem promising."
samoa.4.b:0			"Tonga will not be lost!"
samoa.5.t:0			"Samoa Requests [641.GetName]"
samoa.5.desc:0			"Under Samoa's recent policy of a united Polynesia, they have sought to obtain [641.GetName]"
samoa.5.a:0			"They seem promising."
samoa.5.b:0			"Tahiti for Tahitians!"
samoa.6.t:0			"Samoa Requests [636.GetName]"
samoa.6.desc:0			"Under Samoa's recent policy of a united Polynesia, they have sought to obtain [636.GetName]"
samoa.6.a:0			"They seem promising."
samoa.6.b:0			"Fiji for the Fijians!"
samoa.7.t:0			"Samoa Requests [629.GetName]"
samoa.7.desc:0			"Under Samoa's recent policy of a united Polynesia, they have sought to obtain [629.GetName]"
samoa.7.a:0			"They seem promising."
samoa.7.b:0			"Let them come."
samoa_result.1.t:0			"[PREV.GetNameDef] Accepts Our Request!"
samoa_result.1.desc:0			"[PREV.GetNameDef] Has given us our desired territory. one step closer to uniting this region!"
samoa_result.1.a:0			"Well that was easy."
samoa_result.2.t:0			"[PREV.GetNameDef] Rejects Our Request!"
samoa_result.2.desc:0			"[PREV.GetNameDef] Has rejected our demands. maybe we should use force."
samoa_result.2.a:0			"We will return."
samoa_coup.1.t:0			"Tumua ma Pule Launch a Coup!"
samoa_coup.1.desc:0			"The Tumua ma Pule are the highest authorities in Samoa. defying would not turn out great for everyone involved. /nWhilst we may have not had intentions to overthrow or limit their authority, they see us as an enemy due to our policies against the monarchy, the traditional political system of Samoa, and have launched a coup to overthrow our regime. which, with the support of the people, was dealt with quickly. now with the Tumua and Pule in control of the government, who should be the new leader?"
samoa_coup.1.a:0			"Tupua Tamasese seems like a good pick."
samoa_coup.1.b:0			"Mata'afa Faumina is a better candidate."
SAM_goodwill_mission:0			"Mission des guten Willens"
SAM_a_divided_samoa:0			"Ein geteiltes Samoa"
SAM_cacao_industry:0			"Cash Crops"
SAM_cacao_industry_desc:0			"Samoas Hauptexportgüter sind vor allem Kakao und Kopra. Obwohl sich Samoa als idealer Ort für den Anbau dieser Produkte erweist, befinden sich viele, wenn nicht sogar alle Plantagen in ausländischem Besitz, meist von großen Konzernen oder reichen europäischen Kapitalisten... Die Verstaatlichung der Plantagen könnte auch zu Problemen mit den Besitzern der Plantagen und ihren Herkunftsländern führen."
new_zealand.11.t:0			"Goodwill-Mission"
new_zealand.11.d:0			"Kürzlich hat eine 'Goodwill-Mission' in Apia, Samoa, die Mau als legitime politische Organisation anerkannt, die Samoan Offders Ordinance wurde aufgehoben und Olaf Nelsons Exil wurde widerrufen. Mit all diesen Fortschritten ist es vielleicht an der Zeit, mit der schrittweisen Gründung eines unabhängigen samoanischen Staates zu beginnen."
new_zealand.11.a:0			"Sie sind noch nicht so weit."
new_zealand.11.b:0			"Die Zeit ist reif."
new_zealand.11.c:0			"Die Zeit ist reif. (Spielen Sie als Samoa)"
samoa.1.t:0			"Samoanische Unabhängigkeit"
samoa.1.a:0			"Die Monarchie hat uns im Stich gelassen!"
samoa.1.b:0			"Die Monarchie hat getan, was das Beste für Samoa war."
mau_movement:0			"Mau-Bewegung"
calm_mau_movement:0			"Mau-Bewegung"
