l_german:
RESEARCH_REPLACE_TRANSFER:0	"\n$SAVED|H0$ Tag(e) zuvor gespeicherter Forschung werden auf die neue Technologie übertragen."
RESEARCH_TECH_UNUSED:1	"§GZum Forschen hier klicken§!\nInnerhalb von 56 Tagen kannst du einen neuen Forschungsbereich auswählen, ohne dass Forschungszeit verloren geht."
tech_recon4_desc:0	"Tiefgreifende Aufklärungsoperationen, die Spionage, Guerilla-Einsätze und Kommando-Training miteinander verbinden, werden unsere taktischen Entscheidungen unterstützen und es uns ermöglichen, unsere Entscheidungsfindung schnell anzupassen."
air_techs_folder_desc:0	"Flugzeuge."
rangers_tech_desc:0	"Indem wir uns auf den Kampf im Wald spezialisieren und unsere leichte Infanterie darin trainieren, sich an Gelände und Vegetation anzupassen, können wir mit weniger Truppen bestimmte Frontabschnitte halten oder sogar feindliche Linien durchbrechen, wo man uns am wenigsten erwartet."
radio_detection:0	"Funkortung"
modern_oil_processing_desc:1	"Unsere Ölraffinerien können durch neue, fortschrittliche Ölverarbeitungsmethoden wie Hydrocracking, Alkylierung, Mercaptan-Oxidation und Isomerisierung weiter verbessert werden."
advanced_rubber_processing_desc:1	"Eine Allzweck-Rezeptur für synthetischen Kautschuk mit verbesserten Verfahren wie Dodecylmercaptan-Polymerisationsmodifikatoren wird es uns ermöglichen, die Produktion von synthetischem Kautschuk auszuweiten."
miniature_fighters_desc:	"Mit kleineren Kampfflugzeugen werden wir in der Lage sein, mehr davon in die Schlacht zu bringen, ohne dabei viel Feuerkraft einzubüßen, und gleichzeitig das Gewicht der Ladung des Mutterschiffs zu reduzieren."
basic_encryption:1	"Verschlüsselung – Polyalphabetische Chiffren"
improved_decryption_desc:0	"Die Entwicklung leistungsfähigerer Computer ermöglicht neue Anwendungen von Kryptoanalyse-Methoden wie der Differenzierung, die in Kombination mit neuen manuellen Entschlüsselungsmethoden zum Knacken fortschrittlicher Chiffren eingesetzt werden können."
carrier_battlegroups_desc:0	"Träger können den Feind aus größerer Entfernung angreifen als jede Marinekanone, und mit unseren Augen am Himmel werden wir niemals überrascht werden. Eine große Anzahl von Trägern ist eine Macht, mit der man rechnen muss."
DESPERATE_DEFENSE_LABEL:0	"FLEXIBLE STRUKTUR"
DESPERATE_DEFENSE_LABEL_TT:0	"Untergebene erhalten angemessene Anleitung und werden darauf trainiert, selbstständig zu handeln."
BATTLEFIELD_SUPPORT_DESC:1	"Indem wir die Zusammenarbeit zwischen der Luftnahunterstützung und den Divisionen verbessern, können wir feindliche Divisionen mit optimaler Unterstützung vernichten."
OPERATIONAL_INTEGRITY_DESC:0	 "Taktische Bomber sind flexibel und können sowohl Bodenunterstützung als auch reguläre Bombardements durchführen."
cl_tech:1	"Modelle leichter Kreuzer"
ca_tech:1	"Modelle schwerer Kreuzer"
JET_ENGINES_RESEARCHED:0	"Ermöglicht die Erforschung von Technologien, die Strahltriebwerke erfordern, wie z. B. Düsenflugzeuge"
degaussing_desc:0	"Durch den Einbau leistungsstarker elektromagnetischer Spulen lässt sich die magnetische Signatur eines Schiffes drastisch reduzieren, wodurch es weitaus weniger anfällig für Magnetminen wird."
homing_torpedo_desc:0	"Ausgestattet mit einem akustischen Detektor kann der Torpedo die größte Geräuschquelle vor sich anpeilen – in der Regel das Ziel."
