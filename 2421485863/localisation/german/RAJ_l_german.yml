r56_south_asia_sikh_lion_recruitment_desc:0	"Die Lions of the Great War waren eine Gruppe von Sikh-Bataillonen, die während des Großen Krieges hauptsächlich auf dem afrikanischen Kontinent kämpften und oft ihre traditionellen Waffen trugen. In ihrem Geiste werden wir eine neue Generation tapferer Sikhs rekrutieren."
