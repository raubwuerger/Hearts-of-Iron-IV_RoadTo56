raj_prince_military_practice:0	"Schaltet Entscheidungen zur gewaltsamen Annexion der Fürstenstaaten frei."
nam_intro_tt:0	"Geeignete Länder werden eingeladen, unserem neuen, bündnisfreien Machtblock beizutreten."
asian_anti_colonialism_tt:0	"Reduziert die §CCompliance§! in den asiatischen Staaten in europäischem Besitz."
anti_colonialism_tt:0	"Wird die §CCompliance§! in den Kolonialstaaten in europäischem Besitz verringern."
RAJ_Revised_Taxation:0	"Revidierte Besteuerung"
raj_linlithgow_assemble_cabinet_tt:0	"Wir werden damit beginnen, ein §YCabinet§! zusammenzustellen."
imperial_conference_attended:0	"Teilnahme an der Imperialen Konferenz"
conference_members_get_tt:0	"[ENG.GetNameDefCap] und alle seine Herrschaftsgebiete vorübergehend erhalten: "
RAJ_Reinvigorated_Imperial_Shipping:0	"Wiederbelebung der imperialen Schifffahrt"
RAJ_Expanding_the_Indian_Air_Force:0	"IAF-Ausbau"
RAJ_Expanding_the_Indian_Air_Force_desc:0	"Die indische Luftwaffe steigert derzeit die Pilotenausbildung und die Flugzeugproduktion, um den Himmel über dem Subkontinent zu säubern."
RAJ_Caste_Debuff_4:0	"Segregationistisches Kastensystem"
RAJ_Caste_Debuff_4_desc:0	"Spielerischer Moment"
RAJ_Caste_Debuff_3:0	"Kastensystem"
RAJ_Caste_Debuff_3_desc:0	"Einige Versionen des Kastensystems gibt es schon seit dem alten Indien, aber es wurde im Laufe der Zeit umgestaltet, um dem aktuellen Kaiser von Indien besser zu passen und das britische Raj ist da keine Ausnahme. Ganz im Gegenteil, das Kastensystem wurde von der britischen Verwaltung klar definiert und weithin angewendet. Es durchdringt alle Aspekte der indischen Gesellschaft, von der Beschränkung des Zugangs zu den Universitäten bis hin zum hochgradig planmäßigen und restriktiven Militär. Einige betrachten es als unmoralisches Übel, andere sehen es als logische Organisation der Gesellschaft."
RAJ_Caste_Debuff_3_mit:0	"Abgeschwächtes Kastensystem"
RAJ_Caste_Debuff_3_mit_desc:0	"Die schlimmsten Auswüchse des Kastensystems wurden eingedämmt, obwohl die Ungleichheiten zwischen den Gemeinschaften und sozialen Klassen immer noch weit verbreitet sind."
RAJ_Caste_Debuff_2:0	"Reformiertes Kastensystem"
RAJ_Caste_Debuff_2_desc:0	"Die Abschaffung des Kastensystems in einer so traditionalistischen Gesellschaft wie dieser ist ein hartes Stück Arbeit, aber ein ständiger Fortschritt in Richtung Gleichberechtigung wird unweigerlich zu einem besseren Ende führen."
RAJ_Caste_Debuff_1:0	"Gesetzlich abgeschafftes Kastensystem"
RAJ_Caste_Debuff_1_desc:0	"Trotz allen Widerstands und aller Proteste haben wir endlich die vollständige rechtliche Gleichstellung erreicht und werden sie mit aller notwendigen Willenskraft durchsetzen."
RAJ_Caste_Buff:0	"Vollständig abgeschafftes Kastensystem"
RAJ_Caste_Buff_desc:0	"Rechtliche Gleichstellung ist schön und gut, aber aufgrund der jahrhundertelangen Diskriminierung sind viele Stadtviertel immer noch verarmt und werden es schwer haben, sich daraus zu befreien. Deshalb sind positive Maßnahmen für diese Gemeinschaften die einzige moralische Option."
RAJ_Establishing_National_Government:0	"Aufbau einer nationalen Regierung"
RAJ_Expanded_Police_Force:0	"Erweiterte Polizeikräfte"
