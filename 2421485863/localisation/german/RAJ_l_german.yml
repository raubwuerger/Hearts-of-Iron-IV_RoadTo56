RAJ_generic_motorized_equipment_manufacturer:0	"Premier Automobile"
RAJ_generic_medium_aircraft_manufacturer:0	"Hindustan Motoren"
RAJ_munger_gun_factory:0	"Munger Waffenfabrik"
RAJ_assam_oil_company:0	"Assam Öl Gesellschaft"
RAJ_sarojini_naidu:0	"Sarojini Naidu"
sarojini_naidu_enable:0	"Sarojini Naidu ist ins Kabinett berufen worden"
raj_election_over:0	"Die §YElection§! ist abgeschlossen"
raj10stab:0	"Gewinnen Sie Basisstabilität §G+10.00%§! nach der Wahl."
raj_draft_expansion:0	"Entwurf der Erweiterung"
India_Political:0	"Indischer Fokusbaum"
RAJ_Reinforce_the_Government_of_India_Act:0	"Durchsetzung des Government of India Act"
RAJ_Reinforce_the_Government_of_India_Act_desc:0	"Der Government of India Act von 1935 war ein Meilenstein bei der strukturellen Wiederherstellung des Raj und wir werden ihn als solchen durchsetzen."
RAJ_Linlithgows_Reign:0	"Linlithgow's Herrschaft"
RAJ_Linlithgows_Reign_desc:0	"Das Amt des indischen Generalgouverneurs wurde in den letzten fünf Jahren von Lord Willingdon bekleidet. Die britische Regierung beschloss, Lord Linlithgow zu ernennen und Willingdon in den Ruhestand zu schicken. Die Oppositionsparteien des Raj sehen darin eine Stagnation und lehnen eine Zusammenarbeit zunehmend ab. Wenn wir diesen Kurs noch lange fortsetzen, könnte das indische Volk zu Gewalt greifen. Wenn wir die Oppositionsparteien gegeneinander ausspielen, könnten wir allerdings die Oberhand gewinnen."
RAJ_Provincial_Elections:0	"Wahlen in den Provinzen"
RAJ_Provincial_Elections_desc:0	"Mit dem Beginn der ersten indischen Parlamentswahlen stehen allen Parteien, die daran teilnehmen, viele Monate harter Wahlkämpfe bevor."
RAJ_assert_control_over_lhoyu:0	"Kontrolle über [434.GetName] ausüben"
RAJ_Independent_Labour_Party:0	"Unabhängige Arbeiterpartei"
RAJ_Independent_Labour_Party_desc:0	"Unsere oberste Priorität muss es sein, Fairness in Indien zu schaffen und das Kastensystem zu zerstören."
RAJ_Indian_National_Congress:0	"Indischer Nationalkongress"
RAJ_Indian_National_Congress_desc:0	"Wir müssen uns alle vereinen, um uns von der britischen Herrschaft zu befreien."
RAJ_Unionist_Party:0	"Unionistische Partei"
RAJ_Unionist_Party_desc:0	"Nur mit sorgfältigen und kalkulierten politischen Maßnahmen können wir Indien stabil halten."
RAJ_Prepare_the_Lucknow_Session:0	"Bereiten Sie die Lucknow-Sitzung vor"
RAJ_Prepare_the_Lucknow_Session_desc:0	"Wir müssen alle Kongressmitglieder versammeln, um die vor uns liegenden Herausforderungen zu diskutieren."
RAJ_Secure_Rural_Hindus:0	"Ländliche Hindus sichern"
RAJ_Secure_Rural_Hindus_desc:0	"Ländliche Hindus sind seit der Gründung des Kongresses wichtige Unterstützer."
RAJ_Broaden_our_Coalition:0	"Verbreitern Sie unsere Koalition"
RAJ_Broaden_our_Coalition_desc:0	"Nur wenn wir neue Gesichter in den Kongress bringen, können wir den Sieg erringen."
RAJ_Nehrus_Campaign:0	"Nehrus Kampagne"
RAJ_Nehrus_Campaign_desc:0	"Wir müssen Mittel sammeln, um Nehrus Operation zu unterstützen."
RAJ_An_Offer_for_Rajagopalachari:0	"Ein Angebot für Manohar"
RAJ_An_Offer_for_Rajagopalachari_desc:0	"Wir können sicherlich Unterstützung sammeln, wenn wir ihm nach der Wahl einen Kabinettsposten anbieten."
RAJ_Azads_Support:0	"Raisman's Unterstützung"
RAJ_Azads_Support_desc:0	"Raisman ist zwar ein Loyalist des Raj und hat ihm treu gedient, aber er hätte sicherlich kein Problem damit, für ein unabhängiges Indien zu dienen und seine Fähigkeiten in einem neuen Subkontinent unter Beweis zu stellen."
RAJ_Nehrus_Candidacy:0	"Nehrus Kandidatur"
RAJ_Nehrus_Candidacy_desc:0	"Der allseits beliebte Jawaharlal Nehru wird den Indian National Congress anführen müssen, wenn wir das Gesicht des Sieges sehen wollen"
RAJ_New_Leadership:0	"Siphon von der CSP"
RAJ_New_Leadership_desc:0	"Die Sozialistische Kongresspartei gilt als der 'radikale' Flügel des Indischen Nationalkongresses, dem viele Sozialisten angehören, die sich anscheinend auf die Seite des Opportunismus geschlagen und sich einer Partei angeschlossen haben, die aus den Kleinbürgern unserer Länder besteht. Indem wir unsere Rhetorik ihnen gegenüber anheizen, werden wir mit Sicherheit viele ihrer Mitglieder davon überzeugen, sich auf die Seite der Gerechtigkeit zu stellen."
RAJ_Appeal_to_the_Lower_Castes:0	"Appell an die unteren Kasten"
RAJ_Appeal_to_the_Lower_Castes_desc:0	"Obwohl das Wahlrecht für die niederen Kasten eingeschränkt ist, ist es für uns dennoch entscheidend, eine Mehrheit ihrer Stimmen zu erhalten."
RAJ_Subvert_Stalinist_Influence:0	"Appell an die Arbeiter"
RAJ_Subvert_Stalinist_Influence_desc:0	"Unser Hauptwahlziel ist die Zerschlagung des Kastensystems, aber es ist natürlich nicht das einzige unterdrückerische System in der hinduistischen Gesellschaft. Das Verhältnis von Proletariat und Bourgeois, von Arbeitgeber und Arbeitnehmer, ist ein zutiefst ausbeuterisches und muss ebenfalls abgeschafft werden."
RAJ_Pillais_Influence:0	"Der Einfluss von Pillai"
RAJ_Pillais_Influence_desc:0	"P. Krishna Pillai ist ein wertvolles Mitglied der Kommunistischen Partei Indiens und mit seinen Erkenntnissen werden wir in Zukunft eine bessere Strategie verfolgen."
RAJ_Danges_Influence:0	"Der Einfluss von Dange"
RAJ_Danges_Influence_desc:0	"Shripad Amrit Dange, ein Mitbegründer der Kommunistischen Partei Indiens, verfügt über die Erfahrung, die nur wenige haben, und kann für unser Endziel entscheidend sein."
RAJ_Local_Organization:0	"Zusammenarbeit mit dem IIM"
RAJ_Local_Organization_desc:0	"Alle indischen Parteien, die etwas auf sich halten, arbeiten auf das unvermeidliche Ziel der indischen Unabhängigkeit hin und es wäre töricht, die Ausbeutung der Briten gegenüber den Indern zu vergessen. Als geeinter Machtblock kann Indien viel schneller auf die Selbstverwaltung hinarbeiten."
RAJ_Centralize_the_Party:0	"Der revolutionäre Geist"
RAJ_Centralize_the_Party_desc:0	"Wenn wir den kleinbürgerlichen Parteien des indischen Subkontinents die Legitimation geben, uns im Kampf gegen die Ungerechtigkeit ebenbürtig zu sein, und unseren revolutionären marxistischen Geist nicht zum Ausdruck bringen, schaden wir unserem Endziel, einer sozialistischen Gesellschaft, die von Ausbeutung befreit ist."
RAJ_Organize_a_Conference:0	"Die Bombay-Konferenz"
RAJ_Organize_a_Conference_desc:0	"Es gibt viele indische linke Organisationen, aber sie hatten nie wirklich die Möglichkeit, gemeinsam an einem Thema zu arbeiten, aber unser Erfolg kanalisiert die Ziele aller in Indien, die nach Gleichberechtigung streben."
RAJ_A_Society_of_All_Classes:0	"Unteilbares Indien"
RAJ_A_Society_of_All_Classes_desc:0	"Indien, der vielfältige Kontinent, der es ist, kann nicht von denen regiert werden, die nur die Hindus, die Muslime oder gar die Oberschicht vertreten. Es muss kollektiv von einer Koalition aller Kulturen, Sprachen, Ethnien und Kasten regiert werden."
RAJ_Democracy_and_Socialism:0	"Die Demokratie siegt"
RAJ_Democracy_and_Socialism_desc:0	"Die Gründungsvision eines geeinten Indiens kann nur durch ein politisches Mehrparteiensystem mit föderaler Struktur, das die Freiheit in den Mittelpunkt stellt, verwirklicht werden."
RAJ_Assemble_the_Constitutional_Assembly:0	"Die verfassungsgebende Versammlung"
RAJ_Assemble_the_Constitutional_Assembly_desc:0	"Da das britische Raj endlich der Vergangenheit angehört, haben wir nun die Möglichkeit und die Pflicht, an seiner Stelle einen neuen indischen Staat aufzubauen."
RAJ_Strengthen_Liberal_Elements:0	"Liberale Elemente stärken"
RAJ_Strengthen_Liberal_Elements_desc:0	"Während der Indische Nationalkongress und seine sozialistische Ausrichtung Indien ein gutes Stück in die Unabhängigkeit gebracht haben, ist ihre Wirtschaftspolitik für eine Nation, die sich von hundert Jahren Kolonialismus erholt, unhaltbar."
RAJ_Nehrus_Vision_for_India:0	"Nehrus Vision für Indien"
RAJ_Nehrus_Vision_for_India_desc:0	"Jawaharlal Nehru und seine Anhänger im Indischen Nationalkongress haben lange gegen die britische Herrschaft gekämpft und sind siegreich daraus hervorgegangen. Nun wird es natürlich an ihm liegen, Indien durch eine postkoloniale Welt zu führen."
RAJ_Cut_down_on_Tariffs:0	"Zölle abbauen"
RAJ_Cut_down_on_Tariffs_desc:0	"Die indische Wirtschaft wurde von unserem britischen Oberherrn lange Zeit agrarwirtschaftlich geführt, so dass wir vom Weltmarkt weitgehend ausgeschlossen waren, mit Ausnahme der Jute- und Teeexporte. Wir werden uns jetzt wieder in die Weltwirtschaft integrieren, indem wir den Handel mit Indien erleichtern."
RAJ_Relieve_the_Administrative_Burden:0	"Entlasten Sie die Verwaltung"
RAJ_Relieve_the_Administrative_Burden_desc:0	"Durch die Geschäfte der Briten mit den lokalen Prinzen und ihre allgemeine Strategie des Aufteilens und Eroberns wurde die Struktur des britischen Raj immer komplexer. Mit einer neu strukturierten Verwaltung werden wir viel besser auf die Zukunft vorbereitet sein."
RAJ_Thorough_Corruption_Audits:0	"Gründliche Korruptionsprüfungen"
RAJ_Thorough_Corruption_Audits_desc:0	"Ein Merkmal, das auch unter der britischen Herrschaft in Indien sehr ausgeprägt war, war die Korruption. Viele bürokratische Regierungsangestellte errichten häufig künstliche Hindernisse für Geschäfte, um sich selbst zu bereichern. Wir werden die Akten gründlich durchforsten und die schlimmsten Übeltäter finden."
RAJ_Reconect_broken_up_Industries:0	"Aufgebrochene Industrien wieder verbinden"
RAJ_Reconect_broken_up_Industries_desc:0	"Die Abtrennung Indiens war wahrlich keine angenehme Angelegenheit und es gibt immer noch Ressentiments zwischen der pakistanischen und der indischen Bevölkerung. Aber das sollte uns nicht davon abhalten, uns für das Wohlergehen unserer beiden Nationen einzusetzen. Viele Lieferketten wurden unterbrochen, als die Grenze so unvorsichtig gezogen wurde. Eine Erleichterung des Geschäftsverkehrs über unsere Grenze hinweg könnte einige der durch die Teilung zerstörten Industrien entlasten."
RAJ_Loosen_Rupee_Exchange:0	"Lockern Sie den Wechselkurs der Rupie"
RAJ_Loosen_Rupee_Exchange_desc:0	"Die indische Rupie ist derzeit direkt an das Pfund Sterling gekoppelt. Das ist ein wichtiger Faktor für die finanzielle Stabilität, behindert aber die Fähigkeit der indischen Regierung, sich im Ausland Geld zu leihen, was dringend notwendig ist, da wir derzeit ein beträchtliches Handelsdefizit haben. Wenn wir die Kontrolle über die Rupie dem Markt überlassen, werden wir mit dem Wind der Liberalisierung zu neuen Höhen des Wohlstands segeln."
RAJ_Reproachment_with_the_West:0	"Vorwürfe an den Westen"
RAJ_Reproachment_with_the_West_desc:0	"Unsere Beziehungen zu Europa waren in der Vergangenheit offensichtlich nicht allzu angenehm, aber die wirtschaftlichen Vorteile der Zusammenarbeit überwiegen die noch vorhandenen Ressentiments in unserer derzeitigen Regierung."
RAJ_Extensive_Agricultural_Subsidies:0	"Umfassende Subventionen für die Landwirtschaft"
RAJ_Extensive_Agricultural_Subsidies_desc:0	"Der einfache Landwirt ist das Rückgrat Indiens, und obwohl es unser Ziel ist, uns auf eine industrielle Wirtschaft zuzubewegen, sollen die Landarbeiter weiterhin in ihrer wirtschaftlichen Tätigkeit unterstützt werden."
RAJ_Ties_Across_Asia:0	"Verbindungen quer durch Asien"
RAJ_Ties_Across_Asia_desc:0	"Die meisten asiatischen Länder haben eine gemeinsame Erfahrung mit der europäischen Kolonialisierung gemacht. Wir werden diese Gemeinsamkeiten nutzen, um unsere militärische, wirtschaftliche und politische Zusammenarbeit zu fördern."
RAJ_Indo_Soviet_Friendship_Treaty:0	"Indo-[SOV.GetAdjective] Freundschaftsvertrag"
RAJ_Indo_Soviet_Friendship_Treaty_desc:0	"[RAJ_Indo_Soviet_Treaty_Pakistan]Freundschaftliche Beziehungen mit [SOV.GetNameDef] werden nicht nur für die internationale Position von großem Nutzen sein, sondern auch für engere wirtschaftliche Beziehungen mit einer der größten Volkswirtschaften der Welt."
RAJ_Want_Peace_Prepare_for_War:0	"Wenn Sie Frieden wollen, bereiten Sie sich auf den Krieg vor"
RAJ_Want_Peace_Prepare_for_War_desc:0	"Die Welt wird zunehmend gewalttätiger, und wenn wir den Frieden und den Wohlstand unserer Nation sichern wollen, müssen wir darauf vorbereitet sein, sie zu verteidigen. Das bedeutet, dass wir unser Militär stärken, Bündnisse mit anderen Nationen eingehen und wachsam gegenüber Bedrohungen unserer Sicherheit sein müssen. Nur wenn wir auf den Krieg vorbereitet sind, können wir wirklich hoffen, Frieden zu erreichen."
RAJ_war_preparation:0	"Vorbereitung auf den Krieg"
RAJ_Foster_Mining_Jobs:0	"Förderung von Arbeitsplätzen im Bergbau"
RAJ_Foster_Mining_Jobs_desc:0	"Um den ländlichen Gemeinden Indiens Entwicklung zu bringen, werden wir mehrere Bergbauindustrien auf dem Lande fördern, um Wohlstand zu schaffen, wo er lange gefehlt hat."
RAJ_Indo_Soviet_Friendship_Treaty_pakistan:0	"Da die Ausrichtung Pakistans immer unsicherer wird, müssen wir darauf vorbereitet sein, internationale Unterstützung zu erhalten, um unsere Position auf dem Subkontinent zu stärken. "
RAJ_Federalize_Education:0	"Bildung föderalisieren"
RAJ_Federalize_Education_desc:0	"Wir werden einen gemeinsamen Lehrplan für alle indischen Schulen einführen, so dass jeder Inder unabhängig von seiner ethnischen Zugehörigkeit, Religion oder Sprache ein gemeinsames Verständnis von der Welt hat."
RAJ_Reform_the_Rupee:0	"Reform der Rupie"
RAJ_Reform_the_Rupee_desc:0	"Wir haben ein Jahrhundert lang für die Unabhängigkeit von Großbritannien gekämpft, trotzdem ist die indische Rupie immer noch direkt an das Pfund Sterling gebunden. Wir werden den Wechselkurs stattdessen an die aufstrebenden Weltwährungen wie Yen, Dollar und Rubel koppeln."
RAJ_Constitutional_Minority_Protections:0	"Verfassungsmäßiger Schutz von Minderheiten"
RAJ_Constitutional_Minority_Protections_desc:0	"Indien ist als der wohl vielfältigste und lebendigste Subkontinent ein Land, in dem es in jeder Region bedeutende sprachliche, religiöse und ethnische Minderheiten gibt. Die Gewährleistung ihrer Sicherheit und ihres Wohlstandes sichert dies nur für ganz Indien."
RAJ_Crackdown_on_Radicalism:0	"Hartes Durchgreifen gegen Radikalismus"
RAJ_Crackdown_on_Radicalism_desc:0	"Der Kampf ist vorbei, Indien ist unabhängig. Einige Menschen haben das vielleicht nicht erkannt, denn es gibt immer noch Dutzende von revolutionären Organisationen mit Millionen von Anhängern. Wir werden diese Menschen in unser gemeinsames Forum der Demokratie zurückholen und unsere Zukunft gemeinsam schmieden."
RAJ_India_United_under_Britain:0	"Indien vereint unter Großbritannien"
RAJ_India_United_under_Britain_desc:0	"Wir bleiben im Gegensatz zu den anderen politischen Parteien, die um die radikalsten und utopischsten Gesellschaften wetteifern, mit einer ausgewogenen und ruhigen Strategie dabei, Indien voranzubringen."
RAJ_Ally_with_the_Muslim_League:0	"Verbündet mit der Muslimliga"
RAJ_Ally_with_the_Muslim_League_desc:0	"Indem wir ein separates Pakistan versprechen, können wir die Unterstützung der AIML gewinnen und gemeinsam die Sozialisten bekämpfen."
RAJ_Fight_the_Muslim_League:0	"Bekämpfen Sie die Muslimische Liga"
RAJ_Fight_the_Muslim_League_desc:0	"Die Idee der Muslim-Liga, einen separaten muslimischen Staat zu gründen, muss aus den Köpfen der Menschen verbannt werden."
RAJ_Siphon_Congress_Ministers:0	"Die Unterstützung des Kongresses abschöpfen"
RAJ_Siphon_Congress_Ministers_desc:0	"Es gibt viele im Kongress, denen die sozialistische Politik ein wenig zu weit geht. Vielleicht können wir sie mit ein wenig Wahlkampf umstimmen."
RAJ_Appeal_to_Anglo_Indians:0	"Appellieren Sie an die Anglo-Inder"
RAJ_Appeal_to_Anglo_Indians_desc:0	"Die Anglo-Inder des Subkontinents sind eine lange Zeit von indischen und britischen Politikern vernachlässigte Minderheit, die wir nutzen können, um ihre Stimmen zu gewinnen."
RAJ_Content_for_British_Rule:0	"Inhalt für britische Herrschaft"
RAJ_Content_for_British_Rule_desc:0	"Wir können kein stabiles Indien mit einer radikalen Führung aufbauen, die in ihrem zukünftigen Handeln unberechenbar ist und nur den Kern Indiens zerstören wird."
RAJ_Establish_a_Precense_in_Sindh:0	"Eine Präsenz in Sindh aufbauen"
RAJ_Establish_a_Precense_in_Sindh_desc:0	"Direkt südlich der Gründungsprovinz unserer großen Partei liegt eine vernachlässigte, ethnisch vielfältige Provinz, der wir mehr Aufmerksamkeit schenken sollten."
RAJ_National_Unity:0	"Nationale Einheit"
RAJ_National_Unity_desc:0	"Wir müssen alle in unserer Nation zusammenbringen, von den Hindus über die Sikhs bis hin zu den Buddhisten und den Muslimen. Nur dann können wir Frieden haben."
RAJ_Appeal_to_the_Peasentry:0	"Appell an die Landbevölkerung"
RAJ_Appeal_to_the_Peasentry_desc:0	"Die Bauernschaft ist der wichtigste Teil Indiens, und wer sie ignoriert, wird bei den Wahlen verlieren."
RAJ_Implement_Equal_Education:0	"Setzen Sie eine gleichberechtigte Bildung durch"
RAJ_Implement_Equal_Education_desc:0	"In allen klassengeteilten Gesellschaften ist hochwertige Bildung meist den oberen Klassen vorbehalten, aber Indien hat ein besonders schlechtes Bildungssystem, wenn Sie die unteren Schichten der Gesellschaft fragen. Es ist unsere Pflicht, die Bildung endlich anzugleichen, damit kluge Köpfe aus allen Teilen der Gesellschaft gedeihen können."
RAJ_Dismantle_the_Judicial_System:0	"Bauen Sie das Justizsystem ab"
RAJ_Dismantle_the_Judicial_System_desc:0	"Das hinduistische Rechtssystem ist ein kompliziertes, verworrenes Durcheinander, das die Oberschicht begünstigt und die Mehrheit vernachlässigt. Fairness für Indien kann nur erreicht werden, wenn unsere Gerichte die gleiche Vision haben wie unsere revolutionierte Gesellschaft."
RAJ_Abolish_the_Reservation_System:0	"Schaffen Sie das Reservierungssystem ab"
RAJ_Abolish_the_Reservation_System_desc:0	"Die oberen Kasten der Gesellschaft werden bei Einstellungen im öffentlichen Sektor oft bevorzugt behandelt. Manchmal werden Stellen sogar nur für sie ausgeschrieben. Dies hat zu einem Rückgang der bürokratischen Effizienz geführt."
RAJ_Seize_Influence_from_Upper_Castes:0	"Den Einfluss der oberen Kasten an sich reißen"
RAJ_Seize_Influence_from_Upper_Castes_desc:0	"Die Oberschicht der Gesellschaft hat die Macht mit eiserner Faust gehalten, sogar während der britischen Herrschaft. Dieser Umstand kann in einer sozialistischen, von Ausbeutung befreiten Gesellschaft nicht bestehen bleiben. Wir werden ihren Einfluss als breite Mehrheit energisch an uns reißen."
RAJ_Expand_Healthcare_Facilities:0	"Ausbau der Universitäten"
RAJ_Expand_Healthcare_Facilities_desc:0	"Nachdem das Grund- und Sekundarschulsystem reformiert und gleichgestellt wurde, werden wir nun das Hochschulsystem in Angriff nehmen."
RAJ_Establish_The_Revolutionary_Guard:0	"Aufbau der Revolutionären Garde"
RAJ_Establish_The_Revolutionary_Guard_desc:0	"Die Revolution muss um jeden Preis gegen konterrevolutionäre Bewegungen geschützt werden! Wir werden uns auf den Aufbau einer Armee konzentrieren, die der Roten Armee ähnelt."
RAJ_Invite_Soviet_Planners:0	"Laden Sie die sowjetischen Planer ein"
RAJ_Invite_Soviet_Planners_desc:0	""
RAJ_Invite_International_Theorists:0	"Internationale Theoretiker einladen"
RAJ_Invite_International_Theorists_desc:0	"\"Freiheit nur für die Mitglieder der Regierung, nur für die Mitglieder der Partei - auch wenn sie recht zahlreich sind - ist überhaupt keine Freiheit. Freiheit ist immer die Freiheit der Andersdenkenden.\"\n-Rosa Luxemburg"
RAJ_Agricultural_Collectivisation:0	"Kollektivierung der Landwirtschaft"
RAJ_Agricultural_Collectivisation_desc:0	"Unser Hauptziel ist natürlich die Ausbreitung des indischen Proletariats, aber wer soll es ernähren? Unser derzeitiges System der privaten Landwirtschaft ist veraltet und ineffizient. Wir müssen uns bemühen, die kleinen Ländereien der Bauern in größeren 'Kolchosen' zu vereinigen."
RAJ_Expand_Soviet_Aid:0	"Sowjetische Hilfe ausweiten"
RAJ_Expand_Soviet_Aid_desc:0	"Die Sowjets sind ein großzügiges Volk und helfen unseren Agrarwirtschaften, starke Industrien aufzubauen, wie sie es getan haben. Wir müssen um mehr Hilfe bitten, um das Tempo unserer Industrialisierung deutlich zu erhöhen."
RAJ_Rethink_Resource_Policy:0	"Ressourcenpolitik neu überdenken"
RAJ_Rethink_Resource_Policy_desc:0	"Das alte Kolonialregime hat sich bei der Rohstoffgewinnung vor allem auf profitable Exportprodukte konzentriert und das Thema Industrialisierung und damit Ressourcen wie Stahl und Kohle fast völlig ignoriert. Das müssen wir radikal ändern, um unser wachsendes Proletariat zu unterstützen."
RAJ_Combat_Institutional_Corruption:0	"Institutionelle Korruption bekämpfen"
RAJ_Combat_Institutional_Corruption_desc:0	"Die Korruption ist in allen indischen Institutionen tief verwurzelt. Sie eiterte während des britischen Raj und wird es auch weiterhin tun, wenn wir ihr nicht ein Ende setzen."
RAJ_Establish_a_Central_Committee:0	"Ein Zentralkomitee gründen"
RAJ_Establish_a_Central_Committee_desc:0	"Indem wir unseren Fabriken zentral geplante industrielle Ziele aufzwingen, ernten wir die fruchtbare Effizienz der Mathematik, schränken aber die Freiheit unserer Arbeiter ein."
RAJ_Incentivize_Workplace_Democracy:0	"Setzen Sie die Demokratie am Arbeitsplatz durch"
RAJ_Incentivize_Workplace_Democracy_desc:0	"Indem wir uns auf einen lokal verankerten Sozialismus konzentrieren, gewähren wir den Arbeitern mehr Freiheit, opfern aber unsere umfassenderen industriellen Ziele."
RAJ_The_Liberation_of_South_Asia:0	"Die Befreiung Südasiens"
RAJ_The_Liberation_of_South_Asia_desc:0	"Während das indische Proletariat vielleicht das Zugeständnis von Wahlen und einer gewählten Regierung erhalten hat, haben Teile Südasiens nicht so viel Glück. Wir werden ihre Arbeiterbewegungen auf subtile Weise unterstützen, unter anderem durch die Lieferung von Waffen, militärische Intervention und politische Subversion.\nVishv ke karmachaaree ekajut ho gae!"
RAJ_Seize_the_Means:0	"Ergreift die Mittel..."
RAJ_Seize_the_Means_desc:0	"Unser erster Schritt zur Errichtung des Sozialismus muss die Beschlagnahmung der Produktions-, Verteilungs- und Tauschmittel sein. Auch wenn dies Teile unseres Landes in Aufruhr versetzen könnte, wenn wir nicht vorsichtig sind."
RAJ_of_Production:0	"...der Produktion"
RAJ_of_Production_desc:0	"Die Bourgeoisie hat den Löwenanteil schon viel zu lange in der Hand. Es ist an der Zeit, dass die Arbeiter die Früchte ihrer eigenen Arbeit kosten."
RAJ_of_Distribution:0	"...der Verteilung"
RAJ_of_Distribution_desc:0	"Eine Fabrik ist nichts ohne eine Möglichkeit, ihre Produkte zu vertreiben. Wir müssen die privaten Eisenbahnen zum Wohle des indischen Volkes in Besitz nehmen."
RAJ_of_Exchange:0	"...des Austauschs"
RAJ_of_Exchange_desc:0	"Um den Staatshaushalt zu koordinieren, brauchen wir eine Bank in öffentlichem Besitz, die unsere Währung reguliert und für Kontrolle und Gleichgewicht sorgt."
RAJ_Connect_the_Rural_Areas:0	"Verbinden Sie die ländlichen Gebiete"
RAJ_Connect_the_Rural_Areas_desc:0	"Die Briten haben sich nur die Mühe gemacht, Eisenbahnen von unseren Häfen zu unseren natürlichen Ressourcen zu bauen und den größten Teil des Landes unberührt gelassen. Es ist nun unsere Pflicht, die Fehler der Briten rückwirkend zu korrigieren."
RAJ_The_Ceylon_Emergency:0	"Der Ceylon-Notstand"
RAJ_The_Ceylon_Emergency_desc:0	"Mit all den Waffen und der politischen Unterstützung, die die Singhalesen erhalten haben, sind sie nun bereit, ihren Aufstand gegen die Briten zu beginnen und warten nur noch auf unser Wort."
RAJ_Overthrow_the_Rana_dynasty:0	"Der nepalesische Aufstand"
RAJ_Overthrow_the_Rana_dynasty_desc:0	"Das nepalesische Volk hat sich längst organisiert und es ist an der Zeit, gegen das unterdrückerische Rana-Regime zuzuschlagen."
RAJ_The_Bhutanese_Revolt:0	"Die bhutanische Revolte"
RAJ_The_Bhutanese_Revolt_desc:0	"Die Wangchuk-Dynastie, so beliebt sie auch sein mag, hat es versäumt, den Ärmsten des Landes zu helfen, und das Volk ist bereit, sich ihr zu widersetzen."
RAJ_The_Remaining_Ports:0	"Die verbleibenden Häfen"
RAJ_The_Remaining_Ports_desc:0	"Auf dem Subkontinent gibt es immer noch unappetitliche Auswüchse des Kolonialismus, die es zu beseitigen gilt, sei es friedlich oder mit Gewalt."
RAJ_Jinnahs_Kingdom:0	"Unsere muslimischen Kameraden"
RAJ_Jinnahs_Kingdom_desc:0	"Alle religiösen, sprachlichen und kulturellen Gruppen des Subkontinents sind miteinander verflochten und voneinander abhängig. Eine davon herauszureißen, würde die indische Nation ernsthaft schwächen. Ein lange vernachlässigter, aber äußerst wichtiger Teil dieser Nation sind die Muslime, die in den Gebieten von Sindh, Punjab und Bengalen leben."
RAJ_A_New_Movement:0	"Eine neue Bewegung"
RAJ_A_New_Movement_desc:0	"Stalins Russland hat beim Aufbau einer gerechten sozialistischen Gesellschaft versagt und wir müssen uns davon distanzieren und eine neue Bewegung nach vorne entfachen."
RAJ_The_Third_International:0	"Die Dritte Internationale"
RAJ_The_Third_International_desc:0	"Stalins Russland hat einen langen Weg zurückgelegt und viele Jahre überlebt; wir müssen uns mit ihnen verbünden, wenn wir einen neuen Tag erleben wollen."
RAJ_Asian_Anti_Colonialism:0	"Asiatischer Antikolonialismus"
RAJ_Asian_Anti_Colonialism_desc:0	"Wir müssen nach so vielen Jahren endlich die Europäer vom asiatischen Kontinent vertreiben, um unsere Zukunft zu sichern."
RAJ_Bind_South_Asia_Closer:0	"Südasien enger zusammenbinden"
RAJ_Bind_South_Asia_Closer_desc:0	"Wir haben den Sozialismus in Südasien etabliert und müssen sie endlich militärisch an uns binden."
RAJ_Socialist_Science:0	"Sozialistische Wissenschaft"
RAJ_Socialist_Science_desc:0	"Das sowjetische Volk hat es in der Wissenschaft weit gebracht und verfügt über viele Technologien, die für den neuen indischen Arbeiterstaat wünschenswert sind. Wenn wir wissenschaftliche Austauschprogramme starten würden, könnten unsere beiden Gesellschaften davon profitieren."
RAJ_Military_Cooperation:0	"Militärische Zusammenarbeit"
RAJ_Military_Cooperation_desc:0	"Mit unseren neu gewonnenen Verbündeten werden wir unsere Verteidigungsstrategie koordinieren und unsere militärischen Geheimnisse teilen."
RAJ_Technological_Cooperation:0	"Technologische Zusammenarbeit"
RAJ_Technological_Cooperation_desc:0	"Wir müssen nicht nur unsere Wissenschaft stärken, sondern auch die unserer Verbündeten."
RAJ_Establish_a_National_Government:0	"Bildung einer nationalen Regierung"
RAJ_Establish_a_National_Government_desc:0	"Nachdem wir die Wahl gewonnen haben, werden wir nun eine Zentralregierung einsetzen und ein Kabinett bilden."
RAJ_Battle_the_Untouchables:0	"Kampf gegen die Unberührbarkeit"
RAJ_Battle_the_Untouchables_desc:0	"Die schwächsten der Kasten brauchen dringend Hilfe und ein demokratisches Indien muss dazu beitragen, ihre Lage zu verbessern."
RAJ_Encourage_Rural_Education:0	"Ländliche Bildung fördern"
RAJ_Encourage_Rural_Education_desc:0	"Wenn wir eine Industriemacht werden wollen, müssen wir die Bildung in allen Bereichen des Lebens fördern."
RAJ_Expand_Delhi_University:0	"Erweitern Sie die Delhi Universität"
RAJ_Expand_Delhi_University_desc:0	"Angesichts der steigenden Nachfrage nach höherer Bildung sollten wir unsere größte Universität, die Delhi University, ausbauen."
RAJ_Economic_Restructuring:0	"Wirtschaftliche Umstrukturierung"
RAJ_Economic_Restructuring_desc:0	"In ihrem derzeitigen Zustand ist unsere Wirtschaft nicht zukunftsfähig und wir müssen schnell handeln, um sie zu reformieren, oder wir bleiben eine Agrargesellschaft."
RAJ_Expand_the_Public_Sector:0	"Ausweitung des öffentlichen Sektors"
RAJ_Expand_the_Public_Sector_desc:0	"Der beste Weg, unsere industriellen Fähigkeiten zu erweitern, ist eine direkte staatliche Intervention, die einige unserer konservativeren Mitglieder verärgern könnte."
RAJ_Soviet_Assistance:0	"Sowjetische Hilfe"
RAJ_Soviet_Assistance_desc:0	"Im derzeitigen geopolitischen Klima hat die Sowjetunion ein großes Interesse daran, Indien als Gegengewicht zu den Westmächten aufzubauen."
RAJ_Agricultural_Investments:0	"Landwirtschaftliche Investitionen"
RAJ_Agricultural_Investments_desc:0	"Indem wir unsere landwirtschaftliche Produktion verbessern, ermutigen wir nicht nur die ländlichen Gemeinden, in andere Sektoren zu gehen, sondern wir verbessern auch den Lebensstandard des durchschnittlichen Inders."
RAJ_Expell_the_Socialists:0	"Vertreiben Sie die Sozialisten"
RAJ_Expell_the_Socialists_desc:0	"Unsere Partei war lange Zeit eine Dachbewegung, aber jetzt, wo wir unser gemeinsames Ziel erreicht haben, werden wir die extremen Elemente aus unserer Organisation ausschließen."
RAJ_Unify_the_Courts:0	"Vereinheitlichen Sie die Gerichte"
RAJ_Unify_the_Courts_desc:0	"Unser Gerichtssystem ist unnötig kompliziert und Jahrhunderte alt. Wir werden es vereinheitlichen, um seine Effizienz zu erhöhen."
RAJ_Concessions_to_Princes:0	"Zugeständnisse an die Prinzen"
RAJ_Concessions_to_Princes_desc:0	"Auch wenn die Fürsten mit Sicherheit nicht mit unserer neuen Regierung einverstanden sind, sollten wir uns von unseren ideologischen Differenzen nicht von Pragmatismus abhalten lassen."
RAJ_No_Compromises:0	"Keine Kompromisse"
RAJ_No_Compromises_desc:0	"Den jahrhundertealten, unterdrückenden Institutionen der Fürstenstaaten kann man in unserer neuen, modernen Nation nichts anvertrauen. Kompromisse mit diesen Überresten des Feudalismus sind für einen modernen Staat inakzeptabel."
RAJ_Integrate_the_Princely_States:0	"Integrieren Sie die fürstlichen Staaten"
RAJ_Integrate_the_Princely_States_desc:0	"Mit unserem Fortschritt auf dem Weg zur Unabhängigkeit werden die Fürstenstaaten integriert werden, ob sie wollen oder nicht."
RAJ_Democratize_our_Institutions:0	"Demokratisieren Sie unsere Institutionen"
RAJ_Democratize_our_Institutions_desc:0	"Unsere Institutionen werden von Korruption geplagt, die von Systemen herrührt, die vor Jahrhunderten eingeführt wurden. Wir müssen sie umstrukturieren und reformieren, um Stabilität zu gewährleisten."
RAJ_Central_Bureau_of_Investigation:0	"Zentrale Ermittlungsbehörde (Central Bureau of Investigation)"
RAJ_Central_Bureau_of_Investigation_desc:0	"Unsere neu errichteten Institutionen müssen vor allen Bedrohungen geschützt werden, denen sie ausgesetzt sein könnten. Es ist Zeit für unsere Antwort auf die Abwehr, den MI6 und die CIA."
RAJ_Reform_our_Police_Force:0	"Reformieren Sie unsere Polizei"
RAJ_Reform_our_Police_Force_desc:0	"Die kaiserliche indische Polizei ist in unserem Land zutiefst unbeliebt und das wird auch unser Regime sein, wenn wir ihr Polizeisystem fortführen. Es ist an der Zeit, das britische Polizeisystem abzuschaffen und ein eindeutig indisches zu schaffen."
RAJ_Revise_Taxation_Policies:0	"Überarbeiten Sie die Steuerpolitik"
RAJ_Revise_Taxation_Policies_desc:0	"Das britische Raj hat unsere indische Bevölkerung stark besteuert, oft mit unfairen Methoden. Um eine gesunde Wirtschaft und Gesellschaft zu erhalten, müssen wir uns bemühen, das britische Steuersystem durch ein eindeutig indisches zu ersetzen."
RAJ_Reestablish_our_Armed_Forces:0	"Wiederaufbau unserer Streitkräfte"
RAJ_Reestablish_our_Armed_Forces_desc:0	"Die Britisch-Indische Armee war eine große Institution, deren primärer Gründungszweck die Sicherheit der britischen Herrschaft in Indien war. Wir müssen Platz machen für eine neue Armee, die der indischen Nation dient."
RAJ_No_Resentments:0	"Keine Ressentiments"
RAJ_No_Resentments_desc:0	"Unsere Geschichte mit den Briten kann nicht als ruhig bezeichnet werden, aber die gegenwärtigen geopolitischen Umstände erfordern unsere Ausrichtung auf die westlichen Mächte. Natürlich pulsieren die Wunden des britischen Kolonialismus noch immer, aber wir müssen als gleichberechtigte Partner zusammenstehen."
RAJ_Protect_the_Arabian_Sea:0	"Schützen Sie das Arabische Meer"
RAJ_Protect_the_Arabian_Sea_desc:0	"Zwischen uns und der britischen Achse der globalen Verteidigung, dem Suez, liegt das weite und ungeschützte Arabische Meer. In ihm haben Piraten und feindliche U-Boote reichlich Gelegenheit gefunden, unsere Lieferungen in den Nahen Osten und darüber hinaus zu stören. Die Einrichtung von koordinierten Radarstationen und Luftwaffenstützpunkten wird uns sehr dabei helfen, die Kontrolle über den Indischen Ozean zurückzuerlangen."
RAJ_Equal_Partners:0	"Gleichberechtigte Partner"
RAJ_Equal_Partners_desc:0	"Jetzt, da sich die Beziehung zwischen Kolonie und Overlord in eine Beziehung gleichberechtigter Partner gewandelt hat, werden wir eine größere Rolle in der internationalen Politik spielen, um die Freiheit dort zu schützen, wo die Hände Großbritanniens nicht hinkommen dürfen."
RAJ_A_New_Way_Forward:0	"Ein neuer Weg nach vorn"
RAJ_A_New_Way_Forward_desc:0	"Indien hat nichts davon zu gewinnen, wenn es in einen Krieg verwickelt wird, und selbst wenn wir durch unsere Bemühungen einen Krieg verhindern, werden wir Tausende von Menschenleben gerettet haben."
RAJ_Mutual_Investments:0	"Gegenseitige Investitionen"
RAJ_Mutual_Investments_desc:0	"Auch wenn die Europäer weitaus stärker industrialisiert sind als wir, werden diese Investitionen dennoch für beide Seiten von Nutzen sein."
RAJ_The_Non_Aligned_Movement:0	"Die Bewegung der Blockfreien"
RAJ_The_Non_Aligned_Movement_desc:0	"Wir werden eine von den Supermächten unserer Zeit unabhängige globale Gemeinschaft fördern und gemeinsam für den Frieden in der Welt kämpfen."
RAJ_Bring_Democracy_to_South_Asia:0	"Bringen Sie die Demokratie nach Südasien"
RAJ_Bring_Democracy_to_South_Asia_desc:0	"Während Indien zu einer leuchtenden Bastion der Demokratie geworden ist, behindern wir immer noch einen Kontinent, der ohne Demokratie und voller Tyrannei ist."
RAJ_South_Asian_Economic_Integration:0	"Südasiatische wirtschaftliche Integration"
RAJ_South_Asian_Economic_Integration_desc:0	"Der indische Subkontinent hat ein gemeinsames Ziel, unter anderem auf dem Weltmarkt. Wenn wir unsere Volkswirtschaften konsolidieren und integrieren, wird der Wohlstand alle erreichen. Außerdem werden die Verhandlungen mit internationalen Handelspartnern viel effektiver sein."
RAJ_Pressure_the_British_about_Ceylon:0	"Setzen Sie die Briten wegen Ceylon unter Druck"
RAJ_Pressure_the_British_about_Ceylon_desc:0	"Die Ceylonesen haben sich lange für die Unabhängigkeit organisiert, in der Hoffnung, dass die indische Unabhängigkeit auch ihre Freiheit von der britischen Ausbeutung bedeuten würde. Das mag zwar nicht der Fall gewesen sein, aber wir können der Bewegung jetzt helfen, eine Stimme zu bekommen."
RAJ_Armed_Neutrality:0	"Bewaffnete Neutralität"
RAJ_Armed_Neutrality_desc:0	"Niemand will Krieg, die Anführer wollen nur die Kriegsbeute, und diese Beute so schwer wie möglich zu erlangen, muss das Ziel jeder neutralen, aber souveränen Nation sein. Wir werden die Moral in unserer Armee verbessern und unsere Rüstungsindustrie stärken."
RAJ_Expand_its_Competences:0	"Erweitern Sie ihre Kompetenzen"
RAJ_Expand_its_Competences_desc:0	"Wenn wir diese Organisation erweitern und vereinheitlichen, werden unsere Worte vielleicht mehr Rückhalt haben und wir werden die Rechte kleinerer Länder effizienter schützen können."
RAJ_Emphasise_Anti_Colonialist_Sentiment:0	"Betonen Sie die antikoloniale Gesinnung"
RAJ_Emphasise_Anti_Colonialist_Sentiment_desc:0	"Der Kolonialismus ist eine hässliche, überholte und unpopuläre Institution und seine Zeit ist längst überfällig. Diese Botschaft muss auf der ganzen Welt verbreitet werden, sonst werden die kolonisierten Völker dieses Planeten noch jahrzehntelang unnötiges Leid ertragen müssen."
RAJ_Take_back_the_Ports:0	"Holt euch die Häfen zurück"
RAJ_Take_back_the_Ports_desc:0	"Die europäischen Häfen, eine hässliche Erinnerung an unsere koloniale Vergangenheit. Natürlich hoffen wir, dieses Problem friedlich lösen zu können, aber wir können uns nicht nur auf Worte verlassen."
RAJ_Launch_The_Quit_India_Movement:0	"Starten Sie die Quit India-Bewegung"
RAJ_Launch_The_Quit_India_Movement_desc:0	"Wir setzen derzeit alle uns zur Verfügung stehenden Maßnahmen ein, um die Briten zu vertreiben, aber vielleicht wird die Versöhnung mit unseren politischen Feinden und der Beginn eines landesweiten Streiks den Druck erhöhen."
RAJ_Intervention_in_Pakistan:0	"Intervention in Pakistan"
RAJ_Intervention_in_Pakistan_desc:0	"Die fadenscheinige Ausrede von Jinnahs Demokratie ist gefallen und den Muslimen, Sikhs und Hindus im Punjab, Sindh und Bengalen wurde eine diktatorische Herrschaft aufgezwungen. Ein solch extremes Regime zuzulassen, ist eine Einladung an ausländische Mächte, die den indischen Subkontinent kontrollieren wollen. Die indischen Streitkräfte müssen eingreifen, bevor es zu spät ist."
RAJ_Offer_the_British_Concessions:0	"Britische Zugeständnisse"
RAJ_Offer_the_British_Concessions_desc:0	"Die Briten halten aus vielen Gründen an Indien fest, vor allem wegen des enormen natürlichen Reichtums des indischen Subkontinents. Die Verhandlungen werden viel reibungsloser verlaufen, wenn wir versprechen, einige unserer Ressourcen zu teilen. "
RAJ_Mutual_Security:0	"Gegenseitige Sicherheit"
RAJ_Mutual_Security_desc:0	"In unserem neuen Bündnis werden wir unsere militärischen Strategien koordinieren, um unsere Sicherheit zu gewährleisten."
RAJ_The_Remains_of_South_Asia:0	"Die Überreste von Südasien"
RAJ_The_Remains_of_South_Asia_desc:0	"Südasien ist immer noch voll von despotischen Regimen, die ihr Volk unterdrücken. Wir werden mit britischer Hilfe die Demokratie in diesen autoritären Regimen einführen."
RAJ_Outwards_to_the_World:0	"Nach außen in die Welt"
RAJ_Outwards_to_the_World_desc:0	"Wir müssen nach externen Allianzen suchen, um Indiens Position zu sichern."
RAJ_The_Womens_Status:0	"Die Stellung der Frauen"
RAJ_The_Womens_Status_desc:0	"Frauen werden in unserer Gesellschaft seit langem unterdrückt. Alle Arten von barbarischen, antiquierten Praktiken werden den Frauen immer noch aufgezwungen. Um das zu ändern, bedarf es zwar mehr als nur einer Gesetzgebung, aber das ist der erste Schritt zur Schaffung eines gerechten Indiens."
RAJ_Caste_Reform:0	"Reform der Kaste"
RAJ_Caste_Reform_desc:0	"Das Kastensystem hat Indien lange Zeit diskriminiert und dominiert noch immer viele Teile des Landes. In der hinduistischen Gesellschaft kategorisiert es die Menschen in starre soziale Gruppen. Dabei werden die unteren Kasten regelmäßig ausgebeutet."
RAJ_Develop_the_Defense_Industry:0	"Entwickeln Sie die Verteidigungsindustrie"
RAJ_Develop_the_Defense_Industry_desc:0	"Nach unseren jüngsten Wirtschaftsreformen in Bezug auf die Verstaatlichung ist es nun auch an der Zeit, unsere nationale Verteidigungsindustrie zu stärken, um sowohl unserer Wirtschaft als auch unseren Streitkräften zu helfen."
RAJ_Establishing_A_Indian_Navy:0	"Aufbau einer indischen Marine"
RAJ_Establishing_A_Indian_Navy_desc:0	"Der indische Ozean ist groß und gefährlich, und um ihn zu patrouillieren, ist eine große Überwasserflotte erforderlich, über die wir derzeit nicht verfügen. Es ist von entscheidender Bedeutung, dass wir die Produktion der Marine hochfahren."
RAJ_Unity_in_India:0	"Indische Einheit"
RAJ_Unity_in_India_desc:0	"Die Muslime Indiens wurden lange Zeit an den Rand gedrängt, aber keine freie, demokratische und faire Gesellschaft kann so etwas tolerieren. Wir müssen ihren Forderungen nachgeben und die Nation vereinen."
RAJ_The_Ones_Who_Got_Away:0	"Diejenigen, die entkommen sind"
RAJ_The_Ones_Who_Got_Away_desc:0	"Obwohl wir mit unserer Forderung nach Integration in Indien sehr streng waren, sind uns einige Prinzen entkommen. Jetzt ist es an der Zeit, den Subkontinent zu sichern."
RAJ_Relieve_Indias_Struggling_Food_Supply:0	"Indiens Nahrungsmittelversorgung entlasten"
RAJ_Relieve_Indias_Struggling_Food_Supply_desc:0	"Die Nahrungsmittelversorgung Indiens ist stark vom Klima abhängig. Wenn die Monsunzeit nicht ausreicht, um die Quote zu erfüllen, muss Getreide importiert werden, um den Bedarf zu decken. Wenn wir unsere Bewässerungs- und Anbaumethoden verbessern, könnten wir zukünftige Hungersnöte verhindern."
RAJ_Placate_the_Nobles:0	"Beschwichtigen Sie die Adligen"
RAJ_Placate_the_Nobles_desc:0	"Dem Adel ging es unter der britischen Herrschaft gut und er ist nicht sehr glücklich über unsere Unabhängigkeit. Das könnte sich jedoch ändern, wenn wir ihnen einige Zugeständnisse machen würden."
RAJ_Military_Research_Department:0	"Militärische Forschungsabteilung"
RAJ_Military_Research_Department_desc:0	"Wir müssen unsere militärischen Fähigkeiten ausbauen, nicht durch rohe Quantität, wie viele unserer Generäle vorschlagen, sondern durch echte technologische Überlegenheit."
RAJ_Sit_Down_with_the_Farmers:0	"Dialog mit den Landwirten"
RAJ_Sit_Down_with_the_Farmers_desc:0	"Der Landwirt, der sein eigenes Land bewirtschaftet, ist der Lebensnerv unseres Landes, unserer Nation, und seine Bedürfnisse verdienen mehr Aufmerksamkeit, als die Kolonialregierung ihm geboten hat."
RAJ_Token_Social_Reform:0	"Token Kaste Reform"
RAJ_Token_Social_Reform_desc:0	"Das Kastensystem hat Indien bei der Aufrechterhaltung von Ordnung und Stabilität immer gute Dienste geleistet, auch wenn nach dem Abzug der Briten viele Positionen, die hohe Kompetenz erfordern, leer geblieben sind, weil niemand aus den oberen Kasten sie besetzen konnte. Durch die Lockerung einiger Vorschriften können wir hoffentlich mit der Effizienz der Kolonialzeit mithalten."
RAJ_Expand_our_Ordance_Industry:0	"Erweitern Sie die Rüstungsindustrie"
RAJ_Expand_our_Ordance_Industry_desc:0	"In den sich zusammenbrauenden Konflikten der Welt muss [RAJ.GetNameDef] darauf vorbereitet sein, seine Bürger zu verteidigen, und fast ebenso wichtig die Freiheit aller."
RAJ_Answer_The_Call:0	"Antworten Sie auf den Ruf"
RAJ_Answer_The_Call_desc:0	"Die Britischen Inseln sind derzeit in einen Krieg verwickelt, den sie sich nicht leisten können, zu verlieren. Jede Form der Kapitulation könnte Millionen in Tyrannei und Dunkelheit stürzen. Es ist unsere moralische Pflicht, für die Freiheit zu kämpfen, wo immer sie in Gefahr ist, und es ist an der Zeit, dem Ruf zu folgen."
RAJ_Institute_The_Draft:0	"Führen Sie die Wehrpflicht ein"
RAJ_Institute_The_Draft_desc:0	"Obwohl unsere Teilnahme an diesem Krieg eine moralische Verpflichtung ist, ist sich nicht jeder unserer Bürger des Ernstes unserer Lage bewusst. Leider müssen wir Männer, die sich nicht freiwillig melden wollen, einberufen, um Menschen auf der ganzen Welt zu befreien."
RAJ_Industrial_Investments:0	"Industrielle Investitionen"
RAJ_Industrial_Investments_desc:0	"Wir müssen massiv in Fabriken im ganzen Land investieren, um unserer Wirtschaft zu Wachstum und Wohlstand zu verhelfen."
RAJ_Aquire_War_Material:0	"Beschaffen Sie Kriegsmaterial"
RAJ_Aquire_War_Material_desc:0	"Wenn wir möglichen zukünftigen Feinden die Stirn bieten wollen, müssen wir mit neu erforschten und gut produzierten Waffen für unsere tapferen Soldaten gerüstet sein."
RAJ_Internal_Security_Act:0	"Gesetz zur inneren Sicherheit"
RAJ_Internal_Security_Act_desc:0	"Wir können nicht zulassen, dass extremistische Gruppierungen in dieser Nation alles niederreißen. Wir werden die britische Politik der Verhaftung derjenigen fortsetzen, die diese große Nation Indien zerstören wollen."
RAJ_Placate_the_British:0	"Die Briten besänftigen"
RAJ_Placate_the_British_desc:0	"Obwohl unsere Unabhängigkeit gesichert ist, sind wir immer noch stark auf britische Investitionen angewiesen, um unsere Wirtschaft über Wasser zu halten. Wir könnten mehr Investitionen nach Indien lenken, wenn wir die Engländer besänftigen würden."
RAJ_Federalisation:0	"Alphabetisierung der Bevölkerung"
RAJ_Federalisation_desc:0	"Wir müssen die Alphabetisierungsrate drastisch erhöhen und den Bildungssektor ausbauen. Indien ist darauf angewiesen!"
RAJ_A_Truly_Indian_Navy:0	"Eine wahrhaft indische Marine"
RAJ_A_Truly_Indian_Navy_desc:0	"Der indische Ozean ist groß und gefährlich, und um ihn zu patrouillieren, brauchen wir eine große Überwasserflotte, über die wir derzeit nicht verfügen. Es ist von entscheidender Bedeutung, dass wir die Produktion der Marine hochfahren."
RAJ_Fighting_Tyranny_whereever_it_may_be:0	"Tyrannei bekämpfen, wo immer sie sein mag"
RAJ_Fighting_Tyranny_whereever_it_may_be_desc:0	"Unsere Streitkräfte wurden in erster Linie zum Schutz der indischen Interessen in Südasien eingesetzt, aber wir haben es versäumt, das große Ganze zu sehen. Wir müssen der Freiheit auf der ganzen Welt helfen und den Kampf gegen diejenigen aufnehmen, die sie in Schutt und Asche legen wollen."
RAJ_Assemble_our_Cabinet:0	"Stellen Sie unser Kabinett zusammen"
RAJ_Assemble_our_Cabinet_desc:0	"Mit jedem neuen Vizekönig kommt ein neues Kabinett, das seine Bemühungen in Indien unterstützt. Obwohl der Exekutivrat des Vizekönigs früher nur ein beratender Rat war, gewann er im Laufe der Zeit immer mehr an Einfluss, so dass wir kompetente Minister finden müssen."
RAJ_Meet_with_the_Legislative:0	"Treffen Sie sich mit der Legislative"
RAJ_Meet_with_the_Legislative_desc:0	"Obwohl der Vertreter der Krone im Gegensatz zu seiner Heimat viel Macht über die Legislative hat, müssen wir dennoch sicherstellen, dass sie in unserem Sinne abstimmt."
RAJ_Meet_with_the_Judiciary:0	"Treffen Sie sich mit der Judikative"
RAJ_Meet_with_the_Judiciary_desc:0	"Obwohl in Indien weitgehend das englische Common Law angewandt wird, ist das Gerichtssystem nach einheimischem Vorbild aufgebaut. Wenn wir sicherstellen, dass sie sich uns nicht widersetzen, ersparen wir uns zukünftige Probleme."
RAJ_Attend_the_Imperial_Conference:0	"Besuchen Sie die Reichskonferenz"
RAJ_Attend_the_Imperial_Conference_desc:0	"Kaiserliche Konferenzen werden regelmäßig abgehalten, nur diese hier hat eine besondere Bedeutung. Nach der königlichen, sagen wir mal, Kontroverse war ein Großteil der Dominions in Aufruhr und es ist das Ziel Londons, seine Bindungen zum Reich wieder zu stärken."
RAJ_Reinvigorate_Imperial_Shipping:0	"Wiederbelebung der kaiserlichen Schifffahrt"
RAJ_Reinvigorate_Imperial_Shipping_desc:0	"Die Schifffahrtsrouten durch den Indischen Ozean sind auf Kosten der Kassen des britischen Raj etwas ausgetrocknet. Wir müssen uns für weitere Investitionen in die kaiserliche Schifffahrt einsetzen."
RAJ_Common_Defence_Policy:0	"Gemeinsame Verteidigungspolitik"
RAJ_Common_Defence_Policy_desc:0	"Die zunehmenden Spannungen rund um den Globus sind auch der britischen Regierung nicht entgangen. Sie schlug vor, dass die Dominions, die Inseln und Indien ihre Streitkräfte vielleicht besser koordinieren müssten, um das Empire zu sichern."
RAJ_The_Indian_Merchant_Navy:0	"Die indische Handelsmarine"
RAJ_The_Indian_Merchant_Navy_desc:0	"Obwohl Indien historisch gesehen nicht die seefahrendste Nation ist, sind wir in hohem Maße vom Handel abhängig, den das Empire für uns bereitstellt. Um unsere Ressourcen besser nutzen zu können, ist es notwendig, dass wir damit beginnen, die Kompetenzen unserer Marine zu erweitern, um im Indischen Ozean zu patrouillieren."
RAJ_An_Army_serving_the_Empire:0	"Eine Armee im Dienste des Imperiums"
RAJ_An_Army_serving_the_Empire_desc:0	"Obwohl unsere Armee in erster Linie in Südasien und erst in zweiter Linie in Afrika eingesetzt wurde, legen die Heimatinseln mehr internationale Einsätze für die indischen Soldaten nahe."
RAJ_Indianise_the_Royal_Indian_Navy:0	"Indisierung der Königlich Indischen Marine"
RAJ_Indianise_the_Royal_Indian_Navy_desc:0	"Die königliche indische Marine wird hinterhältig als Hilfstruppe der eigentlichen königlichen Marine bezeichnet, da sie hauptsächlich mit Briten besetzt ist. Indem man mehr Inder in höheren Positionen einsetzt, kann man der RIN einen eigenen Zweck geben."
RAJ_Expand_the_Indian_Air_Force:0	"Erweitern Sie die indische Luftwaffe"
RAJ_Study_British_Armour:0	"Studieren Sie die britische Panzerung"
RAJ_Study_British_Armour_desc:0	"Unserer auf Infanterie basierenden Armee mangelt es stark an gepanzerten Fahrzeugen. Es ist wichtig, dass wir ausländische Designs studieren, um unsere Armee zu modernisieren und uns vor ausländischen Bedrohungen zu schützen."
RAJ_Expand_the_Indian_Air_Force_desc:0	"Krieg, Krieg hat sich verändert. Viele unserer Generäle leben noch den Sieg des Großen Krieges. Aber ein moderner Krieg wird nicht nur auf dem Boden, sondern auch in der Luft geführt. Das erwähnte Schlachtfeld wurde von uns lange Zeit vernachlässigt. Es ist nun an der Zeit, diesen traurigen Zustand zu ändern."
RAJ_British_Arms_Shipments:0	"Britische Waffenlieferungen"
RAJ_British_Arms_Shipments_desc:0	"Wir haben zwar viele engagierte Männer, die bereit sind, für das Imperium zu sterben, aber nicht alle können von uns bewaffnet werden, und die Verstärkung von den Inseln wird unsere Effektivität erheblich verbessern."
RAJ_British_Investments:0	"Britische Investitionen"
RAJ_British_Investments_desc:0	"Indien ist nicht gerade dafür bekannt, ein industrielles Kraftzentrum zu sein, und das werden wir ganz sicher nicht so bald ändern, aber Investitionen britischer Unternehmen können uns durchaus auf dem Weg dorthin helfen."
RAJ_Our_First_Order_of_Business:0	"Unser erster Punkt der Tagesordnung"
RAJ_Our_First_Order_of_Business_desc:0	"Nachdem wir uns mit allen anderen Zweigen der Regierung getroffen haben, haben wir nun die Möglichkeit, den ersten Gesetzesentwurf unter Linlithgow in den kaiserlichen Legislativrat einzubringen, damit darüber abgestimmt werden kann."
RAJ_New_Excavation_Companies:0	"Neue Ausgrabungsfirmen"
RAJ_New_Excavation_Companies_desc:0	"Mit unserer neu ausgebauten Infrastruktur können nun neue Unternehmen in das indianische Territorium ziehen, um die Früchte des reichen indianischen Landes zu ernten."
RAJ_New_Industrial_Centers:0	"Neue industrielle Zentren"
RAJ_New_Industrial_Centers_desc:0	"Unsere erweiterten Eisenbahnen haben uns auch die Möglichkeit gegeben, im ganzen Land Fabriken zu bauen und eine neue indische Arbeiterklasse zu schaffen."
RAJ_Expand_Urban_Centers:0	"Städtische Zentren ausbauen"
RAJ_Expand_Urban_Centers_desc:0	"Da die Ernährungssicherheit Indiens nun mehr oder weniger gewährleistet ist, können wir nun unsere städtischen Zentren ausbauen und neue Möglichkeiten für die einst armen ländlichen Massen schaffen."
Railway_Expansion_Act_init:0	"Beginn der Arbeit am Railway Expansion Act"
Railway_Expansion_Act_passed:0	"Verabschiedung des Eisenbahnausbaugesetzes"
Railway_Expansion_Act_failed:0	"Verabschiedung des Eisenbahnausbaugesetzes gescheitert"
RAJ_Railway_Expansion_Act:0	"Gesetz zum Ausbau der Eisenbahn"
RAJ_Railway_Expansion_Act_desc:0	"Die Infrastruktur unseres Landes ist in den meisten Teilen des Landes unzureichend. Bisher haben wir uns nur um den Bau von Eisenbahnen entlang profitabler Strecken gekümmert, aber das muss sich ändern, wenn wir in der globalen Wirtschaft konkurrenzfähig bleiben wollen."
Agricultural_Stabilisation_Act_init:0	"Beginn der Arbeit am Gesetz zur Stabilisierung der Landwirtschaft"
Agricultural_Stabilisation_Act_passed:0	"Verabschiedung des Agrarstabilisierungsgesetzes"
Agricultural_Stabilisation_Act_failed:0	"Gescheitert am Gesetz zur Stabilisierung der Landwirtschaft"
RAJ_Agricultural_Stabilisation_Act:0	"Gesetz zur Stabilisierung der Landwirtschaft"
RAJ_Agricultural_Stabilisation_Act_desc:0	"Indien ist seit jeher eine landwirtschaftlich geprägte Gesellschaft, aber häufige Dürren haben die indische Nahrungsmittelversorgung zerstört. Da uns Hilfe von außen oft vorenthalten wird, ist es nur in unserem Interesse, unsere Getreideproduktion selbst zu sichern."
Educational_Reform_Act_init:0	"Beginn der Arbeit an dem Bildungsreformgesetz"
Educational_Reform_Act_passed:0	"Verabschiedung des Bildungsreformgesetzes"
Educational_Reform_Act_failed:0	"Verabschiedung des Bildungsreformgesetzes gescheitert"
RAJ_Educational_Reform_Act:0	"Bildungsreform-Gesetz"
RAJ_Educational_Reform_Act_desc:0	"Unsere talentiertesten Intellektuellen sind schon immer auf die Heimatinseln gezogen, um dort die beste Ausbildung unter der Krone des Königs zu erhalten. Aber wenn wir unsere lokalen Universitäten ausbauen, können wir vielleicht mehr der klugen Köpfe aus Indien halten."
Insurance_Act_init:0	"Beginn der Arbeit am Versicherungsgesetz"
Insurance_Act_passed:0	"Verabschiedet das Versicherungsgesetz"
Insurance_Act_failed:0	"Verabschiedung des Insurance Act gescheitert"
RAJ_Insurance_Act:0	"Versicherungsgesetz"
RAJ_Insurance_Act_desc:0	"Das Versicherungsgeschäft wurde in Indien lange Zeit vernachlässigt, da es kaum gesetzliche Rahmenbedingungen oder Anreize gibt. Die einzige Branche, in der sie Fuß fassen konnte, ist die Schifffahrtsindustrie. Das werden wir mit diesem Gesetzentwurf hoffentlich ändern."
War_Powers_Act_init:0	"Beginn der Arbeit am War Powers Act"
War_Powers_Act_passed:0	"Verabschiedet den War Powers Act"
War_Powers_Act_failed:0	"Verabschiedung des War Powers Act gescheitert"
RAJ_War_Powers_Act:0	"Gesetz über Kriegsbefugnisse"
RAJ_War_Powers_Act_desc:0	"Die Inder hatten vielleicht keinen Einfluss auf die Entscheidung, in den Krieg einzutreten, aber sie werden mit Sicherheit unsere edelsten Ziele unterstützen, indem sie die abscheulichen Umtriebe des Faschismus, der sich überall auf der Welt erhebt, bekämpfen."
RAJ_His_Majesties_University:0	"Die Universität Seiner Majestät"
RAJ_His_Majesties_University_desc:0	"Die Universität von Delhi ist seit langem etabliert, aber nicht in der Lage, die Bedürfnisse der indischen Intellektuellen zu befriedigen, die immer noch in London studieren. Indem wir helfen, Lehrtalente zu fördern, können wir unsere Bildung sehr wohl verbessern."
RAJ_Department_of_War_Studies:0	"Abteilung für Kriegsstudien"
RAJ_Department_of_War_Studies_desc:0	"Natürlich gibt es viele Studienfächer, aber keines ist so wichtig wie das Militär, das unserer Nation bei der Verteidigung ihrer Grenzen hilft."
RAJ_Open_for_Business:0	"Offen für Unternehmen"
RAJ_Open_for_Business_desc:0	"Mit den neuen rechtlichen Rahmenbedingungen und den neuen Versicherungsgesellschaften könnte Indien für internationale Geschäftsleute ein lukrativer Markt sein. Das kann der angeschlagenen indischen Wirtschaft nur helfen."
RAJ_Healthcare_Investments:0	"Investitionen im Gesundheitswesen"
RAJ_Healthcare_Investments_desc:0	"Es lässt sich nicht leugnen, dass unser Gesundheitssystem in einem schlechten Zustand ist. Die meisten Inder können es sich nicht leisten, zum Arzt zu gehen. Das schadet der Gesellschaft und der Wirtschaft insgesamt, und eine Regierung des Volkes kann diesen traurigen Zustand nicht länger hinnehmen. Wir müssen handeln!"
RAJ_Civil_Aviation_Expansion:0	"Vereinheitlichen Sie die Eisenbahnen"
RAJ_Civil_Aviation_Expansion_desc:0	"Unsere Eisenbahnen sind teilweise lückenhaft und ineffizient gebaut. Es ist an der Zeit, dass wir die Löcher im Netz schließen und unsere Fracht- und Versorgungssysteme verbessern."
RAJ_Wheat_Exports:0	"Weizenexporte"
RAJ_Wheat_Exports_desc:0	"Nachdem wir die indische Lebensmittelversorgung nun einigermaßen stabilisiert haben, kann es sicher nicht schaden, etwas Getreide zu exportieren, oder?"
RAJ_Primary_Education:0	"Grundschulbildung"
RAJ_Primary_Education_desc:0	"Die Mehrzahl der indischen Landbevölkerung ist ungebildet, und zwar aus keinem anderen Grund als der Unterentwicklung des Primar- und Sekundarschulsystems. Wenn wir die neu bewilligten Mittel klug investieren, können wir sicher sein, dass wir das Fachwissen unserer allgemeinen Arbeitskräfte verbessern können."
RAJ_Drought_Prevention_Measures:0	"Maßnahmen zur Dürreprävention"
RAJ_Drought_Prevention_Measures_desc:0	"Indien ist während der Monsunzeit eines der fruchtbarsten Gebiete der Welt. Das einzige Problem ist die Unbeständigkeit des saisonalen Musters, das den Subkontinent mit Ernährungsunsicherheit plagt. Wenn wir die Bewässerungsmaßnahmen ausweiten, könnten wir unsere Abhängigkeit von den jährlichen Regenfällen verringern."
RAJ_Bolster_our_Security_Forces:0	"Verstärken Sie unsere Sicherheitskräfte"
RAJ_Bolster_our_Security_Forces_desc:0	"Damit die Wirtschaft richtig funktioniert, müssen wir neue Unternehmer vor betrügerischen Betrügern und Dieben schützen. Die Unfähigkeit, sich zu schützen, ist vielleicht das größte Hindernis für ausländische Investitionen gewesen. Zumindest bis jetzt."
RAJ_Gather_Industrial_Funds:0	"Sammeln Sie Industriegelder"
RAJ_Gather_Industrial_Funds_desc:0	"Der Indian National Congress, unser Hauptkonkurrent bei dieser Wahl, hat die breite Unterstützung des einfachen Volkes. Das können wir vielleicht durch große Versprechungen an die Großgrundbesitzer und Kapitalisten Indiens ausgleichen. Ihre Kassen sind unerschöpflich und die politische Zukunft Indiens ist eine lohnende Investition."
RAJ_Arms_Industry_Expansion:0	"Expansion der Rüstungsindustrie"
RAJ_Arms_Industry_Expansion_desc:0	"Die indische Armee hat sich zur größten Freiwilligenarmee der Geschichte entwickelt, aber vielen dieser neu angeworbenen Männer fehlt es an der richtigen Ausrüstung, um ihren Kampf zu unterstützen. Während wir uns in der Vergangenheit auf britische Waffenlieferungen verlassen haben, ist es nun an der Zeit, eine Verteidigungsindustrie im südasiatischen Kernland zu fördern."
RAJ_Implement_Conscription:0	"Einführung der Wehrpflicht"
RAJ_Implement_Conscription_desc:0	"Unsere Freiwilligenarmee ist groß, manche mögen sagen, sie ist außergewöhnlich groß, vor allem unter den Umständen der Kolonialregierung. Aber dennoch braucht London mehr Männer, um diesen Krieg zu gewinnen, und wenn wir etwas haben, dann sind es Männer. Das mag bei unserer Bevölkerung nicht gut ankommen, aber es ist den Preis wert."
RAJ_The_August_Offer:0	"Das August-Angebot"
RAJ_The_August_Offer_desc:0	"Auch wenn unser Verhältnis zu den Eingeborenen des Subkontinents bestenfalls steinig war, können wir sie nicht für immer von der Regierung ausschließen. Besonders in diesen Kriegszeiten, in denen Millionen von Indern leiden, müssen wir sicherstellen, dass der Raj nicht in einer gewaltsamen Rebellion untergeht. Ein paar Zugeständnisse sollten ihren Hunger nach Reformen stillen."
RAJ_Expand_the_Burma_Road:0	"Erweitern Sie die Burma-Straße"
RAJ_Expand_the_Burma_Road_desc:0	"China ist ein natürlicher Verbündeter im Kampf gegen das japanische Imperium. Wir müssen unsere Hilfe für China über die Burma Road ausbauen, um Asien von dem tyrannischen Konzept des Jingoismus zu befreien."
RAJ_Border_Fortifications:0	"Grenzbefestigung"
RAJ_Border_Fortifications_desc:0	"In Asien gibt es viele expansionsfreudige Reiche und die Sicherung unserer Ostfront muss unsere oberste Priorität sein. Wir können entlang der östlichen burmesischen Berge und Flüsse Festungen errichten."
raj_diverse_investments_tt:0	"Ermöglicht §YMilitärische Fabrik§! und §YAluminiummühle§! Investitionen durch private Unternehmen."
raj_invest_relations_10_tt:0	"Erhöht §YInvestor Relations§! um §G10§!."
raj_invest_relations_15_tt:0	"Erhöht §YInvestor Relations§! um §G15§!."
RAJ_Establish_the_Planning_Commission:0	"Errichten Sie die Planungskommission"
RAJ_Establish_the_Planning_Commission_desc:0	"Die koloniale Wirtschaft ist so aufgebaut, dass sie die Bevölkerung zu ihrem eigenen Vorteil ausbeutet. Es ist an der Zeit, Reformen durchzuführen, die die Bedürfnisse und das Wohlergehen aller Inder in den Vordergrund stellen und eine nachhaltige und gerechte Wirtschaft wieder aufbauen. Unser erster Schritt auf diesem Weg ist die Einsetzung einer nationalen Planungskommission, die unsere Wirtschaft richtig entwickelt und gleichzeitig für faire Löhne und Arbeitsbedingungen sorgt."
RAJ_Common_Economic_Policy:0	"Gemeinsame Wirtschaftspolitik"
RAJ_Common_Economic_Policy_desc:0	"Wie in der Reichskonferenz dargelegt, sollen die Wirtschaftspolitiken der Teile des Reiches aufeinander abgestimmt werden, um ein interimperiales Wirtschaftswachstum zu fördern."
RAJ_Foster_Private_Investment:0	"Private Investitionen fördern"
RAJ_Foster_Private_Investment_desc:0	"Um das Wirtschaftswachstum und die Entwicklung in Indien zu fördern, ist es wichtig, private Investitionen aus dem In- und Ausland zu unterstützen. Dies kann durch verschiedene Maßnahmen wie steuerliche Anreize, Erleichterungen für Unternehmen und die Schaffung eines günstigen Investitionsklimas erreicht werden. Durch die Förderung von Privatinvestitionen können wir die Wirtschaft ankurbeln und Innovationen in verschiedenen Sektoren vorantreiben."
RAJ_Reform_the_Colonial_Economy:0	"Reform der kolonialen Wirtschaft"
RAJ_Reform_the_Colonial_Economy_desc:0	"In der Vergangenheit hat die Wirtschaftsplanung in [RAJ.GetNameDef] die Bedürfnisse der indischen Bevölkerung zugunsten der Maximierung von Ressourcenabbau und Profiten vernachlässigt. Wenn wir die Herrschaft über Indien in solch schwierigen Zeiten aufrechterhalten wollen, muss sich dies ändern."
RAJ_Initiate_Land_Reform:0	"Initiieren Sie eine Landreform"
RAJ_Initiate_Land_Reform_desc:0	"Der derzeitige Landbesitz und die Landverteilung in Indien sind zutiefst fehlerhaft und begünstigen unverhältnismäßig die Wohlhabenden und Einflussreichen. Indem wir eine Landreform einleiten, können wir auf eine gerechtere Verteilung von Land hinarbeiten und sicherstellen, dass die Rechte von Kleinbauern und marginalisierten Gemeinschaften geschützt werden. Dies wird nicht nur diesen Gruppen zugute kommen, sondern auch das Wirtschaftswachstum und die Entwicklung des ganzen Landes ankurbeln."
RAJ_Centralise_the_Courts:0	"Zentralisierung des Gerichtswesens"
RAJ_Centralise_the_Courts_desc:0	"Das indische Gerichtssystem ist, vor allem wegen der vorkolonialen Königreiche, aber auch wegen der britischen Einmischung, ein unnötig kompliziertes Geflecht von Gerichtsbarkeiten. Das macht Geschäfte viel schwieriger, als sie sein müssten."
RAJ_Open_our_Markets:0	"Öffnen Sie unsere Märkte"
RAJ_Open_our_Markets_desc:0	"Ausländische Investitionen in Indien, die nicht aus Großbritannien stammen, sind aufgrund der Abschottung des Subkontinents spärlich. Die neue Regierung muss daher der Welt verkünden, dass Indien Handel und Investitionen mit offenen Armen empfängt."
RAJ_Rural_Education:0	"Ländliche Bildung"
RAJ_Rural_Education_desc:0	"Die Ausweitung der Dorfschulen würde der Landbevölkerung helfen, bessere Beschäftigungsmöglichkeiten zu finden und zur Entwicklung ihrer Gemeinden beizutragen. Außerdem wird eine besser ausgebildete Bevölkerung zu einem höheren Wirtschaftswachstum und einer besseren Bürokratie in den ländlichen Gebieten führen. Schließlich könnte ein verbesserter Zugang zu Bildung auch dazu beitragen, Armut und Ungleichheit zu verringern und so ein besseres Indien aufzubauen."
RAJ_Cross_Country_Railways:0	"Länderübergreifende Eisenbahnen"
RAJ_Cross_Country_Railways_desc:0	"Die Verbindung der riesigen und vielfältigen Regionen Indiens durch ein Netz von überregionalen Eisenbahnen wird den Transport und die Kommunikation zwischen unseren Städten und Gemeinden erheblich verbessern. Dadurch wird der Waren- und Personenverkehr effizienter, was zu Wirtschaftswachstum und Entwicklung führt. Darüber hinaus werden durch den Bau und die Instandhaltung dieser Eisenbahnen Arbeitsplätze geschaffen und die Wirtschaft angekurbelt. Investitionen in länderübergreifende Eisenbahnen sind ein entscheidender Schritt zur Modernisierung und Einigung unseres Landes."
RAJ_Electrify_the_Network:0	"Elektrifizierung des Netzes"
RAJ_Electrify_the_Network_desc:0	"Als Rückgrat unseres Verkehrssystems ist das Schienennetz entscheidend für die wirtschaftliche Entwicklung unseres Landes. Durch die Elektrifizierung des Schienennetzes können wir die Effizienz und Geschwindigkeit unserer Züge erhöhen, unsere Abhängigkeit von ausländischen fossilen Brennstoffen verringern und damit unsere heimische Wirtschaft erheblich stärken."
RAJ_Cooperation_with_the_Princes:0	"Zusammenarbeit mit den Prinzen"
RAJ_Cooperation_with_the_Princes_desc:0	"Um Indien effektiv zu regieren, ist es notwendig, starke Beziehungen zu den lokalen Fürsten und ihren Territorien aufzubauen. Wenn wir zusammenarbeiten, können wir Stabilität und Wohlstand für alle Regionen des Landes sicherstellen. Dies kann die gemeinsame Nutzung von Ressourcen, die Koordinierung von Maßnahmen und die Zusammenarbeit bei Projekten zum Nutzen der indischen Bevölkerung beinhalten."
RAJ_Expand_Tata_Steel:0	"Erweitern Sie Tata Steel"
RAJ_Expand_Tata_Steel_desc:0	"Tata Steel war in den letzten dreißig Jahren ein Eckpfeiler der indischen Industrialisierung. Um mit den rasanten Veränderungen in der Weltwirtschaft Schritt halten zu können, ist es unerlässlich, dass wir weiterhin in den Ausbau und die Modernisierung von Tata Steel investieren. Dies wird nicht nur unsere Position als führender Stahlproduzent sichern, sondern auch neue Arbeitsplätze schaffen und das Wirtschaftswachstum im ganzen Land fördern."
RAJ_Rewrite_Business_Law:0	"Private Investitionen diversifizieren"
RAJ_Rewrite_Business_Law_desc:0	"Beim Übergang in eine neue Ära der Unabhängigkeit ist es unerlässlich, dass wir unsere privaten Investitionen diversifizieren, um Stabilität und Wachstum für unser Land zu gewährleisten. Indem wir unsere Investitionen auf verschiedene Sektoren und Branchen verteilen, können wir uns vor den potenziellen Risiken und Rückschlägen schützen, die in einem bestimmten Bereich auftreten können. Diese Strategie wird es uns ermöglichen, zuversichtlich voranzuschreiten und eine starke und blühende Zukunft für Indien aufzubauen."
RAJ_Sideline_the_Unions:0	"Schieben Sie die Gewerkschaften beiseite"
RAJ_Sideline_the_Unions_desc:0	"Die Gewerkschaften waren in Indien oft eine Quelle der Störung und ein Hindernis für den Fortschritt. Wenn wir ihren Einfluss zurückdrängen und alternative Wege finden, um die Anliegen der Arbeitnehmer zu berücksichtigen, können wir uns auf die wichtigen Aufgaben der Modernisierung und Stärkung unseres Landes konzentrieren. Dies wird auch dazu beitragen, die Beziehungen zwischen Management und Arbeitnehmern zu verbessern, was zu einer effizienteren und produktiveren Belegschaft führen wird."
RAJ_Commercial_Port_Expansion:0	"Ausbau der Handelshäfen"
RAJ_Commercial_Port_Expansion_desc:0	"Da [RAJ.GetNameDef]s Wirtschaft weiter expandiert und sich industrialisiert, ist es wichtig, dass wir auch unsere Handelshäfen ausbauen und verbessern. Indem wir die Kapazität und Effizienz dieser Häfen erhöhen, können wir den Handel mit anderen Ländern besser erleichtern und den wachsenden Bedarf unserer eigenen Industrie decken. Dieser Ausbau wird nicht nur unserer Wirtschaft zugute kommen, sondern auch neue Beschäftigungsmöglichkeiten für die Menschen in Indien schaffen."
RAJ_Irrigation_Infrastructure:0	"Bewässerungsinfrastruktur"
RAJ_Irrigation_Infrastructure_desc:0	"Da Indien weiter wächst und sich entwickelt, ist es wichtig, dass wir in eine moderne Bewässerungsinfrastruktur investieren. Durch den Bau von Kanälen und Reservoirs können wir sicherstellen, dass unsere Pflanzen auch in Zeiten der Dürre zuverlässig mit Wasser versorgt werden. Dies wird nicht nur den Landwirten und ihrem Lebensunterhalt zugute kommen, sondern sich auch positiv auf die Gesamtwirtschaft unseres Landes auswirken."
RAJ_Foundations_for_the_First_Five_Year_Plan:0	"Grundlagen für den ersten Fünfjahresplan"
RAJ_Foundations_for_the_First_Five_Year_Plan_desc:0	"Die neu eingerichtete Planungskommission hat Pläne für das Wirtschaftswachstum aufgestellt, die der indischen Wirtschaft langfristig großen Auftrieb geben werden. Wenn diese Pläne nicht umgesetzt werden, kann es zu einem wirtschaftlichen Abschwung kommen."
RAJ_Seek_Trading_Partners:0	"Vergabe von Landzuteilungen"
RAJ_Seek_Trading_Partners_desc:0	"Wir werden Erschließungsgenehmigungen, Landerwerb und Landzuteilungen in einem Umfang vergeben, wie es ihn auf dem Subkontinent noch nie gegeben hat. Dies wird die Entwicklung der indischen Wirtschaft erheblich vorantreiben."
RAJ_Invite_Mining_Companies:0	"Bergbauunternehmen einladen"
RAJ_Invite_Mining_Companies_desc:0	"Die natürlichen Ressourcen Indiens sind riesig und noch nicht erschlossen. Wenn wir Bergbauunternehmen einladen, unser Land zu beanspruchen, können wir nicht nur Arbeitsplätze für unsere Bevölkerung schaffen, sondern auch dringend benötigtes Kapital für die Entwicklung unseres Landes einbringen. Diese Unternehmen werden Technologien und Fachwissen mitbringen und uns dabei helfen, unsere Ressourcen optimal zu fördern und zu nutzen."
RAJ_Development_funds_for_the_States:0	"Entwicklungsfonds für die Staaten"
RAJ_Development_funds_for_the_States_desc:0	"Die Unterstützung der meist kleinen und unterentwickelten Fürstentümer beim Aufbau von Infrastruktur und Industrie wird die industrielle Basis Indiens erheblich stärken."
RAJ_Bastions_of_Stablity:0	"Bastionen der Stabilität"
RAJ_Bastions_of_Stablity_desc:0	"In einer Zeit des politischen Umbruchs und der Ungewissheit ist es von entscheidender Bedeutung, dass wir uns auf die Stabilität und Ordnung verlassen können, die die Fürstenstaaten bieten. Diese Staaten können auf eine lange Geschichte der Herrschaft zurückblicken und haben sich als zuverlässige Partner bei der Aufrechterhaltung von Frieden und Wohlstand innerhalb und außerhalb ihrer Grenzen erwiesen."
RAJ_Industrial_Expertise:0	"Industrielle Kompetenz"
RAJ_Industrial_Expertise_desc:0	"Dank einer Kombination aus Bildung, ausländischer Hilfe und einheimischer Entwicklung verfügt Indiens Industriebelegschaft über ein in diesem Teil der Welt unbekanntes Niveau an Fachwissen."
RAJ_Mechanized_Agriculture:0	"Mechanisierte Landwirtschaft"
RAJ_Mechanized_Agriculture_desc:0	"Wir werden mechanische Pflüge und andere landwirtschaftliche Geräte in den größten Betrieben einführen, um unsere landwirtschaftliche Produktion erheblich zu steigern."
RAJ_Minimum_Wage_Legislation:0	"Gesetzliche Mindestlöhne"
RAJ_Minimum_Wage_Legislation_desc:0	"Da wir in ein neues Zeitalter für Indien eintreten und der industrielle Fortschritt unser Land erfasst, ist es von entscheidender Bedeutung, dass wir die Rechte und Löhne unserer Arbeiterklasse schützen. Die Einführung von Mindestlohngesetzen wird sicherstellen, dass alle Arbeitnehmer eine faire Entlohnung für ihre Arbeit erhalten und dazu beitragen, Armut und Ungleichheit in unserer Gesellschaft zu verringern."
RAJ_Protectionist_Tariffs:0	"Protektionistische Zölle"
RAJ_Protectionist_Tariffs_desc:0	"Die Einführung höherer Zölle wäre für die indischen Unternehmen eindeutig positiv, da sie dadurch unter gleichen Bedingungen mit internationalen Unternehmen konkurrieren könnten und mehr Schutz vor externem wirtschaftlichen Druck hätten. Außerdem könnten indische Unternehmen so die dringend benötigte Unterstützung erhalten und zur Schaffung von Arbeitsplätzen und zur Ankurbelung des Wirtschaftswachstums beitragen."
RAJ_Integrate_Princely_Economies:0	"Fürstliche Volkswirtschaften integrieren"
RAJ_Integrate_Princely_Economies_desc:0	"In der Vergangenheit erlaubte das britische Raj den verschiedenen Fürstentümern, ihre eigene Wirtschaft aufrechtzuerhalten, was zu einem Flickenteppich unterschiedlicher Systeme und Praktiken führte. Es ist an der Zeit, diese Volkswirtschaften zusammenzuführen und sie in ein zusammenhängendes Ganzes zu integrieren. Dies wird einen effizienteren Handel und wirtschaftliches Wachstum sowie ein größeres Gefühl der Einheit innerhalb der Nation ermöglichen."
RAJ_Solidify_Control_over_the_Banks:0	"Die Kontrolle über die Banken festigen"
RAJ_Solidify_Control_over_the_Banks_desc:0	"Die indischen Banken wurden lange Zeit von ausländischen Interessen kontrolliert, ohne sich um die Probleme der Bevölkerung zu kümmern. Jetzt ist es an der Zeit, dass wir die Kontrolle übernehmen und sie nutzen, um die Entwicklung und das Wachstum unseres Landes zu fördern. Wir müssen sicherstellen, dass die Banken im besten Interesse des Volkes arbeiten und nicht nur den Interessen einiger weniger dienen."
RAJ_Broad_Union_Support:0	"Groß angelegte Verstaatlichungen"
RAJ_Broad_Union_Support_desc:0	"Als neue unabhängige Nation ist es wichtig, dass wir die Kontrolle über unsere eigenen Ressourcen und Industrien übernehmen. Die groß angelegte Verstaatlichung von Schlüsselsektoren wie Energie, Transport und Produktion wird es uns ermöglichen, unsere eigene Zukunft besser zu gestalten und sicherzustellen, dass die von diesen Industrien erwirtschafteten Gewinne wieder in unser eigenes Land investiert werden."
RAJ_Ease_Agricultural_Regulations:0	"Landwirtschaftliche Vorschriften lockern"
RAJ_Ease_Agricultural_Regulations_desc:0	"Landwirtschaftliche Vorschriften waren lange Zeit eine Belastung für die Landwirte und haben sie daran gehindert, ihre Produkte zu produzieren und zu verkaufen. Indem wir diese Vorschriften lockern, können wir den Landwirten mehr Freiheit in ihren Betrieben gewähren und ihnen ermöglichen, zu gedeihen, was zu einer stärkeren Agrarindustrie in Indien führt."
RAJ_Rural_Development:0	"Ländliche Entwicklung"
RAJ_Rural_Development_desc:0	"Um den dringend benötigten Wandel im ländlichen Indien herbeizuführen, müssen wir uns auf die Verbesserung der Infrastruktur, den Zugang zu Bildung und Gesundheitsversorgung und die Förderung der wirtschaftlichen Entwicklung konzentrieren. Indem wir in diese Bereiche investieren, können wir Gemeinden aus der Armut befreien und unsere Wirtschaft deutlich stärken."
RAJ_Excavation_Investments:0	"Ausgrabungs-Investitionen"
RAJ_Excavation_Investments_desc:0	"Indem wir in Grabungsprojekte in ganz Indien investieren, können wir dem Land neue Möglichkeiten für wirtschaftliches Wachstum und Entwicklung eröffnen. Diese Investitionen können dazu beitragen, wertvolle Ressourcen freizulegen und neue Arbeitsplätze im Bergbau- und Abgrabungssektor zu schaffen."
RAJ_Large_Scale_Privitizations:0	"Groß angelegte Privatisierungen"
RAJ_Large_Scale_Privitizations_desc:0	"Um das Wirtschaftswachstum anzukurbeln und die Effizienz zu steigern, planen wir die Privatisierung staatlicher Unternehmen in großem Umfang. Dies wird Investitionen und Management durch den privaten Sektor ermöglichen und neue Ideen und Innovationen in diese Industrien bringen. Der Erfolg dieser Politik wird den Menschen in Indien sehr zugute kommen, da sie zur Schaffung von Arbeitsplätzen und zu einer erhöhten Wettbewerbsfähigkeit auf dem Weltmarkt führen wird."
RAJ_Electrification_of_India:0	"Elektrifizierung Indiens"
RAJ_Electrification_of_India_desc:0	"In dem Bemühen, die Lebensqualität der Bürger im ganzen Land zu modernisieren und zu verbessern, setzen wir einen Plan um, um unsere Industriezentren mit Strom zu versorgen. Dazu gehören der Bau neuer Kraftwerke, der Ausbau von Übertragungsleitungen und die Bereitstellung eines stabilen Zugangs zu unserem Industriesektor."
RAJ_Manufacturing_Plants:0	"Fabriken"
RAJ_Manufacturing_Plants_desc:0	"Um das Wirtschaftswachstum anzukurbeln und Arbeitsplätze zu schaffen, müssen wir uns auf den Auf- und Ausbau von Produktionsstätten in ganz Indien konzentrieren. Diese Anlagen werden eine Reihe von Produkten herstellen, von Konsumgütern bis hin zu Industrieausrüstungen, die dazu beitragen, unsere Wirtschaft zu diversifizieren und den Menschen im ganzen Land Chancen zu bieten."
RAJ_Arms_Foundries:0	"Rüstungsgießereien"
RAJ_Arms_Foundries_desc:0	"Um die steigende Nachfrage nach Waffen für unser wachsendes Militär zu decken, müssen wir im ganzen Land Waffengießereien errichten. Diese Gießereien werden nicht nur die dringend benötigte Ausrüstung für unsere Soldaten liefern, sondern auch die Nachfrage in unserer Stahl-, Kohle- und Schwefelindustrie ankurbeln."
RAJ_Import_Industrial_Machinery:0	"Importieren Sie Industriemaschinen"
RAJ_Import_Industrial_Machinery_desc:0	"Um mit unseren radikalen wirtschaftlichen Zielen Schritt halten zu können, muss Indien die neuesten und effizientesten Industriemaschinen aus den industriellen Zentren der Welt importieren. Durch die Einfuhr ausländischer Maschinen können wir die Produktivität und Wettbewerbsfähigkeit in verschiedenen Industriezweigen steigern, was letztlich zu Wirtschaftswachstum und Wohlstand für die Nation führt."
RAJ_Solidify_Business_Ties:0	"Geschäftsbeziehungen festigen"
RAJ_Solidify_Business_Ties_desc:0	"Der Optimismus der Investoren beginnt zu schwinden, da die Realitäten von Investitionen in einer unterentwickelten Wirtschaft sie einholen. Aber eine Reihe von Treffen, um ihre Bedenken zu hören, sollte sie zum Schweigen bringen."
RAJ_International_Division_of_Labour:0	"Internationale Arbeitsteilung"
RAJ_International_Division_of_Labour_desc:0	"Die internationale Arbeitsteilung bezieht sich auf die Art und Weise, wie sich verschiedene Länder auf der Grundlage ihrer einzigartigen Vorteile und Ressourcen auf die Produktion bestimmter Waren oder Dienstleistungen spezialisieren. Dies ermöglicht eine effizientere und kostengünstigere Produktion, da sich die Länder auf ihre Fachgebiete konzentrieren und mit anderen Ländern Handel für die benötigten Waren und Dienstleistungen treiben können. Durch die internationale Arbeitsteilung kann Indien seine Stärken und Ressourcen nutzen, um sein Wirtschaftswachstum und seinen Wohlstand zu steigern."
RAJ_Soviet_Economic_Assistance:0	"Sowjetische Wirtschaftshilfe"
RAJ_Soviet_Economic_Assistance_desc:0	"In dem Bemühen, die Wirtschaft anzukurbeln und Wohlstand nach Indien zu bringen, werden wir die Sowjetunion um Hilfe in Form von Wirtschaftshilfe und Entwicklungsprojekten bitten. Dies wird nicht nur dringend benötigte Ressourcen und Unterstützung bringen, sondern auch unsere politischen und wirtschaftlichen Beziehungen zur Sowjetunion stärken."
RAJ_Further_British_Investments:0	"Weitere britische Investitionen"
RAJ_Further_British_Investments_desc:0	"Während [RAJ.GetNameDef] sich weiter entwickelt und modernisiert, ist es wichtig, starke Beziehungen zu unserem kolonialen Oberherrn, Großbritannien, zu pflegen. Investitionen von den Heimatinseln werden nicht nur unsere wirtschaftlichen Beziehungen stärken, sondern auch neue Technologien und Fachwissen in unsere Industrien bringen. Davon werden sowohl der indische Subkontinent als auch die britischen Inseln profitieren, wenn wir gemeinsam an einer besseren Zukunft für das Empire arbeiten."
RAJ_Machinery_for_Textiles:0	"Maschinen für Textilien"
RAJ_Machinery_for_Textiles_desc:0	"Die indische Textilindustrie war schon immer riesig, aber mit der Einführung von Webstühlen und ähnlichen Maschinen explodierte ihre Produktivität und es werden Märkte benötigt, um das Angebot zu ergänzen. Wir werden diese Märkte in den sozialistischen Volkswirtschaften der Welt finden, von denen viele industrielle Zentren entwickelt haben, aus denen wir Maschinen importieren werden, die wir für unsere industrielle Entwicklung benötigen."
RAJ_Raw_Material_Imports:0	"Importe von Rohstoffen"
RAJ_Raw_Material_Imports_desc:0	"Indien ist ein riesiger Subkontinent, der reich an Ressourcen ist, aber vieles davon ist schwer zu gewinnen und auch die Vielfalt ist gering. Wir wenden uns an unsere brüderlichen Brüder, um diese Rohstoffe zu importieren, die in unserer Produktionskette fehlen."
RAJ_Exchange_of_Luxury_Goods:0	"Austausch von Luxusgütern"
RAJ_Exchange_of_Luxury_Goods_desc:0	"Während Indien überquellende Lagerbestände an Zucker und Kaffee hat, sind die osteuropäischen Volkswirtschaften mit Vieh und Leinen überversorgt. Die Erleichterung des Handels mit nicht lebensnotwendigen Gütern wird den Lebensstandard beider Nationen deutlich erhöhen."
RAJ_Resources_for_the_Home_Isles:0	"Ressourcen für die Heimatinseln"
RAJ_Resources_for_the_Home_Isles_desc:0	"Die Bedrohungen für die Sicherheit Großbritanniens nehmen zu und es ist die Aufgabe des Empires, die für die britische Produktion benötigten Ressourcen bereitzustellen."
RAJ_Agricultural_Subsidies:0	"Subventionen für die Landwirtschaft"
RAJ_Agricultural_Subsidies_desc:0	"Der indische Agrarsektor ist das Rückgrat unserer Wirtschaft und bietet Millionen von Menschen Arbeit und Nahrung. Es handelt sich jedoch auch um einen Wirtschaftszweig, der stark von Wetter- und Marktschwankungen beeinflusst wird. Durch die Einführung von Agrarsubventionen können wir unseren Landwirten die dringend benötigte Unterstützung zukommen lassen und das weitere Wachstum und den Erfolg dieses lebenswichtigen Sektors sicherstellen."
RAJ_Continued_Expansion_of_the_Ordnance_Foundries:0	"Fortgesetzte Expansion der Waffengießereien"
RAJ_Continued_Expansion_of_the_Ordnance_Foundries_desc:0	"Die Waffengießereien in Indien sind für die Produktion von Waffen und Munition für unser Militär von entscheidender Bedeutung. Wenn wir diese Gießereien weiter ausbauen und modernisieren, können wir sicherstellen, dass unsere Soldaten über die bestmögliche Ausrüstung zur Verteidigung unseres Landes verfügen."
RAJ_Contributions_to_the_War_Effort:0	"Beiträge zu den Kriegsanstrengungen"
RAJ_Contributions_to_the_War_Effort_desc:0	"Schon im Großen Krieg hat die fürstliche Unterstützung bei den Kriegsanstrengungen zum Sieg über das Deutsche Reich enorm geholfen und mit einem weiteren großen Krieg am Horizont können wir sicher wieder auf ihre Unterstützung zählen."
RAJ_Connect_the_Remote_Provinces:0	"Entwickeln Sie die abgelegenen Provinzen"
RAJ_Connect_the_Remote_Provinces_desc:0	"Die ländliche und isolierte Bevölkerung Indiens wurde oft zugunsten der Bevölkerungszentren des Subkontinents vernachlässigt. Die Entwicklung dieser vernachlässigten Teile des Raj, in denen die Landwirtschaft nur einen geringen Überschuss produziert, wird zur nationalen Nahrungsmittelversorgung beitragen."
RAJ_Expand_the_Diplomatic_Corps:0	"Das diplomatische Korps ausbauen"
RAJ_Expand_the_Diplomatic_Corps_desc:0	"Indien hat eine ehrgeizige außenpolitische Agenda und es wird erwartet, dass der Ausbau des diplomatischen Korps dem Land helfen wird, seine Ziele zu erreichen. Die neue diplomatische Präsenz wird Indien in die Lage versetzen, besser mit wichtigen Partnern zusammenzuarbeiten und mehr Initiative in globalen Angelegenheiten zu ergreifen. Sie wird uns bei der Suche nach einem Sicherheitspakt, der die Sicherheit Indiens garantiert, sehr helfen."
