RAJ_navy_experience_cost_tt:0	"£navy_experience §Y10§!\n"
AIML_UP_COALITION:0	"Die Unionistische Partei ist in einer Koalition mit der All-India Muslim League."
aiml_up_coalition_news:0	"Ihre Unterstützung in den Provinzen mit muslimischer Mehrheit war außerordentlich gering, da sie sich mit der umstrittenen All-India Muslim League verbündete, die den Weg für ein unabhängiges Pakistan ebnete."
aiml_up_fight_news:0	"Sie kämpften tapfer gegen die allseits beliebte All-India Muslim League, die einen eigenen Staat für Muslime vorschlug und mit dieser Idee viele Stimmen und viel Aufmerksamkeit auf sich zog."
aiml_up_neutral_news:0	"Sie erwiesen sich als die Partei, die von den Minderheiten in ihrer jeweiligen Provinz am stärksten unterstützt wurde, so dass dieser lange geteilte Subkontinent vielleicht, aber nur vielleicht, endlich Frieden erleben wird."
ifyouseethisreportitasabug:0	"\n\nWenn Sie diese Nachricht sehen, melden Sie dies als Fehler im Discord, am besten mit der Speicherdatei."
