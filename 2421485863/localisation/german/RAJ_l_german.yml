l_german:
RAJ_Establishing_National_Government_desc:0	"We currently putting together a constitution and with it, for the first time in history, building a native, democratic subcontinent-spanning government ready to face any adversities it may encounter."
RAJ_assert_control_over_lhoyu_desc:0	"The North-East Frontier Tracks has been incorrectly displayed on our maps for nearly two decades, allowing the state of Tibet to control the area on our side of the MacMahon line. We should correct the mitakes of the path and ensure that the state of [434.GetName] remains under our control."
RAJ_jack_higgins:0	"Jack Higgins"
RAJ_arjan_singh_vibhushan:0	"Arjan Singh Vibhushan"
raj_legislative_situation:0	"Legislative Situation"
raj_legislative_situation_desc:0	"Wenn unsere Regierung jemals ein Gesetz verabschieden will, müssen wir uns mit dem kaiserlichen Legislativrat auseinandersetzen, der aus einer Mischung aus gewählten und ernannten Mitgliedern und verschiedenen Interessengruppen besteht. Wir müssen ihre Bedürfnisse sorgfältig ausbalancieren, wenn wir am Ende eine stabile Nation haben wollen, wenn die Politik vorbei ist.\n[RAJ.Current_Act][RAJ.Legislative_Status]"
finalize_the_vote:0	"Schließen Sie die Abstimmung ab"
legislative_status:0	"\n\tDie derzeitige Meinung der Hindus zum Gesetz ist: [RAJ.ind_support_loc]\n\tDie derzeitige Meinung der Muslime zu dem Gesetz ist: [RAJ.pak_support_loc]\n"
FOCUS_FILTER_RAJ_PROVINCIAL_ELECTIONS:0	"Provinzwahlen"
legislative_railway:0	"In den höchsten Kammern der Regierung wird heftig über den Railway Expansion Act diskutiert. Die Ziele des Gesetzes sind der Bau verstaatlichter, nicht gewinnorientierter Bahnverbindungen, um unsere industriellen Ziele zu fördern."
legislative_agriculture:0	"In den höchsten Kammern der Regierung wird heftig über das Gesetz zur Stabilisierung der Landwirtschaft debattiert. Unsere wichtigsten Ziele sind die Verbesserung der lokalen Bewässerung und eine gelenkte Produktion von Getreide und Importen."
legislative_education:0	"In den höchsten Kammern der Regierung wird heftig über das Bildungsreformgesetz debattiert. Wir haben seine wichtigsten Ziele wie folgt dargestellt: Die Verhinderung der Abwanderung indischer Intellektueller an englische Universitäten und die Verbesserung der Bildung auf dem Lande zur Steigerung des industriellen und landwirtschaftlichen Know-hows."
legislative_insurance:0	"In den höchsten Kammern der Regierung findet eine heftige Debatte über das Versicherungsgesetz statt. Die eifrigsten Befürworter des Gesetzes nennen den schlechten Zustand der indischen Investitionen als das Hauptproblem, das sie zu lösen versuchen. Sie wollen es angehen, indem sie das Versicherungsgeschäft endlich regulieren."
legislative_war:0	"In den höchsten Kammern der Regierung wird heftig über den War Powers Act diskutiert. Der Vizekönig betonte, dass dies keine Zeit für Debatten ist, Indien befindet sich im Krieg und die Exekutive muss die Befugnis haben, diesen Krieg zu führen. Jede Verzögerung dieses Gesetzes wird die feindlichen Kriegsanstrengungen unterstützen!"
legislative_idle:0	"Die Säle des kaiserlichen Legislativrats bleiben untätig, da derzeit kein Gesetzentwurf diskutiert wird."
raj_sov_nuclear_name:0	"Das Abkommen über neue Technologien für die nationale Verteidigung"
raj_sov_nuclear_desc:0	"Das Atomzeitalter ist angebrochen und die sozialistischen Länder der Welt können es sich nicht leisten, mit ihrem Atomprogramm hinter den kapitalistischen Staaten zurückzubleiben. Die Weitergabe unserer atomaren Erkenntnisse an das sowjetische Volk und umgekehrt wird der Sicherheit beider Staaten sehr zugute kommen."
