ilp_concessions:0	"Sozialistische Zugeständnisse"
ilp_concessions_desc:0	"Die indische Linke ist gespalten und verfolgt unterschiedliche Ziele. \nUnser Fokus auf das Kastensystem gibt uns reichlich Gelegenheit, mit verschiedenen anderen Gruppen zusammenzuarbeiten und Kompromisse zu schließen, die vielleicht auch einige gegensätzliche Forderungen haben. Aber wenn wir unsere gemeinsamen Interessen ausbalancieren, würde das unserer Wahlstrategie sehr helfen."
invade_pak_or_placate_muslims:0	"Wenn §YPakistan§! ein unabhängiger Staat ist, werden wir ein §YKriegsziel§! gegen sie erreichen. Wenn nicht, werden wir die §YMuslime§! in ihren Kernstaaten besänftigen."
viceroy_anger_very_high:0	"Das wird den Zorn des Vizekönigs sehr stark erhöhen."
viceroy_anger_high:0	"Dies wird den Zorn des Vizekönigs §Erheblich§! erhöhen."
viceroy_anger_medium:0	"Dies wird §Ysomewhat§! den Zorn der Vizekönige erhöhen."
