raj3progressindependence:0	"Indien wird auf dem Weg zur Unabhängigkeit §G+0.3% pro Tag§! schneller vorankommen."
raj_3progressindependence:0	"Indien wird auf dem Weg zur Unabhängigkeit §G+0,3% pro Tag§! langsamer vorankommen."
