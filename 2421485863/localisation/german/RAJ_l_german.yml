RAJ_subhas_chanda_bose_desc:0	"Der Indische Nationalkongress hat Indien bei den Aussichten auf Unabhängigkeit im Stich gelassen. Es ist nun an der Zeit, den Kampf direkt zu den Briten zu tragen."
RAJ_Krishna_Pillai:0	"P. Krishna Pillai"
RAJ_Shripad_Amrit_Dange:0	"Shripad Armit Dange"
RAJ_pramod_ranjan_sengupta:0	"Pramod Ranjan Sengupta"
india.279.t:0	"Der Status der Frauen"
india.279.desc:0	"Wir haben uns bereits mit vielen politischen Maßnahmen und Ungerechtigkeiten der Vorgängerregierung befasst, aber eine haben wir ganz und gar vermieden: die Gleichstellung der Geschlechter. Es gibt viele unterschiedliche Meinungen zu diesem Thema, die es zu beschwichtigen gilt, und es ist in unserem besten Interesse, diese Frage schnell zu klären."
india.279.a:0	"Lassen Sie uns unsere Rückständigkeit nicht fortsetzen."
india.279.b:0	"Lassen Sie uns hier nichts überstürzen."
india.279.c:0	"Ein paar Traditionen sollten wir besser beibehalten."
india.280.t:0	"Der Vizekönig wird besorgt"
india.280.desc:0	"Obwohl sich das Amt des Vizekönigs von den Provinzwahlen distanzieren soll, gab es Gerüchte über Versuche, unsere Kampagne zu sabotieren. Natürlich können sie nicht allzu erfolgreich gewesen sein, sonst wären wir nicht hier. Dennoch scheint der Vizekönig abzuwägen, ob er seine Position nutzen soll, um eine Politik zu kippen, die er für unangemessen hält, und unsere Bewegung zu sabotieren. Wir sollten vorsichtig vorgehen, wenn wir den Zorn des Generalgouverneurs vermeiden wollen."
india.280.a:0	"Zur Hölle mit ihm."
india.281.t:0	"Einmischung in unsere Politik"
india.281.desc:0	"Die machtgierigen, kolonialistischen Finger des Vizekönigs haben die Gelegenheit ergriffen, nachdem wir die privaten Eisenbahnen und die allgemeine Infrastruktur beschlagnahmt hatten, die Änderung rückgängig zu machen und das indische Vertriebsnetz auf der Strecke zu lassen, wie er es immer getan hat, und wofür das alles? Ein kleiner, unbedeutender politischer Gewinn. Während dieser Schritt selbst von der indischen Bevölkerung weithin kritisiert wurde, ging die Entscheidung des Vizekönigs spektakulär nach hinten los, denn die wenigen Einheimischen, die an den guten Willen der Briten glaubten, sahen sie endlich als das, was sie sind: Ausbeuterische, hochmütige Imperialisten."
india.282.desc:0	"Die machtgierigen, kolonialistischen Finger des Vizekönigs haben die Gelegenheit ergriffen, nachdem wir die privaten Fabriken und allgemeinen Unternehmen beschlagnahmt hatten, von und für die Angestellten, den Wandel rückgängig zu machen und Indiens Wirtschaft auf der Strecke zu lassen, wie er es immer getan hat, und wofür? Ein kleiner, unbedeutender politischer Gewinn. Während dieser Schritt selbst von der indischen Bevölkerung stark kritisiert wurde, ging die Entscheidung des Vizekönigs spektakulär nach hinten los, denn die wenigen Einheimischen, die an den guten Willen der Briten glaubten, sahen sie endlich als das, was sie sind: Ausbeuterische, hochmütige Imperialisten."
india.283.desc:0	"Die machtgierigen, kolonialistischen Finger des Vizekönigs haben die Gelegenheit ergriffen, nachdem wir die Bankenkooperation beschlagnahmt hatten, die Änderung rückgängig zu machen und das indische Vertriebsnetz auf der Strecke zu lassen, wie er es immer tat, und wofür? Ein kleiner, unbedeutender politischer Gewinn. Während dieser Schritt selbst von der indischen Bevölkerung stark kritisiert wurde, ging die Entscheidung des Vizekönigs spektakulär nach hinten los, denn die wenigen Einheimischen, die an den guten Willen der Briten glaubten, sahen sie endlich als das, was sie sind: Ausbeuterische, hochmütige Imperialisten."
india.291.t:0	"Die Sri Lanker bieten den Weißen Frieden an"
india.291.d:0	"Delegationen aus Sri Lanka trafen sich mit unserer in Madurai, um einen wichtigen Schritt in Richtung Frieden und Wohlstand für unsere beiden Nationen zu tun."
india.292.t:0	"Die Nepalesen bieten Weißen Frieden an"
india.292.d:0	"Die Delegationen aus Sri Lanka und Nepal trafen sich in Delhi, um einen wichtigen Schritt in Richtung Frieden und Wohlstand für unsere beiden Nationen zu tun."
india.293.t:0	"Das bhutanische Angebot: Weißer Frieden"
india.293.d:0	"Bhutanische Delegationen trafen sich mit unseren in Kalkutta, um einen wichtigen Schritt in Richtung Frieden und Wohlstand für unsere beiden Nationen zu machen."
india.294.t:0	"Frauenrechtsgruppen setzen ihre Forderungen durch."
india.294.d:0	"Während der Wahlen haben wir mehreren Frauenrechtsgruppen völlige Gleichberechtigung versprochen. Wir haben deswegen viele Stimmen erhalten und möglicherweise sogar die Wahl gewonnen. Jetzt, da wir gegen dieses Versprechen verstoßen haben, haben sie uns erneut in die Zange genommen."
india.294.a:0	"Das war keine besonders gute Idee."
india.2940.t:0	"Frauenrechtsgruppen suchen nach Antworten."
india.2940.d:0	"Während der Wahl haben wir die verschiedenen Frauenorganisationen im ganzen Land um Hilfe gebeten und ihnen versprochen, dass wir die einzigen sind, die bereit sind, weit genug für die Rechte der Frauen zu gehen. Doch unser Versprechen bleibt unerfüllt, was in unseren Reihen einige Fragen aufgeworfen hat."
india.2940.a:0	"Wir werden es eines Tages tun."
women_rights_demands_tt:0	"Es wäre klug, die totale Gleichberechtigung zu verwirklichen, bevor wir dazu gezwungen werden."
india.291.a:0	"Frieden, endlich"
india.291.b:0	"Keine Kapitulation, um des Imperiums willen"
RAJ_Immediate_Famine_Response:0	"Sofortige Reaktion auf die Hungersnot"
RAJ_Further_Recovery_Efforts:0	"Weitere Anstrengungen zur Bekämpfung der Hungersnot"
grant_concessions_to_the_british:0	"Gewährung von Konzessionen an die Briten"
grant_concessions_to_the_british_desc:0	"Indem wir den Briten einige kleine Zugeständnisse bei den Ressourcen machen, werden sie uns eher ziehen lassen."
grant_concessions_to_the_british_2:0	"Erteilen Sie den Briten weitere Zugeständnisse"
grant_concessions_to_the_british_2_desc:0	"Indem Sie den Briten einige größere Zugeständnisse bei den Ressourcen machen, werden sie uns eher gehen lassen."
organize_large_scale_strikes:0	"Organisieren Sie groß angelegte Streiks"
organize_large_scale_strikes_desc:0	"Die Ausbeutung der Arbeiter wird nicht nur von den Briten betrieben, aber uns von ihnen zu befreien wäre der erste Schritt zur Befreiung. Wir werden uns an groß angelegten Streiks beteiligen, um die Briten in die Knie zu zwingen."
instigate_communal_violence:0	"Kommunale Gewalt anzetteln"
instigate_communal_violence_desc:0	"Die anderen Methoden, unsere kolonialen Oberherren unter Druck zu setzen, haben versagt. Unsere einzige verbleibende Option scheint darin zu bestehen, die Flammen in den angespannten, ethnisch unterschiedlichen Städten zu schüren, in der Hoffnung, dass die Briten entsprechend reagieren werden."
promote_ethnic_harmony:0	"Ethnische Harmonie fördern"
promote_ethnic_harmony_desc:0	"Während Jinnah und seine Muslimliga die Trennung von Minderheiten predigen, müssen wir die entgegengesetzte Position einnehmen. Die Position, für eine kontinuierliche ethnische, kulturelle und religiöse Harmonie einzutreten."
utilize_more_extrem_factions:0	"Nutzen Sie die extremen Fraktionen"
utilize_more_extrem_factions_desc:0	"Während unsere Hauptkampagne gut zu laufen scheint, könnten wir durch die heimliche Unterstützung von Extremisten bei den Verhandlungen die Oberhand gewinnen."
concede_to_capitalists:0	"Zugeständnisse an die Kapitalisten"
concede_to_capitalists_desc:0	"Indem wir den wohlhabenden Industriellen unseres Landes unsere Unterstützung gewähren, sichern wir uns deren Rückhalt gegen die britischen Delegationen."
hinder_pak_influence:0	"Behindern Sie den Einfluss der AIML"
hinder_pak_influence_desc:0	"Wir müssen die Bemühungen der pakistanischen Delegationen zur Sicherung unseres Subkontinents sabotieren."
appeal_for_international_support:0	"Appell an die internationale Unterstützung"
appeal_for_international_support_desc:0	"Während unsere Diplomaten sich bemühen, die Briten unter Druck zu setzen, wäre es vielleicht effektiver, wenn wir eine ausländische Regierung im Rücken hätten."
india.10.t:0	"[?RAJBACKER.GetName] fordert ein freies Indien."
india.10.e:0	"Die [?RAJBACKER.GetAdjective] Regierung hat ihre formelle diplomatische Unterstützung für die §YIndian§! Delegationen, die sich derzeit um ihre Unabhängigkeit bemühen, ausgesprochen. Wenn man ihnen das Rederecht einräumt, könnte es ihnen leichter fallen, sich unserer Kolonialherrschaft zu widersetzen."
india.10.a:0	"Geben Sie ihnen zumindest die Gelegenheit, sich zu äußern."
india.10.b:0	"Wir werden nicht zulassen, dass [?RAJBACKER.GetNameDef] unsere Politik diktiert."
indinfluence15:0	"Die §YIndischen Delegationen§! werden es leichter haben, Druck für die §YIndische Unabhängigkeit§! auszuüben."
increase_both_influence:0	"Zusammenarbeit mit der AIML"
increase_both_influence_desc:0	"Indem wir unsere Bemühungen bündeln, werden wir effizienter Druck auf die Briten ausüben, den Subkontinent früher aus dem Kolonialismus zu befreien, auch auf Kosten der Möglichkeit, dass unsere große Nation in zwei Teile gerissen wird."
declare_independence_100_influence:0	"§Y[Root.GetReigningGovernmentColor]§! muss §Y100 Einfluss§! auf die Briten ausüben"
ind_pak_15:0	"[PAK.GetFlag]§YPakistani§! Daily §YInfluence§! will increase by 0.15\n[RAJ.GetFlag]§YIndian§! Daily §YInfluence§! will increase by 0.15"
pak5:0	"[PAK.GetFlag]§YPakistani§! Täglicher §YEinfluss§! wird um 0.05 sinken"
pak10flat:0	"[PAK.GetFlag]§YPakistani§! §YEinfluss§! wird um 10 % sinken"
pak2:0	"[PAK.GetFlag]§YPakistani§! Täglicher §YEinfluss§! wird um 0.02 erhöht"
ind10:0	"[RAJ.GetFlag]§YIndian§! Täglicher §YEinfluss§! wird um 0.1 steigen"
ind05:0	"[RAJ.GetFlag]§YIndian§! Daily §YInfluence§! wird um 0.05 erhöht"
ind_05:0	"[RAJ.GetFlag]§YIndian§! Daily §YInfluence§! wird sich um 0.05 verringern"
ind05flat:0	"[RAJ.GetFlag]§YIndian§! §YEinfluss§! erhöht sich um 5"
ind02flat:0	"[RAJ.GetFlag]§YIndian§! §YInfluence§! wird sich um 2 erhöhen"
