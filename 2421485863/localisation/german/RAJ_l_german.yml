RAJ_Demands_to_London_desc:0	"Nach den unglaublichen Opfern, die die Bevölkerung von [RAJ.GetNameDef] im Namen des Königs gebracht hat, wandern ihre Gedanken zum Thema Entschädigung. Sicherlich würden die in beiden Weltkriegen verlorenen Leben, in denen das indische Volk eng an der Seite der Heimatinseln stand, durch ein Ende des Kolonialismus, der den Subkontinent im letzten Jahrhundert beherrschte, freundlicherweise entschädigt werden."
