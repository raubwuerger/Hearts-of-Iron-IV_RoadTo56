india.100.t:0	"Unsere Regierung hat sich aufgelöst."
india.100.desc:0	"Die britische Regierung hat soeben die Gründung der Kolonie Aden und der Kolonie Burma angekündigt und damit unsere Verwaltung erheblich verkleinert."
RAJ_Tariff_Income:0	"Zolleinnahmen"
RAJ_Increased_Trade_Volume:0	"Erhöhtes Handelsvolumen"
ENG_split_up_the_British_Raj:0	"Aufspaltung des britischen Raj"
ENG_split_up_the_British_Raj_desc:0	"Wir werden separate Kolonien in Burma und Aden gründen, um unsere koloniale Verwaltung effizienter zu gestalten."
raj_port_operation:0	"Wir arbeiten daran, einen Hafen zu erwerben."
india.295.t:0	"Indien lädt uns in die Komintern ein"
india.295.desc:0	"Nachdem Indien vor kurzem der Komintern beigetreten ist, nachdem es die imperialistischen Kolonialherren Europas vertrieben hat, hat es seinen Einfluss in Südasien ausgeweitet und fragt uns nun, ob wir den Beitritt zum globalen proletarischen Bündnis akzeptieren würden."
india.295.a:0	"Arbeiter der Welt, vereinigt euch!"
india.295.b:0	"Wir weichen lieber von Moskaus Kurs ab."
india.296.t:0	"Indien lädt uns in die [RAJ.GetFactionName] ein"
india.296.desc:0	"Nachdem Indien vor kurzem die [RAJ.GetFactionName] gegründet hat, nachdem es die imperialistischen Kolonisatoren Europas vertrieben hat, hat es seinen Einfluss in Südasien ausgeweitet und fragt uns nun, ob wir der proletarischen Allianz Südasiens beitreten wollen."
india.296.a:0	"Arbeiter der Welt, vereinigt euch!"
india.296.b:0	"Wir wollen lieber von Delhis Kurs ablenken."
india.400.t:0	"Geflüster in Goa"
india.400.desc:0	"In der Kolonialstadt Goa gibt es Gerüchte über eine bevorstehende Invasion. Jeder kann sich ein solches Szenario ausdenken, aber unser Oberkommando hat eine subtile Verschiebung der militärischen Divisionen festgestellt. Eine Invasion könnte katastrophale Folgen für die lokale Bevölkerung haben, die seit 450 Jahren loyal zu Portugal steht. Die internationale Gemeinschaft wird uns wahrscheinlich den Rücken stärken, wenn wir uns ernsthaft wehren. Aber kann die internationale Unterstützung die indischen Truppen aufhalten? Sind unsere Streitkräfte der Aufgabe gewachsen? Nun, es ist leicht, Fragen zu stellen, aber schwer, sie zu beantworten."
india.400.a:0	"Não passarão!"
india.400.b:0	"Wir wollen lieber kein Blut vergießen."
india.401.t:0	"Indien hat Goa erfolgreich eingenommen"
india.401.desc:0	"Eines der wenigen verbliebenen Überbleibsel des europäischen Kolonialismus in Südasien ist an die neu gegründete [RAJ.GetNameDef] gefallen. Das portugiesische Reich scheint zu zerbröckeln."
india.401.a:0	"Raus mit den Kolonialisten!"
india.401.b:0	"Ein trauriger Tag für Portugal."
india.402.t:0	"Indien hat es nicht geschafft, Goa zu erobern"
india.402.desc:0	"Die Portugiesen haben sich furchtlos gegen die angreifende indische Armee gewehrt und einen kleinen Teil des portugiesischen Reiches bewahrt."
india.402.a:0	"Verdammt seien diese Kolonialisten."
india.402.b:0	"Unser Reich lebt einen weiteren Tag."
india.403.t:0	"Indien drängt auf ein Referendum in [320.GetName]"
india.403.desc:0	"In unserer Kolonie Französisch-Indien hat sich eine Massenprotestbewegung gebildet. Es scheint, als stecke die neu gegründete indische Regierung hinter dieser Welle der Unruhe. Die meisten Kolonialberater schlagen vor, die wenigen Häfen und Städte aufzugeben, da sie keinen wirklichen wirtschaftlichen Nutzen bringen. Wir könnten auch versuchen, die Bewegung zu unterdrücken. Wenn wir das tun, ist es ratsam, sich auf unvorhergesehene Konsequenzen vorzubereiten."
india.403.a:0	"Bringen Sie mir den Gouverneur."
india.403.b:0	"Lassen Sie die Demokratie walten."
india.404.t:0	"Das Problem mit Französisch-Indien."
india.404.descre:0	"Die Proteste weiten sich weiter aus, da unsere örtliche Polizei der Unterdrückung überdrüssig wird. Es hatte von Anfang an den Anschein, dass eine Unterdrückung der Proteste nicht in Frage käme. Aber ohne einen Herzschlag auszulassen, haben wir beschlossen, unsere kaiserliche Herrschaft zu verstärken. Diese Entscheidung war allerdings bei den Verwaltern der Insel nicht allzu beliebt, die den Forderungen der Einheimischen nachgegeben und die Provinz an Indien übergeben haben."
india.404.desc:0	"Das Referendum fiel überraschenderweise zugunsten der Vereinigung mit Indien aus und wir sind machtlos, die Übergabe zu verhindern. Die lokalen [Root.GetAdjective] Truppen werden abgezogen, die Verwalter verlegt, die [Root.GetAdjective] Flagge gesenkt und schließlich die indische Flagge gehisst."
india.404.a:0	"Das werden wir noch sehen."
india.404.b:0	"Eine ziemliche Antiklimax, nach dem, was wir überlebt haben."
india.405.t:0	"Die Frage von Burma"
india.405.desc:0	"Wir denken schon lange über eine Abtrennung Birmas von Indien nach und einige Diplomaten schmieden bereits Pläne für die Verwaltung. [Raj.GetNameDef]s Regierung hat uns angefleht, den Subkontinent sowohl aus wirtschaftlichen als auch aus administrativen Gründen geteilt zu halten. Wenn wir diese Pläne aufgeben, haben unsere Diplomaten mehr Zeit, sich um andere Bereiche zu kümmern."
india.405.a:0	"Wir haben wichtigere Dinge zu tun."
india.405.b:0	"Unsere Diplomaten werden ihre Arbeit fortsetzen."
india.406.t:0	"Die Briten haben unsere Bitte akzeptiert."
india.406.desc:0	"Die britischen Diplomaten, die an der Ausarbeitung von Plänen für eine separate birmanische Verwaltung arbeiten, wurden anderen Aufgaben zugewiesen und unsere Verwaltung bleibt unversehrt."
india.406.a:0	"Eine weise Entscheidung."
india.407.t:0	"Die Briten lehnten unser Ersuchen ab."
india.407.desc:0	"Die britische Regierung hat unsere Petition zum Erhalt der Einheit Indiens rundweg abgelehnt und ihre Diplomaten fahren mit ihren Plänen für die Kolonie Birma fort."
india.407.a:0	"Verflucht seien die Anglos."
india.408.t:0	"Die Frage von Ceylon"
india.408.desc:0	"Unser neuer gleichberechtigter Verbündeter Indien übt mehr und mehr Druck auf seine angeblichen Verbündeten in Sri Lanka aus. Während ihre Rufe nach Unabhängigkeit in den letzten Monaten immer hörbarer wurden, sollten wir diesen wichtigen Teil des Reiches wirklich aufgeben?"
india.408.a:0	"Wir werden ihnen den Dominion-Status gewähren."
india.408.b:0	"Sie werden nicht unsere Innenpolitik diktieren."
india.409.t:0	"Die Briten haben unsere Bitte akzeptiert."
india.409.desc:0	"Die britische Regierung hat der ehemaligen Kronkolonie Ceylon den Dominion-Status unter dem neuen Namen [SRL.GetNameDef] verliehen. Dies ist ein großer Sieg für die einheimische Bevölkerung Asiens."
india.409.a:0	"Wir werden sofort die Einrichtung einer Botschaft beantragen."
india.410.t:0	"Die Briten haben unseren Antrag abgelehnt."
india.410.desc:0	"Die Briten haben geantwortet, dass sie nicht die Absicht haben, die Kolonie Ceylon loszulassen. Das ist ein schwerer Schlag gegen die Ureinwohner Asiens."
india.410.a:0	"Verflucht seien die Anglos."
plead_against_seperation:0	"Lobbyarbeit gegen die Kolonie Burma"
plead_against_seperation_desc:0	"Die Briten schmieden seit langem Pläne für eine separate burmesische Kolonie, die unserer Verwaltung entrissen werden soll. Wir sollten die Briten unsere Meinung zu diesem Thema wissen lassen."
raj_prevent_state_modifier:0	"Wir werden verhindern, dass §YBurma§! eine eigene Kolonie wird und wir §Rlose§! einen §YMehrheitsanteil an ihren Ressourcen§!."
india_remains_united_tt:0	"§YBurma§! wird nicht von §Y[RAJ.GetNameDef]§! abgetrennt werden."
india_seperate_burma_tt:0	"§RBurma wird von [RAJ.GetNameDef].§! abgetrennt werden."
RAJ_port_of_yanoan:0	"Operation Koel"
RAJ_port_of_yanoan_desc:0	"Indem wir der lokalen Bevölkerung ein Referendum über die Vereinigung mit Indien versprechen, werden die Franzosen keine Macht haben, unsere Bitte abzulehnen."
RAJ_port_of_goa:0	"Operation Vriksha Deep"
RAJ_port_of_goa_desc:0	"Eine der letzten üblen Manifestationen des europäischen Kolonialismus muss an seine rechtmäßigen Besitzer zurückgegeben werden. Mit Gewalt, wenn nötig..."
GOA_border_incident_notification:0	"Drohende Grenzkriege"
RAJ_border_incident_forgotten:0	"Der Grenzkrieg ist vergessen."
RAJ_escalate_incident_to_border_conflict_GOA:0	"Eskalieren Sie den Goa-Grenzkrieg."
south_asian_liberation:0	"Südasiatische Befreiung"
south_asian_liberation_desc:0	"Um die Wurzeln der Rebellion in Südasien zu säen, müssen wir diesen unterdrückten Ländern militärische und politische Hilfe zukommen lassen.\n\nNach Abschluss eines Aufstandes werden die politische Unterstützung und die Waffen zur Verteidigung gegen jegliche Vergeltung hinübergeschickt.\n\n[RAJ.GetSalVariable]"
raj_sal_variable:0	"[SRL.GetFlag] §YSri Lankan§! Guns §Rfor the uprising§! are: §Y[?SRL_arms]§!.\n[SRL.GetFlag] §YLanka Sama Samaja Party§! Unterstützung §Rfür den Aufstand§! sind §Y[?SRL_pol]§!.\n\n[NEP.GetFlag] §YNepalese§! Waffen §Rfür den Aufstand§! sind: §Y[?NEP_arms]§!.\n[NEP.GetFlag] §YCommunist Party of Nepal§! Unterstützung §Rfür den Aufstand§! ist §Y[?NEP_pol]§!.\n\n[SRL.GetFlag] §YBhutanese§! Waffen §Rfür den Aufstand§! sind: §Y[?BHU_arms]§!.\n[BHU.GetFlag] §YBhutan Communist Party§! Unterstützung §Rfür den Aufstand§! ist §Y[?BHU_pol]§!."
