declare_independence:0	"Erklären Sie die Unabhängigkeit"
declare_independence_desc:0	"Die Zeit ist reif! Wir haben nun genug Einfluss auf die Briten gewonnen, um den Subkontinent endlich von dem Stiefel zu befreien, der ihn daran hindert, in der Welt aufzusteigen."
demand_oaths_of_loyalty:0	"Verlangen Sie Loyalitätsschwüre"
demand_oaths_of_loyalty_desc:0	"Es ist nun an der Zeit, Indien endlich zu integrieren, um den Subkontinent unter einer einzigen Regierung zu vereinen."
