raj_investor_relations_desc:0	"Die ausländischen Investoren, die in die neu geschaffene indische Marktwirtschaft eingeladen wurden, haben sofort die Gewinne gefunden, die sie sich gewünscht haben. Allerdings wachsen zwangsläufig die Ambitionen und damit auch die Erwartungen, und wenn wir diese nicht erfüllen, könnte der Investitionsfluss versiegen.\n\n Ihre derzeitige Haltung ist [RAJ.GetInvestorRelations].\n Daher beträgt das derzeitige Investitionsintervall:\n [?RAJ.investors_timeout|Y0] Tage (+[?RAJ.num_of_investments_days] aufgrund der Anzahl der Investitionen)\n und der gebäudespezifische Bauzeitbonus ist [?RAJ.investor_bonus|G%2].\n"
