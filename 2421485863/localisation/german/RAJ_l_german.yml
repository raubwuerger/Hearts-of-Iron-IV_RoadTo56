post_election_struggle:0	"Kampf für die Unabhängigkeit"
post_election_struggle_desc:0	"Wenn wir jemals die §YUnabhängigkeit§! ohne Blutvergießen erreichen wollen, müssen wir Druck auf den §YBritish§! ausüben. Wir müssen auch mehr Einfluss ausüben als unsere rivalisierende §YAll-India Muslim League§!, die Pakistan aus unseren Grenzen herausschneiden will. \n\n\t[RAJ.GetFlag] Aktueller §Y[Root.GetReigningGovernmentColor]§! Einfluss ist [?Root.ind_influence]\n\t[PAK.GetFlag] Aktueller §YAll- India Muslim League§! Einfluss ist [?Root.pak_influence]\n\nWir gewinnen derzeit täglich eine Menge §Y[?Root.ind_influence_daily] Einfluss§!, während die AIML §Y[?Root.pak_influence_daily] Einfluss§! erhält. \n\n Um §YUnabhängigkeit§! zu erreichen, müssen wir 100 Einfluss ausüben, aber wenn die §YAIML§! mehr als 50% unseres §YEinfluss§! hat, werden die Briten Pakistan als eigenen Staat freigeben. Wenn der §YAIML§! mehr als 66% unseres Einflusses hat, erhalten sie auch Kaschmir."
