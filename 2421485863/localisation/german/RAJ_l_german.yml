ilp_srl_uprising:0	"Die §YLanka Sama Samaja Party§! wird sich gegen die Ceylonische Kolonialregierung erheben und sich dem Zorn des §YBritish Imperialism§! widersetzen."
ilp_nep_uprising:0	"Die §YCommunist Party of Nepal§! wird die Rana-Monarchie stürzen und den §YSozialismus§! installieren."
