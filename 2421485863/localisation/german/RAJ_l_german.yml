ilp_sa_invite:0	"Wird alle kommunistischen §YSüdasiatischen§! Länder entweder in unsere Fraktion oder in die Komintern einladen."
if_not_communist:0	"§Wenn§! wir nicht §YKommunist§! sind, werden wir auch gewinnen:"
if_communist:0	"§Wenn§! wir §Ycommunist§! sind, werden wir auch gewinnen:"
RAJ_Societal_Investments:0	"Gesellschaftliche Investitionen"
RAJ_Assured_Stability:0	"Gesicherte Stabilität"
RAJ_Assured_Stability_desc:0	"Während alle anderen großen Parteien in Indien einen radikalen Wandel versprechen, ist es viel besser, einen schrittweisen Wandel einzuleiten und das Boot nicht ins Wanken zu bringen."
RAJ_First_Phase_Five_Year_Plan:0	"Erste Phase des Fünfjahresplans"
raj_military_research:0	"Militärische Forschung"
army_research_navy:0	"Schwerpunkt Marineforschung"
army_research_navy_desc:0	"Indien war noch nie als die Seefahrernation schlechthin bekannt, aber es könnte durchaus an der Zeit sein, dies zu ändern."
army_research_airplane:0	"Forschung aus der Luft Fokus"
army_research_airplane_desc:0	"Ohne angemessene Unterstützung aus der Luft sind unsere Schlachtschiffe und Artillerieanlagen verwundbar."
army_research_armour:0	"Schwerpunkt Rüstungsforschung"
army_research_armour_desc:0	"Um die großen Ebenen und Wüsten Indiens zu durchqueren, würde gepanzerte Unterstützung für unsere Soldaten unsere Effektivität erheblich verbessern."
army_research_artillery:0	"Artillerie Forschung Fokus"
army_research_artillery_desc:0	"Die militärische Taktik des Infanterieangriffs ist längst überholt und sollte durch strategisches Bombardement von feindlichen Festungen ersetzt werden."
army_research_infantry:0	"Forschungsschwerpunkt Infanterie"
army_research_infantry_desc:0	"Unsere Handfeuerwaffen sind im Vergleich zur internationalen Gemeinschaft seit langem unzureichend. Investitionen in die Entwicklung von Gewehren sind ein wichtiger Schritt auf dem Weg zu einer hocheffizienten Armee."
army_research_running:0	"Derzeitiger Forschungsschwerpunkt"
