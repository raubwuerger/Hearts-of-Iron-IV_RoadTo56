RAJ_Princely_States_desc:0	"Auch wenn die Verwaltung des britischen Rajs in Delhi sitzt, wird nicht das gesamte nominelle Territorium von der Hauptstadt aus kontrolliert. Örtliche Fürsten haben sich ein erhebliches Maß an Autonomie gesichert, indem sie sich mit den Briten verbündet haben. Die betroffenen Staaten sind:\n\n§YGujarat, Rajahsthan, Indore, Hyderabad, Mysore, Kaschmir, Sikkim, Belutschistan, Odisha, Nord-Kaschmir, Mandalay, Peshawar, Shanland§!"
RAJ_Princely_States_tt:0	"Lokale Baugeschwindigkeit [?RAJ.prince_state_build_speed|%0=+] in §YFürstliche Staaten§!.\nLokale Arbeitskräfte im Staat [?RAJ.prince_state_manpower|%0=+] in §YFürstliche Staaten§!.\nLokale Ressourcen im Staat [?RAJ.prince_state_resources|%0=+] in §YFürstliche Staaten§!.\n"
RAJ_Princely_States_speed_tt:0	"Ändern Sie den §YFürstliche Staaten§! Staatsmodifikator um:\nBaugeschwindigkeit in Staat §G+43%§!."
RAJ_Princely_States_manpower_tt:0	"Ändern Sie den §YFürstliche Staaten§! Staatsmodifikator um:\n Lokale Arbeitskräfte im Staat §G+48%§!."
