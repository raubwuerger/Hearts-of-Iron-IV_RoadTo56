kazakhstan.1.t:0	"[FROM.GetName] Schlägt Waffenkooperation vor"
kazakhstan.1.desc:0	"Unser Verbündeter [FROM.GetNameDef] hat vorgeschlagen, in Sachen Raketen und Atomwaffen zu kooperieren. Sie besitzen strategische Vorkommen an spaltbaren Elementen und ihre geographische Lage und Demographie machen sie perfekt für geheime Raketentests."
kazakhstan.1.a:0	"Wir müssen in diese Beziehung investieren."
kazakhstan.1.b:0	"Wir brauchen ihre Hilfe nicht."
kazakhstan.2.t:0	"[FROM.GetAdjective] akzeptiert die Zusammenarbeit"
kazakhstan.2.desc:0	"[FROM.GetNameDefCap] hat unseren Vorschlag, bei neuen Waffentechnologien zu kooperieren, akzeptiert und plant, zu investieren und uns zu schützen."
kazakhstan.2.a:0	"Großartig."
kazakhstan.3.t:0	"[FROM.GetAdjective] verweigern die Zusammenarbeit"
kazakhstan.3.desc:0	"[FROM.GetNameDefCap] hat unseren Vorschlag, bei der Entwicklung neuer Waffentechnologien zu kooperieren, abgelehnt."
kazakhstan.3.a:0	"Wir kommen allein zurecht."

