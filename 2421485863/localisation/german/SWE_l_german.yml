SWE_royalist_return:0	"Rückkehr der Royalisten"
SWE_royalist_return_desc:0	"Die schwedische Monarchie wurde 1917 durch eine Kombination aus liberalen und sozialdemokratischen Ministern unter der Führung von Nils Edén entmachtet. In letzter Zeit ist die Welt jedoch immer instabiler geworden, und das ständige Gezänk und Trödeln der demokratischen Herrschaft gefährdet die Zukunft Schwedens."
SWE_king_gustafs_government:0	"Die Regierung von König Gustaf"
SWE_king_gustafs_government_desc:0	"König Gustaf V. regiert Schweden seit dem Tod seines Vaters Oscar II. im Jahr 1907. Als entschiedener Gegner des Kommunismus und prominenter Befürworter eines panskandinavischen Bündnisses hat Gustaf den Aufstieg von Männern wie Lenin und Stalin mit nicht geringer Sorge beobachtet. Mit der jüngsten Rückkehr der königlichen Macht sollte der König wieder allein regieren."
SWE_prince_gustafs_coup:0	"Der Coup von Prinz Gustaf"
SWE_prince_gustafs_coup_desc:0	"Schweden hat mit Gustaf V. zwar einen König, aber er ist alt und nicht in der Lage, entschlossen zu handeln, um Schweden vor dem Untergang durch den Kommunismus zu bewahren. Um zu überleben und zu gedeihen, braucht Schweden einen neuen, jüngeren, dynamischen König. Gustaf Adolf, der Sohn des Königserben, muss den Thron besteigen - wenn nötig mit Gewalt."
SWE_return_to_sweden_norway:0	"Rückkehr nach Schweden-Norwegen"
SWE_return_to_sweden_norway_desc:0	"Die Trennung von Schweden und Norwegen, die fast hundert Jahre lang durch Verträge und Blut verbunden waren, war ein schwerer Fehler. Ohne Norwegen sind wir an das Baltikum gebunden, und ohne Schweden kann Norwegen unmöglich hoffen, sich selbst zu schützen, sollte das Undenkbare geschehen und ein Krieg nach Skandinavien kommen. Wir müssen diesen Fehler berichtigen."
SWE_the_finnish_crown:0	"Die finnische Krone"
SWE_the_finnish_crown_desc:0	"Sechshundert Jahre lang, bis zum Finnischen Krieg, hat Finnland Schwedens Ostflanke vor dem russischen Bären geschützt. Jetzt ist Finnland in den stürmischen Gewässern der Weltpolitik aufgeschmissen, und der russische Bär schleicht sich immer näher an die finnische Grenze heran. Finnland muss vor den Russen gerettet werden, und die Ostflanke muss wieder sicher sein!"
SWE_expand_livgardet:0	"Erweitern Sie das Livgardet"
SWE_expand_livgardet_desc:0	"Die Livgardet, die Leibgarde, ist eine der ältesten Militäreinheiten, die seit ihrer Gründung im Befreiungskrieg 1521 noch immer im Dienst ist. Sie sind für die Verteidigung Stockholms und der königlichen Familie zuständig und bilden die Spitze der schwedischen Armee und gehören zu unseren besten Truppen. Mit der Abschaffung der demokratischen Abrüstung sollten wir die Leibgarde ausbauen und den Kern unserer Armee verstärken."
SWE_modern_caroleans:0	"Moderne Karolanen"
SWE_modern_caroleans_desc:0	"Die Karolanen von Karl XII. versetzten alle, die sich ihm widersetzten, in Angst und Schrecken. Obwohl Carolus Rex nicht mehr unter uns weilt, lebt sein Vermächtnis weiter - lassen Sie uns den Karoliern ihren rechtmäßigen Platz zurückgeben und die Herzen der Feinde Schwedens erneut in Angst und Schrecken versetzen!"
SWE_claim_the_danish_throne:0	"Beanspruchen Sie den dänischen Thron"
SWE_claim_the_danish_throne_desc:0	"Das Königreich Dänemark war in den Tagen der Kalmarer Union einst unser Marionettenmeister. Aber die Zeiten haben sich geändert. Jetzt ist Schweden der Stärkere und Dänemark schmachtet unter einer schwachen und ineffektiven Herrschaft von zerstrittenen Politikern, die blind sind für die Gefahren, die sich an ihren Grenzen türmen. Als rechtmäßige Herrscher über ganz Skandinavien sollte der dänische Thron uns gehören!"
SWE_demand_danish_referendum:0	"Fordern Sie ein dänisches Referendum"
SWE_demand_danish_referendum_desc:0	"Wir werden den Dänen eine Chance bieten, unsere... Meinungsverschiedenheit friedlich zu lösen. Wenn sie zustimmen, ein Referendum über ihre Zukunft abzuhalten, werden wir unseren Anspruch auf den dänischen Thron nicht mit Gewalt durchsetzen. Es sei denn, sie sagen Nein..."
SWE_march_across_the_belts:0	"Marsch durch die Gürtel"
SWE_march_across_the_belts_desc:0	"Der dänische Thron gehört von Rechts wegen uns, und wir werden keine Einmischung dulden. Das dänische Militär ist durch jahrelange Vernachlässigung, Unterfinanzierung und eine pazifistische Politik verkrüppelt worden - es wird eine leichte Beute sein."
SWE_swedish_french_ties:0	"Schwedisch-französische Beziehungen"
SWE_swedish_french_ties_desc:0	"Schweden und Frankreich unterhalten seit dem Beginn des 18. Jahrhunderts enge Beziehungen. Die französische Kultur und die französische Sprache haben seither einen großen Einfluss auf Schweden ausgeübt, und die derzeitige schwedische Königsfamilie stammt von dem französischen General Jean Baptiste Jules Bernadotte ab, der in Schweden als Karl XIV. bekannt ist. Jetzt, da Frankreich zum Monarchismus zurückgekehrt ist, sollten wir unsere Beziehungen zu den Franzosen noch einmal vertiefen."
SWE_nordic_solidarity:0	"Nordische Solidarität"
SWE_nordic_solidarity_desc:0	"Seit den Napoleonischen Kriegen ist Schweden außenpolitisch zu einem Juniorpartner degradiert worden. Als die Neugestaltung Europas in Wien stattfand, waren wir zwar dabei, wurden aber als unbedeutend angesehen. Dies soll nicht länger der Fall sein. Indem wir unsere eigene Allianz gründen, zeigen wir der Welt, dass wir nicht länger bereit sind, auf sie herabzusehen."
SWE_stockholm_paris_agreement:0	"Stockholm - Pariser Abkommen"
SWE_stockholm_paris_agreement_desc:0	"Die Deutschen sind sowohl für uns als auch für die Franzosen ein gemeinsamer Feind - und wir haben beide in der Vergangenheit Land an die Deutschen verloren. Wir werden uns bereit erklären, die französischen Ansprüche auf das linke Rheinufer zu unterstützen, wenn sie im Gegenzug unsere Ansprüche auf Nordschleswig anerkennen. Wir werden noch einmal Seite an Seite mit den Franzosen kämpfen, um zurückzugewinnen, was wir verloren haben."
SWE_retake_pomerania:0	"Pommern zurückerobern"
SWE_retake_pomerania_desc:0	"Pommern war einst schwedisches Territorium, bis es 1814 im Tausch gegen Norwegen an Dänemark abgetreten wurde. Doch wir haben unsere Ansprüche auf Pommern nie vergessen, egal was die aufstrebenden Deutschen zu sagen haben. Das schwedische Reich wird in seiner Gesamtheit zurückerobert werden, und wenn das einen Krieg mit Deutschland bedeutet? So soll es sein."
SWE_fortet_gotland:0	"Festung Gotland"
SWE_fortet_gotland_desc:0	"Gotland ist die größte Insel in der Ostsee, stellt aber eine entscheidende Schwachstelle in der Verteidigung des Königreichs dar - eine Invasionsmacht könnte dort leicht ein Nachschubgebiet einrichten und es als Operationsbasis gegen das Festland nutzen! Wir müssen dafür sorgen, dass dies nicht geschieht - unsere Ingenieure haben damit begonnen, Pläne für Befestigungen und Flugabwehrbatterien rund um die vermuteten Landeplätze zu entwerfen."
SWE_negotiate_with_norway:0	"Verhandeln Sie mit Norwegen"
SWE_negotiate_with_norway_desc:0	"Die norwegische Küstenlinie ist lang und wird von Norwegen allein nur unzureichend verteidigt. Wenn wir und die Norweger unsere Kräfte bündeln würden, könnten wir die Verteidigung unserer beiden Nationen gegen jede künftige Invasion, sei es aus dem Baltikum oder dem Atlantik, besser sichern."
SWE_discussions_with_denmark:0	"Gespräche mit Dänemark"
SWE_discussions_with_denmark_desc:0	"Die Grenze Dänemarks mit den Deutschen bereitet den schwedischen Verteidigungsplanern Sorgen - schließlich ist insbesondere Jütland durch eine schnelle deutsche Invasion von Kiel aus verwundbar. Im Geiste der skandinavischen Einigkeit können wir jedoch nicht zulassen, dass die Dänen unverteidigt bleiben. Wir werden sie auf jede erdenkliche Weise unterstützen - selbst wenn dies einen Krieg mit Deutschland bedeutet."
SWE_aland_for_guarantees:0	"Åland für Garantien"
SWE_aland_for_guarantees_desc:0	"Åland ist seit dem Ende des Ersten Weltkriegs zwischen Finnland und Schweden umstritten. Obwohl die Finnen die Kontrolle über die Inseln behalten, ist die Unterstützung für eine Vereinigung mit Schweden unter den Åländern groß. Wir werden Finnland ein Angebot unterbreiten. Wenn sie uns Åland abtreten, werden wir sie in ihrem Kampf gegen die Russen um ihre Unabhängigkeit unterstützen."
SWE_the_northern_lights:0	"Die Nordlichter"
SWE_the_northern_lights_desc:0	"Nachdem die Grundlagen für ein Verteidigungsbündnis zwischen den skandinavischen Ländern gelegt wurden, ist es nun an der Zeit, diese Garantien in einem formellen Bündnis zu verankern. Jeder, der eine der skandinavischen Nationen bedroht, wird mit der Macht ganz Skandinaviens konfrontiert."
SWE_secure_our_southern_border:0	"Sichern Sie unsere Südgrenze"
SWE_secure_our_southern_border_desc:0	"Trotz unserer Differenzen in der Regierung scheinen die Deutschen immer noch sehr daran interessiert zu sein, im Tausch gegen schwedisches Wolfram und Eisenerz relativ gute Beziehungen zu uns zu unterhalten. Wir werden ihnen ein Angebot für einen Nichtangriffspakt zwischen unseren beiden Nationen unterbreiten - was auch den zusätzlichen Vorteil hat, dass wir uns auf den Osten konzentrieren können..."
SWE_defend_the_baltics:0	"Verteidigen Sie das Baltikum"
SWE_defend_the_baltics_desc:0	"Die baltischen Staaten sind, ähnlich wie die Finnen, zunehmend von einem wiedererstarkenden russischen Staat bedroht, der versuchen könnte, ihr Land erneut zu besetzen, wie es die Zaristen bis 1917 taten. Das können wir nicht guten Gewissens zulassen. Wir werden Delegationen nach Riga, Kaunas und Tallinn entsenden, um mit der Ausarbeitung von Plänen zu beginnen, die diese Staaten in unser Bündnis aufnehmen."
SWE_ally_the_kaiserreich:0	"Das Kaiserreich als Verbündeter"
SWE_ally_the_kaiserreich_desc:0	"Die Rückkehr des deutschen Kaisers - seit langem ein Freund des schwedischen Königshauses - auf den Thron bietet uns eine einzigartige Gelegenheit, ein Bündnis der Monarchien gegen die Russen zu schließen. Auch wenn wir uns aus dem Ersten Weltkrieg herausgehalten haben, werden wir nicht zulassen, dass ein wiedererstarktes Russland uns oder das Kaiserreich bedroht. Wir müssen sofort eine Delegation nach Berlin entsenden."
SWE_joint_panzer_development:0	"Gemeinsame Panzerentwicklung"
SWE_joint_panzer_development_desc:0	"Die Deutschen gehören zu den besten Panzerentwicklern in Europa. Um uns auf den großen Kampf gegen die Russen vorzubereiten, sollten wir ein Team von Technikern entsenden, das uns bei der Entwicklung neuer, gemeinsam entwickelter Kampfpanzer unterstützt."
SWE_baltic_foothold:0	"Baltischer Fußabdruck"
SWE_baltic_foothold_desc:0	"Die so genannten 'baltischen Staaten' wurden am Ende des Ersten Weltkriegs ins Leben gerufen. Sie sind schwach und von räuberischen Nachbarn umgeben, die nur auf eine Gelegenheit warten, sich einen oder alle von ihnen wieder einzuverleiben. Wir sollten die Initiative ergreifen und zum ersten Mal seit dem Großen Nordischen Krieg wieder eine schwedische Präsenz im Baltikum etablieren."
SWE_prepare_for_the_march_east:0	"Bereiten Sie sich auf den Marsch nach Osten vor"
SWE_prepare_for_the_march_east_desc:0	"Der Marsch nach Moskau wird lang und beschwerlich sein, und das russische Klima kann für Unvorbereitete sehr gefährlich sein. Wir können - und dürfen - die Fehler unserer Vorgänger nicht wiederholen. Wir müssen uns auf einen langen und schwierigen Feldzug vorbereiten und sicherstellen, dass unsere Truppen immer ausreichend versorgt sind, egal wie weit sie von Stockholm entfernt sind."
SWE_reclaim_the_imperial_east:0	"Den kaiserlichen Osten zurückerobern"
SWE_reclaim_the_imperial_east_desc:0	"Die Zeit ist reif. Wir werden nicht länger zusehen, wie die Russen immer stärker werden. Schweden muss handeln, wenn wir unsere Zukunft sichern wollen - unsere imperiale Zukunft. In den Krieg!"
SWE_prepare_for_soviet_aggression:0	"Bereiten Sie sich auf die sowjetische Aggression vor"
SWE_prepare_for_soviet_aggression_desc:0	" "
SWE_anti_comintern_signatory:0	"Anti-Komintern Unterzeichner"
SWE_anti_comintern_signatory_desc:0	" "
SWE_join_barbarossa:0	"Schließen Sie sich Barbarossa an"
SWE_join_barbarossa_desc:0	" "
SWE_unite_scandinavia:0	"Vereint Skandinavien"
SWE_unite_scandinavia_desc:0	"Angesichts des sich abzeichnenden Krieges ist es für uns Skandinavier an der Zeit, unsere eigene Sicherheit zu gewährleisten. Sollten wir von außen bedroht werden, müssen wir uns geschlossen dagegen wehren, sonst werden wir einer nach dem anderen fallen."
SWE_the_second_brother:0	"Der zweite Bruder"
SWE_the_second_brother_desc:0	"Unsere jüngste Geschichte mit Norwegen ist eine turbulente, aber wir müssen die Wunden heilen, die die Auflösung der schwedisch-norwegischen Union hinterlassen hat."
SWE_the_third_brother:0	"Der dritte Bruder"
SWE_the_third_brother_desc:0	"Dänemark war von einem feindlichen Oberherrn bis hin zu einem engen Verbündeten alles. Es ist an der Zeit, dafür zu sorgen, dass sich Schweden und Dänen an die Zeiten der Verwandtschaft erinnern und wieder daran arbeiten, sich gegenseitig zu schützen."
SWE_the_fourth_brother:0	"Der vierte Bruder"
SWE_the_fourth_brother_desc:0	"Die Finnen befinden sich in einer verletzlichen Lage, denn sie haben gerade erst ihre Unabhängigkeit von den Russen erlangt, denen sie viel zu lange unterworfen waren. Jetzt werden wir ihnen zeigen, wie es ist, gleichberechtigt zu sein."
SWE_the_scandinavian_council:0	"Der Skandinavische Rat"
SWE_the_scandinavian_council_desc:0	"Jetzt, da unsere Brüder beruhigt sind, können wir uns getrost als Skandinavier bezeichnen."
SWE_the_honorary_scandinavian:0	"Der Ehrenskandinavier"
SWE_the_honorary_scandinavian_desc:0	"Estland war früher unter dem Namen Livland Teil des ehemaligen schwedischen Reiches. Auch seine historischen Verbindungen zu uns sind nicht zu übersehen, wir sollten ihm einen Platz in unserer neu gegründeten Union anbieten, wenn es das möchte."
SWE_integrate_iceland:0	"Integrieren Sie Island"
SWE_integrate_iceland_desc:0	"Island ist trotz seiner Entfernung zu Skandinavien kulturell und historisch gesehen skandinavisch. Es ist nur logisch, dass sie die Möglichkeit erhalten, sich ebenfalls unserer Union anzuschließen, wenn sie das möchten."
SWE_decentralized_command_structure:0	"Dezentralisierte Kommandostruktur"
SWE_decentralized_command_structure_desc:0	"Indem wir unsere Kommandostruktur dezentralisieren, machen wir uns schwieriger zu erobern. Wenn wir den regionalen Befehlshabern mehr Kontroll- und Entscheidungsfreiheit einräumen, wird es auch einfacher sein, unsere Länder zu verteidigen, da sie sich besser an die Situationen anpassen können, die sie am besten kennen."
SWE_centralized_command_structure:0	"Zentralisierte Kommandostruktur"
SWE_centralized_command_structure_desc:0	"Indem wir unsere Kommandostruktur auf einen einzigen Standort konzentrieren, können wir Logistik und Nachschub leichter in die Regionen leiten, die sie am dringendsten benötigen. Indem wir Gefechtspläne und Angriffsvektoren von einem Standort aus steuern, stellen wir auch sicher, dass jeder weiß, was und wie es passieren wird."
SWE_north_sea_supremacy:0	"Vorherrschaft in der Nordsee"
SWE_north_sea_supremacy_desc:0	"Indem wir uns die Vorherrschaft über die Nordsee sichern, sind wir in der Lage, jeden Verkehr zu schützen, der durch unsere Gewässer sowie in die und aus der Ostsee führt. Unsere zukünftigen Feinde könnten jedoch versuchen, unsere langen Küsten gegen uns zu nutzen. Daher ist es von entscheidender Bedeutung, dass wir die Kontrolle über die Gewässer erlangen, um feindliche Anlandungen an unseren Küsten zu verhindern."
SWE_nordic_joint_air_command:0	"Gemeinsames Nordisches Luftkommando"
SWE_nordic_joint_air_command_desc:0	"Die Zentralisierung unserer Luftkommandostruktur wird uns in allen Bereichen helfen, in denen unsere Luftwaffe aktiv ist. Ob es darum geht, Hardpoints mit tödlicher Präzision anzugreifen oder dafür zu sorgen, dass auch die entferntesten Regionen ständig mit Nachschub versorgt werden."
SWE_the_northern_crowns:0	"Die Nördlichen Kronen"
SWE_the_northern_crowns_desc:0	"Viele träumen von der Vorstellung, dass ein einziges Schlachtschiff alles beherrscht. Die Wahrheit ist jedoch, dass kein Schlachtschiff allein operieren kann, und obwohl es allein fähig ist, braucht es die Hilfe seiner Brüder, genau wie wir."
SWE_regional_capital_development:0	"Regionale Kapitalentwicklung"
SWE_regional_capital_development_desc:0	"Indem wir die Hauptstädte unserer Teilstaaten ausbauen, helfen wir, einen schnellen Zusammenbruch zu verhindern, falls Stockholm fällt, und verbessern die Beziehungen zu den Staaten, die unsere Union bilden."
SWE_central_military_industry:0	"Zentrale Militärindustrie"
SWE_central_military_industry_desc:0	"Durch die zentrale Planung unserer Militärindustrie werden wir in der Lage sein, eine bessere Grundlage für unsere Streitkräfte zu schaffen, die in den kommenden Jahren wachsen und sich verändern werden."
SWE_scandinavian_volunteers:0	"Skandinavische Freiwillige"
SWE_scandinavian_volunteers_desc:0	"Wir haben eine lange Periode der Neutralität hinter uns, aber es ist an der Zeit, dass wir das ändern. Indem wir unseren Streitkräften erlauben, als Freiwillige in fremden Konflikten ins Ausland zu reisen, können wir helfen und Veränderungen in Europa herbeiführen, ohne selbst direkt in den Konflikt einzugreifen."
SWE_centralized_industrial_planning:0	"Zentralisierte industrielle Planung"
SWE_centralized_industrial_planning_desc:0	"Eine effizientere Planung führt zu besseren Ergebnissen. Vom Süden bis zum Norden wird sich eine zentralisierte Struktur auf lange Sicht als effizienter erweisen."
SWE_baltic_supremacy:0	"Baltische Vorherrschaft"
SWE_baltic_supremacy_desc:0	"Die Ostsee ist eine der Lebensadern unserer Nation. Indem wir die von uns gehaltenen Inseln befestigen, stellen wir sicher, dass diejenigen, die versuchen, unsere Gewässer zu durchqueren, dies nicht ohne unser Wissen tun können."
SWE_nordic_center_of_research:0	"Nordisches Forschungszentrum"
SWE_nordic_center_of_research_desc:0	"Durch die Gründung eines gemeinsamen Forschungsinstituts können wir die besten und klügsten Köpfe an einem Ort versammeln und die Forschung weiter vorantreiben."
SWE_scandinavianism_idea:0	"Skandinavismus"
SWE_centralized_command_structure_idea:0	"Zentralisierte Kommandostruktur"
SWE_decentralized_command_structure_idea:0	"Dezentralisierte Kommandostruktur"
SWE_joint_air_command_idea:0	"Gemeinsames Luftkommando"
SWE_centralized_industry:0	"Zentralisierte Industrie"
SWE_scandinavian_volunteers_idea:0	"Skandinavische Freiwillige"
SWE_north_sea_protector:0	"Nordsee-Protektor"
SWE_divide_germany_france_tt:0	"Vereinbaren Sie eine Aufteilung von §RGermany§!. §YFrankreich§! erhält Ansprüche auf das Rheinland und §YSchweden§! erhält Ansprüche auf §RDeutschlands§! Küstenlinie."
SWE_second_brother_tt:0	"Nach Abschluss des Fokus §YDer Skandinavische Rat§! erhalten wir Kerne auf §YNorwegen§!, wenn wir diesen Fokus vorher abgeschlossen haben."
SWE_third_brother_tt:0	"Nach Abschluss des Schwerpunkts §YDer Skandinavische Rat§! erhalten wir Kerne auf §YDänemark§!, wenn wir diesen Schwerpunkt zuvor abgeschlossen haben."
SWE_fourth_brother_tt:0	"Nach Abschluss des Schwerpunkts §YDer Skandinavische Rat§! erhalten wir Kerne zu §YFinnland§!, wenn wir diesen Schwerpunkt zuvor abgeschlossen haben."
SWE_unite_scandinavia_tt:0	"Die Mitglieder des §YScandinavian§! unserer Fraktion werden die Frage der Vereinigung gestellt bekommen. Sollten sie annehmen, werden wir sie §Yannex§! und in die nachfolgenden §YFocuses§! integrieren."
sweden.66.t:0	"Die Sowjets lehnen unser Angebot ab!"
sweden.66.d:0	"Die Sowjets haben den von uns vorgeschlagenen Deal abgelehnt. Das ist ein tragischer Schlag für die kommunistischen Interessen in Skandinavien."
sweden.66.a:0	"Falsche Kommunisten!"
sweden.67.t:0	"Die Sowjets nehmen unser Angebot an!"
sweden.67.d:0	"Die klugen Führer der UdSSR haben unser Angebot angenommen und sind stolz darauf, im Kampf gegen den Kapitalismus an unserer Seite zu stehen."
sweden.67.a:0	"Großartige Neuigkeiten!"
sweden.70.t:0	"Der König beruft die Regierung ein"
sweden.70.d:0	"Gustaf V. hat ein Treffen mit mehreren hochrangigen Politikern Schwedens einberufen, insbesondere mit denen der NSAP. Er ist in letzter Zeit besorgt über die autoritären Ansichten der NSAP und sieht den Kommunismus, obwohl er ihn ablehnt, nicht als eine so starke Bedrohung an wie die NSAP. Wenn es gelänge, den König von der Bedrohung durch die Bolschewiken zu überzeugen, wäre das ein ziemlicher Segen für die Popularität der NSAP im Volk..."
sweden.70.a:0	"Zeigen Sie ihm die Übel des Kommunismus."
sweden.70.b:0	"Seine Meinung spielt keine Rolle."
sweden.72.t:0	"Royalistische Zeitungen"
sweden.72.d:0	"Wie es scheint, hat König Gustaf die Sache mit dem Exil nicht so gut aufgenommen, wie wir gehofft hatten. Er hat sich mit einer Gruppe von Dissidenten zusammengetan, um Verleumdungen über unsere Regierung zu veröffentlichen! Dieser alte Narr ist einfach nur neidisch, dass er keinen Sitz der Macht mehr bekommt."
sweden.72.a:0	"Beschlagnahmen und verbrennen Sie die Publikationen!"
sweden.72.b:0	"Das ist die Mühe nicht wert."
sweden.75.t:0	"Vereinigen Sie sich mit Finnland-Schweden"
sweden.75.d:0	"Einige unserer neu erworbenen Ländereien in Finnland sind mehrheitlich schwedisch und würden bequem unter schwedischer Herrschaft und nicht als Teil von Finnland regiert werden. Natürlich würde dies einen schwächeren finnischen Marionettenstaat bedeuten, wenn wir uns dafür entscheiden, einen zu gründen..."
sweden.75.a:0	"Schweden unter Schweden."
sweden.75.b:0	"Das ist das Risiko nicht wert."
sweden.90.t:0	"Das königliche Kabinett"
sweden.90.d:0	"Der König hat sich über die langjährige Politik von Per Albin Hansson hinweggesetzt, der jede ausländische Allianz vermieden hat, indem er einen Pakt mit Finnland geschlossen hat, der eine Kluft zwischen den beiden ehemals freundschaftlichen Herrschern aufgerissen hat. Der König hat das uneingeschränkte Recht, ihn zu entlassen und zu ersetzen, auch wenn dies den republikanischen Elementen in unserer Bevölkerung sicherlich missfallen würde. Sollte Gustaf V. diesen Plan ausführen?"
sweden.90.a:0	"Lassen Sie den König seinen Rat bilden."
sweden.90.b:0	"Nur wenn er die Wahl gewinnt."
sweden.100.t:0	"Das Stockholmer Kommuniqué"
sweden.100.d:0	"Der schwedische König Gustaf V. hat die Staatsoberhäupter Norwegens und Dänemarks zu einer Konferenz eingeladen, um über unsere Beziehungen, die Zukunft Europas und die Haltung unserer Nationen im Falle eines Krieges zu sprechen. Die Teilnahme an der Konferenz würde uns alle näher zusammenbringen, aber ist das wirklich das, was wir wollen?"
sweden.100.a:0	"Nehmen Sie an der Konferenz teil"
sweden.100.b:0	"Nein, das ist nicht in unserem Interesse"
sweden.105.t:0	"Operation Stella Polaris"
sweden.105.d:0	"Die Sowjets dominieren unsere arme Nation bis jetzt, was uns einem übermäßigen Risiko aussetzt, sensible Informationen zu verlieren - und wir würden eine ganze Menge riskieren, wenn wir eines dieser wichtigen Dokumente in Papa Joes Hände fallen lassen würden. Unsere Agenten schlagen vor, die Operationen nach Schweden zu verlagern, eine sicherere Basis, die weitaus weiter vom Konflikt entfernt ist, auch wenn wir dadurch an Effizienz verlieren."
sweden.105.a:0	"Schicken Sie sie nach Schweden"
sweden.105.b:0	"Sie werden hier gebraucht!"
sweden.106.t:0	"Operation Stella Polaris"
sweden.106.d:0	"Ein unbekannter Mann in einem schwarzen Trenchcoat hat sich heute nach Einbruch der Dunkelheit mit unserem Regierungschef im finnischen Ministerium getroffen und mit tiefer, künstlich klingender Stimme erklärt, dass Finnlands Krieg mit den Sowjets so schlecht läuft, dass sensible Informationen in Gefahr sind. Er schlug vor, die Informationen stattdessen hier in Schweden zu beherbergen - gegen das Recht, einen Teil der Informationen selbst zu sehen, zusätzlich zu den verbesserten Beziehungen. Die Russen würden so etwas jedoch niemals gutheißen."
sweden.106.a:0	"Führen Sie die Operation durch"
sweden.106.b:0	"Nein, das ist zu riskant"
finland.40.t:0	"Um schwedische Hilfe bitten?"
finland.40.d:0	"Da unser Land in einen Bürgerkrieg gegen eine Macht verwickelt ist, die offensichtlich von der Sowjetunion unterstützt wird, sind wir gezwungen, selbst nach Verbündeten zu suchen. Schweden ist ein offensichtlicher Sponsor - wenn es uns gelingt, seine Hilfe zu sichern, wäre das ein großer Segen für unsere Seite. Natürlich steht der Status von Åland immer noch in Frage, und obwohl dies bedauerlich ist, wurde es als gerechte Entschädigung festgelegt..."
finland.40.a:0	"Bitten Sie Schweden um den Beitritt"
finland.40.b:0	"Nein, dies ist unser Krieg!"
finland.41.t:0	"Finnland bittet um Hilfe"
finland.41.d:0	"Die Weiße Garde von Finnland bittet uns um Hilfe gegen die Kommunisten, die versuchen, die Kontrolle über ihr Land zu übernehmen. Sie haben uns auch Åland als Gegenleistung für unsere Hilfe versprochen - ein ziemlich wertvoller Handel! Aber sind schwedische Leben es wert, in einem fremden Krieg verschwendet zu werden?"
finland.41.a:0	"Schließen Sie sich dem Bürgerkrieg an"
finland.41.b:0	"Wir können nicht mitmachen"
sweden.43.t:0	"Åland erhebt sich!"
sweden.43.d:0	"Die patriotischen Bürger von Åland haben sich dem Kampf gegen die kommunistische Bedrohung angeschlossen und marschieren jetzt eifrig an die Front... als Teil der schwedischen Armee. Trotzdem ist dies eine gute Alternative zur roten Herrschaft."
sweden.43.a:0	"Glücklich!"
finland.45.t:0	"Schweden verweigert den Beitritt"
finland.45.d:0	"Die Schweden haben nicht den nötigen Willen, sich unserem Krieg anzuschließen, das ist sehr bedauerlich!"
finland.45.a:0	"Verrat!"
exileunits.2.t:0	"Polistrupper rekrutiert & trainiert"
exileunits.2.d:0	"Die Polistrupper aus Dänemark und Norwegen sind ausgebildet und bereit für den Kampf. Während sie sich darauf vorbereiten, eines Tages in ihre Heimat zurückzukehren, werden sie in der Zwischenzeit an der Seite unseres Militärs kämpfen."
exileunits.2.a:0	"Eine schöne Ergänzung"
iceland.1.t:0	"Isländische Meuterei"
iceland.1.d:0	"Eine faschistische Meuterei hat stattgefunden! Nach kleinen Inspektionen ist es ziemlich offensichtlich, dass sie beliefert werden. Während das ganze Land in Aufruhr ist, welche Haltung nehmen wir ein? Bringen wir sie zum Schweigen oder nicht? Denn wenn wir sie zum Schweigen bringen, könnte das dazu führen, dass ihr Lieferant eigene Maßnahmen ergreift. Die beiden wahrscheinlichsten Lieferanten sind derzeit Deutschland oder Schweden."
iceland.1.a:0	"Bringen Sie den Aufstand zum Schweigen!"
iceland.1.b:0	"Wir haben keine andere Wahl als zu kapitulieren."
iceland.11.t:0	"Island bringt den Aufstand zum Schweigen!"
iceland.11.d:0	"Es scheint, dass unser geplanter Aufstand in Island nicht ganz so verlaufen ist, wie wir erwartet haben. Anscheinend ist es der Regierung gelungen, ihn mit ihren begrenzten Mitteln zum Schweigen zu bringen. Die Frage ist: Was sollen wir jetzt tun? Wir könnten selbst eine militärische Invasion starten, aber dann müssten wir uns auch mit Dänemark und höchstwahrscheinlich mit Grönland auseinandersetzen."
iceland.11.a:0	"Invasion also!"
iceland.11.b:0	"Wir werden uns vorerst zurückhalten."
iceland.2.t:0	"Island erklärt seine Unabhängigkeit!"
iceland.2.d:0	"Die kleine dänische Militärpräsenz auf Island wurde von einer kleinen, aber gut bewaffneten Gruppe von Nationalisten in die Luft gesprengt. Die dänische Herrschaft ist bedroht - wir müssen die Ordnung wiederherstellen! Es sei denn, wir können die Arbeitskräfte nicht entbehren, oder wir hätten moralische Bedenken..."
iceland.2.a:0	"Geben Sie ihnen die Souveränität"
iceland.2.b:0	"Erklären Sie den Krieg und erobern Sie Island zurück!"
iceland.3.t:0	"Dänemark erklärt uns den Krieg"
iceland.3.d:0	"Die dänische Regierung hat unsere Unabhängigkeitsbestrebungen für unrechtmäßig erklärt und schickt eine Invasion an unsere Küste, um den Spaß zu beenden. Schweden hat uns Unterstützung zugesagt, aber es wäre weitaus beeindruckender, aber auch schwieriger, auf eigene Faust zu gewinnen..."
iceland.3.a:0	"Kämpfen Sie auf eigene Faust!"
iceland.3.b:0	"Bitten Sie die Schweden um Hilfe"
iceland.4.t:0	"Island bittet um Hilfe"
iceland.4.d:0	"Wie wir vorausgesagt haben, hat uns Island um Unterstützung gegen die Dänen gebeten - eine perfekte Gelegenheit, Dänemark niederzuschlagen, ehrlich gesagt! Wir könnten sie auch ihre Zeit damit verschwenden lassen, in Island einzumarschieren, aber es wäre unwahrscheinlich, dass wir in nächster Zeit noch einmal so eine Gelegenheit bekommen würden..."
iceland.4.a:0	"Sie sind auf sich allein gestellt"
iceland.4.b:0	"Kämpfen Sie für Island!"
iceland.5.t:0	"Die Schweden mischen sich ein"
iceland.5.d:0	"Die Schweden haben beschlossen, an unserer Seite zu kämpfen und hoffen, die Dänen in unserem Namen zu besiegen. Unsere Bemühungen waren nicht umsonst, sie haben sich gelohnt."
iceland.5.a:0	"Ruhm und Souveränität sind nahe!"
iceland.7.t:0	"Dänemark lenkt ein"
iceland.7.d:0	"Dänemark hat die Unabhängigkeit Islands akzeptiert und behauptet einfach, dass die Dänen das isländische Volk nicht aufhalten werden, wenn es das ist, was es will. Fast jeder in Europa spekuliert über den wahren Grund, aber was auch immer es sein mag, Island ist unabhängig, ohne auch nur ein einziges Opfer zu beklagen."
iceland.7.a:0	"Unerwartet"
iceland.10.t:0	"Bewaffnen Sie die Fjölnismenn"
iceland.10.d:0	"Wir haben erfolgreich Waffen und Offiziere zu den isländischen Nationalisten transportiert. Die Fjölnismenn, wie sie sich selbst nennen, waren sehr an unserer Unterstützung interessiert und bereiten sich nun auf einen Aufstand vor. Sind wir bereit, das durchzuziehen?"
iceland.10.a:0	"Oh, das werden wir!"
SWE_monarchist_fervor:0	"Monarchistische Inbrunst"
SWE_livgardet:0	"Livgardet"
SWE_modern_caroleans_idea:0	"Moderne Karolinger"
SWE_industrial_ramp_up:0	"Industrieller Aufschwung"
SWE_industrial_ramp_up_decs:0	"Erzwungene Überstunden und erhöhte Quoten sind ein großartiges Mittel zur Steigerung der Produktionskapazitäten, aber der Wille des Volkes wird in diesen Zeiten schwächer."
SWE_swedish_communism:0	"Schwedischer Kommunismus"
SWE_swedish_communism_desc:0	"Wenn wir sicherstellen wollen, dass unsere Nation bis ins nächste Jahrhundert überlebt, müssen wir unsere derzeitige politische Ausrichtung ändern. Indem wir die Arbeiter in den Städten und die Bauern in den Dörfern beeinflussen, werden wir bald den politischen Einfluss haben, den wir brauchen."
SWE_unite_the_cells:0	"Vereinigen Sie die Zellen"
SWE_unite_the_cells_desc:0	"Während wir Verbindungen zu den Bauern und Arbeitern herstellen, müssen wir auch Verbindungen zwischen den verschiedenen Zellen herstellen, die über unser Land verstreut sind. Wenn wir sie zu einer politischen Partei vereinen, können wir tatsächlich mit den bereits etablierten Parteien konkurrieren."
SWE_snap_election:0	"Schnellwahlen"
SWE_snap_election_desc:0	"Mit der Mehrheit der Bevölkerung auf unserer Seite sind wir nun in der Lage, eine vorgezogene Wahl zu erzwingen, und so wie unsere politische Landschaft aussieht, werden wir garantiert gewinnen. Auch wenn der König das nicht gutheißt, haben wir Pläne für ihn."
SWE_swedish_marxism:0	"Schwedischer Marxismus"
SWE_swedish_marxism_desc:0	"Da unsere neue Regierung gesichert ist, müssen wir sicherstellen, dass wir gute Beziehungen zu den Sowjets im Osten unterhalten, sonst droht uns ihr Zorn. Mit verstärkten Beziehungen zum Osten werden wir zweifellos von allen potenziellen Bedrohungen durch unsere nahen Nachbarn verschont bleiben."
SWE_scandinavian_socialism:0	"Skandinavischer Sozialismus"
SWE_scandinavian_socialism_desc:0	"Jetzt, da die Regierung gesichert ist und wir das Land fest im Griff haben, müssen wir dem übrigen Europa versichern, dass wir nicht wie die expansionistischen und unterdrückerischen Sowjets im Osten sind. Wir müssen dafür sorgen, dass unsere Nachbarn wissen, dass unser politischer Wandel darauf abzielt, sowohl uns als auch sie zu schützen."
SWE_approach_soviets:0	"Annäherung an die Sowjets"
SWE_approach_soviets_desc:0	"In den letzten Monaten hatten wir zunehmend positive Beziehungen zu den Sowjets. Wenn wir einen Nichteinmischungsvertrag mit ihnen abschließen, werden wir sicher in der Lage sein, als Nation zu gedeihen und zu wachsen."
SWE_apply_the_nkvd_model:0	"Wenden Sie das NKVD-Modell an"
SWE_apply_the_nkvd_model_desc:0	" "
SWE_establish_red_army:0	"Bauen Sie unsere Rote Armee auf"
SWE_establish_red_army_desc:0	"Es ist kein Geheimnis, dass unsere Armee in einem schlechten Zustand ist. Um nicht hinter die Aufrüstung des restlichen Europas zurückzufallen, müssen wir unsere eigene Rote Armee aufbauen. Durch die Erhöhung der Wehrpflicht können wir mehr Menschen in die Armee bringen, auch wenn das bedeutet, dass sie nicht so effektiv kämpfen werden, aber das lässt sich ändern."
SWE_joint_research:0	"Gemeinsame Forschung"
SWE_joint_research_desc:0	"Wir haben zwar versucht, in der Forschung auf eigenen Beinen zu stehen, aber es ist kein Geheimnis, dass die Sowjets uns einen großen Schritt voraus sind. Wenn wir uns ihr Wissen in bestimmten Bereichen zunutze machen, können wir unsere Forschung vorantreiben. Das heißt aber nicht, dass wir den Sowjets nicht auch noch das eine oder andere beibringen können."
SWE_joint_tank_research:0	"Gemeinsames Panzerforschungsprogramm"
SWE_joint_tank_research_desc:0	"Nachdem der Große Krieg den Panzer als Kampfmaschine eingeführt hat, haben wir nun ein weiteres Feld, an dem wir arbeiten können. Gemeinsam mit den Sowjets sollten wir in der Lage sein, zu den anderen Großmächten aufzuschließen und sicherzustellen, dass wir nicht zurückbleiben."
SWE_aviation_exercises:0	"Luftfahrtübungen"
SWE_aviation_exercises_desc:0	"Wie der Panzer ist auch das Kampfflugzeug ein neuer Flugzeugtyp, der im Ersten Weltkrieg sein Debüt feierte und sich als lebenswichtig erwies. Gemeinsame Übungen mit den Sowjets können sich für unsere beiden Nationen nur als vorteilhaft erweisen."
SWE_factories_of_revolution:0	"Fabriken der Revolution"
SWE_factories_of_revolution_desc:0	"Angesichts des sich abzeichnenden Krieges müssen wir unsere Produktionskapazitäten ausbauen. Die Einrichtung zusätzlicher Waffenfabriken in Lappland wird sie weit weg von feindlichen Händen halten, während sie die Werkzeuge herstellen, die zur Verbreitung der Revolution benötigt werden."
SWE_soviet_industrial_assistance:0	"[SOV.GetAdjective] Industrielle Unterstützung"
SWE_soviet_industrial_assistance_desc:0	"Im letzten Jahrzehnt haben die Sowjets es geschafft, sich in einem unglaublichen Tempo zu industrialisieren, etwas, von dem wir lernen könnten."
SWE_socialist_industry:0	"Sozialistische Industrie"
SWE_socialist_industry_desc:0	"Mit Hilfe einiger sowjetischer Techniken sollten wir in der Lage sein, unsere industrielle Basis zu erweitern. Das ist zwar keine vollständige Industrialisierung, aber ein guter Anfang."
SWE_war_infrastructure:0	"Kriegsinfrastruktur"
SWE_war_infrastructure_desc:0	"Wenn wir die Revolution verbreiten wollen, müssen wir sicherstellen, dass unsere Infrastruktur der Belastung durch die Verlegung unserer Armeen gewachsen ist. Der südliche Teil unserer Nation ist dazu bereits in der Lage, aber der Norden benötigt etwas Unterstützung."
SWE_the_aland_situation:0	"Die Situation auf Åland"
SWE_the_aland_situation_desc:0	"Seit der Unterzeichnung der Åland-Konvention haben wir nach Möglichkeiten gesucht, die Åland-Inseln wieder in unseren Schoß zu holen. Aber auch die Sowjets haben es auf die Inseln abgesehen, und obwohl wir der Meinung sind, dass Åland zu uns gehören sollte, könnten wir Finnland als Druckmittel einsetzen."
SWE_pressure_finland:0	"Druck auf Finnland"
SWE_pressure_finland_desc:0	"Mit unseren Forderungen in der Hand sind wir nun bereit, sie der finnischen Regierung zu unterbreiten. Sie sollte schnell erkennen, in welcher misslichen Lage sie sich befindet und obwohl wir nicht erwarten, dass wir in den Krieg ziehen müssen, sollten wir die Möglichkeit nicht ausschließen."
SWE_close_the_straits:0	"Schließen Sie die Meerengen"
SWE_close_the_straits_desc:0	"Die Dänischen Belte sind ein lebenswichtiger Teil der Ostsee, wer sie kontrolliert, kontrolliert das gesamte Meer. Wir müssen sicherstellen, dass wir die Kontrolle über sie erlangen, damit wir uns keine Sorgen über fremde Versuche von Seeangriffen machen müssen."
SWE_turn_the_baltic_red:0	"Färben Sie das Baltikum rot"
SWE_turn_the_baltic_red_desc:0	"Die baltischen Staaten sind Gebiete, die früher zum Russischen Reich gehörten, davor waren sie jedoch in unserer Hand. Die Sicherung der baltischen Küstenlinie würde es sehr viel einfacher machen, sicherzustellen, dass die Ostsee unter unserer Kontrolle bleibt."
SWE_improve_red_army:0	"Verbessern Sie die Rote Armee"
SWE_improve_red_army_desc:0	"Da unsere unmittelbaren Grenzen nun sicher sind, sollten wir uns um die Verbesserung unserer Armee kümmern. Wir haben viel gelernt und sind jetzt zweifellos in einer besseren Position als in der Vergangenheit."
SWE_forced_abdication:0	"Erzwungene Abdankung"
SWE_forced_abdication_desc:0	"Mit unserer neuen Regierung hat sich der König als ein kleines Ärgernis erwiesen, vor allem, weil er sich aktiv in unsere politischen Angelegenheiten einmischt. Er muss gehen."
SWE_finish_finland:0	"Finnland beenden"
SWE_finish_finland_desc:0	"Da sich Finnland nach unseren Forderungen in einem erbärmlichen Zustand befindet, müssen wir sicherstellen, dass die finnischen Arbeiter gut geschützt sind. Um Aggressionen des finnischen Militärs gegen die Zivilbevölkerung zu verhindern, werden wir von nun an eingreifen und das Land führen."
SWE_nordic_collaboration:0	"Nordische Zusammenarbeit"
SWE_nordic_collaboration_desc:0	"Wir müssen unseren Nachbarn und zukünftigen Verbündeten beweisen, dass unser Modell des Sozialismus nichts mit der abscheulichen Unterdrückung zu tun hat, die im Osten vorherrscht."
SWE_stockholm_internationale:0	"Die Stockholmer Internationale"
SWE_stockholm_internationale_desc:0	"Um der Welt zu beweisen, dass wir es mit dem Widerstand gegen [SOV.GetNameDef] ernst meinen, werden wir eine eigene Fraktion bilden."
SWE_strength_in_union:0	"Stärke in der Union"
SWE_strength_in_union_desc:0	"Um ein echtes Bollwerk gegen den Osten zu werden, müssen wir in unserer Zusammenarbeit einen Schritt weiter gehen. Indem wir unsere Länder zu einer glorreichen Union zusammenschließen, werden wir in der Lage sein, uns gegen die Russen und ihre Handlanger zu behaupten."
SWE_alliance_with_finland:0	"Bündnis mit Finnland"
SWE_alliance_with_finland_desc:0	"Früher herrschten wir über Finnland, das inzwischen Untertanen der Russen geworden ist und danach seine Unabhängigkeit erlangt hat. Wir müssen ihnen versichern, dass wir nicht danach streben, sie wieder zu beherrschen, sondern ihre Sicherheit zu gewährleisten und dass wir ihre Hilfe brauchen, um uns vor dem zu schützen, was die russische Revolution hervorgebracht hat."
SWE_secure_baltic_sea:0	"Sichern Sie die Ostsee"
SWE_secure_baltic_sea_desc:0	"Dank der neuen Entwicklungen in der Seekriegsführung werden wir in der Lage sein, die Ostsee vor jedem zu schützen, der versuchen könnte, sie zu überqueren. Die Finnen haben bereits mit der Erforschung von Seeminen begonnen, wir könnten von ihnen lernen."
SWE_influence_baltics:0	"Einflussnahme auf das Baltikum"
SWE_influence_baltics_desc:0	"Mit dem Untergang des Russischen Reiches wurden die baltischen Staaten unabhängig, ihre Unabhängigkeit wird nun erneut durch den russischen Bären bedroht. Mit ihrer Hilfe und ihrer intimen Kenntnis des russischen Terrains werden wir ein noch mächtigeres Bollwerk gegen die russische Bedrohung sein."
SWE_influence_our_neighbours:0	"Beeinflussen Sie unsere Nachbarn"
SWE_influence_our_neighbours_desc:0	"Die skandinavischen Länder sind seit langem enge Freunde, trotz unserer Kriege in der Vergangenheit. Manche betrachten es fast als Geschwister, die sich gegenseitig bekämpfen, aber jetzt müssen wir sie überzeugen, sich uns anzuschließen, um jemanden zu bekämpfen, der die skandinavische Familie bedroht."
SWE_joint_jaeger_training:0	"Gemeinsames Jaeger-Training"
SWE_joint_jaeger_training_desc:0	"Genau wie Schweden sind auch die baltischen Staaten von dichten Wäldern bedeckt. Ein gemeinsames Training mit ihnen sollte sowohl uns als auch ihnen helfen."
SWE_scandinavian_ranger_training:0	"Skandinavische Ranger-Ausbildung"
SWE_scandinavian_ranger_training_desc:0	"Unsere Nationen sind die Heimat riesiger Wälder, hoher Berge und zahlreicher Fjorde. Wenn wir eine Chance gegen unsere zukünftigen Feinde haben wollen, müssen wir wissen, wie man diese Gebiete richtig durchquert und wie man dort am besten kämpft."
SWE_break_the_sickle:0	"Brechen Sie die Sichel"
SWE_break_the_sickle_desc:0	"Nachdem wir alle Vorbereitungen getroffen haben, sind wir bereit, den Kampf gegen die Russen aufzunehmen. Möge unser Sieg schnell sein und die Gerechtigkeit in unserem Kielwasser folgen."
SWE_tackle_fascism:0	"Den Faschismus bekämpfen"
SWE_tackle_fascism_desc:0	" "
SWE_invite_the_polish:0	"Laden Sie die Polen ein"
SWE_invite_the_polish_desc:0	" "
SWE_rallying_the_workers:0	"Versammlung der Arbeiter"
SWE_rallying_the_workers_desc:0	"Jetzt, da wir unsere Regierung gesichert haben, müssen wir das Land auf einen möglichen Krieg vorbereiten. Indem wir Propaganda verbreiten und die Arbeiter gegen unsere potenziellen Feinde aufhetzen, sollten wir in der Lage sein, die Bevölkerung auf das vorzubereiten, was kommen könnte, auch wenn das bedeutet, dass wir vorübergehend die Effizienz der Arbeiter aufgeben müssen."
SWE_workers_war_economy:0	"Arbeiter-Kriegs-Wirtschaft"
SWE_workers_war_economy_desc:0	"Es gibt ein Sprichwort, das besagt: 'Wer den Frieden will, muss sich auf den Krieg vorbereiten'. Wir stehen am Rande eines weiteren großen Krieges, also müssen wir uns darauf vorbereiten."
SWE_clip_the_wings:0	"Stutzen Sie die Flügel"
SWE_clip_the_wings_desc:0	"Nachdem unsere Vorbereitungen abgeschlossen sind, sind wir nun bereit, den ersten Schlag zu führen. Wir werden dafür sorgen, dass Deutschland unsere Welt nicht ins Chaos stürzt und unermesslichen Schaden anrichtet. Selbst wenn wir auf dem Weg dorthin ein paar Menschenleben in Kauf nehmen müssen, müssen die Wenigen für die Vielen opfern."
SWE_learn_from_the_baltics:0	"Lernen Sie von den Balten"
SWE_learn_from_the_baltics_desc:0	"Obwohl die baltischen Staaten erst vor kurzem ihre Unabhängigkeit erlangt haben, verfügen sie über ein immenses Wissen in verschiedenen Bereichen, das wir durchaus nutzen könnten. Wenn wir ein Abkommen schließen, sollten wir ihr Wissen in ihren Spezialgebieten nutzen dürfen."
SWE_estonian_oil_industry:0	"Estnische Ölindustrie"
SWE_estonian_oil_industry_desc:0	"Wenn man an Nationen denkt, die Öl fördern, würde Estland normalerweise nicht dazugehören. Allerdings haben sie es geschafft, in Kohtla-Järve Ölvorkommen zu finden. Wir sollten ein Team von Forschern dorthin schicken, um von den Esten zu lernen und zu sehen, was wir von ihrem Wissen profitieren können."
SWE_latvian_bomber_sights:0	"Lettische Bombervisiere"
SWE_latvian_bomber_sights_desc:0	"Die Letten sind anscheinend auf eine Methode zur Verbesserung der Bombenzielgeräte gestoßen, die sogar die Briten übertreffen könnte. Wenn wir ihnen anbieten, sie bei ihren Forschungen zu unterstützen, könnten wir unsere eigenen Konstruktionen mit Hilfe ihrer Erkenntnisse verbessern."
SWE_lithuanian_agrarian_industry:0	"Litauische Agrarindustrie"
SWE_lithuanian_agrarian_industry_desc:0	"Während ihrer Zeit im Russischen Reich verfügten die Litauer über riesige Felder, die sie nutzten, um Russland mit Weizen zu versorgen. Auch wenn die so genannte Kornkammer Europas seit jeher die Ukraine ist, verfügen die Litauer über beeindruckende Kenntnisse auf diesem Gebiet."
SWE_rally_worker_unions:0	"Versammeln Sie die Arbeitergewerkschaften"
SWE_rally_worker_unions_desc:0	"Es gibt zwar einige Menschen, die sich für Kommunisten halten, aber sie würden lieber für einen friedlichen Politikwechsel beten, einen, bei dem die derzeitige Regierung plötzlich beschließt, nicht mehr an der Macht zu sein. Wir jedoch wissen, dass man, wenn man einen Wandel will, darauf drängen muss. Wir werden die Arbeiter versammeln und sie auf den Kampf vorbereiten, der kommen wird!"
SWE_launch_red_coup:0	"Starten Sie den Roten Coup"
SWE_launch_red_coup_desc:0	"Auch wenn nicht alle darauf vorbereitet sind, müssen wir die Gelegenheit ergreifen, solange wir sie haben. Wenn wir Stockholm einnehmen, können wir die Revolution von dort aus in den Süden und Norden tragen! Die Revolution beginnt jetzt!"
SWE_fortification_studies:0	"Studien zur Festung"
SWE_fortification_studies_desc:0	" "
SWE_norge_linjen:0	"Norgelinjen"
SWE_norge_linjen_desc:0	"Wenn wir die Souveränität unserer Nation sichern wollen, müssen wir unsere Grenzen vorbereiten. Während wir uns um die Grenze im Osten gekümmert haben, muss nun die Grenze im Westen gesichert werden."
SWE_baltic_wall:0	"Baltische Mauer"
SWE_baltic_wall_desc:0	"Schweden hat eine lange Küstenlinie, die wir nur schwerlich in ihrer Gesamtheit verteidigen können. Durch den Bau von Festungsanlagen an Schlüsselstellen können wir die wichtigsten Städte schützen und von dort aus möglicherweise unsere eigenen Seeangriffe starten."
SWE_collectivization_phase_one:0	"Kollektivierung Phase Eins"
SWE_collectivization_phase_one_desc:0	"Kollektivierung Phase Eins"
