SWE_carl_gustafs_gevarsfaktori:0	"Carl Gustafs Gevärsfaktori"
SWE_scania:0	"Scania-Vabis"
SWE_skf:0	"SKF"
SWE_trelleborg:0	"Trelleborg"
SWE_norrbottens_jarnverk:0	"Norrbottens Järnverk"
SWE_lkab:0	"LKAB"
SWE_generic_train_organization_r56_NSB:0	"NOHAB"
SWE_modernizing_the_air_force:0	"Modernisierung der Luftwaffe"
SWE_modernizing_the_air_force_desc:0	"Die schwedische Luftwaffe ist selbst für die Größe des schwedischen Militärs im Allgemeinen klein, und was noch schlimmer ist, sie besteht aus kleinen, zufälligen Mengen ausländischer Modelle. Wenn die schwedische Luftwaffe in irgendeiner Form eine Bedrohung darstellen soll, müssen wir ihre Mängel beheben."
SWE_contract_cvm:0	"Vertrag CVM"
SWE_contract_cvm_desc:0	"Centrala Flygverkstaden Malmslätt hat entscheidend dazu beigetragen, dass unsere Flugzeuge repariert und gewartet werden. Die Bereitstellung von Finanzmitteln würde es ihnen ermöglichen, ihr Tätigkeitsfeld von der Wartung und Reparatur auf die Entwicklung der Marinefliegerei auszuweiten."
SWE_hire_junkers:0	"Junkers anheuern"
SWE_hire_junkers_desc:0	"Dank der Unterstützung von Junkers konnten wir die Grundlage für unser Tauchbomberprogramm schaffen. Wir sollten ihnen jedoch anbieten, ein ständiges Büro hier in Schweden einzurichten, damit wir ihr Wissen besser nutzen können."
SWE_torpedo_bombers:0	"Torpedo-Bomber"
SWE_torpedo_bombers_desc:0	"Torpedobomber sind eine gefürchtete Waffe in der Ostsee, da sie in der Lage sind, ein großes Schiff zu einem Bruchteil der Kosten zu versenken. Wenn wir unsere Forschung und Entwicklung auf dieses Gebiet konzentrieren, können wir die Meere beherrschen!"
SWE_contract_ffvs:0	"Vertrag FFVS"
SWE_contract_ffvs_desc:0	"Der letzte Krieg hat gezeigt, wie wichtig die Luftüberlegenheit ist. Feindliche Flugzeuge können auf schwedischem Territorium unermesslichen Schaden anrichten. Deshalb sollte es unsere Priorität sein, moderne Kampfflugzeuge zu haben, um sie abzuwehren."
SWE_license_republic_aviation:0	"Lizenz Republic Aviation"
SWE_license_republic_aviation_desc:0	"Wir haben die P-35, die wir von Republic Aviation gekauft haben, zwar noch nicht erhalten, aber wir könnten sie bitten, uns zu erlauben, ihre Entwürfe hier in Lizenz zu produzieren."
SWE_flygverkstaderna:0	"Flygverkstäderna"
SWE_flygverkstaderna_desc:0	""
SWE_work_with_hawker:0	"Arbeit mit Hawker"
SWE_work_with_hawker_desc:0	"Der Kauf von Hawker Hart Flugzeugen hat sich für unsere junge Luftwaffe als fruchtbar erwiesen. Da die Forschung auf diesem Gebiet jedoch weiter voranschreitet, sollten wir uns bemühen, nicht zurückzufallen. Eine Zusammenarbeit mit Hawker, um Flugzeuge für uns zu entwickeln und zu produzieren, wäre ein Weg, um sicherzustellen, dass wir nicht ins Hintertreffen geraten, während wir unsere lokalen Unternehmen auf andere Bereiche konzentrieren können."
SWE_dual_engine_planes:0	"Zweimotorige Flugzeuge"
SWE_dual_engine_planes_desc:0	"Da wir nur über begrenzte Kapazitäten in der Flugzeugproduktion verfügen, sollten wir uns vielleicht um die Entwicklung von Flugzeugen bemühen, die eine größere Reichweite und eine höhere Schlagkraft haben."
SWE_swedish_nine:0	"Schwedische Neun"
SWE_swedish_nine_desc:0	"Indem wir Sturzkampfbomber in 3 Gruppen zu je 3 Mann gruppieren und uns auf ein einziges Ziel konzentrieren, während wir aus mehreren Richtungen angreifen, können wir unsere Chancen erhöhen, feindliche Konvois zu versenken und gleichzeitig die Verluste zu begrenzen"
SWE_northern_airfields:0	"Nördliche Flugplätze"
SWE_northern_airfields_desc:0	"Um die Zerstörung unserer lebenswichtigen Minen im Norden zu verhindern, müssen wir unserer jungen Luftwaffe Flugplätze zur Verfügung stellen, von denen aus sie operieren kann."
SWE_southern_airfields:0	"Südliche Flugplätze"
SWE_southern_airfields_desc:0	"Die dänischen Meerengen und die untere Ostsee sind zwei Gebiete, die für uns lebenswichtig sind, da wir sowohl die Meere als auch die Luft kontrollieren. Wenn wir unsere Flugplätze im Süden weiter ausbauen, können wir die Kontrolle über unseren Himmel im Süden sicherstellen."
SWE_found_saab:0	"SAAB gegründet"
SWE_found_saab_desc:0	"Durch die Gründung von SAAB, Svenska Aeroplan Aktiebolaget, erhalten wir Zugang zu einer eigenen inländischen Flugzeugproduktion."
SWE_domestic_aircraft_designs:0	"Inländische Flugzeugdesigns"
SWE_domestic_aircraft_designs_desc:0	"Indem wir unsere Mittel in die Entwicklung inländischer Flugzeuge stecken, können wir Flugzeuge entwerfen, die von uns selbst hergestellt werden, um uns zu schützen und nicht von ausländischen Herstellern und Ersatzteillieferungen abhängig zu sein."
SWE_foreign_aircraft_designs:0	"Entwürfe für ausländische Flugzeuge"
SWE_foreign_aircraft_designs_desc:0	"Anstatt Geld in Projekte zu stecken, die möglicherweise ins Leere laufen, wäre es vielleicht besser, ein bereits entwickeltes Flugzeug zu finden, das zwar nicht perfekt, aber gut genug ist und das bereits entwickelt und getestet wurde."
SWE_low_altitude_bombers:0	"Bomber für niedrige Flughöhen"
SWE_low_altitude_bombers_desc:0	"Indem wir unsere Piloten in geringer Höhe und mit höherer Geschwindigkeit anfliegen lassen, sollten wir in der Lage sein, durch das Überraschungsmoment das Schlimmste von möglichem Anti-Luft-Feuer zu vermeiden. Dies ermöglicht auch präzisere Angriffe auf wichtige Ziele, die für die Wende des Krieges entscheidend sein können."
SWE_the_future_of_aviation:0	"Die Zukunft der Luftfahrt"
SWE_the_future_of_aviation_desc:0	"So wie sich die Panzertechnologie rasant weiterentwickelt hat, haben die letzten Jahre bewiesen, dass sich die Luftfahrt ständig verändert und dass wir noch viel Arbeit vor uns haben, wenn wir auf dem neuesten Stand der Luftfahrttechnologie bleiben wollen."
SWE_the_flying_barrel:0	"Die Flying Barrel"
SWE_the_flying_barrel_desc:0	"Die J 29, die nach ihrer eigenartigen Form auch Flying Barrel genannt wird, ist unser erster richtiger Versuch, ein reinrassiges, düsengetriebenes Kampfflugzeug zu entwickeln. Es besteht kein Zweifel, dass der Jet-Technologie in der Luftfahrt die Zukunft gehört."
SWE_rocket_propulsion:0	"Raketenantrieb"
SWE_rocket_propulsion_desc:0	"Wenn wir uns mehr auf den Raketenantrieb konzentrieren, sollten wir bei der Raketentechnologie einen Vorsprung haben. Von tragbaren Panzerabwehrwaffen bis hin zu Abfangjägern mit Raketen gibt es fast nichts, was eine Rakete nicht leisten kann."
SWE_swedish_nine_tactic:0	"Schwedische Neun-Taktik"
SWE_swedish_nine_tactic_desc:0	"Indem wir Sturzkampfbomber in 3 Gruppen zu je 3 Mann gruppieren und uns auf ein einziges Ziel konzentrieren, während wir aus mehreren Richtungen angreifen, können wir unsere Chancen erhöhen, feindliche Konvois zu versenken und gleichzeitig die Verluste zu begrenzen"
SWE_low_altitude_bombers_idea:0	"Bomber für niedrige Flughöhen"
SWE_obtain_plane_schematics_category:0	"Flugzeug-Designs"
SWE_obtain_plane_schematics:0	"Beschaffen Sie sich ausländische Flugzeugschemata"
SWE_swedish_army_staff:0	"Schwedischer Armeestab"
SWE_swedish_army_staff_desc:0	"Um sicherzustellen, dass unsere Armee wie eine geschlossene Einheit funktioniert, werden wir einen Armeestab einrichten, auch bekannt als Arméstaben. Dieses Büro wird für unsere Ausbildung, Taktik, Organisation und die von uns beschaffte Ausrüstung zuständig sein."
SWE_begin_initial_rearmament:0	"Erste Aufrüstung beginnen"
SWE_begin_initial_rearmament_desc:0	"Anfängliche Aufrüstung beginnen"
SWE_expand_the_military_budget:0	"Ausweitung des Militärhaushalts"
SWE_expand_the_military_budget_desc:0	"Erweitern Sie den Militärhaushalt"
SWE_fund_carl_gustafs_gevarsfaktori:0	"Finanzierung von Carl Gustafs Gevärsfaktori"
SWE_fund_carl_gustafs_gevarsfaktori_desc:0	"Wenn wir Gevärsfaktoriet zusätzliche Mittel zur Verfügung stellen, können wir unser Arsenal viel schneller auf den neuesten Stand bringen. Ihre lokalen Fabriken können uns auch bei der Aufrüstung unseres Landes helfen."
SWE_hire_scania_vabis:0	"Stellen Sie Scania-Vabis ein"
SWE_hire_scania_vabis_desc:0	"Scania-Vabis hat bewiesen, dass es ein sehr erfolgreiches Unternehmen ist, obwohl es noch so jung ist. Wir sollten ihnen Finanzmittel im Tausch gegen neue Fahrzeuge für unsere Armee anbieten."
SWE_winter_equipment:0	"Winterausrüstung"
SWE_winter_equipment_desc:0	"Es ist kein Geheimnis, dass die Winter hier in Schweden lang, hart und unglaublich kalt sind. Wir müssen dafür sorgen, dass unsere Soldaten besser für unsere kalten Winter gerüstet sind als die Feinde unserer Nation es wären."
SWE_nationalize_landsverk:0	"Verstaatlichen Sie Landsverk"
SWE_nationalize_landsverk_desc:0	"Wir wissen von den geheimen Absprachen zwischen der deutschen Firma GHH und AB Landsverk. Wir sollten das Wissen, das sie während ihrer Zusammenarbeit gewonnen haben, nutzen und sie auffordern, eine Panzerung zu entwickeln, die mit der deutschen konkurrieren kann!"
SWE_nationalize_landsverk_strv_m38_tt:0	"Wenn wir ein §HImproved Light Tank Chassis§! erforscht haben, erhalten wir das §HStridsvagn m/38§! Light Tank Design.\n"
SWE_modern_command_structure:0	"Moderne Kommandostruktur"
SWE_modern_command_structure_desc:0	"Indem wir unsere Kommandostruktur modernisieren, sollten wir widerstandsfähiger gegen Kommunikationsverluste sein. Wenn ein Zug weiß, was sein Gesamtziel ist, sollte er nicht daran erinnert werden müssen und frei sein, dieses Ziel auf jede Weise zu erreichen, die er für richtig hält."
SWE_royal_military_academy:0	"Königliche Militärakademie"
SWE_royal_military_academy_desc:0	"Durch die Einrichtung einer Militärakademie werden wir in der Lage sein, mehr fähige Offiziere und Führungskräfte für unsere Truppen zu gewinnen. Es ist von entscheidender Bedeutung, dass wir sicherstellen, dass unsere Armee von den Besten der Besten geführt wird!"
SWE_artilleriskjutskolan:0	"Artilleriskjutskolan"
SWE_artilleriskjutskolan_desc:0	"Was nützt die Artillerie, wenn Ihre Kanoniere nichts treffen können? Im 15. Jahrhundert legte unser König Gustavus Adolphus den Grundstein für den Einsatz der Artillerie. Seitdem sind wir hinter unsere Konkurrenten zurückgefallen und müssen nun aufholen und erneut beweisen, dass die schwedische Artillerie gefürchtet ist."
SWE_bofors_kanoner:0	"Bofors Kanoner"
SWE_bofors_kanoner_desc:0	"Bofors hat einige der besten Kanonen der Welt hergestellt. Wir sollten ihre Entwicklung besserer Waffen fördern, damit wir einen Vorsprung vor der Konkurrenz haben."
SWE_armens_jagarskola:0	"Arméns Jägarskola"
SWE_armens_jagarskola_desc:0	"Schweden ist von vielen Wäldern bedeckt. Wir müssen unsere Streitkräfte so ausbilden, dass sie sich so effektiv wie möglich bewegen können und gleichzeitig wissen, wo und wie sie sich eingraben müssen. Wir sind eine kleine Nation. Wenn unsere Feinde auf unserem Land Fuß fassen, müssen wir sie so schnell wie möglich zurückdrängen."
SWE_armens_jagarskola_tt:0	"Ermöglicht §HSvenska Jägare§!\n§HJaegers\n Soft Attack: §G+5%§!\n Verteidigung: §G+5%§!\n Wald:\n Verteidigung: §G+10%§!\n Bewegung: §G+5%§!§!"
SWE_state_of_disarmament:0	"Stand der Abrüstung"
SWE_state_of_disarmament_desc:0	"Seit dem schwedischen Verteidigungsgesetz von 1926 sind wir eine abgerüstete Nation, nicht aufgrund eines Kriegsvertrags oder einer Einmischung von außen, sondern aus freien Stücken. Die derzeitige Situation in der Welt sieht jedoch so aus, als würden sich die Zeiten ändern, und wir müssen darauf vorbereitet sein. Sollen wir an unserem entwaffneten Zustand festhalten und das Schicksal entscheiden lassen?"
SWE_the_budgetary_question:0	"Die Haushaltsfrage"
SWE_the_budgetary_question_desc:0	"Da sich in Europa möglicherweise ein weiterer Krieg zusammenbraut, müssen wir unseren Haushalt noch einmal überprüfen. Die Expansion in Städten wie Stockholm und Göteborg ist bereits geplant und im Gange, aber was dort gebaut werden soll, ist noch nicht in Stein gemeißelt."
SWE_jumpstart_the_arms_industry:0	"Ankurbelung der Rüstungsindustrie"
SWE_jumpstart_the_arms_industry_desc:0	"Wir haben zwar eine kleine, aber konstante Produktion von Waffen, aber die Anzahl der Fabriken, die wir jetzt haben, wird uns auf lange Sicht nicht schützen können. Wir müssen den Waffensektor ausbauen, damit er uns im Falle eines Krieges effektiv schützen kann."
SWE_expand_airfleet_capabilities:0	"Kapazitäten der Luftflotte ausbauen"
SWE_expand_airfleet_capabilities_desc:0	"Die derzeitigen Fähigkeiten unserer Luftflotte sind bei weitem nicht ausreichend. Indem wir Mittel für den Auf- und Ausbau neuer Flugplätze bereitstellen, sollten wir eine solide Basis für unsere künftige Luftwaffe schaffen, von der aus wir operieren können."
SWE_conclude_rearmament:0	"Aufrüstung abschließen"
SWE_conclude_rearmament_desc:0	"Wir haben nun die Grenzen des Verteidigungsgesetzes von 1926 überschritten. Sollte der Krieg den Weg in unsere Heimat finden, werden wir darauf vorbereitet sein."
SWE_fighter_designs:0	"Kampfflugzeug-Designs"
SWE_fighter_designs_desc:0	"Wenn wir uns die rasante Entwicklung der Kampfflugzeuge aus dem Ersten Weltkrieg ansehen, wird klar, dass wir uns selbst mehr auf diese mobilen Jäger konzentrieren müssen, damit wir nicht die Kontrolle über unseren eigenen Luftraum verlieren."
SWE_strike_craft_designs:0	"Entwürfe für Angriffsflugzeuge"
SWE_strike_craft_designs_desc:0	"Mit unseren Jägern sollten wir in der Lage sein, schwerere Waffen zu montieren, die vielleicht nicht für Luftziele, aber sehr wohl für Boden- und Seeziele geeignet sind."
SWE_medium_frame_craft:0	"Mittelgroße Raumschiffe"
SWE_medium_frame_craft_desc:0	"Auch wenn klein und wendig der richtige Weg ist, dürfen wir nicht die Möglichkeit außer Acht lassen, dass sich unsere Flugzeuge weiter von der Sicherheit des schwedischen Bodens entfernen müssen. Durch den Bau größerer Flugzeugzellen werden diese Flugzeuge in der Lage sein, weiter zu fliegen, wenn auch mit einem etwas weniger wendigen Rahmen."
SWE_motorization_initiative:0	"Initiative zur Motorisierung"
SWE_motorization_initiative_desc:0	"Kriegsspiele und die Lehren aus dem Großen Krieg haben gezeigt, dass pferdegezogene Logistik der Vergangenheit angehört. Die Zukunft der Kriegsführung liegt hinter dem Steuer eines Lastwagens, der nicht nur mehr transportieren kann, sondern auch weiter und schneller. Sollte der Krieg nach Europa zurückkehren, müssen wir darauf vorbereitet sein."
SWE_respect_landsverk_independence:0	"Respektieren Sie die Unabhängigkeit von Landsverk"
SWE_respect_landsverk_independence_desc:0	"Indem wir Landsverk AB erlauben, weiterhin unabhängig zu operieren, werden wir weiterhin in der Lage sein, das Fachwissen und die Innovationen des privaten Sektors zu nutzen und gleichzeitig strenge Vorschriften und Qualitätsstandards für Verteidigungsgüter zu gewährleisten."
SWE_bicycle_infantry_regiments:0	"Fahrrad-Infanterie-Regimenter"
SWE_bicycle_infantry_regiments_desc:0	"Auch wenn der Motorisierung die Zukunft gehört, gibt es Bereiche, in die Lastwagen nicht vordringen können, in denen es aber trotzdem auf Geschwindigkeit ankommt. Durch den Einsatz von Fahrrädern in unseren Streitkräften werden wir in der Lage sein, Aufklärungs- und Patrouillentätigkeiten in Gebieten durchzuführen, in denen unsere Lastwagen sonst nicht operieren könnten."
SWE_fund_tank_research:0	"Panzerforschung finanzieren"
SWE_fund_tank_research_desc:0	"Obwohl die Idee eines gepanzerten Fahrzeugs wie eines Panzers neu ist, hat die Entwicklung dieser Fahrzeuge rasant zugenommen. Von den massiven Ungetümen des Ersten Weltkriegs bis hin zu moderneren Designs gibt es immer wieder neue Entwicklungen. Wir können es uns nicht leisten, in diesem Bereich ins Hintertreffen zu geraten, sonst haben wir einen schweren Nachteil."
SWE_the_lynx:0	"Der Luchs"
SWE_the_lynx_desc:0	"Panzer sind zwar beeindruckende Fahrzeuge, die sich in fast jedem Gelände bewegen können, aber es gibt immer noch Gelände, für das kleinere, wendigere Fahrzeuge besser geeignet sind. Wenn wir Mittel für die Entwicklung eines gepanzerten Fahrzeugs bereitstellen, das auch unwegsameres Gelände durchqueren kann, können wir unsere Infanterie angemessen unterstützen."
SWE_mechanized_battalions:0	"Mechanisierte Bataillone"
SWE_mechanized_battalions_desc:0	"Die Weiterentwicklung der motorisierten Bataillone zu echten mechanisierten Einheiten ist die logische Weiterentwicklung der Manöverkriegsführung. Indem wir unsere Infanterie in Fahrzeugen unterbringen, die eher Panzern ähneln, werden wir in der Lage sein, sie im Kampf jederzeit angemessen zu unterstützen."
SWE_vintertraning:0	"Vinterträning"
SWE_vintertraning2:0	"Vinterträning"
SWE_bofors_kanoner_idea:0	"Bofors Kanoner"
SWE_svenska_jagare_idea:0	"Svenska Jägare"
SWE_mechanized_battalions_idea:0	"Mechanisierte Bataillone"
SWE_motorization_idea:0	"Initiative zur Motorisierung"
SWE_svenska_jagare:0	"Svenska Jägare"
r56_SWE_lynx_armored_car:0	"Lynx Panzerwagen"
SWE_stockholms_orlogsvarv:0	"Stockholms Örlogsvarv"
SWE_stockholms_orlogsvarv_desc:0	"Stockholms Örlogsvarv waren für unsere Schiffbauprogramme von entscheidender Bedeutung. Wenn wir eine Marine aufbauen wollen, die uns schützen kann, müssen wir unsere Trockendocks ausbauen."
SWE_evaluate_naval_doctrine:0	"Marinedoktrin evaluieren"
SWE_evaluate_naval_doctrine_desc:0	"Unsere Marinedoktrinen sind seit Jahrzehnten veraltet und wir müssen die Wege der Vergangenheit überdenken und in die Zukunft blicken."
SWE_swedish_marines:0	"Schwedische Marinesoldaten"
SWE_swedish_marines_desc:0	"Unser Land ist eingezwängt zwischen unseren Bergen im Westen und der Ostsee auf der rechten Seite. Wenn wir auch nur in Erwägung ziehen, das Meer zu überqueren, müssen wir unsere Marineinfanterie verbessern."
SWE_submarine_flotilla:0	"U-Boot-Flottille"
SWE_submarine_flotilla_desc:0	"Genau wie der Angriff aus der Deckung heraus ist auch der Angriff auf ein Schiff unter der Wasseroberfläche eine tödliche Methode, unsere Feinde zu treffen. Wir sollten unsere U-Boote verbessern, damit sie eine noch größere Bedrohung für diejenigen darstellen, die es wagen, uns anzugreifen."
SWE_swedish_hunterkillers:0	"Schwedische Jäger und Killer"
SWE_swedish_hunterkillers_desc:0	"Um unsere Küsten zu schützen, müssen wir sicherstellen, dass unsere Zerstörer auf dem neuesten Stand sind. Wenn wir die Lektionen, die die Briten und die Deutschen in der Seekriegsführung gelernt haben, nutzen, sollten wir in der Lage sein, Schiffe zu entwerfen, die in der Lage sind, unsere Unabhängigkeit zu schützen."
SWE_new_naval_estimates:0	"Neue Schätzungen für die Marine"
SWE_new_naval_estimates_desc:0	"Neue Schätzungen für die Marine"
SWE_bofors_naval_guns:0	"Bofors Marinegeschütze"
SWE_bofors_naval_guns_desc:0	"Mit der Arbeit von Bofors an neuen Geschützen, sowohl für den Einsatz an Land als auch auf See, haben wir Zugang zu einem Hersteller von Marinegeschützen, der uns helfen wird, den Anschluss an den Rest der Welt zu finden."
SWE_protect_merchant_sailors:0	"Schützen Sie die Handelssegler"
SWE_protect_merchant_sailors_desc:0	"Ein großer Teil unserer Wirtschaft hängt vom Export ab. Wenn wir die Seeleute, die unsere Waren über das Meer transportieren, nicht schützen können, wird unsere Wirtschaft zusammenbrechen."
SWE_new_cruiser_designs:0	"Neue Kreuzerdesigns"
SWE_new_cruiser_designs_desc:0	"Unsere Kreuzer sind stark veraltet und praktisch überflüssig. Mit etwas Geld sollten wir in der Lage sein, neuere Designs auf die Meere zu bringen."
SWE_swedish_battlecruiser:0	"Schwedischer Schlachtkreuzer"
SWE_swedish_battlecruiser_desc:0	"Die Pansarskepp-Idee hat sich zwar als geeignet erwiesen, um uns zu schützen, aber wenn wir uns außerhalb der Ostsee bewegen wollen, sollten wir uns nach neuen Schiffstypen umsehen. Während ein vollwertiges Schlachtschiff wahrscheinlich außerhalb unseres Budgets liegt, sollte der Schlachtkreuzer passen."
SWE_extensive_naval_project_funding:0	"Umfassende Finanzierung von Marineprojekten"
SWE_swedish_defence_act:0	"Schwedisches Verteidigungsgesetz"
SWE_swedish_defence_act_desc:0	"Da sich die Zeiten ändern, müssen wir zu Hause darauf vorbereitet sein, unser Land zu verteidigen. Es ist die Pflicht eines jeden Mannes und einer jeden Frau, dafür zu sorgen, dass sie ihr Möglichstes tun, um uns beim Schutz unseres Vaterlandes zu helfen."
SWE_the_coastal_artillery_program:0	"Das Küstenartillerie-Programm"
SWE_the_coastal_artillery_program_desc:0	"Wir haben eine lange Küstenlinie. Durch den Bau von Befestigungen an Schlüsselstellen sollten wir in der Lage sein, die meisten Angriffe der Marine, die an unsere Küste kommen könnten, abzuwehren."
SWE_rationing:0	"Rationierung"
SWE_rationing_desc:0	"Auch wenn die Vorstellung, Nahrung und Wasser rationieren zu müssen, nicht gerade aufregend ist, so ist es doch wichtig, dass jeder weiß, wie man richtig rationiert, falls wir angegriffen werden und unser Zugang zum Handel mit der Außenwelt abgeschnitten ist."
SWE_air_defence_fortifications:0	"Befestigungen zur Luftverteidigung"
SWE_air_defence_fortifications_desc:0	"Da die Luftwaffe in der Welt immer weiter verbreitet ist, müssen wir Wege finden, um zu wissen, wann ein Angriff aus der Luft bevorsteht und wie wir ihn abwehren können, bevor er unserer Nation tödlichen Schaden zufügen kann."
SWE_lottorna:0	"Lottorna"
SWE_lottorna_desc:0	"Während die Männer unseres Landes unterwegs sind, um unsere Grenzen vor Eindringlingen zu schützen, müssen wir unsere Gesellschaft am Laufen halten. Indem wir Frauen in Arbeitsbereiche einführen, die ihnen in der Vergangenheit verwehrt waren, können wir unsere Wirtschaft in Kriegszeiten entlasten."
SWE_recycling:0	"Recycling"
SWE_recycling_desc:0	"Durch Recycling können wir einige ältere Ressourcen wiederverwenden und entweder neue Verwendungszwecke für sie finden oder sie abbauen und neue Dinge daraus herstellen, wodurch die Abfallmenge reduziert wird."
SWE_hemvarnet:0	"Hemvärnet"
SWE_hemvarnet_desc:0	"Die Idee der Nationalgarde, oder Hemvärnet, ist eine, die wir ausbauen müssen. Sollten wir angegriffen werden, müssen wir in der Lage sein, schnell eine größere Armee zu mobilisieren, um die Angreifer abzuwehren."
SWE_the_swedish_defence_research_agency:0	"Die Schwedische Agentur für Verteidigungsforschung"
SWE_the_swedish_defence_research_agency_desc:0	"Mit der Einrichtung der Schwedischen Agentur für Verteidigungsforschung ( Försvarets Forskningsanstalt ) werden wir über ein Büro verfügen, das sich ausschließlich mit der Erforschung neuer Verteidigungsmittel befasst."
SWE_the_swedish_nuclear_program:0	"Das schwedische Nuklearprogramm"
SWE_the_swedish_nuclear_program_desc:0	"Die Vorstellung von Atomwaffen ist ein erschreckendes Konzept. Aber wenn wir wissen wollen, wie wir uns dagegen schützen können, müssen wir auch wissen, wie man sie baut."
SWE_ransonering:0	"Ransonering"
SWE_recycling_idea:0	"Recycling"
SWE_lottorna_idea:0	"Lottorna"
SWE_hemvarnet_idea:0	"Hemvärnet"
SWE_fortify_our_borders:0	"Verstärken Sie unsere Grenzen."
SWE_swedish_industrial_reinvigoration:0	"Schwedische industrielle Wiederbelebung"
SWE_swedish_industrial_reinvigoration_desc:0	"Seit die Große Depression Europa erreicht hat, mussten wir Industrieprojekte aufschieben oder sogar ganz streichen. Es ist an der Zeit, unsere Wirtschaft mit neuen Industrien wieder anzukurbeln und zu beleben."
SWE_expand_husqvarnas_factories:0	"Erweitern Sie Husqvarnas Fabriken"
SWE_expand_husqvarnas_factories_desc:0	"Husqvarna hat sich als fähiger Arbeitgeber erwiesen und mit einer kleinen Unterstützung durch die Regierung sollte sich die Zukunft des Unternehmens als lohnende Investition erweisen."
SWE_gotaverken_shipyards:0	"Götaverken Werften"
SWE_gotaverken_shipyards_desc:0	"Götaverken, die größte Werft der Welt, gemessen an der zugelassenen Bruttoregistertonne, hat sich als eine äußerst wertvolle Investition erwiesen. Mit weiteren Mitteln werden wir zweifellos sehen, wie sich unsere Handelsflotte vergrößert und sich als noch vorteilhafter erweist als bisher angenommen."
SWE_infrastructure_development:0	"Entwicklung der Infrastruktur"
SWE_infrastructure_development_desc:0	"Viele unserer Straßen, die von der Küste ins Landesinnere führen, sind hinter den europäischen Standard zurückgefallen, aber es sollte nicht allzu schwer sein, sie auf den neuesten Stand zu bringen."
SWE_refurbish_duved:0	"Duved renovieren"
SWE_refurbish_duved_desc:0	"Das Duved-Wasserkraftwerk wird langsam renovierungsbedürftig. Durch die Installation neuer Turbinen und Kontrollsysteme sollten wir in der Lage sein, mehr Strom als bisher zu produzieren und gleichzeitig eine Vielzahl von Arbeitsplätzen zu schaffen."
SWE_swedish_state_railways:0	"Schwedische Staatseisenbahnen"
SWE_swedish_state_railways_desc:0	"Die Schwedische Staatsbahn (Statens Järnvägar) ist für den Transport von Logistik und Rohstoffen sowie für bequeme Reisemöglichkeiten für unsere Soldaten und die Zivilbevölkerung von entscheidender Bedeutung. Sie ist jedoch verbesserungsfähig. Durch den weiteren Ausbau von Schlüsselbereichen sollte der Zugverkehr reibungsloser als je zuvor fließen können."
SWE_sako:0	"SAKO"
SWE_sako_desc:0	"Die Svenska Aluminiumkompaniet ist derzeit unsere einzige Möglichkeit, Aluminium zu produzieren. Wir sollten sie bei ihrer Expansion unterstützen, damit wir bei diesem Edelmetall unabhängiger werden."
SWE_kiruna_mine:0	"Kiruna-Mine"
SWE_kiruna_mine_desc:0	"Die Minen von Kiruna haben sich als unschätzbar wertvoll für unsere Wirtschaft erwiesen. Sie liefern eines der hochwertigsten Eisen der Welt und haben uns zu einem der größten Exporteure von hochwertigem Eisen und Stahl gemacht."
SWE_final_infrastructure_funding:0	"Letzte Infrastruktur-Finanzierung"
SWE_final_infrastructure_funding_desc:0	"Da unsere bisherigen Infrastrukturmittel für die Binnenstraßen im Norden Schwedens bestimmt waren, sollten wir diese Gelegenheit nutzen, um auch unsere Infrastruktur im Süden auf den neuesten Stand zu bringen."
SWE_civilian_sector_expansion:0	"Ausbau des zivilen Sektors"
SWE_civilian_sector_expansion_desc:0	"Der zivile Sektor ist das Rückgrat unserer Wirtschaft. Indem wir mehr Arbeitsmöglichkeiten für den einfachen Mann schaffen, können wir unsere Wirtschaft weiter ankurbeln und so in Zukunft mehr Projekte durchführen."
SWE_resource_utilization:0	"Nutzung von Ressourcen"
SWE_resource_utilization_desc:0	"Da eine der Säulen unserer Wirtschaft unsere Rohstoffe sind, sollten wir dafür sorgen, dass wir die Ressourcen, zu denen wir Zugang haben, richtig nutzen."
SWE_industrial_research_program:0	"Industrielles Forschungsprogramm"
SWE_industrial_research_program_desc:0	"Die Finanzierung der weiteren Entwicklung und Forschung unseres Industriesektors ist von größter Bedeutung. Wir können es uns nicht leisten, hinter unsere Nachbarn und Gleichaltrigen in Europa zurückzufallen, falls wir uns nie wieder erholen."
SWE_industrial_reinvigoration:0	"Industrielle Wiederbelebung"
SWE_resource_utilization_idea:0	"Nutzung von Ressourcen"
SWE_swedish_state_railways_idea:0	"Statens Järnvägar"
SWE_swedish_internal_policy:0	"Schwedische Innenpolitik"
SWE_swedish_internal_policy_desc:0	"Im Vorfeld der kommenden Wahlen haben die Spannungen in unserem Land und im übrigen Europa zugenommen. Doch bevor wir nach außen schauen können, müssen wir nach innen blicken."
SWE_hansson_iii_cabinet:0	"Das Kabinett Hansson III"
SWE_hansson_iii_cabinet_desc:0	"Dies wird Hanssons drittes Kabinett sein. Er hat sich als beliebter Premierminister erwiesen, der unser Land durch die schweren Zeiten nach der Großen Depression geführt hat."
SWE_gosta_bagge_i_cabinet:0	"Kabinett Gösta Bagge I"
SWE_gosta_bagge_i_cabinet_desc:0	"Gösta Bagge war ein beliebter Gegner von Per Albin Hansson und den Sozialdemokraten, und mit dieser Wahl wird es sein erstes Kabinett sein; möge er unser Land gut führen."
SWE_the_red_menace:0	"Die rote Bedrohung"
SWE_the_red_menace_desc:0	"Es ist kein Geheimnis, dass die Bedrohung durch den Kommunismus stetig zunimmt. Wenn wir uns öffentlich gegen ihre revolutionären Methoden aussprechen, könnten wir als potenzielle Verbündete gegen die kommunistische Bedrohung angesehen werden."
SWE_not_a_european_abyssinia:0	"Kein europäisches Abessinien"
SWE_not_a_european_abyssinia_desc:0	"Die italienische Invasion in Abessinien ist ein Schicksal, das Schweden niemals ereilen darf. Dies war einer der vielen Punkte, die zum Wahlsieg von Gösta Bagge geführt haben. Durch die Aufstockung des Budgets, das dem Militär zur Verfügung steht, sind wir einen Schritt näher daran, ein europäisches Abessinien zu verhindern."
SWE_swedish_foreign_policy:0	"Schwedische Außenpolitik"
SWE_swedish_foreign_policy_desc:0	"Nach dem Ersten Weltkrieg haben wir unsere Haltung der Neutralität bekräftigt. Aber da sich die Zeiten ändern, müssen wir unsere Außenpolitik überdenken und vielleicht unsere Vorstellung davon ändern, was es bedeutet, neutral zu sein."
SWE_scandinavian_collaboration:0	"Skandinavische Kollaboration"
SWE_scandinavian_collaboration_desc:0	"Auch wenn wir nicht immer einer Meinung waren, gab es immer ein Gefühl der Verwandtschaft zwischen den skandinavischen Ländern. Indem wir unseren Nachbarn die Hand reichen, stellen wir sicher, dass unsere Brüderlichkeit intakt bleibt, auch wenn sich ein Sturm am Horizont abzeichnet."
SWE_fight_unemployment:0	"Arbeitslosigkeit bekämpfen"
SWE_fight_unemployment_desc:0	"Die Große Depression hat uns zwar nicht so stark getroffen wie den Rest der Welt, aber wir haben ihre Auswirkungen dennoch gespürt. Nach der §RGreat Depression§! haben wir einen Aufschwung der Arbeitslosigkeit erlebt, aber durch kluge Investitionen und Subventionen sollten wir in der Lage sein, den Gebieten zu helfen, die Mühe haben, ihre Arbeiter zu bezahlen."
SWE_export_based_economy:0	"Exportbasierte Wirtschaft"
SWE_export_based_economy_desc:0	"So wie es aussieht, ist unsere Wirtschaft stark vom Export abhängig, sei es an die Deutschen im Süden oder an alle anderen, die unser Eisenerz benötigen, wir haben es geliefert. Das sollten wir uns zunutze machen und dafür sorgen, dass wir so viel wie möglich von diesem Export profitieren können, solange es noch möglich ist."
SWE_skanelinjen:0	"Skånelinjen"
SWE_skanelinjen_desc:0	"Die Dänen sind zwar nicht die größte Bedrohung für unsere Sicherheit, aber sie verfügen über eine der wenigen Möglichkeiten, Armeen aus Mitteleuropa nach Schweden zu verlegen, ohne Seeschiffe einsetzen zu müssen. Durch die Verbesserung des Skånelinjen sollten wir hoffentlich in der Lage sein, alle Eindringlinge abzuwehren, die versuchen, von Dänemark nach Schonen zu marschieren."
SWE_the_saltsjobaden_agreement:0	"Das Abkommen von Saltsjöbaden"
SWE_the_saltsjobaden_agreement_desc:0	"Obwohl wir den Geist von Folkhemmet anstreben, müssen wir akzeptieren, dass die Realität sich von dem angestrebten Ideal unterscheidet.\n\nDurch eine Einigung zwischen den Gewerkschaften und ihren Arbeitgebern sollten wir unserem Ziel jedoch einen Schritt näher kommen."
SWE_prepare_defensive_militias:0	"Defensive Milizen vorbereiten"
SWE_prepare_defensive_militias_desc:0	"Auch wenn wir offiziell neutral sind, müssen wir uns dennoch auf das Schlimmste vorbereiten. Die Erhöhung der Wehrpflicht könnte jedoch von einigen als Zeichen der Aggression aufgefasst werden. Daher sollten wir stattdessen Milizen vorbereiten und sicherstellen, dass sie über die nötige Ausrüstung verfügen, um für ihre Heimat zu kämpfen, falls die Notwendigkeit dazu besteht."
SWE_state_of_selective_neutrality:0	"Staat der selektiven Neutralität"
SWE_state_of_selective_neutrality_desc:0	"Indem wir eine Art bewaffnete Neutralität erklären, sagen wir der Welt um uns herum, dass wir nicht bereit sind, für eine der beiden Seiten des Konflikts zu kämpfen, sondern dass wir uns mit aller Kraft verteidigen werden, falls wir angegriffen werden. Hoffentlich werden wir das nicht tun müssen."
SWE_the_frivilligkaren_divisions:0	"Die Frivilligkåren-Divisionen"
SWE_the_frivilligkaren_divisions_desc:0	"Nach ihrer Kapitulation haben wir Kriegsflüchtlinge aufgenommen, die noch bereit und in der Lage sind, zu kämpfen. Mit ihrer Hilfe wären wir in der Lage, Widerstandsbewegungen in den besetzten Gebieten ihrer Heimat zu versorgen und gleichzeitig unseren offiziellen Status der Neutralität zu wahren."
SWE_military_access_for_ensured_safety:0	"Militärischer Zugang für garantierte Sicherheit"
SWE_military_access_for_ensured_safety_desc:0	"Da die Deutschen auf dem ganzen Kontinent Krieg führen, ist uns bewusst geworden, dass sie mit allen Mitteln versuchen könnten, sich unsere Ressourcen zu sichern. Wir dürfen auch nicht vergessen, dass wir eine strategische Position in der Ostsee innehaben, die sie möglicherweise zu sichern versuchen. Wenn wir ihnen die Möglichkeit bieten, Truppen durch unser Land zu bewegen, könnten wir die Vernichtung noch verhindern."
SWE_gmaskinen:0	"G-Maskinen"
SWE_gmaskinen_desc:0	"Angesichts des Krieges und unserer Neutralitätspolitik sind wir in eine Situation geraten, in der die Deutschen darum bitten, unser Kommunikationsnetz zu ihrem eigenen Vorteil zu nutzen. Natürlich ist es verschlüsselt, aber §YArne Beurling§! hat erwähnt, dass er möglicherweise knacken könnte, was auch immer die Deutschen zur Kommunikation verwenden, was sich für die richtigen Leute als wichtige Information erweisen könnte."
SWE_operation_radda_danmark:0	"Operation Rädda Danmark"
SWE_operation_radda_danmark_desc:0	"Viel zu lange hat das dänische Volk unter der deutschen Besatzung gelitten. Wir können nicht länger tatenlos zusehen, wie unsere Brüder im Süden die grausame Not ertragen müssen. Jetzt, da sich das Blatt des Krieges gegen die Deutschen wendet, ist es unsere Pflicht, Dänemark zu helfen."
SWE_the_finlands_sak_ar_var_recruitment_drive:0	"Die 'Finlands Sak är Vår' Rekrutierungskampagne"
SWE_the_finlands_sak_ar_var_recruitment_drive_desc:0	"Was wir befürchtet haben, ist eingetreten: Die Sowjetunion ist nach Finnland gekommen und bedroht nun die Unabhängigkeit des Landes. Es gibt immer mehr Menschen, die für Finnland kämpfen wollen, und die Parole 'Finlands sak är vår!' hat sich unter den Kampfwilligen als äußerst populär erwiesen, und wir werden sie nicht daran hindern, für die Souveränität unserer finnischen Brüder zu kämpfen."
SWE_intervention_in_the_winter_war:0	"Intervention im Winterkrieg"
SWE_intervention_in_the_winter_war_desc:0	"Wir können nicht tatenlos zusehen, wie die Finnen gegen den russischen Bären bluten. Unsere Streitkräfte sind jetzt bereit, offiziell in den Kampf einzugreifen. \n\n Finlands Sak är Vår!"
SWE_operation_stella_polaris:0	"Operation Stella Polaris"
SWE_operation_stella_polaris_desc:0	"Die Finnen haben Zugang zu äußerst hochwertigen Geheimdienstinformationen über die Russen. Indem wir ihren Codebrechern eine Anstellung hier in Schweden anbieten, können sie ihre Arbeit fortsetzen, ohne befürchten zu müssen, von den Russen gefangen genommen zu werden."
SWE_neutral_no_more:0	"Nicht mehr neutral"
SWE_neutral_no_more_desc:0	"Schweden kann nicht länger tatenlos zusehen, wie die Kräfte des Autoritarismus und der Diktatur die Freiheiten der Menschen im In- und Ausland mit Füßen treten. Um Schwedens und der Zukunft der Menschheit willen werden wir unsere Neutralität aufgeben und gemeinsam mit den anderen demokratischen Nationen Europas helfen, den Faschismus zurückzudrängen."
SWE_denounce_fascist_aggression_europe:0	"Die faschistische Aggression in Europa anprangern"
SWE_denounce_fascist_aggression_europe_desc:0	"Zu lange hat man zugelassen, dass sich das Krebsgeschwür des Faschismus in Europa ausbreitet. Es ist an der Zeit, dass wir Stellung beziehen und dem Rest der Welt unsere Meinung kundtun. Unsere Ressourcen dürfen nicht länger die Kriegsmaschinen des Faschismus anheizen!"
SWE_gunther_molotov_agreement:0	"Günther-Molotow-Abkommen"
SWE_gunther_molotov_agreement_desc:0	" "
SWE_baltic_sea_hegemony:0	"Hegemonie über die Ostsee"
SWE_baltic_sea_hegemony_desc:0	" "
SWE_defensive_militias_category:0	"Verteidigungsmilizen vorbereiten"
SWE_defensive_militias_category_desc:0	"Angesichts eines sich abzeichnenden Krieges müssen wir Maßnahmen ergreifen, um sicherzustellen, dass wir auf die Verteidigung unseres Landes vorbereitet sind."
SWE_prepare_militias:0	"Milizen vorbereiten"
SWE_raise_militia:0	"Milizen aufstellen"
SWE_the_swedish_german_trade_situation_category:0	"Die deutsch-schwedische Handelssituation"
SWE_the_swedish_german_trade_situation_category_desc:0	"Wir haben vor einigen Jahren den deutsch-schwedischen Handelsvertrag unterzeichnet. Da die Spannungen in der Welt jedoch zunehmen, müssen wir den Vertrag erneut prüfen und entscheiden, was zu tun ist.\n\nSollen wir unseren derzeitigen Kurs beibehalten, uns auf die Eigenständigkeit besinnen oder unseren Handel mit den Deutschen ausbauen?"
SWE_find_other_trade_partners:0	"Handelspartner finden"
SWE_halt_german_trade:0	"Den deutschen Handel stoppen"
SWE_expand_german_trade_influence:0	"Den deutschen Handelseinfluss ausweiten"
SWE_rely_on_germany_for_trade:0	"Sich beim Handel auf Deutschland verlassen"
SWE_reestablish_trade_with_germany:0	"Den Handel mit Deutschland wiederherstellen"
SWE_the_winter_war_category:0	"Der Winterkrieg"
SWE_the_winter_war_category_desc:0	"Die Sowjetunion ist in die Offensive gegangen und hat ihren Blick auf unsere Brüder, die Finnen, gerichtet. Während wir offiziell eine neutrale Haltung in den tobenden Kriegen, die in Europa toben, eingenommen haben, gibt es diejenigen, die für die Finnen kämpfen wollen. Wir sollten denjenigen, die für Finnland kämpfen wollen, nicht verbieten zu kämpfen, und obwohl wir nicht offiziell im Krieg sind, sollten wir versuchen, den Finnen etwas Ausrüstung zukommen zu lassen, damit sie die Rote Gefahr abwehren können."
SWE_nationalist_military_garrisons_category:0	"Nationalistische Militärgarnisonen"
SWE_crackdown_on_nationalism_in_the_army:0	"Unterdrücken Sie den Nationalismus in der Armee"
SWE_empower_nationalist_garrisons:0	"Verstärken Sie die nationalistischen Garnisonen"
SWE_aid_finland_in_their_fight:0	"Unterstützen Sie Finnland in seinem Kampf"
SWE_send_guns_to_finland:0	"Schicken Sie Geschütze nach Finnland"
SWE_send_artillery_to_finland:0	"Schicken Sie Artillerie nach Finnland"
SWE_nordic_resistance_fighters_category:0	"Nordische Widerstandskämpfer"
SWE_fund_norwegian_resistance_fighters:0	"Finanzieren Sie norwegische Widerstandskämpfer"
SWE_fund_danish_resistance_fighters:0	"Unterstützen Sie dänische Widerstandskämpfer"
SWE_support_equipment_to_the_norwegian_resistance:0	"Ausrüstung für den norwegischen Widerstand"
SWE_support_equipment_to_the_danish_resistance:0	"Unterstützungsausrüstung für den dänischen Widerstand"
SWE_heavy_guns_to_the_norwegian_resistance:0	"Schwere Gewehre für den norwegischen Widerstand"
SWE_heavy_guns_to_the_danish_resistance:0	"Schwere Gewehre für den dänischen Widerstand"
SWE_fighting_unemployment_category:0	"Kampf gegen die Arbeitslosigkeit"
SWE_fighting_unemployment_category_desc:0	"Im Zuge der Großen Depression hat die Arbeitslosigkeit in der Zivilbevölkerung zugenommen. Durch die Subventionierung bestimmter Sektoren der Erwerbsbevölkerung können wir sicherstellen, dass unsere Fabriken weiterhin die Güter produzieren können, die unser Land benötigt."
SWE_factory_subsidies:0	"Subventionen für Fabriken"
SWE_dockyard_subsidies:0	"Subventionen für Werften"
SWE_integrate_aland:0	"Integrieren Sie Åland"
SWE_find_an_alliance_category:0	"Finden Sie ein Bündnis"
SWE_find_an_alliance_category_desc:0	"Während die Welt in Aufruhr ist, gibt es diejenigen, die an den wahren Werten der Demokratie festhalten. Wir sollten auf sie zugehen und ein Bündnis gründen, damit wir gemeinsam die Werte der Freiheit verteidigen und eine gemeinsame Front gegen den Faschismus bilden können."
SWE_join_demo_from_factionname:0	"Beitreten [FROM.getFactionName]"
SWE_join_demo_from_factionname_tt:0	"Schaltet §HEntscheidungen§! frei, sich §Hverschiedenen §YDemokratischen§! Fraktionen in §YEuropa§! anzuschließen"
