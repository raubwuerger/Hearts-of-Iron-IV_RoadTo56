SWE_remove_dockyard_subsidies_idea_tt:0	"Entfernen Sie §YWerft-Subventionen§!"
SWE_armed_neutrality_explanation_tt:0	"Dieser Geist ist nur aktiv, wenn Sie §RNOT§! in einer Fraktion sind."
SWE_warning_winter_war_tt:0	"Dies wird uns in einen §RKrieg§! mit der §RSowjetunion§! ziehen. Es kann §RKonsequenzen§! geben, wenn wir kapitulieren müssen."
SWE_warning_operation_radda_danmark_tt:0	"Das wird uns in einen §RKrieg§! mit dem §RDeutschen Reich§! ziehen."
SWE_baltic_foothold_tt:0	"Erreichen Sie ein §YKriegsziel§! gegen jede §RKommunistische§! Nation, die Land im Baltikum hält"
SWE_fascism_embargo_tt:0	"Verhängen Sie ein §YEmbargo§! gegen alle §RFaschistischen§! Länder Europas und verweigern Sie ihnen den Zugang zu unseren §YRessourcen§!."
SWE_bicycle_infantry_tt:0	"§Y6 Fahrrad-Infanterie-Divisionen§! werden rekrutiert."
SWE_foreign_aircraft_designs_tt:0	"Für jede §YMajor§! Nation, mit der wir die Ideologie teilen und mit der wir uns derzeit nicht im Krieg befinden, erhalten wir eine "
SWE_folkhemmet_idea:0	"Folkhemmet"
SWE_saltsjobad:0	"Saltsjöbad"
SWE_the_winter_war_volunteers_idea:0	"Die Winterkrieg-Freiwilligen"
SWE_recruit_volunteers_for_the_finnish_army:0	"Rekrutieren Sie Freiwillige für die finnische Armee"
SWE_offer_concessions_to_soviets:0	"Bieten Sie den [SOV.getAdjective] Zugeständnisse an"
SWE_offer_concessions_to_soviets_desc:0	"Unter dem Eindruck der drohenden Invasion werden wir uns mit unseren Feinden versöhnen. Gotland wird zum wichtigsten Tauschobjekt für das Leben unserer Männer."
