SWE_offer_concessions_to_soviets:0	"Bieten Sie den [SOV.getAdjective] Zugeständnisse an"
SWE_offer_concessions_to_soviets_desc:0	"Unter dem Eindruck der drohenden Invasion werden wir uns mit unseren Feinden versöhnen. Gotland wird zum wichtigsten Tauschobjekt für das Leben unserer Männer."
