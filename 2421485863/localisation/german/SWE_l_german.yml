SWE_NUSR_Question.tt:0	"Alle nordischen Länder werden die Frage nach der Wiedervereinigung gestellt bekommen. Sie müssen akzeptieren, dass sie annektiert werden."
SWE_NUSR_Formed.tt:0	"Lehnt ein Land dies ab, bleibt es trotzdem als Verbündeter in der Fraktion."
SWE_red_revolution_swap.tt:0	"Starten Sie den Putsch gegen die Regierung und entfachen Sie den §RBürgerkrieg§!, um den Arbeitern die Kontrolle über das Land zu geben."
SWE_red_revolution_tip.tt:0	"Wenn Sie den §RCoup§! früh starten, verhindern Sie, dass sich lokale §YWorker Militias§! dem Aufstand anschließen."
