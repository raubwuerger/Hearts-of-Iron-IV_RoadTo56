r56.news_event.906.t:0	"Schweden widerruft die Åland-Konvention!"
r56.news_event.906.d:0	"Die Åland-Konvention wurde 1921 unterzeichnet. Darin wurde festgelegt, dass die namensgebenden Inseln rechtlich von Finnland verwaltet werden sollten, aber als Ausgleich würde dem Gebiet nicht nur Autonomie gewährt, sondern es würde auch vollständig entmilitarisiert werden. Da dies nicht mehr zu Schwedens Gunsten ist, hat die größte nordische Nation erneut Anspruch auf die Inseln erhoben. Als Reaktion darauf hat Finnland die Inselgruppe remilitarisiert, und die diplomatischen Beziehungen zwischen den beiden Ländern beginnen sich drastisch zu verschlechtern."
r56.news_event.906.a:0	"Und das alles wegen ein paar Inseln."
r56.news_event.906.b:0	"Endlich!"
sweden_german_trade.1.t:0	"Unser deutscher Handel"
sweden_german_trade.1.d:0	"Vor ein paar Jahren haben wir den deutsch-schwedischen Handelsvertrag unterzeichnet. Da die Spannungen in der Welt jedoch zunehmen, müssen wir uns den Vertrag noch einmal ansehen und entscheiden, was wir tun sollen.\n\nSollen wir unseren derzeitigen Weg beibehalten, uns in Richtung Autarkie bewegen oder unseren Handel mit den Deutschen ausbauen?"
sweden_german_trade.1.a:0	"Interessant..."
sweden_aland.1.t:0	"Schweden fordert Åland"
sweden_aland.1.d:0	"Gestern hat die schwedische Regierung, nachdem sie bereits ihren Anspruch auf Åland wiederhergestellt hat, den nächsten logischen Schritt gemacht - sie hat es direkt gefordert. Die Vertreter Stockholms haben nicht ganz unrecht, wenn sie sagen, dass die Inseln ohnehin mehrheitlich schwedisch sind, aber unsere Präsenz in der Ostsee würde dadurch erheblich eingeschränkt. Dennoch heißt es, dass die Alternative Krieg ist - und können wir eine Invasion überleben?"
sweden_aland.1.a:0	"Akzeptieren Sie die Forderungen."
sweden_aland.1.b:0	"Åland gehört rechtmäßig uns!"
sweden_aland.12.t:0	"Finnland nimmt die Forderungen an!"
sweden_aland.12.d:0	"Heute weht auf Åland zum ersten Mal seit 1809 wieder die schwedische Flagge anstelle der finnischen Fahnen. Während die Bevölkerung größtenteils apathisch war, war die schwedische Regierung selbst überglücklich, da sie einen diplomatischen Sieg und den wichtigsten Marinestützpunkt im Bottnischen Meerbusen errungen hatte. In Finnland hingegen war die Stimmung düster, und es ist besonders bemerkenswert, dass Finnland trotz der Aufgabe der Inseln immer noch einen Anspruch auf sie erhebt."
sweden_aland.12.a:0	"Endlich!"
sweden_aland.13.t:0	"Die Finnen lehnen ab!"
sweden_aland.13.d:0	"Die Finnen haben die fragwürdige Entscheidung getroffen, dass eine kleine Inselkette es wert ist, das Leben ihres Volkes zu riskieren. Vielleicht haben sie den Wunsch, wieder Teil unserer Nation zu werden - wie auch immer ihre Gedankengänge aussehen mögen, ein Krieg scheint unvermeidlich."
sweden_aland.13.a:0	"Ungeheuerlich!"
sweden_aland.2.t:0	"Schweden bietet Garantien für Åland."
sweden_aland.2.d:0	"Die schwedischen Diplomaten, die heute in [ROOT.Capital.GetCapitalVictoryPointName] eintrafen, kamen mit einem Vorschlag. Wir geben ihnen die Åland-Inseln, wenn sie uns im Gegenzug garantieren, uns zu Hilfe zu kommen, falls wir von außen angegriffen werden."
sweden_aland.2.a:0	"Das klingt nach einem fairen Handel. Wir stimmen zu."
sweden_aland.2.b:0	"Nein! Das Åland-Abkommen bleibt bestehen."
sweden_aland.21.t:0	"Finnland überträgt Åland"
sweden_aland.21.d:0	"Heute sind die Åland-Inseln nach langer Zeit unter finnischer und russischer Herrschaft an Schweden zurückgegeben worden. Wir sind nun verpflichtet, Finnland im Falle eines Angriffs auf die Inseln zu schützen."
sweden_aland.21.a:0	"Välkommna Hem!"
sweden_aland.22.t:0	"Finnland lehnt unser Hilfsangebot ab."
sweden_aland.22.d:0	"Mit der Begründung, dass die Åland-Konvention in Kraft bleiben würde, hat die finnische Regierung unser Angebot abgelehnt, uns in zukünftigen Konflikten im Austausch für die Åland-Inseln zu helfen."
sweden_aland.22.a:0	"Das ist bedauerlich..."
sweden_fascism.1.t:0	"Schweden fordert die Unterwerfung"
sweden_fascism.1.d:0	"Gestern hat die schwedische Regierung öffentlich erklärt, dass Dänemark sich der schwedischen Herrschaft unterwerfen sollte, um seinen zukünftigen Wohlstand zu sichern. Die Forderung umfasst die Unabhängigkeit Islands und die schwedische Vorherrschaft über Dänemark und unsere Außenpolitik."
sweden_fascism.1.a:0	"Akzeptieren Sie die Forderungen."
sweden_fascism.1.b:0	"Dänemark wird dänisch bleiben!"
sweden_fascism.12.t:0	"Dänemark nimmt die Forderungen an!"
sweden_fascism.12.d:0	"Heute ist ein glorreicher Tag in unserer Geschichte: Die schwedische Flagge weht hoch in Kopenhagen, da Dänemark nun die schwedische Herrschaft akzeptiert hat."
sweden_fascism.12.a:0	"Endlich!"
sweden_fascism.13.t:0	"Die Dänen lehnen ab!"
sweden_fascism.13.d:0	"Die Dänen haben die fragwürdige Entscheidung getroffen, sich gegen unsere Macht zu stellen. Sie werden schnell unter unseren Stiefeln fallen."
sweden_fascism.13.a:0	"Ungeheuerlich!"
sweden_auth.1.t:0	"Schweden fordert Annexion"
sweden_auth.1.d:0	"Heute hat der schwedische Monarch gefordert, dass wir die schwedische Herrschaft über unser Land wiederherstellen. Es ist fast über hundert Jahre her, dass wir getrennt wurden. Es gibt zwar einige im Lande, die gerne wieder dahin zurückkehren würden, aber die Mehrheit strebt nach Unabhängigkeit. Allerdings sind in seiner Forderung deutliche Andeutungen von Gewaltandrohungen enthalten."
sweden_auth.1.a:0	"Akzeptieren Sie die Forderungen."
sweden_auth.1.b:0	"Nein! [FROM.GetNameDefCap] wird unabhängig bleiben!"
sweden_auth.12.t:0	"[FROM.GetName] Nimmt die Forderungen an!"
sweden_auth.12.d:0	"Es scheint, dass [FROM.GetNameDef] die seltsame Situation, in der sie sich befinden, erkannt hat. Schließlich sind sie als Teil Schwedens sicherer, als zu versuchen, allein gegen die sich verändernden Zeiten in Europa zu bestehen."
sweden_auth.12.a:0	"Endlich!"
sweden_auth.13.t:0	"[FROM.GetNameDefCap] Ablehnen!"
sweden_auth.13.d:0	"Wir hatten gehofft, dass die [FROM.GetAdjective] Vernunft in unserer... Bitte sehen würden, auch wenn dies nicht überraschend ist. Da wir aber auch erwartet hatten, dass sie Nein sagen würden, ist es für uns keine Überraschung, dass wir nun zu den Waffen greifen und uns zurückholen müssen, was uns gehört."
sweden_auth.13.a:0	"Es war zu erwarten..."
sweden_auth.2.t:0	"[FROM.GetName] Fordert ein Referendum"
sweden_auth.2.d:0	"Heute früh hat der schwedische Monarch Carl Gustaf VI. eine öffentliche Erklärung abgegeben, in der er das dänische Volk aufforderte, für die Vereinigung mit Schweden zu stimmen, und dabei von den glorreichen Tagen der Kalmarer Union sprach. Er sprach von den glorreichen Zeiten der Kalmarer Union. Als eine Form der Freundlichkeit bot er dem dänischen Volk die Möglichkeit eines Referendums darüber an, ob es sich erneut mit Schweden vereinigen solle oder nicht."
sweden_auth.2.a:0	"Das Volk hat gesprochen, wir werden uns fügen."
sweden_auth.2.b:0	"Nein, wir wollen lieber wir selbst sein."
sweden_auth.22.t:0	"[FROM.GetAdjective] Stimmen Sie für die Wiedervereinigung."
sweden_auth.22.d:0	"In einer leicht schockierenden Wendung der Ereignisse hat das dänische Volk für die Vereinigung mit Schweden gestimmt. Es scheint, dass die Menschen die Sicherheit suchen, Teil einer größeren Nation von Gleichgesinnten zu sein."
sweden_auth.22.a:0	"Välkomna hem, bröder!"
sweden_auth.23.t:0	"[FROM.GetAdjective] Lehnen Sie das Referendum ab."
sweden_auth.23.d:0	"Es überrascht nicht, dass die [FROM.GetAdjective] das Referendum abgelehnt haben und ihre Streitkräfte für den Fall eines Angriffs vorbereitet haben. Nun, es ist an der Zeit zu sehen, wie gut sie kämpfen."
sweden_auth.23.a:0	"Erwartet."
sweden_nap.1.t:0	"[SWE.GetName] Schlägt Vertrag über gegenseitigen Beistand vor"
sweden_nap.1.d:0	"Heute früh ist ein Gesandter aus Schweden in [ROOT.Capital.GetCapitalVictoryPointName] eingetroffen und hat einen Vertrag über 'Gegenseitige Unterstützung' vorgeschlagen. Die Prämisse des Vertrages ist, dass weder sie noch wir einen Konflikt miteinander anzetteln werden, aber sollte einer von uns angegriffen werden, wird der andere dem anderen zu Hilfe kommen."
sweden_nap.1.a:0	"Klingt vorteilhaft für uns beide, wir werden den Vertrag unterzeichnen."
sweden_nap.1.b:0	"Wir lassen uns lieber nicht durch Tinte auf einem Papier binden..."
sweden_nap.11.t:0	"[FROM.GetName] Unterzeichnet den Vertrag"
sweden_nap.11.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der erfreulichen Nachricht zurückgekehrt, dass [FROM.GetNameDef] unseren Vertragsvorschlag unterzeichnet hat."
sweden_nap.11.a:0	"Perfekt!"
sweden_nap.12.t:0	"Der [FROM.GetName] unterschreibt den Vertrag nicht"
sweden_nap.12.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der bedauerlichen Nachricht zurückgekehrt, dass die [FROM.GetAdjective] beschlossen haben, unseren Vertrag nicht zu unterzeichnen. Vielleicht sollten wir uns in Zukunft vor ihnen in Acht nehmen."
sweden_nap.12.a:0	"Sehr unglücklich..."
sweden_nap.2.t:0	"[SWE.GetName] schlägt einen Nichtangriffspakt vor"
sweden_nap.2.d:0	"Heute früh ist ein Gesandter aus Schweden in [ROOT.Capital.GetCapitalVictoryPointName] eingetroffen und hat einen Vorschlag für einen Nichtangriffspakt unterbreitet. Die Prämisse des Vertrages ist, dass weder sie noch wir einen Konflikt miteinander anzetteln werden, solange der Vertrag gilt."
sweden_nap.2.a:0	"Damit ist unsere Nordfront gesichert."
sweden_nap.2.b:0	"Wir lassen uns lieber nicht durch Tinte auf einem Papier binden..."
sweden_nap.21.t:0	"[FROM.GetName] Unterzeichnet den Vertrag"
sweden_nap.21.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der erfreulichen Nachricht zurückgekehrt, dass die [FROM.GetAdjective] den von uns vorgeschlagenen Vertrag unterzeichnet haben."
sweden_nap.21.a:0	"Perfekt!"
sweden_nap.22.t:0	"Der [FROM.GetName] unterschreibt den Vertrag nicht"
sweden_nap.22.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der bedauerlichen Nachricht zurückgekehrt, dass die [FROM.GetAdjective] beschlossen haben, unseren Vertrag nicht zu unterzeichnen. Vielleicht sollten wir uns in Zukunft vor ihnen in Acht nehmen."
sweden_nap.22.a:0	"Höchst bedauerlich..."
sweden_nap.3.t:0	"[SWE.GetName] schlägt einen Nichtangriffsvertrag vor."
sweden_nap.3.d:0	"Heute früh ist ein Gesandter aus Schweden in [ROOT.Capital.GetCapitalVictoryPointName] eingetroffen und hat einen Vorschlag für einen Nichtangriffsvertrag unterbreitet. Die Prämisse des Vertrages ist, dass weder sie noch wir einen Konflikt miteinander anzetteln werden, solange der Vertrag gilt."
sweden_nap.3.a:0	"Freundschaftliche Beziehungen zu [SWE.GetAdjective] wären von Vorteil."
sweden_nap.3.b:0	"Wir haben andere Pläne..."
sweden_nap.31.t:0	"[FROM.GetName] Unterzeichnet den Vertrag"
sweden_nap.31.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der erfreulichen Nachricht zurückgekehrt, dass die [FROM.GetAdjective] den von uns vorgeschlagenen Vertrag unterzeichnet haben."
sweden_nap.31.a:0	"Perfekt!"
sweden_nap.32.t:0	"Der [FROM.GetName] unterschreibt den Vertrag nicht"
sweden_nap.32.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der bedauerlichen Nachricht zurückgekehrt, dass die [FROM.GetAdjective] beschlossen haben, unseren Vertrag nicht zu unterzeichnen. Vielleicht sollten wir uns in Zukunft vor ihnen in Acht nehmen."
sweden_nap.32.a:0	"Sehr bedauerlich..."
sweden_mill_access.1.t:0	"[SWE.GetNameDefCap] bietet militärischen Zugang"
sweden_mill_access.1.d:0	"Heute früh ist ein schwedischer Abgesandter in [ROOT.Capital.GetCapitalVictoryPointName] eingetroffen und hat uns angeboten, Truppen durch ihr Territorium ziehen zu lassen, wenn wir im Gegenzug versprechen, keine Feindseligkeiten gegen sie zu führen. Wie sollten wir darauf reagieren?"
sweden_mill_access.1.a:0	"Klingt vorteilhaft, wir werden den Vertrag unterzeichnen."
sweden_mill_access.1.b:0	"Wir haben andere Möglichkeiten, Zugang für unsere Truppen zu erhalten."
sweden_mill_access.11.t:0	"[FROM.GetNameDefCap] Unterzeichnet den Vertrag"
sweden_mill_access.11.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der erfreulichen Nachricht zurückgekehrt, dass [FROM.GetNameDef] unseren Vertragsvorschlag unterzeichnet hat."
sweden_mill_access.11.a:0	"Perfekt!"
sweden_mill_access.12.t:0	"[FROM.GetNameDefCap] unterschreibt den Vertrag nicht"
sweden_mill_access.12.d:0	"Unsere Diplomaten sind von [FROM.Capital.GetCapitalVictoryPointName] mit der unglücklichen Nachricht zurückgekehrt, dass [FROM.GetAdjective] beschlossen hat, unseren Vertrag nicht zu unterzeichnen. Vielleicht sollten wir uns in Zukunft vor ihnen in Acht nehmen."
sweden_mill_access.12.a:0	"Sehr bedauerlich..."
sweden_soviet.1.t:0	"Schweden strebt den Beitritt zu [SOV.GetFactionName] an"
sweden_soviet.1.d:0	"Seitdem die schwedischen Arbeiter die Kontrolle über ihre Zukunft übernommen haben, sind ihre Politiker uns gegenüber freundlicher geworden. Heute traten schwedische Beamte an uns heran, um der [SOV.GetFactionName] beizutreten. Es wäre von Vorteil, einen Verbündeten zu haben, der möglicherweise die Ostsee abriegeln kann, aber es hat auch seine Schattenseiten, denn die Deutschen könnten denken, dass wir zu weit gehen und sich bedroht fühlen. Wie sollte unsere Antwort lauten?"
sweden_soviet.1.a:0	"Mit ihrer Hilfe wird die Revolution nicht ins Stocken geraten!"
sweden_soviet.1.b:0	"Sie sind nichts weiter als eine Belastung."
sweden_soviet.2.t:0	"Die Sowjets akzeptieren unsere Bitte"
sweden_soviet.2.d:0	"Nach mehrstündigen Gesprächen hinter verschlossenen Türen in Moskau haben unsere Diplomaten schließlich die gute Nachricht nach Stockholm übermittelt. Sie begrüßen die Idee, dass wir der [SOV.GetFactionName] beitreten, da dies unseren beiden Nationen bei unseren zukünftigen Interessen helfen wird."
sweden_soviet.2.a:0	"Lang lebe die Revolution!"
sweden_soviet.3.t:0	"Moskau lehnt unsere Anfrage ab"
sweden_soviet.3.d:0	"Als unsere Gesandten sich an die Sowjets wandten, hatten wir mit einer freundlichen Antwort gerechnet, aber man teilte ihnen mit, dass die Sowjets nicht die Absicht hätten, 'Möchtegern-Deutsche in den [SOV.GetFactionName] einzuladen'. Das hat zu Hause einige Probleme verursacht, aber es ist nicht das erste Mal, dass wir abgewiesen werden."
sweden_soviet.3.a:0	"Wir müssen einfach unsere Zeit abwarten..."
sweden_soviet.4.t:0	"Schweden erhebt die Åland-Frage"
sweden_soviet.4.d:0	" Heute früh traf in Moskau ein Telegramm aus Stockholm ein, in dem es um den autonomen Staat Åland ging, der derzeit unter finnischer Kontrolle steht. In dem Telegramm wurde dessen strategischer Wert erwähnt und dass es unsere und ihre Stärke im Baltikum erheblich stärken würde. Wie sollen wir auf dieses Telegramm reagieren?"
sweden_soviet.4.a:0	"Sie sprechen einen guten Punkt an."
sweden_soviet.4.b:0	"Wir haben andere Pläne für Åland."
sweden_soviet.5.t:0	"Die Sowjets akzeptieren"
sweden_soviet.5.d:0	"In einer Antwort auf unsere Botschaft an Moskau haben die Sowjets mit Interesse geantwortet und erklärt, dass sie an dem strategischen Wert der Åland-Inseln interessiert sind."
sweden_soviet.5.a:0	"Unser Plan wird fortgesetzt."
sweden_soviet.6.t:0	"Die Sowjets lehnen ab"
sweden_soviet.6.d:0	"Gestern Abend erhielten wir eine Antwort aus Moskau, in der sie uns mitteilten, dass sie kein Interesse an den kleinen Ostseeinseln haben und die Åland-Inseln somit in unseren Einflussbereich fallen."
sweden_soviet.6.a:0	"Das ist bedauerlich, aber es gibt immer einen Silberstreif am Horizont."
sweden_soviet.7.t:0	"Schweden fordert Zugeständnisse"
sweden_soviet.7.d:0	"Heute früh ist ein Gesandter aus Stockholm in Helsinki eingetroffen, der sich mit der Regierung getroffen und ein Ultimatum gestellt hat. Entweder wir akzeptieren die territoriale Neugliederung oder wir müssen mit 'ernsthaften Konsequenzen' rechnen."
sweden_soviet.7.a:0	"Wir können uns nicht dagegen wehren... noch nicht..."
sweden_soviet.7.b:0	"Nein! Finnisches Territorium soll bei Finnland bleiben!"
sweden_soviet.7.c:0	"Für die Sicherheit unseres Volkes... akzeptieren wir."
sweden_soviet.8.t:0	"Sowjets fordern Territorien"
sweden_soviet.8.d:0	"Nach den Forderungen von Stockholm hat Moskau nun auch Forderungen für eine ganze Reihe von Gebieten im Osten gestellt."
sweden_soviet.8.a:0	"Wir müssen zustimmen, sonst droht uns die Vernichtung..."
sweden_soviet.8.b:0	"Keine weiteren Zugeständnisse! Sieg oder Tod!"
sweden_soviet.9.t:0	"Finnland überträgt [148.GetName]"
sweden_soviet.9.d:0	"Heute hat Finnland einen Teil dessen abgetreten, was einst zu uns gehörte, die Gebiete von [148.GetName]. Damit haben wir einen größeren Teil der samischen Bevölkerung in unserer Nation vereint und eine Grenze zu unserem Verbündeten im Osten geschaffen."
sweden_soviet.9.a:0	"Ah, ein Sieg!"
sweden_soviet.10.t:0	"Finnland weigert sich, [148.GetName] zu übertragen"
sweden_soviet.10.d:0	"In einer Pressekonferenz hat der finnische Premierminister heute verkündet, dass sie niemals Gebiete an eine andere Nation abtreten würden und dass die Schweden sie sich mit Gewalt nehmen müssten, wenn sie sie denn nehmen wollten."
sweden_soviet.10.a:0	"Wenn es Krieg ist, den sie wollen..."
sweden_soviet.11.t:0	"Finnland gibt Land ab"
sweden_soviet.11.d:0	"Die Finnen haben erkannt, wie töricht es ist, sich an Gebiete zu klammern, die die derzeitige Idee einer finnischen Nation als ihre eigenen beansprucht, und haben die Kontrolle über die angefragten Staaten an uns zurückgegeben."
sweden_soviet.11.a:0	"Unglaublich!"
sweden_soviet.12.t:0	"Die Finnen blockieren unsere Forderungen"
sweden_soviet.12.d:0	"Anscheinend sind die Finnen zu stur, um ihre Lage zu begreifen. Sie haben sich geweigert, die Kontrolle über die Staaten abzugeben, die unsere Politiker ihnen vorgelegt haben, und haben stattdessen ihre Streitkräfte in Richtung Grenze mobilisiert. So oder so, wir werden das Gebiet bekommen, das wir wollen."
sweden_soviet.12.a:0	"Zeit für ein paar Kriegsspiele..."
sweden_soviet.13.t:0	"Schweden ergreift die Kontrolle"
sweden_soviet.13.d:0	"Nachdem unsere Gebiete von den Schweden und den Sowjets beschlagnahmt wurden, haben die Schweden erklärt, dass Finnland nicht mehr in der Lage ist, allein zu überleben. Stattdessen haben sie ihre Absichten deutlich gemacht, um sicherzustellen, dass das finnische Volk die kommenden Kriege in Europa überlebt."
sweden_soviet.13.a:0	"Wir müssen uns beugen..."
sweden_soviet.91.t:0	"Finnland gibt nach [148.GetName]"
sweden_soviet.91.d:0	"Wie von den Schweden erwartet, haben die Finnen aufgrund des Drucks und der Möglichkeit eines Zweifrontenkriegs für sie [148.GetName] aufgegeben."
sweden_soviet.91.a:0	"Jetzt sind wir an der Reihe."
sweden_soviet.101.t:0	"Finnland lehnt schwedische Forderungen ab"
sweden_soviet.101.d:0	"In einer überraschenden, aber nicht völlig undurchführbaren Wendung der Ereignisse haben die Finnen den Schweden ihr beanspruchtes Land verweigert. Jetzt werden wir sehen, wie stark unser neuer Verbündeter wirklich ist."
sweden_soviet.101.a:0	"Interessant..."
sweden_soviet.111.t:0	"Finnland gibt vor [SOV.GetAdjective] nach"
sweden_soviet.111.d:0	"Es ist absolut keine Überraschung, dass die Finnen, nachdem sie gezwungen wurden, uns [148.GetName] zu geben, beschlossen haben, ihr Land aufzugeben, da sie sonst eine Invasion riskierten. Aber bald wird Finnland ohnehin kein Thema mehr sein."
sweden_soviet.111.a:0	"Das war zu erwarten."
sweden_soviet.112.t:0	"Finnland bleibt trotzig"
sweden_soviet.112.d:0	"Es stellt sich heraus, dass die Finnen sich nicht so leicht unterkriegen lassen, wie wir vielleicht erwartet haben, aber dennoch sehen sie sich jetzt dem sowjetischen Zorn ausgesetzt. Es wird ein Wunder sein, wenn Finnland länger als einen Monat überlebt."
sweden_soviet.112.a:0	"Warum so viel Blut verschwenden, Finnland?"
sweden_soviet.30.t:0	"[SWE.GetName] schlägt Wiedervereinigung vor"
sweden_soviet.30.d:0	"[SWE.GetName] hat uns ein diplomatisches Angebot unterbreitet, unsere Länder zu vereinen, um gemeinsam gegen die Sowjetunion zu kämpfen."
sweden_soviet.30.a:0	"Gemeinsam sind wir stärker!"
sweden_soviet.30.b:0	"Wir möchten unsere Unabhängigkeit bewahren."
sweden_soviet.31.t:0	"[From.GetName] Schließen Sie sich unserer Union an!"
sweden_soviet.31.d:0	"[From.GetName] hat unser Angebot angenommen und sich in der Nordischen Union der Sozialistischen Republiken zusammengeschlossen!"
sweden_soviet.31.a:0	"Willkommen, liebe Genossen!"
sweden_soviet.32.t:0	"[From.GetName] Lehnen Sie die Einladung ab."
sweden_soviet.32.d:0	"[From.GetName] hat die Einladung abgelehnt, sich uns in unserer glorreichen Union anzuschließen. Wir können jedoch weiterhin Verbündete bleiben, gemeinsam werden wir uns weiterhin gegen ausländische Bedrohungen wehren!"
sweden_soviet.32.a:0	"Das ist bedauerlich..."
sweden_soviet.33.t:0	"[SWE.GetName] lädt uns zum [SWE.GetFactionName] ein"
sweden_soviet.33.d:0	"Heute ist ein offizielles Kommuniqué aus Stockholm eingetroffen, in dem uns eine Einladung zum [SWE.GetFactionName] angeboten wird. In dem Kommuniqué wird erwähnt, dass wir uns gegen die Aggression aus dem Osten wehren wollen, nämlich gegen die [SOV.GetName]. Wie sollte unsere Antwort lauten?"
sweden_soviet.33.a:0	"Ein Bollwerk gegen den Osten? Wir akzeptieren."
sweden_soviet.33.b:0	"Und den russischen Bären verärgern? Passt."
sweden_soviet.34.t:0	"[FROM.GetName] Nimmt die Einladung an."
sweden_soviet.34.d:0	"[FROM.GetName] hat unsere Einladung angenommen, unser Bollwerk gegen die Bedrohung durch [SOV.GetName] wird stärker!"
sweden_soviet.34.a:0	"Willkommen!"
sweden_soviet.35.t:0	"[FROM.GetName] lehnt die Einladung ab."
sweden_soviet.35.d:0	"Leider hat unser Freund [FROM.GetName] die Einladung, Europa gegen die [SOV.GetName] zu schützen, abgelehnt. Aber trotzdem werden wir sie gegen die östliche Bedrohung schützen."
sweden_soviet.35.a:0	"Das ist sehr bedauerlich."
sweden_soviet.40.t:0	"Arbeiter starten Coup!"
sweden_soviet.40.d:0	"Nach einigen Monaten der Vorbereitung sind unsere Arbeiter nun bereit, den Aufstand zu starten! Möge unser Sieg schnell eintreten und die revolutionäre Flamme niemals erlöschen!"
sweden_soviet.40.a:0	"Arbeiter, erhebt euch!"
sweden_soviet.60.t:0	"Das schwedische Königshaus ist verschwunden"
sweden_soviet.60.d:0	"Nach dem Wechsel in der schwedischen Politik hat sich der schwedische König zunehmend gegen den radikaleren Weg des Landes ausgesprochen. \n\n Doch seit seinem letzten Auftritt vor etwas mehr als einem Monat herrscht fast völliges Schweigen in der königlichen Familie. Der neue schwedische Premierminister hat zwar öffentlich erklärt, dass das Verschwinden des Königs zutiefst besorgniserregend ist, doch aus der Haltung des neuen Regimes gegenüber dem Königtum wird kein Geheimnis gemacht, und einige Experten befürchten das Schlimmste."
sweden_soviet.60.a:0	"Wie schrecklich!"
sweden_sca_unite.1.t:0	"[FROM.GetNameDefCap] Schlägt skandinavische Vereinigung vor"
sweden_sca_unite.1.d:0	"In einer Sitzung brachte [FROM.GetLeader] heute das Thema eines möglicherweise vereinigten Skandinaviens zur Sprache. Sie führen an, dass die skandinavischen Länder kulturell und historisch schon immer eng miteinander verbunden waren und dass es angesichts der Tatsache, dass Europa ein weiterer großer Krieg bevorsteht, von Vorteil sein könnte, sich zu einer politischen Einheit zusammenzuschließen, um potenzielle Bedrohungen leichter abzuwehren."
sweden_sca_unite.1.a:0	"Sie haben ein gutes Argument."
sweden_sca_unite.1.b:0	"Wenn also einer fällt, fallen alle?"
sweden_sca_unite.2.t:0	"[FROM.GetNameDefCap] nimmt den Vorschlag an"
sweden_sca_unite.2.d:0	"[FROM.GetLeader] hat dem Vorschlag zugestimmt und gesagt, dass [FROM.GetNameDef] sich anschließen wird, um den Skandinavischen Rat zu bilden"
sweden_sca_unite.2.a:0	"Wir wussten, dass sie die Vorteile erkennen würden"
sweden_sca_unite.3.t:0	"[FROM.GetNameDefCap] lehnt den Vorschlag ab"
sweden_sca_unite.3.d:0	"[FROM.GetLeader] hat erklärt, dass die Bildung eines Skandinavischen Rates als potenzieller Akt der Aggression seitens anderer europäischer Mächte angesehen werden könnte und das Risiko birgt, das Gleichgewicht der Kräfte zu stören, daher haben sie die Einladung abgelehnt."
sweden_sca_unite.3.a:0	"Ohne sie sind wir schwächer..."
sweden_sca_unite.4.t:0	"[FROM.GetNameDefCap] lädt [THIS.GetNameDefCap] zum Skandinavischen Rat ein"
sweden_sca_unite.4.d:0	"Heute hat [THIS.GetLeader] ein paar Stunden lang mit [FROM.GetLeader] telefoniert und verschiedene politische Themen besprochen, als [FROM.GetLeader] uns einlud, dem Skandinavischen Rat beizutreten und Mitglied zu werden. Wir sind zwar nicht in Skandinavien, aber wir haben historische, kulturelle und wirtschaftliche Verbindungen zu ihnen, was uns zu einem Kandidaten für die Mitgliedschaft in diesem Rat macht."
sweden_sca_unite.4.a:0	"Für die Zukunft Skandinaviens!"
sweden_sca_unite.4.b:0	"Nachdem wir gerade erst unsere Unabhängigkeit erlangt haben, sollen wir sie wieder aufgeben?"
sweden_sca_unite.5.t:0	"[FROM.GetNameDefCap] Nimmt die Einladung an"
sweden_sca_unite.5.d:0	"Heute erreichte uns die Nachricht, dass [FROM.GetNameDef] die Einladung in den Rat angenommen hat und mit den Vorbereitungen begonnen hat, seine Wirtschaft, seine Streitkräfte und seine zivilen Märkte mit den unseren zu verbinden."
sweden_sca_unite.5.a:0	"Großartig!"
sweden_sca_unite.6.t:0	"[FROM.GetNameDefCap] lehnt die Einladung ab"
sweden_sca_unite.6.d:0	"Leider hat uns [FROM.GetNameDef] mitgeteilt, dass sie kein wirkliches Interesse daran haben, dem Rat beizutreten, da sie gerade erst unabhängig geworden sind und dies nicht einfach wegwerfen wollen."
sweden_sca_unite.6.a:0	"Wie bedauerlich."
SWE_foreign_politics_events.1.t:0	"[SWE.GetAdjective] Druck auf die Regierung"
SWE_foreign_politics_events.1.desc:0	"Der [FROM.GetAdjective] Außenminister ist zu dringenden Konsultationen mit [THIS.GetLeader] in der Hauptstadt eingetroffen. Die [FROM.GetAdjective] Delegation kam mit einer langen Liste offener Fragen, von der Grenzsicherheit bis zu einigen wenig schmeichelhaften Darstellungen von [FROM.GetLeader] in der lokalen Presse. In einer Pressemitteilung betonte der Außenminister die Bedeutung von Kooperation und friedlicher Zusammenarbeit, merkte aber an, dass [FROM.GetLeader] es schwierig fände, ein feindliches oder unfreundliches [THIS.GetNameDef] zu akzeptieren."
SWE_foreign_politics_events.1.a:0	"Wir sind bereit, uns ihrer Fraktion anzuschließen, wenn wir unsere Verfassung behalten können."
SWE_foreign_politics_events.1.b:0	"Wir müssen unsere Regierung mit der ihren in Einklang bringen."
SWE_foreign_politics_events.1.c:0	"Wir werden keinen Zentimeter nachgeben."
SWE_foreign_politics_events.2.t:1	"[SWE.GetAdjective]-gesponserte Kundgebungen in der Hauptstadt"
SWE_foreign_politics_events.2.desc:0	"Eine Reihe von politischen Gruppen haben für diese Woche Kundgebungen in der Hauptstadt angekündigt. Sie scheinen keine speziellen Anliegen zu haben, die sie vorbringen wollen, außer der allgemeinen Auffassung, dass wir versuchen sollten, unsere Beziehungen zu [SWE.GetNameDef] zu verbessern und alle Politiker, die der [SWE.GetAdjective]-Regierung kritisch gegenüberstehen, aus allen Machtpositionen zu entfernen.\n\nEs ist zwar möglich, dass diese Demonstrationen nur spontane Manifestationen der Volksmeinung sind, aber es ist zumindest bemerkenswert, dass eine Reihe wichtiger Organisatoren vor kurzem nach Stockholm gereist sind und nach ihrer Rückkehr anscheinend begonnen haben, dafür zu agitieren."
SWE_foreign_politics_events.2.a:0	"Nun, das ist sicherlich ihr gutes Recht."
SWE_foreign_politics_events.2.b:0	"Schicken Sie die Polizei, um ein paar Köpfe einzuschlagen!"
