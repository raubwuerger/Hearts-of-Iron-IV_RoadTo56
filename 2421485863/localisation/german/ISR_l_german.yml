israel.87.desc:0	"The [EGY.GetAdjective] diplomats have refused our offer, stating that it is not enough. We can choose to concede for more generous offer, or end the negotiations entirely."
ISR_DBG_DESCRIPTION:0	"David Josef Gruen glaubte immer, dass er derjenige sein würde, der die Nachfolge von Herzl als Führer der zionistischen Sache antreten würde. Viele nannten ihn wahnhaft oder verrückt, doch er hielt sich an Herzls Diktum - Wenn du es willst, ist es kein Traum.\n\nGruen wurde 1886 im heutigen Plock in einer Familie armer und ungebildeter Bauern geboren und interessierte sich schon in jungen Jahren für den Zionismus. Nach dem Pogrom von Kischinew trat er der Poali Zion bei und wurde ein hochrangiges Mitglied der Partei, das sich mehrmals mit jüdischen Führern wie Ber Borochov traf.\n\nNach Borochovs Abreise nach Amerika ging Gruen nach Palästina, wo er von Yisrael Shochats palästinensischem Zweig der Poali Zion rekrutiert wurde. Shochat glaubte, dass Gruen ein nützliches Werkzeug für ihn sein würde, während Gruen in Wirklichkeit jede Gelegenheit nutzte, um in der Partei an die Macht zu kommen. Um dies auszugleichen, rekrutierte Shochat den neu eingetroffenen Yitshak Ben-Zvi in die Partei, um ein Gegengewicht zu Gruen zu schaffen. Gruen und Ben-Zvi wurden schließlich gute Freunde, aber er verlor langsam die Macht in der Partei an Ben-Zvi und Shochat. Genervt trat er aus der Partei aus und zog nach Sejera, wo er schließlich einen hebräischen Namen annahm: Ben-Gurion.\n\nBei Ausbruch des Großen Krieges schloss sich Ben-Gurion Ben-Zvi in Poali Zion an, um Unterstützung für das Osmanische Reich zu sammeln, in der Hoffnung, die Zustimmung der kaiserlichen Regierung zu erhalten. Er stieß jedoch auf Ablehnung, als die Regierung Poali Zion zu einer antitürkischen Organisation erklärte und alle Mitglieder nach Ägypten deportierte, wo sie den Rest des Krieges verbrachten und sich teilweise den Briten anschlossen, um gegen die Osmanen zu kämpfen.\n\nDa das neu gebildete Mandat unter britischer Kontrolle stand, gründete Ben-Gurion eine neue Partei: Mapai, und ihre paramilitärische Truppe, die Haganah. Diese Partei sollte später die Führung des Jischuw dominieren, und als die Zeit für einen Aufstand gegen die Briten gekommen war, schlug die Haganah zuerst zu.\n\nNun, da die Hoffnung auf 2000 Jahre endlich in greifbare Nähe gerückt ist, ist es die Aufgabe von niemand anderem als Ben-Gurion, die Ziellinie zu überqueren."
