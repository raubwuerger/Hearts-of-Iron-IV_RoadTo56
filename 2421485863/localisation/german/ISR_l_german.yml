ISR_invite_maki:0	"Laden Sie §RMaki§! in unsere Koalition ein."
ISR_invite_maki_desc:0	"§RMaki§! - Eine kommunistische Partei, die während der britischen Mandatszeit aus der Palestine Communist Party hervorging und für eine leninistische Einstaaten-Union im Einklang mit der UdSSR eintrat."
ISR_invite_hashomer:0	"Laden Sie §OHashomer Hatsair§! in unsere Koalition ein."
ISR_invite_hashomer_desc:0	"§AHashomer Hatsair§! - Eine radikale sozialistische Partei, die sich von David Ben-Gurions Mapai unterscheidet, die sich mit der Sowjetunion verbünden will und große Unterstützung unter den ländlichen jüdischen Kibbuzim hat. Sie tritt für eine zurückhaltende Politik gegenüber der arabischen Welt ein und befürwortet die Koexistenz."
ISR_invite_mapai:0	"Laden Sie §tMapai§! in unsere Koalition ein."
ISR_invite_mapai_desc:0	"§tMapai§! - Eine demokratisch-sozialistische Partei, die sich von Hashomer Hatsair dadurch unterscheidet, dass sie sich auf den Westen ausrichtet und mehr Unterstützung unter dem städtischen Proletariat hat. Historisch gesehen war Mapai sehr pragmatisch und bereit, mit den britischen Behörden zusammenzuarbeiten. Mapai und ihre Vorgänger haben die zionistische Bewegung seit der Zweiten Alija dominiert."
ISR_invite_new_aliyah:0	"Laden Sie die §8New Aliyah§! in unsere Koalition ein."
ISR_invite_new_aliyah_desc:0	"§8Neue Aliyah§! - Eine sozialliberale Partei, die von Flüchtlingen der Fünften Aliyah aus Deutschland und Österreich gegründet wurde. Ihre Hauptziele sind der weitere Ausbau der Aliyah und die technologische Entwicklung Israels in das moderne Zeitalter."
ISR_invite_general_zionists:0	"Laden Sie die §gGeneralen Zionisten§! in unsere Koalition ein."
ISR_invite_general_zionists_desc:0	"§Allgemeine Zionisten§! - Eine kapitalistische liberale Partei, die ursprünglich von Theodore Herzl selbst gegründet wurde. Sie spricht vor allem die städtische Mittelschicht an und legt großen Wert auf persönliche Freiheiten."
ISR_invite_hatzohar:0	"Laden Sie §3Hatzohar§! in unsere Koalition ein."
ISR_invite_hatzohar_desc:0	"§3Hatzohar§! - Eine konservative Partei, die durch den Zustrom von jüdischen Flüchtlingen aus der arabischen Welt viel Unterstützung erhielt. Hatzohar unterscheidet sich von allen anderen Parteien dadurch, dass sie sich vom Jischuw getrennt hat und während der Mandatszeit eine eigene Miliz, die Irgun, hatte. Als solche wird sie als Paria-Partei angesehen und genießt nicht viel öffentliche Unterstützung."
ISR_invite_urf:0	"Laden Sie die §2United Religious Front§! in unsere Koalition ein."
ISR_invite_urf_desc:0	"§2United Religious Front§! - Ein Zweckbündnis zwischen vielen verschiedenen religiösen Parteien, die sich für den Erhalt der religiösen Gesetze in Israel einsetzen."
