ISR_sinai_war_category:0	"Operation Fokus"
ISR_sinai_war_category_desc:0	"Nach der Verstaatlichung des Suezkanals durch Ägypten waren wir gezwungen, einzumarschieren, um uns den Zugang zu den Schifffahrtswegen zu sichern. Wir können es uns jedoch nicht leisten, in ganz Ägypten einzumarschieren. Deshalb müssen wir das Ostufer des Suez einnehmen und halten."
ISR_defeat_egypt_mission:0	"Halten Sie das Ostufer"
ISR_push_for_negotiations:0	"Forcieren Sie Verhandlungen"
ISR_land_reclamation_category:0	"Landgewinnungsprojekte"
ISR_land_reclamation_category_desc:0	"Unser Land ist klein, und wir müssen jeden Dunam Land nutzen, um den Erfolg unseres Staates zu sichern. Es gibt viele Gebiete in unserem Land, die entweder zu unfruchtbar oder zu nass sind, um Bevölkerungszentren und industrielle Zentren zu beherbergen. Wir müssen unsere Anstrengungen darauf konzentrieren, diese Gebiete für unsere Bevölkerung lebenswert zu machen."
ISR_drain_hula:0	"Legen Sie die Hula-Sümpfe trocken"
ISR_northern_aforestation:0	"Nördliche Aufforstung"
ISR_southern_aforestation:0	"Südliche Aufforstung"
ISR_fertilize_the_negev:0	"Düngen Sie den Negev"
ISR_jabotinsky_category:0	"Jabotinskys Gesundheit lässt nach"
ISR_jabotinsky_category_desc:0	"Der Vater des revisionistischen Zionismus wird immer schwächer. Nach zahlreichen medizinischen Zwischenfällen scheint sich Jabotinskys Zeit dem Ende zuzuneigen. Wenn er selbst weiterarbeitet, wird sich sein Zustand nur verschlechtern. Wir müssen sicherstellen, dass dies nicht außer Kontrolle gerät."
ISR_jabotinsky_dying_mission:0	"Jabotinskys Gesundheitszustand verschlechtert sich"
ISR_crush_lehi_category:0	"Niederschlagung des Lehi-Aufstandes"
ISR_crush_lehi_category_desc:0	"Ein Kampf um das Schicksal unserer Nation ist im Gange. Im ganzen Land haben sich faschistische Verräter unter der Führung von [ISR.GetFascismLeader] gegen unsere Regierung erhoben und bedrohen die Existenz unserer Nation. Dieser Aufstand muss niedergeschlagen werden.\n\nDie derzeitige Lehi-Stärke ist §Y[?ISR_lehi_strength]%§!.\n"
ISR_impending_uprising:0	"Niederschlagung des Lehi-Aufstands"
ISR_launch_raid:0	"Razzia im mutmaßlichen Lehi-Versteck"
ISR_track_lehi_messengers:0	"Lehi-Boten aufspüren"
ISR_sway_former_haganah:0	"Ehemalige Haganah-Soldaten umstimmen"
ISR_accept_lehi_defectors:0	"Lehi-Abtrünnige akzeptieren"
ISR_raid_lehi_convoys:0	"Überfall auf Lehi-Konvois"
ISR_lehi_uprising_category:0	"Der Lehi-Aufstand"
ISR_lehi_uprising_category_desc:0	"Nach dem Tod von Jabotinsky hat Menachem Begin gezeigt, dass man ihm die Führung der Nation nicht zutraut, und wir haben einen Aufstand gegen ihn begonnen. Unsere Lehi ist viel kleiner als die Irgun, und deshalb müssen wir unsere Taktik sorgfältig planen und die wenigen Ressourcen, die wir haben, effektiv einsetzen.\n\nUnsere derzeitigen Vorbereitungen für einen Umsturz sind §Y[?ISR_preparedness]%§!."
ISR_window_of_oppertunity:0	"Das Fenster der Gelegenheit"
ISR_window_of_oppertunity_desc:0	"Unser Fenster der Gelegenheit ist jetzt! Wir müssen zuschlagen, bevor es zu spät ist."
ISR_irgun_crackdowns:0	"Irgun Niederschlagung"
ISR_attack_irgun_officer:0	"Angriff auf Irgun-Offiziere"
ISR_bomb_irgun_infrastructure:0	"Bombardierung der Irgun-Infrastruktur"
ISR_sneak_foreign_support:0	"Erbitten Sie Unterstützung von [FROM.GetNameDef]"
ISR_request_herzl_body:0	"Fordern Sie die Rückgabe der Leiche von Theodore Herzl"
JOR_core_west_bank:0	"Ausrufung des Haschemitischen Königreichs Jordanien"
JOR_core_west_bank_desc:0	"Nachdem wir das Westufer des Jordans erobert haben, können wir endlich unsere Völker zu einer Nation vereinen. "
JOR_core_west_bank_tt:0	"Wir werden alle palästinensischen Staaten, die wir kontrollieren, entkernen."
israel.1.t:0	"Irgun-Putsch!"
israel.1.d:0	"Die Haganah und die Irgun wurden während des Krieges zur Zusammenarbeit gezwungen und haben widerwillig Seite an Seite gekämpft, um die Unabhängigkeit des Landes zu sichern. Jetzt jedoch, da die Spannungen auf einem neuen Höchststand kochen, ist die desorganisierte Armee erneut zersplittert und ein Konflikt zwischen Haganah- und Irgun-Soldaten in Tel Aviv eskalierte zu einem landesweiten Putsch, bei dem die Irgun erfolgreich die Kontrolle übernahm."
israel.1.a:0	"[ISR.GetNeutralLeader] wird uns zum Ruhm führen!"
israel.2.t:0	"Ze'ev Jabotinsky verstirbt"
israel.2.d:0	"Heute früh erlitt Ze'ev Jabotinsky einen tödlichen Herzinfarkt. Trauernde aus dem ganzen Land versammelten sich zu seiner Beerdigung auf dem Herzl-Friedhof, sogar einige Mapai-Mitglieder waren gekommen. Sein Nachfolger, Menachem Begin, verspricht, sein Erbe als Führer der Hatzohar fortzuführen."
israel.2.a:0	"Das Ende einer Ära."
israel.3.t:0	"Die Hauptstadtfrage"
israel.3.d:0	"Nachdem die Hauptstadt während des Unabhängigkeitskrieges verlegt wurde, ist es an der Zeit, ein für alle Mal zu klären, was die Hauptstadt des neuen jüdischen Staates sein soll. Viele säkulare Gruppen sind der Meinung, dass sie das säkulare Zentrum von Tel Aviv bleiben sollte, während die religiösen Gemeinschaften der Meinung sind, dass sie in die Heilige Stadt Jerusalem zurückkehren sollte. Wofür sollen wir uns entscheiden?"
israel.3.a:0	"Die Hauptstadt soll in Tel Aviv bleiben."
israel.3.b:0	"Die Hauptstadt wird zurück nach Jerusalem verlegt."
israel.4.t:0	"Die sechste Aliyah"
israel.4.d:0	"Mit der Unabhängigkeit des neuen Staates strömen jüdische Flüchtlinge aus der ganzen Welt in das neue Land, um dort Zuflucht zu suchen. Sie fliehen vor den wachsenden Schrecken des Faschismus und Antisemitismus in Europa und der Welt. Dies hat zu einer Einwanderungskrise massiven Ausmaßes geführt, aber wir können es uns nicht leisten, jemanden abzuweisen, da unsere Nation von einem Bevölkerungszustrom immens profitieren würde."
israel.4.a:0	"Zwischen einstürzenden Mauern hat das Volk gesungen."
israel.5.t:0	"Die provisorischen Wahlen"
israel.5.d:0	"Mit dem Ende des Krieges ist die Zeit für unsere ersten Wahlen gekommen. Nach einer Volkszählung, für die eine 5-stündige Ausgangssperre über das ganze Land verhängt werden musste, sind wir endlich bereit.\n\nIm ganzen Land strömen die Bürger zu den Wahllokalen, um für ihre Parteien zu stimmen, und das Rennen ist knapp. Die Zeit wird zeigen, wer der Sieger sein wird."
israel.5.a:0	"Das Volk von Jisrael lebt wirklich wieder."
israel.6.t:0	"Hardliner gewinnen an Einfluss"
israel.6.d:0	"In letzter Zeit häufen sich die Berichte, dass die Hardliner-Fraktion versucht, mehr politischen Einfluss zu gewinnen. Einige sagen, sie versuchen, uns zu stürzen, aber andere behaupten, sie seien unsere Verbündeten und vertrauenswürdig. Was sollen wir tun?"
israel.6.a:0	"Das ist Unsinn. Sie sind unsere Verbündeten."
israel.6.b:0	"Beseitigen Sie sie sofort. Das werden wir nicht dulden."
israel.7.t:0	"Machtübernahme durch Hardliner"
israel.7.d:0	"Heute stürmten die Hardliner das Knessetgebäude und übernahmen die Regierung. [ISR.GetNeutralLeader] wurde während des Aufruhrs erschossen, wie auch andere Mitglieder von Hatzohar. [ISR.GetFascistLeader] verkündete heute den Beginn eines neuen israelischen Staates, eines Staates, der unseren verlorenen Ruhm zurückgewinnen wird."
israel.7.a:0	"Sie waren dumm, weil sie uns vertraut haben."
israel.8.t:0	"[ISR.GetNameDefCap] Fordert Jordanien"
israel.8.d:0	"Heute hat [ISR.GetLeader] offiziell gefordert, dass wir die Gebiete Jordaniens an ihr Groß-Israel abtreten. Sie behaupten, die angestammte Heimat des jüdischen Volkes liege an beiden Ufern des Jordans und das Gebiet gehöre rechtmäßig ihnen."
israel.8.a:0	"Sie mögen verrückt sein, aber einen Krieg können wir uns im Moment nicht leisten."
israel.8.b:0	"Lächerlich. Haben sie ihren Verstand verloren?"
israel.9.t:0	"Jordanien abgetreten"
israel.9.d:0	"[455.controller.GetNameDefCap] hat auf unsere Forderungen hin die Kontrolle über Jordanien an uns abgetreten. Unser Großisrael ist endlich geeint."
israel.9.a:0	"Nur so."
israel.10.t:0	"[455.controller.GetNameDefCap] lehnt unsere Forderungen ab"
israel.10.d:0	"Heute hat [455.controller.GetLeader] uns eine Nachricht zukommen lassen, in der sie uns verspotten, weil wir Jordanien von ihnen fordern. Sie behaupten, dass wir wegen solcher Forderungen verrückt geworden sind."
israel.10.a:0	"Vielleicht eines Tages."
israel.10.b:0	"Wir haben keine andere Wahl."
israel.11.t:0	"Verluste im Sinai-Krieg"
israel.11.d:0	"Leider werden wir aufgrund unserer Inkompetenz und unseres Versagens, den Sinai von Israel zurückzuerobern, nun aufgefordert, nachzugeben und einen Friedensvertrag zu unterzeichnen. Die Fortsetzung des Krieges könnte sich als katastrophal für die Stabilität unseres Landes erweisen."
israel.11.a:0	"Es ist das Beste für das ägyptische Volk, wir müssen es akzeptieren."
israel.11.b:0	"Nein! Wir dürfen uns nicht demütigen lassen!"
israel.12.t:0	"Sieg gegen Israel"
israel.12.d:0	"Nach dem waghalsigen Einmarsch der israelischen Streitkräfte in den Sinai haben sie ein Friedensangebot unterbreitet, da sie es nicht verkraften können, dass ihr Land betreten wird und die Einnahme des Sinai gescheitert ist. Wahrlich, Gott ist auf unserer Seite."
israel.12.a:0	"Wir sind siegreich!"
israel.12.b:0	"Nein! Wir müssen weiter vorrücken!"
israel.15.t:0	"Jom Ha'Atsmaut"
israel.15.d:0	"Jom Ha'Atsmaut - Tag der Unabhängigkeit. Der 2000 Jahre währende Traum unseres Volkes, endlich ein freies Volk in unserem eigenen Land zu sein, hat sich endlich erfüllt. Im ganzen Land ist der Jubel über die Unterzeichnung des Waffenstillstands ausgebrochen, und die Menschen glauben endlich, dass sich ihre harte Arbeit gelohnt hat.\n\nAber das ist noch nicht das Ende. Jetzt ist es an der Zeit, zusammenzukommen und wieder aufzubauen, Juden und Araber gleichermaßen. Wir haben vielleicht einen Platz auf der Weltbühne gewonnen, aber wir müssen sicherstellen, dass wir ihn auch behalten."
israel.15.a:0	"Am Yisrael Hai!"
israel.16.t:0	"Aliyah-Kämpfe lassen nach"
israel.16.d:0	"In den letzten Jahren seit unserer Unabhängigkeit wurde die Infrastruktur unseres Landes durch die Aliyah-Einwanderungswelle, die uns getroffen hat, belastet. Mit der Expansion unserer Industrie und der wachsenden politischen Legitimität unserer Nation bessern sich jedoch langsam die lähmenden Auswirkungen der Aliyah."
israel.16.a:0	"Wie zwischen einstürzenden Mauern sang das Volk."
israel.20.t:0	"Die Wahl des Präsidenten von Israel"
israel.20.d:0	"Nach der Einberufung der Knesset müssen wir uns für eine Galionsfigur entscheiden, die unser Land als Präsident führen soll. Es gibt viele Vorschläge, aber meist läuft es auf drei hinaus. Chaim Weizmann, der Vertreter des Yishuvs im Vertrag von Sevres, Yitshak Ben-Zvi, ein langjähriger Arbeitszionist und Freund von David Ben-Gurion, und Albert Einstein, eine führende jüdische Persönlichkeit, die in der ganzen Welt bekannt ist.\n\nDie Knesset ist gespalten, viele sagen, dass Einstein die richtige Wahl ist, während andere sagen, dass die Chance, dass er annimmt, gering ist und er möglicherweise zu unerfahren in der Politik ist, weshalb Weizmann oder Ben-Zvi die bessere Wahl sind."
israel.20.a:0	"Chaim Weizmann ist seit den Anfängen des Zionismus ein Aushängeschild. Er ist die offensichtliche Wahl."
israel.20.b:0	"Yitshak Ben-Zvi hat seine Hingabe bewiesen. Wir müssen ihn wählen."
israel.20.c:0	"Wir brauchen wissenschaftliches Denken, um unsere Nation voranzubringen. Einstein ist die richtige Entscheidung."
israel.21.t:0	"Einstein tritt zurück"
israel.21.d.a:0	"Präsident Einstein hat heute eine Rede gehalten, in der er behauptet, dass er aufgrund der Abhängigkeit der gegenwärtigen Regierung von religiösen Parteien nicht mehr als Präsident der Nation dienen kann, da es zu Interessenkonflikten kommt. Der ehemalige Präsidentschaftskandidat Chaim Weizmann wurde ausgewählt, sein Amt zu übernehmen."
israel.21.d.b:0	"Präsident Einstein hat heute eine Rede gehalten, in der er behauptet, dass er aufgrund der autoritären Politik der gegenwärtigen Regierung wegen Interessenkonflikten nicht mehr als Präsident der Nation dienen kann. Der ehemalige Präsidentschaftskandidat Chaim Weizmann wurde ausgewählt, seinen Posten zu übernehmen."
israel.21.a:0	"Er war ohnehin nicht für das Amt geeignet."
israel.22.t:0	"Jerusalemer Waffenstillstandsgespräche"
israel.22.d.a:0	"Nach der jordanischen Invasion im Westjordanland sind wir in der Lage, mit [JOR.GetNameDef] eine offizielle Waffenstillstandslinie für Jerusalem auszuhandeln. Die Stadt wird zwischen unseren Nationen aufgeteilt, um hoffentlich die Spannungen zu verringern."
israel.22.d.b:0	"Nach unserer Invasion im Westjordanland müssen wir mit [ISR.GetNameDef] über eine offizielle Waffenstillstandslinie für Jerusalem verhandeln. Die Stadt wird zwischen unseren Nationen aufgeteilt, um hoffentlich die Spannungen zu verringern."
israel.22.a:0	"Wir werden uns nur widerwillig auf einen Kompromiss einlassen."
israel.23.t:0	"Rückgabe von Herzls Leiche"
israel.23.d:0	"Der große zionistische Visionär Theodore Herzl, der die Idee eines modernen jüdischen Staates begründete, ruht derzeit in seiner Heimatstadt Wien. In seinem Testament hat der große Vater des Zionismus jedoch verfügt, dass seine sterblichen Überreste und die seiner Familie in das Land Israel überführt werden sollen, sobald das jüdische Volk seine Freiheit erlangt hat. Dieser Zeitpunkt ist jetzt. \n\nWir müssen jedoch [4.controller.GetNameDef] dazu bringen, dem zuzustimmen, da sie derzeit seine Ruhestätte kontrollieren. Sollten wir versuchen, mit ihnen zu verhandeln?"
israel.23.a:0	"Der Vater des Zionismus muss zur Ruhe gebracht werden."
israel.23.b:0	"Er soll bleiben, wo er ist."
israel.24.t:0	"[ISR.GetNameDefCap] fordert die Rückgabe von Herzls Leiche"
israel.24.d:0	"[ISR.GetNameDefCap] hat sich kürzlich an unsere Regierung gewandt und versucht, die sterblichen Überreste des zionistischen Führers und Visionärs Theodore Herzl von Wien nach Israel zu überführen. Wir müssen entscheiden, ob wir dieser Bitte nachkommen sollen."
israel.24.a:0	"Sie können seinen Körper haben."
israel.24.b:0	"Er wird hier bleiben."
israel.25.t:0	"Herzls Leiche zurückgegeben"
israel.25.d.a:0	"[4.controller.GetNameDefCap] hat zugestimmt, Herzls Leichnam an uns zurückzugeben. In Jerusalem wird ein Friedhof für alle großen zionistischen Führer eingerichtet, und er wird dort beigesetzt werden."
israel.25.d.b:0	"[4.controller.GetNameDefCap] hat zugestimmt, Herzls Leichnam an uns zurückzugeben. In Tel Aviv wird ein Friedhof für alle großen zionistischen Führer eingerichtet, und er wird dort seine letzte Ruhe finden."
israel.25.a:0	"Wenn Sie es wollen, ist das kein Traum."
israel.26.t:0	"[4.controller.GetNameDefCap] verweigert die Rückgabe von Herzls Leiche"
israel.26.d:0	"Unsere Bitte, Herzls Leiche zurückzugeben, wurde von [4.controller.GetNameDef] abgelehnt. Er wird bis auf weiteres dort bleiben."
israel.26.a:0	"Dies wird nicht vergessen werden."
israel.27.t:0	"Arabische Zivilisten fliehen"
israel.27.d:0	"Nachdem die Realität unseres Sieges immer deutlicher wird, sind viele arabische Zivilisten aus unseren Gebieten in die Nachbarländer geflohen. Wir werden entscheiden müssen, wie wir mit dieser Situation umgehen werden."
israel.27.a:0	"Erwartet."
israel.30.t:0	"Wahlen im Westjordanland"
israel.30.d:0	"Im Zuge unserer Vorbereitungen auf die Abhaltung unserer ersten Wahlen müssen wir die Frage beantworten: Werden im Westjordanland Wahlen abgehalten werden? Wenn sie abgehalten werden, wird die bedeutende arabische Mehrheit in dem Gebiet das Wahlergebnis definitiv zugunsten der linken Parteien kippen. Wir müssen eine Entscheidung treffen."
israel.30.a:0	"Sie sind Bürger wie jeder andere auch. Es wird geschehen."
israel.30.b:0	"Wir können ihnen noch nicht vertrauen, dass sie wählen."
israel.31.t:0	"Der alternde Vater"
israel.31.d:0	"Premierminister Ben-Gurion hat mehrfach seinen Willen bekundet, sich aus der Politik zurückzuziehen und einen Kibbuz im Negev zu gründen. Viele sind der Meinung, dass er sich eine wohlverdiente Ruhepause verdient hat, aber andere glauben, dass wir seine Führung in diesen Zeiten brauchen. Für den Fall, dass er zurücktritt, wird Außenminister Moshe Sharett seinen Platz einnehmen.\n\nWas soll getan werden?"
israel.31.a:0	"Kein Mann hat mehr Opfer gebracht als er. Lassen Sie ihn ausruhen."
israel.31.b:0	"Wir brauchen seine Führung."
israel.32.t:0	"Ausarbeitung einer Verfassung"
israel.32.d:0	"Der Traum von einer unabhängigen jüdischen Nation ist erfüllt, und die Zweifler schweigen. Doch unsere Schwierigkeiten sind noch nicht vorbei. Unserem Land fehlt eine Verfassung, die die Funktionen der Regierung in der Gesellschaft festlegt, und das kann zu großen Problemen führen, wenn es nicht angegangen wird. Es gibt jedoch viele kontroverse Themen, die angesprochen werden müssen, und es könnte schwierig sein, eine knappe Einigung zu erzielen. Um die Verfassung zu verabschieden, müssen wir sicherstellen, dass sie eine Mehrheit hat, aber auch nicht zu vage ist und bestimmte Themen anspricht, auch wenn einige Parteien gegen das Urteil sein könnten."
israel.32.a:0	"Lassen Sie die Verhandlungen beginnen."
israel.33.t:0	"Die Frage der Wehrpflicht"
israel.33.d:0	"Das erste Dilemma der Verfassungsverhandlungen betrifft die Wehrpflicht. Gegenwärtig werden viele religiöse Gemeinschaften in Israel aufgrund ihrer religiösen Überzeugungen vom Militärdienst befreit, was die säkulare Mehrheit erzürnt.\n\nSollen sie zum Dienst gezwungen werden?"
israel.33.a:0	"Sie müssen dienen wie jeder andere auch."
israel.33.b:0	"Sie haben einen Grund, es nicht zu tun."
israel.34.t:0	"Die Frage des Schabbat"
israel.34.d:0	"Das zweite Dilemma der Verfassungsverhandlungen dreht sich um die Rolle des Schabbats in unserer Nation. Einige fordern, dass alle Gottesdienste und Geschäfte am Schabbat geschlossen sein müssen, während andere sagen, dass dies unerhört ist und dass die Religion der Bevölkerung nicht aufgezwungen werden darf.\n\nWas soll entschieden werden?"
israel.34.a:0	"Religion kann einer Bevölkerung nicht aufgezwungen werden."
israel.34.b:0	"Wenn wir unsere Traditionen verlieren, sind wir dann wirklich noch jüdisch?"
israel.35.t:0	"Die Frage des Obersten Gerichtshofs"
israel.35.d:0	"Das dritte Dilemma bei den Verfassungsverhandlungen betrifft den Obersten Gerichtshof. Einige sind der Meinung, dass wir eine von der Knesset unabhängige Justiz haben müssen, die als Gegengewicht zur Knesset fungiert, während andere der Meinung sind, dass dies undemokratisch ist und dass der Oberste Gerichtshof kein äußerer Faktor sein darf."
israel.35.a:0	"Es wäre undemokratisch, einem nicht gewählten Institut zu erlauben, die Politik zu beeinflussen."
israel.35.b:0	"Einer Mehrheitsregierung zu erlauben, jedes Gesetz zu erlassen, das sie will, wäre Tyrannei."
israel.36.t:0	"Die Frage des Nationalstaates"
israel.36.d:0	"Das vierte Dilemma bei den Verfassungsverhandlungen betrifft die Identität der Nation als Ganzes. Einige sind dafür, Israel offiziell als eine Nation des jüdischen Volkes für das jüdische Volk zu proklamieren, während andere der Meinung sind, dass wir diesen Teil vage halten sollten, um keine Unruhe zu stiften."
israel.36.a:0	"Wir müssen offiziell erklären, was offensichtlich ist."
israel.36.b:0	"Halten Sie es vage."
israel.37.t:0	"Die Frage der Beschäftigung"
israel.37.d:0	"Das fünfte und letzte Dilemma bei den Verfassungsverhandlungen betrifft die Beschäftigung und den Staat. Viele sind der Meinung, dass die Gewerkschaften für die Beschäftigung zuständig sein sollten, da sie die Rechte der Arbeitnehmer schützen werden. Andere sind der Meinung, dass dies übertrieben und bürokratisch wäre und die individuelle Freiheit der Beschäftigung einschränken würde."
israel.37.a:0	"Wir müssen die Rechte der Arbeitnehmer schützen."
israel.37.b:0	"Wir dürfen die individuellen Freiheiten nicht beschädigen."
israel.38.t:0	"Die [ISR.GetAdjective] Verfassung"
israel.38.d:0	"Heute wurde die [ISR.GetAdjective] Verfassung in der Knesset verabschiedet, mit einer Mehrheit von [?ISR_constitution_votes] von 120. Die Befürworter haben dies als Triumph der [ISR.GetAdjective] Demokratie bezeichnet, während die Gegner von einer Tyrannei der Mehrheit sprechen. In jedem Fall ist dies ein wichtiger Schritt zur Stabilität der Nation."
israel.38.a:0	"Am Yisrael Hai!"
israel.39.t:0	"Verhandlungen über die Verfassung gescheitert"
israel.39.d.a:0	"Da es uns nicht gelungen ist, eine Mehrheit in der Knesset für den Verfassungsentwurf zu gewinnen, sind die Verhandlungen gescheitert.\n\n Uns bleibt eine kleine Anzahl von nicht eindeutig verbindlichen Grundgesetzen, die als Pseudo-Verfassung fungieren, die aber alle zu leicht zu ändern sind, und solche Schwächen werden in der Zukunft wahrscheinlich zu Problemen führen, wenn wir nicht in der Lage sind, dies zu ändern."
israel.39.d.b:0	"Da es uns nicht gelungen ist, viele wichtige Fragen im Verfassungsentwurf zu klären, sind die Verhandlungen gescheitert.\n\n Uns bleibt eine kleine Menge an mehrdeutig verbindlichen Grundgesetzen, die als Pseudo-Verfassung fungieren, aber diese sind alle zu leicht zu ändern und solche Schwächen werden in Zukunft wahrscheinlich Probleme verursachen, wenn wir nicht in der Lage sind, dies zu klären."
israel.39.a:0	"Wir können nur hoffen, dass keine größeren Probleme auftreten werden."
israel.40.t:0	"[ISR.GetAdjective] Zugang zum Suezkanal?"
israel.40.d:0	"Nachdem wir vor kurzem den Suezkanal verstaatlicht haben, stellt sich die Frage, ob wir [ISR.GetAdjective] Schiffen die Durchfahrt erlauben sollten. Es könnte leicht ihren Zugang zur östlichen Welt lahmlegen, was ihnen großen Schaden zufügen würde. \n\n Allerdings laufen wir Gefahr, dass wir überfallen werden, da dies als kriegerischer Akt angesehen werden könnte."
israel.40.a:0	"Blockieren Sie die Durchfahrt."
israel.40.b:0	"Es ist zu riskant."
israel.41.t:0	"[EGY.GetNameDefCap] Blockiert unseren Zugang zum Suezkanal!"
israel.41.d:0	"Mit der jüngsten Verstaatlichung des Suezkanals hat [EGY.GetNameDef] unseren Zugang zum Kanal blockiert. Das ist eine Katastrophe für unsere Schifffahrt in die östliche Hemisphäre, denn unser südlicher Hafen in Eilat ist extrem unterentwickelt und nicht über die Schiene mit dem Rest des Landes verbunden. Die Furcht vor einem wirtschaftlichen Zusammenbruch hält an."
israel.41.a:0	"Wir müssen uns überlegen, wie wir vorgehen."
israel.42.t:0	"Der Krieg auf dem Sinai"
israel.42.d:0	"Kurz nach der Verstaatlichung des Suezkanals durch [EGY.GetNameDef] gingen Berichte über [ISR.GetAdjective] Schiffe, die am Kanal umgedreht wurden, um die ganze Welt. \n\n[ISR.GetLeader] hat dies zu einer feigen Kriegshandlung von [EGY.GetLeader] erklärt und dass [ISR.GetNameDef] aufgrund der früheren Blockade der Straße von Tiran durch [EGY.GetNameDef] keine andere Wahl hat, als einzumarschieren, um zu verhindern, dass es von der östlichen Welt abgeschnitten wird.\n\nBerichte über Zusammenstöße an der Grenze sind eingetroffen, und es scheint, als sei der Krieg unvermeidlich."
israel.42.a:0	"Schlagen Sie zu, wenn das Eisen heiß ist."
israel.43.t:0	"Nubischer Steinbock gesichtet"
israel.43.d:0	"Mit den zunehmenden Investitionen in den Negev strömen viele Menschen in den Negev, um die dortige Tierwelt zu beobachten, so auch dieser Nubische Steinbock, dessen Foto die Runde machte."
israel.43.a:0	"Wahrlich die interessanteste Nachricht."
israel.45.t:0	"Ze'ev Jabotinskys Gesundheitszustand verschlechtert sich"
israel.45.d.b:0	"Während eines Treffens mit Mitgliedern der Irgun brach Jabotinsky gestern plötzlich zusammen und wurde von medizinischen Teams aus dem Raum gebracht. Diese jüngste Entwicklung unterstützt die Theorie, dass er an einer Form von Herzkrankheit leidet. Viele Menschen sorgen sich um seine Gesundheit und das Schicksal der Nation, falls er sterben sollte, und warnen ihn, sich nicht zu überanstrengen."
israel.45.d.a:0	"Während eines Treffens mit Mitgliedern der IDF brach Jabotinsky gestern plötzlich zusammen und wurde von medizinischen Teams aus dem Raum gebracht. Diese jüngste Entwicklung unterstützt die Theorie, dass er an einer Form von Herzkrankheit leidet. Viele Menschen sorgen sich um seine Gesundheit und das Schicksal der Nation, falls er sterben sollte, und warnen ihn, sich nicht zu überanstrengen."
israel.45.a:0	"Besorgniserregend."
israel.46.t:0	"Waffenversteck verschwunden"
israel.46.d:0	"Kurz nach Jabotinskys Tod wurden Berichte über verschwundene Waffenlager an das Oberkommando der Irgun herangetragen. Da viele der Berichte aus Gegenden zu kommen scheinen, in denen die Stern-Bande große Unterstützung genießt, sind einige misstrauisch."
israel.46.a:0	"Untersuchen Sie dies."
israel.47.t:0	"Funkstörungen in wichtigen Basen"
israel.47.d:0	"Heute meldeten zahlreiche wichtige Stützpunkte im Land weit verbreitete Funkstörungen, die eine Kommunikation untereinander unmöglich machten. Die Probleme wurden zwar behoben, aber nach dem Verschwinden der Waffenverstecke sind viele in höchster Alarmbereitschaft."
israel.47.a:0	"Irgendetwas stimmt hier nicht."
israel.48.t:0	"Haifa-Garnison schweigt"
israel.48.d:0	"Nach den Berichten über das Verschwinden von Waffenlagern scheint es, als ob die gesamte Haifa-Garnison still geworden ist. Versuche, die Garnison über Funk zu erreichen, sind gescheitert, und hohe Beamte befürchten einen umfassenden Putsch."
israel.48.a:0	"Das ist nicht gut."
israel.49.t:0	"Die Spaltung der Revisionisten"
israel.49.d:0	"Heute um 10:00 Uhr verkündete Avraham Stern live im Radio, dass er sich nach dem Tod des großen Revisionistengründers Ze'ev Jabotinsky gezwungen sehen würde, in die neue Regierung einzugreifen und eine Machtübernahme einzuleiten, und bezeichnete Menachem Begin als Feigling und Verräter an Jabotinskys Erbe. \n\n Im Gegenzug hat Begin Stern als faschistischen Stiefellecker denunziert und gesagt, dass dieser Verrat niedergeschlagen werden wird.\n\nViele sind entsetzt über die Möglichkeit eines ausgewachsenen Bürgerkriegs."
israel.49.a:0	"Wir werden die Verräter vernichten!"
israel.49.b:0	"Nur Stern kann uns führen!"
israel.50.t:0	"Chaos in Israel"
israel.50.d:0	"Nach dem Tod von [ISR.GetAdjective] Führer Ze'ev Jabotinsky ist in der Nation das totale Chaos ausgebrochen. Da die Regierung nicht in der Lage ist, mit den faschistischen Rebellen fertig zu werden, ist im Land ein Bürgerkrieg ausgebrochen. Das ist unsere Chance, zurückzuschlagen und sie endgültig zu vernichten!"
israel.50.a:0	"Sie sind schwach! Greifen Sie jetzt an!"
israel.50.b:0	"Lassen Sie sie sich gegenseitig bekämpfen."
israel.51.t:0	"Überfall erfolgreich"
israel.51.d:0	"Heute Morgen haben unsere Soldaten erfolgreich ein Versteck der Lehi gestürmt. Wir haben während des Kampfes nur wenige Verluste erlitten und die Lehi-Soldaten haben sich schnell ergeben. In dem Versteck gab es ein kleines Waffenlager und weitere Informationen über den Aufenthaltsort von Stern."
israel.51.a:0	"Wir werden ihn finden!"
israel.52.t:0	"Überfall aus dem Hinterhalt"
israel.52.d:0	"Leider geriet unser Überfall auf das Lehi-Versteck aufgrund falscher Informationen in einen Hinterhalt und wir waren gezwungen, uns unter hohen Verlusten zurückzuziehen. Das wird zweifellos die Moral unserer Truppe schwächen und Stern mehr Zeit verschaffen, sich zu verlagern."
israel.52.a:0	"Beim nächsten Mal sollten wir besser vorbereitet sein."
israel.53.t:0	"Avraham Stern gefangen genommen"
israel.53.d:0	"Als die letzten Zellen des Lehi-Widerstands vernichtet wurden, wurde Avraham Stern von einem Irgun-Trupp gefangen genommen, der versuchte, aus der Schlacht zu fliehen. Er befindet sich jetzt in unserem Gewahrsam und wir müssen entscheiden, was wir mit ihm machen."
israel.53.a:0	"Tod dem Verräter!"
israel.54.t:0	"Verdoppeln Sie den Fall"
israel.54.d:0	"Avraham Stern, Sie wurden des Hochverrats, des Einsatzes von Terrortaktiken und der Kollaboration mit Feinden des Staates Israel für schuldig befunden. Die Strafe für diese Verbrechen ist der Tod. Können Sie etwas zu Ihrer Verteidigung sagen?\n\nSchweigen Sie, dass Sie die Nazi-Partei in Deutschland um Unterstützung gebeten haben?\n\n Ich habe getan, was getan werden musste.\n\nAls die verbrauchte Patronenhülse auf dem Boden aufschlug, fragte sich Begin, ob dies zum Teil seine Schuld war."
israel.54.a:0	"Damit das Böse gedeihen kann, müssen gute Menschen nur nichts tun."
israel.55.t:0	"Garnison von Irgun angegriffen!"
israel.55.d:0	"Heute früh wurde eine unserer Garnisonen von der Irgun angegriffen. Es ist uns gelungen, sie abzuwehren und umzusiedeln, aber unsere Bemühungen haben leichten Schaden genommen."
israel.55.a:0	"Ziehen Sie sich zurück und gruppieren Sie sich neu."
israel.56.t:0	"Konvoi von Irgun angegriffen!"
israel.56.d:0	"Heute früh wurde einer unserer Konvois von Irgun-Mitgliedern angegriffen, wodurch die Ausrüstung, die die Lastwagen transportierten, verloren ging. Dies wird unsere Bemühungen behindern."
israel.56.a:0	"Beim nächsten Mal müssen wir vorsichtiger sein."
israel.57.t:0	"Versteck von Irgun angegriffen!"
israel.57.d:0	"Heute früh wurde eines unserer Verstecke von einer Irgun-Kompanie angegriffen. Sie stürmten das Versteck, und nur wenige konnten entkommen. Dies wird unsere Bemühungen stark behindern."
israel.57.a:0	"Finden Sie heraus, wie sie uns gefunden haben."
israel.58.t:0	"Lehi bittet um unsere Unterstützung"
israel.58.d:0	"Aufgrund des anhaltenden Aufstands der ultranationalistischen Lehi-Gruppe gegen die Irgun-Regierung in [ISR.GetNameDef] hat sie uns um Unterstützung beim Sturz der Regierung von Menachem Begin gebeten. Wenn wir sie unterstützen, könnte dies zum Aufstieg einer ultranationalistischen Regierung in Israel führen, was für uns von Vorteil sein könnte."
israel.58.a:0	"Unterstützen Sie sie."
israel.58.b:0	"Sie haben wirklich ihren Verstand verloren."
israel.59.t:0	"[FROM.GetNameDefCap] Schickt uns Hilfe!"
israel.59.d:0	"Unsere jüngste Mission bei [FROM.GetNameDef] war ein Erfolg, und [FROM.GetLeader] hat sich bereit erklärt, uns in unserem Kampf zu unterstützen."
israel.59.a:0	"Wir danken ihnen."
israel.60.t:0	"[FROM.GetNameDefCap] Weigert sich, Hilfe zu schicken!"
israel.60.d:0	"Unsere jüngste Mission nach [FROM.GetNameDef] endete in einem Desaster, denn unsere Leute wurden rundheraus abgelehnt, [FROM.GetLeader] überhaupt zu treffen."
israel.60.a:0	"Hunde!"
israel.61.t:0	"[ISR.GetNameDefCap] will den dritten Tempel bauen!"
israel.61.d:0	"[ISR.GetLeader] hat heute in Jerusalem verkündet, dass [ISR.GetNameDef] mit dem Bau des Dritten Tempels beginnen wird, sobald das jüdische Volk die Kontrolle über den heiligen Tempelberg hat. Dies wird mit ziemlicher Sicherheit die Zerstörung der Al-Aqsa-Moschee nach sich ziehen, was wir nicht zulassen können. Wir müssen intervenieren."
israel.61.a:0	"Sie haben offiziell ihren Verstand verloren!"
israel.61.b:0	"Wen interessiert das schon?"
israel.62.t:0	"Der dritte Tempelkrieg"
israel.62.d:0	"Vor einigen Tagen verkündete [ISR.GetLeader] in Jerusalem, dass [ISR.GetNameDef] mit dem Bau des Dritten Tempels beginnen wird, sobald das jüdische Volk die Kontrolle über den heiligen Tempelberg hat. Dies löste sofort eine wahnsinnige Empörung in der gesamten muslimischen Welt aus, die damit endete, dass fast alle muslimischen Nationen Israel den Krieg erklärten, um die Zerstörung von Al Aqsa zu verhindern.\n\nExperten auf der ganzen Welt sind verblüfft, dass [ISR.GetNameDef] so etwas überhaupt versuchen würde."
israel.62.a:0	"Die Realität ist wirklich seltsamer als die Fiktion."
israel.70.t:0	"Dov Hoz stirbt bei Autounfall"
israel.70.d:0	"Dov Hoz, Pionier der jüdischen Luftfahrt und Berater der Regierung, ist heute bei einem tragischen Autounfall auf der Road 4 ums Leben gekommen, nachdem sein Auto von der Straße abgekommen und gegen eine Betonwand geprallt war. Mit ihm im Auto waren seine Frau und seine Tochter, die ebenfalls bei dem tödlichen Unfall ums Leben kamen."
israel.70.a:0	"Ein echter Verlust für die Luftfahrt."
israel.71.t:0	"Dov Hoz überlebt Autounfall"
israel.71.d:0	"Dov Hoz, Pionier der jüdischen Luftfahrt und Berater der Regierung, überlebte heute einen Autounfall auf der Road 4, nachdem sein Fahrzeug in den Seitengraben geriet. Er konnte sich jedoch wieder unter Kontrolle bringen und verfehlte nur knapp eine Betonmauer. Hoz und seine Frau und seine Tochter, die mit ihm im Auto saßen, wurden nur leicht verletzt."
israel.71.a:0	"Eine Katastrophe abgewendet."
israel.72.t.a:0	"Maronitische Rebellion!"
israel.72.d.a:0	"Seit der Erlangung der Unabhängigkeit gab es viele ethnische Spannungen, die unser Land geplagt haben. Heute gipfelten diese Spannungen in einem Putschversuch der Maroniten, von denen einige behaupten, dass sie heimlich von [ISR.GetNameDef] finanziert werden, und nach mehrstündigen Kämpfen quer durch die Nationen haben die Aufständischen..."
israel.72.t.b:0	"Maronitische Rebellion im Libanon!"
israel.72.d.b:0	"Unsere Besetzung des Libanon war nie sonderlich populär, aber heute haben die Spannungen in der Region einen Siedepunkt erreicht. Überall im Libanon haben maronitische Milizen begonnen, unsere Truppen anzugreifen, und man vermutet, dass sie von [ISR.GetNameDef] unterstützt werden. Einige sagen, diese Schlacht sei es nicht wert, gekämpft zu werden, und wir sollten uns aus der Region zurückziehen.\n\nWas sollen wir tun?"
israel.72.a:0	"Lassen Sie sie in Ruhe, wir haben wichtigere Dinge zu erledigen."
israel.72.b:0	"Sie werden vernichtet werden!"
israel.72.c:0	"Sie wurden zurückgeschlagen und vernichtet!"
israel.72.d:0	"Erfolgreich die Regierung geputscht!"
israel.73.t:0	"Maronitische Rebellion im Libanon!"
israel.73.d.a:0	"Nachdem wir die maronitischen Streitkräfte im Libanon erfolgreich finanziert haben, haben sie erfolgreich revoltiert und das Land übernommen. Wir können unseren Einfluss geltend machen, um die Kontrolle über ihre Regierung zu übernehmen, aber es wäre wohl das Beste, uns nicht zu sehr in ihren Krieg einzumischen."
israel.73.d.b:0	"Nachdem wir die maronitischen Streitkräfte im Libanon erfolgreich finanziert haben, haben sie erfolgreich revoltiert und das Land übernommen. Jetzt können wir unseren Einfluss geltend machen, um die Kontrolle über ihre Regierung zu übernehmen."
israel.73.a:0	"Nun gut."
israel.73.b:0	"Es ist das Beste, wenn wir uns nicht zu sehr einmischen."
israel.74.t:0	"[ISR.GetNameDefCap] bietet die Teilung Syriens an"
israel.74.d:0	"[ISR.GetLeader] ist heute mit einem Vorschlag an unsere Regierung herangetreten, Syrien zwischen unseren beiden Nationen aufzuteilen. Wir haben seit dem Fall des Osmanischen Reiches Anspruch auf das syrische Territorium erhoben, und vielleicht wäre dies ein guter Zeitpunkt, um unser verlorenes Territorium zurückzufordern."
israel.74.a:0	"Wir sind einverstanden."
israel.74.b:0	"Wir müssen uns um andere Dinge kümmern."
israel.75.t:0	"[TUR.GetNameDefCap] Nimmt unser Angebot an"
israel.75.d:0	"Die Führung von [TUR.GetAdjective] hat unseren Vorschlag, Syrien zu teilen, akzeptiert. Es ist Zeit zu handeln."
israel.75.a:0	"In den Krieg!"
israel.76.t:0	"[TUR.GetNameDefCap] lehnt unser Angebot ab"
israel.76.d:0	"[TUR.GetLeader] hat unser Angebot für eine Teilung Syriens abgelehnt und behauptet, dass [TUR.GetNameDef] sich um wichtigere Dinge kümmern muss. "
israel.76.a:0	"Wir werden trotzdem angreifen!"
israel.76.b:0	"Es ist das Beste, den Angriff abzubrechen."
israel.80.t:0	"Schließung des Suezkanals"
israel.80.d:0	"Nach dem Sieg von [ISR.GetAdjective] gegen [EGY.GetNameDef] im Sinai-Krieg hat das Versäumnis der beiden Regierungen, einen Plan für den Suezkanal auszuhandeln, zu einer vorübergehenden Schließung des Kanals geführt.\n\n Alle Schiffe, die sich der Kanalzone nähern, wurden darauf vorbereitet, die Reise über das Kap der Guten Hoffnung anzutreten, und viele große Weltmächte erwägen bereits, Druck auf [ISR.GetNameDef] und [EGY.GetNameDef] auszuüben, um einen Kompromiss zu erreichen, bevor Sanktionen verhängt werden."
israel.80.a:0	"Das ist nicht unser Problem."
israel.80.b:0	"Wir müssen sie unter Druck setzen!"
israel.80.c:0	"Wir sollten wahrscheinlich eine Einigung erzielen, bevor die Sache außer Kontrolle gerät."
israel.81.t:0	"[FROM.GetNameDefCap] Drängt uns zu Verhandlungen!"
israel.81.d:0	"Nach der Schließung des Suezkanals ist [FROM.GetLeader] mit der Forderung nach Verhandlungen über seine Wiedereröffnung an unsere Regierung herangetreten."
israel.81.a:0	"Wir sollten uns wahrscheinlich einen Plan ausdenken."
israel.82.t:0	"[ISR.GetNameDefCap] bietet Friedensverhandlungen an"
israel.82.d:0	"Heute Morgen ist der diplomatische Gesandte von [ISR.GetNameDef] zu uns gekommen und hat Friedensverhandlungen über den Kanal angeboten. Da wir beide unter diplomatischem Druck stehen, den Kanal bald wieder zu öffnen, sollten wir erwägen, dieses Angebot anzunehmen. Vielleicht können wir sogar etwas dabei herausholen."
israel.82.a:0	"Wir werden es annehmen."
israel.82.b:0	"Keine Verhandlung!"
israel.83.t:0	"[EGY.GetNameDefCap] Lehnt Verhandlungen ab"
israel.83.d:0	"Der [EGY.GetAdjective] Gesandte hat unser Verhandlungsangebot rundweg abgelehnt und erklärt, dass er niemals mit der Zionistischen Entität verhandeln wird."
israel.83.a:0	"Man hat uns die Hand zurück ins Gesicht geschlagen."
israel.84.t:0	"[EGY.GetNameDefCap] Verhandlungswillig"
israel.84.d:0	"Der [EGY.GetAdjective] Gesandte hat seine Bereitschaft bekundet, über das Schicksal des Kanals zu verhandeln. Es ist wahrscheinlich in unserem besten Interesse, bald mit den Verhandlungen zu beginnen, da der diplomatische Druck wächst."
israel.84.a:0	"Lassen Sie uns beginnen."
israel.84.b:0	"Wir werden niemals mit ihnen verhandeln."
israel.85.t:0	"[ISR.GetNameDefCap] lehnt Verhandlungen ab"
israel.85.d:0	"Die [ISR.GetAdjective] Regierung hat unsere Verhandlungsversuche mit der Begründung abgelehnt, dass sie kein Land aufgeben wird, das für Angriffe auf sie verwendet werden kann."
israel.85.a:0	"Man hat uns die Hand ins Gesicht geschlagen."
israel.86.t:0	"Die Wahl unseres Angebots"
israel.86.d:0	"Da wir aus einer Position der Stärke heraus verhandeln, können wir unser Angebot selbst bestimmen. Einige Mitglieder der Regierung weigern sich, größere Gebiete zurückzugeben, weil sie der Meinung sind, dass die Ägypter sie sicher nutzen werden, um uns anzugreifen, sobald sie die Gelegenheit dazu haben. Andere sind optimistischer, was den Friedensprozess angeht, und daher bereit, mehr Land für eine bessere Chance auf erfolgreiche Verhandlungen zu opfern.\n\nDie Entscheidung liegt bei uns."
israel.86.a:0	"Wir werden die Rückgabe des Kanals anbieten und nichts weiter."
israel.86.b:0	"Wir können ihnen den gesamten Sinai zurückgeben, solange er entmilitarisiert ist."
israel.86.c:0	"Wir sind bereit, den gesamten Sinai wieder unter ihre Kontrolle zu bringen, im Gegenzug für einen dauerhaften Frieden."
israel.87.t:0	"[EGY.GetNameDefCap] Lehnt unser Angebot ab!"
israel.87.a:0	"Wir bieten die Rückgabe des Kanals an, mehr nicht."
israel.87.b:0	"Wir können ihnen den gesamten Sinai zurückgeben, solange er entmilitarisiert wird."
israel.87.c:0	"Wir sind bereit, den gesamten Sinai wieder unter ihre Kontrolle zu bringen, wenn wir im Gegenzug einen dauerhaften Frieden erhalten."
israel.87.d:0	"Zum Teufel mit ihnen! Wir haben genug!"
israel.88.t:0	"Scheitern der Verhandlungen"
israel.88.d:0	"Unsere Verhandlungen mit [ISR.GetNameDef] sind gescheitert. Der Kanal bleibt geschlossen, und der diplomatische Druck bleibt bestehen."
israel.88.a:0	"Zum Teufel mit ihnen!"
israel.89.t:0	"Suez-Verhandlungen gescheitert"
israel.89.d:0	"Wie viele erwartet haben, sind die jüngsten Verhandlungen zwischen [ISR.GetNameDef] und [EGY.GetNameDef] gescheitert. Beide Seiten haben keine gemeinsame Basis gefunden, und während die Diplomaten nach Hause fahren, ist der Kanal weiterhin nicht in Betrieb. Viele glauben, dass dies in der Zukunft zu einem Krieg eskalieren wird."
israel.89.a:0	"Hat irgendjemand wirklich etwas erwartet?"
israel.90.t:0	"[ISR.GetNameDefCap] bietet Rückgabe von Ost-Suez an"
israel.90.d:0	"Die [ISR.GetAdjective]-Delegation hat uns die Rückgabe des östlichen Suezkanals im Gegenzug für einen dauerhaften Friedensvertrag angeboten. Das ist zwar ein hartes Angebot, aber vielleicht ist es in unserem Interesse, es trotzdem anzunehmen."
israel.90.a:0	"Wir werden es annehmen, wenn der Sinai entmilitarisiert wird."
israel.90.b:0	"Das ist zu viel!"
israel.91.t:0	"[EGY.GetNameDef] Fordert die Entmilitarisierung des Sinai"
israel.91.d:0	"Die [EGY.GetAdjective] Diplomaten haben ihre Bereitschaft bekundet, unser Angebot anzunehmen, aber ihre einzige Bedingung ist, dass der Sinai im Gegenzug entmilitarisiert wird. Sollen wir das akzeptieren?"
israel.91.a:0	"Ihre Bedingungen sind akzeptabel."
israel.91.b:0	"Warum denken sie, dass sie aus einer Position der Stärke heraus verhandeln? Nein!"
israel.92.t:0	"[ISR.GetNameDefCap] Akzeptiert"
israel.92.d:0	"[ISR.GetLeader] hat unsere Bedingungen akzeptiert, und der Sinai wird auf unsere Bitte hin entmilitarisiert. Der endgültige Vertrag wird in Kürze unterzeichnet werden."
israel.92.a:0	"Ein historischer Tag."
israel.93.t:0	"[ISR.GetNameDefCap] bietet einen entmilitarisierten Sinai an"
israel.93.d:0	"Die [ISR.GetAdjective]-Delegation hat uns die Rückgabe der gesamten Sinai-Halbinsel an unsere Autorität angeboten, unter der Bedingung, dass sie zu einer entmilitarisierten Zone wird und ein dauerhafter Friedensvertrag geschlossen wird. Dieses Angebot scheint in unserem Sinne zu sein, sollten wir es annehmen?"
israel.93.a:0	"Akzeptable Bedingungen."
israel.93.b:0	"Nicht genug!"
israel.94.t:0	"[EGY.GetNameDefCap] Nimmt an"
israel.94.d:0	"[EGY.GetLeader] hat unsere Bedingungen akzeptiert, und der Sinai wird an sie zurückgegeben und gemäß unserer Forderung entmilitarisiert werden. Der endgültige Vertrag wird in Kürze unterzeichnet werden."
israel.94.a:0	"Ein historischer Tag."
israel.95.t:0	"[ISR.GetNameDefCap] bietet den Sinai für den Frieden an"
israel.95.d:0	"Die [ISR.GetAdjective] Delegation hat uns die Rückgabe der gesamten Sinai-Halbinsel an unsere Autorität unter der Bedingung angeboten, dass wir einen dauerhaften Friedensvertrag unterzeichnen. Dieses Angebot scheint zu unseren Gunsten zu sein, und die meisten Mitglieder der Regierung wünschen, dass wir es annehmen."
israel.95.a:0	"Wir sollten dieses Angebot annehmen, solange wir noch können."
israel.96.t:0	"[EGY.GetNameDefCap] Nimmt an"
israel.96.d:0	"[EGY.GetLeader] hat unsere Bedingungen akzeptiert, und der Sinai wird an sie zurückgegeben und ein dauerhafter Frieden wird unterzeichnet. Der endgültige Vertrag wird in Kürze unterzeichnet werden."
israel.96.a:0	"Ein historischer Tag."
israel.99.t:0	"Der Vertrag von Nikosia"
israel.99.d.a:0	"Heute erreichte die Nachricht vom endgültigen Vertrag zwischen [EGY.GetNameDef] und [ISR.GetNameDef] die Welt. Nach intensiven Verhandlungen in den vergangenen Tagen haben sich [EGY.GetLeader] und [ISR.GetLeader] die Hände geschüttelt, als sie den Vertrag unterzeichneten.\n\nDer Vertrag umreißt den Plan zur Wiedereröffnung des Suezkanals, bei dem das Ostufer des Kanals von Ägypten verwaltet wird, mit vollem Durchfahrtsrecht für die [ISR.GetAdjective] Schifffahrt. Die Halbinsel Sinai wird, wie im Vertrag vorgesehen, unter [ISR.GetAdjective] ziviler Verwaltung bleiben, aber eine entmilitarisierte Zone werden.\n\nAls der Kanal geöffnet wird, sind viele optimistischer, was einen dauerhaften Frieden im Nahen Osten angeht."
israel.99.d.b:0	"Heute erreichte die Nachricht über den endgültigen Vertrag zwischen [EGY.GetNameDef] und [ISR.GetNameDef] die Welt. Nach intensiven Verhandlungen in den vergangenen Tagen schüttelten sich [EGY.GetLeader] und [ISR.GetLeader] die Hände, als sie den Vertrag unterzeichneten.\n\nDer Vertrag umreißt den Plan zur Wiedereröffnung des Suezkanals, bei dem das Ostufer des Kanals von Ägypten verwaltet wird, mit vollem Durchfahrtsrecht für [ISR.GetAdjective] Schiffe. Die Halbinsel Sinai wird wieder unter ägyptischer Zivilverwaltung stehen, aber eine entmilitarisierte Zone werden.\n\nNach der Eröffnung des Kanals sind viele optimistischer, was einen dauerhaften Frieden im Nahen Osten angeht."
israel.99.d.c:0	"Heute erreichte die Nachricht über den endgültigen Vertrag zwischen [EGY.GetNameDef] und [ISR.GetNameDef] die Welt. Nach intensiven Verhandlungen in den vergangenen Tagen schüttelten sich [EGY.GetLeader] und [ISR.GetLeader] die Hände, als sie den Vertrag unterzeichneten.\n\nDer Vertrag umreißt den Plan zur Wiedereröffnung des Suezkanals, bei dem das Ostufer des Kanals von Ägypten verwaltet wird, mit vollem Durchfahrtsrecht für [ISR.GetAdjective] Schiffe. Wie in dem Vertrag vorgesehen, wird die Sinai-Halbinsel wieder vollständig unter ägyptische Verwaltung gestellt, wobei ein Nichtangriffspakt zwischen den Nationen unterzeichnet wird. \n\nMit der Öffnung des Kanals sind viele optimistischer, was einen dauerhaften Frieden im Nahen Osten angeht."
israel.99.a:0	"Ein Schritt vorwärts in Richtung Frieden."
israel.100.t:0	"[ISR.GetNameDefCap] Erklärt die Unabhängigkeit"
israel.100.d:0	"Heute wurde bekannt, dass [ISR.GetLeader] seine Unabhängigkeit erklärt hat. Obwohl sie sich immer noch im Krieg mit [PAL.GetNameDef] befinden, haben die arabischen Milizen in Palästina bewiesen, dass sie zu inkompetent sind, um mit den zionistischen Kräften fertig zu werden, was uns zwingt, einzugreifen."
israel.100.a:0	"Starten Sie die Invasion."
israel.100.b:0	"Sie können für sich selbst kämpfen."
israel.101.t:0	"[ISR.GetAdjective] Truppen betreten den Sinai"
israel.101.d:0	"Durch unsere jüngsten Misserfolge im Krieg gegen [ISR.GetNameDef] haben uns ihre Truppen bis auf unser eigenes Gebiet zurückgedrängt. Viele rufen nach einem Waffenstillstandsabkommen."
israel.101.a:0	"Wir müssen einen Waffenstillstand aushandeln."
israel.101.b:0	"Wir müssen weiterkämpfen!"
israel.102.t:0	"[EGY.GetNameDefCap] Bietet Waffenstillstand"
israel.102.d:0	"Nachdem unsere Truppen in den Sinai eingedrungen sind, haben uns die ägyptischen Streitkräfte einen Waffenstillstand angeboten, um die Kämpfe zu beenden. Wir müssen ihn annehmen, denn dadurch werden unsere Kräfte frei, um an anderen Fronten zu kämpfen."
israel.102.a:0	"Am Yisrael Hai!"
israel.103.t:0	"[ISR.GetAdjective] Streitkräfte überqueren den Jordan"
israel.103.d:0	"Durch unsere jüngsten Misserfolge im Krieg gegen [ISR.GetNameDef] haben uns ihre Truppen bis auf unser eigenes Territorium zurückgedrängt. Viele rufen nach einem Waffenstillstandsabkommen."
israel.103.a:0	"Wir müssen einen Waffenstillstand aushandeln."
israel.103.b:0	"Wir müssen weiterkämpfen!"
israel.104.t:0	"[JOR.GetNameDefCap] Bietet Waffenstillstand"
israel.104.d:0	"Nachdem unsere Truppen den Jordan überquert haben, haben uns die jordanischen Streitkräfte einen Waffenstillstand angeboten, um die Kämpfe zu beenden. Wir müssen ihn annehmen, denn dadurch werden unsere Kräfte frei, um an anderen Fronten zu kämpfen."
israel.104.a:0	"Am Yisrael Hai!"
israel.105.t:0	"[ISR.GetAdjective] Streitkräfte überqueren den Jordan"
israel.105.d:0	"Durch unsere jüngsten Misserfolge im Krieg gegen [ISR.GetNameDef] haben uns ihre Truppen bis auf unser eigenes Territorium zurückgedrängt. Viele rufen nach einem Waffenstillstandsabkommen."
israel.105.a:0	"Wir müssen einen Waffenstillstand aushandeln."
israel.105.b:0	"Wir müssen weiterkämpfen!"
israel.106.t:0	"[SYR.GetNameDefCap] Bietet Waffenstillstand"
israel.106.d:0	"Nachdem unsere Truppen den Jordan überquert haben, haben uns die syrischen Streitkräfte einen Waffenstillstand angeboten, um die Kämpfe zu beenden. Wir müssen ihn annehmen, denn dadurch werden unsere Kräfte frei, um an anderen Fronten zu kämpfen."
israel.106.a:0	"Am Yisrael Hai!"
israel.107.t:0	"[ISR.GetAdjective] Streitkräfte überqueren die Grenze"
israel.107.d:0	"Durch unsere jüngsten Misserfolge im Krieg gegen [ISR.GetNameDef] haben uns ihre Truppen bis auf unser eigenes Territorium zurückgedrängt. Viele rufen nach einem Waffenstillstandsabkommen."
israel.107.a:0	"Wir müssen einen Waffenstillstand aushandeln."
israel.107.b:0	"Wir müssen weiterkämpfen!"
israel.108.t:0	"[LEB.GetNameDefCap] Bietet Waffenstillstand"
israel.108.d:0	"Nachdem unsere Truppen die Grenze überschritten haben, haben uns die libanesischen Streitkräfte einen Waffenstillstand angeboten, um die Kämpfe zu beenden. Wir müssen ihn annehmen, denn dadurch werden unsere Kräfte frei, um an anderen Fronten zu kämpfen."
israel.108.a:0	"Am Yisrael Hai!"
israel.109.t:0	"Streitkräfte in Palästina abgeschnitten"
israel.109.d:0	"Nach unseren jüngsten Misserfolgen im Krieg gegen [ISR.GetNameDef] haben sich die jordanische und die syrische Regierung aus dem Krieg zurückgezogen und unsere Einheiten von der Schlacht abgeschnitten."
israel.109.a:0	"Wir müssen einen Waffenstillstand aushandeln."
israel.109.b:0	"Nur ein vorübergehender Rückschlag!"
israel.110.t:0	"[IRQ.GetNameDefCap] Bietet Waffenstillstand"
israel.110.d:0	"Nachdem sich Jordanien und Syrien aus dem Krieg zurückgezogen haben, können die irakischen Streitkräfte nicht mehr auf unser Territorium vordringen und haben daher ein Waffenstillstandsabkommen angeboten."
israel.110.a:0	"Am Yisrael Hai!"
israel.111.t:0	"Palästinensische Streitkräfte scheitern"
israel.111.d:0	"Der Bürgerkrieg in der Region des Mandatsgebiets Palästina zieht sich schon seit einiger Zeit hin und die Palästinenser haben gezeigt, dass sie nicht in der Lage sind, mit den [ISR.GetAdjective]-Kräften fertig zu werden. Wir müssen bald intervenieren."
israel.111.a:0	"Bereiten Sie sich auf das Schlimmste vor."
israel.112.t:0	"Arabische Armeen marschieren ein"
israel.112.d:0	"Angesichts unseres Versagens, die [ISR.GetAdjective] Kräfte zu besiegen, haben die umliegenden arabischen Nationen eine Invasion in unser Gebiet gestartet. Beim Überschreiten der Grenze wurden sie mit Jubel begrüßt, aber zu unserer Überraschung begannen sie sofort mit der Entwaffnung unserer Truppen.\n\nDas ist keine Befreiung."
israel.112.a:0	"Wir haben es versucht."
israel.999.t:0	"Ad Halom"
israel.999.d:0	"Nach unserer Unabhängigkeitserklärung sind die Armeen der benachbarten arabischen Staaten in unser Gebiet eingedrungen. Das war zu erwarten, aber wir dürfen uns davon nicht entmutigen lassen.\n\n 2000 Jahre lang haben wir uns versteckt und an der Hoffnung festgehalten, dass wir eines Tages ein Land haben werden, das wir unser Zuhause nennen können.\n\nDieser Tag ist heute. Heute kämpfen wir für unsere Vorfahren, die vor 2000 Jahren gekämpft haben.\n\nHeute können wir nirgendwo mehr hinlaufen!\n\nEs gibt jetzt kein Zurück mehr!"
israel.999.a:0	"Nicht weiter!"
israel.1000.t:0	"Arabische Armeen dringen in Palästina ein"
israel.1000.d:0	"Nach der jüngsten [ISR.GetAdjective] Unabhängigkeitserklärung haben die umliegenden arabischen Staaten, die die arabischen Kämpfer in der Region unterstützt haben, offiziell beschlossen, in den Konflikt einzugreifen.\n\nDa es den arabischen Milizen in der Region nicht gelungen ist, die jüdischen Kräfte zu besiegen, wurden sie entweder entwaffnet oder in die Invasionsarmeen integriert. Die [ISR.GetAdjective]-Streitkräfte hingegen wurden unter einem einzigen Banner vereint, was ihre Kampfkraft erheblich gestärkt hat.\n\nDie Dominosteine warten auf ihren Einsatz."
israel.1000.a:0	"Ad Halom!"
israel.1000.b:0	"Unser Sieg ist gewiss!"
israel.1000.c:0	"David gegen Goliath."
ISR_histadrut_start:0	"Die Histadruts"
ISR_histadrut_start_desc:0	"Die Histadruts, die in der Mandatszeit vom zionistischen Arbeiter-Jischuw gegründet wurden, sind die wichtigsten Gewerkschaften in Israel. Sie sind im Vergleich zu den meisten internationalen Gewerkschaften außergewöhnlich stark, was uns gewisse Vor- und Nachteile verschafft."
ISR_disorganized_militias:0	"Aufteilung der Macht"
ISR_disorganized_militias_desc:0	"Unsere Kampftruppe besteht hauptsächlich aus der Haganah, der sozialistischen Miliz, die David Ben-Gurion und der Jischuw-Regierung untersteht. An den Kämpfen beteiligt ist jedoch auch die revisionistische Irgun, die von [ISR.GetNeutralLeader] angeführt wird, eine rechtsgerichtete Miliz, die zwar zahlenmäßig viel kleiner ist, aber nicht der Regierung Ben-Gurion untersteht, was unsere Kriegsanstrengungen behindert."
ISR_alei_barikadot:0	"Alei Barikadot!"
ISR_alei_barikadot_desc:0	"Es ist an der Zeit, unsere Nation zum Sieg zu führen! Wir werden uns auf den Barrikaden treffen!"
ISR_always_first:0	"Ben Gurions Plan"
ISR_always_first_desc:0	"Der Vormarsch des Feindes muss gestoppt werden! Nicht weiter!"
ISR_ad_halom:0	"§OAd Halom§!"
ISR_ad_halom_desc:0	"2000 Jahre lang haben wir im Exil gelebt, unter fremder Herrschaft, ohne eine Stimme.\nFür 2000 Jahre haben wir in der Hoffnung gelebt, dass wir eines Tages ein Land haben werden, das wir Heimat nennen können.\nDieser Tag ist heute. Wenn wir heute verlieren, können wir nirgendwohin fliehen!\n\nNicht weiter!"
r56_ISR_negev_modifier:0	"Unkartierte Wüste"
r56_ISR_negev_offensive:0	"Operation Yoav"
r56_ISR_jerusalem_strategy:0	"Jerusalem-Strategie"
r56_ISR_retake_jerusalem:0	"Jerusalem-Strategie"
r56_ISR_attack_west_bank:0	"Erobern Sie das Westjordanland"
ISR_aliyah:0	"Die sechste Aliyah"
ISR_aliyah_desc:0	"Nach unserer Unabhängigkeit strömen Hunderttausende von jüdischen Flüchtlingen aus der ganzen Welt nach Israel, um Asyl vor den Schrecken des Faschismus und Antisemitismus zu suchen."
ISR_president_weizmann:0	"Chaim Weizmann (Präsident von Israel)"
ISR_president_weizmann_desc:0	"Chaim Weizmann, der Delegierte des Jischuw beim Vertrag von Sevres, war die offensichtliche Wahl für das Amt des [ISR.GetAdjective] Präsidenten. Er führte die zionistische Bewegung durch ihre turbulentesten Zeiten und verdiente sich seinen Titel als Staatsoberhaupt."
ISR_veteran_zionist:0	"Zionistischer Veteran"
ISR_president_einstein:0	"Albert Einstein (Präsident von Israel)"
ISR_president_einstein_desc:0	"Albert Einstein widmete sein ganzes Leben dem Fortschritt der Wissenschaft und glaubte nie, dass er für die Politik bestimmt war. Nachdem er jedoch Deutschland verlassen hatte, um der antisemitischen Verfolgung zu entkommen, und in Israel ein neuer jüdischer Staat gegründet worden war, wurde Einstein eingeladen, Präsident der neuen Nation zu werden. Da er glaubte, dass dies ein guter Ort sei, um seine wissenschaftliche Plattform zu vertreten, nahm er das Angebot an und lehrt heute an der Hebräischen Universität von Jerusalem, die er mit gegründet hat."
ISR_scientific_genius:0	"Wissenschaftliches Genie"
ISR_revisionist_author:0	"Revisionistischer Autor"
ISR_president_ben_zvi:0	"Yitshak Ben-Zvi (Präsident von Israel)"
ISR_president_ben_zvi_desc:0	"Isaac Shimshelevich, ein Freund von David Ben-Gurion seit den Tagen der Zweiten Alijah, entkam 1907 den russischen Behörden und floh aus Verzweiflung nach Palästina, wo er den hebräischen Namen Yitshak Ben-Zvi annahm. Ben-Zvi trug dazu bei, die zersplitterte Poali Zion-Partei wieder zu dem gewaltigen Kraftpaket zu machen, das heute Hashomer Hatsair heißt, nachdem er von Yisrael Shochat rekrutiert worden war, um ein Gegengewicht zu Ben-Gurions Einfluss im Yishuv zu schaffen. Trotzdem wurden Ben-Zvi und Ben-Gurion gute Freunde. Nachdem sie während des Ersten Weltkriegs von den osmanischen Behörden nach Ägypten verbannt worden waren, kehrten sie nach Palästina zurück, um den Kampf für einen unabhängigen jüdischen Staat fortzusetzen - ein Traum, der nun Wirklichkeit geworden ist."
ISR_president_klausner:0	"Joseph Klausner (Präsident von Israel)"
ISR_president_klausner_desc:0	"Joseph Gedaliah Klausner, ein angesehener Historiker und Professor für hebräische Literatur, wurde 1874 in Litauen geboren. Als überzeugter Zionist mit persönlichen Beziehungen zu Herzl nahm er 1897 am ersten zionistischen Kongress teil und ließ sich 1919 in Palästina nieder. Er studierte hebräische Literatur und freundete sich mit vielen politischen Aktivisten wie Ze'ev Jabotinsky und Menachem Ussishkin an, was ihm schließlich Jabotinskys Nominierung zum Präsidenten einbrachte."
ISR_labour_zionist:0	"Arbeiter-Zionist"
ISR_inexperienced_politician:0	"Unerfahrener Politiker"
ISR_the_great_father:0	"Der große Vater Israels"
ISR_figure_of_the_jewish_people:0	"Wahrer Nachfolger von Herzl"
ISR_nathan_yellin_mor_trait:0	"Nathan Yellin-Mor"
ISR_yisrael_elidad_trait:0	"Yisrael Elidad"
ISR_yisrael_elidad_trait_communism:0	"Yisrael Elidad"
ISR_yitshak_shamir_trait:0	"Yitshak Shamir"
ISR_special_night_squads_idea:0	"Spezielle Nachttrupps"
ISR_special_forces_idea:0	"Investieren Sie in Spezialeinheiten"
ISR_jewish_emigration:0	"Jüdische Auswanderung"
ISR_zionist_consensus:0	"Es ist kein Traum"
ISR_zionist_consensus_desc:0	"Nach 2000 Jahren hat das jüdische Volk endlich seinen eigenen Staat. Aber das ist nicht ohne einen Preis zu haben. Wir haben viele Feinde um uns herum, und wir müssen sicherstellen, dass wir in der Lage sind, unser Zion zu verteidigen."
ISR_defense_of_zion:0	"Am Yisrael Hai"
ISR_defense_of_zion_desc:0	"Nach 2000 Jahren Exil, Unterdrückung, Pogromen und Völkermorden hat das jüdische Volk endlich einen Ort, den es Heimat nennen kann. Die Reise war nicht einfach, und die Zukunft wird es auch nicht sein. Aber heute können wir sicher sein, dass das Volk Jisrael weiterlebt."
ISR_diaspora_volunteers:0	"Blasen Sie das Schofar"
ISR_diaspora_volunteers_desc:0	"Juden aus aller Welt strömen herbei, um ihr Heimatland zu verteidigen."
r56_ISR_minority_government:0	"Minderheitsregierung"
r56_ISR_minority_government_desc:0	"Aufgrund der gespaltenen politischen Landschaft unseres Landes können wir die meisten Gesetze, die wir wollen, nicht allein durchsetzen. Wir müssen uns entscheiden, mit welcher Partei wir Kompromisse eingehen, um unsere Ziele zu erreichen."
ISR_no_constitution:0	"Das Fehlen einer Verfassung"
ISR_no_constitution_desc:0	"Mit der Gründung unseres neuen Staates fehlt unserer Nation eine Verfassung. Dies kann zu großen Problemen führen, wenn es uns nicht gelingt, eine solche zu entwerfen."
ISR_basic_laws:0	"Die Grundgesetze Israels"
ISR_basic_laws_desc:0	"Unsere Mission, eine Verfassung zu schreiben, ist völlig gescheitert. Uns bleibt nur eine unklare Gruppe von Grundgesetzen, die die Institutionen unseres Staates definieren, die aber nur allzu leicht zu ändern sind. Das wird in Zukunft wahrscheinlich zu Problemen führen."
ISR_austerity:0	"Strenge Sparmaßnahmen"
ISR_austerity_desc:0	"Premierminister Ben-Gurion hat strenge Sparmaßnahmen in Kraft gesetzt, um sicherzustellen, dass unsere neue Nation nicht völlig zusammenbricht. Dazu gehören Lebensmittelrationierungen, hohe Steuern und mehr. Diese Maßnahmen sind sehr unpopulär, aber einige sehen den Grund für ihre Umsetzung. Wie lange diese Maßnahmen andauern sollen, ist ein heiß diskutiertes Thema."
r56_ISR_israeli_constitution:0	"Die [ISR.GetAdjective] Verfassung"
r56_ISR_israeli_constitution_desc:0	"Wir haben es geschafft, eine Verfassung für unseren neuen Staat zu schreiben. Es gibt jedoch viele Menschen, die mit dem Endergebnis nicht einverstanden sind. Wir müssen dafür sorgen, dass dies in Zukunft nicht zu Problemen führt."
ISR_economic_plan:0	"Meir Ya'ari's Industrieplan"
ISR_economic_plan_desc:0	"Finanzminister Meir Ya'ari hat einen großartigen Wirtschaftsplan für ein größeres sozialistisches Israel vorgelegt. Wir müssen diesen Plan befolgen, um unsere Wirtschaft wachsen zu lassen."
ISR_kibbutzim:0	"Investieren Sie in Kibbuzim"
ISR_kibbutzim_desc:0	"Die landwirtschaftlichen Kibbuzim sind die Basis unseres Wirtschaftsplans. Wir müssen sie unterstützen, um unsere Abhängigkeit von ausländischen Lebensmittelimporten zu verringern."
ISR_histadrut_strong:0	"Gestärkte Histadruts"
ISR_histadrut_strong_desc:0	"Die Arbeitergewerkschaften des Landes, die Histadruts, müssen gestärkt werden, damit die Rechte der Arbeiter geschützt werden."
ISR_nationalized_institutions:0	"Verstaatlichte Institutionen"
ISR_nationalized_institutions_desc:0	"Die Verstaatlichung von Institutionen wie dem Bildungs- und Gesundheitswesen kann uns helfen, sicherzustellen, dass keine Gelder missbraucht werden und jeder eine faire Behandlung erfährt."
ISR_bituah_leumi:0	"Bituah Leumi"
ISR_bituah_leumi_desc:0	"Wir müssen dafür sorgen, dass wir uns um diejenigen kümmern, die nicht für sich selbst sorgen können. Wir werden eine neue Behörde einrichten, die behinderten oder älteren Menschen hilft."
ISR_welfare:0	"Sozialhilfe für Einwanderer ausbauen"
ISR_welfare_desc:0	"Durch die Aliyah-Krise in unserem Land kommen die Einwanderer in ärmlichen Verhältnissen an. Das müssen wir schnell ändern, indem wir die Sozialhilfe für Neuankömmlinge ausweiten."
ISR_white_collar_boom:0	"Boom bei den Angestellten"
ISR_white_collar_boom_desc:0	"Unser Land ist klein und es mangelt ihm an Ressourcen. Wir müssen in Unternehmen für Angestellte investieren, um technologisch immer einen Schritt voraus zu sein, wenn wir es militärisch nicht sind."
ISR_arab_voting:0	"Arabisches Wahlrecht"
ISR_arab_voting_desc:0	"Die Gewährung des arabischen Wahlrechts ist ein erster Schritt in Richtung Koexistenz."
ISR_histadrut_weak:0	"Geschwächte Histadruten"
ISR_histadrut_weak_desc:0	"Die Schwächung des Histadruts ermöglicht es uns, die Löhne der Arbeiter zu senken, so dass wir mehr Kapital für andere Projekte ausgeben können."
ISR_secularized_education:0	"Säkularisierte Bildung"
ISR_secularized_education_desc:0	"Um unsere Nation zu schützen, müssen wir unsere neue Generation mit säkularen und wissenschaftlichen Werten erziehen."
ISR_religious_parties_idea_1:0	"Zusammenarbeit der religiösen Parteien"
ISR_religious_parties_idea_1_desc:0	"Obwohl wir nicht die gleichen Werte teilen, müssen wir aufgrund ihrer großen Macht mit den religiösen Parteien zusammenarbeiten."
ISR_suez_pressure_1:0	"Geringer diplomatischer Druck"
ISR_suez_pressure_1_desc:0	"Aufgrund der Schließung des Suezkanals haben wir leichten diplomatischen Druck von großen Nationen erhalten, um auf Verhandlungen für seine Wiedereröffnung hinzuwirken."
ISR_suez_pressure_2:0	"Geringfügiger diplomatischer Druck"
ISR_suez_pressure_2_desc:0	"Aufgrund der Schließung des Suezkanals haben wir geringfügigen diplomatischen Druck von großen Nationen erhalten, um auf Verhandlungen für seine Wiedereröffnung hinzuwirken."
ISR_suez_pressure_3:0	"Mäßiger diplomatischer Druck"
ISR_suez_pressure_3_desc:0	"Aufgrund der Schließung des Suezkanals haben wir mäßigen diplomatischen Druck von wichtigen Nationen erhalten, um auf Verhandlungen für seine Wiedereröffnung hinzuwirken."
ISR_suez_pressure_4:0	"Großer diplomatischer Druck"
ISR_suez_pressure_4_desc:0	"Aufgrund der Schließung des Suezkanals haben wir großen diplomatischen Druck von wichtigen Nationen erhalten, um auf Verhandlungen für seine Wiedereröffnung hinzuwirken."
ISR_suez_pressure_5:0	"Starker diplomatischer Druck"
ISR_suez_pressure_5_desc:0	"Aufgrund der Schließung des Suezkanals haben wir starken diplomatischen Druck von wichtigen Nationen erhalten, um auf Verhandlungen für seine Wiedereröffnung hinzuwirken."
r56_ISR_palestinian_resistance:0	"Hoher palästinensischer Widerstand"
r56_ISR_palestinian_resistance_low:0	"Geringer palästinensischer Widerstand"
r56_ISR_palestinian_resistance_lower:0	"Arabische Militärausnahmen"
ISR_1936:0	"Haganah-Miliz"
ISR_revolution:0	"Wenn Sie es wollen..."
ISR_revolution_desc:0	"Ein Kampf um unser Heimatland hat begonnen. Wir müssen diese Herausforderung meistern, zum Ruhme Zions.\n\nWenn Sie es wollen, ist es kein Traum!"
ISR_call_diaspora_volunteers:0	"Blasen Sie das Schofar"
ISR_call_diaspora_volunteers_desc:0	"Überall auf der Welt gibt es unzählige jüdische Menschen, die ihrem Volk zu Hilfe kommen werden. Wir müssen einen förmlichen Aufruf zur Hilfe aussenden."
ISR_consolidate_haganah:0	"Konsolidieren Sie die Haganah"
ISR_consolidate_haganah_desc:0	"David Ben-Gurion und die Haganah sind unsere beste Chance, die Nation zu verteidigen. Wir müssen sicherstellen, dass die Irgun unsere Bemühungen nicht unterlaufen kann."
ISR_dealing_with_irgun:0	"Handeln Sie mit der Irgun"
ISR_dealing_with_irgun_desc:0	"Wenn wir sicherstellen wollen, dass die Irgun während des Krieges nicht zu viel Macht erlangt, müssen wir damit beginnen, die Irgun einzuschränken."
ISR_subvert_irgun_influence:0	"Untergraben Sie den Einfluss der Irgun"
ISR_subvert_irgun_influence_desc:0	"Wir müssen den Einfluss der Irgun in unserem Land untergraben. Sie sind eine direkte Bedrohung für unser Volk."
ISR_form_the_idf:0	"Bilden Sie die Israelischen Verteidigungsstreitkräfte"
ISR_form_the_idf_desc:0	"Um den Einfluss der Irgun zu untergraben, müssen wir die vielen Flügel der Haganah zu den vereinigten Israelischen Verteidigungsstreitkräften zusammenschließen."
ISR_purge_irgun:0	"Säubern Sie die Irgun"
ISR_purge_irgun_desc:0	"Nach all unseren Vorbereitungen ist es nun an der Zeit, den Irgun ein für alle Mal zu beseitigen."
ISR_ben_gurion_strategy:0	"Ben-Gurion's Strategie"
ISR_ben_gurion_strategy_desc:0	"Premierminister Ben-Gurion hat eine Strategie für einen südlichen Vorstoß in den Negev ausgearbeitet, um die arabischen Streitkräfte in zwei Hälften zu teilen. Wir müssen seinem Plan folgen."
ISR_southern_plan:0	"Der Negev-Plan"
ISR_southern_plan_desc:0	"Wenn wir unseren Plan zur Befreiung des Negev erfolgreich umsetzen wollen, müssen wir zunächst die Fähigkeiten unserer Armee ausbauen"
ISR_operation_yoav:0	"Starten Sie die Operation Yoav"
ISR_operation_yoav_desc:0	"Die Zeit ist gekommen. Wir werden mit aller Macht nach Süden vorstoßen und die arabischen Streitkräfte in zwei Hälften teilen!"
ISR_czech_weaponry:0	"Tschechoslowakische Waffenkäufe"
ISR_czech_weaponry_desc:0	"[CZE.GetNameDefCap] hat reichlich Waffenvorräte, die wir für unseren Kampf erwerben können."
ISR_gather_irgun:0	"Versammeln Sie die Irgun"
ISR_gather_irgun_desc:0	"David Ben-Gurion und der Haganah kann man die Zukunft unseres Landes nicht anvertrauen. Nur Ze'ev Jabotinsky ist geeignet, uns zu führen, für ein größeres Judäa!"
ISR_subvert_haganah:0	"Unterwandern Sie die Haganah"
ISR_subvert_haganah_desc:0	"Die Haganah ist größer als wir, aber sie ist mit dem Krieg beschäftigt. Das können wir zu unserem Vorteil nutzen."
ISR_steal_haganah_weapons:0	"Abzapfen der Haganah-Waffen"
ISR_steal_haganah_weapons_desc:0	"Wir sollten uns ihre Beschäftigung zunutze machen und heimlich Waffen der Haganah abzweigen, um unsere eigenen Soldaten zu bewaffnen."
ISR_spread_revisionist_media:0	"Verbreiten Sie revisionistische Medien"
ISR_spread_revisionist_media_desc:0	"Wir müssen unsere Sache im ganzen Land bekannt machen, damit sich die Menschen unserer rechtschaffenen Sache anschließen."
ISR_assume_the_national_cause:0	"Übernehmen Sie die nationale Sache"
ISR_assume_the_national_cause_desc:0	"Dieser Krieg ist ein kritischer Punkt in der Geschichte unseres Volkes. Wir können nicht zulassen, dass unsere Aktionen von dem schwachen Führer Ben-Gurion und seiner Haganah kontrolliert werden. Es ist an der Zeit, die Führung zu übernehmen."
ISR_begin_approach:0	"Der Ansatz von Menachem Begin"
ISR_begin_approach_desc:0	"Der Irgun-Führer Menachem Begin hat einen neuen Plan vorgeschlagen, in dessen Mittelpunkt die Einnahme Jerusalems und die Konzentration unserer Bemühungen auf das Westjordanland stehen. Dies ist der klare Weg zum Sieg."
ISR_jerusalem_strategy:0	"Die Jerusalem-Strategie"
ISR_jerusalem_strategy_desc:0	"Wenn wir Begins Plan folgen wollen, müssen wir sicherstellen, dass wir die Kontrolle über Jerusalem erlangen und in der Lage sind, es zu verteidigen."
ISR_the_west_bank:0	"Räumen Sie den Jerusalemer Korridor"
ISR_the_west_bank_desc:0	"Unsere Heilige Stadt Jerusalem wird belagert. Wir müssen durchbrechen und den Nachschubweg in die Stadt öffnen."
ISR_legacy_of_the_conference:0	"Das Vermächtnis der Jerusalemer Konferenz"
ISR_legacy_of_the_conference_desc:0	"Mit dem friedlichen Ende des Mandats befinden wir uns in einer vorteilhaften Situation. Wir haben nicht das gesamte Gebiet erhalten, nach dem wir uns sehnen, aber wir werden uns damit abfinden. Es ist Zeit, vorwärts zu gehen."
ISR_win:0	"...Es ist kein Traum"
ISR_win_desc:0	"Sieg! Wir haben uns das heilige Land gesichert, das unseren Vorfahren vor so langer Zeit versprochen wurde. Es ist an der Zeit, unsere neue Nation aufzubauen."
ISR_convene_knesset:0	"Einberufung der Knesset"
ISR_convene_knesset_desc:0	"Nach der Unabhängigkeit unseres neuen Staates müssen wir die Knesset einberufen, um unsere ersten Wahlen abzuhalten."
ISR_hashomer:0	"Verstärken Sie die Junge Garde"
ISR_hashomer_desc:0	"Ben-Gurion hat den richtigen Ansatz, aber er übersieht das größere Bild. Wir müssen auf eine hellere, sozialistische Zukunft hinarbeiten!"
ISR_cooperate_maki:0	"Kooperieren Sie mit Maki"
ISR_cooperate_maki_desc:0	"Wir können unsere prosowjetische Haltung nicht aufgeben. Wir müssen mit Maki und der PCP zusammenarbeiten, um unseren sozialistischen Traum von Zion zu verwirklichen."
ISR_lessen_soviet_stance:0	"Verringern Sie unsere sowjetische Haltung"
ISR_lessen_soviet_stance_desc:0	"Um mehr Unterstützung zu erhalten, müssen wir unsere pro-sowjetische Haltung abschwächen. Wir könnten die Unterstützung der Hardliner verlieren, aber wir werden die Unterstützung der anderen gewinnen."
ISR_promise_arabs:0	"Versprechen Sie arabische Rechte"
ISR_promise_arabs_desc:0	"Wir können die Bedürfnisse der arabischen Bevölkerung nicht ignorieren. Es ist unsere Pflicht, dafür zu sorgen, dass für sie gesorgt wird."
ISR_expand_rural_influence:0	"Ländlichen Einfluss ausbauen"
ISR_expand_rural_influence_desc:0	"Wir müssen unsere größte Wählerbasis in den Kibbuzgemeinden unterstützen. Sie sind das Lebenselixier, das unser Land am Laufen hält."
ISR_brighter_future:0	"Auf dem Weg in eine bessere Zukunft"
ISR_brighter_future_desc:0	"Die Zeit ist gekommen. Wir müssen auf unsere Junge Garde vertrauen, um eine bessere Zukunft für unser Volk zu sichern."
ISR_mapai:0	"Scharen Sie sich um Ben-Gurion"
ISR_mapai_desc:0	"David Ben-Gurion ist der wahre Führer unserer neuen Nation. Keiner hat so viel geopfert wie er. Er wird uns zu einer stabilen Nation führen!"
ISR_demand_secular_education:0	"Säkularisierung vorantreiben"
ISR_demand_secular_education_desc:0	"Wir müssen dafür sorgen, dass die nächste Generation unserer großen Nation eine säkulare und gut ausgebildete ist. Wir dürfen nicht zulassen, dass sich der religiöse Einfluss zu weit ausbreitet."
ISR_appease_religious:0	"Beschwichtigen Sie die religiösen Parteien"
ISR_appease_religious_desc:0	"Die Linke in Hashomer ist zu radikal. Wenn wir eine funktionierende Koalition bilden wollen, müssen wir die religiösen Parteien besänftigen."
ISR_promote_urban:0	"Fördern Sie die städtische Arbeiterklasse"
ISR_promote_urban_desc:0	"Die städtischen Arbeiter sind das Lebenselixier der Nation. Wir müssen ihre Rechte schützen, um ihre Unterstützung zu sichern."
ISR_form_DLN:0	"Bilden Sie die DLN"
ISR_form_DLN_desc:0	"Wir sollten die Bildung einer mit unserer Regierung befreundeten arabischen Partei unterstützen, damit wir ihre Unterstützung gewinnen können."
ISR_steady:0	"Unbeirrt weitergehen"
ISR_steady_desc:0	"Mapai und Ben-Gurion haben uns so weit geführt. Sie werden uns zu einer stabilen Gesellschaft führen!"
ISR_centre:0	"Vereinigen Sie den Block der Mitte"
ISR_centre_desc:0	"Mit einer Koalition zwischen der Neuen Alijah und der Allgemeinen Zionistischen Partei werden wir in der Lage sein, die liberalen Elemente unserer Gesellschaft zu stärken und ein modernes und technologisch fortschrittliches Israel zu schaffen, so wie Herzl es sich vorgestellt hat."
ISR_campaign_women:0	"Die Rechte der Frauen stärken"
ISR_campaign_women_desc:0	"Die Rechte der Frauen sind ein ernstes Thema in unserer Gesellschaft, und wir können nicht zulassen, dass sie hinter den Rest zurückfallen. Gemeinsam sind wir stärker."
ISR_lean_mapai:0	"Lehnen Sie sich an Mapai an"
ISR_lean_mapai_desc:0	"Es ist kein Geheimnis, dass wir nicht alleine eine Regierung bilden können. Indem wir uns an Mapai anlehnen, sorgen wir für eine freie und gerechte Gesellschaft, in der wir alle erfolgreich sein können."
ISR_lean_hatzohar:0	"Lehnen Sie sich an Hatzohar an"
ISR_lean_hatzohar_desc:0	"Es ist kein Geheimnis, dass wir eine Regierung nicht allein bilden können. Indem wir uns an Hatzohar anlehnen, können wir die Bürokratie der Histadruts abschaffen."
ISR_appeal_middle_class:0	"Appellieren Sie an die Mittelschicht"
ISR_appeal_middle_class_desc:0	"Unsere wichtigste Wählerbasis ist die städtische Mittelschicht. Wir müssen sie weiterhin unterstützen, wenn wir erfolgreich sein wollen."
ISR_herzl_followers:0	"In den Fußstapfen von Herzl"
ISR_herzl_followers_desc:0	"Wir sind die Nachfolger des großen politischen Zionismus von Herzl. Zum Wohle unserer Nation dürfen wir nicht von seinem Erbe abweichen."
ISR_hatzohar:0	"Stärken Sie die Revisionisten"
ISR_hatzohar_desc:0	"Ben-Gurion war zu nachsichtig mit der britischen Besatzung. Wer sagt denn, dass er uns nicht wieder verraten wird? Wir müssen uns um [ISR.GetNeutralLeader] scharen, wenn wir unseren Ruhm wiederherstellen wollen."
ISR_affirm_territorial_claims:0	"Territoriale Ansprüche bekräftigen"
ISR_affirm_territorial_claims_desc:0	"Das wahre Land Zion liegt auf beiden Seiten des Jordans. Das dürfen wir nicht vergessen."
ISR_abandon_jordan:0	"Transjordanien aufgeben"
ISR_abandon_jordan_desc:0	"Wenn wir gemäßigte Wähler ansprechen wollen, müssen wir die Idee von Groß-Israel aufgeben. Vielleicht haben wir in der Zukunft eine weitere Chance."
ISR_support_irgun_fighters:0	"Unterstützen Sie ehemalige Irgun-Kämpfer"
ISR_support_irgun_fighters_desc:0	"Auch wenn es die Irgun nicht mehr gibt, müssen wir den ehemaligen Irgun-Kämpfern für ihre Loyalität Unterstützung zusagen."
ISR_cooperate_religious:0	"Arbeiten Sie mit den religiösen Parteien zusammen"
ISR_cooperate_religious_desc:0	"Die religiösen Parteien sind unsere größten Verbündeten. Wir müssen ihnen Legitimität verschaffen."
ISR_betar_revived:0	"Der Geist von Betar"
ISR_betar_revived_desc:0	"Wir müssen unser Erbe des Widerstands ehren. Jodefet, Masada, Betar."
ISR_the_elections:0	"Halten Sie die Wahlen ab"
ISR_the_elections_desc:0	"Die Zeit ist gekommen."
ISR_elect_president:0	"Die Wahl eines Präsidenten"
ISR_elect_president_desc:0	"Unser Land braucht eine führende Persönlichkeit, die uns auf der internationalen Bühne vertritt. Wir sollten einen zeremoniellen Präsidenten wählen, der als Staatsoberhaupt fungiert."
ISR_draft_constitution:0	"Ausarbeitung einer Verfassung"
ISR_draft_constitution_desc:0	"Unsere junge Republik hat noch immer keine Verfassung, und das ist eine Gefahr für unsere Demokratie. Wir müssen die Ausarbeitung einer Verfassung vorantreiben, auch wenn es eine Herausforderung sein wird."
ISR_hashomer_leads:0	"Hashomer führt"
ISR_hashomer_leads_desc:0	"Sieg! Unsere großen Ideale für ein sozialistisches Gemeinwesen für das jüdische Volk sind zum Greifen nahe. Aber wir dürfen nicht vergessen, dass wir nicht allein sind, und wir müssen uns auch um die Bedürfnisse aller anderen kümmern."
ISR_strengthen_union:0	"Stärken Sie die Histadruts"
ISR_strengthen_union_desc:0	"Die Arbeitergewerkschaften des Landes, die Histadruts, müssen gestärkt werden, damit die Rechte der Arbeiter geschützt werden."
ISR_soviet_support:0	"Sowjetische Unterstützung sichern"
ISR_soviet_support_desc:0	"[SOV.GetNameDefCap] ist der offensichtliche Verfechter des Zionismus weltweit. Wir müssen ihnen die Hand zur Unterstützung reichen."
ISR_limited_austerity:0	"Sparmaßnahmen begrenzen"
ISR_limited_austerity_desc:0	"Wir können es uns nicht leisten, die derzeitigen Sparmaßnahmen vollständig zu erhöhen, aber wir müssen unsere Wirtschaft etwas öffnen, um das Wenige, das wir haben, zu exportieren."
ISR_limited_return:0	"Begrenztes Recht auf Rückkehr für Araber"
ISR_limited_return_desc:0	"Viele Araber des Landes wurden während des Krieges vertrieben. Wenn wir uns selbst legitimieren wollen, müssen wir sie langsam wieder ins Land lassen."
ISR_strengthen_maki:0	"Ermächtigen Sie Maki"
ISR_strengthen_maki_desc:0	"Makis Traum von einer binationalen Kommune ist die Zukunft dieser Nation. Wir müssen sie ermutigen und auf sie hinarbeiten."
ISR_expand_industrial_hubs:0	"Industrielle Zentren in den Städten ausbauen"
ISR_expand_industrial_hubs_desc:0	"Durch den Ausbau industrieller Zentren in städtischen Gebieten wie Haifa können wir die weitere Urbanisierung der Nation fördern."
ISR_soviet_cooperation:0	"Sowjetische Militärkooperation"
ISR_soviet_cooperation_desc:0	"Es ist im besten Interesse unserer beiden Nationen, militärisch miteinander zu kooperieren, da die Feinde der Revolution immer stärker werden."
ISR_centralization:0	"Politische Zentralisierung fortsetzen"
ISR_centralization_desc:0	"Unser Land ist schon seit langem dezentralisiert. Wenn wir unseren Einfluss ausweiten wollen, müssen wir viele Institutionen zentralisieren."
ISR_merge_unions:0	"Gewerkschaften zusammenführen"
ISR_merge_unions_desc:0	"Wir müssen darauf hinarbeiten, die arabischen und jüdischen Gewerkschaften zusammenzuführen, um die Zusammenarbeit in der Bevölkerung zu fördern."
ISR_arab_recruitment:0	"Rekrutierung der arabischen Armee"
ISR_arab_recruitment_desc:0	"Wenn wir eine einheitliche Gesellschaft erreichen wollen, müssen wir arabische Soldaten in unserem Militär zulassen."
ISR_levantine_commune:0	"Eine levantinische Kommune"
ISR_levantine_commune_desc:0	"Wir müssen die Grenzen des ethnischen Konflikts überwinden und unsere Arbeiterklassen ein für alle Mal in einer neuen Gewerkschaft vereinen. Nur so können wir Frieden schaffen."
ISR_toe_line:0	"Auf den Strich gehen"
ISR_toe_line_desc:0	"Die Maki-Extremisten sind zu radikal und werden die Nation nur destabilisieren. Wir müssen einen Mittelweg finden, um einen Zusammenbruch zu verhindern."
ISR_fix_bureaucracy:0	"Kümmern Sie sich um die Histardrut-Bürokratie"
ISR_fix_bureaucracy_desc:0	"Die Histadrut sind derzeit sehr bürokratisch, was bei vielen Menschen auf Ablehnung stößt. Wir müssen dieses Problem angehen, wenn wir ihnen weiterhin die Leitung der Wirtschaft überlassen wollen."
ISR_galilee_development:0	"Galiläa entwickeln"
ISR_galilee_development_desc:0	"Wir müssen die Region Galiläa in unserem Land entwickeln, wenn wir die Unterstützung der Landbevölkerung dort behalten wollen."
ISR_reconciliation:0	"Versöhnung mit den Arabern"
ISR_reconciliation_desc:0	"Wir können nicht ewig Feinde sein. Es ist an der Zeit, sich zu versöhnen und eine Lösung für die Zukunft zu finden."
ISR_work_with_arab:0	"Zusammenarbeit mit arabischen Führern"
ISR_work_with_arab_desc:0	"Wir müssen auf gleichgesinnte arabische Führer zugehen, um eine gegenseitige Einigung zu erreichen."
ISR_recognize_beduin:0	"Erkennen Sie die Beduinen-Siedlungen an"
ISR_recognize_beduin_desc:0	"Wenn wir die Unterstützung der Beduinen im Süden gewinnen wollen, müssen wir ihre Siedlungen anerkennen und ihnen helfen, sich niederzulassen."
ISR_two_state_solution:0	"Zwei-Staaten-Lösung"
ISR_two_state_solution_desc:0	"Jeder, der glaubt, dass wir die Kontrolle über die Gebiete der arabischen Mehrheit behalten können, ist ein Narr. Wir müssen ihnen die Unabhängigkeit gewähren, zum Wohle unserer beiden Völker."
ISR_shearim:0	"She'arim Po Niftach"
ISR_shearim_desc:0	"Unser Traum von einem großen sozialistischen Gemeinwesen hat sich erfüllt. Zum Wohle der Juden und der Araber.\n\nDie Tore sind geöffnet."
ISR_invest_in_kibbutzim:0	"Investieren Sie in Kibbuzim"
ISR_invest_in_kibbutzim_desc:0	"Die landwirtschaftlichen Kibbuzim sind die Basis für unseren Wirtschaftsplan. Wir müssen sie unterstützen, um unsere Abhängigkeit von ausländischen Lebensmittelimporten zu verringern."
ISR_mapai_hashomer:0	"Alte Gräben überwinden"
ISR_mapai_hashomer_desc:0	"Obwohl Mapai und Hashomer viele Meinungsverschiedenheiten hatten, müssen wir unsere Streitigkeiten beiseite legen und uns auf das große Ganze konzentrieren."
ISR_setup_public_transit:0	"Öffentlichen Nahverkehr ausbauen"
ISR_setup_public_transit_desc:0	"Durch den Ausbau unseres öffentlichen Nahverkehrsnetzes können wir sicherstellen, dass alle unsere Bürger die Orte erreichen können, an denen sie sein wollen, und dass sie ihre Arbeit effizienter verrichten können."
ISR_mapai_cemented:0	"Mapai-Dominanz zementiert"
ISR_mapai_cemented_desc:0	"Der offensichtliche Gewinner der Wahlen war Mapai. Sie hat uns 30 Jahre lang geführt, sie wird uns auch die nächsten 30 Jahre führen!"
ISR_begin_nationalization:0	"Beginnen Sie mit der Verstaatlichung der Industrie"
ISR_begin_nationalization_desc:0	"Wir müssen die Industrie unseres Landes verstaatlichen, um sicherzustellen, dass das Geld an die richtigen Stellen fließt und nicht missbraucht wird."
ISR_education_reforms:0	"Gesetz über die Schulpflicht"
ISR_education_reforms_desc:0	"Wir müssen dafür sorgen, dass jedes Kind in unserem Land eine Grundausbildung erhält, damit unsere nächste Generation intelligenter und besser ist als die jetzige."
ISR_cement_histadrut_powers:0	"Zementierung der Befugnisse der Histadrut"
ISR_cement_histadrut_powers_desc:0	"Den Histadruts zu viel Macht zu geben, wäre eine Katastrophe, aber wir dürfen ihre wichtige Rolle in der Gesellschaft nicht unterschätzen. Wir müssen ihnen mehr Unterstützung zukommen lassen."
ISR_establish_bituah_leumi:0	"Bituah Leumi gründen"
ISR_establish_bituah_leumi_desc:0	"Wir müssen dafür sorgen, dass wir uns um diejenigen kümmern, die nicht für sich selbst sorgen können. Wir werden eine neue Behörde einrichten, die behinderten oder älteren Menschen hilft."
ISR_lessen_austerity:0	"Sparmaßnahmen abmildern"
ISR_lessen_austerity_desc:0	"Die derzeitigen Sparmaßnahmen haben lange genug gedauert. Es ist an der Zeit, unsere Wirtschaft wieder zu öffnen."
ISR_palestinian_compromises:0	"Kompromiss mit den Palästinensern"
ISR_palestinian_compromises_desc:0	"Wir dürfen die Bedürfnisse der Araber in unserer Bevölkerung nicht vergessen. Wir müssen eine Einigung mit ihnen erzielen."
ISR_operation_magic_carpet:0	"Operation Zauberteppich"
ISR_operation_magic_carpet_desc:0	"Unsere Leute im Jemen werden verfolgt. Wir müssen sie nach Hause holen, mit allen notwendigen Mitteln."
ISR_the_ageing_father:0	"Der alternde Vater"
ISR_the_ageing_father_desc:0	"Premierminister Ben-Gurion hat mehrfach seinen Willen bekundet, sich aus der Politik zurückzuziehen und einen Kibbuz im Negev zu gründen. Viele sind der Meinung, dass er sich eine wohlverdiente Ruhepause verdient hat, aber andere glauben, dass wir seine Führung in diesen Zeiten brauchen.\n\nWas sollte getan werden?"
ISR_ben_gurion_stays:0	"Ben-Gurion bleibt"
ISR_ben_gurion_stays_desc:0	"Wir brauchen Ben-Gurions Führung in diesen Zeiten. Er muss bleiben."
ISR_develop_negev:0	"Entwickeln Sie den Negev"
ISR_develop_negev_desc:0	"Wir müssen die Negev-Wüste erschließen, denn sie bietet dringend benötigten Platz für neue Einwanderer."
ISR_fund_urban_areas:0	"Immigrantenlager finanzieren"
ISR_fund_urban_areas_desc:0	"Wenn die städtischen Gebiete der Nation genügend Wohnraum für die Einwanderungswellen bauen sollen, müssen wir die Finanzierung dafür sicherstellen."
ISR_herzl_successor:0	"Der große Nachfolger von Herzl"
ISR_herzl_successor_desc:0	"Premierminister Ben-Gurion hat bewiesen, dass er Herzls großer Nachfolger ist. Das müssen wir anerkennen."
ISR_operation_ezra_nehamiah:0	"Operation Ezra & Nehamia"
ISR_operation_ezra_nehamiah_desc:0	"Wieder einmal müssen wir unser Volk aus Angst vor Unterdrückung aus einem anderen Land ausfliegen. Diesmal ist es der Irak."
ISR_sharett_takes_over:0	"Sharett übernimmt die Macht"
ISR_sharett_takes_over_desc:0	"Ben-Gurion muss zur Ruhe kommen. Außenminister Moshe Sharett wird seinen Platz einnehmen."
ISR_sharett_reforms:0	"Sharett's Wirtschaftsreformen"
ISR_sharett_reforms_desc:0	"Wir müssen unsere Wirtschaft ein wenig liberalisieren. Die Histadruts sind zu bürokratisch."
ISR_further_palestinian_negotiations:0	"Weitere palästinensische Verhandlungen"
ISR_further_palestinian_negotiations_desc:0	"Es ist möglich, dass wir aufhören zu kämpfen. Wir müssen unsere Verhandlungen mit den Palästinensern fortsetzen."
ISR_sharett_diplomacy:0	"Auslandsdiplomatie"
ISR_sharett_diplomacy_desc:0	"Wir müssen unsere Diplomatie auf den Rest der Welt ausweiten, um wirtschaftliche Investitionen zu sichern."
ISR_moses_hess_legacy:0	"Rom und Jerusalem"
ISR_moses_hess_legacy_desc:0	"Moses Hess, der große Visionär des Arbeiterzionismus, ist schon lange tot. Aber seine Ideale bleiben lebendig und haben unsere glorreiche Nation geschaffen. Das dürfen wir nicht vergessen.\n\nSagen Sie nicht, der Tag wird kommen. Bringen Sie den Tag herbei. "
ISR_appeal_west:0	"Appell an den Westen"
ISR_appeal_west_desc:0	"Es liegt im besten Interesse des Westens, in unsere junge Nation zu investieren. Wir müssen an ihre industrielle Unterstützung appellieren."
ISR_progressives:0	"Die neue Aliyah"
ISR_progressives_desc:0	"Als Teil unserer Koalition müssen wir mit der Partei der Neuen Aliyah zusammenarbeiten und einige ihrer Politiken unterstützen."
ISR_womens_rights:0	"Die Rechte der Frauen fördern"
ISR_womens_rights_desc:0	"Die Rechte der Frauen sind zweifelsohne wichtig für unser Land, wenn wir wollen, dass es wirklich frei ist."
ISR_secularize_public_laws:0	"Säkularisierung öffentlicher Gesetze"
ISR_secularize_public_laws_desc:0	"Religiöse Gesetze verlangsamen nur unseren Fortschritt. Wir müssen diesen Rückschritt rückgängig machen."
ISR_general_zionists:0	"Die Allgemeinen Zionisten"
ISR_general_zionists_desc:0	"Da sie Teil unserer Koalition sind, müssen wir mit der Partei der Allgemeinen Zionisten zusammenarbeiten und einige ihrer Politiken unterstützen."
ISR_develop_road_infrastructure:0	"Ausbau der Straßeninfrastruktur"
ISR_develop_road_infrastructure_desc:0	"Wenn unsere Nation gedeihen soll, müssen wir unsere Infrastruktur ausbauen, damit unsere Bürger weniger Schwierigkeiten beim Reisen haben."
ISR_develop_gush_dan:0	"Gush Dan entwickeln"
ISR_develop_gush_dan_desc:0	"Gush Dan, das Herz unserer Nation, benötigt mehr Investitionen. Wir sollten dort mehr Fabriken errichten."
ISR_centre_victorious:0	"Die alte Garde"
ISR_centre_victorious_desc:0	"Herzls liberaler Zionismus ist nicht tot, er liegt nur im Dornröschenschlaf. Wir werden sein Vermächtnis erfüllen."
ISR_undo_austerity:0	"Austeritätsmaßnahmen rückgängig machen"
ISR_undo_austerity_desc:0	"Ben-Gurions katastrophale Sparmaßnahmen aus der Kriegszeit müssen rückgängig gemacht werden. Sie werden unserer Nation nur schaden."
ISR_foreign_experts:0	"Laden Sie ausländische Experten ein"
ISR_foreign_experts_desc:0	"Es gibt viele ausländische Experten, die mit unserer Sache sympathisieren und uns helfen könnten, unsere Forschungen voranzutreiben. Wir müssen sie einladen."
ISR_promote_electronic_developments:0	"Fördern Sie elektronische Entwicklungen"
ISR_promote_electronic_developments_desc:0	"Es ist kein Geheimnis, dass wir von Feinden umgeben sind. Deshalb müssen wir dafür sorgen, dass wir in Sachen Technologie einen Vorsprung haben, um dies auszugleichen."
ISR_economic_liberalisation:0	"Wirtschaftliche Liberalisierungen"
ISR_economic_liberalisation_desc:0	"Die alte sozialistische Wirtschaft ist für einen aufstrebenden Staat wie den unseren nicht zu gebrauchen. Wir müssen unsere Wirtschaft liberalisieren, um sie so weit wie möglich wachsen zu lassen."
ISR_increase_urban_investments:0	"Städtische Investitionen erhöhen"
ISR_increase_urban_investments_desc:0	"Wir müssen unsere städtischen Gebiete mit mehr Arbeitsmöglichkeiten ausbauen, da der größte Teil unseres Volkes dort wohnt."
ISR_best_of_the_best:0	"Die Besten der Besten"
ISR_best_of_the_best_desc:0	"Unsere Nation, die von Feinden umgeben ist, muss über die bestmögliche Technologie verfügen, um unsere Gegner zu überlisten."
ISR_strengthen_progressives:0	"Stärken Sie die Progressiven"
ISR_strengthen_progressives_desc:0	"Pinchas Rosens Partei New Aliyah hat gute Argumente. Wir sollten auf sie hören und ihren Einfluss stärken."
ISR_push_secular_education:0	"Säkulare Bildung fördern"
ISR_push_secular_education_desc:0	"Unsere Kinder müssen die bestmögliche Bildung erhalten. Wir müssen dafür sorgen, dass keine Zeit für unnötige Fächer verschwendet wird."
ISR_invest_in_white_collar:0	"Investieren Sie in Angestelltenunternehmen"
ISR_invest_in_white_collar_desc:0	"Unser Land ist klein und arm an Ressourcen. Wir müssen in Wirtschaftsunternehmen investieren, um technologisch immer einen Schritt voraus zu sein, wenn wir es militärisch nicht sind."
ISR_appeal_to_diaspora:0	"Appellieren Sie an die Diaspora"
ISR_appeal_to_diaspora_desc:0	"Es gibt viele Juden in der Diaspora, die uns unterstützen werden. Wir sollten ihre Gelder sammeln, um neue Industrien im Land zu eröffnen."
ISR_expand_immigrant_infrastructure:0	"Erweitern Sie die Aliyah-Infrastruktur"
ISR_expand_immigrant_infrastructure_desc:0	"Noch immer kommen jedes Jahr Hunderttausende von Menschen an unseren Küsten an. Wir müssen unsere Infrastruktur ausbauen, um sie zu beherbergen."
ISR_status_quo_arabs:0	"Den Status Quo zementieren"
ISR_status_quo_arabs_desc:0	"Mit unserer Unabhängigkeit haben wir eine große arabische Bevölkerung in unserem Land. Wir werden den Status Quo beibehalten, in dem sie von der Wehrpflicht ausgenommen sind."
ISR_shift_rightwards:0	"Verschiebung nach rechts"
ISR_shift_rightwards_desc:0	"Die Generäle Zionisten haben die beste Vision für die Nation. Wir müssen ihrem Beispiel für einen kapitalistischen Staat folgen."
ISR_tax_reforms:0	"Steuerreformen"
ISR_tax_reforms_desc:0	"Die alte sozialistische Regierung hatte viele ungerechtfertigte Steuern. Wir müssen sie abschaffen."
ISR_histardrut_deregulation:0	"Schwächen Sie die Histadruts"
ISR_histardrut_deregulation_desc:0	"Die Histadruts haben ihren Platz, aber sie sind derzeit viel zu mächtig. Wir müssen ihre Bürokratie abschaffen."
ISR_further_industry_expansions:0	"Weitere industrielle Expansionen"
ISR_further_industry_expansions_desc:0	"Unsere Industrie kann noch weiter ausgebaut werden. Wir müssen in diesen Bereich investieren."
ISR_middle_class_investments:0	"Die Mittelschicht stärken"
ISR_middle_class_investments_desc:0	"Der Kern unserer Unterstützerbasis liegt in der Mittelschicht. Wir müssen sie unterstützen und ihren Einfluss ausbauen."
ISR_legacy_of_basel:0	"Altneuland"
ISR_legacy_of_basel_desc:0	"Als Herzl das Altneuland erdachte, stellte er es sich als Schmelztiegel der Kulturen, als freie Nation, als toleranten Staat vor. Dafür müssen wir arbeiten, denn sein Vermächtnis darf nicht vergessen werden.\n\nWenn Sie es wollen, ist es kein Traum."
ISR_the_religious_front:0	"Die Relgionsfront"
ISR_the_religious_front_desc:0	"Als Teil unserer Koalition müssen wir mit der Vereinigten Religiösen Front zusammenarbeiten, um unsere Ziele zu erreichen."
ISR_fund_religious_education:0	"Religiöse Bildung finanzieren"
ISR_fund_religious_education_desc:0	"Um die Unterstützung der religiösen Parteien zu gewinnen, müssen wir den Religionsunterricht für ihre Gemeinden im ganzen Land finanzieren."
ISR_exempt_yeshiva_students:0	"Befreiung der Jeschiwa von der Wehrpflicht"
ISR_exempt_yeshiva_students_desc:0	"Wir müssen Jeschiwa-Studenten von der Wehrpflicht befreien, um ihre Unterstützung zu gewinnen."
ISR_status_quo_agreement:0	"Das Status Quo-Abkommen"
ISR_status_quo_agreement_desc:0	"Das Status Quo-Abkommen wird die Änderung von Gesetzen, die auf Religion basieren, erschweren, um sicherzustellen, dass sie in Zukunft nicht mit Füßen getreten werden."
ISR_revisionist_revolution:0	"Die Revisionistische Revolution"
ISR_revisionist_revolution_desc:0	"Sieg! Unser großer Traum von einer revisionistischen Regierung, die die Fehler der Arbeitszionisten ungeschehen machen wird, ist da."
ISR_the_five_mems:0	"Hameshet HaMemim"
ISR_the_five_mems_desc:0	"Die Fünf Meme von Jabotinsky sind ein Leitfaden für die Bedürfnisse eines jeden Bürgers - Nahrung, Wohnung, Kleidung, Bildung, Gesundheit. Wir müssen dafür sorgen, dass unsere Bevölkerung Zugang zu all diesen Dingen hat."
ISR_periphery_investments:0	"Investitionen in der Peripherie"
ISR_periphery_investments_desc:0	"Wir können es uns nicht leisten, dass Tel Aviv und Gush Dan den Rest der Nation im Stich lassen. Wir müssen in die Städte der Peripherie investieren."
ISR_open_economy:0	"Öffnen Sie die Wirtschaft"
ISR_open_economy_desc:0	"Wir müssen die Sparmaßnahmen der Kriegszeit abschaffen und unseren Handel öffnen."
ISR_cement_jewish_identity:0	"Jüdische Identität zementieren"
ISR_cement_jewish_identity_desc:0	"Israel ist in erster Linie ein Staat für das jüdische Volk. Dies darf nicht in Frage gestellt werden."
ISR_push_military_industries:0	"Finanzierung der Industrie umleiten"
ISR_push_military_industries_desc:0	"Unserem Land mangelt es an Militärindustrien. Wir müssen einen Teil der Mittel dorthin umleiten."
ISR_weaken_histadrut:0	"Schwächen Sie die Histadrut"
ISR_weaken_histadrut_desc:0	"Die Histadrut-Gewerkschaften sind zu mächtig geworden. Wir müssen ihre Macht umgehen und sie schwächen."
ISR_cement_five_mems:0	"Ein Hebräer in Armut - immer noch edel"
ISR_cement_five_mems_desc:0	"Das jüdische Volk hat von allen Völkern am meisten gelitten. Wir dürfen unser Erbe des Widerstands nicht vergessen."
ISR_begin_takes_over:0	"Begin übernimmt die Führung"
ISR_begin_takes_over_desc:0	"Jabotinsky ist von uns gegangen. Der große Vater des revisionistischen Zionismus hätte gewollt, dass wir sein Erbe fortführen. Menachem Begin wird seinen Platz einnehmen."
ISR_expand_settlement:0	"Jüdische Besiedlung ausweiten"
ISR_expand_settlement_desc:0	"Wir müssen die jüdischen Siedlungen im ganzen Land ausbauen, wenn wir dem palästinensischen Widerstand etwas entgegensetzen wollen."
ISR_reject_lesser_israel:0	"Kleineres Israel ablehnen"
ISR_reject_lesser_israel_desc:0	"Es gibt Verräter in unserem Volk, die glauben, dass wir Gebiete abtreten müssen, um Frieden zu schließen. Das wird niemals geschehen."
ISR_martial_law:0	"Palästinensisches Kriegsrecht"
ISR_martial_law_desc:0	"Um dem Widerstand entgegenzuwirken, müssen wir in den palästinensischen Gebieten das Kriegsrecht verhängen, um Angriffe zu verhindern."
ISR_abandon_eretz_yisrael:0	"Groß-Jisrael aufgeben"
ISR_abandon_eretz_yisrael_desc:0	"Wir müssen einsehen, dass sich die Zeiten geändert haben und wir keinen Anspruch mehr auf das Ostufer des Jordans erheben können, wenn wir eine Chance auf Frieden haben wollen."
ISR_only_thus:0	"Nur so"
ISR_only_thus_desc:0	"Die Zeit ist reif. Wir werden endlich beide Ufer des Jordans zu einem Groß-Israel vereinigen."
ISR_yodefet_masada_betar:0	"Jodefet, Masada, Betar."
ISR_yodefet_masada_betar_desc:0	"Das Vermächtnis des jüdischen Volkes, Widerstand zu leisten, ist geblieben. Zuerst bei Jodefet, dann bei Masada, dann jetzt.\n\nDen Berg erobern oder sterben."
ISR_join_SOV:0	"Schließen Sie sich den Sowjets an"
ISR_join_SOV_desc:0	"[SOV.GetNameDefCap] hat sich als unser größter Verbündeter erwiesen. Wir müssen uns ihnen in ihrem Kampf anschließen."
ISR_join_USA:0	"Schließen Sie sich den Vereinigten Staaten an"
ISR_join_USA_desc:0	"[USA.GetNameDefCap] hat die größte jüdische Bevölkerung außerhalb von Israel. Wir müssen uns mit ihnen verbünden, um unseres Volkes willen."
ISR_alone:0	"Unser eigenes Schicksal"
ISR_alone_desc:0	"Die Europäer haben uns seit zweitausend Jahren unterdrückt. Es ist an der Zeit, unser eigenes Schicksal zu gestalten, frei von jeglichem Einfluss, in unserem eigenen Land."
ISR_join_ENG:0	"Schließen Sie sich dem Vereinigten Königreich an"
ISR_join_ENG_desc:0	"Selbst nach der britischen Besatzung erweisen sich die Briten immer noch als unsere nützlichsten Verbündeten. Wir dürfen nicht zulassen, dass die Vergangenheit zwischen uns und einem sicheren Israel steht."
ISR_join_ITA:0	"Treten Sie [ITA.GetNameDef] bei"
ISR_join_ITA_desc:0	"[ITA.GetNameDef] hat sich als ein sehr guter Verbündeter für uns erwiesen. Wir müssen uns ihnen anschließen."
ISR_am_yisrael_hai:0	"Am Yisrael Hai"
ISR_am_yisrael_hai_desc:0	"Nach 2000 Jahren Exil, Unterdrückung, Pogromen und Völkermorden hat das jüdische Volk endlich einen Ort, den es Heimat nennen kann. Die Reise war nicht einfach, und die Zukunft wird es auch nicht sein. Aber heute können wir sicher sein, dass das Volk von Jisrael weiterlebt. \n\nSolange sich eine jüdische Seele noch danach sehnt, ist unsere Hoffnung noch nicht verloren."
ISR_destroy_nazi:0	"Die letzte Schlacht"
ISR_destroy_nazi_desc:0	"Die Nazischweine in Deutschland sind dabei, unsere Kultur, unsere Familien, unser Volk zu zerstören. Wir müssen uns für eine letzte Schlacht zusammentun."
ISR_irgun_in_power:0	"Irgun-Herrschaft fortsetzen"
ISR_irgun_in_power_desc:0	"Unsere Nation braucht die Führung der Irgun, um sie vor äußeren Bedrohungen zu schützen. Wir können den Schutz nicht für die Demokratie opfern."
ISR_fight_resistance:0	"Widerstand eindämmen"
ISR_fight_resistance_desc:0	"Bevor wir etwas unternehmen, müssen wir den Widerstand in unseren Gebieten eindämmen, um Angriffe auf unser Volk zu verhindern."
ISR_consolidate_power:0	"Die Macht konsolidieren"
ISR_consolidate_power_desc:0	"Nachdem wir den Widerstand in unseren Gebieten teilweise niedergeschlagen haben, können wir endlich unsere Herrschaft konsolidieren."
ISR_end_austerity:0	"Austeritätsmaßnahmen beenden"
ISR_end_austerity_desc:0	"Wir müssen die Sparmaßnahmen beenden, die unserem Volk während des Unabhängigkeitskrieges auferlegt wurden, und unseren Handel für die Welt öffnen."
ISR_histadrut_legislation:0	"Histadrut-Gesetzgebung"
ISR_histadrut_legislation_desc:0	"Wir müssen die Macht der Histadrut schwächen, wenn wir die Kontrolle über das Land weiter festigen wollen."
ISR_factory_investments:0	"Industrielle Investitionen"
ISR_factory_investments_desc:0	"Wir sollten in die Industrie investieren, um die Verteidigungsfähigkeit unseres Landes zu stärken."
ISR_push_jewish:0	"Das ewige Volk"
ISR_push_jewish_desc:0	"Das jüdische Volk war zwei Jahrtausende lang staatenlos, aber jetzt haben wir endlich unser eigenes Land, das wir Heimat nennen können."
ISR_watch_yishuv_leaders:0	"Jischuw-Führer beobachten"
ISR_watch_yishuv_leaders_desc:0	"Ehemaligen Yishuv-Führern muss es erlaubt sein, weiterhin politisch aktiv zu sein, aber wir müssen sicherstellen, dass sie keinen Dissens in der Bevölkerung verbreiten."
ISR_push_militarism:0	"Eiserne-Mauer-Diplomatie"
ISR_push_militarism_desc:0	"Ze'ev Jabotinsky hat dargelegt, dass unser Plan für die Diplomatie ein starkes Militär ist, das für sich selbst eintreten kann, als Voraussetzung für erfolgreiche Verhandlungen mit der arabischen Bevölkerung und den Nachbarstaaten. Nur durch jüdische militärische Stärke wird ein dauerhafter Frieden erreicht werden."
ISR_third_temple:0	"Der dritte Tempel"
ISR_third_temple_desc:0	"Seit der Zerstörung des zweiten Tempels durch die Römer sehnen sich Juden in aller Welt danach, ihn wieder aufzubauen. Dies ist nun Realität und dient als Aufruf an die Juden in aller Welt."
ISR_foreign_assets_seized:0	"Beschlagnahmte ausländische Vermögenswerte"
ISR_jabotinsky_death:0	"Der Tod des Vaters"
ISR_jabotinsky_death_desc:0	"Ze'ev Jabotinsky, Autor, Dichter, Soldat, Offizier und Vater des revisionistischen Zionismus, ist verstorben. Eine neue Ära beginnt, und es zeigen sich erste Risse. Menachem Begin wurde ausgewählt, sein Erbe fortzuführen, aber viele befürchten, dass seine Herrschaft untergraben wird, bevor sie überhaupt begonnen hat."
ISR_the_revisionist_split:0	"Die Spaltung der Revisionisten"
ISR_the_revisionist_split_desc:0	"Avraham Stern, der Menachem Begin als Verräter an der Nation bezeichnet, hat einen Aufstand gegen die neue Regierung gestartet."
ISR_gather_the_loyalists:0	"Sammeln Sie die Loyalisten"
ISR_gather_the_loyalists_desc:0	"Stern ist nichts weiter als ein Verräter! Wir werden seinen Aufstand niederschlagen!"
ISR_appeal_to_haganah:0	"Appell an ehemalige Haganah-Kämpfer"
ISR_appeal_to_haganah_desc:0	"Auch wenn wir unsere Differenzen haben, müssen wir den gemeinsamen Feind erkennen und mit ehemaligen Haganah-Kämpfern zusammenarbeiten, die unsere Reihen verstärken können."
ISR_negotiate_lehi_defectors:0	"Verhandeln Sie mit Lehi-Überläufern"
ISR_negotiate_lehi_defectors_desc:0	"Nicht alle Mitglieder von Sterns Fraktion unterstützen den Aufstand. Wenn wir ihnen Amnestie gewähren, könnten wir Informationen über mögliche Standorte von Lehi-Hauptquartieren erhalten."
ISR_crown_of_david:0	"Das Tragen der Davidskrone"
ISR_crown_of_david_desc:0	"Sterns Aufstand wurde niedergeschlagen, und er wurde für seinen Verrat hingerichtet. Es ist an der Zeit, vorwärts zu gehen und unseren Ruhm zurückzufordern."
ISR_strengthen_military_industrial:0	"Stärkung des militärisch-industriellen Komplexes"
ISR_strengthen_military_industrial_desc:0	"Durch die Umleitung von Geldern für den militärisch-industriellen Komplex können wir die Produktion neuer Waffen rationalisieren."
ISR_seize_foreign_assets:0	"Ausländische Vermögenswerte beschlagnahmen"
ISR_seize_foreign_assets_desc:0	"In unserem Land befinden sich noch viele ausländische Vermögenswerte. Indem wir sie für uns selbst beschlagnahmen, können wir die Früchte ernten."
ISR_arms_sourcing:0	"Beschaffung von Rüstungsgütern"
ISR_arms_sourcing_desc:0	"Wir müssen Waffen von den internationalen Märkten beziehen, um unsere militärischen Fähigkeiten zu erweitern."
ISR_expand_support_uses:0	"Einsatz von Unterstützungswaffen ausweiten"
ISR_expand_support_uses_desc:0	"Um asymmetrische Kriege besser bekämpfen zu können, müssen wir den Einsatz von Unterstützungswaffen gegen unseren Feind ausweiten."
ISR_judea_fell:0	"Mit Feuer und Blut fiel Judäa"
ISR_judea_fell_desc:0	"Vor fast zwei Jahrtausenden fiel der letzte jüdische Staat an die Römer. Allen Widrigkeiten zum Trotz haben wir der Geschichte getrotzt und ein jüdisches Heimatland wiederhergestellt."
ISR_settlement_projects:0	"Siedlungsprojekte ausweiten"
ISR_settlement_projects_desc:0	"Um unsere Kontrolle über die Region zu festigen, müssen wir die jüdischen Siedlungsprojekte im ganzen Land ausweiten."
ISR_clean_resistance:0	"Widerstand vertreiben"
ISR_clean_resistance_desc:0	"Wir müssen den verbleibenden Widerstand auslöschen, um sicherzustellen, dass er unseren Staat nicht bedrohen kann."
ISR_the_italian_model:0	"Das italienische Modell"
ISR_the_italian_model_desc:0	"Benito Mussolini hat eine große Vision dafür entworfen, wie ein starkes Volk seine Nation organisieren sollte. Wir müssen seiner großen Vision folgen."
ISR_joint_military_exercises:0	"Gemeinsame Militärübungen "
ISR_joint_military_exercises_desc:0	"Wir sollten an gemeinsamen Übungen mit der [ITA.GetAdjective] Armee teilnehmen. Wir haben viel zu lernen."
ISR_strike_egypt:0	"Ägypten angreifen"
ISR_strike_egypt_desc:0	"Mit Hilfe der Italiener können wir Ägypten von beiden Seiten angreifen und so den Suezkanal und die Position unserer Allianz in Nordafrika sichern."
ISR_support_maronite_lebanese:0	"Unterstützen Sie die maronitischen Libanesen"
ISR_support_maronite_lebanese_desc:0	"Die maronitischen Christen im Libanon haben uns um Unterstützung gegen die Besatzungstruppen in ihrem Land gebeten. Wir sollten ihnen Hilfe schicken, und vielleicht werden sie ein enger Verbündeter."
ISR_the_periphery_strategy:0	"Die Strategie der Peripherie"
ISR_the_periphery_strategy_desc:0	"Wir sollten unsere Beziehungen zu den nicht-arabischen Ländern des Nahen Ostens festigen, um ein Bollwerk gegen arabische Aggressionen zu bilden."
ISR_turkish_alliance:0	"[TUR.GetAdjective] Versöhnung "
ISR_turkish_alliance_desc:0	"[TUR.GetNameDefCap] herrschten einst über unser heiliges Land, doch wir sind bereit, uns mit ihnen auszusöhnen, um unsere beiden Nationen zu schützen."
ISR_iranian_alliance:0	"Ausweitung der [PER.GetAdjective] Allianz"
ISR_iranian_alliance_desc:0	"Unsere Beziehungen zur imperialen iranischen Regierung sind sehr wichtig. Wir sollten unser Bündnis mit ihnen ausbauen."
ISR_partition_syria:0	"Syrien aufteilen"
ISR_partition_syria_desc:0	"[TUR.GetNameDef] hat viele Ansprüche auf das syrische Territorium. Vielleicht könnten wir es unter uns aufteilen."
ISR_judea_rise:0	"Mit Feuer und Blut wird sich Judäa erheben!"
ISR_judea_rise_desc:0	"Vor fast zwei Jahrtausenden fiel der letzte jüdische Staat an die Römer. Allen Widrigkeiten zum Trotz haben wir der Geschichte getrotzt und ein jüdisches Heimatland wiederhergestellt. Viele stellen sich gegen uns, aber nur mit Feuer und Blut können wir unser Schicksal sichern!"
ISR_empower_stern_gang:0	"Ermächtigen Sie die Stern-Bande"
ISR_empower_stern_gang_desc:0	"Stern ist der einzige Mann, der uns zu Großem führen kann! Nieder mit der Irgun!"
ISR_gather_outside_support:0	"Sammeln Sie ausländische Unterstützung"
ISR_gather_outside_support_desc:0	"Wir müssen andere nationalistische Nationen auf der ganzen Welt um Unterstützung bitten, sie werden uns sicher helfen."
ISR_strike_infrastructure:0	"Streichen Sie die Infrastruktur der Irgun"
ISR_strike_infrastructure_desc:0	"Ein Angriff auf die Infrastruktur wäre ein guter Weg, um die Irgun zu schwächen und ihre Logistik zu belasten."
ISR_avenge_tragedies:0	"Rache für die größten Tragödien"
ISR_avenge_tragedies_desc:0	"Unserem Volk wurde so lange sein rechtmäßiges Schicksal verweigert. Es ist an der Zeit, dass wir die Sache in unsere eigenen Hände nehmen."
ISR_nile_to_euphrates:0	"Vom Nil zum Euphrat"
ISR_nile_to_euphrates_desc:0	"Vor langer Zeit wurde unserem Volk Land vom Nil bis zum Euphrat versprochen. Das gilt auch heute noch."
ISR_stern_cult:0	"Kult des Stern"
ISR_stern_cult_desc:0	"Avraham Stern ist der einzige, der es verdient, unser großes Heimatland zu regieren. Er hat uns zu Ruhm und Ehre geführt und wird uns zur Erlösung führen!"
ISR_join_fascists:0	"Verbündete im Ausland"
ISR_join_fascists_desc:0	"Um unsere Sache zu stärken, sollten wir uns mit anderen nationalistischen Nationen auf der ganzen Welt verbünden."
ISR_kill_stern:0	"Schaffen Sie den Stern ab"
ISR_kill_stern_desc:0	"Stern war ein nützliches Werkzeug, aber wir müssen ihn loswerden, bevor er unsere Nation in den Untergang treibt. Das Triumvirat wird unsere wahren Anführer sein."
ISR_schizo_nazbol:0	"Rekonfigurieren Sie die Innenpolitik"
ISR_schizo_nazbol_desc:0	"Sterns alte Wege sind vorbei, und wir müssen uns anpassen, um zu überleben. Wir sollten eine Ideologie des Nationalbolschewismus annehmen, um uns der Sowjetunion anzunähern."
ISR_join_soviet:0	"Beitritt zu [SOV.GetNameDef]"
ISR_join_soviet_desc:0	"Wir müssen uns dem Kampf von [SOV.GetNameDef] anschließen, um unsere Sache voranzubringen. Sie können uns beschützen."
ISR_the_east_bank:0	"Das Ostufer"
ISR_the_east_bank_desc:0	"Das Ostufer des Jordan ist nicht weniger [ISR.GetAdjective] als das Westufer. Wir müssen es so schnell wie möglich unter unsere Kontrolle bringen."
ISR_seize_lebanon:0	"Erobern Sie den Libanon"
ISR_seize_lebanon_desc:0	""
ISR_syria_war:0	"Krieg in Syrien"
ISR_syria_war_desc:0	""
ISR_to_the_euphrates:0	"Bis zum Euphrat"
ISR_to_the_euphrates_desc:0	""
ISR_into_the_desert:0	"In die Wüste"
ISR_into_the_desert_desc:0	""
ISR_to_the_suez:0	"Zum Suez"
ISR_to_the_suez_desc:0	""
ISR_build_third_temple:0	"Bau des Dritten Tempels"
ISR_build_third_temple_desc:0	"Vor 2000 Jahren wurde unser zweiter Tempel zerstört. Doch der Tempelberg ist immer noch da, und wir müssen unsere vergangenen Tragödien rächen, indem wir ihn wieder aufbauen, koste es, was es wolle."
ISR_suez_crisis:0	"Krise am Suez"
ISR_suez_crisis_desc:0	"[EGY.GetNameDefCap] hat unseren Zugang zum Suez-Kanal blockiert! Dies ist eine Kriegshandlung! Wir dürfen das nicht hinnehmen!"
ISR_appeal_to_uk:0	"Appell an [ENG.GetNameDef]"
ISR_appeal_to_uk_desc:0	"[ENG.GetNameDefCap] waren die früheren Eigentümer des Kanals. Wir könnten mit ihnen zusammenarbeiten, um ihn wieder zu sichern."
ISR_appeal_to_france:0	"Appell an [FRA.GetNameDef]"
ISR_appeal_to_france_desc:0	"[FRA.GetNameDefCap] hat ebenfalls ein Interesse an der Sache. Wir müssen sie um ihre Unterstützung bitten."
ISR_prepare_the_invasion:0	"Bereiten Sie die Invasion vor"
ISR_prepare_the_invasion_desc:0	"Die Frage des Krieges ist nicht ob, sondern wann. Wir müssen uns vorbereiten."
ISR_operation_sinai:0	"Operation Kadesh"
ISR_operation_sinai_desc:0	"Die Zeit ist gekommen. Wir müssen unsere Invasion jetzt starten."
ISR_a_resounding_victory:0	"Ein überwältigender Sieg"
ISR_a_resounding_victory_desc:0	"Wir haben einen großen Sieg errungen! Mit dem Sinai in unseren Händen sitzen wir nun am Verhandlungstisch. Wir müssen unsere Macht nutzen, um ein gutes Ergebnis zu erzielen."
ISR_stretch_out_the_hand:0	"Strecken Sie die Hand aus"
ISR_stretch_out_the_hand_desc:0	"Es ist an der Zeit, sich an den Verhandlungstisch zu setzen. Wir müssen zusammenarbeiten, um eine endgültige Lösung für die Kanalfrage zu finden."
ISR_one_zion:0	"Ein Zion, ein Israel"
ISR_one_zion_desc:0	"Genug! Wir werden uns nicht von ausländischen Mächten an den Verhandlungstisch zwingen lassen! Wir müssen den Sinai zum Schutz vor den Ägyptern halten."
ISR_encourage_hebraic_settlement:0	"Förderung der hebräischen Besiedlung"
ISR_encourage_hebraic_settlement_desc:0	"Ermutigen Sie die hebräische Besiedlung"
ISR_raise_jewish_militias:0	"Stärken Sie die IDF"
ISR_raise_jewish_militias_desc:0	"Viele Milizen treiben noch immer ihr Unwesen in unserem Land. Wir müssen die IDF als die einzige legitime Armee in unserem Staat festigen."
ISR_formalize_military:0	"Formalisierung der Militärstruktur"
ISR_formalize_military_desc:0	"Wir müssen die Struktur der IDF formalisieren, um unsere militärische Führung zu stärken."
ISR_provisional_government:0	"Die Hauptstadtfrage"
ISR_provisional_government_desc:0	"Wenn der Krieg vorbei ist, müssen wir die Hauptstadtfrage beantworten. Bleibt es Tel Aviv oder sollen wir wieder nach Jerusalem umziehen?"
ISR_national_higher_education:0	"Landesweite höhere Bildung"
ISR_national_higher_education_desc:0	"Der Mangel an Bildung unter der Jugend ist immer noch ein erschütterndes Problem, das mit allen Mitteln behoben werden muss!"
ISR_reading_power_station:0	"Öffnen Sie ein Lesekraftwerk"
ISR_reading_power_station_desc:0	"Unser Land muss in der Lage sein, seinen eigenen Strom zu erzeugen. Die Eröffnung eines neuen Kraftwerks in Tel Aviv ist ein guter erster Schritt."
ISR_link_communities:0	"Verbinden Sie die Gemeinden"
ISR_link_communities_desc:0	""
ISR_military_vehicles:0	"Entwickeln Sie Militärfahrzeuge"
ISR_military_vehicles_desc:0	"Militärische Fahrzeuge entwickeln"
ISR_armored_vehicles:0	"Gepanzerte Fahrzeuge"
ISR_armored_vehicles_desc:0	"Gepanzerte Fahrzeuge"
ISR_building_the_new_homeland:0	"Aufbau des neuen Heimatlandes"
ISR_building_the_new_homeland_desc:0	"Wir müssen mit dem Aufbau einer neuen Heimat für unser Volk beginnen."
ISR_land_reclamation:0	"Projekte zur Urbarmachung von Land"
ISR_land_reclamation_desc:0	"Unser Land ist klein, und wir haben nicht viel Platz für die Bauindustrie. Wir müssen mit Landgewinnungsprojekten im ganzen Land beginnen, um das wenige Land, das wir haben, zu nutzen."
ISR_kibbutz_production:0	"Lokale Kibbuz-Entwicklung"
ISR_kibbutz_production_desc:0	"Lokale Kibbuz-Entwicklung"
ISR_industrial_expansion_plan:0	"Plan zur industriellen Expansion"
ISR_industrial_expansion_plan_desc:0	"Industrieller Expansionsplan"
ISR_firearms_production:0	"Produktion von Schusswaffen"
ISR_firearms_production_desc:0	"Produktion von Schusswaffen"
ISR_issue_the_israeli_lira:0	"Ausgabe der [ISR.GetAdjective] Lira"
ISR_issue_the_israeli_lira_desc:0	"Um uns vom britischen Einfluss zu befreien, müssen wir das alte palästinensische Pfund loswerden und es durch eine neue Währung ersetzen, die [ISR.GetAdjective] Lira."
ISR_independent_steel_production:0	"Unabhängige Stahlproduktion"
ISR_independent_steel_production_desc:0	"Unabhängige Stahlproduktion"
ISR_israel_military_industries:0	"Israelische Militärindustrie"
ISR_israel_military_industries_desc:0	"Israelische Militärindustrien"
ISR_equipment_modernization:0	"Modernisierung der Ausrüstung"
ISR_equipment_modernization_desc:0	"Modernisierung der Ausrüstung"
ISR_reading_power_station_idea:0	"Kraftwerk Reading"
ISR_special_night_squads:0	"Spezial-Nachtkommandos"
ISR_special_night_squads_desc:0	"Spezielle Nachteinsätze"
ISR_special_forces:0	"In Spezialeinheiten investieren"
ISR_special_forces_desc:0	"Durch Investitionen in Spezialeinheiten können wir unseren Mangel an Arbeitskräften ausgleichen, indem wir einen unserer Soldaten für zwei des Feindes einsetzen."
ISR_plane_imports:0	"Bilden Sie die Sherut Avir"
ISR_plane_imports_desc:0	"Nachdem wir die Unabhängigkeit erlangt haben, müssen wir unsere eigene Luftwaffe aufbauen. Für den Anfang können wir die ehemaligen britischen Kampfflugzeuge nutzen, die auf dem Flughafen von Lod zurückgelassen wurden."
ISR_volunteer_pilots:0	"Freiwillige Piloten"
ISR_volunteer_pilots_desc:0	"Freiwillige Piloten"
ISR_israeli_air_school:0	"[ISR.GetAdjective] Flugschule"
ISR_israeli_air_school_desc:0	"[ISR.GetAdjective] Fliegerschule"
ISR_form_the_techni:0	"Bilden Sie die Air Force Technical"
ISR_form_the_techni_desc:0	"Adif lizhol bahol me'asher lilbosh sarbal kahol\n\nAd matai"
ISR_build_trainer_aircrafts:0	"Bauen Sie 'Trainer' Flugzeuge"
ISR_build_trainer_aircrafts_desc:0	"Trainer-Flugzeuge bauen"
ISR_bimotor_aircrafts:0	"Zweimotorige Flugzeuge"
ISR_bimotor_aircrafts_desc:0	"Zweimotorige Flugzeuge"
ISR_naval_aviation:0	"Luftverteidigung an der Küste"
ISR_naval_aviation_desc:0	"Küsten-Luftverteidigung"
ISR_military_research:0	"Militärische Forschung"
ISR_military_research_desc:0	"Militärische Forschung"
ISR_form_the_mossad:0	"Den Mossad gründen"
ISR_form_the_mossad_desc:0	"Manche Schlachten können ohne Blutvergießen gewonnen werden. Unsere kleine Nation kann es sich nicht leisten, viele Kriege zu führen, und deshalb müssen wir in alternative Kampfmethoden investieren."
ISR_world_wide_spy_web:0	"World Wide Spy Web"
ISR_world_wide_spy_web_desc:0	"Wir müssen unsere Geheimdienstkapazitäten ausbauen, um sicherzustellen, dass es keine Bedrohungen gegen uns gibt."
ISR_israeli_military_industies:0	"[ISR.GetAdjective] Militärische Industrien"
ISR_form_the_israeli_navy:0	"Bilden Sie die [ISR.GetAdjective] Marine"
ISR_form_the_israeli_navy_desc:0	"Der Zugang zur See eröffnet uns neue Handelsmöglichkeiten und erhöht unsere Präsenz auf der ganzen Welt."
ISR_Small_Navy:0	"Konzentrieren Sie sich auf die Raubflotte"
ISR_Small_Navy_desc:0	"Störung und Chaos werden den offenen Ozean perfekt beschreiben, wo unsere Marine auf einen ahnungslosen Konvoi wartet, der betet."
ISR_Submarine:0	"Neue moderne U-Boote"
ISR_Submarine_desc:0	"Der Konzentrationspunkt der Überfallflotte ist ein modernes U-Boot."
ISR_stealth_upgrades:0	"Stealth Upgrades"
ISR_stealth_upgrades_desc:0	"Auf offener See anzugreifen und zu verschwinden ist effektiver, wenn der Feind die U-Boot-Motoren nicht orten und das Schiff angreifen kann. Der Schnorchel ist in diesem Fall eine richtige Investition."
ISR_Sea_Dominance:0	"Fokus auf Dominanz auf See"
ISR_Sea_Dominance_desc:0	"Unsere Marine wird tapfer über dem Wasser stehen und jede feindliche Flotte vernichten, die am Horizont auftaucht. Schlachtschiffe sind die Zukunft der Kriegsführung und das werden wir der Welt zeigen."
ISR_Study_Ships:0	"Studieren Sie ausländische Schiffsdesigns"
ISR_Study_Ships_desc:0	"Unsere Häfen werden ständig von ausländischen Schiffen angelaufen. Mehrere Sicherheitsinspektionen würden sicherlich mehr Details über die neuesten Schiffsvarianten liefern."
ISR_Ships_American:0	"Mission zu amerikanischen Marinewerften"
ISR_Ships_American_desc:0	"Unsere guten Beziehungen zu den USA haben sich nach gemeinsamen Besuchen von Marinewerften noch weiter vertieft."
ISR_Ships_England:0	"Mission in englischen Marinewerften"
ISR_Ships_England_desc:0	"Britische Marineingenieure haben eine Reihe von Methoden aufgezeigt, um die Qualität zu verbessern und die Bauzeit unserer leichten Schiffe zu verkürzen."
ISR_Purchase_Ships:0	"Bau von Großschiffen in Auftrag geben"
ISR_Purchase_Ships_desc:0	""
ISR_Dockyards:0	"Werftanlagen ausbauen"
ISR_Dockyards_desc:0	"Um eine ordentliche Marine zu bauen, müssen wir unsere Werftanlagen auf die neuen Ufer ausweiten."
ISR_Carrier:0	"Flugzeugträger im Fokus"
ISR_Carrier_desc:0	"Der neue Trägerprototyp wird von unserem Marinebüro entwickelt."
ISR_Navy_Aircrafts:0	"Trägergestützte Flugzeugmodelle"
ISR_Navy_Aircrafts_desc:0	"Ein Flugzeugträger ohne Flugzeuge ist nur eine Metallkiste, die auf dem Ozean schwimmt. Ihn mit neuen Marinebombern auszustatten, wird einige Zeit in Anspruch nehmen, aber das ist es sicher wert."
ISR_Battleship:0	"Schlachtschiff im Fokus"
ISR_Battleship_desc:0	"Neue glänzende Schlachtkreuzer werden nach den neu entwickelten Entwürfen gebaut. Lassen Sie unsere Feinde wissen, dass wir Feuer und Zorn auf den Meeren haben!"
ISR_Destroyer:0	"Zerstörer-Fokus"
ISR_Destroyer_desc:0	"Schwere Schiffe sind besonders anfällig für Torpedoangriffe. Die Verbesserung und der Bau von Zerstörern wird dieses Problem lösen."
ISR_Cruisers:0	"Kreuzer-Fokus"
ISR_Cruisers_desc:0	"Der schwere Kreuzer ist zwar nicht so mächtig wie ein Schlachtschiff oder ein Flugzeugträger, aber er ist eine gute Ergänzung unserer Marine-Feuerkraft, die zusätzliche Mittel erfordert."
ISR_Naval_Doctrine:0	"Verbessern Sie die Marinedoktrin"
ISR_Naval_Doctrine_desc:0	"Neue Schiffe sind ohne die richtige Taktik nutzlos, wir sollten unsere Doktrin sofort verbessern!"
ISR_Generals:0	"Generalstab ausbauen"
ISR_Generals_EXPL:0	"Wir werden §Hden Generalstab§! ausbauen und ausgebildete §HGeneräle§! und §HAdmirale§! gewinnen.\nAnzahl und Qualität der Generäle hängen von §Hvollendeten§! Schwerpunkten ab."
ISR_Generals_Other_tt:0	"\nDurch den Abschluss dieses Fokus erhalten Sie einen zusätzlichen Kommandanten, wenn Sie den Fokus §HExpand General Staff§! durchführen."
ISR_Generals_Other_nav_tt:0	"\nWenn Sie diesen Fokus abschließen, erhalten Sie einen zusätzlichen Admiral, wenn Sie den Fokus §HExpand General Staff§! abschließen."
ISR_Generals_desc:0	"Dem Militär unseres Landes fehlt es an einer angemessenen Organisation. Die Bildung eines nationalen Generalstabs wird die Leistung der stehenden Heere verbessern."
ISR_State_Matter:0	"Fokus auf interne Angelegenheiten"
ISR_State_Matter_desc:0	"Noch nie war unser Land so gespalten und vom internen Machtkampf zerrissen. Die Bildung einer starken, konsolidierten Regierung sollte unsere erste Priorität sein."
ISR_Collectivist_Ethos:0	"Kollektivistisches Ethos"
ISR_Collectivist_Ethos_desc:0	"Ein mächtiger Staat ist ein Einparteienstaat. Jede demokratische Opposition zum Schweigen zu bringen, wird das Regime der Behörden nur stärken."
ISR_Organise_Youth:0	"Organisieren Sie die Jugend"
ISR_Organise_Youth_desc:0	"Junge Stimmen, die das derzeitige Regime loben, sind in jedem Winkel unseres Landes zu hören. Ihre gemeinsame Unterstützung kann genutzt werden, um den Glauben der Menschen an unsere Sache zu stärken. "
ISR_Com_Generals:0	"Kommunistisches Militärkommando ausbauen"
ISR_Com_Generals_desc:0	"Viele gebildete Bauern und Arbeiter treten bereitwillig in das Militär ein, um die fehlenden Offiziersränge zu füllen."
ISR_Collectivist_Propaganda:0	"Die Kultur des Arbeiters"
ISR_Collectivist_Propaganda_desc:0	"Umverteilter Reichtum wird erfolgreich eingesetzt, um die laufenden Fabriken zu verbessern und die Produktionsleistung zu steigern."
ISR_Conquer:0	"Expansive Politik"
ISR_Conquer_desc:0	"Die militärische Stärke und Macht unseres Regimes zusammen mit der Schwäche und Inkompetenz der Regierungen unserer Nachbarn hat uns keine andere Wahl gelassen, als ihnen die richtige Herrschaft zu bringen."
ISR_Intervene:0	"Einmischende Politik"
ISR_Intervene_desc:0	"Unsere Sache kann in der ganzen Welt durch kleine Brigaden gefördert werden, die das richtige Regime der Behörden durch ideologische Erziehung, Personalplanung und militärische Unterstützung unterstützen. "
ISR_Isolated:0	"Isolierter Staat"
ISR_Isolated_desc:0	"Unsere Herrschaft wird mit politischer Stabilität und nationalem Wohlstand verbunden sein. Aber sollte jemand unsere Neutralität missachten, wird er dafür schwer bezahlen!"
ISR_Forced_Conscription:0	"Einberufungsgesetz"
ISR_Forced_Conscription_desc:0	"Wenn wir in dem Pulverfass, zu dem die Welt geworden ist, überleben wollen, brauchen wir viel mehr Soldaten, die unsere Werte verteidigen."
ISR_Fanaticism:0	"Ideologischer Fanatismus"
ISR_Fanaticism_desc:0	"Es gibt keinen Grund, unsere Propagandabemühungen einzuschränken. Wenn Menschen bereit sind, für unsere Sache zu sterben, warum sollten wir sie daran hindern?"
ISR_Liberty_Ethos:0	"Freiheitsethos"
ISR_Liberty_Ethos_desc:0	"Eine neue Regierung wird effektiver arbeiten, wenn sie auf den Willen aller Bevölkerungsgruppen hört und jede Unterteilung nach Geschlecht, Ethnie oder politischer Zugehörigkeit außer Acht lässt."
ISR_Strenghten_Monarchy:0	"Autokratie"
ISR_Strenghten_Monarchy_desc:0	"Eine starke Figur hinter dem Staat, die der Öffentlichkeit die Ideen der aktuellen Regierung vorträgt, ist doch keine schlechte Idee. Solange die Rede- und Versammlungsfreiheit gewahrt bleibt, kann nichts schief gehen."
ISR_Strenghten_Democracy:0	"Stärken Sie die Demokratie"
ISR_Strenghten_Democracy_desc:0	"Das Vertrauen des Volkes und seine Hingabe an unsere Sache sind unbestreitbar: Die neue Legislaturperiode wird den Massen noch mehr liberale Werte bringen!"
ISR_Defence_Act:0	"Gesetz zur nationalen Sicherheit"
ISR_Defence_Act_desc:0	"Die Förderung von loyalen Polizei-, Militär- und Geheimdienstexperten wird die Position der Regierung verbessern und den Gesetzgebungsapparat vor ausländischem Einfluss schützen."
ISR_Brigades:0	"Internationale Brigaden bilden"
ISR_Brigades_desc:0	"Wenn unsere militärischen Fähigkeiten auf globaler Ebene ernst genommen werden sollen, sollten wir unsere freiwillige Präsenz rund um den Globus verstärken."
ISR_Military_Build:0	"Waffen beschützen die Nation"
ISR_Military_Build_desc:0	"Die äußere Sicherheit einer Nation hängt mit der Größe ihrer Armee zusammen. Wenn wir den wachsenden Bedarf unserer Soldaten decken wollen, ist eine Expansion der Militärindustrie ein Muss!"
ISR_Anti_Invasion:0	"Festungen beschützen die Nation"
ISR_Anti_Invasion_desc:0	"Die Verteidigung der wichtigsten Industrie- und Forschungszentren ist effektiver, wenn die am stärksten gefährdeten Standorte befestigt und ihre Garnison ausgebaut werden kann."
ISR_Industrial_Boom:0	"Industrieller Aufschwung"
ISR_Industrial_Boom_desc:0	"Eine weitere industrielle Expansion des Staates ist der einzige Weg, um das Wohlergehen unserer Bürger zu sichern."
ISR_Industrial_Expansion:0	"Landesweite industrielle Expansion"
ISR_Industrial_Expansion_desc:0	"Das neue Regierungsprogramm zielt darauf ab, die Zahl der Produktionsstätten im ganzen Land zu erhöhen."
ISR_Railway_System:0	"Straßennetz modernisieren"
ISR_Railway_System_desc:0	"Der wachsende Bedarf der Industrie erfordert eine angemessene Infrastruktur, um erfolgreich erfüllt werden zu können."
ISR_Communication:0	"Moderne elektronische Geräte"
ISR_Communication_desc:0	"Mit der neuesten Generation von Computern können große Mengen an neuen Informationen effektiv verarbeitet werden."
ISR_University:0	"Neuer Forschungskomplex"
ISR_University_desc:0	"Mutige und kühne Köpfe werden ermutigt, sich den neuen Instituten, Universitäten und Forschungszentren anzuschließen."
ISR_Shared_Research:0	"Gemeinsame Forschungszusammenarbeit"
ISR_Shared_Research_desc:0	""
ISR_knesset_category:0	"Die [ISR.GetAdjective] Knesset"
open_parliament_gui:0	"Neustart der Knesset"
ISR_seat_tt:0	"[ISR_seat_party]"
ISR_party_1:0	"§RMaki§! - Eine kommunistische Partei, die während der britischen Mandatszeit aus der Palästinensischen Kommunistischen Partei hervorging und für eine leninistische Einstaatenunion eintrat, die mit der UdSSR im Einklang stand."
ISR_party_2:0	"§OHashomer Hatsair§! - Eine radikale sozialistische Partei, die sich von David Ben-Gurions Mapai unterscheidet, sich mit der Sowjetunion verbünden will und großen Rückhalt unter den ländlichen jüdischen Kibbuzim hat. Sie tritt für eine zurückhaltende Politik gegenüber der arabischen Welt ein und befürwortet die Koexistenz."
ISR_party_3:0	"§A Mapai§! - Eine demokratische sozialistische Partei, die sich von Hashomer Hatsair dadurch unterscheidet, dass sie sich mit dem Westen verbündet und eine größere Unterstützung unter dem städtischen Proletariat hat. Historisch gesehen war die Mapai sehr pragmatisch und bereit, mit den britischen Behörden zusammenzuarbeiten. Mapai und ihre Vorgänger haben die zionistische Bewegung seit der Zweiten Alijah dominiert."
ISR_party_4:0	"§8Neue Aliyah§! - Eine sozialliberale Partei, die von Flüchtlingen der Fünften Aliyah aus Deutschland und Österreich gegründet wurde. Ihre Hauptziele sind die weitere Ausdehnung der Aliyah und die technologische Entwicklung Israels in das moderne Zeitalter."
ISR_party_5:0	"§Allgemeine Zionisten§! - Eine kapitalistische liberale Partei, die ursprünglich von Theodore Herzl selbst gegründet wurde. Sie spricht vor allem die städtische Mittelschicht an und legt einen starken Fokus auf persönliche Freiheiten."
ISR_party_6:0	"§3Hatzohar§! - Eine konservative Partei, die durch den Zustrom von jüdischen Flüchtlingen aus der arabischen Welt viel Unterstützung erhielt. Hatzohar unterscheidet sich von allen anderen Parteien dadurch, dass sie sich vom Jischuw getrennt hat und während der Mandatszeit eine eigene Miliz, die Irgun, hatte. Als solche wird sie als Paria-Partei angesehen und genießt nicht viel öffentliche Unterstützung."
ISR_party_7:0	"§2United Religious Front§! - Ein Zweckbündnis zwischen vielen verschiedenen religiösen Parteien, die sich für den Erhalt der religiösen Gesetze in Israel einsetzen."
ISR_party_8:0	"Leer - wird nach den Wahlen neu besetzt werden."
