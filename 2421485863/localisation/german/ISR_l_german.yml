ISR_vote_category_desc:0	"In der Knesset wird derzeit über ein Gesetz abgestimmt. Um es zu verabschieden, müssen wir eine Mehrheit der Parteien erreichen, die 61 Sitze beträgt. \n\n[?ISR_yes_votes] - Dafür:\n[ISRGetMakiVoteYes][ISRGetHashomerVoteYes][ISRGetMapaiVoteYes][ISRGetNewAliyahVoteYes][ISRGetGeneralZionistsVoteYes][ISRGetHatzoharVoteYes][ISRGetURFVoteYes]\n[?ISR_no_votes] - Dagegen:\n[ISRGetMakiVoteNo][ISRGetHashomerVoteNo][ISRGetMapaiVoteNo][ISRGetNewAliyahVoteNo][ISRGetGeneralZionistsVoteNo][ISRGetHatzoharVoteNo][ISRGetURFVoteNo]"
ISR_constitution_category:0	"Die [ISR.GetAdjective] Verfassung"
ISR_constitution_category_desc:0	"Unsere Nation hat keine Verfassung, was ein Risiko für unsere demokratischen Institute darstellt, da es keine festgelegten Aufgaben für alle Funktionen der Regierung gibt. Wir müssen versuchen, eine zu entwerfen, aber stellen Sie sicher, dass Sie nicht zu viele Teile der Bevölkerung gegen sich aufbringen, sonst könnten die Verhandlungen scheitern.\n\nParteien, die die Verfassung derzeit unterstützen:\n[ISRGetMakiConstitutionYes][ISRGetHashomerConstitutionYes][ISRGetMapaiConstitutionYes][ISRGetNewAliyahConstitutionYes][ISRGetGeneralZionistsConstitutionYes][ISRGetHatzoharConstitutionYes][ISRGetURFConstitutionYes]\nStimmen insgesamt: §Y[?ISR_constitution_votes]/61"
