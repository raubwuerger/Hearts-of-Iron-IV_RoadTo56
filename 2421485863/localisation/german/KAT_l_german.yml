KAT_neutrality_party:	"Convention Nationale Katangaise"
KAT_neutrality_party_long:	"Convention Nationale Katangaise"
KAT_democratic_party:	"CONAKAT"
KAT_democratic_party_long:	"Confédération des Associations Tribales du Katanga"
KAT_the_geological_scandal:0	"Der geologische Skandal"
KAT_the_geological_scandal_desc:0	"Mit seinem Untergrund, der reich an riesigen Mengen einer Vielzahl von Mineralien ist, ist Katanga als "geologischer Skandal" bekannt. Jeder nationale Wirtschaftsplan sollte sich auf die Entwicklung unserer Förderkapazitäten konzentrieren."
KAT_gold_mining:0	"Ausbau der Goldförderung"
KAT_gold_mining_desc:0	"Das Vorkommen von Gold, Diamanten und anderen wertvollen Erzen würde uns direkte Einnahmen verschaffen, um unsere Entwicklung fortzusetzen."
KAT_katangese_copper:0	"Kupfer aus Katanga"
KAT_katangese_copper_desc:0	"Kupfer ist das wichtigste in Katanga vorkommende Erz. Es wird sogar von den Einheimischen gesammelt, um die "Croisettes" herzustellen, die kleinen Kreuze, die zu unserem nationalen Emblem geworden sind und auf unserer Flagge zu sehen sind."
KAT_rare_minerals:0	"Die anderen Elemente nutzen"
KAT_rare_minerals_desc:0	"Das Vorkommen von Kobalt, Molybdän und anderen Elementen könnte uns oder unseren Kunden helfen, Nischenlegierungen herzustellen. Selbst die Abfälle einiger Minen enthalten genug seltene Materialien, um die Gewinnung dieser Elemente zu rechtfertigen."
KAT_exploit_the_yellowcake:0	"Das reichhaltigste Uranerz nutzen"
KAT_exploit_the_yellowcake_desc:0	"Das Uranerz aus der Mine von Tchinkolobwe ist das reichhaltigste der Welt."
