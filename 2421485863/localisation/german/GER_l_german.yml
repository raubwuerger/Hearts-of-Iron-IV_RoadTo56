GER_offer_concessions_to_the_elites:	"Zugeständnisse an die Eliten"
GER_offer_concessions_to_the_elites_desc:	"Die Eliten können unserem Regime von großem Nutzen sein. Lassen Sie uns dies nutzen und das Beste daraus machen."
GER_alliance_with_the_united_evangelical_church:	"Bündnis mit der Vereinigten Evangelischen Kirche"
GER_alliance_with_the_united_evangelical_church_desc:	"Als erzwungener Zusammenschluss der calvinistischen und lutherischen Kirche war die Vereinigte Evangelische Kirche die bevorzugte Kirche der Hohenzollern und ein einzigartiger fester Bestandteil der deutschen Religionslandschaft. Lassen Sie uns nun mit ihr zusammenarbeiten und dieses Bündnis festigen."
GER_end_the_divide_between_state_and_church:	"Beenden Sie die Trennung von Staat und Kirche"
GER_end_the_divide_between_state_and_church_desc:	"Staat und Kirche wurden durch die gottlose Weimarer Republik getrennt; lassen Sie uns diesen widerwärtigen Status quo beenden."
GER_coopt_the_sa:	"Die SA kooptieren"
GER_coopt_the_sa_desc:	"Zwar konnten wir bisher nicht angemessen mit der SA umgehen, doch können wir sie kooptieren, anstatt sie zu bekämpfen, wodurch wir im Gegenzug für ihre Erhaltung große Vorteile erlangen."
GER_towards_national_militarization:	"Streben Sie nach nationaler Militarisierung"
GER_towards_national_militarization_desc:	"Wir müssen auf einen Zustand hinarbeiten, in dem die gesamte Nation mobilisiert und militarisiert ist, wenn wir uns gegen die entarteten Horden um uns herum behaupten wollen!"
GER_noble_advisors:	" Wiedereinführung adeliger Berater im Heer"
GER_noble_advisors_desc:	"Das Heer funktionierte am besten unter der sorgfältigen Aufsicht und Führung adeliger Berater. Lassen Sie uns daher dieses alte System wieder einführen und diese weisen Führungspersönlichkeiten in die Armee aufnehmen."
GER_cleanse_the_kaiser_wilhelm_institute:	"Säuberung und Ausbau des Kaiser-Wilhelm-Instituts"
GER_cleanse_the_kaiser_wilhelm_institute_desc:	"Das Kaiser-Wilhelm-Institut wurde von den Nazis vereinnahmt; lassen Sie uns es von diesem entarteten Einfluss säubern und zu neuen Höhen ausbauen!"
GER_import_soviet_sciences:	"Sowjetische Wissenschaft kopieren"
GER_import_soviet_sciences_desc:	"Wir müssen die sowjetischen Wissenschaftler kopieren und das, woran sie gearbeitet haben, nutzen, um unseren Weg zu ebnen."
GER_return_to_german_brilliance:	"Rückkehr zur deutschen Brillanz"
GER_return_to_german_brilliance_desc:	"Germany once dominated the field of science. Let us return to this status quo and bring back our scientific prowess!"
GER_secure_western_science_funding:	"Fördermittel für die westliche Wissenschaft beschaffen"
GER_secure_western_science_funding_desc:	"Wenn unsere Wissenschaften gedeihen sollen, brauchen wir mehr Mittel – wenden wir uns an unsere neuen Freunde, um diese zu sichern!"
GER_bring_the_kaiserreich_back_to_the_forefront_of_development:	"Die wissenschaftliche Vorrangstellung des Reichs wiederherstellen"
GER_bring_the_kaiserreich_back_to_the_forefront_of_development_desc:	"Das Kaiserreich war einst die Heimat einer der brillantesten Nationen der Welt – lasst uns dies zurückholen und wiederherstellen!"
GER_towards_a_european_research_sphere:	"Auf dem Weg zu einem europäischen Forschungsraum"
GER_towards_a_european_research_sphere_desc:	"Wenn wir gedeihen wollen, müssen wir zusammenarbeiten und unsere Arbeit teilen – lasst uns daher danach streben, uns in dieser Hinsicht gegenseitig zu helfen."
GER_r56_glorious_mechanical_mechanations:	"$GER_glorious_mechanical_machinations$"
GER_r56_glorious_mechanical_mechanations_desc:	"$GER_glorious_mechanical_machinations_desc$"
GER_end_the_german_brain_drain:	"$GER_reverse_the_brain_drain_ww$"
GER_end_the_german_brain_drain_desc:	"$GER_reverse_the_brain_drain_ww_desc$"
GER_r56_shared_r_and_d_programs:	"$GER_shared_rd_programs_ww$"
GER_r56_shared_r_and_d_programs_desc:	"$GER_shared_rd_programs_ww_desc$"
GER_r56_pool_technical_know_how:	"$GER_pool_technical_know_how_ww$"
GER_r56_pool_technical_know_how_desc:	"$GER_pool_technical_know_how_ww_desc$"
GER_r56_mannheim_project:	"$GER_the_mannheim_project_ww$"
GER_r56_mannheim_project_desc:	"$GER_the_mannheim_project_ww_desc$"
GER_approach_the_anglosphere:	"Annäherung an die Anglosphäre"
GER_approach_the_anglosphere_desc:	"Die Anglosphäre verbindet viele kulturelle Bindungen mit uns Deutschen und übt zudem weltweit Einfluss aus. Wir sollten uns gezielt darum bemühen, die Nationen in ihr für uns zu gewinnen, um unseren Einfluss auszuweiten und zu gedeihen."
GER_open_up_a_latin_connection:	"Eine Verbindung zu Lateinamerika herstellen"
GER_open_up_a_latin_connection_desc:	"In Lateinamerika leben viele ethnische Deutsche, und darüber hinaus bewundern viele Menschen dort unsere Kultur. Nutzen wir dies daher zu unserem Vorteil, um eine konkrete Verbindung zu diesen ressourcenreichen und strategisch gut gelegenen Nationen zu knüpfen."
GER_establish_the_european_coal_and_steel_community:	"Gründung der Europäischen Gemeinschaft für Kohle und Stahl"
GER_establish_the_european_coal_and_steel_community_desc:	"Wenn Europa gedeihen soll, muss es zusammenarbeiten. Nur durch die Bündelung von Ressourcen und den Austausch kritischer Güter kann Wohlstand für alle erreicht werden. Daher ist es von größter Bedeutung, dass wir sicherstellen, dass alle europäischen Nationen Zugang zu Kohle und Stahl für ihre zivilen Volkswirtschaften haben."
GER_encircle_the_entente_powers:	"Die Entente-Mächte einkreisen"
GER_encircle_the_entente_powers_desc:	"Sollte es uns gelingen, Iberien für unsere Fraktion zu gewinnen, könnten wir die Franzosen einkreisen und gleichzeitig eine ideale Ausgangsposition für die Eroberung Gibraltars erlangen, wodurch wir unsere Macht auf Kosten der alten Entente erheblich stärken würden. Sie mögen uns einmal besiegt haben, aber das wird ihnen nicht noch einmal gelingen!"
GER_fight_the_apo:	"Den Kampf zum Feind tragen"
GER_fight_the_apo_desc:	"Der Schutz unserer eigenen demokratischen Institutionen reicht nicht aus. Stattdessen müssen wir uns darauf konzentrieren, den Kampf zum Feind zu tragen, die Stützpunkte der SA und der Antifaschistischen Aktion zu zerstören und weitere Dissidenz und Aufstände gegen unsere große Republik zu verhindern!"
GER_GER_fate_of_nazism:	"Entscheiden Sie über das Schicksal des Nationalsozialismus"
GER_GER_fate_of_nazism_desc:	"Nachdem die Illusion der Allmacht des Nationalsozialismus zerbrochen ist, ist es nun an der Zeit zu entscheiden, was mit den Kernidealen dieser Bewegung geschehen soll. Sind sie in gewisser begrenzter Form verständlich und verzeihbar, oder sind sie durch und durch böse und ein Schandfleck der deutschen Geschichte?"
GER_an_outstreched_arm_towards_the_east:	"Eine ausgestreckte Hand nach Osten"
GER_an_outstreched_arm_towards_the_east_desc:	"Ob Sie es glauben oder nicht, es scheint, als gäbe es zumindest einige vernünftige Menschen in Russland; lassen Sie uns mit ihnen sprechen und gemeinsam daran arbeiten, den Frieden zu sichern!"
GER_heavy_handed_foreign_policy:	"Verfolgen Sie eine harte Außenpolitik"
GER_heavy_handed_foreign_policy_desc:	"In der Diplomatie muss man entschlossen und schnell handeln; lassen Sie uns dies unbedingt umsetzen, auch wenn dabei vielleicht die eine oder andere Eierschale zerbricht."
GER_liberation_for_the_sudetendeutsche:	"Befreien Sie die Sudetendeutschen"
GER_liberation_for_the_sudetendeutsche_desc:	"Die Sudetendeutschen werden seit langem von den Tschechen unterdrückt; es ist an der Zeit, sie nach Hause ins Reich zu holen und sie von ihren Fesseln zu befreien!"
GER_open_the_asia_department:	" "Richten Sie den Blick auf den Fernen Osten"
GER_open_the_asia_department_desc:	"Unsere Diplomatie darf sich nicht nur auf Europa beschränken, sondern wir müssen unseren Blick nach außen richten, in Richtung Fernost. In Asien können wir neue Verbündete finden und neue Stützpunkte sichern, um unseren Einflussbereich zu erweitern und unseren Feinden entgegenzutreten."
GER_align_the_balkans:	"Den Balkan unter unsere Kontrolle bringen"
GER_align_the_balkans_desc:	"Der Balkan ist das ideale Feld, um unseren Einfluss auszuweiten. Wir werden ihn dort ausbreiten und so viel davon sichern, wie wir können. Schließlich müssen wir ein Bündnis aufbauen, um für den Krieg bereit zu sein!"
GER_solve_the_economic_catastrophe:	"Die wirtschaftliche Katastrophe lösen"
GER_solve_the_economic_catastrophe_desc:	"Die Nazis haben die Wirtschaft mit MEFO-Wechseln und anderen Maßnahmen zur kurzfristigen Ankurbelung der Konjunktur zugrunde gerichtet. Dadurch ist sie brüchig geworden und steht kurz vor dem Zusammenbruch. Wir müssen diese Krise angehen und verhindern, dass sie außer Kontrolle gerät. Allerdings wäre dies mit hohen Kosten verbunden und könnte der Wirtschaft möglicherweise noch mehr schaden. Ungeachtet dessen muss etwas unternommen werden!"
GER_solve_the_economic_catastrophe_r56:	"Die Wirtschaftskatastrophe lösen"
GER_solve_the_economic_catastrophe_r56_desc:	"Die Nazis haben die Wirtschaft mit MEFO-Wechseln und anderen Maßnahmen zur kurzfristigen Ankurbelung der Wirtschaft zugrunde gerichtet. Dadurch ist sie brüchig geworden und steht kurz vor dem Zusammenbruch. Wir müssen diese Krise angehen und verhindern, dass sie außer Kontrolle gerät. Dies wäre zwar mit erheblichen Kosten verbunden und könnte der Wirtschaft möglicherweise noch mehr schaden. Dennoch muss etwas unternommen werden! "
GER_expand_control_over_the_wehrmacht:	"Direkte Kontrolle über das Heer übernehmen"
GER_expand_control_over_the_wehrmacht_desc:	"Das Heer hat dem Kaiser zu gehorchen, nicht umgekehrt; lassen Sie uns daher seine Kontrolle über diese Organisation ausweiten und ihn zu ihrem Oberbefehlshaber ernennen."
GER_reforge_the_stahlhelm:	"Den Stahlhelm neu gründen"
GER_reforge_the_stahlhelm_desc:	"Wir hatten einst enge Verbindungen zum Stahlhelm, bis dieser von den Nazis aufgelöst wurde. Lassen Sie uns ihn wieder aufbauen und sicherstellen, dass diese großartige Organisation, die unserer Nation einst so gute Dienste geleistet hat, angemessen belohnt wird! "
GER_a_patriotic_monarchy:	"Eine patriotische Monarchie"
GER_a_patriotic_monarchy_desc:	"Die Monarchie muss die Nation vereinen und beliebt sein, wenn sie überleben und eine weitere Revolution verhindern soll."
GER_clear_the_facist_lair:	"Räumt die faschistische Höhle"
GER_clear_the_facist_lair_desc:	"Der Faschismus breitete sich ursprünglich von Italien aus bei uns aus; wenn wir sicherstellen wollen, dass er nie wieder zu uns zurückkehrt, müssen wir sie und ihre Ideologie ein für alle Mal vernichten!"
GER_a_human_face_for_europe:	"Ein menschliches Gesicht für Osteuropa"
GER_a_human_face_for_europe_desc:	"Osteuropa soll nun ein neues Licht erblicken! Wir werden es vor der sowjetischen Bedrohung verteidigen und für Stabilität und Frieden im Osten sorgen!"
GER_vanquish_the_eastern_threat:	" Die [SOV.GetAdjective] Bedrohung besiegen"
GER_vanquish_the_eastern_threat_desc:	"Der [SOV.GetAdjective] Staat verursacht ständig Probleme und schürt den Krieg noch mehr als Hitler es jemals tat. Lassen Sie uns den Kontinent retten und diese existenzielle Bedrohung auslöschen!"
GER_increase_factional_defenses:	" "Stärken Sie die Verteidigung der Fraktionen"
GER_increase_factional_defenses_desc:	"Wenn unsere Allianz sicher sein soll, müssen wir ihre Verteidigung stärken und sicherstellen, dass sie unter keinen Umständen untergeht!"
GER_a_europe_of_the_fatherlands:	"Sichern Sie ein Europa der Vaterländer"
GER_a_europe_of_the_fatherlands_desc:	"Der Schlüssel zu einem starken Europa liegt darin, dass alle Nationen ihre Souveränität bewahren – lassen Sie uns dies als Ziel anstreben!"
GER_a_europe_around_the_reich:	"Europa um das Vaterland herum aufbauen"
GER_a_europe_around_the_reich_desc:	"Deutschland soll das Herzstück und der Schlüssel Europas sein, um es zu führen und zu lenken und so seine fortwährende Größe zu sichern!"
GER_reestablish_colonial_claims:	"Kolonialansprüche wiederherstellen"
GER_reestablish_colonial_claims_desc:	"Nach dem Großen Krieg wurden uns unsere Kolonien zu Unrecht genommen; nun ist es an der Zeit, unsere wertvollsten Besitztümer zurückzufordern und wiederherzustellen!"
GER_reapproach_the_west:	"Den Westen versöhnen"
GER_reapproach_the_west_desc:	"All die Feindseligkeiten zwischen uns und den Franzosen und Briten sind reine Verschwendung; lassen Sie uns eine Annäherung an sie und eine neue Freundschaft anstreben!"
GER_rekindle_the_franco_german_rivalry:	"Die deutsch-französische Rivalität neu entfachen"
GER_rekindle_the_franco_german_rivalry_desc:	"Die Franzosen waren lange Zeit unsere Feinde und sind es immer noch. Wir sollen nicht länger so tun, als kämen wir gut miteinander aus, sondern uns stattdessen auf den Krieg vorbereiten und mit diesem Abschaum abrechnen!"
GER_renegotiate_versailles_new:	"Den Locarno-Pakt neu verhandeln"
GER_renegotiate_versailles_new_desc:	"Der Locarno-Pakt war der erste Schritt in die richtige Richtung und diente dazu, Vernunft und Gerechtigkeit in den Vertrag von Versailles zu bringen. Trotzdem war es nur ein erster Schritt in die richtige Richtung. Da wir nun bei den Franzosen in guter Gunst stehen, sollten wir diesen Vertrag unter noch positiveren Bedingungen neu verhandeln, wie etwa eine nicht unveränderliche Westgrenze, geringere militärische Beschränkungen und bessere Handelsbeziehungen, zusammen mit weitaus geringeren Reparationszahlungen, damit Deutschland wirklich gedeihen kann, ohne dass ein weiterer Krieg notwendig wird!"
GER_germans_everywhere_united:	"Deutsche überall vereint"
GER_germans_everywhere_united_desc:	"Die Deutschen sind endlich unter einem Staat vereint! Lassen Sie uns über diese Tatsache und über unseren großen Führer, der dies bewirkt hat, jubeln!"
GER_end_the_austria_debate:	"Beenden Sie die Österreich-Debatte"
GER_end_the_austria_debate_desc:	"Das Schicksal Österreichs ist seit langem ein viel diskutiertes Thema; einige schlagen eine vollständige Vereinigung vor, andere zwei getrennte Staaten – wir müssen daran arbeiten, eine Lösung hierfür zu finden."
GER_solve_the_danzig_issue:	"Lösen Sie die Danzig-Frage"
GER_solve_the_danzig_issue_desc:	"Danzig ist deutsch und wird es immer bleiben; daher werden wir diese Frage lösen und darauf hinarbeiten, dass die Unterdrückung unserer Landsleute ein Ende findet!"
GER_move_to_restore_brest_litovsk:	"Maßnahmen zur Wiederherstellung von Brest-Litowsk"
GER_move_to_restore_brest_litovsk_desc:	"Das Deutsche Reich hatte nie mehr Einfluss als unter dem Vertrag von Brest-Litowsk. Dieser Vertrag muss wiederhergestellt werden, um die Größe, den Ruhm und den Einfluss des Deutschen Reiches wiederherzustellen. Ganz Osteuropa soll vor dem neuen Deutschland zittern und niederknien!"
GER_reaffirm_territorial_claims:	"Ethnische Ansprüche bekräftigen"
GER_reaffirm_territorial_claims_desc:	"Nachdem wir nach dem Großen Krieg so manches deutsche Land verloren haben, müssen wir dies rückgängig machen und nach der Vereinigung und Rettung des deutschen Volkes streben!"
GER_build_a_pakt_around_berlin:	"Einen Pakt um Berlin herum schmieden"
GER_build_a_pakt_around_berlin_desc:	"Berlin war schon immer das Zentrum der europäischen Politik; wir werden daher einen Pakt um Berlin herum schmieden, der größer und einflussreicher sein wird, als es die Mittelmächte jemals waren!"
GER_step_back_into_the_international_community:	"Rückkehr auf die internationale Bühne"
GER_step_back_into_the_international_community_desc:	"Es ist an der Zeit, dass das neue Deutschland eine groß angelegte Außenpolitik betreibt und neue Verbündete gewinnt!"
GER_control_the_press:	"Kontrolle der Presse"
GER_control_the_press_desc:	"Die Presse ist der Schlüssel zur Sicherung Deutschlands für den Kaiser. Wir müssen die Kontrolle darüber übernehmen, wenn wir eine vollständige Wiederherstellung erreichen wollen!"
GER_embark_on_the_quest_to_absolutism:	"Beginnen Sie das Streben nach Absolutismus"
GER_embark_on_the_quest_to_absolutism_desc:	"Es ist an der Zeit, zum Absolutismus zurückzukehren, die Nation um den Kaiser herum zu zentralisieren und sie von Beck abzuwenden!"
GER_expand_liberalization_efforts:	"Liberalisierungsbemühungen ausweiten"
GER_expand_liberalization_efforts_desc:	"Die Nation muss liberalisiert werden, wenn sie in eine neue Zukunft gehen soll. Der Kaiser wird dabei helfen, dies zu erreichen. "
GER_prepare_the_new_era:	"Bereiten Sie die neue Ära vor"
GER_prepare_the_new_era_desc:	"Es ist nun endlich an der Zeit, zu einem sehr begrenzten parlamentarischen System überzugehen. Beck und Louis Ferdinand haben gesprochen und nun alles vorbereitet."
GER_bring_back_the_old_heirarchy:	"Die alte Hierarchie wiederherstellen"
GER_bring_back_the_old_heirarchy_desc:	"Die alte Hierarchie Deutschlands muss wiederhergestellt werden! Die Eliten müssen regieren und die Nation vorwärts führen."
GER_a_germany_of_the_elites:	"Ein Deutschland der Eliten"
GER_a_germany_of_the_elites_desc:	"Wir haben es geschafft! Deutschland ist wieder so, wie es einst war: Wir und unsere weisen Eliten regieren die Nation und können sie zu Ruhm führen!"
GER_work_with_the_aristocracy:	"Zusammenarbeit mit dem Adel"
GER_work_with_the_aristocracy_desc:	"Der Adel ist das Herz Deutschlands! Er ist der Schlüssel zur Wiederherstellung von Wohlstand und Größe in unserem Staat und unter unserem Volk!"
GER_natural_leadership_for_the_best_men:	"Natürliche Führung für die besten Männer"
GER_natural_leadership_for_the_best_men_desc:	" Der Kaiser, der beste Mann, muss die Nation regieren. Er wird sie und uns alle zum Sieg führen!"
GER_espouse_voelkish_nationalism:	"Befürworten Sie den völkischen Nationalismus"
GER_espouse_voelkish_nationalism_desc:	"Der Kaiser und das Volk sind eins und eines Blutes. Lassen Sie uns diese Ideologie unterstützen und befürworten, um die Nation um ihn zu scharen!"
GER_radicalize_the_army:	"Radikalisieren Sie die Armee"
GER_radicalize_the_army_desc:	"Die Begeisterung in der Armee wird sich ausbreiten und zur Begeisterung unter dem Volk werden. Lassen Sie uns dies ausweiten und radikalisieren, um die Nation vollständig zu beherrschen!"
GER_achieve_national_renewal:	"Nationale Erneuerung erreichen"
GER_achieve_national_renewal_desc:	"Es ist an der Zeit, unsere Nation zu erneuern und sie von der republikanischen Ära zu befreien! Entartung wird die Nation nicht länger beherrschen."
GER_build_a_cult_of_personality:	"Einen Personenkult aufbauen"
GER_build_a_cult_of_personality_desc:	"Wenn das neue Kaiserreich gedeihen soll, wird ein Personenkult der Schlüssel dazu sein. Niemand wird sich dem Kaiser widersetzen können!"
GER_secure_the_armys_support:	"Sichern Sie sich die Unterstützung der Armee"
GER_secure_the_armys_support_desc:	"Die Unterstützung der Armee ist entscheidend, und um sie zu sichern, werden die Verbindungen Wilhelms III. mit großem Erfolg genutzt werden!"
GER_personal_leadership:	"Übernehmen Sie das Feldkommando"
GER_personal_leadership_desc:	 "Die Zeit ist gekommen, dass der Kaiser die Armee wieder ins Feld führt. Mit ihm werden wir unseren Feinden verheerenden Schaden zufügen."
GER_reach_out_to_old_allies:	"Wenden Sie sich an alte Verbündete"
GER_reach_out_to_old_allies_desc:	"Eine Methode, um Staat und Volk schnell zu sichern, wäre es, die Hilfe der Nazis in Anspruch zu nehmen und eine Monarchie zu schmieden, die im Volk und auf Popularität gründet."
GER_distance_from_past_mistakes:	"Den Kaiser von seinen Fehlern distanzieren"
GER_distance_from_past_mistakes_desc:	"Der Kaiser stand einst in enger Verbindung zu den Nazis und Hitler. Wir müssen dies rückgängig machen, wenn er seine Macht behalten soll."
GER_full_rehabilitation:	"Den Kaiser vollständig rehabilitieren"
GER_full_rehabilitation_desc:	"Da der Kaiser bewiesen hat, dass seine wahre Loyalität den guten Männern gilt, kann er nun vollständig rehabilitiert werden."
GER_fufill_the_legacy_of_rohm:	"Röhm’s Vermächtnis erfüllen"
GER_fufill_the_legacy_of_rohm_desc:	"Es war Röhm, der die SA groß gemacht hat. Machen wir ihn zum Vorbild und erfüllen wir sein Vermächtnis! Die NRAF ist voller Röhm-Erben!"
GER_the_president_for_life:	"Den Präsidenten auf Lebenszeit einsetzen"
GER_the_president_for_life_desc:	"Da die Parteien aufgelöst sind, können wir Strasser nun zum Präsidenten auf Lebenszeit ernennen und so jede Möglichkeit ausschließen, seine Macht zu untergraben."
GER_end_political_parties:	"Schluss mit den politischen Parteien"
GER_end_political_parties_desc:	"Politische Parteien sind zu schädlich und zerstörerisch für das Reich. Sie müssen alle verschwinden, da die NRAF ihren Zweck erfüllt hat!"
GER_remove_fatherlandless_fellows_from_power:	"Entlassen Sie die Vaterlandslosen"
GER_remove_fatherlandless_fellows_from_power_desc:	"Beck und seine Verbündeten im Militär müssen entlassen und aus allen Machtpositionen entfernt werden. Der Kaiser wird die einzige Machtquelle im Reich sein!"
GER_rely_on_divine_right:	"Verlassen Sie sich auf das göttliche Recht"
GER_rely_on_divine_right_desc:	"Wir regieren durch göttliches Recht. Nutzen wir dies in unserer Propaganda und stellen wir sicher, dass die Autorität des Kaisers unangefochten bleibt!"
GER_restore_the_fahneneid:	"Stellt den Fahneneid wieder her"
GER_restore_the_fahneneid_desc:	"Es muss wieder eingeführt werden, dass alle dem Kaiser Treue schwören müssen, insbesondere die Armee. Niemand wird sich seiner Herrschaft widersetzen! Alle grüßen den Kaiser!"
GER_restore_the_glories_of_the_bismarkian_era:	"Stellen Sie den Glanz der Bismarck-Ära wieder her"
GER_restore_the_glories_of_the_bismarkian_era_desc:	"Deutschland war zuletzt unter Bismarck wirklich glorreich! Lassen Sie uns die Macht des Kaisers von damals nachahmen und dafür sorgen, dass wir zu diesem Maßstab zurückkehren. Auch wenn der Kaiser nicht immer auf bestem Fuß mit ihm stand, ist er dennoch ein Held, zu dem wir aufschauen sollten."
GER_reconcile_the_crown_prince:	"Den Kronprinzen versöhnen"
GER_reconcile_the_crown_prince_desc:	"Zwar hat Ludwig Ferdinand kürzlich seinen Großvater verärgert, doch Wilhelm III. hat in der Vergangenheit weitaus Schlimmeres getan – schließlich hat er sich nicht für den Liberalismus eingesetzt. Daher soll der Vater den Sohn versöhnen und die Pläne wieder aufleben lassen, Wilhelm III. zum nächsten Kaiser zu machen. "
GER_the_old_man_still_has_it:	"Der alte Kaiser ist zurück"
GER_the_old_man_still_has_it_desc:	"Wilhelm II. hat es irgendwie geschafft, wieder an die Macht zu gelangen. Es scheint, als sei er zumindest vorerst noch in der Lage zu regieren ..."
GER_spread_order_under_the_kaiser:	"Ordnung unter dem Kaiser herstellen"
GER_spread_order_under_the_kaiser_desc:	"Ordnung muss in der Nation herrschen, wenn Deutschland stark sein soll. Lassen Sie uns daran arbeiten, die Nation unter dem Kaiser zu stabilisieren."
GER_deal_with_hugenberg:	"Mit Hugenberg abrechnen"
GER_deal_with_hugenberg_desc:	"Hugenberg ist verrückt und muss aus der DNVP-Führung entfernt werden. Lassen Sie uns diesen Mann entmachten und seinen Untergang sicherstellen!"
GER_the_past_purified:	"Die Vergangenheit gereinigt"
GER_the_past_purified_desc:	"Durch unsere Arbeit haben wir zwei Aspekte unserer Nation gereinigt. Einerseits haben wir uns mit den noch immer bestehenden nationalsozialistischen Idealen auseinandergesetzt, und andererseits haben wir ein größeres und besseres Kaiserreich geschaffen. Lassen Sie uns darüber frohlocken!"
GER_spread_ideals_of_soldierly_conscience:	"Verbreiten Sie die Ideale eines soldatischen Gewissens"
GER_spread_ideals_of_soldierly_conscience_desc:	"Unsere Soldaten müssen verstehen, dass sie zuerst Gott und dann ihrer Nation dienen sollen. Daher sollten sie ihre Feinde mit Respekt und Freundlichkeit behandeln und die lokale Bevölkerung nicht misshandeln, sondern gut und für das Richtige kämpfen."
GER_embrace_christian_humanism:	"Christlichen Humanismus annehmen"
GER_embrace_christian_humanism_desc:	"Wir müssen christliche Werte annehmen und unser Volk in den Mittelpunkt stellen, indem wir dazu beitragen, das Land zu seinem Wohl zu gestalten, statt zum Wohl der Eliten."
GER_modernize_the_monarchy:	"Modernisierung der Monarchie"
GER_modernize_the_monarchy_desc:	"Die Monarchie muss sich an die neuen Zeiten anpassen, wenn sie Bestand haben soll. Wir werden die Ideale der Rechtsstaatlichkeit und dergleichen hochhalten, anstatt Absolutismus und Macht."
GER_an_old_germany_for_a_new_age:	"Ein altes Deutschland für ein neues Zeitalter"
GER_an_old_germany_for_a_new_age_desc:	"In vielerlei Hinsicht haben wir das alte Deutschland in unseren neuen Staat zurückgebracht. Wir können sowohl von Modernität und Technologie als auch von unseren Traditionen und Tugenden wahrhaft profitieren."
GER_fully_embrace_tradition:	"Tradition voll und ganz annehmen"
GER_fully_embrace_tradition_desc:	"Der erste Schritt zur genauen Einschätzung der Zukunft ist die korrekte Einschätzung der Vergangenheit. Daher werden wir uns die Dinge ansehen, die wir in der Vergangenheit richtig gemacht haben, und daraus lernen!"
GER_restore_discipline_in_the_military:	"Militärische Tradition verankern"
GER_restore_discipline_in_the_military_desc:	"Das Militär war stets nur durch die Stärke der preußischen Tugenden stark. Wenn wir diese verankern, können wir nun die disziplinierte Streitmacht wiederherstellen, die unsere Streitkräfte einst waren! Preußen soll erneut der unangefochtene Meister der europäischen militärischen Entwicklung sein!"
GER_a_guided_kaiserreich:	"Ein neues Kaiserreich führen"
GER_a_guided_kaiserreich_desc:	"Das letzte Mal, als Deutschland stabil war, war unter dem Kaiser. Wir sollten dorthin zurückkehren, jedoch mit klaren Maßnahmen, um sicherzustellen, dass es nicht wie beim letzten Mal endet."
GER_extol_prussian_virtue:	"Die preußischen Tugenden preisen "
GER_extol_prussian_virtue_desc:	"Die preußischen Tugenden haben Deutschland groß gemacht, und wir müssen sie wiederbeleben. Unser Volk muss sich nach diesen Werten sehnen und entsprechend handeln."
GER_the_kaiser_rises:	"Die Wiedergeburt des Kaiserreichs"
GER_the_kaiser_rises_desc:	"In der Ära Wilhelms I. und Bismarcks entstand, als diese beiden Männer aus einem Wirrwarr kleiner Staaten das Kaiserreich schmiedeten und es mit Gerechtigkeit und Macht regierten. An diesem Tag ist es uns gelungen, dieses großartige System unter dem neuen Kaiser und [GER.GetLeader], seiner rechten Hand, wiederherzustellen. Freuen wir uns über diese neue Hoffnung für Deutschland!"
GER_the_kaiser_rises_fake:	"Die Wiedergeburt des Kaiserreichs"
GER_the_kaiser_rises_fake_desc:	"Deutschland ist nun in der Zeit zurückgegangen, und während der Kaiser noch nicht wieder der ist, der er einst war, hat sich die Nation weit in diese Richtung bewegt."
GER_a_new_monarch_for_a_new_age:	"Der neue Kaiser an der Macht"
GER_a_new_monarch_for_a_new_age_desc:	"Nachdem der Kaiser nach der Abdankung seines Großvaters die Führung der deutschen Monarchie übernommen hat, wurde ihm nun große Macht über die Zukunft Deutschlands übertragen, und er ist bereit, die Nation in eine strahlende neue Zukunft zu führen!"
GER_politicize_the_abwehr:	 "Die Abwehr politisieren"
GER_politicize_the_abwehr_desc:	"Wenn der Staat überleben soll, müssen wir die Abwehr nutzen, um die Politik zu kontrollieren, damit alles unter unserer sorgfältigen Aufsicht geschieht. Niemand wird sich Canaris’ Herrschaft widersetzen!"
GER_found_the_new_german_state:	"Gründen Sie den neuen deutschen Staat"
GER_found_the_new_german_state_desc:	"Nachdem die Nazis besiegt sind, ist es an der Zeit, unseren Staat zu gründen und eine strahlende und neue Zukunft unter unserem neuen Regime zu sichern."
GER_deal_with_resistance_in_the_heer:	" "Mit dem Widerstand im Heer fertigwerden"
GER_deal_with_resistance_in_the_heer_desc:	"Becks Widerstand im Heer muss endlich beseitigt werden. Lassen Sie uns diese Opposition auflösen und diesen sinnlosen Widerstand zerschlagen."
GER_transfer_party_leadership_to_canaris:	"Die Kontrolle über die DNVP-Clique übernehmen"
GER_transfer_party_leadership_to_canaris_desc:	"Die DNVP ist eine recht unruhige Gruppe und neigt dazu, der VDP langfristig Probleme zu bereiten. Daher müssen wir eine Wahl unter allen DNVP-Mitgliedern inszenieren, um Canaris als Nachfolger von Goerdeler zum Vorsitzenden zu ernennen und so seine Macht zu legitimieren."
GER_integrate_the_zentrum:	"Das Zentrum integrieren"
GER_integrate_the_zentrum_desc:	"Die Integration des Zentrums, einer Partei voller religiöser Konservativer und einer Partei des Volkes, ist entscheidend, um uns die nötige Reichweite zu verschaffen. Dadurch wird ihre gesamte Unterstützung auf die VDP übergehen."
GER_integrate_the_monarchists:	"Die Monarchisten integrieren"
GER_integrate_the_monarchists_desc:	"Auch die Monarchisten sollten sich der VDP anschließen, was uns entscheidenden Einfluss unter einigen der militantesten Konservativen verschafft, diese beruhigt und unsere Macht stärkt. "
GER_integrate_the_dnvp:	"Integrieren Sie die DNVP"
GER_integrate_the_dnvp_desc:	"Die DNVP, Meister der Mobilisierung des Volkes und diejenigen, die Hitler gestürzt haben, werden für unsere Sache von entscheidender Bedeutung sein. Dies wird der VDP große Macht verleihen."
GER_unite_the_bearocratic_colossus:	"Vereinen Sie den bürokratischen Koloss"
GER_unite_the_bearocratic_colossus_desc:	"Durch unsere jüngsten Zusammenschlüsse ist die VDP zu einer etwas zersplitterten Partei geworden. Um dem entgegenzuwirken, werden wir daran arbeiten, diese große Zeltpartei zu vereinen und zu zentralisieren, um weiteren Fraktionszwist und Zusammenbruch zu verhindern."
GER_form_the_league_of_patriots:	"Gründen Sie die VDP"
GER_form_the_league_of_patriots_desc:	"Wir werden den "Verband Deutscher Patrioten", kurz VDP, gründen – eine große Partei deutscher Konservativer, die die Nation unter der Führung und Organisation von Beck erneut zu Ruhm und Stärke führen wird. Diese große Volkspartei wird uns dabei helfen, die Nation von der populistischen Tyrannei zu befreien, unter der sie unter Hitler stand."
GER_all_under_the_grey_emminence:	"Deutschland im Bann der grauen Eminenz"
GER_all_under_the_grey_emminence_desc:	"Canaris hat langsam begonnen, immer mehr Macht in der Nation an sich zu reißen, bis zu dem Punkt, dass er als die graue Eminenz bezeichnet wird. Es ist nun an der Zeit, dafür zu sorgen, dass alles über seinen Schreibtisch läuft."
GER_heirarchy_without_tyranny:	"Hierarchie ohne Tyrannei"
GER_heirarchy_without_tyranny_desc:	"Wir müssen zu den guten alten Zeiten zurückkehren, in denen die traditionelle Hierarchie noch bestand; jedoch dürfen wir dies nicht auf die Art und Weise tun, wie es die Nazis taten, sondern dürfen sie nicht durch Tyrannei durchsetzen."
GER_an_irresistable_moral_guide:	"Ein unwiderstehlicher moralischer Leitfaden"
GER_an_irresistable_moral_guide_desc:	"Um die Katastrophe zu verhindern, die die letzte Diktatur unter den Nazis darstellte, müssen wir dem deutschen Volk Moral beibringen und sicherstellen, dass es diese bis ins kleinste Detail befolgt."
GER_move_towards_autocracy:	"Sicherstellung eines eisernen Machtgriffs"
GER_move_towards_autocracy_desc:	"Deutschland befindet sich nicht in einer Lage, in der Selbstverwaltung möglich oder nachhaltig ist, wie die Weimarer Republik gezeigt hat. Daher muss die Regierung vollständig von Canaris geführt werden, um jegliche Opposition zu verhindern."
GER_forge_an_alliance_with_the_church:	"Ein Bündnis mit der Kirche schmieden"
GER_forge_an_alliance_with_the_church_desc:	"Deutschland ist eine christliche Nation, und wenn seine Regierung Bestand haben soll, muss sie daher mit der Kirche zusammenarbeiten."
GER_implement_state_religion:	"Eine Staatsreligion einführen"
GER_implement_state_religion_desc:	"Um unserer Verpflichtung gegenüber Gott nachzukommen, müssen wir nicht nur mit der Kirche zusammenarbeiten, sondern sie auch stärken. Zu diesem Zweck wird die Staatskirche vollständig wiederhergestellt und ausgebaut, wodurch die Weimarer Vorstellung von Säkularismus beendet wird."
GER_the_abwehrs_germany:	"Deutschland unter Canaris"
GER_the_abwehrs_germany_desc:	"Canaris und der Abwehr haben ihren Plan umgesetzt und erfolgreich die Führung unseres neuen Staates übernommen. Hoffen wir, dass dies uns in eine neue Ära des Lichts führen wird."
GER_a_guiding_hand_in_politics:	"Eine führende Hand in der Politik"
GER_a_guiding_hand_in_politics_desc:	"Politiker, die unkontrolliert bleiben, sind gefährlich; wir müssen stattdessen sicherstellen, dass sie klar von Beck geleitet werden, damit die Nation in Sicherheit bleibt."
GER_a_dictated_parliament:	"Ein Parlament handverlesen"
GER_a_dictated_parliament_desc:	"Für unseren Übergang zu einer stärker auf das Volk ausgerichteten Herrschaft werden wir uns selbst ein Parlament handverlesen, das uns dabei unterstützt."
GER_move_towards_responsible_governance:	" Auf dem Weg zu einer verantwortungsvollen Regierungsführung"
GER_move_towards_responsible_governance_desc:	"Deutschland muss eine verantwortungsvolle Regierung erhalten, und der Frieden muss wiederhergestellt werden, indem man mit den Faschisten abrechnet."
GER_an_era_of_honor:	"Ehre in der Gesellschaft verankern"
GER_an_era_of_honor_desc:	"Unsere Gesellschaft basiert auf gemeinsamen Werten und Ehre. Wir müssen diese Werte in unserem Volk verankern, wenn wir wieder aufblühen sollen."
GER_pass_the_beck_constiution:	"Verabschieden Sie die Beck-Verfassung"
GER_pass_the_beck_constiution_copy:	"Verabschieden Sie die Beck-Verfassung"
GER_pass_the_beck_constiution_desc:	"Die Zeit ist nun gekommen, verantwortungsvolle Regierungsführung wiederherzustellen. Damit werden wir eine neue Verfassung verabschieden und zu einem halbdemokratischen System übergehen, in dem Beck und die von ihm ausgewählten beiden Parteien, das Zentrum und die DNVP, uns eine strahlende Zukunft bescheren werden!"
GER_pass_the_beck_constiution_copy_desc:	"Die Zeit ist nun gekommen, verantwortungsvolle Regierungsführung wiederherzustellen. Damit werden wir eine neue Verfassung verabschieden und zu einem halbdemokratischen System übergehen, in dem Beck und die von ihm ausgewählten beiden Parteien, das Zentrum und die DNVP, uns eine strahlende Zukunft bescheren werden! "
GER_a_martial_state:	"Deutschland unter Beck"
GER_a_martial_state_desc:	"Beck hat alle seine Gegner entmachtet und die Kontrolle über Deutschland für seine konservative Clique gefestigt. Was daraus werden wird, bleibt abzuwarten. "
GER_restore_legality_to_germany:	"Wiederherstellung der Rechtmäßigkeit in der Politik"
GER_restore_legality_to_germany_desc:	"Politik muss auf Rechtmäßigkeit und Gerechtigkeit beruhen, wobei das Wohl aller Vorrang vor radikaler Ideologie haben muss."
GER_the_canaris_wilhelm_pakt:	"Sich die Unterstützung des Kaisers sichern"
GER_the_canaris_wilhelm_pakt_desc:	"Die Unterstützung des Kaisers wird unsere Herrschaft legitimieren. Wir werden ein Abkommen mit ihm unterzeichnen, das ihn zum konstitutionellen Monarchen macht."
GER_expand_the_abwehr_supremacy:	"Die Vorherrschaft der Abwehr ausbauen"
GER_expand_the_abwehr_supremacy_desc:	"Die Abwehr ist der Schlüssel zur Aufrechterhaltung der Kontrolle. Durch sie werden alle abweichenden Meinungen aufgespürt und zerschlagen, wodurch die Sicherheit der Republik gewährleistet wird!"
GER_install_a_loyal_army_chief:	"Einen loyalen Armeechef einsetzen"
GER_install_a_loyal_army_chief_desc:	"Da Teile des Militärs Widerstand leisten, müssen wir einen loyalen Armeechef einsetzen, um sicherzustellen, dass die Armee davon Abstand nimmt, unsere Nation zu destabilisieren."
GER_form_the_presidency:	"[GER_form_the_presidency_scripted]"
GER_form_the_presidency_desc:	" [GER_form_the_presidency_desc_scripted]"
GER_form_the_presidency_dem:	"Das Präsidentenamt einführen"
GER_form_the_presidency_dem_desc:	"Deutschland braucht einen starken Präsidenten, wenn es gedeihen soll, und wen hätten wir dafür als besseren Mann als Canaris selbst, der so viel für die Rettung der Nation getan hat?"
GER_form_the_presidency_mon:	"Die Monarchie einführen"
GER_form_the_presidency_mon_desc:	"Deutschland braucht eine starke Monarchie, um zu gedeihen, und wen hätten wir dafür als besseren Mann als Wilhelm IV. selbst, der so viel für die Rettung der Nation getan hat?"
GER_an_iron_fist_on_the_state:	"Eine eiserne Faust über den Staat"
GER_an_iron_fist_on_the_state_desc:	"Die Abwehr muss mit eiserner Faust regieren und verhindern, dass Dissens so weit eskaliert, dass unsere Herrschaft bedroht wird ..."
GER_loose_the_abwehr_on_the_opposition:	"Lassen Sie die Abwehr auf die Opposition los"
GER_loose_the_abwehr_on_the_opposition_desc:	"Wir müssen die Abwehr nun nach innen richten und uns mit der Opposition gegen unseren Staat befassen. Diese Dissidenz darf nicht toleriert werden!"
GER_offer_goerdeler_reconciliation:	"Bieten Sie Goerdeler Versöhnung an"
GER_offer_goerdeler_reconciliation_desc:	"Wir müssen auf Goerdeler und den verbleibenden demokratischen Widerstand zugehen, wenn wir einen langfristigen Frieden in Deutschland herbeiführen wollen."
GER_declare_the_presidential_republic:	"[GER_declare_the_presidential_republic_scripted]"
GER_declare_the_presidential_republic_desc:	"[GER_declare_the_presidential_republic_scripted_desc]"
GER_declare_the_presidential_republic_dem:	"Rufen Sie die Präsidialrepublik aus"
GER_declare_the_presidential_republic_dem_desc:	"Da nun alles bereit ist, ist es an der Zeit, die Präsidialrepublik auszurufen und unserem armen Volk Demokratie zu bringen."
GER_declare_the_presidential_republic_mon:	"Den Weg für Neuwahlen ebnen"
GER_declare_the_presidential_republic_mon_desc:	"Da nun alles bereit ist, ist es an der Zeit, Wahlen vorzubereiten und sicherzustellen, dass alles für unsere neue Monarchie bereitsteht."
GER_thalmanns_cult_of_personality:	"Einen Personenkult fördern" "
GER_thalmanns_cult_of_personality_desc:	"Thälmann ist der Mann, der die Revolution nach Deutschland gebracht hat; lassen Sie uns ein Beispiel an Stalin nehmen und einen Personenkult um ihn herum aufbauen, um unsere Nation zu vereinen und den Mann zu belohnen!"
GER_the_berlin_trials:	"Die Berliner Prozesse"
GER_the_berlin_trials_desc:	"Nachdem die Revolution erfolgreich war, ist es an der Zeit, das Chaos in unserem Land zu bewältigen und es sowohl von innen als auch von außen zu sichern!"
GER_return_the_exiles:	"Die Exilanten zurückholen"
GER_return_the_exiles_desc:	"Wir haben viele Verbündete in fremden Ländern, die wir hinzuziehen könnten, um unser Regime zu festigen; lassen Sie uns diese phänomenale Aufgabe unverzüglich in Angriff nehmen."
GER_consolidate_the_party_leadership:	"Die Parteiführung festigen"
GER_consolidate_the_party_leadership_desc:	"Die Parteiführung muss vollständig um eine Person herum gefestigt werden, um Machtkämpfe zu verhindern und einen einheitlichen Staat zu gewährleisten."
GER_the_national_congress_of_councils:	"Der Nationale Rat der Räte"
GER_the_national_congress_of_councils_desc:	"Es ist an der Zeit, einen nationalen Kongress abzuhalten, um unsere Herrschaft zu festigen."
GER_globalize_the_revolution:	"Die Revolution globalisieren"
GER_globalize_the_revolution_desc:	"Die Revolution muss global sein, um wirklich erfolgreich zu sein; alles andere würde der Gerechtigkeit nicht gerecht werden!"
GER_declare_the_ecr:	"Rufen Sie die Republik des Europäischen Rates aus"
GER_declare_the_ecr_desc:	"Da die Revolution große Fortschritte gemacht hat, ist es an der Zeit, die Republik des Europäischen Rates auszurufen! Es lebe die Revolution! "
GER_ready_the_political_sturcture:	"Bereiten Sie die politische Struktur vor"
GER_ready_the_political_sturcture_desc:	"Wenn wir Europa vereinen wollen, brauchen wir eine robuste politische Struktur, die in der Lage ist, all diese Arbeiter in die Regierung zu integrieren, sobald sie befreit sind."
GER_international_pro_european_propaganda:	"Verbreiten Sie internationalistische Propaganda"
GER_international_pro_european_propaganda_desc:	"Die Revolution ist unmöglich, wenn das Volk nicht auf unserer Seite steht; wir müssen unsere Propaganda verbreiten, um sicherzustellen, dass es unserem Beispiel folgt und die Revolution herbeiführt!"
GER_towards_european_revolution:	" Das Streben nach der europäischen Revolution"
GER_towards_european_revolution_desc:	"Die Revolution muss nach Europa gebracht werden, damit wir den Kontinent unter unserer Knute sichern können. Der Sozialismus darf nicht aufgehalten werden!"
GER_organize_workers_councils:	"Arbeiterräte organisieren"
GER_organize_workers_councils_desc:	"Arbeiterräte sind das Fundament jedes nachhaltigen kommunistischen Staates. Lassen Sie uns diese organisieren, um das Wohlergehen unserer Arbeiter zu gewährleisten."
GER_consolidate_the_new_system:	"Das neue System festigen"
GER_consolidate_the_new_system_desc:	"Dieses neue System muss gefestigt und die Arbeiterräte müssen gestärkt werden. Damit werden wir die Räterepublik ausrufen."
GER_whip_the_party_into_line:	"Die Partei auf Linie bringen"
GER_whip_the_party_into_line_desc:	"Die Partei muss dem Führer treu sein und dafür sorgen, dass das Regime stabil und unantastbar ist. "
GER_unite_the_working_class:	"Die Arbeiterklasse vereinen"
GER_unite_the_working_class_desc:	"Das Proletariat darf nicht gespalten sein. Wir werden es hinter unserer Front vereinen und auf diese Weise die Revolution sichern."
GER_our_own_lennin:	"Unser eigener Lenin"
GER_our_own_lennin_desc:	"[FROM.GetLeader] hat unser Land großartig geführt. Er ist im Grunde genommen zu einem neuen Lenin für unsere Nation geworden."
GER_ready_the_army_for_the_external_threat:	"Bereiten Sie die Armee auf die Revolution vor"
GER_ready_the_army_for_the_external_threat_desc:	"Die Armee muss bereit sein, die Revolution in die Welt zu tragen und die Proletarier überall zu retten."
GER_as_with_the_sa_so_with_the_antifa:	"Verwerfen Sie die Antifaschistische Aktion"
GER_as_with_the_sa_so_with_the_antifa_desc:	 "Wir können uns ein Beispiel an den Nazis nehmen, wie man mit unerwünschten Milizgruppen umgeht, die zu viel politische Macht erlangen. Sie müssen beiseitegeschoben und jeglichem militärischen Einfluss entzogen werden, damit sie nicht versuchen, das Oberkommando an sich zu reißen!"
GER_political_commissars_focus:	"Politische Kommissare"
GER_political_commissars_focus_desc:	 "Politische Kommissare werden die Armee in Schach halten und sicherstellen, dass es keine Desertionen und keinen Verrat an der Revolution gibt!"
GER_appeal_for_autonomy:	"Forderung nach Autonomie"
GER_appeal_for_autonomy_desc:	"Nachdem unsere Nation stabilisiert und der Frieden gesichert ist, werden wir nun Autonomie fordern, um unseren Staat als eigenständige Einheit zu sichern."
GER_the_revolution_secured:	"Maßnahmen zur Sicherung der Revolution"
GER_the_revolution_secured_desc:	"Wir müssen schnell handeln, um die Revolution zu sichern und ihr langfristiges Überleben zu gewährleisten, indem wir unsere politischen Feinde ausschalten, bevor ihr Krebsgeschwür weiter eitert."
GER_officialize_the_volksarmee:	"Offizielle Gründung der Volksarmee"
GER_officialize_the_volksarmee_desc:	"Wir haben in diesem Bürgerkrieg eine provisorische Armee gebildet; lassen Sie uns diese nun als Volksarmee offiziell etablieren, um unseren Feinden entgegenzutreten."
GER_strengthen_soviet_political_support:	"Sowjetische politische Unterstützung anfordern"
GER_strengthen_soviet_political_support_desc:	"Wenn unser Staat langfristig überleben soll, müssen wir sowjetische Unterstützung für unser neues Regime gewinnen."
GER_glorify_stalins_image:	"Stalins Ansehen verherrlichen"
GER_glorify_stalins_image_desc:	"Stalin hat so viel für die Revolution getan; lasst uns diesen Mann und all das Gute, das er für uns getan hat, preisen!"
GER_a_greater_appeal_to_moscow:	"Die Revolution braucht Moskau"
GER_a_greater_appeal_to_moscow_desc:	"Die bedauerliche Realität der Lage ist, dass wir allein nicht ausreichen, um diesen Kampf zu gewinnen. Appellieren wir an Moskau, uns zu retten!"
GER_smuggle_arms:	"Waffen einschmuggeln"
GER_smuggle_arms_desc:	" Wir müssen Waffen in die Hände der Kommunisten schmuggeln, um uns den Vorsprung an Ausrüstung zu verschaffen, den wir benötigen, um unsere Feinde zu besiegen."
GER_secure_control_over_the_brigades:	"Sichern Sie die Internationalen Brigaden"
GER_secure_control_over_the_brigades_desc:	"Die Internationalen Brigaden, voller erfahrener Kämpfer, sind der Schlüssel zu unserem Erfolg; lassen Sie uns diese sichern, damit sie uns helfen, die Sozialfaschisten zu stürzen!"
GER_radicalize_german_workers:	"Die Basis radikalisieren"
GER_radicalize_german_workers_desc:	"Viele Soldaten stehen unserer Ideologie durchaus aufgeschlossen gegenüber. Lassen Sie uns sie für uns gewinnen, damit wir bei der Einleitung unseres Aufstands mehr Unterstützung erhalten."
GER_foster_a_progress_cult:	"Fördern Sie einen Fortschrittskult"
GER_foster_a_progress_cult_desc:	"Gut ausgebildete und elitäre Wissenschaftler, die von der Regierung finanziert werden, bieten uns die Möglichkeit, unsere Wissenschaften auf die nächste Stufe zu heben."
GER_shake_off_the_fascist_yoke:	"Das faschistische Joch abschütteln"
GER_shake_off_the_fascist_yoke_desc:	"Es ist an der Zeit, unseren Waffenstillstand mit den Sozialfaschisten zu brechen! Wir werden uns von ihnen trennen und unseren eigenen Aufstand starten!"
GER_shake_off_the_fascist_yoke_dummy:	"Schütteln Sie das faschistische Joch ab"
GER_shake_off_the_fascist_yoke_desc_dummy:	"Es ist an der Zeit, unseren Waffenstillstand mit den Sozialfaschisten zu brechen! Wir werden uns von ihnen trennen und unseren eigenen Aufstand starten!"
GER_clamp_down_on_the_ruhr:	"Ergreifen Sie das Ruhrgebiet"
GER_clamp_down_on_the_ruhr_desc:	"Da wir unsere kommunistischen Genossen in die Nation zurückholen, werden wir sie einsetzen, um das Ruhrgebiet zu halten und uns die Macht über dieses wichtige Industriezentrum zu sichern."
GER_industrial_cooperation_2:	"Industrielle Zusammenarbeit"
GER_industrial_cooperation_2_desc:	"Unsere Zusammenarbeit mit der [SOV.GetAdjectiveCap] beschränkte sich bislang auf militärische Angelegenheiten. Da [SOV.GetNameDef] ein Verbündeter von uns ist, wäre es nur sinnvoll, auch in anderen Bereichen zusammenzuarbeiten. Unsere industriellen Philosophien sind bereits so ähnlich, dass gemeinsame Anstrengungen im Industriesektor nicht schwer zu erreichen sein dürften."
GER_resource_trade_2:	"Rohstoffhandel"
GER_resource_trade_2_desc:	"Obwohl wir bestrebt sind, uns so weit wie möglich selbst zu versorgen, müssen wir uns den Handel mit Ländern gestatten, die unsere Ideale teilen. Indem wir dem [SOV.GetnameDef] eine gewisse Gegenleistung in Form von industriellen Kapazitäten anbieten, sollten wir in der Lage sein, uns ein sehr vorteilhaftes Abkommen mit ihnen zu sichern."
GER_tech_sharing_2:	"Technologieaustausch"
GER_tech_sharing_2_desc:	"Der Austausch von Technologie zwischen uns und anderen gleichgesinnten Ländern sollte ein Ziel sein, das wir anstreben. Die Sowjetunion für dieses Vorhaben anzusprechen, scheint der vernünftigste Weg zu sein."
GER_hold_new_elections:	"Neue Wahlen abhalten"
GER_hold_new_elections_desc:	"Nach Jahren der Diktatur ist Deutschland wieder frei! Wir werden neue Wahlen abhalten und dem Willen des Volkes folgen!"
GER_adress_the_economy:	"Die Wirtschaft angehen"
GER_adress_the_economy_desc:	"Die deutsche Wirtschaft muss angegangen und in Ordnung gebracht werden."
GER_rehabilitate_mueller:	"Mueller rehabilitieren"
GER_rehabilitate_mueller_desc:	"Ludwig Mueller hat für die Nazis das getan, was wir für uns tun müssen. Lassen Sie uns den Mann rehabilitieren und ihn erneut zum Reichsbischof ernennen!"
GER_kpd_in_coalition:	"[GER_kpd_in_coalition_scripted]"
GER_kpd_in_coalition_desc:	"[GER_kpd_in_coalition_desc_scripted]"
GER_kpd_in_coalition1:	"KPD in der Koalition"
GER_kpd_in_coalition1_desc:	"Die KPD ist nach langem Kampf endlich zu einer relevanten und legalen politischen Kraft geworden, sodass sie nun einen Sitz in der Regierung hat."
GER_kpd_in_coalition2:	"Maßnahmen zur Sicherung der Revolution"
GER_kpd_in_coalition2_desc:	"Wir müssen schnell handeln, um die Revolution zu sichern und ihr langfristiges Überleben zu gewährleisten, indem wir unsere politischen Feinde bekämpfen, bevor ihr Krebsgeschwür weiter eitert."
GER_revolution_by_every_worker:	"Revolution durch jeden Arbeiter"
GER_revolution_by_every_worker_desc:	"Jeder Arbeiter muss zum Krieg beitragen, unabhängig von den Umständen. Wir werden auf den Feldern kämpfen, denn der Sieg gehört uns!"
GER_phase_out_the_standing_army:	"Abschaffung der Berufsarmee"
GER_phase_out_the_standing_army_desc:	"Die Berufsarmee hat uns nicht angemessen gedient. Sie muss zugunsten der Miliz abgeschafft werden."
GER_uplift_the_antifa:	"Die Antifaschistische Aktion stärken"
GER_uplift_the_antifa_desc:	"Die Antifaschistische Aktion ist die Zukunft der deutschen Streitkräfte. Lassen Sie uns sie stärken und die deutsche Armee um sie herum aufbauen."
GER_uplift_the_black_front:	"Die Schwarze Front stärken"
GER_uplift_the_black_front_desc:	"Die Schwarze Front ist die Zukunft der deutschen Streitkräfte. Lassen Sie uns sie stärken und die deutsche Armee um sie herum aufbauen."
GER_uplift_the_sa:	"Erhebt die SA"
GER_uplift_the_sa_desc:	"Die SA ist die Zukunft der deutschen Streitkräfte. Lasst uns sie stärken und die deutsche Armee um sie herum aufbauen."
GER_deal_with_the_officier_corps:	"Geht gegen das Offizierskorps vor"
GER_deal_with_the_officier_corps_desc:	"Das Offizierskorps steht gegen uns. Lassen Sie uns mit diesem Schandfleck unserer Nation fertig werden."
GER_deal_with_the_confessing_church:	"Mit der Bekennenden Kirche fertig werden"
GER_deal_with_the_confessing_church_desc:	"Die Bekennende Kirche ist ein Schandfleck unseres Staates. Sie soll aufgelöst und vernichtet werden."
GER_weaken_the_presidents_power:	"Die Macht des Präsidenten schwächen"
GER_weaken_the_presidents_power_desc:	"Der Präsident hat zu viel Macht und untergräbt die Rechtsstaatlichkeit. Lassen Sie uns Gesetze verabschieden, um diese Macht zu beschneiden und unsere Republik zu retten."
GER_abandon_the_post_alltogether:	"Das Amt gänzlich abschaffen"
GER_abandon_the_post_alltogether_desc:	"Das Amt des Präsidenten ist nutzlos geworden und stellt für unsere Nation eher eine Belastung dar als alles andere. Lassen Sie uns es abschaffen."
GER_address_inner_coaltionary_issues:	"Interne Koalitionsprobleme angehen"
GER_address_inner_coaltionary_issues_desc:	"Angesichts all der Differenzen in unserer Koalition müssen wir daran arbeiten, diese zu beheben. Die SPD ist nicht nur schlecht, und wir müssen diese Tatsache anerkennen."
GER_the_new_federalism:	"Der neue Föderalismus"
GER_the_new_federalism_desc:	"Es ist an der Zeit, unsere eigene Form des Föderalismus zu schmieden. Einen, der stärker lokal verwurzelt ist als die einzelnen Bundesländer. Dies wird Wirtschaftswachstum und Stabilität bringen."
GER_federalism_a_hedge_against_radicalism:	"Föderalismus, der Schutzwall gegen Radikalismus"
GER_federalism_a_hedge_against_radicalism_desc:	"Durch unsere föderalistischen Prinzipien können wir die Radikalen in den lokalen Gerichten halten, wo sie keinen Zugang zu wirklicher Macht haben."
GER_build_germany_from_the_apartment_up:	"Die Nation von der Wohnung aus aufbauen"
GER_build_germany_from_the_apartment_up_desc:	"Die Nation gründet auf der Familie als kleinster individueller Einheit. Lassen Sie uns die Nation auf diesem Prinzip aufbauen."
GER_strengthen_the_responsible_elites:	"Die verantwortungsbewussten Eliten stärken"
GER_strengthen_the_responsible_elites_desc:	" Die verantwortungsbewussten Eliten haben diese große Nation zu dem gemacht, was sie ist. Sie werden unterstützt und gestärkt."
GER_upkeep_german_order:	"Die deutsche Ordnung verankern"
GER_upkeep_german_order_desc:	"Deutschland ist eine Nation der Ordnung, nicht des Chaos. Dies wird in all unseren Institutionen verankert und gefestigt."
GER_prioritise_the_rheinland:	"Priorität für das Rheinland"
GER_prioritise_the_rheinland_desc:	"Das Rheinland ist sowohl das größte Wirtschaftszentrum Deutschlands als auch Adenauers Heimat. Es ist daher von entscheidender Bedeutung, es weiter auszubauen."
GER_increase_municipal_autonomy:	"Stärkung der kommunalen Autonomie"
GER_increase_municipal_autonomy_desc:	"Die Stadt ist der Schlüssel zum deutschen Wirtschaftswachstum. Sie wird priorisiert und autonom gestaltet, um angemessen wachsen zu können."
GER_ensure_a_loyal_clergyship:	"Sicherstellung eines loyalen Klerus"
GER_ensure_a_loyal_clergyship_desc:	"Der Klerus muss loyal sein und unserer Regierung dienen. Wir werden ihn für alle unsere Anliegen einsetzen."
GER_a_patriotic_german_church:	" Eine patriotische deutsche Kirche"
GER_a_patriotic_german_church_desc:	"Die deutsche Kirche muss in all ihren Handlungen patriotisch sein. Sie wird dem Staat unter allen Umständen dienen."
GER_manipulate_the_churches:	"Die Kirche manipulieren"
GER_manipulate_the_churches_desc:	"Die Kirche muss dem Staat dienen und seinen Willen befolgen. Sie soll manipuliert und dazu benutzt werden, genau dies zu tun und unserem Willen zu dienen."
GER_rebuild_the_shattered_zentrum:	"Das gespaltene Zentrum wiederherstellen"
GER_rebuild_the_shattered_zentrum_desc:	"Da das Zentrum aufgrund der jüngsten Ereignisse gespalten ist, müssen wir die Partei retten und sie wieder zu dem machen, was sie einmal war. Das Zentrum wird nicht so schnell untergehen!"
GER_adenauers_chance:	"Adenauers Chance"
GER_adenauers_chance_desc:	"Adenauer ist seit langem eine Schlüsselfigur im Zentrum. Nun hat er endlich die Chance, sie zu führen, und wird die Partei zu Ruhm führen."
GER_integrate_our_new_lands:	"Die Grenze urbar machen"
GER_integrate_our_new_lands_desc:	"Nachdem wir einen Teil unseres Landes zurückerobert haben, lassen Sie uns damit beginnen, das neue Land zu besiedeln und zu bewirtschaften, um unsere Nahrungsmittelversorgung dauerhaft zu sichern."
GER_ensure_permanent_food_security:	"Dauerhafte Ernährungssicherheit gewährleisten"
GER_ensure_permanent_food_security_desc:	"Es ist vollbracht! Wir verfügen nun über eine sichere Quelle für Ernährung und Landwirtschaft. Deutschland kann einer Blockade standhalten und wird nicht erneut besiegt werden!"
GER_positive_christianty:	"Positives Christentum"
GER_positive_christianty_desc:	"Das Christentum ist kein Selbstzweck, sondern wird erst dann nützlich, wenn es dem Staat dient. Das Christentum soll genutzt und nach dem Bild des deutschen Staates geformt werden."
GER_fully_rebuild_the_secret_police:	"Die Sonderabteilung offiziell einrichten"
GER_fully_rebuild_the_secret_police_desc:	"Die Abwehr erhält nun eine Sonderabteilung, die als Geheimpolizei fungieren wird, um uns bei der Kontrolle des neuen Deutschlands zu unterstützen."
GER_revive_gestapo_remnants:	"Die Überreste der Gestapo in die Abwehr integrieren"
GER_revive_gestapo_remnants_desc:	"Die Gestapo verfügte über viele fähige Agenten. Wir werden sie in die Abwehr integrieren, um diese zu stärken."
GER_strike_the_baltic:	"Angriff auf das Baltikum"
GER_strike_the_baltic_desc:	"Das Baltikum muss zurückerobert werden, und wir werden unsere Armee darauf vorbereiten. Bald werden unser Geburtsrecht und unsere Nahrungsversorgung gesichert sein!"
GER_a_deal_with_the_russian_state:	"Ein Abkommen mit dem russischen Staat"
GER_a_deal_with_the_russian_state_desc:	" Um unsere Gebiete zu gewinnen, wird ein Abkommen mit unseren Freunden im Osten unterzeichnet. Zusammenarbeit und Finanzmittel werden Vorrang haben und unseren Lebensraum sichern."
GER_an_eye_towards_the_east:	"Ein Blick nach Osten"
GER_an_eye_towards_the_east_desc:	"Die Zukunft Deutschlands liegt im Osten, wo wir unbesiedeltes Land im Baltikum gewinnen werden, um es zu kolonisieren und wahrhaft deutsch zu machen."
GER_nraf_in_coalition:	"NRAF in der Koalition"
GER_nraf_in_coalition_desc:	"Die NRAF und ihre faschistischen Schlägertrupps haben sich einen Platz in der Regierung gesichert. Man kann nur hoffen, dass dies schnell vorbei ist und dass sie nicht allzu viel Schaden anrichten."
GER_destroy_the_elites:	"Vernichtet die Eliten"
GER_destroy_the_elites_desc:	"Die Eliten waren uns schon immer ein Dorn im Auge. Sie müssen nun verschwinden, ebenso wie die Monarchie, die sich uns widersetzt."
GER_declare_the_volksreich:	"Ruft das Volksreich aus"
GER_declare_the_volksreich_desc:	"Die Zeit ist gekommen, ein neues Reich auszurufen. Eines für den einfachen Mann, das Volk. Heil dem Führer!"
GER_turn_the_opposition_into_regional_issues:	"Regionalisiert die Opposition"
GER_turn_the_opposition_into_regional_issues_desc:	"Wir werden den Föderalismus zu unserem Vorteil nutzen. Die Opposition wird an regionale Gerichte verwiesen und dort behandelt, damit der Staat ungehindert regieren kann."
GER_the_second_gleichschaltung:	"Eine zweite Gleichschaltung verhängen"
GER_the_second_gleichschaltung_desc:	"Die Bundesländer werden zusammen mit der Opposition zerstört. Wir werden keinen Widerspruch und nichts dulden, was der Regierung Macht entzieht."
GER_deal_with_inner_party_opposition:	"Die Parteiführung festigen"
GER_deal_with_inner_party_opposition_desc:	"Die Partei ist zwischen Lutze und Strasser gespalten. Dies muss gelöst und die Opposition beiseite gefegt werden, während sich die Partei um einen von ihnen und ihre revolutionären Ideale schart!"
GER_expand_black_front_influence:	"Den Einfluss der Schwarzen Front ausweiten"
GER_expand_black_front_influence_desc:	"Die Schwarze Front hat viel zur Stärkung unseres Regimes beigetragen; lassen Sie uns sie stärken, um sowohl ihren Einfluss als auch unseren neuen Staat zu festigen."
GER_embrace_true_national_socialism:	"Den Grundsatz des Sozialismus verankern"
GER_embrace_true_national_socialism_desc:	"Der Nationalsozialismus im klassischen Sinne, ohne den Aspekt des Sozialismus zu vergessen, ist der Schlüssel zum deutschen Aufschwung. Lassen Sie uns diesen Grundsatz in unserem Volk verankern und unsere Ideologie nicht zu dem kapitalistischen Chaos verkommen lassen, zu dem die Hitlerianer sie gemacht haben."
GER_the_revolution_under_strasser:	"Strassers revolutionärer Eifer"
GER_the_revolution_under_strasser_desc:	"Es ist Strassers revolutionärer Eifer, der die Partei anführt und sie zu dem großartigen Gebilde formt, das sie heute ist. Das deutsche Volk wird sich daran erfreuen."
GER_the_war_under_lutze:	"Lutzes Kampfgeist"
GER_the_war_under_lutze_desc:	"Lutze verfügt über die entscheidende Erfahrung auf der Straße. Er wird die Partei in eine strahlende neue Zukunft führen und ihren Einfluss im deutschen Staat sichern."
GER_build_up_worker_and_peasant_councils:	"Arbeiter- und Bauernräte aufbauen"
GER_build_up_worker_and_peasant_councils_desc:	"Die Arbeiter und Bauern sind das Rückgrat der deutschen Wirtschaft. Geben wir diesen tapferen Männern Räte, um ihnen eine Stimme zu geben, damit sie gehört werden und Einfluss auf ihren Staat nehmen können."
GER_limited_federalist_reforms:	"Begrenzte föderalistische Reformen"
GER_limited_federalist_reforms_desc:	"Begrenzter Föderalismus ist in einem so großen und vielfältigen Staat wie Deutschland sinnvoll. Wir werden dies nutzen, um den verschiedenen Teilen der Nation zu helfen, gleichermaßen unter der strahlenden Sonne zu gedeihen."
GER_radicalize_rearmament_efforts:	"Radikalisierung der Wiederaufrüstungsbemühungen"
GER_radicalize_rearmament_efforts_desc:	"Wenn Deutschland überleben soll, muss es sich rasch wieder aufrüsten und alles zerstören, was ihm im Weg steht, damit nicht die Alliierten uns zuerst vernichten."
GER_centralize_the_state:	"Zentralisierung des Staates"
GER_centralize_the_state_desc:	"Der deutsche Staat muss zentralisiert werden, damit die SA überall ihre Wirkung entfalten kann."
GER_a_powerful_state:	"Ein mächtiger Staat"
GER_a_powerful_state_desc:	"Alle Autorität liegt beim Staat. Dies muss in der gesamten Verwaltung deutlich gemacht werden. Es wird keinen Widerstand geben."
GER_use_the_communists:	"Die Kommunisten nutzen"
GER_use_the_communists_desc:	"Die Marxisten sind uns so ähnlich, dass es zweckmäßig ist, sie zur Unterstützung unserer Machtübernahme einzusetzen."
GER_the_national_salvation_law:	"Das Staatssicherheitsgesetz"
GER_the_national_salvation_law_desc:	" Wir werden ein zweites Ermächtigungsgesetz verabschieden, das erneut Sicherheit und Schutz für unser Volk verspricht und so unsere neue Macht festigt. Für den deutschen Arbeiter."
GER_maintian_strict_anti_marxism:	"Beziehen Sie Stellung zu den Kommunisten"
GER_maintian_strict_anti_marxism_desc:	"Zwar unterstützen wir beide die Arbeiter, doch die Marxisten sind falsche Sozialisten, die den Nationalismus zugunsten falscher Größenwahnvorstellungen aufgeben. Ungeachtet dessen ist dieser Widerspruch und die ideologische Ähnlichkeit bei gravierenden Unterschieden auffällig und zwingt uns zu einer schwierigen Entscheidung, wie wir mit ihnen umgehen sollen..."
GER_hail_the_new_fuhrer:	"Ehre sei dem neuen Führer"
GER_hail_the_new_fuhrer_desc:	"Wir haben nun einen neuen Führer, lasst uns diesen großen Mann bejubeln und preisen, der den deutschen Arbeiter zur Erlösung führen wird."
GER_inspire_fear_of_the_liberals:	"Schüren Sie Angst vor dem Liberalismus"
GER_inspire_fear_of_the_liberals_desc:	"Es waren die Sozialisten und Liberalen, die uns in den Rücken gefallen sind und uns den großen Krieg verloren haben. Lassen Sie das Volk diese Entarteten fürchten und sich stattdessen an uns wenden, indem wir das Gefühl schüren, dass die liberalen Länder im Westen uns angreifen werden."
GER_bring_about_the_second_revolution:	"Die zweite Revolution herbeiführen"
GER_bring_about_the_second_revolution_desc:	"Sowohl die Nazis als auch unsere neue nationalsozialistische Revolution haben sich stets für eine zweite wirtschaftliche Revolution eingesetzt. Lassen Sie uns diese endlich herbeiführen."
GER_limited_reconciliation:	"Begrenzte Versöhnung"
GER_limited_reconciliation_desc:	"Um unsere Partei zu stabilisieren, müssen wir gegenüber bestimmten Minderheiten eine Politik der begrenzten Versöhnung verfolgen, auch wenn dies unserer übergeordneten Ideologie etwas zuwiderläuft."
GER_consolidate_socialist_reforms:	"Sozialistische Reformen konsolidieren"
GER_consolidate_socialist_reforms_desc:	"Unsere sozialistischen Reformen waren sehr erfolgreich. Lassen Sie uns diese festigen und die Nation stabilisieren."
GER_crush_bourgeoise_captialism:	"Den bürgerlichen Kapitalismus zerschlagen"
GER_crush_bourgeoise_captialism_desc:	"Wir werden die bürgerlichen Institutionen zerstören und den Kapitalismus in Deutschland besiegen, um alles für die Arbeiter zu vereinen."
GER_a_true_volksgemeinschaft:	"Eine wahre Volksgemeinschaft"
GER_a_true_volksgemeinschaft_desc:	"Das Land wurde über alle Klassengrenzen hinweg zu einer einheitlichen Gemeinschaft, der Volksgemeinschaft, vereint. Lasst uns dies feiern."
GER_declare_the_council_republic:	"Ruft die Räterepublik aus"
GER_declare_the_council_republic_desc:	"Es ist an der Zeit, die Räterepublik auszurufen und die volle Kontrolle über das zu übernehmen, was den Arbeitern gehört." "
GER_collapse_our_institutions:	"Unsere Institutionen zerschlagen"
GER_collapse_our_institutions_desc:	"Nun, da wir uns den Weg in die Regierung gebahnt haben, werden wir unseren Staat zerschlagen und seine bürgerlichen Institutionen zerstören."
GER_split_faith_from_the_party:	"Trennen Sie den Glauben von der Partei"
GER_split_faith_from_the_party_desc:	"Ein Christ in der Partei wird immer zwischen zwei Loyalitäten hin- und hergerissen sein. Daher müssen wir sie dazu bringen, sich zu entscheiden, was ihnen wichtiger ist. "
GER_watch_the_churches:	"Beobachten Sie die Kirchen"
GER_watch_the_churches_desc:	"Die Stasi wird die Kirchen im Land überwachen und die Verbreiter dieses Opiums untergraben."
GER_demand_state_approval_for_clergy:	"Fordern Sie staatliche Zulassung für Geistliche"
GER_demand_state_approval_for_clergy_desc:	 "Indem wir staatliche Zulassung für Geistliche und Predigten fordern, bringen wir die Kirche unter unsere Kontrolle und ersticken sie langsam."
GER_ensure_the_gradual_withering_away_of_religion:	"Das Absterben der Religion sicherstellen"
GER_ensure_the_gradual_withering_away_of_religion_desc:	"Durch unser Handeln haben wir diesem Opium entscheidenden Schaden zugefügt. Es ist nur eine Frage der Zeit, bis es untergeht. "
GER_towards_state_atheism:	"Staatlichen Atheismus einführen"
GER_towards_state_atheism_desc:	"Einfacher Säkularismus reicht nicht aus, vielmehr muss das Volk von dem tödlichen Opium befreit werden, das die Religion darstellt."
GER_the_will_of_the_people_unopposed:	"Der unangefochtene Wille des Volkes"
GER_the_will_of_the_people_unopposed_desc:	"Wir stehen für den Willen des Volkes und dürfen nicht bekämpft werden. Wir werden dafür kämpfen, koste es, was es wolle! "
GER_towards_a_party_state:	"Auf dem Weg zu einem Parteistaat"
GER_towards_a_party_state_desc:	"Deutschland muss zu einem Parteistaat geformt werden, der das Volk zu wahrer Freiheit und Unabhängigkeit führt."
GER_form_the_sed:	"Gründung der SED"
GER_form_the_sed_desc:	" Die SED wird sich aus Mitgliedern der beiden sozialistisch orientierten Parteien, der SPD und der KPD, zusammensetzen."
GER_ban_the_reactionaries:	"Verbietet die Reaktionäre"
GER_ban_the_reactionaries_desc:	"Die Reaktionäre destabilisieren unsere Nation in hohem Maße. Sie werden verboten und besiegt werden, damit wir ohne Probleme regieren können."
GER_introduce_the_jugendweihe:	"Einführung der Jugendweihe"
GER_introduce_the_jugendweihe_desc:	"Die Jugendweihe ist seit langem eine zentrale Praxis in der Nation. Lassen Sie uns sie als staatliche Institution einführen, um die Konfirmation zu ersetzen und den Einfluss der Kirche auf das Volk zu schwächen."
GER_german_entry_into_the_comintern:	"Beitritt zur Komintern sichern"
GER_german_entry_into_the_comintern_desc:	"Da die Sowjets unser größter Verbündeter sind, sollten wir uns ihnen anschließen. Dieses Bündnis muss schnell gesichert werden!"
GER_peace_in_the_east:	" Frieden im Osten"
GER_peace_in_the_east_desc:	"Wenn der Frieden im Osten gesichert ist, kann die Bedrohung aus dem Westen viel effizienter bekämpft werden; konzentrieren wir uns darauf, den Franzosen den Garaus zu machen."
GER_the_state_safe_from_without:	"Der Staat vor äußeren Bedrohungen geschützt"
GER_the_state_safe_from_without_desc:	"Es ist klar, dass der Staat vor allem vor äußeren Bedrohungen geschützt werden muss; lassen Sie uns diese proaktiv angehen."
GER_the_state_safe_from_within:	"Die Sicherheit des Staates gewährleisten"
GER_the_state_safe_from_within_desc:	"Unser eigenes Volk verschwört sich immer noch gegen uns. Wir müssen schnell und entschlossen handeln, um ihre Bestrebungen zu vereiteln; doch so groß ihre Bemühungen auch sein mögen, gilt dasselbe für fremde Nationen. Wir müssen entscheiden, worauf wir uns konzentrieren!"
GER_undermine_international_fascism:	"Den internationalen Faschismus untergraben"
GER_undermine_international_fascism_desc:	"Wir müssen uns mit dem Faschismus bei all unseren Feinden auseinandersetzen. Bereiten wir uns darauf vor, ihre Staaten zu untergraben, um ihn auszumerzen."
GER_deal_with_the_conciliators:	"Mit den Versöhnlern fertigwerden"
GER_deal_with_the_conciliators_desc:	"Die Versöhnler und ihre bürgerlichen Tendenzen waren uns schon immer ein Dorn im Auge. Mit diesen muss unverzüglich Schluss gemacht werden."
GER_fight_fascism_in_all_its_forms:	"Bekämpfung des Faschismus in all seinen Formen"
GER_fight_fascism_in_all_its_forms_desc:	 "Dem Faschismus muss unabhängig von seiner Ausprägung begegnet werden. Sowohl die SPD als auch die NRAF und alle dazwischen müssen von seinem Einfluss gesäubert werden."
GER_espouse_unity_with_the_spd:	"Für die Einheit mit der SPD eintreten"
GER_espouse_unity_with_the_spd_desc:	 "Die Einheit mit der SPD ist der Schlüssel, um die Faschisten in Schach zu halten; auch wenn dies gewisse Kompromisse erzwingen mag, ist sie dennoch notwendig."
GER_unite_against_the_reactionaries:	"Vereinigt euch gegen die Reaktionäre"
GER_unite_against_the_reactionaries_desc:	"Wir alle müssen uns gegen die Reaktionäre stellen und sie vernichten, während wir uns dem Allgemeinwohl zuwenden. "
GER_revolution_in_german_culture:	"Revolution in der deutschen Kultur"
GER_revolution_in_german_culture_desc:	"Die deutsche Kultur muss die Revolution in dieses neue Zeitalter führen. Wir müssen dafür kämpfen und die Welt in einen besseren Zustand versetzen."
GER_radicalize_the_workers:	"Radikalisieren Sie die Arbeiter"
GER_radicalize_the_workers_desc:	"Um den Staat vollständig zu übernehmen, müssen wir die Arbeiter radikalisieren und dabei die alten Institutionen zerstören."
GER_undermine_german_democracy:	"Untergraben Sie die deutsche Demokratie"
GER_undermine_german_democracy_desc:	" Die deutsche Demokratie hat uns bereits einmal im Stich gelassen. Lassen Sie uns sie besiegen, bevor sie dies erneut tut."
GER_open_the_definition_of_marriage:	"Die Definition der Ehe öffnen"
GER_open_the_definition_of_marriage_desc:	"Die Ehe ist seit langem an die Vorstellung von Mann und Frau gebunden, doch es ist klar, dass dies nicht zwangsläufig so sein muss. Lassen Sie uns dies korrigieren und sie für alle Paare öffnen."
GER_reapproachment_with_moscow:	"Die Beziehungen zu Moskau wiederbeleben"
GER_reapproachment_with_moscow_desc:	"Moskau, die Wiege der Revolution, war schon immer einer unserer größten Verbündeten; lassen Sie uns auf sie zugehen und die Freundschaft sichern."
GER_expand_recruitment:	"Die Rekrutierung ausweiten"
GER_expand_recruitment_desc:	"Es ist entscheidend, dass wir so viele Agenten wie möglich haben, um sicherzustellen, dass unser Regime sicher ist, egal was passiert."
GER_form_the_stasi_new:	"Gründen Sie die Stasi"
GER_form_the_stasi_new_desc:	"Um die Revolution zu sichern, brauchen wir eine Organisation, die den Staat schützt; lassen Sie uns dies durch die Gründung der Stasi erreichen"
GER_legalize_the_kjvd:	"Legalisierung der KJVD"
GER_legalize_the_kjvd_desc:	"Die Kommunistische Jugendorganisation Deutschlands muss wieder legalisiert werden, damit wir sie im Rahmen der Pläne unserer Partei nutzen können."
GER_mandatory_membership:	"Pflichtmitgliedschaft"
GER_mandatory_membership_desc:	"Die Mitgliedschaft im KJVD steht nicht zur Debatte; jeder Deutsche, der sein Vaterland liebt, muss ihm beitreten."
GER_industrial_collectivization:	"Industrielle Kollektivierung"
GER_industrial_collectivization_desc:	" Mit der Bourgeoisie muss man fertig werden, und ihre Industrien müssen für das Allgemeinwohl genutzt werden. Der Weg, dies zu erreichen, ist die Kollektivierung ihrer Güter."
GER_rehabilitate_the_red_tsar:	"Ein zweiter roter Zar"
GER_rehabilitate_the_red_tsar_desc:	"Die SPD wurde stark von Otto Braun, dem sogenannten roten Zaren, geprägt; lassen Sie uns einen neuen Mann finden, der diese Aufgabe in Preußen übernimmt und sie vollständig sichert."
GER_redistribute_wealth:	"Umverteilung des Reichtums"
GER_redistribute_wealth_desc:	"Im Interesse der Gerechtigkeit unseres Landes müssen wir unseren Reichtum teilen, und wer nicht teilt, sollte dazu gezwungen werden. "
GER_work_towards_a_demilitarized_europe:	"Europa entmilitarisieren"
GER_work_towards_a_demilitarized_europe_desc:	"Wenn Europa sicher sein soll, müssen nicht nur wir entmilitarisiert werden, sondern auch der Rest Europas."
GER_towards_mierendorffs_vision:	"Auf dem Weg zu Mierendorffs Vision"
GER_towards_mierendorffs_vision_desc:	"Mierendorff hat seit langem eine große Vision einer demokratisch-sozialistischen Zukunft für Deutschland – lassen Sie uns diese verwirklichen und unseren Arbeitern Wohlstand sichern. "
GER_strengthen_the_spd_beurocracy:	"Das SPD-Establishment stärken"
GER_strengthen_the_spd_beurocracy_desc:	"Das SPD-Establishment hat die Nation unter Wels und Braun gut geführt. Lassen Sie uns mit dieser Ideologie daran arbeiten, dass die Nation wahrhaftig aufblüht."
GER_reform_the_institutions:	"Reformieren Sie die Institutionen"
GER_reform_the_institutions_desc:	"Es ist sonnenklar, dass die deutschen Institutionen reformiert werden müssen. Die SPD wird dies verwirklichen und die Normalität wiederherstellen."
GER_unite_the_party:	"Vereinen Sie die Partei"
GER_unite_the_party_desc:	"So zersplittert die SPD auch sein mag, wir müssen daran arbeiten, sie zu vereinen und zu festigen, um Frieden und Wohlstand zu schaffen. "
GER_reach_out_to_the_remaining_parliamentarians:	"Die Kontrolle über das Parlament übernehmen"
GER_reach_out_to_the_remaining_parliamentarians_desc:	"Um ihre Stärke erheblich zu steigern, wird die SPD die Unterstützung gleichgesinnter Abgeordneter gewinnen und sich zusätzliche Sitze im Reichstag sichern."
GER_cater_to_the_masses:	"Den Massen entgegenkommen"
GER_cater_to_the_masses_desc:	"Mit dem Sieg des linken Flügels in der SPD werden wir diese Chance nutzen, um die Massen mit ins Boot zu holen und unsere Macht in der Partei zu stärken."
GER_build_a_mass_movement:	"Eine Massenbewegung aufbauen"
GER_build_a_mass_movement_desc:	"Wir werden die SPD in eine Massenbewegung verwandeln und sie zu einer unaufhaltsamen Macht machen, der niemand etwas entgegenzusetzen hat."
GER_no_compromise_on_socialist_ideals:	"Keine Kompromisse bei den sozialistischen Idealen"
GER_no_compromise_on_socialist_ideals_desc:	"Sozialistische Ideale sind entscheidend für die Sicherung der SPD; wir werden dafür sorgen, dass diese zusammen mit unserer Demokratie verbreitet werden."
GER_spd_in_coalition:	"SPD in der Koalition"
GER_spd_in_coalition_desc:	"Die traditionell größte Partei der Weimarer und Kaiserzeit ist zurückgekehrt und hat erneut Einfluss in der Regierung gewonnen."
GER_enforce_a_secularized_curriculum:	"Durchsetzung eines säkularisierten Lehrplans"
GER_enforce_a_secularized_curriculum_desc:	"Damit die Wissenschaften gedeihen können, müssen wir einen säkularisierten Lehrplan durchsetzen und so den Erfolg unserer Hochschulen sichern."
GER_embrace_secularism:	"Säkularismus begrüßen"
GER_embrace_secularism_desc:	"Säkularismus ist der Weg in die Zukunft für unsere Nation; wir müssen diese rückständige Vorstellung von Religion ablegen und uns den Wissenschaften zuwenden."
GER_guarantee_religious_freedom:	"Religionsfreiheit garantieren"
GER_guarantee_religious_freedom_desc:	"Religionsfreiheit ist der Schlüssel zur Stabilität unserer Nation. Auch wenn dies gewisse falsche Vorstellungen verfestigen mag, wird es doch erheblich zur Stabilisierung unseres Staates beitragen."
GER_choose_an_heir_for_wels:	"Wählen Sie einen Nachfolger für Wels"
GER_choose_an_heir_for_wels_desc:	"Wels wird alt und krank und wird bald nicht mehr regierungsfähig sein. Lassen Sie uns einen Mann wählen, der ihn ersetzt."
GER_claim_leadership_of_german_nationalism:	"Übernehmen Sie die Führung des deutschen Nationalismus"
GER_claim_leadership_of_german_nationalism_desc:	"In den letzten Jahren hat sich die SPD als einzige rechtmäßige Führerin des deutschen Nationalismus erwiesen und erfolgreich gegen die Nazis und die Staatsfeinde gekämpft."
GER_peace_with_our_new_identity:	"Frieden mit unserer neuen Identität"
GER_peace_with_our_new_identity_desc:	"Der kulturelle Wandel in Deutschland hat uns ein neues Gesicht und eine neue Identität beschert, mit der wir Frieden schließen können."
GER_strengthen_german_patriotism:	"Starten Sie eine Kampagne zur Stärkung der Kultur"
GER_strengthen_german_patriotism_desc:	"Deutscher Patriotismus ist ein wesentlicher Bestandteil der nationalen Identität; wir müssen dies zu unserem Vorteil nutzen und uns zunutze machen."
GER_encourage_european_unity:	"Förderung der europäischen Einheit"
GER_encourage_european_unity_desc:	"Die Zukunft liegt in der europäischen Einheit. Wir müssen dazu beitragen, die Menschen davon zu überzeugen. "
GER_purge_the_military_of_reactionaries:	"Das Militär von Reaktionären säubern"
GER_purge_the_military_of_reactionaries_desc:	"Das Militär muss von Reaktionären gesäubert werden, um es von denjenigen zu befreien, die sich dem Staat und der Rechtsstaatlichkeit widersetzen."
GER_revive_the_attitude_of_1914:	"Die Haltung von 1914 wiederbeleben"
GER_revive_the_attitude_of_1914_desc:	"Im Jahr 1914 stand ganz Deutschland geschlossen zusammen. Dieses große Erbe wird wiederbelebt werden, und Deutschland wird in diesem aktuellen Kampf geschlossen zusammenstehen."
GER_legitimize_the_left:	"Die Linke legitimieren"
GER_legitimize_the_left_desc:	"Die Linke ist seit langem ein prägender Teil der Politik und zeigt dem Arbeiter, was er braucht. Lassen Sie uns sie legitimieren und Frieden und Wohlstand bringen."
GER_campaign_as_a_popular_front:	"Als Volksfront Wahlkampf führen"
GER_campaign_as_a_popular_front_desc:	"Es ist entscheidend, als Volksfront zu kämpfen, sich mit den Kommunisten zu verbünden und mit ihnen zusammenzuarbeiten, um eine gute Politik zu verwirklichen."
GER_unite_against_fascism:	"Gemeinsam gegen den Faschismus"
GER_unite_against_fascism_desc:	"Der Faschismus ist eine große Bedrohung für uns alle und muss unschädlich gemacht werden – lassen Sie uns dies in Deutschland verwirklichen."
GER_democratize_the_civil_service:	"Demokratisierung des öffentlichen Dienstes"
GER_democratize_the_civil_serivce_desc:	"Da sich der öffentliche Dienst unserer Regierung widersetzt, müssen wir ihn demokratisieren und eine neue Ära der Stabilität einläuten."
GER_legalize_the_remaining_communist_parties:	"Die verbleibenden kommunistischen Parteien legalisieren"
GER_legalize_the_remaining_communist_parties_desc:	"Die Kommunisten wurden zu Unrecht verboten und brutal unterdrückt. Dies muss ein Ende haben."
GER_end_conscription:	"Beendigung der Wehrpflicht"
GER_end_conscription_desc:	"Die Wehrpflicht füllt die Armee mit unwilligen Männern, die für den Dienst ungeeignet sind. Lassen Sie uns dies korrigieren und für ein williges Korps sorgen."
GER_divert_military_funding:	"Umleitung von Militärmitteln"
GER_divert_military_funding_desc:	"Wir werden Mittel aus dem Militär umleiten, um unsere Wirtschaft für das Volk zu sichern und sie für weitaus edlere Zwecke einzusetzen."
GER_work_towards_national_demilitarization:	"Auf eine nationale Entmilitarisierung hinarbeiten"
GER_work_towards_national_demilitarization_desc:	"Wenn Frieden erreicht werden soll, muss die Nation entmilitarisiert werden, um Wohlstand für alle zu sichern."
GER_rebuild_the_prussian_bastion:	"Wiederaufbau der preußischen Bastion"
GER_rebuild_the_prussian_bastion_desc:	"Preußen war einst die Bastion der Demokratie in Deutschland. Für unsere Stabilität ist es unerlässlich, dies wiederherzustellen."
GER_build_the_rur_dam_2:	"Bau des Ruhr-Staudamms"
GER_build_the_rur_dam_2_desc:	"Der Bau des Ruhr-Staudamms ist mehr als nur eine technische Meisterleistung – er ist eine Investition in die Zukunft. Der Staudamm würde nicht nur die wirtschaftliche Entwicklung in der Region stärken, sondern auch unsere industriellen Bemühungen und die Produktionsleistung ankurbeln."
GER_a_planned_economy:	" Eine Planwirtschaft organisieren"
GER_a_planned_economy_desc:	"Deutschland braucht die Stabilität und den Frieden einer Planwirtschaft, um zu gedeihen. Lassen Sie uns dies verwirklichen."
GER_finalize_economic_planning:	"Wirtschaftsplanung abschließen"
GER_finalize_economic_planning_desc:	"Die Wirtschaftsplanung muss abgeschlossen werden, wobei detaillierte Maßnahmen vorbereitet und umgesetzt werden müssen, um sicherzustellen, dass die Menschen gedeihen können. "
GER_set_prices_in_stone:	"Preise festschreiben"
GER_set_prices_in_stone_desc:	"Es ist an der Zeit, feste Preise für deutsche Waren zu gewährleisten, um Stabilität und Wohlstand für alle unsere Arbeiter zu sichern."
GER_state_run_unions:	"Staatlich geführte Gewerkschaften"
GER_state_run_unions_desc:	"Um die Interessen der Arbeiterschaft und des Staates in Einklang zu bringen, müssen wir staatlich geführte Gewerkschaften organisieren, die den Arbeitern helfen und unsere Herrschaft stützen."
GER_enforce_the_right_to_work:	"Das Recht auf Arbeit durchsetzen"
GER_enforce_the_right_to_work_desc:	"Das Recht auf Arbeit ist das wichtigste aller Rechte. Wir werden es verwirklichen, indem wir jedem, der dies wünscht, einen garantierten Arbeitsplatz vom Staat geben."
GER_socialism_with_german_characteristics:	"Sozialismus mit deutschen Merkmalen"
GER_socialism_with_german_characteristics_desc:	"Wir haben es geschafft! Der Sozialismus ist in Deutschland verwirklicht worden und wird uns in eine glorreiche neue Ära führen."
GER_towards_a_workers_democracy:	"Auf dem Weg zu einem Arbeiterstaat"
GER_towards_a_workers_democracy_desc:	"Die Arbeiter sind der Schlüssel zum deutschen Staat, und deshalb müssen wir sie unterstützen. Sozialistische Wirtschaftspolitik ist der Schlüssel zum wirtschaftlichen Erfolg!"
GER_utilize_pro_democratic_propaganda:	"Pro-demokratische Propaganda nutzen"
GER_utilize_pro_democratic_propaganda_desc:	"Wenn die Demokratie in Deutschland Erfolg haben soll, müssen wir die Bevölkerung mit ins Boot holen; daher werden wir mit dem Zentrum und der LVP zusammenarbeiten, um dies zu erreichen."
GER_land_reform:	"Eine angemessene Landreform"
GER_land_reform_desc:	"Deutschland muss eine angemessene Landreform durchlaufen, um Gleichheit für alle und Gerechtigkeit für die deutschen Arbeiter zu gewährleisten."
GER_support_the_workers:	"Reformen für die Arbeiter"
GER_support_the_workers_desc:	"Reformen müssen denen zugutekommen, die sie vorantreiben und das Land führen: den Arbeitern."
GER_raise_the_minimum_wage:	"Anhebung des Mindestlohns"
GER_raise_the_minimum_wage_desc:	"Der Mindestlohn ist entscheidend für die Unterstützung der Arbeitnehmer, damit sie für ihre Arbeit angemessen entlohnt werden."
GER_public_works_desc:	"Öffentliche Bauvorhaben werden uns helfen, Wohlstand nach Deutschland zu bringen, indem sie den Arbeitnehmern Arbeit und den Verkehrsteilnehmern befahrbare Straßen bieten."
GER_fight_employment_discrimination:	"Bekämpfung von Diskriminierung am Arbeitsplatz"
GER_fight_employment_discrimination_desc:	" Diskriminierung am Arbeitsplatz macht unsere Arbeitskräfte ineffizient. Wir müssen dies beseitigen."
GER_support_the_families:	"Reform durch die Familien"
GER_support_the_families_desc:	"Reformen müssen in Deutschland durch die Stärkung der Familien und die Zusammenarbeit mit ihnen vorangetrieben werden, indem wir ihre Tugenden nutzen, um uns weiterzuentwickeln."
GER_preferred_hiring_for_fathers:	"Bevorzugte Einstellung von Vätern"
GER_preferred_hiring_for_fathers_desc:	" Wir werden Druck auf Unternehmen ausüben, Väter vor anderen einzustellen, da sie die Arbeitsplätze dringender benötigen als alleinstehende Männer und sich mit größerer Wahrscheinlichkeit mehr anstrengen und produktiver arbeiten, um ihre Familie zu ernähren."
GER_strengthen_the_bedrock_of_the_family:	"Das Fundament der Familie stärken"
GER_strengthen_the_bedrock_of_the_family_desc:	"Die Familie ist das Fundament Deutschlands und wird das sein, was Deutschland großartig macht. "
GER_build_defense_industry_r56:	"Aufbau einer Rüstungsindustrie"
GER_build_defense_industry_r56_desc:	"Nachdem es uns endlich gelungen ist, unsere Wirtschaft zu stabilisieren und sogar um ein Vielfaches zu stärken, können wir nun unsere Aufmerksamkeit darauf richten, die Souveränität unserer Nation zu sichern und eine angemessene Rüstungsindustrie aufzubauen, um den Fleiß und den Drang des deutschen Volkes nach Fortschritt und Spitzenleistungen zu bewahren."
GER_war_production_r56:	"Kriegsproduktion"
GER_war_production_r56_desc:	"Der Krieg hat uns erneut erfasst, doch wir werden nicht nachgeben und wir werden nicht untergehen! Wir werden unsere industrielle Macht mobilisieren und jeden Feind übertrumpfen, der so unklug ist zu glauben, er könne den ungebrochenen Willen des deutschen Volkes brechen!"
GER_strengthen_the_unions:	"Stärkung der Gewerkschaften"
GER_strengthen_the_unions_desc:	"Die Gewerkschaften sind das Rückgrat der Wirtschaft; wir werden sie stärken und ihnen helfen, die Arbeiter zu unterstützen."
GER_unemployment_ensurance:	"Arbeitslosenversicherung"
GER_unemployment_ensurance_desc:	"Die Versicherung wird die deutschen Arbeitnehmer retten und es ihnen ermöglichen, sich auf die Arbeit zu konzentrieren und sich dabei sicher zu fühlen."
GER_become_the_model_social_market_economy:	"Die vorbildliche soziale Marktwirtschaft werden"
GER_become_the_model_social_market_economy_desc:	" Wir sind die vorbildliche soziale Marktwirtschaft Europas. Wir werden Europa Wohlstand bringen und unsere Arbeitnehmer befreien."
GER_enact_drastic_tax_cuts:	"Drastische Steuersenkungen beschließen"
GER_enact_drastic_tax_cuts_desc:	"Um das Wirtschaftswachstum anzukurbeln, sind Steuersenkungen unerlässlich, da sie zum langfristigen Gedeihen der deutschen Wirtschaft und zum Fortbestand des Nationalstaates führen werden. "
GER_limited_social_reform:	"Begrenzte Sozialreform"
GER_limited_social_reform_desc:	"Eine begrenzte Sozialreform ist für eine robuste Wirtschaft notwendig, die die Menschen auf unserer Seite hat – lassen Sie uns dieses Ziel erreichen."
GER_support_the_industries:	"Reformen durch die Industrie"
GER_support_the_industries_desc:	"Reformen in Deutschland müssen von der Industrie ausgehen, um nachhaltig zu sein, und diese sowie unsere Bevölkerung stärken."
GER_marriage_loans_desc:	"Ehekredite werden den Menschen bei ihrer Arbeit, für ihre Familien zu sorgen und Stabilität auf dem Arbeitsmarkt zu gewährleisten, sehr helfen."
GER_liberalize_the_economy:	"Liberalisierung der Wirtschaft"
GER_liberalize_the_economy_desc:	"Im Liberalismus liegt die Zukunft Deutschlands; wir müssen unsere Wirtschaft auf diesen neuen und glorreichen Standard bringen!"
GER_move_towards_full_deregulation:	"Wirtschaftliche Regulierungen abbauen"
GER_move_towards_full_deregulation_desc:	"Eine vollständige wirtschaftliche Deregulierung muss sichergestellt werden, um eine freiere, robustere und nachhaltigere Wirtschaft zu schaffen."
GER_maintain_state_influence_on_the_economy:	"Staatlichen Einfluss in der Wirtschaft bewahren"
GER_maintain_state_influence_on_the_economy_desc:	"Der Staat muss einen Teil seines Einflusses in der Wirtschaft bewahren, um sicherzustellen, dass das Land für einen letzten verzweifelten Krieg und zur Selbstverteidigung gerüstet ist."
GER_subsidize_key_industries:	"Schlüsselindustrien subventionieren"
GER_subsidize_key_industries_desc:	"Der Staat muss die Integrität seiner Schlüsselindustrien gewährleisten und sie schützen, um Deutschland zu retten."
GER_provide_funds_for_entrepreneurs:	"Finanzmittel für Unternehmer bereitstellen"
GER_provide_funds_for_entrepreneurs_desc:	"Es ist die Aufgabe der Regierung, Finanzmittel für neue Unternehmen bereitzustellen und ihnen zu helfen, zum Wohle der Allgemeinheit zu florieren."
GER_an_economy_without_a_state:	"Eine Wirtschaft ohne Staat"
GER_an_economy_without_a_state_desc:	"Deutschland hat sich zu einer Wirtschaft ohne Staat gewandelt und damit Wohlstand und Reichtum für alle gesichert."
GER_achieve_secure_long_term_economic_growth:	"Langfristiges Wirtschaftswachstum erreichen"
GER_achieve_secure_long_term_economic_growth_desc:	" Wir müssen langfristiges Wirtschaftswachstum sichern und damit Frieden und Wohlstand für kommende Generationen schaffen, der über die goldenen Zwanziger hinausgeht."
GER_state_economy_simbiosis:	"Eine Symbiose zwischen Staat und Wirtschaft fördern"
GER_state_economy_simbiosis_desc:	"Wir müssen das Bewusstsein fördern, dass Staat und Wirtschaft zusammenarbeiten, um gemeinsame Ziele zu erreichen."
GER_help_the_worker_through_his_company:	"Dem Arbeitnehmer durch sein Unternehmen helfen"
GER_help_the_worker_through_his_company_desc:	" Dem Arbeiter ist am besten durch sein Unternehmen geholfen, das ihm alles bietet, was er für ein langes und friedliches Leben benötigt."
GER_dstp_in_coalition:	"LVP in der Koalition"
GER_dstp_in_coalition_desc:	"Die LVP und ihre liberale Politik haben die Herzen und Köpfe der Deutschen erreicht; hoffen wir, dass sie in der Regierung gute Arbeit leisten."
GER_focus_on_political_education:	"Fokus auf politische Bildung"
GER_focus_on_political_education_desc:	"Es ist unerlässlich, dass das Volk eine politische Bildung erhält und aus den Erfolgen und Fehlern unserer Vorfahren lernt."
GER_a_new_national_anthem:	"Eine neue Nationalhymne"
GER_a_new_national_anthem_desc:	"Unsere alten Nationalhymnen spiegelten nicht den wahren deutschen Geist wider; stattdessen müssen wir ein weniger aggressives, friedlicheres Lied finden, um unseren Geist zu würdigen."
GER_reach_out_to_the_middle_class:	"Die Mittelschicht ansprechen"
GER_reach_out_to_the_middle_class_desc:	"Die LVP muss die Mittelschicht ansprechen und sich deren Unterstützung sichern."
GER_a_juggernaught_back_from_the_grave:	"Ein Moloch, der aus dem Grab zurückgekehrt ist"
GER_a_juggernaught_back_from_the_grave_desc:	"Der Liberalismus ist aus dem Grab zurückgekehrt und zur Ideologie der neuen Schlüsselpartei in Deutschland geworden! Lasst uns dies feiern!"
GER_utilize_the_zentrum_freeze:	"Die Untätigkeit des Zentrums nutzen"
GER_utilize_the_zentrum_freeze_desc:	"Während klar ist, dass die CVU zusammenbricht, hat das Zentrum noch keine Maßnahmen ergriffen – lassen Sie uns dies nutzen und so viel wie möglich vom Parteiapparat übernehmen."
GER_knock_stegerwald_down_a_peg:	"Stegerwald einen Dämpfer versetzen"
GER_knock_stegerwald_down_a_peg_desc:	"Während er die CVU zum Zusammenbruch bringt, wird Hugenberg das Zentrum zerstören, sich nach dem Zusammenbruch mehr Macht sichern und Stegerwalds Position als Parteivorsitzender zerstören."
GER_zentrum_in_coalition:	"Das Zentrum in der Koalition"
GER_zentrum_in_coalition_desc:	"Das Zentrum hat bei den Wahlen Großes geleistet, sich einen Sitz in der neuen Regierung gesichert und einen großen Sieg für die Partei errungen."
GER_the_party_under_stegerwald:	"Die Partei unter Stegerwald"
GER_the_party_under_stegerwald_desc:	"Stegerwald hat seiner konservativen Clique die Macht über das Zentrum gesichert. Hoffen wir, dass er es in eine strahlende Zukunft führt."
GER_wirths_new_zentrum:	"Wirths Neues Zentrum"
GER_wirths_new_zentrum_desc:	"Wirth macht das Zentrum zu einer wahren Partei zum Wohle des Volkes. Seine kühle, analytische Herangehensweise und sein Einsatz für die Arbeiter werden das deutsche Zentrum retten."
GER_apply_the_reichskonkordat_to_the_republic:	"Beenden Sie die Debatte um das Reichskonkordat"
GER_apply_the_reichskonkordat_to_the_republic_desc:	"Da die Nazis in Ungnade gefallen sind, schwebt das Reichskonkordat in der Luft, weder bestätigt noch aufgehoben. Wir müssen über sein Schicksal entscheiden und es nutzen – sei es durch seine Abschaffung oder durch seine Neubelebung."
GER_repeal_the_reichskonkordat:	"Das Reichskonkordat aufheben"
GER_repeal_the_reichskonkordat_desc:	"Der Papst wird informiert werden, und wir werden ihn dazu bewegen, das Reichskonkordat aufzuheben, was eine weitere Politisierung der katholischen Kirche und der Bischöfe in politischen Ämtern ermöglicht."
GER_foster_christian_democracy:	"Förderung der Christdemokratie"
GER_foster_christian_democracy_desc:	"Es ist notwendig, die Christdemokratie in Deutschland zu fördern, um sicherzustellen, dass sowohl der Glaube als auch die Demokratie hochgehalten werden."
GER_a_new_age_of_peace:	"Ein neues Zeitalter des Friedens"
GER_a_new_age_of_peace_desc:	"Es ist Zeit für eine neue Ära des Friedens für Deutschland unter demokratischen Verhältnissen, die dem Land Stabilität bringt."
GER_combat_the_reactionary:	"Bekämpfung der Reaktionäre"
GER_combat_the_reactionary_desc:	"Wir müssen die Reaktionäre der DNVP und der NRAF bekämpfen und verhindern, dass sie die Demokratie an sich reißen."
GER_work_towards_fiscal_stability:	"Bemühungen um finanzpolitische Stabilität"
GER_work_towards_fiscal_stability_desc:	"Deutschland muss auf finanzpolitische Stabilität hinarbeiten, um die Wirtschaft in eine großartige neue Ära zu führen."
GER_consultations_with_the_experts:	"Konsultationen mit den Experten"
GER_consultations_with_the_experts_desc:	"Die Regierung sollte sich mit den Experten beraten, um uns dabei zu helfen, die Nation zu modernisieren und sie in eine neue Ära zu führen."
GER_the_socialist_traitor:	"Pro-sozialistischer Verrat"
GER_the_socialist_traitor_desc:	"Wirth war schon immer ein SPD-Sympathisant, nun hat er das Zentrum für sie verraten."
GER_improve_railway_economics:	"Verbesserung der Eisenbahnwirtschaft"
GER_improve_railway_economics_desc:	" Wir werden die wirtschaftlichen Verbindungen nutzen, die Wirth zur Eisenbahnindustrie unterhält. Lassen Sie uns dies nutzen, um auch diesen Bereich zu modernisieren."
GER_technocracy_with_strong_limits:	"Technokratie mit strengen Grenzen"
GER_technocracy_with_strong_limits_desc:	"Deutschland braucht Technokratie, allerdings mit strengen Grenzen, um das Gedeihen von Demokratie und Wirtschaft in Deutschland zu gewährleisten."
GER_politicize_the_trade_unions:	"Aktivierung der katholischen Gewerkschaften"
GER_politicize_the_trade_unions_desc:	"Stegerwalds katholische Gewerkschaften werden genutzt und politisiert, um ihren Einfluss gegenüber allen anderen Gewerkschaften zu stärken."
GER_bring_about_a_new_social_order:	"Eine neue soziale Ordnung schaffen"
GER_bring_about_a_new_social_order_desc:	"In Deutschland wird eine neue katholische soziale Ordnung etabliert, die den Zusammenhalt von Volk, Staat und Wirtschaft stärkt."
GER_intertwine_the_state_and_the_church:	"Staat und Kirche miteinander verflechten"
GER_intertwine_the_state_and_the_church_desc:	" Wir werden den Staatsapparat mit dem der Kirche verflechten. Dies wird unsere Macht in beiden Bereichen festigen, indem wir Getreue in zwei Rollen gleichzeitig einsetzen."
GER_help_the_church_permeate_everyday_german_life:	"Der Kirche helfen, den Alltag zu durchdringen"
GER_help_the_church_permeate_everyday_german_life_desc:	" Es ist die Aufgabe der Kirche, den Alltag in Deutschland zu durchdringen und dafür zu sorgen, dass das deutsche Volk ein gottesfürchtiges Volk ist."
GER_corporatism_with_catholic_characteristics:	"Korporatismus mit katholischen Merkmalen"
GER_corporatism_with_catholic_characteristics_desc:	"Wir müssen den Korporatismus mit katholischen Merkmalen nach Deutschland bringen und die von der SPD angestrebten Veränderungen durch bessere Vorschläge von unserer Seite übertrumpfen."
GER_the_end_of_class_warfare:	"Beenden Sie den Klassenkampf"
GER_the_end_of_class_warfare_desc:	" Es ist an der Zeit, dass der Klassenkampf in Deutschland ein Ende findet, wobei Kirche und Staat in den Auseinandersetzungen des Volkes vermitteln."
GER_organize_german_labor:	"Die deutsche Arbeiterschaft organisieren"
GER_organize_german_labor_desc:	"Die Arbeiterschaft in Deutschland muss staatlich organisiert werden, um der Vorstellung entgegenzuwirken, dass Staat und Arbeiterschaft im Widerspruch zueinander stehen; stattdessen werden Stegerwalds Verbindungen eine Ära des Friedens zwischen beiden herbeiführen."
GER_restore_the_state_churches:	"Wiederherstellung der Staatskirchen"
GER_restore_the_state_churches_desc:	"Die Staatskirchen, sowohl die katholische als auch die evangelische, werden wiederhergestellt, wodurch Deutschland zu seinem früheren christlichen Glauben und Ruhm zurückgeführt wird."
GER_repeal_the_137th_article:	"Artikel 137 aufheben"
GER_repeal_the_137th_article_desc:	"Artikel 137 der Weimarer Verfassung besagt offiziell, dass es keine Staatskirche geben soll; wir werden diesen Artikel aufheben und auf seine vollständige Aufhebung hinarbeiten."
GER_undo_the_secularization_of_germany:	"Die Säkularisierung rückgängig machen"
GER_undo_the_secularization_of_germany_desc:	"Es ist unerlässlich, sich mit dem Säkularismus in Deutschland auseinanderzusetzen. Das Volk muss zur Rechtschaffenheit, zu Gott zurückgeführt werden!"
GER_dvu_in_coalition:	"[GER_cvu_scripted_name_colorless] in der Koalition"
GER_dvu_in_coalition_desc:	 "Die [GER_cvu_scripted_name_colorless] hat bei den Wahlen erfolgreich große Gewinne erzielt und zahlreiche Sitze im Parlament sowie sogar einen Sitz in der Regierung errungen."
GER_the_democratic_hegemon_of_germany:	 "Der christliche Hegemon"
GER_the_democratic_hegemon_of_germany_desc:	"Die [GER_cvu_scripted_name_colorless] ist zum Hegemon des Christentums in Deutschland geworden und führt es in eine strahlende neue Zukunft. Wir werden sie nun zu einer neuen Partei formen, die für die deutsche Demokratie und den Liberalismus kämpft."
GER_the_fullness_of_german_conservatism:	"Die Fülle des deutschen Konservatismus"
GER_the_fullness_of_german_conservatism_desc:	"Wir sind die wahren Erben der FKP, die wahren deutschen Konservativen, und gehen so weit zu sagen, dass Goerdeler nichts Geringeres als ein neuer Bismarck ist, der Deutschland in ein neues Zeitalter der Einheit und Stabilität führt."
GER_fight_for_dvu_stability:	"Kampf für [GER_cvu_scripted_name_colorless] Stabilität"
GER_fight_for_dvu_stability_desc:	"Die [GER_cvu_scripted_name_colorless] ist von Natur aus recht instabil, und wenn sie überleben soll, müssen wir dafür kämpfen und sicherstellen, dass sie nicht zusammenbricht; lassen Sie uns solche Maßnahmen unverzüglich ergreifen!"
GER_the_union_forevermore:	 "Die Union für immer"
GER_the_union_forevermore_desc:	"Die [GER_cvu_scripted_name_colorless] wird so bleiben, wie sie ist: die Verkörperung der Zusammenarbeit und der Vereinigung zweier unterschiedlicher, aber gleichberechtigter Parteien."
GER_the_legacy_of_the_sozialistengesetze:	"Die Sozialistengesetze wieder in Kraft setzen"
GER_the_legacy_of_the_sozialistengesetze_desc:	"Bismarck hat einst Großes gegen die SPD geleistet, und wir hoffen, dass wir, sollten wir seinem Vorgehen folgen, große Erfolge erzielen werden."
GER_end_the_party_rift:	"Beenden Sie die Parteispaltung"
GER_end_the_party_rift_desc:	"Die Spaltung in der [GER_cvu_scripted_name_colorless] kann endlich gelöst werden, sodass wir endlich eins werden in Namen und Wesen."
GER_foster_german_democracy:	"Das Christentum in Deutschland festigen"
GER_foster_german_democracy_desc:	"Mit dem Wandel der DCP sollten wir daran arbeiten, das Christentum in unserer Nation zu fördern und damit eine neue Ära für unser Volk einzuläuten."
GER_expand_pro_state_propaganda:	"Staatsfreundliche Propaganda ausweiten"
GER_expand_pro_state_propaganda_desc:	"Es ist notwendig, die staatsfreundliche Propaganda auszuweiten, um unser Regime zu stärken und sicherzustellen, dass wir Deutschland auf absehbare Zeit regieren werden."
GER_towards_liberalism:	"Auf dem Weg zum Liberalismus"
GER_towards_liberalism_desc:	"Der Liberalismus ist die Zukunft Deutschlands und wird die Rückkehr zum Glanz der Stresemann-Zeit bringen. "
GER_the_party_of_the_middle_class:	"Zusammenarbeit mit der Mittelschicht"
GER_the_party_of_the_middle_class_desc:	"Die DVP muss auch ihre Rolle als Partei der Mittelschicht voll und ganz wahrnehmen und ihr den Wohlstand bringen, den sie verdient."
GER_strenghten_the_new_republic:	"Stärkung der Neuen Republik"
GER_strenghten_the_new_republic_desc:	 "Als Partei in unserer neuen Republik ist es unsere Pflicht, diese zu stärken und die Demokratie für unsere Söhne und Töchter zu sichern."
GER_the_greatest_of_all_republicans:	"Der Größte aller Republikaner"
GER_the_greatest_of_all_republicans_desc:	"Dingledy ist zum Inbegriff eines demokratischen Politikers in Deutschland geworden; er wird die Nation in eine strahlende Zukunft führen und uns helfen, mit allen antidemokratischen Kräften von innen und außen fertig zu werden."
GER_accept_collective_bargaining:	" "Tarifverhandlungen akzeptieren"
GER_accept_collective_bargaining_desc:	"Auch wenn Tarifverhandlungen einigen unserer Anhänger zuwiderlaufen, sind sie unvermeidlich, und es ist besser, mit diesen Menschen zusammenzuarbeiten, als sie unnötig zu bekämpfen"
GER_a_new_social_compromise:	"Einen neuen sozialen Kompromiss herbeiführen"
GER_a_new_social_compromise_desc:	" Da wir Schritte auf die Arbeiter zu gemacht haben, können wir einen neuen sozialen Kompromiss erzielen, der die Freundschaft mit den Arbeitern auf der Grundlage gemeinsamer Ziele sicherstellt"
GER_end_interanal_factionalism:	"Beenden Sie interne Fraktionskämpfe"
GER_end_interanal_factionalism_desc:	"Es ist an der Zeit, die internen Fraktionskämpfe der DVP zu beenden und mit der Vorstellung aufzuräumen, dass es zwei Flügel gibt, die gegeneinander kämpfen."
GER_legacy_of_stinn:	"Stinns Vermächtnis wiederbeleben"
GER_legacy_of_stinn_desc:	"Stinn hat damals viel für die Partei getan, und wir werden in seinem Namen finanzielle Mittel und Unterstützung aus der Industrie gewinnen."
GER_legacy_of_stresemann:	"Das Erbe Stresemanns neu beleben"
GER_legacy_of_stresemann_desc:	"Stresemann ist die prägende Schlüsselfigur der Partei; lassen Sie uns an ihm ein großartiges Vorbild für die Regierungsführung finden."
GER_the_proud_leaders_of_german_monarchism:	"Die stolzen Führer des Monarchismus"
GER_the_proud_leaders_of_german_monarchism_desc:	"Wir sind wahrhaftig zu den Führern des Monarchismus in Deutschland geworden und werden damit Wahlkampf betreiben, um diese Bewegung zu bündeln."
GER_the_kaisers_endorsement_focus:	"Die Unterstützung des Kaisers sichern"
GER_the_kaisers_endorsement_focus_desc:	"Da wir die Führung seiner Bewegung übernommen haben, werden wir den Kaiser dazu bringen, uns zu unterstützen, und so unsere Position in Deutschland vollständig festigen."
GER_maintain_the_conservative_course:	"Den konservativen Kurs beibehalten"
GER_maintain_the_conservative_course_desc:	"Die DVP muss am Konservatismus festhalten, den Platz einnehmen, den sie in Weimar hätte einnehmen sollen, und für die wahren Patrioten Deutschlands eintreten!"
GER_consolidate_elite_support:	"Die Unterstützung der Elite festigen"
GER_consolidate_elite_support_desc:	"Die DVP war schon immer eine Partei der Eliten. Wenn wir Erfolg haben wollen, müssen wir diese Unterstützung und ihre finanziellen Mittel erneut nutzen, um künftige Wahlen zu gewinnen."
GER_the_new_german_establishment:	"Das neue deutsche Establishment"
GER_the_new_german_establishment_desc:	"Wir sind endlich zum neuen deutschen Establishment geworden, als die größte aller Parteien. Wir werden auf absehbare Zeit regieren."
GER_a_respectable_germany:	"Ein respektables Deutschland"
GER_a_respectable_germany_desc:	"Deutschland unter der DVP ist wahrhaftig respektabel geworden – der ideale Mittelweg zwischen Autoritarismus und Demokratie, größer als alle anderen! "
GER_fight_trade_unions:	"Das Schicksal der Gewerkschaften"
GER_fight_trade_unions_desc:	"Wenn die Wirtschaft florieren soll, müssen wir über das Schicksal der Gewerkschaften entscheiden: entweder indem wir mit ihnen zusammenarbeiten und die Mittelschicht sichern, oder indem wir sie bekämpfen und wirtschaftlichen Wohlstand gewährleisten. So oder so muss diese Entscheidung getroffen werden."
GER_a_second_restoration:	"Eine zweite Restauration"
GER_a_second_restoration_desc:	"Der Kaiser wird wieder zu voller Macht gelangen. So werden wir die volle parlamentarische Unterstützung dafür sicherstellen und das tun, was für die Nation richtig ist! "
GER_a_ban_for_the_spd:	"Beenden Sie die sozialistische Subversion"
GER_a_ban_for_the_spd_desc:	"Die SPD ist nicht besser als die Kommunisten und dient lediglich als deren Deckmantel. Deshalb werden wir sie zum Wohle Deutschlands verbieten und vernichten."
GER_a_ban_for_the_kpd:	"Vernichten Sie die kommunistische Entartung"
GER_a_coup_in_all_but_name:	"Ein Staatsstreich in allem außer dem Namen"
GER_a_coup_in_all_but_name_desc:	"Das Deutsche Reich muss wiederhergestellt werden, mit oder ohne Zustimmung des Parlaments. Lassen Sie uns schnell handeln und dies jetzt tun!"
GER_readdress_the_kaiserfrage:	"Die Kaiserfrage neu aufrollen"
GER_readdress_the_kaiserfrage_desc:	"Während sich das Parlament beim ersten Mal gegen das Kaiserreich entschieden hat, müssen wir dies rückgängig machen und eine neue Abstimmung zur Wiederherstellung des Kaiserreichs durchführen!"
GER_expand_the_kaisers_duties:	"Erweiterung der Aufgaben des Kaisers"
GER_expand_the_kaisers_duties_desc:	"Der Kaiser ist das Fundament des neuen Deutschlands. Seine Aufgaben und sein Einfluss sollen so weit ausgebaut werden, dass er alle Deutschen verkörpert."
GER_expand_the_kaisers_duties_fake:	"Erweiterung der Aufgaben des Kaisers"
GER_expand_the_kaisers_duties_fake_desc:	"Der Kaiser ist das Fundament des neuen Deutschlands. Seine Aufgaben und sein Einfluss sollen so weit ausgebaut werden, dass er alle Deutschen verkörpert."
GER_the_fight_against_german_antisemitism:	"Vernichten Sie die Überreste der Nazi-Ideologie"
GER_the_fight_against_german_antisemitism_desc:	"Es ist an der Zeit, dass Deutschland seine Verfehlungen unter den Nazis wiedergutmacht. Daher ist es unerlässlich, hart gegen den Antisemitismus in der Nation vorzugehen."
GER_bring_back_einstein:	"Holen Sie die verbannten Wissenschaftler zurück"
GER_bring_back_einstein_desc:	"Die jüdisch-deutschen Wissenschaftler sahen sich immer in erster Linie als Deutsche. Wir werden diese loyalen Patrioten zurückholen und sie um Vergebung und ihren Dienst bitten."
GER_a_new_era_of_german_science:	"Eine neue Ära der Wissenschaft einläuten"
GER_a_new_era_of_german_science_desc:	"Deutschland ist in eine neue Ära der Wissenschaft eingetreten, die dem Staat eine großartige neue Zukunft beschert und die früheren Konflikte mit den jüdischen Wissenschaftlern überwindet."
GER_national_economic_coordination:	"Die nationale wirtschaftliche Koordination sicherstellen"
GER_national_economic_coordination_desc:	" Wir werden Aspekte einer liberalen Wirtschaft mit staatlicher Zusammenarbeit verbinden, ohne Zwang auszuüben oder die Auswüchse des Kapitalismus zu innerer Zerrissenheit eskalieren zu lassen."
GER_an_era_of_german_wealth:	"Eine Ära des Wohlstands fördern"
GER_an_era_of_german_wealth_desc:	"Durch Goerdelers Reformen ist Deutschland in eine neue Ära des Wohlstands und der Macht eingetreten, wie sie weder das alte Kaiserreich noch die Weimarer Republik je gekannt haben"
GER_goerdelers_new_party:	"Goerdelers neue Partei"
GER_goerdelers_new_party_desc:	"Goerdeler hat es geschafft! Die Partei wurde vor dem Radikalismus bewahrt und hat sich inzwischen wahrhaftig in eine völlig andere Partei verwandelt, die wesentlich stabiler und weniger radikal ist. Das Fundament der deutschen Demokratie. "
GER_sensible_fiscal_policy:	"Wiederherstellung einer vernünftigen Finanzpolitik"
GER_sensible_fiscal_policy_desc:	"Wir müssen Deutschland eine vernünftige Finanzpolitik geben, einen konservativen Liberalismus verwirklichen und Deutschland zu wahrer Blüte führen. "
GER_alliance_with_the_junkers:	"Ein Bündnis mit den Junkern schmieden"
GER_alliance_with_the_junkers_desc:	"Es sind die Junker, die unsere größten Unterstützer waren, daher werden wir beginnen, sie mit unserer Politik zu unterstützen."
GER_restore_the_old_estates:	"Wiederherstellung der alten Junker-Ländereien"
GER_restore_the_old_estates_desc:	"Die Junker-Ländereien von einst sollen wiederhergestellt werden, um eine Rückkehr zur Normalität in Deutschland herbeizuführen."
GER_germany_glorious_as_it_once_was:	"Deutschland, so glorreich wie einst"
GER_germany_glorious_as_it_once_was_desc:	"Mit dem Abschluss unserer Reformen ist Deutschland zur Normalität zurückgekehrt und nun endlich so glorreich wie einst unter dem Kaiser!"
GER_a_time_for_protectionism:	"Protektionistische Maßnahmen ergreifen"
GER_a_time_for_protectionism_desc:	"Es ist Zeit für Protektionismus in Deutschland, um die Interessen unserer Bauern vor denen der Ausländer zu sichern."
GER_the_spirit_of_blut_and_boden:	"Die Blut-und-Boden-Ideologie vertreten"
GER_the_spirit_of_blut_and_boden_desc:	"Wir müssen sicherstellen, dass deutsches Blut und deutscher Boden Vorrang vor denen der entarteten Ausländer haben, um ein Gefühl des Nationalstolzes zu wecken und unseren endgültigen Sieg zu sichern! Dies wird es unserem Volk ermöglichen, Dinge zu kaufen, die aus deutschem Blut hergestellt und auf deutschem Boden angebaut wurden."
GER_dnvp_in_coalition:	"DNVP in der Koalition"
GER_dnvp_in_coalition_desc:	"Der DNVP ist es gelungen, Teil der aktuellen Koalition zu werden. Helfen wir ihnen, ihre Pläne für Deutschlands Zukunft zu verwirklichen."
GER_hugenburgs_legacy:	"Hugenbergs Comeback"
GER_hugenburgs_legacy_desc:	"Hugenberg hat das Unmögliche geschafft und Goeredeler ausmanövriert, wodurch er seine Rückkehr an die Spitze der DNVP und eine neue radikale Ausrichtung der Partei gesichert hat ..."
GER_proper_agrarian_policy:	"Eine angemessene Agrarpolitik verwirklichen"
GER_proper_agrarian_policy_desc:	"Im Gegensatz zu allen anderen deutschen Politikern kennt Hugenberg die Bauernhöfe und weiß, was sie retten wird. Daher ist es an der Zeit, eine angemessene Agrarpolitik in Deutschland einzuführen!"
GER_engrain_antiurbanism:	"Bekämpfen Sie die städtische Entartung"
GER_engrain_antiurbanism_desc:	"Auf dem Lande liegt die Zukunft Deutschlands! Das Volk muss dies begreifen und die gescheiterte Kloake der städtischen Metropolen verlassen."
GER_highten_nationalist_rethoric:	"Verstärken Sie die nationalistische Rhetorik"
GER_highten_nationalist_rethoric_desc:	"Deutschland muss über alles gestellt und das Volk in diesem Sinne indoktriniert werden! Es lebe das neue Deutschland!"
GER_new_progroms:	"Radikalisieren Sie den deutschen Nationalismus"
GER_new_progroms_desc:	"Wenn Deutschland lange leben und gedeihen soll, muss das Volk von seiner Entartung gereinigt werden! Eine neue Welle von Pogromen wird dies bewirken, während wir die Deutschen radikalisieren."
GER_a_new_republic:	" Die wiederhergestellte Republik"
GER_a_new_republic_desc:	"Nachdem wir unsere Macht über die Nation wiedererlangt haben, werden wir verkünden, dass die alte deutsche Republik aus den goldenen 20er Jahren wiederhergestellt ist!"
GER_undermine_the_military:	"Das Militär untergraben"
GER_undermine_the_military_desc:	"Das Militär ist eine Bedrohung für unsere Demokratie, und wir können keinen zweiten Kapp-Putsch riskieren; daher müssen wir den Einfluss des Militärs einschränken."
GER_military_depoliticization:	"Entpolitisierung des Militärs"
GER_military_depoliticization_desc:	"Bevor wir seinen Einfluss im Inland beenden, müssen wir das Militär zunächst offiziell entpolitisieren und Becks Macht in der Regierung beseitigen."
GER_ban_internal_operations:	"Verbot innerstaatlicher Operationen"
GER_ban_internal_operations_desc:	"Wir können nun den letzten Schritt unseres Plans umsetzen, indem wir dem Militär die Teilnahme an innerstaatlichen Operationen verbieten und diese Aufgabe stattdessen der Polizei übertragen."
GER_an_eye_to_the_left:	"Ein Auge auf die Linke"
GER_an_eye_to_the_left_desc:	" Unsere oberste Priorität ist es, uns auf die KPD und ihre kommunistischen Milizen zu konzentrieren, die in Deutschland Chaos anrichten ..."
GER_destroy_the_antifa:	"Zerstören Sie die Antifaschistische Aktion"
GER_destroy_the_antifa_desc:	"Obwohl sie sich selbst als Antifaschisten bezeichnen, ist die Antifaschistische Aktion nichts weiter als eine Tarnorganisation der KPD. Wir müssen diesen Radikalen ein Ende setzen. "
GER_reinstate_the_reichtagsbrandverordnung:	"Die Reichstagsbrandverordnung wieder in Kraft setzen"
GER_reinstate_the_reichtagsbrandverordnung_desc:	"Um die KPD vollständig zu verbieten, werden wir die Reichstagsbrandverordnung wieder in Kraft setzen und damit alle Formen des Kommunismus in Deutschland verbieten."
GER_wehrhafte_demokratie:	"Auf dem Weg zu einer wehrhaften Demokratie"
GER_wehrhafte_demokratie_desc:	"Wir müssen eine Demokratie aufbauen, die "wehrhaft" ist und in der Lage ist, sich gegen Radikalismus zu verteidigen und diesen zu vernichten."
GER_an_eye_to_the_right:	"Ein Auge auf die Rechte"
GER_an_eye_to_the_right_desc:	"Es ist unsere oberste Priorität, uns auf die NRAF-Radikalen und Nazis sowie die Gewalt der SA zu konzentrieren, um Frieden und Wohlstand in unserer Zeit wiederherzustellen."
GER_fight_the_sa:	"Bekämpft die SA"
GER_fight_the_sa_desc:	"Die SA muss weg, und deshalb werden wir unsere Armee darauf vorbereiten, sie zu bekämpfen und zu vernichten. Die Städte werden von ihrer Unterdrückung befreit werden!"
GER_demokratieschutzgesetz:	"Verabschieden Sie das Demokratieschutzgesetz"
GER_demokratieschutzgesetz_desc:	"Es ist nun an der Zeit, das "Demokratieschutzgesetz" zu verabschieden, um das Verbot der radikalen Rechten und deren Zerschlagung sicherzustellen."
GER_unite_with_the_sapd_resistance:	" Schließen Sie sich dem Widerstand der SAPD an"
GER_unite_with_the_sapd_resistance_desc:	"Die SAPD unterscheidet sich nicht allzu sehr von uns, und daher werden wir mit ihr zusammenarbeiten, um die Nazis zu stürzen, zumal sie bereits über ein aktives Widerstandsnetzwerk verfügt. Dies wird dazu beitragen, die Verbindung zwischen den Flügeln der SPD wiederherzustellen."
GER_nie_wieder_ist_jetzt:	"Nie wieder ist jetzt!"
GER_nie_wieder_ist_jetzt_desc:	"Die Menschen müssen wissen, dass wir stets wachsam sein müssen, getreu dem Motto "Nie wieder ist jetzt!", um sicherzustellen, dass unsere Demokratie gesichert ist und der Faschismus in Deutschland nicht erneut Verwüstung anrichtet!"
GER_allied_intervention:	"Alliierte Intervention"
GER_allied_intervention_desc:	"Der Widerstand muss sich an die westlichen Alliierten und die alten Demokratien wenden und deren Unterstützung gewinnen, um mit deren Streitkräften die Nazis zu stürzen."
GER_the_center_reforged:	"Das Zentrum neu geschmiedet"
GER_the_center_reforged_desc:	"Das Zentrum der deutschen Politik wurde neu geschmiedet, was es uns ermöglicht, mit den Nazis fertig zu werden und eine neue Republik aufzubauen!"
GER_regroup_spd_exiles:	"SPD-Exilanten neu formieren" "
GER_regroup_spd_exiles_desc:	"Die SPD, einst die stärkste Partei Deutschlands und eine der langjährigsten Widerstandskräfte gegen die Nazis, wird für unseren Aufstand gewonnen, damit ihre Anhänger helfen, Hitler zu stürzen"
GER_proper_christian_resistance:	"Wahrer christlicher Widerstand"
GER_proper_christian_resistance_desc:	"Das Zentrum und andere protestantische Gruppen sollen Beck und Goerdeler unterstützen und sie gegen Hitler aufbringen!"
GER_die_letzte_verschwoerung_shortcut:	"Politik: Putsch gegen Hitler"
GER_die_letzte_verschwoerung:	"Die Beck-Gördel-Verschwörung"
GER_die_letzte_verschwoerung_desc:	"Während Hitler die absolute Macht an sich gerissen zu haben scheint, haben Beck und Gördel beschlossen, eine Verschwörung anzuzetteln, um den Mann zu stürzen und Deutschland vor seiner wahnsinnigen Ideologie zu retten!"
GER_operation_valkyre:	"Operation Walküre"
GER_operation_valkyre_desc:	"Es ist Zeit zuzuschlagen! Wir werden im Westen Deutschlands einen Putsch starten, um diese Region für uns zu sichern und die Nazis ein für alle Mal zu vertreiben."
GER_secure_freikorps_remnants:	"Die Überreste des Freikorps sichern"
GER_secure_freikorps_remnants_desc:	"Wir werden nun handeln, um die Überreste des einst kühnen Freikorps zu sichern und die neue Form des Sozialismus zu vernichten, die uns unterdrückt."
GER_a_deal_with_canaris:	"Ein Deal mit Canaris"
GER_a_deal_with_canaris_desc:	"Wir werden mit Wilhelm Canaris, dem Chef der Abwehr, einen Deal aushandeln, um seine Fähigkeiten zu nutzen und uns dabei zu helfen, die Nazis zu stürzen."
GER_infiltrate_the_reich_itself:	"Das Reich selbst infiltrieren"
GER_infiltrate_the_reich_itself_desc:	"Canaris startet nun eine groß angelegte Operation, um die Nazis mithilfe ihres eigenen Staatsapparats zu infiltrieren und zu untergraben, was uns die Möglichkeit gibt, sie mit geringeren Kräften zu vernichten."
GER_expand_military_backing:	"Militärische Unterstützung ausbauen"
GER_expand_military_backing_desc:	" Um erfolgreich zu sein, muss der Putsch die Unterstützung der Wehrmacht sichern; daran soll Tag und Nacht gearbeitet werden!"
GER_the_wehrmachts_iron_fist:	"Gördel zu entmachten"
GER_the_wehrmachts_iron_fist_desc:	"Beck hat entschieden, dass eine Zusammenarbeit mit Goerdeler nicht mehr der richtige Weg ist. Nur die Wehrmacht kann Deutschland befreien, und genau das muss sie tun!"
GER_international_brigades:	"Internationale Brigaden"
GER_international_brigades_desc:	"Die deutsche Revolution ruft die Welt auf! Wir rufen verzweifelt um Hilfe und suchen alle Linken und Republikaner, die uns retten können!"
GER_secure_wilhelms_support:	" Sichern Sie sich die Unterstützung des Kaisers"
GER_secure_wilhelms_support_desc:	"Der Kaiser soll zum Zeitpunkt des Starts der Operation Walküre nach Deutschland zurückkehren und der Revolution damit enorme Legitimität verleihen!"
GER_a_disturbing_deal_sa:	"Ein beunruhigender Deal"
GER_a_disturbing_deal_sa_desc:	" Nach der Nacht der langen Messer wenden sich große Teile der SA gegen das Hitler-Regime und würden sich gerne mit uns verbünden, sollten wir ihnen die Möglichkeit geben, ihre alten Aktivitäten fortzusetzen; auch wenn dies einige ethische Bedenken aufwirft, wäre es ein Segen im bevorstehenden Krieg..."
GER_plan_a_soviet_expedition:	"Planen Sie eine sowjetische Expedition"
GER_plan_a_soviet_expedition_desc:	"Wir werden nun Moskau bitten, Einheiten für uns vorzubereiten, damit wir uns bei Kriegsausbruch durch das Baltikum nach Königsberg schleichen können, was es uns ermöglicht, zusätzliche Streitkräfte gegen die Nazis aufzustellen!"
GER_comintern_kpd_funding:	"Finanzierung durch die Komintern und die KPD"
GER_comintern_kpd_funding_desc:	"Um den Sturz des Regimes zu unterstützen, werden wir uns an die KPD wenden und sie nutzen, um Zugang zu russischen Geldern zu erhalten."
GER_consolidate_dnvp_dissenters:	"DNVP-Dissidenten konsolidieren"
GER_consolidate_dnvp_dissenters_desc:	"Die Weimarer Republik und die Freikorps haben mit den alten DNVP-Mitgliedern starke Verbündete in der Nazi-Bürokratie. Lassen Sie uns Goerdeler dazu bringen, Kontakt zu ihnen aufzunehmen und sie dazu zu bewegen, sich unserem Widerstand anzuschließen!"
GER_defeat_without_dishonor:	"Niederlage ohne Schande"
GER_defeat_without_dishonor_desc:	"Es gibt viele defätistische Nazis, die bereit sind, sich uns anzuschließen, sollten wir ihnen Amnestie versprechen. Lassen Sie uns dies tun, um diesen Krieg schnell zu gewinnen! "
GER_gather_the_weimar_remnants:	"Die Überreste der Weimarer Republik versammeln"
GER_gather_the_weimar_remnants_desc:	"Wir werden die Überreste der alten Weimarer Republik versammeln, uns die Unterstützung der wenigen verbliebenen Demokraten sichern und unsere Herrschaft legitimieren."
GER_unite_the_right:	"Die Rechte vereinen"
GER_unite_the_right_desc:	"Die Rechte wird vereint sein, mit dem völkisch-katholischen Bündnis. Bald wird ganz Deutschland von uns Konservativen befreit sein!"
GER_found_the_german_interim_government:	"[GER_found_the_german_interim_government]"
GER_found_the_german_interim_government_desc:	"[GER_found_the_german_interim_government_desc]"
GER_found_the_german_interim_government_real:	"Eine provisorische Republik"
GER_found_the_german_interim_government_real_desc:	"Da noch viele Fragen zu klären sind, scheint es am klügsten zu sein, eine provisorische Republik auszurufen und die anderen Fragen später zu behandeln, wenn die Zeit reif ist. "
GER_settle_the_kaiserfrage:	"Die Kaiserfrage klären"
GER_settle_the_kaiserfrage_desc:	"Es gibt in unserem neuen Deutschland breite Unterstützung für die Rückkehr der Monarchie. Aus diesem Grund ist es absolut notwendig, dass wir entscheiden, ob es eine neue Monarchie geben soll oder nicht ..."
GER_heil_kaiser_dir:	"Heil Kaiser Dir!"
GER_heil_kaiser_dir_desc:	"Lasst uns die Soldaten versammeln, um diesen Krieg für den Kaiser zu gewinnen! Alle sollen sich vor dem Stiefel des deutschen Heeres verneigen! Heil dem Kaiser!"
GER_republicanism_at_its_finest:	"Republikanismus in seiner schönsten Form"
GER_republicanism_at_its_finest_desc:	"Der Republikanismus wurde durch die Werke unseres Staates groß gemacht! Alle müssen sich daran erfreuen."
GER_die_neue_wache:	"Die Neue Wache"
GER_die_neue_wache_desc:	"Ein neues Denkmal wird errichtet, eines für die gefallenen Deutschen in den letzten Kriegen! Wir werden an ihr großes Opfer für diese große Nation gedenken! "
GER_learn_from_the_enabling_act:	"Kopieren Sie das Ermächtigungsgesetz"
GER_learn_from_the_enabling_act_desc:	"Das Ermächtigungsgesetz gibt uns einen guten Fahrplan dafür, wie wir deutsche Institutionen an uns reißen können. Dies muss so schnell wie möglich genutzt werden."
GER_r56_strasserite_state_fascism:	"Deutscher Volksstaat"
GER_r56_strasserite_state_fascism_DEF:	"der Deutsche Volksstaat"
GER_r56_strasserite_state_fascism_ADJ:	"Deutsch"
GER_beck_tag_neutrality:	"Nationale Republik Deutschland"
GER_beck_tag_neutrality_DEF:	"die Nationale Republik Deutschland"
GER_beck_tag_neutrality_ADJ:	"Deutsch"
GER_gr_beck_tag_neutrality:	"Nationale Republik Großdeutschland"
GER_gr_beck_tag_neutrality_DEF:	"die Nationale Republik Großdeutschland"
GER_gr_beck_tag_neutrality_ADJ:	"Deutsch"
GER_kpd_temp_communism:	"Deutscher Staat"
GER_kpd_temp_communism_DEF:	"der Deutsche Staat"
GER_kpd_temp_communism_ADJ:	"Deutsch"
GER_kpd_gdr_communism:	"Deutsche Demokratische Republik"
GER_kpd_gdr_communism_DEF:	"die Deutsche Demokratische Republik"
GER_kpd_gdr_communism_ADJ:	"Deutsch"
GER_kpd_soviet_communism:	"Deutsche Sowjetrepublik"
GER_kpd_soviet_communism_DEF:	"die Sowjetrepublik Deutschland"
GER_kpd_soviet_communism_ADJ:	"sowjetisch"
GER_kpd_cosmetic_communism:	"KPD-Aufstand"
GER_kpd_cosmetic_communism_DEF:	"der Aufstand der KPD"
