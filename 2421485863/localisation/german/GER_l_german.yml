GER_the_enemies_of_democracy:	"Die Feinde der Demokratie"
GER_the_enemies_of_democracy_desc:	" Viele Teile der neuen deutschen Gesellschaft wünschen sich den Sturz der gegenwärtigen demokratischen Ordnung. Wir haben die Recht §9NRAF§! mit der §LSA§! und die rechtsgerichteten §gFreikorps§!, die entschieden gegen alles sind, , was sie als "sozialistisch" betrachten. Dann gibt es noch die §tKPD§! und ihre eigene Miliz, die §tAntifaschistische Aktion§!, die darauf abzielen, unsere Strukturen zu zerstören und ein linkes Deutschland herbeizuführen. \nDas ist jedoch noch nicht alles, denn sogar einige Teile des §gMilitärs§! sind mit dem aktuellen Stand der Demokratie in Deutschland unzufrieden und streben deren Sturz an... \n\n\n§gMilitär§! Stellungnahme der Regierung: §Y§Y[?GER_mil_opinion]§!§!\n§gMilitär§! Einfluss in Deutschland: §Y§Y[?GER_mil_inf]§!§!\n\n§tSollte§! §gMilitär§! §tEinfluss jemals größer sein als der§! §gMilitär§! §tMeinung stehen, werden sie Maßnahmen ergreifen.§!"
