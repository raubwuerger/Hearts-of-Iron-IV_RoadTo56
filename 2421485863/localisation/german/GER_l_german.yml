GER_colonizing_the_east_desc:	 "Nachdem wir unser rechtmäßiges Ackerland im Osten erobert haben, lassen Sie uns dieses nutzen.\nLassen Sie uns deutsche Bauern dorthin entsenden, um das Land zu kolonisieren und zu bewirtschaften, wodurch unsere Nahrungsmittelversorgung gesichert und die Germanisierung des Landes vorangetrieben wird.\n\nDer aktuelle Stand unserer Kolonisierungsbemühungen ist: \n\nIn §Y[190.GetName]§!: §G[?190.colonization_status]0 % §!\n\nIn §Y[809.GetName]§!: §G[?809.colonization_status]0 %§!\n\nIn §Y[808.GetName]§!: §G[?808.colonization_status]0 % §!\n\nIn §Y[12.GetName]§!: §G[?12.colonization_status]0 %§!\n\nIn §Y[810.GetName]§!: §G[?810.colonization_status]0 %§!\n\nIn §Y[811.GetName]§!: §G[?811.colonization_status]0 %§!\n\nIn §Y[812.GetName]§!: §G[?812.colonization_status]0 %§!\n\nIn §Y[813.GetName]§!: §G[?813.colonization_status]0 %§!\n\nIn §Y[13.GetName]§!: §G[?13.colonization_status]0 % §!\n\nIn §Y[191.GetName]§!: §G[?191.colonization_status]0 %§!\n\nIn §Y[209.GetName]§!: §G|___NS00011 3___|0 %§!"
GER_send_farmers_east:	"Landwirte entsenden nach §Y[FROM.GetName]§! "
GER_full_integration:	"Vollständig integrieren §Y[FROM.GetName]§!"
new_ger.1.t:	"Operation Walküre startet"
new_ger.1.d:	"Die von Gördel und Beck angeführten antinazistischen Kräfte haben endlich ihren Putsch durchgeführt … Während Hitler zunächst überlebt und den Osten gesichert hat, ist der westliche Teil der Nation in Aufstand getreten und hat Deutschland in einen großen Bürgerkrieg gestürzt …"
new_ger.1.a:	"Lasst uns diesen Nazi-Abschaum aus unserem Land vertreiben!"
new_ger.2.t:	"Die deutschen Revolutionäre bitten um die Aufstellung einer Interventionsstreitmacht"
new_ger.2.d:	"Die Deutschen haben eine weitreichende Anti-Hitler-Verschwörung geschmiedet. Sie planen, den Staat bald zu stürzen, und bitten uns, rasch eine Interventionsstreitmacht bereitzustellen ..."
new_ger.2.a:	"Für einen Freund tue ich alles."
new_ger.2.b:	"Das ist zu riskant ... "
new_ger.3.t:	"[FROM.GetNameDefCap] Stimmt der Aufstellung einer Interventionsstreitmacht zu"
new_ger.3.d:	"[FROM.GetNameDefCap] hat auf unsere Bitte um Entsendung einer Interventionsstreitmacht reagiert... Zu unserem großen Glück haben sie zugestimmt und mehrere Divisionen bereitgestellt."
new_ger.3.a:	"Danke, meine Kameraden!"
new_ger.4.t:	"[FROM.GetNameDefCap] Lehnt die Aufstellung einer Interventionsstreitmacht ab"
new_ger.4.d:	"[FROM.GetNameDefCap] ist leider der Ansicht, dass unsere Pläne zu ehrgeizig sind und zum Scheitern verurteilt sind; dies hat dazu geführt, dass sie unseren Appell um Unterstützung abgelehnt haben."
new_ger.4.a:	"Enttäuschend ..."
new_ger.5.t:	"Bayern erhebt sich!"
new_ger.5.d:	"Da die Katholiken unsere Sache unterstützen, haben sie nun ihre Aufstandsvorbereitungen abgeschlossen und sich uns angeschlossen!"
new_ger.5.a:	"Endlich!"
new_ger.6.t:	"Arbeiter, erhebt euch!"
new_ger.6.d:	"Die SPD-Arbeiter in Sachsen und Niederschlesien haben sich gegen die Nazis erhoben, um unseren großen Aufstand zu unterstützen!"
new_ger.6.a:	"Ich sehe nur Deutsche!"
new_ger.7.t:	"Das neue Deutschland"
new_ger.7.d:	"Nachdem die Nazis entmachtet wurden, ist im neuen Deutschland ein allgemeiner Machtkampf ausgebrochen, bei dem Monarchisten, Demokraten und sogar Kommunisten versuchen, die Kontrolle über diesen zerstörten und ausgebrannten Staat zu erlangen; während dies andauert, wird nur die Zeit zeigen, wer den neuen Staat führen wird... "
new_ger.7.a:	"Ordnung muss sein!"
new_ger.8.t:	"Kommunistische Exilanten kehren nach Deutschland zurück"
new_ger.8.d:	"Während die Nazis aus Deutschland fliehen, streben die Kommunisten nach Rückkehr und sind massenhaft an unseren Grenzen aufgetaucht. Sollen wir diese Emporkömmlinge nach Hause zurückkehren lassen?"
new_ger.8.a:	"Willkommen zu Hause, Kameraden!"
new_ger.8.b:	"Die Nazis hatten recht mit ihnen!"
new_ger.9.t:	"Gründung der NRAF"
new_ger.9.d:	"Im Einklang mit unserer Revolution haben verschiedene rechtsextreme Gruppen, darunter desillusionierte SA-Mitglieder und Otto Strasser, beschlossen, eine neue Partei zu gründen, um ihre Ideen für eine deutsche Revolution umzusetzen. ..\nSie haben den Namen "NRAF" (Nationalrevolutionäre Arbeiterfront) gewählt, um ihre linksgerichteten Nazi-Ideale zu unterstützen.\n Da unklar ist, wer diese Gruppe anführen soll, haben sie sich getroffen und eine Parteiversammlung abgehalten, um auf die Gründung der Nationalrevolutionären Arbeiterfront anzustoßen."
new_ger.9.a:	"Lutze hat am meisten geleistet."
new_ger.9.b:	"Es sollte Strasser sein."
new_ger.9.c:	"Die Partei kann keinen Kompromiss finden ..."
new_ger.10.t:	"Der konservative Kongress"
new_ger.10.d:	"Auf Druck von Goerdeler, der beschlossen hat, seinen Einfluss im neuen Deutschland auszubauen, haben sich Vertreter des Zentrums und der DNVP getroffen, um eine mögliche gemeinsame christlich-konservative Partei zu erörtern, wobei sie ihre Differenzen im Namen des deutschen Konservatismus, Christentums und Monarchismus beiseite und sich vereint gegen die satanische SPD sowie die Radikalen in der NRAF und der KPD zu stellen, während sie sich gleichzeitig vom Chaos und den internen Machtkämpfen der neu gegründeten LVP fernhalten. \nZwar würde dies von beiden Seiten immense Opfer erfordern, doch ist es nicht ausgeschlossen, insbesondere angesichts der intensiven Zusammenarbeit gegen die NSDAP. Um diese neue Partei ins Leben zu rufen, hat Goerdeler dem Zentrum Verfassungsreformen angeboten, die dem katholischen Deutschland Autonomie gewähren, sollten sie sich seiner Sache anschließen. \nAls die Nacht hereinbricht und Goerdeler seinen Druck mit allen Mitteln verstärkt,"
new_ger.10.a:	"Die CVU ist geboren!"
new_ger.10.b:	"Die Delegierten des Zentrums lehnen entschieden ab"
new_ger.11.t:	"Die Kaiserfrage"
new_ger.11.d:	"Damit die Nation stabil bleibt, ist es an der Zeit, die Kaiserfrage anzugehen. Wie soll das Schicksal unseres neuen Deutschlands aussehen? Sollen wir unsere alten Wege akzeptieren und ein begrenztes Deutsches Reich wiederherstellen, in dem der Kaiser als Präsident fungiert, oder sollen wir uns dem wahren Republikanismus verschreiben?"
new_ger.11.a:	"Deutschland muss eine Republik sein!"
new_ger.11.b:	"Der Kaiser soll zurückkehren!"
new_ger.12.t:	"Die Führungsfrage"
new_ger.12.d:	"Trotz Goerdelers Reform der DNVP und seiner Führung der Partei im Zuge dieser Wiederherstellung sehnen sich viele in der DNVP immer noch nach einer Rückkehr zu den alten glorreichen Tagen unter Hugenbergs reaktionärer Clique. Da die DNVP nun Teil der deutschen Regierung ist, hat Hugenberg beschlossen, den Moment zu nutzen, um erneut zu versuchen, die Macht zu sichern, indem er eine innerparteiliche Wahl fordert, um Goerdeler und seine usurpatorischen Anhänger zu verdrängen und die Führungsfrage ein für alle Mal zu klären, wodurch die Parteiführung wieder dem legitimen Führer übertragen würde.\n\nDa viele in der Partei deutlich gemacht haben, dass sie die Partei verlassen und mit Hugenberg eine neue gründen würden, sollte dies abgelehnt werden, blieb Goerdeler keine andere Wahl, als zuzustimmen . Nach einer langen Sitzung auf einem Parteitag fand die Abstimmung statt, bei der der nur halbwegs legitime Goerdeler gegen den von den Nazis befleckten Hugenberg antrat.\nAls sich der Staub gelegt hat, wird ein Sieger verkündet, und die Partei schart sich um ihren wahren Führer."
new_ger.12.a:	"Es scheint, als habe diese ganze Tortur Goerdelers Führungsrolle gestärkt."
new_ger.12.b:	"Schließlich kann niemand leugnen, dass Hugenberg die wahre Seele der Partei ist."
new_ger.13.t:	"Der Hauptkandidat der DVP"
new_ger.13.d:	" Angesichts der bevorstehenden Wahlen muss die DVP ihre Differenzen beiseite legen und einen Anführer als Galionsfigur wählen, um Stimmen zu sichern und in offiziellen Situationen zu handeln."
new_ger.13.a:	"Jarres’ Energie wird der DVP zum Erfolg verhelfen."
new_ger.13.b:	"Dingledeys Gelassenheit wird die Partei zum Sieg führen. "
new_ger.14.t:	"Die Führung des Zentrums"
new_ger.14.d:	"Angesichts der Reform des Zentrums muss entschieden werden, welcher Flügel die Führung übernehmen wird: Während die Linke unter Wirth für Sozialdemokratie gegen alle Kräfte des Radikalismus eintritt, kämpfen Stegerwald und seine Konservativen für den Katholizismus und den konservativen Gewerkschaftswesen – es ist unklar, wer in diesem Machtkampf triumphieren wird. So oder so muss eine Entscheidung der Führung getroffen werden, damit das Zentrum nach Brüning’s Scheitern vorankommen kann"
new_ger.14.a:	"Letztendlich ist das Zentrum eine religiöse Partei."
new_ger.14.b:	"Was ist Politik ohne Reformen?"
new_ger.15.t:	"Ein Nachfolger für Wels"
new_ger.15.d:	"Da Wels von Tag zu Tag älter wird, ist es an der Zeit, dass er in den Ruhestand geht. Dazu wird er nun gezwungen sein, einen Nachfolger zu wählen, der ihn ersetzt. Da es mehrere geeignete Kandidaten gibt, liegt die Entscheidung bei ihm. "
new_ger.15.a:	"Hans Vogel und seine Konservativen haben Wels’ Stimme."
new_ger.15.b:	"Kurt Schumacher ist die dynamische Wahl."
new_ger.15.c:	"Carlo Mierendorff war während der Verschwörung die größte Hilfe. "
new_ger.16.t:	"[GER.GetNameDefCap] Schlägt Abrüstung vor"
new_ger.16.d:	"Deutsche Gesandte haben uns ihre erfolgreiche Politik zur Reduzierung ihrer Militärausgaben und zur Förderung des Friedens aufgezeigt. Sie bieten dies nun allen anderen Nationen in Europa an, einschließlich uns, um einen dauerhaften Frieden zu sichern."
new_ger.16.a:	"Es wäre töricht, dies abzulehnen!"
new_ger.16.b:	"Es wäre töricht, dies anzunehmen!"
new_ger.17.t:	"[FROM.GetNameDefCap] Bietet an, unseren Anteil am Ostland zu kaufen"
new_ger.17.d:	"Deutsche Gesandte sind mit einer einfachen Bitte zu uns gekommen. Sie hoffen, bestimmte baltische Ländereien erwerben zu können, um dort Landwirtschaft zu betreiben. Da wir einige davon besitzen, haben sie uns ein Angebot unterbreitet, diese von uns zu kaufen."
new_ger.17.a:	"Geld bewirkt Wunder ..."
new_ger.17.b:	"Dieses Land gehört rechtmäßig Russland!"
new_ger.18.t:	"[FROM.GetNameDefCap] Antwort auf unsere Anfrage"
new_ger.18.d:	"Nachdem wir die von Russland gehaltenen Teile des Ostlands angefordert haben, haben die Russen die Angelegenheit geprüft und nun auf unsere Anfrage geantwortet."
new_ger.18.a:	"Und zu unserer großen Freude haben sie zugestimmt!"
new_ger.18.b:	" Leider haben diese Untermenschen abgelehnt!"
new_ger.19.t:	"[FROM.GetNameDefCap] Fordert das Baltikum"
new_ger.19.d:	"Mit ihrem Plan, riesige Mengen an Ackerland im Osten zu erwerben, sind die Deutschen zu uns gekommen und haben alle unsere baltischen Gebiete gefordert. Was tun wir angesichts einer solch bedrohlichen Forderung?"
new_ger.19.a:	"Wir haben keine andere Wahl, als zuzustimmen."
new_ger.19.b:	"Das ist lächerlich!"
new_ger.20.t:	"[FROM.GetNameDefCap] gibt sein Land auf"
new_ger.20.d:	"[FROM.GetNameDefCap] hat unsere Forderungen gehört und sich aus unseren Gebieten zurückgezogen. Wir sind nun einen Schritt näher daran, das Ostland vollständig unter unsere Kontrolle zu bringen. "
new_ger.20.a:	"Herrlich!"
new_ger.21.t:	"[FROM.GetNameDef] Weigert sich"
new_ger.21.d:	"Nachdem unsere Feinde unsere Forderungen nach der Abtretung unseres rechtmäßigen Ackerlandes gehört haben, haben sie uns zurückgewiesen. Das kann nicht hingenommen werden, und sie müssen sterben!"
new_ger.21.a:	"Dann werden wir uns unser Geburtsrecht mit Gewalt holen!"
new_ger.22.t:	"Reichstagswahlen"
new_ger.22.d:	"In Deutschland haben nun Neuwahlen stattgefunden, wodurch eine neue Regierung mit einer neuen Agenda für unsere große Nation gebildet werden kann. Lasst uns diese neuen Parlamentarier an unserer Spitze willkommen heißen und unser Bestes tun, um ihnen zu helfen, gut zu regieren."
new_ger.22.a:	"Gedeihe im Glanz dieser Freude, mein Vaterland!"
new_ger.23.t:	"Die Bekennende Kirche entsteht"
new_ger.23.d:	"Nachdem wir uns zu sehr in die Angelegenheiten der Kirche eingemischt haben, haben bestimmte Christen unsere Programme abgelehnt und eine Kirche gegründet, die sich uns entgegenstellt. Das ist eine Katastrophe, und ihre Überheblichkeit muss ein Ende haben."
new_ger.23.a:	"Scheiß auf sie!"
new_ger.24.t:	"Das Reichsverteidigungsgesetz"
new_ger.24.d:	"Da Deutschland erneut in einen großen Krieg verwickelt ist, hat das Militär beantragt, gemeinsam die Staatsführung zu übernehmen und Wahlen auszusetzen, damit Deutschland sich wesentlich effizienter verteidigen kann."
new_ger.24.a:	"Wir müssen dies unverzüglich verabschieden!"
new_ger.24.b:	"Wir werden unsere Demokratie nicht auf diese Weise aufs Spiel setzen!"
new_ger.25.t:	"Das Reichsverteidigungsgesetz läuft aus"
new_ger.25.d:	"Da der Krieg beendet ist, sieht das Reichsverteidigungsgesetz vor, dass es Zeit für Neuwahlen ist. Diese werden nun zum Wohle unseres Volkes abgehalten."
new_ger.25.a:	"Großartig!"
new_ger.25.b:	"Nicht so schnell, mein Lieber ..."
new_ger.26.t:	"Die letzte Angelegenheit"
new_ger.26.d:	" Da wir Wahlen abhalten, müssen wir noch eine letzte Angelegenheit besprechen: die Häufigkeit unserer Wahlen. Ein längerer Zeitraum würde eine stabilere Regierung bedeuten, ein kürzerer hingegen mehr Macht für das Volk. Was sollen wir tun?"
new_ger.26.a:	"Halbjährliche Wahlen sind am besten."
new_ger.26.b:	"Die vier Jahre sind golden."
new_ger.26.c:	"Sechs Jahre sind am besten für die Stabilität."
new_ger.27.t:	"Wirth springt ab"
new_ger.27.d:	" Da das Zentrum durch eine Koalition mit der DNVP seine Seele verkauft hat, fühlt sich Wirth betrogen, da die Koalition trotz seiner Führung und seines Vetos gebildet wurde; er hat daher seine Getreuen mitgenommen und das Zentrum zugunsten einer niedrigeren Position in der SPD verlassen. Das Land befindet sich im Chaos, da die Regierung ebenso schnell zerfallen ist, wie sie gebildet wurde."
new_ger.27.a:	"Schockierend, lassen Sie uns die Scherben auflesen.. ."
new_ger.28.t:	"Der Vorschlag der DNVP"
new_ger.28.d:	"Da das Zentrum durch Wirths Austritt aus der Partei in sich zusammengebrochen ist, hat die DNVP Adenauer angesprochen und eine Fusion vorgeschlagen, die es den deutschen Konservativen ermöglichen würde, sich unter einem starken Banner zu vereinen. Da der linke Flügel des Zentrums weg ist, scheint dies der einzige Weg zu sein, wie das Zentrum überleben und in dieser neuen Situation als relevante politische Kraft agieren kann. Daher könnte eine vereinte christlich-konservative Partei der einzige Weg sein, die Rechte der Katholiken im neuen Deutschland angemessen zu verteidigen..."
new_ger.28.a:	"In dieser verzweifelten Lage ist dies notwendig."
new_ger.28.b:	"Wir werden unsere Seelen nicht weiter verkaufen!"
new_ger.29.t:	"Ein neuer November"
new_ger.29.d:	"Eine neue Welle der Gewalt breitet sich im zerrütteten Deutschland aus. Die Kommunisten haben sich vom konservativen Widerstand abgespalten und beschlossen, den offenen Aufstand zu erklären. Damit ist eine neue Fraktion in den Kampf in Deutschland eingetreten, während revolutionäre Gewalt die Straßen erobert.\nEs scheint, als ob trotz all dessen, was die Nazis unternommen haben, um die Ausbreitung des Kommunismus zu verhindern, der Wille der Arbeiter Wille dennoch Gehör und Befolgung finden wird, während eine rote Flut die industriellen Kerngebiete des Reichs überrollt. Nur die Zeit wird zeigen, ob dieser Aufstand von Leuten wie Waldemar Pabst niedergeschlagen wird oder ob er gedeihen und florieren wird, wie es die Novemberrevolution vor 20 Jahren tat..."
new_ger.29.a:	"Es lebe die neue Revolution!"
new_ger.30.t:	"Otto Wels haucht seinen letzten Atemzug aus"
new_ger.30.d:	"Da Otto Wels verstorben ist, muss die SPD schnellstmöglich einen Nachfolger für ihn wählen, damit sie nicht von ihren Rivalen überholt wird. Es muss eine gute Wahl getroffen werden, wenn die Partei in eine strahlende neue Zukunft schreiten soll. Nach der Bekanntgabe von Wels’ Testament scheint es, dass nur eine Fraktion in der Partei geeignet ist, sie in diese neue Ära zu führen. Daher:"
new_ger.30.a:	"Hans Vogel und seine Konservativen haben Wels’ Stimme."
new_ger.30.b:	"Kurt Schumacher wird die Partei vor kommunistischer Unterwanderung bewahren."
new_ger.30.c:	"Carlo Mierendorff war während der Verschwörung die größte Hilfe und hat seine Loyalität unter Beweis gestellt."
new_ger.31.t:	"[FROM.GetNameDefCap] steht auf unserer Seite!"
new_ger.31.d:	"[FROM.GetNameDefCap] hat unsere Bitte angenommen, sich unserem Kampf anzuschließen und uns dabei zu helfen, die Sozialfaschisten zu stürzen!"
new_ger.31.a:	"Proletarier aller Länder, vereinigt euch!"
new_ger.32.t:	"Ein Aufruf von [GER.GetNameDef]"
new_ger.32.d:	" Da ihre Revolution in einem blutigen Bürgerkrieg zu kämpfen hat, haben die Deutschen uns um direkte Intervention gebeten, um sie für sie zu gewinnen. Was sollen wir mit dieser Bitte tun?"
new_ger.32.a:	"Proletarier aller Länder, vereinigt euch!"
new_ger.32.b:	"Der Sozialismus in einem Land kann nicht bestehen, wenn wir dies tun."
new_ger.33.t:	"Thälmanns Vermächtnis"
new_ger.33.d:	"Nach Thälmanns Tod ist es an der Zeit, einen neuen Parteivorsitzenden zu wählen, einen Mann, der die KPD zum Ruhm führen und die Revolution in Deutschland retten wird. Es kommen nur zwei in Frage, Säulen der KPD in der Weimarer Zeit und Thälmanns einzige Nachfolger. Um innerparteiliche Konflikte zu vermeiden, wurde die Angelegenheit nach Moskau gebracht, und Moskau hat entschieden, dass:"
new_ger.33.a:	"Pieck über das nötige Charisma verfügt."
new_ger.33.b:	"Ulbricht der überzeugtere Kommunist ist."
new_ger.34.t:	"Die Schlacht um Essen"
new_ger.34.d:	"Da unsere Linien überdehnt sind, ist die revolutionäre Hauptstadt Essen ungeschützt. Wir könnten sie aufgeben und uns stattdessen um Dortmund herum konsolidieren. Alternativ könnten wir unsere Truppen motivieren, dort bis zum Tod zu kämpfen, wobei Ulbricht selbst das Kommando übernimmt, um die Schlacht zu leiten, während Pieck bereitsteht, aber bereit ist, als Verstärkung nach Dortmund zu gehen, sollte Essen fallen."
new_ger.34.a:	"Essen darf nicht fallen!"
new_ger.34.b:	"Das ist es nicht wert!"
new_ger.35.t:	"Der Fall von Essen"
new_ger.35.d:	"Mit dem Fall von Essen hat Ulbrichts letzter Widerstand ein Ende gefunden; als seine Männer besiegt wurden, wurde auch er an der Front erschossen. Unterdessen ist Pieck mit den geschwächten Überresten der KPD-Führung nach Dortmund geflohen, um dort den Kampf fortzusetzen, so geschwächt seine Autorität auch sein mag."
new_ger.35.a:	"Lasst uns beten, dass dies nicht das Ende ist ..."
new_ger.36.t:	"Pieck wurde erschossen!"
new_ger.36.d:	"Als Pieck nach Dortmund einrückte, rückte die Stadtgarnison ein und nahm ihn sowie die verbliebene KPD-Führung gefangen. Nachdem man sie gezwungen hatte, ein Dekret zu unterzeichnen, das die Führung an Fischer und Maslow übertrug, wurden sie an einer Wand aufgereiht und erschossen. Nun liegt es an den linken Kommunisten, dieses Chaos zu retten ..."
new_ger.36.a:	"Ehre der internationalen Revolution!"
new_ger.37.t:	"Die zweite deutsche Revolution ist erfolgreich verlaufen"
new_ger.37.d:	"Die Nazis wurden gestürzt und der deutsche Staat von unseren revolutionären Kräften gesichert. Nun ist es an der Zeit, dass wir unseren neuen Staat festigen und dafür sorgen, dass er gedeiht."
new_ger.37.a:	"Ehre sei der Revolution!"
new_ger.38.t:	"[FROM.GetNameDefCap] Revolten!"
new_ger.38.d:	"Nachdem wir ihre Unabhängigkeit abgelehnt haben, [FROM.GetNameDef] hat trotz unserer Forderungen seine Unabhängigkeit erklärt. Diese Männer haben uns und die Revolution verraten und müssen dafür bezahlen!"
new_ger.38.a:	"Ein Embargo wird ausreichen, um sie zurückzubringen!"
new_ger.38.b:	" Nur ein Krieg kann dies wieder in Ordnung bringen!"
new_ger.39.t:	"[FROM.GetNameDefCap] Beantragt Unabhängigkeit"
new_ger.39.d:	"Da der Bürgerkrieg in Deutschland längst vorbei ist, hat die dortige Regierung beschlossen, dass es für sie das Beste wäre, ihren eigenen Weg zu gehen. Sie haben sich an uns gewandt und darum gebeten, dass wir unseren Einfluss auf ihren Staat aufgeben."
new_ger.39.a:	"Selbstverständlich!"
new_ger.39.b:	"Die Loyalität gegenüber Moskau steht nicht zur Diskussion!"
new_ger.40.t:	"Stalin akzeptiert unsere Unabhängigkeit"
new_ger.40.d:	"Angesichts des Erfolgs unseres Staates [SOV.GetNameDef] haben wir die Unabhängigkeit im Sozialismus erlangt und damit ein neues Zeitalter für unsere Nation eingeleitet."
new_ger.40.a:	"Wir stehen in tiefster Schuld!"
new_ger.41.t:	"Stalin lehnt ab!"
new_ger.41.d:	"Stalin hat unsere Unabhängigkeit abgelehnt. Damit bleiben uns zwei Möglichkeiten: Entweder wir schließen uns ihm an, akzeptieren seine Macht und unsere Loyalität, oder wir erklären trotzdem die Unabhängigkeit und lehnen uns gegen seine Tyrannei auf!"
new_ger.41.a:	"Loyalität steht nicht zur Diskussion!"
new_ger.41.b:	"Unabhängigkeit steht nicht zur Diskussion!"
new_ger.42.t:	"Der Nationale Rat der Räte"
new_ger.42.d:	"Nachdem die Räte gegründet und gesichert sowie die Führung gefestigt wurden, [ROOT.GetLeader] hat einen Nationalkongress einberufen. Es ist an der Zeit, dass sich die Arbeiter und ihre Räte hinter der Führung vereinen und sich auf die weltweite Revolution vorbereiten! Der Kommunismus darf nicht aufgehalten werden!"
new_ger.42.a:	"Es lebe die Revolution!"
new_ger.43.t:	"Der nationale Führer"
new_ger.43.d:	"Wenn die Revolution hier gedeihen soll, müssen wir einen Führer ernennen. Da Fischer und Maslow die Nation effektiv führen, ist klar, dass dies einer von ihnen sein muss, zumal sie bereits Erfahrung in der Führung der Partei in den vergangenen Jahren haben."
new_ger.43.a:	"Fischer hat den Elan."
new_ger.43.b:	" Maslow hat die Weisheit."
new_ger.44.t:	"Säuberung der Ratsmitglieder"
new_ger.44.d:	"Die Ratskommunisten waren uns schon immer ein Dorn im Auge, zumal sie einst die Partei führten. Lassen Sie uns dafür sorgen, dass diese Bedrohung ein für alle Mal beseitigt wird. Die Revolution darf nie wieder durch diese Subversion bedroht werden. Wir werden alle Anhänger von Fischer und Arkadi vor Gericht stellen und sie in Frankreich hinrichten."
new_ger.44.a:	"Tod den Verrätern!"
new_ger.45.t:	"Säuberung der Rechten"
new_ger.45.d:	"Die Rechten stellen ein inakzeptables Risiko für unsere Partei dar. Auch wenn wir während der Revolution stillschweigend zusammengearbeitet haben mögen, ist dies nicht länger erforderlich. Nun müssen diese Verräter unserer revolutionären Ideale verschwinden ..."
new_ger.45.a:	"Tod den Verrätern!"
new_ger.46.t:	"Das Schicksal der Luxemburgisten"
new_ger.46.d:	"Einst waren die Luxemburgisten ein wichtiger Teil der deutschen Revolution, doch mittlerweile sind sie zu einer Gefahr für uns alle geworden. Auch mit ihnen muss rasch Schluss gemacht werden, um Propaganda und Dissens zu verhindern."
new_ger.46.a:	"Tod den Verrätern!"
new_ger.47.t:	"Der Prozess gegen die Generäle"
new_ger.47.d:	"So mancher General hat sich unserer Machtübernahme widersetzt, doch alle sind kläglich gescheitert. Stellen wir sie vor Gericht und bestrafen wir diese Verräter angemessen!"
new_ger.47.a:	"Tod den Verrätern!"
new_ger.47.b:	"Vielleicht gibt es im Gefängnis Hoffnung auf Rehabilitation ..."
new_ger.48.t:	"Der Umgang mit den Stalinisten"
new_ger.48.d:	"Unser gesamter KPD-Staatsapparat ist voll von Stalinisten aus der Thälmann-Ära. Wir werden die schlimmsten von ihnen vor Gericht stellen und den Rest nach und nach austauschen."
new_ger.48.a:	"Dies ist eine Herkulesaufgabe..."
new_ger.49.t:	"Das Schicksal der Rechten"
new_ger.49.d:	"Zwar teilen die Rechten weitgehend unsere Verachtung für die alte KPD, doch gibt es viele Meinungsverschiedenheiten. Dies wirft die Frage auf: Reichen diese Meinungsverschiedenheiten aus, um sie wegen Verbrechen gegen die Revolution vor Gericht zu stellen?"
new_ger.49.a:	"Schon der Gedanke an Verrat ist unerträglich!"
new_ger.49.b:	"Wir sind keine Stalinisten!"
new_ger.50.t:	"Goerdelers Schicksal"
new_ger.50.d:	"Wir stehen mit Goerdeler nicht mehr auf bestem Fuß, nachdem wir ihm während der Operation Walküre so zugesetzt haben. Aus diesem Grund müssen wir entscheiden, ob der Mann weiterhin als Vorsitzender der DNVP bleiben darf, da wir mit ihnen eine Zusammenarbeit bei der Gestaltung der Zukunft Deutschlands beginnen."
new_ger.50.a:	"Mit der Zeit ist eine Versöhnung eine Option. "
new_ger.50.b:	"Er ist nicht vertrauenswürdig, ernennen Sie Hugenberg."
new_ger.51.t:	"Die Nationalversammlung"
new_ger.51.d:	"Da sich der Machtkampf zwischen Canaris und Beck dem Ende zuneigt, hat sich das Land versammelt, um zu entscheiden, wer von beiden die Führung übernehmen soll. Die Eliten haben sich getroffen und beraten, bevor sie eine Abstimmung durchgeführt haben. Nach zahlreichen Reden ist klar geworden, wer die Nation zu neuem Ruhm führen wird..."
new_ger.51.a:	"Canaris’ Intrigen haben ihm die Macht verschafft."
new_ger.51.b:	"Beck hält nach wie vor alle Trümpfe in der Hand."
new_ger.51.c:	"Im Streben nach Macht wurde Wilhelm zum Kaiser ernannt, im Gegenzug dafür, dass Beck an die Macht gelangte ..."
new_ger.52.t:	"Wilhelm II. dankt ab, während das Haus Hohenzollern neu geordnet wird ..."
new_ger.52.d:	"Angesichts der bevorstehenden Veränderungen in Deutschland und der wahrscheinlichen Wiederherstellung der Monarchie hat Wilhelm II., das Oberhaupt des Hauses Hohenzollern, beschlossen, selbst Maßnahmen zu ergreifen. Da er wusste, dass sein Alter und der Mangel an Unterstützung sowohl beim Volk als auch bei den Eliten und der internationalen Gemeinschaft ihn als Kaiser ungeeignet machen würden, hat er beschlossen abzudanken, insbesondere nachdem das Militär ihn dazu nachdrücklich "ermutigt" hatte. \nDaraufhin haben das Militär und Wilhelm IV. gemeinsam Wilhelm IV. zum neuen Oberhaupt des Hauses Hohenzollern erklärt, wobei sie Wilhelm III. übergingen und Wilhelm IV.s Ehe ignorierten, die ihn zuvor vom Thron ausgeschlossen hatte.\nSo ungewiss die Zukunft auch sein mag, und die Rechtmäßigkeit dieses Schrittes fragwürdig ist, hat er doch viel dazu beigetragen, das Ansehen der Monarchie in den Augen sowohl des Volkes als auch des Militärs zu verbessern und die Weichen für eine große Restauration zu stellen..."
new_ger.52.a:	"Eine neue Ära ist für das Haus Hohenzollern angebrochen!"
new_ger.53.t:	"Die Frage der SPD"
new_ger.53.d:	"Die SPD war schon immer eine fragwürdige Partei, die zwischen Linksextremismus und Demokratie schwankt. Dies wirft die Frage auf: Verdienen sie es überhaupt, an unserem neuen Staat teilzuhaben?"
new_ger.53.a:	"Es sind Radikale!"
new_ger.53.b:	"Wir werden sie an der kurzen Leine halten."
new_ger.54.t:	"Ein strenges Wort im Palais"
new_ger.54.d:	"Angesichts der immer autoritärer werdenden Tendenzen seines Großvaters und in dem Wissen, dass er die Krone erben wird, hat Louis Ferdinand seinen Großvater aufgesucht und um ein Gespräch gebeten. Er fleht ihn nun an, die Nation nicht erneut in den Absolutismus zu stürzen, sondern fordert stattdessen eine liberalere Zukunft für sein Land und das Land, das er als Nächstes regieren wird."
new_ger.54.a:	"Es ist schließlich sein Reich ..."
new_ger.54.b:	"Er muss zurechtgewiesen und widerlegt werden ..."
new_ger.54.c:	"Streite ich mich nicht mit meinem Sohn wegen weniger?"
new_ger.55.t:	"Der Kaiser verstirbt"
new_ger.55.d:	"In der vergangenen Nacht ist der Kaiser verstorben, nachdem er aus dem Exil zurückgekehrt war und die Nation erneut geführt hatte. Er hat der Nation große Dienste geleistet, und wir alle trauern um ihn. Es ist wahrlich das Ende einer Ära!"
new_ger.55.a:	"Die Nation trauert ..."
new_ger.56.t:	"Beck verdrängt Wilhelm III."
new_ger.56.d:	"In Kenntnis der dunklen Vergangenheit Wilhelms III. hat Beck entschieden, dass es inakzeptabel ist, ihm große Macht zu überlassen! Um dies zu verhindern, hat er durch verschiedene Machenschaften, einschließlich Gewalt, dafür gesorgt, dass Wilhelm III. gezwungen ist, zugunsten seines Sohnes abzudanken. Es scheint, als bekäme Deutschland einen weiteren Kaiser!"
new_ger.56.a:	"Ein Vorbote weiterer Unruhen oder einer Stabilisierung?"
new_ger.57.t:	"Der Kaiser dankt ab"
new_ger.57.d:	"Heute hat der Kaiser entschieden, dass er zu alt und gebrechlich ist, um zu regieren, obwohl er aus dem Exil zurückgekehrt war und die Nation erneut geführt hatte. Er hat der Nation große Dienste geleistet, und alle feiern diese große Persönlichkeit und ihren Dienst an der Nation. Es ist wahrlich das Ende einer Ära! "
new_ger.57.a:	"Es lebe der neue Kaiser!"
new_ger.58.t:	"[FROM.GetNameDefCap] fordert Eupen "
new_ger.58.d:	"[FROM.GetNameDefCap] hat entschieden, dass wir dieses [FROM.GetAdjective] Land zu lange regiert haben, da es nie mehrheitlich [ROOT.GetAdjective] uns gehörte und uns lediglich nach dem Großen Krieg zugesprochen wurde. Daher haben sie uns nun ein Ultimatum gestellt, Eupen- Malmedy abzutreten."
new_ger.58.a:	"Wir haben keine andere Wahl, als das Ultimatum anzunehmen ..."
new_ger.58.b:	"Dieses Land gehört [ROOT.GetAdjective] dennoch uns!"
new_ger.59.t:	"[FROM.GetNameDefCap] tritt Eupen ab"
new_ger.59.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen akzeptiert wurden; Eupen gehört [ROOT.GetAdjective] wieder uns!"
new_ger.59.a:	"Herrlich!"
new_ger.60.t:	"[FROM.GetNameDefCap] weigert sich, Eupen abzutreten"
new_ger.60.d:	"Zu unserer großen Bestürzung sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen abgelehnt wurden. Ungeachtet dessen ist Eupen [ROOT.GetAdjective] und wird es wieder sein!"
new_ger.60.a:	"Das ist nicht ihre Entscheidung"
new_ger.60.b:	"Wir müssen abwarten ..."
new_ger.61.t:	"[FROM.GetNameDefCap] fordert eine Volksabstimmung in Eupen"
new_ger.61.d:	"An diesem Tag hat [FROM.GetNameDef] eine Volksabstimmung im [FROM.GetAdjective] mehrheitlich von Eupen bewohnten Gebiet beantragt. Obwohl wir behaupten, den Werten der Selbstbestimmung zu folgen, würde die Annahme eines solchen Antrags zweifellos dazu führen, dass Eupen nach Bekanntgabe der Ergebnisse aufgegeben würde."
new_ger.61.a:	"Dennoch ist es das Richtige, geben Sie uns 30 Tage!"
new_ger.61.b:	"Niemals würden wir unser Land einfach so aufgeben!"
new_ger.62.t:	"[FROM.GetNameDefCap] hat einer Volksabstimmung zugestimmt!"
new_ger.62.d:	"Man hat uns mitgeteilt, dass innerhalb von 30 Tagen eine Volksabstimmung stattfinden wird, die uns zweifellos die Kontrolle über unser Land zurückgeben wird!"
new_ger.62.a:	"Herrlich!"
new_ger.63.t:	"Die Volksabstimmung von Eupen"
new_ger.63.d:	"Die Ergebnisse der Volksabstimmung liegen vor, und wie erwartet hat sich die deutsche Mehrheit durchgesetzt. Das bedeutet, dass das Gebiet nun gemäß den Grenzen vor dem Ersten Weltkrieg zurückgegeben wird."
new_ger.63.a:	"Und so verschiebt sich Europa erneut ..."
new_ger.64.t:	"Eine Volksabstimmung abgelehnt!"
new_ger.64.d:	"Die Unterdrücker in [FROM.GetNameDef] haben die Idee einer Volksabstimmung vom Tisch gewischt, obwohl wir eindeutig im Recht sind. Was sollen wir dagegen tun?"
new_ger.64.a:	"Unsere Landsleute werden befreit werden, notfalls mit Gewalt!"
new_ger.64.b:	"Wir sind nicht in der Lage, uns zu streiten ..."
new_ger.65.t:	"[FROM.GetNameDef] bietet an, Eupen zu kaufen"
new_ger.65.d:	"Da Eupen größtenteils [FROM.GetAdjective] ist, haben sie angeboten, es zu kaufen, um das Problem dieser Minderheit in unserer Nation zu lösen und den Frieden zu sichern."
new_ger.65.a:	"Gewinn und Stabilität? Ich bin dabei!"
new_ger.65.b:	"Wir werden unsere Nation nicht einfach so verkaufen!"
new_ger.66.t:	"[FROM.GetNameDefCap] verkauft Eupen"
new_ger.66.d:	" Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Kaufangebot angenommen wurde – Eupen gehört wieder [ROOT.GetAdjective]!"
new_ger.66.a:	"Herrlich!"
new_ger.67.t:	"Unser Angebot wurde abgelehnt!"
new_ger.67.d:	" Zu unserer Wut haben die Unterdrücker unserer Landsleute die Idee abgelehnt, Eupen wieder unter seine rechtmäßige Herrschaft zu stellen. Können wir sie damit davonkommen lassen?"
new_ger.67.a:	"Niemals! Fordern Sie eine offizielle Volksabstimmung!"
new_ger.67.b:	"Wir sollten das noch nicht vorantreiben.. ."
new_ger.68.t:	"[FROM.GetNameDefCap] fordert Memel"
new_ger.68.d:	"[FROM.GetNameDefCap] hat entschieden, dass wir dieses [FROM.GetAdjective] Land schon zu lange beherrschen, da es nie mehrheitlich [ROOT.GetAdjective] uns gehörte und uns lediglich nach dem Großen Krieg zugesprochen wurde. Daher haben sie uns nun ein Ultimatum gestellt, Memel abzutreten."
new_ger.68.a:	"Wir haben keine andere Wahl, als das Ultimatum anzunehmen ..."
new_ger.68.b:	"Dieses Land gehört [ROOT.GetAdjective] dennoch uns!"
new_ger.69.t:	"[FROM.GetNameDefCap] tritt Memel ab"
new_ger.69.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen akzeptiert wurden; Memel gehört wieder [ROOT.GetAdjective]!"
new_ger.69.a:	"Herrlich!"
new_ger.70.t:	"[FROM.GetNameDefCap] Weigert sich, Memel abzutreten"
new_ger.70.d:	" Zu unserer großen Bestürzung sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen abgelehnt wurden. Ungeachtet dessen ist Eupen [ROOT.GetAdjective] und wird es wieder sein!"
new_ger.70.a:	"Das steht ihnen nicht zu, zu entscheiden ..."
new_ger.70.b:	"Wir müssen abwarten ..."
new_ger.71.t:	 "[FROM.GetNameDefCap] fordert eine Volksabstimmung in Memel"
new_ger.71.d:	"An diesem Tag hat [FROM.GetNameDef] eine Volksabstimmung im [FROM.GetAdjective]-Mehrheitsgebiet von Memel gefordert. Obwohl wir behaupten, den Werten der Selbstbestimmung zu folgen, würde die Annahme eines solchen Antrags zweifellos dazu führen, dass Memel nach Bekanntgabe der Ergebnisse aufgegeben wird."
new_ger.71.a:	"Dennoch ist es das Richtige, geben Sie uns 30 Tage!"
new_ger.71.b:	"Niemals würden wir unser Land einfach so aufgeben!"
new_ger.72.t:	"[FROM.GetNameDefCap] hat einer Volksabstimmung zugestimmt!"
new_ger.72.d:	"Man hat uns mitgeteilt, dass innerhalb von 30 Tagen eine Volksabstimmung stattfinden wird, die uns zweifellos die Kontrolle über unser Land zurückgeben wird!"
new_ger.72.a:	"Großartig!"
new_ger.73.t:	"Die Volksabstimmung von Memel"
new_ger.73.d:	"Die Ergebnisse der Volksabstimmung liegen vor, und wie erwartet hat sich die deutsche Mehrheit durchgesetzt. Das bedeutet, dass das Land nun gemäß den Grenzen vor dem Ersten Weltkrieg zurückgegeben wird."
new_ger.73.a:	"Und so verschiebt sich Europa erneut... "
new_ger.74.t:	"Eine Volksabstimmung abgelehnt!"
new_ger.74.d:	"Die Unterdrücker in [FROM.GetNameDef] haben die Idee einer Volksabstimmung vom Tisch gewischt, obwohl wir eindeutig im Recht sind. Was sollen wir dagegen tun?"
new_ger.74.a:	"Unsere Landsleute werden, wenn nötig, mit Gewalt befreit!"
new_ger.74.b:	"Wir sind nicht in der Lage, uns zu streiten ..."
new_ger.75.t:	"[FROM.GetNameDef] bietet Garantien für Memel"
new_ger.75.d:	"Da Memel größtenteils [FROM.GetAdjective] ist, haben sie angeboten, es durch eine Garantie zu erwerben, wodurch das Problem dieser Minderheit in unserer Nation gelöst und der Frieden gesichert würde."
new_ger.75.a:	"Sicherheit und Stabilität? Ich bin dabei!"
new_ger.75.b:	"Wir werden unsere Nation nicht einfach so verkaufen!"
new_ger.76.t:	"[FROM.GetNameDefCap] verkauft Memel gegen Garantien"
new_ger.76.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Kaufangebot angenommen wurde – Memel gehört wieder [ROOT.GetAdjective]!"
new_ger.76.a:	"Herrlich!"
new_ger.77.t:	"Unser Angebot wurde zurückgewiesen!"
new_ger.77.d:	"Zu unserer Wut haben die Unterdrücker unserer Landsleute die Idee abgelehnt, Memel wieder unter seine rechtmäßige Herrschaft zu stellen. Können wir sie damit davonkommen lassen?"
new_ger.77.a:	"Niemals! Fordern Sie eine offizielle Volksabstimmung!"
new_ger.77.b:	"Wir sollten das noch nicht vorantreiben ..."
new_ger.78.t:	"[FROM.GetNameDefCap] fordert Nordschleswig"
new_ger.78.d:	"[FROM.GetNameDefCap] hat entschieden, dass wir dieses [ROOT.GetAdjective] Land schon zu lange beherrschen, da es uns nach dem Großen Krieg lediglich zugesprochen wurde. Daher haben sie uns nun ein Ultimatum gestellt, Nordschleswig abzutreten."
new_ger.78.a:	" Wir haben keine andere Wahl, als das Ultimatum anzunehmen..."
new_ger.78.b:	"Dieses Land gehört [ROOT.GetAdjective] dennoch uns!"
new_ger.79.t:	"[FROM.GetNameDefCap] tritt Nordschleswig ab"
new_ger.79.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen akzeptiert wurden; Nordschleswig gehört [ROOT.GetAdjective] wieder uns!"
new_ger.79.a:	"Herrlich!"
new_ger.80.t:	"[FROM.GetNameDefCap] Weigert sich, Nordschleswig abzutreten "
new_ger.80.d:	"Zu unserer großen Bestürzung sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen abgelehnt wurden. Ungeachtet dessen ist Schleswig [ROOT.GetAdjective] und wird es wieder sein!"
new_ger.80.a:	"Das steht ihnen nicht zu, zu entscheiden..."
new_ger.80.b:	"Wir müssen abwarten ..."
new_ger.81.t:	"[FROM.GetNameDefCap] erobert Danzig"
new_ger.81.d:	"Entgegen allen Verträgen der alten Ordnung wurde Danzig durch eine Mischung aus einem lokalen Aufstand und dem Einmarsch von [FROM.GetAdjective]-Truppen, die den Staat sicherten, eingenommen."
new_ger.81.a:	"Dies wird nicht toleriert werden!"
new_ger.81.b:	"Sie sind [FROM.GetAdjective] schließlich ..."
new_ger.82.t:	"[FROM.GetNameDefCap] bietet einen Kompromiss an"
new_ger.82.d:	"Da die Deutschen weitreichende Ansprüche gegen uns haben, haben sie beschlossen, einen Plan auszuarbeiten, um einen umfassenden Krieg zu verhindern. Sie werden die relativ deutsch geprägten Gebiete in Katowice und Danzig ohne Blutvergießen übernehmen, im Gegenzug dafür, dass sie ihre Ansprüche auf Posen und Gdynia vollständig aufgeben und einen Freundschaftsvertrag unterzeichnen."
new_ger.82.a:	"Das Geschäft des Lebens!"
new_ger.82.b:	"Wir sprechen hier von unseren Landsleuten ..."
new_ger.83.t:	"[FROM.GetNameDefCap] bietet Garantien für Posen"
new_ger.83.d:	"In dem Bestreben, ihre alten Gebiete zurückzugewinnen, [FROM.GetNameDef] hat uns eine Garantie angeboten, die uns vor [SOV.GetNameDef] schützen würde. Im Gegenzug müssten wir jedoch ihre kaiserlichen Ländereien aufgeben."
new_ger.83.a:	"Ein harter, aber lohnender Handel"
new_ger.83.b:	"Inakzeptabel!"
new_ger.84.t:	"[FROM.GetNameDefCap] weigert sich, Posen abzutreten"
new_ger.84.d:	"Trotz unserer großzügigen Angebote wurde uns Posen nicht zurückgegeben; angesichts dessen müssen wir unsere nächsten Schritte beschließen, um unser Volk zu retten! "
new_ger.84.a:	"Erzwingen Sie die Aufgabe von Posen"
new_ger.84.b:	"Das ist es nicht wert!"
new_ger.85.t:	"[FROM.GetNameDefCap] Fordert Posen"
new_ger.85.d:	"In dem Bestreben, ihre alten Gebiete zurückzugewinnen, [FROM.GetNameDef] hat Posen gefordert. Es wäre zwar eine Schande, diese [ROOT.GetAdjective] Gebiete abzutreten, doch sie sind stärker als wir und wir haben kaum eine Wahl..."
new_ger.85.a:	"Es wäre ein Krieg, den wir nicht gewinnen könnten ..."
new_ger.85.b:	"Wir werden dennoch kämpfen!"
new_ger.86.t:	"[FROM.GetNameDefCap] weigert sich, Posen aufzugeben"
new_ger.86.d:	"Trotz unseres Ultimatums wurde uns Posen nicht zurückgegeben; angesichts dessen müssen wir uns auf den Krieg vorbereiten, um unser Volk zu retten! "
new_ger.86.a:	"Tod diesen Untermenschen!"
new_ger.86.b:	"Krieg ist niemals gut."
new_ger.87.t:	"[FROM.GetNameDefCap] Will den Westen vor dem Bolschewismus retten"
new_ger.87.d:	" In dem Bestreben, ihre alten Länder zurückzugewinnen und die dortige Bevölkerung zu retten, seien es nun [FROM.GetAdjective] oder [ROOT.GetAdjective], hat [FROM.GetNameDef] angeboten, die Verantwortung für diese Länder zu übernehmen, da unsere Regierung kurz davor steht, dem [SOV.GetNameDef] zu unterliegen. Dies würde die Menschen dort vor dem Schreckgespenst des Bolschewismus bewahren, während unser Schiff untergeht..."
new_ger.87.a:	"Verzweifelte Zeiten erfordern verzweifelte Maßnahmen..."
new_ger.87.b:	"Wir brauchen diese Männer, damit sie durchhalten!"
new_ger.88.t:	"[FROM.GetNameDefCap] lehnt unseren Plan ab"
new_ger.88.d:	"Die [FROM.GetAdjective] haben uns mitgeteilt, dass sie keines unserer Gebiete zurückgeben werden, sondern diese behalten und bis zum Tod gegen [SOV.GetNameDef] kämpfen werden"
new_ger.88.a:	"Dann wird ihr Tod früher kommen als erwartet!"
new_ger.88.b:	"Das ist ihr gutes Recht!"
new_ger.89.t:	"[FROM.GetNameDefCap] marschiert über die Grenze!"
new_ger.89.d:	"Die [FROM.GetAdjective] haben uns ohne Kriegserklärung angegriffen und erwarten, dass wir unsere Waffen niederlegen und sie mit offenen Armen empfangen."
new_ger.89.a:	"Ich meine, wir sind schließlich ein Volk ..."
new_ger.89.b:	"Wir müssen diesem perfiden Angriff Widerstand leisten! "
new_ger.90.t:	"Das Volkseinheitsgesetz wird in Wien verabschiedet"
new_ger.90.d:	"[ROOT.GetLeader] wurde soeben vom Rest seiner Partei darüber informiert, dass sie heute eines unserer größten Ziele erreicht haben! Die Nation wurde offiziell vereint und ins Reich eingegliedert! [ROOT.GetLeader] wurde jedoch erst darüber informiert, als es bereits geschehen war, und mit deutscher Hilfe fordert das Land ihn nun auf, zugunsten des neuen und vereinten Deutschlands zurückzutreten. Ein Verrat an unserer Sache würde eine regelrechte Rebellion von allen Seiten bedeuten..."
new_ger.90.a:	"Endlich Einheit!"
new_ger.90.b:	"Die Macht muss um jeden Preis erhalten bleiben..."
new_ger.91.t:	"[FROM.GetLeader] weigert sich, die Macht abzugeben"
new_ger.91.d:	"Heute wurde uns mitgeteilt, dass [FROM.GetLeader] das bereits verabschiedete Volkseinheitsgesetz abgelehnt und uns sowie unserer Annexion Österreichs den Krieg erklärt hat!"
new_ger.91.a:	"Wir werden ihn vernichten..."
new_ger.92.t:	"[FROM.GetLeader] bietet einen pangermanischen Kompromiss an"
new_ger.92.d:	"Wenn Deutschland vereint werden soll und unsere Macht über Österreich erhalten bleiben soll, gibt es nur eine Lösung. Berlin hat uns gerade genau dieses Angebot unterbreitet. Wir würden uns ihnen unter diesen Bedingungen anschließen und nominell Teil von [FROM.GetNameDef] werden, dabei jedoch den Großteil unserer Autonomie behalten, was uns erlaubt, unsere eigene Kultur und unser Erbe zu bewahren, sodass sich die beiden Nationen erst im Laufe der Zeit langsam vereinen werden..."
new_ger.92.a:	"Auf das neue und vereinte Deutschland!"
new_ger.92.b:	"Wir werden die österreichischen Ideale nicht verraten ..."
new_ger.93.t:	"[FROM.GetLeader] bietet uns ein Bündnis an"
new_ger.93.d:	"Berlin hat erklärt, dass eine vollständige deutsche Einheit nicht unbedingt notwendig ist... Stattdessen haben sie uns angeboten, den Status quo wiederherzustellen, der von 1879 bis 1919 bestand, wobei wir als Mitglied des Deutschen Bündnisses fungieren."
new_ger.93.a:	"Lassen Sie uns auf diese Freundschaft anstoßen! "
new_ger.93.b:	"Wir werden die österreichischen Ideale nicht verraten..."
new_ger.94.t:	"[FROM.GetLeader] entfacht die französisch-deutsche Rivalität neu"
new_ger.94.d:	"Berlin hat erklärt, dass Deutschland und Frankreich für immer Feinde sein werden; angesichts der Streitigkeiten um Reparationen, das Elsass und vieler anderer Auseinandersetzungen ist klar, dass [FROM.GetLeader] Recht hat. Unsere beiden Völker sind dazu bestimmt, Feinde zu sein!"
new_ger.94.a:	"Lassen Sie uns diese erbärmliche Bande besiegen!"
new_ger.94.b:	"Ist das wirklich notwendig?"
new_ger.95.t:	"[FROM.GetNameDefCap] fordert Elsass-Lothringen"
new_ger.95.d:	"Das Elsass, ein integraler Bestandteil von [ROOT.GetNameDef], das nach dem letzten großen Krieg zurückerobert wurde, wurde gerade von den perfiden Deutschen gefordert. Sie wollen uns demütigen und unsere Kerngebiete an sich reißen!"
new_ger.95.a:	"Dennoch haben wir keine andere Wahl, als das Ultimatum anzunehmen... "
new_ger.95.b:	"Dieses Land ist [ROOT.GetAdjective]!"
new_ger.96.t:	"[FROM.GetNameDefCap] tritt Elsass-Lothringen ab"
new_ger.96.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen akzeptiert wurden; Elsass-Lothringen ist [ROOT.GetAdjective] wieder unser! "
new_ger.96.a:	"Die Schwachen beugen sich vor den Mächtigen!"
new_ger.97.t:	"[FROM.GetNameDefCap] weigert sich, Elsass-Lothringen abzutreten"
new_ger.97.d:	 "Zu unserer großen Wut sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unsere Forderungen abgelehnt wurden. Ungeachtet dessen war Elsass-Lothringen [ROOT.GetAdjective] und wird es wieder sein! "
new_ger.97.a:	"Tod den Franzosen!"
new_ger.97.b:	"Wir müssen abwarten..."
new_ger.98.t:	"[FROM.GetNameDefCap] Strebt Annäherung an"
new_ger.98.d:	"Nachdem die Nazis gestürzt wurden, sind die [FROM.GetAdjectiveCap] zu uns gekommen und haben uns eine Annäherung angeboten, zunächst in Form eines Nichtangriffspakts und später möglicherweise durch die Annahme eines neuen und fairen Versailler Vertrags ..."
new_ger.98.a:	"Stoßen wir auf unsere neuen Freunde an!"
new_ger.98.b:	"Den Deutschen ist nicht zu trauen!"
new_ger.99.t:	"[FROM.GetNameDefCap] Annäherung akzeptieren"
new_ger.99.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Nichtangriffspakt angenommen wurde, da in Westeuropa Frieden herrscht!"
new_ger.99.a:	"Stoßen wir auf unsere neuen Freunde an!"
new_ger.100.t:	"[FROM.GetNameDefCap] Annäherung ablehnen"
new_ger.100.d:	"Zu unserer großen Bestürzung sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Nichtangriffspakt abgelehnt wurde."
new_ger.100.a:	"Verdammt!"
new_ger.101.t:	"[FROM.GetNameDefCap] strebt den Rückkauf seiner Kolonien an"
new_ger.101.d:	"Heute wurden wir von [FROM.GetNameDef] angesprochen, da diese Nation bestrebt ist, ihr altes Imperium durch den Rückkauf des Landes wiederherzustellen. Sie haben uns dafür beträchtliche industrielle Entschädigungen angeboten."
new_ger.101.a:	"Das Geld ist gut!"
new_ger.101.b:	"Diese Kolonie ist zu wichtig!"
new_ger.101.c:	"Warum sollten wir verkaufen, wofür unsere Männer gestorben sind?"
new_ger.102.t:	"[FROM.GetNameDefCap] verkauft Land"
new_ger.102.d:	"Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Angebot für unsere alte Kolonie angenommen wurde!"
new_ger.102.a:	"Unser Imperium findet langsam wieder zusammen ..."
new_ger.103.t:	"[FROM.GetNameDefCap] Weigert sich, Land zu verkaufen"
new_ger.103.d:	"Zu unserer großen Bestürzung sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Angebot für unsere alte Kolonie abgelehnt wurde!"
new_ger.103.a:	"Schmerzlich, aber es ist, wie es ist."
new_ger.103.b:	"Um das Ganze noch schlimmer zu machen, haben sie uns gesagt, wir sollten mit solchen Angeboten aufhören!"
new_ger.104.t:	"[FROM.GetNameDefCap] fordert unsere Kolonien ..."
new_ger.104.d:	"An diesem Tag hat uns [FROM.GetNameDef] mitgeteilt, dass wir 20 Tage Zeit haben, unsere Kolonien zu räumen, oder uns ihrer Kriegsmaschinerie stellen müssen. Nun liegt es an uns: Welche dieser düsteren Optionen ziehen wir vor?"
new_ger.104.a:	"Wir werden unsere Ehre nicht einfach so aufgeben!"
new_ger.104.b:	"Wir haben keine andere Wahl, als zuzustimmen!"
new_ger.105.t:	"Das Ziel des Paktes"
new_ger.105.d:	"Nachdem der Berliner Pakt offiziell geschlossen wurde, müssen wir nun über sein Schicksal entscheiden. Was soll das höchste Ziel unseres Militärbündnisses sein?"
new_ger.105.a:	"Es ist die Sicherung einer eisernen Vorhut für die Revolution!"
new_ger.105.b:	"Es ist die Verbreitung der Revolution in der ganzen Welt!"
new_ger.106.a:	"Es ist die Verteidigung der Demokratie über alles!"
new_ger.106.b:	"Es ist die Wiederherstellung von Ordnung und Stabilität in Europa!"
new_ger.106.c:	"Es ist die Herbeiführung des Weltfriedens!"
new_ger.107.a:	"Es ist die Rückeroberung dessen, was uns genommen wurde!"
new_ger.107.b:	"Es geht darum, einen großen Krieg zu führen!"
new_ger.109.t:	"[FROM.GetNameDef] bietet Garantien"
new_ger.109.d:	"Angesichts der drohenden Gefahr im Osten hat [FROM.GetNameDef] angeboten, uns vor ihnen zu schützen. "
new_ger.109.a:	"Endlich Sicherheit!"
new_ger.109.b:	"Dies würde uns nur in den Einflussbereich von [FORM.GetAdjective] hineinziehen!"
new_ger.110.t:	"Die Flagge von 1848 wieder einführen?"
new_ger.110.d:	"Zwar hissen wir derzeit die schwarz-weiß-rote Flagge des Norddeutschen Bundes, doch passt die rot-gelb-goldene Flagge besser zu unseren Idealen und verkörpert unsere große republikanische Tradition, wie sie sich in der Revolution von 1848 und ähnlichen Ereignissen zeigte."
new_ger.110.a:	"Einheit, Recht und Freiheit!"
new_ger.110.b:	"Lassen Sie uns die Konservativen nicht verärgern ..."
new_ger.111.t:	"Die Freikorps integrieren sich in die Armee"
new_ger.111.d:	"Unter Wahrung ihrer politischen Stellung und Organisation sind die Freikorps-Divisionen nicht mehr streng von der regulären Armee getrennt, da sich beide miteinander vermischen. Dies hat dazu geführt, dass die Freikorps weniger konzentriert sind, aber insgesamt eine viel breitere Unterstützerbasis haben ..."
new_ger.111.a:	"Es lebe die neue Armee!"
new_ger.112.t:	"Das Schicksal des Kaiserreichs"
new_ger.112.d:	"Da der derzeitige Oberhaupt des Deutschen Kaiserreichs seine Unterstützung für unsere Opposition und Canaris erklärt hat, stehen wir vor einer Entscheidung. Da wir alle Trümpfe in der Hand halten, könnten wir die Wiederherstellung der Titel Wilhelms IV. wegen seines Verrats an unserer Nation rückgängig machen und seinen Bruder Ludwig Ferdinand auf den Thron setzen ..."
new_ger.112.a:	"Wir haben bereits zu sehr in die Monarchie eingegriffen!"
new_ger.112.b:	"Es ist eigentlich seine eigene Schuld."
new_ger.113.t:	"[FROM.GetNameDefCap] fordert Südtirol"
new_ger.113.d:	"Die [FROM.GetAdjective] haben sich an uns gewandt mit dem Ziel, Südtirol zurückzuerobern, ein Gebiet, das wir nach dem Großen Krieg rechtmäßig gewonnen haben. Wir würden dies gerne ablehnen, doch sie haben angedeutet, dass die Alternative Krieg sei... "
new_ger.113.a:	"Wir haben keine andere Wahl, als zuzustimmen!"
new_ger.113.b:	"Zum Teufel mit dem Krieg, dieses Land gehört uns!"
new_ger.114.t:	"[FROM.GetNameDefCap] tritt Südtirol ab"
new_ger.114.d:	"Unsere kaum verhüllten Drohungen waren ein großer Erfolg, da unsere Gebiete in Südtirol abgetreten wurden. Wir haben eine weitere Gruppe unseres Volkes befreit!"
new_ger.114.a:	"Wir haben keine andere Wahl, als zu akzeptieren! "
new_ger.115.t:	"[FROM.GetNameDefCap] weigert sich, Südtirol abzutreten"
new_ger.115.d:	"Unsere kaum verhüllten Drohungen sind gescheitert, da unsere Gebiete in Südtirol nicht abgetreten wurden. Wir müssen diese Gruppe unseres eigenen Volkes noch befreien! Wir müssen mobilisieren, um sie zu retten!"
new_ger.115.a:	"Dies wird nicht ungesühnt bleiben!"
new_ger.115.b:	"Dennoch ist Vorsicht weiterhin geboten ..."
new_ger.116.t:	"[FROM.GetNameDefCap] strebt eine Aufteilung Südtirols entlang ethnischer Grenzen an"
new_ger.116.d:	"Die [FROM.GetAdjective] haben uns ein Abkommen vorgeschlagen, Südtirol so aufzuteilen, dass es entlang ethnischer Grenzen geteilt wird. Die deutsche Mehrheit im Norden soll in [FROM.GetNameDef] integriert werden, während sie ihren Anspruch auf das mehrheitlich italienische Trentino aufgeben."
new_ger.116.a:	"Dies ist der perfekte Vorläufer für einen dauerhaften Frieden!"
new_ger.116.b:	"Dies würde rechtmäßiges italienisches Gebiet aufgeben!"
new_ger.117.t:	"[FROM.GetNameDefCap] stimmt der Teilung Südtirols zu"
new_ger.117.d:	"Zu unserer großen Freude wurden uns unsere Landsleute im nördlichen Südtirol zurückgegeben; somit wurde ohne Blutvergießen oder übermäßige Feindseligkeiten eine Einigung erzielt, um diese Gebiete angemessen mit dem Rest ihrer Nation wieder zu vereinen!"
new_ger.117.a:	"Erstaunlich!"
new_ger.118.t:	"[FROM.GetNameDefCap] lehnt die Teilung Südtirols ab"
new_ger.118.d:	"Trotz unserer größten Bemühungen, dies auf diplomatischem Wege zu lösen, ist die Teilung Südtirols gescheitert. Um dies zu korrigieren, schlagen einige vor, die gesamte Region einzufordern, um sie zur Vernunft zu bringen, während andere sagen, man solle es vorerst dabei belassen... Was dient unseren Interessen am besten?"
new_ger.118.a:	"Die nationale Einheit muss erreicht werden, so oder so..."
new_ger.118.b:	"Ein Krieg muss dennoch vermieden werden!"
new_ger.119.t:	"[FROM.GetNameDefCap] Strebt die Umsiedlung der Deutschen in Südtirol an"
new_ger.119.d:	"Die [FROM.GetAdjective]s haben sich mit einem Angebot an uns gewandt, in dem sie deutlich gemacht haben, dass sie bereit sind, alle Ansprüche auf Südtirol fallen zu lassen. Allerdings gibt es dabei einen Haken. Sie bitten um die Erlaubnis, alle Deutschen in diesem Gebiet ins Reich selbst umzusiedeln, wodurch uns diese Arbeitskräfte entzogen würden..."
new_ger.119.b:	"Dadurch würden rechtmäßige italienische Männer aufgegeben!"
new_ger.120.t:	"[FROM.GetNameDefCap] stimmt zu, uns unsere Männer entlassen zu lassen!"
new_ger.120.d:	"Zu unserer großen Freude wurden uns unsere Leute im nördlichen Südtirol zurückgegeben; somit wurde ohne Blutvergießen oder übermäßige Feindseligkeiten ein Abkommen erzielt, um diese Gebiete angemessen mit dem Rest ihrer Nation wieder zu vereinen!"
new_ger.120.a:	"Erstaunlich!"
new_ger.121.t:	"[FROM.GetNameDefCap] weigert sich, unser Volk gehen zu lassen!"
new_ger.121.d:	"Trotz unserer größten Bemühungen, unserem Volk die Ausreise zu ermöglichen, hat die italienische Regierung alle unsere Anstrengungen blockiert; folglich müssen wir entscheiden, wie wir vorgehen wollen. Wir können entweder versuchen, von ihnen die Gebiete mit deutscher Mehrheit zu erhalten, um dieses Volk doch noch zu befreien, oder wir können einen Weg des Friedens einschlagen und dieses Volk aufgeben ..."
new_ger.121.a:	"Dann müssen wir die Freigabe der Gebiete mit deutscher Mehrheit fordern!"
new_ger.121.b:	"Dieser Konflikt darf nicht außer Kontrolle geraten!"
new_ger.122.t:	"Das Schicksal der Mierendorff-Clique"
new_ger.122.d:	 "Was einst die SPD war, heute die Mierendorff-Clique der SED, befindet sich in einer interessanten Lage. Zwar haben sie viel zur Stärkung der Partei beigetragen und verfügen über viele einzigartige Stärken, doch sie sorgen auch für Spaltung und lassen es an kommunistischer Orthodoxie mangeln. Das bedeutet, dass sie in Zukunft eine Bedrohung für uns darstellen könnten, wenn man sie ungehindert lässt und sie versuchen sollten, die Partei zu untergraben. Wir müssen eine Entscheidung treffen, was wir mit diesem interessanten Gesindel tun sollen!"
new_ger.122.a:	"Ihr gesamter politischer Einfluss muss beseitigt werden!"
new_ger.122.b:	"Sie sollen unter unserer Aufsicht eine eigenständige Clique bleiben ..."
new_ger.123.t:	"Das Schicksal der Kommunisten"
new_ger.123.d:	" Da die Kommunisten in Deutschland über ein gewisses Maß an Macht verfügen, müssen wir über ihr Schicksal in unserer Revolution entscheiden. Wie werden wir mit ihrem subversiven Einfluss umgehen?"
new_ger.123.a:	"Sie sind ein Werkzeug, das wir nutzen können!"
new_ger.123.b:	"Sie sind eine Bedrohung, die es zu vermeiden gilt!"
new_ger.124.t:	"Das Schicksal des Reichskonkordats"
new_ger.124.d:	"Da die Nazis in Ungnade gefallen sind, schwebt das Reichskonkordat in der Schwebe – weder bestätigt noch aufgehoben. Wir müssen über sein Schicksal entscheiden und es nutzen, sei es durch sein Verschwinden oder durch seine Wiederbelebung."
new_ger.124.a:	"Es soll wiederbelebt werden!"
new_ger.124.b:	"Es soll nicht mehr sein ..."
new_ger.125.t:	"Das Schicksal der Versöhnler"
new_ger.125.d:	"Einige in der Partei sind entartet und haben beschlossen, mit der SPD und anderen Sozialfaschisten zusammenzuarbeiten, um die Revolution besser voranzubringen. Doch dieser Pragmatismus birgt vielleicht etwas Gutes, und vielleicht müssen wir die Sozialfaschisten vorerst nutzen ..."
new_ger.125.a:	"Die Versöhner haben zumindest teilweise Recht ..."
new_ger.125.b:	"Die Partei muss rein bleiben!"
new_ger.126.t:	"Die Sicherheit des Staates"
new_ger.126.d:	"Es ist unser höchstes Ziel, die Sicherheit des deutschen Staates von innen und außen zu gewährleisten. Wir stehen an beiden Fronten Feinden gegenüber und müssen entscheiden, wem wir Vorrang einräumen." "
new_ger.126.a:	"Der Staat muss von innen sicher sein."
new_ger.126.b:	"Der Staat muss von außen sicher sein."
new_ger.127.t:	"Die Klärung der Führungsfrage"
new_ger.127.d:	"Da wir nun die Verantwortung für Deutschland tragen, müssen wir eine Entscheidung über die Führung der NRAF treffen und uns zwischen Viktor Lutze und der SA-Clique oder Otto Strasser und der orthodoxen Fraktion der NRAF entscheiden. Lassen wir alles andere beiseite und entscheiden wir darüber!"
new_ger.127.a:	"Strasser hat unsere Ideologie geprägt."
new_ger.127.b:	"Lütze hat uns die Straßen erobert!"
new_ger.128.a:	"Die Gewerkschaften sind eine Gefahr für die Wirtschaft."
new_ger.128.b:	"Kompromisse müssen möglich sein, wir müssen uns die Mittelschicht sichern!"
new_ger.129.t:	"Was ist Ehe?"
new_ger.129.d:	"Weite Teile der SPD und ein beträchtlicher Teil der eher versöhnlichen KPD setzen sich seit langem dafür ein, den christlichen Einfluss auf unser Eheverständnis zu beenden. Sie schlagen vor, dass die Ehe zwischen zwei beliebigen Menschen geschlossen werden kann, die diesen Bund eingehen möchten, anstatt zwischen einem Mann und einer Frau. Dies würde jedoch unsere Gesellschaft destabilisieren und die Geburtenraten senken, während ihre Moral offen diskutiert wird. Sollten wir eine solche Politik umsetzen?"
new_ger.129.a:	"Nieder mit dem Christentum!"
new_ger.129.b:	"Nur weil die Christen etwas gesagt haben, ist es noch lange nicht falsch... "
new_ger.130.t:	"Das Endziel der CVU"
new_ger.130.d:	"Der deutsche Konservatismus hat in den vergangenen Jahren große Fortschritte gemacht; nun ist es an der Zeit zu entscheiden, wofür genau wir kämpfen – das Endziel unserer Partei."
new_ger.130.a:	"Es geht darum, eine konservative Massenbewegung zu schaffen! "
new_ger.130.b:	"Der Status quo der Union ist mehr als genug!"
new_ger.131.t:	"Die Kampagne zur Stärkung der deutschen Kultur"
new_ger.131.d:	"Da wir unsere Kultur ins Spiel bringen, um die Menschen für uns zu gewinnen, müssen wir entscheiden, worauf wir uns in unserer großartigen demokratischen Kultur konzentrieren."
new_ger.131.a:	"Wir sollten eine gemeinsame europäische Identität fördern."
new_ger.131.b:	"Wir sollten den deutschen Nationalismus stärken."
new_ger.132.t:	"Zur Lösung der Wirtschaftskrise"
new_ger.132.d:	"Die Nazis haben die Wirtschaft mit Maßnahmen wie den MEFO-Wechseln und anderen kurzfristigen Konjunkturmaßnahmen zugrunde gerichtet. Dadurch ist sie brüchig geworden und steht kurz vor dem Zusammenbruch. Wir müssen diese Krise angehen und verhindern, dass sie außer Kontrolle gerät. Dies wäre zwar mit hohen Kosten verbunden und könnte der Wirtschaft möglicherweise noch mehr schaden. Dennoch muss etwas getan werden!"
new_ger.132.a:	"Das Grundproblem anzugehen wäre zu kostspielig, lassen Sie uns stattdessen mit dem auskommen, was wir haben."
new_ger.132.b:	"Wir haben keine andere Wahl, als uns mit diesem Problem auseinanderzusetzen, lassen Sie uns dies zumindest lieber früher als später tun!"
new_ger.133.t:	"[GER.GetNameDefCap] erobert Slowenien für ihre Zwecke"
new_ger.133.d:	"Die [GER.GetAdjective] haben beschlossen, dass unsere Herrschaft über Slowenien ein Ende haben soll, und stattdessen entschieden, dass Sloweniens Schicksal anderswo liegt. Sie haben nun unsere dortigen Ländereien beschlagnahmt und sie an ihre bevorzugten Herrscher übertragen."
new_ger.133.a:	"Zumindest bedeutet das, dass sie aufhören werden, sich abspalten zu wollen."
new_ger.133.b:	"Nun, in diesem Fall: Zum Teufel mit den Deutschen!"
new_ger.134.t:	"[FROM.GetNameDefCap] lässt uns im Stich!"
new_ger.134.d:	"Da wir festgestellt haben, dass ihr Territorium für andere Zwecke besser geeignet ist, haben die [FROM.GetAdjective] beschlossen, unsere Herrschaft und unser Bündnis aufzugeben, da sie ihre Interessen nur allein gewahrt sehen. "
new_ger.134.a:	"Ich schätze, das ist nur fair..."
new_ger.134.b:	"Glauben Sie wirklich, das ist eine gute Idee?"
new_ger.135.t:	"[GER.GetNameDefCap] Bildet einen kroatischen Staat"
new_ger.135.d:	"Die [GER.GetAdjective] haben beschlossen, unsere Herrschaft über Kroatien zu beenden, und stattdessen entschieden, dass Kroatien seine Unabhängigkeit erhalten soll. Sie haben nun unsere dortigen Gebiete beschlagnahmt und sie diesem neuen kroatischen Staat übertragen!"
new_ger.135.a:	"Zumindest bedeutet das, dass sie aufhören werden, sich abspalten zu wollen."
new_ger.135.b:	"Nun, in diesem Fall: Zum Teufel mit den Deutschen!"
new_ger.136.t:	"[FROM.GetNameDefCap] bietet uns natürliche Grenzen an"
new_ger.136.d:	" Die [FROM.GetAdjective] haben beschlossen, uns natürliche Grenzen entlang der Flüsse in Ungarn und im Banat anzubieten, wenn wir ihnen die Rechte an den Ölfeldern von Ploiesti übertragen. Ein großartiger Tausch für uns beide, der ihre Kriegswirtschaft sichert und für unsere Sicherheit sorgt!"
new_ger.136.a:	"Stoßen wir auf unsere neuen Wohltäter an!"
neW_ger.136.b:	"Wir ziehen es dennoch vor, unser eigenes Öl zu behalten"
new_ger.137.t:	"[GER.GetNameDefCap] Verschenkt unser Land"
new_ger.137.d:	"Die [GER.GetAdjective] haben beschlossen, dass unser Teil des Reiches enden soll, und stattdessen beschlossen, ihn abzugeben, um deutsche Interessen zu verwirklichen. Sie haben nun unser Land dort beschlagnahmt und es an den von ihnen gewählten Ort übertragen."
new_ger.137.a:	"Schutz hat eben seinen Preis, wie ich sehe ..."
new_ger.137.b:	"Nun, in diesem Fall: Zum Teufel mit den Deutschen!"
new_ger.138.t:	"[GER.GetNameDefCap]verlangt, dass wir die jugoslawischen Ansprüche anerkennen"
new_ger.138.d:	"Die [GER.GetAdjective] haben beschlossen, die jugoslawischen Ansprüche offiziell zu unterstützen, doch sie tun dies nicht nur mit Worten, sondern auch mit Gewalt. Sie haben nun mit Krieg gedroht, sollten wir diese Gebiete nicht unverzüglich an Jugoslawien zurückgeben."
new_ger.138.a:	"Wir haben in dieser Angelegenheit wirklich keine Wahl ..."
new_ger.138.b:	"Das ist nur ein Bluff, lassen Sie uns ihn durchschauen!"
new_ger.139.t:	"[FROM.GetNameDefCap] weigert sich, jugoslawische Gebiete aufzugeben."
new_ger.139.d:	"Die [FROM.GetAdjective]-Regierung hat beschlossen, unseren Bluff zu durchschauen, und die Rückgabe der jugoslawischen Gebiete blockiert. Was sollen wir angesichts dieser offensichtlichen Weigerung, unsere internationale Autorität anzuerkennen, tun?"
new_ger.139.a:	"Wir haben doch nur geblufft ..."
new_ger.139.b:	"Verhängen wir ein Embargo gegen sie!"
new_ger.130.c:	"Bei Gott, in den Krieg!"
new_ger.140.t:	"[FROM.GetNameDefCap] bringt die Slowakei zur Abspaltung"
new_ger.140.d:	"[GER.GetLeader] hat mit dem slowakischen Parlament gesprochen und es davon überzeugt, sich von unserer Nation abzuspalten, indem er Unterstützung versprach und mit einer Teilung durch Ungarn und Polen drohte, sollte diese Maßnahme nicht ergriffen werden. Somit haben wir plötzlich einen großen Teil unseres Landes an diese nun von Deutschland unterstützte Marionette verloren und müssen entscheiden, wie wir mit den Folgen umgehen."
new_ger.140.a:	"Das kann nicht toleriert werden, wir werden nicht noch mehr Land verlieren!"
new_ger.140.b:	"Ich schätze, es ist wieder einmal eine vollendete Tatsache ..."
new_ger.141.t:	"[FROM.GetNameDefCap] Drängt uns zur Abtretung [FROM.FROM.GetName] an [HUN.GetNameDef]"
new_ger.141.d:	"Da sich ihr Einfluss überall ausbreitet, haben die Deutschen beschlossen, Druck auf uns auszuüben, damit wir [FROM.FROM.GetName] an ihre ungarischen Verbündeten zurückgeben. Sie haben verschiedene Drohungen angedeutet, sollten wir ihre Forderung ablehnen ..."
new_ger.141.a:	"Wer sind wir, dass wir einen so mächtigen Unterstützer ablehnen könnten?"
new_ger.141.b:	"Wir werden unsere Ländereien nicht einfach so aufgeben!"
new_ger.142.t:	"[FROM.GetNameDefCap] Übt Druck auf uns aus, [FROM.FROM.GetName] an [BUL.GetNameDef] zu übergeben"
new_ger.142.d:	"Da sich ihr Einfluss überall ausbreitet, haben die Deutschen beschlossen, Druck auf uns auszuüben, damit wir [FROM.FROM.GetName] an ihre bulgarischen Verbündeten zurückgeben. Sie haben verschiedene Drohungen angedeutet, sollten wir ihre Forderung ablehnen ..."
new_ger.142.a:	"Wer sind wir, dass wir einen so mächtigen Unterstützer ablehnen könnten? "
new_ger.142.b:	"Wir werden unsere Ländereien nicht einfach so aufgeben!"
new_ger.143.t:	"[FROM.GetNameDefCap] hat unseren Druck, [FROM.FROM.FROM.GetName] abzutreten, zurückgewiesen"
new_ger.143.d:	"Obwohl wir unseren Einfluss und Druck geltend gemacht haben, hat [FROM.GetNameDefCap] alle unsere Bemühungen, den Staat [FROM.FROM.FROM.GetName] aufzugeben, zurückgewiesen. Stattdessen halten sie an ihren Gebieten fest, obwohl diese rechtmäßig unseren Verbündeten gehören."
new_ger.143.a:	" Wie es ihr Recht ist..."
new_ger.143.b:	"Nun, dieses Spiel können zwei spielen..."
new_ger.143.c:	"In diesem Fall werden wir in den Krieg ziehen!"
new_ger.144.t:	"[FROM.FROM.FROM.GetName] wurde aufgrund deutschen Drucks zurückgegeben"
new_ger.144.d:	"In unserem Namen hat die deutsche Regierung Druck auf [FROM.GetNameDef] ausgeübt, damit diese [FROM.FROM.FROM.GetName] zugunsten unserer Ansprüche aufgibt. Lassen Sie uns über diese großartige Tatsache freuen und dafür sorgen, dass unsere Verbindungen zu [GER.GetNameDef] aufrechterhalten bleiben!"
new_ger.144.a:	"Und so sind wir der Wiederherstellung Großungarns einen Schritt näher gekommen!"
new_ger.145.t:	"[FROM.GetNameDefCap] schlägt einen gemeinsamen Angriff auf [JAP.GetNameDef] vor"
new_ger.145.d:	"Da sowohl wir als auch die Deutschen mit den Japanern noch eine Rechnung offen haben, haben sie einen gemeinsamen Angriff auf diese vorgeschlagen. Sie sind bereit, sofort auszumarschieren und zuzuschlagen, um die Japaner zu besiegen. Die Frage ist: Sind wir ebenfalls bereit?"
new_ger.145.a:	"Tod den Japanern!"
new_ger.145.b:	"Mäßigung ist der Schlüssel."
new_ger.146.t:	"[FROM.GetNameDefCap] schlägt einen gemeinsamen Angriff auf [SOV.GetNameDef] vor"
new_ger.146.d:	"Da sowohl wir als auch die Deutschen mit den Sowjets noch eine Rechnung offen haben – sie wegen dieser ideologischen Bedrohung und wir wegen ihrer Unterstützung von [PRC.GetNameDef] –, wäre es ratsam, gemeinsam daran zu arbeiten, sie zu vernichten. Daher hat [GER.GetLeader] vorgeschlagen, dass wir einen gemeinsamen Angriff organisieren, um gemeinsam zuzuschlagen."
new_ger.146.a:	"Tod dem Bolschewismus!"
new_ger.146.b:	"Dies ist nicht unser Kampf."
new_ger.147.t:	"[FROM.GetNameDefCap] fordert eine Volksabstimmung im Sudetenland"
new_ger.147.d:	"An diesem Tag hat [FROM.GetNameDef] eine Volksabstimmung im [FROM.GetAdjective] mehrheitlich besiedelten Gebiet des Sudetenlandes beantragt. Obwohl wir behaupten, den Werten der Selbstbestimmung zu folgen, würde die Annahme eines solchen Antrags zweifellos dazu führen, dass das Sudetenland nach Bekanntgabe der Ergebnisse aufgegeben wird."
new_ger.147.a:	"Dennoch ist es das Richtige, geben Sie uns 30 Tage!"
new_ger.147.b:	"Niemals würden wir unser Land einfach so aufgeben! "
new_ger.148.t:	"[FROM.GetNameDefCap] haben einer Volksabstimmung zugestimmt!"
new_ger.148.d:	"Man hat uns mitgeteilt, dass innerhalb von 30 Tagen eine Volksabstimmung stattfinden wird, die uns zweifellos die Kontrolle über unser Land zurückgeben wird!"
new_ger.148.a:	"Herrlich!"
new_ger.149.t:	"Die Sudetenland-Volksabstimmung"
new_ger.149.d:	"Die Ergebnisse der Volksabstimmung liegen vor, und wie erwartet hat sich die deutsche Mehrheit durchgesetzt. Das bedeutet, dass das Land nun gemäß den Grenzen vor dem Ersten Weltkrieg zurückgegeben wird."
new_ger.149.a:	"Und so verschiebt sich Europa erneut ..."
new_ger.150.t:	"Eine Volksabstimmung abgelehnt!"
new_ger.150.d:	"Die Unterdrücker in [FROM.GetNameDef] haben die Idee einer Volksabstimmung vom Tisch gewischt, obwohl wir eindeutig im Recht sind. Was sollen wir dagegen tun?"
new_ger.150.a:	"Unsere Landsleute werden, wenn nötig, mit Gewalt befreit!"
new_ger.150.b:	"Wir sind nicht in der Lage, uns zu streiten ..."
new_ger.151.t:	"[FROM.GetNameDef] bietet Garantien für die territoriale Integrität im Austausch für das Sudetenland"
new_ger.151.d:	"Da das Sudetenland größtenteils [FROM.GetAdjective] ist, haben sie angeboten, es zu erwerben, verbunden mit der Garantie, dass der Rest unserer Gebiete unwiderruflich [ROOT.GetAdjective] bleibt, wodurch das Problem dieser Minderheit in unserer Nation gelöst und Frieden sowie Verteidigung gegen jegliche ungarischen, österreichischen oder polnischen Ansprüche gesichert werden, sogar bis zu dem Punkt, dass [FROM.GetNameDef] uns in diesen Fragen unterstützen wird und nicht sie."
new_ger.151.a:	"Sicherheit und Stabilität? Da bin ich dabei!"
new_ger.151.b:	"Wir werden unsere Nation nicht einfach so verkaufen!"
new_ger.152.t:	"[FROM.GetNameDefCap] überträgt das Sudetenland"
new_ger.152.d:	" Zu unserer großen Freude sind Gesandte von [FROM.GetNameDef] zu uns gekommen und haben uns mitgeteilt, dass unser Kaufangebot angenommen wurde; das Sudetenland ist [ROOT.GetAdjective] wieder unser im Austausch gegen einige minimale diplomatische Zugeständnisse..."
new_ger.152.a:	"Herrlich!"
new_ger.153.t:	"Unser Angebot wurde zurückgewiesen!"
new_ger.153.d:	"Zu unserer Wut haben die Unterdrücker unserer Landsleute die Idee abgelehnt, das Sudetenland wieder unter seine rechtmäßige Herrschaft zu stellen. Können wir das einfach so hinnehmen?"
new_ger.153.a:	"Niemals! Fordern Sie eine offizielle Volksabstimmung!"
new_ger.153.b:	"Wir sollten das noch nicht vorantreiben ..."
new_ger.154.t:	"Das Ziel von Goerdelers Revolution"
new_ger.154.d:	"Carl Friedrich Goerdeler und seine konservative Verschwörerclique sind einerseits geeint, mit dem Endziel, Hitlers illegales Regime zu stürzen. Andererseits sind sie jedoch gespalten, da in dieser Bewegung zur Absetzung des Wahnsinnigen viele unterschiedliche politische Strömungen zusammenwirken, von denen jede ihre eigene Vision für die Zukunft Deutschlands hat. \nDaher muss er behutsam vorgehen und einen vorsichtigen Kurs steuern, um die Nation zusammenzuhalten und Deutschland nach Hitlers Sturz in eine sichere und stabile Zukunft zu führen. Und der erste Schritt dazu besteht darin, ein Ziel für diese neue deutsche Revolution zu verkünden, um Unterstützung zu gewinnen und das politische Kapital der Clique zu festigen."
new_ger.154.a:	"Wir werden danach streben, eine konservative Ordnung in unserem geliebten Vaterland zu schaffen!"
new_ger.154.b:	"Es wird eine starke demokratische Regierung erfordern, um breite Unterstützung zu gewinnen!"
new_ger.155.t:	"Viktor Lütze bietet uns einen Deal an"
new_ger.155.d:	" Im Jahr 1938 wurde die SA an den Rand gedrängt und Viktor Lutze an ihre Spitze gesetzt. Obwohl er selbst ein überzeugter Anhänger Hitlers war, erinnert er seitdem zunehmend an die Zeit des starken Einflusses der SA, der nun von Tag zu Tag schwindet. In der Hoffnung, die SA wiederzubeleben und ihrer Bewegung eine neue Zukunft zu bescheren, hat er angeboten, ihre alte Garde gegen Hitler anzuführen, um unseren Putsch zu unterstützen. Natürlich müssten wir ihm im Gegenzug einige Befugnisse im Militär einräumen und ihm erlauben, als Politiker zu kandidieren. Lohnt sich das wirklich?"
new_ger.155.a:	"Alles, um einen weiteren Verbündeten zu gewinnen!"
new_ger.155.b:	"Das kommt nicht in Frage!"
new_ger.156.t:	"Wilhelm Canaris führt geheime Gespräche mit Beck"
new_ger.156.d:	"Zwei Schlüsselfiguren der konservativen Anti-Hitler-Bewegung haben sich offenbar zu geheimen Gesprächen getroffen. Etwas, das zu einer Art Verschwörung innerhalb der Verschwörung werden könnte. Denn Beck hat Canaris einen Deal angeboten, bei dem sie gemeinsam daran arbeiten würden, Goerdelers demokratischeren Eifer auszuschalten und stattdessen einen starken deutschen Staat unter ihrer eigenen Kontrolle zu errichten. Ein Deal, der die Zukunftsaussichten des neuen Deutschlands drastisch verändern würde.\nDie Gespräche verliefen bislang interessant: Beide streben nach Macht, sind jedoch misstrauisch gegenüber dem anderen und wollen sie ernsthaft nur für sich selbst. Daher erscheint es fraglich, ob ein solcher Deal Bestand haben wird, sobald die Macht gesichert ist – falls er überhaupt zustande kommt."
new_ger.156.a:	"Zumindest vorläufig scheint eine Einigung erzielt worden zu sein ..."
new_ger.156.b:	"Nach einer zu vielen Meinungsverschiedenheit gehen die Männer nach Hause."
new_ger.157.t:	"Die Komintern bietet begrenzte finanzielle Unterstützung für die KPD und die Verschwörung an"
new_ger.157.d:	"Da eine deutsche Revolution die sowjetische Sache erheblich stärken würde, hat die Komintern angeboten, uns und den letzten Resten des KPD-Widerstands begrenzte finanzielle Unterstützung und später vielleicht sogar eine vollwertige sowjetische Expeditionsstreitmacht zur Verfügung zu stellen. Dies würde uns zwar erheblich unterstützen, aber die Konservativen in unserer Koalition stark verärgern. Darüber hinaus ist dieses Abkommen mit einer großen Bedingung verbunden. Sie haben gefordert, dass im Gegenzug für all dies die KPD bei der Ausrufung der neuen Deutschen Republik legalisiert werden muss."
new_ger.157.a:	"Ein lohnendes Geschäft, wenn auch zu einem sehr hohen Preis."
new_ger.157.b:	"Das geht zu weit."
new_ger.158.t:	"Wilhelm II. bietet seine Treue an"
new_ger.158.d:	"Da er in unserer konservativen Revolution eine neue Zukunft für die Monarchie in Deutschland sieht, hat Wilhelm II. sich heimlich an Beck und Goerdeler gewandt und ihnen seine volle Unterstützung für den Putsch angeboten; im Gegenzug verlangt er nur eine einzige Sache. Dass, in welcher Form auch immer, das Kaiserreich errichtet wird, sei es unter ihm oder unter seinem Enkel, spielt keine Rolle, solange diese eine Forderung erfüllt wird."
new_ger.158.a:	"Es lebe das neue Kaiserreich!"
new_ger.158.b:	"Was für ein Machtspiel! Inakzeptabel!"
new_ger.159.t:	"Wirtschaftlicher Zusammenbruch trifft die Nation"
new_ger.159.d:	"Mit dem Ausbruch des deutschen Bürgerkriegs und dem damit verbundenen Ende der MEFO-Wechsel liegt die Wirtschaft in Trümmern. Wir müssen etwas tun, um die Wirtschaft wieder anzukurbeln, und zwar schnell, damit sie nicht außer Kontrolle gerät."
new_ger.159.a:	"Wir haben die Weltwirtschaftskrise überstanden, wir können auch dies überstehen."
new_ger.160.t:	"[FROM.GetNameDefCap] schlägt eine weitere Teilung Polens vor"
new_ger.160.d:	"Im Einklang mit unserer Tradition, Polen immer wieder zu teilen, [FROM.GetNameDef] hat vorgeschlagen, dies noch einmal zu tun, wobei wir diesmal den Osten und sie den Westen erhalten und in Warschau ein kleiner Rest-Marionettenstaat verbleibt. Ein massiver Gewinn an Land und Industrie für uns beide."
new_ger.160.a:	"Jederzeit!"
new_ger.160.b:	"Das scheint mir etwas extrem, oder?"
new_ger.161.t:	"[FROM.GetNameDefCap] und [FROM.FROM.GetNameDef] fordern Teilung"
new_ger.161.d:	" Getreu ihrer Tradition, unseren Staat immer wieder aufzuteilen, haben [FROM.GetNameDef] und [FROM.FROM.GetNameDef] beschlossen, dies erneut zu tun, wobei sie diesmal [FROM.FROM.GetNameDef] den Osten und [FROM.GetNameDef] den Westen erhalten und uns einen kleinen Restmarionettenstaat in Warschau überlassen. Ein massiver Gewinn an Land und Industrie für beide, während unsere Nation fast vollständig zerstört wird."
new_ger.161.a:	"Haben wir wirklich eine Wahl?"
new_ger.161.b:	"Polen ist noch nicht verloren!"
new_ger.162.t:	"Nach sozioökonomischen Reformen kommt es zur Gründung zahlreicher Gewerkschaften"
new_ger.162.d:	"Nach unserer Stärkung der Arbeitnehmerrechte in Deutschland haben wir eine beispiellose Zahl von Gewerkschaftsgründungen erlebt. Daher müssen wir entscheiden, ob wir diese Entwicklung unterstützen, uns ihr anschließen oder uns ihr widersetzen."
new_ger.162.a:	"Lösen Sie die Gewerkschaften auf, sie stören die Wirtschaft!"
new_ger.162.b:	"Befürworten Sie ihre Gründung verbal."
new_ger.162.c:	"Kooptieren Sie sie und lassen Sie sie über staatliche Institutionen laufen."
new_ger.163.t:	"Das Schicksal des Nationalsozialismus"
new_ger.163.d:	"Nachdem die Allmachtsillusion des Nationalsozialismus zerbrochen ist, ist es nun an der Zeit zu entscheiden, was mit den Kernidealen dieser Bewegung geschehen soll. Sind sie in einer begrenzten Form verständlich und verzeihbar, oder sind sie durch und durch böse und ein Schandfleck der deutschen Geschichte?"
new_ger.163.a:	"Sie sind doch ein schrecklicher Schandfleck – sind sie nicht genau das, wogegen wir kämpfen?"
new_ger.163.b:	"Es ist verzeihlich, solange das Volk uns unterstützt."
new_ger.164.t:	"Das Schicksal der Antifaschistischen Aktion"
new_ger.164.d:	"Mit zunehmendem Einfluss der Volksarmee ist ein Problem aufgetreten: Die Antifaschistische Aktion, unsere Parteimiliz, strebt danach, die Hauptstreitmacht der deutschen Armee zu werden. Daher liegen sich die beiden in dieser Frage schon lange in den Haaren. Da die Volksarmee nun siegreich ist, müssen wir entscheiden, was mit der Antifaschistischen Aktion geschehen soll. Einerseits könnten wir sie einfach ausmerzen, wodurch wir jede Hoffnung der Antifaschistischen Aktion zunichte machen würden, sich der Volksarmee zu widersetzen, und die Volksarmee zufriedenstellen würden; allerdings könnten einige der Basis-Mitglieder der KPD unzufrieden sein, wenn sie sehen, dass wir noch mehr alte Parteimitglieder zusammenführen und ausmerzen. Wenn wir stattdessen versuchen, Blutvergießen zu vermeiden, könnten wir die Antifaschistische Aktion einfach dazu zwingen, lediglich als interne Parteidurchsetzungskraft zu fungieren und so der Volksarmee versichern, dass sie diese nicht verdrängen wird, obwohl dies für die Volksarmee nicht zufriedenstellend sein wird und die Antifaschistische Aktion verärgern wird. Schließlich könnten wir einen Kompromiss vorschlagen, bei dem die Antifaschistische Aktion Teil der Volksarmee wird, was jedoch zu einer Spaltung innerhalb der nun erweiterten Volksarmee führen würde..."
new_ger.164.a:	"Dennoch muss dieser Krebs entfernt werden, damit er nicht außer Kontrolle gerät!"
new_ger.164.b:	"Sie sind in Ordnung, solange sie ihren Anspruch aufgeben, die Hauptstreitmacht der deutschen Armee zu sein."
new_ger.164.c:	"Sie sollen als Hilfseinheiten in die Armee eingegliedert werden."
new_ger.165.t:	"[FROM.GetNameDefCap] Drängt auf die Schaffung einer Autonomie für das Sudetenland"
new_ger.165.d:	" Da die [FROM.GetAdjective] im Sudetenland die Mehrheit stellen, hat die [FROM.GetAdjective]-Regierung nun beschlossen, die Schaffung einer autonomen Zone in diesen Gebieten zu beantragen, die den Sudetendeutschen zusätzliche Freiheiten und Privilegien gewährt, damit sie trotz ihrer Lage in [ROOT.GetNameDef] als Deutsche leben können."
new_ger.165.a:	"Das ist der gerechte Preis dafür, ein multiethnischer Staat zu sein."
new_ger.165.b:	"Das würde uns Gewinne kosten ..."
new_ger.166.t:	"[FROM.GetNameDef] gewährt den Sudetendeutschen Autonomie"
new_ger.166.d:	"Auf unsere Bitte hin hat [FROM.GetNameDef] beschlossen, die Autonomie für unser in ihrem Land lebendes Volk anzuerkennen, wodurch die Harmonie wiederhergestellt wird und unser Volk in Frieden koexistieren kann!"
new_ger.166.a:	"Stoßen wir auf unsere neuen Freunde an!"
new_ger.167.t:	"[FROM.GetNameDef] Strebt ein Handelsabkommen an"
new_ger.167.d:	"Um seine stetig wachsende Wirtschaft und seine militärischen Bedürfnisse zu finanzieren, hat die Regierung von [FROM.GetNameDef] beschlossen, auf uns zuzugehen und uns politische Unterstützung und Gefälligkeiten im Austausch für günstigere Handelsbedingungen anzubieten. Ein Abkommen, das für uns beide vorteilhaft sein dürfte."
new_ger.167.a:	"Stoßen wir auf unsere neuen Freunde an!"
new_ger.167.b:	"[ROOT.GetAdjective] Ressourcen sind für die [ROOT.GetAdjective]s"
new_ger.168.t:	"[FROM.GetNameDef] beantragt Anlegerechte"
new_ger.168.d:	"Um ihre Kriegsanstrengungen jenseits des Atlantiks aufrechtzuerhalten, hat [FROM.GetNameDef] darum gebeten, dass wir ihnen Anlegerechte gewähren, wodurch ihr Marineeinflussbereich erheblich erweitert werden kann."
new_ger.168.a:	"Aber natürlich!"
new_ger.168.b:	"Wohin würde dieser Verstoß gegen die Neutralität führen?"
new_ger.169.t:	"[FROM.GetNameDef] drängt auf einen Luftwaffenstützpunkt"
new_ger.169.d:	"Um die Lufthoheit für ihren Krieg im Atlantik zu erlangen, hat [FROM.GetNameDef] auf die Ausweitung unserer Anlegerechte gedrängt und darum gebeten, dass wir diese auch in Zugangsrechte für Luftwaffenstützpunkte umwandeln, damit die Luftwaffe ihre Flügel über unserem Land ausbreiten kann."
new_ger.169.a:	"Ich sehe darin kein Problem!"
new_ger.169.b:	"Das geht zu weit!"
new_ger.170.t:	"[FROM.GetNameDefCap] schlägt einen Nichtangriffspakt vor"
new_ger.170.d:	"Um den Frieden zwischen unseren germanischen Brudervölkern zu sichern, hat [FROM.GetNameDef] einen Nichtangriffspakt vorgeschlagen; darüber hinaus haben sie angedeutet, dass eine weitere wirtschaftliche Zusammenarbeit in Aussicht stehen könnte, sollte dieser angenommen werden! "
new_ger.170.a:	"Eine Freundschaft mit gewissen Vorzügen klingt doch nach einer großartigen Idee!"
new_ger.170.b:	"Wir ziehen es vor, uns alle Optionen offen zu halten."
new_ger.171.t:	"[FROM.GetNameDefCap] schlägt ein Abkommen zur industriellen Zusammenarbeit vor"
new_ger.171.d:	"Angesichts unserer jüngsten Zusammenarbeit und Freundschaft [FROM.GetNameDef] beschlossen, diese etwas auszuweiten, und schlägt ein Industriekooperationsabkommen mit wissenschaftlichem Austausch, gemeinsamen Unternehmungen und vor allem groß angelegten Handelsabkommen vor – ein lukratives Geschäft, von dem beide Nationen in hohem Maße profitieren sollten!"
new_ger.171.a:	"Noch mehr Vorteile? Ich bin dabei!"
new_ger.171.b:	"Amerikanische Ressourcen sind nur für Amerikaner!"
new_ger.172.t:	"[FROM.GetNameDefCap] Strebt eine Zusammenarbeit mit den Afrikanern an"
new_ger.172.d:	" [FROM.GetNameDefCap] hat sich an unsere germanische herrschende Klasse, die Afrikaner, gewandt und vorgeschlagen, mit ihnen zusammenzuarbeiten, um ihre Kontrolle über den Staat zu festigen und die Beziehungen zur [GER.GetAdjective]-Regierung zu verbessern. Darüber hinaus gibt es Gerüchte, dass sie uns vielleicht dabei helfen könnten, die Kolonialherrschaft zu stürzen und unseren eigenen germanischen Staat in Afrika zu errichten...."
new_ger.172.a:	"Eine ganze Menge! Hoch lebe die afrikanische Identität!"
new_ger.172.b:	"Wir sind der Ansicht, dass der Status quo in Ordnung ist, so wie er ist."
new_ger.173.t:	"[FROM.GetNameDefCap] schließt Vorbereitungen für den Staatsstreich ab"
new_ger.173.d:	"[FROM.GetNameDefCap] hat uns mitgeteilt, dass alle Vorbereitungen für den oben genannten Putsch abgeschlossen sind und dieser jederzeit beginnen könnte, sofern sich die lokalen Afrikaner dazu verpflichten. Allerdings ist ein Putsch ein radikaler Schritt, und wir müssen sicher sein, dass wir wirklich so weit gehen wollen."
new_ger.173.a:	"Das geht zu weit ..."
new_ger.173.b:	"Es lebe der neue afrikanische Staat!"
new_ger.174.t:	"[FROM.GetNameDefCap] strebt die Errichtung einer Militärbasis auf unserem Boden an"
new_ger.174.d:	"Aufgrund unserer hervorragenden Lage am Atlantik hat [FROM.GetNameDef] versucht, einen Militärstützpunkt auf unserem Boden zu errichten, um uns als Ausgangspunkt für die Ausweitung ihres Einflussbereichs zu nutzen. Im Gegenzug würden uns verschiedene Vergünstigungen und Finanzmittel gewährt werden..."
new_ger.174.a:	"Das geht zu weit ..."
new_ger.174.b:	"Was für ein großartiges Angebot!"
new_ger.175.t:	"[FROM.GetNameDefCap] bietet uns Nordirland an"
new_ger.175.d:	"Angesichts unserer Notlage aufgrund der Teilung unserer Insel haben die Deutschen beschlossen, uns die Wiedervereinigung anzubieten. Sie verlangen lediglich, dass wir ihrem Bündnis beitreten und so zu einem Stützpunkt für ihre Streitkräfte werden. Im Gegenzug werden sie unseren Anspruch auf den nördlichen Teil unserer Heimat voll und ganz unterstützen."
new_ger.175.a:	"Zu viel Blut wurde auf diesem Land vergossen."
new_ger.175.b:	"Ein glorreicher Deal!"
new_ger.176.t:	"[FROM.FROM.GetAdjective] Staatsstreich in Südafrika"
new_ger.176.d:	"Ein [FROM.FROM.GetAdjective] Staatsstreich hat unsere Herrschaft in Südafrika gestürzt; die einheimischen Afrikaner, also die weiße herrschende Klasse, haben die Macht an sich gerissen und eine unabhängige, radikale, pro-deutsche Regierung gebildet. Sie haben sich unverzüglich der [FROM.FROM.GetFactionName] angeschlossen und beabsichtigen, ohne [ROOT.GetAdjective] Herrschaft weiterzuleben."
new_ger.176.a:	"Bei Gott, in den Krieg!"
new_ger.176.b:	"Wie können sie es wagen!"
new_ger.176.c:	"Ist das nicht ihr Recht?"
new_ger.177.t:	"Das Schicksal von [LUX.GetNameDef]"
new_ger.177.d:	"Während wir dem Beispiel des Heiligen Bonifatius folgen, der im Auftrag eines deutschen Kaisers die Heiden vernichtete, marschiert die $GER_army_modifier$ in [BEL.GetNameDef] ein, Eupen-Malmedy sichert und unsere Männer, Frauen und Kinder befreit, müssen wir eine Entscheidung treffen. Wenn wir diesen Krieg gegen die gottlosen Heiden in [FRA.GetNameDef] zügig und mit minimalem Blutvergießen gewinnen wollen, müssen wir entschlossen handeln und dabei einige Eier zerbrechen, auch wenn dies unserem internationalen Ansehen schaden mag. Somit haben wir eine großartige Gelegenheit, unsere Front gegen [BEL.GetNameDef] und [FRA.GetNameDef] auszudehnen, indem wir eine gepanzerte Faust durch [LUX.GetNameDef] treiben. Wenn wir dies jedoch tun wollen, müssen wir schnell, entschlossen und unverzüglich handeln."
new_ger.177.a:	"In diesem Fall sollten wir dies nutzen, um die natürlichen Grenzen im Westen zu sichern!"
new_ger.177.b:	"Bringen wir es hinter uns ..."
new_ger.177.c:	"Der Zweck heiligt nicht die Mittel."
GER_thalmanns_bop_tt:	"§tDie negative Verschiebung des Kräftegleichgewichts ist dauerhaft und erfordert dauerhafte Maßnahmen, um ihr entgegenzuwirken, damit das Regime nicht in der Gunst des Volkes sinkt... "
