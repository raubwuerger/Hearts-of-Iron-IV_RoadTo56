GER_plan_z_idea:0					"Plan Z"
r56_ger_naval_treaty:0					"[ENG.GetAdjective]-[GER.GetAdjective] Flottenvertrag"
r56_ger_naval_treaty_desc:0					"Die jüngsten Gespräche mit [ENG.GetNameDef] haben die uns durch den Vertrag von Versailles auferlegten Marinebeschränkungen weitgehend gelockert, so dass wir unsere Marinekapazitäten massiv ausbauen können. Allerdings gibt es immer noch Beschränkungen für unsere Marineproduktion, und das wird auch so bleiben, bis wir den Schritt machen, unsere Marine vollständig von dem Vertrag zu befreien."
r56_GER_four_year_plan:0					"Der Vierjahresplan"
r56_GER_four_year_plan_upgrade:0					"Der Ewige Vierjahresplan"
r56_GER_four_year_plan_desc:0					"§WEinstieg in einen§! §Offensivkrieg§! §Wmit einer§! §YGroßmacht§! §RRemoves§! §Wdas§! §YNationaler Geist§!\n"
GER_coerce_the_technocrats:0					"Zwingen Sie die Technokraten"
r56_GER_four_year_plan_upgrade_tt:0					"§Y$r56_GER_four_year_plan$ Nationaler Geist§! wird dauerhaft und wird nicht mehr entfernt, wenn §REin Angriffskrieg§!§W.§! beginnt"
GER_coerce_the_technocrats_desc:0					"Viele Geschäftsleute und ihre Partner, die sogenannte technokratische Klasse, hassen es, unter unserer derzeitigen Regierung Geschäfte zu machen und zu forschen. Diese potenzielle fünfte Kolonne muss vernichtet werden, bevor sie die Chance hat, uns von innen heraus zu zerstören. Die technokratische Klasse wird sich unserem Willen beugen und unsere Bemühungen um die Entwicklung unseres Landes unterstützen. Auf die eine oder andere Weise."
r56_GER_coerce_the_technocrats_idea:0					"Gezwungene Technokraten"
r56_GER_coerce_the_technocrats_idea_desc:0					"Die Klasse der Unternehmer und Technokraten wird sich unserem Willen beugen. Wir werden ihnen keine Wahl lassen!"
GER_coerce_the_technocrats_tt:0					"Wenn der Fokus §Y$GER_institute_price_controls$§! §Yabgeschlossen ist:§!"
r56_GER_economic_uncertainty:0					"Wirtschaftliche Ungewissheit"
r56_GER_economic_uncertainty_desc:0					"Die Industriellen sind besorgt über die wirtschaftlichen Entscheidungen, die die Regierung zu treffen hat. Die Entscheidung, ob das MEFO-Bills-Programm beibehalten oder zugunsten eines anderen Wachstumsprogramms gestrichen werden soll, würde die Ängste der Märkte vor unserer Wirtschaft im In- und Ausland lindern."
GER_enigma_machine0:0					"Enigma-Maschine"
GER_enigma_machine1:0					"Verbesserte Enigma-Maschine"
GER_enigma_machine2:0					"5-Rotor-Enigma-Maschine"
GER_enigma_machine3:0					"8-Rotor-Enigma-Maschine"
GER_establishing_the_reichskommissar:0					"Einsetzung des Reichskommissars"
GER_eastern_campaign:0					"Ostfeldzug"
GER_eastern_campaign_desc:0					"Staatlich finanzierte Propagandakampagnen haben selbst den stärksten Kriegsgegnern im Osten versichert, dass die Siegesbedingungen zu [GER.getAdjective] Bedingungen diktiert werden und keine Verhandlungen die Erfolge der Wehrmacht behindern werden. \n\n§Dieser Nationale Geist wird entfernt, wenn [SOV.getAdjective]-verursachte [GER.getAdjective] Verluste eine Schwelle von 4 Millionen erreichen oder ein eigener [SOV.getAdjective]-Kernstaat mehr als 50% Zustimmung hat.§!"
erwache.1.t:0					"Ernennung von Wirtschaftspositionen"
erwache.1.desc:0					"Wir haben zwei Ernennungsoptionen für die Ämter des Reichsbankpräsidenten und des Wirtschaftsministers. Einer der möglichen Kandidaten, Hjalmar Schacht, ist sehr gut darin, mit den Unternehmen von [GER.GetNameDef] zusammenzuarbeiten und die zivile Infrastruktur zu entwickeln. Seine mangelnde Loyalität gegenüber der NSDAP und seine Verachtung für Militärausgaben machen ihn jedoch zu einer bedenklichen Wahl. Unser zweiter möglicher Kandidat, Walther Funk, ist der NSDAP gegenüber sehr loyal und ein großer Befürworter von Militärausgaben. Wenn wir einen vernünftigen Fortschritt beim [GER.GetADjective] Aufschwung machen wollen, müssen wir einen dieser beiden Männer wählen, um unsere Wirtschaft zu führen."
erwache.1.a:0					"Hjalmar Schacht."
