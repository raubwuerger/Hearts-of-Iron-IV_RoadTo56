erwache.5.t:0					"Der [GER.GetAdjective] Bürgerkrieg"
erwache.7.t:0					"[GER.GetNameDefCap] bietet Frieden an!"
erwache.7.d:0					"[SOV.GetNameDefCap] wurde ein Vertrag vorgeschlagen, um den [GER.GetAdjective]-[SOV.GetAdjective] Krieg im Osten zu beenden. Der Vertrag beinhaltete die Abtretung mehrerer westlicher [SOV.GetAdjective]-besetzter Gebiete an die [GER.GetAdjective] im Austausch für den Frieden. Diese Bedingungen ähneln dem Vertrag von Brest-Litowsk, der den deutsch-sowjetischen Konflikt während des Großen Krieges beendete."
erwache.7.a:0					"Lehnen Sie die Bedingungen ab!"
erwache.7.b:0					"Akzeptieren Sie die Bedingungen."
r56_GER_first_vienna_award_tt:0					"§Abhängig von Ihrer Wahl wird der Erste Wiener Schiedsspruch ausgelöst, wenn [HUN.GetNameDef] nicht [664.getName] und [996.getName] besitzt."
r56_GER_first_vienna_award_II_tt:0					"§Diese Wahl löst den Ersten Wiener Schiedsspruch direkt danach aus, wenn [HUN.GetNameDef] nicht [664.getName] und [996.getName] besitzt.§!"
erwache_news.2.t:0					"[SOV.GetnameDefCap] verweigert den Frieden mit [GER.GetnameDef]!"
erwache_news.2.d:0					"\n[SOV.GetNameDefCap] hat einen Vertragsvorschlag zur Beendigung des [GER.GetAdjective]-[SOV.GetAdjective]-Krieges im Osten abgelehnt. Der Vertrag sah vor, mehrere westliche, von [SOV.GetADjective] besetzte Gebiete an [GER.GetADjective] abzutreten. Diese Bedingungen ähneln dem Vertrag von Brest-Litowsk, der den deutsch-sowjetischen Konflikt während des Ersten Weltkriegs beendete."
erwache_news.2.a:0					"Dann müssen wir die [SOV.GetAdjective] Länder mit Gewalt annektieren."
erwache_news.2.b:0					"Wir werden um jeden Zentimeter kämpfen!"
erwache_news.2.c:0					"Interessant."
