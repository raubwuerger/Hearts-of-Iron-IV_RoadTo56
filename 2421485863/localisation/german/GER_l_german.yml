GER_reclaiming_our_colonies:0					"Wiederherstellung unserer imperialen Besitztümer"
GER_reclaiming_our_colonies_desc:0					"Der Vertrag von Versailles verlangte von uns, dass wir unsere Souveränität über die kaiserlichen Gebiete aufgeben, die Deutschland vor dem Ersten Weltkrieg innehatte. Dadurch wurden wir von einer globalen Supermacht zu einer bloßen Regionalmacht. \nAber jetzt, da der Kaiser wieder an der Macht ist, könnte es an der Zeit sein, unser Reich ein für alle Mal zurückzuerobern!"
GER_asia_department:					"Die Asien-Abteilung"
GER_asia_department_tt:					"Dieser Schwerpunkt wird zur Voraussetzung für §YBefriend Japan§! und §YBefriend China§!, sobald §YKill Hitler§! ausgewählt wurde."
