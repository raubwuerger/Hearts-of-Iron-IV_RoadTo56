r56.kill_hitler.4.t:0					"Hitlers Flugzeug abgestürzt!"
r56.kill_hitler.4.desc:0					"Ein offizieller Bericht hat bestätigt, dass es sich bei dem Flugzeugwrack, das kurz nach dem Start vom Flughafen Tempelhoff abgestürzt ist, tatsächlich um das Privatflugzeug des Führers handelt, der sich an Bord befand. Eine Bombe wurde von verschwörerischen Offizieren an Bord geschmuggelt, als eine allgemeine Meuterei das ganze Reich zu erfassen schien.\n\n Was als nächstes passiert, bleibt abzuwarten, aber es wird erwartet, dass in den nächsten Stunden ein neuer Führer vereidigt wird."
