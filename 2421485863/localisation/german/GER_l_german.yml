l_german:
r56_ger_ersatz_idea_1:0		"Ersatzmaterialien"
r56_ger_ersatz_idea_1_desc:0		"The economy is not getting access to all the materials it needs from international trade. We must use what we have to make substitutions."
GER_kill_hitler_shortcut:0		"$GER_kill_hitler$"
GER_bernhard_rogge:0		"Bernhard Rogge"
GER_helmuth_walter:0		"Helmuth Walter"
GER_deutsche_forschungsanstalt_fur_segelflug:0		"DFS"
GER_deutsche_forschungsanstalt_fur_segelflug_desc:0		"Deutsche Forschungsanstalt für Segelflug"
GER_erma_werke:0		"Erma Werke"
GER_erma_werke_desc:0		"Maschinenfabrik Geipel"
GER_hanomag:0		"Hanomag"
GER_hanomag_desc:0		"Hannoversche Maschinenbau"
GER_mio_trait_mechanized_simplification:		"Design Vereinfachung"
GER_mio_trait_mg34:0		"Mg 34 Maschinengewehre"
GER_begin_depression_recovery:0		"Beginn der Erholung von der Depression"
GER_begin_depression_recovery_desc:0		"Der Umgang der Weimarer Republik mit der großen Depression hat die Wirtschaft noch schlimmer gemacht. Wir sollten damit beginnen, diesen von den Feinden des [GER.GetNameDef] angerichteten Schaden zu beheben."
GER_begin_reinhardt:0		"Beginnen Sie mit dem Reinhardt-Programm"
GER_begin_reinhardt_desc:0		"Der erste Schritt zur wirtschaftlichen Erholung besteht darin, das Wachstum der Unternehmen zu fördern. Indirekte Anreize, wie z.B. Steuererleichterungen, werden die Entwicklung der privaten Industrie fördern."
GER_finish_reinhardt:0		"Beenden Sie das Reinhardt-Programm"
GER_finish_reinhardt_desc:0		"Die direkten Investitionen des Reinhardt-Programms in die Infrastruktur werden große Erfolge bringen."
GER_privatize_reichsbahn:0		"Privatisieren Sie die Reichsbahn"
GER_privatize_reichsbahn_desc:0		"Der erste Schritt zur Wiederherstellung unserer Infrastruktur wird die Wiederbelebung des Eisenbahnsystems durch Privatisierung sein."
GER_privatize_stahlwerke:0		"Privatisieren Sie die Vereinigten Stahlwerke"
GER_privatize_stahlwerke_desc:0		"Um die Schlagkraft unseres Militärs auf den Stand von vor Versailles zu bringen, müssen wir unsere Stahlwerke effizienter machen."
GER_synth_oil_research:0		"Erforschen Sie synthetisches Öl"
GER_synth_oil_research_desc:0		"Da [GER.GetNameDef] nur über wenige natürliche Öl- und Kautschukquellen verfügt, müssen wir uns auf die Herstellung von synthetischem Öl verlassen, um unsere Reserven an diesen kostbaren Ressourcen aufzustocken."
GER_oil_refinery_development:0		"Bauen Sie Ölraffinerien"
GER_oil_refinery_development_desc:0		"Da sich unsere Forschung und Technologie für synthetisches Öl verbessert haben, können wir fortschrittlichere Raffinerien bauen."
GER_establish_peenmunde:0		"Peenemünder Labor einrichten"
GER_establish_peenmunde_desc:0		"Die Einrichtung eines neuen Zentrallabors wird unsere wissenschaftlichen Erkenntnisse und unsere Forschung auf ein neues Niveau heben."
GER_establish_SS:0		"Die SS gründen"
GER_establish_SS_desc:0		"Die einzige Möglichkeit, die Führung von [GER.GetNameDef] vor äußeren Bedrohungen zu schützen, ist eine Elite-Leibgarde. Diese Leibwache, die SS, wird dafür sorgen, dass die Regierung reibungslos funktioniert und sich mit denjenigen befassen, die ihr schaden wollen."
GER_aux_police_SS:0		"SS als Hilfspolizei einsetzen"
GER_aux_police_SS_desc:0		"Die Rolle der SS kann sich natürlich auch auf den zivilen Bereich ausweiten, sowohl in Großdeutschland als auch in den besetzten Gebieten. Hoffentlich kann sie mit den Bedrohungen durch Partisanen und Terroristen fertig werden, die die Truppen der Wehrmacht angreifen."
GER_elite_soldiers_SS:0		"Einsatz der SS an der Frontlinie"
GER_elite_soldiers_SS_desc:0		"Die einzigartige Ausbildung und Schulung der SS-Soldaten macht sie in Rollen, die mehr Hingabe und Loyalität gegenüber dem Väterland erfordern, viel besser als Standardeinheiten."
GER_combine_SS_gestapo:0		"Kombinieren Sie die SS und die Gestapo"
GER_combine_SS_gestapo_desc:0		"Durch die Zusammenlegung von SS und Gestapo erhalten wir eine Truppe, die militärische Operationen, friedenserhaltende Maßnahmen und Anti-Terror-Einsätze durchführen kann."
GER_purge_political_opponents:0		"Beseitigen Sie politische Gegner"
GER_purge_political_opponents_desc:0		"Die einzige Möglichkeit, mit dem unbestreitbar starken Einfluss anderer politischer Parteien umzugehen, besteht darin, sie vollständig zu beseitigen. Nur so können wir die Einheit unserer Nation stärken und [GER.GetNameDef] zum Sieg führen."
GER_strengthen_german_state:0		"Die polizeilichen Bemühungen neu ausrichten"
GER_strengthen_german_state_desc:0		"Da die politische Lage zu Hause sicher ist, sollten wir die Militärpolizei an anderer Stelle einsetzen und auch ihren Einfluss verringern."
GER_operation_ikarus:0		"Operation Ikarus"
GER_operation_ikarus_desc:0		"Island ist als Stützpunkt für die Nordatlantikschifffahrt zu wichtig, um es unbesetzt zu lassen. Wir müssen es sofort einnehmen!"
GER_sweden_war:0		"Krieg mit [SWE.GetNameDef]"
GER_sweden_war_desc:0		"Wir importieren seit Jahren Wolfram und Eisen aus Schweden. Die Bedrohung von [SWE.GetNameDef] durch den Feind ist auch eine Bedrohung für das Militär und die Expansion von [GER.GetNameDef]. Wir müssen [SWE.GetNameDef] sichern, damit diese lebenswichtigen Ressourcen nicht in die Hände des Feindes fallen."
GER_finland_friend:0		"Befreit [FIN.GetNameDef]"
GER_finland_friend_desc:0		"[FIN.GetNameDefCap] ist seit langem ein Feind von [SOV.GetNameDef] und könnte sich als wichtiges Bindeglied zur Nordfront und zum Rest Skandinaviens erweisen."
GER_finland_war:0		"Krieg mit [FIN.GetNameDef]"
GER_finland_war_desc:0		"Der Einfluss von [FIN.GetNameDefCap] in [SOV.GetNameDef] und Skandinavien macht ihn für [GER.GetNameDef]s weitere Expansion lebenswichtig. Die Sicherung dieser Festung wird ein schwerer Schlag für unsere Feinde sein."
GER_prepare_france_invasion:0		"Bereiten Sie das westliche Theater vor"
GER_prepare_france_invasion_desc:0		"Frankreich war ein Gegner unserer politischen und militärischen Expansion und hat den verdammten Vertrag von Versailles mitverfasst. Wir müssen also jederzeit auf eine Konfrontation mit ihnen vorbereitet sein."
GER_core_lorraine:0		"Elsass-Lothringen eingliedern"
GER_core_lorraine_desc:0		"Das Gebiet von Elsass-Lothringen ist seit langem die Heimat einer deutschsprachigen Bevölkerung. Frankreich hat dieses Land von Deutschland gestohlen; jetzt ist es an der Zeit, es endgültig zurückzuerobern."
GER_mobile_warfare:0		"Kombinierte Kriegsführung"
GER_mobile_warfare_desc:0		"Unsere technologischen Fortschritte bei der militärischen Macht in der Luft und an Land können koordiniert werden, so dass wir die langsamen und blutigen Merkmale des Grabenkriegs vermeiden können. [FRA.GetNameDefCap] wird ein Übungsplatz für unser neues Militär sein, und wir werden eine neue Form des Krieges einführen."
GER_build_panzer_army:0		"Bauen Sie die Panzerarmee auf"
GER_build_panzer_army_desc:0		"Bevor wir eine Invasion starten, müssen wir sicherstellen, dass unsere Panzerdivisionen auf dem neuesten Stand sind und über die notwendigen Panzer verfügen."
GER_build_panzer_quality:0		"Bevorzugen Sie Qualität"
GER_build_panzer_quality_desc:0		" "
GER_build_panzer_quantity:0		"Bevorzugen Sie Quantität"
GER_build_panzer_quantity_desc:0		" "
GER_captured_heavy_weapons:0		"Erbeutete schwere Waffen wiederverwenden"
GER_captured_heavy_weapons_desc:0		"Trotz unserer überlegenen Ausrüstungsproduktion dürfen wir die Möglichkeiten der feindlichen Ausrüstung, die wir erbeuten, nicht vernachlässigen."
GER_superior_firepower:0		"Die moderne Armee"
GER_superior_firepower_desc:0		"[GER.GetNameDefCap] sollte als erstes zeigen, wie vorteilhaft eine gut organisierte Unterstützung in ihren Einheiten ist."
GER_elite_units:0		"Spezialisierte Einheiten"
GER_elite_units_desc:0		"In der Theorie mag der Universalsoldat gut klingen, aber in der Realität können unsere Ausbildung und unsere Soldaten nicht damit mithalten, für jedes Terrain und jedes Szenario ausgebildet zu werden. Wir brauchen spezialisierte Einheiten, die die kompliziertesten Aufgaben ausführen und sich bei diesen Aufgaben auszeichnen."
GER_mechanization_of_the_army:0		"Mechanisieren Sie die Armee"
GER_mechanization_of_the_army_desc:0		"Für diejenigen, die über unsere Propaganda hinausblicken, ist es kein Geheimnis, dass unsere Armee nach wie vor eine der Pferde- und Zugtruppen ist. Es sollte eines unserer Hauptziele sein, den Einsatz von mobiler und gepanzerter Infanterie zu erhöhen."
GER_prevent_aerial_hegemony:0		"Schutz gegen Angriffe aus der Luft"
GER_prevent_aerial_hegemony_desc:0		"Eine gute Luftabwehr macht Flugzeuge für offensive Aktionen frei und schützt die Truppen am Boden."
GER_above_maginot:0		"Über Maginot"
GER_above_maginot_desc:0		"Einige in unserem Oberkommando haben vorgeschlagen, dass wir unsere neue und schlagkräftige Luftwaffe voll einsetzen, um Kämpfe am Maginot zu vermeiden. Bevor wir dies tun, müssen wir mehr in Technologien investieren, die primäre Luftlandeoperationen der Infanterie ermöglichen."
GER_plan_sealion:0		"Bereiten Sie sich auf Sealion vor"
GER_plan_sealion_desc:0		"[ENG.GetNameDefCap] ist uns schon seit langem ein Dorn im Auge. Die einzige Möglichkeit, diesen Dorn zu entfernen, besteht darin, den Ärmelkanal zu überqueren und ihn mit Gewalt auszuschalten."
GER_landing_craft:0		"Forschung an Landungsbooten"
GER_landing_craft_desc:0		"Nur mit neuen Landungsbooten können wir erfolgreich eine bedeutende Seeinvasion starten."
GER_air_superiority_english_channel:0		"Beherrschen Sie den Luftraum"
GER_air_superiority_english_channel_desc:0		"Nur mit einer starken Luftherrschaft können wir unser Heimatland schützen und überwältigende Bodenunterstützung leisten."
GER_train_paratroopers:0		"Fallschirmjäger ausbilden"
GER_train_paratroopers_desc:0		"Fallschirmjägerdivisionen, unsere Luftlande-Infanteriedivisionen, werden die einzige Möglichkeit sein, Ziele hinter den feindlichen Linien oder auf dem Landweg unzugänglich einzunehmen und zu erobern."
GER_naval_superiority_english_channel:0		"Flexible Doktrin"
GER_naval_superiority_english_channel_desc:0		"Die einzige Möglichkeit, unsere amphibischen Invasionen oder unseren Handel zu schützen, wird der intelligente Einsatz unserer Marine sein, vielleicht sogar gegen stärkere Seemächte."
GER_enact_sealion:0		"Sealion ausführen"
GER_enact_sealion_desc:0		"Die Zeit ist endlich gekommen. Wir werden unseren Plan, in Großbritannien einzumarschieren, in die Tat umsetzen und diesen Dorn, den wir so lange beherbergt haben, endlich entfernen."
GER_alliance_with_italy:0		"Bündnis mit [ITA.GetNameDef]"
GER_alliance_with_italy_desc:0		"Die Italiener mögen unzuverlässig sein - das haben sie im Großen Krieg bewiesen - aber Mussolini und seine faschistische Bewegung haben gezeigt, dass es noch Hoffnung für [ITA.GetNameDef] gibt. [Ger.GetNameDefCap] kann nur gewinnen, wenn er sich mit [ITA.GetNameDef] verbündet."
GER_prepare_italian_invasion:0		"Bereiten Sie das südliche Theater vor"
GER_prepare_italian_invasion_desc:0		"Bis wir wissen, ob die Schweizer und die Italiener mit uns oder gegen uns sind. Wir müssen unsere südliche Grenze vorbereiten, um sie zu bekämpfen."
GER_core_south_tyrol:0		"Beanspruchen Sie Südtirol"
GER_core_south_tyrol_desc:0		"Ähnlich wie Danzig oder Elsass-Lothringen ist auch Südtirol eine Provinz, in der eine große deutschsprachige Bevölkerung lebt. Wir müssen unsere im Exil lebenden Völker wieder unter [GER.GetAdjective] Schutz stellen."
GER_war_with_italy:0		"Krieg mit [ITA.GetNameDef]"
GER_war_with_italy_desc:0		"Unsere Vorbereitungen sind abgeschlossen und die Zeit ist gekommen: Wir müssen in das Land unseres ehemaligen Verbündeten eindringen."
GER_prepare_poland_invasion:0		"Bereiten Sie das östliche Theater vor"
GER_prepare_poland_invasion_desc:0		"Nach dem Ersten Weltkrieg hat Polen uns den Hafen von Danzig gestohlen; außerdem sind sie unser taktischer Weg nach Osteuropa. Wir müssen unsere Infrastruktur entlang der [POL.GetAdjective] Grenze ausbauen."
GER_modernize_CAS:0		"Luftunterstützung modernisieren"
GER_modernize_CAS_desc:0		"Während unsere Bodentruppen modernisiert werden, müssen wir sie mit einer neu erforschten Luftnahunterstützungstruppe unterstützen."
GER_schwerepunkt_tactics:0		"Schwerpunkt-Taktik"
GER_schwerepunkt_tactics_desc:0		"Mit speziellen Konzentrationspunkten für unsere mobilen Streitkräfte, wie z.B. gepanzerte und motorisierte Divisionen, stellen wir sicher, dass wir selbst die stärksten Verteidigungslinien durchbrechen können."
GER_soviet_friend:0		"Befreunden [SOV.GetNameDef]"
GER_soviet_friend_desc:0		"Die Freundschaft mit [SOV.GetNameDef] wird entscheidend für die Sicherung unserer östlichen Flanke sein. Sobald [POL.GetNameDef] aus dem Weg geräumt ist, wird unser Osten sicher sein, so dass wir uns auf andere Teile der Kampagne konzentrieren können."
GER_unholy_alliance_tt_1:0		"Dies wird die §H[ROOT.GetFactionName]§! auflösen und die §HBerlin-Moskau-Achse§! schaffen."
GER_unholy_alliance_tt_2:0		"Damit wird die §HBerlin-Moskau-Achse§! geschaffen."
GER_poland_friend_r56:0		"Sich mit [POL.GetNameDef] anfreunden"
GER_poland_friend_r56_desc:0		"Viele Menschen in unserer Regierung sehen [POL.getNameDef] als direkten Feind und ideologischen Gegner des derzeitigen [GER.getAdjective] Staates. Angesichts der zunehmenden Spannungen auf der ganzen Welt wäre es vielleicht für das größere Wohl, das Kriegsbeil zu begraben und gemeinsam in eine erfolgreiche Zukunft zu blicken. Natürlich nur unter den richtigen Umständen."
GER_war_with_poland:0		"Krieg mit [POL.GetNameDef]"
GER_war_with_poland_desc:0		"Die [POL.GetAdjective] haben sich uns gegenüber in letzter Zeit sehr feindselig verhalten. Sie haben unsere Grenze überschritten und unser Volk mehrfach angegriffen! Wir müssen einen Verteidigungskrieg gegen die [POL.GetAdjective] führen! Zumindest ist das die Geschichte."
GER_romania_friend:0		"Freundschaft mit [ROM.GetNameDef]"
GER_romania_friend_desc:0		"[ROM.GetNameDef] als Verbündeten zu haben, wird dazu dienen, die Aggression von [SOV.GetAdjective] einzudämmen und uns neuen militärischen Auftrieb zu geben."
GER_romania_war:0		"Krieg mit [ROM.GetNameDef]"
GER_romania_war_desc:0		"Wir müssen [ROM.GetNameDef] sichern; es ist unberechenbar und könnte leicht zu einer Angriffsroute für unsere Feinde im Süden und Osten werden."
GER_soviet_invasion:0		"Invasion der [SOV.GetAdjective]"
GER_soviet_invasion_desc:0		"Wir sind seit langem mit den [SOV.GetAdjective]s im Streit um die territoriale Vorherrschaft in Europa; die einzige Möglichkeit, dieser Bedrohung zu begegnen, ist, sie vollständig von der Landkarte zu tilgen."
GER_train_panzergrenadiers:0		"Panzergrenadiere ausbilden"
GER_train_panzergrenadiers_desc:0		"Ein Großteil unserer Standardinfanterie ist nicht gut genug ausgebildet oder ausgerüstet, um mit unserer Panzerung mitzuhalten. Wir sollten einige unserer Divisionen zu Elite-Panzergrenadier-Divisionen aufrüsten, um uns einen weiteren Vorteil gegenüber unseren Gegnern zu verschaffen."
GER_counter_sloped_armor:0		"Gegen schräge Panzerung"
GER_counter_sloped_armor_desc:0		"Schräge Panzer und andere Fortschritte haben einfachere Panzerabwehrwaffen wie Gewehre fast überflüssig gemacht. Wir brauchen stärkere Panzerabwehrwaffen, um die neuesten Panzer zu besiegen."
GER_seige_fortified_towns:0		"Belagern Sie befestigte Städte"
GER_seige_fortified_towns_desc:0		"Die [SOV.GetAdjective]s haben die Verteidigungsanlagen einiger ihrer Städte, wie Leningrad und Moskau, verstärkt. Um diese Städte einzunehmen, müssen wir sie umzingeln und mit so viel Feuerkraft wie möglich bombardieren."
GER_counter_anti_tank:0		"Angriffsgeschütz-Strategie"
GER_counter_anti_tank_desc:0		"Unsere normale Artillerie ist ein bevorzugtes Ziel für den Beschuss durch den Feind. Indem wir unsere Artillerie mobil, gepanzert und vielleicht sogar mit größeren Geschossen ausstatten, können wir die feindlichen Geschütze sowohl im wörtlichen als auch im übertragenen Sinne ausmanövrieren."
GER_encirclement_doctrine_desc:0		"Die [SOV.GetADjective]s haben mehrere Millionen Männer mehr zur Verfügung als wir. Um dem entgegenzuwirken, müssen wir ihre Armeen einkesseln und vernichten, ohne dass sie sich wehren können."
GER_train_marines:0		"Trainieren Sie Seebataillone"
GER_train_marines_desc:0		"Seebataillone verschafft uns einen Vorteil bei Seeinvasionen, indem sie uns Truppen gibt, die darauf spezialisiert sind, an den Küsten unserer Feinde zu landen."
GER_invade_switzerland:0		"Operation Tannenbaum"
GER_invade_switzerland_desc:0		"Die [SWI.GetAdjective] sind eng mit den Deutschen verwandt, so sehr, dass viele ihrer Leute unsere Sprache sprechen. Wir sollten unser Volk wieder zusammenführen und es besser schützen."
GER_the_blitz:0		"Der Blitz"
GER_the_blitz_desc:0		"Der beste Weg, die Moral der [ENG.GetAdjective] zu senken, ist, ihre Städte in Schutt und Asche zu legen; neue Investitionen in Bomber werden unsere Fähigkeit, dies zu tun, verbessern."
GER_turkey_war:0		"Krieg mit [TUR.GetNameDef]"
GER_turkey_war_desc:0		"Die Kontrolle über [TUR.GetNameDef] verschafft uns einen Zugang zum Nahen Osten und Afrika, was für die Sicherung der [ENG.GetAdjective] und [FRA.GetAdjective] Kolonien von entscheidender Bedeutung ist. Darüber hinaus ist die Türkei ein köstliches Nahrungsmittel."
GER_war_with_spain:0		"Krieg mit Spanien"
GER_war_with_spain_desc:0		"Die Sicherung Spaniens wird uns eine taktische Position im Mittelmeer verschaffen, die Sicherung Gibraltars erleichtern und uns einen schnellen Weg nach Afrika eröffnen."
GER_foreign_volunteers:0		"Akzeptieren Sie ausländische Freiwillige"
GER_support_military_research:0		"Unterstützen Sie die militärische Forschung"
GER_support_military_research_desc:0		"Die Technologie wird uns den endgültigen Sieg bringen."
GER_foreign_volunteers_desc:0		"Viele Menschen fremder Nationen stimmen mit unserer Politik und unseren Positionen überein, und zwar so sehr, dass sie bereit sind, für uns zu kämpfen. Auch wenn wir früher nicht offen dafür waren, könnten wir an diesem Punkt des Krieges sicherlich mehr Arbeitskräfte gebrauchen."
GER_political_sphere:0		"Öffnen Sie die [GER.GetAdjective] Politische Sphäre"
GER_political_sphere_desc:0		"Nach der Wahl Hitlers und der Konsolidierung der Macht durch die NSDAP ist es nun an der Zeit, die politische Sphäre für Veränderungen zu öffnen. Entweder wir setzen den Weg des Führers fort, oder wir finden einen neuen Weg, den wir beschreiten können."
GER_kill_hitler:0		"Schaffen Sie Hitler ab"
GER_kill_hitler_desc:0		"Hitler ist nun schon seit einigen Jahren das Aushängeschild Deutschlands und seiner Politik. Der deutliche Mangel an starken Nachfolgern in der NSDAP macht ihn zu einem Hauptziel für jeden, der den deutschen Faschismus stoppen will."
GER_political_turmoil:0		"Profitieren Sie von den politischen Turbulenzen"
GER_political_turmoil_desc:0		"Jetzt, da Hitler tot ist, wird es viel einfacher sein, das Feuer der Instabilität in [GER.GetNameDef] zu schüren."
GER_denounce_versailles:0		"Denunzieren Sie den Versailler Vertrag"
GER_denounce_versailles_desc:0		"Eine offizielle Kündigung des Versailler Vertrages wird unsere politische Position gegenüber der Welt deutlich machen und in der Zivilbevölkerung für unsere Sache werben."
GER_military_industrial_complex:0		"Die Militärindustrie ausbauen"
GER_military_industrial_complex_desc:0		"Der Einsatz einer auf Auftragnehmern basierenden Militärindustrie und großer Mengen an staatlichen Mitteln wird unseren industriellen Komplex auf ein neues Niveau heben."
GER_restore_weimar:0		"Wiederherstellung der Weimarer Regierung"
GER_restore_weimar_desc:0		"Das demokratische System der Weimarer Regierung war der beste Weg, um den deutschen Staat zu verwalten; Hitlers Aufstieg zur Macht hat den friedlichen Weg Deutschlands gestört. Wir sollten den Schaden, den Hitler angerichtet hat, rückgängig machen, bevor es zu spät ist."
GER_establish_bundesrepublik:0		"Errichten Sie die Bundesrepublik"
GER_establish_bundesrepublik_desc:0		"Die öffentliche Unterstützung für eine neue demokratische Regierung hat rapide zugenommen; mit dieser neuen öffentlichen Gunst ist es an der Zeit, eine Gegenrevolution gegen die Faschisten durchzuführen."
GER_post_fascism_recovery:0		"Erholen Sie sich vom Faschismus"
GER_post_fascism_recovery_desc:0		"Die Jahre des Faschismus, die wir erlebt haben, haben der Wirtschaft und unserer Kultur erheblichen Schaden zugefügt; wir müssen mit öffentlichen Initiativen beginnen, um diese Schäden rückgängig zu machen."
GER_marshall_plan:0		"Stärken Sie die amerikanischen Bindungen"
GER_marshall_plan_desc:0		"Finanzielle Unterstützung aus dem Westen, insbesondere [USA.GetNameDef], wird Wunder für unsere Wirtschaft und unsere Erholung vom Faschismus bewirken und die Anfälligkeit unseres Volkes für den Kommunismus verringern."
GER_replace_reichsmark:0		"Ersetzen Sie die Reichsmark"
GER_replace_reichsmark_desc:0		"Das Chaos nach Hitlers Tod und die demokratische Gegenrevolution haben zu einer massiven Inflation der Reichsmark geführt. Um dem entgegenzuwirken, sollten wir die Reichsmark durch eine neue Währung ersetzen."
GER_economic_miracle:0		"Das [GER.GetAdjective] Wirtschaftswunder"
GER_economic_miracle_desc:0		"Die Kombination aus der Unterstützung durch andere Demokratien und unserem neuen System der freien Marktwirtschaft hat zu einem massiven Aufschwung unserer Wirtschaft geführt."
GER_post_war_economics:0		"Wirtschaft in Friedenszeiten"
GER_post_war_economics_desc:0		"Jetzt, da wir uns nicht mehr in einem kriegsbedingten Wirtschaftszustand befinden, können wir uns auf unsere Zivilisten und deren Wohlstand konzentrieren."
GER_civilian_infrastructure:0		"Zivile Infrastruktur"
GER_civilian_infrastructure_desc:0		"Auf unserem Weg zur Nachkriegswirtschaft werden wir die Infrastruktur verbessern, damit die zivile Industrie und Wirtschaft florieren kann."
GER_establish_bundeswehr:0		"Aufbau der Bundeswehr"
GER_establish_bundeswehr_desc:0		"Obwohl Deutschland nicht mehr faschistisch ist, gibt es immer noch äußere Bedrohungen für unser Land. Wir sollten ein neues Militär, die Bundeswehr, aufbauen, um diese Bedrohungen zu bekämpfen."
GER_defense_and_deterence:0		"Verteidigung und Abschreckung"
GER_defense_and_deterence_desc:0		"Auch bei der Verteidigung gegen äußere Bedrohungen sollten wir eine Politik der Verteidigung und Abschreckung verfolgen, die die Sicherheit unseres Landes und unserer Bevölkerung gewährleistet."
GER_western_science_funding:0		"Wissenschaftsförderung aus dem Westen"
GER_western_science_funding_desc:0		"Als Erweiterung der bisherigen Unterstützung können uns die westlichen Demokratien auch Mittel für unsere Wissenschaften zur Verfügung stellen."
GER_repeal_reichstag_fire_decree:0		"Aufhebung des Reichstagsbranddekrets"
GER_repeal_reichstag_fire_decree_desc:0		"Die Reichstagsbrandverordnung, ein Gesetz, das im Wesentlichen den Kommunismus verbietet, sollte aufgehoben werden, damit unsere von Natur aus linken Menschen ihre Interessen zum Wohle des Landes zum Ausdruck bringen können."
GER_fuse_the_parties:0		"Die Parteien verschmelzen"
GER_fuse_the_parties_desc:0		"Die letzten Jahrzehnte haben uns gezeigt, dass ein Kaiser unsere Nation nicht zusammenhalten kann und dass wir einer Republik nicht zutrauen können, das Land stabil zu halten, was nur eine Option übrig lässt: eine starke Koalition von [GER.getAdjective] linken Parteien. Es ist an der Zeit, sich zusammenzuschließen und endlich das Deutschland zu schaffen, das schon immer so sein sollte."
GER_alliance_with_soviets:0		"Gründung der Cominform"
GER_alliance_with_soviets_desc:0		"[SOV.GetNameDefCap] ist die stärkste kommunistische Macht der Welt; ein Bündnis mit ihr würde eine neue Weltsupermacht schaffen."
GER_world_revolution:0		"Etablieren Sie [GER.GetAdjectiveCap] Sozialismus"
GER_world_revolution_desc:0		"Die [SOV.GetAdjective] sind zwar mächtig, aber ihre Form des Sozialismus ist korrupt und kontraproduktiv für den Zweck des Kommunismus. Wir müssen der Welt zeigen, wie man eine richtige Form des Kommunismus einführt, eine, bei der das Volk im Mittelpunkt steht."
GER_spread_the_revolution:0		"Verbreiten Sie die Revolution"
GER_spread_the_revolution_desc:0		"Wenn wir in der Zukunft überleben wollen, ist es von größter Bedeutung, dass wir uns mit Freunden und nicht mit Feinden umgeben. Dies können wir entweder durch geschickte Diplomatie oder durch brutale Gewalt erreichen; so oder so muss die Revolution weiterleben!"
GER_increase_influence_over_balkans:0		"Mehr Einfluss auf den Balkan"
GER_increase_influence_over_balkans_desc:0		""
GER_increase_influence_over_eastern_europe:0		"Vergrößern Sie Ihren Einfluss in Osteuropa"
GER_increase_influence_over_eastern_europe_desc:0		""
GER_increase_influence_over_benelux:0		"Mehr Einfluss auf die Benelux-Staaten"
GER_increase_influence_over_benelux_desc:0		""
GER_old_nemensis:0		"Unsere alte Nemesis"
GER_old_nemensis_desc:0		""
GER_end_british_imperial_hegemony:0		"Beende [ENG.GetAdjective] Imperiale Hegemonie"
GER_end_british_imperial_hegemony_desc:0		""
GER_focus_on_fascist_threat:0		"Fokus auf die faschistische Bedrohung"
GER_focus_on_fascist_threat_desc:0		"Auch wenn wir die Kapitalisten und Imperialisten auf der ganzen Welt verachten, besteht kein Zweifel daran, dass die Faschisten die größere Bedrohung darstellen. Deshalb müssen wir unsere Differenzen beiseite lassen, um genau das zu zerstören, was unsere Nation so lange niedergehalten hat."
GER_pressure_austria:0		"Druck [AUS.GetNameDef]"
GER_pressure_austria_desc:0		"Wir liegen auf einem anderen faschistischen Tyrannen in unserem Süden. Wenn wir die faschistische Bedrohung in Europa stoppen wollen, müssen wir zuerst unsere deutschsprachigen Landsleute befreien."
GER_decrease_fascist_influence:0		"Den faschistischen Einfluss zurückdrängen"
GER_decrease_fascist_influence_desc:0		"Wir können nicht zulassen, dass sich der Faschismus weiter ausbreitet. Er hat uns und unsere anderen Nationen schon zu lange unterdrückt, wir können nicht zulassen, dass er noch jemandem zustößt."
GER_deal_with_the_devil:0		"Handel mit dem Teufel"
GER_deal_with_the_devil_desc:0		"Obwohl unser historischer Feind und wir in der Vergangenheit viele Differenzen hatten, könnte [FRA.GetNameDef] ein gemeinsames Ziel haben, den Faschismus in Europa auszurotten. Daher könnte es in unserem Interesse sein, unsere Differenzen beiseite zu legen."
GER_the_source_of_fascism:0		"Die Quelle des Faschismus"
GER_the_source_of_fascism_desc:0		"Die Idee des Faschismus selbst stammt aus den Tiefen Italiens. Wenn der Faschismus ein für alle Mal gestoppt werden soll, müssen sie befriedet und befreit werden."
GER_bodenreform_projects:0		"Bodenreform-Projekte"
GER_bodenreform_projects_desc:0		"Die Bodenreformprojekte, die auf den Ideen Adolf Damaschkes beruhen, zielen darauf ab, den Boden zu reformieren, um sicherzustellen, dass die Grundbedürfnisse nach Wohnen und Arbeiten für alle vom Staat erfüllt werden, eines der Hauptelemente einer kommunistischen Gesellschaft."
GER_hanza_steelworks:0		"Hanza Stahlwerk"
GER_hanza_steelworks_desc:0		"Der Stahlbergbau in Hanza wurde in den letzten Jahren lange vernachlässigt. Um sicherzustellen, dass alle unsere Arbeiter Arbeit haben und gleichzeitig Zugang zu dringend benötigten Ressourcen erhalten, müssen wir in diesem Bereich stark investieren."
GER_progress_cult:0		"Fortschrittskult"
GER_progress_cult_desc:0		"Gut ausgebildete und von der Regierung finanzierte Elite-Wissenschaftler geben uns die Möglichkeit, unsere Wissenschaften auf die nächste Stufe zu heben."
GER_soviet_scientists:0		"Importieren Sie [SOV.GetAdjective] Wissenschaftler"
GER_soviet_scientists_desc:0		"Der Import von Wissenschaftlern aus [GER.GetNameDef], ob legal oder nicht, wird unsere wissenschaftlichen Fortschritte noch weiter vorantreiben."
GER_establish_stasi:0		"Errichten Sie die Stasi"
GER_establish_stasi_desc:0		"Um sicherzustellen, dass Konterrevolutionäre unsere Regierung nicht von innen heraus stürzen, brauchen wir eine Behörde, die diese Art von Problemen untersucht."
GER_recruit_grenztruppen:0		"Antifaschistische Freiwillige"
GER_recruit_grenztruppen_desc:0		"Ein immer größerer Teil der Bevölkerung ist bereit, dabei zu helfen, die faschistische Aggression gewaltsam zu stoppen."
GER_rehabilitate_military:0		"Rehabilitieren Sie das Militär"
GER_rehabilitate_military_desc:0		"Die Faschisten haben das deutsche Militär in eine rückständige und korrupte Bürokratie verwandelt, und das müssen wir in unserem neuen Militär rückgängig machen."
GER_establish_NVA:0		"[GetNVAFocusName]"
GER_establish_NVA_desc:0		"Der Aufbau der Nationalen Volksarmee als neues wehrpflichtiges und gut ausgebildetes Militär wird uns einen entscheidenden Vorteil gegenüber unseren Feinden verschaffen."
GER_production_effort:0		"Industrialisierungsbemühungen"
GER_production_effort_desc:0		"Nach dem Schaden, den die vorherige faschistische Regierung an der Industrie angerichtet hat, müssen wir unsere industriellen Kapazitäten ausbauen und den angerichteten Schaden rückgängig machen."
GER_collectivize_industry:0		"Kollektivierung der Industrie"
GER_collectivize_industry_desc:0		"Als Erweiterung unserer Industrialisierungsbemühungen sollten wir unsere Industrien schrittweise kollektivieren, um sicherzustellen, dass sie mit höchster Effizienz arbeiten."
GER_total_war:0		"Totaler Krieg"
GER_total_war_desc:0		"Wollen Sie den totalen Krieg? Wenn nötig, wollen Sie einen Krieg, der totaler und radikaler ist als alles, was wir uns bisher vorstellen können?"
GER_appoint_economic_positions:0		"Wirtschaftliche Positionen besetzen"
GER_appoint_economic_positions_desc:0		"Die einzige Möglichkeit für [GER.GetNameDef], sich vollständig von der Großen Depression zu erholen, besteht darin, für eine geeinte Wirtschaft zu sorgen. Wir können dies durch die Ernennung eines Präsidenten der Reichsbank und eines Wirtschaftsministers erleichtern."
GER_appoint_economic_positions_tooltip:0		"Sie haben die Wahl, einen der folgenden Berater zu ernennen:"
GER_two_side_economics:0		"Zweiseitige Wirtschaft"
GER_two_side_economics_desc:0		"In der [GER.GetAdjective] Regierung gibt es zwei Gruppen, die um die Macht ringen. Auf der einen Seite glauben die Technokraten, dass die Platzierung von Spezialisten an den Schaltstellen der Macht und die Bevorzugung der Industrie gegenüber dem Militär zu einer erfolgreichen Wirtschaft führen wird. Auf der anderen Seite streben die Autarken eine völlig autarke und militärisch mächtige [GER.GetName] an."
GER_support_technocrats_I:0		"Schlagen Sie sich auf die Seite der Technokraten"
GER_support_technocrats_I_desc:0		"Wenn wir eine wirtschaftlich starke [GER.GetName] haben wollen, müssen wir uns auf die Seite der Technokraten stellen."
GER_support_technocrats_II:0		"Geben Sie den Technokraten Sitze in der Regierung"
GER_support_technocrats_II_desc:0		"Wenn wir den Technokraten Sitze in der Regierung geben, können sie ihre Politik effektiver durchsetzen."
GER_exploit_trade_dependence:0		"Handelsabhängigkeiten ausnutzen"
GER_exploit_trade_dependence_desc:0		""
GER_support_autarks_I:0		"Stellen Sie sich auf die Seite der Autokraten"
GER_support_autarks_I_desc:0		"Wenn wir eine wirtschaftlich starke [GER.GetName] haben wollen, müssen wir uns auf die Seite der Autarken stellen."
GER_support_autarks_II:0		"Geben Sie den Autarks Sitze in der Regierung"
GER_support_autarks_II_desc:0		"Wenn Sie den Autarks Sitze in der Regierung geben, können sie ihre Politik effektiver durchsetzen."
GER_jet_research:0		"Jet-Forschung finanzieren"
GER_jet_research_desc:0		"Das Düsentriebwerk wird uns in ein neues Zeitalter der Kriegsführung katapultieren, das es uns ermöglicht, unsere Feinde mit unheimlicher Präzision zu bombardieren und den Himmel über [GER.GetNameDef] zu beherrschen, so sagen es unsere Wissenschaftler."
GER_volksgemeinschaft:0		"Unterstützen Sie die Volksgemeinschaft"
GER_volksgemeinschaft_desc:0		"Die Volksgemeinschaft wird dazu beitragen, die germanischen Völker in Europa und der Welt zu vereinen und zu stärken."
GER_deutsche_arbeitsfront:0		"Die Deutsche Arbeitsfront gründen"
GER_deutsche_arbeitsfront_desc:0		"Die Ersetzung aller [GER.GetAdjective] Arbeitergewerkschaften durch eine von der Regierung kontrollierte Gewerkschaft wird es uns ermöglichen, eine optimale Effizienz im [GER.GetAdjective] industriellen Komplex zu gewährleisten und es einfacher machen, industrielle und wirtschaftliche Reformen durchzuführen."
GER_volkswagen:0		"Volkswagen gründen"
GER_volkswagen_desc:0		"Die Massenproduktion eines 'Volksautos' wird die Moral stärken und eine Reinvestition in die zivile Infrastruktur und Industrie bewirken. Ganz zu schweigen davon, wer mag nicht einen guten Kübelwagen?"
GER_steelworks_issues:0		"Probleme mit den Stahlwerken"
GER_steelworks_issues_desc:0		"Die Vereinigte Stahlwerke AG ist seit langem der wichtigste Stahlproduzent in Deutschland, aber sie ist ein Unternehmen mit wenig staatlicher Aufsicht. Um eine ausreichende Versorgung mit Stahl zu gewährleisten, muss die Regierung in den Abbau strategischer Ressourcen eingreifen, da sie sich darüber hinwegsetzen kann, dass diese zur Unterstützung der Kriegswirtschaft unrentabel sind."
GER_nationalize_resource_industries:0		"Kohleverflüssigung"
GER_nationalize_resource_industries_desc:0		"Deutschland mangelt es an Öl, daher müssen wir unsere Anstrengungen im Bereich des synthetischen Öls verdoppeln."
GER_nationalize_aviation_industry:1		"Standardisierung der Flugzeugproduktion"
GER_nationalize_aviation_industry_desc:1		"Die Standardisierung und Aufteilung der Produktion von Militärflugzeugen auf die verschiedenen Unternehmen wäre entscheidend, um Ineffizienzen in Friedenszeiten zu beseitigen."
GER_reform_uranprojekt:0		"Das Uranprojekt wiederbeleben"
GER_reform_uranprojekt_desc:0		"Das Uranprojekt, auch bekannt als der 'Uranium Club', war nach dem Einmarsch in Polen und der Einberufung von Wissenschaftlern zum Militär im Wesentlichen aufgelöst worden. Die Wiederbelebung dieses Programms durch die Einberufung von Wissenschaftlern aus dem Militär könnte ein lohnendes Unterfangen für unseren wissenschaftlichen Output sein."
GER_rally_the_monarchists:0		"Die Monarchisten versammeln"
GER_rally_the_monarchists_desc:0		"Das Versagen der Weimarer Regierung und die Korruption der NSDAP-Regierung stehen im Gegensatz zu Deutschlands glorreicher imperialer Geschichte. Wir müssen Deutschland zu seinem früheren imperialen Ruhm zurückführen, um unseren Platz als Weltmacht zu sichern."
GER_return_of_conservative_exiles:0		"Rückkehr der konservativen Exilanten"
GER_return_of_conservative_exiles_desc:0		""
GER_return_of_conservative_exiles_tt:0		"Sobald der §YC-Bürgerkrieg§! beginnt:"
GER_contact_ludendorff:0		"Kontaktieren Sie Ludendorff"
GER_contact_ludendorff_desc:0		"Erich Ludendorff, der streng konservative Generalquartiermeister während des Ersten Weltkriegs, ist in den Köpfen der [ROOT.GetAdjective] Bevölkerung nach wie vor ein beliebter Kriegsheld. Es ist zwar bekannt, dass er die NSDAP schon früh stark unterstützt hat, aber in den letzten Jahren hat er sich von der Partei entfernt. Mit ihm auf unserer Seite wird unsere Legitimität erheblich gestärkt."
GER_ludendorff_will_join:0		"§YErich Ludendorff§! wird sich als §YFeldmarschall§! auf unsere Seite schlagen, sobald der §RBürgerkrieg§! beginnt."
GER_a_new_reich:0		"Stürzen Sie die Nazis"
GER_a_new_reich_desc:0		"Nachdem wir die Monarchisten und andere Pro-Kaiser-Parteien um uns geschart haben, ist es nun endlich an der Zeit, die Macht in Deutschland zu übernehmen und das Kaiserreich zu seinem alten Glanz zurückzuführen!"
GER_consolidate_new_reich:0		"Konsolidieren Sie das Kaiserreich"
GER_consolidate_new_reich_desc:0		"Wir haben den Reichstag erobert und haben eine mehr oder weniger provisorische Regierung mit unserem neuen Kaiser an der Spitze. Jetzt müssen wir Deutschland festigen und zum Vierten Reich konsolidieren."
GER_restore_the_empire:0		"Das Reich wiederherstellen"
GER_restore_the_empire_desc:0		"Nach der unglücklichen Niederlage des Zweiten Reiches im Ersten Weltkrieg und der Unterzeichnung des Versailler Vertrags wurden dem Reich viele rechtmäßig deutsche Gebiete entzogen. Wir müssen den langen und mühsamen Prozess der Rückeroberung dieser Gebiete beginnen."
GER_european_claims:0		"Die Rückgabe unserer europäischen Territorien"
GER_european_claims_desc:0		"Zuallererst müssen wir die Kerngebiete des Deutschen Reiches zurückerobern. Am wichtigsten sind die jetzt _[FRA.GetAdjective] Region Elsass-Lothringen und die [POL.GetAdjective] Stadt Danzig."
GER_african_claims:0		"Die Wiederherstellung unserer afrikanischen Kolonien"
GER_african_claims_desc:0		"Die [ENG.GetAdjective] und [FRA.GetAdjective] nutzten den Versailler Vertrag, um ihre Konsolidierung des Einflusses über afrikanische Nationen und Kolonien zu rechtfertigen, was die Korruption dieser westlichen Imperialisten zeigt. Die Rückeroberung dieser Kolonien wird die Macht von [GER.GetAdjective] in der Region wiederherstellen und ein wesentliches Gegengewicht zum Expansionismus von [ENG.GetAdjective] und [FRA.GetAdjective] bilden."
GER_fufill_the_clay_of_mittelafrika:0		"Erfüllen Sie den Lehm von Mittelafrika"
GER_fufill_the_clay_of_mittelafrika_desc:0		"Viel zu lange hat [ROOT.GetNameDef] von einer großen afrikanischen Kolonie geträumt, die sich von [CHA.GetNonIdeologyName] bis [ZAM.GetNonIdeologyName] erstreckt und 'Mittelafrika' genannt wird. Es ist nun an der Zeit, diesen Traum zu verwirklichen und unseren Platz als etablierte Kolonialmacht zu festigen."
GER_asian_claims:0		"Die Wiederherstellung unserer asiatischen Kolonien"
GER_asian_claims_desc:0		"Wie Afrika haben auch die ehemaligen Verbündeten den Versailler Vertrag benutzt, um ihre imperialistischen Tendenzen und den Diebstahl am deutschen Volk zu rechtfertigen. Jetzt müssen wir uns auf den langen Weg der Wiederherstellung unserer ehemaligen Kolonien in Asien und im Pazifik machen."
GER_interest_in_the_carribean:0		"Interesse an der Karibik"
GER_interest_in_the_carribean_desc:0		"Unsere Seestreitkräfte haben schon immer die Möglichkeit geprüft, Stützpunkte auf den karibischen Inseln zu errichten, dachten aber, dass dies von Otto von Bismarck selbst blockiert würde. Jetzt, da er uns nicht mehr im Wege steht, können wir diese Ambitionen endlich zu Ende führen."
GER_restore_klein_venedig:0		"Klein-Venedig wiederherstellen"
GER_restore_klein_venedig_desc:0		"Klein-Venedig war das bedeutendste Gebiet der [GER.GetAdjective] Kolonisierung Amerikas, bis es uns von den Kolonialmächten der Vergangenheit geraubt wurde. Jetzt ist es an der Zeit, dass wir unsere Ansprüche zurückerobern und uns mit unseren [GER.GetAdjective] im Süden wieder vereinen!"
GER_establish_imperial_german_army:0		"Das Deutsche Heer wiederaufbauen"
GER_establish_imperial_german_army_desc:0		"Die Wiederbelebung des Deutschen Heeres nach dem Vorbild der Nazi-Wehrmacht wird dem Vierten Reich zweifelsohne eine der stärksten und effektivsten Kampftruppen der Welt bescheren."
GER_support_landwehr:0		"Unterstützen Sie die Landwehr"
GER_support_landwehr_desc:0		"Die Unterstützung der Landwehr wird uns eine professionellere und effektivere Armee sichern und gleichzeitig ihre Größe verringern."
GER_galvanize_german_militarism:0		"Galvanisieren Sie [GER.GetAdjective] Militarismus"
GER_galvanize_german_militarism_desc:0		"Der Militarismus in [GER.GetNameDef] ist ein entscheidender Teil unserer nationalen Identität und unserer Stellung als Nation. Es ist nur natürlich, dass wir dies nutzen, um uns Mut zu machen."
GER_support_freikorps:0		"Unterstützen Sie die Freikorps"
GER_support_freikorps_desc:0		"Durch die Unterstützung der Freikorps erhält unser Militär eine breitere Unterstützung, wodurch es leichter wird, Zivilisten zu rekrutieren. Allerdings wird es dadurch unweigerlich schwieriger, professionelle Standards aufrechtzuerhalten."
GER_support_freikorps_tt:0		"3 §YFreikorps-Divisionen§! werden sich uns anschließen, sobald der §YBürgerkrieg§! beginnt."
GER_gott_mit_uns:0		"Gott Mit Uns"
GER_gott_mit_uns_desc:0		"Ein imperialer Wahlspruch, der Ausdruck [ROOT.GetAdjective] religiöser, politischer und ethnischer Zielstrebigkeit ist. Die Einheit von Altar, Thron und Volk."
GER_alliance_with_austria_hungary:0		"Bündnis mit Österreich-Ungarn"
GER_alliance_with_austria_hungary_desc:0		"Wir müssen das große Bündnis, das uns mit den Habsburgern verband, wiederherstellen."
GER_alliance_with_the_ottomans:0		"Bündnis mit dem Osmanischen Reich"
GER_alliance_with_the_ottomans_desc:0		"Wie wir sind auch die Osmanen am Ende des Weltkriegs von der Entente schlecht behandelt worden. Es ist an der Zeit, unseren Platz in der Welt gemeinsam wiederherzustellen."
GER_draft_new_constitution:0		"Entwerfen Sie eine neue Verfassung"
GER_draft_new_constitution_desc:0		"Um die nationale Einheit zu gewährleisten und zu verhindern, dass Extremisten die Macht übernehmen, müssen wir sicherstellen, dass unsere Monarchie verfassungsmäßig und demokratisch rechenschaftspflichtig ist. Nur dann wird das Vierte Reich zu einem Leuchtturm werden, an dem sich der Rest der Welt orientieren kann."
GER_prioritize_infrastructure:0		"Priorisieren Sie die Infrastruktur"
GER_prioritize_infrastructure_desc:0		"Wenn wir unsere Infrastruktur auf dem neuesten Stand halten, können wir sicherstellen, dass unsere Industriemaschine in allen Bereichen effektiver arbeiten kann."
GER_prioritize_civilian_industry:0		"Zivile Industrien priorisieren"
GER_prioritize_civilian_industry_desc:0		"Die Gewährleistung einer starken zivilen Industrie wird es uns ermöglichen, die Lebensqualität unserer Bevölkerung zu verbessern und einen schnelleren Aufbau in anderen Sektoren zu ermöglichen."
GER_prioritize_military_industry:0		"Militärische Industrien priorisieren"
GER_prioritize_military_industry_desc:0		"Der einzige Weg zu einem starken Militär ist eine starke Unterstützung der Militärindustrie. Eine starke Militärindustrie wird uns neue Möglichkeiten für die militärische Expansion eröffnen."
GER_prioritize_defensive_construction:0		"Priorisieren Sie defensive Bauten"
GER_prioritize_defensive_construction_desc:0		"In diesen turbulenten politischen Zeiten ist [GER.GetNameDefCap] am stärksten von einer feindlichen Invasion von außen bedroht. Um Stabilität und Sicherheit für das Volk von [GER.GetAdjective] zu gewährleisten, müssen wir dem Bau von Verteidigungsanlagen Priorität einräumen."
GER_kaiser_wilhelm_society:0		"Wiederbelebung der Kaiser-Wilhelm-Gesellschaft"
GER_kaiser_wilhelm_society_desc:0		"Zwischen der Wehrpflicht und den antijüdischen Nürnberger Gesetzen ist die wissenschaftliche Basis der [GER.GetNameDef] kaum noch in der Lage, effektive Forschung zu betreiben. Die Wiederbelebung der Kaiser-Wilhelm-Gesellschaft wird es unserer militärischen und zivilen Forschung ermöglichen, zu neuen Höhen aufzusteigen."
GER_return_scientists:0		"Wissenschaftler vom Militärdienst freistellen"
GER_return_scientists_desc:0		"Viele ehemalige Wissenschaftler sind durch die Wehrpflicht oder andere Zwangssysteme zum Militär gekommen. Indem wir sie von diesen Programmen befreien, schränken wir unseren Personalbestand ein, stellen aber sicher, dass unsere Forschung auf dem neuesten Stand ist."
GER_enigma:0		"Verbessern Sie Enigma"
GER_enigma_desc:0		"Die weitere Erforschung der Enigma-Verschlüsselungsmethoden könnte zu erstaunlichen Ergebnissen führen, die es uns ermöglichen, unsere strategische Kommunikation weiter vor dem Feind zu verbergen."
GER_volkssturm:0		"Bilden Sie den Volkssturm"
GER_volkssturm_desc:0		"Obwohl sich der Krieg gegen uns zu wenden beginnt, haben wir immer noch eine Chance, wenn wir uns als [GER.GetAdjective]s zusammenschließen und den Angreifer frontal bekämpfen! Dies ist die letzte Komponente unseres totalen Krieges, und mit dem Volkssturm wird [GER.GetNameDef] niemals besiegt werden!"
GER_iraq_friend:0		"Schließen Sie sich mit [IRQ.GetNameDef] zusammen."
GER_iraq_friend_desc:0		"[IRQ.GetNameDefCap] hat eine vorteilhafte strategische Position im Nahen Osten und einen großen Pool an Ressourcen, die für die Kriegsmaschinerie von [GER.GetAdjective] notwendig sind; sich mit ihrem Land anzufreunden, könnte sich als weise Entscheidung erweisen, die uns nicht dazu zwingen wird, unser Militär an eine andere Front zu verlegen."
GER_iraq_war:0		"Invasion von [IRQ.GetNameDef]"
GER_iraq_war_desc:0		"[IRQ.GetNameDefCap] hat eine vorteilhafte strategische Position im Nahen Osten und ein großes Reservoir an Ressourcen, die für die Kriegsmaschinerie von [GER.GetAdjective] notwendig sind; die Invasion ihres Landes wird es uns ermöglichen, diese kritische Position zu halten und ihre Ressourcen voll auszuschöpfen."
GER_iran_friend:0		"Befreit [PER.GetNameDef]"
GER_iran_friend_desc:0		"[PER.GetNameDefCap] hat eine große Grenze mit [SOV.GetNameDef] und eine sehr strategische Position als Tor nach Asien; sich mit ihrem Land anzufreunden wird eine fruchtbare Investition sein, die nicht die notwendigen Ressourcen von unserer Hauptkampagne abzieht."
GER_iran_war:0		"Invasion von [PER.GetNameDef]"
GER_iran_war_desc:0		"[PER.GetNameDefCap] hat eine große Grenze mit [SOV.GetNameDef] und eine sehr strategische Position als Tor nach Asien; die Invasion ihres Landes wird es uns ermöglichen, Druck auf den gesamten asiatischen Kontinent auszuüben und uns eine weitere strategische Front in Südrussland zu eröffnen."
GER_influence_brazil:0		"Einfluss [BRA.GetNameDef]"
GER_influence_brazil_desc:0		"Zusätzlich zu seinen natürlichen Ressourcen hat [BRA.GetNameDef] eine sehr strategische Position in Amerika; einen Verbündeten in der Nähe von verwundbaren südamerikanischen Ländern zu haben und in Schlagdistanz zu [USA.GetNameDef] zu sein, ist eine Überlegung wert."
GER_revive_brest_litovsk:0		"Beleben Sie den Vertrag von Brest-Litowsk wieder"
GER_revive_brest_litovsk_desc:0		"Im Moment ist unser Krieg mit den [SOV.GetAdjective]s erfolgreich, aber unser Militär wird an anderen Fronten gebraucht. Die Wiederbelebung des Vertrages von Brest-Litowsk wird es uns ermöglichen, Frieden mit den [SOV.GetAdjective]s zu schließen und unsere gewünschten Gebietsgewinne zu erzielen."
GER_5_factor:0		"5-Faktor-Rätsel"
GER_5_factor_desc:0		"Die Umstellung auf 5 Faktoren wird unsere Verschlüsselung erheblich verbessern."
GER_8_factor:0		"8-Faktor-Enigma"
GER_8_factor_desc:0		"Die Erhöhung auf 8 Faktoren wird unsere Verschlüsselung mit Sicherheit unknackbar machen!"
GER_demand_northern_schleswig:0		"Verlangen Sie Nordschleswig"
GER_demand_northern_schleswig_desc:0		"Nordschleswig wurde uns genommen und im Vertrag von Versailles an die Dänen übergeben. Wir müssen die Rückgabe dieses Landes fordern!"
GER_resolve_the_balkan_flank:0		"Lösen Sie die Balkanflanke"
GER_resolve_the_balkan_flank_desc:0		"Es ist eine Sache, sich um [ITA.getnamedef] in unserem Süden zu sorgen. Es ist eine andere, sich mit [YUG.getnamedef] unberechenbarer Außenpolitik herumzuschlagen, die noch dazu kommt. Es ist an der Zeit, sie auf unsere Seite zu ziehen, dauerhaft."
GER_emphasize_mine_warfare:0		"Betonen Sie die Minenkriegsführung"
GER_emphasize_mine_warfare_desc:0		"Die ausgedehnten Küsten unserer Nation sind ohne eine riesige Überwasserflotte extrem schwer zu verteidigen. Vor kurzem hat unsere Abteilung für Marine-Innovation und -Entwicklung einen aufregenden Vorschlag unterbreitet, der staatliche Investitionen in die Minenabwehrtechnologie vorsieht, die es uns ermöglichen wird, mehr Küsten zu sichern, ohne unsere knappen Seestreitkräfte zu teilen."
GER_ally_greece_vanilla:0		"Verbündeter [GRE.GetNameDef]"
GER_ally_greece_vanilla_desc:0		"Angesichts unseres wachsenden Einflusses in der Region ist es von entscheidender Bedeutung, dass wir uns die Loyalität eines prominenten Akteurs im Süden sichern. Ihre Unterstützung wird entscheidend sein, um Druck auf die Großmächte im Nahen Osten auszuüben und der Kriegsmarine zu ermöglichen, in der Ägäis und im Schwarzen Meer freier zu operieren."
GER_air_innovation_3:0		"Verstärken Sie die Luftwaffe"
GER_air_innovation_3_desc:0		"Unsere tapferen Asse und professionellen Mechanikerteams werden zusätzliche Unterstützung erhalten und ihre Zusammenarbeit mit unseren Forschungskonglomeraten verstärken, um sicherzustellen, dass unsere Taktik und Ausrüstung auf dem neuesten Stand sind."
GER_extra_tech_slot:0		"Die Finanzierung von Wissenschaftlern ausbauen"
GER_extra_tech_slot_desc:0		"Wir können unser derzeitiges Forschungsnetzwerk erheblich ausbauen, um den wachsenden Anforderungen unserer Wirtschaft und Politik gerecht zu werden. Wir werden junge Männer und Frauen ermutigen, sich den neuen Einrichtungen in unserer wohlhabenden Nation anzuschließen."
GER_train_colonial_troops:0		"Koloniale Truppen ausbilden"
GER_train_colonial_troops_desc:0		"Koloniale Spezialisten müssen ausgebildet werden, um unsere überseeischen Besitztümer zu sichern."
GER_the_breitspurbahn:0		"Die Breitspurbahn"
GER_the_breitspurbahn_desc:0		"Schon bald wird ein gigantisches Netz von Eisenbahnen ganz Europa überziehen und die [GER.GetAdjective] Hegemonie festigen."
GER_the_breitspurbah_railways_tt:0		"Bauen Sie eine ebene §Y1§! Eisenbahn von §YBerlin§! zur §YHauptstadt jedes auf dem Landweg erreichbaren Subjekt§!."
GER_the_anglo_german_naval_agreement:0		"Das deutsch-britische Flottenabkommen"
GER_the_anglo_german_naval_agreement_desc:0		"Im Juni 1935 unterzeichneten wir das deutsch-britische Flottenabkommen, das den Aufbau einer begrenzten Flotte erlaubte. Es ist an der Zeit, dass wir uns das Abkommen noch einmal ansehen..."
GER_adhere_to_the_agreement:0		"Halten Sie sich an das Abkommen"
GER_adhere_to_the_agreement_desc:0		"Es ist das Beste für uns, die Briten nicht zu verärgern. Wenn ein Krieg in Europa ausbricht, können wir es uns nicht leisten, sie auf die Probe zu stellen, da wir mit Sicherheit nur unter eine weitere Blockade geraten würden. Wenn wir uns an das Abkommen halten, können wir unsere Ressourcen auf andere Bereiche konzentrieren."
GER_denounce_the_agreement:0		"Denunzieren Sie das Abkommen"
GER_denounce_the_agreement_desc:0		"Es bestand kein Zweifel daran, dass wir nicht die Absicht hatten, den von Großbritannien geforderten Status quo beizubehalten. Deutschland wird sich in seinen Ambitionen nicht einschränken lassen!"
GER_scale_down_naval_projects:0		"Verkleinerung der Marineprojekte"
GER_scale_down_naval_projects_desc:0		"Durch die Ankündigung, die Marineprojekte in großem Umfang zu reduzieren, werden mehr Ressourcen für den Industriesektor zur Verfügung stehen, so dass wir uns auf unsere europäischen Pläne konzentrieren können, anstatt Blut, Schweiß und Stahl in zerbrechliche Schiffe zu stecken."
GER_reopen_wilhelmshaven_shipyards:0		"Wiedereröffnung der Wilhelmshavener Werften"
GER_reopen_wilhelmshaven_shipyards_desc:0		"Die Wilhelmshavener Werften wurden nach dem Ersten Weltkrieg geschlossen, aber vielleicht ist es an der Zeit, sie wieder zu eröffnen, um mehr Konvoi-Projekte zu ermöglichen."
GER_expand_blohm_voss_shipyards:0		"Die Werften von Blohm+Voss ausbauen"
GER_expand_blohm_voss_shipyards_desc:0		"Blohm+Voss haben sich als fähige Schiffsbauer erwiesen. Eine kleine Investition der Regierung würde sicherlich sicherstellen, dass ihre Fähigkeiten voll ausgeschöpft werden."
GER_naval_plan_z:0		"Flottenplan Z"
GER_naval_plan_z_desc:0		"Das Deutsche Reich hatte einst eine der besten Marinen der Welt. Der Große Krieg änderte dies und der Vertrag von Versailles verhinderte seine Wiedergeburt. Aber mit Plan Z werden wir wieder eine Marine haben, die es sogar mit den Briten aufnehmen kann."
GER_naval_aviation_patrols:0		"Patrouillen der Marinefliegerei"
GER_naval_aviation_patrols_desc:0		"Anstatt die Schifffahrt zum Schutz unserer Küsten einzusetzen, können wir uns auf die Verbesserung unserer Marinefliegerei konzentrieren, so dass unsere Luftwaffe stattdessen als Abschreckung dient. Schließlich ist ein Flugzeug billiger als ein Schiff."
GER_simplify_convoy_construction:0		"Vereinfachen Sie den Bau von Konvois"
GER_simplify_convoy_construction_desc:0		"Indem wir die Anzahl der Annehmlichkeiten an Bord unserer Konvoischiffe reduzieren und sie standardisieren, können wir mehr Konvois produzieren, die unseren Handel leichter abwickeln."
GER_the_bismarck_class:0		"Die Bismarck-Klasse"
GER_the_bismarck_class_desc:0		"Nach dem Großen Krieg haben sich unsere ehemaligen Feinde mit noch mehr Verträgen gebunden, die ihre Schiffe in der Größe beschränken. Wir sind nicht an diese Beschränkungen gebunden und wissen daher, was wir brauchen, um sie zu übertreffen."
GER_fortify_the_coast:0		"Befestigen Sie die Küste"
GER_fortify_the_coast_desc:0		"Durch die Errichtung von Küstenbefestigungen und Luftabwehranlagen entlang der Nordseeküste stellen wir sicher, dass jeder, der versucht, an Land zu gehen, auf erbitterten Widerstand stößt, sei es zu Wasser oder in der Luft."
GER_emergency_naval_program:0		"Notfallprogramm der Marine"
GER_emergency_naval_program_desc:0		"Der Krieg ist nach Deutschland gekommen, und was wir gehofft hatten, reicht nicht aus, um uns zu schützen. Wir müssen das Abkommen aufgeben, und da wir keine große Überwasserflotte bauen können, muss eine U-Boot-Flotte ausreichen."
GER_the_o_class:0		"Die O-Klasse"
GER_the_o_class_desc:0		"Auch wenn die Bismarck und die Tirpitz die Krönung unserer Atlantikflotte sein werden, müssen sie von fähigen Schiffen begleitet werden. Die O-Klasse wurde entwickelt, um sie zu ergänzen, und zusammen werden sie den Kern unserer Flotte bilden."
GER_abandon_plan_z:0		"Plan Z aufgeben"
GER_abandon_plan_z_desc:0		"Unter den derzeitigen Umständen können wir es uns nicht leisten, Plan Z aufrechtzuerhalten. Die Schiffe sind zu teuer und brauchen viel zu lange für das, was wir zu erreichen versuchen. Wenn wir uns auf eine Unterwasserflotte konzentrieren, werden wir immer noch in der Lage sein, den Atlantik zu dominieren."
GER_rule_the_naval_skies:0		"Beherrschen Sie den Seeluft-Himmel"
GER_rule_the_naval_skies_desc:0		"Der Große Krieg hat bewiesen, dass die Luftfahrt das nächste Schlachtfeld ist, das es zu beherrschen gilt, und auch auf See ist das der Fall. Wir müssen dafür sorgen, dass unsere Großkampfschiffe die erforderliche Eskorte haben, selbst wenn sie in der Luft sind."
GER_scout_cruisers:0		"Aufklärungskreuzer"
GER_scout_cruisers_desc:0		"Während die Hauptkampfflotte mehr als in der Lage ist, Konvois, Kreuzer und Schlachtschiffe gleichermaßen zu versenken, brauchen wir etwas, das effektiv feindliche Konvois aufspüren und versenken kann, während es sich einem Gefecht entzieht."
GER_the_m_class:0		"Die M-Klasse"
GER_the_m_class_desc:0		"Im Gegensatz zu den Aufklärungskreuzern wird die M-Klasse die Hauptkampfflotte begleiten und einen Verteidigungsschirm für die Schlachtschiffe bilden und sich mit anderen Kreuzern und Zerstörern befassen, die versuchen könnten, uns in die Schranken zu weisen."
GER_trade_route_interdiction:0		"Überwachung der Handelswege"
GER_trade_route_interdiction_desc:0		"Die unsichtbare Klinge ist die tödlichste. Wenn wir unter der Oberfläche zuschlagen, können wir einen Konvoi nach dem anderen versenken und unseren Feinden den Nachschub und die Verstärkung entziehen."
GER_modular_submarine_construction:0		"Modularer U-Boot-Bau"
GER_modular_submarine_construction_desc:0		"Durch die Vereinfachung der Konstruktion unserer U-Boote werden wir in der Lage sein, mehr von ihnen in kürzerer Zeit zu bauen. So können wir die lautlosen Jäger ungestraft über den Atlantik ausschwärmen lassen."
GER_the_h_class:0		"Die H-Klasse"
GER_the_h_class_desc:0		"Als nächster Schritt in der Entwicklung der Bismarck-Klasse muss die H-Klasse in der Lage sein, die deutsche Stärke nicht nur auf den Atlantik zu projizieren, sondern über ihn hinweg!"
GER_reach_across_the_atlantic:0		"Reichweite über den Atlantik"
GER_reach_across_the_atlantic_desc:0		"Die Zeit ist reif für deutsche Kriegsschiffe, die den Atlantik überqueren und ihre Stärke demonstrieren, um die amerikanische und britische Flotte in ihren Schatten zu stellen."
GER_general_staff:0		"Generalstab"
GER_general_staff_desc:0		"Der [ROOT.GetAdjective] Generalstab war für die kontinuierliche Untersuchung aller Aspekte des Krieges verantwortlich, einschließlich der Ausarbeitung und Überprüfung von Mobilisierungs- oder Feldzugsplänen. Dies trug zu einem höheren Organisationsgrad in der Armee bei."
