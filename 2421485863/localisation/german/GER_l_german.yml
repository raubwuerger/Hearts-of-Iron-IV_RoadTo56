GER_state_of_the_union:	"Lage der [GER_cvu_scripted_name]"
GER_state_of_the_union_desc:	" Die [GER_cvu_scripted_name] ist eine recht instabile Partei, wenn man bedenkt, dass sie aus dem Zusammenschluss der §gDNVP§! und der §2Zentrum§! hervorgegangen ist und diese Spaltung vollständig fortsetzt, oftmals eher wie zwei getrennte Parteien als wie eine einzige agiert, wobei jede danach strebt, die Vereinigung zu kontrollieren, und bereit ist, sich abzuspalten, sollte sich herausstellen, dass die Vereinigung mehr Schaden als Nutzen bringt.\n\nDie derzeitige Stabilität der Vereinigung beträgt: §Y[?DVU_stability]§!, wobei die Partei zusammenbrechen würde, sollte sie §R0§!\n\nDas derzeitige Gleichgewicht der Machtverhältnisse in der Union ist: §Y[?DVU_bop]§!, wobei negative Zahlen die Kontrolle durch §gDNVP§! und positive Zahlen die Kontrolle durch §2Zentrum§! darstellen."
