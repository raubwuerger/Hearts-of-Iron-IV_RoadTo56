r56.kill_hitler.4.b:0					"Verräter!"
r56.kill_hitler.5.t:0					"Das Kanzleramt durch eine Explosion zerstört!"
r56.kill_hitler.5.desc:0					"Gestern Abend wurde Adolf Hitlers Schreibtisch in der Berliner Reichskanzlei durch einen lauten Knall und eine gewaltige Explosion verwüstet. Die Leibwächter waren machtlos und konnten nur noch die Reste seiner Uniform und das eiserne Kreuz in der rauchenden Asche glänzen sehen.\n\n Wie es weitergeht, bleibt abzuwarten, aber es wird erwartet, dass in den nächsten Stunden ein neuer Führer vereidigt wird."
r56.kill_hitler.5.a:0					"Ein Putsch?"
r56.kill_hitler.5.b:0					"Verräter!"
r56.kill_hitler.6.t:0					"Hitler von Auftragskiller auf dem Obersatlzberg ermordet!"
r56.kill_hitler.6.desc:0					"Ein überraschendes Kommuniqué hat die Gerüchte bestätigt, dass ein Auftragskiller den [GER.GetADjective] Kanzler Adolf Hitler getötet hat, während er sich in seiner Alpenvilla ausruhte. Der Killer wurde von einer einzigen Kugel in den Kopf getroffen, die aus großer Entfernung abgefeuert wurde. Es ist klar, dass der Killer ein sehr geschickter Schütze war, was auf eine gewisse militärische Ausbildung schließen lässt.\n\n Was als nächstes passiert, bleibt abzuwarten, aber es wird erwartet, dass in den nächsten Stunden ein neuer Führer vereidigt wird."
r56.kill_hitler.6.a:0					"Ein Putsch?"
r56.kill_hitler.6.b:0					"Verräter!"
r56.kill_hitler.7.t:0					"Hitler erschossen!"
r56.kill_hitler.7.desc:0					"In [GER.GetNameDef] herrschte heute Chaos, denn mehreren Berichten zufolge wurde Adolf Hitler in seinem vermeintlich sicheren Haus erschossen. Zwar ist noch nicht viel über den Angreifer bekannt, aber es kursieren Gerüchte, dass es sich bei dem Schützen um einen Veteranen des Ersten Weltkriegs und einen Vertreter des eigenen Bataillons des Führers im Jahr 1919 für die Bayerische Räterepublik handelt. Es gibt derzeit keine Hinweise darauf, wo sich der Verantwortliche aufhält oder wie alle Sicherheitsvorkehrungen so mühelos umgangen werden konnten. Das Motiv bleibt ein noch größeres Rätsel.\n\n Was als nächstes passiert, bleibt abzuwarten, aber es wird erwartet, dass in den nächsten Stunden ein neuer Führer vereidigt wird."
r56.kill_hitler.7.a:0					"Ein Putsch?"
r56.kill_hitler.7.b:0					"Verräter!"
r56.kill_hitler.8.t:0					"Der Führer erstochen!"
r56.kill_hitler.8.desc:0					"[GER.GetNameDefCap] ist schockiert über die Nachricht von der Ermordung seines Führers, Adolf Hitler. Offenbar war der deutsche Bundeskanzler einige Stunden lang verschwunden, was in seinem Umfeld für Aufregung sorgte. Nach einem Tag der Nachforschungen wurde seine Leiche schließlich unter einem Treibstofffass in der Nähe eines Öldepots in der Nähe des Berliner Vororts Marzahn entdeckt. Die Leiche des Bundeskanzlers wies deutliche Spuren einer durchdringenden Waffe auf. Der vorläufige Bericht identifizierte sie als eine Art Kampfmesser. Die Leiche wurde dann herumgetragen und schließlich am Fundort versteckt. Natürlich war die Berliner Garnison zwei Tage lang in höchster Alarmbereitschaft und Gerüchte über den möglichen Attentäter begannen zu kursieren, ebenso wie die Frage der Nachfolge zwischen den hohen Tieren der NSDAP."
r56.kill_hitler.8.a:0					"Ein Putsch?"
r56.kill_hitler.8.b:0					"Verräter!"
r56.kill_hitler.9.t:0					"Hitler im Gefecht getötet!"
r56.kill_hitler.9.desc:0					"Beim Rückzug der [SOV.GetAdjective]-Truppen aus Sewastopol wird die Leiche Hitlers in einem Graben neben seinen Kameraden gefunden. Semion Hitler, ein ukrainischer Jude, hatte tapfer gegen die Invasoren gekämpft. Nachdem er im Kampf verwundet worden war, hatte er sich doch wieder seinen Linien angeschlossen. Er zeigte einen Mut, der einen gleichnamigen bayerischen Boten aus dem Ersten Weltkrieg in den Schatten gestellt hätte."
r56.kill_hitler.9.a:0					"Moment, das ist der Falsche!"
r56.kill_hitler.9.b:0					"Nein! Mein Fuhr..."
GER_cede_884_to_HUN:0					"Abtretung von Prekmurje an Ungarn"
GER_cede_853_to_ITA:0					"Abtretung von Ljubljana an Italien"
r56_italy_ljubljana_annexation.1.t:0					"Deutschland zediert Ljubljana"
r56_italy_ljubljana_annexation.1.d:0					"[FROM.GetNameDefCap] hat die Region Ljubljana an uns abgetreten, um unsere freundschaftlichen Beziehungen zu verstärken."
r56_italy_ljubljana_annexation.1.a:0					"Ausgezeichnet."
r56_hungary_prekmurje_annexation.1.t:0					"[From.GetName] Tritt Prekmurje ab"
r56_hungary_prekmurje_annexation.1.d:0					"[FROM.GetNameDefCap] hat die Region Prekmurje an uns abgetreten, um unsere freundschaftlichen Beziehungen zu festigen."
r56_hungary_prekmurje_annexation.1.a:0					"Ausgezeichnet."
PRE_call_other_german_states:0					"Andere deutsche Staaten anrufen"
GER_naval_gunnery_r56:0					"Marinegeschützwesen"
GER_naval_gunnery_r56_desc:0					"Unsere Überwasserflotte wird die größten Geschütze brauchen."
GER_naval_effort_r56:0					"Kündigen Sie den Flottenvertrag"
GER_naval_effort_r56_desc:0					"Der Flottenvertrag von 1935 [ENG.GetAdjective]-[GER.GetAdjective] ist nur ein weiterer Trick, um unsere Nation von ihrer Größe abzuhalten und [ENG.GetNameDef] zu erlauben, uns zu dominieren. Wir dürfen uns nicht länger beugen und unsere Seestärke vernachlässigen."
r56_GER_decision_promote_hans_von_luck:0					"Werben Sie für Hans von Luck"
r56.ger.1.t:0					"Ultimativer Sieg"
r56.ger.1.desc:0					"Unsere Kriegsanstrengungen haben viele Rückschläge erlitten, und unsere Feinde dringen tief in das Zentrum unseres Vaterlandes vor. Obwohl wir stärker sind als unsere Feinde und uns von ihnen unterscheiden, haben wir die Widerstandskraft, großes Leid zu ertragen und weiterzumachen, bis wir den Sieg erringen. Wir werden alle verfügbaren Menschen unserer großen Nation zusammenbringen, um diesen Sieg zu erreichen oder bei dem Versuch unterzugehen."
r56.ger.1.a:0					"Der endgültige Sieg ist in Reichweite. Wir müssen nur weitermachen."
r56_endsieg_idea:0					"Endsieg"
r56_endsieg_idea_desc:0					"Der endgültige Sieg ist zum Greifen nah."
r56_GER_endsieg_tt:0					"§WErstellt§! §YVolkssturm§! §Wund§! §YErsatzheer§! §WEinheiten in§! §Yeinige vollständig kontrollierte Kernstaaten§!"
r56.ger.2.t:0					"Näher am Endsieg"
r56.ger.2.desc:0					"Unser Vaterland schien so gut wie verloren, und trotz all unserer Kämpfe war die Widerstandsfähigkeit des Landes nicht umsonst. Wir haben unsere Feinde aus unserem Heimatland vertrieben und sie in die Schranken gewiesen. Auch wenn der Sieg, für den wir so viel gelitten haben, noch lange nicht erreicht ist, scheint er doch viel näher zu sein."
r56.ger.2.a:0					"Der endgültige Sieg ist näher denn je!"
r56_GER_endsieg_2_tt:0					"§RDisbands§! §YVolkssturm§! §Wand§! §YErsatzheer§! §Einheiten§!"
r56.ger.4.t:0					"Der Tod von Wilhelm III."
r56.ger.4.desc:0					"Kaiser Wilhelm III. ist an Altersschwäche verstorben. Der Thron wurde an seinen Sohn Wilhelm IV. weitergereicht, der die meisten seiner Aufgaben den Politikern überlässt."
r56.ger.4.a:0					"Der König und Kaiser ist tot, lang lebe der König und Kaiser."
r56.ger.6.t:0					"[GER.GetNameDefCap] Schlägt eine Front gegen den Faschismus vor"
r56.ger.6.d:0					"[GER.GetAdjective] Führer [GER.GetLeader] hat uns vorgeschlagen, unsere Differenzen beiseite zu legen und eine gemeinsame Front gegen die drohende 'faschistische Bedrohung' in Europa zu bilden."
r56.ger.6.a:0					"Vereint stehen wir."
r56.ger.6.b:0					"Lieber tot als rot!"
r56.ger.7.t:0					"[GER.GetAdjective] Ultimatum"
r56.ger.7.d:0					"[GER.GetNameDefCap], der unserer Nation offensichtlich völlig feindlich gesinnt ist, hat uns ein striktes Ultimatum gestellt, in dem er unsere sofortige Auslieferung an ihn fordert, um uns vor der 'faschistischen Bedrohung' in Europa zu schützen.\n\n[GER.GetNameDefCap] droht damit, 'uns um jeden Preis zu Fall zu bringen', sollten wir diesen Forderungen nicht nachkommen; obwohl diese Forderungen ungeheuerlich sind, sind wir vielleicht nicht in der Lage, Widerstand zu leisten."
r56.ger.7.a:0					"Wir müssen nachgeben."
r56.ger.7.b:0					"Wir werden uns diesen roten Teufeln nicht ausliefern!"
r56.ger.8.t:0					"[AUS.GetNameDefCap] kapituliert"
r56.ger.8.d:0					"[AUS.GetNameDefCap], dem keine andere Wahl blieb, hat unseren Bedingungen zugestimmt und sich daraufhin vollständig ergeben.\n\nWir haben einen weiteren Sieg gegen die Faschisten errungen."
r56.ger.8.a:0					"Ausgezeichnet."
r56.ger.9.t:0					"[AUS.GetNameDefCap] weigert sich"
r56.ger.9.d:0					"[AUS.GetNameDefCap] hat sich behauptet und unsere Bedingungen zum Schutz vor der faschistischen Bedrohung arrogant abgelehnt.\n\nSie haben sich als ein weiterer Tyrann in Europa erwiesen, und wir müssen sie stürzen, koste es, was es wolle."
r56.ger.9.a:0					"Dann heißt es Krieg."
r56.ger.10.t:0					"[FRA.GetNAmeDefCap] Nimmt unseren Vorschlag an"
r56.ger.10.d:0					"[FRA.GetNAmeDefCap] hat unseren Vorschlag freudig angenommen und zugestimmt, alle feindlichen Beziehungen zwischen unseren beiden Nationen zu beenden, um die faschistische Bedrohung in Europa zu bekämpfen."
r56.ger.10.a:0					"Vereint stehen wir."
r56.ger.11.t:0					"[FRA.GetNameDefCap] lehnt unseren Vorschlag ab"
r56.ger.11.d:0					"[FRA.GetNameDefCap] hat unser Angebot, unsere Differenzen beizulegen, empört abgelehnt. Die feindlichen Beziehungen zu ihnen werden auch angesichts der faschistischen Bedrohung in Europa fortbestehen."
r56.ger.11.a:0					"Arrogante Narren."
r56.ger.15.t:0					"Erster Wiener Preis"
r56.ger.15.d:0					"Die Ungarn waren eines der Völker, die nach dem Ersten Weltkrieg am meisten gelitten haben. Bei der Zerschlagung der Österreichisch-Ungarischen Monarchie waren viele Ungarn auf fremdem Boden gestrandet, weil ihre Vorfahren dort seit Jahrhunderten gelebt hatten. Wir könnten unsere Beziehungen zu [HUN.GetNameDef] erheblich verbessern, wenn wir ihnen einige Gebiete aus [CZE.GetNameDef] zusprechen würden."
r56.ger.15.a:0					"Geben Sie ihnen [664.getName] und [996.getName]!"
r56.ger.15.b:0					"Das Gebiet gehört uns!"
r56.ger.15.c:0					"Die Slowakei verdient es, es zu behalten."
r56.ger.34.t:0					"[FROM.GetName] schlägt Integration vor"
r56.ger.34.d:0					"[FROM.GetNameDefCap] ist ein immer wichtigerer Partner für [ROOT.GetNameDef] geworden und möchte diese Partnerschaft nun durch wirtschaftliche und politische Integration erweitern."
r56.ger.34.a:0					"Eine engere Zusammenarbeit wäre von Vorteil."
r56.ger.34.b:0					"Man kann ihnen nicht trauen."
r56.ger.34.c:0					"Wir müssen ihren Einfluss ausschalten."
r56.ger.35.t:0					"[FROM.GetName] Akzeptiert die Integration"
r56.ger.35.desc:0					"Der Botschafter von [FROM.GetAdjective] hat uns mitgeteilt, dass die Regierung von [FROM.GetNameDef] an unserem Vorschlag einer weiteren Integration interessiert ist. Unsere verstärkten wirtschaftlichen Beziehungen versprechen, einen positiven Einfluss auf unsere beiden Nationen zu haben."
r56.ger.35.a:0					"Erfreulich"
r56.ger.36.t:0					"[FROM.GetName] lehnt Integration ab"
r56.ger.36.desc:0					"Vertreter der Regierung von [FROM.GetAdjective] haben uns mitgeteilt, dass sie nicht beabsichtigen, die in unserem Integrationsvorschlag vorgesehenen Maßnahmen durchzuführen. Obwohl sie uns versichern, dass sie unsere Handelsbeziehungen fortsetzen wollen, weigern sie sich, dass wir unseren politischen Einfluss auf sie ausweiten."
r56.ger.36.a:0					"Da kann man leider nichts machen."
r56.ger.36.b:0					"Wir werden sehen, wie sie ohne uns zurechtkommen."
r56.ger.36.c:0					"Keine Option."
r56.ger.39.t:0					"[FROM.GetName] Stürzt die Regierung"
r56.ger.39.d:0					""
r56.ger.39.a:0					"Ihr Einfluss war überwiegend positiv."
r56.ger.39.b:0					"Wir müssen Widerstand leisten!"
r56.ger.40.t:0					"[FROM.GetAdjective]-unterstützte Kräfte scheitern Coup"
r56.ger.40.d:0					"Die von [FROM.GetAdjective] unterstützten Korporatisten haben heute früh versucht, eine befreundete Regierung zu installieren, wurden aber erfolgreich von der Polizei und den Unterstützern der Regierung gestoppt. Diese extreme Eskalation hat es uns ermöglicht, die prominentesten Unterstützer dieser Bewegung zu beseitigen, aber sie hat immer noch ernste Auswirkungen auf unsere Beziehung zu [GER.GetNameDef]."
r56.ger.40.a:0					""
r56.ger.41.t:0					"[ROOT.GetAdjective]Freundliche Regierung bildet sich in [FROM.GetName]"
r56.ger.42.t:0					"Putsch in [FROM.GetName] verpfuscht"
r56.ger.42.d:0					"Die von [ROOT.GetAdjective] unterstützten Kräfte stießen in [FROM.GetNameDef] auf unerwartet heftigen Widerstand, der zu mehreren Toten führte, als die Polizei paramilitärische Kräfte daran hinderte, Schlüsselpositionen einzunehmen, und zu hochkarätigen Verhaftungen. Es scheint sicher, dass sich diese Gelegenheit nicht noch einmal bieten wird."
r56.ger.42.a:0					"Verbrennen Sie die Beweise"
news.339.title:0					"Alliierte Besatzung Deutschlands."
news.339.desc:0					"Nach dem Ende des Zweiten Weltkriegs in Europa haben die Alliierten die vollständige Kontrolle über Deutschland übernommen und es auf vier Besatzungsnationen aufgeteilt, die [ENG.GetAdjective] und [FRA.GetAdjective] im Westen und die [USA.GetAdjective] und [SOV.GetAdjective] im Osten; wie lange es dauern wird, bis sich diese Länder erholen und entnazifiziert sind, bleibt unbekannt."
news.339.a:0					"Nie wieder."
r56_yalta_occupation_tt:0					"Wenn [FRA.GetNameDef], [ENG.GetNameDef] und [USA.GetNameDef] auf der Konferenz von Jalta anwesend wären, würden sie [GER.GetNameDef] in Besatzungszonen einteilen."
r56_yalta_decisions_available_tt:0					"Es werden Beschlüsse zur Wiederherstellung von Ländern in den Besatzungszonen Deutschlands und Österreichs gefasst."
r56_yalta_decisions_available_2_tt:0					"Es werden Beschlüsse zur Gründung neuer Staaten in Deutschland und Österreich gefasst, wenn diese zu direkten Herrschafts- und Besatzungszonen gemacht werden."
ger.renegotiate_versailles.1.t:0					"[GER.GetNameDefCap] bietet an, den Vertrag von Versailles neu zu verhandeln."
ger.renegotiate_versailles.1.d:0					"[GER.GetNameDefCap] ist mit einem interessanten Angebot an uns herangetreten. Um ein Wiederaufflammen der Feindseligkeiten zwischen unseren beiden Nationen aufgrund der Ereignisse in ihrem Land zu verhindern, haben sie uns angeboten, den Vertrag von Versailles neu zu verhandeln. Das bedeutet, dass [GER.GetAdjective] keine Reparationen mehr zahlen muss und dass [GER.GetNonIdeologyName] kein Territorium mehr besetzt. Im Gegenzug versprechen sie, die ihnen auferlegten Beschränkungen in den Bereichen Luft, Armee und Marine einzuhalten und die Neujustierung der [GER.GetNonIdeologyName] Grenzen anzuerkennen. Allerdings haben sie angeführt, dass wir [GER.GetNameDef] Sicherheitsgarantien geben müssen, damit sie vor ausländischen Bedrohungen geschützt bleiben, obwohl sie kein starkes stehendes Heer haben.\n\n[GER.GetNameDefCap] ist fest davon überzeugt, dass diese Neuverhandlung der einzige Weg ist, um den Frieden in unserer Zeit zu erhalten, aber sollen wir sie beim Wort nehmen?"
ger.renegotiate_versailles.1.a:0					"Um den Frieden in unserer Zeit zu erhalten."
ger.renegotiate_versailles.1.b:0					"Wir haben kein Interesse an den Verträgen von einst."
ger.renegotiate_versailles.2.t:0					"[FROM.GetNameDefCap] erklärt sich bereit, den Vertrag von Versailles neu zu verhandeln."
ger.renegotiate_versailles.2.d:0					"[FROM.GetNameDefCap] hat unser Angebot, den Vertrag von Versailles mit uns neu zu verhandeln, gnädig angenommen und stimmt mit unserer Haltung überein, dass ein solches Vorgehen notwendig ist, um den Frieden in unserer Zeit zu erhalten.\n\nDie Auswirkungen des Vertrages sind nun nachträglich eingetreten, wir werden nicht mehr in der Lage sein, einen großen Teil unserer Streitkräfte zu ultimieren, aber [FROM.GetNameDef] hat sich bereit erklärt, unsere Nation stattdessen gegen ausländische Aggressionen zu verteidigen."
ger.renegotiate_versailles.2.a:					"Frieden in unserer Zeit."
ger.renegotiate_versailles.3.t:0					"[FROM.GetNameDefCap] weigert sich, den Vertrag von Versailles neu zu verhandeln."
ger.renegotiate_versailles.3.d:0					"[FROM.GetNameDefCap] hat unser Angebot, den Vertrag von Versailles mit uns neu zu verhandeln, mit der Begründung abgelehnt, sie hätten kein Interesse daran, einen alten Vertrag neu zu verhandeln. Auch wenn dies im Nachhinein betrachtet eine gute Nachricht ist, wirft es doch die Frage auf, was die wahren Motive von [FROM.GetNameDef] hinter dieser Entscheidung sind."
ger.renegotiate_versailles.3.a:0					"Ein Segen oder ein Fluch?"
ger_abided_by_versailles:0					"An Versailles festhalten"
GER_develop_the_heer:0					"Entwickeln Sie das Heer"
GER_develop_the_heer_desc:0					"Heinz Guderian und andere radikale Theoretiker drängen auf kühne neue Doktrinen, die die Kommunikation, die Identifizierung von Schwerpunkten und die lokale Konzentration von kombinierten Streitkräften betonen. Wenn man ihnen freie Hand lässt, könnte man die Schrecken des Großen Krieges vermeiden."
GER_luftwaffe_innovations:0					"Innovationen der Luftwaffe"
GER_luftwaffe_innovations_desc:0					"Moderne Kriege können nicht ohne die Beherrschung des Luftraums gewonnen werden. Wir müssen alles in unserer Macht Stehende tun, um die Luftwaffe zu entwickeln!"
GER_afghanistan_friend_vanilla:0					"Befreit Afghanistan"
GER_afghanistan_friend_vanilla_desc:0					"Die [AFG.GetName] ist eine sich schnell modernisierende Nation, die in den letzten Jahren eine ständige Beziehung zur [GER.GetAdjective]-Regierung aufgebaut hat. Sollten wir in der Lage sein, sie für unsere Sache zu gewinnen, wird sie als einfacher Weg zum Rest Zentralasiens dienen."
GER_technocrats_idea:0					"Technokratische Industrie"
GER_autarky_idea_standard:0					"Autarke Industrie"
ger_anti_colonial:0					"Antikolonialismus"
ger_anti_colonial2:0					"Antikolonialismus"
GER_protector_of_peace:0					"Beschützer des Friedens"
GER_flak_towers:					"Flakturm-Projekt"
GER_tank_quantity:					"Beschleunigte Panzerproduktion"
GER_tank_quality:					"Hochwertige Panzer"
WIP_flag:0					"Dieser Teil des Baums befindet sich noch in der Entwicklung und kann nur über Konsolenbefehle freigeschaltet werden."
formable_cored_states_tt:0					"Gewinnt §Ycores§! auf §Yall required states§!"
GER_civil_war_tt:0					"Ein §A-Bürgerkrieg§! wird zwischen §9Faschistischen§!, §3Konservativen§! und §tSozialistischen§! Kräften ausbrechen."
GER_help_SOV_revolutionaries:0					"Intervenieren Sie in den sowjetischen Bürgerkrieg"
GER_help_SOV_revolutionaries_desc:0					"Die Unterstützung des revolutionären Kampfes gegen (die Überreste) des stalinistischen Regimes könnte dazu führen, dass die Welt vom Kommunismus gerettet wird!"
GER_inter_communist_fighting_tt:0					"Erlangung von Kriegszielen für die §HEuropäische Opposition§!."
kpd_gets_opposition:0					"§Die Rechte Opposition wird sich bilden.§!"
r56_german_cw_ongoing:0					"[GER.GetNameDefCap] befindet sich in einem Bürgerkrieg."
GER_recruit_officers_com_tt:0					"\nWir werden §HAdvisors§! und §HCommanders§! von der besiegten §HDemocratic§! Seite rekrutieren. Allerdings gibt es noch §Hopposition§! für unsere Sache."
GER_AUS_wont_get_annexed_tt:0					"§Das Ereignis für die Annexion Österreichs, wenn es Ihrer Allianz beitritt, wird blockiert werden."
GER_dem_ITA_pact_tt:0					"§HDemokratisches§! oder §HMonarchistisches Italien§! wird Ihrer Allianz beitreten. Wenn §HItaly§! §HFascist§! und §HYugoslavia§! §HCommunist§! ist, können Sie sie gemeinsam bekämpfen.\n\n"
kill_advisor_tt:					"§Y[THIS.GetName]§! stirbt."
GER_forts_unavailable:					"§N wird keine Festungen bauen lassen, da es entweder entmilitarisiert ist oder nicht unter unserer Kontrolle steht.§!\n"
GER_improved_battleship_hull_research_tt:0					"\nSobald die §Y1940 Heavy Ship Hull§! Technologie erforscht ist:\n"
GER_recruit_officers_com:0					"Besiegte Offiziere rekrutieren"
GER_anti_expansionism:0					"Anti-Expansionspolitik"
GER_anti_expansionism_desc:0					"Indem wir die Expansion mit aggressiven Mitteln anprangern, könnten wir versuchen, regionale Nationen, die dies nicht vorhaben oder selbst bedroht sein könnten, auf unsere Seite zu ziehen."
GER_expansionism_light:0					"Stresemanns Vermächtnis"
GER_expansionism_light_desc:0					"Auch wenn wir es vermeiden sollten, die gleichen Fehler wie die Weimarer Republik zu begehen, ist es unbestreitbar, dass ihre aggressive Verhandlungsführung durch Köpfe wie Gustav Stresemann sie stärker gemacht hätte, wenn es nicht die Große Depression gegeben hätte."
GER_renegotiate_versailles:0					"Versailles neu verhandeln"
GER_renegotiate_versailles_desc:0					"Der Vertrag von Versailles wurde in den letzten zwei Jahrzehnten für die Not der [GER.GetAdjective] Menschen verantwortlich gemacht, aber er ist lediglich das Ergebnis einer schwachen Verhandlungsführung. Wenn wir den Frieden in unserer Zeit sichern wollen, müssen wir lernen, mit denen, die uns den Vertrag auferlegt haben, Kompromisse einzugehen, damit er uns beiden nützt."
GER_legacy_of_gluckliche_zwanziger_jahre:0					"Das Vermächtnis der Glücklichen Zwanziger Jahre"
GER_legacy_of_gluckliche_zwanziger_jahre_desc:0					"Die 'Glücklichen Zwanziger Jahre' waren eine Zeit des großen wirtschaftlichen Aufschwungs und des Wachstums in der Weimarer Republik. Dies zeigte das Potenzial für das Wachstum des [GER.GetAdjective] Volkes unter einem friedlichen demokratischen System. Jetzt, da wir die Mittel dazu haben, können wir dieses Potenzial endlich vollständig ausschöpfen."
GER_german_scientific_haven:0					"[GER.GetAdjective] Wissenschaftlicher Hort"
GER_german_scientific_haven_desc:0					"Die große Abwanderung von Fachkräften hat ein Ende, und das Potenzial der Menschen wird nicht mehr dadurch vergeudet, dass sie in die Armee oder in den Krieg geschickt werden, so dass sie sich voll und ganz auf ihre Ausbildung und ihre Arbeitsmöglichkeiten konzentrieren können. Dieses neu entdeckte Wachstum hat eine große Anzahl neuer Akademiker in unserer Nation hervorgebracht, die einen großen Beitrag zu unserer technologischen Entwicklung als Ganzes leisten werden."
GER_join_allies:0					"Verbünden Sie sich mit den Alliierten"
GER_join_allies_desc:0					"Wenn wir uns mit den Briten verbünden, werden wir in der Lage sein, mit unserer Allianz einen beispiellosen Einfluss auf die Welt auszuüben."
GER_lead_democracies:0					"Führen Sie die kleinen Demokratien an"
GER_lead_democracies_desc:0					"Nur die wiederbelebte [GER.GetAdjective] Nation hat den Willen, der wahre Beschützer Europas zu sein."
GER_lead_communists:0					"Das neue Beispiel des Kommunismus"
GER_lead_communists_desc:0					"[SOV.GetNameDefCap] ist schwach und repräsentiert nicht den wahren Kommunismus! Nur [Root.GetNameDef] kann die Sicherheit und den Wohlstand der europäischen sozialistischen Nationen garantieren."
GER_inter_communist_fighting:0					"Bekämpfen Sie den illegitimen Kommunismus"
GER_inter_communist_fighting_desc:0					"Nationen, in denen die Arbeiter nicht befreit wurden, verstehen nicht, dass es verschiedene kommunistische Ideologien gibt. Wir müssen unsere verteidigen und unsere Position stärken, die bürgerlichen Staaten würden sich nicht einmischen."
GER_anti_colonialism:0					"Anti-imperialistische Haltung"
GER_anti_colonialism_desc:0					"Seit der Eroberung unserer Kolonien hat sich viel verändert, und wir müssen die Kolonisierung als das Übel anerkennen, das sie ist. Außerdem wird uns das bei mehreren aufstrebenden Supermächten einen gewissen Vorteil verschaffen."
GER_ally_benelux:0					"Benelux-Allianz"
GER_ally_benelux_desc:0					"Die Benelux-Länder sind zwar klein, verfügen aber nicht nur über eine hohe Industriekonzentration, sondern verschaffen unserer Allianz auch einen strategischen Zugang zu drei fremden Kontinenten."
GER_western_communist:0					"Den westlichen Kommunismus besiegen"
GER_western_communist_desc:0					"Wenn wir die östliche Bedrohung jemals abwehren wollen, müssen wir zuerst unseren Einflussbereich sichern."
GER_dem_anschluss_prep:0					"Schüren Sie die pro-deutsche Stimmung in Österreich"
GER_dem_anschluss_prep_desc:0					"Die Bürger Österreichs wissen nicht, was sie von ihrer schwachen, unabhängigen Nation halten sollen. Indem wir die bereits vorhandenen Rufe nach einer Wiedervereinigung mit Deutschland schüren, können wir vielleicht ein Referendum erzwingen."
GER_dem_anschluss:0					"Referendum zur Wiedervereinigung"
GER_dem_anschluss_desc:0					""
GER_aus_ally:0					"Brüder in Waffen"
GER_aus_ally_desc:0					"Wir wären gerne mit unseren österreichischen germanischen Brüdern vereint, aber vielleicht ist es effizienter, wenn sie ihre eigenen Angelegenheiten regeln."
GER_dem_italy_attack:0					"Die südliche Bedrohung"
GER_dem_italy_attack_desc:0					"[ITA.GetNameDefCap] stellt eine ernsthafte Bedrohung für unseren Süden dar und wir dürfen nicht zulassen, dass sie uns angreift, wenn wir in einen neuen Konflikt geraten."
GER_request_danzig:0					"Beantragen Sie die Kontrolle über die Freie Stadt"
GER_request_danzig_desc:0					"Angesichts unseres Führungswechsels sollten wir unabhängig von der Loyalität in der Lage sein, die Rückgabe der stark pro-deutschen Stadt Danzig an ihren rechtmäßigen Besitzer zu fordern."
GER_dem_polish_corridor_trade:0					"Oberschlesien für Gdynia"
GER_dem_polish_corridor_trade_desc:0					"Wenn wir es wünschen, könnten wir mit Polen verhandeln, um die Abtrennung unseres Landes in Ostpreußen zu lösen, da wir beide Regionen kontrollieren, die den Besitzer wechseln möchten."
GER_dem_polish_corridor_deal:0					"Litauen für pro-deutsches Territorium"
GER_dem_polish_corridor_deal_desc:0					"Da wir zufällig litauische Gebiete kontrollieren, könnten wir einen Deal mit den Polen aushandeln, die die polnisch-litauische Idee wiederherstellen möchten, im Austausch für die deutsch dominierten Gebiete Gdynia und Katowice."
GER_colonies_for_support:0					"Kolonien zur Unterstützung"
GER_colonies_for_support_desc:0					"Vor allem die Briten könnten bereit sein, einen Teil unseres Kolonialreichs im Austausch für unsere Unterstützung in ihrem aktuellen Konflikt wiederherzustellen. Auch wenn diese nicht ihre wertvollsten sind, würde es eine historische Wiederherstellung bedeuten."
GER_soviet_support:0					"Die Zusammenarbeit mit der [GetRussiansDemonym]"
GER_soviet_support_desc:0					"[SOV.GetNameDefCap] wäre ein guter Partner, um unsere militärische Macht wiederherzustellen."
GER_ally_eastern_europe:0					"Danubische Allianz"
GER_ally_eastern_europe_desc:0					"Trotz des Mangels an industrieller Macht auf dem Balkan, ist ihre Position in Europa zweifellos wichtig."
GER_ally_czechoslovakia:0					"Verbündeter [CZE.GetNameDef]"
GER_ally_czechoslovakia_desc:0					"[CZE.GetNameDefCap] ist nach uns der industrielle Kern Mitteleuropas und sie wären eine großartige Ergänzung für unser Bündnis."
GER_counter_soviet_agression:0					"Gegen [SOV.GetAdjective] Aggression"
GER_counter_soviet_agression_desc:0					"Wir müssen schnell handeln, um der [SOV.GetAdjective]-Bedrohung zu begegnen, indem wir unser Bündnis erweitern und uns auf einen Präventivschlag vorbereiten."
GER_anti_bolshevist_bloc:0					"Mit dem antibolschewistischen Block zusammenarbeiten"
GER_anti_bolshevist_bloc_desc:0					"In den Ländern Osteuropas, die von der Sowjetunion bedroht oder besetzt sind, haben sich antikommunistische Organisationen gebildet, die die Politik beeinflussen und sich dem kommunistischen Einfluss widersetzen. Die Zusammenarbeit mit solchen Organisationen könnte ihre Herkunftsländer davon überzeugen, unsere eigenen ideologischen Differenzen beiseite zu lassen und sich gegen den Kommunismus zu vereinen."
GER_anti_soviet_friend_poland:0					"Laden Sie Polen ein"
GER_anti_soviet_friend_poland_desc:0					"Nur wenige Nationen haben so sehr unter dem versuchten sowjetischen Kolonialismus gelitten wie die [POL.GetAdjective] in ihrem Unabhängigkeitskrieg und der anschließenden Unterdrückung durch Stalin auf sowjetischem Gebiet. Ihre strategische Lage, ihre militärische Stärke und ihre Haltung gegenüber ihrem ehemaligen Unterdrücker sollten sie zu einem hervorragenden Verbündeten machen."
GER_dem_anti_commie_bloc_hungary:0					"Laden Sie Ungarn ein"
GER_dem_anti_commie_bloc_hungary_desc:0					"Ungarn, ob demokratisch oder nicht, teilt unsere antisowjetische Mentalität und könnte an den Vorteilen unseres Schutzes interessiert sein."
GER_dem_italy_alliance:0					"Italienischer Pakt"
GER_dem_italy_alliance_desc:0					"[ITA.GetLeader] ist ein Opportunist und könnte ungeachtet aller ideologischen Differenzen daran interessiert sein, den kommunistischen Einfluss vor seiner Haustür herauszufordern oder zumindest den Einfluss von [ITA.GetAdjective] auszuweiten."
GER_anti_soviet_friend_baltics:0					"Beschützen Sie das Baltikum"
GER_anti_soviet_friend_baltics_desc:0					"Die baltischen Nationen, die von uns bei der Erlangung ihrer Unabhängigkeit unterstützt wurden, könnten an unserer Hilfe bei der Erhaltung ihrer Unabhängigkeit interessiert sein."
GER_anti_soviet_friend_finland:0					"Finnland einladen"
GER_anti_soviet_friend_finland_desc:0					""
GER_realise_ukrainian_statehood:0					"Verwirklichen Sie die ukrainische Staatlichkeit"
GER_realise_ukrainian_statehood_desc:0					"Das ukrainische Volk hat schon einmal tapfer für seine Unabhängigkeit gekämpft, ist aber gescheitert. Befreit von der sowjetischen Unterdrückung können sie es nun unter unserem Schutz erneut versuchen."
GER_realise_belarusian_statehood:0					"Verwirklichen Sie die belarussische Staatlichkeit"
GER_realise_belarusian_statehood_desc:0					"Als eine der Sowjetrepubliken, die am stärksten vom stalinistischen Terror betroffen waren, sollte Weißrussland eines der Hauptziele für die Befreiung sein."
GER_safeguard_neutrality:0					"Neutralität bewahren"
GER_safeguard_neutrality_desc:0					"Vom Zentrum und bald auch vom Zentrum Europas aus hat [Root.GetNameDef] eine einzigartige Position inne, da es tatsächlich in der Lage ist, die Sicherheit seiner neutralen Partner zu garantieren. Und sollte es dennoch zu Konflikten kommen, würden wir zweifellos den Sieg davontragen und nur gestärkt daraus hervorgehen."
GER_cooperate_with_nordics:0					"Mit den Nordics zusammenarbeiten"
GER_cooperate_with_nordics_desc:0					"Seit dem Niedergang der Reiche im Norden und der Unabhängigkeit Finnlands sind diese Nationen traditionell neutral geblieben, aber da die [GetRussiansDemonym] vor ihrer Haustür aggressive Kriege führen, können sie sich nicht weigern, zur europäischen Sicherheit beizutragen."
GER_anti_soviet_war:0					"Bekämpfen Sie die [GetRussiansDemonym]"
GER_anti_soviet_war_desc:0					"Nur [Root.GetNameDef] kann Europa vor [SOV.GetAdjective] Tyrannei retten."
GER_mon_peaceful:0					"Zuverlässigere Verbündete"
GER_mon_peaceful_desc:0					"Wir sind zwar stark, aber wir können es nicht mit der Welt aufnehmen... schon wieder. Wenn wir uns weniger aggressive Partner suchen, können wir unser Reich vielleicht ausbauen, ohne erneut in einen Zweifrontenkrieg zu geraten."
GER_mon_FRA_alliance:0					"Allianz mit dem monarchistischen Frankreich"
GER_mon_FRA_alliance_desc:0					"Da Frankreich und Deutschland in Form von starken Regierungen vereint sind, sollten wir bei der Beherrschung Europas zusammenarbeiten."
GER_alliance_with_gustaf:0					"Bündnis mit Gustaf"
GER_alliance_with_gustaf_desc:0					"König Gustaf von [SWE.GetNonIdeologyName] wird sich sicherlich unserer Lebensweise anschließen, sobald er die Gemeinsamkeiten erkennt, auf denen wir stehen, denn wir sind miteinander verwandt."
GER_sway_spain:0					"Schwenken [SPB.GetNameDef]"
GER_sway_spain_desc:0					"Die Monarchien von [ROOT.GetNonIdeologyName] und [SPR.GetNonIdeologyName] haben eine lange und fruchtbare Geschichte miteinander geteilt, daher ist es nur natürlich, dass wir uns wieder einmal treffen."
GER_destabilize_france:0					"Frankreich destabilisieren"
GER_destabilize_france_desc:0					"Die französische Politik steht am Rande des Chaos, sie braucht nur einen kleinen Anstoß. Vielleicht hätten unsere Kommunisten Lust auf einen Urlaub in Paris?"
GER_mon_allies_alliance:0					"Akzeptieren Sie die britische Vorherrschaft in der Marine"
GER_mon_allies_alliance_desc:0					"Wir haben keine Chance gegen die Flotte des britischen Empires, eine Umleitung unserer Marineproduktion wäre für unsere Bemühungen auf dem europäischen Festland von Vorteil."
GER_mon_anti_commie_france:0					"Vereint gegen den französischen Kommunismus"
GER_mon_anti_commie_france_desc:0					"Während Frankreich, eines der mächtigsten Reiche der Welt, zerfällt, könnten die Briten bereit sein, uns unter die Arme zu greifen, bevor die Situation eskaliert und sich kommunistische Stimmungen in ihrem Reich ausbreiten."
GER_restore_the_central_powers:0					"Die Mittelmächte wiederherstellen"
GER_restore_the_central_powers_desc:0					"Unsere alten Verbündeten, die durch ihre Gebietsverluste gedemütigt wurden, dürften mehr als bereit sein, sich unserer Allianz anzuschließen, wenn wir ihnen die Chance geben, ihre Größe wiederherzustellen."
poland_special_dominion_tt:0					"Wir werden Polen im Tausch gegen unsere früheren Territorien und unseren politischen Einfluss Schutz anbieten und es in eine besondere Art von Herrschaft verwandeln."
intervene_soviet_civil_war_tt:0					"Es gibt eine nicht-kommunistische, antistalinistische Bürgerkriegsseite, die verbündet werden kann."
has_neutrality_idea_tt:0					"Hat eine §Yneutrale Außenpolitik§! Idee."
fascist_neutrality_alliance_tt:0					"Europäische §YFaschistische§! und §YNon-Aligned§! Länder werden weniger zögern, sich [Root.GetNameDef]s demokratischer Allianz anzuschließen."
GER_rhineland_decision_tt:0					"§Wenn Frankreich kommunistisch oder unser Verbündeter wird, werden wir keine weltweiten Spannungen erzeugen."
GER_central_powers_tt:0					"§Alle bündnisfreien, historisch verbündeten Nationen werden in unsere Fraktion eingeladen.§!"
GER_middle_east_diplo_tt:0					"Diese Entscheidungen werden es uns ermöglichen, Einfluss auf die Länder des Nahen und Mittleren Ostens und deren Politik zu nehmen und sie schließlich dazu zu bringen, unserer Fraktion beizutreten."
GER_will_strengthen_right_opposition:0					"§Wir werden die Rechte Opposition stärken§!"
GER_heinrich_brandler_will_lead_country_tt:0					"Wenn §YHeinrich Brandler§! als §YBerater§! angestellt wird, kann er der §YLandesführer§! werden"
GER_remilitarize_rhineland:0					"Remilitarisieren Sie das Rheinland"
not_too_much_soviet_influence_tt:					"Weniger als 4 sowjetische Einflusspunkte"
GER_commie_request_soviet_guns:					"Sowjetische Waffen anfordern"
GER_soviet_industrial_aid:					"Sowjetische Industriehilfe beantragen"
GER_soviet_officers:					"Sowjetische Offiziere einladen"
GER_civil_war_category:					"Ausländische Bürgerkriegsbeteiligung"
GER_soviet_influence_increase_1:					"§_YSowjetische Einflusspunkte §!§Rwird um 1 erhöht, Sie haben derzeit [?GER_commie_soviet_influence|-G0].§!\n"
GER_soviet_influence_increase_2:					"§YSoviet influence points §!§Rwill increase by 2, you currently have [?GER_commie_soviet_influence|-G0].§!\n"
GER_middle_eastern_diplomacy_category:0					"Diplomatie im Nahen Osten"
GER_middle_eastern_diplomacy_category_desc:0					"Angesichts der Kriege, die in Europa toben, und der unklaren Zukunft Deutschlands müssen wir uns bemühen, Unterstützung zu sammeln und die Länder des Nahen Ostens wie Afghanistan und Persien zu erreichen. Sie könnten sich als politisch und strategisch sehr wichtig erweisen, da sie an viele unserer Feinde grenzen und über große Mengen Öl verfügen."
GER_middle_eastern_diplomacy:0					"Diplomatie im Nahen Osten"
GER_pro_german_propaganda:0					"Pro-[GER.GetAdjective] Propaganda"
GER_spread_pro_german_propaganda:0					"Verbreiten Sie Propaganda in [FROM.GetName]"
GER_send_german_advisors:0					"Schicken Sie Militärberater nach [FROM.GetName]"
GER_military_advisors:0					"[GER.GetAdjective] Militärische Berater"
GER_invite_FROM_to_faction:0					"Laden Sie [FROM.GetName] nach [ROOT.GetFactionName] ein"
GER_middle_eastern_diplomacy_desc:0					"Angesichts der Kriege, die in Europa toben, und der unklaren Zukunft Deutschlands müssen wir uns bemühen, Unterstützung zu sammeln und die Länder des Nahen Ostens wie Afghanistan und Persien zu erreichen. Sie könnten sich als politisch und strategisch sehr wichtig erweisen, da sie an viele unserer Feinde grenzen und über viel Öl verfügen."
form_country_czechia_required_states_tt:0					"Kontrolliert alle §YCzech§! Staaten."
r56.ger.17.t:0					"Deutschland bietet Schutz für Zugeständnisse"
r56.ger.17.d:0					"Die deutsche Reichsregierung hat uns ein Abkommen vorgeschlagen, das die Rückgabe ihres verlorenen Territoriums im Austausch für die Sicherheit unter ihrem Einfluss als Herrschaft mit Sonderstatus vorsieht."
r56.ger.17.a:0					"Für unsere Sicherheit."
r56.ger.17.b:0					"Wir brauchen sie nicht!"
r56.ger.18.t:0					"Polen verweigert Schutz"
r56.ger.18.d:0					"Die polnische Regierung hat heute bekannt gegeben, dass sie kein Territorium im Tausch gegen Schutz abtreten wird. Durch diese Entscheidung brauchen sie jetzt vielleicht mehr Schutz als zuvor."
r56.ger.18.a:0					"Zum Teufel mit ihnen!"
r56.ger.19.t:0					"Polen akzeptiert die Bedingungen"
r56.ger.19.d:0					"Die polnische Regierung, die sich erheblich bedroht fühlt, hat sich auf unsere Bedingungen eingelassen und östliche Gebiete abgetreten."
r56.ger.19.a:0					"Das ist gut."
r56.ger.20.t:0					"Deutschland schlägt die Wiedervereinigung vor"
r56.ger.20.d:0					"Deutschland schlägt Wiedervereinigung vor"
r56.ger.20.d2:0					"Deutschland schlägt Wiedervereinigung vor"
r56.ger.20.a:0					"Lassen Sie das Volk zu Wort kommen."
r56.ger.20.b:0					"Österreichs Schicksal liegt woanders."
r56.ger.21.t:0					"Österreich lehnt die Wiedervereinigung ab!"
r56.ger.21.d1:0					"Die österreichische Regierung hat heute bekannt gegeben, dass sie ein Referendum über die Wiedervereinigung Österreichs mit Deutschland nicht zulassen wird. Trotz der Unterstützung der Bevölkerung und des öffentlichen Aufschreis haben die Unabhängigkeitsbefürworter in der Regierung den Kurs ihres Landes festgelegt."
r56.ger.21.d2:0					"Das österreichische Volk hat heute, angeheizt von faschistischen Unabhängigkeitsbefürwortern, gegen die Vereinigung Österreichs mit Deutschland gestimmt."
r56.ger.21.a:0					"Ein Verrat an der Demokratie."
r56.ger.21.b:0					"Wir sollten sie im Auge behalten."
r56.ger.22.t:0					"Deutschland schlägt Gebietstausch vor"
r56.ger.22.d:0					"Der deutsche Botschafter hat heute den Wunsch seines Landes bekannt gegeben, die deutsch-polnische Grenze in einer Weise zu verändern, die angeblich für beide Nationen von Vorteil ist. Das Abkommen sieht vor, dass das polnische Territorium Gdynia an Deutschland abgetreten wird, im Austausch gegen die deutsche Region Oberschlesien, die das deutsche Festland mit der ostpreußischen Enklave verbindet. Obwohl Oberschlesien industriell weniger entwickelt ist als Gdynia und wir unseren Zugang zum Meer dort aufgeben würden, bekämen wir Zugang zu den Stahl- und Aluminiumvorkommen in der Region und würden unsere Beziehungen zur deutschen Regierung deutlich verbessern, während gleichzeitig unsere Bevölkerung wachsen und die ethnischen Spannungen in beiden Regionen abnehmen würden."
r56.ger.22.a:0					"Eine Win-Win-Situation!"
r56.ger.22.b:0					"Gdynia ist zu wichtig für uns."
r56.ger.23.t1:0					"Polen billigt Grenzverschiebung"
r56.ger.23.d1:0					"Die polnische Regierung hat deutlich gemacht, dass sie mit dem deutschen Vorschlag zur Verschiebung der deutsch-polnischen Grenze einverstanden ist. Die nicht-lokalen Truppen haben mit dem Abzug aus Gdynia begonnen und die polnischen Bürger haben sich größtenteils nicht gegen die Verlegung ausgesprochen. Jetzt ist es an uns, das Gleiche zu tun."
r56.ger.23.a:0					"Die Sache ist erledigt."
r56.ger.23.t2:0					"Polen lehnt Abkommen ab"
r56.ger.23.d2:0					"Die polnische Regierung hat deutlich gemacht, dass sie kein Territorium mit Deutschland tauschen wird. Offiziell wegen der polnischen Minderheit, wahrscheinlicher aber wegen der strategischen Bedeutung des Landes für die Marine oder die Industrie."
r56.ger.23.b:0					"Wir werden sehen, was daraus wird."
r56.ger.24.t:0					"Deutschland bietet Litauen für deutsch beherrschte Gebiete an."
r56.ger.24.d:0					"Die deutsche Regierung, die sich in Litauen festgesetzt hat, bietet einen Tausch an, bei dem wir den größten Teil Litauens im Austausch gegen die weitgehend deutsch dominierten Gebiete Kattowitz und Gdingen erhalten. Damit würden wir zwar einen wichtigen Flottenstützpunkt und Metallressourcen verlieren, aber wir würden die litauische Industrie oder das, was davon übrig ist, gewinnen und außerdem das Erbe von Polen-Litauen für uns beanspruchen können."
r56.ger.24.a:0					"Zwei Fliegen mit einer Klappe."
r56.ger.24.b:0					"Die Litauer gehören auf sich allein gestellt."
r56.ger.25.d:0					"Nach der Ermordung Hitlers und einem Rückgang der Popularität ist die Situation der Nazi-Regierung nun endgültig zusammengebrochen. Überall im Land sind antinazistische Elemente aufgetaucht, im industriellen Kern und durch die separatistische Politik Bayerns hat sich eine neue konservative Demokratie gebildet. Auch in den kommunistischen Hochburgen, darunter Berlin, haben die Menschen rebelliert, wobei die Städte selbst vorerst von Nazi-Garnisonen geschützt werden. \n Nun liegt es an uns, zu entscheiden, wen wir unterstützen."
r56.ger.25.a:0					"Sich auf die Seite der Konservativen zu stellen, ist die sichere Option."
r56.ger.25.b:0					"Die Kommunisten werden den Menschen einen echten Wandel bringen."
GER_communists_are_pretty_hard_tt:					"\n§Die Chancen, zu gewinnen, werden gegen uns stehen!\n"
GER_communists_are_pretty_hard_tt_tip:0					"\n\n§Tipp:§! Sie könnten sich zwar auf die Nazis konzentrieren und einige Staaten erobern oder sogar vor ihnen kapitulieren, aber die §HConservative Seite§! wird Sie danach wahrscheinlich §Hschlagen§!.\n\nDurch die Aufstellung einer §HSmall Mobile Division§! können Sie vielleicht §Hrush§! der Konservativen §HCrucial Cities§!, während sie die Nazis bekämpfen."
r56.ger.26.d:0					"Österreich hat in einem Referendum für die Vereinigung mit Deutschland gestimmt. Das Fehlen einer starken nationalen Identität und die allgemeine pro-deutsche Stimmung haben zu einer großen Verschiebung in Europa geführt. Es bleibt abzuwarten, wie die Großmächte auf diesen demokratischen Bruch des Versailler Vertrages reagieren werden."
r56.ger.26.b:0					"Ich liebe die Demokratie."
r56.ger.27.t:					"Deutschland schlägt Handelsabkommen vor"
r56.ger.27.d:					"[FROM.GetNameDefCap] hat uns einen Kooperationsvertrag vorgeschlagen, bei dem wir im Austausch für die Rechte an einer unserer kleineren Ölreserven finanziell und mit Marinetechnologie entschädigt würden."
r56.ger.27.a:					"Wir könnten ihre Hilfe gebrauchen."
r56.ger.27.b:					"Wir trauen ihnen nicht."
r56.ger.28.t:					"Deutschland schlägt vor, die [YUG.GetAdjective]-Bedrohung zu beseitigen"
r56.ger.28.d:					"In seinem Kampf gegen die kommunistische Bedrohung ist Deutschland zu uns gekommen und schlägt eine gemeinsame Invasion Jugoslawiens vor. Sie sind bereit, sich von uns in ihrem Bestreben, die kommunistische Regierung zu stürzen, befriedigen zu lassen."
r56.ger.28.a:					"Bereiten Sie die Streitkräfte vor!"
r56.ger.28.b:					"Nicht jetzt!"
r56.ger.29.t:					"[FROM.GetName] Bittet alte Kolonien um Unterstützung"
r56.ger.29.d:					"Die reformierte deutsche Nation hat einige kleinere historische Besitztümer als Gegenleistung für ihre Unterstützung in unseren aktuellen Kriegen angefordert."
r56.ger.29.a:					"Das wäre sehr hilfreich!"
r56.ger.29.b:					"Wir brauchen sie nicht."
r56.ger.30.t:0					"Erich Ludendorffs verborgene Sympathien"
r56.ger.30.d:0					"Erich Ludendorff, der streng konservative Generalquartiermeister während des Ersten Weltkriegs, ist in den Köpfen der [ROOT.GetAdjective] Menschen nach wie vor ein beliebter Kriegsheld. Es ist zwar bekannt, dass er die NSDAP schon früh stark unterstützt hat, aber in den letzten Jahren hat er sich von der Partei so weit entfernt, dass er [GER.GetLeader] privat verachtet.\n\nSeine Popularität steht außer Frage, und er ist ein bewährter militärischer Befehlshaber. Mit etwas Überzeugungsarbeit wird er vielleicht bereit sein, sich hinter unsere Sache zu stellen. Mit ihm auf unserer Seite wird unsere Stärke und Legitimität erheblich gestärkt."
r56.ger.30.a:0					"Hoffen wir, dass er es schafft."
r56.ger.31.t:0					"Erich Ludendorffs nachlassende Gesundheit"
r56.ger.31.d:0					"Obwohl er sich kürzlich im Kampf gegen die Nazis auf unsere Seite geschlagen hat, hat sich Ludendorffs Gesundheitszustand erneut verschlechtert. Komplikationen durch Leberkrebs lassen die meisten Menschen glauben, dass es nur noch eine Frage der Zeit ist, bis er seiner Krankheit erliegt.\n\n Wir könnten ihm erlauben, in Würde in den Ruhestand zu gehen und die Zeit, die ihm noch bleibt, so zu leben, wie er es wünscht, oder wir könnten versuchen, ihm die bestmögliche medizinische Versorgung zukommen zu lassen und ihm erlauben, weiter zu dienen."
r56.ger.31.a:0					"Er hat uns gut gedient, lassen Sie ihn in den Ruhestand gehen."
r56.ger.31.b:0					"Finden Sie die bestmögliche Gesundheitsversorgung für ihn!"
r56.ger.32.t:0					"Ludendorff stirbt"
r56.ger.32.d:0					"Erich Ludendorff, der Mann, der uns sehr geholfen hat, ist an den Folgen einer Leberkrebserkrankung verstorben. Obwohl wir lange versucht hatten, ihn zu behandeln, um ihn gesund zu erhalten, blieb er immer entschlossen, [GER.GetNameDef] bis zu seinem letzten Atemzug zu dienen."
r56.ger.32.a:0					"Ein wahrer Soldat bis zum Ende."
r56.ger.33.t:0					"Ludendorff stirbt"
r56.ger.33.d:0					"Erich Ludendorff, der Mann, der uns sehr geholfen hat, ist an den Folgen einer Leberkrebserkrankung verstorben. Obwohl er inzwischen im Ruhestand war, versuchte er bis zu seinem letzten Atemzug, [GER.GetNameDef] auf zivile Weise zu dienen."
r56.ger.33.a:0					"Wir werden ihn vermissen."
r56.ger.37.t:0					"Militär ergreift die Macht"
r56.ger.37.d:0					"Heute Morgen haben zahlreiche Armeeangehörige in einem unblutigen Staatsstreich den [GER.GetLeader] Kaiserpalast umzingelt und unter Beschuss genommen. Das hatte zur Folge, dass der Kaiser gezwungen war, einen großen Teil seiner Macht abzugeben und einer Militärdiktatur die Führung des Landes zu überlassen, die von Kurt von Hammerstein-Equord angeführt wird und sich selbst zu einer bloßen Galionsfigur degradiert.\n\nDiese Entwicklung wurde in ganz [GER.GetNameDef] mit gemischten Reaktionen aufgenommen. Nur die Zeit wird zeigen, welche langfristigen Folgen dies haben wird."
r56.ger.37.a:0					"Eine interessante Entwicklung."
r56.ger.38.t:0					"Kaiser übernimmt die Kontrolle über die Regierung"
r56.ger.38.d:0					"Nach dem wachsenden königlichen Einfluss in [GER.GetNameDef] hat der Kaiser heute Morgen angekündigt, dass er viele der einschränkenden Gesetze, die ihm im Zuge der Militäraktion auferlegt wurden, aufhebt und die Kontrolle über die Regierung und das Militär wiederherstellt.\n\nAuch wenn dies bei der radikalen Elite unpopulär sein mag, so hat es doch den Anschein, dass der Kaiser den Willen und die Macht des Volkes hat, diese ehrgeizige Wiedereroberung der Macht durchzusetzen."
r56.ger.38.a:0					"Wird die Ordnung wiederhergestellt werden?"
r56.ger.43.t:0					"[FROM.GetNameDefCap] Ersuchen um die Entsendung von Militärberatern"
r56.ger.43.d:0					"[GER.GetAdjective] Militärberater haben heute die Hauptstadt erreicht, nachdem lange Gespräche mit [GER.GetNameDef] über eine mögliche militärische Zusammenarbeit zwischen den Ländern geführt wurden. Es scheint, dass [GER.GetNameDef] bereit ist, in unser Militär und unsere Industrie zu investieren, um unsere Unterstützung zu gewinnen. Ob es allerdings dazu kommt, werden wir feststellen."
r56.ger.43.a:0					"Willkommen."
r56.ger.43.b:0					"Tut mir leid, nein."
r56.ger.44.t:0					"[FROM.GetNameDefCap] Lehnt ab"
r56.ger.44.d:0					"Nach unserem Vorschlag, einen Militärattaché in [FROM.GetNameDefCap] einzusetzen, hat [FROM.GetAdjective] überlegt und beschlossen, unseren Vorschlag abzulehnen. Das könnte daran liegen, dass ihre gewünschte politische Ausrichtung nicht in Deutschland liegt, sondern vielleicht irgendwo anders..."
r56.ger.44.a:0					"Na gut, ihr Pech."
r56.ger.45.t:0					"Das deutsch-britische Flottenabkommen"
r56.ger.45.d:0					"Seit der Unterzeichnung des deutsch-britischen Flottenabkommens im Jahr 1935 ist unsere Marine in ihrer Größe auf das Verhältnis 35:100 festgelegt, das die Briten unbedingt beibehalten wollten. Da die Zukunft Europas jedoch ungewiss ist, sollten wir unsere Haltung zu diesem Abkommen neu bewerten, auch wenn dies möglicherweise Konsequenzen für die Briten haben könnte."
r56.ger.45.a:0					"Zur Hölle mit dem Abkommen"
r56.ger.45.b:0					"Es ist das Beste, sie nicht zu verärgern..."
wtt_germany.83.t:0					"Wilhelm III. stirbt"
wtt_germany.83.d:0					"Gestern Abend ist Wilhelm III., unser geliebter Kaiser, an den Folgen eines Herzinfarkts verstorben. Trotz seiner kurzen Regierungszeit hatte die Vorsehung es für richtig befunden, ihn lange vor seinem Tod regieren zu lassen, und seither hat er unser Land gut geführt. Sein Sohn, Wilhelm Friedrich, hat nun die Zügel der Nation in die Hand genommen und wird nach seiner Krönung als Wilhelm IV. bekannt werden."
ger.civil_war.2.t:					"[FROM.GetNameDefCap] bittet Militärberater"
ger.civil_war.2.desc:					"[FROM.GetNameDefCap] befindet sich in einer schwierigen Lage und hat nicht viel Unterstützung von der Wehrmacht bei ihrem Engagement im Bürgerkrieg erhalten. Da es ihr an qualifiziertem Personal mangelt, bitten sie um die vorübergehende Vermittlung einiger Kommandeure mittleren Ranges."
ger.civil_war.2.a:					"Eine Chance für Einfluss und Erfahrung!"
ger.civil_war.2.b:					"Es ist ein hoffnungsloser Fall"
character_changes_country_tt:					"[THIS.GetName] wechselt zu [FROM.GetNameDef]"
ger_brest_litovsk.1.t:0					"[GER.GetNameDefCap] bietet Frieden an!"
ger_brest_litovsk.1.d:0					"[SOV.GetNameDefCap] wurde ein Vertrag vorgeschlagen, um den [GER.GetAdjective]-[SOV.GetAdjective] Krieg im Osten zu beenden. Der Vertrag beinhaltete die Abtretung mehrerer westlicher [SOV.GetAdjective]-besetzter Gebiete an die [GER.GetAdjective] im Austausch für den Frieden. Diese Bedingungen ähneln dem Vertrag von Brest-Litowsk, der den deutsch-sowjetischen Konflikt während des Großen Krieges beendete."
ger_brest_litovsk.1.a:0					"Lehnen Sie die Bedingungen ab!"
ger_brest_litovsk.1.b:0					"Akzeptieren Sie die Bedingungen."
