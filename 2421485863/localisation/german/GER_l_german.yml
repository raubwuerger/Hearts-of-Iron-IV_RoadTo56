GER_bop_rally_in_honour_of_the_kaiser:0		"Kundgebung zu Ehren des Kaisers"
GER_strong_arm_the_industrialists:0		"Die Industriellen stark machen"
GER_strong_arm_the_industrialists_desc:0		"Wir können den Industriellen 'vorschlagen', dass sie Kredite in Form von Mefo-Scheinen aufnehmen, anstatt bei der Reichsbank um Kredite zu bitten. Auf diese Weise können wir verheimlichen, wie viel Geld die Reichsbank für Investitionen in die Schwerindustrie ausleiht, während wir gleichzeitig einen politischen Einfluss auf die Industriellen in unserem Land ausüben. Die Aufnahme dieser privaten Kredite in Form von Mefo-Scheinen birgt zwar das Risiko, unsere Wirtschaft zu kannibalisieren, aber solche Befürchtungen sind unbegründet, oder?"
GER_rally_the_technocrats:0		"Versammeln Sie die Technokraten"
GER_rally_the_technocrats_desc:0		"Die Unterstützung der Technokraten ist der Schlüssel zu unseren zukünftigen Kriegsanstrengungen."
r56_GER_rally_the_technocrats_idea:0		"Versammeln Sie die Technokraten"
GER_core_south_tyrol_threat:0		"Südtirol beansprucht"
GER_trade_influence_decisions:		"Handelsoffensiven"
GER_trade_influence_decisions_explain_tt:		"Die es ermöglichen, stark abhängige Nationen zu marionettieren."
GER_influence_nation:		"Ausnutzung des Einflusses auf [FROM.GetName]"
GER_protect_interests_nation:		"Schützen Sie [ROOT.GetAdjective] Interessen in [FROM.GetNameDEf]"
GER_coup_nation:		"Pro-[ROOT.GetAdjective] Putsch in [FROM.GetName]"
GER_target_for_hostile_trade_influence:		"Kann mit feindlichen Entscheidungen angegriffen werden."
GER_used_original_MR:		"Hat Polen mit der Sowjetunion geteilt, ohne Litauen zuzugestehen."
GER_cut_german_trade_ties:		"Kappt deutsche Handelsbeziehungen"
GER_hostile_trade_decisions_tt:		"§YUnterstützt Entscheidungen, um ein Kriegsziel auf [FROM.GetNameDef] zu setzen oder unseren Einfluss zu nutzen, um eine günstigere Regierung zu installieren.§!"
GER_cannot_influence_us_anymore_tt:		"§Y[FROM.GetName] wird nicht mehr in der Lage sein, uns zu beeinflussen und ihren Einfluss zu nutzen, um unsere Regierung zu ändern.§!"
GER_pressure_LIT:		"Druck [LIT.GetName]"
GER_pressure_LIT_desc:		"[LIT.GetNameDefCap] hat nach dem Verlust seines Hafens in Klaipéda eine starke Abhängigkeit von [ROOT.GetName] für seinen Lebensmittelhandel entwickelt. Die Drohung, diesen Handelsweg zu schließen, gibt uns ein bedeutendes Druckmittel."
GER_HOL_free_influence_tt:		"Bietet 15 §YGateway nach Europa§! Handelseinflusspunkte über [HOL.GetNameDef]."
RULE_ALLOW_RELEASE_NATIONS_NOT_GER_KINGDOMS_TOOLTIP:0		"Die deutschen Königreiche dürfen zu diesem Zeitpunkt nicht freigegeben werden."
GERK_revitalize_old_traditions:0		"Revitalisieren Sie alte [ROOT.GetAdjective] Traditionen"
GERK_revitalize_old_traditions_desc:0		"Die militaristischen Traditionen von [ROOT.GetNameDef] reichen Jahrhunderte zurück, denn es ist das bestimmende Merkmal, das unseren Staat, unsere Regierung und das gemeinsame Fundament des [ROOT.GetAdjective] Volkes eint."
GERK_root_militarism:0		"[ROOT.GetAdjective] Militarismus"
GERK_root_militarism_desc:0		"Der Militarismus war schon immer das Rückgrat von [ROOT.GetNameDef], es gibt keinen Grund, diese Tradition und dieses Erbe nicht aufrecht zu erhalten."
GERK_move_towards_german_reunification:0		"Auf dem Weg zur [GER.GetAdjective] Wiedervereinigung"
GERK_move_towards_german_reunification_desc:0		"Die [GER.GetAdjective] sprechende Welt war schon immer dazu bestimmt, unter einem einzigen Staat vereint zu sein, wir sollten nicht zulassen, dass uns dieses Schicksal noch länger vorenthalten wird."
global_reunited_germany:0		"Das wiedervereinigte Deutschland"
GERK_legacy_of_the_zollverein:0		"Das Erbe des Zollvereins"
GERK_legacy_of_the_zollverein_desc:0		"Vielleicht war die [GER.GetAdjective] sprechende Welt nicht dazu bestimmt, vereint zu sein, aber zumindest in der Lage, für eine gemeinsame Sache zu arbeiten. Der Zollverein hat sich genau das zum Ziel gesetzt. Jetzt ist es an der Zeit, ihn erneut zu gründen, damit wir gemeinsam stärker sein können."
GER_zollverein_faction:0		"Zollverein"
WGR_establish_a_provisional_capital:0		"Errichten Sie eine provisorische Hauptstadt"
WGR_establish_a_provisional_capital_desc:0		"Um unsere Regierung zum Laufen zu bringen, ist es nicht notwendig, dass wir eine provisorische Hauptstadt außerhalb von Berlin errichten, bis wir die Umstände finden, unter denen wir sie dorthin verlegen können. Auf keinen Fall dürfen wir den Eindruck erwecken, dass dieser Umzug in irgendeiner Weise dauerhaft ist, sonst wäre das ein großes Zeichen der Schwäche für uns."
r56_on_action_event.1.t:0		"[GER.GetNameDefCap] ändert seine politischen Direktiven!"
r56_on_action_event.1.d:0		"Die Veränderungen in der politischen Landschaft von [GER.GetNameDef] haben zur Bildung des neuen Regierungssystems geführt, das eine ganz andere Innenpolitik verfolgt als seine Vorgänger, die sich bemühen, soziale Streitigkeiten zu lösen und die Ordnung im neuen Staat zu sichern. \n\nDie Diplomaten haben bereits angekündigt, dass auch die außenpolitische Agenda des [GER.GetAdjective] Staates stark beeinträchtigt werden wird, einschließlich der Neuverhandlung früherer Wirtschaftsabkommen, der Revision von Verträgen und der Aufkündigung diplomatischer Bündnisse auf verschiedenen Machtebenen. \n\nDie Stimmen innerhalb unserer Regierung fragen sich ständig, ob [ROOT.getLeader] die Meinung von [ROOT.GetHerHis] gegenüber [GER.GetNameDef] neu ausrichten könnte oder ob [ROOT.GetSheHe] sie lieber beibehalten wird, solange die Situation unklar bleibt?"
r56_on_action_event.1.a:0		"Wir werden unsere Haltung ihnen gegenüber aufgeben."
r56_on_action_event.1.b:0		"Ein Regimewechsel bedeutet nichts, wenn die Herzen der Menschen korrumpiert sind!"
wtt_germany.80.t:0		"[GER.GetNameDefCap] Fordert Südjütland"
wtt_germany.80.desc:0		"Die deutsche Regierung hat uns ein Ultimatum gestellt und fordert die Rückgabe von Südjütland. Dieses Land war in den 1860er Jahren an Deutschland verloren gegangen und wurde im Vertrag von Versailles zurückgegeben. Viele ethnische Dänen, die in diesem Land leben, werden nicht erfreut sein, dass es aufgegeben wurde."
wtt_germany.80.a:0		"Um unsere Nation zu schützen, müssen wir uns fügen."
wtt_germany.80.b:0		"Wir werden unseren souveränen Boden nicht aufgeben."
wtt_germany.81.t:0		"[FROM.GetNameDefCap] gibt Nordschleswig zurück"
wtt_germany.81.d:0		"[FROM.GetNameDefCap] hat zugestimmt, Nordschleswig an uns zurückzugeben. Heute Morgen haben sich die letzten [FROM.GetAdjective] Garnisonen und Beamten hastig aus dem Land zurückgezogen, gefolgt von einem Strom von Flüchtlingen, die versuchen, die neue Grenze zu überqueren, bevor sie fest wird."
wtt_germany.81.a:0		"Endlich ist unsere Nordgrenze wiederhergestellt!"
wtt_germany.82.t:0		"[FROM.GetNameDefCap] lehnt unser Ultimatum ab"
wtt_germany.82.d:0		"[FROM.GetNameDefCap] hat klargestellt, dass sie Nordschleswig nicht an uns zurückgeben werden und dass jede Handlung, die uns dazu veranlasst, es zurückzunehmen, eine Kriegshandlung wäre."
wtt_germany.82.a:0		"Dann ist es Krieg."
r56.ger.46.t:0		"Die Partei ruft zur Wahl der Parteiführung auf"
r56.ger.46.desc:0		"Heinrich Brandler hat im Bürgerkrieg unschätzbare Dienste geleistet und große Teile des Widerstands gegen die Faschisten angeführt. Er hat bewiesen, dass er immer noch ein geborener Anführer ist! Jetzt hat er eine Kampagne gestartet, um der neue Vorsitzende der KPD zu werden. Er hat bereits eine große Anhängerschaft innerhalb der Partei gewonnen.\n\nDie Revolution ist in [ROOT.GetNonIdeologyName] gelungen. Jetzt haben viele KPD-Mitglieder begonnen, die Autorität Moskaus in Frage zu stellen. Der derzeitige KPD-Vorsitzende Ernst Thälmann ist ein überzeugter Stalinist und führt seit langem den linken Flügel der Partei an. Er hat die Unterstützung Moskaus und den politischen Einfluss, um Vorsitzender zu bleiben. Im Gegensatz zum linken Flügel steht Heinrich Brandler, der den rechten Flügel der KPD vertritt, vor einer möglichen Rückkehr in den Vorsitz. Was ihm an Einfluss fehlt, macht er durch seine Erfahrung wett, denn er war bereits von 1920 bis 1923 Vorsitzender. Außerdem hat Moskau Ernst Thälmann zu seinem Favoriten erklärt. Als Geburtsort des Kommunismus ist [ROOT.GetNonIdeologyName] für [SOV.GetNameDef] von großem Interesse. Wenn sie eingreifen würden, könnten sie ein Ergebnis erzwingen, das ihnen nützt..."
r56.ger.46.a:0		"Heinrich Brandler ist mit seinem Vorhaben erfolgreich!"
r56.ger.46.b:0		"Thälmann behält seine Position."
r56.ger.46.c:0		"Moskau schaltet sich ein und Ernst Thälmann bleibt an der Macht."
r56.ger.47.t:0		"Heinrich Brandler kehrt aus dem Exil zurück"
r56.ger.47.desc:0		"Heinrich Brandler ist ein Veteran der linken Politik. Er war Gründungsmitglied der KPD und von 1920 bis 1923 Vorsitzender während der März-Aktion und des gescheiterten Aufstands von 1923, für den er verantwortlich gemacht wurde.\n\n Er fiel sowohl bei der Sowjetunion als auch bei der KPD in Ungnade, nachdem er die Revolution 1923 abgesagt hatte. Nach Jahren in der UdSSR kehrte er nach [GER.GetNonIdeologyName] zurück und gründete die KPD(O), in Opposition zur KPD-Führung, die von Moskau geschützt wurde. Er gründete auch die Internationale Rechte Opposition als Oppositionsorganisation zur Komintern. Nach der Machtübernahme Hitlers ging er ins Exil nach Paris, wo er seine Bemühungen fortsetzte, sich der kommunistischen Linie Moskaus zu widersetzen.\n\nNun ist er zurückgekehrt, ein altgedienter Politiker und Gewerkschafter, und wird für die Revolution kämpfen!"
r56.ger.47.a:0		"Er ist ein wertvoller Aktivposten im Kampf gegen den Faschismus."
r56.ger.48.t:0		"Ernst Thälmann richtet die Partei neu aus"
r56.ger.48.desc:0		"Die Revolution hat gesiegt! [GER.GetNonIdeologyName] ist jetzt ein sozialistischer Staat mit Ernst Thälmann an der Spitze. Viele Menschen sind gestorben, aber das war es wert.\n\nNun hat Ernst Thälmann eine außerordentliche Sitzung der Parteiführung einberufen, weil er eine Neuausrichtung wünscht. Moskau soll der KPD nicht mehr sagen, was sie zu tun hat! So hat Ernst Thälmann die Führung aufgefordert, die Ideen, die Stalin in den Kommunismus eingebracht hat, aufzugeben und sich stattdessen auf die Lehren Lenins zu konzentrieren."
r56.ger.48.a:0		"Ein neuer Weg für [ROOT.GetNonIdeologyName] tut sich auf."
r56.ger.49.t:0		"[GER.GetAdjectiveCap] Kommunisten wählen Thälmann"
r56.ger.49.desc:0		"Neuigkeiten von [GER.GetNonIdeologyName] sind soeben eingetroffen. Nach 2 Tagen Debatte hat das Komitee der KPD-Führung einen neuen Vorsitzenden gewählt: Ernst Thälmann. Thälmann, ein Veteran der KPD, ist seit langem ein Freund der Komintern und der Wunschkandidat von [SOV.GetNameDef].\n\nZur Überraschung von [SOV.GetLeader] verkündete Ernst Thälmann jedoch 4 Stunden später den Austritt der KPD aus der Komintern, was für viele überraschend kam, auch für seine eigene Partei.\n\n Die Revolution in [GER.GetNonIdeologyName] wird nicht von ausländischen Mächten kontrolliert werden! Wir Deutschen können und werden unsere eigene Zukunft, unsere eigene sozialistische Gesellschaft bestimmen! - Ernst Thälmann in seiner Rede"
r56.ger.49.a:0		"Eine interessante Entwicklung."
r56.ger.49.b:0		"Sie haben die Revolution verraten!"
r56.ger.50.t:0		"[GER.GetAdjectiveCap] Kommunisten wählen Brandler"
r56.ger.50.desc:0		"Der Kampf um die Führung der [GER.GetNonIdeologyName] ist vorbei. Der neue Vorsitzende der KPD und damit ranghöchste Funktionär in [GER.GetNonIdeologyName] ist Heinrich Brandler, ein Mitbegründer der Partei. Brandler, der nach über einem Jahrzehnt im Exil in diesen Titel zurückkehrt, ist ein bekannter Gegner der Komintern, denn er ist der Gründer der Internationalen Rechten Opposition, einer oppositionellen Organisation zur Komintern.\n\nBrandler hat auch eine neue Verfassung für [GER.GetNonIdeologyName] unterzeichnet, die darauf abzielt, das öffentliche Eigentum zu fördern und Klassenunterschiede zu beseitigen, und die Nation in [GER.GetNameDef] umzubenennen. Moskau hat sich bisher ruhig verhalten, aber es wird erwartet, dass der neue [GER.GetAdjectiveCap] Führer denunziert wird."
r56.ger.50.a:0		"Eine interessante Entwicklung."
r56.ger.50.b:0		"Sie haben die Revolution verraten!"
r56.ger.51.t:0		"Die Gründung des Kominform"
r56.ger.51.desc:0		"Heute früh haben sowjetische und [GER.GetAdjectiveCap] Delegationen die Papiere unterzeichnet, um die Komintern aufzulösen und durch die Kominform zu ersetzen, der [GER.GetNonIdeologyName] angehört. Die beiden Länder hatten schlechte Beziehungen, die sich mit dem Sieg der Kommunisten im [GER.GetAdjectiveCap] Bürgerkrieg änderten.\n\nFür [GER.GetNonIdeologyName] wird dies die Position von Ernst Thälmann als Generalsekretär festigen, der seit langem enge Beziehungen zu seinen ideologischen Kollegen in Moskau pflegt. [SOV.GetNameDefCap] hingegen wird erheblichen Einfluss auf [GER.GetNonIdeologyName] gewinnen. Auch wenn die Länder auf dem Papier gleichberechtigt sind, vermuten viele Experten eine sowjetische Einmischung in die Politik von [GER.GetAdjectiveCap]."
r56.ger.51.a:0		"Eine interessante, aber erwartete Entwicklung."
r56.ger.51.b:0		"Ein weiterer Schritt in die falsche Richtung."
r56.ger.52.t:0		"[SOV.GetNameDefCap] Nimmt unseren Vorschlag an"
r56.ger.52.desc:0		"Wir sind an [SOV.GetNameDef] mit einem Vorschlag für ein Bündnis herangetreten. Es würde eine diplomatische, wirtschaftliche und militärische Zusammenarbeit beinhalten. Jetzt hat [SOV.GetNameDef] unser Angebot angenommen!\n\nAls Teil der Abmachung wurde die Komintern aufgelöst und durch die Kominform ersetzt, um die neue Macht unserer vereinten Volkswirtschaften und Militärs besser handhaben zu können."
r56.ger.52.a:0		"Unsere Partnerschaft wird glorreich sein!"
r56.ger.53.t:0		"[GER.GetNonIdeologyName] Schlägt ein Bündnis vor"
r56.ger.53.desc:0		"Das [GER.GetAdjectiveCap] Außenministerium hat einen interessanten Vorschlag unterbreitet. Sie wollen ein Bündnis zwischen unseren beiden Ländern eingehen. Ernst Thälmann, der Vorsitzende der KPD, ist seit langem ein Komplize der Komintern. Es handelt sich um ein gewaltiges diplomatisches, wirtschaftliches und militärisches Unterfangen. Aus diesem Grund hat [GER.GetNameDef] vorgeschlagen, die Komintern in die Kominform umzuwandeln, um neue Protokolle für ein fruchtbares Bündnis zu entwickeln."
r56.ger.53.a:0		"Lassen Sie uns unsere Anstrengungen vereinen."
r56.ger.53.b:0		"Sie sind falsche Kommunisten!"
r56.ger.54.t:0		"[GER.GetNameDefCap] Fordert eine gemeinsame Militärübung"
r56.ger.54.desc:0		"Als Mitglied der [THIS.GetFactionName] hat die [GER.GetNameDef] um eine gemeinsame Militärübung gebeten. Die Bündelung unserer Kräfte wird unseren beiden Militärs sicherlich helfen, sich besser zu koordinieren und neue Taktiken und Doktrinen zu entwickeln.\n\nDoch wäre dies für uns kostspielig und wir wären im Falle eines Krieges ernsthaft im Nachteil."
r56.ger.54.a:0		"Eine solche Übung ist es wert, Truppen zu entsenden."
r56.ger.54.b:0		"Wir können es uns nicht leisten, Truppen von den Grenzen wegzuziehen."
r56.ger.55.t:0		"Unsere gemeinsame Militärübung wurde angenommen"
r56.ger.55.desc:0		"Unserem Antrag auf eine gemeinsame Militärübung wurde stattgegeben. Mehrere unserer Divisionen sind bereits auf dem Weg zu einem ungenannten Ort, an dem diese Militärübungen stattfinden werden. Wir erhoffen uns ein besseres Verständnis des Geländes der Region und einen weiteren Vorteil gegenüber unseren Feinden."
r56.ger.55.a:0		"Viel Glück für unsere Truppen."
r56.ger.56.t:0		"Unsere gemeinsame Militärübung wurde abgelehnt"
r56.ger.56.desc:0		"Unser Antrag auf eine gemeinsame Militärübung wurde abgelehnt. Wir werden nicht die Erfahrung machen, die wir uns erhofft haben und müssen selbst an unserer militärischen Bereitschaft arbeiten. Vielleicht ist es sogar besser so, denn eine solche Militärübung hätte eine Menge Ressourcen von einer potentiellen Front verlagert."
r56.ger.56.a:0		"Traurig, aber wir können sie nicht zwingen."
