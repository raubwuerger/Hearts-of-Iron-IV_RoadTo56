landmark_die_neue_wache:	"Die Neue Wache"
landmark_die_neue_wache_desc:	"Ursprünglich 1818 vom Preußen Karl Friedrich Schinkel als Denkmal für den Befreiungskrieg und Wachhaus für das Königliche Schloss erbaut, später jedoch durch Bombenangriffe im letzten Krieg zerstört, wurde die Neue Wache als zentrales Denkmal der [ROOT.GetNameDef] für die Opfer von Krieg und Tyrannei wieder aufgebaut. Dieses Denkmal dient dazu, uns vor den Gefahren von Krieg und Tyrannei zu warnen und gleichzeitig die Soldaten zu ehren, die gegen diese beiden Mächte des Bösen gekämpft haben und gestorben sind."
landmark_kaiser_wilhelm_institutes:	"Die Kaiser-Wilhelm-Institute"
landmark_kaiser_wilhelm_institutes_desc:	"Die 1915 gegründeten Kaiser-Wilhelm-Institute sind die Spitze der weltweiten Wissenschaft und standen an der Spitze aller Arten von Entwicklungen, insbesondere der Kernspaltung. In den letzten Jahren haben wir große Anstrengungen unternommen, diese vom nationalsozialistischen Einfluss zu befreien und sie erheblich auszubauen, um Deutschland wieder zu dem zu machen, was es einst war!"
