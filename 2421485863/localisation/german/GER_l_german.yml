r56.kill_hitler.10.t:0					"Hitler begeht Selbstmord"
r56.kill_hitler.10.desc:0					"\nDa die Niederlage von [GER.GetNameDef] unausweichlich scheint, hat Adolf Hitler Berichten zufolge in seinem Kommandobunker in der [GER.GetAdjective]-Hauptstadt Selbstmord begangen, um seine Gefangennahme nicht zu riskieren. In seinem Testament wurde Admiral Karl Dönitz zum neuen [GER.Adjective]-Präsidenten ernannt und hat das Kommando über die verbliebenen [GER.GetAdjective]-Truppen übernommen. Obwohl Dönitz erklärt hat, dass er sich dafür einsetzt, einen möglichst günstigen Frieden für sein Land zu erreichen, geht das sogenannte „Tausendjährige Reich“ seinem Ende entgegen.""
r56.kill_hitler.10.a:0					"Interessant."
r56.kill_hitler.10.b:0					"Gut, dass wir ihn los sind."
r56.kill_hitler.10.c:0					"Verheerend!"
r56.kill_hitler.10.d:0					"[GER.GetNameDef] wird sich durchsetzen!"
GERK_factory_of_europe:0					"Fabrik von Europa"
GERK_factory_of_europe_desc:0					"[ROOT.GetNameDefCap] kann auf eine lange und stolze Geschichte beispielloser industrieller Produktion zurückblicken, und das ist eine Idee, die wir am Leben erhalten wollen."
GERK_army_with_a_state:0					"Eine Armee mit einem Staat"
GERK_army_with_a_state_desc:0					"Eine Armee mit einem Staat ist der einzigartige [ROOT.GetAdjective] Ausdruck, der verwendet wird, um die Macht und Vorherrschaft der Armee in der [ROOT.GetAdjective] Gesellschaft zu bezeichnen.""
GERK_continue_motorization:0					"Motorisierung der Armee"
GERK_continue_motorization_desc:0					"Das Zeitalter der Fußsoldaten geht zu Ende, und wir müssen uns anpassen, um der Zeit voraus zu sein. Wir müssen sicherstellen, dass unsere motorisierten Einheiten bereit und in der Lage sind, den Angriff anzuführen und einen schnellen und entscheidenden Sieg zu erringen."
GERK_field_piece_research:0					"Überwältigende Feuerkraft"
GERK_field_piece_research_desc:0					"Die Infanterie ist das Rückgrat unserer Armee, und damit sie sich auszeichnen kann, muss sie angemessen unterstützt werden. Wir müssen massiv in die Artillerie investieren, damit unsere Infanterie jeden Vorteil ausnutzen und jeden Feind vernichten kann, der ihr gegenübersteht."
r56.ger.65.t:0					"Hitler begeht Selbstmord"
r56.ger.65.desc:0					"Da unsere Niederlage unausweichlich scheint, hat Adolf Hitler den Tod dem Risiko einer Gefangennahme vorgezogen und in seinem Kommandobunker Selbstmord begangen.\n In seinem Testament wurde Admiral Karl Dönitz zum neuen [GER.Adjective]-Präsidenten ernannt und hat das Kommando über die verbliebenen Streitkräfte übernommen. Obwohl Dönitz erklärt hat, dass er sich dafür einsetzt, den bestmöglichen Frieden für sein Land zu erreichen„, wird dies wahrscheinlich wenig dazu beitragen, unsere ohnehin schon schlimme Lage zu verbessern.“"
r56.ger.65.a:0					"[GER.GetNameDef] wird sich durchsetzen!"
