GER_war_with_hungary_desc:0					"[HUN.getnamedef] besetzt eine kritische Südflanke unseres Landes, die gesichert werden muss, notfalls mit Gewalt."
GER_city_besiegement:0					"Belagerungsartillerie"
siege_artillery:0					"Belagerungsartillerie"
GER_city_besiegement_desc:0					"Da massive Befestigungen auf dem modernen Schlachtfeld wieder auf dem Vormarsch zu sein scheinen, müssen wir unsere Feldgeschütze aufrüsten, damit sie besser durch befestigte Verteidigungsanlagen und städtische Gebiete durchschlagen können."
GER_city_besiegement_tt:0					"§WEnables:§! §YSiege Artillery§!, §Whatever grants§!\n§WArtillery:§!\n§YUrban§!\n§WAttack:§! §G+5%§!\n§YFort§!\n§WAttack: §! §G+5%§!\n\n§WMotorisierte Artillerie:§!\n§YUrban§!\n§WAttack:§! §G+5%§!\n§YFort§!\n§WAttack:§! §G+5%§!\n\n"
GER_shock_troops_tech_bonus:0					"Forschungsbonus für Schocktruppen"
GER_pocket_liqudation:0					"Taschen-Liquidierungstaktik"
GER_pocket_liqudation_desc:0					"Wenn wir feindliche Truppen in Taschen einschließen, müssen wir verbesserte Taktiken und spezialisierte Einheiten einsetzen, um die gefangenen Truppen schnell aufzulösen, damit diese Soldaten wieder zur Unterstützung der Hauptanstrengungen zurückkehren können."
GER_pocket_liqudation_idea:0					"Taschen-Liquidierungstaktiken"
GER_counter_deep_battle:0					"Durchschlagende Gegenangriffe"
GER_counter_deep_battle_desc:0					"Da unsere Feinde ihre eigenen Panzerspitzen effektiv einsetzen, müssen wir bessere Taktiken entwickeln, um Durchbrüche zu verhindern, die unsere Fronten zum Einsturz bringen. Es ist nicht mehr möglich, jeden Zentimeter Boden zu halten, wenn wir uns schnell bewegende Offensiven durchführen. Wir müssen uns zurückziehen und neue Verteidigungsanlagen errichten und versuchen, die neu entblößten Flanken unseres Feindes anzugreifen."
GER_reuse_capture_weapons:0					"Erbeutete Waffen wiederverwenden"
GER_reuse_capture_weapons_desc:0					"Auch wenn unsere Industrie riesig ist, können wir nicht jeden Trupp an der Frontlinie jederzeit vollständig versorgen. Wir müssen unseren Einheiten erlauben, erbeutete Handfeuerwaffen und andere Ausrüstung an der Front zu verwenden, um Versorgungslücken zu schließen."
GER_reuse_capture_weapons_random_generals_tt:0					"§Yein§! zufällig ausgewählter Armeeanführer erhält §YScavenger§!§W:\n-Equipment Capture Ratio Modifier:§! §G+3%§!\n\n"
GER_captured_weapons:0					"Erbeutete Waffen wiederverwenden"
GER_frontline_hospitals:0					"Krankenhäuser an der Frontlinie"
GER_frontline_hospitals_desc:0					"Feldlazarette sind ein nützliches Instrument, um die Kampffähigkeit unserer Einheiten aufrechtzuerhalten, aber wenn wir die medizinische Versorgung sicher hinter der Frontlinie halten, dauert es eine Weile, bis geheilte Soldaten an die Front zurückkehren. Unsere Feldlazarette näher an der Frontlinie zu haben, birgt große Risiken, aber die schnelle Behandlung rettet Leben und hilft unseren Soldaten, schneller wieder in den Kampf zu ziehen."
GER_streamline_logistics:0					"Rationalisierung der Logistik an der Heimatfront"
GER_streamline_logistics_desc:0					"Wir sollten auch unsere Logistik an der Heimatfront nicht vergessen. Sie ist zwar derzeit optimiert, könnte aber immer mehr Investitionen vertragen, damit alles reibungslos läuft. Prozessverbesserungen im Inland könnten auch zu Verbesserungen in unserer Logistik an der Front führen."
GER_desperate_measures:0					"Verzweifelte Maßnahmen"
GER_desperate_measures_desc:0					"Da der Krieg einen unvorstellbaren Tribut von unserem Land fordert, müssen wir Maßnahmen ergreifen, die vor Jahren noch undenkbar waren."
GER_greater_collaborator_conscription:0					"Erhöhung der Wehrpflicht für Kollaborateure"
GER_greater_collaborator_conscription_desc:0					"Unsere Kollaborateure haben uns bei der Verwaltung unserer besetzten Gebiete sehr geholfen. Sie müssen ihre Anstrengungen verdoppeln und sich für den Kampf in unserer Armee rekrutieren lassen. Die Kriegsanstrengungen hängen davon ab."
GER_found_the_volkssturm:0					"Den Volkssturm gründen"
GER_found_the_volkssturm_desc:0					"Es ist klar geworden, dass wir unsere Rekrutierungsbemühungen auf Teile der Bevölkerung ausdehnen müssen, die bisher als nicht geeignet galten. Mit diesen Rekruten können wir Volkssturm-Einheiten bilden, die Garnisonstruppen für den Einsatz an der Front freisetzen oder unterbesetzte Divisionen verstärken können."
GER_found_the_volkssturm_stockpile_tt:0					"§Y1.00K§! Einheiten §YVolkssturm Handfeuerwaffen§! werden dem nationalen Vorrat hinzugefügt."
GER_front_line_cities:0					"Frontlinien-Städte"
GER_front_line_cities_desc:0					"Da sich der Krieg möglicherweise unserem Heimatgebiet nähert, müssen wir uns darauf vorbereiten, unsere Städte in Festungen zu verwandeln."
GER_front_line_cities_tt:0					"Fügen Sie §G1§! §YBunker§! in jeder Provinz des Staates hinzu, der £victory_points£ §YSiegpunkt(e)§! enthält."
GER_werewolves:0					"Werwölfe"
GER_werewolves_desc:0					"Wir müssen Individuen ausbilden, die sich den Invasoren bei jeder Gelegenheit widersetzen."
r56_ger_theater_prep:0					"Vorbereitung des Theaters"
r56_ger_theater_prep_desc:0					"Wir bereiten derzeit einen möglichen Kriegsschauplatz vor"
