GER_medical_costs:0					"Medizinische Kosten"
GER_medical_costs_desc:0					"Erich Ludendorffs sich verschlechternder Gesundheitszustand stellt eine Herausforderung dar, denn es werden immer mehr staatliche Mittel bereitgestellt, um ihm die bestmögliche Behandlung zukommen zu lassen, damit er weiter dienen kann, obwohl es nur eine Frage der Zeit ist."
