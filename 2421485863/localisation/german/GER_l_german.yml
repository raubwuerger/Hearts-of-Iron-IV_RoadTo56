GER_a_world_in_flames:0					"Eine Welt in Flammen"
GER_a_world_in_flames_desc:0					"Da unsere Feinde immer näher rücken, müssen wir uns weigern, zu kapitulieren. Vielleicht werden wir besiegt und vernichtet. Doch wenn wir das tun, werden wir unsere Feinde und die Welt mit in den Abgrund reißen. Eine Welt in Flammen."
GER_a_world_in_flames_2_tt:0					"Ergänzt bis zu §G5§! §YBunkers§! entlang der Oder in den kontrollierten Provinzen der Staaten."
