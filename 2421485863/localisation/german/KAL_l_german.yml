KAL_reinstate_monasteries_desc:	"Die Bolschewiken haben versucht, unser Volk vom Buddhismus zu entfremden und unsere Kultur auszulöschen. Die Wiederherstellung der Klöster wird der Beweis für ihr Scheitern sein."
KAL_finance_military_infrastructure:0	"Finanzierung der militärischen Infrastruktur"
KAL_finance_military_infrastructure_desc:	"Die Unterstützung bei der Finanzierung der notwendigen Mittel zur Verteidigung des Staates ist für unser langfristiges Überleben unverzichtbar."
KAL_building_a_kingdom:	"Ein Königreich errichten"
KAL_building_a_kingdom_desc:	"Unser Volk muss mobilisiert werden, um aus Kalmückien ein richtiges Königreich zu machen."
KAL_buddhist_society:	"Buddhistische Gesellschaft"
KAL_buddhist_society_desc:	"Unsere Bemühungen, den durch frühere Verfolgungen entstandenen Schaden zu beheben, tragen endlich Früchte und stellen den Einfluss des Buddhismus in unserer Gesellschaft wieder her."
KAL_propaganda_for_the_khagan_god:	"Propaganda für den Khagan-Gott"
KAL_propaganda_for_the_khagan_god_desc:	"Während seines Exils beschrieb der Schriftsteller und Journalist Nikolai Brechko-Brechkovsky den Khagan als einen "Prinz-Gott". Damals, in jenen schwierigen Jahren fern der Heimat, war er der Sammelpunkt für diejenigen, die an ihn und die Legitimität der Dynastie glaubten. Nun ist es an der Zeit, diese Formel wiederzubeleben und mit Zustimmung des Klerus den Aufstieg des Khagan-Gottes zu erleben. "
KAL_trust_democratic_institutions:	"Vertrauen in demokratische Institutionen"
KAL_trust_democratic_institutions_desc:	"Es ist unerlässlich, nicht zuzulassen, dass die Prinzipien eines Einparteienstaates die Bevölkerung erneut unterdrücken."
KAL_introduce_political_reforms:	"Politische Reformen einführen"
KAL_introduce_political_reforms_desc:	"Verfassungsreformen werden es ermöglichen, das Regime effizienter zu gestalten und gleichzeitig die Freiheiten des Volkes zu garantieren."
KAL_anti_revolutionary_decree:	"Antirevolutionäres Dekret"
KAL_anti_revolutionary_decree_desc:	"Sanktionen gegen gefährliche Ideologien sind für die Stabilität des Staates unerlässlich."
KAL_economic_optimization:0	"Wirtschaftliche Optimierung"
KAL_economic_optimization_desc:	"Demokratische Institutionen sind unerlässlich, um langfristiges Wirtschaftswachstum zu ermöglichen."
KAL_research_grants:0	"Forschungszuschüsse"
KAL_research_grants_desc:	"Spezielle Forschungsfinanzierungsmittel würden uns helfen, neue Ausrüstung zu entwickeln."
KAL_deterrence:0	"Abschreckung"
KAL_deterrence_desc:	"Wir müssen bereit sein, das Vaterland zu verteidigen."
KAL_establishing_an_army:	"Aufbau einer Armee"
KAL_establishing_an_army_desc:	"Wir müssen schnell eine professionelle Streitmacht aufstellen, um unser Volk zu schützen. "
KAL_our_equine_pride:	"Unser Stolz auf die Pferde"
KAL_our_equine_pride_desc:	"Unsere Steppe und ihre Pferde sind unser Lebensstil und unser Stolz. Auch wenn manche sie als bloße "Ponypower" verspotten, können, sollten und werden sie unser bester militärischer Trumpf sein."
KAL_moderate_cavalry_supremacy:0	"Maßvolle Kavallerie-Vorherrschaft"
KAL_moderate_cavalry_supremacy_desc:0	"Es gibt noch andere Einheiten zu berücksichtigen, anstatt sich zu sehr auf Ponys, Pferde und Stuten zu konzentrieren."
