KAL_oka_gorodovikov:	"Oka Gorodovikov"
KAL_stepanov:	"A. Stepanov"
KAL_organize_the_government:0	"Die Regierung organisieren"
KAL_organize_the_government_desc:	"Wir sind nun in der Lage, uns selbst zu regieren; dies ist ein entscheidender Moment für unsere Zukunft."
KAL_form_manufacturing_cooperatives:0	"Gründung von Produktionsgenossenschaften"
KAL_form_manufacturing_cooperatives_desc:0	"Vom Volk organisierte Fabriken und Werkstätten sind der erste Schritt in Richtung Sozialismus."
KAL_collectivist_propaganda:	"Kollektivistische Propaganda"
KAL_collectivist_propaganda_desc:0	"Arbeitet für die Partei, die Revolution und das Aufkommen des Kommunismus, Genossen!"
KAL_five_year_plan:	"Fünfjahresplan"
KAL_five_year_plan_desc:	"Die wirtschaftliche Revolution weg vom nomadischen Feudalismus muss das Ziel unseres ersten Fünfjahresplans sein."
KAL_indoctrination_focus:0	"Indoktrination"
KAL_indoctrination_focus_desc:	"Die Grundsätze des Marxismus-Leninismus müssen verbreitet werden, um den Erfolg der Revolution zu sichern."
KAL_cult_of_personality:0	"[ROOT.GetCommunistLeader] Personenkult"
KAL_cult_of_personality_desc:0	"Die Revolution wird durch die weise Führung unseres geliebten Generalsekretärs [ROOT.GetCommunistLeader] geschützt."
KAL_red_army:0	"Die [KAL.getAdjective] Rote Armee"
KAL_red_army_desc:0	"Es lebe das [KAL.getAdjective] Rote Banner und seine Armee!"
KAL_war_communism:0	"Kriegskommunismus"
KAL_war_communism_desc:0	"Der Krieg erfordert beispiellose Maßnahmen, um die Revolution zu retten."
KAL_reconcile_buddhism_and_socialism:0	"Buddhismus und Sozialismus versöhnen"
KAL_reconcile_buddhism_and_socialism_desc:0	"Buddhistisches Mitgefühl ist ein wesentliches Element für die Verwirklichung des Sozialismus."
KAL_state_atheism:0	"Staatlicher Atheismus"
KAL_state_atheism_desc:0	"Die Beseitigung feudalistischer religiöser Ausbeuter ist notwendig für den Fortschritt des historischen Materialismus und die Weiterentwicklung des Volkes."
KAL_revolutionary_pioneer_organizations:0	"Revolutionäre Pionierorganisationen"
KAL_revolutionary_pioneer_organizations_desc:0	"Die Pioniere sind unverzichtbar, um der Jugend die Grundsätze, Tugenden und Vorteile des Sozialismus zu vermitteln. Der Kommunismus wird nicht innerhalb einer Generation erreicht werden, und es liegt an ihnen, den unaufhaltsamen Marsch der Geschichte fortzusetzen."
KAL_prepare_the_youth_for_service:	"Die Jugend auf den Dienst vorbereiten"
KAL_prepare_the_youth_for_service_desc:	"Gut ausgebildete Pioniere können nun grundlegende militärische Anweisungen befolgen, um darauf vorbereitet zu sein, die Zukunft der Revolution zu verteidigen."
KAL_bring_in_exiled_nationalists:	"Exilierte Nationalisten zurückholen"
KAL_bring_in_exiled_nationalists_desc:	"Kalmücken, die sich auf die Seite der Weißen Russen gestellt hatten, suchten nach dem Sieg der Kommunisten oft Zuflucht im Ausland. Sie haben Kontakte geknüpft und Texte veröffentlicht, um ihre Rückkehr vorzubereiten, wobei die meisten einen starken Groll gegen die Kommunisten hegen."
KAL_reinforce_the_security_apparatus:	"Den Sicherheitsapparat verstärken"
KAL_reinforce_the_security_apparatus_desc:	"Um sicherzustellen, dass keine subversiven Aktivitäten die Sicherheit des Staates bedrohen, müssen die notwendigen geheimen Institutionen eingerichtet werden."
KAL_the_kalmyk_flag_organization:	"Die Organisation "Kalmyk Flag""
KAL_the_kalmyk_flag_organization_desc:	"Die Organisation "Kalmyk Flag" ist eine Gründung von Chamba Nudelich Balinov zur Förderung des Kosaken- und Kalmücken-Nationalismus. Sie verschaffte ihm zudem Kontakte in Berlin... Die Organisation sollte zum Kern der neuen Regierung werden, um die nationale Einheit zu gewährleisten."
KAL_solidify_the_military_government:0	"Die Militärregierung festigen"
KAL_solidify_the_military_government_desc:	"Die Militärherrschaft muss absolut, kompromisslos und zielgerichtet sein."
KAL_rally_behind_the_khan:0	"Sich hinter dem Khagan versammeln"
KAL_rally_behind_the_khan_desc:	"Auch wenn der Khagan nicht alle unsere Überzeugungen teilt, könnte er als nützliche Sammelpunktfigur für das Volk dienen."
KAL_form_a_royal_guard:	"Eine königliche Garde bilden"
KAL_form_a_royal_guard_desc:	"Eine königliche Garde ist ein notwendiger Schritt, um die Kontrolle des Monarchen über seine Armee zu demonstrieren und sein Ansehen zu stärken."
KAL_royal_officer_corps:	"Königliches Offizierskorps"
KAL_royal_officer_corps_desc:	"Dem Monarchen treu ergebene Offiziere sind für den Ausbau der Armee notwendig."
KAL_the_spirit_of_genghis:	"Der Geist Dschingis’"
KAL_the_spirit_of_genghis_desc:	"Alle Mongolen, Kalmücken, Burjaten und Tuwiner feiern noch immer das Andenken an Dschingis Khan und singen "Chinggis khaanii Magtaal"."
KAL_armament_production_plan:	"Rüstungsproduktionsplan"
KAL_armament_production_plan_desc:	"Mehr Waffen für den Himmelsgott, Kugeln zur Verteidigung der Bodhisattvas."
KAL_promote_nichiren_buddhism:	"Förderung des Nichiren-Buddhismus"
KAL_promote_nichiren_buddhism_desc:	"Der Nichiren-Buddhismus ist eine Form des japanischen Buddhismus, die sich allmählich mit einer extremen Form des japanischen Nationalismus verflochten hat. Es wäre nicht schwer, diese Prinzipien für die Förderung unserer ethnischen Ziele zu nutzen."
KAL_examplary_battle_leadership:	"Vorbildliche Kriegsführung"
KAL_examplary_battle_leadership_desc:	"Nur das Vorbild unserer Offiziere kann das Vertrauen unserer Soldaten in ihre Kommandeure wecken."
KAL_promote_militarism:0	"Förderung des Militarismus"
KAL_promote_militarism:	"Unsere Ambitionen erfordern Soldaten. Das Volk muss für den kommenden Kampf mobilisiert werden."
KAL_paramilitarism:0	"Paramilitarismus"
KAL_paramilitarism_desc:	"Neben dem Militär können Partei und Jugendorganisation angehende Rekruten auf ihre künftige Rolle als Soldaten vorbereiten."
KAL_dominate_the_pontic_caspian_steppe:	"Die pontisch-kaspische Steppe beherrschen"
KAL_dominate_the_pontic_caspian_steppe_desc:	"Die kaspisch-pontische Steppe ist der Ort, in den wir im 18. Jahrhundert ausgewandert sind. Seitdem wurde unser Einflussbereich langsam von anderen Völkern ausgehöhlt. Es ist an der Zeit, die Region zu kontrollieren und vielleicht zu versuchen, uns wieder mit unseren mongolischen Verwandten zu vereinen."
KAL_take_leadership:0	"Die Führung übernehmen"
KAL_take_leadership_desc:0	"Es ist an der Zeit, eine eigene Koalition zu bilden und anzuführen und der Welt unseren Stempel aufzudrücken."
KAL_organize_our_alliance:0	"Unsere Allianz organisieren"
KAL_organize_our_alliance_desc:0	"Durch die Organisation einer großen Konferenz sollten wir in der Lage sein, die Bemühungen unserer Allianz zu koordinieren."
KAL_stimulate_mongol_traditions_in_mongolia:	"Traditionen in der Mongolei fördern"
KAL_stimulate_mongol_traditions_in_mongolia_desc:	"Die Wiederbelebung unserer gemeinsamen kulturellen Traditionen in den von uns kontrollierten Gebieten würde es uns ermöglichen, die Herzen und Köpfe der lokalen Bevölkerung zu gewinnen."
KAL_stimulate_mongol_traditions_in_inner_mongolia:	"Traditionen in der Inneren Mongolei fördern"
KAL_stimulate_mongol_traditions_in_inner_mongolia_desc:	"Die Wiederbelebung unserer gemeinsamen kulturellen Traditionen in den von uns kontrollierten Gebieten würde es uns ermöglichen, die Herzen und Köpfe der lokalen Bevölkerung zu gewinnen."
KAL_stimulate_mongol_traditions_in_tuva:	"Förderung mongolischer Traditionen in Tuwa"
KAL_stimulate_mongol_traditions_in_tuva_desc:	"Die Wiederbelebung unserer gemeinsamen kulturellen Traditionen in den von uns kontrollierten Gebieten würde es uns ermöglichen, die Herzen und Köpfe der lokalen Bevölkerung zu gewinnen."
KAL_stimulate_mongol_traditions_in_buryatia:	"Förderung mongolischer Traditionen in Burjatien"
KAL_stimulate_mongol_traditions_in_buryatia_desc:	"Die Wiederbelebung unserer gemeinsamen kulturellen Traditionen in den von uns kontrollierten Gebieten würde es uns ermöglichen, die Herzen und Köpfe der lokalen Bevölkerung zu gewinnen."
KAL_the_court_of_joinville_le_pont:	"Der Hof von Joinville-le-Pont"
KAL_the_court_of_joinville_le_pont_desc:	"In Joinville-le-Pont bei Paris ließ sich eine Gruppe prominenter kalmückischer Exilanten weit außerhalb der Reichweite der Bolschewiki nieder. Unter ihnen befand sich der Sohn eines Militäradjutanten von Nikolaus II., der Erbe eines der wichtigsten kalmückischen Clans und als deren Khagan anerkannt war."
KAL_reinstate_monasteries:	"Wiederherstellung der Klöster"
KAL_reinstate_monasteries_desc:	"Die Bolschewiken haben versucht, unser Volk vom Buddhismus zu entfremden und unsere Kultur auszulöschen. Die Wiederherstellung der Klöster wird der Beweis für ihr Scheitern sein."
KAL_finance_military_infrastructure:0	"Finanzierung der militärischen Infrastruktur"
KAL_finance_military_infrastructure_desc:	"Die Unterstützung bei der Finanzierung der notwendigen Mittel zur Verteidigung des Staates ist für unser langfristiges Überleben unverzichtbar."
KAL_building_a_kingdom:	"Ein Königreich errichten"
KAL_building_a_kingdom_desc:	"Unser Volk muss mobilisiert werden, um aus Kalmückien ein richtiges Königreich zu machen."
KAL_buddhist_society:	"Buddhistische Gesellschaft"
KAL_buddhist_society_desc:	"Unsere Bemühungen, den durch frühere Verfolgungen entstandenen Schaden zu beheben, tragen endlich Früchte und stellen den Einfluss des Buddhismus in unserer Gesellschaft wieder her."
KAL_propaganda_for_the_khagan_god:	"Propaganda für den Khagan-Gott"
KAL_propaganda_for_the_khagan_god_desc:	"Während seines Exils beschrieb der Schriftsteller und Journalist Nikolai Brechko-Brechkovsky den Khagan als einen "Prinz-Gott". Damals, in jenen schwierigen Jahren fern der Heimat, war er der Sammelpunkt für diejenigen, die an ihn und die Legitimität der Dynastie glaubten. Nun ist es an der Zeit, diese Formel wiederzubeleben und mit Zustimmung des Klerus den Aufstieg des Khagan-Gottes zu erleben. "
KAL_trust_democratic_institutions:	"Vertrauen in demokratische Institutionen"
KAL_trust_democratic_institutions_desc:	"Es ist unerlässlich, nicht zuzulassen, dass die Prinzipien eines Einparteienstaates die Bevölkerung erneut unterdrücken."
KAL_introduce_political_reforms:	"Politische Reformen einführen"
KAL_introduce_political_reforms_desc:	"Verfassungsreformen werden es ermöglichen, das Regime effizienter zu gestalten und gleichzeitig die Freiheiten des Volkes zu garantieren."
KAL_anti_revolutionary_decree:	"Antirevolutionäres Dekret"
KAL_anti_revolutionary_decree_desc:	"Sanktionen gegen gefährliche Ideologien sind für die Stabilität des Staates unerlässlich."
KAL_economic_optimization:0	"Wirtschaftliche Optimierung"
KAL_economic_optimization_desc:	"Demokratische Institutionen sind unerlässlich, um langfristiges Wirtschaftswachstum zu ermöglichen."
KAL_research_grants:0	"Forschungszuschüsse"
KAL_research_grants_desc:	"Spezielle Forschungsfinanzierungsmittel würden uns helfen, neue Ausrüstung zu entwickeln."
KAL_deterrence:0	"Abschreckung"
KAL_deterrence_desc:	"Wir müssen bereit sein, das Vaterland zu verteidigen."
KAL_establishing_an_army:	"Aufbau einer Armee"
KAL_establishing_an_army_desc:	"Wir müssen schnell eine professionelle Streitmacht aufstellen, um unser Volk zu schützen. "
KAL_our_equine_pride:	"Unser Stolz auf die Pferde"
KAL_our_equine_pride_desc:	"Unsere Steppe und ihre Pferde sind unser Lebensstil und unser Stolz. Auch wenn manche sie als bloße "Ponypower" verspotten, können, sollten und werden sie unser bester militärischer Trumpf sein."
KAL_moderate_cavalry_supremacy:0	"Maßvolle Kavallerie-Vorherrschaft"
KAL_moderate_cavalry_supremacy_desc:0	"Es gibt noch andere Einheiten zu berücksichtigen, anstatt sich zu sehr auf Ponys, Pferde und Stuten zu konzentrieren."
KAL_khan_fascism_tt:0	" Die Popularität der §Yfaschistischen§! und §Yblockfreien§! Parteien zusammen beträgt mehr als §G50 %§!"
