RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0		"Plutarco Calles, Saturnino Cedillo und die anderen militärischen Machthaber werden Mexikos aufkeimende Demokratieversuche abbrechen und sich an Deutschland orientieren."
RULE_OPTION_THEOCRATIC_ORDER:0		"Theokratische Ordnung"
RULE_OPTION_THEOCRATIC_ORDER_DESC:0		"Die Synarchisten und Cristeros werden die Macht in Mexiko übernehmen und eine neue lateinamerikanische Ordnung schaffen, um den Kontinent von Ketzern zu säubern."
RULE_OPTION_SOVIET_REPUBLIC:0		"Sowjetische Republik"
RULE_OPTION_SOVIET_REPUBLIC_DESC:0		"Mexiko wird sich auf die Sowjetunion ausrichten und die Revolution mit der Spitze eines Bajonetts in Lateinamerika verbreiten."
RULE_OPTION_CARDENISMO:0		"Cárdenismo"
RULE_OPTION_CARDENISMO_DESC:0		"Lázaro Cárdenas und seine linksgerichteten Nachfolger werden eine Bolivarische Allianz gründen und die Yanqui-Imperialisten angreifen."
AMERICAS_COLONIZATION_STATUS:0		"Amerikas Kolonisierungsstatus"
RULE_OPTION_DEFAULT_COLONIZATION_DESC:0		"Die Welt ist historisch gesehen kolonialisiert."
RULE_OPTION_AMERICAS_DECOLONIZED:0		"Amerika dekolonisiert"
RULE_OPTION_AMERICAS_DECOLONIZED_DESC:0		"Alle freigewordenen kolonisierten Nationen in Amerika werden bei Spielbeginn als freie und unabhängige Nationen freigegeben."
AFRICA_COLONIZATION_STATUS:0		"Afrika Kolonisierung Status"
RULE_OPTION_AFRICA_DECOLONIZED:0		"Afrika Dekolonisiert"
RULE_OPTION_AFRICA_DECOLONIZED_DESC:0		"Alle freigebbaren kolonisierten Nationen in Afrika werden bei Spielbeginn als freie und unabhängige Nationen freigegeben."
ASIA_COLONIZATION_STATUS:0		"Asien Kolonisierung Status"
RULE_OPTION_ASIA_DECOLONIZED:0		"Asien Dekolonisiert"
RULE_OPTION_ASIA_DECOLONIZED_DESC:0		"Alle freigebbaren kolonisierten Nationen in Asien werden bei Spielbeginn als freie und unabhängige Nationen freigegeben."
OCEANIA_COLONIZATION_STATUS:0		"Ozeanien Kolonisierung Status"
RULE_OPTION_OCEANIA_DECOLONIZED:0		"Ozeanien Dekolonisiert"
RULE_OPTION_OCEANIA_DECOLONIZED_DESC:0		"Alle freigebbaren kolonisierten Nationen in Ozeanien werden bei Spielbeginn als freie und unabhängige Nationen freigegeben."
RULE_OPTION_OCEANIA_UNITED:0		"Polynesisches Reich"
RULE_OPTION_OCEANIA_UNITED_DESC:0		"Polynesien wird zu Beginn des Spiels zu einem einzigen Land vereinigt."
RULE_OPTION_DEFAULT_FRAGMENTATION_DESC:0		"Keine Nationalstaaten werden in ihre Bestandteile zerlegt."
RULE_OPTION_ENG_FRAGMENTED:0		"Vereinigtes Königreich Fragmentiert"
RULE_OPTION_ENG_FRAGMENTED_DESC:0		"Alle freigebbaren Teilstaaten des Vereinigten Königreichs werden bei Spielbeginn als freie und unabhängige Nationen freigegeben."
RULE_OPTION_SPR_FAMILIAR:0		"11. November"
RULE_OPTION_SPR_FAMILIAR_DESC:0		"Die Grenzen Spaniens werden in etwas Vertrautes umgestaltet."
RULE_OPTION_YUG_FRAGMENTED:0		"Jugoslawien zersplittert"
RULE_OPTION_SOV_FRAGMENTED:0		"Sowjetunion aufgelöst"
RULE_OPTION_SOV_FRAGMENTED_DESC:0		"Alle freigebbaren Nationen, aus denen die Sowjetunion besteht, werden bei Spielbeginn als freie und unabhängige Nationen freigelassen."
RULE_OPTION_SOV_UTTERLY_FRAGMENTED:0		"Sowjetunion zersplittert"
RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0		"Alle freischaltbaren Republiken, Okrugs und Territorien, aus denen die Sowjetunion besteht, werden bei Spielbeginn als freie und unabhängige Nationen freigeschaltet."
RULE_OPTION_RAJ_FRAGMENTED:0		"Britisches Raj Fragmentiert"
RULE_OPTION_RAJ_FRAGMENTED_DESC:0		"Alle freischaltbaren Nationen, die das Britische Raj bilden, werden bei Spielbeginn als freie und unabhängige Nationen freigeschaltet."
RULE_OPTION_NATIONALIST_HISTORICAL:0		"Franquismus"
RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0		"Franco übernimmt die Kontrolle über die nationalistische Front und verschmilzt die Ideologien der Falangisten und der Karlisten in einem neuen und vereinten Spanien, das versucht, im Weltkrieg neutral zu bleiben, solange es nicht angegriffen wird."
RULE_OPTION_SECOND_REPUBLIC:0		"Zweite Republik"
RULE_OPTION_SECOND_REPUBLIC_DESC:0		"Die demokratische Regierung Spaniens wird die Zweite Republik aufrechterhalten und sowohl den Faschismus als auch den Kommunismus ablehnen."
RULE_OPTION_FALANGIST:0		"Falangismus"
RULE_OPTION_FALANGIST_DESC:0		"Die Falangisten unter José Antonio Primo de Rivera werden den Carlismus ablehnen und versuchen, den spanischen Imperialismus wiederherzustellen."
RULE_OPTION_CARLIST:0		"Carlismus"
RULE_OPTION_CARLIST_DESC:0		"Die Carlisten unter Manuel Fal Conde lehnen den Falangismus ab und sorgen für die Rückkehr zur absolutistischen Monarchie von einst unter dem rechtmäßigen Karlistenkönig."
RULE_OPTION_ANARCHIST:0		"Anarchismus"
RULE_OPTION_ANARCHIST_DESC:0		"Die anarchistischen Gemeinden in Aragonien und Katalonien werden sich zusammenschließen, um die Faschisten und Kommunisten zu besiegen und sich gegen die Idee eines Nationalstaates zu wehren."
RULE_OPTION_INDEPENDENT_COMMUNIST:0		"Unabhängiger Kommunismus"
RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0		"Nach dem Bürgerkrieg werden die POUM und ihre anarchistischen Verbündeten das stalinistische Joch abschütteln und eine unabhängige kommunistische Ideologie anstreben."
RULE_OPTION_STALINIST:0		"Stalinistischer Kommunismus"
RULE_OPTION_STALINIST_DESC:0		"Die wahren Kommunisten, die ihre Befehle aus Moskau erhalten, werden sich den Anarchisten und Faschisten widersetzen, den Einfluss der Unabhängigen Kommunisten zurückdrängen und ein neues Zeitalter für die Zweite Republik unter stalinistischer Führung einläuten."
RULE_OPTION_HISTORICAL_POR_AI_DESC:0		"Unter dem Regime von Salazar wird Portugal den Estado Novo stärken und versuchen, während des Zweiten Weltkriegs neutral zu bleiben."
RULE_OPTION_FASCIST_POR_AI_DESC:0		"Rafael Pereira übernimmt als faschistischer Diktator die Kontrolle über Portugal, unterstützt die Nationalisten während des Spanischen Bürgerkriegs und versucht danach, sich der Achse anzuschließen."
RULE_OPTION_FASCIST_FIFTH_EMPIRE:0		"Das Fünfte Reich"
RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:1		"Die portugiesische Regierung übernimmt den Faschismus, kämpft im Spanischen Bürgerkrieg gegen die Republikaner und versucht, die verlorenen Gebiete in Afrika, Asien und Amerika zurückzuerobern und wieder zu einer Großmacht aufzusteigen."
RULE_OPTION_NEUTRALITY_MONARCHIST:0		"Monarchist"
RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0		"Nachdem er die Monarchie in Portugal wiederhergestellt hat, wird König Duarte an die brasilianischen Monarchisten appellieren und versuchen, das Kaiserreich Portugal und Brasilien wiederherzustellen."
RULE_OPTION_DEMOCRATIC_POR_AI_DESC:1		"Unter dem Einfluss des Vereinigten Königreichs wird eine demokratische Regierung das autoritäre Regime von Salazar stürzen und sich mit Hilfe der Briten auf die Entwicklung der nationalen Industrie konzentrieren, bevor sie sich den Alliierten anschließt."
RULE_OPTION_COMMUNIST_COMINTERN:0		"Kommunistisch"
RULE_OPTION_COMMUNIST_COMINTERN_DESC:0		"Portugal wird sich auf die Sowjetunion ausrichten, die Spanische Republik unterstützen und versuchen, der Komintern beizutreten."
RULE_OPTION_COMMUNIST_INDEPENDENT:0		"Vereinigte Europäische Sozialistische Republiken"
RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0		"Die Kommunisten werden die Regierung stürzen und gegen die spanischen Nationalisten kämpfen, um die Iberische Halbinsel als Vereinigte Europäische Sozialistische Republiken zu vereinen, die letzte europäische Bastion gegen den Faschismus."
RULE_OPTION_PORTUGALS_PATH_TO_MARXISM_LENINISM:0		"Portugals Weg zum Marxismus-Leninismus"
RULE_OPTION_PORTUGALS_PATH_TO_MARXISM_LENINISM_DESC:0		"Die portugiesischen Sozialisten werden die Regierung Salazar stürzen und damit den Grundstein für eine Diktatur des Proletariats an Europas westlichstem Zipfel legen."
RULE_OPTION_RESTORE_CIVIL_LIBERTIES:0		"Bürgerliche Freiheiten wiederherstellen"
RULE_OPTION_RESTORE_CIVIL_LIBERTIES_DESC:0		"Die portugiesischen Sozialisten werden die Regierung Salazar stürzen, und die neue revolutionäre Junta wird die liberalen Institutionen des Landes wiederherstellen."
RULE_OPTION_MONARCHIST_ORLEANIST:0		"Monarchist: Haus Orléan"
RULE_OPTION_MONARCHIST_LEGITIMIST:0		"Monarchist: Haus von Bourbon"
RULE_OPTION_MONARCHIST_BONAPARTIST:0		"Monarchist: Haus Bonapart"
RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0		"Die französische KI wird versuchen, die französische Monarchie wiederherzustellen und den orléanischen Prätendenten auf den Thron zu setzen, indem sie den entsprechenden Pfad im Fokusbaum einschlägt."
RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0		"Die französische KI wird versuchen, die französische Monarchie wiederherzustellen und den legitimistischen Thronprätendenten auf den Thron zu setzen, indem sie den entsprechenden Pfad im Fokusbaum abläuft."
RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0		"Die französische KI wird versuchen, die französische Monarchie wiederherzustellen und den bonapartistischen Thronprätendenten auf den Thron zu setzen, indem sie den entsprechenden Pfad im Fokusbaum abläuft."
RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP:1		"§Y[ROOT.GetName]§! darf §Y[KUR.GetName]§! nicht freigeben, nur Länder, die keine Kerne auf §YKurdish§! Gebiet haben, dürfen §Y[KUR.GetName]§! freigeben."
RULE_ENTENTE_LIT_AI_DESC:0		"Litauen wird versuchen, die Baltische Entente zu formalisieren und gegen die Sowjets zu bestehen."
RULE_ENTENTE_EST_AI_DESC:0		"Estland wird versuchen, die Baltische Entente zu formalisieren und gegen die Sowjets zu bestehen."
RULE_ENTENTE_LAT_AI_DESC:0		"Lettland wird versuchen, die Baltische Entente zu formalisieren und gegen die Sowjets zu bestehen."
RULE_HISTORICAL_EST_AI_DESC:0		"Die estnische KI wird den größten Teil der Kampagne neutral bleiben, aber in den 1940er Jahren zu einer sowjetischen Marionette werden."
RULE_HISTORICAL_LAT_AI_DESC:0		"Die lettische KI wird während des größten Teils der Kampagne neutral bleiben, aber in den 1940er Jahren zu einer sowjetischen Marionette werden."
RULE_HISTORICAL_LIT_AI_DESC:0		"Die litauische KI bleibt während des größten Teils der Kampagne neutral, wird aber in den 1940er Jahren zu einer sowjetischen Marionette."
RULE_OPTION_MONARCHIST_LIT_AI_DESC:0		"Litauen wird versuchen, die Monarchie wiederherzustellen und das polnisch-litauische Commonwealth zu beanspruchen."
RULE_OPTION_BALTIC_ENTENTE:0		"Baltische Entente"
RULE_OPTION_HISTORICAL_BUL_AI_DESC:0		"Zar Boris III. wird das Land auf die Seite der Achsenmächte führen. Er verlässt sich auf die deutsche Vermittlung, um die bulgarischen Grenzen friedlich zu erweitern, unterzeichnet schließlich den Dreierpakt und verzögert die bulgarische Beteiligung am Krieg."
RULE_OPTION_COMMUNIST_BUL_AI_DESC:0		"Bulgarien wird versuchen, der Komintern beizutreten und gemeinsam mit seinen sowjetischen Genossen gegen Faschismus und Kapitalismus in Europa zu kämpfen."
RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0		"Kommunistisch-Balkanische Föderation"
RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0		"Bulgarien wird versuchen, eine Balkan-Allianz zu bilden, um seine Nachbarn zu beeinflussen, die Revolution anzunehmen und schließlich den Balkan zu vereinen."
RULE_OPTION_FASCIST_BUL_AI_DESC:0		"Als der Faschismus im Lande aufsteigt, wird der rechte Führer Hristo Lukov versuchen, sich der Achse anzuschließen, um schließlich den Zaren zu stürzen und eine Militärdiktatur zu errichten."
RULE_OPTION_THE_RETURN_OF_FERDINAND:0		"Die Rückkehr von Ferdinand I."
RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0		"Nach dem Tod von Zar Boris III. wird sein Vater, Ferdinand I., erneut auf dem Thron sitzen und sich an denen rächen, die ihm vor Jahrzehnten Unrecht getan haben."
RULE_OPTION_DEMOCRATIC_SOCIALIST:0		"Demokratisch - Sozialistisch"
RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:1		"Die von Nikola Mushanov geführte Regierung wird eine sozialistische Politik verfolgen und versuchen, die Beziehungen zu den Nachbarländern zu verbessern, um eine Balkan-Konföderation zu bilden und den Balkan gegen ausländische Aggressoren zu verteidigen."
RULE_OPTION_DEMOCRATIC_LIBERAL:0		"Demokratisch - Liberal"
RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0		"Die Bulgarische Demokratische Partei wird versuchen, sich den Alliierten anzuschließen, indem sie sich gegen Zar Boris verschwört, um ihn zu entmachten und einen allianzfreundlichen Regentschaftsrat zu bilden."
RULE_OPTION_METAXIST_GRE_AI_DESC:0		"Griechenland wird eine Politik der Neutralität verfolgen und gleichzeitig die Ideen des Metaxismus entwickeln."
RULE_OPTION_MONARCHIST_GRE_AI:0		"Monarchist"
RULE_OPTION_MONARCHIST_GRE_AI_DESC:0		"Griechenland wird zu einer absoluten Monarchie und strebt den Beitritt zu den Alliierten an."
RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0		"Beitritt zu den Mittelmächten"
RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0		"Griechenland wird eine absolute Monarchie und strebt den Beitritt zu den Mittelmächten mit Deutschland oder Österreich-Ungarn an."
RULE_OPTION_STALINIST_GRE_AI:0		"Stalinistisch"
RULE_OPTION_STALINIST_GRE_AI_DESC:0		"Griechenland wird versuchen, der Komintern beizutreten und eine Schlacht um den Bosporus mit der Türkei entfachen."
RULE_OPTION_COMMUNIST_GRE_AI:0		"Kommunistisch"
RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0		"Griechenland wird versuchen, den Faschismus in Europa an der Seite des kommunistischen Jugoslawiens zu bekämpfen."
RULE_OPTION_DEMOCRATIC_GRE_AI:0		"Venezolanisches"
RULE_OPTION_VENEZELIST_GRE_AI_DESC:0		"Griechenland wird um das Recht kämpfen, die Megali Idea zu verwirklichen."
RULE_OPTION_FASCISM_GRE_AI_DESC:0		"Griechenland wird eine nationalsozialistische Republik werden und versuchen, sich an der Seite der Türkei der Achse anzuschließen."
RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0		"Anatolischer Faschist"
RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0		"Griechenland wird demokratisch, erleidet einen Zusammenbruch der Regierung und strebt dann nach den größten Ambitionen."
RULE_OPTION_HISTORICAL_TUR_AI:0		"Historische"
RULE_OPTION_HISTORICAL_TUR_AI_DESC:1		"Die Türkei wird unter der Führung von İsmet İnönü so lange wie möglich Neutralität wahren und dann versuchen, sich den Alliierten anzuschließen."
RULE_OPTION_ALTERNATE_KEMALIST_AI:0		"Alternative Kemalisten"
RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC:0		"Die Türkei wird Fevzi Çakmak zum Präsidenten ernennen, um in die Fußstapfen von Mustafa Kemal Atatürk zu treten, und so lange wie möglich Neutralität anstreben, bevor sie versucht, sich entweder der Achse oder den Alliierten anzuschließen."
RULE_OPTION_OTTOMAN:0		"Wiederherstellung des osmanischen Sultanats"
RULE_OPTION_OTTOMAN_DESC:0		"Die Republik Türkei wird zusammenbrechen, und aus ihrer Asche wird das Osmanische Sultanat wieder an die Macht kommen."
RULE_OPTION_COMMUNIST_TUR_AI:0		"Kommunismus"
RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI:0		"Unabhängiger Kommunismus"
RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC:0		"Die Türkei wird eine kommunistische Regierung übernehmen, die ihre kemalistischen Eigenschaften beibehält und versucht, eine Fraktion zu bilden."
RULE_OPTION_TUR_DEMOCRATIC_KEMALIST:0		"Demokratischer Kemalismus"
RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC:0		"Celâl Bayar wird die Türkei in eine kemalistische Demokratie umwandeln und versuchen, sich den Alliierten anzuschließen."
RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE:0		"Demokratischer Konservatismus"
RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC:0		"Adnan Menderes wird die Türkei in eine konservative Demokratie umwandeln und versuchen, sich den Alliierten anzuschließen."
RULE_OPTION_FASCISM_TUR_AI:0		"Kemalistischer Faschismus"
RULE_OPTION_FASCISM_TUR_AI_DESC:0		"Recep Peker wird die Türkei in eine faschistische Diktatur umwandeln und versuchen, sich der Achse anzuschließen."
RULE_OPTION_TUR_FASCISM_ALTERNATE:0		"Militaristischer Faschismus"
RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC:0		"Fevzi Çakmak wird die Türkei in eine konservative, quasi-faschistische Diktatur umwandeln und versuchen, sich mit Italien zu verbünden."
RULE_OPTION_BALKAN_ENTENTE:0		"Sicherung des Balkans"
RULE_OPTION_BALKAN_ENTENTE_DESC:0		"Die Türkei wird sich für die Aufrechterhaltung der Sicherheit auf dem Balkan einsetzen und versuchen, eine Fraktion mit Griechenland, Rumänien und Jugoslawien zu bilden."
RULE_FASCIST_LIT_AI_DESC:0		"Die litauische KI wird versuchen, eine faschistische Regierung zu errichten, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_FASCIST_LAT_AI_DESC:0		"Die lettische KI wird versuchen, eine faschistische Regierung zu gründen, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_FASCIST_EST_AI_DESC:0		"Die estnische KI wird versuchen, eine faschistische Regierung zu errichten, indem sie den entsprechenden Pfad im nationalen Fokusbaum absteigt."
RULE_COMMUNIST_BALTIC_AI_DESC:0		"Die KI wird versuchen, ein kommunistisches Regime zu errichten, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_HISTORICAL_ETH_AI_DESC:0		"Die äthiopische KI wird versuchen, Italien mit Hilfe der Legaue der Nationen zu besiegen, und wenn das nicht gelingt, ins Exil gehen. Danach wird sie versuchen, ihr Heimatgebiet zurückzuerobern und Äthiopien wiederaufzubauen."
RULE_OPTION_ETH_IMPERIAL:0		"Kaiserlich: Der Löwe steht fest"
RULE_ETH_IMPERIAL_AI_DESC:0		"Die äthiopische KI wird versuchen, Italien im Alleingang zu besiegen, ohne die Hilfe des Völkerbundes in Anspruch zu nehmen. Danach wird sie versuchen, ihr Imperium zu erweitern."
RULE_OPTION_ETH_STALINIST_desc:0		"Die KI wird versuchen, Äthiopien kommunistisch zu machen und die Unterstützung der Sowjetunion zu gewinnen, um es zu einer stalinistischen Marionette zu machen."
RULE_OPTION_ETH_STALINIST:0		"Kommunistisch: Sowjetische Hilfe"
RULE_OPTION_ETH_ANARCHIST:0		"Anarcho-Kommunistisch: Appell an die Welt"
RULE_OPTION_ETH_ANARCHIST_desc:0		"Die KI wird versuchen, Äthiopien mit der Unterstützung von Kommunisten und Anarchisten aus der ganzen Welt in eine anarcho-kommunistische Föderation zu verwandeln."
RULE_OPTION_ETH_COLLABORATIONIST:0		"Faschistisch: Kollaborateur"
RULE_OPTION_ETH_COLLABORATIONIST_desc:0		"Die KI fällt Haile Selassie in den Rücken und stellt sich auf die Seite der Italiener, wodurch Äthiopien zu einer faschistischen Marionette wird."
RULE_OPTION_ETH_INDEPENDENT_FASCIST:0		"Faschistisch: Unabhängig"
RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0		"Die KI fällt Haile Selassie in den Rücken und stellt sich auf die Seite der Italiener, so dass Äthiopien zu einer faschistischen Marionette wird. Das Land wird jedoch versuchen, sich zu befreien und eine unabhängige faschistische Nation zu werden. "
RULE_HISTORICAL_SWI_AI_DESC:0		"Die Schweiz wird neutral bleiben, aber ihre Milizen und Befestigungen ausbauen, um sich auf einen Angriff vorzubereiten. Gegen Ende des Krieges wird sie den Alliierten etwas Unterstützung zukommen lassen."
RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0		"Alliierte Demokraten"
RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0		"Die KI bewaffnet die Schweiz und bereitet sich auf den Krieg vor. Die Schweiz schließt sich den demokratischen Mächten der Welt an und bricht schließlich ihre Neutralität zugunsten der Alliierten."
RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0		"Expansionistische Demokratie"
RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0		"Die KI wird versuchen, die Staaten um die Schweiz herum davon zu überzeugen, der Konföderation beizutreten, und wird das Land aufrüsten, um sich auf den Besitz derjenigen Staaten vorzubereiten, die sich weigern, ihre Staaten frei zu lassen."
RULE_OPTION_SWI_IMPERIAL:0		"Imperiale"
RULE_OPTION_SWI_IMPERIAL_AI_DESC:1		"Die KI wird versuchen, das Alpenprotektorat zu bilden, indem sie Neutralität und Demokratie zugunsten eines militaristischen und expansionistischen Regimes aufgibt."
RULE_OPTION_SWI_FASCIST:1		"Faschistisch"
RULE_OPTION_SWI_FASCIST_AI_DESC:1		"Die KI wird die Schweiz dazu bringen, sich mit Deutschland zu verbünden und das Land langsam faschistisch zu machen, um sich schließlich entweder mit der Achse zu verbünden oder eine deutsche Marionette zu werden."
RULE_OPTION_MONARCHIST_ALB_AI_DESC:0		"Die Herrschaft von Zog wird verfassungsrechtlich verankert und es werden Kriegsvorbereitungen getroffen, die jedoch nie zum Einsatz kommen."
RULE_OPTION_COMMUNIST_ALB_AI_DESC:0		"Die Kommunisten werden versuchen, den König zu stürzen und zu töten."
RULE_OPTION_FASCIST_ALB_AI_DESC:0		"Zogs Macht wird weiter gefestigt."
RULE_OPTION_DEMOCRATIC_ALB_AI_DESC:0		"König Zog wird ins Exil geschickt und der italienische Einfluss wird aufgegeben."
RULE_GROUP_GENERAL_UI:0		"UI"
OBSOLETE_FOCUS_BRANCHES_VISIBILITY:0		"Veraltete Zweige im Fokusbaum anzeigen"
RULE_OPTION_HIDE:0		"Ausblenden"
RULE_OPTION_HIDE_DESC:0		"Bestimmte veraltete Zweige werden unter bestimmten Umständen ausgeblendet, um die Navigation im Fokusbaum zu erleichtern."
RULE_OPTION_SHOW:0		"Anzeigen"
RULE_OPTION_SHOW_DESC_DESC:0		"Veraltete Zweige bleiben im Fokusbaum immer sichtbar."
LON_NON_INTERFERENCE_RESOLUTION_CALL:0		"[FROM.GetNameDefCap] kann aufgrund einer Nicht-Einmischungsresolution des Völkerbundes nicht aufgerufen werden"
LON_NON_INTERFERENCE_RESOLUTION_JOIN:0		"Sie können [FROM.GetNameDef] aufgrund einer Nicht-Einmischungsresolution des Völkerbundes nicht beitreten"
RULE_VOLUNTEERS_ETHIOPIA_ONLY_ONE_TT:0		"Sie können derzeit nur freiwillige Einheiten zu [ETH.GetName] schicken"
POL_surprise_attack_shock_idea_CALL:0		"Ihr Fraktionsführer hat beschlossen, [FROM.GetNameDef] nicht bei der Verteidigung gegen die [SOV.GetAdjective] zu helfen."
POL_surprise_attack_shock_idea_JOIN:0		"[FROM.GetNameDefCap] kann nicht einberufen werden, weil der Anführer der Fraktion beschlossen hat, die Verteidigung gegen [SOV.GetAdjective] nicht zu unterstützen."
RULE_GROUP_PEACE_SCORE:0		"Verteilung der Friedenspunkte"
PEACE_SCORE_TO_OVERLORD:0		"Marionetten an Overlord"
RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0		"Marionetten geben einen Teil ihres Friedenspunktes an ihren Overlord ab. Das Verhältnis hängt von ihrer Autonomiestufe ab."
RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0		"Die Marionetten behalten den gesamten Friedenspunkt, den sie während des Krieges verdient haben."
PEACE_SCORE_TO_FACTION_LEADER:0		"Fraktionsmitglieder an den Fraktionsführer"
RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0		"Fraktionsmitglieder geben 10% ihres Friedenspunktes an den Fraktionsführer ab."
RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC:0		"Die Fraktionsmitglieder behalten alle Friedenspunkte, die sie während des Krieges verdient haben."
PEACE_SCORE_RESET_LOW_SCORES:0		"Niedrige Punktzahlen umverteilen"
RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0		"Gewinner mit weniger als 5% Kriegsbeteiligung geben ihren gesamten Punktestand an andere Gewinner ab.\nGilt nicht, wenn kein Gewinner mindestens 10% Kriegsbeteiligung hat.\nGilt nicht für menschliche Spieler."
RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC:0		"Alle Gewinner behalten alle Friedenspunkte, die sie während des Krieges verdient haben."
RULE_HISTORICAL_SWE_AI_DESC:		"Die KI wird versuchen, das schwedische Militär aufzurüsten und dabei neutral und demokratisch zu bleiben. Sie wird es sorgfältig vermeiden, mit den Achsenmächten und der Komintern in Konflikt zu geraten, kann aber den Alliierten im späteren Verlauf des Krieges begrenzte Unterstützung anbieten."
RULE_OPTION_SWE_DEM_ALT:		"Demokratische Alternative"
RULE_OPTION_SWE_DEM_ALT_DESC:		"Die schwedische KI wird den demokratischen Weg einschlagen, sich aber eher aktiv in den Krieg einmischen, indem sie schneller aufrüstet und eine eher rechtsgerichtete Politik verfolgt."
RULE_OPTION_SWE_COMMUNISM:		"Kommunismus"
RULE_OPTION_SWE_COMMUNISM_DESC:		"Die schwedische KI wird den kommunistischen Weg einschlagen und sich entweder mit den Achsenmächten oder den Alliierten verbünden."
RULE_OPTION_SWE_FASCIST_INDEPENDENT:		"Unabhängiger Faschist"
RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC:		"Die schwedische KI wird den faschistischen Weg einschlagen, unabhängig bleiben und versuchen, das Große Nordische Königreich zu bilden"
RULE_OPTION_SWE_FASCIST_PUPPET:		"Gehorsames Reichskommissariat Faschistisch"
RULE_OPTION_SWE_FASCIST_PUPPET_DESC:		"Die schwedische KI wird den faschistischen Weg einschlagen, sich Deutschland unterordnen und ihrem Oberherrn gegenüber gehorsam bleiben."
RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:		"Verräterisches Reichskommissariat Faschist"
RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC:		"Die schwedische KI wird den faschistischen Weg einschlagen, sich Deutschland unterordnen und sich von ihm lösen, wenn die Zeit reif ist."
RULE_OPTION_SWE_UNALIGNED:		"Monarchist"
RULE_OPTION_SWE_UNALIGNED_DESC:		"Die schwedische KI wird den bündnisfreien Weg einschlagen, den König wieder an die Macht bringen und versuchen, das Große Nordische Königreich zu gründen."
RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL:		"Nordischer Verteidigungsrat"
RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:		"Die KI wird versuchen, den Nordischen Verteidigungsrat zu gründen, um die Nordländer zu schützen."
RULE_OPTION_NOR_STALINIST:		"Stalinistisch"
RULE_OPTION_NOR_STALINIST_AI_DESC:		" Die KI wird versuchen, die Popularität des Kommunismus zu steigern, indem sie Norwegen mit Stalins Sowjetunion oder dem größten nichtstalinistischen kommunistischen Land verbündet, wenn Stalin gestürzt wurde."
RULE_OPTION_NOR_TROSTSKYIST:		"§RR§! Trotzkist"
RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:		"Die KI wird versuchen, Lew Trotzkij in Norwegen zu halten und seinen kommunistischen Grundsätzen zu folgen, indem sie sich gegen die Sowjetunion wendet, wenn diese stalinistisch bleibt, und sich mit ihr verbündet, wenn Trotzkij ihr Anführer wird. \n\n§RR§! ist nicht mit dem Baum Road to 56 kompatibel, wenn Sie diesen wählen, ohne Waffen gegen Tyrannei zu besitzen, wird eine zufällige Option für die KI gewählt."
RULE_OPTION_NOR_FASCIST:		"Faschist"
RULE_OPTION_NOR_FASCIST_AI_DESC:		"Die KI lässt den Einfluss des Faschismus mit der Zeit wachsen und verbündet sich schließlich mit dem Dritten Reich oder dem größten faschistischen Land, wenn Deutschland nicht mehr faschistisch ist."
RULE_OPTION_NOR_MONARCHIST:		"Monarchistisch"
RULE_OPTION_NOR_MONARCHIST_AI_DESC:		"Die KI wird König Haakon VII. unter Druck setzen, das Storting aufzulösen und Norwegen in eine oligarchische Monarchie zu verwandeln."
RULE_HISTORICAL_FIN_AI_DESC:		"Die finnische KI wird versuchen, der historischen Kette von Ereignissen so weit wie möglich zu folgen."
RULE_HISTORICAL_DEN_AI_DESC:		"Die dänische KI wird versuchen, sich aus allen Konflikten herauszuhalten und den historischen Ereignissen so weit wie möglich zu folgen. Wenn sie zum Untertan wird, wird sie versuchen, langsam Unterstützung bei ausländischen Mächten aufzubauen, um schließlich ihre Unabhängigkeit wieder zu behaupten."
RULE_OPTION_DEN_REARMAMENT:		"§RR§!§GS§! Dänisches Aufrüsten"
RULE_OPTION_DEN_REARMAMENT_AI_DESC:		"Dänemark wird versuchen, sich mit stärkeren Nationen zu verbünden und sich gegen Invasionsversuche zu wehren. \n\n§RR§! ist nicht mit dem Baum Road to 56 kompatibel. Wenn Sie diesen wählen, ohne Waffen gegen Tyrannei zu besitzen, wird eine zufällige Option für die KI gewählt."
RULE_OPTION_DEN_MONARCHIST:		"§GR§!§GS§! Monarchist"
RULE_OPTION_DEN_MONARCHIST_AI_DESC:		"König Christian X entlässt die Regierung und übernimmt die absolute Macht.\n\n§GR§! ist §Gfully§!kompatibel mit dem gewählten Road to 56 Fokusbaum.\n\n§GS§! ist §Gfully§!kompatibel mit dem gewählten DLC Fokusbaum."
RULE_OPTION_DEN_FASCIST:		"§GR§!§GS§! Faschist"
RULE_OPTION_DEN_FASCIST_AI_DESC:		"Die Faschistische Partei wird versuchen, die Macht in Dänemark zu übernehmen und das alte Nordseeimperium wiederherzustellen.\n\n§GR§! ist §Gfully§! kompatibel mit dem gewählten Fokusbaum Road to 56.\n\n§GS§! ist §Gfully§! kompatibel mit dem gewählten DLC-Fokusbaum."
RULE_HISTORICAL_ICE_AI_DESC:		"Die isländische KI wird versuchen, ihre Neutralität zu wahren und bei Bedarf den Schutz der USA suchen."
RULE_OPTION_ICE_SUPPORT:		"Unterstützung für Dänemark"
RULE_OPTION_ICE_SUPPORT_AI_DESC:		"Die isländische KI wird versuchen, eine dänische Verteidigung gegen jeden Angreifer zu unterstützen"
RULE_OPTION_ICE_FASCIST:		"Faschistisch"
RULE_OPTION_ICE_FASCIST_AI_DESC:		"Die isländische KI wird den dänischen König denunzieren und versuchen, ein faschistisches Imperium in der Nordsee zu errichten."
RULE_OPTION_ICE_COMMUNIST:		"Kommunistisch"
RULE_OPTION_ICE_COMMUNIST_AI_DESC:		"Die isländische KI wird die Monarchie anprangern und einen kommunistischen Staat in Island errichten."
RULE_HISTORICAL_NOR_AI_DESC:		"Norwegen wird versuchen, demokratisch zu bleiben und der deutschen Invasion zu widerstehen, bevor es als Exilregierung an der Seite der Alliierten weiterkämpft."
RULE_OPTION_HISTORICAL_PAR_AI_DESC:		"Die KI wird sich aus der Weltpolitik heraushalten und sich auf interne Probleme konzentrieren, die durch Instabilitäten verursacht werden, die sie aus dem Krieg heraushalten."
RULE_OPTION_COMMUNIST_PAR_AI_DESC:		"Die KI wird die kommunistische Regierung von Rafael Franco behalten und sich an Bolivien für den Chaco-Krieg rächen wollen."
RULE_OPTION_COMMUNIST_PAR_AI:		"Kommunistisch"
RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:		"Die KI wird gegen den Putsch von Rafael Franco kämpfen und in einen Bürgerkrieg eintreten, um zu versuchen, ihre demokratische Regierung aufrechtzuerhalten."
RULE_OPTION_DEMOCRATIC_PAR_AI:		"Demokratisch"
RULE_OPTION_MONARCHIST_ALCANTARA:		"Monarchistisch - Dom Pedro de Alcântara"
RULE_OPTION_MONARCHIST_ALCANTARA_DESC:		"Die KI wird versuchen, das Kaiserreich Brasilien zu reformieren, indem sie Unterstützung für Pedro de Alcântara als rechtmäßigen Thronfolger gewinnt. Sie wird dann versuchen, die Wiedervereinigung mit Portugal durch Diplomatie oder Gewalt zu erreichen."
RULE_OPTION_BRA_COMMUNIST_STALINISM:		"Kommunismus - Luís Carlos Prestes"
RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:		"Brasilien wird versuchen, die demokratische Regierung zu stürzen und durch eine sowjetisch orientierte, kommunistische Regierung unter der Führung von Luís Carlos Prestes zu ersetzen. Anschließend wird es der Komintern beitreten und die Sowjetunion unterstützen."
RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:		"Kommunismus - Aliança Nacional Libertadora"
RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:		"Brasilien wird die ANL wiederauferstehen lassen und versuchen, die demokratische Regierung zu stürzen. Sie wird durch den ANL-Rat ersetzt, der dann kommunistische Reformen durchführt, bevor er schließlich versucht, den Kontinent von Faschismus und Imperialismus zu befreien."
COG_AI_BEHAVIOR:		"@COG Belgisch-Kongo"
RULE_OPTION_HISTORICAL_COG_AI_DESC:		"Die kongolesische KI wird bei Belgien bleiben und ihre Beziehungen zu dieser Nation voll ausschöpfen, um schließlich eine größere Autonomie anzustreben."
RULE_OPTION_COG_DEM_INDEPENDENCE_AI:		"Demokratische Emanzipationsbewegungen"
RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:		"Die kongolesische KI wird versuchen, so schnell wie möglich mit friedlichen Mitteln ihre Unabhängigkeit zu erlangen und sich später für Demokratie in ganz Afrika einsetzen."
RULE_OPTION_COG_COM_INDEPENDENCE_AI:		"Kommunistische Emanzipationsbewegungen"
RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:		"Die kongolesische KI wird versuchen, ihre Unabhängigkeit so schnell wie möglich mit friedlichen Mitteln zu erlangen und später versuchen, den Kommunismus in ganz Afrika zu verbreiten."
RULE_OPTION_COG_COM_REVOLUTION_AI:		"Die Revolution von Simba"
RULE_OPTION_COG_COM_REVOLUTION_AI_DESC:		"Die kongolesische KI wird versuchen, sich durch eine gewaltsame Revolution und einen anschließenden Bürgerkrieg von ihren kolonialen Oberherren zu befreien, und wird dann versuchen, den Kommunismus auf dem gesamten afrikanischen Kontinent zu verbreiten."
RULE_OPTION_HISTORICAL_AUS_AI_DESC:		"Die KI wird faschistisch und versucht, den Anschluss mit der Vaterländischen Front an der Spitze abzuwehren."
RULE_OPTION_MONARCHIST_PUPPET_AUS_AI:		"Monarchistisch - Unterwerfung"
RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC:		"Die KI wird versuchen, das österreichisch-ungarische Reich zu reformieren, indem sie ihr Militär wieder aufbaut und die Unterwerfung der Länder fordert, die jetzt ihre alten Länder besetzen."
RULE_OPTION_MONARCHIST_ANNEX_AUS_AI:		"Monarchist - Annexion"
RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC:		"Die KI wird versuchen, das österreichische Kaiserreich zu reformieren, indem sie ihr Militär wieder aufbaut und dann expandiert und ihre alten verlorenen Territorien annektiert."
RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI:		"Blockfrei - Föderativ"
RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:		"Die KI wird versuchen, die Donau-Föderation zu gründen, indem sie andere Nationen entlang der Donau zu einer bündnisfreien Herrschaft einlädt."
RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI:		"Sowjetisch Österreichisch"
RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:		"Die KI wird versuchen, kommunistisch zu werden und die Regierung zu stürzen, bevor sie sich mit der UdSSR verbündet und der Komintern beitritt."
RULE_OPTION_AUS_COMMUNIST_AI:		"Kommunistisch"
RULE_OPTION_AUS_COMMUNIST_AI_DESC:		"Die KI wird versuchen, kommunistisch zu werden und die Regierung zu stürzen. Sie halten sich an eine strikt austromarxistische Agenda und werden eine eigene Fraktion gründen"
RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:		"Österreichisch Demokratisch - Föderativ"
RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:		"Die KI wird versuchen, die Donau-Föderation zu gründen, indem sie andere Nationen entlang der Donau zu einer demokratischen Herrschaft einlädt."
RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI:		"Österreichisch-Demokratisch - Verbündete"
RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:		"Die KI wird versuchen, sich den Alliierten anzuschließen, indem sie die Demokratie in Österreich wiederherstellt."
RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:		"Österreichisch-Demokratisch - Alpenföderation"
RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:		"Die KI wird versuchen, die Demokratie in Österreich wiederherzustellen und die Alpenföderation zu gründen."
RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:		"Variante Historisch - Östfrei!"
RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC:		"Die KI folgt weitgehend dem historischen Weg, wird aber versuchen, den Anschluss mit allen Mitteln zu verhindern und bis zum bitteren Ende für ihre Unabhängigkeit zu kämpfen. Dies könnte eine Herausforderung oder eine Verzögerung des Kriegsausbruchs darstellen."
