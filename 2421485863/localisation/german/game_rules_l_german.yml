RULE_OPTION_RANDOM_AI_DESC:0			"Die KI wird sich zu Beginn des Spiels zufällig für einen Spielplan entscheiden und versuchen, diesen auszuführen."
RULE_OPTION_FASCIST_GER_AI_DESC:0			"Die deutsche KI wird faschistisch bleiben und versuchen, Europa zu übernehmen, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_OPTION_GER_ALT_FASCIST:			"Alternativer Faschismus"
RULE_OPTION_GER_ALT_FASCIST_AI_DESC:			"Die deutsche KI wird versuchen, Hitler durch eines der Mitglieder des Inneren Kreises zu ersetzen, die Bedenken von Neuraths zu berücksichtigen und ihre Neue Weltordnung durchzusetzen."
RULE_FASCIST_JAP_AI_DESC:0			"Die japanische KI wird versuchen, die westlichen Verbündeten im Süden anzugreifen, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_OPTION_COMMUNIST_JAP_AI_DESC:0			"Die japanische KI wird versuchen, kommunistisch zu werden und andere kommunistische Regime in Asien zu unterstützen, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_OPTION_NEUTRALITY_JAP_AI_DESC:0			"Die japanische KI wird versuchen, die Sowjetunion im Norden anzugreifen und mit den Achsenmächten gemeinsame Sache zu machen, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_DEMOCRATIC_JAP_AI_DESC:0			"Die japanische KI wird versuchen, sich zu einer Demokratie zu reformieren, indem sie den entsprechenden Pfad im Fokusbaum einschlägt."
RULE_FASCIST_HISTORICAL_ITA_AI_DESC:0			"Die italienische KI wird versuchen, der historischen Kette von Ereignissen so weit wie möglich zu folgen."
