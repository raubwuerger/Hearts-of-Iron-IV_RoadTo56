RULE_ALLOW_WARGOALS:0			"Kriegsziele"
RULE_OPTION_ALWAYS_FREE:0			"Immer frei"
RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0			"Uneingeschränkt für jede Ideologie bei jeder Weltspannung."
RULE_OPTION_LIMITED:0			"Begrenzt"
RULE_ALLOW_WARGOALS_LIMITED_DESC:0			"Die Generierung von Kriegszielen ist durch Ideologien und die Grenzen der Weltspannung begrenzt."
RULE_OPTION_FREE_25:0			"Frei bei 25% Weltspannung"
RULE_OPTION_FREE_50:0			"Frei bei 50% Weltspannung"
RULE_OPTION_FREE_75:0			"Frei bei 75% Weltspannung"
RULE_OPTION_FREE_100:0			"Frei bei 100% Weltspannung"
RULE_ALLOW_WARGOALS_FREE_25_DESC:1			"Die Generierung von Kriegszielen ist unterhalb von 25% Weltspannung deaktiviert, aber danach für alle Nationen verfügbar. Dies setzt alle Ideologiebeschränkungen außer Kraft, ermöglicht aber weiterhin die Erzielung von Kriegszielen durch Schwerpunkte."
RULE_ALLOW_WARGOALS_FREE_50_DESC:1			"Die Erzeugung von Kriegszielen ist unterhalb von 50% Weltspannung deaktiviert, danach aber für alle Nationen verfügbar. Dies setzt alle ideologischen Beschränkungen außer Kraft, ermöglicht aber immer noch das Erreichen von Kriegszielen durch Fokusse."
RULE_ALLOW_WARGOALS_FREE_75_DESC:1			"Die Erzeugung von Kriegszielen ist unterhalb von 75% Weltspannung deaktiviert, danach aber für alle Nationen verfügbar. Dies setzt alle ideologischen Beschränkungen außer Kraft, ermöglicht aber immer noch das Erreichen von Kriegszielen durch Fokusse."
RULE_ALLOW_WARGOALS_FREE_100_DESC:1			"Die Erzeugung von Kriegszielen ist unterhalb von 100% Weltspannung deaktiviert, danach aber für alle Nationen verfügbar. Dies setzt alle ideologischen Beschränkungen außer Kraft, ermöglicht aber immer noch das Erreichen von Kriegszielen durch Fokusse."
RULE_OPTION_FOCUSES_ONLY:0			"Nur Foki"
RULE_ALLOW_WARGOALS_FOCUSES_ONLY_DESC:0			"Kriegsziele können nur aus nationalen Schwerpunkten, Ereignissen und Entscheidungen gewonnen werden."
RULE_OPTION_FOCUSES_ONLY_38:0			"Nur Foki (bis 1938)"
RULE_ALLOW_WARGOALS_FOCUSES_ONLY_38_DESC:0			"Bis 1938 können Kriegsziele nur durch nationale Fokusse, Ereignisse und Entscheidungen erreicht werden."
RULE_OPTION_FOCUSES_ONLY_39:0			"Nur Fokusse (bis 1939)"
RULE_ALLOW_WARGOALS_FOCUSES_ONLY_39_DESC:0			"Kriegsziele können nur durch nationale Schwerpunkte, Ereignisse und Entscheidungen bis 1939 erreicht werden."
RULE_OPTION_FOCUSES_ONLY_40:0			"Nur Foki (bis 1940)"
RULE_ALLOW_WARGOALS_FOCUSES_ONLY_40_DESC:0			"Kriegsziele können bis 1940 nur durch nationale Fokusse, Ereignisse und Entscheidungen erreicht werden."
