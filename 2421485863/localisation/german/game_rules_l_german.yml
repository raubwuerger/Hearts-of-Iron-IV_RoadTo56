RULE_OPTION_RANDOM_AI_DESC:0		"Die KI wird sich zu Beginn des Spiels zufällig für einen Spielplan entscheiden und versuchen, diesen auszuführen."
RULE_OPTION_FASCIST_GER_AI_DESC:0		"Die deutsche KI wird faschistisch bleiben und versuchen, Europa zu übernehmen, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_OPTION_GER_ALT_FASCIST:		"Alternativer Faschismus"
RULE_OPTION_GER_ALT_FASCIST_AI_DESC:		"Die deutsche KI wird versuchen, Hitler durch eines der Mitglieder des Inneren Kreises zu ersetzen, die Bedenken von Neuraths zu berücksichtigen und ihre Neue Weltordnung durchzusetzen."
RULE_FASCIST_JAP_AI_DESC:0		"Die japanische KI wird versuchen, die westlichen Verbündeten im Süden anzugreifen, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_OPTION_COMMUNIST_JAP_AI_DESC:0		"Die japanische KI wird versuchen, kommunistisch zu werden und andere kommunistische Regime in Asien zu unterstützen, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_OPTION_NEUTRALITY_JAP_AI_DESC:0		"Die japanische KI wird versuchen, die Sowjetunion im Norden anzugreifen und mit den Achsenmächten gemeinsame Sache zu machen, indem sie den entsprechenden Pfad im nationalen Fokusbaum einschlägt."
RULE_DEMOCRATIC_JAP_AI_DESC:0		"Die japanische KI wird versuchen, sich zu einer Demokratie zu reformieren, indem sie den entsprechenden Pfad im Fokusbaum einschlägt."
RULE_FASCIST_HISTORICAL_ITA_AI_DESC:0		"Die italienische KI wird versuchen, der historischen Kette von Ereignissen so weit wie möglich zu folgen."
RULE_FASCIST_ALTERNATE_ITA_AI_DESC:0		"Die italienische KI wird versuchen, ein Bündnis mit Spanien einzugehen, bevor sie sich der Achse anschließt, indem sie den entsprechenden Zweig im nationalen Fokusbaum absteigt."
RULE_OPTION_ALT_FASCIST_BALBO:0		"Alternative Faschisten - Rom-Protokolle"
RULE_ALT_FASCIST_BALBO_ITA_AI_DESC:0		"Die italienische KI wird versuchen, Mussolini von der Macht zu verdrängen und stattdessen Italo Balbo einsetzen, um einen unabhängigen Weg nach vorne zu finden."
RULE_OPTION_ALT_FASCIST_GRANDI:0		"Alternative Faschisten - Pro-Alliierte"
RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC:0		"Die italienische KI wird versuchen, Mussolini von der Macht zu verdrängen und stattdessen Dino Grandi einsetzen, um die Beziehungen zu den Alliierten zu stärken."
RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE:0		"Monarchistisch - Römisches Reich"
RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE_AI_DESC:0		"König Vittorio Emanuele wird Italien zu einer absolutistischen Monarchie führen und versuchen, Mare Nostrum zu erreichen und das Römische Reich zu reformieren."
RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY:0		"Christliche Demokratie"
RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC:0		"König Vittorio Emanuele wird Mussolini absetzen, versuchen, eine unabhängige Fraktion zu bilden und Italien zu einer konstitutionellen Monarchie führen, die die christdemokratische Partei unter der Führung von Alcide de Gasperi favorisiert."
RULE_OPTION_ITA_COMMUNIST_PLAN:0		"Italienischer Kommunismus"
RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0		"Italienische Antifaschisten schließen sich zusammen, um das faschistische Regime mit Gewalt zu stürzen, eine kommunistische Regierung zu bilden, die Kolonien abzuschaffen und den Beitritt zur Komintern anzustreben."
RULE_OPTION_ITA_DEMOCRATIC_PLAN:0		"Italienischer Sozialismus"
RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0		"Die italienischen Antifaschisten werden sich zusammenschließen, um das faschistische Regime gewaltsam zu stürzen, eine sozialdemokratische Regierung zu bilden und eine Konföderation mit den ehemaligen Kolonien in Afrika anzustreben."
RULE_KAISER_GER_AI_DESC:0		"Die deutsche KI wird versuchen, den Kaiser wieder auf den Thron zu setzen, indem sie den entsprechenden Weg im nationalen Fokusbaum einschlägt."
RULE_DEMOCRATIC_GER_AI_DESC:0		"Die deutsche KI wird versuchen, eine konstitutionelle Monarchie zu errichten, indem sie die entsprechenden Pfade im nationalen Fokusbaum beschreitet."
RULE_OPTION_HUN_ROME_PROTOCOLS:		"Die Römischen Protokolle wiederherstellen"
RULE_OPTION_HUN_FASCIST_KING:		"Der faschistische König"
RULE_OPTION_HUN_DEMOCRATIC_KING:		"Der demokratische König"
RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:0		"Die ungarische KI wird versuchen, das österreichisch-ungarische Reich wiederherzustellen, indem sie den entsprechenden Pfad im nationalen Fokusbaum beschreitet."
RULE_FASCIST_HUN_AI_DESC:0		"Die ungarische KI geht den Pfad des nationalen Fokusbaums hinunter, der der Geschichte am nächsten kommt, und versucht, sich der Achse anzuschließen."
RULE_FASCIST_ALTERNATE_HUN_AI_DESC:0		"Die ungarische KI wird versuchen, eine Fraktion mit Italien und Österreich zu bilden, indem sie den entsprechenden Pfad im Fokusbaum hinuntergeht."
RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC:		"Die ungarische KI wird einen faschistischen König wählen und sich der Achse anschließen."
RULE_OPTION_HUN_HABSBURG_HUNGARY:		"A Habsburgisches Ungarn"
RULE_HABSBURG_HUNGARY_HUN_AI_DESC:		"Die ungarische KI wählt Joseph August zu ihrem König und stellt Großungarn wieder her, allerdings unter habsburgischer Herrschaft."
RULE_OPTION_HUN_HORTHYIST_KING_HUNGARY:		"Eine neue Dynastie"
