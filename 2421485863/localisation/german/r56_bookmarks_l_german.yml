POR_GATHERING_STORM_DESC:0				"Following two decades of a republic defined by a ruinous Great War intervention, and armed revolts against many tried forms of government, esteemed general Óscar Carmona launched a 1926 military coup, forming a nationalist dictatorship of the right.\n\nYoung economist António de Oliveira Salazar, initially Carmona's humble but powerful finance minister, moved toward austerity, and against The Great Depression; uniting the right in his corporatist Estado Novo, where he serves as president of the Council of Ministers. Can his regime survive the Iberian peninsula's coming storm?"
