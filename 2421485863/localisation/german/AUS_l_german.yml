AUS_border_war_liechtenstein_category:0	"Intervention in [LIE.GetNonIdeologyName]"
AUS_border_war_liechtenstein_category_desc:0	"[LIE.GetNameDefCap] war schon immer ein Staat, der unserer Regierung gefolgt ist, aber mit den jüngsten Veränderungen in der Welt scheint es, dass diese Beziehung belastet ist. Wir müssen intervenieren und in [LIE.GetNonIdeologyName] wieder eine freundliche Regierung einsetzen."
