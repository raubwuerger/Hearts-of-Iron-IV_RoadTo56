AUS_crush_nazis_effect:0	"Die Nazipräsenz wird zerschlagen, und wir sind nicht länger von einem Bürgerkrieg bedroht."
AUS_nazis_crushed:0	"Die Nazipräsenz wurde §Yzerschlagen§!"
AUS_civil_war_triggered:0	"Der §YDritte Österreichische Bürgerkrieg§! hat begonnen"
AUS_bundeslaender_reversed_tt:0	"Das Minispiel §YJuly Followed June§! wird §Yreversed§!, und Sie spielen die Seite der §ONazi§!."
AUS_prepare_for_civilwar:0	"§Es wäre klug, diesen Schwerpunkt erst dann zu setzen, wenn wir eine ausreichende Anzahl von Divisionen kontrollieren!§!"
AUS_crackdown_time_down_tt:0	"Die Zeit, die es braucht, um gegen die Nazis vorzugehen, wird §Glowered§!."
AUS_recall_gunther_adolf_burstyn:0	"Rufen Sie Gunther Adolf Burstyn zurück"
AUS_fascism_ideology_desc:0	"Als einzigartige Verschmelzung von Mussolinis Faschismus und dem Klerikalfaschismus ist der §YAustrofaschismus§! eine rechtsextreme Bewegung, die während der schrittweisen Umwandlung der Republik in den Bundesstaat durch Engelbert Dolfuss entstanden ist. \n\nAls formale Ideologie der VF vertritt der Austrofaschismus einen radikalen katholischen Nationalismus§! und einen staatlichen Korporatismus§! sowie eine harte Opposition gegen den Nationalsozialismus und jede Vereinigung zwischen Österreich und Deutschland, da er die protestantische Mehrheit des letzteren als Bedrohung für die österreichische katholische Identität ansieht."
AUS_clerical_fascism_desc:0	"Der Austrofaschismus§!, eine einzigartige Mischung aus Mussolinis Faschismus und dem Klerikalfaschismus, ist eine rechtsextreme Bewegung, die während Engelbert Dolfuss' allmählicher Umwandlung der Republik in einen Bundesstaat entstand. \n\nAls formale Ideologie der VF vertritt der Austrofaschismus einen radikalen katholischen Nationalismus§! und einen staatlichen Korporatismus§! sowie eine harte Opposition gegen den Nationalsozialismus und jede Vereinigung zwischen Österreich und Deutschland, da er die protestantische Mehrheit des letzteren als Bedrohung der österreichischen katholischen Identität ansieht."
AUS_democratic_socialism_desc:0	"Der Austromarxismus§!, eine einzigartige Form des Sozialismus, die von SDAPÖ-Führern wie Victor Adler zu Zeiten der österreichisch-ungarischen Monarchie entwickelt wurde, ist eine linke Ideologie, die versucht, den Nationalismus§! mit dem Sozialismus§! im kaiserlichen Kontext§! in Einklang zu bringen. \n\nNach dem Untergang des Kaiserreichs wurde der Austromarxismus von der SDAPÖ in eine breit angelegte Ideologie umgewandelt, die eine Synthese zwischen §RSozialdemokratie§! und §ORevolutionärem Sozialismus§! anstrebt und glaubt, dass das Klassenbewusstsein mit organischen Mitteln durch die Aufrechterhaltung der nationalen Autonomie erreicht werden kann."
AUS_socialism_desc:0	"Eine einzigartige Form des Sozialismus, die von SDAPÖ-Führern wie Victor Adler zu Zeiten der österreichisch-ungarischen Monarchie geschmiedet wurde. Der §YAustromarxismus§! ist eine linke Ideologie, die versucht, den §8Nationalismus§! mit dem §RSozialismus§! im §gimperialen Kontext§! zu versöhnen. \n\nNach dem Untergang des Kaiserreichs wurde der Austromarxismus von der SDAPÖ zu einer breit angelegten Ideologie umgestaltet, die eine Synthese zwischen §RSozialdemokratie§! und §ORevolutionärem Sozialismus§! zu bilden versucht und glaubt, dass das Klassenbewusstsein durch die Aufrechterhaltung der nationalen Autonomie mit organischen Mitteln erreicht werden kann."
AUS_construct_the_tullnerfeld_airbase:0	"Bau des Fliegerhorstes Tullnerfeld"
AUS_construct_the_tullnerfeld_airbase_desc:0	"Die Pläne für den Bau eines Luftwaffenstützpunktes auf dem Tullnerfeld liegen seit langem in der Schublade. Im Norden tobt der Krieg, und es gibt keinen besseren Zeitpunkt, um diese Pläne in die Tat umzusetzen."
AUS_announce_the_new_austrian_air_force:0	"Kündigen Sie die neuen Luftstreitkräfte an"
AUS_announce_the_new_austrian_air_force_desc:0	"Seit dem Großen Krieg ist das Flugzeug die faszinierende neue potenzielle Waffe der Zukunft. Andere Nationen können uns nicht hinter sich lassen; wir haben unsere Luftstreitkräfte seit Jahren im Geheimen aufgebaut und sind nun bereit, sie zu verkünden."
AUS_german_aeronautic_cooperation:0	"[GER.GetAdjective] Aeronautische Zusammenarbeit"
AUS_german_aeronautic_cooperation_desc:0	"[GER.GetAdjective] Die Technik hat fast jeden Bereich der Kriegsführung revolutioniert, auch die Luftkriegsführung. Wir haben viel gemeinsam und allen Grund, in unseren technologischen Bestrebungen zu kooperieren. Aber der Zugang, den wir ihnen gewähren, wird es ihnen ermöglichen, unsere Politik zu beeinflussen."
AUS_british_aeronautic_cooperation:0	"[ENG.GetAdjective] Zusammenarbeit in der Luftfahrt"
AUS_british_aeronautic_cooperation_desc:0	"[ENG.GetNameDefCap] ist verzweifelt auf der Suche nach Freunden in Mitteleuropa, und wir brauchen ihr technologisches Know-how. Ihre Luftwaffe ist eine der stärksten weltweit, und wir können mit nur geringem Verlust an internem Einfluss daran teilhaben."
AUS_soviet_aeronautic_cooperation:0	"[SOV.GetAdjective] Zusammenarbeit in der Luftfahrt"
AUS_soviet_aeronautic_cooperation_desc:0	"[SOV.GetNameDefCap] ist stets bestrebt, seinen Einfluss auf den europäischen Raum auszudehnen, und wir sind auf dem Markt, um unsere Luftwaffe zu modernisieren. Mit einem gewissen politischen Geben und Nehmen können wir uns den Zugang zu ihrem industriellen Know-how sichern."
AUS_innsbruck_airbase_project:0	"Projekt Innsbrucker Luftwaffenstützpunkt"
AUS_innsbruck_airbase_project_desc:0	"Der Flughafen Innsbruck liegt in einem großen Tal, ideal für den Start von Kriegsflugzeugen und zivilen Maschinen. Wenn wir ihn in einen Militärflugplatz umwandeln, wird er für unsere Bedürfnisse besser geeignet sein."
AUS_innsbruck_airbase_project_tt:0	"Fügen Sie §Y2 Landforts§! auf Innsbruck hinzu."
AUS_protect_our_skies:0	"Schützen Sie unseren Himmel"
AUS_protect_our_skies_desc:0	"Früher war das Fliegen eine Neuheit, aber die Flugzeuge haben sich verändert, und damit auch die Kriegsführung in der Luftfahrt. Wir können die Bedrohungen aus der Luft nicht ignorieren - und wir müssen uns entsprechend vorbereiten."
AUS_protect_our_skies_tt:0	"Fügen Sie §Y2 Anti-Air§! zu allen kontrollierten Gebieten von Österreich-Ungarn selbst hinzu."
AUS_fortify_our_airfields:0	"Befestigen Sie unsere Flugplätze"
AUS_fortify_our_airfields_desc:0	"Keiner unserer Flugplätze liegt sehr weit innerhalb unserer Grenzen, und wir können nicht ausschließen, dass ein gezielter Angriff den einen oder anderen erobern könnte. Wenn Sie beide befestigen, können Sie das Risiko verringern."
AUS_fortify_our_airfields_tt:0	"Fügen Sie §Y2 Landforts§! auf österreichischen Flugplätzen hinzu."
AUS_investigate_jet_technology:0	"Untersuchen Sie die Jet-Technologie"
AUS_investigate_jet_technology_desc:0	"Unsere Ingenieursabteilung hat von einem neuen, theoretischen Düsentriebwerk gehört, mit dem Flugzeuge schneller, höher und weiter fliegen können als je zuvor. Wenn irgendetwas, das wir untersuchen können, uns einen taktischen Vorteil verschaffen kann, werden wir es nehmen."
AUS_experimental_bomber_programme:0	"Experimentelles Bomberprogramm"
AUS_experimental_bomber_programme_desc:0	"Es gibt bereits theoretische Entwürfe für die nächste Generation von Bombern, die uns in den Kriegen, die auf uns zukommen, einen Vorteil verschaffen. Wir müssen nur noch Mittel für die Entwicklung von Prototypen bereitstellen, um dieses Programm in Gang zu bringen."
AUS_establish_the_austrian_airforce_academy:0	"Errichten Sie die [AUS.GetAdjective] Airforce Academy"
AUS_establish_the_austrian_airforce_academy_desc:0	"Unsere junge Luftwaffe entwickelt sich gut, aber es mangelt vielleicht nicht an der Technologie, aber an der Ausbildung. Wir können Ressourcen aufwenden, um dieses Problem zu beheben und haben keine Entschuldigung, es nicht zu tun."
AUS_repair_pola_naval_base:0	"Reparatur des Marinestützpunkts Pola"
AUS_repair_pola_naval_base_desc:0	"Der Marinestützpunkt Pola war einst eine der wichtigsten Einrichtungen der österreichischen Kriegsmarine. Seit wir von der See vertrieben wurden, ist sie verfallen, aber wir können und müssen uns darum bemühen, dass sie wieder nutzbar wird."
AUS_recreate_the_kuk_kriegsmarine:0	"Stellen Sie die K.u.K Kriegsmarine wieder her"
AUS_recreate_the_kuk_kriegsmarine_desc:0	"Die K.u.K. Kriegsmarine war Österreichs Marine, bis wir nach der Niederlage im Großen Krieg den Zugang zur See verloren. Wir können ihren früheren Ruhm mit nicht geringem Aufwand zurückgewinnen."
AUS_acquire_skoda_naval_artillery_experience:0	"Erwerben Sie Erfahrung mit der Marineartillerie von Skoda"
AUS_acquire_skoda_naval_artillery_experience_desc:0	"Skoda hat die Geschütze der österreichisch-ungarischen Marine entworfen; es ist an der Zeit, diese Erfahrung wieder zu nutzen."
AUS_rijeka_naval_academy:0	"Die Marineakademie von Rijeka"
AUS_rijeka_naval_academy_desc:0	"Rijeka ist eine der größten Hafenstädte im kroatischen Raum und eine der wichtigsten Marinestützpunkte der österreichisch-ungarischen Armee. Die Seefahrt und die Seekriegsführung sind dort kein Fremdwort, und wir können uns diese Erfahrung zunutze machen."
AUS_trieste_shipyards:0	"Schiffswerften in Triest "
AUS_trieste_shipyards_desc:0	"Triest ist eine Stadt mit einer bestehenden Werftindustrie, die wir subventionieren und ausnutzen sollten. Dies wird unsere Dominanz im Mittelmeer sicherstellen."
AUS_trieste_shipyards_tt:0	"Ermöglicht die Einstellung von Schiffskonstrukteuren der Trieste Shipyards.\n"
AUS_expand_cattaro_harbour:0	"Den Hafen von Cattaro ausbauen"
AUS_expand_cattaro_harbour_desc:0	"Cattaro ist eine Bucht im Landesinneren, ein geschützter Ort, an dem eine Flottengruppe sicher untergebracht werden kann. Es ist ein natürliches Sicherheitsgut und wir sollten es auch so behandeln. Unsere nächste Erweiterung wird hier stattfinden."
AUS_a_stealthier_approach:0	"Eine heimliche Annäherung"
AUS_a_stealthier_approach_desc:0	"Die [AUS.GetAdjective] Marine ist nicht mehr das, was sie einmal war - tatsächlich ist sie nicht mehr existent. Wir können es uns nicht leisten, große Mengen an Ressourcen in Schiffe zu stecken, die von größeren Streitkräften einfach zerstört werden. Ein getarnter U-Boot-Krieg ist die Zukunft für uns."
AUS_sieze_the_adriatic:0	"Erobern Sie die Adria"
AUS_sieze_the_adriatic_desc:0	"Die Adria ist einer unserer wichtigsten Zugänge zum italienischen Stiefel und einer der kritischen Küstenabschnitte unseres Territoriums. Es wäre klug, sie mit spezialisierten Binnenschiffen wie Kreuzern zu sichern."
AUS_push_for_the_mediterranean:0	"Vorstoß ins Mittelmeer"
AUS_push_for_the_mediterranean_desc:0	"Das Mittelmeer ist ein berühmtes Meer, ein Unterstützer und die Wiege vieler afrikanischer und europäischer Reiche. Es wird wieder zur Wiege für unsere Nation werden - wenn wir es sichern können."
AUS_reform_the_kuk_seefliegerkorps:0	"Reformieren Sie das Seefliegerkorps"
AUS_reform_the_kuk_seefliegerkorps_desc:0	"Das österreichische Seefliegerkorps war mit seinen Spezialisierungen und Funktionen von den Hauptstreitkräften der Marine getrennt und unterschiedlich. Seine Nützlichkeit wird in der Zukunft hilfreich sein - wir sollten Ressourcen in seine Reformierung stecken."
AUS_found_the_austrian_marines:0	"Gründung der [AUS.GetAdjective] Marines"
AUS_found_the_austrian_marines_desc:0	"Seit der Landnahme ist ein Zweig unseres Militärs inakzeptabel vernachlässigt worden: unsere Marines. Mit etwas Geld und etwas Zeit können wir den angerichteten Schaden beheben."
AUS_rearm_the_bundesheer:0	"Rüsten Sie das Bundesheer auf"
AUS_rearm_the_bundesheer_desc:0	"Die österreichischen Streitkräfte wurden durch den Vertrag von Saint-Germain-en-Laye hart getroffen. Aber da [GER.GetLeader] seine Streitkräfte vorbereitet, gab es nie einen besseren Zeitpunkt, um aufzurüsten, ob wir nun mit oder gegen ihn stehen."
AUS_cement_the_jansa_plan:0	"Zementieren Sie den Jansa-Plan"
AUS_cement_the_jansa_plan_desc:0	"Feldmarschall Alfred Jansa hat einen genialen Plan zur Verteidigung gegen eine deutsche Invasion vorgelegt. Wir müssen ihm alle Mittel zur Verfügung stellen, die er zur Vorbereitung benötigt."
AUS_fortify_river_traun:0	"Befestigen Sie den Fluss Traun"
AUS_fortify_river_traun_desc:0	"Die Traun befindet sich in einer perfekten Position, um Wien zu verteidigen. Wir müssen sie gemäß der Empfehlung von Marschall Jansa befestigen."
AUS_defence_focus:0	"Defensiver Schwerpunkt"
AUS_defence_focus_desc:0	"Unser Land ist klein. Wir müssen uns darum kümmern, die Linie zu halten, bevor wir an einen Angriff denken."
AUS_continue_choke_fortifications:0	"Befestigungen an den Engpässen fortsetzen"
AUS_continue_choke_fortifications_desc:0	"Unser Land hat viele Engpässe, die wir bei der Verteidigung nutzen können. Wir sollten sie befestigen, um sie uneinnehmbar zu machen."
AUS_home_defense:0	"[AUS.GetCapital.GetCapitalVictoryPointName] Luftverteidigung"
AUS_home_defense_desc:0	"Wir müssen einsehen, dass wir die gegnerische Luftwaffe nicht in der Luft bekämpfen können. Daher müssen wir eine Luftabwehr am Boden aufbauen, um unsere Stadt zu schützen."
AUS_artillery_modernization:0	"Modernisierung der Artillerie"
AUS_artillery_modernization_desc:0	"Die Artillerie hat sich als der König der modernen Kriegsführung erwiesen. Wir müssen sicherstellen, dass wir bei ihren Verbesserungen nicht zurückbleiben."
AUS_artillery_supremacy:0	"Der König der Schlacht"
AUS_artillery_supremacy_desc:0	"Nur wenn wir dem Feind mit unserer Artillerie überlegen sind, können wir die Hölle auf seine Soldaten niederregnen lassen und siegreich sein."
AUS_restart_steyr:0	"Kommission Steyr-Armee"
AUS_restart_steyr_desc:0	"Steyr, der größte Waffenhersteller unseres Landes, hat mit der Einführung der MP-34 sein Engagement für moderne Waffendesigns bewiesen. Die Beauftragung des Unternehmens mit der Entwicklung neuer Waffenkonzepte wäre für unsere Armee von großem Nutzen."
AUS_tried_and_tested:0	"Bewährt und erprobt"
AUS_tried_and_tested_desc:0	"Echte Infanteriekriegsführung ist seit Jahrhunderten erprobt und bewährt. Es gibt keinen Grund, von ihr abzuweichen, wenn sie sich als effektiv erwiesen hat."
AUS_alpine_warfare:0	"Alpine Kriegsführung"
AUS_alpine_warfare_desc:0	"Wir müssen unsere Stärken ausspielen, indem wir unsere Truppen so ausbilden, dass sie im zerklüfteten Gelände der Alpen gut kämpfen können, damit wir es als natürliche Barriere gegen Angriffe nutzen können."
AUS_anti_tank_infantry:0	"Panzerabwehr-Infanterie"
AUS_anti_tank_infantry_desc:0	"Unsere Industrie ist zu klein, um Panzer zu produzieren, aber wir können die Panzer des Feindes dennoch in Schach halten, indem wir unsere Infanterie mit effektiven Waffen ausstatten, um sie zu bekämpfen."
AUS_combat_engineering:0	"Kampftechnik"
AUS_combat_engineering_desc:0	"Indem wir unsere Einheiten mit Kampfingenieuren unterstützen, können wir ihre Effektivität auf dem Schlachtfeld erhöhen."
AUS_found_the_jagdkommando_school:0	"Gründung der Jagdkommandoschule"
AUS_found_the_jagdkommando_school_desc:0	"Es gibt Pläne zur Bildung einer Spezialeinheit aus unseren besten und klügsten Soldaten, die in der Lage sind, hinter den feindlichen Linien und unter ungünstigen Bedingungen zu operieren. Alles, was sie brauchen, ist die Finanzierung, um in Gang gesetzt zu werden."
AUS_fund_the_gebirgsjaeger_programme:0	"Finanzieren Sie das Gebirgsjäger-Programm"
AUS_fund_the_gebirgsjaeger_programme_desc:0	"Unser Land ist gebirgig, und wir müssen uns an das anpassen, was uns von Natur aus gegeben wurde. Jeder, der unser Land angreift, wird feststellen, dass unsere Streitkräfte sehr gut ausgerüstet sind, um mit ihm in diesem Terrain fertig zu werden."
AUS_abandon_jansa_plan:0	"Geben Sie den Jansa-Plan auf"
AUS_abandon_jansa_plan_desc:0	"Wenn unsere Armee in das moderne Zeitalter eintreten soll, müssen wir die statischen Verteidigungspläne aufgeben und unsere Armee so flexibel wie möglich machen."
AUS_manoeuvre_warfare:0	"Manövrierfähige Kriegsführung"
AUS_manoeuvre_warfare_desc:0	"Der Krieg hat sich verändert, und wir sollten uns mit ihm verändern. Der Schlüssel zum Sieg in einem modernen Krieg ist ein schneller und starker Angriff, nicht das Herumsitzen!"
AUS_mechanization_research:0	"Forschung zur Mechanisierung"
AUS_mechanization_research_desc:0	"Indem wir unsere Infanterie in gepanzerten Fahrzeugen transportieren, verringern wir das Risiko, dass sie unterwegs angegriffen wird."
AUS_doctrine_innovation:0	"Doktrinelle Innovation"
AUS_doctrine_innovation_desc:0	"Wir müssen eine neue Doktrin für die moderne Kriegsführung entwickeln, die auf Geschwindigkeit und Manövrierfähigkeit basiert."
AUS_motorization_effort:0	"Motorisierungsbemühungen"
AUS_motorization_effort_desc:0	"Durch die Motorisierung unserer Armee und Logistik können wir die Effektivität unserer Armee erheblich verbessern."
AUS_mechanized_army:0	"Mechanisierte Armee"
AUS_mechanized_army_desc:0	"Die Mechanisierung unserer Armee hat die Stärke unserer mobilen Infanterie stark erhöht."
AUS_rocket_innovations:0	"Raketen-Innovationen"
AUS_rocket_innovations_desc:0	"Die Raketentechnologie ist brandneu, kann aber mit verheerender Wirkung eingesetzt werden. Wir sollten uns damit befassen."
AUS_local_tank_research:0	"Lokale Rüstungsforschung"
AUS_local_tank_research_desc:0	"Unsere Industrie mag zwar klein sein, aber das hindert uns nicht daran, uns mit einer kleinen lokalen Panzerproduktion zu beschäftigen."
AUS_radio_improvements:0	"Verbesserungen der Funkgeräte"
AUS_radio_improvements_desc:0	"Indem wir unsere Einheiten mit neuen Funkgeräten ausstatten, können wir ihre Organisation und Kommunikation verbessern."
AUS_modernize_officer_training:0	"Offiziersausbildung modernisieren"
AUS_modernize_officer_training_desc:0	"Ein Großteil unserer Offiziersausbildung ist noch ein Überbleibsel aus dem Großen Krieg und dem alten Kaiserreich. Wir sollten sie so weit wie möglich reformieren, um auf das neue Zeitalter vorbereitet zu sein."
AUS_shock_troop_offensive:0	"Stormtrooper-Offensive"
AUS_shock_troop_offensive_desc:0	"Gegen Ende des Großen Krieges setzten unsere deutschen Verbündeten Sturmtruppen mit großem Erfolg ein. Wir sollten von ihnen lernen."
AUS_liechtenstein_treaty:0	"Liechtensteiner Vertrag"
AUS_liechtenstein_treaty_desc:0	"[GER.GetNameDefCap] hat aufgehört, eine verantwortungsvolle Weltmacht zu sein, die von einem ruhigen und mächtigen Kaiser regiert wird. Stattdessen bedroht der Wahnsinnige [GER.GetLeader] ganz Europa mit seiner expansionistischen Politik. [AUS.GetNameDefCap] muss auf alle möglichen Verbündeten schauen, um zu überleben - [SWI.GetNameDef] eingeschlossen."
AUS_intervention:0	"Kontinentale Intervention"
AUS_intervention_desc:0	"Der Kontinent steht auf Messers Schneide, und wir müssen uns zusammentun, um gegen die Fluten des Nazismus und des Bolschewismus zu kämpfen, damit wir nicht von ihnen verschlungen werden."
AUS_end_the_depression:0	"Beenden Sie die Depression"
AUS_end_the_depression_desc:0	"Das Schlimmste der Depression liegt hinter uns. Wir sollten den letzten Schritt tun, um ihre Auswirkungen rückgängig zu machen."
AUS_subsidize_kapsch:0	"Subventionieren Sie Kapsch"
AUS_subsidize_kapsch_desc:0	"Wir sollten Elektronikunternehmen wie Kapsch subventionieren, um unsere Nation in das technologische Zeitalter zu katapultieren."
AUS_expand_vienna_university:0	"Erweitern Sie die Universität von Wien"
AUS_expand_vienna_university_desc:0	"Die Universität Wien ist eine der renommiertesten Universitäten in ganz Europa. Wir müssen sie ausbauen, um eine neue Generation kluger Köpfe für unser Land heranzuziehen."
AUS_strabag_construction:0	"STRABAG-Bauprojekte"
AUS_strabag_construction_desc:0	"Indem wir die STRABAG mit der Durchführung unserer Bauprojekte beauftragen, können wir die Geschwindigkeit, mit der wir unsere Industrie ausbauen, deutlich erhöhen."
AUS_mixed_economy:0	"Gemischte Wirtschaftspolitik"
AUS_mixed_economy_desc:0	"Wir sollten auf eine gemischte Wirtschaft hinarbeiten, die den Menschen dient und ihnen ihre Bedürfnisse erfüllt. Nur ein Gleichgewicht zwischen Marktwirtschaft und Sozialfürsorge kann unsere Stabilität garantieren."
AUS_subsidies_for_farmers:0	"Subventionen für Landwirte"
AUS_subsidies_for_farmers_desc:0	"Einige Landwirte sind durch die rasche industrielle Expansion unseres Landes geschädigt worden. Wir sollten dafür sorgen, dass auch sie versorgt werden, denn wir sind auf sie angewiesen."
AUS_industry_nationalizations:0	"Verstaatlichen Sie STRABAG"
AUS_industry_nationalizations_desc:0	"Durch die Verstaatlichung der STRABAG können wir sie unter die Kontrolle der Regierung stellen und mehr Raum für die Zusammenarbeit mit anderen Industrieunternehmen schaffen."
AUS_urban_industry_expansion:0	"Wiener Fabriken"
AUS_urban_industry_expansion_desc:0	"Wir müssen unsere Industrie in städtischen Gebieten ausbauen, wo die meisten Arbeiter leben."
AUS_fund_public_infrastructure:0	"Landesweiter Ausbau der Infrastruktur"
AUS_fund_public_infrastructure_desc:0	"Um sicherzustellen, dass sich unsere Bevölkerung effektiv fortbewegen kann, sollten wir unsere Straßen- und Verkehrsinfrastruktur im ganzen Land ausbauen."
AUS_invite_scientists:0	"Ausländische Wissenschaftler einladen"
AUS_invite_scientists_desc:0	"Unser Land sollte ein Leuchtturm für Bildung und wissenschaftliche Forschung sein. Um dies zu erreichen, sollten wir Wissenschaftler aus aller Welt einladen, uns zu helfen. "
AUS_suburban_development_plan:0	"Plan zur Entwicklung der Vorstädte"
AUS_suburban_development_plan_desc:0	"Nach dem jüngsten Ausbau der Infrastruktur rund um unsere größten Städte müssen wir damit beginnen, neues Land zu erschließen, um Raum für die weitere wirtschaftliche Entwicklung der Bevölkerung in den Vorstädten zu schaffen."
AUS_graz_industry_expansion:0	"Ausbau der Grazer Industrie"
AUS_graz_industry_expansion_desc:0	"Unsere südlichen Gebiete sind in Bezug auf die industrielle Entwicklung im Rückstand. Wir sollten einige Bauprojekte in Angriff nehmen, um das zu ändern."
AUS_the_corporate_model:0	"Das Unternehmensmodell"
AUS_the_corporate_model_desc:0	"Die einzige Möglichkeit für unsere Nation, voranzukommen, besteht darin, dem Beispiel Mussolinis zu folgen und unsere Gesellschaft in Gruppen zu organisieren, die gemeinsam unseren Interessen dienen."
AUS_mixed_industrial_development:0	"Gemischte industrielle Entwicklung"
AUS_mixed_industrial_development_desc:0	"Wir sollten uns nicht zu sehr auf eine der beiden Seiten der industriellen Entwicklung neigen. Eine starke zivile Industrie ist wichtig - aber unsere Nation muss in der Lage sein, sich zu verteidigen."
AUS_farmers_to_factories:0	"Landwirte zu Fabriken"
AUS_farmers_to_factories_desc:0	"Wir können uns nicht länger auf die ehemaligen Kronländer verlassen, um unseren industriellen Bedarf zu decken. Wir müssen Bauern in die Fabriken bringen, um unsere Nation über Wasser zu halten."
AUS_factories_in_countryside:0	"Fabriken auf dem Lande"
AUS_factories_in_countryside_desc:0	"Der Bau von Fabriken in ländlicheren Regionen könnte dazu beitragen, unsere Erwerbsbevölkerung zu vergrößern, indem der Landbevölkerung Arbeitsmöglichkeiten geboten werden."
AUS_empower_private_enterprises:0	"Stärkung von Großunternehmen"
AUS_empower_private_enterprises_desc:0	"Die Stärkung großer Unternehmen ermöglicht es uns, die Wirtschaft effizienter zu kontrollieren, da wir mit weniger einzelnen Unternehmen arbeiten müssen."
AUS_shift_strabag:0	"STRABAG-Bau verlagern"
AUS_shift_strabag_desc:0	"Wir können die STRABAG besser nutzen, wenn wir ihre Bauprojekte auf militärische Bauten umstellen."
AUS_commit_to_autarky:0	"Verpflichten Sie sich zur Autarkie"
AUS_commit_to_autarky_desc:0	"Wir sind von Feinden umgeben und können es uns nicht leisten, uns auf andere als uns selbst zu verlassen. Wir müssen völlig autark werden, wenn wir überleben wollen."
AUS_fund_coal_industries:0	"Erweitern Sie die Ampflwang-Kohleminen"
AUS_fund_coal_industries_desc:0	"Die Förderung der Kohleindustrie wird uns helfen, energieunabhängig von anderen Nationen zu werden und unsere Wirtschaft anzukurbeln."
AUS_military_industrial_funding:0	"Wien Militärische Expansion"
AUS_military_industrial_funding_desc:0	"Die Finanzierung unseres militärisch-industriellen Komplexes ist notwendig, wenn wir unsere eigene Ausrüstung herstellen und nicht auf Importe aus anderen Ländern angewiesen sein wollen."
AUS_salzburg_military_hub:0	"Militärische Drehscheibe Salzburg"
AUS_salzburg_military_hub_desc:0	"Die zentrale Lage Salzburgs in unserem Land würde es zu einem großartigen Standort für ein militärisches Zentrum machen."
AUS_steel_industry_funds:0	"Ausbau der Linzer Stahlindustrie"
AUS_steel_industry_funds_desc:0	"Unser Land braucht mehr Stahl für mehr Waffen. Wir sollten unsere bestehenden Stahlindustrien ausbauen, um einen größeren Umfang zu unterstützen."
AUS_local_weapons_manufacturing:0	"Massenproduktion von Waffen"
AUS_local_weapons_manufacturing_desc:0	"Wir müssen unsere Waffenproduktion beschleunigen - die Uhr tickt und wir sind nicht darauf vorbereitet."
AUS_clock_ticks_down:0	"Die Uhr tickt herunter"
AUS_clock_ticks_down_desc:0	"Es hat begonnen. Die Nazis sind ins Rheinland einmarschiert und haben damit zum ersten Mal offiziell den Versailler Vertrag missachtet. Da dies der Vertrag ist, der unsere Unabhängigkeit sichert, müssen wir einen Weg finden, um die Deutschen davon abzuhalten, an unserer Grenze einzumarschieren.\n\nTick, Tock. "
AUS_austria_awaken:0	"Österreich, wach auf!"
AUS_austria_awaken_desc:0	"Wachen Sie auf! \n\nUnser großes Österreich ist in großer Gefahr. Wir müssen nach außen schauen und Unterstützung finden, damit die Nazis nicht an unsere Tür klopfen."
AUS_look_west:0	"Schauen Sie in den Westen"
AUS_look_west_desc:0	"Wir mögen zwar gute Beziehungen zu [ITA.GetNameDef] haben, aber sie beginnen, sich zu sehr mit den Nazis anzufreunden, was uns in Gefahr bringt. Stattdessen sollten wir nach Westen zu Großbritannien und Frankreich blicken, mit denen wir zwar ideologisch nicht übereinstimmen, die aber eine Vereinigung Österreichs mit Deutschland genauso wenig wollen wie wir."
AUS_repeal_party_ban:0	"Aufhebung des Parteiverbots"
AUS_repeal_party_ban_desc:0	"Seit der Übernahme der VF wurden die Oppositionsparteien mit einem Verbot belegt, um die Macht zu sichern. Wenn wir das Land zur Demokratie zurückführen wollen, müssen wir dieses Gesetz rückgängig machen. "
AUS_disband_paramilitaries:0	"Paramilitärische Gruppen auflösen"
AUS_disband_paramilitaries_desc:0	"Wenn wir das Land stabilisieren wollen, müssen wir endlich die vielen paramilitärischen Gruppen auflösen. Sie dienen nur dazu, unser Land zu destabilisieren. "
AUS_reorganize_the_right:0	"Reorganisieren Sie die Rechte"
AUS_reorganize_the_right_desc:0	"Die Wahlen stehen vor der Tür, und wenn wir sie gewinnen wollen, sollten wir unsere Partei reorganisieren, um eine breitere Basis anzusprechen."
AUS_return_otto_bauer:0	"Otto Bauer aus dem Exil zurückholen"
AUS_return_otto_bauer_desc:0	"Otto Bauer ist ein bekannter österreichischer Sozialist und langjähriges Mitglied der Sozialdemokratischen Partei. Er war seit der Übernahme der VF im Exil und viele wollen, dass er zurückkehrt, wenn wir das Land zur Demokratie zurückführen. Manche trauen ihm jedoch nicht, weil er für die Wiedervereinigung mit Deutschland ist, aber wie wichtig ist das wirklich?"
AUS_begin_election_campaigns:0	"Beginnen Sie den Wahlkampf"
AUS_begin_election_campaigns_desc:0	"Es ist an der Zeit. Nachdem wir endlich die demokratische Herrschaft wiederhergestellt haben, werden wir mit dem Wahlkampf für unsere erste Wahl beginnen."
AUS_sdapo_victory:0	"SDAPÖ-Sieg"
AUS_sdapo_victory_desc:0	"Endlich ist die SDAPÖ aus den Wahlen als Siegerin hervorgegangen. Erst jetzt können wir mit der Arbeit für ein freies und gleichberechtigtes Österreich beginnen!"
AUS_bauer_government:0	"Bauers Kabinett"
AUS_bauer_government_desc:0	"Der einzige Weg nach vorne ist Otto Bauer, der unsere Regierung in die Zukunft führen wird. Seine Leidenschaft für sozialistische Ideale wird dieses Land voranbringen."
AUS_restart_linz_program:0	"Ein neues Linzer Programm"
AUS_restart_linz_program_desc:0	"Das Linzer Programm von 1926 gibt es nicht mehr, aber gemeinsam können wir uns vereinen und einen neuen nationalen Geist schaffen, der die Konflikte der Vergangenheit ungeschehen macht."
AUS_democracy_of_the_proletariat:0	"Demokratie des Proletariats"
AUS_democracy_of_the_proletariat_desc:0	"Unsere Nation muss eine Gesellschaft werden, in der alle gleich sind, frei von Unterdrückung."
AUS_revive_the_schutzbund:0	"Den Schutzbund wiederbeleben"
AUS_revive_the_schutzbund_desc:0	"Der Republikanische Schutzbund, der 1934 tapfer für die Verteidigung unserer Demokratie gekämpft hat, wurde nach dem Bürgerkrieg aufgelöst. Wir müssen ihn wiederbeleben, um unsere Demokratie zu schützen. "
AUS_healthcare_subsidization:0	"Zuschüsse für das Gesundheitswesen"
AUS_healthcare_subsidization_desc:0	"Wir müssen dafür sorgen, dass jeder Einzelne in unserem Land Zugang zur Gesundheitsversorgung hat, wenn wir unsere Vision eines großen Österreichs verwirklichen wollen."
AUS_reverse_brain_drain:0	"Den Brain Drain umkehren"
AUS_reverse_brain_drain_desc:0	"Viele brillante Köpfe waren gezwungen, unser Land zu verlassen, als die faschistische Regierung die Macht übernahm. Wir müssen sie in ihre Heimat zurückbringen, damit sich unser Land weiterentwickeln kann."
AUS_public_housing_programs:0	"Nationaler Wohnungsbauplan"
AUS_public_housing_programs_desc:0	"In vielen Teilen des Landes finden Arbeiter keinen angemessenen Wohnraum für sich und sind gezwungen, in beengten Wohnungen zu leben. Wir müssen diese Ungerechtigkeit beseitigen."
AUS_democracy_worth_defending:0	"Eine Demokratie, die es wert ist, verteidigt zu werden"
AUS_democracy_worth_defending_desc:0	"Nachdem wir unsere Demokratie schon einmal verloren haben, können wir es uns nicht mehr leisten, apathisch zu sein. Jeder Bürger muss sich seiner Pflicht bewusst sein, seine Freiheit, seine Freiheit und sein Zuhause zu verteidigen."
AUS_the_three_arrows:0	"Die drei Pfeile"
AUS_the_three_arrows_desc:0	"Es ist uns gelungen, unser Land zu befreien, aber jetzt müssen wir als vereinte Front gegen alle Totalitaristen der Welt stehen."
AUS_strike_the_heart:0	"Schlagen Sie das Herz"
AUS_strike_the_heart_desc:0	"Der Faschismus nahm seinen Anfang in Italien und hat sich seither auf so viele Nationen ausgebreitet. Wir müssen an der Quelle ansetzen und ihn ein für alle Mal vernichten."
AUS_stop_the_spread:0	"Stoppen Sie die Ausbreitung"
AUS_stop_the_spread_desc:0	"Unsere Nachbarn sind von faschistischen Tyrannen übernommen worden. Es ist unsere Pflicht, sie zu befreien."
AUS_remember_red_vienna:0	"Erinnern Sie sich an das Rote Wien"
AUS_remember_red_vienna_desc:0	"Das Rote Wien, das pulsierende Herz des österreichischen Sozialismus, war in den Tagen der Ersten Republik einst eine große Utopie. Wir müssen diesen Geist wiederbeleben, um nicht nur die Stadt, sondern unser ganzes Land voranzutreiben!"
AUS_equal_rights_women:0	"Eine Revolution der Frauen"
AUS_equal_rights_women_desc:0	"Diese soziale Revolution gilt nicht nur für Männer, sondern für unsere gesamte Gesellschaft. Die Integration von Frauen in unsere Armee und in die Arbeitswelt wird unsere Fähigkeiten drastisch erhöhen."
AUS_renner_government:0	"Renner's Koalition"
AUS_renner_government_desc:0	"Otto Bauer hat einen guten Geist, aber er ist zu ehrgeizig. Karl Renner kann uns in eine Zukunft des Wohlstandes und des Pragmatismus führen."
AUS_toe_the_line:0	"Auf die Linie achten"
AUS_toe_the_line_desc:0	"Was wir jetzt brauchen, ist Einigkeit, nicht Spaltung. Wir können es uns nicht leisten, zu radikal zu sein."
AUS_national_unity_government:0	"Regierung der nationalen Einheit"
AUS_national_unity_government_desc:0	"Die Bedrohungen sind allgegenwärtig, und wir können keine Zeit damit verschwenden, über die Innenpolitik zu streiten. Wir müssen uns zusammenschließen und eine Regierung der nationalen Einheit bilden, die sich dem Schutz des österreichischen Volkes vor seinen Feinden widmet."
AUS_remove_miklas:0	"Miklas absetzen"
AUS_remove_miklas_desc:0	"Präsident Wilhelm Miklas hat tatenlos zugesehen, als Dolfuss die Erste Republik zerstörte und keine seiner Befugnisse genutzt, um ihn aufzuhalten. Er hat seine Pflicht als Präsident der Republik nicht erfüllt und muss von der Macht entfernt werden."
AUS_compromise_miklas:0	"Kompromiss mit Miklas"
AUS_compromise_miklas_desc:0	"Auch wenn wir nicht mit ihm einverstanden sind, muss Präsident Miklas an der Macht bleiben, um den Frieden zu wahren. Wir sollten ihn stattdessen dazu drängen, unsere Regierung zu unterstützen."
AUS_proclaim_the_second_republic:0	"Rufen Sie die Zweite Republik aus"
AUS_proclaim_the_second_republic_desc:0	"Das österreichische Volk hat trotz aller Widrigkeiten und Bedrohungen durch Nazis, Faschisten und Kommunisten standgehalten. Heute können wir stolz auf unsere neue Republik sein, für alle, die ihre Rückkehr nicht mehr erleben konnten."
AUS_bring_in_left:0	"Bringen Sie die Linke ins Spiel"
AUS_bring_in_left_desc:0	"Wir müssen den linken Flügel unserer Partei stärker einbinden, um Fraktionszwang zu verhindern und die Einheit zu fördern."
AUS_compromise_with_conservatives:0	"Kompromiss mit den Konservativen"
AUS_compromise_with_conservatives_desc:0	"Obwohl wir Rivalen sind, gibt es einige konservative Parteimitglieder, die bereit sind, mit uns zusammenzuarbeiten, um gemeinsame Ziele zu erreichen."
AUS_reform_education_system:0	"Universelle Bildungsreformen"
AUS_reform_education_system_desc:0	"Wir müssen jedem klugen Kopf in der Nation die Mittel zur Verfügung stellen, die er braucht, um erfolgreich zu sein, damit unsere nächste Generation gebildet und produktiv sein wird."
AUS_proletarians_of_today:0	"Die Proletarier von heute"
AUS_proletarians_of_today_desc:0	"Jeder Mann und jede Frau der Republik Österreich muss seine/ihre Pflicht tun, um seine/ihre Heimat zu schützen.\n\n Und wir fragen uns: Sind wir Männer, sind die Proletarier von heute noch Schafe, die man stumm zur Schlachtbank führen kann? AUS_land_reform:0 Landreformen"
AUS_land_reform_desc:0	"Eine Reform des Landsystems sollte mehr verarmten Bauerngemeinschaften helfen und die Selbstversorgung unserer Nation verbessern."
AUS_defence_of_the_republic:0	"Verteidigung der Republik"
AUS_defence_of_the_republic_desc:0	"Karl Renner, der Vater unserer Republik, hat uns zu Frieden und Stabilität geführt. Die Prüfungen waren hart, aber wir können ihm vertrauen, dass er uns in die Zukunft führen wird."
AUS_father_of_republic:0	"Vater der Republik"
AUS_father_of_republic_desc:0	"Seit den Tagen der Ersten Republik hat Karl Renner sein Engagement für den Aufbau einer neuen österreichischen Republik gezeigt, die allen Bürgern unabhängig von ihrer sozialen Stellung zugute kommt. Der Vater unserer Republik muss anerkannt werden."
AUS_dismantle_corporatism:0	"Zerschlagung des Korporatismus"
AUS_dismantle_corporatism_desc:0	"Es gibt noch Elemente des faschistischen Gesellschaftssystems. Sie müssen zerstört und durch Institutionen ersetzt werden, die dem gemeinen Mann zugute kommen."
AUS_strike_the_snake:0	"Enthauptet die Schlange"
AUS_strike_the_snake_desc:0	"Genug gewartet. Gemeinsam können wir Hitlers Regierung ein für alle Mal stürzen."
AUS_danubian_economic_alliance:0	"Danubische Wirtschaftsallianz"
AUS_danubian_economic_alliance_desc:0	"Die Annäherung an befreundete Nationen in unserer Nachbarschaft und der Aufbau wirtschaftlicher Beziehungen zu ihnen würde uns sehr dabei helfen, aus der wirtschaftlichen Misere herauszukommen, in der wir uns befinden."
AUS_danubian_defensive_pact:0	"Danubische Entente"
AUS_danubian_defensive_pact_desc:0	"Vielleicht könnten wir, anstatt uns mit dem Westen zu verbünden, eine Danubische Entente bilden, die als Bollwerk gegen die großen Nationen Europas dienen würde."
AUS_bolshevik_reconciliation:0	"Bolschewistische Versöhnung"
AUS_bolshevik_reconciliation_desc:0	"Unsere Partei hat sich zwar zeitweise gegen die Moskauer Regierung gestellt, aber wir sehen ein, dass sie doch die wahren Verfechter des Sozialismus in Europa sind, und als solche müssen wir uns mit ihnen verbünden, um den Kontinent zu befreien."
AUS_realize_unity:0	"Verwirklichen Sie unsere Einheit"
AUS_realize_unity_desc:0	"Österreich allein ist gar nichts. Wir müssen unsere größere deutsche Einheit mit unseren nördlichen Nachbarn erkennen und unsere Verantwortung, sie von ihrer totalitären Regierung zu befreien. "
AUS_arm_german_resistance:0	"Bewaffnen Sie den deutschen Widerstand"
AUS_arm_german_resistance_desc:0	"In Deutschland gibt es immer noch viele bewaffnete Gruppen, die sich gegen das derzeitige totalitäre Regime stellen. Wir müssen ihnen Unterstützung zukommen lassen, damit sie bereit sind, wenn es Zeit ist zuzuschlagen."
AUS_for_a_free_germany:0	"Einigkeit, Gerechtigkeit, Freiheit"
AUS_for_a_free_germany_desc:0	"Die Zeit ist gekommen. Wir dürfen nicht vergessen, was uns als Volk antreibt - der Einsatz für eine gerechte, freie und vereinte Nation, für alle Deutschen."
AUS_negotiate_reunification:0	"Wiedervereinigung verhandeln"
AUS_negotiate_reunification_desc:0	"Nachdem die Nazis gestürzt sind, müssen wir mit der neuen deutschen Regierung Verhandlungen über die Wiedervereinigung aufnehmen. Nichts kann zwischen uns und einem größeren vereinten Deutschland stehen."
AUS_join_the_west:0	"Schließen Sie sich dem Westen an "
AUS_join_the_west_desc:0	"Wenn wir gegen den kommenden Sturm geschützt sein wollen, müssen wir uns den westlichen Verbündeten in ihrem Kampf anschließen."
AUS_support_the_bauernbund:0	"Unterstützen Sie den Bauernbund"
AUS_support_the_bauernbund_desc:0	"Die Unterstützung der landwirtschaftlichen Gewerkschaften unseres Landes, wie z.B. des Bauernbundes, würde unsere Popularität bei den ländlichen Wählern erheblich steigern."
AUS_landbund_support:0	"Laden Sie Landbund-Minister ein"
AUS_landbund_support_desc:0	"Viele Mitglieder des Landbundes könnten nützliche Berater in unserem Kabinett sein. Wir sollten sie einladen, unserer Regierung beizutreten."
AUS_cs_victory:0	"Sieg der CSP"
AUS_cs_victory_desc:0	"Mit ein wenig Führung ist die Christlichsoziale Partei aus den Wahlen als Sieger hervorgegangen, und wir können unsere Arbeit fortsetzen, um Österreich zu einem großen katholischen Staat zu machen."
AUS_crush_heimwehr_remnants:0	"Reste der Heimwehr zerschlagen"
AUS_crush_heimwehr_remnants_desc:0	"Die Heimwehr ist immer noch eine einflussreiche Kraft in unserem Land und wir müssen ihren Einfluss zurückdrängen, wenn unsere reformistische Sache an Boden gewinnen soll."
AUS_reform_the_sturmscharen:0	"Reformieren Sie die Sturmscharen"
AUS_reform_the_sturmscharen_desc:0	"Der Reformistenführer Leopold Figl ist auch Kommandant der niederösterreichischen Sturmscharen. Er könnte seinen Einfluss in der Organisation nutzen, um sie langsam auf die Seite der Reformisten zu ziehen und uns so den dringend benötigten Einfluss auf die paramilitärischen Einheiten des Landes zu verschaffen."
AUS_empower_the_economic_council:0	"Stärken Sie den Wirtschaftsrat"
AUS_empower_the_economic_council_desc:0	"Viele Mitglieder des Bundeswirtschaftsrats unterstützen unsere reformistische Sache. Leopold Figl sollte seinen Einfluss nutzen, um Unterstützung für den Rat zu gewinnen, damit die reformistische Bewegung gestärkt wird."
AUS_miklas_support:0	"Beeinflussen Sie Miklas"
AUS_miklas_support_desc:0	"Präsident Wilhelm Miklas mag zwar ein rückgratloser Feigling sein, aber zumindest sympathisiert er mit unserer Sache. Ihn davon zu überzeugen, unsere Bemühungen zu unterstützen, könnte sich als ein starker politischer Impuls erweisen."
AUS_oust_schuschnigg:0	"Misstrauensvotum"

AUS_economic_liberalization:0	"Wirtschaftliche Liberalisierungen"
AUS_economic_liberalization_desc:0	"Der Konzernstaat war eine Katastrophe für unsere Wirtschaft. Wir müssen auf eine freie Marktwirtschaft hinarbeiten, um das Wirtschaftswachstum in unserem Land zu fördern."
AUS_grand_coalition:0	"Eine Große Koalition"
AUS_grand_coalition_desc:0	"Um zu verhindern, dass sich die Kämpfe der Ersten Republik wiederholen, müssen wir mit der SDAPÖ zusammenarbeiten und eine große Koalition bilden, um unser Land voranzubringen. Nur gemeinsam können wir Österreich gegen Bedrohungen von außen verteidigen."
AUS_impede_socialists:0	"Sozialistische Parteien behindern"
AUS_impede_socialists_desc:0	"Die sozialistischen Parteien bedrohen unsere Stabilität. Wir müssen ihre Bestrebungen, an die Macht zu kommen, verhindern, um unsere Herrschaft zu festigen."
AUS_austrian_catholic_identity:0	"Die katholische Identität Österreichs"
AUS_austrian_catholic_identity_desc:0	"Österreichs Schicksal ist sein eigenes, getrennt von dem der Protestanten im Norden. Wir sind unser eigenes Volk, geeint durch unseren katholischen Glauben, bereit, in der Familie der Nationen auf eigenen Füßen zu stehen."
AUS_destroy_dolfuss_legacy:0	"Dolfuss' Erbe anprangern"
AUS_destroy_dolfuss_legacy_desc:0	"Die Machtübernahme von Engelbert Dolfuss ist der Grund, warum wir uns überhaupt in dieser Situation befinden. Sein Streben nach Macht hätte Österreich beinahe auf einen dunklen Pfad geführt, und er muss als Diktator und Schandfleck in unserer Geschichte in Erinnerung bleiben."
AUS_preserve_dolfuss_legacy:0	"Bewahren Sie das Erbe von Dolfuss"
AUS_preserve_dolfuss_legacy_desc:0	"Engelbert Dolfuss war ein Held und ein wahrer Führer, der die Nation vor der Überrumpelung durch die Deutschen bewahrte. Er muss als der Begründer der modernen österreichischen Nation in Erinnerung bleiben und sein Vermächtnis muss bewahrt werden."
AUS_austria_alone:0	"Österreich allein"
AUS_austria_alone_desc:0	"Obwohl wir nicht mehr so mächtig sind wie früher, steht Österreich als unabhängige Nation fest und wir können uns behaupten, ohne vor Großmächten zu kapitulieren."
AUS_work_with_heimwehr:0	"Nutzen Sie die Überreste der Heimwehr"
AUS_work_with_heimwehr_desc:0	"Die Überreste der Heimwehr könnten in unsere Partei integriert werden, um das Parlament und die reformistische Sache zu schwächen."
AUS_appoint_loyal_judges:0	"Loyale Richter ernennen"
AUS_appoint_loyal_judges_desc:0	"Um die Gerichte zu sichern, müssen wir unsere Macht nutzen, um loyale Richter zu ernennen, die unseren Einfluss in der Nation fördern werden."
AUS_exploit_constitutional_loopholes:0	"Schlupflöcher in der Verfassung ausnutzen"
AUS_exploit_constitutional_loopholes_desc:0	"Da das Land offiziell immer noch von der Verfassung vom Mai 1934 regiert wird, gibt es viele Schlupflöcher, die wir ausnutzen können, um den politischen Einfluss der Reformisten zu beschneiden."
AUS_depose_miklas:0	"Miklas absetzen"
AUS_depose_miklas_desc:0	"Miklas war eine nützliche Marionette, aber seine Zeit ist abgelaufen. Er muss seines Amtes enthoben werden und seine Befugnisse müssen auf den Kanzler übertragen werden. "
AUS_constrict_the_parliament:0	"Schränken Sie das Parlament ein"
AUS_constrict_the_parliament_desc:0	"Mit unserem Einfluss sind wir endlich in der Lage, die Bedrohung unserer Macht durch das Parlament einzuschränken und so den Einfluss der Reformisten zu neutralisieren und unsere Herrschaft zu festigen."
AUS_a_good_show:0	"Ziehen Sie eine gute Show ab"
AUS_a_good_show_desc:0	"Um die Unterstützung unserer Verbündeten im Westen zu erhalten, müssen wir eine gute Show abziehen, um der Welt unsere Reformen zu zeigen."
AUS_token_constitution_reforms:0	"Token-Verfassungsreformen"
AUS_token_constitution_reforms_desc:0	"Wir müssen der Welt weiterhin eine Show bieten, indem wir einige Teile unserer Verfassung bis zu einem gewissen Grad reformieren, obwohl diese Reformen die Nation in keiner Weise verändern werden."
AUS_moderate_restoration:0	"Eine maßvolle Wiederherstellung"
AUS_moderate_restoration_desc:0	"Was Österreich jetzt braucht, ist eine populäre Galionsfigur, die das Land in diesen turbulenten Zeiten eint. Eine moderate Restauration von Otto von Habsburg ist das, was wir brauchen."
AUS_repeal_may_constitution:0	"Aufhebung der Maiverfassung"
AUS_repeal_may_constitution_desc:0	"Die Maiverfassung ist eine Schande für unsere Nation und muss aufgehoben werden, um den Weg für ein neues demokratisches Österreich zu ebnen."
AUS_reform_the_bundesheer:0	"Reformieren Sie das Bundesheer"
AUS_reform_the_bundesheer_desc:0	"Um Korruption und autoritäre Tendenzen im Heer zu verhindern, müssen wir Ermittlungen gegen verdächtige Offiziere durchführen."
AUS_minister_reshuffling:0	"Minister-Umbesetzungen"
AUS_minister_reshuffling_desc:0	"Indem wir die Minister bei bestimmten Anlässen umbesetzen, können wir verhindern, dass Beamte zu viele Verbindungen knüpfen und korrupt werden. "
AUS_fight_kaiser_influence:0	"Bekämpfen Sie den Einfluss des Kaisers"
AUS_fight_kaiser_influence_desc:0	"Der Kaiser ist als einigende Figur nützlich, aber seine Machtgier wird unsere Nation nur ein weiteres Mal ins Verderben stürzen. Wenn wir weiter gedeihen wollen, müssen wir versuchen, seine Herrschaft zu umgehen."
AUS_use_miklas:0	"Nutzen Sie Miklas"
AUS_use_miklas_desc:0	"Präsident Miklas könnte ein nützliches Werkzeug für unsere Bemühungen sein. Wenn wir seine Unterstützung gewinnen könnten, würden wir unseren Einfluss erheblich steigern."
AUS_a_new_austria:0	"Ein neues Österreich"
AUS_a_new_austria_desc:0	"Das Österreich von heute ist nicht das Österreich von gestern. Das Österreich von morgen wird eine demokratische, pluralistische Gesellschaft sein, in der alle gleich behandelt werden und alle gleich sind. Wir müssen dieses Ziel im Auge behalten."
AUS_fall_from_grace:0	"Ein Sturz in Ungnade"
AUS_fall_from_grace_desc:0	"Mit der Umgehung der Machenschaften des Kaisers haben wir unsere Position als dominierende politische Kraft im Lande gesichert. Jetzt können wir unseren Zielen näher kommen."
AUS_unite_the_nation:0	"Vereinigen Sie die Nation"
AUS_unite_the_nation_desc:0	"Die Zeit für Einigkeit ist jetzt gekommen. Angesichts der deutschen Bedrohung vor unseren Toren müssen wir zusammenarbeiten, um den Sturm zu überstehen."
AUS_national_defence_effort:0	"Nationale Verteidigungsanstrengungen"
AUS_national_defence_effort_desc:0	"Wir müssen die Industrie mobilisieren, um für die Verteidigung der Nation bereit zu sein."
AUS_national_mobilization:0	"Nationale Mobilisierung"
AUS_national_mobilization_desc:0	"Wir müssen so viele Menschen wie möglich für die Armee rekrutieren, und zwar schnell, wenn wir genug Männer haben wollen, um den Ansturm zu überstehen."
AUS_foreign_arms_purchases:0	"Ausländische Waffenkäufe"
AUS_foreign_arms_purchases_desc:0	"Unsere Industrien können viele Waffen herstellen, aber es wäre eine gute Idee, einige ausländische Ausrüstungen zu kaufen, um unsere Bestände aufzustocken. "
AUS_antifascist_bulwark:0	"Antifaschistischer Schutzwall"
AUS_antifascist_bulwark_desc:0	"Gemeinsam werden wir ein Bollwerk gegen die faschistische Bedrohung um uns herum bilden."
AUS_antifascist_bulwark_ns_target_tt:0	"Angriffsbonus gegen die wichtigsten faschistischen Länder in Europa§!: §G+10.0%§!\nVerteidigungsbonus gegen §Ygroße faschistische Länder in Europa§!: §G+10.0%§!"
AUS_strike_the_source:0	"Strike the Source"
AUS_strike_the_source_desc:0	"Italien ist nicht nur die Quelle des Faschismus, sondern hält auch Ländereien, die uns Österreichern am Herzen liegen. Wir müssen unser Volk befreien - und das ihre."
AUS_preemptive_strike:0	"Präventivschlag"
AUS_preemptive_strike_desc:0	"Es ist kein Geheimnis, dass die Deutschen hinter uns her sind. Anstatt abzuwarten, ist es jetzt an der Zeit, zuerst zuzuschlagen, und zwar schnell!"
AUS_south_german_union:0	"Eine Süddeutsche Union"
AUS_south_german_union_desc:0	"Die Menschen in Österreich sind nicht nur Österreicher, sondern auch Süddeutsche, eine eigene Gruppe katholischer Deutscher. Diese Identität müssen wir unserem Volk vermitteln."
AUS_our_own_pact:0	"Unser eigener Pakt"
AUS_our_own_pact_desc:0	"Wir müssen uns von den großen Bündnissen verabschieden und unseren eigenen donauländischen Verteidigungspakt für die Verteidigung aller kleineren Nationen in Europa gründen."
AUS_a_danubian_association:0	"Eine donauländische Vereinigung"
AUS_a_danubian_association_desc:0	"Unsere Brüderlichkeit mit den Völkern des ehemaligen Imperiums darf nicht vergessen werden, aber die Zeiten sind vorbei. Wir sollten mit ihnen Kontakt aufnehmen und einen gemeinsamen Verband gründen, in dem unsere Außenpolitik geeint wird."
AUS_slovenia_for_alliance:0	"Slowenien für die Allianz"
AUS_slovenia_for_alliance_desc:0	"Das slowenische Volk gehört zu den germanischen Völkern. Vielleicht könnten wir mit der jugoslawischen Regierung ein Abkommen schließen, bei dem wir Slowenien dafür erhalten, dass wir es gegen die Italiener schützen."
AUS_invite_hungary:0	"Laden Sie Ungarn ein"
AUS_invite_hungary_desc:0	"Wir sollten Ungarn in den Donaubund einladen, um unsere Position weiter zu stärken."
AUS_topple_hungary:0	"Stürzen Sie [HUN.GetLeader]"
AUS_topple_hungary_desc:0	"Die Aggression von [HUN.GetAdjective] auf dem Balkan, einschließlich der Beanspruchung unseres eigenen rechtmäßigen Territoriums, hat die Region schon zu lange destabilisiert! Wir müssen die Regierung von [HUN.GetLeader] stürzen und eine verantwortungsvolle Regierung im Land einsetzen!"
AUS_rewrite_may_constitution:0	"Schreiben Sie die Mai-Verfassung um"
AUS_rewrite_may_constitution_desc:0	"Indem wir die Mai-Verfassung einfach umschreiben, können wir bestimmte Errungenschaften einbauen, die uns helfen könnten, mehr Macht zu erlangen."
AUS_forge_government_ties:0	"Schmieden Sie Regierungsbindungen"
AUS_forge_government_ties_desc:0	"Indem wir bestimmte Verbindungen in der Regierung knüpfen, können wir möglicherweise die Unterstützung einiger nützlicher Minister gewinnen."
AUS_negotiate_with_loyal_officers:0	"Mit loyalen Offizieren verhandeln"
AUS_negotiate_with_loyal_officers_desc:0	"Im Militär gibt es viele Offiziere, die den Kaiser unterstützen. Wir können ihren Einfluss nutzen, um unsere Pläne voranzutreiben."
AUS_austria_first:0	"Österreich zuerst"
AUS_austria_first_desc:0	"Genug der Schwäche! Die Deutschen haben lange genug versucht, uns in den Schatten zu stellen! Österreich wird unabhängig sein, frei von deutscher Herrschaft, und wird seinen verlorenen Ruhm zurückgewinnen!"
AUS_second_enabling_act:0	"Das zweite Ermächtigungsgesetz"
AUS_second_enabling_act_desc:0	"Durch die Ausnutzung der Schlupflöcher, die wir in der Verfassung geschaffen haben, ist es uns gelungen, den Einfluss des Parlaments zu minimieren. Jetzt ist es an der Zeit, Österreichs Ruhm zurückzuerobern!"
AUS_cousins_not_brothers:0	"Cousins, nicht Brüder"
AUS_cousins_not_brothers_desc:0	"Das Scheitern der österreichisch-ungarischen Monarchie war unvermeidlich, aber wir dürfen die große Freundschaft zwischen unseren Nationen nicht ignorieren. Wenn wir ein Bündnis mit Ungarn eingehen, können wir unsere gestohlenen Länder gemeinsam zurückgewinnen."
AUS_partition_czechoslovakia:0	"Teilung der Tschechoslowakei"
AUS_partition_czechoslovakia_desc:0	"Böhmen war lange Zeit das industrielle Kernland des österreichischen Kaiserreichs. Durch eine Teilung der Tschechoslowakei mit Ungarn können wir unsere verlorenen Gebiete zurückgewinnen."
AUS_expand_bohemian_industry:0	"Erweitern Sie die böhmische Industrie"
AUS_expand_bohemian_industry_desc:0	"Die böhmische Industrie ist für unsere Nation lebenswichtig und verfügt über eine gute Infrastruktur für die Expansion. Wir sollten uns darauf konzentrieren, sie auszubauen, was wahrscheinlich auch die Meinung der Einheimischen über unsere Regierung verbessern würde."
AUS_integrate_bohemia:0	"Integrieren Sie Böhmen"
AUS_integrate_bohemia_desc:0	"Die Tschechen sind seit langem ein Teil des germanischen Volkes. Wir können sie als Zeichen der Brüderlichkeit in unsere Kernländer integrieren. "
AUS_loyalty_for_properties:0	"Rückgabe [LIE.GetAdjective] Besitzungen"
AUS_loyalty_for_properties_desc:0	"Vor dem Zusammenbruch der österreichisch-ungarischen Monarchie besaßen viele [LIE.GetAdjective] Bürger Grundbesitz in Böhmen, der ihnen nach der Gründung der Tschechoslowakischen Republik weggenommen wurde. Jetzt, da wir Böhmen kontrollieren, können wir ihnen anbieten, ihnen diese Besitztümer im Austausch für ihre Loyalität zurückzugeben."
AUS_ally_poland:0	"Verbündeter [POL.GetNameDef]"
AUS_ally_poland_desc:0	"Auch wenn wir Ansprüche auf Polen haben, wäre es vielleicht besser, wenn wir auf diese Ländereien verzichten und im Gegenzug ein Bündnis mit ihnen gegen die Deutschen eingehen."
AUS_claims_on_galicia:0	"Ansprüche auf Galizien"
AUS_claims_on_galicia_desc:0	"Galizien war einst Teil des großen österreichischen Reiches, unser Land, und wir werden es nicht aufgeben!"
AUS_avenge_brother_war:0	"Rache für den Bruderkrieg"
AUS_avenge_brother_war_desc:0	"Das österreichische Kaiserreich wurde durch den Bruderkrieg ruiniert, der unsere Chancen, der führende deutsche Staat zu werden, zunichte gemacht hat. Wir müssen diese große Ungerechtigkeit rächen!"
AUS_ally_bulgaria:0	"Verbündeter [BUL.GetNameDef]"
AUS_ally_bulgaria_desc:0	"Die Bulgaren waren während des Großen Krieges gute Verbündete für uns. Wir sollten versuchen, ihnen wieder die Hand zu reichen."
AUS_ally_yugoslavia:0	"Verbündeter [YUG.GetNameDef]"
AUS_ally_yugoslavia_desc:0	"Sowohl wir als auch die Jugoslawen haben Ansprüche auf [ITA.GetNameDef]. Ein Bündnis gegen die italienische Bedrohung würde unsere Chancen verbessern."
AUS_ally_romania:0	"Verbündeter [ROM.GetNameDef]"
AUS_ally_romania_desc:0	"[ROM.GetNameDefCap] ist die stärkste Nation auf dem Balkan. Ein Bündnis mit ihr würde unseren Einfluss sicherlich stärken."
AUS_the_adriatic_coast:0	"Die Adriaküste"
AUS_the_adriatic_coast_desc:0	"Wenn wir die Adria wie einst beherrschen wollen, müssen wir die kroatische Küste von [YUG.GetNameDef] zurückerobern und unsere Vorherrschaft erneut behaupten."
AUS_italian_reconciliation:0	"Italienische Versöhnung"
AUS_italian_reconciliation_desc:0	"Jetzt, da die westlichen Verbündeten uns im Stich gelassen haben, sollten wir versuchen, uns mit den Italienern zu versöhnen, auch wenn wir ihr Land beanspruchen."
AUS_our_western_lands:0	"Verräter des Großen Krieges"
AUS_our_western_lands_desc:0	"[ITA.GetNameDefCap] hat uns in unserer dunkelsten Stunde verraten und sich den Westmächten gegen uns angeschlossen, obwohl wir ein Bündnis mit ihnen hatten. Ihr Verrat und die Besetzung unserer Kerngebiete dürfen niemals verziehen werden, und sie werden für ihre Taten bestraft werden!"
AUS_depose_the_imbecile:0	"Stürzen Sie den Imbecile"
AUS_depose_the_imbecile_desc:0	"Miklas ist nichts weiter als eine Marionette für denjenigen gewesen, der zuletzt mit ihm gesprochen hat. Wir müssen den rückgratlosen Schwachkopf endlich aus seinem Amt entfernen."
AUS_for_kaiser_and_fatherland:0	"Für Kaiser und Vaterland"
AUS_for_kaiser_and_fatherland_desc:0	"Es ist eine Zeit des Wandels für Europa, und [AUS.GetNameDef]s Platz in der kommenden Welt wird durch die Opferbereitschaft von Staat und Volk bestimmt werden. Es ist Zeit für jeden fähigen Mann, für Kaiser und Vaterland einzutreten."
AUS_grant_crownland_status:0	"Gewährung des Kronland-Status"
AUS_grant_crownland_status_desc:0	"Während wir Land für unser Reich zurückgewinnen, könnte es immer noch Widerstand in der lokalen Bevölkerung geben. Wir könnten versuchen, die Unterstützung der Bevölkerung zu gewinnen, indem wir bestimmten Ländern einen Sonderstatus gewähren."
AUS_pressure_for_slovenia:0	"Druck für Slowenien"
AUS_pressure_for_slovenia_desc:0	"Seit der Auflösung des Staates Venedig gehört Slowenien uns, und die Slowenen wollten schon immer Teil des germanischen Volkes sein. Sie sind durch die Zeit von uns getrennt, aber wir werden der Welt beweisen, dass jeder Unterschied versöhnt werden kann."
AUS_pressure_for_slovenia_tt:0	"§Nkönnte zum Krieg mit [YUG.GetNameDef] führen.§!\n"
AUS_crack_down_nazis:0	"Hartes Durchgreifen gegen Nazi-Elemente"
AUS_crack_down_nazis_desc:0	"Wir müssen gegen die verbleibenden Nazi-Elemente in unserer Nation vorgehen, um zu verhindern, dass sie eine Wiedervereinigung mit Deutschland unterstützen."
AUS_bolster_defences:0	"Verstärken Sie die nationale Verteidigung"
AUS_bolster_defences_desc:0	"Auch wenn Italien uns schützt, ist eine deutsche Invasion nicht ausgeschlossen. Deshalb müssen wir unser Militär verstärken, um sicherzustellen, dass wir uns behaupten können."
AUS_crackdown_on_socialists:0	"Hartes Durchgreifen gegen Sozialisten"
AUS_crackdown_on_socialists_desc:0	"Wir dürfen nicht zulassen, dass sozialistische Elemente wie die SDAPÖ diese Krise nutzen, um an Einfluss zu gewinnen. Gegen sie muss sofort hart vorgegangen werden."
AUS_past_glories:0	"Vergangener Ruhm"
AUS_past_glories_desc:0	"Genug von dieser Schwäche! Die Verträge, die uns nach dem Ersten Weltkrieg lähmten, sind der einzige Grund, warum wir uns nicht allein gegen Deutschland behaupten können! Wir müssen diese große Ungerechtigkeit ein für alle Mal beseitigen!"
AUS_repeal_habsburg_law:0	"Heben Sie das Habsburgergesetz auf"
AUS_repeal_habsburg_law_desc:0	"Das von der illegitimen Regierung der Republik unterzeichnete Habsburgergesetz raubte die Besitztümer und Titel der Familie Habsburg. Dieses große Unrecht ist ein Schandfleck für unsere Nation und muss rückgängig gemacht werden!"
AUS_bring_exiled_monarchists:0	"Integrieren Sie den Reichsbund"
AUS_bring_exiled_monarchists_desc:0	"Der Reichsbund der Österreicher, auch bekannt als Reichsbund der Österreicher, ist eine monarchistische politische Fraktion, die mit der Vaterländischen Front befreundet ist. Wenn wir sie in unsere Regierung aufnehmen, könnte das den Einfluss der Monarchisten erheblich stärken."
AUS_return_of_habsburgs:0	"Die Rückkehr des Alten"
AUS_return_of_habsburgs_desc:0	"Die letzten 20 Jahre der republikanischen Regierung haben unserem Land nichts als Chaos und Depression gebracht. Schuschnigg muss zurücktreten und Otto von Habsburg an die Spitze der Nation zurückkehren lassen. Nur er kann uns zu Ruhm und Ehre führen!"
AUS_the_eisenstadt_conference:0	"Die Eisenstädter Konferenz"
AUS_the_eisenstadt_conference_desc:0	"Jetzt, da die Habsburger auf den Thron zurückgekehrt sind, ist es an der Zeit, die Wiedervereinigung unseres großen Reiches einzuleiten. Wir sollten die Ungarn zu einer Konferenz einladen, um unsere verlorenen Länder gemeinsam zurückzuerobern. "
AUS_old_friends_not_forgotten:0	"Alte Freunde nicht vergessen"
AUS_old_friends_not_forgotten_desc:0	"Es wurde ein historisches Abkommen mit Ungarn unterzeichnet. Gemeinsam können wir die Ungerechtigkeiten der Vergangenheit bekämpfen!"
AUS_arrest_nazis:0	"Nazi-Propagandisten verhaften"
AUS_arrest_nazis_desc:0	"Viele Elemente der paramilitärischen Gruppen, die sich gegen unsere Regierung stellen, werden von Nazi-Propagandisten unterstützt. Die Verhaftung dieser pro-deutschen Sympathisanten würde den Einfluss der paramilitärischen Gruppen verringern, auch wenn dies unsere Beziehungen zu den Deutschen beeinträchtigen würde."
AUS_integrate_militias:0	"Loyale Milizen einbinden"
AUS_integrate_militias_desc:0	"Die Integration staatsloyaler Milizen in die Armee würde helfen, dem Einfluss der regierungsfeindlichen Paramilitärs entgegenzuwirken."
AUS_crush_the_heimwehr:0	"Zerschlagung der Heimwehr"
AUS_crush_the_heimwehr_desc:0	"Die Heimwehr ist eine von vielen regierungsfeindlichen Milizen, aber sie ist die größte. Mit dem Einfluss, den wir gesammelt haben, werden wir sie vollständig vernichten und die anderen Paramilitärs zur Kapitulation zwingen."
AUS_convince_miklas:0	"Überzeugen Sie Miklas"
AUS_convince_miklas_desc:0	"Wir müssen Präsident Miklas überzeugen, unsere Regierung zu unterstützen, wenn wir die Macht konsolidieren wollen."
AUS_a_modern_empire:0	"Ein modernes Reich"
AUS_a_modern_empire_desc:0	"Auch wenn das große Erbe des alten Reiches nicht vergessen werden darf, müssen wir die Gründe für seinen Zusammenbruch erkennen und dafür sorgen, dass unser neues Reich an die Moderne angepasst ist."
AUS_support_transylvanian_claims:0	"Unterstützen Sie die ungarischen Ansprüche auf Siebenbürgen"
AUS_support_transylvanian_claims_desc:0	"Um unseren guten Willen gegenüber [HUN.GetNameDef] zu zeigen, sollten wir ihre Ansprüche auf Siebenbürgen anerkennen und dass die in der Region lebenden Ungarn unter ungarischer Herrschaft befreit werden müssen."
AUS_transylvanian_independence:0	"Bevorzugen Sie die Selbstverwaltung Siebenbürgens"
AUS_transylvanian_independence_desc:0	"Obwohl wir die Not der ungarischen Bevölkerung in Siebenbürgen anerkennen, müssen wir uns auch darüber im Klaren sein, dass eine Übergabe des Gebiets an [HUN.GetNameDef] nur zur Unterdrückung der Rumänen in der Region führen wird. Wir sollten uns für eine autonome Region in Siebenbürgen einsetzen, die sowohl Rumänen als auch Ungarn schützt."
AUS_support_croatian_independence:0	"Unterstützen Sie die Unabhängigkeit Kroatiens"
AUS_support_croatian_independence_desc:0	"Die instabile Regierung von [YUG.GetNameDef] hat uns Raum gelassen, um seperatistische Bewegungen für unsere Ziele zu nutzen. Wir sollten bestimmte kroatische Unabhängigkeitsbewegungen bewaffnen, damit sie uns in unserem Kampf gegen die Serben unterstützen."
AUS_recognize_hungarian_croatia:0	"Erkennen Sie das ungarische Kroatien an"
AUS_recognize_hungarian_croatia_desc:0	"Die Ungarn erheben seit langem Anspruch auf die kroatischen Gebiete. Es könnte an der Zeit sein, ihre Ansprüche endlich anzuerkennen, um ihre Unterstützung für das Kaiserreich zu garantieren."
AUS_franz_ferdinand_legacy:0	"Franz Ferdinands Erbe"
AUS_franz_ferdinand_legacy_desc:0	"Franz Ferdinand war der erste, der erkannte, dass ein modernes österreichisches Kaiserreich nicht überleben kann, wenn es die Minderheiten nicht als gleichberechtigte Bürger akzeptiert. Wir müssen seinem Vermächtnis folgen und ein Reich schaffen, das Hunderte von Jahren überdauern wird."
AUS_empower_the_parliament:0	"Ermächtigung des Parlaments"
AUS_empower_the_parliament_desc:0	"Wir müssen das neue Zeitalter der konstitutionellen Monarchien anerkennen und das Parlament der Nation ermächtigen, um den Menschen des Reiches ihre rechtmäßige Stimme zu geben. "
AUS_cement_kaiser_power:0	"Zementieren Sie die Macht des Kaisers"
AUS_cement_kaiser_power_desc:0	"Die Welt brennt, und jetzt ist nicht die Zeit, sich mit sinnlosem Gezänk und internen Streitigkeiten aufzuhalten. Das Parlament hat seinen Platz, aber der Kaiser muss in der Lage sein, schnell zu handeln, wenn die Nation es braucht."
AUS_monarchic_enabling_acts:0	"Monarchische Notstandsdekrete"
AUS_monarchic_enabling_acts_desc:0	"Der Kaiser muss in Krisenzeiten per Dekret regieren können. Manche Situationen sind zu dringlich, um im Parlament debattiert zu werden."
AUS_invest_in_cisleithania:0	"Investieren Sie in Cisleithanien"
AUS_invest_in_cisleithania_desc:0	"Um die Unterstützung der Völker des Reiches zu gewinnen, müssen wir in ihre Industrien und ihre Streitkräfte investieren."
AUS_reform_the_constitution:0	"Reformieren Sie die Verfassung"
AUS_reform_the_constitution_desc:0	"Das Zeitalter der absoluten Monarchien ist vorbei. Die Stimme des Volkes muss gehört werden, und es wird über unsere Zukunft entscheiden."
AUS_federalisation_of_cisleithania:0	"Föderalisierung von Cisleithanien"
AUS_federalisation_of_cisleithania_desc:0	"Es ist endlich an der Zeit, unseren Brüdern und Schwestern in Cisleithanien die gleichen Rechte zu gewähren, die sie verdienen. Gemeinsam können wir eine große Zukunft für das Imperium aufbauen."
AUS_one_empire_two_systems:0	"Ein Reich, zwei Systeme"
AUS_one_empire_two_systems_desc:0	"Die Ungarn werden niemals akzeptieren, in unsere Föderation integriert zu werden. Deshalb muss es ihnen erlaubt sein, ihre eigene Regierungsform zu praktizieren und gleichzeitig der Außenpolitik Wiens zu folgen."
AUS_federalize_transleithania:0	"Föderalisierung von Transleithanien"
AUS_federalize_transleithania_desc:0	"Die Ungarn werden uns nicht von der vollständigen Föderalisierung des Reiches abhalten! Wenn sie sich uns widersetzen wollen, dann soll es so sein!"
AUS_continue_austrohungarian_dominance:0	"Fortsetzung der österreichisch-ungarischen Dominanz"
AUS_continue_austrohungarian_dominance_desc:0	"Die Völker unseres Reiches sind noch nicht bereit, gleichberechtigt zu werden. Die Macht muss vorerst in den Händen von Wien und Budapest bleiben."
AUS_form_donaubund:0	"Bilden Sie den Donaubund"
AUS_form_donaubund_desc:0	"Wenn Österreich wieder zu einer großen Nation werden soll, dürfen wir nicht zu Marionetten einer Großmacht werden. Stattdessen sollten wir uns darauf konzentrieren, unsere eigene Sphäre aufzubauen, frei vom Einfluss der großen Nationen Europas."
AUS_old_ties:0	"Alte Bindungen"
AUS_old_ties_desc:0	"Mit der Rückkehr des Kaisers auf den Thron von Deutschland müssen wir mit ihm zusammenstehen. Nur gemeinsam können wir unseren Ruhm zurückgewinnen!"
AUS_ally_albania:0	"Verbündeter [ALB.GetNameDef]"
AUS_ally_albania_desc:0	"Die Albaner haben Ansprüche auf [YUG.GetNameDef]. Sie könnten in einem möglichen Krieg vielleicht nützlich sein."
AUS_destroy_the_compromise:0	"Zerstören Sie den Kompromiss"
AUS_destroy_the_compromise_desc:0	"Der österreichisch-ungarische Kompromiss von 1867 war der Moment, in dem unser glorreiches Reich zu zerbröckeln begann. Wir müssen diesen Fehler der Vergangenheit ungeschehen machen und den Ungarn zeigen, wo ihr Platz ist!"
AUS_centralize_power:0	"Zentralisierung der Macht"
AUS_centralize_power_desc:0	"Wir müssen die Macht der Regierung zentralisieren, indem wir die Überbleibsel der Republik beseitigen, um unsere Herrschaft zu festigen."
AUS_reinstate_hungarian_civilian_government:0	"Wiedereinführung der ungarischen Zivilregierung"
AUS_reinstate_hungarian_civilian_government_desc:0	"Wenn wir die Ungarn in unsere Nation integrieren wollen, müssen wir die zivile Regierung in Ungarn wiederherstellen, auch wenn dies kurzfristig zu Instabilität führt."
AUS_martial_law_hungary:0	"Kriegsrecht in Ungarn"
AUS_martial_law_hungary_desc:0	"Wir müssen in Ungarn vorläufig das Kriegsrecht verhängen, um den Widerstand zu unterdrücken und den Weg für unsere Integration des Landes zu ebnen."
AUS_ban_paramilitary_organizations:0	"Paramilitärische Organisationen verbieten"
AUS_ban_paramilitary_organizations_desc:0	"In unserem Land gibt es viele paramilitärische Organisationen, die noch aus den Tagen der instabilen Republik stammen. Wir müssen uns mit diesen Bedrohungen auseinandersetzen, die sich der rechtmäßigen Herrschaft des Kaisers widersetzen."
AUS_centralize_imperial_army:0	"Zentralisieren Sie die kaiserliche Armee"
AUS_centralize_imperial_army_desc:0	"Die Zentralisierung der kaiserlichen Armee wird verhindern, dass abtrünnige Offiziere die Macht an sich reißen."
AUS_stir_monarchist_sentiment:0	"Schüren Sie monarchistische Gefühle"
AUS_stir_monarchist_sentiment_desc:0	"Die Zeit hat gezeigt, dass die einzige Zeit, in der die österreichische Nation stabil war, unter den Habsburgern war. Wir müssen dem Volk klar machen, dass wir nur unter ihrer Herrschaft gedeihen können."
AUS_power_to_the_kaiser:0	"Macht für den Kaiser"
AUS_power_to_the_kaiser_desc:0	"Nachdem die Paramilitärs beseitigt sind, müssen wir die Macht um Otto von Habsburg, unseren großen Kaiser, zentralisieren. Nur er kann uns zum Sieg führen!"
AUS_utilize_paramilitaries:0	"Nutzen Sie paramilitärische Organisationen"
AUS_utilize_paramilitaries_desc:0	"Anstatt die Paramilitärs zu bekämpfen, können wir sie zu unserem Vorteil nutzen, indem wir sie in unser Militär integrieren, um unsere Zahl und unseren Einfluss zu stärken."
AUS_military_dictatorship:0	"Nutzen Sie das Militär"
AUS_military_dictatorship_desc:0	"Das imperiale Militär ist ein Werkzeug, das wir nutzen müssen. Wir können uns den Luxus einer zivilen Regierung nicht leisten, wenn es auf allen Seiten Feinde gibt."
AUS_what_was_taken:0	"Was uns genommen wurde"
AUS_what_was_taken_desc:0	"Unsere Niederlage im Großen Krieg hat uns absolut alles genommen. Unser rechtmäßiges Land wurde uns gestohlen und unsere Monarchie wurde gedemütigt. Aber wir werden unser verlorenes Reich zurückgewinnen, und Österreich wird wieder eine Macht sein, die man fürchten muss!"
AUS_forced_german_command:0	"Deutsches Oberkommando"
AUS_forced_german_command_desc:0	"Die Frage der Sprache ist ganz einfach: Das Oberkommando wird ausschließlich aus Deutsch sprechenden Personen bestehen, und die untergeordneten Einheiten müssen von einem Kommandanten geführt werden, der sowohl Deutsch als auch die Sprache der Einheit spricht."
AUS_split_army:0	"Linguistische Aufteilung der Armee"
AUS_split_army_desc:0	"Unsere Armee sollte so aufgeteilt werden, dass jede Division aus Sprechern einer bestimmten Sprache besteht. Auf diese Weise müssen nur die hochrangigen Offiziere Deutsch sprechen, was unsere Rekrutierungsmöglichkeiten deutlich erhöht."
AUS_avenge_yugoslav_humiliation:0	"Rache für die Demütigung"
AUS_avenge_yugoslav_humiliation_desc:0	"Serbien, die Nation, die unseren Erzherzog ermordet und den Großen Krieg ausgelöst hat, war es, die uns so viel von unserem Land genommen hat. Wir müssen uns für diese Demütigung rächen!"
AUS_transylvania_or_war:0	"Transsilvanien oder Krieg"
AUS_transylvania_or_war_desc:0	"Die Rumänen, die sich unseren Armeen ergeben haben, haben den Ungarn Siebenbürgen weggenommen, als sie schwach waren. Sie müssen lernen, dass man ihnen ihren Verrat nicht verzeihen wird! "
AUS_reclaim_bohemia:0	"Fordern Sie Böhmen zurück"
AUS_reclaim_bohemia_desc:0	"Böhmen war lange Zeit das industrielle Kernland des österreichischen Kaiserreichs, und sein Verlust hat unsere Wirtschaft fast zerstört. Wir müssen unser Land zurückerobern und unser Volk befreien!"
AUS_arm_sudeten_germans:0	"Bewaffnen Sie die Sudetendeutschen"
AUS_arm_sudeten_germans_desc:0	"Die Sudetendeutschen waren Teil des österreichischen Kaiserreichs und waren immer ein Teil der österreichischen Nation. Wir können nicht zusehen, wie sie von der illegitimen tschechischen Regierung unterdrückt werden."
AUS_retake_slovakia:0	"Rückeroberung der Slowakei"
AUS_retake_slovakia_desc:0	"Die Slowakei war einst Teil unseres Reiches und hatte eine große deutsche Bevölkerung. Wir müssen sie zurückerobern!"
AUS_imperial_infrastructure:0	"Imperiale Infrastruktur"
AUS_imperial_infrastructure_desc:0	"Der Ausbau der Infrastruktur unseres Reiches ist der Schlüssel zur Verbindung und Integration unserer Bevölkerungen."
AUS_prioritize_austria:0	"Setzen Sie Prioritäten in Österreich"
AUS_prioritize_austria_desc:0	"Österreich ist das Herz des Reiches, wir müssen seiner Entwicklung weiterhin Priorität einräumen."
AUS_promote_cross_empire_integration:0	"Reichsübergreifende Entwicklung"
AUS_promote_cross_empire_integration_desc:0	"Die Entwicklung aller Teile unseres Reiches würde unsere Unterstützung in den unterentwickelten Regionen erheblich steigern und unsere wirtschaftlichen Synergien fördern."
AUS_austrofascism_not_nazism:0	"Austrofaschismus, nicht Nazismus"
AUS_austrofascism_not_nazism_desc:0	"Österreich wird niemals Deutschland sein! Die Protestanten haben schon so lange versucht, uns zu unterdrücken, wir können nicht zulassen, dass sie uns noch länger beherrschen!"
AUS_agreement_with_germany:0	"Kompromiss mit Deutschland"
AUS_agreement_with_germany_desc:0	"Wir müssen der Tatsache ins Auge sehen, dass unsere Wirtschaft in Schieflage geraten ist und nicht gerettet werden kann, ohne Zugeständnisse an [GER.GetNameDef] zu machen, damit sie ihr Embargo aufheben."
AUS_militarize_the_rome_protocols:0	"Militarisierung der Römischen Protokolle"
AUS_militarize_the_rome_protocols_desc:0	"Bei den Römischen Protokollen handelte es sich um Abkommen, die wir mit Italien und Ungarn über die wirtschaftliche Zusammenarbeit zwischen unseren drei Nationen und eine Position gegen die territoriale Integrität Jugoslawiens unterzeichnet hatten. Die Umwandlung dieser Vereinbarungen in einen Bündnisvertrag würde es uns ermöglichen, die Bedrohungen durch [GER.GetNameDef] abzuwehren und den Weg für unsere Vorherrschaft auf dem Balkan zu ebnen."
AUS_purge_karntner_heimwehr:0	"Säubern Sie die Kärnter Heimwehr"
AUS_purge_karntner_heimwehr_desc:0	"Einige Abteilungen der Heimwehr haben offen die Nazipolitik und eine Vereinigung mit Deutschland unterstützt. Wir müssen sie säubern, um sowohl die Nazis als auch die Heimwehr zu schwächen."
AUS_utilize_the_heimwehr:0	"Nutzen Sie die Heimwehr"
AUS_utilize_the_heimwehr_desc:0	"Wir können die Heimwehr nutzen, um den Einfluss der Nazis in unserem Land zu bekämpfen, aber wenn wir uns auf sie verlassen, wird ihr Einfluss gestärkt, also müssen wir vorsichtig sein."
AUS_secure_vatican_support:0	"Sichern Sie sich die Unterstützung des Vatikans"
AUS_secure_vatican_support_desc:0	"Seine Heiligkeit hat offen seine Unterstützung für den großen Kreuzzug unserer Regierung bekundet. Eine weitere Verbesserung unserer Beziehungen zum Vatikan wird unsere Wahrnehmung in der katholischen Welt erheblich verbessern."
AUS_catholic_education:0	"Katholische Erziehung"
AUS_catholic_education_desc:0	"Unsere nächste Generation muss mit unseren großen katholischen Werten erzogen werden. Wir sollten das Bildungssystem wieder aufbauen, um unseren Kindern die Größe unserer Nation zu vermitteln."
AUS_promote_militarism:0	"Förderung des Militarismus"
AUS_promote_militarism_desc:0	"Seit unserem Sieg bei Wien im Jahr 1683 hat Österreich eine großartige militärische Geschichte. Wir müssen stolz auf unser Erbe und die Macht unserer Vorfahren sein."
AUS_red_white_red_until_death:0	"Rot-Weiß-Rot - bis zum Tod!"
AUS_red_white_red_until_death_desc:0	"Österreich ist nicht nur eine Abspaltung von Deutschland, wir sind etwas Größeres. Wir müssen unsere Freiheit gegen die Aggressoren verteidigen, die uns zu Fall bringen wollen, koste es, was es wolle!"
AUS_integrate_frontmilliz:0	"Integrieren Sie die Frontmilliz"
AUS_integrate_frontmilliz_desc:0	"Nachdem wir die Heimwehr mit ihrer Eingliederung in unsere von der Regierung kontrollierte Organisation Frontmilliz ins Abseits gestellt haben, ist es nun an der Zeit, den letzten Nagel in den Sarg zu schlagen. Wir werden die Frontmilliz und mit ihr die Heimwehr in das Bundesheer integrieren, um ihnen jeglichen Einfluss auf unsere Politik zu nehmen und die Kontrolle über die VF zu zementieren."
AUS_better_germany:0	"Das bessere Deutschland"
AUS_better_germany_desc:0	"Die Preußen wollen seit langem alle deutschsprachigen Völker in ihrem imperialistischen Reich vereinen, ohne Rücksicht auf die lokalen Kulturen. Das österreichische Volk muss sich gegen diese Bedrohung wehren, denn wir sind nicht irgendwelche Deutschen, sondern DIE Deutschen, die Europa jahrhundertelang beherrscht haben."
AUS_consolidate_bundesheer:0	"Konsolidieren Sie das Bundesheer"
AUS_consolidate_bundesheer_desc:0	"Jetzt, da die letzten Reste des Einflusses der Miliz verschwunden sind, ist es uns endlich gelungen, unsere Armee zu einer starken, einheitlichen Streitmacht zu vereinen, die sich gegen die Großmächte der Welt behaupten kann!"
AUS_corporate_industrialization:0	"Konzernindustrien"
AUS_corporate_industrialization_desc:0	"Wenn wir den sich zusammenbrauenden Sturm überleben wollen, müssen wir mit der Industrialisierung aller Bereiche unserer Gesellschaft beginnen. "
AUS_seize_socialist_media:0	"Ergreifen Sie die sozialistischen Medien"
AUS_seize_socialist_media_desc:0	"Nachdem der Einfluss der Heimwehr und der Nazis zurückgedrängt wurde, bleiben nur noch die Sozialisten übrig, die sich unserer Regierung entgegenstellen. Wir müssen alle Medien beschlagnahmen, die ihre Parteien unterstützen, um die Kontrolle zu sichern. "
AUS_disband_the_presidency:0	"Lösen Sie die Präsidentschaft auf"
AUS_disband_the_presidency_desc:0	"Obwohl Präsident Miklas nicht viel mehr als eine Marionette unserer Regierung ist, ist er doch der einzige, der über genügend Macht verfügt, um unsere Bemühungen zu behindern. Wir müssen das Amt ein für alle Mal auflösen und unsere Macht vollständig sichern."
AUS_expand_church_influence:0	"Einfluss der Kirche ausbauen"
AUS_expand_church_influence_desc:0	"Unser Bündnis mit der katholischen Kirche hat sich für unsere Regierung als äußerst wichtig erwiesen. Wir müssen unsere Zusammenarbeit ausbauen, um unsere Macht weiter zu stärken."
AUS_success_of_austrofascism:0	"Das austrofaschistische Experiment"
AUS_success_of_austrofascism_desc:0	"Allen Widrigkeiten zum Trotz ist es uns gelungen, etwas Neues zu schaffen, eine Regierungsform, wie es sie noch nie gegeben hat. Wir können stolz darauf sein, dass wir nach der Beruhigung unserer internen Probleme geeint und bereit sind, dem kommenden Sturm entgegenzutreten."
AUS_no_more_the_fool:0	"Nicht mehr der Narr"
AUS_no_more_the_fool_desc:0	"Viele zweifelten an den Fähigkeiten von Bundeskanzler Schuschnigg. Viele verachteten ihn für seine Schwäche und versuchten, die Macht an sich zu reißen.\n\nNicht mehr."
AUS_empower_the_heimatblock:0	"Ermächtigen Sie den Heimatblock"
AUS_empower_the_heimatblock_desc:0	"Schuschnigg hat gezeigt, dass er zu schwach ist, um unsere Nation wieder zu Größe zu führen. Vizekanzler Starhemberg, der wahre Nachfolger von Dolfuss, ist der Einzige, der uns zum Sieg führen kann!"
AUS_weaken_federal_army:0	"Schwächen Sie die Bundesarmee"
AUS_weaken_federal_army_desc:0	"Damit die Heimwehr an Einfluss gewinnt, sollten wir das Bundesheer schwächen, damit die Regierung noch stärker auf unsere Milizen angewiesen ist."
AUS_replace_miklas:0	"Ersetzen Sie Miklas"
AUS_replace_miklas_desc:0	"Mit unserem neu gewonnenen politischen Einfluss können wir Starhemberg zum Präsidenten machen und Schuschniggs Marionette Miklas absetzen."
AUS_utilize_fey:0	"Fey ausnutzen"
AUS_utilize_fey_desc:0	"Emil Fey, ein Anführer der Heimwehr und Rivale von Starhemberg, behindert unsere Bemühungen, aber mit genügend Überzeugungskraft könnten wir einen Kompromiss mit ihm schließen."
AUS_get_rid_of_schuschnigg:0	"Der zweite Heimwehr-Putsch"
AUS_get_rid_of_schuschnigg_desc:0	"Wir haben endlich genug Einfluss in der Nation gesammelt. Starhemberg wird einen Putsch in Wien anführen, und die Polizei wird nichts tun, um uns aufzuhalten!"
AUS_new_austrian_state:0	"Ein neuer österreichischer Staat"
AUS_new_austrian_state_desc:0	"Mit der Beseitigung von Schuschnigg haben wir uns endlich von der Schwäche und dem Defätismus befreit, die diese Nation plagen. Es ist an der Zeit, unseren Mantel als Großmacht in Europa zurückzuerobern!"
AUS_purge_opposition:0	"Säubern Sie die Opposition"
AUS_purge_opposition_desc:0	"Nachdem wir die Macht ergriffen haben, müssen wir die Gegner in unserer Regierung, die Schuschnigg noch immer treu ergeben sind, beseitigen."
AUS_purge_fey:0	"Fey beseitigen"
AUS_purge_fey_desc:0	"Fey war nützlich im Kampf gegen Schuschnigg, aber er hat seinen Zweck überlebt. Es ist an der Zeit, ihn und seine Fraktion zu beseitigen und die Macht unter Starhemberg zu konsolidieren."
AUS_compromise_with_fey:0	"Kompromiss mit Fey"
AUS_compromise_with_fey_desc:0	"Obwohl Starhemberg und Fey ihre Differenzen hatten, arbeiten wir an einem gemeinsamen Ziel und müssen zusammenarbeiten."
AUS_dolfuss_true_successor:0	"Der wahre Nachfolger von Dolfuss"
AUS_dolfuss_true_successor_desc:0	"Starhemberg war der designierte Nachfolger von Dolfuss, und nur durch die Intervention von Präsident Miklas konnte Schuschnigg Kanzler werden. Jetzt, da Schuschnigg nicht mehr im Amt ist, kann das Volk endlich erkennen, wer der wahre Nachfolger von Dolfuss ist!"
AUS_empower_the_industrialists:0	"Ermächtigen Sie die Industriellen"
AUS_empower_the_industrialists_desc:0	"Ein großer Teil unserer Unterstützung kommt von den Industriellen, die Teil unseres Gesellschaftssystems sind. Wir müssen sie stärken, zum Wohle unserer Industrie."
AUS_reorganize_the_heimwehr:0	"Reorganisieren Sie die Heimwher"
AUS_reorganize_the_heimwehr_desc:0	"Wenn wir unseren Einfluss auf die Nation bewahren wollen, müssen wir die Heimwehr zu einer funktionierenden Armee umstrukturieren, die unsere Interessen schützen kann. "
AUS_integrate_into_the_bundesheer:0	"Integrieren Sie sich in das Bundesheer"
AUS_integrate_into_the_bundesheer_desc:0	"Wir sollten nicht zulassen, dass unsere politischen Ziele die Sicherheit der Nation gefährden. Wir sollten die Heimwehr in das Bundesheer integrieren und dabei etwas politische Macht für eine kompetentere Armee opfern."
AUS_mass_industrialization:0	"Massenindustrialisierung"
AUS_mass_industrialization_desc:0	"Wenn wir unsere Wirtschaft wieder auf die Größe einer Regionalmacht bringen wollen, müssen wir eine Massenindustrialisierung durchführen und zusätzliche Industriesektoren im ganzen Land fördern."
AUS_catholic_german_identity:0	"Katholische deutsche Identität"
AUS_catholic_german_identity_desc:0	"Unsere katholische Identität ist nicht nur österreichisch, sondern Teil einer größeren katholischen deutschen Identität, die wir mit unseren benachbarten Brüdern teilen. Wir müssen unsere Einheit erkennen und sie befreien!"
AUS_our_bavarian_brothers:0	"Unsere bayerischen Brüder"
AUS_our_bavarian_brothers_desc:0	"Unsere katholischen Brüder in Bayern werden vom Nazi-Stiefel unterdrückt. Wir müssen sie befreien!"
AUS_go_it_alone:0	"Alleine gehen"
AUS_go_it_alone_desc:0	"Genug! Österreich war einst und wird wieder eine Großmacht sein. Wir brauchen niemanden, der uns beschützt, wir können auf uns selbst zählen!"
AUS_ally_italy:0	"Setzen Sie die italienische Allianz fort"
AUS_ally_italy_desc:0	"Die italienischen Faschisten haben sich schon lange als unser größter Verbündeter erwiesen. Nachdem sie uns während des brutalen Juli-Putsches geholfen haben, sollten wir darauf vertrauen können, dass sie uns auch gegen die Nazis schützen."
AUS_accept_inevitable:0	"Akzeptieren Sie das Unvermeidliche"
AUS_accept_inevitable_desc:0	"Es hat keinen Zweck. Die westlichen Verbündeten werden uns niemals beschützen, und die Italiener sind zu sehr mit den Deutschen befreundet, um verlässlich zu sein. Wir sollten versuchen, mit den Deutschen zu verhandeln, und vielleicht können wir günstige Bedingungen erreichen."
AUS_appoint_inquart:0	"Ernennen Sie Seyss-Inquart"
AUS_appoint_inquart_desc:0	"Arthur Seyss-Inquart ist ein zuverlässiger Verbündeter der Nazis. Wenn wir ihn in die Regierung berufen, zeigen wir damit unseren guten Willen."
AUS_support_southern_heimwehr:0	"Unterstützen Sie die südliche Heimwehr"
AUS_support_southern_heimwehr_desc:0	"Die Heimwehr-Milizen im Süden unterstützen unsere Sache. Wir sollten ihnen im Gegenzug für ihre Unterstützung unseres Putsches so viel Hilfe wie möglich zukommen lassen."
AUS_integrate_heimwehr:0	"Integrieren Sie die Heimwehr"
AUS_integrate_heimwehr_desc:0	"Die Heimwehr als eigenständige Einheit agieren zu lassen, mag kurzfristig von Vorteil sein, aber langfristig wird es unser Land sicherlich destabilisieren. Es wäre besser, sie direkt in unsere Streitkräfte zu integrieren."
AUS_secure_the_countryside:0	"Sichern Sie das Umland"
AUS_secure_the_countryside_desc:0	"Wir können nicht hoffen, dass wir die Polizei in den dichten städtischen Zentren herausfordern können. Stattdessen müssen wir unsere bereits starke Stellung auf dem Land sichern und unsere Dominanz dort festigen."
AUS_infiltrate_vienna:0	"Infiltrieren Sie Wien"
AUS_infiltrate_vienna_desc:0	"Es mag zwar gefährlich sein, aber die Infiltration der Hauptstadt der Nation wäre ein entscheidender Schlag gegen die Regierung, da unsere Unterstützer direkt vor ihrer Nase sitzen."
AUS_cast_the_die:0	"Werfen Sie die Würfel"
AUS_cast_the_die_desc:0	"Die Zeit ist gekommen. Österreich wird wieder deutsch sein!"
AUS_independent_nazi:0	"Unser Schicksal allein"
AUS_independent_nazi_desc:0	"Während wir zu den Idealen Adolf Hitlers aufschauen und seine Bemühungen gerne unterstützen, muss Österreich weiterhin ein unabhängiger Staat sein, der die Interessen seines Volkes schützt."
AUS_integrate_vf_remnants:0	"Der Deutschsoziale Volksbund"
AUS_integrate_vf_remnants_desc:0	"Durch die Integration bestimmter Überbleibsel der VF-Regierung können wir dem deutschen Einfluss in unserer Partei entgegenwirken und den Weg für einen unabhängigen nationalsozialistischen österreichischen Staat ebnen."
AUS_political_crackdowns:0	"Politische Niederschlagung"
AUS_political_crackdowns_desc:0	"Wir müssen hart gegen jede Opposition gegen unsere Regierung vorgehen. Wir dürfen nicht zulassen, dass der Dissens außer Kontrolle gerät."
AUS_austria_is_austrian:0	"Österreich ist österreichisch"
AUS_austria_is_austrian_desc:0	"Das österreichische Volk mag zwar Teil der großdeutschen Identität sein, aber wir haben unseren eigenen Weg eingeschlagen, einen Weg, auf dem das österreichische Volk über sich selbst herrscht."
AUS_the_austrian_fuhrer:0	"Der österreichische Führer"
AUS_the_austrian_fuhrer_desc:0	"Josef Leopold hat es geschafft, das österreichische Volk gegen unsere Feinde zu vereinen, er hat es geschafft, die Nation vor dem totalen Untergang zu bewahren. Er ist wirklich der österreichische Führer."
AUS_destroy_heimwehr:0	"Zerstören Sie die Heimwehr"
AUS_destroy_heimwehr_desc:0	"Nach dem Ende des Bürgerkriegs ist es an der Zeit, die Überreste der Heimwehr zu beseitigen, die unser Land noch immer destabilisieren."
AUS_intervention_in_liechtenstein_nazi:0	"Intervention in Liechtenstein"
AUS_intervention_in_liechtenstein_nazi_desc:0	"Im Fürstentum Liechtenstein gibt es eine aktive pro-nazistische Bewegung, die von der Regierung unterdrückt wird. Wir müssen intervenieren, um sie an die Macht zu bringen."
AUS_italian_reconciliation_nazi:0	"Versöhnung mit Italien"
AUS_italian_reconciliation_nazi_desc:0	"Obwohl wir unsere Ansprüche an die Italiener haben, wäre es vielleicht besser, sie aufzugeben, um ein Bündnis zu unserer Verteidigung zu schließen."
AUS_inquart_backstab:0	"Inquarts Hinterlist"
AUS_inquart_backstab_desc:0	"Österreichs Schicksal muss mit dem Deutschlands verknüpft werden. Arthur Seyss-Inquart muss die Kontrolle über die Regierung übernehmen und unser Land näher an Deutschland heranführen."
AUS_german_economic_development:0	"Deutsche Wirtschaftsentwicklung"
AUS_german_economic_development_desc:0	"Die deutschen Sanktionen haben der österreichischen Wirtschaft großen Schaden zugefügt. Mit deutscher Unterstützung können wir unserer Nation zu neuen Höhen verhelfen."
AUS_anschluss:0	"Anschluss"
AUS_anschluss_desc:0	"Österreich ist deutsch, war schon immer deutsch und wird nun formell mit unseren deutschen Brüdern wiedervereint werden."
AUS_rp_ostmark:0	"Reichsgau Ostmark"
AUS_rp_ostmark_desc:0	"Obwohl unsere Nation mit Deutschland verbunden ist, wäre ein gewisses Maß an Autonomie wünschenswert, um einzigartige Aspekte der österreichischen Kultur zu bewahren."
AUS_integrate_economy:0	"Integrierte Volkswirtschaften"
AUS_integrate_economy_desc:0	"Um unsere wirtschaftlichen Probleme zu lösen, müssen wir unsere Wirtschaft eng an Deutschland anbinden."
AUS_technology_integration:0	"Gemeinsame Nutzung deutscher Technologie"
AUS_technology_integration_desc:0	"Wir sollten unsere Forschungseinrichtungen mit den deutschen zusammenlegen, um unsere Fähigkeiten zu stärken."
AUS_german_industrial_investments:0	"Deutsche Industrieinvestitionen"
AUS_german_industrial_investments_desc:0	"Wenn wir die Deutschen davon überzeugen, in unserem Land zu investieren, wird sich unsere Fähigkeit, sie in ihren Kriegen zu unterstützen, erheblich verbessern."
AUS_use_the_ss:0	"Nutzen Sie die SS"
AUS_use_the_ss_desc:0	"Der Einsatz der SS zur Unterdrückung jeglicher Opposition wird dazu beitragen, unsere Herrschaft weiter zu festigen."
AUS_request_control_slovenia:0	"Verlangen Sie die Kontrolle über Slowenien"
AUS_request_control_slovenia_desc:0	"Seit der Auflösung des Staates Venedig gehört Slowenien uns, und die Slowenen wollten schon immer Teil des germanischen Volkes sein. Wir sollten verlangen, dass die Deutschen die Kontrolle darüber von [102.controller.GetNameDef] fordern."
AUS_july_followed_june:0	"Auf den Juni folgte der Juli"
AUS_july_followed_june_desc:0	"Ein Jahr nach dem Verbot der österreichischen NSDAP am 19. Juni 1933 führte die Schutzstaffel einen gescheiterten Putsch gegen die Regierung der Vaterländischen Front an. Während des blutigen Putsches am 25. Juli wurde das gesamte Bundesheer mobilisiert, um die SS-Truppen zu bekämpfen, und es gelang schließlich, sie zu besiegen. Allerdings wurde Bundeskanzler Engelbert Dollfuß während der Kämpfe getötet, so dass sich unser neues Regime in einer sehr verwundbaren Situation befand.\n\n Nachdem Kurt Schuschnigg nach dem Tod von Dollfuß die Macht übernommen hatte, erklärte er, dass er dafür sorgen werde, dass sich ein solches Ereignis nie wieder ereignen werde, allerdings gibt es immer noch Anhänger der Nazis, die unser Land schwer destabilisieren."
AUS_memories_of_februarkampfe:0	"Erinnerungen an Februarkämpfe"
AUS_memories_of_februarkampfe_desc:0	"Während der Übernahme der Vaterländischen Front kam es zu einem kurzen Bürgerkrieg zwischen den Regierungstruppen unter dem faschistischen Regime von Engelbert Dollfuss und der sozialdemokratischen Republikanischen Verteidigungsliga. Der Bundesregierung gelang es schließlich, die republikanischen Kräfte zu besiegen, aber die Narben sind immer noch vorhanden und in vielen größeren Städten gibt es immer noch eine beträchtliche Unterstützung für die sozialistischen Parteien."
AUS_reliant_on_lon_1:0	"Leichte Abhängigkeit von den Krediten des Völkerbundes"
AUS_reliant_on_lon_1_desc:0	"Seit der Völkerbund uns 1922 ein Darlehen zur Rettung unserer Wirtschaft gewährt hat, ist unser Land auf Kredite der internationalen Gemeinschaft angewiesen, um sich über Wasser zu halten. Sollte etwas passieren, das den internationalen Status quo stört, wären wir in großen Schwierigkeiten."
AUS_reliant_on_lon_2:0	"Mäßige Abhängigkeit von Völkerbunddarlehen"
AUS_reliant_on_lon_2_desc:0	"Seit der Völkerbund uns 1922 ein Darlehen gewährt hat, um unsere Wirtschaft zu retten, ist unser Land auf Darlehen der internationalen Gemeinschaft angewiesen, um sich über Wasser zu halten. Sollte etwas passieren, das den internationalen Status quo stört, wären wir in großen Schwierigkeiten."
AUS_reliant_on_lon_3:0	"Große Abhängigkeit von Völkerbunddarlehen"
AUS_reliant_on_lon_3_desc:0	"Seit der Völkerbund uns 1922 ein Darlehen gewährt hat, um unsere Wirtschaft zu retten, ist unser Land auf Darlehen der internationalen Gemeinschaft angewiesen, um sich über Wasser zu halten. Sollte etwas passieren, das den internationalen Status quo stört, wären wir in großen Schwierigkeiten."
AUS_reliant_on_lon_4:0	"Extreme Abhängigkeit von Völkerbunddarlehen"
AUS_reliant_on_lon_4_desc:0	"Seit der Völkerbund uns 1922 ein Darlehen gewährt hat, um unsere Wirtschaft zu retten, ist unsere Nation auf Darlehen der internationalen Gemeinschaft angewiesen, um sich über Wasser zu halten. Sollte etwas passieren, das den internationalen Status quo stört, wären wir in großen Schwierigkeiten."
AUS_president_miklas:0	"Wilhelm Miklas (Präsident von Österreich)"
AUS_president_miklas_desc:0	"Der 1928 von der Bundesversammlung gewählte Präsident Wilhelm Miklas überwachte zwei Bürgerkriege und den Übergang Österreichs von einer demokratischen Republik zu einem faschistischen Staat, wobei er zu keinem Zeitpunkt seine Macht nutzte, um einzugreifen und die Ereignisse zu stoppen. Diese Rückgratlosigkeit hat dazu geführt, dass er zu einer Marionette von Schuschniggs Regierung wurde."
AUS_president_miklas_supportive:0	"Wilhelm Miklas (Präsident von Österreich)"
AUS_president_miklas_supportive_desc:0	"Nach dem kürzlichen Zusammenbruch der Regierung Schuschnigg hat Präsident Miklas seine Unterstützung für die neue Regierung bekundet."
AUS_president_seitz:0	"Karl Seitz (Präsident von Österreich)"
AUS_president_seitz_desc:0	"Karl Seitz, ein langjähriges Mitglied der SDAPÖ, war vom Zusammenbruch des Kaiserreichs 1918 bis zum Machtverlust der SDAPÖ im Jahr 1920 Präsident von Österreich. Seitz setzte seine Mitgliedschaft in der Partei bis zum Verbot der Oppositionsparteien unter der Regierung Dolfuss fort. Nachdem die SDAPÖ die Macht zurückerobert hatte, meldete sich Seitz freiwillig für das Amt des Staatspräsidenten, da die Partei einen erfahrenen Führer benötigte."
AUS_president_starhemberg:0	"Ernst Rüdiger Starhemberg (Präsident von Österreich) "
AUS_president_starhemberg_desc:0	"Ernst Rüdiger Starhemberg, Kommandeur der Heimwehr und Schuschniggs Anwärter auf die Nachfolge von Dolfuss, ist seit der Gründung der Vaterländischen Front ein erbitterter Feind Schuschniggs. \n\n Da sich das Kräfteverhältnis auf die Seite der Heimwehr verschoben hat, konnte der Heimatblock Starhemberg in das Amt des Präsidenten einsetzen, obwohl viele glauben, dass dies nur der erste Schritt auf seinem Weg zur Macht ist."
AUS_lon_collapsed:0	"Zusammenbruch des Völkerbundes"
AUS_lon_collapsed_desc:0	"Mit dem Zusammenbruch des Völkerbundes hat uns unsere Abhängigkeit von internationalen Krediten in einen vorübergehenden wirtschaftlichen Kollaps gestürzt. Damit müssen wir richtig umgehen."
AUS_great_depression:0	"Die Große Depression"
AUS_great_depression_desc:0	"Obwohl das Schlimmste der Großen Depression hinter uns liegt, hat unsere Abhängigkeit von internationalen Krediten zur Finanzierung unseres Aufschwungs uns in einen schlechten Zustand gebracht."
AUS_coal_mining:0	"Ampflwang Kohlebergwerke"
AUS_coal_mining_desc:0	"Wenn wir unsere Kohlereserven voll ausschöpfen, sind wir weniger auf ausländische Exporte angewiesen."
AUS_constricted_parliament:0	"Eingeengtes Parlament"
AUS_constricted_parliament_desc:0	"Auch wenn wir dem Parlament eine gewisse Autonomie zugestehen, darf es sich nicht zu weit von [AUS.GetLeader]s Richtlinien entfernen."
AUS_thousand_mark_ban:0	"Das Tausend-Mark-Verbot"
AUS_thousand_mark_ban_desc:0	"Das kurz nach der Machtübernahme von Engelbert Dolfuss in Kraft getretene Tausend-Mark-Verbot, das jeden deutschen Staatsbürger bei der Einreise nach Österreich zwang, eine Gebühr von 1.000 Mark an das Reich zu zahlen, ist nur eine der vielen wirtschaftlichen Sanktionen, die Deutschland gegen Österreich verhängt hat. Diese Sanktionen haben die österreichische Wirtschaft lahmgelegt, und wir müssen einen Weg finden, das Embargo aufzuheben."
AUS_july_agreement:0	"Juliabkommen"
AUS_july_agreement_desc:0	"Das jüngste Abkommen, das wir mit den Deutschen unterzeichnet haben, hat das Embargo gegen uns aufgehoben, aber es hat einen hohen Preis: Wir wurden gezwungen, mehrere Nazi-Minister in unsere Regierung zu berufen, was unser Land näher an [GER.GetNameDef] heranbrachte."
AUS_finding_new_trade_partners:0	"Neue Handelspartner finden"
AUS_finding_new_trade_partners_desc:0	"Da die Nazis sich weigern, ihre Sanktionen gegen unser Land aufzuheben, müssen wir uns nach neuen Handelspartnern umsehen, die uns helfen, unsere Wirtschaft wieder aufzubauen."
AUS_church_influence:0	"Einfluss der katholischen Kirche"
AUS_church_influence_desc:0	"Unser Bündnis mit der katholischen Kirche ist für uns von größter Bedeutung und kommt uns sehr zugute."
AUS_industrialist_support:0	"Unterstützung durch Industrielle"
AUS_industrialist_support_desc:0	"Unsere Regierung wird von den Großindustriellen unseres Landes unterstützt, die unserer Wirtschaft zugute kommen."
AUS_weakened_federal_army:0	"Geschwächte Bundesarmee"
AUS_weakened_federal_army_desc:0	"Elemente des Heimatblocks haben ihre Macht genutzt, um das Bundesheer zu schwächen, damit die Regierung stärker auf die Heimwehr angewiesen ist."
AUS_militia_army:0	"Milizarmee"
AUS_militia_army_desc:0	"Indem wir das Bundesheer geschwächt haben, konnten wir unsere politische Macht ausbauen, haben aber auch unsere militärischen Fähigkeiten leicht geschwächt, da die Heimwehr keine professionelle Kampftruppe ist."
AUS_integrated_army:0	"Heimwehr integriert"
AUS_integrated_army_desc:0	"Die Heimwehr-Milizen wurden in das Bundesheer integriert, was unsere Kampffähigkeiten erheblich gestärkt hat, wenn auch auf Kosten des politischen Einflusses."
AUS_liechtenstein_properties:0	"Böhmische Liegenschaften zurückgegeben"
AUS_liechtenstein_properties_desc:0	"Die Rückgabe unserer Besitztümer in Böhmen an ihre rechtmäßigen Besitzer hat unsere Wirtschaft stark angekurbelt."
AUS_united_front:0	"Eine vereinte Front"
AUS_united_front_desc:0	"Angesichts der bevorstehenden deutschen Bedrohung haben wir mit allen Teilen unserer Gesellschaft eine Einheitsfront gebildet. Gemeinsam können wir für die Verteidigung eines unabhängigen Österreichs kämpfen!"
AUS_may_constitution_repealed:0	"Aufhebung der Maiverfassung"
AUS_may_constitution_repealed_desc:0	"Die Maiverfassung, die so viel Schande über unser Land gebracht hat, ist endlich aufgehoben worden. Nur jetzt können wir auf eine demokratische Zukunft für Österreich hinarbeiten."
AUS_hungarian_opposition:0	"Ungarische Opposition"
AUS_hungarian_opposition_desc:0	"Das Scheitern der Eisenstädter Konferenz hat dazu geführt, dass sich die ungarische Bevölkerung gegen unsere Regierung auflehnt. Jede Integration Ungarns muss in einer besonderen Angelegenheit behandelt werden."
AUS_hungarian_civilian_government:0	"Ungarische Zivilregierung"
AUS_hungarian_civilian_government_desc:0	"Die Wiedereinführung einer zivilen Regierung in Ungarn ermöglicht es den Ungarn, ihre Abneigung angemessen zu kanalisieren und hilft uns, die Region schneller zu integrieren."
AUS_hungarian_martial_law:0	"Kriegsrecht in Ungarn"
AUS_hungarian_martial_law_desc:0	"Wir haben das Militär eingesetzt, um den Widerstand in Ungarn zu unterdrücken. Das hat uns zwar wertvolle Ressourcen gekostet, aber es hat jegliche Opposition effektiv unterdrückt."
AUS_heimwehr_remnants:0	"Überbleibsel der Heimwehr"
AUS_heimwehr_remnants_desc:0	"Die Entscheidung, die Heimwehr nicht vor dem Bürgerkrieg zu integrieren, hat unser Land destabilisiert."
AUS_austria_is_german:0	"Österreich ist deutsch"
AUS_austria_is_german_desc:0	"Niemand kann die unbestreitbare Tatsache widerlegen, dass Österreich eine deutsche Nation ist und immer war! Nur gemeinsam liegt unser Schicksal in der Hand!"
AUS_imperial_naval_academy:0	"Marineakademie Rijeka"
AUS_imperial_naval_academy_desc:0	"Die Marineakademie von Rijeka wird die besten und klügsten Marineoffiziere ausbilden."
AUS_farmer_payments:0	"Zahlungen für die Landwirtschaft"
AUS_integrated_economies:0	"Integrierte Volkswirtschaften"
AUS_integrated_economies_desc:0	"Die Verknüpfung unserer Wirtschaft mit [AUS.GetNameDefCap] hat es unseren zivilen Industrien ermöglicht, effizienter zusammenzuarbeiten."
AUS_integrated_military:0	"Integrierte Produktion"
AUS_integrated_trade:0	"Integrierter Handel"
AUS_language_issue:0	"Militärisches Sprachproblem"
AUS_language_issue_desc:0	"Mit unserer jüngsten Expansion und den Versuchen, nicht-deutschsprachige Bevölkerungsgruppen aus unseren neuen Gebieten zu rekrutieren, wurde unsere Armee von Koordinationsproblemen geplagt, die dadurch entstanden, dass rangniedrige Offiziere die Befehle ihrer Vorgesetzten in deutscher Sprache nicht verstanden. Dies lähmt die Organisationsstruktur unserer Armee, und eine Lösung muss eher früher als später gefunden werden."
AUS_german_aero_tech:0	"[GER.GetAdjective] Flugzeugkonstruktionen"
AUS_german_aero_tech_desc:0	"Unsere [GER.GetAdjective] Verbündeten haben uns Zugang zu ihren neuesten Flugzeugdesigns gegeben."
AUS_british_aero_tech:0	"[ENG.GetAdjective] Flugzeugentwürfe"
AUS_british_aero_tech_desc:0	"Unsere [ENG.GetAdjective] Verbündeten haben uns Zugang zu ihren neuesten Flugzeugdesigns gewährt."
AUS_soviet_aero_tech:0	"[SOV.GetAdjective] Flugzeugdesigns"
AUS_soviet_aero_tech_desc:0	"Unsere [SOV.GetAdjective] Verbündeten haben uns Zugang zu ihren neuesten Flugzeugdesigns gewährt."
austria.0.t:0	"Der dritte österreichische Bürgerkrieg"
austria.0.d:0	"Seit dem Juli-Putsch befürchteten viele, dass die Nazi-Partei erneut versuchen würde, die Regierung anzugreifen. Ihre Befürchtungen haben sich bewahrheitet.\n\nHeute haben sich im ganzen Land Armeedivisionen, von denen es hieß, sie seien insgeheim loyal zu den Nazis, gegen die Regierung erhoben und unterstützen die Nazi-Regierung in Deutschland. Die Regierung hat alle verbleibenden Armeeeinheiten auf ihre Seite gezogen, um zu versuchen, sie zu stoppen, aber nur die Zeit wird zeigen, ob dies erfolgreich sein wird."
austria.0.a:0	"Die Verräter müssen zerschlagen werden!"
austria.0.b:0	"Lang lebe ein deutsches Österreich!"
austria.1.t:0	"Die Remilitarisierung des Rheinlandes "
austria.1.d:0	"Es war unvermeidlich.\n\n Jeder wusste, dass der Vertrag von Versailles keinen Bestand haben würde, aber viele waren überrascht, dass er so schnell gebrochen wurde. Das ist für uns von größter Bedeutung, denn der Vertrag sichert die Unabhängigkeit unseres Staates, auch wenn ein großer Teil der Bevölkerung sowohl in Deutschland als auch in Österreich die Vereinigung der beiden Nationen wünscht.\n\nWenn wir unsere Unabhängigkeit bewahren wollen, müssen wir uns nach außen orientieren, und zwar schnell, bevor die Nazis anfangen, nach Orten Ausschau zu halten, um ihren Einfluss auszuweiten."
austria.1.a:0	"Tick, Tock."
austria.2.t:0	"Der Blick nach außen "
austria.2.desc:0	"Man muss zu der Erkenntnis kommen, dass Österreich nicht allein gegen Deutschland bestehen kann. Wenn unsere Nation ihre Unabhängigkeit bewahren will, müssen wir nach außen schauen, um uns zu schützen.\n\nEs gibt drei Möglichkeiten:\n\nDie erste Möglichkeit ist, unser bestehendes Bündnis mit [ITA.GetNameDef] zu erweitern. Das scheint die logische Wahl zu sein, denn die [ITA.GetAdjective] unterstützen bereits unser Regime und sie würden wahrscheinlich keine Forderungen an unsere Regierung stellen. Einige Mitglieder der Regierung haben jedoch zu Recht darauf hingewiesen, dass die [ITA.GetAdjective] sich für die Nazis in Deutschland zu erwärmen scheinen und sie befürchten, dass sie uns für sie aufgeben könnten, wenn sie uns als Belastung für ihre Beziehung sehen.\n\nUnsere zweite Option ist es, mit den Westmächten in Verhandlungen zu treten. Auch wenn wir politisch vielleicht nicht einer Meinung sind, wollen Großbritannien und Frankreich Deutschland schwach halten, und indem sie unsere Unabhängigkeit schützen, erreichen sie dieses Ziel. Allerdings könnten sie Forderungen bezüglich unserer Verwaltung stellen und uns nur unterstützen, wenn wir bestimmten Reformen zustimmen.\n\nUnsere dritte und letzte Option ist es, mit Deutschland zu verhandeln. Obwohl Schuschnigg dagegen ist, wollen einige Mitglieder der Regierung ihn dazu drängen, mit den Nazis zu verhandeln, um vielleicht eine begrenzte Autonomie anstelle einer vollständigen Annexion durch Deutschland zu erreichen.\n\nEs ist an der Zeit zu wählen. Wir können nicht länger warten."
austria.2.a:0	"Die Italiener sind unsere Verbündeten. Ihnen kann man vertrauen."
austria.2.b:0	"Die Italiener sind zu freundlich zu den Deutschen. Schauen Sie nach Westen."
austria.2.c:0	"Wir müssen das Unvermeidliche akzeptieren. Setzen Sie Schuschnigg unter Druck und nehmen Sie Verhandlungen auf."
austria.2.d:0	"Genug! Wir können uns selbst verteidigen!"
austria.2.e:0	"Wir sind allein. Gott helfe uns."
austria.3.t:0	"[AUS.GetNameDefCap] Bittet um Schutz"
austria.3.d:0	"[AUS.GetLeader] hat sich wegen der jüngsten deutschen Remilitarisierung des Rheinlandes an uns gewandt. Die Führung von [AUS.GetAdjective] glaubt, dass es nach der eklatanten Missachtung des Versailler Vertrages durch die Deutschen nur eine Frage der Zeit ist, bis sie versuchen, Österreich in ihr Reich einzugliedern, und bittet uns daher um Schutz im Rahmen unseres Bündnisses.\n\nEinige Mitglieder unserer Regierung sind der Meinung, dass wir nicht zweimal darüber nachdenken sollten, Österreich, unseren Verbündeten, zu schützen, während andere sagen, dass das Risiko, unsere Beziehung zu den Deutschen zu ruinieren, zu hoch ist.\n\nWas sollen wir tun?"
austria.3.a:0	"Sie sind unsere Verbündeten. Beschützen Sie sie."
austria.3.b:0	"Wir können nicht riskieren, unsere Beziehung zu den Deutschen zu ruinieren."
austria.4.t:0	"[ITA.GetNameDefCap] erklärt sich bereit, uns zu beschützen"
austria.4.d:0	"[ITA.GetLeader] hat sich bereit erklärt, uns gegen die Deutschen zu schützen und beruft sich dabei auf die große Allianz zwischen unseren faschistischen Nationen. Wir können nur hoffen, dass dies ausreicht, um die Deutschen von irgendwelchen Ideen abzuhalten."
austria.4.a:0	"Wir können uns auf sie verlassen."
austria.5.t:0	"[ITA.GetNameDefCap] weigert sich, uns zu beschützen"
austria.5.d:0	"[ITA.GetLeader] hat sich schlichtweg geweigert, uns vor den Deutschen zu schützen. Es scheint, als ob ihr Wunsch nach einem Bündnis mit ihnen größer ist als ihr derzeitiges Bündnis mit uns."
austria.5.a:0	"Wir sind allein. Gott helfe uns."
austria.5.b:0	"Wir müssen andere Möglichkeiten finden. "
austria.6.t:0	"[AUS.GetNameDefCap] bittet um Schutz"
austria.6.d:0	"[AUS.GetLeader] hat sich wegen der jüngsten deutschen Remilitarisierung des Rheinlandes an uns gewandt. Die Führung von [AUS.GetAdjective] glaubt, dass es nach der eklatanten Missachtung des Versailler Vertrags durch die Deutschen nur eine Frage der Zeit ist, bis sie versuchen, Österreich in ihr Reich zu integrieren, und bittet uns daher um Schutz. Da es unser Ziel ist, Deutschland schwach zu halten, könnte dies eine Überlegung wert sein, obwohl wir wahrscheinlich Reformen ihrer Regierung und die eventuelle Wiederherstellung freier Wahlen fordern sollten, wenn sie von uns geschützt werden sollen."
austria.6.a:0	"Wir werden es tun, aber sie müssen sich reformieren."
austria.6.b:0	"Das ist nicht in unserem Interesse."
austria.7.t:0	"[FROM.GetNameDefCap] Fordert demokratische Reformen"
austria.7.d:0	"[FROM.GetLeader] hat geäußert, dass [FROM.GetNameDef] bereit ist, uns zu schützen, aber sie verlangen im Gegenzug, dass wir unsere Beschränkungen für Oppositionsparteien aufheben und in Zukunft freie Wahlen abhalten. Diese Forderung wird von vielen Regierungsmitgliedern als lächerlich empfunden, doch viele sehen in diesem Bündnis unsere einzige Chance, vor Deutschland geschützt zu werden.\n\nDa das Land durch diese Entscheidung gespalten ist, hat Schuschnigg selbst die Idee geäußert, eine moderate Wiedereinsetzung Otto von Habsburgs als einigende Figur für die Nation in diesen Zeiten vorzuschlagen, und er glaubt, dass die Alliierten zu verzweifelt sind, um Deutschland zu schwächen, als dass sie uns diese Bitte verweigern könnten.\n\nWas werden wir tun?"
austria.7.a:0	"Akzeptieren Sie die Reformen. Das ist unsere einzige Wahl."
austria.7.b:0	"Vielleicht werden sie bereit sein, unseren Kompromiss zu akzeptieren."
austria.7.c:0	"Keine Kompromisse! Wir werden jemand anderen finden."
austria.8.t:0	"[AUS.GetNameDef] Akzeptiert unsere Forderungen"
austria.8.d:0	"Die [AUS.GetAdjective]-Führung hat unsere Forderungen akzeptiert. Wir werden sie vor den Deutschen schützen, und sie werden demokratische Reformen einleiten. Das ist ein großer Sieg für uns, denn wir haben sowohl Deutschland geschwächt als auch ein neues Land in unseren Einflussbereich gebracht."
austria.8.a:0	"Sehr gut."
austria.9.t:0	"[AUS.GetNameDefCap] schlägt Habsburger Kompromiss vor "
austria.9.d:0	"[AUS.GetLeader] ist mit einem Kompromiss bezüglich unserer Forderungen zu uns zurückgekehrt - Otto von Habsburg wird als verfassungsmäßige Galionsfigur eines gemäßigten Österreichischen Reiches wiederhergestellt. Einige Mitglieder der Regierung halten dies für lächerlich - wir haben vor nicht einmal 20 Jahren einen Krieg gegen sie geführt. Einige sind jedoch der Meinung, dass es ein zu großes Risiko ist, Österreich in die Hände Deutschlands fallen zu lassen, und wir sollten trotzdem zustimmen."
austria.9.a:0	"Sie können ihre Restauration haben."
austria.9.b:0	"Unsere Forderungen sind klar."
austria.10.t:0	"[FROM.GetNameDefCap] nimmt den Habsburger Kompromiss an"
austria.10.d:0	"Die [FROM.GetAdjective] Delegierten haben unseren Kompromiss akzeptiert - Otto von Habsburg wird als verfassungsmäßige Galionsfigur eines gemäßigten Österreichischen Reiches wiederhergestellt."
austria.10.a:0	"Ein großer Erfolg!"
austria.11.t:0	"[FROM.GetNameDefCap] lehnt Habsburger Kompromiss ab"
austria.11.d:0	"[FROM.Adjective] Delegierte haben unseren Kompromiss rundheraus abgelehnt, mit der Begründung, dass sie die Wiederherstellung desselben Reiches, das sie vor 20 Jahren nicht bekämpft haben, nicht unterstützen werden. Sie fordern weiterhin, dass wir unsere Beschränkungen für Oppositionsparteien aufheben und in Zukunft freie Wahlen abhalten."
austria.11.a:0	"Wir sollten ihre Forderungen akzeptieren, bevor es zu spät ist."
austria.11.b:0	"Wir sind hier fertig. Wir können anderswo Verbündete finden."
austria.12.t:0	"[FROM.GetNameDefCap] weigert sich, uns zu beschützen"
austria.12.d:0	"[FROM.GetLeader] hat sich schlichtweg geweigert, uns gegen die Deutschen zu schützen. Vielleicht waren unsere Differenzen doch zu groß."
austria.12.a:0	"Wir müssen andere Möglichkeiten finden. "
austria.13.t:0	"[AUS.GetNameDefCap] bittet um Verhandlungen"
austria.13.d:0	"[AUS.GetLeader] hat sich an unsere Regierung gewandt und behauptet, dass es immer offensichtlicher wird, dass wir sie in unser Reich eingliedern wollen, und sie wünschen zu verhandeln.\n\nDie [AUS.GetAdjective] haben vorgeschlagen, dass Österreich ein autonomes Subjekt Deutschlands wird und wir es im Gegenzug nicht besetzen würden."
austria.13.a:0	"Wir können diesen Kompromiss akzeptieren, aber eine freundliche Regierung muss die Macht übernehmen."
austria.13.b:0	"Wir haben andere Pläne für sie."
austria.14.t:0	"[GER.GetNameDefCap] fordert die Machtübernahme durch die Nazis"
austria.14.d:0	"[GER.GetLeader] hat unserer Bitte, ein autonomes Subjekt zu werden, zugestimmt, verlangt aber, dass wir eine nazifreundliche Regierung einsetzen, was die Übernahme der österreichischen Nazis bedeuten würde."
austria.14.a:0	"Schuschnigg wird die Macht nicht so einfach aufgeben, aber wir können mit ihm verhandeln."
austria.14.b:0	"Inakzeptabel! Wir werden bessere Verbündete finden!"
austria.15.t:0	"[AUS.GetNameDefCap] Akzeptiert"
austria.15.d:0	"Die österreichische Führung hat sich mit uns in Verbindung gesetzt und versprochen, dass mit Schuschnigg wie gewünscht verfahren werden wird."
austria.15.a:0	"Wir warten darauf, dies zu sehen."
austria.16.t:0	"[AUS.GetNameDefCap] Weigert sich"
austria.16.d:0	"Die österreichischen Delegierten haben einen Regierungswechsel rundheraus abgelehnt, und die Verhandlungen sind gescheitert."
austria.16.a:0	"Wir werden uns noch früh genug mit ihnen befassen."
austria.17.t:0	"[GER.GetNameDefCap] Lehnt Verhandlungen ab"
austria.17.d:0	"Unsere Versuche, mit Deutschland zu verhandeln, wurden ignoriert. Wir können nur annehmen, dass das Schlimmste bevorsteht, und wir müssen uns darauf vorbereiten."
austria.17.a:0	"Wir müssen jemand anderen finden, der uns beschützt."
austria.17.b:0	"Vielleicht wäre es immer noch von Vorteil, Hitlers Regierung zu folgen."
austria.18.t:0	"[AUS.GetNameDefCap] Erhält ausländischen Schutz"
austria.18.d:0	"Die [AUS.GetAdjective], die wahrscheinlich unsere Expansionspolitik gesehen haben, haben ausländischen Schutz gegen jegliche Bedrohung durch uns erhalten. Damit sind unsere Pläne für einen Anschluss gestoppt, denn zu diesem Zeitpunkt ist es das Risiko nicht wert, in einen Krieg mit einem der großen Länder einzutreten."
austria.18.a:0	"Verwerfen Sie unsere Pläne für den Anschluss"
austria.18.b:0	"Das wird uns nicht aufhalten!"
austria.19.t:0	"SDAPÖ-Vormannschaft"
austria.19.d:0	"Mit der Rückkehr von Otto Bauer aus dem Exil stellt sich für viele die Frage, wer die SDAPÖ bei den aktuellen Wahlen anführen wird. Sowohl Karl Renner als auch Otto Bauer haben die Partei zu Zeiten der Ersten Republik gemeinsam geführt, aber jetzt, angesichts der drohenden Gefahr durch die Deutschen im Norden, haben die beiden Männer zwei unterschiedliche Pläne für die Zukunft Österreichs.\n\nWährend Renner glaubt, dass unsere beste Chance, den kommenden Sturm zu überleben, darin besteht, sich zu verschanzen und unser Land zu befestigen, ist Bauers idealistischere Sichtweise, dass es unsere Pflicht ist, das totalitäre Regime in Deutschland ein für alle Mal zu stürzen, als letzten Schritt zur Vereinigung unserer beiden Nationen.\n\nWelche soll die Partei wählen?"
austria.19.a:0	"Renners Plan ist der einzige Weg, wie wir überleben können."
austria.19.b:0	"Bauer hat den richtigen Geist!"
austria.20.t:0	"Die Rückkehr des Kaisers"
austria.20.d:0	"Unter starkem Druck der westlichen Alliierten und seiner Regierung hat Bundeskanzler Schuschnigg heute über das Radio angekündigt, dass er zurücktreten wird, um die Unabhängigkeit der österreichischen Nation zu bewahren.\n\nIn seiner herzlichen Rede verkündete Schuschnigg, dass angesichts der Bedrohung durch die Deutschen jetzt die Zeit der Einheit und nicht der Spaltung gekommen sei und dass Otto von Habsburg als einigende Figur aus dem Exil zurückkehren werde, um das österreichische Volk durch diese dunklen Tage zu führen. \n\nAuch wenn viele darin einen triumphalen Sieg und die Rückkehr zu altem österreichischem Ruhm sehen, ist die Wahrheit, dass Otto nicht mehr als eine Galionsfigur eines tief gespaltenen Parlaments ist.\n\nFür ihn gibt es noch viel zu tun."
austria.20.a:0	"Lang lebe der Kaiser!"
austria.21.t:0	"Otto übernimmt die österreichische Krone"
austria.21.d:0	"Heute hat der österreichische Bundeskanzler Kurt Schuschnigg in einer herzlichen Rede seinen Rücktritt angekündigt, um die Rückkehr der Habsburger in die Krone vorzubereiten.\n\nÖsterreich steht seit der Remilitarisierung des Rheinlands unter Druck, um sich gegen die Deutschen zu schützen, aber dieser Schutz hat seinen Preis. Der Druck der westlichen Alliierten hat Ottos neue Befugnisse effektiv auf eine bloße Galionsfigur reduziert, sehr zum Leidwesen des neuen Kaisers. Viele befürchten, dass Ottos Streben nach Macht zu weiterer Instabilität in der Nation führen wird, aber im Moment ist die Zukunft Österreichs noch unklar."
austria.21.a:0	"Könnte dies zu einer weiteren Destabilisierung des Kontinents führen?"
austria.21.b:0	"Es gibt noch viel zu tun."
austria.22.t:0	"Ein Sturz in Ungnade"
austria.22.d:0	"Als Höhepunkt eines monatelangen politischen Manövers zwischen dem Parlament und dem Kaiser wurden heute im Parlament mehrere Gesetze verabschiedet, die die Befugnisse des Kaisers weiter einschränken und seine ohnehin schon begrenzte Macht zu einer reinen Zeremonialposition machen. \n\nDamit ist der politische Kampf praktisch beendet, denn die SDAPÖ und ihre Verbündeten sind zur dominierenden politischen Kraft der Nation geworden und haben sowohl Otto als auch ihre konservativen Rivalen ins Abseits gedrängt.\n\nVielleicht war die Rückkehr der Habsburger nicht die Rückkehr zu altem Ruhm, sondern der Beginn neuen Wohlstandes."
austria.22.a:0	"Ein großer Sieg für die Demokratie."
austria.23.t:0	"Das zweite Ermächtigungsgesetz"
austria.23.d:0	"Als Höhepunkt monatelanger politischer Manöver zwischen dem Parlament und dem Kaiser haben kaisertreue Regierungsbeamte heute ein Ermächtigungsgesetz verabschiedet, das Otto zahlreiche Befugnisse einräumt, die ihn effektiv zur dominierenden politischen Kraft im Land machen, wobei das Parlament fest unter seinem Einfluss steht.\n\nÄhnlich wie bei Dolfuss' Ermächtigungsgesetz im Jahr 1934 sehen viele darin das Ende des Herumdrängens Österreichs durch andere Mächte und eine Rückkehr zu altem Ruhm, aber die Folgen dieser Entwicklung könnten unsere Beziehungen zu unseren Verbündeten belasten und uns bedrohen."
austria.23.a:0	"Ein großer Sieg für unseren Ruhm!"
austria.24.t:0	"Cousins, nicht Brüder?"
austria.24.d:0	"Vorhin ist [AUS.GetLeader] mit einem Angebot zu uns gekommen, in dem er eine Allianz zwischen unseren Nationen vorschlägt. Er erklärt, dass es töricht wäre, nicht zu erkennen, dass das ehemalige österreichisch-ungarische Reich instabil war und unsere Rivalität zu seinem Niedergang geführt hat. Unsere beiden großen Nationen wurden jedoch beide nach dem Großen Krieg gedemütigt und wir müssen uns als Partner verbünden, um unseren verlorenen Ruhm zurückzuerobern.\n\nDas könnte eine großartige Gelegenheit sein, unsere verlorenen Gebiete wiederzuerlangen. Nehmen wir an? "
austria.24.a:0	"Wir werden gemeinsam vorgehen."
austria.24.b:0	"Wir haben genug von den leeren Versprechungen der Österreicher!"
austria.25.t:0	"[HUN.GetNameDefCap] Nimmt an!"
austria.25.d:0	"[HUN.GetLeader] hat unseren Vorschlag für ein Bündnis zwischen unseren Nationen angenommen. Dies ist ein großer Tag."
austria.25.a:0	"Jetzt müssen wir uns umsehen."
austria.26.t:0	"[HUN.GetNameDefCap] Lehnt ab"
austria.26.d:0	"[HUN.GetLeader] hat unsere Bitte abgelehnt und gesagt, dass das ungarische Volk nichts mehr mit uns und unseren Versprechen zu tun haben will."
austria.26.a:0	"Sie werden dies noch bereuen."
austria.27.t:0	"[AUS.GetNameDefCap] Bietet die Teilung der Tschechoslowakei an"
austria.27.d:0	"In Übereinstimmung mit unserem Bündnis ist [AUS.GetLeader] mit einem Vorschlag zu uns gekommen, um unser verlorenes Territorium zurückzugewinnen. Er bietet uns an, die tschechoslowakischen Gebiete unter uns aufzuteilen, wobei Österreich Tschechien und wir die Slowakei erhalten sollen. Sollten wir diese Gelegenheit nutzen?"
austria.27.a:0	"Wir sollten sofort handeln."
austria.27.b:0	"Wir haben andere Dinge, um die wir uns kümmern müssen."
austria.28.t:0	"[HUN.GetNameDefCap] nimmt unseren Vorschlag an"
austria.28.d:0	"[HUN.GetLeader] hat unseren Vorschlag akzeptiert, die Tschechoslowakei zwischen uns aufzuteilen."
austria.28.a:0	"Lassen Sie uns fortfahren."
austria.29.t:0	"[HUN.GetNameDefCap] Lehnt unseren Vorschlag ab"
austria.29.d:0	"[HUN.GetLeader] hat unseren Vorschlag mit der Begründung abgelehnt, dass wir auf einen solchen Krieg nicht vorbereitet sind und uns um andere Dinge kümmern müssen."
austria.29.a:0	"Wir können es nicht allein schaffen."
austria.29.b:0	"Wir brauchen ihre Hilfe nicht."
austria.30.t:0	"[AUS.GetNameDefCap] fordert die Teilung"
austria.30.d:0	"Es ist geschehen. Seit der Rückkehr der Habsburger auf den Thron in Österreich fürchten viele eine Invasion des wiedererstarkten Österreichischen Reiches.\n\nBereits heute haben sich österreichische Truppen an unserer Grenze eingefunden, und uns wurde ein Ultimatum gestellt: Entweder wird unser Land zwischen ihm und seinen Verbündeten aufgeteilt oder es gibt Krieg. Wir müssen schnell handeln."
austria.30.a:0	"Wir haben keine andere Wahl..."
austria.30.b:0	"Tod vor Schande!"
austria.31.t:0	"[CZE.GetNameDefCap] Trotzig"
austria.31.d:0	"Die [CZE.GetAdjective] Regierung hat unser Ultimatum ignoriert und ihre Armee mobilisiert. [CZE.GetLeader] hat versprochen, dass das Militär bei einer Invasion mehr als bereit ist, das Land bis zum letzten Mann zu verteidigen."
austria.31.a:0	"Das bedeutet Krieg."
austria.32.t:0	"[CZE.GetNameDefCap] kapituliert"
austria.32.desc:0	"Um einen zerstörerischen Krieg zwischen unseren Nationen zu vermeiden, ist die [CZE.GetAdjective] Regierung zurückgetreten und hat unseren Streitkräften die Macht überlassen. Heute ist ein großer Tag für Österreich.\n\nNun müssen wir entscheiden, wie wir ihre Gebiete aufteilen."
austria.32.a:0	"Annexieren Sie Böhmen und übergeben Sie die Slowakei an unsere ungarischen Verbündeten."
austria.32.b:0	"Annexion des Sudetenlandes mit einer loyalen Regierung in Böhmen und Übergabe der Slowakei an Ungarn."
austria.32.c:0	"Annexion Böhmens und Einsetzung einer loyalen Regierung in der Slowakei."
austria.32.d:0	"Annektieren Sie das Sudetenland und setzen Sie loyale Regierungen in Böhmen und der Slowakei ein."
austria.33.t:0	"Zusammenbruch des Völkerbundes"
austria.33.d:0	"Der Völkerbund ist zusammengebrochen und unsere Abhängigkeit von internationalen Krediten hat uns in eine Lage gebracht, in der wir ohne diese Kredite nicht genug Mittel haben, um unsere Ausgaben zu decken. Unsere Wirtschaft kommt zum Stillstand, und wir können nur abwarten und sie wieder ankurbeln, sobald wir selbst genügend Mittel gesammelt haben."
austria.33.a:0	"Das ist nicht gut. "
austria.34.t:0	"Die Rückkehr des Kaisers"
austria.34.d:0	"Unter starkem Druck seiner Regierung hat Bundeskanzler Schuschnigg heute über das Radio angekündigt, dass er zurücktreten wird, um die Unabhängigkeit der österreichischen Nation zu bewahren. In seiner herzlichen Rede verkündete Schuschnigg, dass angesichts der Bedrohung durch die Deutschen jetzt die Zeit der Einheit und nicht der Spaltung gekommen sei und dass Otto von Habsburg als einigende Figur aus dem Exil zurückkehren werde, um das österreichische Volk durch diese dunklen Tage zu führen. \n\nAuch wenn viele darin einen triumphalen Sieg und die Rückkehr zu altem österreichischem Ruhm sehen, ist die Wahrheit, dass Otto als Führer einer Nation zurückkehrt, deren Existenz bedroht ist.\n\nFür ihn gibt es viel zu tun."
austria.34.a:0	"Lang lebe der Kaiser!"
austria.35.t:0	"Otto übernimmt die österreichische Krone"
austria.35.d:0	"Seit der Remilitarisierung des Rheinlands haben sich viele gefragt, wie das Schicksal des österreichischen Staates aussehen würde. Viele wussten, dass Schuschnigg angesichts der deutschen Bedrohung zurücktreten wollte, aber nicht viele haben damit gerechnet.\n\nHeute hat der österreichische Bundeskanzler Kurt Schuschnigg in einer herzlichen Rede seinen Rücktritt angekündigt, um die Rückkehr der Habsburger in die Krone vorzubereiten. Der neu gekrönte Otto von Habsburg hat sich bereits an die Nation gewandt und erklärt, dass es noch viel zu tun gibt, aber das Vermächtnis der Größe Österreichs nicht der Vergangenheit angehört.\n\nWie auch immer die Zukunft Europas aussehen mag, Ottos Rede hat Schockwellen über den gesamten europäischen Kontinent geschickt."
austria.36.t:0	"[AUS.GetNameDefCap] Schlägt gegenseitige Assoziation vor"
austria.36.d:0	"[AUS.GetLeader] hat uns kürzlich einen Vorschlag für einen Pakt der gegenseitigen Assoziation unterbreitet. Dieses Bündnis würde als gegenseitiger Verteidigungspakt dienen, in dem unsere Außenpolitik mit der ihren vereint wäre.\n\n Viele sehen darin eine großartige Möglichkeit für uns, uns gegen Deutschland zu verteidigen, aber andere denken, dass dies nur ein Versuch der Habsburger ist, uns zu kontrollieren. Wie sollten wir uns entscheiden?"
austria.36.a:0	"Schutz gegen Deutschland ist notwendig"
austria.36.b:0	"Das ist zu dubios."
austria.37.t:0	"[CZE.GetNameDefCap] Nimmt unser Angebot an"
austria.37.d:0	"Die Führung von [CZE.GetAdjective] hat unser Angebot angenommen. Gemeinsam können wir eine Chance gegen die Deutschen haben."
austria.37.a:0	"Sehr gut."
austria.38.t:0	"[CZE.GetNameDefCap] Lehnt unser Angebot ab"
austria.38.d:0	"Die [CZE.GetAdjective]-Führung hat unseren Vorschlag abgelehnt und uns vorgeworfen, dass wir versuchen, sie zu kontrollieren."
austria.38.a:0	"Wenn es das ist, was sie wünschen."
austria.39.t:0	"[AUS.GetNameDefCap] schlägt gegenseitige Vereinigung vor"
austria.39.d:0	"[AUS.GetLeader] ist vor kurzem mit einem Vorschlag für einen gegenseitigen Assoziationspakt zu uns gekommen. Dieses Bündnis würde als gegenseitiger Verteidigungspakt dienen, bei dem unsere Außenpolitik mit der ihren vereint wäre.\n\n Viele sehen darin eine großartige Möglichkeit für uns, uns gegen unsere Feinde zu verteidigen, aber andere meinen, dass dies nur ein Versuch der Habsburger ist, uns zu kontrollieren. Wie sollten wir uns entscheiden?"
austria.39.a:0	"Wir brauchen Schutz vor unseren Feinden"
austria.39.b:0	"Das ist zu dubios."
austria.40.t:0	"[HUN.GetNameDefCap] Nimmt unser Angebot an"
austria.40.d:0	"Die Führung von [HUN.GetAdjective] hat unser Angebot angenommen. Gemeinsam können wir eine Chance gegen die Deutschen haben."
austria.40.a:0	"Sehr gut."
austria.41.t:0	"[HUN.GetNameDefCap] Lehnt unser Angebot ab"
austria.41.d:0	"Die [HUN.GetAdjective]-Führung hat unseren Vorschlag abgelehnt und uns vorgeworfen, dass wir versuchen, sie zu kontrollieren."
austria.41.a:0	"Wenn es das ist, was sie wünschen."
austria.42.t:0	"[AUS.GetNameDefCap] Schlägt Slowenien ein Bündnis vor"
austria.42.d:0	"Die [AUS.GetAdjective]-Führung ist heute mit einem Vorschlag für einen gegenseitigen Verteidigungspakt zu uns gekommen, im Austausch für die Abtretung ihres ehemaligen Territoriums Slowenien.\n\nDie meisten unserer Regierung sind gegen den Vorschlag, aber einige sagen, es sei die einzige Möglichkeit für uns, gegen die Italiener geschützt zu sein.\n\nWas soll getan werden?"
austria.42.a:0	"Die Unabhängigkeit hat ihren Preis."
austria.42.b:0	"Wir können uns selbst verteidigen!"
austria.43.t:0	"[YUG.GetNameDefCap] Nimmt unser Angebot an"
austria.43.d:0	"Die [YUG.GetAdjective]-Führung hat unser Angebot angenommen. Gemeinsam können wir eine Chance gegen die Italiener haben."
austria.43.a:0	"Sehr gut."
austria.44.t:0	"[YUG.GetNameDefCap] Lehnt unser Angebot ab"
austria.44.d:0	"Die [YUG.GetAdjective]-Führung hat unseren Vorschlag abgelehnt und erklärt, dass sie kein Interesse an der Abtretung ihrer Gebiete hat und sich selbst verteidigen kann."
austria.44.a:0	"Wenn es das ist, was sie wünschen."
austria.45.t:0	"[AUS.GetNameDef] schlägt Wiedervereinigung vor"
austria.45.d:0	"Die neue sozialistische Regierung Österreichs ist mit einem Vorschlag für eine Vereinigung unserer Nationen an unsere Regierung herangetreten. Dieser Gedanke besteht schon seit einiger Zeit, aber politische Barrieren haben ihn verhindert, aber jetzt, wo unsere beiden Nationen frei von faschistischer Tyrannei sind, gab es jemals einen besseren Zeitpunkt?"
austria.45.a:0	"Endlich kann ein größeres Deutschland erreicht werden."
austria.45.b:0	"Wir riskieren, die Welt nicht zu verärgern."
austria.46.t:0	"[GER.GetNameDef] lehnt Wiedervereinigung ab"
austria.46.d:0	"Die deutsche Regierung hat eine Wiedervereinigung unserer Nationen abgelehnt und behauptet, dass die Bedingungen von Versailles nicht noch einmal gebrochen werden sollten."
austria.46.a:0	"Wenn es das ist, was sie wollen..."
austria.47.t:0	"Wahltag"
austria.47.d:0	"Während Millionen von Bürgern zu den Urnen strömen, wartet das ganze Land auf die Ergebnisse der ersten Wahl der Zweiten Republik. Sowohl die SDAPÖ als auch die CS haben einen harten Wahlkampf geführt, und es wurde erwartet, dass die Ergebnisse knapp ausfallen würden, aber während die Stimmen ausgezählt werden, zeichnet sich ein Trend ab, der den eindeutigen Sieger zeigt..."
austria.47.a:0	"Die Sozialdemokratische Arbeiterpartei Österreichs!"
austria.47.b:0	"Die Christlichsoziale Partei!"
austria.48.t:0	"Knackige Zahlen"
austria.48.d:0	"Schuschnigg sah sich die Zahlen wieder und wieder an. Bei jeder einzelnen Vorhersage sah er das Gleiche - eine totale Niederlage für die Christlichsozialen. Das konnte er nicht verstehen. Selbst nach allem, was sie für sie getan hatten, waren die Menschen ihren Rettern immer noch nicht dankbar. \n\n Diese verdammten undankbaren Bastarde!, dachte er bei sich. Nach Jahren der Arbeit würde der sozialistische Abschaum immer noch die Oberhand behalten. Es sei denn, dachte er, man könnte etwas dagegen tun."
austria.48.a:0	"Ein bisschen Führung kann viel bewirken."
austria.49.t:0	"Ein Bad in der Donau"
austria.49.d:0	"Alfred und Franz waren gemeinsam auf Patrouille und überblickten vom Ufer bei Fischamend die Donau. Sie sahen keinen Grund dafür, schließlich war der Bürgerkrieg schon lange vorbei und sie hatten sich nur wegen des anständigen Lohns den Sturmscharen angeschlossen.\n\n Hey Alfred!, rief Franz, als er auf einen schwimmenden Fleck zeigte, der aus Briefumschlägen zu bestehen schien. Die Wiener haben wohl schon wieder vergessen, wo der Mülleimer steht.\n\n Es würde mich wundern, wenn sie überhaupt einen Mülleimer hätten, bemerkte Alfred. Die beiden Männer lachten und setzten ihre Patrouille wie gewohnt fort.\n\nEin paar Stunden später, auf dem Heimweg, dachte Franz wieder über den Vorfall nach. Etwas Müll, der den Fluss hinuntertrieb, war nichts Ungewöhnliches, aber angesichts der laufenden Wahlen war es vielleicht besser, so etwas zu melden."
austria.49.a:0	"Besser auf Nummer sicher gehen."
austria.49.b:0	"Wahrscheinlich nichts, worüber man sich den Kopf zerbrechen müsste."
austria.50.t:0	"Einst ein Diktator"
austria.50.d:0	"Leopold Figl wusste sofort, was los war, als er den Bericht seiner Männer erhielt. Er hatte Schuschnigg schon immer als einen Mann gekannt, der alles tat, was er konnte, um sich selbst zu bereichern. Diese demokratischen Wahlen waren nichts weiter als Beschwichtigungsversuche, um die westlichen Alliierten dazu zu bringen, seine Regierung zu unterstützen. Als Wahlkampfleiter der CSP wusste Leopold sehr wohl, dass, wenn er den Wahlbetrug stoppen würde, die Sozialisten mit Sicherheit als Sieger hervorgehen würden, etwas, gegen das er seine gesamte Karriere lang gekämpft hatte. Aber was würde seine ganze Arbeit gegen die VF-Diktatur nützen, wenn er sie im letzten Moment aufgeben würde?\n\n Eine Entscheidung musste getroffen werden."
austria.50.a:0	"Er würde seinen Einfluss nutzen, um die Abstimmungen zu überwachen."
austria.50.b:0	"Er würde nichts tun."
austria.51.t:0	"Leopold Figl stellt sich gegen Schuschniggs Regierung"
austria.51.d:0	"Nach dem Wahlsieg der CSP scheinen die parteiinternen Kämpfe noch nicht vorbei zu sein. Leopold Figl, der Wahlkampfleiter der Partei, hat angekündigt, dass seine reformistische Fraktion in der CSP Schuschnigg die Führung streitig machen wird. Figl erklärte, dass die Zukunft der CSP im demokratischen Westen liegt und dass Schuschniggs korrupte isolationistische Politik Österreich nur ins Verderben führen wird."
austria.51.a:0	"Figl ist unser Weg in die Zukunft!"
austria.51.b:0	"Schuschnigg hat uns so weit geführt, wir werden ihn unterstützen!"
austria.53.t.a:0	"Nazi-Einfluss in [r56_bundeslaender_crackdown_state] zurückgedrängt"
austria.53.d.a:0	"Unsere Bemühungen, den unterirdischen Nazi-Einfluss in [r56_bundeslaender_crackdown_state] zu bekämpfen, waren erfolgreich. Wir sind nun bereit, sie in einem anderen Staat zu bekämpfen."
austria.53.t.b:0	"Nazi-Einfluss in [r56_bundeslaender_crackdown_state] erhöht"
austria.53.d.b:0	"Unsere Bemühungen, den Einfluss der nationalen Regierung in [r56_bundeslaender_crackdown_state] zu bekämpfen, waren erfolgreich. Wir sind nun bereit, sie in einem anderen Staat zu bekämpfen."
austria.53.a:0	"Sehr gut."
austria.54.t:0	"Otto Bauer kehrt aus dem Exil zurück"
austria.54.d:0	"Mit der jüngsten schrittweisen Demokratisierung der Regierung des Landes sind viele politische Exilanten, die nach der Machtübernahme der Vaterländischen Front aus dem Land geflohen waren, in das Land zurückgekehrt.\n\n Einer dieser Exilanten ist der SDAPÖ-L-Führer Otto Bauer, der an die Spitze seines Parteiflügels zurückkehren will. Es gibt jedoch Gerüchte, dass er gesundheitlich angeschlagen ist, was seine Führung der Partei beeinträchtigen könnte.\n\nVielleicht wäre es eine gute Idee, ihn medizinisch zu versorgen, um Komplikationen zu vermeiden."
austria.54.a:0	"Er wird jede Behandlung erhalten, die er benötigt."
austria.54.b:0	"Dies sind nur Gerüchte."
austria.55.t.a:0	"Otto Bauer verstirbt"
austria.55.d.a:0	"Heute früh ist Otto Bauer, SDAPÖ-L-Vorsitzender und prominenter Sozialist, im Schlaf an einem Herzinfarkt gestorben. Sein Tod kam für einige überraschend, aber viele Gerüchte über seinen schlechten Gesundheitszustand hatten dieses Ereignis vorausgesagt.\n\nOhne seine Führung hat seine SDAPÖ-L Fraktion beschlossen, mit der SDAPÖ-R zu fusionieren, mit Karl Renner an der Spitze der vereinigten Partei."
austria.55.t.b:0	"Otto Bauer verstirbt im Exil"
austria.55.d.b:0	"Otto Bauer, SDAPÖ-L-Vorsitzender und prominenter, im Pariser Exil lebender Sozialist, ist heute im Schlaf an einem Herzinfarkt verstorben. Sein Tod kam für einige überraschend, aber viele Gerüchte über seinen schlechten Gesundheitszustand hatten dieses Ereignis vorausgesagt.\n\nOhne seine Führung hat seine SDAPÖ-L Fraktion beschlossen, mit der SDAPÖ-R zu fusionieren, mit Karl Renner als Führer der vereinigten Partei."
austria.55.a:0	"Wahrlich das Ende einer Ära."
austria.56.t:0	"Nazi-Versteck in Wien ausfindig gemacht"
austria.56.d:0	"Der Geheimdienst hat heute ein mutmaßliches Nazi-Versteck in Wien ausfindig gemacht, in dem sich Rüstungsgüter und Parteidokumente befinden. Eine Razzia in diesem Versteck könnte ein guter Schritt sein, um die Präsenz der Nazis in der Stadt zu verringern, aber das könnte die Deutschen noch mehr verärgern und Verhandlungen mit ihnen in Zukunft verhindern."
austria.56.a:0	"Starten Sie die Razzia."
austria.56.b:0	"Wir müssen nicht riskieren, die Deutschen zu verärgern."
austria.57.t:0	"Nazi-Versteck in Wien geplündert"
austria.57.d:0	"Nach unserer Entscheidung, das entdeckte Naziversteck zu stürmen, startete die Nationalgarde eine Razzia in dem vermuteten Versteck. Die Nazis haben sich schnell ergeben und unsere Truppen haben nur minimale Verluste erlitten.\n\n In dem Versteck befanden sich ein Waffenlager und niedergeschriebene Pläne für einen Putsch gegen unsere Regierung, der von Deutschland unterstützt wurde. "
austria.57.a:0	"Mein Gott!"
austria.58.t:0	"Mit Deutschland verhandeln?"
austria.58.d:0	"Die Zeit der Spekulationen ist vorbei. Es wird immer offensichtlicher, dass die Deutschen eine Invasion in Österreich planen, und wir können es uns nicht leisten, nur herumzusitzen und zu warten. Unsere Streitkräfte wurden in höchste Alarmbereitschaft versetzt, aber viele Teile der Regierung schlagen vor, eine letzte Konferenz mit Deutschland abzuhalten, um ein Blutvergießen zu vermeiden."
austria.58.a:0	"Lassen Sie uns versuchen, ihnen ein Angebot zu unterbreiten."
austria.59.t:0	"Die Berchtesgadener Konferenz"
austria.59.d:0	"Als die [AUS.GetAdjective]-Regierung unsere Vorbereitungen für einen Anschluss bemerkte, hat sie versucht, zu uns zu kommen, um zu verhandeln. Wir könnten diese Gelegenheit nutzen, um [AUS.GetLeader] zu drängen, Arthur Seyss-Inquart, einen prominenten österreichischen Nazi, als Regierungsminister zu ernennen, der die österreichische Regierung dahingehend beeinflussen könnte, dass sie sich dem Anschluss nicht widersetzt."
austria.59.a:0	"Wir werden unsere Forderungen vorbringen."
austria.60.t:0	"Die Berchtesgadener Konferenz"
austria.60.d:0	"Heute haben sich [AUS.GetLeader] und [GER.GetLeader] in der bayerischen Grenzstadt Berchtesgaden getroffen, um über eine mögliche Lösung des bevorstehenden Konflikts zu beraten.\n\n[GER.GetLeader] hat seine Forderungen ziemlich einfach formuliert: Ernennung des Naziführers Arthur Seyss-Inquart zum Regierungsmitglied und Freilassung aller derzeit inhaftierten Nazis."
austria.60.a:0	"Haben wir eine Wahl?"
austria.60.b:0	"Das ist inakzeptabel!"
austria.61.t:0	"[AUS.GetNameDefCap] Nimmt unsere Forderungen an"
austria.61.d:0	"[AUS.GetLeader] hat vor unseren Forderungen kapituliert und Arthur Seyss-Inquart in die Regierung berufen. Damit können wir Einfluss auf die Regierung nehmen und sie vielleicht leichter dazu zwingen, weitere Forderungen zu akzeptieren."
austria.61.a:0	"Sehr gut."
austria.62.t:0	"[AUS.GetNameDefCap] lehnt unsere Forderungen ab"
austria.62.d:0	"[AUS.GetLeader] hat uns zu verstehen gegeben, dass er unsere Forderungen für inakzeptabel hält und nicht weiter mit uns verhandeln wird. Damit sind wir nicht mehr in der Lage, die [AUS.GetAdjective]-Regierung zu kontrollieren, was uns vielleicht zu einer gewaltsamen Übernahme zwingt."
austria.62.a:0	"Wenn sie das wünschen."
austria.63.t:0	"[GER.GetLeader] spricht vor dem Reichstag"
austria.63.d.a:0	"Nach den Verhandlungen zwischen [GER.GetLeader] und [AUS.GetLeader] in Berchtesgaden über die diplomatische Krise zwischen Deutschland und Österreich hat sich [GER.GetLeader] heute in einer großen Rede an den Reichstag gewandt und erklärt, dass der neue [GER.GetName] die Unterdrückung von zehn Millionen Deutschen außerhalb seiner Grenzen nicht länger dulden und alles tun wird, was er für notwendig hält, um sie zu befreien. \n\nDer Jubel ist im ganzen Land ausgebrochen, während die Rufe nach der Vereinigung aller Deutschen im Volk laut werden."
austria.63.d.b:0	"Heute, nach den Verhandlungen zwischen [GER.GetLeader] und [AUS.GetLeader] in Berchtesgaden über die diplomatische Krise zwischen Deutschland und Österreich, hat [GER.GetLeader] in einer großen Rede vor dem Reichstag erklärt, dass der neue [GER.GetName] die Unterdrückung von zehn Millionen Deutschen außerhalb seiner Grenzen nicht länger dulden und alles tun wird, was er für ihre Befreiung für notwendig erachtet. \n\n Es ist offensichtlich, dass sich diese Rede auf uns und die andauernde diplomatische Krise bezieht. \n\nDie Zeit wird knapp."
austria.63.d.c:0	"Heute, nach den Verhandlungen zwischen [GER.GetLeader] und [AUS.GetLeader] in Berchtesgaden über die diplomatische Krise zwischen Deutschland und Österreich, hat [GER.GetLeader] in einer großen Rede vor dem Reichstag erklärt, dass das neue [GER.GetName] die Unterdrückung von zehn Millionen Deutschen außerhalb seiner Grenzen nicht länger dulden und alles tun wird, was es für ihre Befreiung für notwendig hält. \n\nAuch wenn wir nicht Teil der aktuellen Verhandlungen zwischen [AUS.GetNameDef] und [GER.GetNameDef] sind, ist es offensichtlich, dass sich diese Rede auch auf uns und die in unseren Grenzen lebenden Deutschen bezieht. Wir müssen uns vorbereiten."
austria.63.a:0	"Es lebe ein größeres Deutschland!"
austria.63.b:0	"Wir lassen unsere Souveränität nicht bedrohen!"
austria.63.c:0	"Wir lassen unsere Integrität nicht bedrohen!"
austria.64.t.a:0	"SDAPÖ bietet eine Einheitsfront an"
austria.64.t.b:0	"CSP bietet Einheitsfront an"
austria.64.d.a:0	"Inmitten der andauernden diplomatischen Krise haben führende Vertreter der SDAPÖ angeboten, unsere Regierung gegen die Nazis zu unterstützen, wenn wir ihnen politische Zugeständnisse machen, wie z.B. die Aufhebung des Verbots der sozialistischen Presse und die Aufhebung der Beschränkungen für sozialistische Symbole und Flaggen.\n Das ist ein großes Zugeständnis und macht praktisch alle Fortschritte zunichte, die wir in den letzten Jahren bei der Unterdrückung der Sozialisten gemacht haben."
austria.64.d.b:0	"Inmitten der andauernden diplomatischen Krise haben führende Vertreter der Christlich-Sozialen Partei angeboten, unsere Regierung gegen die Nazis zu unterstützen, wenn wir ihnen politische Zugeständnisse machen, wie z.B. die Ernennung von Mitgliedern ihrer Partei für bestimmte Ministerien in der Regierung und die Ausweitung des Einflusses der katholischen Kirche im Land.\n\nDies ist ein gewaltiges Zugeständnis und macht praktisch alle Fortschritte zunichte, die wir in den letzten Jahren bei der Unterdrückung der Reste der VF gemacht haben, aber dies könnte unsere einzige Chance sein, genügend Unterstützung zu gewinnen, um den Nazis zu widerstehen."
austria.64.a:0	"Für ein unabhängiges Österreich."
austria.64.b:0	"Wir brauchen sie nicht!"
austria.65.t:0	"Der dritte österreichische Bürgerkrieg"
austria.65.d.a:0	"Seit dem Juli-Putsch, der die junge Dolfuss-Regierung beinahe zum Sturz gebracht hätte, sagten viele voraus, dass die innere Misere in Österreich noch nicht vorbei sei. Während die Nazis von der Vaterländischen Front besiegt wurden, wurde Kanzler Dolfuss während der Kämpfe getötet und viele der SS-Einheiten konnten sich erfolgreich verstecken.\n\nIhre Vorhersagen sollten sich bewahrheiten. Heute früh, nach dem Ausbruch des Krieges zwischen [AUS.GetNameDef] und [GER.GetNameDef], haben sich im ganzen Land Berlin-treue Nazi-Einheiten gegen die Regierung von [AUS.GetLeader] erhoben, um Deutschland zu unterstützen.\n\nWas auch immer das Schicksal der [AUS.GetAdjective] Nation sein mag, dieses Ereignis hat das Kräfteverhältnis in Europa drastisch verschoben."
austria.65.d.b:0	"Seit dem Juli-Putsch, der die junge Dolfuss-Regierung beinahe zum Sturz gebracht hätte, sagten viele voraus, dass die innere Misere Österreichs noch nicht ausgestanden sei. Während die Nazis von der Vaterländischen Front besiegt wurden, wurde Kanzler Dolfuss während der Kämpfe getötet und viele der SS-Einheiten konnten sich erfolgreich verstecken.\n\nIhre Vorhersagen sollten sich bewahrheiten. Heute Morgen, nach dem Ausbruch des Krieges zwischen [AUS.GetNameDef] und [GER.GetNameDef], haben sich Nazi-Einheiten im ganzen Land sowohl gegen die Regierung von [AUS.GetLeader] als auch gegen Deutschland erhoben, mit Unterstützung der Nazis, die nach dem Ende des Bürgerkriegs aus Deutschland geflohen sind.\n\nWas auch immer das Schicksal der [AUS.GetAdjective] Nation sein mag, dieses Ereignis hat das Kräfteverhältnis in Europa drastisch verschoben."
austria.65.d.c:0	"Seit dem Juli-Putsch, der die junge Dolfuss-Regierung beinahe zum Sturz gebracht hätte, sagten viele voraus, dass die innere Misere in Österreich noch nicht vorbei sei. Während die Nazis von der Vaterländischen Front besiegt wurden, wurde Kanzler Dolfuss während der Kämpfe getötet und viele der SS-Einheiten konnten sich erfolgreich verstecken.\n Ihre Vorhersagen sollten sich bewahrheiten. Heute Morgen haben sich im ganzen Land Berlin-treue Nazi-Einheiten gegen die Regierung von [AUS.GetLeader] erhoben, um Deutschland zu unterstützen.\n\nWas auch immer das Schicksal der [AUS.GetAdjective] Nation sein mag, dieses Ereignis hat das Kräfteverhältnis in Europa drastisch verschoben."
austria.65.d.d:0	"Seit dem Juli-Putsch, der die junge Dolfuss-Regierung beinahe zum Sturz gebracht hätte, sagten viele voraus, dass die innere Misere in Österreich noch nicht vorbei sei. Während die Nazis von der Vaterländischen Front besiegt wurden, wurde Kanzler Dolfuss während der Kämpfe getötet und viele der SS-Einheiten konnten sich erfolgreich verstecken.\n Ihre Vorhersagen sollten sich bewahrheiten. Heute Morgen haben sich Nazi-Einheiten im ganzen Land gegen die Regierung von [AUS.GetLeader] erhoben, mit Unterstützung der Nazis, die nach dem Ende des Bürgerkriegs aus Deutschland geflohen sind.\n\nWas auch immer das Schicksal der [AUS.GetAdjective] Nation sein mag, dieses Ereignis hat das Kräfteverhältnis in Europa drastisch verschoben."
austria.65.a:0	"Der deutsche Dominostein fordert ein weiteres Opfer."
austria.65.b:0	"Wir werden siegreich daraus hervorgehen!"
austria.66.t:0	"CSP gewinnt [AUS.GetAdjective]Wahlen"
austria.66.desc:0	"Seit die Vaterländische Front die Macht übernommen hat, haben viele an der Fähigkeit Österreichs gezweifelt, ohne ausländische Unterstützung unabhängig zu bleiben. Es scheint, dass sie Recht hatten, denn in den letzten Monaten hat die Regierung von [AUS.GetNameDef] vor den Forderungen der westlichen Verbündeten kapituliert, demokratische Wahlen abzuhalten.\n\nObwohl viele den Zusammenbruch der Regierung Schuschnigg aufgrund dieser Forderungen vorausgesagt haben, scheint es ihm gelungen zu sein, sich durch die reformierte Christlichsoziale Partei an der Macht zu halten, und obwohl viele die Legitimität der Wahl in Frage stellen, scheint es, dass die westlichen Verbündeten dies als zufriedenstellendes Ergebnis akzeptiert haben."
austria.66.a:0	"Alles wie geplant."
austria.66.b:0	"Sie sind schwach, weil sie vor dem Westen kapituliert haben."
austria.66.c:0	"Zufriedenstellend."
austria.66.d:0	"Sie verleugnen einfach ihr deutsches Erbe!"
austria.66.e:0	"Wir gratulieren Herrn Schuschnigg."
austria.67.t:0	"SDAPÖ-R gewinnt [AUS.GetAdjective]Wahlen"
austria.67.desc:0	"Seit die Vaterländische Front an die Macht gekommen ist, haben viele an der Fähigkeit Österreichs gezweifelt, ohne ausländische Unterstützung unabhängig zu bleiben. Es scheint, dass sie Recht hatten, denn in den letzten Monaten hat die Regierung von [AUS.GetNameDef] vor den Forderungen der westlichen Verbündeten kapituliert, demokratische Wahlen abzuhalten.\n\n Schon vor diesen Entwicklungen stellten viele die Popularität von Schuschniggs autoritärer Herrschaft in Frage und verwiesen auf die immer noch starken sozialistischen Elemente in der österreichischen Politik. Es hat den Anschein, dass sie Recht hatten, denn die Sozialdemokratische Partei Österreichs hat bei den Wahlen einen leichten Sieg errungen und den gemäßigteren Flügel der Partei an die Spitze der Koalition gestellt, mit Karl Renner als Bundeskanzler."
austria.67.a:0	"Wien ist wieder einmal rot!"
austria.67.b:0	"Sie sind schwach, weil sie vor dem Westen kapituliert haben."
austria.67.c:0	"Das ist zwar eine Überraschung, aber eine willkommene."
austria.67.d:0	"Sie verleugnen einfach ihr deutsches Erbe!"
austria.67.e:0	"Wir gratulieren Herrn Renner."
austria.68.t:0	"SDAPÖ-L gewinnt [AUS.GetAdjective]Wahlen"
austria.68.desc:0	"Seit die Vaterländische Front an die Macht gekommen ist, haben viele an der Fähigkeit Österreichs gezweifelt, ohne ausländische Unterstützung unabhängig zu bleiben. Es scheint, dass sie Recht hatten, denn in den letzten Monaten hat die Regierung von [AUS.GetNameDef] vor den Forderungen der westlichen Verbündeten kapituliert, demokratische Wahlen abzuhalten.\n\n Schon vor diesen Entwicklungen stellten viele die Popularität von Schuschniggs autoritärer Herrschaft in Frage und verwiesen auf die immer noch starken sozialistischen Elemente in der österreichischen Politik. Es scheint, dass sie Recht hatten, denn die Sozialdemokratische Partei Österreichs hat bei den Wahlen einen leichten Sieg errungen, angeführt von ihrem einst im Exil lebenden Vorsitzenden Otto Bauer, der zurückgekehrt ist, um die Partei durch diese schwierigen Zeiten zu führen."
austria.68.a:0	"Wien ist wieder rot!"
austria.68.b:0	"Sie sind schwach, weil sie vor dem Westen kapituliert haben."
austria.68.c:0	"Das ist zwar eine Überraschung, aber eine willkommene."
austria.68.d:0	"Sie verleugnen einfach ihr deutsches Erbe!"
austria.68.e:0	"Wir gratulieren Herrn Bauer."
austria.69.t:0	"Der Fehler des Pferdes"
austria.69.d:0	"Es sollte eigentlich unmöglich sein. Die Reformen der Regierung sollten nur dem Namen nach durchgeführt werden, eine gute Show für die Westmächte. Doch Figl hat es geschafft. An der Spitze einer großen Koalition aus Mitgliedern seines eigenen Flügels der CSP und Mitgliedern anderer Parteien ist es Leopold Figl gelungen, ein Misstrauensvotum gegen Bundeskanzler Schuschnigg anzuführen und ihn und mit ihm die meisten Überreste des austrofaschistischen Regimes von der Macht zu entfernen. Figl hat die Reformierung der Christlich-Sozialen Partei zur neuen Österreichischen Volkspartei angekündigt und sich damit von der VF-Regierung distanziert. Nur die Zeit wird zeigen, ob diese neue Regierung dort Erfolg haben wird, wo Schuschnigg gescheitert ist."
austria.69.a:0	"Manchmal ist der Reiter nicht gut."
austria.70.t:0	"Nicht mehr der Narr"
austria.70.d:0	"Der Raum wurde still, als die Tür geschlossen wurde. \n\n Es ist also so weit gekommen.\n\n Sie waren ein nützliches Werkzeug, aber Ihr Hitzkopf bringt Sie auf Dauer nur in Schwierigkeiten. Sie hätten beim Vizekanzler bleiben sollen."\n\n Ich dachte immer, Sie wären schwach, Kurt. Wenigstens habe ich mich geirrt."\n\n Auf Wiedersehen Ernst." 
austria.70.a:0	"Die Patronenhülse schlug auf dem Boden auf."
austria.71.t:0	"Nazi-Führung flieht aus Deutschland"
austria.71.d:0	"Mit dem Zusammenbruch der Nazi-Regierung und dem Ende des deutschen Bürgerkriegs sind die Überreste der Nazi-Regierung aus dem Land geflohen. Einige von ihnen haben sich auf den Weg nach Österreich gemacht, in der Hoffnung, die Bevölkerung zur Bildung einer neuen Nazi-Regierung anzustacheln, was unsere Regierung in große Gefahr bringt.\n\nWas soll man tun?"
austria.71.a:0	"Ignorieren Sie sie, wir müssen uns um andere Dinge kümmern."
austria.71.b:0	"Nehmen Sie sie fest und übergeben Sie sie in deutsche Obhut!"
austria.72.t:0	"Nazi-Generäle kommen aus ihrem Versteck"
austria.72.d:0	"Nach der jüngsten Machtübernahme durch die Nazis in unserem Land haben sich die Nazigeneräle, die dem Zusammenbruch der deutschen Regierung entkommen sind, versteckt und sich freiwillig gemeldet, um unsere Regierung zu unterstützen."
austria.72.a:0	"Wir werden ihre Hilfe sehr zu schätzen wissen."
austria.73.t:0	"Der Marsch auf Wien"
austria.73.d:0	"Jeder hat es kommen sehen. Heute marschierten Heimwehr-Milizen aus dem ganzen Land auf das Wiener Parlamentsgebäude und forderten den Rücktritt von Schuschnigg, den sie als schwachen Führer bezeichneten, der für die Macht ungeeignet sei. Obwohl das Bundesheer sich darauf vorbereitete, gegen die Demonstranten vorzugehen, wurden sie von Schuschnigg selbst aufgefordert, sich zurückzuhalten, als er das Parlamentsgebäude verließ.\n\nAls er die Stufen hinunterkam, traf er Starhemberg von Angesicht zu Angesicht."
austria.73.a:0	"Zerstören Sie nicht, was wir so hart aufgebaut haben. austria.74.t:0 Österreichische Nazis rebellieren!"
austria.74.d:0	"Seit unser Putsch gegen die österreichische Regierung im Juli 1934 gescheitert ist, haben unsere Nazi-Truppen im Land auf den richtigen Zeitpunkt gewartet, um zuzuschlagen. Als sie die Schwäche der österreichischen Regierung erkannten, haben viele uns loyale Milizen auf dem Lande eine Rebellion gegen [AUS.GetLeader] begonnen und das Land in einen regelrechten Bürgerkrieg gestürzt.\n\nSollten sie siegen, haben die Rebellen geschworen, Österreich mit Deutschland zu vereinen, und daher könnte es in unserem Interesse sein, sie zu unterstützen, auch wenn wir damit eine Eskalation des Krieges riskieren.\n\nWas sollten wir tun?"
austria.74.a:0	"Schicken Sie ihnen Unterstützung, aber greifen Sie nicht direkt ein."
austria.74.b:0	"Wir werden unsere österreichischen Brüder befreien!"
austria.75.t:0	"[AUS.GetNameDefCap] Bittet um Unterstützung!"
austria.75.d:0	"Heute früh haben viele österreichische Milizen, die dem Nazi-Regime treu ergeben sind, einen Putsch im Land inszeniert und damit einen Bürgerkrieg ausgelöst. Da wir versprochen haben, Österreich zu schützen, hat [AUS.GetLeader] uns um Unterstützung bei der Niederschlagung der Rebellion gebeten.\n\nSollen wir eingreifen?"
austria.75.a:0	"Ein gegebenes Versprechen ist ein gehaltenes Versprechen."
austria.75.b:0	"Wir können es uns im Moment nicht leisten, die Situation eskalieren zu lassen."
austria.76.t:0	"[AUS.GetNameDefCap] Bietet Rückgabe der böhmischen Besitzungen an"
austria.76.d:0	"Vor dem Zusammenbruch der österreichisch-ungarischen Monarchie besaßen viele unserer Bürger Grundstücke in Böhmen, die ihnen nach der Gründung der Tschechoslowakischen Republik weggenommen wurden.\n\nNun, da [AUS.GetNameDef] Böhmen kontrolliert, haben sie angeboten, uns diese Grundstücke im Austausch für ihre Loyalität zurückzugeben. Sollen wir annehmen?"
austria.76.a:0	"Für uns klingt das nach einem guten Geschäft."
austria.76.b:0	"Wir würden lieber unsere Unabhängigkeit bewahren."
austria.77.t:0	"[LIE.GetNameDefCap] Nimmt unser Angebot an"
austria.77.d:0	"Die Regierung von [LIE.GetAdjective] hat unser Angebot angenommen und uns im Gegenzug für die Rückgabe ihrer Besitztümer ihre Treue geschworen."
austria.77.a:0	"Sehr gut."
austria.78.t:0	"[LIE.GetNameDefCap] lehnt unser Angebot ab"
austria.78.d:0	"Die [LIE.GetAdjective]-Regierung hat unser Angebot mit der Begründung abgelehnt, sie wolle ihre nationale Unabhängigkeit bewahren."
austria.78.a:0	"Wenn es das ist, was sie wollen."
austria.78.b:0	"Wir müssen uns die Kontrolle sichern!"
austria.79.t:0	"[GER.GetLeader] Entfernt Josef Leopold"
austria.79.d:0	"Heute hat die Nazi-Regierung in Deutschland ihren Einfluss auf unser Land unter Beweis gestellt, indem sie den Landesleiter von Österreich, Josef Leopold, durch eine eher pro-deutsche Figur ersetzt hat.\n\nObwohl Josef Leopold seit dem gescheiterten Juli-Putsch der Führer der österreichischen Nazis war, ist er wegen seiner Pro-Unabhängigkeits-Haltung in Berlin in Ungnade gefallen, so dass [GER.GetLeader] ihn durch Hubert Klausner ersetzt hat. \n\nMit dem Sturz von Leopold scheint es jedoch, dass die Position viel von ihrer Macht verloren hat und die Führung der Nazi-Partei in den Händen von Heinrich Himmlers Verbündetem, Arthur Seyss-Inquart, liegt."
austria.79.a:0	"Wir müssen den deutschen Einfluss abwehren!"
austria.80.t:0	"Inquarts Rückschlag"
austria.80.d:0	"Heute Morgen haben deutsche SS-Einheiten das Büro des Landesleiters in Wien gestürmt, was wie ein Staatsstreich aussah, der sich gegen Josef Leopold richtete, weil er für die Unabhängigkeit eintrat. Jetzt hat sich herausgestellt, dass der Staatsstreich von Arthur Seyss-Inquart mit Hitlers Unterstützung inszeniert wurde, um Österreich in fester deutscher Hand zu halten und vielleicht sogar den Weg für einen vollständigen Anschluss an [GER.GetNameDef] zu ebnen."
austria.80.a:0	"Der Possenreißer ist los."
austria.80.b:0	"Nein! Wir dürfen uns der Tyrannei Berlins nicht unterwerfen!"
austria.81.t:0	"Nazi-Übernahme!"
austria.81.d:0	"Mit dem jüngsten Regierungswechsel zu einer pro-nazistischen Regierung wurde die Politik der alten Regierung rückgängig gemacht, und für Österreich beginnt eine neue Ära."
austria.81.a:0	"Ein deutsches Österreich ist kein Traum!"
austria.82.t:0	"[AUS.GetNameDefCap] Schlägt Anschluss vor"
austria.82.d:0	"Die neue Regierung Österreichs, die offensichtlich die Zukunft eines großen deutschen Staates sieht, hat vorgeschlagen, sich vollständig in Deutschland zu integrieren. Es ist nun an der Zeit, zu handeln und dem Willen des Volkes Ausdruck zu verleihen. \n\n Denn was sowohl im Vertrag von Saint Germain als auch im Vertrag von Versailles verboten war, soll nun der Welt als der endgültige und unbestreitbare Wille unserer beiden Nationen offenbart werden: die deutsch-österreichische Union soll vollendet werden, was der erste Schritt sein wird, der darauf abzielt, das gesamte germanische Volk unter einem Nationalstaat zu vereinen!"
austria.83.t:0	"Das Schicksal der Ostmark"
austria.83.d:0	"Mit dem Ende des österreichischen Bürgerkriegs kam es in unserem neuen Protektorat im Süden zu einem Machtkampf zwischen der für die Unabhängigkeit eintretenden Fraktion unter der Führung von Josef Leopold und der für Deutschland eintretenden Fraktion unter der Führung von Arthur Seyss-Inquart. Dank unserer Unterstützung ist es Inquart gelungen, Leopolds Fraktion zu stürzen und Österreich fest in unserem Einflussbereich zu verankern.\n\nNun, da das Schicksal Österreichs in unseren Händen liegt, müssen wir entscheiden, wie die Zukunft des Landes aussehen wird."
austria.83.a:0	"Österreichs Zukunft liegt bei Deutschland."
austria.83.b:0	"Vielleicht wäre es das Beste, es als Protektorat zu behalten."
austria.84.t:0	"[AUS.GetNameDefCap] Möchte Slowenien fordern"
austria.84.d:0	"Das slowenische Volk ist seit langem ein Teil der Süddeutschen, und mit unseren Ambitionen, alle Deutschen in einem Staat zu vereinen, hat [AUS.GetLeader] uns gebeten, Slowenien von [102.controller.GetNameDef] zu fordern und es seiner Verwaltung zu unterstellen."
austria.84.a:0	"Da hat er Recht, wir sollten es fordern."
austria.84.b:0	"Wir haben im Moment dringendere Angelegenheiten."
austria.85.t:0	"[GER.GetNameDefCap] nimmt unsere Forderung an"
austria.85.d:0	"[GER.GetLeader] hat unsere Bitte, Slowenien einzufordern, akzeptiert und ist in Verhandlungen mit [102.controller.GetNameDef] getreten."
austria.85.a:0	"Sehr gut."
austria.86.t:0	"[GER.GetNameDefCap] lehnt unsere Forderung ab"
austria.86.d:0	"[GER.GetLeader] hat unsere Bitte, Slowenien zu fordern, mit der Begründung abgelehnt, dass sie sich auf andere Dinge konzentrieren müssen."
austria.86.a:0	"Vielleicht irgendwann einmal anders."
austria.87.t:0	"Die Eisenstädter Konferenz"
austria.87.d:0	"Mit der Rückkehr der habsburgischen Herrschaft in [AUS.GetNameDef] war es offensichtlich, dass [AUS.GetLeader] früher oder später seine Augen auf unsere Nation richten würde. Die Österreicher, die einst mit ihnen im Bunde waren, verlangen, dass wir eine Konferenz über die Zukunft unserer Nationen abhalten.\n\nDa die Erinnerungen an den Zusammenbruch Österreich-Ungarns noch in den Köpfen der Menschen sind, ist die Unterstützung für die Rückkehr des Kaiserreichs nicht groß. Eine Ablehnung der Forderung der Österreicher wird jedoch mit Sicherheit zu einem Abbruch der Beziehungen und möglicherweise zu einem Krieg führen."
austria.87.a:0	"Vielleicht ist eine Rückkehr des Alten unser Weg in die neue Welt."
austria.87.b:0	"Unsere Unabhängigkeit wird nie wieder bedroht sein!"
austria.88.t:0	"Die Eisenstädter Konferenz beginnt"
austria.88.d:0	"Angesichts der Realität hat [HUN.GetNameDef] eine Delegation nach Eisenstadt entsandt, um die Bedingungen für die Rückkehr des Imperiums auszuhandeln. \n\nGegenwärtig würde [HUN.GetNonIdeologyName], sollte die Konferenz erfolgreich sein, ein nominell unabhängiger Staat in einer Personalunion mit [AUS.GetNameDef] bleiben, doch wir könnten wahrscheinlich Maßnahmen vorschlagen, die unseren Einfluss auf sie erhöhen würden. Allerdings müssen wir mit unseren Vorschlägen vorsichtig sein, denn wenn die [HUN.GetAdjective] das Gefühl haben, dass wir versuchen, zu viel Einfluss auf sie auszuüben, könnten sie sich aus der Konferenz zurückziehen und einen Weg des Krieges vor uns hinterlassen."
austria.88.a:0	"Lassen Sie uns beginnen."
austria.89.t:0	"[HUN.GetNameDefCap] lehnt unsere Forderungen ab"
austria.89.d:0	"Unsere Delegation bei der Regierung [HUN.GetAdjective] ist mit leeren Händen zurückgekommen, denn [HUN.GetLeader] hat sich schlichtweg geweigert, mit uns zu verhandeln und behauptet, dass die Unabhängigkeit Ungarns nie wieder vom österreichischen Imperialismus bedroht sein wird."
austria.89.a:0	"Sie lassen uns keine andere Wahl."
austria.89.b:0	"Früher oder später werden sie ihre Lektion lernen."
austria.90.t:0	"Verhandlungen in Eisenstadt gescheitert"
austria.90.d.a:0	"Nach einem Monat erfolgloser Verhandlungen hat sich die [HUN.GetAdjective]-Delegation von der Konferenz zurückgezogen und behauptet, unsere Repräsentanten hätten ihre Respektlosigkeit gegenüber der ungarischen Nation deutlich gezeigt. [HUN.GetLeader] hat die Bemühungen von [AUS.GetLeader] als nichts anderes als einen erneuten Versuch der österreichischen Vorherrschaft bezeichnet."
austria.90.d.b:0	"Nach einem Monat erfolgloser Verhandlungen haben wir unsere Delegation von der Konferenz in Eisenstadt abgezogen. Die [AUS.GetAdjective]-Delegation hat eindeutig gezeigt, dass sie die Unabhängigkeit unserer Nation nicht respektiert, und wir müssen die Verhandlungen abbrechen, um eine erneute österreichische Vorherrschaft über unser Heimatland zu verhindern."
austria.90.a:0	"Sie lassen uns keine andere Wahl."
austria.90.b:0	"Früher oder später werden sie ihre Lektion lernen."
austria.91.t:0	"[AUS.GetNameDefCap] schlägt wirtschaftliche Integration vor"
austria.91.d:0	"Die [AUS.GetAdjective]-Delegation hat einen Vorschlag unterbreitet, der unsere Volkswirtschaften zu einem zentral verwalteten System verbinden und die Effizienz der Industrie des Reiches steigern würde. Allerdings würde dieser Vorschlag mehr von unserer Industrie in die Hände von [AUS.GetAdjective] legen, was für einige Mitglieder der Regierung inakzeptabel ist."
austria.91.a:0	"Ihre Bedingungen sind akzeptabel."
austria.91.b:0	"Nein! Wir werden hier einen Schlussstrich ziehen!"
austria.92.t:0	"[HUN.GetNameDefCap] Akzeptiert die wirtschaftliche Integration"
austria.92.d:0	"Die [HUN.GetAdjective] Delegation hat unsere Forderung nach wirtschaftlicher Integration zwischen unseren beiden Nationen akzeptiert, so dass wir mehr Einfluss auf ihre Wirtschaft ausüben können. "
austria.92.a:0	"Sehr gut."
austria.93.t:0	"[HUN.GetNameDefCap] Lehnt wirtschaftliche Integration ab"
austria.93.d:0	"Die [HUN.GetAdjective]-Delegation hat unsere Bitte um wirtschaftliche Integration abgelehnt und behauptet, dass sie einen weiteren Einfluss Österreichs auf die Nation nicht akzeptieren wird."
austria.93.a:0	"Sie wissen nicht, was das Beste für sie ist."
austria.94.t:0	"[AUS.GetNameDefCap] Schlägt Produktionsintegration vor"
austria.94.d:0	"Die [AUS.GetAdjective] Delegation hat einen Vorschlag unterbreitet, der unsere Produktionsindustrie in ein zentral verwaltetes System einbinden und die Effizienz des Militärs des Imperiums erhöhen würde. Allerdings würde dieser Vorschlag einen größeren Teil unserer Produktion in die Hände von [AUS.GetAdjective] legen, was für einige Mitglieder der Regierung inakzeptabel ist."
austria.94.a:0	"Ihre Bedingungen sind akzeptabel."
austria.94.b:0	"Nein! Wir werden hier die Grenze ziehen!"
austria.95.t:0	"[HUN.GetNameDefCap] Akzeptiert die Integration der Produktion"
austria.95.d:0	"Die [HUN.GetAdjective] Delegation hat unsere Bitte um eine Produktionsintegration zwischen unseren beiden Nationen akzeptiert, die es uns ermöglicht, mehr Einfluss auf ihr Militär auszuüben. "
austria.95.a:0	"Sehr gut."
austria.96.t:0	"[HUN.GetNameDefCap] lehnt Produktionsintegration ab"
austria.96.d:0	"Die [HUN.GetAdjective] Delegation hat unseren Antrag auf Produktionsintegration abgelehnt und behauptet, dass sie keinen weiteren österreichischen Einfluss auf die Nation akzeptieren wird."
austria.96.a:0	"Sie wissen nicht, was das Beste für sie ist."
austria.97.t:0	"[AUS.GetNameDefCap] schlägt Ressourcenintegration vor"
austria.97.d:0	"Die [AUS.GetAdjective]-Delegation hat einen Vorschlag unterbreitet, der unsere Ressourcengewinnung in einem zentral verwalteten System konsolidieren und die Effizienz des Handels des Reiches erhöhen würde. Dieser Vorschlag würde jedoch mehr unserer Ressourcen in die Hände von [AUS.GetAdjective] legen und ist daher für einige Mitglieder der Regierung inakzeptabel."
austria.97.a:0	"Ihre Bedingungen sind akzeptabel."
austria.97.b:0	"Nein! Wir werden hier einen Schlussstrich ziehen!"
austria.98.t:0	"[HUN.GetNameDefCap] Akzeptiert Ressourcenintegration"
austria.98.b:0	"Die [HUN.GetAdjective] Delegation hat unsere Bitte um eine Integration der Ressourcenförderung zwischen unseren beiden Nationen akzeptiert, die es uns ermöglicht, mehr Einfluss auf ihren Handel auszuüben. "
austria.98.a:0	"Sehr gut."
austria.99.t:0	"[HUN.GetNameDefCap] lehnt Ressourcenintegration ab"
austria.99.d:0	"Die [HUN.GetAdjective] Delegation hat unsere Bitte um eine Integration der Rohstoffgewinnung abgelehnt und erklärt, dass sie einen weiteren Einfluss Österreichs auf die Nation nicht akzeptieren wird."
austria.99.a:0	"Sie wissen nicht, was das Beste für sie ist."
austria.100.t:0	"Abschluss der Verhandlungen in Eisenstadt"
austria.100.d:0	"Nach einem Monat des Hin und Her zwischen den Delegationen von [AUS.GetAdjective] und [HUN.GetAdjective] wurde eine Einigung erzielt. [AUS.GetNameDefCap] und [HUN.GetNameDefCap] werden eine Personalunion eingehen, wobei [HUN.GetNameDefCap] in den meisten internen Angelegenheiten unabhängig bleibt. Überall im neuen Reich brechen Feiern aus, und die Menschen hoffen wieder auf eine Rückkehr zu altem Ruhm."
austria.100.a:0	"Lang lebe das Reich!"
austria.101.t:0	"Die Eisenstädter Konferenz"
austria.101.desc:0	"Mit der Rückkehr der Habsburger auf den österreichischen Thron haben sich die Regierungen von [AUS.GetNameDef] und [HUN.GetNameDef] in der Stadt Eisenstadt getroffen, um über die Rückkehr der habsburgischen Herrschaft über Ungarn zu verhandeln. \n\nNach einem Monat feuriger Verhandlungen scheinen die Verhandlungen erfolgreich gewesen zu sein, denn heute haben [AUS.GetLeader] und [HUN.GetLeader] gemeinsam die Rückkehr der österreichisch-ungarischen Doppelmonarchie verkündet und damit das Machtgleichgewicht in Mitteleuropa und auf dem Balkan drastisch erschüttert."
austria.101.a:0	"Lang lebe das Kaiserreich!"
austria.101.b:0	"Ein neuer starker Verbündeter im Norden ist von großem Nutzen für uns."
austria.101.c:0	"Wir müssen unsere Grenzen sichern. "
austria.101.d:0	"Haben sie nicht aus dem ersten Mal gelernt? "
austria.102.t:0	"Krieg an der Donau"
austria.102.d:0	"Seit der Rückkehr der Habsburger auf den österreichischen Thron sind die Beziehungen zwischen den Regierungen von [AUS.GetNameDef] und [HUN.GetNameDef] angespannt, wobei [AUS.GetLeader] nicht nur den österreichischen, sondern auch den ungarischen Thron beansprucht. \n\nDieser Abbruch der Beziehungen hat heute seinen Höhepunkt erreicht, als [AUS.GetLeader] ankündigte, dass die Rückkehr zu den glorreichen Tagen des alten Österreichischen Kaiserreichs unvermeidlich ist, und wenn es durch Krieg geschehen muss, dann soll es so sein, wobei [HUN.GetLeader] standhaft bleibt.\n\nDie Zukunft der beiden Nationen bleibt ungewiss, aber dies wird sicherlich auch den fragilen Frieden auf dem Balkan erschüttern."
austria.102.a:0	"Wir werden als Sieger hervorgehen!"
austria.102.b:0	"Der Fall des Kaiserreichs war also endgültig."
austria.103.t:0	"Heimwehr-Elemente widersetzen sich der Habsburger Herrschaft"
austria.103.d:0	"Nach unseren erfolgreichen Verhandlungen mit Ungarn haben einige verbliebene radikale Elemente der austrofaschistischen Vaterlandsfront-Regierung unter der Führung von Ernst Rüdiger Starhemberg begonnen, sich unserer Regierung zu widersetzen. Sie behaupten, wir hätten Schwäche gezeigt, weil wir unsere Vorherrschaft über die Länder des ehemaligen Kaiserreichs nicht durchgesetzt hätten.\n\n Wir sollten diese Situation genau im Auge behalten, denn wenn es uns nicht gelingt, diese Opposition einzudämmen, könnte es in Zukunft zu einem Putsch kommen."
austria.103.a:0	"Behalten Sie dies genau im Auge."
austria.104.t:0	"Heimwehr-Elemente starten Putsch!"
austria.104.d:0	"Nachdem es uns nicht gelungen ist, mit den Elementen der Heimwehr fertig zu werden, die sich unserer Regierung widersetzt hatten, haben Ernst Rüdiger Starhemberg und der Rest der Heimwehr einen Putsch gegen den Kaiser gestartet, um die austrofaschistische Regierung der Vaterländischen Front wiederherzustellen."
austria.104.a:0	"Sie werden zerschlagen werden!"
austria.104.b:0	"Der Kaiser hat Österreich zum letzten Mal verraten!"
austria.105.t:0	"[HUN.GetNameDefCap] Kappt die diplomatischen Beziehungen!"
austria.105.d:0	"Mit der Behauptung, [AUS.GetLeader] habe wieder einmal gezeigt, dass die Habsburger weiterhin gegen den ungarischen Staat arbeiten, indem sie sich weigern, die großungarischen Gebiete anzuerkennen, hat [HUN.GetLeader] heute angekündigt, dass [HUN.GetNameDef] sich aus der Doppelmonarchie zurückziehen und die Unabhängigkeit der Nation erklären wird."
austria.105.a:0	"Sie werden sich dem Fortschritt nicht in den Weg stellen! Sie müssen zerschlagen werden!"
austria.105.b:0	"Lassen Sie sie gehen."
austria.106.t:0	"Österreich überträgt die Slowakei"
austria.106.d:0	"Mit der Kapitulation von [CZE.GetNameDefCap] hat [AUS.GetLeader] unseren Anspruch auf die Slowakei anerkannt und die Gebiete an unsere Nation abgetreten. Damit sind wir der Bildung von Großungarn einen Schritt näher gekommen."
austria.106.a:0	"Es ist gut, dass wir auf einer Wellenlänge liegen."
austria.107.t:0	"Österreich gründet slowakische Marionette"
austria.107.d:0	"Mit der Kapitulation von [CZE.GetNameDefCap] hat [AUS.GetLeader] unseren Anspruch auf die gesamte Slowakei zurückgewiesen und stattdessen eine Untertanenregierung im größten Teil der Nation eingesetzt, so dass uns nur die Südslowakei und Karpatenruthenien bleiben."
austria.107.a:0	"Lassen Sie uns kein Aufhebens machen."
austria.107.b:0	"Wir werden diese Respektlosigkeit nicht länger dulden!"
austria.108.t:0	"Österreich erkennt ungarisches Kroatien an"
austria.108.d:0	"Da ein Krieg mit [YUG.GetNameDef] unmittelbar bevorzustehen scheint, hat [AUS.GetLeader] seine Unterstützung für unsere Ansprüche auf Kroatien zum Ausdruck gebracht, ein Land, das zu Zeiten des Kaiserreichs zu Ungarn gehörte."
austria.108.a:0	"Es ist gut, dass wir auf einer Wellenlänge liegen."
austria.109.t:0	"Österreich unterstützt die kroatische Unabhängigkeit"
austria.109.d:0	"Da ein Krieg mit [YUG.GetNameDef] unmittelbar bevorzustehen scheint, hat [AUS.GetLeader] seine Unterstützung für ein unabhängiges kroatisches Königreich bekundet und sich damit direkt gegen unsere Ansprüche in der Region gestellt."
austria.109.a:0	"Lassen Sie uns kein Aufhebens machen."
austria.109.b:0	"Wir werden diese Respektlosigkeit nicht länger dulden!"
austria.110.t:0	"Österreich erkennt die Ansprüche Siebenbürgens an"
austria.110.d:0	"Als Zeichen des guten Willens hat [AUS.GetLeader] seine Unterstützung für die ungarische Herrschaft über unser rechtmäßiges Territorium Transsylvanien zum Ausdruck gebracht und erklärt, dass Österreich [HUN.GetNameDef] in jedem Konflikt gegen [ROM.GetNameDef] unterstützen wird."
austria.110.a:0	"Es ist gut, dass wir auf einer Wellenlänge liegen."
austria.111.t:0	"Österreich befürwortet siebenbürgische Selbstverwaltung"
austria.111.d:0	"Da ein Krieg mit [ROM.GetNameDef] unmittelbar bevorzustehen scheint, hat [AUS.GetLeader] seine Unterstützung für eine autonome Regierung in Siebenbürgen geäußert, die die Ungarn in der Region vertreten könnte, ohne die rumänische Bevölkerung zu unterdrücken."
austria.111.a:0	"Lassen Sie uns kein Aufhebens machen."
austria.111.b:0	"Wir werden diese Respektlosigkeit nicht länger dulden!"
austria.112.t:0	"[AUS.GetNameDefCap] Drängt auf Föderalisierung"
austria.112.d:0	"Mit den jüngsten Reformen der [AUS.GetAdjective]-Regierung hat [AUS.GetLeader] darauf gedrängt, die Föderalisierung der cisleithanischen Länder zu einer einheitlichen Nation zu erreichen.\n\nWenn wir einem solchen Vorschlag zustimmen, würden wir unseren Status als halb-unabhängige Nation verlieren, aber unser Volk wäre ein gleichberechtigter Teil des Reiches.\n\nWas soll entschieden werden?"
austria.112.a:0	"Ein kleiner Preis für die Rettung."
austria.112.b:0	"Wir werden uns nicht in das Habsburger Lehen integrieren lassen!"
austria.113.t:0	"[FROM.GetNameDefCap] Akzeptiert die Föderalisierung"
austria.113.d:0	"Die Regierung von [FROM.GetAdjective] hat unseren Antrag auf Föderalisierung unserer Territorien akzeptiert. [FROM.GetLeader] hat seine Unterstützung für die Reformen zum Ausdruck gebracht und erklärt, er sei begierig darauf, dass das [FROM.GetAdjective] Volk endlich ein gleichberechtigter Teil des Reiches wird."
austria.113.a:0	"Gemeinsam sind wir stark."
austria.114.t:0	"[FROM.GetNameDefCap] lehnt Föderalisierung ab"
austria.114.d:0	"[FROM.GetLeader] hat unser Angebot zur Föderalisierung abgelehnt und erklärt, dass sie unser Ziel, Cisleithanien zu vereinen, nur als einen Versuch sehen, die österreichische Dominanz im gesamten Reich wiederherzustellen."
austria.114.a:0	"Wenn sie es wünschen."
austria.115.t:0	"[AUS.GetNameDefCap] Drängt auf Föderalisierung"
austria.115.d:0	"Mit den jüngsten Reformen der [AUS.GetAdjective]-Regierung und dem Erfolg ihrer Föderalisierung mit den Ländern Cisleithaniens hat [AUS.GetLeader] darauf gedrängt, die Föderalisierung des Imperiums auf die Länder Transliethaniens auszudehnen.\n\nWenn wir einem solchen Vorschlag zustimmen, würden wir unseren Status als halb-unabhängige Nation verlieren, aber unser Volk zu einem gleichberechtigten Teil des Imperiums machen.\n\nWas soll entschieden werden?"
austria.115.a:0	"Ein kleiner Preis für die Rettung."
austria.115.b:0	"Wir werden uns nicht in das Habsburger Lehen integrieren lassen!"
austria.116.t:0	"[FROM.GetNameDefCap] Akzeptiert die Föderalisierung"
austria.116.d:0	"Die Regierung von [FROM.GetAdjective] hat unseren Antrag auf Föderalisierung unserer Territorien akzeptiert. [FROM.GetLeader] hat seine Unterstützung für die Reformen zum Ausdruck gebracht und erklärt, er sei begierig darauf, dass das [FROM.GetAdjective] Volk endlich ein gleichberechtigter Teil des Reiches wird."
austria.116.a:0	"Gemeinsam sind wir stark."
austria.117.t:0	"[FROM.GetNameDefCap] lehnt Föderalisierung ab"
austria.117.d:0	"[FROM.GetLeader] hat unser Angebot zur Föderalisierung abgelehnt und erklärt, dass sie unser Ziel, Cisleithanien zu vereinen, nur als einen Versuch sehen, die österreichische Dominanz im gesamten Reich wiederherzustellen."
austria.117.a:0	"Wenn sie es wünschen."
austria.118.t:0	"[AUS.GetNameDefCap] Drängt auf Föderalisierung von Transleithanien"
austria.118.d:0	"Heute Morgen hat [AUS.GetLeader] seine Autorität endgültig überschritten und die Föderalisierung der transleithanischen Länder zu einem einheitlichen Habsburger Reich gefordert. Ein solcher Vorschlag wäre eine Katastrophe für unsere Nation und würde uns endgültig in die Klauen der habsburgischen Bedrohung treiben. Wir müssen uns wehren! "
austria.118.a:0	"[HUN.GetLeader] hat uns nichts als Ruin gebracht! Wir müssen uns erheben!"
austria.118.b:0	"Wir werden diese Demütigung nicht hinnehmen! Wir müssen uns gegen die habsburgische Unterdrückung wehren!"
austria.119.t:0	"Bürgerkrieg in [HUN.GetNameDef]!"
austria.119.d:0	"Nach unseren jüngsten Versuchen, die transleithanischen Länder des Imperiums zu föderalisieren, ist ein Bürgerkrieg gegen die Regierung von [HUN.GetLeader] ausgebrochen.\nDie Rebellen, die behaupten, sich gegen die habsburgische Herrschaft zu wehren, haben die Kontrolle über den größten Teil der Nation übernommen, wobei die uns loyalen Kräfte viele Verluste erlitten haben, was als Vorwand dienen könnte, um einzugreifen und die verbleibenden loyalen Kräfte zu integrieren."
austria.119.a:0	"Sie werden sich uns nicht in den Weg stellen!"
austria.119.b:0	"Es ist besser, nicht zu intervenieren."
austria.120.t:0	"[AUS.GetNameDefCap] Bietet Abtretung des Burgenlandes an"
austria.120.d:0	"Um zu zeigen, dass [AUS.GetAdjective] den Willen des ungarischen Volkes respektiert, hat [AUS.GetLeader] angeboten, das ehemals ungarische Gebiet des Burgenlandes an unsere Nation zurückzugeben. Wenn wir das Angebot annehmen, würden wir unter Druck gesetzt werden, weitere Forderungen der österreichischen Seite zu akzeptieren, aber die Chance, unser verlorenes Territorium von Trianon zurückzuerobern, könnte das Risiko wert sein."
austria.120.a:0	"Endlich sind wir der Rache für Trianon einen Schritt näher gekommen!"
austria.120.b:0	"Wir werden ihre Brotkrumen nicht annehmen!"
austria.121.t:0	"[HUN.GetNameDefCap] Akzeptiert die Übertragung des Burgenlandes"
austria.121.d:0	"Die [HUN.GetAdjective] Delegation hat unser Angebot angenommen und das Land Burgenland wird nach dem Ende der Konferenz an sie übertragen."
austria.121.a:0	"Sehr gut."
austria.122.t:0	"[HUN.GetNameDefCap] lehnt Übertragung des Burgenlandes ab"
austria.122.d:0	"Die [HUN.GetAdjective] Delegation hat unser Angebot für den Transfer des Burgenlandes abgelehnt, mit der Begründung, dass dies Ungarn nur noch mehr unter Druck setzen würde, weitere [AUS.GetAdjective] Forderungen zu akzeptieren."
austria.122.a:0	"Ihr Verlust."
austria.123.t:0	"[AUS.GetAdjective] Infiltration in Kroatien!"
austria.123.d:0	"In den letzten Monaten haben wir Berichte über [AUS.GetAdjective] produzierte Waffen erhalten, die bei kroatischen Milizgruppen gefunden wurden. Mit der Rückkehr der Habsburger auf den österreichischen Thron ist es wahrscheinlich, dass dies keine Einzelfälle sind und dass die [AUS.GetAdjective] die kroatischen Separatisten bewaffnen, um unsere Nation zu schwächen."
austria.123.a:0	"Wir müssen wachsam bleiben und uns mit diesen Revoluzzern auseinandersetzen."
austria.124.t:0	"Linguistische Probleme in der Armee"
austria.124.d:0	"Mit unserer jüngsten Expansion und den Versuchen, nicht-deutschsprachige Bevölkerungsgruppen aus unseren neuen Gebieten zu rekrutieren, wurde unsere Armee von Koordinationsproblemen geplagt, die dadurch entstanden sind, dass rangniedrige Offiziere Befehle, die von ihren Vorgesetzten auf Deutsch gegeben wurden, nicht verstanden haben. Dies lähmt die Organisationsstruktur unserer Armee, und es muss eher früher als später eine Lösung gefunden werden."
austria.124.a:0	"Wir werden uns etwas einfallen lassen."
austria.125.t:0	"[AUS.GetLeader] Drängt auf österreichische Unabhängigkeit"
austria.125.d:0	"Österreichs neuer Führer, [AUS.GetLeader], der von uns während des Bürgerkriegs unterstützt wurde, versucht seit kurzem, Österreichs Autonomie zu stärken. Er behauptet, dass die österreichische Nation zwar viel von den großen Siegen von [GER.GetLeader] lernen kann und dass die Schicksale von [AUS.GetNameDef] und [GER.GetNameDef] miteinander verflochten sind, aber er glaubt nicht, dass eine Vereinigung der beiden Nationen im besten Interesse Österreichs ist. \n\n Viele unserer Berater warnen davor, Österreich aus den Händen zu geben, da die Nazi-Führung in der Nation nicht die stabilste ist und die Macht verlieren könnte, wenn sie sich selbst überlassen wird.\n\n Wir haben die Möglichkeit, unsere loyalen SS-Einheiten unter der Führung von Arthur Seyss-Inquart zu schicken, um die Regierung von [AUS.GetLeader] zu stürzen. Es liegt an uns, uns zu entscheiden."
austria.125.a:0	"Setzen Sie sich mit Seyss-Inquart in Verbindung und sagen Sie ihm, dass er einen Putsch durchführen soll."
austria.125.b:0	"Wenn sie es wünschen, müssen sie frei bleiben dürfen."
austria.126.t:0	"[AUS.GetLeader] Widersetzt sich dem Putsch!"
austria.126.d:0	"Unsere SS-Agenten in Österreich sind beim Putsch gegen [AUS.GetLeader]s Regierung auf Widerstand gestoßen. Wenn wir die Nation sichern wollen, müssen wir sofort eingreifen."
austria.126.a:0	"Sie haben uns in Zugzwang gebracht."
austria.127.t:0	"Der Umgang mit dem Tausend-Mark-Verbot"
austria.127.d:0	"Das kurz nach der Machtübernahme durch Engelbert Dolfuss in Kraft getretene Tausend-Mark-Verbot, das jeden deutschen Staatsbürger bei der Einreise nach Österreich zwang, eine Gebühr von 1.000 Mark an das Reich zu zahlen, ist nur eine der vielen wirtschaftlichen Sanktionen, die Deutschland gegen Österreich verhängt hat.\n\nWenn wir unser Land aus dem derzeitigen wirtschaftlichen Desaster herausführen wollen, müssen wir einen Weg finden, mit diesen Sanktionen umzugehen. \n\nEinige Regierungsmitglieder sind der Meinung, dass die einzige Möglichkeit, unsere Wirtschaft zu retten, darin besteht, mit [GER.GetNameDef] zu verhandeln. Allerdings würden diese Bedingungen sicherlich einen hohen Preis haben und die Nazis in unserem Land noch stärker machen.\n\nAlternativ könnten wir versuchen, neue Handelspartner zu finden, aber das könnte einige Zeit dauern."
austria.127.a:0	"Ein Abkommen mit Deutschland wäre gefährlich, aber auch vorteilhaft."
austria.127.b:0	"Ein Abkommen mit Deutschland würde die Nazis in unserem Land nur stärken."
austria.128.t:0	"[AUS.GetNameDefCap] Möchte, dass wir das Tausend-Mark-Verbot aufheben"
austria.128.d:0	"Das kurz nach Engelbert Dolfuss' Machtübernahme in Kraft getretene Tausend-Mark-Verbot, das jeden deutschen Staatsbürger bei der Einreise nach Österreich zwang, eine Gebühr von 1.000 Mark an das Reich zu zahlen, ist nur eine der vielen wirtschaftlichen Sanktionen, die wir gegen die Anti-Nazi-Regierung Österreichs verhängt haben. In der vergangenen Woche ist [AUS.GetLeader] mit der Bitte an uns herangetreten, das Verbot zusammen mit zahlreichen anderen Sanktionen aufzuheben, und hat angeboten, Pro-Nazi-Minister in die Regierung zu berufen, um [AUS.GetNameDef] weiter in unseren Einflussbereich zu bringen."
austria.128.a:0	"Es könnte sich als vorteilhaft erweisen, pro-nazistische Persönlichkeiten in die österreichische Regierung zu bringen."
austria.128.b:0	"Die Sanktionen wurden aus einem bestimmten Grund verhängt."
austria.129.t:0	"[GER.GetNameDefCap] Hebt die Wirtschaftssanktionen auf"
austria.129.d:0	"[GER.GetLeader] ist auf unseren Vorschlag eingegangen und hat zugestimmt, die Wirtschaftssanktionen gegen unser Land aufzuheben. Dieser Kompromiss hat uns jedoch einen hohen Preis gekostet, denn die Deutschen haben uns gezwungen, mehrere pro-nazistische Persönlichkeiten in unsere Regierung zu berufen."
austria.129.a:0	"Vielleicht war der Preis zu hoch."
austria.130.t:0	"[GER.GetNameDefCap] Weigert sich, die Wirtschaftssanktionen aufzuheben"
austria.130.d:0	"[GER.GetLeader] hat sich geweigert, die Sanktionen gegen unser Land aufzuheben und behauptet, dass es keine Versöhnung zwischen den beiden Nationen geben wird, solange in Wien eine Anti-Nazi-Regierung an der Macht ist."
austria.130.a:0	"Es bleibt uns also keine andere Wahl."
austria.131.t:0	"Heimwehr-Elemente destabilisieren die Nation"
austria.131.d:0	"Aufgrund unserer Entscheidung, die Heimwehr während unserer Vorbereitungen auf den Bürgerkrieg nicht zu integrieren, laufen viele Elemente, die nicht von Regierungsverbündeten kontrolliert werden, frei herum und destabilisieren unsere Nation."
austria.131.a:0	"Gegen sie sollte so schnell wie möglich vorgegangen werden."
austria.132.t:0	"Unterzeichnung des Juliabkommens"
austria.132.desc:0	"Es ist etwas mehr als drei Jahre her, dass die Anti-Nazi-Vaterlandsfront in Österreich gegründet wurde, aber es scheint, dass die Nation endlich gezwungen wurde, sich dem Druck von [GER.GetNameDef] zu beugen. \n\nAnfang dieser Woche hat sich [AUS.GetLeader] mit [GER.GetLeader] getroffen, um über eine Neuverhandlung vieler [GER.GetAdjective]-Sanktionen zu verhandeln, da er der Meinung ist, dass die Auswirkungen des [GER.GetAdjective]-Embargos auf die [AUS.GetAdjective]-Nation zu groß geworden sind. Oberflächlich betrachtet scheint es, dass [AUS.GetLeader] mit seinen Bemühungen erfolgreich war, da die meisten Sanktionen aufgehoben wurden. Ein genauerer Blick zeigt jedoch, dass er gezwungen war, viele pro-nazistische Minister in sein Kabinett zu berufen, was die ohnehin schon schwache Nation noch weiter in den Einflussbereich von [GER.GetAdjective] zieht. "
austria.132.a:0	"Wir können nur das Beste hoffen."
austria.132.b:0	"Alles läuft wie geplant."
austria.132.c:0	"Wir können nicht zulassen, dass [AUS.GetNameDef] in die deutsche Sphäre fällt!"
austria.132.d:0	"Ein weiterer Dominostein fällt an seinen Platz."
austria.133.t:0	"Das Vermächtnis des Juli-Putsches"
austria.133.d:0	"Ein Jahr nach dem Verbot der österreichischen Nazi-Partei durch Engelbert Dolfuss am 19. Juni 1933 führte die Schutzstaffel einen gescheiterten Putsch gegen die Regierung der Vaterländischen Front an. Während des blutigen Putsches am 25. Juli wurde das gesamte Bundesheer mobilisiert, um die SS-Truppen zu bekämpfen, und es gelang schließlich, sie zu besiegen. Allerdings wurde Bundeskanzler Dollfuß während der Kämpfe getötet, was unser neues Regime in eine sehr verwundbare Lage brachte.\n\n Nachdem Kurt Schuschnigg nach Dollfuß' Tod die Macht übernommen hatte, hat er erklärt, dass er dafür sorgen wird, dass sich ein solches Ereignis nie wieder ereignen wird, aber es gibt immer noch Anhänger der Nazis, die unser Land schwer destabilisieren. Wir müssen uns mit ihnen auseinandersetzen, wenn wir den aufkommenden Sturm überstehen wollen."
austria.133.a:0	"Österreich, wach auf!"
austria.134.t.a:0	"[AUS.GetLeader] Lehnt deutsches Ultimatum ab"
austria.134.t.b:0	"[GER.GetNameDefCap] Rückzug vom Anschluss"
austria.134.d.a:0	"In den letzten Monaten hat sich zwischen [GER.GetNameDef] und [AUS.GetNameDef] eine diplomatische Krise entwickelt, in der die deutsche Regierung starken Druck auf die österreichische Nation ausübt, um eine deutsche Annexion des Landes vorzubereiten. \nDiese Serie von Ereignissen erreichte gestern ihren Höhepunkt, als [GER.GetLeader] an [AUS.GetLeader] die letzte Aufforderung richtete, einen pro-nazistischen Kanzler zu ernennen, der das Land an Deutschland angliedern würde, was prompt abgelehnt wurde.\n\nNach dieser Weigerung scheint es, dass [GER.GetLeader] bereits damit begonnen hat, seine Armee zu mobilisieren, um Österreich mit Gewalt zu erobern."
austria.134.d.b:0	"In den letzten Monaten hat sich eine diplomatische Krise zwischen [GER.GetNameDef] und [AUS.GetNameDef] entwickelt, in der die deutsche Regierung starken Druck auf die österreichische Nation ausübt, um eine deutsche Annexion des Landes vorzubereiten. \nDiese Serie von Ereignissen erreichte gestern ihren Höhepunkt, als [GER.GetLeader] eine letzte Forderung an [AUS.GetLeader] richtete, einen pro-nazistischen Kanzler zu ernennen, der die Nation an Deutschland angliedern würde, was prompt abgelehnt wurde.\n\nMit dieser Ablehnung scheint es, dass [GER.GetLeader] einen Rückzieher gemacht hat, da er eine Intervention von [AUS.GetNameDef]s Verbündeten befürchtet."
austria.134.a:0	"Österreich wird sich durchsetzen!"
austria.134.b:0	"Sie werden ihr Handeln noch bereuen."
austria.134.c:0	"Wir werden unsere österreichischen Freunde gerne unterstützen."
austria.134.d:0	"Ein mutiger Schritt."
austria.135.t:0	"Bürgerkrieg in Italien"
austria.135.d:0	"Nach Benito Mussolinis Versagen im Krieg gegen [ETH.GetNameDef] hat sich eine Rebellion gegen seine Führung zu einem ausgewachsenen Bürgerkrieg ausgeweitet. Da [ITA.GetNameDef] nicht nur ein wichtiger Akteur in unseren auswärtigen Angelegenheiten ist, sondern auch Gebiete kontrolliert, die wir beanspruchen, könnte es klug sein, in irgendeiner Form zu intervenieren."
austria.135.a:0	"Lassen Sie uns unsere Optionen abwägen."
austria.136.t:0	"[39.GetName] Beschlagnahmt!"
austria.136.d:0	"Unser kurzes Scharmützel mit [39.controller.GetNameDef]s Truppen hat zu einem erbitterten Sieg geführt! Wir haben [39.GetName] der Unterdrückung durch [39.controller.GetAdjective] entrissen und sind der Rückeroberung unseres rechtmäßigen Territoriums einen Schritt näher gekommen!"
austria.136.a:0	"Ein großer Sieg!"
austria.137.t:0	"Verlust in [39.GetName]"
austria.137.d:0	"Zu unserer Bestürzung hat das Scharmützel in [39.GetName] mit [39.controller.GetNameDef] in einer demütigenden Niederlage geendet. Unsere Truppen wurden aufgerieben und wir konnten kein Gebiet sichern. Allerdings sind die [39.controller.GetAdjective] Soldaten nicht in unser Gebiet eingedrungen. Vielleicht haben wir in der Zukunft eine weitere Chance."
austria.137.a:0	"Wir werden uns auf das nächste Mal vorbereiten."
austria.138.t:0	"Verlust in [39.GetName]"
austria.138.d:0	"Zu unserer Bestürzung hat das Scharmützel in [39.GetName] mit [AUS.GetNameDef] in einer demütigenden Niederlage geendet. Unsere Streitkräfte wurden aufgerieben und wir haben es nicht geschafft, die Region zu verteidigen."
austria.138.a:0	"Lassen Sie sie in Ruhe. Wir haben andere Dinge, um die wir uns kümmern müssen."
austria.138.b:0	"Wir werden diesen Angriff nicht auf die leichte Schulter nehmen!"
austria.139.t:0	"Sieg in [39.GetName]"
austria.139.d:0	"Die törichten [AUS.controller.GetAdjective] dachten, sie könnten uns unser Territorium wegnehmen, aber wir haben ihre schwachen Streitkräfte mit Leichtigkeit besiegt."
austria.139.a:0	"Vielleicht wird ihnen das eine Lehre sein."
austria.140.t:0	"[AUS.controller.GetAdjective] Sammeln sich an der Grenze."
austria.140.d:0	"Berichte über [AUS.GetAdjective] Truppen, die sich an der Grenze zu [39.GetName] sammeln, haben das Oberkommando erreicht. Einige halten dies für einen Bluff, aber andere sagen, dass sie versuchen könnten, das Chaos unseres Bürgerkriegs zu nutzen, um die Kontrolle über die Region zu erlangen."
austria.140.a:0	"Wir sollten darauf vorbereitet sein, falls dies der Fall sein sollte."
austria.1000.t:0	"Rückkehr des Heiligen Römischen Reiches?"
austria.1000.d:0	"Mit unserer Eroberung der ehemaligen Schlüsselstädte des Heiligen Römischen Reiches glauben einige, dass es an der Zeit ist, die Wiederherstellung des Reiches zu verkünden, um die Rückkehr der österreichischen Herrschaft in Europa vollständig anzukündigen."
austria.1000.a:0	"Die neue Ära der österreichischen Vorherrschaft hat gerade erst begonnen!"
austria.1000.b:0	"Diese Zeiten sind vorbei."
austria.1001.t:0	"Die Rückkehr des Heiligen Römischen Reiches"
austria.1001.d:0	"In den vergangenen Jahrzehnten hatten viele Experten lange vorhergesagt, dass sich irgendwann ein einheitlicher germanischer Staat bilden würde. Aber niemand hatte damit gerechnet, dass es so kommen würde. Während österreichische Truppen in Prag, Rom und Frankfurt einmarschieren, hat [AUS.GetLeader] den Beginn einer neuen Ära der österreichischen Herrschaft über Europa ausgerufen und die Rückkehr des einst untergegangenen Heiligen Römischen Reiches verkündet. Dieses Ereignis hat das Machtgleichgewicht in Europa völlig verschoben, mit einer neuen habsburgischen Hegemonie über den Kontinent."
austria.1001.a:0	"Wahrlich eine Rückkehr in eine vergangene Ära."
austria.1125.t:0	"[FROM.GetNameDefCap] Fordert Slowenien"
austria.1125.d:0	"Die Regierung von [FROM.GetAdjective] hat in letzter Zeit politischen Druck auf die Region Slowenien ausgeübt. Ein Krieg mit ihnen mag kostspielig sein, aber können wir es uns leisten, so einfach Land abzutreten?"
austria.1125.a:0	"Wenn es das Leben unseres Volkes rettet, ja."
austria.1125.b:0	"Niemals! [ROOT.GetNameDefCap] wird die Seinen verteidigen!"
austria.1126.t:0	"[YUG.GetNameDefCap] gibt Slowenien ab"
austria.1126.d:0	"Die [YUG.GetAdjective] haben klugerweise das von uns geforderte Land abgetreten und unseren Truppen den vollständigen Zugang sowie die Kontrolle über alle Einrichtungen gewährt. Unsere Pläne verlaufen wie gewünscht."
austria.1126.a:0	"Ausgezeichnet."
austria.1127.t:0	"[YUG.GetNameDefCap] hat unsere Forderungen abgelehnt"
austria.1127.d:0	"Die aufstrebende falsche Nation von [YUG.GetNameDef] scheint sich gegen uns wehren zu wollen. Welche andere Erklärung könnten wir für eine so rüde Ablehnung haben? Wir werden uns zurückholen müssen, was uns gehört."
austria.1127.a:0	"Dann haben wir wohl keine andere Wahl."
austria.5006.t:0	"[AUS.GetNameDefCap] Schlägt Liechtensteiner Vertrag vor"
austria.5006.d:0	"Diplomaten von [AUS.GetNameDef] sind mit einem Vorschlag für einen Vertrag eingetroffen. Er zielt eindeutig darauf ab, die Liste der Verbündeten im Falle eines bewaffneten Konflikts zu erweitern. Angesichts des zunehmenden [GER.GetAdjective]-Expansionismus und der Tatsache, dass Europa auf einen weiteren Krieg zuzusteuern scheint, könnte es klug sein, ihre Worte zu beherzigen und ihr Angebot ernsthaft in Betracht zu ziehen."
austria.5006.a:0	"Ja, wir müssen Verbündete für den Fall eines weiteren Krieges in Europa suchen."
austria.5006.b:0	"Wir können keinen Vorschlag akzeptieren, der unsere Neutralität untergraben könnte."
austria.5007.t:0	"[FROM.GetNameDefCap] lehnt unseren Vertrag ab"
austria.5007.d:0	"[FROM.GetNameDefCap] hat unseren Vorschlag für ein Bündnis abgelehnt, entweder aus dem Wunsch heraus, seine rein neutrale Haltung gegenüber dem Rest der Welt beizubehalten, oder einfach aus Differenzen zwischen ihrer und unserer Regierung."
austria.5007.a:0	"Verdammt."
austria.5018.t:0	"Transsilvanisches Ultimatum"
austria.5018.d:0	"[AUS.GetNameDefCap] hat von uns die Rückgabe Transsylvaniens an seine Herrschaft gefordert. Sie haben die Region einst beherrscht - aber der Große Krieg hat das geändert. Die Bedrohung, die sie jetzt darstellen, ist jedoch echt."
austria.5018.a:0	"Wir können einen Krieg mit [AUS.GetNameDef] nicht allein führen."
austria.5018.b:0	"Nach ihrer Niederlage im Großen Krieg würden sie es nicht wagen."
austria.5019.t:0	"[FROM.GetNameDefCap] lehnt unser Ultimatum ab"
austria.5019.d:0	"Es scheint, dass die Regierung in [FROM.GetNameDef] die Macht der Nation, mit der sie es zu tun hat, nicht anerkennt. Sie hat unser Ultimatum abgelehnt und weigert sich, unsere historischen Rechte auf die Herrschaft über Transsylvanien anzuerkennen."
austria.5019.a:0	"Sollte die Feder versagen, muss das Schwert gezogen werden!"
