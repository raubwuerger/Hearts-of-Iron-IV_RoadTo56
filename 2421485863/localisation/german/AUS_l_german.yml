AUS_more_anschluss_chance:0	"Die Chance, dass Österreich sich dem Anschluss widersetzt, hängt vom Umfang der Unterstützung durch die Nazis ab."
AUS_crush_nazis_tt_80:0	"Wir kontrollieren §Y80%§! aller Divisionen (Aktuell: [?r56_bundeslaender_balance_rounded]%)"
