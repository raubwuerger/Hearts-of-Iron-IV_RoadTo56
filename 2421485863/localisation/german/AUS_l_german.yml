r56_bundeslaender_category_desc:0	"Ein Jahr nach dem Verbot der österreichischen NSDAP am 19. Juni 1933 führte die Schutzstaffel einen gescheiterten Putsch gegen die Regierung der Vaterländischen Front an. Während des blutigen Putsches am 25. Juli wurde das gesamte Bundesheer mobilisiert, um die SS-Truppen zu bekämpfen, und es gelang schließlich, sie zu besiegen. Allerdings wurde Bundeskanzler Engelbert Dollfuß während der Kämpfe getötet, was unser neues Regime in eine sehr verwundbare Lage brachte.\n\n Nachdem Kurt Schuschnigg nach dem Tod von Dollfuß die Macht übernommen hatte, hat er erklärt, dass er dafür sorgen wird, dass sich ein solches Ereignis nie wieder ereignen wird, aber es gibt immer noch Anhänger der Nazis, die unser Land schwer destabilisieren. Wir müssen sicherstellen, dass wir ihre Bestrebungen unterdrücken, sonst drohen uns schlimme Konsequenzen.\n\n§Om den Einfluss der Nazis einzudämmen, müssen wir ihre Kräfte in jedem Staat unserer Nation bekämpfen. Einige Staaten sind wertvoller als andere, also ist es vielleicht am besten, einen Plan zu entwickeln, wie wir sie besiegen können, oder, wenn es dazu kommt, dafür zu sorgen, dass ihr Aufstand so weit wie möglich geteilt wird, um kein ernsthaftes Problem darzustellen.\n\n§Wenn die Nazis die Kontrolle über 70% unserer Divisionen erlangen oder wir ein Bündnis oder einen Kriegszustand mit [GER.GetNameDef] eingehen, wird ein Bürgerkrieg ausbrechen!§!"
