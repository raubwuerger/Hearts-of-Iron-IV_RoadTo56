AUS_industrial_funds_category:0	"Die österreichische Industrie"
AUS_industrial_funds_category_desc:0	"Seit dem Zusammenbruch der österreichisch-ungarischen Monarchie lag unsere Wirtschaft durch den Verlust der großen Industriezentren in den ehemaligen Kronländern wie Böhmen am Boden. Da unsere Wirtschaft schnell zusammenbrach, war die Regierung gezwungen, viele internationale Kredite beim Völkerbund aufzunehmen, wodurch die Nation hoch verschuldet war, und die weltweite Große Depression machte die Sache nur noch schlimmer.\n\nWenn wir unsere Wirtschaft erholen wollen, können wir die Mittel in industrielle Investitionen umleiten, was eine Weile dauern könnte, oder wir können es riskieren und weitere Kredite aufnehmen, was zwar kurzfristig von Vorteil sein mag, aber unsere Wirtschaft langfristig in Gefahr bringen könnte. Ein Gleichgewicht zwischen den beiden Optionen ist derzeit wahrscheinlich die beste Lösung.\n\nWir haben derzeit [?AUS_industrial_funds|+] Industriefonds."
AUS_take_out_loan:0	"Aufnahme eines internationalen Kredits"
AUS_industrial_subsidies:0	"Industrie-Subventionen"
AUS_divert_construction_funding:0	"Baufinanzierung umleiten"
AUS_divert_production_funding:0	"Produktionsmittel umleiten"
AUS_repay_loans:0	"Internationale Darlehen zurückzahlen"
AUS_war_plan_dr_category:0	"Kriegsfall DR"
AUS_war_plan_dr_category_desc:0	"Der Kriegsfall DR wurde von Alfred Jansa entwickelt und ist unser bester Aktionsplan im Falle einer deutschen Invasion. Wenn sie angreifen, werden wir bereit sein."
AUS_enact_warplan_DR:0	"Kriegsfall DR einleiten"
AUS_make_crownland_category:0	"Gewährung des Kronland-Status"
AUS_make_crownland_category_desc:0	"Während wir Land für unser Reich zurückgewinnen, könnte es immer noch Widerstand in der lokalen Bevölkerung geben. Wir könnten versuchen, die Unterstützung der Bevölkerung zu gewinnen, indem wir bestimmten Ländern einen Sonderstatus gewähren."
AUS_make_crownland_map_area:0	"Staaten auswählen, um Kronlandstatus zu gewähren"
AUS_make_crownland:0	"Gewähren Sie [FROM.GetName] Kronland-Status"
AUS_german_unification_category:0	"Deutsche Wiedervereinigung"
AUS_german_unification_category_desc:0	"Die Zeit für die deutsche Wiedervereinigung ist gekommen. Nachdem wir die Kontrolle von der ehemaligen deutschen Regierung übernommen haben, müssen wir unser neues Land in unser großes neues vereinigtes Deutschland integrieren."
AUS_german_unification_map_area:0	"Ansicht Integrierbare Staaten"
AUS_german_resistance_category:0	"Bewaffnung des deutschen Widerstands"
AUS_german_resistance_category_desc:0	"Es gibt viele Deutsche, die die tyrannische Regierung von [GER.GetLeader] nicht unterstützen. Alles, was sie brauchen, ist ein Strom von Waffen, und sie könnten sich als ernsthafter Dorn im Auge der Wehrmacht erweisen."
AUS_german_infiltration_map_area:0	"Wählen Sie, wo Sie den deutschen Widerstand unterstützen"
AUS_infiltrate_state_germany:0	"Unterstützen Sie den Widerstand in [FROM.GetName]"
r56_aus_german_resistance_armed:0	"Anti-Regierungs-Widerstandszellen"
r56_aus_german_resistance_armed_desc:0	"In diesem Staat gibt es regierungsfeindliche Widerstandszellen, die der rivalisierenden Regierung in Wien gegenüber loyal sind."
AUS_intervention_italy_category:0	"Intervention im italienischen Bürgerkrieg"
AUS_intervention_italy_category_desc:0	"In Italien ist ein Bürgerkrieg ausgebrochen. Wir könnten in gewisser Weise intervenieren, um unsere Interessen zu sichern. "
AUS_south_tyrol_border_war:0	"Beschlagnahmen Sie [39.GetName]"
AUS_south_tyrol_border_war_desc:0	"Das Gebiet von [39.GetName] ist rechtmäßig österreichisches Land, mit einer mehrheitlich deutschen Bevölkerung. Wir sollten die Wirren des Bürgerkriegs nutzen, um es zu erobern."
AUS_border_war_south_tyrol:0	"Drohender Grenzkonflikt in [39.GetName]"
AUS_try_to_recruit_hungarian_officers:0	"Versuchen Sie, ungarische Offiziere zu rekrutieren"
AUS_try_to_recruit_czech_officers:0	"Versuchen Sie, tschechische Offiziere zu rekrutieren"
AUS_try_to_recruit_croat_officers:0	"Versuchen Sie, kroatische Offiziere zu rekrutieren"
AUS_try_to_recruit_german_officers:0	"Versuchen Sie, deutsche Offiziere zu rekrutieren"
AUS_try_to_recruit_austrian_officers:0	"Versuchen Sie österreichische Offiziere zu rekrutieren"
AUS_core_german_state:0	"Integrieren Sie [FROM.GetName]"
AUS_move_capital_to_berlin:0	"Verlegung der Hauptstadt nach Berlin"
AUS_move_capital_to_berlin_desc:0	"Jetzt, wo Berlin unter unserer Kontrolle ist, müssen wir unsere Hauptstadt dorthin verlegen, um ein letztes Mal unsere Einigkeit zu zeigen."
AUS_integrate_slovenia:0	"Integrieren Sie Slowenien"
AUS_integrate_slovenia_desc:0	"Das slowenische Volk ist seit langem ein Teil der Süddeutschen. Nun, da sie sich entschieden haben, unsere Regierung zu unterstützen, können wir sie vollständig in unsere große Nation integrieren. "
AUS_integrate_sudetenland:0	"Sudetenland integrieren"
AUS_integrate_sudetenland_desc:0	"Die Sudetendeutschen waren Teil des österreichischen Kaiserreichs und waren immer Teil der österreichischen Nation. Wir müssen ihnen die volle Staatsbürgerschaft als gleichberechtigte Bürger des Landes geben."
AUS_integrate_silesia:0	"Schlesien integrieren"
AUS_integrate_silesia_desc:0	"Die Deutschen in Schlesien wurden von den Preußen gewaltsam aus dem Reich herausgerissen und waren gezwungen, ihre österreichische Identität aufzugeben. Jetzt, da unsere Herrschaft gefestigt ist, können wir sie endlich wieder integrieren."
AUS_eisenstadt_conference_category:0	"Die Eisenstädter Konferenz"
AUS_eisenstadt_conference_category_desc:0	"Wenn wir wieder zu unserem alten Ruhm zurückkehren und unser Reich wieder vereinen wollen, müssen wir aus den Fehlern der Vergangenheit lernen. Ein modernes Österreich-Ungarn muss alle Völker des Reiches unterstützen, nicht nur die Österreicher.\n\n[HUN.GetNameDefCap] hat sich bereit erklärt, mit uns an den Verhandlungstisch zu kommen, und wenn wir uns ihre Unterstützung sichern wollen, dürfen wir mit unseren Forderungen nicht zu weit gehen.\n\n§Wenn wir zu viel verlangen, könnte die Konferenz scheitern und einen Krieg auslösen!§!"
AUS_conference_ongoing:0	"Konferenz läuft"
AUS_propose_economical_linking:0	"Wirtschaftliche Verknüpfung vorschlagen"
AUS_propose_military_linking:0	"Integration der Produktion vorschlagen"
AUS_propose_trade_linking:0	"Vereinheitlichung des Handels vorschlagen"
AUS_transfer_burgenland:0	"Abtretung des Burgenlandes vorschlagen"
AUS_eisenstadt_conference_category_HUN:0	"Die Eisenstädter Konferenz"
AUS_eisenstadt_conference_category_HUN_desc:0	"Mit der Rückkehr der Habsburger nach Österreich war es nur natürlich, dass sie sich schließlich auch an uns wenden würden. Da sie uns zu einer Konferenz über die Zukunft unserer Nationen eingeladen haben, sollten wir uns anhören, was sie zu sagen haben, aber wenn sie zu viel verlangen, ist es vielleicht am besten, die Konferenz ganz abzubrechen."
AUS_conference_ongoing_HUN:0	"Konferenz im Gange"
AUS_infiltrate_croatia_category:0	"Infiltration nach Kroatien"
AUS_infiltrate_croatia_category_desc:0	"[AUSGetCroatiaDesc]"
AUS_infiltrate_croatia_category_desc_AUS_KINGDOM:0	"Seit seiner Gründung nach dem Zusammenbruch unseres Reiches ist [YUG.GetNameDef] eine instabile Nation voller innerer Unruhen. \n\nDie Zentralregierung in Belgrad begünstigt die serbische Bevölkerung, was dazu geführt hat, dass ein Großteil der kroatischen Bevölkerung gegen das Königreich ist. Wir sollten dies zu unserem Vorteil nutzen und diese Rebellen gegen Belgrad bewaffnen, um uns in unserem Krieg gegen die Jugoslawen zu unterstützen."
AUS_infiltrate_croatia_category_desc_AUS_COMMUNIST:0	"Seit seiner Gründung nach dem Zusammenbruch unseres Reiches ist [YUG.GetNameDef] eine instabile Nation voller innerer Unruhen. Obwohl Josef Broz Tito ein Kroate ist, ist die kommunistische Regierung in vielen Teilen des Landes zutiefst unpopulär. Wir sollten dies zu unserem Vorteil nutzen und diese Rebellen gegen Belgrad bewaffnen, um uns in unserem Krieg gegen die Jugoslawen zu unterstützen."
AUS_infiltrate_croatia_category_desc_YUG:0	"In den letzten Monaten haben wir Berichte über [AUS.GetAdjective] produzierte Waffen erhalten, die bei kroatischen Milizen gefunden wurden. Mit der Rückkehr der Habsburger auf den österreichischen Thron ist es wahrscheinlich, dass dies keine Einzelfälle sind und dass die [AUS.GetAdjective] kroatische Separatisten bewaffnen, um unsere Nation zu schwächen. Wir müssen diese Infiltration zerstören und die habsburgische Bedrohung ein für alle Mal zerschlagen!"
