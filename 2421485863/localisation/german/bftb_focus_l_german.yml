l_german:
GRE_bring_home_the_exiled_republicans:0	"Bringt die Exil-Republikaner nach Hause"
GRE_bring_home_the_exiled_republicans_desc:0	"Jetzt, wo unser Führer Eleftherios Venizelos endlich wieder an der Spitze steht, können wir unsere Genossen aus dem langen Exil zurückholen, das ihnen vom monarchistischen Regime aufgezwungen wurde. Wir werden jede Hilfe brauchen, wenn wir unser Land wieder auf den richtigen Weg bringen wollen!"
GRE_bring_home_the_exiled_republicans_focus_tt:0	"§YYVenezelist§! Minister und Generäle werden aus dem Exil zurückkehren und zur Verfügung stehen."
GRE_compromise_with_the_monarchists:0	"Kompromiss mit den Monarchisten"
GRE_compromise_with_the_monarchists_desc:0	"Wir mögen den König nicht, aber unser Land ist in dieser Frage schon viel zu lange gespalten. Anstatt einen weiteren Bürgerkrieg zu riskieren, sollten wir die Monarchisten an den Verhandlungstisch bringen und über die Bedingungen sprechen. Die Zeit des Kampfes ist vorbei."
GRE_compromise_with_the_monarchists_focus_tt:1	"§YGeorge II§! gibt seinen Würgegriff über das Land auf und wird ein konstitutioneller Monarch. \n\nDie £faction_gre_monarchist §YMonarchists§! werden §Gfriendly§!. \nDie £faction_gre_communist §YCommunists§! werden zu §Rhostile§!."
GRE_request_communist_support:0	"Bitten Sie die Kommunisten um Unterstützung"
GRE_request_communist_support_desc:0	"Georg II. ist kein Grieche und er hat absolut kein Recht, sich in die Angelegenheiten Griechenlands einzumischen! Unser Land hat schon zu oft für sein erfundenes Recht zu regieren geblutet, und jetzt müssen wir diesen Verbrecher endlich vor Gericht bringen! Aber wir können es nicht allein tun, und es gibt nur eine Gruppe, die den König genauso hasst wie wir..."
GRE_request_communist_support_focus_tt:1	"Die £faction_gre_communist §YCommunists§! werden §Gfriendly§!. \nDie £faction_gre_monarchist §YMonarchists§! werden zu §Rhostile§!. \n\n Die £faction_gre_monarchist §YMonarchist§! Generäle und Minister werden §Resign§! aus dem Dienst, aber die £faction_gre_communist §YCommunist§! Generäle und Minister werden §Gavailable§!."
GRE_remembering_the_anatolian_catastrophe:0	"Erinnerung an die anatolische Katastrophe"
GRE_remembering_the_anatolian_catastrophe_desc:0	"Der kleinasiatische Feldzug war nichts weniger als eine Katastrophe. Unser Volk wurde abgeschlachtet, unser Ansehen ruiniert und unsere politische Bewegung zerschlagen - und das alles im Laufe von drei Jahren! Wir können nicht zulassen, dass dies unser Vermächtnis ist, wir müssen es so drehen, dass unser Volk den Türken die Schuld gibt und nicht uns - und vielleicht können wir dann nach all den Jahren endlich unsere Träume von einem Großgriechenland erfüllen..."
GRE_old_memories_stir_new_threats_tt:0	"Die Aufregung um Anatolien könnte §unbeabsichtigte Folgen§! haben..."
GRE_a_socialist_economy:0	"Eine sozialistische Wirtschaft"
GRE_a_socialist_economy_desc:0	"Das griechische Volk hat zu lange unter der autokratischen Herrschaft des falschen Königs und der kriegstreiberischen Venizelisten geblutet. Es ist an der Zeit, dass das Volk endlich unter einer Regierung gedeiht, die es an die erste Stelle setzt!"
GRE_restoring_our_home:0	"Unser Zuhause wiederherstellen"
GRE_restoring_our_home_desc:0	"Die Jahre haben Griechenland nicht gut getan - wir wurden von Krieg, Schulden und Armut heimgesucht. Jetzt, da die Demokratie endlich an unsere Küsten zurückgekehrt ist, ist es an der Zeit, die ausbeuterischen Deutschen und Italiener zu vertreiben. Wir sollten uns stattdessen auf unsere engen Beziehungen zu den Briten konzentrieren, in der Hoffnung, dass sie uns beim Wiederaufbau unseres Landes helfen - sowohl in der Industrie als auch im Geist."
GRE_venerate_the_ancient_hellenes:0	"Verehren Sie die antiken Hellenen"
GRE_venerate_the_ancient_hellenes_desc:0	"Sind wir nicht die Nachkommen der ehrwürdigen Griechen von einst? \Teilen wir nicht das Blut mit diesen Meistern der Polemik, der Philosophie und des Krieges? Wir werden unserem Volk wieder ein starkes Gefühl des Stolzes einflößen, damit wir unseren Platz als Leitstern Europas wieder einnehmen können."
GRE_the_birthplace_of_democracy:0	"Die Geburtsstätte der Demokratie"
GRE_the_birthplace_of_democracy_desc:1	"Tyrannen haben in den Herzen und Köpfen der Griechen nur selten Respekt genossen, und das ist eine Eigenschaft, die wir seit der Zeit des Perikles mit Stolz bewahrt haben! Die Demokratie ist eine der vielen Früchte unseres Genies, und es ist nur recht und billig, dass wir sie gegen römisch und germanisch inspirierte Tyrannei verteidigen!"
GRE_nationalized_banks:0	"Verstaatlichte Banken"
GRE_nationalized_banks_desc:0	"Die Deutsche Bank und die Bank of England haben das griechische Volk schon viel zu lange ausgebeutet: Sie veruntreuen seine ohnehin schon mageren Einkünfte und bestrafen es für die Handlungen einer diktatorischen Regierung, die es nicht gewählt hat! Wir sagen, dass das griechische Volk nicht länger ausgebeutet werden darf und dass seine Gelder stattdessen an seine Regierung gehen sollten!"
GRE_soviet_subsidised_railways:0	"Sowjetisch subventionierte Eisenbahnen"
GRE_soviet_subsidised_railways_desc:0	"Griechenland wurde von den europäischen Großmächten auf Schritt und Tritt missbraucht. Es ist an der Zeit, über das Schwarze Meer zu schauen, wenn wir überhaupt eine Chance haben wollen, die griechische Wirtschaft zu modernisieren."
GRE_agricultural_communes:0	"Landwirtschaftliche Gemeinden"
GRE_agricultural_communes_desc:0	"Die Welt hat sich um uns herum industrialisiert und es ist höchste Zeit, dass wir aufholen. Aber viele unserer Leute kennen nichts anderes als ein Leben in der Landwirtschaft, und wir können unsere Wurzeln nicht so einfach aufgeben. Wir werden den landwirtschaftlichen Sektor in effizienten Kommunen organisieren und so Talente für andere Bereiche wie die Produktion oder das Militär freisetzen."
GRE_theban_warriors:0	"Thebanische Krieger"
GRE_theban_warriors_desc:0	"Es ist nicht unser Ziel, eine säulenförmige Gesellschaft von Kämpfern zu schaffen, die Stärke über alles stellen. Wir lehnen jeden Versuch, Mussolinis Regierungssystem zu imitieren, aktiv ab! Wir sind Griechen, keine Römer! Anstatt einen Kult um die gewalttätigen Spartaner zu errichten, sollten wir stattdessen die Thebaner feiern - die die spartanische Hegemonie durch List gestürzt haben!"
GRE_athenian_thinkers:0	"Athenische Denker"
GRE_athenian_thinkers_desc:0	"Einige der besten Denker der Menschheit kamen aus Athen, und mit ein wenig Förderung der Künste und Wissenschaften werden wir wieder große Köpfe aus ganz Griechenland hervorgehen sehen!"
GRE_macedonian_generals:0	"Makedonische Generäle"
GRE_macedonian_generals_desc:0	"Alexander der Große hat sich einst einen großen Teil der Welt untertan gemacht, und das alles vom bescheidenen Makedonien aus. Was ihn groß gemacht hat, liegt uns allen im Blut, und wir sollten Alexander und die Argeaden als Beispiele für griechische Exzellenz in der Führung betrachten."
GRE_the_greek_industrial_revolution:0	"Die griechische industrielle Revolution"
GRE_the_greek_industrial_revolution_desc:0	"Griechenland hätte schon vor Jahrzehnten industrialisiert werden müssen, aber korrupte Politiker und ausländische Mächte haben uns ein Wirtschaftssystem aus einer längst vergangenen Zeit hinterlassen. Wir haben nicht den Luxus der Zeit, unsere Lebensweise im Laufe der Zeit zu ändern, wir müssen jetzt beginnen und schnell arbeiten."
GRE_industry_bypass_tt:0	"Nicht genügend Bauplätze für §YMilitärische Fabriken§! oder §YZivile Fabriken§!"
GRE_red_militias:0	"Rote Milizen"
GRE_red_militias_desc:0	"Es gibt viele, die unsere Bemühungen um die Modernisierung der griechischen Gesellschaft vereiteln wollen, aber mit der Organisation von Milizen, die sich dem Erhalt der Revolution verschrieben haben, wird es für sie umso schwieriger, uns aufzuhalten."
GRE_clearing_land_for_industrial_expansion:0	"Rodung von Land für die industrielle Expansion"
GRE_clearing_land_for_industrial_expansion_desc:0	"Oliven-, Wein- und Tabakfelder säumen die vielen Hügel Griechenlands, ebenso wie eine große Anzahl von Kirchen - Relikte des byzantinischen Reiches. Für die ersteren haben wir keinen Bedarf, und für die letzteren ist im neuen Griechenland kein Platz. Lassen Sie uns dieses beschlagnahmte Land nutzen, um Fabriken für die Arbeiter zu errichten!"
GRE_the_anatolian_refugees:0	"Die anatolischen Flüchtlinge"
GRE_the_anatolian_refugees_desc:0	"Nach der anatolischen Katastrophe waren wir gezwungen, fast zwei Millionen griechische Flüchtlinge aufzunehmen, die in der Türkei gelebt hatten. Wir waren unvorbereitet, und die Situation ist nur noch unhaltbarer geworden. Die Flüchtlinge organisieren sich nun politisch unter Georgios Kosmidis, einem weiteren anatolischen Exilanten. Ihre Bewegung ist zu groß, um sie zu ignorieren, und sind unsere Ziele am Ende wirklich so unterschiedlich?"
GRE_depose_the_reactionaries:0	"Die Reaktionäre absetzen"
GRE_depose_the_reactionaries_desc:0	"Wir haben diese Koalition mit den Venezolanern lange genug geduldet. Ihre liberale Agenda ist ein Gräuel für unser marxistisches Credo, und es ist an der Zeit, diese absurde Beziehung endlich zu beenden. Für die Revolution!"
GRE_resurrecting_the_megali_idea:0	"Die Wiederbelebung der Megali-Idee"
GRE_resurrecting_the_megali_idea_desc:0	"1919 wurde uns die Megali-Idee versprochen, aber nach dem anschließenden griechisch-türkischen Krieg war dieser Traum fast für immer geplatzt. Aber solange die Türken unsere großen alten Ländereien mit ihrer Anwesenheit entweihen, werden wir weiterhin das begehren, was uns rechtmäßig gehört. Das griechische Volk hat sich schon einmal daran erinnert, man kann es ihm wieder ins Gedächtnis rufen..."
GRE_megali_idea_conference_invites_tt:0	"Die Einladungen zum §YMegali-Konvent§! werden nach Auswahl des Schwerpunkts verschickt."
GRE_prepare_for_the_great_anti_fascist_war:0	"Bereiten Sie sich auf den Großen Antifaschistischen Krieg vor"
GRE_prepare_for_the_great_anti_fascist_war_desc:0	"Der Faschismus ist die größte Bedrohung für das Glaubensbekenntnis des Marxismus - er stellt eine ideologische Herausforderung dar, die nur auf dem Schlachtfeld niedergeschlagen werden kann. Die Sowjetunion tut nichts, um die Ausbreitung des Faschismus einzudämmen, und so liegt es an uns."
GRE_ally_tito:0	"Verbündeter Tito"
GRE_ally_tito_desc:0	"Es gibt keinen Revolutionär, der unserem Credo des antistalinistischen Marxismus treuer ist als Josip Broz Tito aus Jugoslawien. Es mag uns nicht gefallen, aber wir brauchen ihn und seine Landsleute vereint hinter uns unter dem Banner der brüderlichen Solidarität gegen die blutrünstigen Faschisten und die verräterischen Bolschewiken."
GRE_tow_the_stalinist_line:1	"Auf den Zehenspitzen der stalinistischen Linie"
GRE_tow_the_stalinist_line_desc:0	"Wir verdanken unsere Revolution den großen Köpfen in der Sowjetunion: Ohne ihren Beitrag hätten wir vielleicht nie die Macht in Griechenland errungen! Wir stehen in Solidarität mit unseren Genossen in Moskau."
GRE_horror_and_fear:0	"Schrecken und Furcht"
GRE_horror_and_fear_desc:0	"Deimos kai Phobos - Schrecken und Furcht. Das waren die Zwillingssöhne von Ares, dem Gott des Krieges. Die Spartaner haben zu Ehren der Söhne des Ares auf dem Schlachtfeld Blut vergossen; isoliert und allein werden auch wir zu Ehren unserer glorreichen Vergangenheit auf dem Schlachtfeld Blut vergießen."
GRE_the_gordian_knot:0	"Der Gordische Knoten"
GRE_the_gordian_knot_desc:0	"Der gordische Knoten ist Teil der Legende von Alexander dem Großen: Er steht für die Lösung einer scheinbar unmöglichen Aufgabe durch einen kühnen Schlag. Unsere unmögliche Aufgabe ist es, unser verlorenes Land zurückzuerobern - unser kühner Schachzug besteht darin, dass unsere mächtigen Verbündeten es für uns erobern."
GRE_megali_idea_approved:0	"§YMegali Idea§! Genehmigt"
GRE_megali_convention_a_failure:0	"Die Konvention von Heraklion war ein Fehlschlag"
GRE_gordian_knot_tt:0	"Alle Unterzeichner, die nicht §YItalien§! sind, werden §YTürkei§! an der Seite von §YGriechenland§! den Krieg erklären, um die Bestimmungen der §YMegalischen Konvention§! zu erfüllen."
GRE_secure_the_aegean:0	"Sichern Sie die Ägäis"
GRE_secure_the_aegean_desc:0	"Wir versuchen, die Probleme auf der anderen Seite Europas zu lösen, ignorieren aber die Bedrohung direkt vor unserer Haustür. Die Türken haben das griechische Volk jahrhundertelang als unsere Todfeinde verfolgt, und obwohl wir gehofft hatten, einen neuen und besseren Weg einzuschlagen, ist klar geworden, dass die Zukunft nicht gewonnen werden kann, solange die Vergangenheit nicht bereinigt ist."
GRE_dominate_the_bulgarians:0	"Beherrschen Sie die Bulgaren"
GRE_dominate_the_bulgarians_desc:0	"Die Bulgaren haben die Sicherheit Griechenlands immer wieder aufs Neue bedroht. Das 'Preußen des Balkans' wurden sie genannt - wie drollig. Wir werden nicht zulassen, dass sie die Sicherheit Griechenlands gefährden, nicht noch einmal."
GRE_stage_an_incident_in_the_bosporus:0	"Inszenieren Sie einen Zwischenfall am Bosporus"
GRE_stage_an_incident_in_the_bosporus_desc:0	"Das sowjetische Politbüro hat aus seinem Wunsch, Konstantinopel zu kontrollieren, kein Geheimnis gemacht. Mit unserer Hilfe haben die Sowjets beschlossen, die ersten konkreten Schritte zu unternehmen, um die Kontrolle über die Meerenge am Bosporus zu übernehmen, und Griechenland spielt dabei eine absolut entscheidende Rolle..."
GRE_reviving_the_double_headed_eagle:0	"Die Wiederbelebung des doppelköpfigen Adlers"
GRE_reviving_the_double_headed_eagle_desc:0	"Die Venizelisten waren Feiglinge, die sich weigerten, Griechenland seinen wahren verlorenen Ruhm zurückgeben zu lassen - den Ruhm von Byzanz! Warum sollten wir uns mit den Küsten der Türkei begnügen, wenn wir alle verlorenen Gebiete des Reiches zurückfordern können? Ein neues Zeitalter des Ruhms für Griechenland hat begonnen!"
GRE_nenikikamen:0	"Nenikikamen"
GRE_nenikikamen_desc:1	"[Root.GetNenikikamenDesc]"
GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_STANDARD:0	"Wir haben gesiegt! Venizelos hat nach all den Jahren endlich Recht bekommen! Die Megali-Idee hat über die Neinsager und diejenigen, die unser Schicksal vereiteln wollten, gesiegt, und wir stehen nun am Abgrund eines neuen Zeitalters für Griechenland - eines Goldenen Zeitalters!"
GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_BYZANTINE:0	"Wir haben gesiegt! Byzanz ist gerächt, nach all diesen Jahren! Durch die Rückeroberung unserer alten kaiserlichen Hauptstadt sind wir unserem Schicksal einen Schritt näher gekommen! Wir stehen am Abgrund eines neuen Zeitalters für Griechenland - ein Zeitalter, geboren aus Blut und Feuer! Kosmídisy Nikas!"
GRE_attack_the_fascists:0	"Greift die Faschisten an"
GRE_attack_the_fascists_desc:0	"Der Faschismus ist ein Virus, er hat sich in Europa wie eine Seuche von Land zu Land ausgebreitet. Der Kommunismus ist das Heilmittel, und wir werden es ihnen mit Gewalt verabreichen!"
GRE_revolutionaries_of_the_south:0	"Revolutionäre des Südens"
GRE_revolutionaries_of_the_south_desc:0	"Wir werden nie ganz mit unseren Genossen in Moskau einer Meinung sein, aber solange Griechenland sein eigenes revolutionäres Credo diktiert, werden wir hier unten - im Süden Europas - frei in unserem wahren Kommunismus leben!"
GRE_phoideratoi:0	"Phoideratoi"
GRE_phoideratoi_desc:0	"Unsere Vorväter hatten den Verstand, mit den Barbaren zusammenzuarbeiten, wenn es nötig war, und das ist heute ganz sicher der Fall. Wir müssen allen ehemaligen Untertanen des Imperiums, die mit unserem Kampf gegen die moderne Welt sympathisieren, das Recht einräumen, in den Reihen unserer großartigen Armeen zu kämpfen! Gemeinsam, als Einheit, marschieren wir zum Sieg!"
GRE_the_die_is_cast:0	"Die Würfel sind gefallen!"
GRE_the_die_is_cast_desc:0	"Unsere Träume sind wahr geworden, doch die Welt bleibt in Gefahr! Die Fronten sind abgesteckt, und Griechenland wird ein Wörtchen mitzureden haben, wie der kommende Konflikt ausgeht!"
GRE_byzantine_themata:0	"Byzantinische Themata"
GRE_byzantine_themata_desc:0	"Die Welt hat sich seit dem Fall von Konstantinopel stark verändert, und die Eroberung hat sich zu einem ziemlich komplizierten Unterfangen entwickelt. Wir können nicht erwarten, dass die neu zurückeroberten Völker des Reiches uns dienen, nur weil wir es wünschen: Wir müssen ein gewisses Maß an Selbstbestimmung zulassen und mit den lokalen Verwaltungen dieser eroberten Regionen zusammenarbeiten. Um unser Imperium wieder zu sichern, ist dies nur ein kleiner Preis, den wir zahlen müssen."
byz_restore_byzantine_empire_category_tt:0	"Schaltet §YRestauration des Byzantinischen Reiches§! Entscheidungen frei."
GRE_the_kings_government:0	"Die Regierung des Königs"
GRE_the_kings_government_desc:0	"Das rechtzeitige Eingreifen Seiner Majestät hat die Venizelisten daran gehindert, eine neue Regierung zu bilden, und das keinen Augenblick zu früh! Es gibt noch viel zu tun! Demertzis hat seinen Zweck als zentristischer Vermittler erfüllt, aber jetzt braucht Griechenland einen stärkeren Regierungschef."
GRE_the_right_to_rule:0	"Das Recht zu regieren"
GRE_the_right_to_rule_desc:0	"Warum einen Diktator ernennen, der im Namen des Königs handelt, wenn der König durchaus in der Lage ist, selbst zu handeln! Lassen Sie uns nicht in der Tradition verharren, während Griechenland leidet, es ist Zeit für einen wahren Monarchen, der dem Volk dient! Gott schütze König Georg II!"
GRE_abandon_french_italian_debt_tt:0	"Wir werden die Schulden, die wir bei §YFrance§! und §YItalien§! haben, aufgeben.\n"
GRE_absolute_monarchy_opposition_tt:0	"§Diesen Weg einzuschlagen wird zu einem Bürgerkrieg führen!§! \nDie §YVenezelisten§! werden zu §Rebellisten!§! \nDie §YKommunisten§! werden zu §Rebellisten!§!"
GRE_metaxism_focus:0	"Metaxismus"
GRE_metaxism_focus_desc:0	"Der König ist das unangefochtene Staatsoberhaupt, doch das griechische Volk ist mit dieser Regelung nicht einverstanden. Es mag nicht ideal sein, aber es gibt einen sehr talentierten und sehr engagierten ehemaligen Offizier, der in den Startlöchern steht, um eine Regierung zu bilden..."
GRE_metaxism_warning_tt:1	"\nWenn §YGreece§! sich einer Fraktion anschließt, bevor der §YMetaxism§! nationale Geist vollständig aufgewertet ist, dann wird er §Removed§!.\n"
GRE_the_hellenic_spirit:0	"Der hellenische Geist"
GRE_the_hellenic_spirit_desc:0	"Wir kämpfen dafür, dass die heilige Flamme, die Griechenland einst so groß gemacht hat, weiter brennt. Wir sind zu wahrer Größe fähig, das wissen wir! Wir müssen nur diesen Funken wiederfinden..."
GRE_four_year_plan:0	"Der Vierjahresplan"
GRE_four_year_plan_desc:0	"Metaxas hat einen brillanten Plan zur Industrialisierung Griechenlands ausgearbeitet. Auf der Grundlage des italienischen korporatistischen Wirtschaftsmodells werden wir ein gewisses Maß an Autarkie und Unabhängigkeit von den Mächten, die uns binden, erreichen."
GRE_petition_britain_for_aid:1	"[Root.GetGreekPetitionForAidName]"
GRE_PETITION_FOR_AID_FOCUS_NAME_STANDARD:0	"Bitten Sie die Briten um Hilfe!"
GRE_PETITION_FOR_AID_FOCUS_NAME_MONARCHIST:0	"Bitten Sie die Briten und die Deutschen um Hilfe!"
GRE_petition_britain_for_aid_desc:1	"[Root.GetGreekPetitionForAidDesc]"
GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_STANDARD:0	"Der Pöbel hat mit seinem zivilen Ungehorsam und der Androhung eines Bürgerkriegs seine milde Missbilligung der Herrschaft des Königs kundgetan. Unsere Feinde haben im Moment die Oberhand, also ist es keine Schande, unsere britischen Verbündeten um Hilfe in unserem Kampf zu bitten. Mit den Briten auf unserer Seite können wir auf keinen Fall verlieren."
GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_MONARCHIST:0	"Der Pöbel hat mit seinem zivilen Ungehorsam und der Androhung eines Bürgerkriegs seine milde Missbilligung der Herrschaft des Königs kundgetan. Unsere Feinde haben im Moment die Oberhand, also ist es keine Schande, unsere Verbündeten um Hilfe in unserem Kampf zu bitten. Mit den Briten und den Deutschen auf unserer Seite können wir auf keinen Fall verlieren."
GRE_monarchist_civil_war:0	"Der Bürgerkrieg um die Alleinherrschaft von Georg II. hat begonnen"
GRE_the_national_youth_organisation:0	"Die Nationale Jugendorganisation"
GRE_the_national_youth_organisation_desc:1	"Die Art und Weise, wie die Deutschen und die Italiener ihre Jugend organisiert haben, hat etwas Bewundernswertes. Wir können ihr Modell adaptieren, um sicherzustellen, dass unsere Jugend sich nicht an asozialem Verhalten beteiligt oder unseren großen Führer [ROOT.GetLeader] nicht respektiert."
GRE_crack_down_on_the_republicans:0	"Hartes Durchgreifen gegen die Republikaner"
GRE_crack_down_on_the_republicans_desc:0	"Wir haben die Venezolaner schon viel zu lange geduldet - es ist Zeit, dass diese Scharade ein Ende hat. Sie haben kein Fünkchen Ehre oder Respekt, sie sind völlig unmoralisch und wir werden sie wie das Ungeziefer, das sie sind, aus Griechenland vertreiben!"
GRE_use_the_military:0	"Setzen Sie das Militär ein"
GRE_use_the_military_desc:0	"Wir werden sie mit allem, was wir haben, bekämpfen! Wir werden sie auf den Straßen jagen, wir werden sie in den Gassen jagen, wir werden sie bis ans Ende der Welt jagen! Kein Venezolaner soll sich vor unserer stets wachsamen Herrschaft sicher fühlen!"
GRE_recruit_the_fascists:0	"Rekrutieren Sie die Faschisten"
GRE_recruit_the_fascists_desc:0	"Um einen Radikalen zu fangen, muss man in der Lage sein, wie einer zu denken. Die Faschisten sind unsere verachtenswerten Feinde, aber von allen unseren Feinden hassen wir sie sicherlich am wenigsten. Sie sind bereit, mit uns zu kooperieren, warum sollten wir sie also nicht für unsere Zwecke nutzen?"
GRE_fascists_put_in_play_tt:0	"Die §YFascist Faction§! wird aktiv und beginnt §Gfriendly§! mit der Regierung. \nIndem wir mit den §YFaschisten§! kooperieren, legitimieren wir ihre Bewegung."
GRE_realign_ourselves_with_the_central_powers:0	"Richten wir uns neu auf die Zentralmächte aus"
GRE_realign_ourselves_with_the_central_powers_desc:0	"Irgendwie ist das Unmögliche passiert! Der Führer ist weg und der Kaiser ist zurück! Die britische Außenpolitik hat sich aufgrund dieser Ereignisse angepasst, und das nicht unbedingt zu unserem Vorteil. Vielleicht sollten wir uns mit unseren Verwandten in Berlin zusammentun und dafür kämpfen, das göttliche Recht der Könige in ganz Europa zu retten."
GRE_no_central_powers_tt:0	"§YÖsterreich-Ungarn§! oder das §YKaiserreich§! müssen existieren, damit dieser Fokus irgendeine Wirkung hat."
GRE_our_traditional_allies_in_the_aegean:0	"Unsere traditionellen Verbündeten in der Ägäis"
GRE_our_traditional_allies_in_the_aegean_desc:0	"Wer hat uns geholfen, 1832 unsere Unabhängigkeit gegen die Osmanen zu gewinnen? Die Briten. Wer hat unsere Wirtschaft über so viele Jahre hinweg mit Krediten und Investitionen über Wasser gehalten? Die Briten. Bei welcher Macht liegt die Zukunft Griechenlands? Bei den Briten!"
GRE_metaxism_lost_tt:0	"Wenn wir die letzten Reformen von Metaxas nicht durchgeführt haben, dann werden wir den §YMetaxismus§! Nationalgeist verlieren!"
GRE_prepare_against_the_mediterranean_threat:0	"Bereiten Sie sich auf die Bedrohung durch das Mittelmeer vor"
GRE_prepare_against_the_mediterranean_threat_desc:0	"Die Italiener sind eine Bedrohung, deren Ambitionen dem Schicksal Griechenlands zuwiderlaufen. Wir gewinnen nichts, wenn wir abwarten und so tun, als ob sie keine Bedrohung für uns darstellen. Wir werden handeln, damit die Italiener, wenn sie sich schließlich an unseren Küsten einschiffen, durch die gemeinsame Anstrengung von Millionen von Griechen in die Meere zurückgedrängt werden, aus denen sie gekommen sind!"
GRE_the_metaxas_line:0	"Der Beginn der §YMetaxas-Linie§! - eine Reihe von Landfestungen entlang unserer oft kompromittierten Grenzen - wird vollendet werden.\n"
GRE_the_leonidas_line:0	"Der Beginn der §YLeonidas-Linie§! - eine Reihe von Festungen entlang unserer oft gefährdeten Grenzen - wird vollendet werden.\n"
GRE_an_orthodox_state:0	"Ein orthodoxer Staat"
GRE_an_orthodox_state_desc:0	"Wir sind ein christlich-orthodoxer Staat - er ist ein wesentlicher Bestandteil unserer nationalen Identität. Gepriesen seist du, o Gott, unsere Hoffnung, gepriesen seist du."
GRE_following_in_the_footsteps_of_giants:0	"In den Fußstapfen von Giganten"
GRE_following_in_the_footsteps_of_giants_desc:0	"Metaxas hat dazu beigetragen, uns einige der vielen Vorzüge des Faschismus aufzuzeigen, aber er war zu feige, uns den ganzen Weg zu zeigen. Wir brauchen eine echte Form des Faschismus: einen griechischen Faschismus - einen, der kein billiges Faksimile des italienischen oder deutschen Modells ist."
no_fascist_metaxism_spirit_tt:0	"Wenn man sich nicht auf §YReviving the Spartan Warrior Spirit§! konzentriert, dann wird der §YMetaxism§! nationale Geist nicht faschistoider und wird stattdessen §Rremoved§! sein."
GRE_reclaiming_the_wayward_ally:0	"Den abtrünnigen Verbündeten zurückgewinnen"
GRE_reclaiming_the_wayward_ally_desc:0	"Der Zusammenbruch des Osmanischen Reiches war eine große Erleichterung für uns, aber die Republik Türkei ist eine noch größere Bedrohung für Griechenland als die Osmanen vor ihr. Seltsame Zeiten erfordern seltsame Partner; es liegt an Griechenland, die Osmanen zurückzubringen."
GRE_the_greater_enosis:0	"Erreichen der Enosis"
GRE_the_greater_enosis_desc:0	"[Root.GetAchievingEnosisDesc]"
GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_STANDARD:0	"Zypern war und wird immer griechisch sein. Vielleicht waren wir noch nicht so weit, als die Briten uns unserer Chance auf Vereinigung beraubten, aber jetzt ist unser Staat sicher stark und stabil genug für die Vereinigung unseres Volkes! Es ist an der Zeit, die ausländische Besatzung Zyperns zu beenden, damit die Insel Zypern in die griechische Nation eingegliedert werden kann, wo sie hingehört."
GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_ALTERNATE:0	"Zypern war und wird immer griechisch sein. Vielleicht waren wir noch nicht so weit, als die Briten uns unserer Chance auf Vereinigung beraubten, aber jetzt, da Zypern seine Unabhängigkeit gesichert hat, ist es sicherlich an der Zeit, vergangenes Unrecht wiedergutzumachen! Diese Träume von der Selbstverwaltung sind wahnhaft bis hin zur Arroganz. Die Zyprioten müssen doch einsehen, dass sie am sichersten als integraler Bestandteil der griechischen Nation aufgehoben sind."
GRE_securing_the_bulgarian_menace:0	"Sicherstellung der bulgarischen Bedrohung"
GRE_securing_the_bulgarian_menace_desc:0	"Seit wann stellen die Bulgaren keine Bedrohung für die territoriale Integrität Griechenlands dar? Wie können wir darauf vertrauen, dass die bulgarische Regierung nicht irgendeine Art von Vereinbarung mit einer größeren Macht anstrebt, damit sie sich gegen uns verschwören kann? Man könnte es Paranoia nennen, aber wir nennen es Erfahrung. Wir müssen uns mit den Bulgaren verbünden, um unsere Interessen zu wahren."
GRE_the_modern_movement:0	"Die moderne Bewegung"
GRE_the_modern_movement_desc:0	"Der Faschismus ist das Glaubensbekenntnis des 20. Jahrhunderts - er ist eine Antwort auf die Fehler des zügellosen Kapitalismus und die Korruption des Kommunismus. Der Faschismus ist der Schlachtruf einer Generation, einer Generation, die genug hat von ausländischer Schikane! Eine Generation, die genug von der nationalen Schande hat! Eine Generation, die bereit ist, Griechenland als Großmacht in ein neues Zeitalter zu führen - bereit, auf jede Bedrohung und jede Beleidigung zu antworten! Aéra!"
GRE_required_fascist_faction_loyalty_tt:0	"Die §YFascist Faction§! muss §Gloyal§! sein."
GRE_expansion_of_athens_university:0	"Ausbau der Universität Athen"
GRE_expansion_of_athens_university_desc:0	"Wissenschaft und höhere Bildung waren schon immer ein fester Bestandteil der griechischen Tradition, und es gibt heute keine wichtigere akademische Einrichtung für Griechenland als die Nationale und Kapodistrianische Universität von Athen. Indem wir zusätzliche Mittel und Raum für die Expansion bereitstellen, werden wir den Nutzen des Instituts für den Staat erheblich steigern."
GRE_defending_our_kingdom:0	"Unser Königreich verteidigen"
GRE_defending_our_kingdom_desc:0	"Einige Gelehrte haben gesagt, dass angesichts der jüngsten politischen Entwicklungen in Europa die größte Bedrohung für einen Staat von innen kommen kann. Was für ein Blödsinn! Die wahre Bedrohung sind unsere Nachbarn, die immer gegen uns intrigieren und Ränke schmieden! Wir haben schon viele Niederlagen erlitten, aber im nächsten Krieg müssen wir unbedingt als Sieger hervorgehen."
GRE_hellenoturkism:0	"Hellenoturkismus"
GRE_hellenoturkism_desc:0	"In der Nationalsozialistischen Partei Griechenlands gibt es einen fast universellen Wunsch nach einer Vertiefung unserer Beziehungen zur Türkei. Wir haben uns so viele Jahrhunderte lang gegenseitig bekämpft und ausgeblutet, dass niemand daran dachte, welche Wunder wir gemeinsam erreichen könnten! Wir müssen uns beide an die faschistischen Mächte binden, um der Sicherheit willen! Hoffen wir, dass die Türken das genauso sehen wie wir..."
GRE_cement_greco_german_ties:0	"Deutsch-griechische Bande zementieren"
GRE_cement_greco_german_ties_desc:0	"Eine Wahrheit, die viele Linke gerne vergessen, ist, dass wir ohne die großzügige Finanzpolitik Deutschlands uns gegenüber schon vor Jahren wieder zusammengebrochen wären. Nichts von dem, was wir bisher erreicht haben, wäre ohne die Deutschen möglich gewesen! Wir brauchen sie mehr als sie uns brauchen, aber wir können ihnen im Namen unserer engen und lieben Freundschaft immer noch einen besseren Deal abringen."
schachtplan_required_tt:0	"Hat keine Variante des §YSchachtplans§!"
GRE_protectors_of_the_mediterranean:1	"[Root.GetProtectorsMediterraneanName]"
GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_STANDARD:0	"Beschützer des Mittelmeers"
GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_MONARCHIST:0	"Champions des Mittelmeers"
GRE_protectors_of_the_mediterranean_desc:1	"[Root.GetProtectorsMediterraneanDesc]"
GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_STANDARD:0	"Das Mittelmeer ist unsere Heimat und die Heimat von Millionen von Menschen. Es war immer unser Wunsch, dauerhaften Frieden in unserem kleinen Teil der Welt zu sichern, aber diese bewundernswerten Ziele wurden immer wieder von denjenigen vereitelt, die böse Absichten hegen. Wir können nicht länger tatenlos zusehen, wie wir selbst oder unsere Nachbarn unter den Taten derer leiden, die uns schaden wollen. Es ist an der Zeit, für das einzustehen, was richtig ist."
GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_MONARCHIST:0	"Das Mittelmeer ist unsere Heimat und die Heimat von Millionen anderer Menschen. Es war schon immer unser Wunsch, dauerhaften Frieden in unserem kleinen Teil der Welt zu sichern, aber diese bewundernswerten Ziele wurden immer wieder von denjenigen vereitelt, die böse Absichten hegen. Nun, wenn Sie sie nicht schlagen können - schließen Sie sich ihnen an. Wir werden uns ein mächtiges griechisches Reich schaffen und endlich denjenigen Recht geben, die oft mit Füßen getreten werden."
GRE_reviving_the_spartan_warrior_spirit:0	"Die Wiederbelebung des spartanischen Kriegergeistes"
GRE_reviving_the_spartan_warrior_spirit_desc:0	"In der Schlacht bei den Thermopylen sollen viertausend Spartaner zwanzigtausend Perser erschlagen haben, als sie Xerxes' weiteren Weg nach Griechenland versperrten. Wir brauchen diese Art von Heldentum heute mehr denn je, damit wir, wenn der nächste Möchtegern-Eroberer vor den Toren Athens auftaucht, um uns unsere Häuser und unser Leben zu nehmen, den Mut haben, ihm entgegenzutreten und zu sagen: molon labé."
GRE_subjugating_the_bulgarians:0	"Die Unterwerfung der Bulgaren"
GRE_subjugating_the_bulgarians_desc:0	"Die Bulgaren sind unsere lebenslangen Feinde; sie existieren nur, um ein Messer in unserem Rücken zu sein. Ihre erbärmliche Zivilisation hat nie etwas gebracht, und so versuchen sie bei jeder Gelegenheit, unser Erbe und unsere Nation zu zerstören. Genug ist genug - lassen Sie uns die Bulgaren daran erinnern, warum wir eines der ältesten überlebenden Völker Europas sind."
GRE_greece_and_turkey_in_the_axis:0	"Griechenland und die Türkei gemeinsam in der Achse!"
GRE_greece_and_turkey_in_the_axis_desc:0	"Nachdem der griechisch-türkische Freundschaftspakt unterzeichnet und ratifiziert wurde, können wir nun endlich das Schicksal des Balkans neu gestalten, indem wir die Deutschen dazu benutzen, uns allen den ewigen Wohlstand zu bringen, den wir verdient haben! Wir werden den Rest des Balkans schreiend und tretend mit uns nehmen, wenn es sein muss..."
greek_turkish_friendship:0	"Griechisch-Türkischer Freundschaftspakt unterzeichnet"
GRE_last_country_standing:0	"Das letzte Land, das noch steht"
GRE_last_country_standing_desc:0	"Die Zusammenarbeit mit der türkischen Regierung war wünschenswert, aber die neue griechische Regierung scheut sich nicht, Maßnahmen zu ergreifen, wenn die Situation es erfordert. Möge Gott uns allen gnädig sein."
GRE_moulding_the_new_world_order:0	"Die Gestaltung der neuen Weltordnung"
GRE_moulding_the_new_world_order_desc:0	"Die Leichen haben sich bereits so hoch aufgetürmt, und das darf nicht umsonst gewesen sein. Wir kämpfen, um einen neuen globalen Status Quo zu schaffen, und wir werden so lange kämpfen, bis es plötzlich keinen Kampfeswillen mehr auf der Welt gibt."
GRE_reevaluating_the_drachma:0	"Abwertung der Drachme"
GRE_reevaluating_the_drachma_desc:0	"Unsere finanzielle Misere scheint kein Ende zu nehmen. Zahlungsausfälle und Schulden haben uns in eine absolut unhaltbare wirtschaftliche Situation gebracht. Wir müssen bewusst eine Währungsabwertung vornehmen, um den Zufluss von ausländischem Kapital zu fördern, auch wenn dies auf lange Sicht einigen unserer Schulden schaden könnte."
GRE_pay_back_debt_tt:0	"Diese §YEntscheidungen§! werden es uns ermöglichen, die §YSchulden bei der I.F.C.§! nationalen Geist herabzustufen und schließlich loszuwerden."
GRE_lignite_liquefaction:0	"Verflüssigung von Braunkohle"
GRE_lignite_liquefaction_desc:0	"Unser Land ist reich an Braunkohlegruben, und wir kennen bereits den Prozess, durch den Braunkohle in Kraftstoff umgewandelt werden kann. Die Regierung sollte die Eröffnung von mehr Braunkohleverflüssigungsanlagen fördern."
GRE_force_the_farmers_into_factories:0	"Zwingen Sie die Bauern in die Fabriken"
GRE_force_the_farmers_into_factories_desc:0	"Die Bevölkerung scheint in dem Märchen gefangen zu sein, dass sie für den Rest ihres Lebens in der Landwirtschaft bleiben kann und aus dem sich anbahnenden Konflikt gut herauskommt. Sie irren sich: Wir haben keine andere Wahl, als damit zu beginnen, Farmen zu beschlagnahmen und die Landwirte zwangsweise in unsere städtischen Zentren umzusiedeln, damit sie eine Arbeit aufnehmen können, die dem Staat unmittelbar zugute kommt."
GRE_utilize_our_strengths:0	"Nutzen Sie unsere Stärken"
GRE_utilize_our_strengths_desc:0	"Griechenland ist eine Nation von Bauern und Luxusgütern, und das ist keine Schande. Sicher, Deutschland mag Panzer und Kampfflugzeuge in Massenproduktion herstellen, aber was glauben Sie, woher der Tabak in Hermann Görings Pfeife kommt? Wir Griechen kennen unsere Stärken, und wenn wir uns an sie halten, wird es uns gut gehen."
GRE_extracting_more_from_our_soil:0	"Mehr aus unserem Boden herausholen"
GRE_extracting_more_from_our_soil_desc:0	"Griechenland ist ein Land, das reich an natürlichen Ressourcen ist, wir müssen nur die Entschlossenheit haben, sie auszugraben. Die Technologie hat uns den Weg gewiesen, jetzt müssen wir nur noch den Willen dazu finden."
GRE_open_foreign_subsidized_factories:0	"Öffnen Sie vom Ausland subventionierte Fabriken"
GRE_open_foreign_subsidized_factories_desc:0	"Wir haben alle Erwartungen übertroffen, was den Bau und die Besetzung von Fabriken angeht, aber es besteht kein Zweifel, dass wir langsamer expandieren als der Rest unserer europäischen Landsleute. Es gibt Menschen, die weitaus reicher sind als wir und die unseren Modernisierungsprozess maßgeblich vorantreiben können, wenn wir unser Land nur attraktiv genug für diese Investitionen machen können."
GRE_open_foreign_subsidized_factories_tt:0	"Eine §YMilitärische Fabrik§! und eine §YZivile Fabrik§! wird für jedes der folgenden Länder hinzugefügt, das sich §Ynicht in einem Bürgerkrieg§! befindet und eine §YPopinion§! von §YGriechenland§! hat, die größer als §G80§! ist: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, und §Y[SOV.GetNameDef]§!."
GRE_unlock_soviet_decision_tt:0	"Schaltet Beschlüsse frei: §YHost [SOV.GetAdjective] Bureaucrats in [ROOT.GetNameDef]§!"
GRE_paying_back_our_debts_in_bulk:0	"Unsere Schulden in Massen zurückzahlen"
GRE_paying_back_our_debts_in_bulk_desc:0	"Je schneller wir von unseren Schulden befreit sind, desto eher können wir damit beginnen, dieses Land wirklich umzugestalten. Wir werden einen größeren Teil des Landeskapitals für die Rückzahlung unserer Schulden zur Verfügung stellen, damit wir uns schneller von unseren ausländischen Finanzherren befreien können."
GRE_paid_off_most_of_debt_tt:0	"Wir müssen den größten Teil unserer nationalen §YSchulden§! abbezahlt haben."
GRE_paying_back_our_debts_in_bulk_ENG_tt:0	"Schaltet die Entscheidung frei: §YLarge Debt Repayment to the British§! \n"
GRE_paying_back_our_debts_in_bulk_FRA_tt:0	"Schaltet die Entscheidung frei: §YLarge Debt Repayment to the French§! \n"
GRE_paying_back_our_debts_in_bulk_ITA_tt:0	"Schaltet die Entscheidung frei: §YLarge Debt Repayment to the Italians§! \n"
GRE_open_up_the_country:0	"Öffnen Sie das Land"
GRE_open_up_the_country_desc:0	"Es ist eine traurige Tatsache, das zuzugeben, aber wir können uns nicht allein industrialisieren. Seit langem sind wir auf das Kapital und die industriellen Fähigkeiten von Nationen angewiesen, die größer sind als wir, und diese Ära ist da keine Ausnahme. Lassen Sie uns also heute ihr Kapital und ihre Investitionen nach Griechenland holen, denn morgen werden wir sie nie wieder brauchen!"
GRE_connecting_our_prefectures:0	"Unsere Präfekturen verbinden"
GRE_connecting_our_prefectures_desc:0	"Es ist nicht nur unsere industrielle Basis, an der es uns mangelt, sondern auch unsere nationale Infrastruktur. Unsere Nachbarn haben ihre Länder urbanisiert, es ist an der Zeit, dass auch wir damit beginnen, unsere Bevölkerung zu urbanisieren."
GRE_exporting_more_luxury_commodoties:0	"Mehr Luxusgüter exportieren"
GRE_exporting_more_luxury_commodoties_desc:0	"Tabak, Oliven, Feta, Trauben, Feigen: Wenn Sie das Beste vom Leben wollen, kaufen Sie Ihre Annehmlichkeiten in Griechenland! Es dürfte uns nicht schwer fallen, unser internationales Image als das Land mit den besten Luxusgütern weiter zu stärken."
GRE_greek_autarky:0	"Griechische Autarkie"
GRE_greek_autarky_desc:0	"Unsere langjährige Abhängigkeit vom Kapital der Länder, die reicher sind als wir, ist demütigend. Diese Länder bevormunden uns, schikanieren uns und halten uns arm, damit sie sich selbst die Taschen mit Reichtum füllen können. Die Deutschen, Italiener und Sowjets haben uns gezeigt, dass es einen anderen Weg gibt - einen Weg zur Selbstversorgung und völligen Unabhängigkeit! Natürlich kann es einige Zeit dauern, bis wir diesen Zustand erreichen: Wir sind schließlich kein Deutschland..."
GRE_fiscal_responsibility:1	"[Root.GetFiscalResponsibilityName]"
GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_STANDARD:0	"Finanzielle Verantwortung"
GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_COMMUNIST:0	"Umverteilung des Reichtums auf breiter Front"
GRE_fiscal_responsibility_desc:0	"Vielleicht zum ersten Mal in der modernen griechischen Geschichte haben wir endlich einen Zustand des finanziellen Gleichgewichts erreicht. Es besteht kein Zweifel, dass dies ein Ereignis ist, das wirklich gefeiert werden muss! Wir sollten uns selbst für unsere meisterhafte Staatskunst beklatschen, wir haben es verdient."
GRE_fiscal_responsibility_tt:0	"Müssen die Schulden bei der I.F.C§! entweder ganz oder teilweise begleichen"
GRE_bolster_the_schachtplan:0	"Verstärken Sie den Schachtplan"
GRE_bolster_the_schachtplan_desc:0	"Der Schachtplan ist seit einiger Zeit ein Eckpfeiler der griechischen Zentralplanung, aber es ist klar, dass der Schachtplan unverhohlen zu Gunsten Deutschlands geschrieben wurde. Einige der besten Wirtschaftswissenschaftler unseres Landes haben einen Plan vorgelegt, um den Schachtplan neu zu verhandeln, so dass er für beide Seiten vorteilhafter ist, und wir wären dumm, wenn wir uns das nicht zunutze machen würden!"
GRE_british_docking_rights:0	"Britische Andockrechte"
GRE_british_docking_rights_desc:0	"Der Schlüssel zum Sieg der Entente an der Nahostfront während des Ersten Weltkriegs war ihr Zugang zu unseren griechischen Häfen. Wir leben in einer Zeit, in der es immer mehr danach aussieht, dass das Mittelmeer das Pulverfass sein wird, das Europa in Brand setzt, und die Briten werden sicherlich davon profitieren, wieder Zugang zu unseren Häfen zu haben."
GRE_renegotiate_debt_with_france:0	"Unsere Schulden mit Frankreich neu verhandeln"
GRE_renegotiate_debt_with_france_desc:0	"Die Franzosen scheinen ihre Außenpolitik auf dem Balkan nicht in den Griff zu bekommen - lassen Sie uns ihnen einen Deal anbieten, der so einfach ist, dass nicht einmal sie ihn missverstehen können. Vergeben Sie uns unsere Schulden, und wir werden unsere Sicherheit und unseren Lebensunterhalt an die Erfolge des französischen Regimes binden."
GRE_renegotiate_debt_with_france_tt:0	"Entriegelt die Entscheidung: §YBestechen Sie die französischen Gewerkschaften, um ihre Regierung zu schikanieren§! \nVerzichten Sie auf jegliche §YSchulden bei der I.F.C.§!, die von §Y[FRA.GetNameDef]§! unterhalten werden."
GRE_sophistry_and_science:0	"Sophistik und Wissenschaft"
GRE_sophistry_and_science_desc:0	"Spezialitäten der alten Griechen, brauchen wir heute mehr denn je kluge und wissbegierige Köpfe, die bereit sind, dieses Land zu verändern und uns ins zwanzigste Jahrhundert zu führen. Jahrhundert zu katapultieren. Wenn wir uns auf technologische Innovationen konzentrieren, werden wir in den nächsten fünfzig Jahren nicht hinter dem Rest Europas zurückbleiben."
GRE_expand_our_tobacco_industry:0	"Erweitern Sie unsere Tabakindustrie"
GRE_expand_our_tobacco_industry_desc:0	"Unser größtes und profitabelstes Exportgut ist zweifellos der Tabak, ein Produkt, das wir in die ganze Welt verkaufen. Die Länder, mit denen wir bereits Handelsbeziehungen aufgebaut haben, werden es sicher zu schätzen wissen, dass wir unser Unternehmen so gründlich vorbereitet haben, dass der Welt unser berühmter Tabak nie ausgehen wird, egal was passiert."
GRE_increase_our_mining_operations:0	"Erweitern Sie unsere Bergbauaktivitäten"
GRE_increase_our_mining_operations_desc:0	"Die Ausweitung unserer Tabakproduktion mag uns bei der internationalen Gemeinschaft besser einschmeicheln, aber die Ausweitung unserer schweren Bergbauindustrie ist für den Staat von größerem Nutzen. Mineralien und Erze werden den Krieg gewinnen, nicht Tabak und Olivenöl."
GRE_bedrock_of_balkan_financial_stability:1	"[Root.GetBedrockFinancialStabilityName]"
GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_STANDARD:0	"Der Grundstein für die finanzielle Stabilität des Balkans"
GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_COMMUNIST:0	"Der Hort der wirtschaftlichen Korruption auf dem Balkan"
GRE_bedrock_of_balkan_financial_stability_desc:0	"Wer hätte je gedacht, dass ausgerechnet Griechenland das erste Land auf dem Balkan sein würde, das seine finanzielle Situation wirklich in den Griff bekommt? Unser regionales Prestige ist durch die Decke gegangen, und wir sollten unsere neue Position als die Bankiers Südeuropas unbedingt ausnutzen, um unser Land noch reicher zu machen."
GRE_bedrock_of_balkan_financial_stability_tt:0	"Für jedes Startland auf dem §YWestlichen Balkan§!, dem §YÖstlichen Balkan§! und dem §YNördlichen Balkan§!, das mehr als §Y50§! §Yopinion§! von uns hat, erhalten wir eine §YZivilfabrik§! außerhalb der Karte. Dies gilt auch für §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, und §Y[TUR.GetNameDef]§!."
GRE_rapprochement_with_the_italians:0	"Annäherung an die Italiener"
GRE_rapprochement_with_the_italians_desc:0	"Drastische Zeiten verlangen nach drastischen Maßnahmen. Wir müssen das Undenkbare tun und die Italiener um ihre Hilfe bei der Modernisierung unseres Landes bitten. Wie werden uns die Italiener bei dieser Vereinbarung erpressen und erpressen? Das weiß nur Gott. Wenn überhaupt eine Vereinbarung getroffen werden kann..."
GRE_appeal_to_the_soviet_union:0	"Appell an die Sowjetunion"
GRE_appeal_to_the_soviet_union_desc:0	"Wir wenden uns nicht leichtfertig an die Sowjetunion. Wir werden in die Höhle eines Wolfes gehen, der uns bis auf die Knochen reißen wird, wenn wir nicht vorsichtig sind, aber es ist sicherlich besser, wenn wir zu ihnen gehen, als wenn sie zu uns kommen..."
GRE_encourage_tourism:0	"Fördern Sie den Tourismus"
GRE_encourage_tourism_desc:0	"Die Welt beneidet uns um unsere Kulturerbestätten, und es besteht kein Zweifel, dass wir den Tourismus zu einem mächtigen Segen für unsere Wirtschaft machen können. Natürlich liegt der Schatten des Krieges, der sich über Europa ausbreitet, ein kleiner Dämpfer über allem - aber das macht eine Flucht ins exotische Griechenland hoffentlich umso attraktiver!"
GRE_encourage_tourism_tt:0	"§AWir werden unsere Tourismusindustrie verlieren, sobald wir in einen Kriegszustand eintreten!"
GRE_mobilise_our_economy:0	"Mobilisieren Sie die Wirtschaft"
GRE_mobilise_our_economy_desc:0	"Die Großmächte Europas fahren ihre Kriegsmaschinen hoch, und wir können nicht riskieren, unvorbereitet erwischt zu werden. Der Prozess wird für Griechenland schmerzhaft sein - schmerzhafter als für die meisten Länder - aber um unseres Überlebens willen müssen wir Opfer bringen."
GRE_rejuvenating_athens:0	"Die Verjüngung Athens"
GRE_rejuvenating_athens_desc:0	"Unsere große und glorreiche Hauptstadt ist eine der ältesten Städte in ganz Europa. Sie ist auch eine unserer reichsten und am besten organisierten Präfekturen. Anstatt Provinzen zu entwickeln, die bereits hoffnungslos unterentwickelt sind, sollten wir unsere Anstrengungen auf unsere bereits moderne Hauptstadt konzentrieren."
GRE_making_use_of_our_islands:0	"Die Nutzung unserer Inseln"
GRE_making_use_of_our_islands_desc:0	"Wir haben viele Inseln aus dem Kadaver des Osmanischen Reiches zurückerhalten, nachdem es von der Entente so effizient abgeschlachtet worden war, aber wir haben seit unserer Übernahme nur sehr wenig mit ihnen gemacht. Kreta ist seit langem ein wichtiger Teil Griechenlands, und wir werden unsere Bemühungen dort beginnen und uns auf die anderen Inseln ausdehnen, um sie strategisch und materiell wertvoller für den Staat zu machen."
GRE_making_use_of_our_islands_tt:0	"Dieser Fokus hat eine größere Wirkung, wenn wir auch Zypern und die Dodekanes-Inseln kontrollieren."
GRE_making_use_of_our_islands_dodecanese_tt:0	"Dieser Fokus hat eine größere Wirkung, wenn man auch die §YDodekanesischen Inseln§! kontrolliert."
GRE_making_use_of_our_islands_cyprus_tt:0	"Dieser Fokus hat eine größere Wirkung, wenn Sie auch §YYCyprus§! kontrollieren."
GRE_clear_the_slums:0	"Räumen Sie die Slums"
GRE_clear_the_slums_desc:0	"Griechische Flüchtlinge haben sich der Einberufung entzogen und wertvollen Platz beansprucht, indem sie schmutzige Slums und Elendsviertel angelegt und sich darin niedergelassen haben. Ihre Existenz ist eine Schande für das Land, ebenso wie ihre Bewohner, die sich vor ihren Pflichten gegenüber der Nation drücken. Wir werden diese Slums räumen und das Land und die Menschen einer besseren Nutzung zuführen."
GRE_cooperate_with_foreign_monopolies:1	"[Root.GetCooperateForeignMonopoliesName]"
GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_STANDARD:0	"Kooperieren Sie mit ausländischen Monopolen"
GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST:0	"Verstaatlichen Sie die ausländischen Monopole"
GRE_cooperate_with_foreign_monopolies_desc:0	"Es hat keinen Sinn, gegen die Mächtigen zu kämpfen, es ist ein nicht zu gewinnender Kampf, der Griechenland langsam töten wird, wenn wir ihn führen. Lassen Sie uns die Monopole an den Verhandlungstisch bringen und eine gütliche Einigung für alle Beteiligten ausarbeiten, anstatt den unbesonnenen Narren zu spielen."
GRE_crack_down_on_foreign_monopolies:0	"Hartes Durchgreifen gegen ausländische Monopole"
GRE_crack_down_on_foreign_monopolies_desc:0	"Zu lange haben wir die ausländischen Geldverleiher und die globalen Finanzmonopole geduldet - damit ist jetzt Schluss! Wir werden uns nicht länger von diesen heimtückischen Organisationen herumschubsen lassen, denn von diesem Tag an wird Griechenland wirklich frei sein!"
GRE_academy_of_athens:0	"Akademie von Athen"
GRE_academy_of_athens_desc:0	"Die Akademie von Athen wurde 1929 als Institut für höhere Bildung gegründet, aber sie ist noch jung und braucht Hilfe, um zu wachsen. Mit unserem Einsatz werden wir sie zu einem Dreh- und Angelpunkt für alle aufstrebenden Akademiker in Europa und darüber hinaus machen!"
GRE_hellenic_armed_forces:0	"Griechische Streitkräfte"
GRE_hellenic_armed_forces_desc:0	"Unsere Streitkräfte sind für unsere derzeitige nationale Situation anständig genug, aber wir bleiben militärisch das schwächste Mitglied des Balkanpakts und wurden oft für die mangelnde Modernisierung unserer Streitkräfte kritisiert. Es ist an der Zeit, dass wir uns ernsthaft mit unserer militärischen Situation auseinandersetzen, zumal sich unsere interne Lage verschlechtert..."
GRE_the_hellenic_air_force:0	"Die hellenische Luftwaffe"
GRE_the_hellenic_air_force_desc:0	"Unsere Luftwaffenakademie wurde zwar erst 1930 gegründet, aber das griechische Volk hat schon seit den Balkankriegen mit der Luftfahrt zu tun! Wir wissen bereits, wie wichtig eine starke Luftwaffe ist, wenn wir nur die Möglichkeit hätten, unsere Luftwaffe stärker und größer zu machen..."
GRE_the_hellenic_army:0	"Die hellenische Armee"
GRE_the_hellenic_army_desc:0	"Klein, veraltet, aber zäh - so würden viele die griechische Armee beschreiben, und das ist keine unzutreffende Beschreibung. Wir müssen nur unsere Taktik und Ausrüstung modernisieren, dann werden wir zu einer gefürchteten Kraft auf dem Balkan."
GRE_the_hellenic_navy:0	"Die Griechische Marine"
GRE_the_hellenic_navy_desc:0	"Wir Griechen haben eine starke und stolze maritime Tradition, seit wir unsere Unabhängigkeit vom Osmanischen Reich erlangt haben. Unsere Marine ist die stärkste unserer Nachbarn, und wir müssen nur unser maritimes Erbe pflegen, um uns zu einem wirklich mächtigen regionalen Akteur im Mittelmeerraum zu entwickeln."
GRE_destroying_our_foes:0	"Die Zerstörung unserer Feinde"
GRE_destroying_our_foes_desc:0	"Die Sicherung unserer Zukunft hängt davon ab, dass wir unsere Feinde angreifen, bevor sie überhaupt die Gelegenheit haben, unser Heimatland zu berühren. Wir müssen in eine Strategie der strategischen Bombardierung feindlicher Ziele investieren."
GRE_protecting_our_skies:0	"Schutz unseres Himmels"
GRE_protecting_our_skies_desc:0	"Wir waren noch nie in der Lage, gleichzeitig unseren Himmel zu schützen und unsere Feinde zu bombardieren. Wenn es darauf ankommt, ob wir mehr Feinde angreifen oder mehr unserer eigenen Landsleute vor ihren Angriffen retten wollen, dann werden wir uns jedes Mal für die Rettung unserer eigenen Landsleute entscheiden."
GRE_the_backbone_of_our_army:0	"Das Rückgrat der Armee"
GRE_the_backbone_of_our_army_desc:0	"Unsere Wehrpflicht ist im Vergleich zu vielen unserer Nachbarn etwas archaisch, und unsere Ausrüstung ist jämmerlich veraltet. Es ist an der Zeit, dass wir unsere Einberufungsverfahren und die Ausrüstung unserer Soldaten modernisieren."
GRE_a_legacy_of_war:0	"Ein Erbe des Krieges"
GRE_a_legacy_of_war_desc:0	"Der Krieg liegt uns im Blut - seit Menschengedenken haben wir ihn gegen andere geführt und gegen uns führen lassen. Im Laufe der Jahrhunderte haben wir mehr als nur ein paar Tricks aufgeschnappt, und es ist an der Zeit, dass unsere nationale Armee endlich das Beste aus unserer blutigen Vergangenheit widerspiegelt."
GRE_abandon_the_greek_turkish_naval_treaty:0	"Streichen Sie den griechisch-türkischen Flottenvertrag"
GRE_abandon_the_greek_turkish_naval_treaty_desc:0	"Ein Vertrag, der die Größe der Schiffe, die die Türken bauen durften, begrenzen sollte, endete irgendwie damit, dass wir mit den gleichen Beschränkungen dazu gezwungen wurden! Vergessen Sie es, Griechenland hatte früher glorreiche Großkampfschiffe, die unsere Küsten beherrschten, und in dieser Zeit der Unruhen kann es keine bessere Sicherheit geben als ein riesiges Schlachtschiff!"
GRE_abandon_the_greek_turkish_naval_treaty_tt:0	"Wenn wir uns politisch mit Großbritannien oder Deutschland verbünden, können wir einige unserer alten Kriegsschiffe wiederaufbauen.\n"
GRE_a_modern_navy:0	"Eine moderne Marine"
GRE_a_modern_navy_desc:0	"Es macht wenig aus, dass der griechisch-türkische Flottenvertrag die Größe der Schiffe, die wir bauen können, begrenzt, denn offen gesagt haben wir einfach nicht die Marineindustrie, um eine Flotte von Großkampfschiffen und Kreuzern zu unterhalten oder zu vergrößern. Aber U-Boote... hier liegt eine praktikable Lösung für Griechenlands Marineproblem."
GRE_escorts_for_our_bombers:0	"Eskorten für unsere Bomber"
GRE_escorts_for_our_bombers_desc:0	"Es reicht nicht aus, dass wir Bomber produzieren, denn wir brauchen auch Geleitschutz für diese Bomber! Wir können uns nicht darauf verlassen, dass Standardjäger diese Aufgabe erfüllen, also werden wir großartige Jäger entwickeln, die in der Lage sind, unsere Bomber bis zu den Küsten unserer Feinde zu eskortieren."
GRE_defending_our_seas:0	"Die Verteidigung unserer Meere"
GRE_defending_our_seas_desc:0	"Griechenland hat eine sehr große Küste und kontrolliert eine Vielzahl von Inseln - während die Meere einst eine unserer größten Verteidigungsanlagen waren, haben sie heute nur noch wenig Einfluss auf potenzielle Feinde. Wenn unsere Feinde hoffen, unsere Inseln einzunehmen oder an unseren Küsten zu landen, müssen sie zuerst den Beschuss durch unsere Marinebomber überleben!"
GRE_embracing_modern_warfare:0	"Umarmung der modernen Kriegsführung"
GRE_embracing_modern_warfare_desc:0	"Berichte aus Deutschland deuten darauf hin, dass der 'Panzer' auch außerhalb der Unterstützung von Infanteriebataillonen nützlich sein könnte. Stellen Sie sich das vor! Wir haben vielleicht nicht die nötige Industrie dafür, aber es ist ein Risiko, das es wert ist, eingegangen zu werden."
GRE_new_weapons_old_tricks:0	"Neue Waffen, alte Tricks"
GRE_new_weapons_old_tricks_desc:0	"Während des Ersten Weltkriegs hatten wir reichlich Erfahrung mit der Artillerie und der Aufklärung. Die Technologie und die Ausrüstung mögen sich geändert haben, aber die Taktik hat sich nicht geändert. Lassen Sie uns unsere Stärken ausspielen und der Welt zeigen, dass man Griechenland nicht so einfach besiegen kann."
GRE_a_fleet_fit_for_the_aegean:0	"Eine Flotte fit für die Ägäis"
GRE_a_fleet_fit_for_the_aegean_desc:0	"Jeden Tag müssen wir mit ansehen, wie sich italienische Schlachtkreuzer und britische Flugzeugträger über unsere Meere bewegen. Das ist erniedrigend! Es ist an der Zeit, dass jemand auf dem Balkan endlich aufsteht und eine Flotte ausschifft, auf die wir alle stolz sein können."
GRE_disrupting_the_great_powers:0	"Die Großmächte stören"
GRE_disrupting_the_great_powers_desc:0	"Es ist nicht unsere Aufgabe, gegen die Großmächte der Welt anzutreten, wenn sie sich auf den Feldern und Meeren miteinander duellieren. Stattdessen werden wir sie dort treffen, wo es wirklich weh tut - an ihren Versorgungslinien!"
GRE_fund_the_hellenic_air_force_academy:0	"Finanzieren Sie die Griechische Luftwaffenakademie"
GRE_fund_the_hellenic_air_force_academy_desc:0	"Unsere Piloten sind willig, fähig und kompetent - es ist an der Zeit, dass wir ihnen endlich den Respekt zollen, der ihnen gebührt. Wir werden damit beginnen, die Luftwaffenakademie wieder voll zu finanzieren und die Produktion von Kampfflugzeugen ordentlich hochzufahren, damit unsere Luftwaffe Griechenland wirklich etwas wert ist."
GRE_hellenic_armoured_corp:0	"Hellenic Armored Corp"
GRE_hellenic_armoured_corp_desc:0	"Die Gründung unserer eigenen Panzerdivision wird der Welt zeigen, wie modern wir sind! Kein Hinterland würde Panzer in seiner Armee haben, oder?"
GRE_greek_mechanisation:0	"Griechische Mechanisierung"
GRE_greek_mechanisation_desc:0	"Die Modernisierung war schon ein schmerzhafter Prozess, aber die Mechanisierung unserer Armee könnte wirklich das Pferd von hinten aufzäumen! Der Preis des Fortschritts ist hoch, aber wir werden nicht davor zurückschrecken. Die Sicherheit unserer Nation hat Vorrang vor allem anderen."
GRE_the_cannon:0	"Die Kanone"
GRE_the_cannon_desc:0	"Die Welt wird das Dröhnen unserer Kanonen vom anderen Ende der Welt aus hören!"
GRE_the_torpedo:0	"Der Torpedo"
GRE_the_torpedo_desc:0	"Vielleicht wird uns eine der vielen Besatzungen, die wir in ein wässriges Grab unter den Meeren schicken, endlich nach Atlantis führen! Oder vielleicht begnügen wir uns damit, die Hauptstadt unseres Feindes in die nächste verlorene und versunkene Stadt zu verwandeln..."
GRE_a_land_of_mountains:0	"Ein Land der Berge"
GRE_a_land_of_mountains_desc:0	"Unsere natürliche Geographie bietet uns viele natürliche Verteidigungsmöglichkeiten gegen Eindringlinge, wir müssen nur lernen, die Vorteile unseres eigenen Terrains zu nutzen! In diesem Punkt können wir sicherlich etwas von den Schweizern lernen."
GRE_mountain_training_effect:0	"Ermöglicht §HMountain Warfare Training§!\n§HInfantry\n Mountains§!\n Defense: §G+5%§!\n Bewegung: §G+5%§!\n§HMarines\n Berge§!\n Angriff: §G+5%§!\n Bewegung: §G+10%§!\n§HMBergsteiger\n Gebirge§!\n Angriff: §G+5%§!\n Verteidigung: §G+5%§!\n Bewegung: §G+10%§!\n§HParatroopers\n Berge§!\n Angriff: §G+5%§!\n Bewegung: §G+10%§!\n"
GRE_a_long_and_proud_tradition:0	"Eine lange und stolze Tradition"
GRE_a_long_and_proud_tradition_desc:0	"Unsere Marine ist eines der wenigen Dinge, auf die Griechenland selbst in seinen dunkelsten Stunden immer stolz war. Was wir heute tun, ist lediglich die Fortführung einer langen und stolzen Tradition."
GRE_the_double_headed_aquila:0	"Die doppelköpfige Aquila"
GRE_the_double_headed_aquila_desc:0	"Wir werden die doppelköpfige Aquila mit jedem Flugzeug fliegen, das sich in die Lüfte erhebt und Feuer auf unsere Feinde regnen lässt! Die Welt wird sehen, wie weit unsere Flügel reichen können..."
GRE_modern_cataphracts:0	"Moderne Kataphrakten"
GRE_modern_cataphracts_desc:0	"Die Kataphrakten waren einst der Neid der mittelalterlichen Welt! Ihre Schnelligkeit, ihre Rüstung und ihre Stärke wurden von allen bewundert! Der Kataphrakt von heute ist zweifellos der Panzer, und wir werden eine Panzerklasse erschaffen, die dem Erbe des byzantinischen Kataphrakts wahrlich würdig ist."
GRE_thema_nautikon:0	"Thema Nautikon"
GRE_thema_nautikon_desc:0	"Byzanz beherrschte einst die Wellen, aber auch in den Jahrhunderten seit dem Untergang von Byzanz hat das griechische Volk seinen Geist der Seefahrt nie verloren! Wenn es um Kriegsschauplätze geht, sind uns die Meere so vertraut wie das Pindusgebirge!"
GRE_the_macedonian_farmlands:	"Das reiche mazedonische Ackerland"
GRE_the_macedonian_farmlands_desc:	"Das Hauptexportgut von [731.GetName] sind seine landwirtschaftlichen Produkte. Im Gegensatz zu vielen anderen Teilen unseres Landes eignet sich die Region hervorragend für den Ackerbau, und wir müssen uns darauf konzentrieren, um die Zukunft unseres Landes so großartig wie möglich zu gestalten."
GRE_reorganize_the_royal_guard:	"Reorganisieren Sie die Königliche Garde"
GRE_reorganize_the_royal_guard_desc:	"Die Königliche Garde oder, wie sie früher genannt wurde, die Kompanie der Präsidentengarde, wurde 1868 per königlichem Erlass gegründet. Die Agema-Eskorteinheit bestand aus einem Stab, zwei Evzone-Infanteriekompanien und einer Kavalleriekompanie. Wir müssen die Einheiten reorganisieren und sie wieder auf dem Schlachtfeld einsetzen."
GRE_utilize_british_capital:	"Nutzen Sie das britische Kapital"
GRE_utilize_british_capital_desc:	"Es ist klar, dass die Briten mehr als bereit sind, uns zu helfen, da unser König ein treuer Verbündeter ihrer Sache ist. Wir sollten uns diese Tatsache zunutze machen, indem wir ihre Investoren bitten, uns beim Wiederaufbau dessen zu helfen, was während des Bürgerkriegs verloren ging."
TUR_the_montreux_convention:0	"Das Montreux-Abkommen"
TUR_the_montreux_convention_desc:0	"Es ist ungeheuerlich, dass man uns trotz allem, was seit dem Großen Krieg geschehen ist, immer noch das Recht verweigert, unsere eigenen Meerengen zu verwalten. Anstatt die Meerengen einseitig durch unser Militär zu besetzen, sollten wir stattdessen ein geschickteres diplomatisches Manöver versuchen, damit wir aus dieser Krise herauskommen, ohne zum neuen Paria Europas zu werden."
TUR_the_montreux_convention_tt:0	"Wir werden eine Konvention§! einberufen, in der wir unsere Absicht ankündigen, die YDardanellen§! und die Straße des Bosporus§! zu remilitarisieren. Wir sollten auf eine mögliche Gegenreaktion der §YSowjetunion§! vorbereitet sein."
TUR_fully_integrate_the_is_bank:0	"Vollständige Integration der İş Bank"
TUR_fully_integrate_the_is_bank_desc:0	"Celâl Bayar und eine Gruppe gleichgesinnter Liberaler und Befürworter der Demokratie haben sich an die Institution der İş Bank gebunden, die Atatürk 1924 gegründet hat. Indem wir die İş-Bank und die an sie geketteten Liberalen integrieren, können wir unserer Nation und der ganzen Welt signalisieren, dass die Türkei endlich bereit ist, die nächsten zaghaften Schritte auf dem Weg zu einer vollwertigen Demokratie zu gehen."
TUR_sanayiciler_liberals_tt:0	"\nDie §YSanayiciler Industrieprojekte§! Entscheidungen werden aufgrund unseres liberalen Wirtschaftsmodells billiger sein."
TUR_ratify_the_six_arrows:0	"Ratifizieren Sie die Sechs Pfeile"
TUR_ratify_the_six_arrows_desc:0	"Die Sechs Pfeile symbolisieren die sechs Grundpfeiler des Kemalismus und die Ratifizierung dieser Prinzipien in der türkischen Verfassung wird uns bei unserer Mission, die kemalistischen Werte in der gesamten Türkei zu verankern, sicherlich sehr helfen."
TUR_privatize_the_anadolu_agency:0	"Privatisieren Sie die Anadolu Agentur"
TUR_privatize_the_anadolu_agency_desc:0	"Die Pressefreiheit ist eine Notwendigkeit in einer echten Demokratie, und auch wenn wir freie Medien nicht lieben, müssen wir lernen, mit ihnen umzugehen. Wir können einen großen Schritt in diese Richtung machen, indem wir die staatliche Anadolu-Agentur privatisieren, die seit der Gründung durch Atatürk im Jahr 1920 die Nachrichten in der gesamten Türkei verbreitet."
TUR_privatize_the_anadolu_agency_tt:0	"Hebt die Entscheidung des §YInstituts für Pressezensur§! auf."
TUR_lift_the_ban_on_other_political_parties:0	"Hebt das Verbot anderer politischer Parteien auf"
TUR_lift_the_ban_on_other_political_parties_desc:0	"Jedes Mal, wenn eine neue politische Partei gegründet wurde, um der CHP Konkurrenz zu machen, wurde sie von religiösen Fundamentalisten gekapert, die unsere Republik und ihre Gründungsprinzipien für ihre eigenen Zwecke pervertieren wollten. Diesmal muss es anders sein - und dennoch müssen wir wachsam bleiben."
TUR_holding_our_first_multi_party_election:0	"Halten Sie unsere ersten Mehrparteienwahlen ab"
TUR_holding_our_first_multi_party_election_desc:0	"Das Schicksal der türkischen Republik hängt von den bevorstehenden Wahlen ab: Wir haben geschworen, fair zu kämpfen, und wir haben fair gekämpft. Das türkische Volk kann darauf vertrauen, dass es die richtige Entscheidung trifft."
TUR_official_opposition_party_organised:0	"Es wurde eine offizielle Oppositionspartei gegründet."
TUR_democratic_transition_focus:1	"[Root.GetDemocraticTransitionFocusName]"
TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_STANDARD:0	"Die Verwirklichung von Atatürks Traum"
TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_ISLAMIST:0	"Die Milletin Adamı"
TUR_democratic_transition_focus_desc:1	"[Root.GetDemocraticTransitionFocusDesc]"
TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_STANDARD:0	"Mustafa Kemal Atatürk träumte lange davon, dass [ROOT.GetNameDef] eines Tages eine voll funktionierende Demokratie werden würde, und es scheint, dass wir diesen Traum erfolgreich erfüllt haben."
TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_ISLAMIST:0	"Adnan Menderes, der auf der Grundlage demokratischer Rechte eine offenkundig islamistische Politik verfolgt, ist zum Mann der Nation geworden. [ROOT.GetNameDefCap] erlebt eine konservative Revolution, und die Welt kann nur bestürzt zuschauen."
TUR_expanding_our_armaments:0	"Unsere Bewaffnung ausbauen"
TUR_expanding_our_armaments_desc:0	"Die Welt verändert sich, und wir tragen die Verantwortung, zu den Waffen zu greifen gegen diejenigen, die nicht nur die Republik Türkei bedrohen, sondern auch die ideologischen Grundlagen, auf denen sie steht. Es sollte nicht viel nötig sein, um die Sanayiciler davon zu überzeugen und ihre Hilfe beim Schutz unseres Landes zu sichern."
TUR_permit_regional_elections:0	"Erlauben Sie Regionalwahlen"
TUR_permit_regional_elections_desc:0	"Die Türkei ist ein großes Land mit vielen Religionen, Kulturen und Interessen - vielleicht würden wir die Grenzen der Verfassung nicht zu sehr strapazieren, wenn wir ein gewisses Maß an Autonomie im ganzen Land zulassen würden, selbst für diejenigen, die sich am stärksten gegen den Kemalismus gewehrt haben... alles natürlich im Namen der nationalen Sicherheit."
TUR_unlock_reconciliation_occupation_law_tt:0	"Schaltet das Besatzungsrecht frei: §YVersöhnung§!."
TUR_truce_with_government_called_flag:0	"Es wurde ein Waffenstillstand mit der Regierung vereinbart."
TUR_privatize_our_infrastructure:0	"Privatisieren Sie unsere Infrastruktur"
TUR_privatize_our_infrastructure_desc:0	"Als überzeugte Liberale sollten wir lernen, uns mehr auf die Privatwirtschaft zu verlassen, anstatt den Staat in jede einzelne Bauangelegenheit eingreifen zu lassen. Wenn es eine Nachfrage nach mehr Infrastruktur in der Provinz gibt, dann wird der Markt diese Nachfrage befriedigen!"
TUR_democratic_capstone_focus:1	"[Root.GetDemocraticCapstoneFocusName]"
TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_STANDARD:0	"Der Blick nach außen"
TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_ISLAMIST:0	"Säubern Sie die Offiziere"
TUR_democratic_capstone_focus_desc:1	"[Root.GetDemocraticCapstoneFocusDesc]"
TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_STANDARD:0	"Eine verantwortungsvolle demokratische Macht zu sein, bringt mehr Verantwortung mit sich, als nur die Freiheiten der eigenen Bürger zu garantieren. Die Welt ist gefährlich, und die Demokratien auf der ganzen Welt werden von finsteren Kräften angegriffen. Wir haben die Pflicht, für die Freiheit einzutreten."
TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_ISLAMIST:0	"Wir können erst dann effektiv regieren, wenn wir den kemalistischen Abschaum aus allen Staatsorganen vertrieben haben. Wir können nicht einmal unseren eigenen Streitkräften vertrauen, dass sie der rechtmäßig gewählten Regierung gegenüber loyal sind! Das muss sich ändern."
TUR_civil_war_tt:0	"§A Die Entfernung der Kemalisten aus unseren Streitkräften wird einen Bürgerkrieg auslösen. Wie stark unsere Ausgangsposition sein wird, hängt davon ab, wie stark die Islamisten im Mittelland sind und ob wir unsere Streitkräfte reformiert haben oder nicht. Kurdistan wird sich abspalten und für seine Freiheit kämpfen, wenn die Stabilität unter 60 % liegt, wenn dieser Schwerpunkt abgeschlossen ist.§!"
TUR_the_sanayiciler:0	"Der Sanayiciler"
TUR_the_sanayiciler_desc:0	"Atatürk hat im Laufe der Jahre unermüdlich daran gearbeitet, eine Klasse von Unternehmern und Industriellen heranzuziehen, die bei der Modernisierung unseres Staates helfen. Es ist an der Zeit, mit dem Kultivieren aufzuhören und mit dem Ernten zu beginnen - wir werden gemeinsam daran arbeiten, die Türkei zu einer wettbewerbsfähigen regionalen Macht zu machen."
TUR_sanayiciler_tt:0	"Mit Hilfe von §YPolitischer Macht§! und anderen uns zur Verfügung stehenden Mitteln werden wir in der Lage sein, unsere aufstrebende Industrieklasse zu befähigen, ihre Ressourcen in die Errichtung von §YZivilen Fabriken§! und §YMilitärischen Fabriken§! für den Staat zu investieren.\n"
TUR_cooperate_with_the_debt_council:0	"Mit dem Schuldenrat kooperieren"
TUR_cooperate_with_the_debt_council_desc:1	"Als sich der Staub nach dem Großen Krieg gelegt hatte, blieb die Republik Türkei bestehen: eine freie und unabhängige Nation. Nun, bis auf die Tatsache, dass [TUR.GetNameDef] die obszönen Schulden geerbt hat, die das Osmanische Reich angehäuft hat, und die Tatsache, dass dieselben Schulden im Ausland von unseren Möchtegern-Eroberern verwaltet werden. Es ist nicht ideal, aber wir können zusammenarbeiten und ein Szenario erfinden, das uns allen nützt."
TUR_debt_council_nationalized_tt:0	"Der §YSchuldenrat§! wird nicht länger die Kontrolle über die Schulden von §Y[TUR.GetNameDef]§! behalten."
TUR_utilize_foreign_capital:0	"Nutzen Sie ausländisches Kapital"
TUR_utilize_foreign_capital_desc:0	"Unsere Nation ist jung und ein großer Teil unseres Landes ist ohne Industrie, aber wir müssen in dieser Angelegenheit nicht allein arbeiten. Eine starke Türkei liegt im Interesse vieler europäischer Mächte, und wenn wir sie um Hilfe bitten, werden sie uns diese sicherlich gewähren."
TUR_foreign_capital_tt:0	"Je besser unsere Beziehungen zu den alten §YGroßmächten Europas§! und den §YUSA§! sind, desto mehr Möglichkeiten für §YInvestitionen§! werden wir uns leisten können."
TUR_treaty_of_saadabad:0	"Vertrag von Saadabad"
TUR_treaty_of_saadabad_desc:0	"Wir haben nichts zu verlieren und alles zu gewinnen, wenn wir mit unseren Nachbarn im Osten freundlich bleiben. Die Idee eines Vertrages, der unsere Freundschaft formalisiert, wurde gelegentlich geäußert, und es ist höchste Zeit für die Türkei, die Initiative zu ergreifen und dafür zu sorgen, dass diese Freundschaft in einem Vertrag festgeschrieben wird."
TUR_assess_our_future:0	"Beurteilen Sie unsere Zukunft"
TUR_assess_our_future_desc:0	"Als Mustafa Kemal Atatürk diese Nation befreite und ihre Unabhängigkeit erklärte, tat er dies mit einer sehr spezifischen Vision davon, wie der [ROOT.GetAdjective] Staat schließlich aussehen sollte. Es ist an der Zeit zu analysieren, ob die Vision unseres Ghazi noch mit den Prioritäten der derzeitigen Regierung übereinstimmt."
TUR_choices_will_decide_legacy_tt:0	"§Mustafa Kemal Atatürk§! hat sich seit langem für den Übergang _[ROOT.GetNameDef]§! von einem autoritären Einparteienstaat zu einer liberalen Mehrparteiendemokratie eingesetzt. Unsere Entscheidungen, wohin wir die ideologische Richtung unserer Nation lenken, werden widerspiegeln, wie gut wir als den Idealen von §YAtatürk§! gerecht werdend wahrgenommen werden."
TUR_ataturk_seeking_treatment:0	"Atatürk in medizinischer Behandlung"
TUR_the_hatay_issue:0	"Die Hatay-Frage"
TUR_the_hatay_issue_desc:0	"Wir können nicht länger tatenlos zusehen, wie die türkischen Minderheiten von arabischen Irredentisten und französischen Imperialisten unterdrückt werden. Die Behauptung, dass Hatay nicht in jeder Hinsicht ein rechtmäßiger Teil der Türkei ist, ist lächerlich und sollte als Revisionismus abgetan werden. Es ist an der Zeit, die Fehler von 1921 zu korrigieren."
TUR_peace_in_the_world:0	"Frieden in der Welt"
TUR_peace_in_the_world_desc:0	"Atatürk verkündete einst den Frieden in der Welt als das ultimative Ziel der türkischen Außenpolitik, und wir haben die Absicht, diesem hehren Ziel gerecht zu werden. Wir arbeiten für den Frieden auf der Erde und nicht für den ewigen Krieg wegen kleinlicher Landstreitigkeiten."
TUR_continue_the_policy_of_etatism:0	"Die Politik des Etatismus fortsetzen"
TUR_continue_the_policy_of_etatism_desc:0	"İsmet İnönü und eine Gruppe linker Ministerkollegen sind dafür, unsere Wirtschaftspolitik weg vom Laissez-faire-Liberalismus und hin zu einer einzigartig türkischen staatlich gelenkten Wirtschaft zu lenken. Der Etatismus stellt, wie der Kemalismus, die perfekte Verschmelzung von linken und rechten Ideologien zu etwas noch Größerem dar, das dem türkischen Volk am besten dient."
TUR_sanayiciler_etatism_tt:0	"\nDie Entscheidungen für die §YSanayiciler Industrieprojekte§! werden aufgrund unseres etatistischen Wirtschaftsmodells teurer sein."
TUR_peace_at_home:0	"Frieden zu Hause"
TUR_peace_at_home_desc:0	"Unsere potenziellen Feinde werden sich auf uns stürzen, sobald sie Schwäche in uns wittern. Es ist die vorrangige Verantwortung aller türkischen Regierungen, das Wohlergehen und die innere Stabilität des Staates zu sichern. Wenn wir zu Hause Frieden haben, können wir nach Frieden in der Welt streben."
TUR_turkish_state_railways:0	"Türkische Staatseisenbahnen"
TUR_turkish_state_railways_desc:0	"Ohne das Eingreifen des Staates wird unser Land auf Dauer eine unzusammenhängende Nation mit reichen und städtischen Städten im Westen und dezentralisierten Stämmen im Osten bleiben. Indem wir unsere Nation mit Infrastrukturen verbinden, bringen wir die gesamte Türkei ins zwanzigste Jahrhundert, nicht nur unsere wohlhabenden Küstenstädte an der Ägäis."
TUR_revive_turkish_revolutionism:0	"Den türkischen Revolutionismus wiederbeleben"
TUR_revive_turkish_revolutionism_desc:1	"Die Reform des türkischen politischen Systems hat sich angesichts des breiten Widerstands des türkischen Volkes eindeutig als untauglich erwiesen. Aber besteht die Lösung darin, die Massen zu beschwichtigen oder die Radikalität unserer Reformen zu verdoppeln? Der Kemalismus hat sich schon einmal im Kern verändert: Wer kann schon sagen, wohin die nächste Umgestaltung seiner ideologischen Komponenten ihn in Zukunft führen wird?"
TUR_reinvigorate_turkish_nationalism:0	"Den türkischen Nationalismus wiederbeleben"
TUR_reinvigorate_turkish_nationalism_desc:0	"Der einzige Weg, das Land zu vereinen, ist die Nachahmung der Herrschaft Mussolinis. Wir brauchen einen starken rechten Führer, der nicht gegen linke Wirtschaftsreformen ist und der das Herz des Volkes ansprechen kann. Es gibt nur einen Mann für diese Aufgabe: den geschätzten Marschall Fevzi Çakmak."
TUR_the_second_five_year_plan:0	"Der zweite Fünfjahresplan"
TUR_the_second_five_year_plan_desc:0	"Der erste Fünfjahresplan war ein großer Erfolg, so dass die besten Minister des Landes zusammenkamen und beschlossen, wenn der erste Fünfjahresplan ein solcher Erfolg war, warum dann nicht noch einen zweiten?"
TUR_the_guardians_of_kemalism:0	"Die Wächter des Kemalismus"
TUR_the_guardians_of_kemalism_desc:0	"Das kemalistische Offizierskorps kann bei der Verbreitung der kemalistischen Ideale im ganzen Land nur wenig ausrichten. Es ist an der Zeit, dass die Regierung einen proaktiveren Ansatz verfolgt, um dem Kemalismus zu helfen, die Herzen und Köpfe der türkischen Bevölkerung zu gewinnen."
TUR_kemalist_state_targets_tt:0	"Zwei bündnisfreie Staaten werden kemalistisch§!\n"
TUR_the_sun_language_theory:0	"Die Theorie der Sonnensprache"
TUR_the_sun_language_theory_desc:0	"Die Sonnensprachentheorie ist die Theorie, dass alle menschlichen Sprachen von der gleichen türkischen Wurzelsprache abstammen. Die Theorie ist offensichtlich völlig logisch und es ist zwingend notwendig, dass wir die Theorie offiziell unterstützen und im ganzen Land unterrichten."
TUR_variant_turkish_tax_focus:1	"[Root.GetTurkishVariantTaxName]"
TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_STANDARD:0	"Varlık Vergisi"
TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_SECULAR:0	"İnanç Vergisi"
TUR_variant_turkish_tax_focus_desc:1	"[Root.GetTurkishVariantTaxDesc]"
TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_STANDARD:0	"Wir werden eine 'Vermögenssteuer' auf Nicht-Muslime in unserem Land erheben, damit wir unsere Industrieprojekte besser finanzieren und uns bei der Mission der Säkularisierung unterstützen können [ROOT.GetNameDef]."
TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_SECULAR:0	"Religiöse Institutionen haben es in diesem Land schon viel zu lange viel zu gut gehabt. Immer wieder haben die religiösen Autoritäten versucht, diese Regierung und ihre Bemühungen zu untergraben. Deshalb werden wir sie jetzt von ihrem Reichtum befreien, damit er besser genutzt werden kann."
TUR_turk_ulusu:0	"Türk Ulusu"
TUR_turk_ulusu_desc:0	"Zu einem verantwortungsvollen und modernen Land gehört auch, dass man neu definieren kann, was es bedeutet, Bürger dieses Landes zu sein. Wir haben zu streng definiert, was es bedeutet, Türke zu sein. Um die Zusammensetzung unseres Landes angemessen zu repräsentieren, ist es höchste Zeit, dass wir die Definition dessen, was einen Bürger zum Türken macht, erweitern."
TUR_loosen_the_laws_on_secularism:0	"Lockern Sie die Gesetze zum Laizismus"
TUR_loosen_the_laws_on_secularism_desc:0	"Die Religion war der größte Spaltpilz für unsere Nation: Wir haben uns für einen Weg des Laizismus entschieden, aber warum? Um die schwachen Nationen des Westens zu imitieren? Es ist nicht Sache des Staates, zu entscheiden, wann, wo und wie ein Mensch zu seinem Gott betet."
TUR_purify_the_diyanet:0	"Reinigen Sie das Diyanet"
TUR_purify_the_diyanet_desc:0	"Das Diyanet ist voll von Männern, die in ihrem leeren, hohlen Leben noch nie zum Allmächtigen gebetet haben. Die Diyanet sollte mit gläubigen Männern gefüllt werden: Männer, die sich in den Dienst des Staates stellen und sich an Allah wenden, um Führung und Trost zu finden!"
TUR_kemalist_officers_made_hostile_tt:0	"§Die kemalistischen Offiziere werden das Vorgehen der Regierung scharf kritisieren."
TUR_rehabilitate_the_kadro_movement:0	"Rehabilitierung der Kadro-Bewegung"
TUR_rehabilitate_the_kadro_movement_desc:0	"Es war ein Fehler, Kadro zu schließen und seine Theoretiker zu vertreiben. Sie sind mit frischen und revolutionären Ideen an den Staat herangetreten und wir haben ihnen den Rücken gekehrt. Eine neue Art von Nation erfordert neue Ideen, und außerhalb von Kadro gibt es keine mutigeren Ideen!"
TUR_kemalism_and_the_modern_movement:0	"Der Kemalismus und die moderne Bewegung"
TUR_kemalism_and_the_modern_movement_desc:0	"Als Recep Peker aus Italien mit einem Bericht darüber zurückkehrte, wie der Faschismus mit dem Kemalismus in Einklang gebracht werden könnte, wurde er aus seinem Büro geworfen. Der Faschismus ist das Glaubensbekenntnis des zwanzigsten Jahrhunderts, und wir waren dumm, an der Ideologie vorbeizuschauen, die für die Türkei am besten geeignet war, als sie uns von der anderen Seite der Adria anstarrte!"
TUR_kemalism_and_the_modern_movement_tt:0	"Alle §Yfaschistischen§! Länder in §YEuropa§! werden ihre Meinung über [ROOT.GetNameDef] um §G+25§! erhöhen."
TUR_integrate_the_fascist_council:0	"Integrieren Sie den Faschistischen Rat"
TUR_integrate_the_fascist_council_desc:0	"Der beratende Faschistische Rat von Recep Peker hat lange genug am Rande des Staates existiert, es ist an der Zeit, die Integration der türkischen faschistischen Werte in den Rahmen des Kemalismus zu beginnen."
TUR_restack_the_officer_corps:0	"Das Offizierskorps neu aufstellen"
TUR_restack_the_officer_corps_desc:0	"Das Offizierskorps hält die zentralen Werte der Türkei hoch, aber diese zentralen Werte haben sich... verändert. Wenn die Offiziere nicht bereit sind, die aktuellen Werte der kemalistischen Ideologie widerzuspiegeln, dann werden wir sie zwingen, diese Werte zu verkörpern."
TUR_restack_the_officer_corps_tt:0	"Das §YKemalistische Offizierskorps§! wird umorganisiert, um den Wünschen der Regierung besser zu entsprechen. \n§Wenn das Land zu weniger als 50% stabil ist und die kemalistischen Offiziere stark gestärkt wurden, kann man davon ausgehen, dass sie sich gegen die Regierung auflehnen werden!§!"
TUR_form_the_redshirts:0	"Bilden Sie die Rothemden"
TUR_form_the_redshirts_desc:0	"Jede legitime faschistische Bewegung auf der Welt hat eine Bewegung der Rothemden! Die Engländer und Italiener haben schwarze Hemden, die Deutschen haben braune Hemden, die Chinesen haben blaue Hemden - die Farbe Rot spiegelt die Republik Türkei am besten wider, also werden wir die Rothemden bilden! Wenn die Menschen den Begriff 'Rothemden' hören, werden sie sofort an die Männer und Frauen denken, die unsere Bewegung unterstützen! Wir sind Genies!"
TUR_fatherland_first:0	"Vaterland zuerst!"
TUR_fatherland_first_desc:0	"Es gibt viele Elemente der türkischen Gesellschaft, die die Regierung untergraben und unsere Gesellschaft aus eigennützigen Gründen destabilisieren wollen. Damit ist jetzt Schluss: Von nun an wird jeder Bürger der Türkei sein Vaterland an die erste Stelle setzen!"
TUR_fatherland_first_tt:1	"Wir werden einen landesweiten Appell an die Fraktion_Tür_Traditionalisten§!, die Fraktion_Tür_Kurden§! und die anderen Unterdrückten unserer Nation richten, sich zu vereinen und hinter einer Regierung zu stehen, die sie alle vertritt."
TUR_deal_for_the_oniki_islands:0	"Deal für die Oniki-Inseln"
TUR_deal_for_the_oniki_islands_desc:0	"Die Oniki-Inseln vor unserer Küste wurden uns aus den Händen gerissen und an die lüsternen Italiener weitergereicht, aber nicht bevor die perfiden Griechen ihren Anspruch auf die Inseln erhoben. Rhodos war türkisch, und Rhodos wird wieder türkisch sein!"
TUR_the_pontic_redoubt:0	"Die pontische Redoute"
TUR_the_pontic_redoubt_desc:0	"Wir haben uns viel zu lange um unsere westlichen Verteidigungsanlagen gekümmert und dabei unsere Grenze zu den offen irredentistischen [SOV.GetNameDef] ignoriert! Wir können nicht darauf hoffen, dass wir sie an unserer Grenze allein lange aufhalten können, aber indem wir eine Schanze entlang unserer Flusslinien befestigen, können wir hoffen, sie in einem Zermürbungskrieg zu schlagen. Welche andere Hoffnung haben wir?"
TUR_pontic_redoubt_trabzon_tt:0	"Fügt §Y7 Landforts§! entlang des Çoruh-Flusses in der Nähe der [SOV.GetAdjective]-Grenze hinzu.\n"
TUR_pontic_redoubt_van_tt:0	"Fügt §Y6 Landfestungen§! entlang des Flusses Kars in der Nähe der [SOV.GetAdjective] Grenze hinzu.\n"
TUR_pontic_redoubt_erzurum_tt:0	"Hinzufügung von §Y3 Landfestungen§! in der Stadt Erzurum.\n"
TUR_abuse_the_office_of_soil_products:0	"Missbraucht das Amt für Bodenprodukte"
TUR_abuse_the_office_of_soil_products_desc:0	"Die Toprak Mahsulleri Ofisi wurde gegründet, um die Produktion von Nahrungsmitteln und die Löhne der Landarbeiter zu regulieren, aber [ROOT.GetNameDef] braucht keine Landwirte - es braucht Land. Wir werden die schlecht wirtschaftenden Farmbesitzer unter Druck setzen, ihr Land zu verkaufen, damit auf diesen Grundstücken neue Industrie zum Nutzen der gesamten Nation errichtet werden kann."
TUR_kemalist_socialist_theory:0	"Kemalistische sozialistische Theorie"
TUR_kemalist_socialist_theory_desc:0	"Die Kadro-Bewegung steht für eine grundlegend patriotische Form des Sozialismus und ist dem britischen Faschismus und Marxismus-Leninismus in vielerlei Hinsicht sehr ähnlich. Die Kadro-Bewegung stellt den türkischen Arbeiter grundsätzlich an die erste Stelle und versucht dabei nicht, seine nationale Identität zu zerstören. Wir sind eine wahrhaft revolutionäre Bewegung, und was noch wichtiger ist: es ist eine wahrhaft türkische Bewegung."
TUR_patriotism_over_internationalism:0	"Patriotismus statt Internationalismus"
TUR_patriotism_over_internationalism_desc:0	"Wir lehnen den Internationalismus des Trotzkismus und des radikalen Marxismus ab und bevorzugen eine wahrhaft nationale Form des Sozialismus. Die Notlage des internationalen Arbeiters ist zweitrangig gegenüber den Kämpfen des türkischen Arbeiters, und das unterscheidet den kemalistischen Sozialismus von den radikaleren Varianten des Kommunismus."
TUR_create_the_turkish_workers_militia:0	"Schaffen Sie die türkische Arbeitermiliz"
TUR_create_the_turkish_workers_militia_desc:0	"Politik ist ein schmutziges Geschäft, und kein Regime hat eine Garantie auf Dauer. Es ist wichtig, dass wir die Arbeiter bewaffnen und sie mit den Mitteln und dem Willen ausstatten, ihre Rechte gegen jeden zu verteidigen, der sie ihnen wegnehmen will: sei es eine ausländische Macht oder eine aufstrebende neue politische Bewegung innerhalb unserer eigenen Grenzen."
TUR_halk_ve_devlet:0	"Halk ve Devlet"
TUR_halk_ve_devlet_desc:0	"'Volk und Staat' - hier liegt die Priorität unserer kemalistisch-sozialistischen Regierung. Wir müssen unser Volk schützen und bewahren, und das können wir am besten tun, indem wir die Befugnisse des Staates in allen Angelegenheiten stärken."
TUR_nationalise_all_private_industry:0	"Verstaatlichung der gesamten Privatindustrie"
TUR_nationalise_all_private_industry_desc:0	"Wir verkennen nicht den Beitrag von Industriellen und Liberalen in unserem gemeinsamen Kampf zum Schutz des türkischen Staates vor räuberischen ausländischen Mächten, aber sie sind zu groß für ihre eigenen Hosen geworden. Während sie uns vor räuberischen Risikokapitalgebern schützten, sind sie selbst zu räuberischen Risikokapitalgebern geworden. Das kann nicht länger hingenommen werden: Wir müssen unsere Industrie verstaatlichen und unsere Arbeiter schützen."
TUR_georgian_manganese_extraction:0	"Mangangewinnung in Georgien"
TUR_georgian_manganese_extraction_desc:1	"Es gibt viele Mineralien und Metalle, die in Georgien ungenutzt bleiben, und das alles, während unsere eigenen Stahlvorräte enttäuschend niedrig bleiben. Wir werden der regionalen georgischen Verwaltung ein Angebot unterbreiten und unsere Rechte zur Förderung ihrer Metalle gegen einen Teil der Überschüsse für uns eintauschen. Sollten sie zustimmen, werden wir den Stahl direkt neben dem Betrieb in Trabzon herstellen."
TUR_salt_the_scars_of_the_great_war:0	"Die Narben des Großen Krieges salzen"
TUR_salt_the_scars_of_the_great_war_desc:0	"Das türkische Volk ist in den Jahren seit dem Unabhängigkeitskrieg weich geworden. Wo ist die Wut, die wir so dringend brauchen, wenn wir unsere Macht in die Welt tragen wollen? Wir haben im Ersten Weltkrieg so viel verloren, mehr als die meisten anderen, und wir haben nur deshalb überlebt, weil wir uns das Recht zu überleben mit Händen und Füßen erkämpft haben. Wir werden auch im nächsten Krieg mit Zähnen und Klauen kämpfen."
TUR_intervene_in_the_spanish_civil_war:0	"Intervenieren Sie in den Spanischen Bürgerkrieg"
TUR_intervene_in_the_spanish_civil_war_desc:0	"Der Spanische Bürgerkrieg hat sich zu einer weltweiten Petrischale für konkurrierende Ideologien entwickelt. Wir teilen das Mittelmeer, und das gibt uns mehr Recht als den meisten anderen, für die von uns gewählte Seite in den Krieg einzugreifen."
TUR_a_common_destiny_for_all_of_turkey:0	"Ein gemeinsames Schicksal für die gesamte Türkei"
TUR_a_common_destiny_for_all_of_turkey_desc:0	"Türken, Griechen, Kurden, Christen, Muslime, Atheisten - wir sitzen alle im selben Boot. Es liegt in unserem kollektiven Interesse, als Ganzes zusammenzukommen und uns hinter einer starken Regierung zu vereinen, die radikale Ideen unterstützt und für das Kollektiv als Ganzes arbeitet. Wir werden geeint stehen, oder wir werden geteilt untergehen."
TUR_hunt_down_fifth_columnist_islamists:0	"Jagen Sie die Islamisten der Fünften Kolonne"
TUR_hunt_down_fifth_columnist_islamists_desc:0	"Während Europa sich über seine internationalistischen kommunistischen Fünften Kolonnen aufregt, haben wir seit der Geburt unserer Nation mit unseren eigenen internationalistischen Fünften Kolonnen zu kämpfen. Es gibt keine größere existenzielle Bedrohung für unsere große Republik als den radikalen Islam und seine antiquierten Vertreter. Wir werden diesen Abschaum des Osmanischen Reiches wie die Insekten zerquetschen, die sie sind."
TUR_pivot_to_the_past:0	"Rückbesinnung auf die Vergangenheit"
TUR_pivot_to_the_past_desc:0	"Der Unabhängigkeitskrieg mag eine Notwendigkeit gewesen sein, aber die Republik war ein Fehler. Atatürk ist nicht mehr da, um seine kostbare säkulare Republik zu schützen, und das Volk schreit nach der Rückkehr des osmanischen Sultanats. Wir werden ihnen den Gefallen tun, nachdem wir die Kemalisten ein für alle Mal beseitigt haben."
TUR_purge_the_kemalists:0	"Säubern Sie die Kemalisten"
TUR_purge_the_kemalists_desc:0	"Indem wir unser Land von der Geißel der Kemalisten befreien, haben wir die Saat für die Rückkehr zu unserer alten Lebens- und Regierungsweise gelegt. Die Rückkehr des Sultans ist unvermeidlich, ebenso wie die Vernichtung der flüchtigen Republikaner."
TUR_kemalists_purged_tt:0	"Entfernt alle £faction_tur_kemalist §YKemalist§! Staatsmodifikatoren."
TUR_restore_the_divan:0	"Wiederherstellung des Diwans"
TUR_restore_the_divan_desc:0	"Ein Parlament aus bürgerlichen Handlangern, das von unseren Feinden gewählt wird? Nein, wir hatten nie die Absicht, dass dies sehr lange andauert. Es ist an der Zeit, zu den alten Traditionen zurückzukehren: Wir werden den Diwan wiederherstellen, damit die Religion im Zentrum des Staates steht. Wir werden auch das aus dem Westen entlehnte Amt des Premierministers abschaffen, es ist höchste Zeit, dass wir einen Großwesir zurückbringen!"
TUR_rebuilding_our_nation:0	"Der Wiederaufbau unserer Nation"
TUR_rebuilding_our_nation_desc:0	"Die Kemalisten haben unsere Nation bei ihren vergeblichen Versuchen, den Willen des Volkes zu unterdrücken, verwüstet. Unsere Feinde werden uns als schwach ansehen, und deshalb müssen wir uns so schnell wie möglich wieder aufbauen!"
TUR_return_of_the_sultan:0	"Die Rückkehr des Sultans"
TUR_return_of_the_sultan_desc:0	"Es ist endlich an der Zeit, das zu verwirklichen, wovon wir schon so lange geträumt haben: Wir müssen den Sultan sofort aus dem Exil zurückholen. Unsere Loyalisten haben ihn bereits in ihrer Gewalt. Jetzt müssen wir ihn nur noch nach Hause bringen und ihm eine große Krönung bereiten."
TUR_reclaim_macedonia:0	"Rückeroberung des Makedonyalı Sanjak"
TUR_reclaim_macedonia_desc:0	"Diese untreuen Hunde in unserem Westen haben eine zentrale Rolle beim Zusammenbruch des letzten Osmanischen Reiches gespielt. Die Griechen sind uns seit dem Moment, in dem wir ihr erbärmliches, kränkliches Reich zerlegt haben, böse - und jetzt halten sie einen Großteil von Thrakien und Madedonien von uns fern. Es ist an der Zeit, unsere Landsleute zu retten und gleichzeitig ein wenig Rache zu üben..."
TUR_join_the_central_powers:0	"Schließen Sie sich den Mittelmächten wieder an"
TUR_join_the_central_powers_desc:0	"Wir sind schon einmal als Pakt der Mächte gescheitert, aber dieses Mal werden wir nicht scheitern! Das Schicksal hat es irgendwie für richtig gehalten, uns allen eine zweite Chance zu geben, die Fehler des Großen Krieges wiedergutzumachen, und wir müssen diese Chance gemeinsam bei den Hörnern packen!"
TUR_press_the_austro_hungarian_claim:0	"Forcieren Sie den österreichisch-ungarischen Anspruch"
TUR_press_the_austro_hungarian_claim_desc:0	"Unsere triumphale Rückkehr aus der Asche der Türkischen Republik war in der Tat ein großartiges Ereignis, aber wir sind von allen Seiten von Feinden umgeben, die uns erneut vernichtet sehen wollen. Wir brauchen Verbündete, und eine von den Osmanen angeführte Expedition in die Donau wäre wohl kaum beispiellos."
TUR_aligning_bulgaria:0	"Verbünden Sie sich mit Bulgarien"
TUR_aligning_bulgaria_desc:0	"Bulgarien ist das einzige Land der Mittelmächte, das seine Souveränität und seine Lebensweise unversehrt bewahrt hat, und was haben sie daraus gemacht? Nichts. Sie sind Feiglinge! Wir werden sehen, wie feige sie sind, wenn wir ihnen im Nacken sitzen und sie zur Rechenschaft ziehen."
TUR_reclaiming_our_lost_empire:0	"Das gefallene Reich zurückerobern"
TUR_reclaiming_our_lost_empire_desc:0	"Die Entmachtung der Kemalisten und die Wiederherstellung der Autorität des Sultans waren nur die ersten Schritte in unserem Masterplan. Wir werden durch die ganze Welt marschieren, bis unser Reich wieder vollständig ist!"
TUR_expanding_the_saadabad_pact:0	"Erweitern Sie den Saadabad-Pakt"
TUR_expanding_the_saadabad_pact_desc:0	"Der Saadabad-Pakt war eine würdige Initiative der Kemalisten, aber wir haben jetzt sicherlich mehr mit den Unterzeichnern gemeinsam als jemals zuvor. Lassen Sie uns keine Zeit mit halben Sachen verschwenden, es ist an der Zeit, auf die Mitglieder des Saadabad-Paktes zuzugehen, damit wir diese Vereinbarung zu einem echten Bündnis formalisieren können."
TUR_saadabad_pact_faction_tt:0	"Wir werden alle Unterzeichner des Saadabad-Paktes§! zu einem formellen Bündnis einladen."
TUR_no_faction_members_tt:0	"Der Saadabad-Pakt hat keine Unterzeichner"
TUR_no_faction_alliance_members_tt:0	"Die Unterzeichner des Saadabad-Paktes haben das Saadabad-Konkordat nicht ratifiziert."
TUR_the_damascus_diktat:0	"Das Damaszener Diktat"
TUR_the_damascus_diktat_desc:1	"[677.Controller.GetNameDefCap] ist schwach. Wir brauchen nur mit einem Krieg zu drohen, wenn sie Syrien nicht aufgeben, und sie werden auf die Knie fallen, um Frieden zu bitten und uns anzuflehen, ihnen Syrien abzunehmen."
TUR_supporting_the_east:0	"Unterstützung für den Osten"
TUR_supporting_the_east_desc:0	"Es sind unsere Staaten im Osten, die das Rückgrat unserer Unterstützung bilden, und doch ist die Qualität der Infrastruktur in diesen Staaten im Vergleich zu den städtischen Provinzen im Westen einfach entsetzlich. Indem wir den Osten unterstützen, helfen wir unseren Gefolgsleuten und bereiten uns auch besser auf Operationen im Osten und Norden vor."
TUR_desert_camel_corps:0	"Kamelkorps in der Wüste"
TUR_desert_camel_corps_desc:0	"Wenn wir uns auf diese beschwerlichen und langwierigen Operationen im Nahen Osten und in Afrika einlassen wollen, dann wäre es einfach absurd, unser Kamelkorps nicht zu reformieren! Auf unseren Kamelen könnten wir bequem und mit Stil von Kairo nach Kapstadt reiten!"
TUR_unlock_camelry_effect_tt:0	"Technologie hinzufügen: §YCamelry Units§!."
TUR_the_pan_national_association_of_ulemas:0	"Die pan-nationale Vereinigung der Ulemas"
TUR_the_pan_national_association_of_ulemas_desc:0	"Wir sind keine nationale Bewegung: Wir stehen nicht einfach für die Autorität des Sultans, sondern für die Autorität der Muslime auf der ganzen Welt. Wir halten uns nicht an den Nationalismus, denn wir glauben an die internationale Sache des Islam! Wir werden mit religiösen Führern aus der ganzen Welt zusammenarbeiten, um herauszufinden, wie wir unsere religiöse Herde am besten verbreiten und mit dem Schwert befreien können."
TUR_reinstate_the_darulfununu_sahane:0	"Wiedereinführung der Darülfünûn-u Şahâne"
TUR_reinstate_the_darulfununu_sahane_desc:0	"Wir zögern nicht zu sagen, dass viele unserer Institutionen... nicht gerade modern sind. Dennoch leben wir im Zeitalter der modernen Kriegsführung. Es ist eine gute Sache, dass unsere Nation so industrialisiert und modern ist, wie sie ist - und das alles dank der harten Arbeit der osmanischen Bürokratie! Zu diesem Zweck werden wir an der Universität Istanbul eine Schule einrichten, die die technische und wissenschaftliche Zusammenarbeit zwischen uns und gleichgesinnten Nationen fördert."
TUR_imperial_factories:0	"Kaiserliche Fabriken"
TUR_imperial_factories_desc:0	"Die Kemalisten hatten diese interessante Idee, die sie 'Etatismus' nannten, und obwohl wir niemals offen eine kemalistische ideologische Säule unterstützen würden, können wir uns des Eindrucks nicht erwehren, dass es... zweckmäßig sein könnte, die Produktionsmittel des Staates zentral zu organisieren und zu kontrollieren. Ziehen Sie keine Vergleiche mit dem Kommunismus oder dem Faschismus: die Fabriken werden alle dem Sultan gehören - wir werden diese Fabriken nur in seinem Namen verwalten!"
TUR_refining_our_strategies:0	"Verfeinerung unserer Strategien"
TUR_refining_our_strategies_desc:0	"Seit unserem Untergang im Großen Krieg haben wir viel über die Kriegsführung gelernt und dürfen uns nicht mehr auf verrückte Pläne einlassen, von denen wir uns keinen Sieg versprechen. Wir müssen klug und konservativ kämpfen, damit wir, wenn alle Kämpfe vorüber sind und sich der Staub gelegt hat, als Sieger dastehen."
TUR_the_red_apples_of_sevres:0	"Die roten Äpfel von Sèvres"
TUR_the_red_apples_of_sevres_desc:0	"Paris, Rom, London: das sind die kızıl elma des wiederhergestellten Osmanischen Reiches. Wir werden vor nichts zurückschrecken, um sicherzustellen, dass unsere alten Feinde - die uns gerne demontiert, gedemütigt und vernichtet hätten - gedemütigt, gebeugt und dann für ihre heimtückischen Pläne gegen unser Reich gebrochen werden. Wir werden die alte Weltordnung in Flammen aufgehen lassen und auf den Kadavern ihrer gefallenen Reiche einen neuen Status quo errichten."
TUR_realize_the_nightmare_of_meiji:0	"Verwirklichen Sie den Albtraum von Meiji"
TUR_realize_the_nightmare_of_meiji_desc:0	"Sultan Abdul Hamid II. befürchtete einst, der japanische Kaiser würde zum Islam konvertieren und sich selbst zum Kalifen anstelle des türkischen Monarchen ausrufen. Dazu kam es jedoch nie. Leider hat Japan Sèvres genauso unterzeichnet wie Lausanne - obwohl wir die Japaner lange bewundert haben, sind sie genauso schuldig wie die anderen alten Mächte. Wir werden sie demütigen, indem wir die Khedivate von Nihon direkt von Kostantiniye aus regieren."
TUR_continue_to_prioritise_balkan_integrity:0	"Der Integrität des Balkans weiterhin Vorrang einräumen"
TUR_continue_to_prioritise_balkan_integrity_desc:0	"Es war immer in unserem Interesse, dass auf dem Balkan Frieden herrscht. Wir müssen zugeben, dass wir uns in gewissem Maße für den Schutz und die Förderung unserer Nachbarn verantwortlich fühlen, insbesondere in Anbetracht unserer gemeinsamen... unglücklichen Vergangenheit. Diese Zeit liegt hinter uns: Wir treten nicht mehr als Eroberer auf, sondern als überzeugte Freunde, die unsere schwächeren Nachbarn vor neuen Eroberern schützen wollen, die ihnen schaden wollen."
TUR_reaffirm_the_balkan_pact:0	"Reform des Balkanpakts"
TUR_reaffirm_the_balkan_pact_desc:0	"Der Balkanpakt wurde geschlossen, um den bulgarischen und ungarischen Irredentismus abzuschrecken, aber die Welt ist seither wesentlich gefährlicher geworden. Der Balkanpakt ist unzureichend, wir müssen ihn zu einer Balkan-Entente reformieren!"
TUR_balkan_defense_council:0	"Balkan-Verteidigungsrat"
TUR_balkan_defense_council_desc:0	"Jedes einzelne Land der Balkan-Entente kennt den Krieg wie einen alten Freund. Wir alle wissen, dass wir einen Krieg nicht offensiv beginnen können, also müssen wir uns zusammenschließen, um die beste Verteidigung zu bilden."
TUR_balkan_defense_council_tt:0	"Sobald der §YBalkan-Pakt§! zu einem Bündnis ratifiziert wurde, können wir uns darüber abstimmen, wie wir uns am besten gegen eine ausländische Aggression verteidigen können."
TUR_three_year_industrial_plan:0	"Industrieller Dreijahresplan"
TUR_three_year_industrial_plan_desc:0	"Wir sind bereit, uns einer halbinselweiten Industrialisierung zu unterziehen, die selbst [ENG.GetNameDef] einschüchtern könnte. Wir werden uns gegenseitig als Gleichberechtigte unterstützen, und gemeinsam werden wir uns durch die kollektive Macht der Balkan-Entente über die Stärke unserer Feinde erheben!"
TUR_united_against_imperialism:0	"Vereinigte Front gegen den Imperialismus"
TUR_united_against_imperialism_desc:0	"Wir alle sind Opfer der Machenschaften von Mächten geworden, die größer sind als wir. Zu oft wurden wir zu Verträgen und Abkommen gezwungen, die uns gedemütigt und geschwächt haben. Wir sagen, dass die Welt nicht mehr so ist, wie sie einmal war, und dass wir uns nie wieder den imperialistischen Schikanen beugen werden!"
TUR_united_against_imperialism_tt:0	"Veränderung in der Popularität von Demokratie oder Blockfreiheit für §YBalkan Pact§! Länder: §G10%§!.\n"
TUR_create_the_balkan_central_bank:0	"Schaffung der Balkan-Zentralbank"
TUR_create_the_balkan_central_bank_desc:0	"Wir werden neben unseren nationalen Währungen eine neue gemeinsame Währung einführen und eine neue Zentralbank gründen, über die wir alle gesetzliche Zahlungsmittel austauschen und Geschäfte abwickeln können. Was kann da schon schief gehen?"
TUR_the_treaty_for_prosperity_and_trade:0	"Der Vertrag für Wohlstand und Handel"
TUR_the_treaty_for_prosperity_and_trade_desc:0	"Wir werden einen kollektiven Vertrag zur Förderung des freien Handels nach den Grundsätzen des freien Marktliberalismus anführen. Wir können nicht von allen unseren Mitgliedern erwarten, dass sie ihre Volkswirtschaften vollständig umgestalten, um den freien Handel zu ermöglichen, aber wir können zumindest dem Protektionismus auf dem Balkan ein Ende setzen."
TUR_joint_budgets_on_fortifications:0	"Gemeinsame Budgets für Befestigungen"
TUR_joint_budgets_on_fortifications_desc:0	"Festungslinien sind seit langem ein fester Bestandteil der meisten Verteidigungsdoktrinen, und auch wenn einige heute der Meinung sind, dass solche Strategeme durch die moderne Technologie überholt sind, sind wir der Meinung, dass die Festung noch einen gewissen Nutzen haben kann. Indem wir uns alle gegenseitig bei der Verteidigung unterstützen, garantieren wir unsere kollektive Sicherheit."
TUR_connecting_our_capitals:0	"Unsere Hauptstädte miteinander verbinden"
TUR_connecting_our_capitals_desc:0	"Damit sich unsere Armeen reibungslos von Frontlinie zu Frontlinie bewegen können, müssen wir auf der gesamten Balkanhalbinsel für eine effiziente Infrastruktur sorgen. Wir werden mit unseren Partnern zusammenarbeiten, um so gut wie möglich sicherzustellen, dass unsere Hauptstädte durch eine moderne Infrastruktur verbunden sind."
TUR_connect_capitals_greece_tt:0	"Da §YGriechenland§! aus eigenem Antrieb Infrastrukturprojekte in Angriff genommen hat, wird es zusätzliche Infrastruktur erhalten."
TUR_connect_capitals_romania_tt:0	"Da §YRumänien§! aus eigenem Antrieb Infrastrukturprojekte in Angriff genommen hat, erhält es zusätzliche Infrastruktur."
TUR_connect_capitals_yugoslavia_tt:0	"Da §YYugoslawien§! aus eigenem Antrieb Infrastrukturprojekte in Angriff genommen hat, erhält es zusätzliche Infrastruktur."
TUR_fortifying_contentious_areas:0	"Umstrittene Gebiete befestigen"
TUR_fortifying_contentious_areas_desc:0	"Der Balkan wird nicht umsonst das Pulverfass Europas genannt. In jedem einzelnen unserer Länder gibt es mindestens einen potenziellen Konfliktherd mit einer größeren Macht. Es ist unsere Pflicht, dafür zu sorgen, dass diese Krisenherde angemessen verteidigt und befestigt werden."
TUR_fortify_the_south_tt:0	"Fügt §Y2 Landforts§! an jeder Kreuzung von §Y[164.GetName]§! hinzu. \n"
TUR_fortify_the_north_tt:0	"Fügt eine Verteidigungslinie von §Y-Landforts§! in §Y[354.GetName]§!.\n hinzu"
TUR_fortify_the_east_tt:0	"Fügt §Y5 Landforts§! an den östlichen Grenzen von §Y[800.GetName]§!.\n hinzu"
TUR_integrated_armed_forces:0	"Integrierte Streitkräfte"
TUR_integrated_armed_forces_desc:0	"Es ist ein ehrgeiziges Programm, aber wir haben beschlossen, dass es sich lohnt, es zu verfolgen. In Anbetracht der misslichen Lage, in der sich kleinere Nationen befinden, wenn sie es mit einer Großmacht zu tun haben, haben wir beschlossen, eine multinationale Organisation der Streitkräfte der Balkan-Entente anzuführen. Wir werden uns gegenseitig die notwendigen Ressourcen zur Verfügung stellen, damit wir, wenn wir vereint sind, nicht wie Kerzen von den Imperialisten ausgelöscht werden."
TUR_the_balkan_academy_of_science:0	"Die Balkan-Akademie der Wissenschaften"
TUR_the_balkan_academy_of_science_desc:0	"Wir leben in einem Zeitalter der Wissenschaft und der Innovation, und wir können nicht zulassen, dass wir oder ein anderes Mitglied der Balkan-Entente zu weit hinter die technischen Errungenschaften der größeren, stärker industrialisierten Nationen zurückfallen."
TUR_extend_an_olive_branch_to_bulgaria:0	"Strecken Sie Bulgarien einen Olivenzweig entgegen"
TUR_extend_an_olive_branch_to_bulgaria_desc:0	"Der Balkanpakt wurde gegründet, um den bulgarischen Revanchismus zu bekämpfen, aber die Welt hat in den vergangenen Jahren weitaus schlimmere Ungeheuer hervorgebracht. Bulgarien ist wie wir nur eine weitere Schachfigur für die Imperialisten, die ihr Streben nach imperialer Vorherrschaft vorantreiben. Wir sollten ihnen eine helfende Hand reichen und ihnen erlauben, ihre Kräfte mit unseren zu vereinen, damit wir alle aus diesem Konflikt mit intakten Grenzen und einer intakten Moral hervorgehen können."
TUR_preempt_bulgarian_alignment:0	"Dem bulgarischen Bündnis zuvorkommen"
TUR_preempt_bulgarian_alignment_desc:0	"Die Preußen des Balkans mögen eine kleinere Macht sein wie wir, doch sie haben den Hunger und den Ehrgeiz einer mächtigen Großmacht. Können wir auch nur einen Moment lang daran zweifeln, dass die Bulgaren uns nicht alle in den Rücken fallen werden, um sich persönlich zu bereichern, sobald sich die Gelegenheit bietet? Die Antwort ist nein, was nur eine Lösung zulässt: Bulgarien muss vernichtet werden."
TUR_peninsular_network_of_factories:0	"Netzwerk von Fabriken auf der Halbinsel"
TUR_peninsular_network_of_factories_desc:0	"Alleine kann keiner von uns gegen die größeren und stärker industrialisierten Länder wie [GER.GetNameDef] und [SOV.GetNameDef] bestehen, aber gemeinsam - wenn wir alle unsere Ressourcen bündeln, um unser gesamtes Potenzial zu maximieren? Das wird uns zu einer eigenständigen Großmacht machen."
TUR_combined_operational_strategies:0	"Gemeinsame operative Strategien"
TUR_combined_operational_strategies_desc:0	"Indem wir in Fragen der Strategie und der Verteidigung auf einer tieferen Ebene zusammenarbeiten, können wir die Sicherheit für unsere gesamte Region garantieren - auch gegen überwältigende Widerstände."
TUR_edirne_research_exchange:0	"Edirne Research Exchange"
TUR_edirne_research_exchange_desc:0	"Wir werden die Initiative ergreifen und eine öffentliche Einrichtung gründen, die einen multinationalen freien Fluss von Ideen fördert, damit wir bei allen neuesten technologischen und wissenschaftlichen Fortschritten im Balkanpakt an vorderster Front stehen können."
TUR_crush_the_warmongers_in_rome:0	"Zerschlagen Sie die Kriegstreiber in Rom"
TUR_crush_the_warmongers_in_rome_desc:0	"Die [ITA.GetAdjective]s sind die Quelle allen Übels im Mittelmeerraum. Sie sind ein bösartiger Tumor, der glaubt, sich mit dem Recht der Macht wie ein Krebsgeschwür in Südeuropa ausbreiten zu können. Wir werden ihnen den Kampf ansagen und ihnen so viele Dosen ihrer eigenen Medizin verabreichen, dass sie daran ersticken."
TUR_brace_against_the_red_menace:1	"[GetBraceAgainstTheRedMenaceName]"
TUR_brace_against_the_red_menace_desc:1	"[GetBraceAgainstTheRedMenaceDesc]"
TUR_brace_against_the_red_menace_communism:0	"Gegen die rote Bedrohung wappnen"
TUR_brace_against_the_red_menace_communism_desc:0	"Im Norden liegt die perfide Bedrohung durch den Kommunismus und seinen Hauptsponsor in der Welt. [SOV.GetNameDef] ist eine Plage für diese Welt, und die Balkan-Entente wird der Menschheit einen Gefallen tun, wenn sie die [SOV.GetAdjective] Hegemonie zerschlägt."
TUR_brace_against_the_red_menace_generic:0	"Wappnen Sie sich gegen die [SOV.GetAdjective]-Bedrohung"
TUR_brace_against_the_red_menace_generic_desc:0	"Im Norden liegt das heimtückische Russland. Schon immer haben sie versucht, sich in die Angelegenheiten des Balkans und der Türkei einzumischen. Die Balkan-Entente wird der Menschheit einen Gefallen tun, wenn sie die [SOV.GetAdjective]-Hegemonie zerschlägt."
TUR_reconfigure_our_foreign_policy:0	"Die türkische Außenpolitik umgestalten"
TUR_reconfigure_our_foreign_policy_desc:0	"[TUR.GetAdjective] Außenpolitik hat sich auf innenpolitische Angelegenheiten konzentriert und außenpolitische Interaktionen meist unseren Nachbarn überlassen, aber die Zeiten haben sich geändert und unsere Außenpolitik muss dies widerspiegeln. Es ist längst überfällig, dass wir anfangen, uns mehr mit den Großmächten der Welt auseinanderzusetzen."
TUR_the_anglo_turkish_agreement:0	"Das anglo-türkische Abkommen"
TUR_the_anglo_turkish_agreement_desc:0	"Die [ENG.GetAdjective]-Regierung ist bestrebt, ein Abkommen mit uns zu unterzeichnen: ein Abkommen, das von uns faktisch verlangt, dass wir nichts versprechen, aber [ENG.GetNameDef] zwingen würde, uns im Falle einer Invasion zu Hilfe zu eilen. Die ganze Sache riecht nach Verzweiflung, aber Verzweiflung können wir gebrauchen."
TUR_add_medium_tank_technology_tt:0	"Technologie hinzufügen: §YBasic Medium Tank§!."
TUR_applying_british_oil_embargoes_on_iraq:1	"Anwendung des [ENG.GetAdjective] Ölembargos gegen den Irak"
TUR_applying_british_oil_embargoes_on_iraq_desc:0	"Die [ENG.GetAdjective] sind entschlossen, [IRQ.GetAdjective] Öllieferungen an ihre Feinde auf dem Kontinent zu unterbinden, aber sie waren bisher weitgehend erfolglos. Wir können die Initiative der [ENG.GetAdjective] unterstützen, indem wir eine der größten Landrouten blockieren, über die die [IRQ.GetAdjective] nach Europa gelangen."
TUR_host_exiled_scientists:0	"Nehmen Sie Wissenschaftler im Exil auf"
TUR_host_exiled_scientists_desc:0	"So viele Nationen, die von stiefelbewehrten Narren regiert werden, sind bereit, ihre besten und klügsten Köpfe kurzsichtig zu verbannen, nur weil diese Wissenschaftler nicht bereit sind, einer tyrannischen Agenda zu dienen. Wir werden diesen Exilanten hier in [TUR.GetNameDef] eine Heimat bieten, denn wir haben großen Bedarf an ihnen."
TUR_the_chester_concession:0	"Das Zugeständnis von Chester"
TUR_the_chester_concession_desc:0	"Wir haben weiterhin Anspruch auf die Zugeständnisse, die uns die Amerikaner vor über einem Jahrzehnt versprochen haben. Wir können unser Engagement im Krieg von amerikanischen Beiträgen zum Wohl des [TUR.GetAdjective] Staates abhängig machen."
TUR_raise_opinion_of_america_tt:0	"Je höher die Meinung ist, die die §YVereinigten Staaten von Amerika§! von uns haben, desto wahrscheinlicher wird das Zugeständnis genehmigt werden."
TUR_american_motor_factories:0	"Amerikanische Motorfabriken"
TUR_american_motor_factories_desc:0	"Ein großer Teil unserer Schwerindustrie, die mit der Produktion von motorisierten Fahrzeugen verbunden ist, hängt von der Zusammenarbeit mit den Amerikanern ab. Wir waren nicht immer die nachsichtigste Nation, wenn es um ausländische Investitionen ging, aber wenn wir unsere Vorschriften für unsere amerikanischen Freunde lockern würden... nun... wer weiß, was dann passieren würde?"
TUR_bomber_schematics:0	"Bombenbaupläne"
TUR_bomber_schematics_desc:0	"Es reicht nicht aus, dass wir in Kriegszeiten unseren eigenen Himmel verteidigen können, wir müssen auch in der Lage sein, die Herzen unserer Feinde zu treffen, damit jeder Krieg schnell beendet werden kann. Die Alliierten sind Meister darin, die Bombe als Mittel zur Niederschlagung ihrer Feinde einzusetzen, und wir können viel von ihnen lernen."
TUR_join_the_allies:0	"Schließen Sie sich den Alliierten an"
TUR_join_the_allies_desc:0	"Die Welt ist an einem schicksalhaften Punkt angelangt, und wir stehen am Scheideweg vieler Reiche, die darum wetteifern, die Welt für immer zu verändern. Wir müssen für die Werte eintreten, auf denen unser Land gegründet wurde, und mit den Nationen des Westens im Namen von Freiheit und Unabhängigkeit kämpfen."
TUR_controlling_the_skies_of_europe:0	"Die Kontrolle über den Himmel"
TUR_controlling_the_skies_of_europe_desc:0	"Mit überlegener Feuerkraft werden wir den Krieg gewinnen, und wir müssen aktiv zu den Kriegsanstrengungen beitragen, indem wir unsere eigene Feuerkraft in den Kampf um die Beherrschung des Luftraums einbringen."
TUR_expanding_our_navy:0	"Erweitern Sie unsere Marine"
TUR_expanding_our_navy_desc:0	"Wir kämpfen an der Seite einiger der herausragendsten Seemächte der Welt und wir können viel von ihnen lernen. Am Ende des Krieges wird unsere Marine zu den ganz Großen gehören."
TUR_the_petra_proposal:0	"Der Petra-Vorschlag"
TUR_the_petra_proposal_desc:0	"Unsere Berater haben einen Plan ausgearbeitet, nach dem wir für den Schutz und die Verwaltung von [ENG.GetAdjective] Protektoraten in der Levante verantwortlich wären. Die Strategie und der Vorschlag sind solide, und jetzt müssen wir sie nur noch den [ENG.GetAdjective] vorschlagen."
TUR_expanded_credit_on_our_debts:0	"Expandierter Kredit für unsere Schulden"
TUR_expanded_credit_on_our_debts_desc:0	"Was für ein Glück, dass wir uns mit vielen Ländern verbündet haben, denen wir viel zu verdanken haben! Sicherlich ist unsere Beteiligung an diesem Konflikt Grund genug, einen Großteil dieser Schulden zu erlassen, natürlich im Namen unseres gemeinsamen Kampfes für die Freiheit."
TUR_partnership_pact_with_bulgaria:0	"Partnerschaftspakt mit Bulgarien"
TUR_partnership_pact_with_bulgaria_desc:0	"Es wäre klug, das [BUL.GetAdjective] Volk nicht zu hart zu verurteilen, damit es nicht in die Arme des Feindes getrieben wird. Lassen Sie uns ihnen eine Alternative anbieten: eine Gelegenheit, sich auf die Seite der Freiheit und des Rechts zu stellen, statt auf die Seite der Autokratie und der Korruption."
TUR_seizing_the_romanian_oil_fields:0	"Die Beschlagnahme der rumänischen Ölfelder"
TUR_seizing_the_romanian_oil_fields_desc:0	"Die rumänischen Ölfelder sind ein Gebiet, das für die [GER.GetFactionName] Kriegsanstrengungen lebenswichtig ist. Ihre Versorgung mit [ROM.GetNameDef]s Öl abzuschneiden wäre so, als würde man den Blutfluss in einem Herzen stoppen."
TUR_securing_iran:0	"Den Iran sichern"
TUR_securing_iran_desc:0	"Wenn die [PER.GetAdjective] den Handel mit ihrem Öl nicht so regeln, dass es nicht in die Reserven unserer Feinde gelangt, dann werden wir ihre Ressourcen gewaltsam für sie verwalten."
TUR_taking_over_defense_of_the_gulf:0	"Die Verteidigung des Golfs übernehmen"
TUR_taking_over_defense_of_the_gulf_desc:0	"Wir können ein wenig Druck von unseren [ENG.GetAdjective] Verbündeten nehmen, indem wir ihnen anbieten, ihre Besitztümer im Nahen Osten für sie zu sichern. Sie werden diesem Vorschlag wahrscheinlich aufgeschlossen gegenüberstehen, vor allem in Anbetracht dessen, was wir zu den Kriegsanstrengungen beigetragen haben... und der Tatsache, dass sie nicht wirklich in der Lage wären, uns davon abzuhalten, die Gebiete einfach zu beschlagnahmen."
TUR_we_must_not_fall:0	"Wir dürfen nicht fallen!"
TUR_we_must_not_fall_desc:1	"Wir haben als Nation im Unabhängigkeitskrieg nicht mit Zähnen und Klauen gekämpft, nur um ein paar Jahrzehnte später vernichtet zu werden. Nein, die Geschichte von [TUR.GetNameDef] ist hier nicht zu Ende - wir dürfen nicht fallen, wir werden nicht fallen!"
TUR_the_german_turkish_friendship_treaty:0	"Der deutsch-türkische Freundschaftsvertrag"
TUR_the_german_turkish_friendship_treaty_desc:1	"[GER.GetNameDefCap] und [ROOT.GetNameDef] sind natürliche Freunde. Wir müssen nicht in allen Fragen einer Meinung sein, denn unsere jüngste Geschichte ist nicht allzu unterschiedlich. Die Bemühungen von [ENG.GetAdjective], unsere Außenpolitik zu kontrollieren, werden ins Leere laufen: Das werden wir mit einem neuen Freundschaftsvertrag beweisen, der einseitig von [GER.GetLeader] und [ROOT.GetLeader] unterzeichnet wird."
TUR_the_clodius_agreement:0	"Das Clodius-Abkommen"
TUR_the_clodius_agreement_desc:0	"Die [GER.GetAdjective] sind mit einem günstigen Angebot an uns herangetreten: Chromerz im Tausch gegen die Möglichkeit, mehr eigene militärische Ausrüstung zu produzieren. Indem wir [GER.GetNameDef]s Hauptquelle für Chromerz werden, erhalten wir auch Anspruch auf [GER.GetNameDef]s Schutz, was heutzutage eine ziemlich beneidenswerte Position ist."
TUR_clodius_agreement_tt:1	"Jeder Staat, der §Y65§! oder mehr Einheiten von §YChromium§! produziert, erhält drei Stufen von §YInfrastruktur§! und zwei §YMilitärische Fabriken§!."
TUR_purchase_italian_light_tanks:0	"Kaufen Sie italienische leichte Panzer"
TUR_purchase_italian_light_tanks_desc:0	"Ohne starke, zuverlässige Panzer, die das Rückgrat der Armee bilden, kann man keine modernen Streitkräfte haben. Wir müssen einfach einige unserer eigenen Panzer in die Hände bekommen, und gibt es irgendeinen Zweifel daran, dass die besten Panzer der Welt aus [ITA.GetNameDef] stammen?"
TUR_approve_the_funkplan:0	"Genehmigen Sie den Funkplan"
TUR_approve_the_funkplan_desc:0	"Als der Schachtplan in Südeuropa ausgerollt wurde, haben wir uns nicht an dem Plan beteiligt. Die Situation hat sich geändert, und wir sind bereit, unsere wirtschaftlichen Beziehungen zu [GER.GetNameDef] zu vertiefen. [GER.GetAdjective] Wirtschaftswissenschaftler Walther Funk hat einen Plan ausgearbeitet, der speziell auf unsere Situation zugeschnitten ist, und wir wären dumm, wenn wir diesen Plan nicht so bald wie möglich umsetzen würden."
TUR_the_italo_turkish_naval_academy:0	"Die italienisch-türkische Marineakademie"
TUR_the_italo_turkish_naval_academy_desc:0	"Die [ITA.GetAdjective]s sind die unangefochtenen Herren der Meere. Wir können viel von ihnen lernen, wenn sie bereit sind, uns zu unterrichten."
TUR_invite_german_officers_to_izmir:1	"Laden Sie deutsche Offiziere zu [339.GetName] ein."
TUR_invite_german_officers_to_izmir_desc:0	"Die Militärberater von [GER.GetAdjective] werden von der Welt beneidet. Um unser Militär und seine Taktik zu modernisieren, müssen wir die Hilfe des Volkes mit den modernsten Streitkräften in Europa in Anspruch nehmen."
TUR_the_mediterranean_entente:0	"Die Mittelmeer-Entente"
TUR_the_mediterranean_entente_desc:0	"Wir müssen ein umfassendes pan-mediterranes Bündnis aushandeln, das die Verantwortung für die Sicherheit in der Region übernimmt. Jedes Projekt zur Kontrolle des Mittelmeers, das nicht mit einer offenen Hand für [ITA.GetNameDef] beginnt, ist zum Scheitern verurteilt."
TUR_invite_bulgaria_desc:0	"[BUL.GetNameDefCap] hat schon viel zu lange im Abseits gestanden. Ihre Zukunft mit [GER.GetNameDef] steht nicht in Frage, nur wann sie sich endlich zu ihrer Loyalität bekennen werden. Wir werden den [BUL.GetAdjective] helfen, ihren Mut zu finden."
TUR_entice_the_greeks:0	"Verführen Sie die Griechen"
TUR_entice_the_greeks_desc:0	"Der Frieden mit [GRE.GetNameDef] ist etwas, für das unsere Verwaltungen seit dem Zusammenbruch des Osmanischen Reiches sehr hart gearbeitet haben. Wir haben keinen Grund, die jahrzehntelangen diplomatischen Bemühungen wegzuwerfen, aber wenn wir uns in diesem Krieg auf entgegengesetzten Seiten wiederfinden, könnte sich das sehr wohl ändern. Hoffen wir, dass sie auf die Weisheit hören und ihre Zukunft nicht unnötig wegwerfen."
TUR_carve_up_greece:0	"Griechenland zerstückeln"
TUR_carve_up_greece_desc:0	"Zu unserem großen Bedauern scheint es keine Zukunft zu geben, in der [GRE.GetNameDef] diese Ära als eine noch unabhängige Nation verlässt. Diese Entscheidung beruht nicht auf Feindseligkeit, wir tun einfach, was um des Überlebens willen getan werden muss. Es wird wieder Frieden in der Ägäis herrschen, aber nicht in dieser grausamen und unbarmherzigen Ära."
TUR_pressure_portugal_to_join:0	"Portugal zum Beitritt drängen"
TUR_pressure_portugal_to_join_desc:0	"[POR.GetNameDefCap] grenzt zwar technisch gesehen nicht an das Mittelmeer, aber es hat ein großes Interesse an der Zukunft der Region. Wir haben Bedarf an ihrem großen Reich, und sie können von Freunden wie uns viel profitieren."
TUR_collaborative_civil_works_programme:0	"Gemeinsames Programm für zivile Arbeiten"
TUR_collaborative_civil_works_programme_desc:1	"Wenn es nur nach [ITA.GetNameDef] ginge, würde jeder in unserem Bündnis nur andere Völker erobern und unterjochen. Wir sind die Stimme der Vernunft für die anderen Aspekte des Regierens: Hat denn niemand an die Beschäftigungsraten oder die Nachkriegswirtschaft gedacht? Wir sollten unsere Ressourcen bündeln und zusammenarbeiten, um eine bessere Zukunft aufzubauen, die all dieses Blutvergießen wert ist."
TUR_fortifying_the_bosporus:0	"Befestigung des Bosporus"
TUR_fortifying_the_bosporus_desc:0	"Der Bosporus ist das Tor zwischen dem Schwarzen Meer und dem Mittelmeer. Der Suezkanal wird stark verteidigt, ebenso wie die Einfahrten zur Straße von Gibraltar. Ist es dann sinnvoll, unsere eigene Meerenge ungeschützt und offen für Belästigungen durch fremde Mächte zu lassen? Nein, macht es nicht. Wir werden hart daran arbeiten, das zu verteidigen, was uns gehört."
TUR_fortifying_the_bosporus_istanbul_tt:0	"Fügt §Y3 Landforts§! innerhalb der Stadt hinzu.\n"
TUR_fortifying_the_bosporus_edirne_tt:0	"Fügt eine Reihe von §Y-Landforts§! der Stufe zwei entlang der §YTurkish Straits§! hinzu.\n"
TUR_mediterranean_merchant_fleet:0	"Mittelmeer-Handelsflotte"
TUR_mediterranean_merchant_fleet_desc:0	"Konvois sind das Aushängeschild dieser Fraktion, und wir müssen uns alle gemeinsam mehr anstrengen, um die Anzahl der verfügbaren Konvois zu erhöhen. Wenn diese neue Handelsflotte natürlich auch als verdecktes Mittel zum Austausch zusätzlicher Informationen über die Marineforschung genutzt würde, könnte sich dies als besonders fruchtbar erweisen."
TUR_court_the_spanish:0	"Machen Sie den Spaniern den Hof"
TUR_court_the_spanish_desc:0	"Es ist kein Geheimnis, dass der Führer Spaniens mit unserer Fraktion und dem, was sie vertritt, sympathisiert. Ein einfaches Freundschaftsangebot und einige vage Versprechungen über künftige Gewinne sollten ausreichen, um sie auf unsere Seite zu ziehen und sich zu engagieren."
TUR_cleanse_iberia_of_bolshevism:0	"Säubern Sie die Iberische Halbinsel vom Bolschewismus"
TUR_cleanse_iberia_of_bolshevism_desc:0	"Der Verlust der nationalistischen Sache während des spanischen Bürgerkriegs war ein Skandal! Es war falsch, eine Perversion der Gerechtigkeit und ein tragisches Versagen der faschistischen Sache. Wir müssen das Unrecht der Vergangenheit mit Gewalt wiedergutmachen."
TUR_end_the_british_hegemony:0	"Beenden Sie die britische Hegemonie"
TUR_end_the_british_hegemony_desc:0	"Diese Welt kann keinen Frieden kennen, solange die perfide und ewige Herrschaft der [ENG.GetAdjective] nicht gewaltsam und endgültig beendet wird. Das ist kein Krieg, das ist Pflicht."
TUR_punish_french_weakness:0	"Französische Schwäche bestrafen"
TUR_punish_french_weakness_desc:0	"Die [FRA.GetAdjective] Trikolore wehte einst über halb Europa zu Zeiten Napoleons. Heute darf sie nicht einmal mehr über Paris wehen. Es ist höchste Zeit, der weltweiten Blamage der Nation, die als '[FRA.GetNameDef]' bekannt ist, ein Ende zu setzen."
TUR_victory_or_death_against_communism:1	"[GetVictoryOrDeathAgainstCommunismName]"
TUR_victory_or_death_against_communism_desc:1	"[GetVictoryOrDeathAgainstCommunismDesc]"
TUR_victory_or_death_against_communism_communism:0	"Sieg oder Tod gegen den Kommunismus"
TUR_victory_or_death_against_communism_communism_desc:0	"Der weltweite Kampf gegen den Kommunismus ist ein gerechter Kampf. Der Kampf geht über eine einfache Ideologie hinaus: Wir kämpfen für unsere Lebensweise gegen einen furchterregenden Monolithen, der alles zerstört, was er berührt. Wir können es uns nicht leisten zu verlieren."
TUR_victory_or_death_against_communism_generic:0	"Sieg gegen den russischen Imperialismus"
TUR_victory_or_death_against_communism_generic_desc:0	"Der weltweite Kampf gegen den [SOG.GetAdjective]-Imperialismus ist ein gerechter Kampf. Der Kampf geht über Grenzstreitigkeiten hinaus: Wir kämpfen für unsere eigene Lebensweise gegen ein furchterregendes expansionistisches Imperium, das alles zerstört, was es berührt. Wir können es uns nicht leisten zu verlieren."
TUR_increase_german_military_aid:0	"Deutsche Militärhilfe erhöhen"
TUR_increase_german_military_aid_desc:0	"Wenn die [GER.GetAdjective]s von uns erwarten, dass wir mit ihren Fortschritten an der Front mithalten, dann müssen sie etwas von den Unmengen an Technologie teilen, die sie im Laufe der Jahre gesammelt haben. Natürlich würden wir gerne intensiver kämpfen - aber etwas [GER.GetAdjective]-Hilfe könnte diesen Wunsch sehr erleichtern."
TUR_cooperative_research_centers:0	"Kooperative Forschungszentren"
TUR_cooperative_research_centers_desc:0	"Dieser Krieg wird von der Macht mit den größten technologischen Fähigkeiten gewonnen werden. Der Faschismus ist das Glaubensbekenntnis der Zukunft, also ist es nur logisch, dass wir nur die modernsten Technologien benötigen, um unseren Krieg zu führen."
TUR_the_tuz_golu_training_facility:0	"Die Tuz Gölü Trainingsanlage"
TUR_the_tuz_golu_training_facility_desc:0	"Das mediterrane Klima in unserem Land ist nicht geeignet, um unsere Soldaten so auszubilden, dass sie auch in trockenem Klima angemessen operieren können. Wir haben uns entschlossen, in der Nähe des Salzsees Tuz Gölü eine Trainingsanlage zu errichten, damit unsere Truppen besser auf den Kampf in trockenen Umgebungen vorbereitet sind."
TUR_pack_for_a_long_winter:0	"Packen Sie für einen langen Winter"
TUR_pack_for_a_long_winter_desc:0	"Es ist keine leichte Aufgabe, die bittere Kälte Eurasiens nachzuahmen, aber wir sind gezwungen, uns damit abzufinden. Wir haben uns für den Bau einer Anlage auf dem Gipfel des Palandöken in Erzurum und einer zusätzlichen kleineren Anlage rund um den Berg Ağrı entschieden, damit unsere Truppen das ganze Jahr über unter alpinen und gletscherähnlichen Bedingungen trainieren können."
TUR_support_the_golden_square:0	"Unterstützen Sie das Goldene Quadrat"
TUR_support_the_golden_square_desc:0	"Es gibt eine Gruppe mit beträchtlichem Einfluss in [IRQ.GetNameDef], die sehr ähnliche Ziele verfolgt wie wir. Wir sollten diese Gleichgesinnten unterstützen, damit sie dazu beitragen können, die imperialistische Präsenz in der Region zu beseitigen."
TUR_secure_the_iraqi_oil:0	"Sichern Sie das irakische Öl"
TUR_secure_the_iraqi_oil_desc:0	"Warum sollten Sie anderen eine Aufgabe anvertrauen, von der Sie wissen, dass Sie sie ganz gut allein bewältigen können? Unsere Stiefel werden noch vor Ende des Monats in Bagdad einmarschieren: garantiert."
TUR_rebuke_the_treaty_of_lausanne:0	"Kündigen Sie den Vertrag von Lausanne"
TUR_rebuke_the_treaty_of_lausanne_desc:0	"Wir haben bereits gegen so viele Bestimmungen des Vertrags verstoßen, der uns nach dem Ende des Ersten Weltkriegs auferlegt wurde. Es ist an der Zeit, das Joch unserer Feinde endlich abzuschütteln, so wie es unsere Verbündeten bereits vor uns getan haben. Es ist bedauerlich, aber wir können nicht darauf vertrauen, dass unsere westlichen Grenzen sicher sein werden, solange die [GRE.GetAdjective] nicht gelöst ist."
TUR_turkish_panzers:0	"Türkische Panzer"
TUR_turkish_panzers_desc:0	"Warum sollte [GER.GetNameDef] das einzige Land sein, das über beeindruckende Panzer verfügt? Wir werden unsere eigene Panzerreihe in Auftrag geben, die zusammen mit den [GER.GetAdjective] Panzern die Welt erobern wird!"
TUR_establish_the_committee_of_pan_turkism:1	"Propagieren Sie die Doktrin des Pan-Turkismus"
TUR_establish_the_committee_of_pan_turkism_desc:0	"Überall in Eurasien warten unsere unterdrückten türkischen Brüder und Schwestern darauf, dass wir sie aus den Klauen ihrer bösen Herren befreien. Genau das werden wir tun und wir werden nicht aufhören, bis jeder Türke auf der Welt in unseren Grenzen und unter unserem Schutz frei ist!"
TUR_integrate_german_officers_into_the_army:0	"Integrieren Sie deutsche Offiziere in die Armee"
TUR_integrate_german_officers_into_the_army_desc:0	"Da es nicht mehr nötig ist, die Rolle der deutschen Militärs in unserem Land zu verschleiern, haben wir sie mit der ausdrücklichen Zustimmung von [GER.GetLeader] offiziell in unsere Befehlskette integriert."
TUR_restoring_our_nations_pride:0	"Den Stolz unserer Nation wiederherstellen"
TUR_restoring_our_nations_pride_desc:0	"Unsere Errungenschaften in den letzten Jahren waren schlichtweg atemberaubend. Von der Angst vor dem Krieg nach den enormen Verlusten im Großen Krieg haben wir uns zu Eroberern des Kontinents entwickelt, die überall auf der Welt Schlachten schlagen. Wir stehen an der Schwelle zu einem goldenen Zeitalter: dem Goldenen Zeitalter des Wolfes!"
TUR_renew_the_turkish_soviet_non_aggression_pact:0	"Erneuern Sie den sowjetischen Nichtangriffspakt"
TUR_renew_the_turkish_soviet_non_aggression_pact_desc:0	"Wir haben 1925 einen Nichtangriffspakt mit [SOV.GetNameDef] unterzeichnet und waren eines der ersten Länder der Welt, das freundschaftliche Beziehungen zu den [SOV.GetAdjective] unterhielt, aber die Zeiten haben sich geändert. Es ist wichtig, dass wir diesen Pakt erneuern und sicherstellen, dass die Beziehungen mit dem derzeitigen Regime gesund sind."
TUR_the_batumi_accord:0	"Das Batumi-Abkommen"
TUR_the_batumi_accord_desc:0	"Wir sollten mit der georgischen Regionalregierung zusammenarbeiten, um die Industrien unserer beiden Nationen zu fördern. Ein solches Abkommen wäre für beide Seiten fruchtbar und könnte unmöglich verweigert werden, es sei denn, es gäbe Gründe, die ausdrücklich politischer Natur sind."
TUR_provide_refuge_to_the_victims_of_fascism:0	"Bieten Sie den Opfern des Faschismus Zuflucht"
TUR_provide_refuge_to_the_victims_of_fascism_desc:0	"Der Faschismus wählt seine Opfer wahllos aus. Diese Demagogen schmeicheln den Massen mit Größenwahn auf der einen Seite, während sie auf der anderen Seite die Ratten aus der Kanalisation herauslassen. Wir müssen diejenigen schützen, die keine Mittel haben, um sich selbst zu schützen."
TUR_soviet_tank_factories:0	"Sowjetische Panzerfabriken"
TUR_soviet_tank_factories_desc:0	"Indem wir in unserer Außenpolitik eine explizit antifaschistische Haltung einnehmen, können wir den Erfolg eines Plans zur Förderung der Panzerproduktion in [ROOT.GetNameDef] mit Hilfe der [SOV.GetAdjective]s sicherstellen."
TUR_dissolve_the_ODPA:1	"Lösen Sie den Schuldenrat auf"
TUR_dissolve_the_ODPA_desc:0	"Die Westmächte denken, nur weil die Osmanen bei ihnen verschuldet waren, bedeute dies, dass wir ihnen Loyalität schulden. Die Imperialisten haben sich nicht geändert, und sie scheinen ständig zu beweisen, dass sie sich niemals ändern können. Wir werden dieses antiquierte Symbol unserer Vergangenheit auslöschen: als wir zu schwach waren, für uns selbst einzustehen."
TUR_adana_to_baku_highway:0	"Autobahn von Adana nach Baku"
TUR_adana_to_baku_highway_desc:0	"Wir wollen schon seit langem eine engere Verbindung zwischen uns und dem Kaukasus herstellen. Diese Initiative kann nur dazu dienen, unsere Beziehungen zu [SOV.GetNameDef] zu vertiefen."
TUR_arctic_wolves_training_program:0	"Das Trainingsprogramm der Arktischen Wölfe"
TUR_arctic_wolves_training_program_desc:0	"Unsere Soldaten werden durch den Schnee streifen wie Wölfe auf der Jagd nach Beute im Boreal. Durch unser Training wird der Feind mehr zu fürchten haben als die Kälte der eisigen Winde."
TUR_seize_religious_property:0	"Religiöses Eigentum beschlagnahmen"
TUR_seize_religious_property_desc:0	"Die Religion war von Anfang an der Fluch dieser Republik. Wir werden alle religiösen Gebäude in diesem Land verstaatlichen und schließen und das Land einer besseren Nutzung zuführen. Wenn wir uns von den Fesseln der Religion befreien, werden wir endlich unser volles Potenzial ausschöpfen."
TUR_guarding_our_western_frontiers:0	"Die westlichen Grenzen befestigen"
TUR_guarding_our_western_frontiers_desc:0	"Die größte Bedrohung für unsere Souveränität kommt aus dem Westen. Wenn die westlichen Nationen uns angreifen, werden sie uns bereit finden, sie in die Meere zurückzudrängen, aus denen sie hervorgegangen sind."
TUR_anti_bolshevik_mediterranean_bloc:0	"Der antibolschewistische Mittelmeer-Block"
TUR_anti_bolshevik_mediterranean_bloc_desc:0	"Wir wünschten, wir könnten freundschaftliche Beziehungen zu [SOV.GetNameDef] aufrechterhalten, aber der Stalinismus ist so weit vom marxistischen Ideal entfernt, dass wir uns selbst belügen würden, wenn wir ihn für tolerierbar hielten. Wir müssen mit [SOV.GetNameDef] brechen und anderswo gleichgesinnte Freunde finden."
TUR_readdress_the_montreux_convention:0	"Den Montreux-Konvent neu ausrichten"
TUR_readdress_the_montreux_convention_desc:0	"Als wir zum ersten Mal den Konvent von Montreux abhielten, waren wir vielleicht zu hart, was die Position von [SOV.GetAdjective] angeht. Wir sollten die unterzeichnete Erklärung noch einmal überdenken und die Zugeständnisse machen, die die [SOV.GetNameDef] im Namen der Freundschaft und der Zusammenarbeit gefordert haben."
TUR_the_international_of_proletarian_freethinkers:0	"Die Internationale der proletarischen Freidenker"
TUR_the_international_of_proletarian_freethinkers_desc:0	"Die Freidenker kommen aus der Arbeiterklasse, und bald werden die Besten und Klügsten der Arbeiterklasse hierher strömen, um zum größeren Wohl beizutragen."
TUR_officers_of_the_revolution:0	"Offiziere der Revolution"
TUR_officers_of_the_revolution_desc:0	"So wie die kemalistischen Offiziere ihre eigene Ideologie vertreten und schützen, werden unsere neuen Offiziere als Hüter des Marxismus in [TUR.GetNameDef] dienen."
TUR_taking_responsibility_for_the_air_war:0	"Die Verantwortung für den Luftkrieg übernehmen"
TUR_taking_responsibility_for_the_air_war_desc:0	"Die [SOV.GetAdjective] haben genug damit zu tun, das Land und die Meere zu beherrschen, wir sollten ihnen unter die Arme greifen, indem wir ein wenig Verantwortung für den Luftkrieg übernehmen."
TUR_strengthening_our_navies:0	"Verstärkung unserer Flotten"
TUR_strengthening_our_navies_desc:0	"Um uns im Mittelmeer zu schützen, brauchen wir starke und fähige Seestreitkräfte. Mit vereinten Kräften werden wir das Minimum erreichen, das erforderlich ist, um unsere Grenzen vor eindringenden Bedrohungen zu schützen."
TUR_avenge_the_treaty_of_sevres:0	"Rache für den Vertrag von Sèvres"
TUR_avenge_the_treaty_of_sevres_desc:0	"[FRA.GetNameDefCap] dachten, sie könnten uns zerstören, als wir am schwächsten waren. Sie wollten uns ausbeuten, uns entwaffnen und spalten. Wir werden ihnen genau das antun, was sie uns antun wollten."
TUR_strike_at_the_fascist_menace:0	"Beseitigen Sie die faschistische Bedrohung"
TUR_strike_at_the_fascist_menace_desc:0	"Der Faschismus ist eine zu gefährliche Ideologie, als dass wir ihn in unserem Hinterhof wuchern lassen könnten. Wie lange wird es dauern, bis unser eigenes Volk vom Faschismus infiziert ist? Wir müssen die Faschisten zerschlagen und damit ihrer Bewegung jegliche Legitimität nehmen."
TUR_learning_from_the_tripolitanian_war:0	"Lehren aus dem Tripolitanischen Krieg"
TUR_learning_from_the_tripolitanian_war_desc:0	"Die Kette von Ereignissen, die den Zusammenbruch des Osmanischen Reiches auslöste, geschah so schnell, dass kaum Zeit blieb, über die Lehren daraus nachzudenken. Wir sollten aus unseren Fehlern lernen, als die [ITA.GetAdjective]s in das osmanische Libyen eindrangen und es uns entrissen."
TUR_stop_the_stalinist_charade:0	"Stoppen Sie die stalinistische Scharade"
TUR_stop_the_stalinist_charade_desc:0	"Die wahre Revolution muss dorthin zurückgebracht werden, wo sie herkommt. Irgendwo auf dem Weg hat [SOV.GetNameDef] seinen Zweck und seinen Geist aus den Augen verloren. Wir müssen ihnen helfen, ihren verlorenen Idealismus zurückzugewinnen."
TUR_strike_the_british_imperialists:0	"Schlagt die britischen Imperialisten"
TUR_strike_the_british_imperialists_desc:0	"Die Welt kann sich niemals wirklich verändern, solange [ENG.GetNameDef] noch so existiert, wie sie ist. Wir müssen sie zerschlagen und ihr bedauernswertes Imperium zerstören."
TUR_foreign_brigades_for_the_revolution:0	"Auslandsbrigaden für die Revolution"
TUR_foreign_brigades_for_the_revolution_desc:0	"Der Marxismus ist ein grundlegend internationalistisches Glaubensbekenntnis und so ist es nur natürlich, dass Revolutionäre aus der ganzen Welt in unser Land strömen, um in unserem gemeinsamen globalen Kampf zu kämpfen."
TUR_joint_caucasian_turkish_officer_school:0	"Gemeinsame kaukasisch-türkische Offiziersschule"
TUR_joint_caucasian_turkish_officer_school_desc:0	"Kars ist eine Stadt mit einer bewegten Geschichte, und ihre Nähe zu [SOV.GetNameDef] macht sie zum idealen Standort für die Einrichtung einer neuen politisierten Offiziersschule. Unsere Offiziere werden nicht nur in den Grundlagen der Kriegsführung unterrichtet, sondern auch in den Feinheiten der marxistischen Doktrin."
TUR_lift_the_turkiye_komunist_partisis_exile:0	"Das Exil der Türkiye Komünist Partisi aufheben"
TUR_lift_the_turkiye_komunist_partisis_exile_desc:0	"Viele Mitglieder der Türkischen Kommunistischen Partei leben noch immer im Exil in [SOV.GetNameDef] oder versteckt in Europa in geheimen Zellen. Wir stimmen vielleicht nicht mit allem überein, was die TKP zu sagen hat, aber wir bleiben Genossen im gleichen Klassenbefreiungskampf. Es ist an der Zeit, sie nach Hause zu holen."
TUR_reconciling_kemalism_with_bolshevism:0	"Den Kemalismus mit dem Bolschewismus versöhnen"
TUR_reconciling_kemalism_with_bolshevism_desc:0	"[SOV.GetLeader] muss als eine der entscheidenden ideologischen Figuren hinzugefügt werden, die unsere Ideologie definieren. Wie wir einen solchen ideologischen Wandel auf saubere Weise vollziehen können, ist ein Rätsel, aber wer wird uns darauf aufmerksam machen?"
TUR_the_turkish_tank_project:0	"Das türkische Panzerprojekt"
TUR_the_turkish_tank_project_desc:0	"Der Panzer ist die Waffe der Zukunft, und der Kommunismus ist das Glaubensbekenntnis der Zukunft. Die beiden gehören zusammen wie çiğ köfte und rakı!"
TUR_scrapping_our_debts:0	"Abwracken unserer Schulden"
TUR_scrapping_our_debts_desc:0	"Unsere Nation fast von Grund auf aufzubauen war eine kostspielige Angelegenheit, und wir werden dankbar sein für die Wohltätigkeit von Nationen, die reicher sind als wir, die uns bei unserem Aufstieg zum nationalen Fortschritt unterstützt haben. Wir haben uns jedoch so weit von denen entfernt, die glaubten, uns mit dem Geldbeutel kontrollieren zu können, dass wir keine andere Wahl haben, als uns von all unseren Schulden zu trennen."
TUR_collectivising_our_agriculture:0	"Kollektivierung unserer Landwirtschaft"
TUR_collectivising_our_agriculture_desc:0	"Die Landwirtschaft ist ein sehr wichtiger Bereich in [ROOT.GetNameDef], und diejenigen, die die Erde bearbeiten, können nicht länger von denen ausgebeutet werden, die sie für Profit melken wollen. Von nun an legt der Bauer seinen Lohn selbst fest und kontrolliert seine Produktionsmittel selbst."
TUR_capitalise_on_rising_kurdish_nationalism:0	"Profitieren Sie vom aufkommenden kurdischen Nationalismus"
TUR_capitalise_on_rising_kurdish_nationalism_desc:0	"Wir haben Grund zu der Annahme, dass Kurden außerhalb unserer Nation sich verschwören, um innerhalb unserer eigenen Grenzen fehlgeleitete Terrorakte zu begehen. Sie verstehen nicht, dass durch den Kommunismus der kurdische Arbeiter befreit wurde. Wir werden auch die fehlgeleiteten Proleten im Ausland befreien."
TUR_issue_an_ultimatium_to_the_bulgarians:0	"Richten Sie ein Ultimatium an die Bulgaren"
TUR_issue_an_ultimatium_to_the_bulgarians_desc:0	"Hat es jemals eine üblere Nation gegeben als [BUL.GetNameDef]? Wieder und wieder haben sie das Gleichgewicht auf dem Balkan gestört, nur um ihre eigenen egoistischen, irredentistischen Wahnvorstellungen zu erfüllen. Wir werden sie beherrschen, und dabei werden wir den [BUL.GetAdjective] Arbeiter befreien - auch wenn er es nicht wirklich verdient."
TUR_learning_from_the_great_war:0	"Lehren aus dem Großen Krieg"
TUR_learning_from_the_great_war_desc:0	"Auch wenn unsere Armeen aus dem Befreiungskrieg gegen die Entente und die Osmanen siegreich hervorgegangen sind, hat unsere Nation den Preis für die Freiheit mit Blut bezahlt. Wir dürfen nie wieder zulassen, dass unser Land von einer Katastrophe von solch verheerendem Ausmaß heimgesucht wird. Wir müssen aus unseren Fehlern der Vergangenheit lernen und unsere Siege studieren."
TUR_modernising_the_army:0	"Die Modernisierung der Armee"
TUR_modernising_the_army_desc:0	"Wir sind bei den technologischen Innovationen in der Kriegsführung ins Hintertreffen geraten. Um eine Wiederholung des Blutvergießens der Vergangenheit zu vermeiden, müssen wir unsere Taktik und unsere Ausrüstung rasch modernisieren."
TUR_hava_okulu:0	"Hava Okulu"
TUR_hava_okulu_desc:0	"Wir sind stolz darauf, eine so alte und ehrwürdige Akademie zu haben, die sich der militärischen und zivilen Luftfahrt widmet. Wir sollten uns stärker auf unsere Luftkriegsführung konzentrieren."
TUR_expand_the_air_bases:0	"Erweitern Sie die Luftwaffenstützpunkte"
TUR_expand_the_air_bases_desc:0	"Unsere Nation ist sehr groß und es ist wichtig, dass unsere Luftwaffe in der Lage ist, jeden Zentimeter des [ROOT.GetAdjective] Territoriums abzudecken."
TUR_mechanising_our_army:0	"Mechanisierung unserer Armee"
TUR_mechanising_our_army_desc:0	"Es ist ein ehrgeiziges Ziel, aber eines, das aus der Notwendigkeit heraus verfolgt wird. Früher oder später werden alle Armeen mechanisiert sein. Wir müssen nur entscheiden, ob wir bereit sind, eine solche Anstrengung jetzt zu unternehmen, oder ob wir warten, bis sie in der Zukunft praktikabler wird."
TUR_embrace_military_tradition:0	"Umfassen Sie die militärische Tradition"
TUR_embrace_military_tradition_desc:0	"Das Osmanische Reich bedrohte einst den gesamten europäischen Kontinent. Sicher, es wurden einige Fehler gemacht - aber wenn wir uns auf die Vergangenheit besinnen, haben wir vielleicht wieder eine Armee, die bis vor die Tore Wiens und darüber hinaus marschieren kann."
TUR_the_kirikkale_tank:0	"Der Kırıkkale-Panzer"
TUR_the_kirikkale_tank_desc:0	"Wir haben uns zu sehr auf die ausländischen Konstruktionen von gepanzerten Fahrzeugen verlassen. Wir werden unseren eigenen [ROOT.GetAdjective]-Panzer entwerfen - den Kırıkkale-Panzer!"
TUR_superiority_of_arms:0	"Überlegenheit der Waffen"
TUR_superiority_of_arms_desc:0	"Warum Männer auf ein Problem hetzen, wenn Kugeln und Granaten viel entbehrlicher sind? Wir müssen uns stärker bemühen, das Leben unserer Soldaten durch den Einsatz überwältigender Feuerkraft zu retten."
TUR_utilising_our_terrain:0	"Unser Terrain ausnutzen"
TUR_utilising_our_terrain_desc:0	"Anatolien ist der Traum eines jeden Verteidigers und der schlimmste Albtraum eines jeden Angreifers. Wir kennen unser Land und sollten trainieren, die natürlichen Verteidigungsmöglichkeiten unseres Landes zu nutzen, um jede Invasion zu einer hart umkämpften Schlacht zu machen."
TUR_construct_the_cakmak_line:0	"Bauen Sie die Çakmak-Linie auf"
TUR_construct_the_cakmak_line_desc:0	"Feldmarschall Fevzi Çakmak hat vorgeschlagen, eine Verteidigungslinie mit Befestigungsanlagen um Edirne und die Meerenge am Bosporus zu bauen. Auch wenn es unter den Beamten einige Bedenken gab, das Projekt weiterzuverfolgen, überwiegen letztendlich die Vorteile die Kosten und es ist an der Zeit, dass wir mit dem Bau der Festungslinie beginnen."
TUR_accelerate_native_fighter_designs:0	"Beschleunigen Sie die Entwicklung einheimischer Kampfflugzeuge"
TUR_accelerate_native_fighter_designs_desc:0	"Unsere Luftfahrtindustrie ist alt und angesehen, aber nur wenige ausgesprochene [ROOT.GetAdjective] Flugzeugdesigns haben die Standards für die Produktion erfüllt. Wir müssen daran arbeiten, das zu ändern."
TUR_patrol_the_seas:0	"Patrouillieren Sie die Meere"
TUR_patrol_the_seas_desc:0	"Unser Meer ist unsere natürliche Barriere gegen Invasionen und wir müssen es genauso schützen wie eine Landgrenze."
TUR_invoke_the_methods_of_mehmed_ii:0	"Berufen Sie sich auf die Methoden von Mehmed II."
TUR_invoke_the_methods_of_mehmed_ii_desc:0	"Von Mehmed II. haben wir gelernt, dass, wenn ein Problem unüberwindbar scheint, eine große Kanone in der Regel eine sehr brauchbare Lösung darstellt."
TUR_turkish_air_defense_platforms:0	"Türkische Luftverteidigungsplattformen"
TUR_turkish_air_defense_platforms_desc:0	"Wir müssen daran arbeiten, unseren Luftraum im Falle eines Luftangriffs von den Meeren oder von einem unserer Nachbargebiete aus zu verteidigen."
TUR_expand_the_golcuk_naval_base:0	"Den Marinestützpunkt Gölcük ausbauen"
TUR_expand_the_golcuk_naval_base_desc:0	"Durch den Ausbau des Marinestützpunktes Gölcük werden wir in der Lage sein, unsere strategischen Ziele in der Meerenge und der Ägäis zu unterstützen."
TUR_relocate_from_yildiz_palace:0	"Verlegung des Yıldız-Palastes"
TUR_relocate_from_yildiz_palace_desc:0	"Wir haben unsere maritimen Bemühungen viel zu lange auf Çanakkale und die Meerenge konzentriert. Es ist an der Zeit, unsere Pläne zum Ausbau des Hafens von Mersin endlich in die Tat umzusetzen."
TUR_the_legacy_of_osmanli_donanmasi:0	"Das Vermächtnis der Osmanlı Donanması"
TUR_the_legacy_of_osmanli_donanmasi_desc:0	"Die osmanische Flotte war wirklich beeindruckend, und wenn es wenigstens eine Sache gibt, die es wert ist, um das gefallene Reich zu trauern, dann ist es die berühmte Marine, die es führte. Wir können dieses Erbe heute mit einer moderneren Flotte ehren."
TUR_the_path_of_the_wolf:0	"Der Weg des Wolfes"
TUR_the_path_of_the_wolf_desc:0	"Wie der Wolf müssen wir immer auf der Pirsch sein. Wir müssen uns bedeckt halten und angreifen, wenn unser Feind es am wenigsten erwartet. Wir haben die Mentalität der Wölfe, und das U-Boot ist das perfekte Werkzeug, um diese Mentalität auszuüben."
TUR_fortified_defensive_bases:0	"Befestigte Verteidigungsbasen"
TUR_fortified_defensive_bases_desc:0	"Man sagt, dass eine gute Verteidigung die beste Offensive ist, und wir widersprechen dem offiziell nicht!"
TUR_turk_silahli_kuvvetleri:0	"Türk Silahlı Kuvvetleri"
TUR_turk_silahli_kuvvetleri_desc:0	"Unsere Streitkräfte sind wirklich modern geworden und sind nicht mehr der Schatten, zu dem sie nach dem schrecklichen Unabhängigkeitskrieg geworden waren. In unserem derzeitigen Zustand könnten wir es mit der Welt aufnehmen. Wir sollten stolz darauf sein, wie weit wir gekommen sind."
TUR_misak_i_milli:0	"Misak-ı Millî"
TUR_misak_i_milli_desc:0	"Misak-ı Millî - der Nationalschwur. Nach dem Zusammenbruch des Osmanischen Reiches und dem Ende des Unabhängigkeitskrieges haben wir freiwillig einen großen Teil des von uns gehaltenen Territoriums aufgegeben und unsere Ansprüche auf das Gebiet fallen gelassen. Die Welt ist jetzt eine andere und die Menschen in diesen Gebieten fordern lautstark unsere Rückkehr. Wir werden ihnen gehorchen."
TUR_alienate_our_allies_tt:0	"\n§Unsere radikale Wende in der Außenpolitik könnte uns von unseren Verbündeten entfremden, insbesondere wenn wir anfangen, sie ins Visier zu nehmen."
TUR_recover_the_kardzhali_vilayet:0	"Rückeroberung des Kardzhali Vilayet"
TUR_recover_the_kardzhali_vilayet_desc:0	"Die verachtenswerten [BUL.GetAdjective] sind uns schon zu lange ein Dorn im Auge. Sie können es leugnen, so viel sie wollen, aber das türkische Volk, das in seinem bösartigen Rumpfstaat gefangen ist und unterdrückt wird, schreit nach Befreiung. Wir haben nicht die Absicht, sie noch länger warten zu lassen."
TUR_cypriot_and_oniki_ilhak:0	"Zypriot und Oniki Ilhak"
TUR_cypriot_and_oniki_ilhak_desc:0	"Die [GRE.GetAdjective]s können nach Enosis schreien, so viel sie wollen; wir werden sie mit unserem eigenen Ilhak in ihrem eigenen Spiel schlagen. Zypern und Rhodos gehören rechtmäßig uns, und wenn wir sie wieder in die Hand nehmen, werden wir sie nie wieder loslassen."
TUR_reuniting_thrace_through_force:0	"Thrakien mit Gewalt wiedervereinigen"
TUR_reuniting_thrace_through_force_desc:0	"Es gibt immer noch eine beträchtliche [ROOT.GetAdjective] Bevölkerung in Thrakien. Wir halten den größten Teil davon in Edirne, aber die [GRE.GetAdjective] bestehen darauf, das Gebiet geteilt zu halten. Wir müssen jetzt auf das Gegenteil bestehen."
TUR_rebuke_the_treaty_of_kars:0	"Rügen Sie den Vertrag von Kars"
TUR_rebuke_the_treaty_of_kars_desc:0	"Der Vertrag von Kars sollte die Grenzen zwischen [ROOT.GetNameDef] und dem Kaukasus beseitigen, aber wie kann ein solcher Vertrag Bestand haben, wenn das Leben der türkischen Orte in dieser verfluchten Region auf dem Spiel steht? Wir werden mit Zähnen und Klauen kämpfen, um unsere Verwandten zu retten."
TUR_unite_the_azeri_diaspora:0	"Vereinigen Sie die aserbaidschanische Diaspora"
TUR_unite_the_azeri_diaspora_desc:0	"Es ist unsere feierliche Pflicht, alle Turkvölker der Welt unter einer Nation zu vereinen, und bis wir unsere aserbaidschanischen Brüder im Ausland befreit haben, ist unsere Mission noch nicht beendet."
TUR_konfederasyon:0	"Konfederasyon"
TUR_konfederasyon_desc:0	"Wir hatten schon immer eine große Verbundenheit mit dem Volk von Aserbaidschan, und es wäre ein absolutes Privileg, dem aserbaidschanischen Volk die gleiche Staatsbürgerschaft in unserem schönen Zusammenschluss von Turkvölkern zu gewähren."
TUR_annul_the_ankara_anlasmasi:0	"Annullieren Sie das Ankara Anlaşması"
TUR_annul_the_ankara_anlasmasi_desc:0	"1926 wurde die Mosul-Frage scheinbar gelöst - aber wie bei allen Krisen dieser Zeit war das Ergebnis unbestreitbar zugunsten der [ENG.GetAdjective] und der [FRA.GetAdjective]. Wir werden die Notlage der [IRQ.GetAdjective] Türken nicht länger ignorieren. Die Zeit zum Handeln ist gekommen."
TUR_liberate_the_kurdish_diaspora:0	"Befreien Sie die kurdische Diaspora"
TUR_liberate_the_kurdish_diaspora_desc:0	"Die Schicksale des türkischen und des kurdischen Volkes sind miteinander verwoben, und wenn wir nicht alle gemeinsam an einem Strang ziehen, dann ist die Geschichte dazu verdammt, sich bis in alle Ewigkeit zu wiederholen."
TUR_turanist_ambition:0	"Turanischer Ehrgeiz"
TUR_turanist_ambition_desc:0	"Wir haben den Willen, uns ein mächtiges Imperium zu schaffen, aber wir riskieren, den Zorn der noch bestehenden Großmächte auf uns zu ziehen. Sie werden versuchen, uns zu behindern, aber wenn Eurasien erst einmal unter unserer Kontrolle ist, werden sie nichts mehr tun können, um uns aufzuhalten."
TUR_subdue_the_magyars:0	"Unterwerfen Sie die Magyaren"
TUR_subdue_the_magyars_desc:0	"Sie mögen denken, dass sie sich nach Jahrhunderten unter der Fuchtel der Österreicher weit von ihren Wurzeln entfernt haben, aber wir sehen den Ungarn als das, was er wirklich ist. Er ist ein Türke, der es leugnet; ein Wolf, der sich für einen Falken hält. Wir werden die Magyaren an ihr Erbe erinnern."
TUR_cin_turkleri:0	"Çin Türkleri"
TUR_cin_turkleri_desc:0	"Ohne die Solidarität der Türken im Ausland werden die Türken in China immer unterdrückt werden. Es ist unsere Aufgabe, die Türken in China von denen zu befreien und zu schützen, die ihnen ihr Erbe vorenthalten wollen."
TUR_crowning_ourselves_with_the_fin_ugor:0	"Wir krönen uns selbst mit dem Fin-Ugor"
TUR_crowning_ourselves_with_the_fin_ugor_desc:0	"Es gibt kein schöneres Juwel in der turanistischen Krone als [FIN.GetNameDef]. Die Eroberung des [FIN.GetAdjective] ist die Summe der ultimativen Ambition, und wir haben die feste Absicht, diese Ambition zu erfüllen und unsere turanistische Bruderschaft zu vervollständigen."
BUL_acquire_modern_tools:0	"Erwerben Sie moderne Werkzeuge"
BUL_acquire_modern_tools_desc:0	"Die bulgarische Industrie besteht hauptsächlich aus altmodischen, kleinen Produktionsbetrieben und Handwerksbetrieben. Wir brauchen die entsprechenden Werkzeuge, um die Grundlagen einer modernen Industrie aufzubauen und zu entwickeln."
BUL_improve_the_road_system:0	"Verbessern Sie das Straßennetz"
BUL_improve_the_road_system_desc:0	"Das bulgarische Straßennetz ist, gelinde gesagt, absolut unterentwickelt, was die Kommunikation schwierig und langsam macht. Die Entwicklung einer modernen Infrastrukturindustrie, die in der Lage ist, unser derzeitiges Straßennetz zu verbessern und zu erweitern, wird den Weg zur Lösung unserer Transportprobleme ebnen."
BUL_attract_foreign_capitals:0	"Ausländische Hauptstädte anlocken"
BUL_attract_foreign_capitals_desc:0	"Uns fehlen die Mittel, um aus eigener Kraft eine leistungsfähige und effiziente Industrie aufzubauen. Deshalb ist es am besten, wenn wir uns an ausländische Investoren wenden, die bereit sind, ihr Geschäft zu erweitern und in Bulgarien tätig zu werden."
BUL_attract_foreign_capitals_dynamic_modifier_tt:0	"Gewinnen Sie Nationalgeist §YForeign Industry§!, der Ihnen (Politischer Machtgewinn: §G+5%§!, Baugeschwindigkeit: §R-10%§!, Fabrikproduktion: §R-2%§!, £GFX_prod_eff_cap Produktionseffizienz-Obergrenze: §R-5%§!, £GFX_prod_eff Wachstum der Produktionseffizienz: §R-5%§!)"
BUL_invigorate_national_industry:0	"Belebung der nationalen Industrie"
BUL_invigorate_national_industry_desc:0	"Wir haben uns schon viel zu lange auf ausländisches Kapital verlassen, um unsere Infrastruktur, Industrie und Landwirtschaft zu entwickeln. Wenn wir Autarkie und die Freiheit anstreben, unser Land auf unsere eigene Weise zu entwickeln, müssen wir damit beginnen, in die nationale Industrie und die Entwicklung neuer Anlagen zu investieren. Das wird keine leichte Aufgabe sein, aber auf lange Sicht wird es die Mühe auf jeden Fall wert sein."
BUL_expand_sofia_university:0	"Erweitern Sie die Universität Sofia"
BUL_expand_sofia_university_desc:0	"Indem wir einen Teil unseres Budgets für die Finanzierung des Ausbaus der Einrichtungen der Universität Sofia, der angesehensten Hochschuleinrichtung Bulgariens, bereitstellen, werden wir unseren Pool an brillanten Köpfen vergrößern, von denen wir reichlich Gebrauch machen werden."
BUL_expand_the_tobacco_industry:0	"Die Tabakindustrie ausbauen"
BUL_expand_the_tobacco_industry_desc:0	"Jahrzehntelang war unsere landwirtschaftliche Produktion unser Hauptexportgut, aber es ist klar, dass wir die Gewinne aus diesen Exporten noch steigern können, wenn wir von der Getreideproduktion auf wertvollere Kulturen wie Tabak umsteigen."
BUL_nationalization:0	"Verstaatlichung"
BUL_nationalization_desc:0	"Ausländisches Kapital hat es uns ermöglicht, in Bulgarien neue Industriekomplexe in einer Größenordnung zu entwickeln, die es auf dem Balkan noch nie gegeben hat. Aber die Magnaten, denen sie gehören, saugen unsere Wirtschaft immer mehr aus. Es ist also an der Zeit, dass wir ihre Produktionsmittel beschlagnahmen und sie aus unserem Land vertreiben. Dies wird jedoch ausländische Regierungen verärgern, und wenn die Diplomatie versagt, werden wir vielleicht darum kämpfen müssen..."
BUL_nationalization_dynamic_modifier_tt:0	"Remove National Spirit §YForeign Industry§!"
BUL_nationalization_warning_tt:0	"§AAls Folge der Verstaatlichung könnten ausländische Länder, die in die bulgarische Industrie investiert haben, beschließen, ein Handelsembargo gegen unser Land zu verhängen, uns aus der Fraktion zu werfen oder uns sogar den Krieg zu erklären!§!"
BUL_increase_industry_investments:0	"Investitionen in die Industrie erhöhen"
BUL_increase_industry_investments_desc:0	"Wir müssen eine Schwerindustrie entwickeln, die in der Lage ist, unser großes industrielles und militärisches Wachstum zu unterstützen. Das wird große nationale Investitionen erfordern, aber das wird uns unserer endgültigen wirtschaftlichen Unabhängigkeit näher bringen."
BUL_utmost_optimization:0	"Äußerste Optimierung"
BUL_utmost_optimization_desc:0	"Indem wir der Entwicklung unserer nationalen Industrie Priorität eingeräumt haben, haben wir einen nachhaltigen Produktionsanstieg erlebt und viele neue Industrien haben sich schnell entwickelt, obwohl sie noch nicht sehr effizient sind. Es ist an der Zeit, die letzte Anstrengung zu unternehmen und eine umfassende Neuordnung der Industrie und des Bodens vorzunehmen, die es uns ermöglichen wird, sowohl in der Industrie als auch in der Landwirtschaft ein Höchstmaß an Effizienz zu erreichen."
BUL_utmost_optimization_dynamic_modifier_tt:0	"Ändern Sie §YForeign Industry§! um\nBaugeschwindigkeit: §G+5%§!\n£GFX_prod_eff_cap Produktionseffizienz-Obergrenze: §G+3%§!\n£GFX_prod_eff Wachstum der Produktionseffizienz: §G+3%§!"
BUL_utmost_optimization_tt:0	"Die Auswirkungen werden sich ändern, wenn der Fokus §YAttract Foreign Capitals§! abgeschlossen ist."
BUL_national_railway_lines:0	"Nationale Eisenbahnlinien"
BUL_national_railway_lines_desc:0	"Wir brauchen schnelle und zuverlässige Wege, um nicht nur unsere Truppen, sondern auch unseren Nachschub durch das Land zu transportieren. Der Ausbau unserer Eisenbahnlinien wird unsere logistischen Möglichkeiten verbessern."
BUL_all_that_glitters:0	"Alles, was glänzt"
BUL_all_that_glitters_desc:0	"Die Goldvorkommen in Chelopech könnten unserer Wirtschaft in einer Zeit, in der Investitionen in immaterielle Werte stark gefährdet sind, gute Dienste leisten. Der Effekt auf unsere nationalen Reserven dürfte spürbar sein."
BUL_light_metal_exploitation:0	"Ausbeutung von Leichtmetallen"
BUL_light_metal_exploitation_desc:0	"Da unsere Militärindustrie unsere natürlichen Ressourcen stark beansprucht, müssen wir uns bemühen, die heimische Produktion auszuweiten. Unsere Vorkommen sind zwar noch klein, aber in dieser Zeit der Not ist ihre Ausbeutung sicherlich geboten."
BUL_steel_plant_in_pernik:0	"Stahlwerk in Pernik"
BUL_steel_plant_in_pernik_desc:0	"Bulgarien ist nicht das rohstoffreichste Land auf dem Balkan, und deshalb müssen wir das Beste aus den Schätzen herausholen, die unser Boden birgt. Wir müssen unsere Eisenwerke und Kohleförderungsanlagen in Pernik verbessern und dort unser erstes Stahlwerk bauen."
BUL_mineral_extraction_in_the_rhodopes:0	"Mineralienabbau in den Rhodopen"
BUL_mineral_extraction_in_the_rhodopes_desc:0	"Die Rhodopen sind reich an Mineralien wie Chromit, Eisenerz, Zink und Blei, und unsere Experten sind optimistisch, dass eine angemessene Erkundung des Gebiets zur Entdeckung neuer Vorkommen führen kann."
BUL_uranium_prospecting:0	"Uran Prospektion"
BUL_uranium_prospecting_desc:0	"Uran wird zu einer äußerst wertvollen Ressource für die Herstellung neuer, leistungsstarker und verheerender Waffen, und wir haben in Buhovo potenziell reiche Vorkommen entdeckt. Wir müssen das Gebiet untersuchen und abwägen, ob es für uns vorteilhafter ist, die Ressource selbst zu nutzen oder unseren Verbündeten Nutzungsrechte zu gewähren."
BUL_uranium_prospecting_no_target_tt:0	"Schaltet die Entscheidung frei: §YUran-Konzessionsvereinbarung§!, das dem bulgarischen Fraktionsführer oder einem wichtigen Verbündeten Boni gewährt. §AErfordert die Mitgliedschaft Bulgariens in einer Fraktion§!."
BUL_uranium_prospecting_leader_target_tt:0	"Schaltet die Entscheidung frei: §YUran-Konzessionsvereinbarung§!, gewährt Boni für den bulgarischen Fraktionsführer."
BUL_uranium_prospecting_major_ally_target_tt:0	"Schaltet die Entscheidung frei: §YUran-Konzessionsvereinbarung§!, gewährt Boni für bulgarische Hauptverbündete."
BUL_georgi_benkovski_aircraft_repair_facilities:0	"Georgi Benkovski Flugzeugreparaturwerkstatt"
BUL_georgi_benkovski_aircraft_repair_facilities_desc:0	"Für den Aufbau einer nationalen Luftwaffe ist der Bau von Flugzeugreparaturhallen und Triebwerkstestanlagen erforderlich. In diesem Zusammenhang wurde uns ein interessantes Projekt zur Errichtung der Terem Georgi Benkovski Flugzeugreparaturwerkstatt in Plovdiv vorgestellt."
BUL_pilot_training_program:0	"Programm zur Pilotenausbildung"
BUL_pilot_training_program_desc:0	"Wenn Bulgarien den Luftraum beherrschen soll, brauchen wir einen großen Pool an erfahrenen Piloten und Besatzungsmitgliedern. Um das zu erreichen, müssen wir ein optimales Ausbildungsprogramm entwickeln, das durch die notwendigen Luftwaffenstützpunkte und Ausbildungseinrichtungen unterstützt wird."
BUL_negotiate_bulgarian_rearmament:0	"Verhandeln Sie über die bulgarische Wiederbewaffnung"
BUL_negotiate_bulgarian_rearmament_desc:0	"Die bulgarische Armee befindet sich aufgrund der Beschränkungen des Vertrags von Neuilly-sur-Seine in einem erbärmlichen Zustand, und wir sind einer Invasion aus einem der angrenzenden Länder nahezu schutzlos ausgeliefert. Wir müssen die Aufhebung dieser Beschränkungen eher früher als später aushandeln, damit unsere gierigen Nachbarn nicht einen weiteren Balkankrieg anzetteln."
BUL_reorganize_the_military_industry:0	"Reorganisieren Sie die Militärindustrie"
BUL_reorganize_the_military_industry_desc:0	"Unsere Militärindustrie ist veraltet und ineffizient und darauf ausgelegt, veraltete Ausrüstung zu produzieren. Wir müssen ein Modernisierungsprogramm durchführen, bevor es zu spät ist."
BUL_darzhavna_aeroplanna_rabotilnitsa:0	"Darzhavna Aeroplanna Rabotilnitsa"
BUL_darzhavna_aeroplanna_rabotilnitsa_desc:0	"Wir sollten uns nicht auf ausländische Konstrukteure verlassen, um unsere Luftwaffe mit den benötigten Flugzeugen zu versorgen. Wir werden die Einrichtungen unserer staatlichen Flugzeugwerkstatt in Bozhurishte umfassend erweitern und modernisieren."
BUL_darzhavna_samoletna_fabrika:0	"Darzhavna Samoletna Fabrika"
BUL_darzhavna_samoletna_fabrika_desc:0	"Die DAR-Einrichtungen in Bozhurishte produzieren bereits bulgarische Kampfflugzeuge für unsere Luftwaffe. Jetzt können wir in den Aufbau einer staatlichen Flugzeugfabrik in Lovech investieren, die über moderne Anlagen verfügt und sich auf die Produktion anderer Leichtflugzeuge konzentrieren wird."
BUL_foreign_aircraft_designers:0	"Ausländische Flugzeugkonstrukteure"
BUL_foreign_aircraft_designers_desc:0	"Warum sollten wir Zeit und Mühe darauf verschwenden, eine nationale Luftfahrtindustrie aufzubauen, wenn wir einfach ausländische Konstrukteure mit jahrzehntelanger Erfahrung in der Produktion von Militärflugzeugen einstellen können?"
BUL_kaproni_bulgarski:0	"Kaproni Bulgarski"
BUL_kaproni_bulgarski_desc:0	"Die italienische Flugzeugbaufirma Caproni steht gerade vor dem Bankrott und kämpft damit, die fehlenden Ressourcen zu überwinden, die in andere Produktionsketten umgeleitet wurden. Dies eröffnet uns die Möglichkeit, seinen Industriekomplex in Kazanlak, Kaproni Bulgarski, zu erwerben, wo wir uns auf die Produktion von mittleren und schweren Bombern konzentrieren könnten."
BUL_darzhavna_voenna_fabrika:0	"Darzhavna Voenna Fabrika"
BUL_darzhavna_voenna_fabrika_desc:0	"Durch den Ausbau der Staatlichen Militärfabrik in Kazanlak können wir den Grundstein für eine geeignete nationale Militärindustrie legen, die in der Lage ist, unsere Armee mit hochwertiger Ausrüstung zu versorgen."
BUL_found_dvf_sopot:0	"Gründung der DVF Sopot"
BUL_found_dvf_sopot_desc:0	"Der Bau der Munitionsfabrik in Sopot wurde 1935 begonnen, ist aber noch nicht abgeschlossen. Wir müssen einen Vertrag über den Erwerb der restlichen Maschinen und Ausrüstungen abschließen, um den Komplex so schnell wie möglich in Betrieb zu nehmen."
BUL_contract_foreign_companies:0	"Vertrag mit ausländischen Unternehmen"
BUL_contract_foreign_companies_desc:0	"Unsere Rüstungsindustrie reicht bei weitem nicht aus, um ein angemessenes Aufrüstungsprogramm durchzuführen. Wir müssen uns im Ausland nach Konstrukteuren umsehen, die in der Lage sind, hochwertige Fahrzeuge für unsere Armee zu produzieren."
BUL_rebuild_the_army:0	"Bauen Sie die Armee wieder auf"
BUL_rebuild_the_army_desc:0	"Wir sind von potenziellen Feinden umgeben, wie uns die Geschichte eindringlich gelehrt hat, und es ist von entscheidender Bedeutung, dass wir eine schlagkräftige Armee aufbauen und moderne Taktiken entwickeln, wenn wir in einem künftigen Konflikt siegen wollen."
BUL_vasil_levsky_national_military_university:0	"Nationale Militäruniversität Vasil Levsky"
BUL_vasil_levsky_national_military_university_desc:0	"Die Nationale Militäruniversität kann auf eine lange Geschichte zurückblicken, aber ihre militärische Ausbildung wurde seit der Verhängung des Vertrags von Neuilly drastisch reduziert. Es ist an der Zeit, ein Projekt zu finanzieren, um ihre Einrichtungen zu erweitern und die Einschreibung neuer Kadetten zu fördern, die schließlich erfolgreiche Offiziere werden."
BUL_prussia_of_the_balkans:0	"Preußen auf dem Balkan"
BUL_national_military_academy:0	"Nationale Militärakademie"
BUL_national_military_academy_desc:0	"Der Leiter der Nationalen Militärakademie hat uns ein Projekt zur Erweiterung ihrer Einrichtungen vorgelegt, mit dem Ziel, nicht nur die Kapazität der Einrichtung zu erhöhen, sondern auch eine bessere Ausbildung für unsere zukünftigen militärischen Befehlshaber zu gewährleisten."
BUL_war_logistics:0	"Kriegslogistik"
BUL_war_logistics_desc:0	"Wir haben den Großen Krieg nicht aufgrund von Niederlagen auf dem Schlachtfeld verloren, sondern weil wir nicht in der Lage waren, unsere Bevölkerung zu ernähren und unsere Truppen zu versorgen. Wir müssen unsere Logistik verbessern, um zu verhindern, dass dies jemals wieder geschieht."
BUL_defensive_lines:0	"Verteidigungslinien"
BUL_defensive_lines_desc:0	"Wir müssen mit dem Bau angemessener Befestigungen und der Verbesserung der Infrastruktur beginnen, um unsere Transportwege zu schützen und den Nachschub für unsere Truppen zu gewährleisten."
BUL_a_black_sea_fleet:0	"Eine Schwarzmeerflotte"
BUL_a_black_sea_fleet_desc:0	"Wenn wir eine gewisse Marinepräsenz haben wollen, müssen wir eine für das Schwarze Meer geeignete Flotte zusammenstellen und uns dabei auf den Bau von Zerstörern konzentrieren, denn sie sind das Rückgrat jeder modernen Flotte."
BUL_improve_coastal_defenses:0	"Verbesserung der Küstenverteidigung"
BUL_improve_coastal_defenses_desc:0	"Wir sind extrem verwundbar gegenüber einer möglichen Marine-Invasion vom Schwarzen Meer aus, daher müssen wir unbedingt unsere Verteidigungslinie entlang der Schwarzmeerküste verstärken. Je früher wir das tun, desto besser."
BUL_reinforce_naval_bases:0	"Marinestützpunkte verstärken"
BUL_reinforce_naval_bases_desc:0	"Wir müssen dafür sorgen, dass unsere Marinestützpunkte gut geschützt sind und die Kapazität haben, unsere in der Region operierenden Flotten zu unterhalten."
BUL_supremacy_on_the_bosporus:0	"Vorherrschaft am Bosporus"
BUL_supremacy_on_the_bosporus_desc:0	"Da wir nun die Kontrolle über die Bosporusstraße haben, müssen wir angemessene Befestigungen bauen, um die bulgarische Vorherrschaft in dieser strategisch wichtigen Region sicherzustellen."
BUL_dominance_in_the_black_sea:0	"Vorherrschaft im Schwarzen Meer"
BUL_dominance_in_the_black_sea_desc:0	"Dunkle Zeiten verlangen nach drastischen Maßnahmen. Um nicht nur die Integrität der bulgarischen Nation, sondern auch ihre Hegemonie zu garantieren, ist es an der Zeit, das Schwarze Meer zu sichern und alle möglichen Bedrohungen von seinen Ufern zu entfernen."
BUL_dominance_in_the_aegean_sea:0	"Vorherrschaft im Ägäischen Meer"
BUL_dominance_in_the_aegean_sea_desc:0	"[GetDominanceInTheAegeanDesc]"
BUL_dominance_in_the_aegean_default:0	"Dunkle Zeiten verlangen nach drastischen Maßnahmen. Um nicht nur die Integrität der bulgarischen Nation, sondern auch ihre Vorherrschaft in den Drei Meeren zu gewährleisten, ist es an der Zeit, die Ägäis zu sichern und alle möglichen Bedrohungen von ihren Küsten zu entfernen."
BUL_dominance_in_the_aegean_black_sea_success:0	"Nach unserem Erfolg bei der Sicherung des Schwarzen Meeres ist es nun an der Zeit, das Manöver in der Ägäis zu wiederholen. Wir werden jede feindliche Nation an ihren Küsten vertreiben und ihre wertvollen Gebiete für das Preußen des Balkans in Besitz nehmen."
BUL_dominance_in_the_aegean_black_sea_failure:0	"Der Schlag, den wir nach dem Scheitern unserer Mission, das Schwarze Meer zu sichern, erlitten haben, hat zu einer Verdüsterung der Stimmung in der bulgarischen Bevölkerung geführt, die nur dadurch gelöst werden kann, dass wir dieses Mal erfolgreich die bulgarische Vorherrschaft in der Ägäis sichern."
BUL_dominance_in_the_aegean_adriatic_success:0	"Nach unserem Erfolg bei der Sicherung der Adria ist die Moral der bulgarischen Truppen und auch der Zivilbevölkerung höher als je zuvor. Wir müssen den Schwung mitnehmen und die Ägäis sichern, damit das Preußen des Balkans zum alleinigen und unbestrittenen Hüter der drei Meere wird."
BUL_dominance_in_the_aegean_adriatic_failure:0	"Unser Versagen, die Adria zu sichern, hat der bulgarischen Moral einen schweren Schlag versetzt. Wenn wir Mut und Zuversicht zurückgewinnen wollen, müssen wir die bulgarische Vorherrschaft in der Ägäis sichern."
BUL_dominance_in_the_aegean_total_failure:0	"Die Schläge, die wir nach dem Scheitern bei der Sicherung der Adria und des Schwarzen Meeres erlitten haben, haben zu einer allgemeinen Welle der Demoralisierung und des Misstrauens gegenüber der Regierung im Lande geführt. Wenn wir unsere Fehler wiedergutmachen und dem Preußen des Balkans den Ruhm zurückgeben wollen, der ihm gebührt, müssen wir die bulgarische Vorherrschaft in der Ägäis sichern."
BUL_dominance_in_the_adriatic_sea:0	"Vorherrschaft in der Adria"
BUL_dominance_in_the_adriatic_sea_desc:0	"[GetDominanceInTheAdriaticDesc]"
BUL_dominance_in_the_adriatic_default:0	"Dunkle Zeiten verlangen nach drastischen Maßnahmen. Um nicht nur die Integrität der bulgarischen Nation, sondern auch ihre Vorherrschaft in den Drei Meeren zu gewährleisten, ist es an der Zeit, die Adria zu sichern und alle möglichen Bedrohungen von ihren Ufern zu entfernen."
BUL_dominance_in_the_adriatic_black_sea_success:0	"Nach unserem Erfolg bei der Sicherung des Schwarzen Meeres ist es nun an der Zeit, das Manöver in der Adria zu wiederholen. Wir werden jede feindliche Nation, die sich an ihren Ufern aufhält, vertreiben und ihre wertvollen Gebiete für das Preußen des Balkans einnehmen."
BUL_dominance_in_the_adriatic_black_sea_failure:0	"Der Schlag, den wir nach dem Scheitern unserer Mission, das Schwarze Meer zu sichern, erlitten haben, hat zu einer Verdüsterung der Stimmung in der bulgarischen Bevölkerung geführt, die nur dadurch gelöst werden kann, dass wir dieses Mal erfolgreich die bulgarische Vorherrschaft in der Adria sichern."
BUL_dominance_in_the_adriatic_aegean_success:0	"Nach unserem Erfolg bei der Sicherung der Ägäis ist die Moral der bulgarischen Truppen und auch der Zivilbevölkerung höher als je zuvor. Wir müssen den Schwung mitnehmen und die Adria sichern, damit das Preußen des Balkans der einzige und unbestrittene Hüter der drei Meere wird."
BUL_dominance_in_the_adriatic_aegean_failure:0	"Unser Versagen, die Ägäis zu sichern, hat der bulgarischen Moral einen schweren Schlag versetzt. Wenn wir Mut und Zuversicht zurückgewinnen wollen, müssen wir die bulgarische Vorherrschaft in der Adria sichern."
BUL_dominance_in_the_adriatic_total_failure:0	"Die Schläge, die wir nach dem Scheitern bei der Sicherung der Ägäis und des Schwarzen Meeres erlitten haben, haben zu einer allgemeinen Welle der Demoralisierung und des Misstrauens gegenüber der Regierung im Lande geführt. Wenn wir unsere Fehler wiedergutmachen und dem Preußen des Balkans den Ruhm zurückgeben wollen, der ihm gebührt, müssen wir die bulgarische Vorherrschaft in der Adria sichern."
BUL_bulgaria_on_the_three_seas:0	"Bulgarien an den drei Meeren"
BUL_bulgaria_on_the_three_seas_desc:0	"Wie in der Antike, während des Ersten und Zweiten Bulgarischen Reiches, werden die Küsten von [ROOT.GetNameDef] wieder von der Ägäis, der Adria und dem Schwarzen Meer umspült. Der nächste Schritt ist die Entwicklung der notwendigen Infrastruktur für den Aufbau einer starken Marine, die die bulgarische Vorherrschaft in den drei Meeren sichern kann."
BUL_national_submarine_production:0	"Nationale U-Boot-Produktion"
BUL_national_submarine_production_desc:0	"Unsere Marine ist zu schwach, um ausländische Flotten herauszufordern und die Vorherrschaft in den Meeren über der Oberfläche anzufechten. Wir können uns jedoch auf die Produktion von U-Booten konzentrieren, die feindliche Flotten bedrängen und ihre Schifffahrtsrouten aus der Unterwasserwelt heraus bedrohen."
BUL_bulgarian_shipping_chamber:0	"Die bulgarische Schifffahrtskammer"
BUL_bulgarian_shipping_chamber_desc:0	"Wir müssen die bulgarischen Reedereien und Genossenschaften mit den Mitteln ausstatten, die sie benötigen, um ihre Flotten kontinuierlich zu vergrößern, denn ihre Konvois sind für den Handel in Friedenszeiten, aber auch für den Transport von Truppen und Nachschub im Krieg von entscheidender Bedeutung."
BUL_strike_from_the_seas:0	"Von der See aus zuschlagen"
BUL_strike_from_the_seas_desc:0	"Entlang der Küsten des Mittelmeers und des Schwarzen Meeres gibt es unzählige Inseln und zahlreiche strategische Punkte. Daher brauchen wir eine solide Streitmacht mit ausreichenden Transportmitteln, die in der Lage sind, von der See aus anzugreifen und diese Schlüsselpositionen einzunehmen, von denen aus wir massive Offensiven starten können."
BUL_expand_varna_naval_base:0	"Marinestützpunkt Varna ausbauen"
BUL_expand_varna_naval_base_desc:0	"Wir müssen die Einrichtungen des Marinestützpunktes Varna ausbauen und die entsprechenden Werften für die Produktion von Kriegsschiffen errichten."
BUL_develop_burgas_shipyards:0	"Werften in Burgas ausbauen"
BUL_develop_burgas_shipyards_desc:0	"Um unsere Produktionskapazität für Kriegsschiffe zu erhöhen, werden wir in den Ausbau des Marinestützpunktes Burgas und den Bau neuer Werften in der Region investieren."
BUL_an_aegean_sea_fleet:0	"Eine Flotte im Ägäischen Meer"
BUL_an_aegean_sea_fleet_desc:0	"Jetzt, da wir in der Ägäis präsent sind, müssen wir die totale Dominanz über sie anstreben. Um dies zu erreichen, können wir uns nicht nur auf Zerstörer und U-Boote verlassen, sondern brauchen größere Tonnage-Schiffe in unserer Flotte."
BUL_a_powerful_bulgarian_navy:0	"Eine schlagkräftige bulgarische Marine"
BUL_a_powerful_bulgarian_navy_desc:0	"Wir müssen uns auf den Bau von großen Schiffen konzentrieren, die unseren Flotten die Feuerkraft verleihen, die ihnen derzeit fehlt. Wir haben vielleicht nicht die größte Flotte, aber wenn wir unsere Anstrengungen konzentrieren, können wir in der Lage sein, die Vorherrschaft über unsere Meere auch gegen große Seemächte zu behaupten."
BUL_modern_tactics:0	"Moderne Taktik"
BUL_modern_tactics_desc:0	"Eine moderne Marine erfordert die Entwicklung einer modernen Taktik, um das Beste aus ihr herauszuholen. Aber wir sollten uns nicht nur auf unsere Marine verlassen, wenn wir es mit mächtigen feindlichen Armeen zu tun haben, denn eine der größten Schwächen von Schiffen ist ihre Anfälligkeit für Luftangriffe..."
BUL_oppose_the_royal_dictatorship:0	"Widerstand gegen die königliche Diktatur"
BUL_oppose_the_royal_dictatorship_desc:0	"Wenn wir das unterdrückerische Regime von [GetBulgarianTsar] beenden wollen, müssen wir uns zunächst um die nötige Unterstützung bemühen, um einen bedeutenden Widerstand gegen die derzeitige Regierung zu leisten, die ausschließlich aus zaristischen Marionetten besteht."
BUL_appoint_communist_ministers:0	"Kommunistische Minister ernennen"
BUL_appoint_communist_ministers_desc:0	"Wir müssen Druck auf die bulgarische Regierung ausüben, damit sie Minister ernennt, die einen Kurswechsel gegenüber dem diktatorischen Regime des Zaren anstreben. Nur aus dem Inneren der Regierung heraus können wir das zaristische System zu Fall bringen."
BUL_the_spanish_struggle:0	"Der spanische Kampf"
BUL_the_spanish_struggle_desc:0	"Unsere spanischen Genossen stehen dem faschistischen Abschaum gegenüber, der dank der Unterstützung anderer rechter Kräfte in Europa ernsthaft droht, die republikanische Regierung zu besiegen. \nAngesichts solcher Gräueltaten kann [ROOT.GetNameDef] nicht wegschauen. Wir müssen Freiwilligenbrigaden organisieren, die Seite an Seite mit den spanischen Milizionären für die Verteidigung der Freiheit kämpfen werden."
BUL_overthrow_the_tsar:0	"Stürzen Sie den Zaren"
BUL_overthrow_the_tsar_desc:0	"Die antizaristische Stimmung breitet sich in Bulgarien aus und wir müssen diese wertvolle Gelegenheit nutzen, um [GetBulgarianTsar] zu stürzen und die bulgarische Monarchie ein für alle Mal abzuschaffen. Im modernen Bulgarien gibt es keinen Platz für eine solch veraltete Regierungsform!"
BUL_abolish_the_tarnovo_constitution:0	"Schaffen Sie die Tarnovo-Verfassung ab"
BUL_abolish_the_tarnovo_constitution_desc:0	"Die Tarnovo-Verfassung galt im letzten Jahrhundert als liberal und fortschrittlich, aber heute dient sie nur noch der Legitimation eines unterdrückerischen diktatorischen Regimes. Es ist an der Zeit, diese Verfassung abzuschaffen und eine neue zu schreiben, die auf dem Modell der sowjetischen Verfassung von 1936 basiert und Grundrechte wie die Gleichheit der Bürger vor dem Gesetz, Rede- und Versammlungsfreiheit und ein allgemeines Sozialsystem beinhaltet."
BUL_unify_the_bourgeois_movement:0	"Vereinigen Sie die bürgerliche Bewegung"
BUL_unify_the_bourgeois_movement_desc:0	"Wenn wir den Faschismus in Bulgarien bekämpfen wollen, müssen wir die bürgerliche Bewegung in einer gemeinsamen Bewegung vereinigen. Um dies zu erreichen, muss die Bulgarische Kommunistische Partei die Zusammenarbeit mit den Sozialisten suchen und die Unterschiede zwischen uns zum Wohle der Allgemeinheit hinter sich lassen."
BUL_united_front_against_fascism:0	"Vereinigte Front gegen den Faschismus"
BUL_united_front_against_fascism_desc:0	"Der nächste Schritt nach der Vereinigung der bürgerlichen Bewegung ist die Bildung eines antifaschistischen Blocks, eine Taktik, die vom 7. Kongress der Komintern im Jahr 1935 vorgeschlagen wurde. Wir müssen an die Landwirte und sogar an die Demokraten appellieren, sich unserer Front gegen den bulgarischen Faschismus anzuschließen."
BUL_the_fatherland_front:0	"Die Vaterländische Front"
BUL_the_fatherland_front_desc:0	"Nachdem wir die Unterstützung zahlreicher politischer Gruppen gewonnen haben, ist es an der Zeit, dass unsere antifaschistische Front zu einer eigenständigen politischen Bewegung wird, die die Mitglieder all dieser verschiedenen politischen Organisationen in einer einzigen Partei vereint, die entschlossen ist, dem Faschismus in Bulgarien um jeden Preis zu widerstehen."
BUL_full_voting_rights_for_women:0	"Volles Wahlrecht für Frauen"
BUL_full_voting_rights_for_women_desc:0	"Wenn wir wollen, dass in unserem Land Freiheit, Gleichheit und Fortschritt herrschen, ist es an der Zeit, den Frauen das volle Wahlrecht zu gewähren und die Union der bulgarischen Frauen bei ihrer Aufgabe zu unterstützen, das gesellschaftliche Bewusstsein für Frauenfragen in [ROOT.GetNameDef] zu schärfen."
BUL_the_peoples_republic_of_bulgaria:0	"Die Volksrepublik Bulgarien"
BUL_the_peoples_republic_of_bulgaria_desc:0	"Jetzt, da wir die bulgarische Monarchie losgeworden sind, müssen wir einige dringend benötigte Änderungen in der Regierungsführung unseres Landes vornehmen. Es ist an der Zeit, die Ära des Despotismus und der Unterdrückung zu beenden, die das Land so viele Jahre lang geplagt hat, und die Volksrepublik Bulgarien zu gründen. \nEinheit macht stark!"
BUL_soviet_bulgarian_treaty_of_mutual_assistance:0	"Sowjetisch-bulgarischer Vertrag über gegenseitigen Beistand"
BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc:1	"Die [SOU.GetNameDef] ist ein mächtiger Verbündeter, der unsere Wirtschaft ankurbeln und uns helfen kann, die territoriale Integrität der [ROOT.GetNameDef] in diesen schwierigen Zeiten zu sichern. Wir müssen versuchen, die Beziehungen zur [SOU.GetAdjective]-Regierung zu stärken und ihre wertvolle Unterstützung zu gewinnen, wenn wir uns gegen die vielen Feinde, die uns umgeben, durchsetzen wollen."
BUL_follow_the_stalinist_doctrine:0	"Befolgen Sie die stalinistische Doktrin"
BUL_follow_the_stalinist_doctrine_desc:0	"Es ist an der Zeit, dass wir offiziell die Mitgliedschaft bei [SOV.GetFactionName] beantragen, damit wir eine bessere Zusammenarbeit zwischen [SOV.GetNameDef] und [ROOT.GetNameDef] entwickeln können, nicht nur in wirtschaftlichen und industriellen Fragen, sondern auch in militärischen Angelegenheiten."
BUL_joint_research_effort:0	"Gemeinsame Forschungsanstrengungen"
BUL_joint_research_effort_desc:0	"Wir müssen unsere Forschungsanstrengungen im militärischen Bereich mit denen unserer Verbündeten kombinieren, um die Entwicklung moderner Waffen zu fördern, die das Gleichgewicht in einem militärischen Konflikt zu unseren Gunsten beeinflussen können."
BUL_soviet_military_exercises:0	"Sowjetische Militärübungen"
BUL_soviet_military_exercises_desc:0	"Unsere Streitkräfte haben viel von der kompetenten und disziplinierten Roten Armee zu lernen. Wir sollten Militärberater von [SOV.GetNameDef] einladen, nach [ROOT.GetNameDef] zu kommen, um uns bei der Entwicklung eines militärischen Ausbildungsprogramms nach sowjetischem Vorbild zu helfen."
BUL_soviet_bulgarian_war_industry:0	"Sowjetisch-bulgarische Kriegsindustrie"
BUL_soviet_bulgarian_war_industry_desc:0	"Wenn wir den Grundstein für eine nationale Militärindustrie legen wollen, die in der Lage ist, eine große Armee zu unterstützen, müssen wir eine stärkere sowjetische Zusammenarbeit bei der Entwicklung und Produktion moderner Waffen fordern."
BUL_carry_the_revolution_abroad:0	"Führen Sie die Revolution ins Ausland"
BUL_carry_the_revolution_abroad_desc:0	"Bulgarien muss die Vorhut der kommunistischen Revolution auf dem Balkan werden. Wir werden gleichgesinnte Regierungen einladen, sich unserem Bündnis anzuschließen, und wir werden es auf uns nehmen, die Revolution mit Gewalt in den Rest unserer Nachbarländer zu tragen."
BUL_liberation_of_the_proletariat:0	"Befreiung des Proletariats"
BUL_liberation_of_the_proletariat_desc:0	"Es ist unsere Pflicht, den Unterdrückungsregimen, denen die Arbeiterklasse der Nachbarländer unterworfen ist, ein Ende zu setzen. Die bulgarische Volksarmee wird nicht ruhen, bis diese tyrannischen Regierungen gestürzt sind, selbst wenn sie gegen die europäischen Großmächte kämpfen muss, die sie unterstützen."
BUL_the_anti_capitalist_fight:0	"Der antikapitalistische Kampf"
BUL_the_anti_capitalist_fight_desc:0	"Im Laufe der Geschichte haben sich die so genannten großen Demokratien Europas in die Wirtschaft und die Grenzen der Balkanländer eingemischt, wobei sie sich um ihre eigenen Interessen kümmerten und sich nicht um die blutigen Konflikte kümmerten, die sie verursachten. Aber es ist an der Zeit, dass diese verkommenen Kapitalisten verschwinden, denn jetzt ist Bulgarien an der Reihe, ihre Wirtschaft, ihre Regierungen und ihre Grenzen zu diktieren."
BUL_united_we_shall_prevail:0	"Vereint werden wir siegen!"
BUL_united_we_shall_prevail_desc:0	"Der Balkan war lange Zeit fremden Nationen unterworfen, aber jetzt ist es an der Zeit, dass sich unsere Völker gegen die Invasoren verbünden und für das Land kämpfen, das uns rechtmäßig gehört."
BUL_the_unification_of_the_balkans:0	"Die Wiedervereinigung des Balkans"
BUL_the_unification_of_the_balkans_desc:0	"Es ist an der Zeit, unsere Vision einer geeinten und unabhängigen Balkanföderation zu verwirklichen, in der alle Bürger gleich sind und sich unabhängig von ihrer Herkunft, ihrer Kultur oder ihrem Glauben frei bewegen können."
BUL_the_peoples_militia_directorate:0	"Das Direktorium der Volksmiliz"
BUL_the_peoples_militia_directorate_desc:0	"Wir werden ein Direktorat der Volksmiliz einrichten, das direkt dem Innenministerium unterstellt ist und für die politische Sicherheit, die Aufrechterhaltung der öffentlichen Ordnung und die Durchführung von strafrechtlichen Ermittlungen zuständig ist."
BUL_purge_the_elites:0	"Säuberung der Eliten"
BUL_purge_the_elites_desc:0	"Es ist an der Zeit, dass die privilegierten Klassen Bulgariens aufhören, ihren Reichtum zu horten. Wenn wir wollen, dass unser Land und seine Wirtschaft florieren, müssen die Reichen das, was sie haben, mit denen teilen, die nichts haben, und nicht mit den Banken."
BUL_collectivization_of_the_countryside:0	"Kollektivierung der Landschaft"
BUL_collectivization_of_the_countryside_desc:0	"Die Verteilungskrise in der Landwirtschaft hat in Bulgarien in der Vergangenheit für große Unruhe gesorgt. Die Lösung für dieses Problem liegt in der Ersetzung der individuell besessenen Bauernhöfe durch kollektiv betriebene Betriebe, ein Prozess, der bereits in der Sowjetunion erfolgreich durchgeführt wurde."
BUL_heavy_industry:0	"Schwerindustrie"
BUL_heavy_industry_desc:0	"Nach der erfolgreichen Umstrukturierung der Landwirtschaft sind wir endlich in der Lage, ein modernes und ehrgeiziges Industrialisierungsprogramm in Bulgarien durchzuführen."
BUL_train_the_youth_wings:0	"Ausbildung der Jugendflügel"
BUL_train_the_youth_wings_desc:0	"Um den Arbeitskräftemangel in unseren Streitkräften auszugleichen, müssen wir Grundausbildungskurse anbieten, um die Mitglieder unserer Jugendverbände im Umgang mit Waffen und militärischen Taktiken zu schulen, damit sie unsere Reihen im Bedarfsfall verstärken können."
BUL_treaty_of_perpetual_friendship:0	"Vertrag der Ewigen Freundschaft"
BUL_treaty_of_perpetual_friendship_desc:0	"Als ersten Schritt zur Entwicklung guter Beziehungen zu unseren Nachbarn auf dem Balkan müssen wir an die jugoslawische Regierung mit dem Vorschlag herantreten, einen Vertrag zu unterzeichnen, der die Grundlage für die Zusammenarbeit zwischen unseren Ländern schafft und durch den [ROOT.GetNameDef] endlich seine irredentistischen Ansprüche in [YUG.GetNameDef] aufgibt."
BUL_balkan_federation_of_socialist_republics:0	"Balkan-Föderation der sozialistischen Republiken"
BUL_balkan_federation_of_socialist_republics_desc:0	"Das Projekt einer Balkanföderation scheiterte in den 1920er Jahren an den nationalistischen Bestrebungen der verschiedenen Mitglieder. Aber die Zeiten haben sich geändert, und wir müssen unser neues Föderationsprojekt den übrigen Balkanstaaten vorstellen, angefangen mit [YUG.GetNameDef]."
BUL_bury_the_grudges_of_the_past:0	"Begraben Sie den Groll der Vergangenheit"
BUL_bury_the_grudges_of_the_past_desc:1	"Es ist an der Zeit, die Streitigkeiten der Vergangenheit hinter uns zu lassen und den Blick auf eine Zukunft der Solidarität und Zusammenarbeit auf dem Balkan zu richten. Wir müssen unsere Nachbarn auffordern, sich unserem [GetFederationOrConfederation] anzuschließen, denn ohne sie wird unser Projekt für einen geeinten Balkan niemals vollständig sein."
BUL_balkan_trade_union_secretariat:0	"Balkan-Gewerkschaftssekretariat"
BUL_balkan_trade_union_secretariat_desc:1	"Wir müssen ein Gewerkschaftssekretariat einrichten, das die Richtlinien für die verschiedenen Gewerkschaften festlegt, mit dem Ziel, die Wirtschaft anzukurbeln und die Zusammenarbeit zwischen den Ländern unseres [GetFederationOrConfederation] zu fördern."
BUL_defy_moscow:0	"Moskau trotzen"
BUL_defy_moscow_desc:1	"Die Sowjetunion hat lange von den Rivalitäten zwischen den Balkanländern profitiert und nicht gezögert, sich in unsere Politik einzumischen, wenn es in ihrem Interesse war. Jetzt ist es an der Zeit, dass unsere [GetFederationOrConfederation] zuschlägt, bevor die sowjetische Regierung merkt, dass unser vereinigter Balkanblock in der Lage ist, Moskaus Hegemonie herauszufordern."
BUL_balkan_research_cooperation:0	"Forschungszusammenarbeit auf dem Balkan"
BUL_balkan_research_cooperation_desc:1	"Wir müssen ein Kooperationsprogramm entwickeln, das es Wissenschaftlern aus den verschiedenen Ländern unseres [GetFederationOrConfederation] ermöglicht, ihre Entdeckungen zu teilen und neue technologische Fortschritte zu fördern."
BUL_recover_italian_territories:0	"Italienische Territorien zurückgewinnen"
BUL_recover_italian_territories_desc:1	"Bevor Italiens territoriale Ambitionen noch weiter gehen, müssen wir von der italienischen Regierung verlangen, dass sie die Kontrolle über ihre besetzten Gebiete auf dem Balkan an die Länder zurückgibt, denen sie rechtmäßig gehören, oder sie muss die Konsequenzen tragen."
BUL_democratic_principles:0	"Demokratische Grundsätze"
BUL_democratic_principles_desc:0	"Obwohl unser Hauptziel darin besteht, das autoritäre Regime des Zaren zu beenden, können wir nicht zulassen, dass an seiner Stelle eine totalitäre kommunistische Regierung eingesetzt wird. Wir müssen den demokratischen Idealen treu bleiben und versuchen, den Einfluss von gleichgesinnten Ministern in der Regierung zu stärken."
BUL_legalize_the_agrarian_party:1	"Unterstützen Sie die Agrargemeinschaft"
BUL_legalize_the_agrarian_party_desc:0	"Die Vorstellungen der Bulgarischen Agrarnationalen Union in wirtschaftlichen Fragen mögen sich von unseren leicht unterscheiden, aber wenn wir diese Kleinigkeiten beiseite lassen, könnten sich ihre Mitglieder unserer Politik anschließen. Deshalb müssen wir diese Organisation legalisieren und eine Zusammenarbeit zwischen unseren Parteien anstreben, denn wenn wir Bulgarien zu einer echten Demokratie führen wollen, brauchen wir jede Unterstützung, die wir bekommen können..."
BUL_form_a_popular_bloc:0	"Einen Volksblock bilden"
BUL_form_a_popular_bloc_desc:0	"Um einen starken, geeinten Block gegen Autoritarismus und Unterdrückung in [ROOT.GetNameDef] zu bilden, müssen wir uns einer sozialistischen Politik zuwenden und den Zusammenhalt zwischen linken politischen Gruppen suchen, die bereit sind, gegen faschistische und monarchistische Regime zu kämpfen."
BUL_abolish_the_monarchy:0	"Schaffen Sie die Monarchie ab"
BUL_abolish_the_monarchy_desc:0	"Die Monarchie mag in den Anfangsjahren des bulgarischen Drittstaates ein nützliches Instrument zur Aufrechterhaltung der Stabilität in Bulgarien gewesen sein, aber nach verheerenden Kriegen und tyrannischen Regimen haben die Menschen das Vertrauen in dieses antiquierte Regierungssystem verloren. Die Zeit ist gekommen, es abzuschaffen."
BUL_seek_cooperation_with_the_tsar:0	"Suchen Sie die Zusammenarbeit mit dem Zaren"
BUL_seek_cooperation_with_the_tsar_desc:0	"Der Zar hat immer noch zu viel Macht in der Regierung und könnte alle unsere Vorschläge verhindern, wenn er provoziert wird. Daher ist es am besten, wenn wir versuchen, mit ihm zusammenzuarbeiten, während wir unseren Einfluss in der Regierung schrittweise vergrößern."
BUL_legislative_elections:0	"Legislative Wahlen"
BUL_legislative_elections_desc:0	"Die Bulgarische Demokratische Partei hat massive Unterstützung erhalten und ist nun in der Lage, Druck auf die Regierung auszuüben, um Parlamentswahlen einzuberufen, diesmal ohne die Manipulationen, denen sie seit Jahren ausgesetzt ist."
BUL_petorka:0	"Petorkata"
BUL_petorka_desc:0	"Wir haben den Vorschlag erhalten, mit bestimmten politischen Gruppen zusammenzuarbeiten, die wie wir versuchen, die demokratischen Prinzipien gegen alle politischen Kräfte zu verteidigen, die versuchen, ein diktatorisches Regime zu errichten, sei es zaristisch, faschistisch oder kommunistisch. Diese Koalition würde sich aus fünf Organisationen zusammensetzen, darunter die Radikaldemokratische Partei, die Nationalliberale Partei und natürlich die Bulgarische Demokratische Partei."
BUL_land_reorganization:0	"Neuordnung des Landes"
BUL_land_reorganization_desc:0	"Es ist an der Zeit, eine industrielle und landwirtschaftliche Reorganisation durchzuführen, in Übereinstimmung mit unseren Plänen, in naher Zukunft eine Reihe von neuen Reformen zur Stärkung dieser Sektoren durchzuführen."
BUL_agrarian_cooperative_movement:0	"Bewegung der landwirtschaftlichen Genossenschaften"
BUL_agrarian_cooperative_movement_desc:0	"Wir müssen uns an den von der Nationalen Agrarunion vorgeschlagenen agrarpolitischen Maßnahmen orientieren und eine Organisation des ländlichen Raums auf der Grundlage von Genossenschaften fördern."
BUL_modernize_the_industry:0	"Die Industrie modernisieren"
BUL_modernize_the_industry_desc:1	"Wenn wir uns als führende Industriemacht auf dem Balkan etablieren wollen, müssen wir uns um die Modernisierung unserer Industrie bemühen! Höhere Haushaltsmittel und verbesserte Werkzeuge werden unsere Träume wahr werden lassen."
BUL_the_salonika_agreement:0	"Das Abkommen von Saloniki"
BUL_the_salonika_agreement_desc:0	"Es ist offensichtlich, dass Bulgarien allein keine Bedrohung für die Nationen darstellt, die sich zur Balkan-Entente zusammengeschlossen haben, um unser Land gemeinsam zu konfrontieren. Wir müssen also versuchen, wieder freundschaftliche Beziehungen zu unseren Nachbarn aufzubauen, und was wäre ein besserer Anfang als die Unterzeichnung eines Abkommens mit dem Führer von [GRE.GetNameDef], [GRE.GetLeader]?"
BUL_a_balkan_confederation:0	"Eine Balkan-Konföderation"
BUL_a_balkan_confederation_desc:0	"Die Gründe, die zur Bildung der Balkan-Entente geführt haben, sind heute überholt. In diesen turbulenten Zeiten sollten die Balkanstaaten die Konflikte der Vergangenheit hinter sich lassen und sich zusammenschließen, um sich gegen die fremden Mächte zu verteidigen, die sie zu unterwerfen versuchen."
BUL_approach_the_united_kingdom:0	"Annäherung an das Vereinigte Königreich"
BUL_approach_the_united_kingdom_desc:1	"[ROOT.GetNameDef] braucht den Schutz der großen demokratischen Mächte in Europa, wenn es sich in diesen unsicheren Zeiten behaupten will. Wir müssen uns mit der [ENG.GetAdjective] Regierung treffen, um einen Kooperationspakt zwischen unseren Ländern auszuhandeln."
BUL_join_the_allies:0	"Beitritt zu den Alliierten"
BUL_join_the_allies_desc:0	"Wir müssen unseren Wunsch, dem [ENG.GetFactionName] beizutreten, formalisieren, indem wir einen Antrag an die [ENG.GetAdjective] Regierung stellen, um die Mitgliedschaft von [ROOT.GetNameDef] in ihrem Bündnis zu prüfen."
BUL_consolidate_the_third_bulgarian_state:0	"Konsolidierung des dritten bulgarischen Staates"
BUL_consolidate_the_third_bulgarian_state_desc:1	"Nach einer langen Periode sozialer Konflikte, wirtschaftlicher Depression und internationaler Streitigkeiten sind wir endlich bereit, den dritten bulgarischen Staat zu stabilisieren und zu stärken."
BUL_free_balkan_states:0	"Freie Balkanstaaten"
BUL_free_balkan_states_desc:0	"Es ist unsere Pflicht als Balkanmacht, unsere schwächeren Nachbarn vor den Ambitionen jeder Nation zu schützen, die in unser Land eindringen will. Wir müssen die Zusammenarbeit zwischen den befreundeten Nationen der Region entwickeln und uns auf die Verteidigung des Balkans vorbereiten."
BUL_fight_tyranny:0	"Tyrannei bekämpfen"
BUL_fight_tyranny_desc:0	"Es ist an der Zeit, sich den europäischen Großmächten entgegenzustellen, die eine besorgniserregende faschistische Politik verfolgen und deren Führer von nichts anderem träumen, als ihre Herrschaftsgebiete auszuweiten und die Welt zu unterjochen."
BUL_assert_our_claims:0	"Behaupten Sie unsere Ansprüche"
BUL_assert_our_claims_desc:0	"Es ist an der Zeit, die territorialen Probleme anzugehen, die unser Land seit Jahrzehnten plagen. Wir müssen die Unterstützung der [ENG.GetAdjective]-Regierung suchen, um die Beleidigungen wiedergutzumachen, die Bulgarien seit seiner Befreiung zugefügt wurden."
BUL_appeal_to_european_capitalists:0	"Appell an die europäischen Kapitalisten"
BUL_appeal_to_european_capitalists_desc:0	"[ROOT.GetNameDef] braucht eine neue Kapitalspritze, um die Entwicklung seiner nationalen Industrie anzukurbeln und seine Schulden mit den großen multinationalen Unternehmen, die bereits in das Land investiert haben, neu zu verhandeln."
BUL_obliterate_the_bolshevik_threat:0	"Die bolschewistische Bedrohung auslöschen"
BUL_obliterate_the_bolshevik_threat_desc:0	"Früher oder später werden die kommunistischen Nationen versuchen, ihre verfluchte Revolution nach [ROOT.GetNameDef] zu bringen. Warum auf den bolschewistischen Vorstoß warten, wenn wir den Vorteil des Überraschungsmoments nutzen können? Wir müssen die Ersten sein, die zuschlagen, und wir müssen so heftig zuschlagen, dass ihre geliebte Revolution ein für alle Mal zerschmettert wird!"
BUL_research_sharing:0	"Gemeinsame Forschung"
BUL_research_sharing_desc:0	"Unser Land hinkt im Bereich der wissenschaftlichen Forschung hinterher. Wenn wir hochmoderne Kriegsmaschinen herstellen und eine moderne Industrie entwickeln wollen, müssen wir unseren Verbündeten die Durchführung eines Programms zur technologischen Zusammenarbeit vorschlagen."
BUL_power_to_the_tsar:0	"Macht für den Zaren"
BUL_power_to_the_tsar_desc:0	"Der Zveno errichtete ein autoritäres Militärregime, bevor er 1935 von Zar Boris III. gestürzt wurde. Aber der Zar hat diese Zentralisierung der Macht bewahrt und es ist an der Zeit, sie zu nutzen, wenn wir eine zersplitterte Nation vereinen wollen."
BUL_condemn_macedonian_organizations:0	"Verurteilen Sie mazedonische Organisationen"
BUL_condemn_macedonian_organizations_desc:0	"Wir müssen unseren Unmut über die IMRO kundtun und daran arbeiten, alle mazedonischen revolutionären Zellen, die noch in Bulgarien operieren, zu jagen und zu eliminieren, um endlich das zu beenden, was die Zveno 1934 begonnen hat, und unsere Außenbeziehungen zu ihr zu verbessern."
BUL_support_macedonian_organizations:0	"Unterstützen Sie mazedonische Organisationen"
BUL_support_macedonian_organizations_desc:0	"Wenn wir unsere Träume von der Vereinigung und Annexion Mazedoniens verwirklichen wollen, wird es für uns vorteilhafter sein, mit den IMRO-Führern im Exil zusammenzuarbeiten, die den Weg für eine mögliche bulgarische Besetzung Mazedoniens in der Zukunft ebnen können."
BUL_dissolve_the_military_union:0	"Lösen Sie die Militärunion auf"
BUL_dissolve_the_military_union_desc:0	"Die Zveno hat zu viel Einfluss auf unsere Offiziere, und in ihren Reihen herrscht echter Unmut, nachdem Zar Boris sie 1935 von der Macht verdrängt hat. Wenn wir einen neuen Putsch der Zveno verhindern wollen, müssen wir unsere Offiziere in Sofia versammeln und die Auflösung der Militärunion ankündigen."
BUL_cooperate_with_the_zveno:0	"Kooperieren Sie mit der Zveno"
BUL_cooperate_with_the_zveno_desc:0	"Wir müssen mit den Zveno zusammenarbeiten, anstatt sie zu verärgern. Wenn wir uns entschließen, ihnen einige Zugeständnisse zu machen, könnten wir einen mächtigen Verbündeten gewinnen."
BUL_the_tsars_regime:0	"Das Regime des Zaren"
BUL_the_tsars_regime_desc:0	"Unser Land ist in zahlreiche Fraktionen, soziale Bewegungen und verbotene politische Organisationen gespalten. Der Zar muss seine volle Autorität durchsetzen, wenn er Bulgarien endlich Zusammenhalt und Stabilität bringen will."
BUL_restrained_paramilitary_organizations:0	"Zurückhaltende paramilitärische Organisationen"
BUL_restrained_paramilitary_organizations_desc:0	"Die Mitglieder paramilitärischer Organisationen sind loyale Menschen, die bereits über eine gewisse militärische Disziplin verfügen und bereit sind, für den größeren Ruhm unseres Landes Krieg zu führen. Wenn es uns gelingt, diese Organisationen für uns zu gewinnen, könnten sie zu einer zuverlässigen Quelle von Arbeitskräften werden."
BUL_ban_far_right_organizations:0	"Verbot rechtsextremer Organisationen"
BUL_ban_far_right_organizations_desc:0	"Rechtsextreme Radikale zögern nicht, Gewalt gegen die Obrigkeit anzuwenden und stellen eine große Bedrohung für unsere Regierung und unsere Bürger dar. Wir müssen alle sozialen Bewegungen dieser Art verbieten und alle damit verbundenen paramilitärischen Organisationen auflösen."
BUL_restore_the_tarnovo_constitution:0	"Die Verfassung von Tarnovo wiederherstellen"
BUL_restore_the_tarnovo_constitution_desc:0	"Seit dem Staatsstreich von 1934 wird der Staat unter einer de facto suspendierten Verfassung regiert. Es ist an der Zeit, dass wir die Verfassung von Tarnovo offiziell wiederherstellen, was nicht nur unsere Bürger erfreuen wird, sondern auch unser autoritäres Regime rechtlich absichert."
BUL_freedom_of_press:0	"Pressefreiheit"
BUL_freedom_of_press_desc:0	"Jetzt, da die Verfassung wiederhergestellt ist, müssen wir ihre Rechte und Grundsätze garantieren. Die Erlaubnis zum Vertrieb der derzeit verbotenen Zeitungen könnte der erste Schritt zur Zusammenarbeit mit bestimmten Organisationen sein."
BUL_promote_bulgarian_nationalism:0	"Förderung des bulgarischen Nationalismus"
BUL_promote_bulgarian_nationalism_desc:0	"Es mag zahllose Bedrohungen für unsere Nation geben, sowohl aus dem Ausland als auch aus dem eigenen Land, aber wenn wir Bulgaren zusammenhalten und Seite an Seite arbeiten, werden wir die kommenden turbulenten Zeiten überstehen!"
BUL_crush_the_communists:0	"Zerschlagt die Kommunisten"
BUL_crush_the_communists_desc:0	"Obwohl die Kommunisten in diesem Jahrhundert bereits mehrfach zurückgedrängt wurden, lauern sie immer noch im Schatten und nutzen die Elenden und Ausgestoßenen, um ihre Reihen zu stärken. Es ist unsere Pflicht, ihnen ein für allemal den Garaus zu machen, mit allen Mitteln..."
BUL_illusions_of_a_non_partisan_system:0	"Illusionen über ein überparteiliches System"
BUL_illusions_of_a_non_partisan_system_desc:0	"Der Zar braucht die Unterstützung seiner demokratischen Untertanen, um seine Vision eines geeinten Bulgariens zu verwirklichen. Wir müssen eine Illusion von Parlamentswahlen abhalten, die populären Oppositionsparteien verboten halten und sicherstellen, dass regierungsfreundliche Kandidaten die Mehrheit der Sitze gewinnen."
BUL_limited_womens_suffrage:0	"Begrenztes Frauenwahlrecht"
BUL_limited_womens_suffrage_desc:0	"Die bulgarischen Frauen fordern sozialen Fortschritt und Gleichberechtigung, und die Nationalisten haben bereits gewarnt, dass dieser Kampf nicht nur eine Frauenfrage ist, sondern eine Frage der sozialen Entwicklung und des Aufbaus der Nation. Um den Weg des Fortschritts zu gehen und gleichzeitig die volle politische Kontrolle zu bewahren, werden wir verheirateten, nicht kommunistischen Frauen ein bedingtes Wahlrecht gewähren."
BUL_found_the_brannik:0	"Den Brannik gefunden"
BUL_found_the_brannik_desc:0	"Bogdan Filov hat einen interessanten Vorschlag zur Gründung einer pro-faschistischen nationalen Jugendorganisation namens Brannik, die den Behörden nahe steht und dem Zaren gegenüber loyal ist, nach dem Vorbild anderer deutscher Jugendorganisationen. Filov ist der Meinung, dass Brannik zu einer massiven Organisation werden kann, die uns eine bedeutende Quelle von Arbeitskräften bietet."
BUL_bulgarian_irredentism:0	"Bulgarischer Irredentismus"
BUL_bulgarian_irredentism_desc:0	"Der bulgarische Nationalismus fordert, dass die Grenzen des Balkans zugunsten Bulgariens neu gezogen werden müssen, und selbst die Kommunisten und Demokraten werden dem zustimmen. Wir müssen die Notwendigkeit betonen, Großbulgarien wiederherzustellen, ein gemeinsames Ziel für alle unsere Völker."
BUL_strengthen_the_royal_dictatorship:0	"Die königliche Diktatur stärken"
BUL_strengthen_the_royal_dictatorship_desc:0	"Wir müssen uns darauf konzentrieren, die Loyalität zu Boris zu fördern und jede Opposition gegen das Regime auszulöschen. So ebnen wir den Weg für den Zarenvereiniger, der unserer geliebten Nation endlich den Ruhm bringt, den sie verdient."
BUL_war_industry:0	"Kriegsindustrie"
BUL_war_industry_desc:0	"Eine Armee, die sich im Krieg befindet, braucht einen ständigen Strom von Ausrüstung, Waffen und Flugzeugen. Wenn wir aus diesem Konflikt siegreich hervorgehen wollen, müssen wir unsere Militärproduktion steigern, um unsere Streitkräfte zu versorgen."
BUL_liberalization_of_trade_policies:0	"Liberalisierung der Handelspolitiken"
BUL_liberalization_of_trade_policies_desc:0	"Die bulgarische Wirtschaft taumelt seit der Unabhängigkeit vom Osmanischen Reich von einer Krise in die nächste. Die autarke Politik hat sich in der Vergangenheit als unzureichend erwiesen, daher ist es an der Zeit, die Wirtschaft zu liberalisieren."
BUL_plot_against_boris:0	"[GetPlotAgainstBorisFocusName]"
BUL_plot_against_boris_plot:0	"Komplott gegen Boris"
BUL_plot_against_boris_death:0	"Der Tod von Zar Boris"
BUL_plot_against_boris_desc:0	"[GetPlotAgainstBorisFocusDesc]"
BUL_plot_against_boris_desc_plot:0	"Wir dachten, Zar Boris sei der Monarch, der das Land zu Größe führen würde, aber sein autoritäres Regime, das einer Diktatur nahe kommt, beweist, dass wir uns geirrt haben und droht, das Land weiter zu destabilisieren. Es ist unsere Pflicht als loyale Diener Bulgariens, unser Land von diesem unwürdigen Herrscher zu befreien und eine neue Regierung zu bilden, die des Vertrauens des Volkes würdig ist."
BUL_plot_against_boris_desc_death:0	"[GetBorisDeathContext]"
BUL_form_a_regency_council:0	"Bilden Sie einen Regentschaftsrat"
BUL_form_a_regency_council_desc:1	"Nach dem Tod von Zar Boris und aufgrund der Tatsache, dass sein Erbe [GetSimeonsAge] ist, muss ein Regentschaftsrat ernannt werden, der die Regierung des Landes im Namen des jungen Simeon II ausübt."
BUL_the_return_of_ferdinand_i:0	"Die Rückkehr von Zar Ferdinand I."
BUL_the_return_of_ferdinand_i_desc:0	"Trotz seines fortgeschrittenen Alters und der Tatsache, dass er 1918 nach der bulgarischen Niederlage im Großen Krieg abdanken musste, machen die politische Erfahrung und das militärische Geschick des ehemaligen Zaren Ferdinand I. ihn zum geeignetsten Kandidaten, um die Nation zu Größe zu führen. Wir müssen die notwendigen Vorkehrungen treffen, um Ferdinand zurück auf den bulgarischen Thron zu bringen."
BUL_amend_old_grudges:0	"Ändern Sie alten Groll"
BUL_amend_old_grudges_desc:0	"Es ist an der Zeit, all den Schaden und die Demütigungen zu rächen, die Bulgarien in der Vergangenheit von seinen vielen Feinden zugefügt wurden, von den verräterischen Rumänen und Türken, die uns im Zweiten Balkankrieg in den Rücken gefallen sind, bis hin zu den Entente-Mächten, die uns im Großen Krieg besiegt haben und die Entwicklung unseres Landes seither behindern."
BUL_the_fate_of_the_balkans:0	"Das Schicksal des Balkans"
BUL_the_fate_of_the_balkans_desc:0	"Bulgarien war zu lange dem Willen seiner Nachbarländer und der europäischen Großmächte, die sie unterstützen, unterworfen... Aber die Zeiten haben sich geändert, unser Land ist so stark geworden wie keine andere Balkannation, und Bulgarien ist endlich stark genug, um seine Vormachtstellung zu behaupten und die erbärmlichen Staaten, die es umgeben, zu unterwerfen."
BUL_toppling_giants:0	"Stürzende Giganten"
BUL_toppling_giants_desc:0	"Im Laufe der Geschichte haben aufstrebende Nationen große und lange bestehende Imperien zu Fall gebracht. Wenn [ROOT.GetNameDef] die nächste Großmacht in Europa werden soll, müssen wir zuerst die Hegemonie aller anderen Mächte in unserer Reichweite herausfordern."
BUL_nationalist_propaganda:0	"Nationalistische Propaganda"
BUL_nationalist_propaganda_desc:0	"Es gibt immer noch Teile der bulgarischen Bevölkerung, die sich der Rolle Bulgariens als dominierende Macht auf dem Balkan widersetzen und behaupten, die Politik der Regierung sei extrem repressiv. Um diese Stimmen zum Schweigen zu bringen, müssen wir eine Propagandakampagne finanzieren, die uns hilft, die Maßnahmen unserer Regierung zu rechtfertigen und den bulgarischen Nationalismus neu zu entfachen."
BUL_bulgarian_academy_of_sciences:0	"Bulgarische Akademie der Wissenschaften"
BUL_guardians_of_the_balkans:0	"Wächter des Balkans"
BUL_guardians_of_the_balkans_desc:0	"Wir müssen die bulgarische Hegemonie auf dem Balkan gegen jede feindliche Macht bewahren, die es wagt, sie herauszufordern. Deshalb werden wir unsere militärischen Anstrengungen verdoppeln und unsere Marionettenregierungen auf dem Balkan auffordern, uns bei der Verteidigung unserer Domäne ebenfalls zu unterstützen."
BUL_consolidate_dominance_of_the_seas:0	"Die Dominanz über die Meere festigen"
BUL_consolidate_dominance_of_the_seas_desc:0	"Wenn wir den Balkan sichern wollen, reicht es nicht aus, dass wir eine große Armee auf der Halbinsel stationieren, wir müssen auch eine mächtige Marine aufbauen, die die Meere rund um die Halbinsel bewacht."
BUL_appoint_right_wing_ministers:0	"Ernennung rechter Minister"
BUL_appoint_right_wing_ministers_desc:0	"Das Zarenregime ist zwar hilfreich, um das Land fest im Griff zu haben, hat aber keine wirklichen Ziele, um Bulgariens Situation auf der internationalen Bühne zu verbessern. Wir müssen den autoritären Charakter des derzeitigen Systems nutzen, um neue Minister zu ernennen, die bereit sind, die politischen und sozialen Veränderungen vorzunehmen, die Bulgarien wirklich braucht."
BUL_the_path_towards_a_greater_bulgaria:0	"Der Weg zu einem Größeren Bulgarien"
BUL_the_path_towards_a_greater_bulgaria_desc:0	"Wir müssen damit beginnen, unsere Wirtschaft so anzupassen, dass sie der bevorstehenden Mobilisierung der bulgarischen Armee standhalten kann. Denn der Weg zu einem größeren Bulgarien ist mit Krieg und Konflikten gepflastert."
BUL_depose_the_tsar:0	"Stürzen Sie den Zaren"
BUL_depose_the_tsar_desc:0	"Die bulgarische Monarchie ist zu einer Belastung geworden, die uns bei der Erreichung unserer Ziele nur behindern kann. Die Nützlichkeit des Zaren hat ein Ende und es ist an der Zeit, ihn aus dem Weg zu räumen."
BUL_military_dictatorship:0	"Militärdiktatur"
BUL_military_dictatorship_desc:0	"Wir müssen die volle Kontrolle über das Land übernehmen und es unter einem militaristischen, autoritären Regime regieren, das es uns erlaubt, die notwendigen Maßnahmen zu ergreifen, um unsere militärischen Anstrengungen fortzusetzen."
BUL_support_the_spanish_coup:0	"Unterstützen Sie den spanischen Putsch"
BUL_support_the_spanish_coup_desc:0	"Der erste Schauplatz im Krieg gegen den Bolschewismus ist Spanien. Wenn wir den militärischen Aufstand offiziell unterstützen und eine Gruppe von Freiwilligen organisieren, die die Seite der Rebellen unterstützen, könnte der spanische Bürgerkrieg das perfekte Testgelände für unsere Truppen werden."
BUL_allow_far_right_organizations:0	"Rechtsextreme Organisationen zulassen"
BUL_allow_far_right_organizations_desc:0	"Die Legalisierung bestimmter rechtsextremer Organisationen, wie der Nationalen Sozialen Bewegung oder der Ratniks, könnte uns hilfreiche und loyale Verbündete verschaffen, die unser Regime und unsere Ideale unterstützen."
BUL_integrate_the_ratniks:0	"Integrieren Sie die Ratniks"
BUL_integrate_the_ratniks_desc:0	"Die Ratniks oder die Union der Krieger für den Fortschritt des Bulgarentums ist eine kürzlich gegründete nationalistische paramilitärische Organisation, die sich als sehr nützlich erweisen könnte, wenn es darum geht, das Regime zu unterstützen und erhebliche Mengen an Arbeitskräften für die Armee bereitzustellen."
BUL_economic_protectionism:0	"Wirtschaftlicher Protektionismus"
BUL_economic_protectionism_desc:0	"Wir müssen neue Reformen durchführen, um die nationale Wirtschaft und Industrie anzukurbeln und gleichzeitig grundlegende Sektoren in Bulgarien wie die Landwirtschaft und das Handwerk zu schützen."
BUL_industrial_autarky:0	"Industrielle Autarkie"
BUL_industrial_autarky_desc:0	"Unsere protektionistischen Reformen waren außerordentlich erfolgreich bei der Ankurbelung der Wirtschaft und der Industrie des Landes. Deshalb müssen wir diesen Kurs fortsetzen und neue Reformen durchführen, die Bulgarien der Autarkie näher bringen."
BUL_corporatism:0	"Korporatismus"
BUL_corporatism_desc:0	"Nach dem Vorbild des italienischen Modells müssen Arbeitnehmer und Kapitalisten aus verschiedenen Wirtschaftszweigen an der nationalen Politik beteiligt werden, damit wir zwischen diesen Gruppen vermitteln und die für die Volkswirtschaft vorteilhaftesten Reformen durchführen können."
BUL_approach_germany:0	"Annäherung an Deutschland"
BUL_approach_germany_desc:0	"Während die Briten und die Franzosen unsere Wirtschaft seit der Demütigung durch den Vertrag von Neuilly kontinuierlich stranguliert haben, haben die Deutschen nicht nur Andeutungen gemacht, unsere territorialen Ansprüche anzuerkennen, sondern haben uns auch geholfen, unsere Schulden zu tilgen und einen großen Teil unserer Ernte aufzukaufen, was unsere Wirtschaft angekurbelt und uns ermöglicht hat, wichtige industrielle und landwirtschaftliche Reformen durchzuführen."
BUL_approach_germany_foreign_industry_tt:0	"Senkung der Entscheidungskosten für §YForeign Agreements§! mit [GER.GetNameDef] und Erhöhung der Obergrenze für [GER.GetAdjective] Fabriken."
BUL_approach_british_foreign_industry_tt:0	"Reduzierung der Entscheidungskosten für §YAuslandsabkommen§! mit [ENG.GetNameDef] und Erhöhung der Obergrenze für [ENG.GetAdjective] Fabriken."
BUL_approach_soviet_foreign_industry_tt:0	"Reduziert die Entscheidungskosten für §YAusländische Abkommen§! mit [SOV.GetNameDef] und erhöht die Obergrenze für [SOV.GetAdjective] Fabriken."
BUL_cooperation_with_italy:0	"Zusammenarbeit mit Italien"
BUL_cooperation_with_italy_desc:0	"Die Italiener haben mehrfach ihr wirtschaftliches Interesse an unserem Land gezeigt, und wir dürfen die königliche Hochzeit zwischen Zar Boris und Prinzessin Giovanni nicht vergessen. Wir werden sowohl unsere diplomatischen als auch unsere wirtschaftlichen Beziehungen zu ihnen verstärken, da sie sich in naher Zukunft als ein starker Verbündeter auf dem Balkan erweisen könnten."
BUL_join_the_tripartite_pact:0	"Treten Sie dem [GetGermanFactionName] bei"
BUL_join_the_tripartite_pact_axis:0	"Dreiparteien-Pakt"
BUL_join_the_tripartite_pact_central_powers:0	"Zentralmächte"
BUL_join_the_tripartite_pact_desc:1	"[GetJoinTripartitePactFocusDesc]"
BUL_join_the_tripartite_pact_desc_axis:0	"Wir werden den Deutschen mitteilen, dass wir bereit und willens sind, den [GetGermanFactionName] zu unterzeichnen und ihrer Fraktion formell als Verbündete beizutreten."
BUL_join_the_tripartite_pact_desc_central_powers:1	"Der Kaiser ist zurückgekehrt und wir müssen versuchen, unser altes Bündnis wiederherzustellen. Diesmal werden wir das Unrecht, das unseren stolzen Ländern angetan wurde, wiedergutmachen. Diesmal wird uns nichts mehr im Wege stehen, um zu Ruhm und Größe zu gelangen. Diesmal werden wir siegreich daraus hervorgehen!"
BUL_peaceful_development:0	"Friedliche Entwicklung"
BUL_peaceful_development_desc:0	"Warum sollten wir uns an einem Krieg beteiligen, der unserem Volk nichts als Tod und Unglück bringt, wenn wir einfach die Rolle von Friedenswächtern über die besetzten Balkanregionen spielen und territoriale Gewinne einfahren können, ohne auch nur einen einzigen Mann in den sicheren Tod an einer entlegenen Schlachtfront schicken zu müssen?"
BUL_military_secrets_sharing:0	"Weitergabe von Militärgeheimnissen"
BUL_military_secrets_sharing_desc:0	"Die deutsche Technologie ist unserer weit überlegen, und es könnte für uns sehr vorteilhaft sein, ein Abkommen zu unterzeichnen, das bulgarischen Wissenschaftlern und Ingenieuren Zugang zu einigen der deutschen technologischen Wunderwerke gewährt und uns den Weg für die Weiterentwicklung unserer eigenen Forschung ebnet."
BUL_bulgarian_administration_of_the_balkans:1	"Bulgarische Integration auf dem Balkan"
BUL_bulgarian_administration_of_the_balkans_desc:2	"Um unsere Ansprüche auf dem Balkan zu stärken, müssen wir eine bulgarische Integration der besetzten Regionen durchführen, damit [GetGermanFactionNameDef] nach dem Sieg im Krieg den bulgarischen Charakter dieser Gebiete erkennen kann und es nicht wagt, unsere nationale Integrität zu brechen, wie es die Briten 1878 getan haben."
BUL_bulgarian_administration_of_the_balkans_axis_name_def:0	"eine Achse"
BUL_bulgarian_administration_of_the_balkans_central_powers_name_def:0	"a Mittelmächte"
BUL_bulgarian_administration_of_the_balkans_independent_name_def:0	"unsere"
BUL_bulgarian_administration_of_the_balkans_germans_name:0	"die Deutschen"
BUL_bulgarian_administration_of_the_balkans_everyone_name:0	"die Welt"
BUL_restore_the_bulgarian_patriarchate:0	"Wiederherstellung des bulgarischen Patriarchats"
BUL_restore_the_bulgarian_patriarchate_desc:0	"Der Patriarch von Konstantinopel muss dazu gedrängt werden, die Autokephalie der bulgarischen Kirche anzuerkennen und die notwendigen Vorkehrungen zu treffen, damit der Heilige Synod der bulgarisch-orthodoxen Kirche einen Metropoliten wählen kann, der dann der bulgarische Patriarch wird."
BUL_total_war:0	"Totaler Krieg"
BUL_total_war_desc:0	"Wir müssen unsere territorialen Ansprüche in Rumänien formalisieren, um eine Ölquelle zu sichern, mit der wir unsere Kriegsanstrengungen aufrechterhalten können, denn [ROOT.GetNameDef] ist endlich bereit, einen totalen Krieg gegen die Feinde seiner Verbündeten zu führen."
BUL_the_eastern_front:0	"Die Ostfront"
BUL_the_eastern_front_desc:0	"Bis jetzt hatten unsere Bürger jegliche Feindseligkeit gegenüber den Befreiern des bulgarischen Volkes abgelehnt. Aber der verheerende Krieg zwischen unseren Verbündeten und [SOV.GetNameDef] hat die Einstellung vieler ehemaliger Gegner geändert, die nun unseren Vorschlag unterstützen, der Ostfront beizutreten."
BUL_the_third_bulgarian_empire:0	"Das dritte bulgarische Reich"
BUL_the_third_bulgarian_empire_desc:0	"Wir müssen den letzten Schritt auf unserem Weg zu Ruhm und Größe tun. Die Länder, die Bulgarien in der Vergangenheit herabgesetzt haben, werden keine andere Wahl haben, als die Vormachtstellung unserer mächtigen Nation anzuerkennen. \nEs ist an der Zeit, das dritte bulgarische Reich auszurufen!"
BUL_oppose_the_royal_dictatorship_tt:0	"Schaltet Entscheidungen zur Zusammenarbeit mit der [GetBsName] und der [GetBznsName] frei.\nSchaltet Entscheidungen zur Unterdrückung der [GetBsName] und der [GetBznsName] frei."
