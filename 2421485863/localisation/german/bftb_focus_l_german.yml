BUL_restore_the_bulgarian_patriarchate:0	"Wiederherstellung des bulgarischen Patriarchats"
BUL_restore_the_bulgarian_patriarchate_desc:0	"Der Patriarch von Konstantinopel muss dazu gedrängt werden, die Autokephalie der bulgarischen Kirche anzuerkennen und die notwendigen Vorkehrungen zu treffen, damit der Heilige Synod der bulgarisch-orthodoxen Kirche einen Metropoliten wählen kann, der dann der bulgarische Patriarch wird."
BUL_total_war:0	"Totaler Krieg"
BUL_total_war_desc:0	"Wir müssen unsere territorialen Ansprüche in Rumänien formalisieren, um eine Ölquelle zu sichern, mit der wir unsere Kriegsanstrengungen aufrechterhalten können, denn [ROOT.GetNameDef] ist endlich bereit, einen totalen Krieg gegen die Feinde seiner Verbündeten zu führen."
BUL_the_eastern_front:0	"Die Ostfront"
BUL_the_eastern_front_desc:0	"Bis jetzt hatten unsere Bürger jegliche Feindseligkeit gegenüber den Befreiern des bulgarischen Volkes abgelehnt. Aber der verheerende Krieg zwischen unseren Verbündeten und [SOV.GetNameDef] hat die Einstellung vieler ehemaliger Gegner geändert, die nun unseren Vorschlag unterstützen, der Ostfront beizutreten."
BUL_the_third_bulgarian_empire:0	"Das dritte bulgarische Reich"
BUL_the_third_bulgarian_empire_desc:0	"Wir müssen den letzten Schritt auf unserem Weg zu Ruhm und Größe tun. Die Länder, die Bulgarien in der Vergangenheit herabgesetzt haben, werden keine andere Wahl haben, als die Vormachtstellung unserer mächtigen Nation anzuerkennen. \nEs ist an der Zeit, das dritte bulgarische Reich auszurufen!"
