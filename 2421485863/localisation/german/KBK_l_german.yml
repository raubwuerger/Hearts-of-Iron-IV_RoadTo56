l_german:
is_circassia_tt:0	"Hat §YCircassia§! gegründet"
form_circassia_category:0	"Der Marsch für Tscherkessien"
form_circassia_category_desc:0	"Mit der Schlacht von Qbaada, die 1864 den 100-jährigen Russisch-Tscherkessischen Krieg beendete, wurde der brutale und blutige Tod Tscherkessiens besiegelt. Was folgte, war fast ein Jahrhundert der Unterdrückung und Tyrannei, das zur Wiederbelebung der tscherkessischen Nationalidee führte. Uneinig und geteilt, haben wir uns als kleine Beute für die Russen erwiesen... nicht mehr, rufen wir, mit der Ehre fest vor dem Leben!"
KBK_form_circassia:0	"Proklamiert das Überleben Tscherkessiens"
KBK_form_circassia_desc:0	"Mit den alten Heimatgebieten der Stämme in der Hand unserer Regierung kann die wiederhergestellte Souveränität ganz Tscherkessiens der Welt verkündet werden."
r56_circassia.1.t:0	"Die Wiederherstellung von Tscherkessien"
r56_circassia.1.desc:0	"Überraschende Nachrichten aus dem Nordkaukasus - der ehemalige [KBK.GetOldName] hat nach der Eroberung von Gebieten, die bis zum Schwarzen Meer reichen, die Wiederbelebung des gefallenen Stammeslandes Tscherkassien verkündet. Heute hat [KBK.GetLeader] den „Beginn einer glorreichen Ära“ verkündet, denn [KBK.GetNameDef] ist wieder ein Staat.\nViele in der Diaspora schmieden bereits Pläne, in ihre angestammte Heimat zurückzukehren. Die [KBK.GetAdjective] Regierung hat damit gerechnet und ist fest entschlossen, ihnen entgegenzukommen."
r56_circassia.1.a:0	"Die Tscherkessen sind am Leben! Adyge Xabze ist am Leben!"
r56_circassia.1.b:0	"Zurück vom Abgrund."
r56_circassia.1.c:0	"Das darf nicht toleriert werden!"
