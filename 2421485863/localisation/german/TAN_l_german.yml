TAN_red_army_desc:0		"Unter dem Kommando des Staates steht die Revolutionäre Volksarmee Tuwans, eine tapfere Truppe von Soldaten, die für unsere Revolution kämpfen und Opfer bringen. Sie sind es wahrlich wert, dass sich alle kommenden Generationen an sie erinnern."
TAN_rehabilitate_pre_revolutionary_practices_desc:0		"Die von der Revolutionären Volkspartei Tuwans verfolgte Politik hat das Wesen der tuwinischen Nation dezimiert. Aber wir sind nicht der verlängerte Arm der herzlosen „Sowjetunion“, ein Produkt der Ideologie und nicht der Kultur; wir sind die stolzen Tьвalar, Söhne und Töchter unserer mächtigen Berge und ruhigen Flüsse!"
TAN_appropriate_the_gokturks:0		"Macht euch die Göktürken zu eigen"
TAN_appropriate_the_gokturks_desc:0		"Wir müssen eine neue Hegemonie über die Steppe und darüber hinaus errichten. Nur wir tragen die richtigen Ideale, die es voranzutreiben gilt; nur wir verdienen es, das Erbe der großen Reiche der Vergangenheit anzutreten."
TAN_true_heirs_of_the_gokturks_idea:0		"Wahre Erben der Göktürken"
TAN_true_heirs_of_the_gokturks_idea_desc:0		"Wir haben das ewige Erbe unserer fernen Vorfahren angezapft - keine anderen als die Himmelstürken. Die Welt ist Zeuge der Gründung einer modernen Türük el, die durch den unvergleichlich starken Geist unserer Nation ermöglicht wurde!"
TAN_lanzy_nazynchap:0		"Lanzy Nazynchap"
TAN_saaya_ala:0		"Saaya Ala"
TAN_naval_preparatory_committee:0		"Vorbereitungskomitee für die Marine"
TAN_scavenge_battlefield_equipment_idea:0	"Ausrüstung vom Schlachtfeld einsammeln"
TAN_case_of_the_nine:0	"Der Fall der Neun"
TAN_case_of_the_nine_desc:0	"Mongush Buyan-Badyrgy und Donduk Kuular wurden beide wegen ihrer Sympathie für die alten, unsozialistischen Methoden hingerichtet, doch gibt es in der Partei immer noch zu viele, die sich der Führung von Salchak Toka widersetzen. Der Grund dafür liegt auf der Hand: die Einmischung von [JAP.GetNameDef]! Diese Konterrevolutionäre, Schlangen, die im Klerus und Adel geschlüpft sind, müssen unverzüglich beseitigt werden!"
TAN_gather_the_party_opposition:0	" "Versammelt die Parteiopposition"
TAN_gather_the_party_opposition_desc:0	"Die TPRP ist unter die Herrschaft von Stalinisten geraten, die die Gesellschaft unseres Landes untergraben und es näher an die Russen heranführen wollen, vielleicht bis hin zur Annexion. Bevor es zu Säuberungen kommen kann, sollten sich die Politiker, denen Tuva noch am Herzen liegt, unter Sat Churmit-Dazhy vereinen, um einen Staatsstreich zu initiieren. Dann können die Aufhebung der harten Politik und die Wiederbelebung des Buddhismus in die Wege geleitet werden."
TAN_the_fifth_constitution:0	"Die fünfte Verfassung"
TAN_the_fifth_constitution_desc:0	"Da Salchak Toka seine Macht über die Partei gefestigt hat, ist die Notwendigkeit einer Neuordnung des Staates offensichtlich. Der Zeitpunkt ist günstig, um eine neue Verfassung in Kraft zu setzen, die unserer Ideologie besser entspricht als alle ihre Vorgänger. "
TAN_sovietization:0	"Sowjetisierung"
TAN_sovietization_desc:0	"Genosse Toka sagte einmal, dass "der Beitritt des Volkes von Arat zum Volk der großen Sowjetunion" sein Traum sei. Die pro-[JAP.GetAdjective] Danchayitischen Verräter wurden zerschlagen, und unsere Bindungen zu [SOV.GetNameDef] waren noch nie enger. Wir können endlich mit diesem Prozess beginnen. Eine soziale und wirtschaftliche Umgestaltung, die Änderung der Staatssymbole und die Einführung des kyrillischen Alphabets stehen auf der Tagesordnung!"
TAN_restore_our_ways:0	"Unsere Wege wiederherstellen"
TAN_restore_our_ways_desc:0	 "Hätten wir tatenlos zugesehen, wie Salchak Toka seine abscheuliche Herrschaft fortsetzte, hätte unsere Nation ihre Seele verloren. Zum Glück ist er fort, und nun können wir auf gemäßigtere Weise regieren, die unsere Revolution fortsetzt, ohne dabei unsere Lebensgrundlagen aufzugeben.\n\nWir werden den Vorsitzenden Buyan-Badyrgy stolz machen!"
TAN_the_basis_of_the_economy:0	"Die Grundlage der Wirtschaft"
TAN_the_basis_of_the_economy_desc:0	"Churmit-Dazhy beabsichtigt, unsere Wirtschaftspolitik auf die etablierten Stärken von [TAN.GetNameDef] auszurichten – wobei die Viehzucht in seinen Augen die wichtigste ist. Er hat jedoch auch Pläne für die Produktion anderer Güter, wie beispielsweise Textilien, die exportiert werden können. Dies ist für unser Land viel besser geeignet als das, was uns aufgezwungen worden wäre."
TAN_rectify_the_darkhad_valley_transfer:0	"Die Übertragung des Darkhad-Tals korrigieren"
TAN_rectify_the_darkhad_valley_transfer_desc:0	"Der Streit um die südliche Grenze, den [MON.GetNameDef] immer wieder aufrechterhält, bereitet uns Kopfzerbrechen. Zwar kontrollieren wir endlich unseren wertvollen Dus-Dag-Berg, doch um unsere Position vollständig zu sichern, ist es höchste Zeit, einen Schritt weiter zu gehen und das zu tun, was der erbärmliche Anführer Oyun Kombu-Dorzhu nicht vermochte, als er sich vor dem Bogd-Khan verneigte: die verlorenen östlichen Gebiete wieder in unseren Besitz zu bringen!"
TAN_carry_the_altai_torch:0	"Trage die Fackel des Altai"
TAN_carry_the_altai_torch_desc:0	"Unsere demokratischen Reformen könnten Hoffnung für ganz Süd-Zentral-Sibirien geben. Die Altai versuchten einst, sich im Russischen Bürgerkrieg einen eigenen Staat zu schaffen, die Konföderierte Republik Altai. Das hielt nicht lange an, aber unsere Unterstützung für [ALT.GetAdjective] die Abspaltung heute zum Ausdruck zu bringen, vielleicht als Teil eines größeren, stärkeren eigenen Staates, könnte der Weg sein, sich gegen [SOV.GetNameDef] zu behaupten."
TAN_bolster_altai_economy:0	"Die Wirtschaft des Altai stärken"
TAN_bolster_altai_economy_desc:0	" "Unsere neu erworbene Region Oyrot ist seit jeher ländlich und wirtschaftlich unproduktiv. Wir dürfen nicht zulassen, dass diese Region vernachlässigt wird, damit sich das Volk des Altai nicht von uns abwendet. Investitionen in das Gebiet werden nicht nur die Menschen erfreuen und beweisen, dass wir bessere Verwalter des Landes sind als die [SOV.GetAdjective]s, sondern sie werden sich auch positiv auf die Wirtschaft des gesamten Staates auswirken."
TAN_refuge_for_the_tofalar:0	"Zuflucht für die Tofalar"
TAN_refuge_for_the_tofalar_desc:0	"Die zahlenmäßig kleine Volksgruppe der Tofalar, ein turkisches Volk, das in der Region Tofalaria nördlich unseres Kozhuuns Tozhu lebt, wurde, ähnlich wie wir selbst, von den Kommunisten gezwungen, ihre Bräuche aufzugeben. Es könnte möglich sein, sie nach [TAN.GetNameDef] umzusiedeln, was sie vor weiterer Zerstörung und Assimilation schützen könnte."
TAN_1941_flag_change_tt:0	"Die Flagge durch die sowjetähnliche Flagge von 1941 ersetzen."
TAN_1943_flag_change_tt:0	"Ändere die Flagge in die sowjetähnliche Version von 1943."
TAN_1921_flag_change_tt:0	"Ändere den Namen zurück in "Volksrepublik Tannu-Tuva" und die Flagge in die ursprüngliche Regierungs- und Parteiflagge von 1921 ohne den mongolischen Schriftzug."
SIB_unified_tt:0	"Sibirischer Staat gegründet"
TAN_altai_war_tt:0	"Eine Option zum Friedensschluss wird angeboten, sobald Altai unter [TAN.GetAdjective] Kontrolle steht. Die KI wird diese garantiert annehmen."
TAN_fifth_constitution_enshrinements:0	"Verankerungen in der fünften Verfassung"
TAN_fifth_constitution_enshrinements_desc:0	"Der Staat wurde durch eine strenge und vorrangige Definition festgelegt: Er ist ein unabhängiger Staat der Arats, Arbeiter und Intelligenz, der auf einer nicht-kapitalistischen Entwicklung basiert."
TAN_support_our_soviet_comrades:0	"Unterstützt unsere sowjetischen Genossen!"
TAN_support_our_soviet_comrades_desc:0	"Das tuwinische Volk, angeführt von der gesamten revolutionären Partei und Regierung, ist bereit, unter Einsatz seines Lebens mit allen Mitteln am Kampf der Sowjetunion gegen den faschistischen Aggressor teilzunehmen, bis dieser endgültig besiegt ist."
TAN_coexistence_of_socialism_and_buddhism:0	"Koexistenz von Sozialismus und Buddhismus"
TAN_coexistence_of_socialism_and_buddhism_desc:0	"Die Wünsche der Gründer der TPR haben sich erfüllt, da die revolutionären Prinzipien des Kommunismus nun im Einklang mit dem tibetisch-buddhistischen Glauben stehen."
TAN_defender_of_peoples:0	"Verteidiger der Völker"
TAN_defender_of_peoples_desc:0	"Unsere jüngsten Handlungen haben uns das Ansehen eines Beschützers der zahlreichen turkischen Volksgruppen verliehen, die in Süd-Zentral-Sibirien beheimatet sind."
TAN_bank_of_tuva_desc:0	"Die Tuvinbank, wie sie kurz genannt wird, wurde 1925 mit sowjetischer Unterstützung gegründet und spielt seitdem eine bedeutende Rolle in der wirtschaftlichen Entwicklung Tuwas."
TAN_mining_directorate:0	"Hauptdirektion für Bergbau"
TAN_mining_directorate_desc:0	"Seit Beginn der Amtszeit von Oyun Shagdyr-Syuryun im Jahr 1935 wurden der Hauptdirektion für Bergbau von [TAN.GetNameDef] Berichte über außergewöhnliche Leistungen in den Goldminen vorgelegt."
TAN_voice_of_restraint_communist:0	"Stimme der Zurückhaltung"
TAN_adyg_tulush_khemchik_ool:0	"Adyg-Tyulyush Khemchik-ool"
TAN_adyg_tulush_khemchik_ool_desc:0	" Adyg-Tyulyush Khemchik-ool Oldukai oglu beschrieb seine Kindheit in Arat in Iyi-Tal als von feudaler Unterdrückung geprägt, doch trotz des damaligen Anscheins hat er es weit gebracht. Als aktiver Kommunist in den 1920er Jahren stieg seine Bedeutung nach der Machtübernahme des linken Flügels der TPRP drastisch an, da er nicht zu den adeligen und klerikalen Parteimitgliedern gehörte. Er hatte viele Ämter inne; seine bislang mächtigste, die des Vorsitzenden des Präsidiums des Kleinen Khural, wurde ihm 1933 übertragen. Khemchik-ool verfügt über Fähigkeiten, die sich durch seinen Beitrag zur Verfassung von 1930 und seine Arbeit als Chefredakteur der Zeitung Shyn bewährt haben, obwohl seine fraktionelle Ausrichtung offenbar bei den Überresten des rechten Flügels liegt."
TAN_sat_churmit_dazhy_desc:0	"Der Aufschrei gegen den tuwinischen Kommunismus selbst hat es geschafft, sogar Sat Churmit-Dazhy zu beeinflussen, was ihn seine Position als Regierungschef gekostet hat. Der Kampf gegen Toka ist eröffnet!"
TAN_sat_churmit_dazhy_leader_desc:0	"Sat Churmit-Dazhy Sany-Shiri oglu, einer der tuwinischen Kommunisten mit adeliger Herkunft, ist seit 1923 in der Tuwinischen Revolutionären Volkspartei tätig. Auch wenn er nach dem zweifellos antireligiösen Staatsstreich von 1929 Regierungschef wurde, hielt Vorsitzender Churmit-Dazhy an seinen Überzeugungen gegen die harte Kollektivierung und die staatliche atheistische Politik fest, was ihn näher an diejenigen rückte, die vor 1929 in der TPR an der Macht waren. Abgesehen von der Parteifraktion ist er dafür bekannt, die Entwicklung des Landes mit einer agrarischen Vision zu leiten, die sich von der Moskaus unterschied, wozu auch die Gründung einer Asbestbergbaustadt in Khemchik gehörte, deren Namensgeber er ist. \n\nChurmit-Dazhy erkannte, welche stalinistische Unruhe seine Handlungen wahrscheinlich ausgelöst hätten, und beschloss, Bündnisse mit gleichgesinnten Politikern der TPRP einzugehen und Generalsekretär Salchak Toka zu stürzen, ein Gegenputsch, der als Präventivmaßnahme zum Schutz der tuwinischen Kultur und des tibetisch-buddhistischen Glaubens im Land gerechtfertigt wurde. Aus geopolitischer Sicht erscheint dies als noch gewagtere Aktion, da sie die früheren Spannungen zwischen Kyzyl und Moskau sicherlich wieder aufleben lassen wird. Dabei muss er seine Staatskunst fortsetzen und das Chaos beseitigen, das die Kollektivierung angerichtet hat, wird der neue Parteivorsitzende und seine buddhistisch-sozialistische Regierung – von der man sicher sein kann, dass sie als letzter verzweifelter Versuch ins Leben gerufen wurde – auf die Probe gestellt werden."
TAN_liktan_surun:0	"Liktan-Surun"
TAN_liktan_surun_desc:0	"Liktan-Surun Kombu-Dorzhu oglu ist der Bruder des letzten Ambyn-Noyan der Region Uryankhay, Oyun Kombu-Dorzhu oglu Sodunam-Balchyr, und steht für die Fortführung einer Linie von Ambyn-Noyans, die Tannu Uriankhai bereits seit 1787 regierten."
TAN_kamby_lama_desc:0	"Das Ende der Unterdrückung des Buddhismus hat das Wiederaufleben des Kamby Lama bewirkt, der höchsten Position im tuwinischen Klerus."
TAN_mongush_suwaku_desc:0	"Mongush Suvak meldete sich im Oktober 1930 freiwillig zur Tuva-Arat-Roten Armee und beteiligte sich an der Niederschlagung des großen antikommunistischen Aufstands, der zu dieser Zeit in Khemchik stattfand. Nach dieser Tortur studierte er erfolgreich in Tambow und erhielt bei seinem Abschluss 1935 sogar einen Säbel von Semjon Budjonny geschenkt."
TAN_lakpa_oyun_desc:0	"Oyun Kezhege oglu Lakpa war der erste tuwinische Absolvent der M. V. Frunze-Militärakademie."
TAN_khertek_anchimaa_toka_desc:0	"Khertek Amyrbit kyzy Anchimaa, die während der kurzen Unabhängigkeit Uryankhays geboren wurde, kam schon früh mit dem tuwinischen Sozialismus in Berührung, trat 1918 der Revolutionären Jugendunion bei und gehörte zu den Ersten, die das tuwinische Alphabet erlernten. Nach ihrem Abschluss an der Kommunistischen Universität der Arbeiter des Ostens arbeitete sie in der Regierung des Kozhuuns Barun-Khemchiksky, und die Partei nahm ihren Erfolg und ihre Tatkraft zur Kenntnis. Mit ihr in der Regierung hätte man eine engagierte Vertreterin der Frauen Tuva."
TAN_sat_bazyr_ool_oglu_lopsan_desc:0	"Sat Bazyr-ool oglu Lopsan ist Minister für Handel und Industrie und hat sich dem rechten Flügel der Tuwinischen Revolutionären Volkspartei angeschlossen."
TAN_oiun_danchai_desc:0	"Danchay Chirandai oglu Oyun, der bereits als Tuva’s erster Finanzminister gedient hatte, übernahm nach der Reform von 1934, mit der der Vorstand abgeschafft wurde, die Leitung der Tuvinbank als deren Geschäftsführer. Er ist ein lautstarker und direkter Kritiker der Kollektivierung unter Salchak Toka; die Zeit läuft ab für diese Zeitbombe von einer Beziehung."
TAN_kuular_sungar_ool:0	"Kuular Sungar-ool"
TAN_kuular_sungar_ool_desc:0	"Kuular Sungar-ool Tovunak oglu ist für seinen Intellekt bekannt. Als Sohn eines Schamanen brachte er sich die mongolische Schrift selbst bei und stieg zum Botschafter in der Mongolei auf. "
TAN_polat_oyun_desc:0	"Oyun Oyun oglu Polats gute Ausbildung verwandelte sein Leben von dem eines armen Hirten in das eines Mannes von großer politischer Bedeutung. Mit Hilfe von Salchak Toka, der ihn noch aus ihrer gemeinsamen Studienzeit in Moskau im Jahr 1933 kannte. Als festes Mitglied der linken Fraktion der TPRP sollte sich Polat als Innenminister im Falle einer Säuberungsaktion gegen die konservative Opposition als wichtiger Verbündeter Tokas erweisen."
TAN_saryg_donggak_chymba_desc:0	 "Saryg-Dongak Chirik-Manygy oglu Chymba ist so etwas wie ein Neuling in der TPRP, da er 1930 in Khemchik gegen die Rebellen gekämpft hatte und der Partei 1935 nach seinem Abschluss an der Kommunistischen Universität der Arbeiter des Ostens beitrat. Derzeit ist er Direktor des Krankenhauses in Kyzyl, doch seine Verbindungen zu Salchak Toka – der Chymbas Alter um zwei Jahre nach oben korrigieren ließ, damit dieser an der KUTV studieren konnte – könnten seine Karriere vorantreiben."
TAN_saaya_ala_desc:0	"Ingenieur und Zugführer des Kavallerieregiments der Tuwinischen Volksrevolutionären Armee."
TAN_naval_preparatory_committee_desc:0	"Eine Gruppe von Personen, die auch nur im Entferntesten für die Leitung des Baus der allerersten Marine Tuva qualifiziert waren, wurde hastig zusammengestellt."
TAN_mongush_lopsan_chimit:0	"Mongush Lopsan-Chimit"
TAN_ondar_bair:0	"Ondar Bair"
TAN_ondar_bair_desc:0	" Ondar Khuren-ool oglu Bairs Engagement für den tuwinischen Kommunismus bestand größtenteils aus Propagandaarbeit, die sich an die Zivilbevölkerung richtete, insbesondere über den Revolutionären Jugendverband. Er half auch bei der Bewältigung des letzten Aufstands in Khemchik. Er lehnte das, was er als "feudal-theokratisch" bezeichnete, also den rechten Flügel der TPRP, vehement ab, was ihn zu einem Verbündeten und sogar persönlichen Freund von Generalsekretär Salchak Toka machte. "
TAN_fascist_leader_desc:0	"Eine beispiellose rechtsextreme Kraft hat Tuva übernommen. Vor nicht allzu langer Zeit begannen sich Ideen, die den Beobachtern des Aufstiegs des Faschismus in Europa nur allzu vertraut waren, rasch in der ehemaligen Tuwinischen Volksrevolutionären Armee auszubreiten. Junge Soldaten wandten sich gegen die sozialistische Ordnung und schlossen sich zusammen, um Tokas Regime zu stürzen und Tyulyush Kechil -ool als Diktator einer nationalistischen Regierung zu installieren, wie es sie zuvor noch nie gegeben hatte. \n\nToka verurteilte ihre Prinzipien als unnatürlich von ausländischen Staaten eingeflößt, doch die tuwinische faschistische Bewegung betrachtet sie als Reaktion auf die Unterdrückung des tuwinischen Erbes und als Mittel zur nationalen Erneuerung. Die Feindseligkeit gegenüber der Komintern ist ein Eckpfeiler der neuen Staatsideologie, doch was wird daraus, wenn eine kleine ländliche Nation einer großen Macht?"
TAN_kechir_ool_desc:0	"Tyulyush Baldan oglu Kechil-ool stammte aus Khayyrakan, Ulugh-Khem, wuchs als Hirte auf, studierte in einem Kloster und schrieb sich anschließend an der Tambower Höheren Kavallerieschule ein."
TAN_homushku_churguj_ool_desc:0	"Churguy-ool Khomushku"
TAN_tanchak_shoma_desc:0	"Semyon Shoma"
TAN_i_p_rugalinskij_desc:0	"I.P. Rugalinskiy"
tuva.1.t:0	"Ereignisse in Kyzyl"
tuva.1.d:0	"Der Anführer von [TAN.GetNameDef], [TAN.GetLeader], hat nach dem Empfang einer Delegation von uns, die ihn dazu anwies, die Prozesse und Hinrichtungen seiner politischen Gegner abgeschlossen, darunter unter anderem den Vorsitzenden des Ministerrats Sat Churmit-Dazhy, den Vorsitzenden des Präsidiums des Kleinen Khural Adyg-Tyulyush Khemchik-ool und den Geschäftsführer der Tuvinbank Oyun Danchay. Diese Personen stammten unter anderem aus adeligen und geistlichen Kreisen und bildeten den Rest des rechten Flügels der Tuwinischen Volksrevolutionären Partei, der dem buddhistischen Glauben und der nomadischen Lebensweise des Landes gegenüber aufgeschlossener war. Ihre Beseitigung hat die Loyalität von [TAN.GetNameDef] und seiner Partei uns gegenüber gesichert, da es keine echte Opposition gegen Toka mehr gibt und er entschlossen ist, unserem Beispiel zu folgen."
tuva.1.a:0	"Tuva wird so schnell nicht wieder abtrünnig werden."
tuva.2.t:0	"Salchak Toka in Tuva gestürzt"
tuva.2.d:0	" Das Regime von Salchak Toka im weitgehend nicht anerkannten [TAN.GetName] ist zusammengebrochen. Die "rechte" Fraktion der Tuwinischen Revolutionären Volkspartei, die die ursprüngliche buddhistische Vision der frühen Politiker ihres Landes fortsetzt, hat sich zusammengeschlossen, um die als Bedrohung empfundene stalinistische Fraktion, die an der Macht war, zu stürzen. \n\nWährend Toka das faktische Oberhaupt des Staates war, war Sat Churmit-Dazhy, der Drahtzieher des Putsches, das nominelle Regierungsoberhaupt. Mit seiner bisherigen Unterstützung für Klöster und moderaten Wirtschaftsplänen hat er seine Entschlossenheit bekundet, Tuva als agrarischen, buddhistisch-sozialistischen Staat zu festigen. Dies wird jedoch zweifellos die Beziehungen [TAN.GetAdjective]-[SOV.GetAdjective] belasten, wie es eine ähnliche Regierungsführung zuvor bereits getan hat."
tuva.2.a:0	"Hin und her. "
tuva.2.b:0	"Ein Sieg für die Rechte der Arats!"
tuva.2.c:0	"Diese "buddhistischen Sozialisten" sind wie Kakerlaken!"
tuva.3.t:0	"[TAN.GetNameDefCap] drängt auf Abtretung von Oyrot"
tuva.3.d:0	"Die kürzlich eingesetzte demokratische Regierung in [TAN.GetNameDef] hat zur Einheit unter den Ethnien ihrer Regionen aufgerufen. Unter Berufung auf eine ihrer Ansicht nach ungerechte Herrschaft unsererseits in der Region Oyrot haben sie offiziell gefordert, dass wir diese "zum Wohle der Altai-Nation" an ihre Verwaltung übertragen.. ."
tuva.3.a:0	"Dieser Ort nützt uns nichts."
tuva.3.b:0	"Unser Territorium wird nicht Stück für Stück abgetragen werden. Schon gar nicht von einem mickrigen Splitterstaat."
tuva.4.t:0	"Oyrot-Region abgetreten"
tuva.4.d:0	"Trotz vieler Zweifel haben sich unsere Forderungen nach der Übergabe der Region Oyrot als erfolgreich erwiesen. Nun kann das Volk von Altai wissen, dass es eine Zukunft hat."
tuva.4.a:0	"Zwei Nationen, eine Bruderschaft."
tuva.5.t:0	"Diplomatisches Scheitern in Bezug auf Oyrot"
tuva.5.d:0	"Unsere Diplomaten sind zurückgekehrt, ohne einen Vertrag unterzeichnet zu haben. Vielleicht war dies ein unüberlegtes Unterfangen ..."
tuva.5.a:0	"Das war es wahrscheinlich."
tuva.5.b:0	"Die Altai brauchen das. Um jeden Preis."
tuva.6.t:0	"[TAN.GetNameDefCap] schlägt Vereinigung vor"
tuva.6.d:0	"Uns wurde ein Vorschlag unterbreitet, unser Land mit [TAN.GetNameDef] zu vereinen. Unser Nachbar verspricht, dass ein größerer gemeinsamer Staat, der auf der kulturellen Nähe zwischen Tuwa und Altai basiert, viele Vorteile mit sich bringen würde."
tuva.6.a:0	"Das ist machbar."
tuva.6.b:0	"Wir werden uns nicht zum Juniorpartner machen lassen."
tuva.7.t:0	"Die Vereinigung von Tuva und Altai"
tuva.7.d:0	"Unsere Idee eines größeren Staates ist Wirklichkeit geworden. Die Regierung von [ALT.GetNameDefCap] hat unsere Rufe nach Einheit verstanden."
tuva.7.a:0	"Zwei Nationen, eine Bruderschaft."
tuva.8.t:0	"Vereinigungsangebot abgelehnt"
tuva.8.d:0	"[ALT.GetNameDefCap] hat unseren Vorschlag zur Einheit entschieden abgelehnt. Sie entscheiden sich damit unabsichtlich dafür, als schwacher Staat zu verkümmern und schließlich von Außenstehenden ausgebeutet zu werden!"
tuva.8.a:0	"Was für eine Schande."
tuva.8.b:0	"Sie wissen nicht, was das Beste für sie ist, aber wir wissen es!"
tuva.9.t:0	"Beendigung des Altai-Krieges"
tuva.9.d:0	"Altai ist eingenommen! Unsere Kriegsziele sind erreicht, und nun haben wir die Chance, den Angriffskrieg zu beenden. "
tuva.9.a:0	"Holt unsere Männer nach Hause, dort warten Feierlichkeiten auf sie!"
tuva.9.b:0	"Wir geben uns nicht zufrieden; der Krieg soll weitergehen."
tuva.10.t:0	"[TAN.GetAdjective] Friedensangebot"
tuva.10.d:0	"Da wir nun die Kontrolle über das umstrittene Gebiet haben, wurden wir von Diplomaten aus [TAN.GetNameDef] mit einem Friedensvertrag angesprochen."
tuva.10.a:0	" Diese Ablenkung sollte ein Ende haben."
tuva.10.b:0	"Nimm dich in Acht, [TAN.GetAdjective] Soldat; eine gnadenlose Gegenoffensive steht bevor!"
tuva.11.t:0	"[TAN.GetNameDefCap] fordert die Region Khövsgöl"
tuva.11.d:0	"Unsere [TAN.GetAdjective] Nachbarn, die einen solchen Schritt mit der früheren Kontrolle über das Darkhad-Tal und der Anwesenheit der verwandten Dukha-Ethnie rechtfertigen, haben uns befohlen, die Kontrolle über das Khövsgöl-Gebiet an sie abzutreten."
tuva.11.a:0	"Einen Krieg mit den Tuvanern können wir uns nicht leisten. Na gut."
tuva.11.b:0	"Oh, unsere Männer werden im Handumdrehen in [329.GetCapitalVictoryPointName] sein."
tuva.12.t:0	"[MON.GetNameDefCap] stimmt zu"
tuva.12.d:0	"Die Forderung nach Khövsgöl wurde akzeptiert. Ein Krieg wurde abgewendet, und nun läuft der Prozess der Integration. Die mongolischen Einwohner haben die Annexion schlecht aufgenommen, während unsere Dukha-Verwandten sich über die Aufhebung der Grenze freuen."
tuva.12.a:0	"Ehre sei Tuva!"
tuva.13.t:0	"[MON.GetNameDefCap] Lehnt ab"
tuva.13.d:0	"Die [MON.GetAdjective] Regierung zeigt sich trotzig. Die Meinungen im Khural sind geteilt; sollen wir zurückweichen, solange wir noch können, oder einmarschieren, wie wir es angedroht haben?"
tuva.13.a:0	"Wir dürfen nicht beim Bluffen erwischt werden. Wir reiten nach Osten!"
tuva.13.b:0	"Was haben wir uns nur dabei gedacht?"
TAN_great_khural_party:0	"Deedi Xural"
TAN_great_khural_party_long:0	"Deedi Xural"
