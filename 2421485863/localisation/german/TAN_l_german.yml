l_german:
TAN_Invite_Japanese:0					"Japanische Investoren einladen"
TAN_Invite_Japanese_desc:0					"Viele japanische Unternehmen sind daran interessiert, ihren Einfluss und ihre Präsenz in der ganzen Welt zu verstärken. Wir können ihre guten Beziehungen zu uns nutzen und um ein paar bescheidene Investitionen bitten."
TAN_Japanese_Heavy:0					"Expansion der japanischen Schwerindustrie"
TAN_Japanese_Heavy_desc:0					"Die stabile industrielle Zusammenarbeit mit unseren japanischen Verbündeten hilft uns bei der Modernisierung der Schwerindustrie"
TAN_exploit_the_ulugh_khem_coal_basin:0					"Ausbeutung des Ulugh-Khem-Kohlebeckens"
TAN_exploit_the_ulugh_khem_coal_basin_desc:0					"Neben Gold ist der zweite Schatz, der unter unseren Füßen liegt, eine riesige Menge an Kohle. Sie zu fördern und zu nutzen, wird für unsere Industrialisierung unerlässlich sein."
TAN_Industrial_Start:0					"Beginn des industriellen Aufbaus"
TAN_Industrial_Start_desc:0					"Eine Ära des Wandels steht bevor. Investitionen werden getätigt, Maschinen werden erfunden und unser Land muss sich anpassen, um mit diesen Entwicklungen Schritt zu halten."
TAN_Futher_Investments:0					"Ermutigen Sie ausländische Investoren"
TAN_Futher_Investments_desc:0					"Ausländische Mächte verfügen über eine viel größere Industrie als unsere eigene, daher müssen wir uns auf ihr Wissen verlassen."
TAN_Civilian_One:0					"Zivile Fabriken ausbauen"
TAN_Civilian_One_desc:0					"Neue Fabriken sind für ein modernes Land unerlässlich."
TAN_Civilian_Two:0					"Verbessern Sie die Kapazität der zivilen Industrie"
TAN_Civilian_Two_desc:0					"Unsere Industrie muss modernisiert werden, um mit den Anforderungen unserer Zeit Schritt zu halten."
TAN_Research:0					"Neue Schulen und moderner Unterricht"
TAN_Research_desc:0					"Der Unterricht ist die Grundlage der Wissenschaft und der Schlüssel zur Anpassung an die heutige Welt."
TAN_Excavation:0					"Mineralische Reichtümer aufdecken"
TAN_Excavation_desc:0					"Die für den Krieg notwendigen Reichtümer sind vielleicht tief unter unserer Erde verborgen und es ist unsere Pflicht, sie ans Licht zu bringen."
TAN_Refinery:0					"Fokus auf synthetische Verarbeitung"
TAN_Refinery_desc:0					"Die Herstellung von Öl und Kautschuk aus Kohle macht es möglich, dass wir kein Öl mehr importieren oder Ölfelder kontrollieren müssen. Dieses synthetische Öl ist jedoch sehr viel umweltschädlicher und kostspieliger in der Herstellung."
TAN_Autarky:0					"Reformen der Steuern"
TAN_Autarky_desc:0					"Mit einer besser organisierten Verwaltung wird der Staat besser in der Lage sein, die aktuellen Schwierigkeiten zu bewältigen."
TAN_Military_Buildup:0					"Militärische Kapazität ausbauen"
TAN_Military_Buildup_desc:0					"Das Militär benötigt große Mengen an neuer Ausrüstung. Der Bau einiger weniger Fabriken wird ihren Bedarf sicherlich decken."
TAN_Invite_American:0					"Laden Sie amerikanische Investoren ein"
TAN_Invite_American_desc:0					"Die Großmächte der westlichen Hemisphäre sind immer daran interessiert, ihren Einfluss und ihre freiheitlichen Werte in der ganzen Welt geltend zu machen. Wir können ihre guten Beziehungen zu uns nutzen und um ein paar bescheidene Investitionen bitten."
TAN_American_Air:0					"Ausbau der amerikanischen Luftfahrtindustrie"
TAN_American_Air_desc:0					"Flugzeuge sind die Zukunft des Handels, des Tourismus und der Kriegsführung. Unter der Führung der USA können wir noch mehr neue Fabriken eröffnen."
TAN_Invite_Soviets:0					"Sowjetische Planer einladen"
TAN_Invite_Soviets_desc:0					"Einzigartige sowjetische Architektur und Stadtplanung sind sicherlich für viele Anlagen in unserem Land geeignet. Der Bau eines brandneuen Industriekomplexes sollte ein erster Schritt in unserer Zusammenarbeit sein."
TAN_Soviet_Heavy_Industry:0					"Kommunistische Schwerindustrie"
TAN_Soviet_Heavy_Industry_desc:0					"Unsere kommunistischen Freunde schlagen einen koordinierten Ausbau unserer Schwerindustrie vor."
TAN_Automobile:0					"Autoindustrie"
TAN_Automobile_tt:0					"Erhalten Sie eine kleine Menge §HMotorisierte Ausrüstung§! von eingeladenen Unternehmen."
TAN_Automobile_desc:0					"Lokale Automobilhersteller werden derzeit ermutigt, sich mit ihren Kollegen aus dem Ausland abzustimmen."
TAN_Licences:0					"Kaufen Sie ausländische Lizenzen"
TAN_Licences_EXPL:0					"Schalten Sie §HPurchase Foreign Armor§! Entscheidungen frei."
TAN_Licences_desc:0					"Da wir jetzt in der Lage sind, moderne Ausrüstung zu produzieren, können wir die modernsten Designs von anderen Nationen kaufen. Auch wenn dafür ein gewisser Preis gezahlt werden muss, wird es sich sicher lohnen."
TAN_State_Matter:0					"Fokus auf interne Angelegenheiten"
TAN_State_Matter_desc:0					"Noch nie war unser Land so gespalten und durch den internen Machtkampf zerrissen. Die Bildung einer starken, konsolidierten Regierung sollte unsere erste Priorität sein."
TAN_Collectivist_Ethos:0					"Kollektivistisches Ethos"
TAN_Collectivist_Ethos_desc:0					"Ein mächtiger Staat ist ein Einparteienstaat. Jede demokratische Opposition zum Schweigen zu bringen, wird das Regime der Behörden nur stärken."
TAN_Organise_Youth:0					"Organisieren Sie die Jugend"
TAN_Organise_Youth_desc:0					"Junge Stimmen, die das derzeitige Regime loben, sind in jedem Winkel unseres Landes zu hören. Ihre gemeinsame Unterstützung kann genutzt werden, um den Glauben der Menschen an unsere Sache zu stärken. "
TAN_Com_Generals:0					"Kommunistisches Militärkommando ausbauen"
TAN_Com_Generals_desc:0					"Viele gebildete Bauern und Arbeiter treten bereitwillig in das Militär ein, um die fehlenden Offiziersränge zu füllen."
TAN_Collectivist_Propaganda:0					"Die Kultur des Arbeiters"
TAN_Collectivist_Propaganda_desc:0					"Umverteilter Reichtum wird erfolgreich eingesetzt, um die laufenden Fabriken zu verbessern und die Produktionsleistung zu steigern."
TAN_Conquer:0					"Expansive Politik"
TAN_Conquer_desc:0					"Die militärische Stärke und Macht unseres Regimes zusammen mit der Schwäche und Inkompetenz der Regierungen unserer Nachbarn hat uns keine andere Wahl gelassen, als ihnen die richtige Herrschaft zu bringen."
TAN_Intervene:0					"Einmischende Politik"
TAN_Intervene_desc:0					"Unsere Sache kann in der ganzen Welt durch kleine Brigaden gefördert werden, die das richtige Regime der Behörden durch ideologische Erziehung, Personalplanung und militärische Unterstützung unterstützen. "
TAN_Isolated:0					"Isolierter Staat"
TAN_Isolated_desc:0					"Unsere Herrschaft wird mit politischer Stabilität und nationalem Wohlstand verbunden sein. Aber sollte jemand unsere Neutralität missachten, wird er dafür schwer bezahlen!"
TAN_Forced_Conscription:0					"Einberufungsgesetz"
TAN_Forced_Conscription_desc:0					"Wenn wir in dem Pulverfass, zu dem die Welt geworden ist, überleben wollen, brauchen wir viel mehr Soldaten, die unsere Werte verteidigen."
TAN_Fanaticism:0					"Ideologischer Fanatismus"
TAN_Fanaticism_desc:0					"Es gibt keinen Grund, unsere Propagandabemühungen einzuschränken. Wenn Menschen bereit sind, für unsere Sache zu sterben, warum sollten wir sie daran hindern?"
TAN_tuvan_nationalism:0					"Tuwinischer Nationalismus"
TAN_tuvan_nationalism_desc:0					"Die Sowjets haben versucht, uns unter ihren Stiefel zu zwingen. In der Vergangenheit haben auch die Chinesen versucht, uns zu kontrollieren. Es ist an der Zeit, dass wir uns als Nation gegen fremde Mächte behaupten."
TAN_Liberty_Ethos:0					"Freiheitsethos"
TAN_Liberty_Ethos_desc:0					"Eine neue Regierung wird effektiver arbeiten, wenn sie auf den Willen aller Bevölkerungsgruppen hört und jede Trennung nach Geschlecht, Ethnie oder politischer Zugehörigkeit außer Acht lässt."
TAN_rehabilitate_pre_revolutionary_practices:0					"Uriankhai-Praktiken rehabilitieren"
TAN_Strenghten_Democracy:0					"Stärken Sie die Demokratie"
TAN_Strenghten_Democracy_desc:0					"Das Vertrauen und die Hingabe des Volkes für unsere Sache sind unbestreitbar. Die neue Legislaturperiode wird den Massen noch mehr liberale Werte bringen!"
TAN_Defence_Act:0					"Nationales Sicherheitsgesetz"
TAN_Defence_Act_desc:0					"Die Förderung von loyalen Polizei-, Militär- und Geheimdienstexperten wird die Position der Regierung verbessern und den Gesetzgebungsapparat vor ausländischem Einfluss schützen."
TAN_Brigades:0					"Internationale Brigaden bilden"
TAN_Brigades_desc:0					"Wenn unsere militärischen Fähigkeiten im globalen Maßstab ernst genommen werden sollen, sollten wir unsere freiwillige Präsenz rund um den Globus verstärken."
TAN_Military_Build:0					"Waffen beschützen die Nation"
TAN_Military_Build_desc:0					"Die äußere Sicherheit einer Nation hängt mit der Größe ihrer Armee zusammen. Wenn wir den wachsenden Bedarf unserer Soldaten decken wollen, ist eine Expansion der Militärindustrie ein Muss!"
TAN_Anti_Invasion:0					"Festungen beschützen die Nation"
TAN_Anti_Invasion_desc:0					"Die Verteidigung der wichtigsten Industrie- und Forschungszentren wird effektiver sein, wenn die verwundbarsten Standorte befestigt und ihre Garnison ausgebaut werden kann."
TAN_restore_monastic_prerogatives:0					"Klösterliche Vorrechte wiederherstellen"
TAN_restore_monastic_prerogatives_desc:0					"Die Klöster müssen wiederhergestellt werden."
TAN_adopt_nichirenist_principles:0					"Übernehmen Sie nichirenistische Prinzipien"
TAN_adopt_nichirenist_principles_desc:0					"Der japanische Mönch diente als Ankerfigur der japanischen Nationalisten, die bereit waren, einen heiligen Krieg gegen die Feinde des Buddhismus zu führen."
TAN_mobilize_for_a_holy_war:0					"Mobilisieren Sie für einen Heiligen Krieg"
TAN_mobilize_for_a_holy_war_desc:0					"Es ist an der Zeit, unsere Bevölkerung auf den Heiligen Krieg vorzubereiten, den letzten Kampf für die Reinigung der Welt."
TAN_call_for_army_readiness:0					"Aufruf zur Bereitschaft der Armee"
TAN_call_for_army_readiness_desc:0					"Wir müssen uns der Möglichkeit bewusst werden, dass eine feindliche Armee unser Land erreichen könnte."
TAN_cavalry_tradition:0					"Tradition der Kavallerie"
TAN_cavalry_tradition_desc:0					"Der Ritt zu Pferd war die einzige Möglichkeit, zu reisen und unsere Herden zu kontrollieren."
TAN_establish_the_ministry_of_war:0					"Errichten Sie das Kriegsministerium"
TAN_establish_the_ministry_of_war_desc:0					"Wenn wir unsere Armee weiter ausbauen wollen, müssen wir ein Ministerium einrichten, das sie verwaltet."
TAN_improve_officer_training_formation:0					"Verbessern Sie die Ausbildung der Offiziere"
TAN_improve_officer_training_formation_desc:0					"Nur gut ausgebildete Offiziere können Männer im Kampf richtig anführen."
TAN_gold_mining:0					"Goldabbau"
TAN_gold_mining_desc:0					"Die Goldreserven von Tuva haben die Russen überhaupt erst ins Land gebracht. Diese Tradition ist bis heute erhalten geblieben."
TAN_assimilate_altai:0					"Assimilieren Sie die Altaï"
SIB_unified_tt:					"Der sibirische Staat wird gegründet"
TAN_disorganized_military:0					"Desorganisiertes Militär"
TAN_disorganized_military_2:0					"Unorganisiertes Militär"
TAN_bank_of_tuva:0					"Bank von Tuwa"
TAN_increase_sedentarization:0					"Verstärkte Sesshaftigkeit"
TAN_increase_sedentarization_desc:0					"Unsere nomadische Bevölkerung ist wirtschaftlich nicht so produktiv und wir müssen sie sesshaft machen, wenn wir unsere Industrialisierung vorantreiben wollen."
TAN_uphold_the_cavalry_primacy:0					"Die Vorherrschaft der Kavallerie aufrechterhalten"
TAN_uphold_the_cavalry_primacy_desc:0					"Wir müssen unsere Beherrschung des Pferdes perfektionieren, wenn wir in der Steppe effektiv kämpfen wollen."
TAN_scavenge_battlefield_equipment:0					"Plündern Sie Schlachtfeld-Ausrüstung"
TAN_scavenge_battlefield_equipment_desc:0					"Die Erbeutung von Ausrüstung auf dem Schlachtfeld würde trotz ihrer Unzuverlässigkeit als Quelle etwas Druck von unserem Militärministerium nehmen."
TAN_coal_based_industry:0					"Kohlebasierte Industrie"
TAN_coal_based_industry_desc:0					"Mit der Ausbeutung unserer Kohlereserven könnten wir ein massives Industrialisierungsprogramm vorantreiben."
