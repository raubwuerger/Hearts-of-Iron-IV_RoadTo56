SIA_phahon_phonphayuhasena:	"Phahon Phonphayuhasena"
SIA_phahon_phonphayuhasena_desc:	"Phraya Phahon Phonphayuhasena, 1888 in Bangkok als Kind gemischter Eltern geboren, hat im In- und Ausland viele Jahre der Herrschaft von Chulalongkorn dem Großen, den gesamten Ersten Weltkrieg, den Aufstieg des japanischen Reiches Aufstieg auf der Weltbühne sowie die Finanzkrise der 1930er Jahre miterlebt."\n\nAls Reaktion auf demütigende königliche Skandale inmitten der Finanzkrise sowie auf Bangkoks natürlichen Wandel zu einer gebildeten, vom Westen beeinflussten Stadt schlossen sich zivile und militärische Reformer, de facto unter der Führung von Phahon, zu einer Bewegung zusammen, die später als Khana Ratsadon bekannt wurde. Im Jahr 1932 führte diese Vorhut einen Staatsstreich durch und zwang Rama VII. eine Verfassung auf.\n\nSeitdem hat sich die Revolution von innen heraus gespalten, und es hat sich Widerstand gebildet, vor allem auf dem Land. Trotz der Gefahr einer royalistischen Konterrevolution, Forderungen nach liberalen Reformen und einem Aufschwung des Ultranationalismus nach europäischem Vorbild in den Streitkräften genießt Phahon als Premierminister weiterhin Respekt im Zentrum der Revolution. Da nur wenige zufrieden sind und die Zeit davonläuft, wie lange kann Phahons Herrschaft noch andauern?"
