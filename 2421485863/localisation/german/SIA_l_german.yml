SIA_GATHERING_STORM_r56_DESC:	"Im Jahr 1932, nach Jahrhunderten absoluter Herrschaft, verübte eine avantgardistische Koalition aus hochrangigen Offizieren, nationalistischen und liberalen Kräften einen Staatsstreich gegen die königliche Regierung und zwang Rama VII. unter der Führung der Khana Ratsadon (Volkspartei) eine Verfassung auf .\n\nDie Revolution spaltete sich rasch, und 1934 kam es zu einem royalistischen Gegenangriff, der schließlich vom ultranationalistischen Verteidigungsminister Phibunsongkhram niedergeschlagen wurde, wodurch dieser ins Rampenlicht rückte. Angesichts der Spannungen in Ostasien und der Abdankung von Rama VII. im Jahr 1935 zugunsten eines minderjährigen Nachfolgers kann Phahons Regime die Stabilität in Siam wiederherstellen?"
SIA_historical_phibuns_takeover_r56:	"§YHistorisch§!: §8Phibuns Machtübernahme§!"
SIA_historical_phibuns_takeover_r56_desc:	"Nach Phahons Rücktritt als Premierminister wird die Volksversammlung Plaek Phibunsongkhram mit der Macht ausstatten, der im Inland ultranationalistische Politik betreiben, ausländische Einflüsse ausgleichen und im Ausland Gebietsgewinne erzielen wird."
SIA_songsuradets_conservative_regime_r56:	"§gSongsuradets konservatives Regime§!"
SIA_songsuradets_conservative_regime_r56_desc:	" Nach Phahons Rücktritt als Premierminister wird die Volksversammlung Phraya Songsuradet mit der Regierungsführung betrauen, der viele der liberalen Reformen von Pridi Banomyong rückgängig machen und gleichzeitig die Monarchie stärken wird; er wird Siam im Inland als konservativ und autoritär festigen und im Ausland mit der internationalen Gemeinschaft zusammenarbeiten."
SIA_songsuradet_restores_elections_r56:	" §2Songsuradet führt Wahlen wieder ein§!"
SIA_songsuradet_restores_elections_r56_desc:	"Nach Phahons Rücktritt als Premierminister wird die Volksversammlung Phraya Songsuradet mit der Macht ausstatten, der traditionalistische und demokratische Kräfte vereinen wird, um ein bescheidenes, demokratisches Siam zu schaffen, während er daran arbeitet, die Beziehungen zur internationalen Gemeinschaft zu pflegen."
SIA_songsuradet_promotes_wichit_r56:	"§8Songsuradet fördert Wichit§!"
SIA_songsuradet_promotes_wichit_r56_desc:	"Nach Phahons Rücktritt als Premierminister wird die Volksversammlung Phraya Songsuradet ermächtigen, der den Traditionalismus unterstützen und gleichzeitig den Aufstieg von Luang Wichitwathakan als weniger radikale, pro-monarchistische faschistische Alternative für die Nation zulassen wird."
SIA_pridis_democratic_firebrand_r56:	"§4P ridis demokratischer Hitzkopf§!"
SIA_pridis_democratic_firebrand_r56_desc:	"Nach Phahons Rücktritt als Premierminister wählt die Volksversammlung Pridi Banomyong, der eine demokratische Transformation einleiten wird, die im Namen des gemeinsamen Interesses mit der internationalen Gemeinschaft zusammenarbeitet."
SIA_pridi_prioritizes_national_reform_r56:	"§tPridi räumt der nationalen Reform Priorität ein§!"
SIA_pridi_prioritizes_national_reform_r56_desc:	"Nach Phahons Rücktritt als Premierminister wählt die Volksversammlung Pridi Banomyong, der frühere Verpflichtungen zur nationalen Demokratie zugunsten einer Politik der sozioökonomischen Modernisierung einschränken wird – um ein neues Siam zu schmieden, das in Zusammenarbeit mit der internationalen Gemeinschaft die Herausforderungen von morgen bewältigen kann."
