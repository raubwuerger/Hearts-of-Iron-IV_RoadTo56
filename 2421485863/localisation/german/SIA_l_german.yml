SIA_department_of_independent_state_commerce_r56:	"Ministerium IND. Staatlicher Handel"
SIA_department_of_industry_r56:	"Ministerium für Industrie"
SIA_agrarian_society_r56:	"Agrargesellschaft"
SIA_agrarian_society_r56_desc:	"Aufgrund der geringen Fortschritte sowohl in der Massenbildung als auch in der industriellen Entwicklung kann nur ein kleiner Prozentsatz der [SIA.GetAdjective] Bevölkerung lesen, während kaum industrielle Entwicklung stattgefunden hat. Eine aggressive Transformation oder viele Jahre langsamer Entwicklung werden erforderlich sein, um diese Auswirkungen abzumildern."
SIA_rama_viii_r56:	"Rama VIII."
SIA_rama_viii_r56_desc:	"Angetrieben durch die Abdankung von Rama VII. im Jahr 1935 ist der Einfluss der [SIA.GetAdjective] Monarchie von einem Zustand des Niedergangs in einen freien Fall übergegangen, was zu Unzufriedenheit in der überwiegend konservativen Bevölkerung geführt hat, während in anderen Bereichen der Regierung ein Machtvakuum entstanden ist.\n\nRama VIII. ist derzeit zu jung, um den Thron zu besteigen, und studiert im Ausland in der Schweiz. Es bedarf eines starken Monarchen, um die Bedeutung der [ROOT.GetAdjective] Monarchie wiederherzustellen, und bis dahin werden wir mit konservativer Opposition und dem Opportunismus der Politiker konfrontiert sein."
SIA_state_of_the_civilian_wing_r56:	"Lage des zivilen Flügels"
SIA_state_of_the_civilian_wing_r56_desc:	"Die regierende Khana Ratsadon steht zwar weitgehend unter der Kontrolle der [SIA.GetAdjective] Streitkräfte, verfügt jedoch nach wie vor über einen einflussreichen zivilen Flügel, der die im Westen ausgebildeten Minister des Landes vertritt. Obwohl der zivile Flügel viele Männer unterschiedlicher Ideologien umfasst, steht er de facto unter der Führung des äußerst fortschrittlichen Pridi Banomyong.\n\nPridi Banomyong, der 1934 während der Amtszeit von Premierminister Phonphayuhasena ins Land zurückkehrte, stand der regierenden Regierung relativ wohlwollend gegenüber und wurde zu einer maßgeblichen Kraft bei der Modernisierung unserer Institutionen und unserer Diplomatie. Wenn wir vermeiden wollen, dass er von anderen ideologischen Kräften an den Rand gedrängt wird, sollten wir seinen Einfluss stark halten."
SIA_siamese_ultranationalist_movement_r56:	"[SIA.GetAdjective] Ultranationalistische Bewegung"
SIA_siamese_ultranationalist_movement_r56_desc:	"Obwohl unsere Streitkräfte innerhalb der regierenden Khana Ratsadon über enorme Macht verfügen, steht der ideologischen Einheit wenig im Wege. Durch den Einfluss des aufstrebenden Plaek Phibunsongkhram gewinnt der Ultranationalismus nach italienischem und japanischem Vorbild im ganzen Land rasch an Boden.\n\nDerzeit steht Phibunsongkhram der regierenden Regierung zwar freundlich gegenüber, doch nutzt er seine Rolle als Verteidigungsminister, um seinen Einfluss im ganzen Land zu stärken. Wenn wir vermeiden wollen, dass er die Macht übernimmt, sind entschlossene Maßnahmen erforderlich, um seine Macht einzudämmen."
SIA_sluggish_industrialization_r56:	"Träge Industrialisierung"
SIA_sluggish_industrialization_r56_desc:	"Zwar hat die konstitutionelle Regierung bei der Industrialisierung Bangkoks große Fortschritte erzielt, doch bleiben wir eine weitgehend agrarisch geprägte Nation, und die Entwicklung unserer Volkswirtschaft verläuft nur langsam. Einige argumentieren, dass wir eine aktivere Rolle in der Wirtschaft unseres Landes übernehmen müssen."
SIA_high_illiteracy_r56:	"Hohe Analphabetenrate"
SIA_high_illiteracy_r56_desc:	"Zwar hat die konstitutionelle Regierung in diesem Bereich große Fortschritte erzielt, doch haben viele Jahrhunderte der Vernachlässigung des Bildungswesens dazu geführt, dass [ROOT.GetNameDef] wir nach wie vor eine weitgehend analphabetische Nation sind. Es werden erhebliche Investitionen erforderlich sein, um diese langjährige Schwäche unseres Landes zu beheben."
SIA_illiteracy_r56:	"Analphabetismus"
SIA_illiteracy_r56_desc:	"Die verfassungsmäßige Regierung hat bei der Bereitstellung von Massenbildung enorme Fortschritte erzielt. Zwar [ROOT.GetAdjective] liegen die Alphabetisierungsstandards unter denen Westeuropas, doch tragen die Initiativen zur Massenbildung Früchte, und bei diesem Tempo könnten wir zu einem Leuchtturm der Bildung in Asien werden. "
SIA_rapidly_improving_illiteracy_r56:	"Sich rasch verbessernde Alphabetisierungslage"
SIA_rapidly_improving_illiteracy_r56_desc:	"Die konstitutionelle Regierung hat bei der Bereitstellung von Massenbildung enorme Fortschritte erzielt. Zwar [ROOT.GetAdjective] liegen die Alphabetisierungsstandards unter denen Westeuropas, tragen die Initiativen zur Massenbildung Früchte, und bald werden wir ein Leuchtturm der Bildung in Asien sein."
SIA_modest_industrialization_r56:	"Bescheidene Industrialisierung"
SIA_modest_industrialization_r56_desc:	"Die konstitutionelle Regierung macht große Fortschritte bei der Industrialisierung des Landes. Obwohl wir nach wie vor eine weitgehend agrarisch geprägte Nation sind, hat sich die Entwicklung unseres Landes beschleunigt."
SIA_heavy_handed_industrialization_r56:	"Hardlinige Industrialisierung"
SIA_heavy_handed_industrialization_r56_desc:	"Die konstitutionelle Regierung macht große Fortschritte bei der Industrialisierung des Landes. Obwohl wir nach wie vor eine weitgehend agrarisch geprägte Nation sind, schreiten die Entwicklungen in unserem Land rasch voran, was hoffentlich Früchte bei der Industrialisierung der ärmeren Regionen unseres Landes tragen wird."
SIA_overzealous_industrialization_r56:	"Übereifrige Industrialisierung"
SIA_overzealous_industrialization_r56_desc:	"Die Industriepolitik des Landes war übermäßig ehrgeizig, was zu massiver wirtschaftlicher Instabilität geführt hat. Wir müssen einen Kurswechsel vornehmen, wenn wir ein massives Chaos vermeiden wollen."
SIA_modern_market_economy_r56:	"Moderne Marktwirtschaft"
SIA_modern_market_economy_r56_desc:	"Die verfassungsmäßige Regierung macht große Fortschritte bei der Industrialisierung des Landes. Während unsere industrielle Entwicklung nur langsam voranschreitet, gehört die Wirtschaft insgesamt zu den am schnellsten wachsenden der Welt."
SIA_modest_mixed_economy_r56:	"Bescheidene gemischte Wirtschaft"
SIA_modest_mixed_economy_r56_desc:	"Die konstitutionelle Regierung macht große Fortschritte bei der Industrialisierung des Landes. Die industrielle Entwicklung schreitet in angemessenem Tempo voran, wodurch unsere Wirtschaft insgesamt zu den am schnellsten wachsenden der Welt zählt."
SIA_heavy_handed_interventionism_r56:	"Harter Interventionismus"
SIA_heavy_handed_interventionism_r56_desc:	" Die konstitutionelle Regierung macht mit harter Hand große Fortschritte bei der Industrialisierung des Landes. Die industrielle Entwicklung schreitet rasch voran, wodurch unsere Wirtschaft insgesamt zu einer der am schnellsten wachsenden der Welt gehört, wenn auch auf Kosten einer geringfügigen Instabilität."
