SIA_mending_siamese_irredentism_r56:	" Wiederherstellung [SIA.GetAdjective] Irredentismus"
SIA_mending_siamese_irredentism_r56_desc:	"Als König Chulalongkorn der Große die Sinnlosigkeit des bewaffneten Widerstands erkannte – wo viele andere sich widersetzt hätten –, unterzeichnete er eine Vielzahl von territorialen Zugeständnissen aus dem Einflussbereich der Nation, und gewährte den Briten und Franzosen beträchtliche territoriale Zugeständnisse, während er die Unabhängigkeit unseres Kernlandes bewahrte.\n\nDa unsere Nation Jahrzehnte der Modernisierung durchläuft, während sich die Kolonialmächte in ihren globalen Imperien übernehmen, können wir uns vielleicht hinter unseren Verlusten versammeln und mit deren Umkehrung eine neue [SIA.GetAdjective] goldene Ära begründen!"
SIA_peace_with_honor_in_indochina_r56:	"Ehrenhafter Frieden in Indochina"
SIA_peace_with_honor_in_indochina_r56_desc:	"Ein Großteil der Gebiete im ehemaligen "französischen" Indochina steht nun unter unserer Kontrolle. Die Zeit ist gekommen, unseren Feinden einen Frieden mit Ehre aufzuzwingen!"
SIA_if_all_burmese_starting_cores_are_controlled_by_us_we_will_make_a_subject_out_of_them_if_possible_tt:	"Wenn alle §Y[BRM.GetAdjective]§! Startkerne von uns kontrolliert werden, werden wir sie, wenn möglich, unterwerfen."
SIA_r56.28.desc:	"Unsere Feinde haben den Frieden mit unserer Nation akzeptiert, wobei wir einer Grenze zugestimmt haben, die von unserer Kontrolllinie beeinflusst wird. Mögen wir diesen Sieg feiern!"
SIA_peace_for_our_western_claims_r56:	 "Frieden für unsere westlichen Ansprüche"
SIA_peace_for_our_western_claims_r56_desc:	" Ein Großteil der Gebiete, die einst unbestreitbar britisch waren, liegt nun unter unserer Kontrolle. Die Zeit ist gekommen, unseren Feinden einen ehrenvollen Frieden aufzuzwingen!"
SIA_if_all_vietnamese_starting_cores_are_controlled_by_us_we_will_make_a_subject_out_of_them_if_possible_tt:	"Wenn alle §Y[VIN.GetAdjective]§! Startkerne von uns kontrolliert werden, werden wir , sofern dies möglich ist."
SIA_a_new_destiny_for_indochina:	"Ein neues Schicksal für Indochina"
SIA_a_new_destiny_for_indochina_desc:	"Die Menschen auf dem südostasiatischen Festland sind Opfer des Kapitalismus, des Kolonialismus, des Feudalismus und fast jedes anderen Systems menschengemachter Unterdrückung geworden. Da ein Großteil der Region unter dem Banner unserer Revolution steht, können wir ein neues Schicksal für Indochina verkünden: Versöhnung fördern, die Flammen des Fortschritts verbreiten und Wohlstand für alle erreichen! "
gains_claims_on_all_starting_vietnamese_and_burmese_cores_except_shanland_r56_tt:	"Erwirbt Ansprüche auf alle Start- §Y[VIN.GetAdjective]§! und §Y[BRM.GetAdjective]§! Startkerne mit Ausnahme von §Y[1018.GetName]§!."
SIA_restore_siamese_rule_in_lan_chang_r56:	"Stellen Sie [SIA.GetAdjective] die Herrschaft in [926.GetName] wieder her"
SIA_restore_siamese_rule_in_lan_chang_r56_desc:	"An Paris abgetreten" im französisch-siamesischen Vertrag von 1904 an Paris abgetreten, [926.GetName] liegt die Provinz seitdem unter der Kontrolle des französischen Protektorats Laos. Aufgrund der geringen Bevölkerungsdichte der Provinz, ihrer sprachlichen Einheit und der noch frischen Erinnerung daran, einst zu unserem Reich gehört zu haben, dürfte ihre Wiedereingliederung ein Leichtes sein!"
SIA_restore_siamese_rule_in_champasak_r56:	"Wiederherstellen [SIA.GetAdjective] Herrschaft in [924.GetName]"
SIA_restore_siamese_rule_in_champasak_r56_desc:	"Im französisch-siamesischen Vertrag von 1904 an Paris abgetreten -Siam-Vertrag von 1904 an Paris abgetreten, [924.GetName] steht die Provinz seitdem unter der Kontrolle des französischen Protektorats Laos. Aufgrund der geringen Bevölkerungsdichte der Provinz, ihrer sprachlichen Einheit und der noch frischen Erinnerung daran, einst zu unserem Reich gehört zu haben, dürfte ihre Wiedereingliederung ein Leichtes sein!"
SIA_proclaim_the_reintegration_of_laos_r56:	"Die Wiedereingliederung von Laos verkünden"
SIA_proclaim_the_reintegration_of_laos_r56_desc:	"Die laotischsprachigen Gebiete am östlichen Ufer des Mekong wurden nach der französisch-siamesischen Krise von 1893 an die französische Obrigkeit abgetreten, was wohl den bedeutendsten Gebietsverlust während der Regierungszeit von Chulalongkorn darstellte. Obwohl diese Gebiete nie unter der direkten Kontrolle Bangkoks standen, werden die sprachliche Einheit und der Geist des Anti-West-Kolonialismus Laos mit Sicherheit direkt in unsere tugendhaften Hände treiben!"
SIA_proclaim_the_reintegration_of_inner_cambodia_r56:	"Verkünden Sie die Wiedereingliederung von Inner-Kambodscha"
SIA_proclaim_the_reintegration_of_inner_cambodia_r56_desc:	"Der französisch-siamesische Vertrag von 1907 sah die Abtretung der Region Inner-Kambodscha an Siam vor, wodurch wir den Zugang zu vielen bedeutenden Stätten, der wichtigen Stadt Angkor und dem strategisch wichtigen Süßwassersee Tonlé Sap verloren. Obwohl es in der Region keine nennenswerte thailändischsprachige Bevölkerung gibt, ist ihr Verlust noch in frischer Erinnerung und sie hat erhebliche strategische und wirtschaftliche Bedeutung."
SIA_reclaim_the_salweens_northeast_bank_r56:	"Rückgewinnung des Nordostufers des Salween"
SIA_reclaim_the_salweens_northeast_bank_r56_desc:	 "Obwohl wir gezwungen waren, unseren Anspruch auf das östliche Ufer des Salween zugunsten von Britisch-Indien aufzugeben, handelte es sich dabei um einen historischen Teil des Königreichs Lan Na, das von Siam annektiert wurde und in dem zudem viele Sprecher der Tai-Shan-Sprache leben. Sobald dieses rechtmäßige Gebiet unter unserer Kontrolle steht, soll seine Integration endlich beginnen!"
SIA_irredentist_claims_in_malaya_r56:	"Irredentistische Ansprüche in Malaya"
SIA_irredentist_claims_in_malaya_r56_desc:	"In Zeiten unserer Schwäche waren wir quasi gezwungen, kleinere Gebiete auf der Landenge von Kra abzutreten. Nun, da sie unter unserer Kontrolle steht, soll sie wieder in unsere rechtmäßigen Hände zurückgeführt werden!"
SIA_solidify_control_in_laos_r56:	"Festigung der Kontrolle in Laos"
SIA_solidify_control_in_laos_r56_desc:	"Zwar herrscht nach wie vor eine gewisse Unzufriedenheit mit unserer Herrschaft, doch haben wir den bewaffneten Widerstand weitgehend niedergeschlagen und eine begrenzte Unterstützung für unsere Verwaltung in Laos aufgebaut. Angesichts dieser Tatsachen gibt es kaum einen Grund, die Integration dieses lebenswichtigen Landes aufzuhalten."
SIA_offer_laos_provincial_autonomy_r56:	"Laos provinzielle Autonomie anbieten"
SIA_offer_laos_provincial_autonomy_r56_desc:	"Obwohl in Laos ein gewisses Maß an Sympathie für unsere Herrschaft besteht, hält ein Großteil der Bevölkerung an ihrer ethnolinguistischen Identität fest. Wir sollten die regionale Assimilationspolitik beenden und stattdessen auf eine Ordnung hinarbeiten, in der die lokale Bevölkerung integriert ist, aber dennoch autonom bleibt und ihre Bräuche frei ausüben kann."
SIA_solidify_control_in_shanland_r56:	"Kontrolle in [1018.GetName] festigen"
SIA_solidify_control_in_shanland_r56_desc:	 "Zwar herrscht nach wie vor eine gewisse Unzufriedenheit mit unserer Herrschaft, doch haben wir den bewaffneten Widerstand weitgehend niedergeschlagen und in der Provinz [1018.GetName] eine begrenzte Unterstützung für unsere Verwaltung aufgebaut. Angesichts dieser Tatsachen gibt es kaum einen Grund, die Integration dieses wichtigen Gebiets zu stoppen."
SIA_offer_inner_cambodia_provincial_autonomy_r56:	"Den Provinzen in Inner-Kambodscha Autonomie gewähren"
SIA_offer_inner_cambodia_provincial_autonomy_r56_desc:	"Wenn wir Frieden in der Region Inner-Kambodscha schaffen wollen, müssen wir die Bräuche der dortigen Bevölkerung respektieren und Versuche einer erzwungenen Assimilation aufgeben. Wenn sie lange genug mit unserem Volk zusammenleben, werden sie sich sicherlich irgendwann als [SIA.GetAdjective] betrachten."
SIA_offer_autonomy_to_the_cambodian_provinces_r56:	"Den kambodschanischen Provinzen Autonomie gewähren"
SIA_offer_autonomy_to_the_cambodian_provinces_r56_desc:	"Zwar standen die Kambodschaner einst unter unserem Banner, doch geschah dies in einer stark autonomen Form. Indem wir ihnen einen Weg bieten, ihre Nationalität und Sprache durch eine gemeinsame Union zu bewahren, wären sie sicherlich bereit, unserer Union zu dienen."
SIA_organize_the_burmese_provinces_r56:	"Die burmesischen Provinzen organisieren"
SIA_organize_the_burmese_provinces_r56_desc:	"Die burmesischen Provinzen sind äußerst multikulturell und beherbergen viele Minderheiten, die auch in historisch siamesischen Gebieten leben. Indem wir den Burmesen und allen anderen Minderheiten in ihren Gebieten kulturellen Schutz und die Bewahrung ihrer Identität bieten, können wir sie zum Frieden mit unserer südostasiatischen Union führen."
SIA_offer_autonomy_to_the_vietnamese_provinces_r56:	"Den vietnamesischen Provinzen Autonomie gewähren"
SIA_offer_autonomy_to_the_vietnamese_provinces_r56_desc:	"Vietnam ist den Schrecken der ausländischen Besatzung und des Kolonialismus zum Opfer gefallen. Indem wir ihrem Volk die kulturelle Autonomie, die Bewahrung der nationalen Identität und die Rechte gewähren, die die Franzosen versäumt haben, können wir sie hinter unserem Banner der Einheit und des Fortschritts versammeln!"
SIA_offer_shanland_provincial_autonomy_r56:	"Gewährung [1018.GetName] der Provinzautonomie"
SIA_offer_shanland_provincial_autonomy_r56_desc:	"Obwohl in [1018.GetName] ein gewisses Maß an Sympathie für unsere Herrschaft besteht, hält ein Großteil der Bevölkerung an ihrer ethnolinguistischen Identität fest. Wir sollten die regionale Assimilationspolitik beenden und stattdessen auf eine Ordnung hinarbeiten, in der die lokale Bevölkerung integriert, aber dennoch autonom ist und ihre Bräuche frei ausüben kann."
SIA_crush_dissent_in_inner_cambodia_r56:	" "Unterdrückung von Widerstand im Landesinneren Kambodschas"
SIA_crush_dissent_in_inner_cambodia_r56_desc:	"Zwar herrscht nach wie vor weit verbreitete Unzufriedenheit mit unserer Herrschaft, doch können wir den bewaffneten Widerstand überwinden und im Landesinneren Kambodschas Akzeptanz für unsere Verwaltung schaffen. Angesichts dieser Tatsachen gibt es kaum einen Grund, die Integration dieses lebenswichtigen Gebiets zu stoppen."
SIA_finding_a_path_forward_r56:	"Einen Weg nach vorn finden"
SIA_finding_a_path_forward_r56_desc:	" Zwar haben sich viele Männer unterschiedlicher Ideologien und Talente gemeinsam gegen die königliche Diktatur zur Waffe gegriffen, doch heute verbindet die verfassungsmäßigen Revolutionäre kaum noch etwas [SIA.GetAdjective]. \n\nAngesichts der für alle sichtbaren Instabilität und des Machtvakuums müssen wir klug gegen Bedrohungen unserer Herrschaft vorgehen und eine klare, prosperierende Zukunft für alle [SIA.GetAdjective] Menschen gestalten!"
SIA_phahon_phonphayuhasena_steps_down_r56:	"Phahon Phonphayuhasena tritt zurück"
SIA_phahon_phonphayuhasena_steps_down_r56_desc:	 "Phahon Phonphayuhasena wird aufgrund zahlreicher Gerüchte – von nachlassender Gesundheit bis hin zu mangelndem Regierungswillen – wahrscheinlich nicht mehr lange als Premierminister von [SIA.GetNameDef] im Amt bleiben.\n\nOb wir Phahons bescheidene Reformen bewahren oder uns von seiner kompromissbereiten Art abwenden wollen, wird in den letzten Jahren seiner Amtszeit entscheiden."
SIA_anti_fascism:	"Antifaschismus"
SIA_anti_fascism_desc:	"Der Faschismus ist ein großes Übel, das die Ordnung und Freiheit aller Asiaten bedroht. Selbst wenn niemand auf unserer Seite steht, und selbst bis zum Ende, werden wir ein Leuchtfeuer gegen diese Bedrohung sein!"
SIA_loyal_army:	"Loyale Armee"
SIA_loyal_army_desc:	"Durch die jüngsten Säuberungsaktionen in unseren Streitkräften haben wir eine standhaft loyale, entschlossene Armee geschaffen, die unsere Herrschaft schützen wird. Unseren Plänen für die Nation wird niemand entgegenstehen!"
SIA_centralised_production:	"Zentralisierte Produktion"
SIA_centralised_production_desc:	"Durch die Zentralisierung der Wirtschaftsführung werden wir sicherstellen, dass Ressourcen zum Wohle der Nation angemessen verteilt werden."
SIA_state_invervention:	"Staatliche Intervention"
SIA_state_invervention_desc:	"Staatliche Eingriffe in die Wirtschaft sind notwendig, um die Ausbeutung der Schwächsten durch die Stärksten zu verhindern. Es werden Gesetze zum Schutz der Arbeitnehmer mit entsprechenden Leistungen erlassen."
SIA_prepare_a_naval_expansion_r56:	"Vorbereitung einer Flottenerweiterung"
SIA_prepare_a_naval_expansion_r56_desc:	" [SIA.GetNameDefCap] ist von allen Seiten von größeren Seemächten umgeben. Auch wenn wir niemals hoffen können, es gleichzeitig mit jedem potenziellen Rivalen aufzunehmen, sollten wir zumindest sicherstellen, dass wir in der Lage sind, uns als regionale Seemacht zu behaupten."
SIA_develop_the_southern_bases_r56:	"Die südlichen Stützpunkte ausbauen"
SIA_develop_the_southern_bases_r56_desc:	"Wir sind Asiens natürlicher Stützpunkt zwischen Indien, China, den Ressourcen Malayas und dem Pazifik. Wir sollten unsere strategisch günstige Lage nutzen und die Infrastruktur aufbauen, die erforderlich ist, um unsere Truppen in den kommenden Unruhen zu versorgen."
SIA_incorporate_allied_radar_designs_r56:	"Alliierte RADAR-Entwürfe integrieren"
SIA_incorporate_allied_radar_designs_r56_desc:	"Unsere Verbündeten haben beeindruckende Fortschritte bei der Entwicklung moderner RADAR-Technologie gemacht. Als Nation, die in dieser entscheidenden Forschung viele Jahrzehnte hinterherhinkt, sollten wir uns darum bemühen, ausländische Entwürfe von unseren engsten Verbündeten zu erwerben."
SIA_prioritize_domestic_radar_research_r56:	"Priorisieren Sie die heimische RADAR-Forschung"
SIA_prioritize_domestic_radar_research_r56_desc:	"Wir haben von der besorgniserregend schnellen Entwicklung von RADAR durch westliche Nationen erfahren. Wenn wir nicht zurückfallen wollen, müssen wir alles in unserer Macht Stehende tun, um in diesem entscheidenden Bereich aufzuholen!"
SIA_acquire_japanese_torpedoes_r56:	"Erwerben Sie [JAP.GetAdjective] Torpedos"
SIA_acquire_japanese_torpedoes_r56_desc:	 "[JAP.GetNameDefCap] ist auf dem Weg, die stärkste Seemacht im Pazifik zu werden, und ihre aggressiven U-Boot- und Marinebomber-Konstruktionen werden dabei eine große Rolle spielen. Als Kleinmacht mit geringer Marineindustrie sollten wir uns bemühen, diese Waffen der asymmetrischen Seekriegsführung zu erwerben."
SIA_expand_the_marine_corps_department_r56:	"Das Marinekorps ausbauen"
SIA_expand_the_marine_corps_department_r56_desc:	"Unabhängig davon, ob wir eine führende Land- oder Seemacht werden, [SIA.GetNameDef] muss über die Fähigkeit verfügen, Kriege über die Flüsse und den Ozean hinweg zu führen, die zwischen uns und unseren Feinden liegen."
SIA_begin_limited_shipbuilding_r56:	"Beginn eines begrenzten Schiffbaus"
SIA_begin_limited_shipbuilding_r56_desc:	" Wir haben große Fortschritte bei der Finanzierung des Aufbaus einer modernen Marine gemacht, doch wird dies wenig zählen, wenn uns weiterhin die Industrie für den modernen Schiffbau fehlt. Wir sollten uns darum bemühen, an unserer Südküste eine angemessene, wenn auch bescheidene Schiffbauindustrie aufzubauen."
SIA_modernize_the_central_repair_facilities_r56:	"Modernisierung der zentralen Reparaturwerften"
SIA_modernize_the_central_repair_facilities_r56_desc:	"An unserer Ostküste wird sich im Falle eines Konflikts wahrscheinlich der Großteil unserer Kampfhandlungen abspielen. Wir sollten sicherstellen, dass wir über die erforderlichen Kapazitäten verfügen, um im Kampf beschädigte Schiffe zu reparieren, ohne die zukünftige Produktion zu behindern."
SIA_form_a_modern_sattahip_engineering_facility_r56:	"Eine moderne technische Einrichtung in Sattahip errichten"
SIA_form_a_modern_sattahip_engineering_facility_r56_desc:	"Unser Marinestützpunkt in der Bucht von Sattahip ist ein wesentlicher Bestandteil unserer Verteidigung im südlichen Golf und wird im Kriegsfall eine entscheidende Rolle bei der Versorgung unserer Marine spielen. Wir sollten an diesem strategisch wichtigen Standort eine moderne technische Einrichtung errichten, damit wir alle technologischen Entwicklungen zu unserem Vorteil nutzen können."
SIA_due_to_focus_establish_a_chiang_mai_military_academy_not_being_completed_we_will_receive_the_following_effects_r56_tt:	"Da der Schwerpunkt: §YGründung einer Militärakademie in Chiang Mai§! nicht abgeschlossen wurde, werden wir folgende Auswirkungen erfahren:"
SIA_look_to_modern_heavy_ships_r56:	"Auf moderne schwere Schiffe setzen"
SIA_look_to_modern_heavy_ships_r56_desc:	"Zwar fehlt uns die Industrie, um eine gigantische Marine zu unterhalten, doch werden wir sicherlich einige eigene schwere Schiffe benötigen, um unser Ansehen zu verteidigen und unsere Interessen in der Straße von Malakka durchzusetzen, sollte dies erforderlich werden. "
SIA_study_modern_naval_guns_r56:	"Moderne Schiffsgeschütze erforschen"
SIA_study_modern_naval_guns_r56_desc:	"[JAP.GetNameDefCap] und mehrere westliche Nationen haben beeindruckende Schiffswaffen entwickelt, um die Panzerung moderner Schiffe zu zerstören. Wir sollten diese Waffen untersuchen, um zu prüfen, ob wir geeignete Alternativen entwickeln können."
SIA_develop_anti_submarine_tools_r56:	"Entwicklung von U-Boot-Abwehrmitteln"
SIA_develop_anti_submarine_tools_r56_desc:	"Obwohl sich ein Großteil der Welt in Richtung Autarkie bewegt, würden wir, wie viele andere auch, in eine Krise geraten, sollte eine U-Boot-Macht unsere Meere blockieren. [ENG.GetNameDefCap] und [USA.GetNameDef] haben beeindruckende Mittel zur Aufspürung und Bekämpfung feindlicher U-Boote entwickelt, und wir sollten uns bemühen, diese in unsere eigene Flotte zu integrieren."
SIA_look_to_agile_surface_ships_r56:	"Auf agile Überwasserschiffe setzen"
SIA_look_to_agile_surface_ships_r56_desc:	"Leichte Schiffe haben seit den Tagen des Ersten Weltkriegs wohl die beeindruckendsten Entwicklungen durchlaufen: Sie sind mit Geschützen ausgestattet, die selbst die größten Schiffe versenken können, und sind gleichzeitig wendig und für die Massenproduktion geeignet. Vielleicht sollten wir uns um die Beschaffung von Konstruktionsplänen für unseren eigenen Gebrauch bemühen."
SIA_import_modern_heavy_ships_r56:	 "Moderne schwere Schiffe importieren"
SIA_import_modern_heavy_ships_r56_desc:	"Wenn wir eine Großmacht auf unseren Meeren sein wollen, benötigen wir eine Flotte, die unsere Präsenz in der Region schützen kann. Wir werden gigantische Schiffe in Auftrag geben und an deren Bau arbeiten, um damit zu einer wahren Seemacht sowohl an unserer Pazifik- als auch an unserer Indischen Küste zu werden."
SIA_royal_siamese_navy_r56:	" [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Marine"
SIA_royal_siamese_navy_r56_desc:	"Wenn wir eine Großmacht auf unseren Meeren sein wollen, benötigen wir eine Flotte, die in der Lage ist, unsere Präsenz in der Region zu schützen. Unsere Streitkräfte arbeiten hart daran, große Schiffe zu bauen, die für unsere Verteidigung notwendigen Schiffe zu beschaffen und eine echte Abschreckung für jede Macht zu werden, die glaubt, unsere Unabhängigkeit herausfordern zu können!"
SIA_develop_modern_escorts_r56:	" Moderne Begleitschiffe entwickeln"
SIA_develop_modern_escorts_r56_desc:	"Keine noch so gründliche Vorbereitung und keine noch so strenge Autarkie kann unsere Abhängigkeit vom internationalen Handel vollständig beseitigen. Wenn unsere Wirtschaft den kommenden Krieg überstehen soll, müssen wir daran arbeiten, unsere Konvoibegleitsysteme und -taktiken zu modernisieren."
SIA_prepare_coastal_minelaying_operations_r56:	"Vorbereitung von Minenlegeoperationen an der Küste"
SIA_prepare_coastal_minelaying_operations_r56_desc:	"Unsere unmittelbare Nähe zur Straße von Malakka und die Bedrohung unserer Küsten von zwei Seiten machen es erforderlich, dass wir alle Mittel einsetzen, um eine Bedrohung durch amphibische Streitkräfte abzuwehren. Wir sollten Minenlegeoperationen vorbereiten, um Eindringlinge fernzuhalten."
SIA_acquire_cheap_raiding_ships_r56:	" "Erwerben Sie kostengünstige Raider-Schiffe"
SIA_acquire_cheap_raiding_ships_r56_desc:	"Zwar fehlt uns die wirtschaftliche Macht, eine große konventionelle Flotte zu bauen, doch unsere Lage nahe der Straße von Malakka verschafft uns einen einzigartigen Vorteil, um deutsche U-Boot-Strategien nachzuahmen. Wir sollten kostengünstige U-Boot-Konstruktionen erwerben und prüfen, wie wir diese weiter verbessern können, um sie unseren Bedürfnissen anzupassen."
SIA_develop_submarine_facilities_r56:	"U-Boot-Einrichtungen entwickeln"
SIA_develop_submarine_facilities_r56_desc:	"Wir haben wichtige technologische Durchbrüche in der U-Boot-Technologie erzielt, doch fehlt uns die Industrie, um diese zu nutzen. Dies müssen wir unverzüglich beheben."
SIA_specialized_utility_submarines_r56:	"Spezialisierte Mehrzweck-U-Boote"
SIA_specialized_utility_submarines_r56_desc:	"U-Boote sind eines von vielen Instrumenten in unserem Kampf um die Kontrolle unserer Gewässer. Durch Investitionen in spezialisierte Konstruktionen für Fernoperationen können wir die Koordination mit anderen Bereichen unserer Marine verbessern. "
SIA_specialized_submarine_production_r56:	"Spezialisierte U-Boot-Produktion"
SIA_specialized_submarine_production_r56_desc:	"U-Boote sind eines von vielen Instrumenten in unserem Kampf um die Kontrolle unserer Gewässer. Unsere Investitionen in spezialisierte Konstruktionen für Fernoperationen verbessern die Koordination mit anderen Bereichen unserer Marine."
SIA_standardized_mass_production_r56:	 "Standardisierte Massenproduktion"
SIA_standardized_mass_production_r56_desc:	"Wenn wir einen Krieg in unseren Gewässern verhindern wollen, müssen wir alle Ressourcen der Marineindustrie voll und ganz auf eine riesige U-Boot-Flotte konzentrieren, die in der Lage ist, jede Nation, die vom Handel über unsere Meere abhängig ist, in Angst und Schrecken zu versetzen."
SIA_mass_submarine_production_r56:	"Massenproduktion von U-Booten"
SIA_mass_submarine_production_r56_desc:	"Wenn wir einen Krieg in unseren Gewässern verhindern wollen, müssen wir alle Ressourcen der Marineindustrie voll und ganz auf eine riesige U-Boot-Flotte konzentrieren, die in der Lage ist, jeder Nation, die vom Handel über unsere Meere abhängig ist, Schrecken einzuflößen."
SIA_separate_the_royal_aeronautical_service_r56:	"Ausgliederung des Royal Aeronautical Service"
SIA_separate_the_royal_aeronautical_service_r56_desc:	"Die Entwicklungen in der Luftfahrt haben sich bereits als entscheidender Faktor für die Zukunft der Kriegsführung erwiesen. Genau wie die westlichen Mächte [ROOT.GetNameDef] müssen wir eine starke und moderne Luftwaffe aufbauen, wenn wir auf der Weltbühne ernst genommen werden wollen."
SIA_the_siamese_air_force:	"[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Luftwaffe "
SIA_the_siamese_air_force_desc:	"Eine moderne Armee benötigt eine moderne Luftwaffe, um ihre Einsätze auf dem Schlachtfeld zu schützen und zu unterstützen. Die [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Luftwaffe soll genau das für [ROOT.GetNameDef] tun! "
SIA_parachute_infantry_battalion_r56:	"Fallschirmjägerbataillon"
SIA_parachute_infantry_battalion_r56_desc:	"Einige moderne Streitkräfte experimentieren mit luftgestützten Infanterie-Spezialeinheiten, die als Fallschirmjäger bekannt sind. Wir sollten mit dieser Form von Spezialeinheiten experimentieren. "
SIA_establish_a_chiang_mai_military_academy_r56:	"Gründung einer Militärakademie in Chiang Mai"
SIA_establish_a_chiang_mai_military_academy_r56_desc:	"Die Verteidigung unserer Nation konzentriert sich – im Guten wie im Schlechten – weitgehend auf unsere Hauptstadt. Doch die Zeiten ändern sich rasch, und viele innerhalb des Militärs schlagen die Gründung einer Akademie weiter im Landesinneren vor. Wir sollten dies umsetzen, um zu sehen, ob es für unsere Nation Früchte trägt."
has_at_least_3_researched_land_or_air_doctrine_tt:	"Hat mindestens §Y3§! Forschungsstufen in Land- oder Luftdoktrin erreicht"
SIA_due_to_focus_form_a_modern_sattahip_engineering_facility_not_being_completed_we_will_receive_the_following_effects_r56_tt:	"Da der Schwerpunkt: §YErrichtung einer modernen Sattahip-Ingenieuranlage§! nicht abgeschlossen wurde, werden wir folgende Auswirkungen erfahren:"
SIA_study_the_curtiss_p36_r56:	"Untersuchen Sie die Curtiss P-36"
SIA_study_the_curtiss_p36_r56_desc:	"Kampfflugzeuge haben seit den Tagen des Ersten Weltkriegs einen langen Weg zurückgelegt, und es ist klar, dass Wendigkeit am Himmel oberste Priorität hat. Wir sollten uns an die [USA.GetAdjective] wenden, um zu prüfen, ob sie uns Zugang zu ihrem Prototyp eines Leichtflugzeugs gewähren könnten."
SIA_acquire_the_messerschmitt_bf_110_r56:	"Erwerben Sie die Messerschmitt BF110"
SIA_acquire_the_messerschmitt_bf_110_r56_desc:	"Kampfflugzeuge haben seit den Tagen des Ersten Weltkriegs einen langen Weg zurückgelegt, und die am besten ausgerüsteten Flugzeuge sind es, die in den Lüften die Oberhand behalten. Wir sollten uns an die [GER.GetAdjective] wenden, um zu erfahren, ob sie uns Zugang zu ihrem Prototyp eines schweren Flugzeugs gewähren können."
SIA_begin_domestic_fighter_production_r56:	"Beginnen Sie mit der heimischen Kampfflugzeugproduktion "
SIA_begin_domestic_fighter_production_r56_desc:	"Mit den richtigen [SIA.GetAdjective]-Konstruktionsplänen in unseren Händen ist es an der Zeit, Mittel in die nationale Flugzeugproduktion zu investieren. Auch wenn es nur ein kleiner Anfang ist, müssen wir irgendwo beginnen."
SIA_import_foreign_bombers_r56:	"Importieren Sie ausländische Bomber"
SIA_import_foreign_bombers_r56_desc:	"Bomber haben sich zu einer Schreckensmacht auf dem Schlachtfeld entwickelt. Wir müssen einen westlichen Lieferanten finden, damit wir Zugang zu dieser entscheidenden Erfindung erhalten."
SIA_support_interbranch_operations_r56:	"Unterstützung von interdienstlichen Operationen"
SIA_support_interbranch_operations_r56_desc:	" Während wir eigene Flugzeugkonstruktionen entwickeln, müssen wir weiterhin der Zusammenarbeit mit unseren Soldaten am Boden Vorrang einräumen, wenn wir gewinnen wollen."
SIA_design_modern_fighters_r56:	"Moderne Kampfflugzeuge entwickeln"
SIA_design_modern_fighters_r56_desc:	"Es ist an der Zeit, eigene moderne Kampfflugzeuge zu entwickeln, damit wir endlich die Vorherrschaft in unseren Lufträumen erlangen können."
SIA_produce_modern_bombers_r56:	"Moderne Bomber produzieren"
SIA_produce_modern_bombers_r56_desc:	"Unsere eigenen Bomberentwürfe beginnen Früchte zu tragen, doch es fehlt uns an der Industrie, um sie herzustellen. Wir müssen dem Bau von Fabriken Vorrang einräumen, die unsere modernen Kriegswaffen bauen können."
SIA_aircraft_production_advances_r56:	 "Fortschritte in der Flugzeugproduktion"
SIA_aircraft_production_advances_r56_desc:	"Da wir nun über eigene Flugzeuge verfügen, ist es an der Zeit, beträchtliche Ressourcen in deren Produktion zu investieren."
SIA_send_air_force_cadets_abroad_r56:	"Luftwaffenkadetten ins Ausland entsenden"
SIA_send_air_force_cadets_abroad_r56_desc:	"Die westlichen Nationen verfügen über unzählige Akademien, an denen Piloten und Offiziere in der Kunst der Luftkriegsführung ausgebildet werden. Wir sollten unsere eigenen Kadetten nach Europa entsenden, um die Erfahrungen des Kontinents in unsere eigene Luftwaffe zu integrieren."
SIA_foreign_air_mission_r56:	"Auslandsmission der Luftwaffe"
SIA_foreign_air_mission_r56_desc:	"Die Nationen des Westens verfügen über unzählige Akademien, an denen Piloten und Offiziere in der Kunst der Luftkriegsführung ausgebildet werden. Wir sollten unsere eigenen Kadetten nach Europa entsenden, um die Erfahrungen des Kontinents in unsere eigene Luftwaffe zu integrieren."
SIA_royal_siamese_air_force_academy_r56:	 "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Luftwaffenakademie"
SIA_royal_siamese_air_force_academy_r56_desc:	"Mit einem talentierten Pool an Offizieren, die von ihren Einsätzen rund um den Globus zurückkehren, ist es an der Zeit, eine eigene Akademie zu gründen, um [SIA.GetNameDef]s Beste und Klügste auszubilden, damit sie den Sieg in den Lüften erringen können."
SIA_the_royal_siamese_air_force_r56:	"Die [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Luftwaffe"
SIA_the_royal_siamese_air_force_r56_desc:	 "Mit einem talentierten Pool an Offizieren, die von ihren Einsätzen rund um den Globus zurückkehren, ist es an der Zeit, eine eigene Akademie zu gründen, um die Besten und Klügsten von [SIA.GetNameDef] auszubilden, damit sie den Sieg in den Lüften erringen."
SIA_continue_sending_cadets_abroad_r56:	"Weiterhin Kadetten ins Ausland entsenden"
SIA_continue_sending_cadets_abroad_r56_desc:	" Wir sollten uns nicht allein auf uns selbst verlassen, um unsere Armee stark zu machen. [SIA.GetNameDefCap] verfügt über eine Vielzahl kluger Köpfe, doch unsere Erfahrungen aus dem Ersten Weltkrieg reichen nur bis zu einem gewissen Punkt. Wir sollten die Programme für Kadetten im Ausland ausweiten, damit deren Erfahrungen unsere Landesverteidigung neu gestalten können."
SIA_study_defense_in_depth_models_r56:	"Modelle der mehrschichtigen Verteidigung untersuchen"
SIA_study_defense_in_depth_models_r56_desc:	" Im Vergleich zu den Bedrohungen, die sich am Horizont abzeichnen, sind unsere Männer zahlenmäßig, ausrüstungstechnisch und in ihrer Ausbildung weit unterlegen. Das Nachahmen der Vorgehensweisen "aufstrebender" Mächte wird nicht zu einer Modernisierung über Nacht führen; wir müssen auch auf die Nationen blicken, die gegen überlegene Feinde triumphiert haben, damit auch unsere Flagge trotz schwieriger Umstände den Sieg erringen kann."
SIA_begin_an_inland_retreat_r56:	" "Rückzug ins Landesinnere einleiten"
SIA_begin_an_inland_retreat_r56_desc:	"Der Krieg an unserer Südküste verläuft nicht gut, doch das ist für uns nicht das Ende. Wir werden uns ins Landesinnere zurückziehen und diese Narren in ein Hinterland locken, das für Artillerie, moderne Versorgungslinien oder Kraftfahrzeuge ungeeignet ist."
SIA_defensive_reorganization_r56:	"Defensive Neuordnung"
SIA_defensive_reorganization_r56_desc:	" Der Krieg an unserer Südküste verläuft nicht gut, aber das ist noch nicht das Ende für uns. Wir werden uns ins Landesinnere zurückziehen und diese Narren in ein Kernland locken, das für Artillerie, moderne Versorgungslinien oder Kraftfahrzeuge ungeeignet ist."
SIA_continue_the_fight_underground_r56:	"Den Kampf im Untergrund fortsetzen"
SIA_continue_the_fight_underground_r56_desc:	"Unsere konventionellen Streitkräfte haben es versäumt, die Nation zu schützen, aber wir werden niemals aufgeben. Wir werden die besten unserer überlebenden Streitkräfte und die Regierung in die Länder unserer Verbündeten zurückziehen und uns neu aufstellen, damit wir das zurückerobern können, was uns gehört!"
SIA_taking_the_fight_underground_r56:	" Den Kampf in den Untergrund verlegen"
SIA_taking_the_fight_underground_r56_desc:	"Unsere konventionellen Streitkräfte haben es versäumt, die Nation zu schützen, doch wir werden niemals aufgeben. Wir werden die besten unserer überlebenden Streitkräfte und die Regierung in die Länder unserer Verbündeten zurückziehen und uns neu aufstellen, damit wir das zurückerobern können, was uns gehört!"
SIA_prepare_landing_operations_r56:	"Landungsoperationen vorbereiten"
SIA_prepare_landing_operations_r56_desc:	"Wenn wir unser Land aus den Fesseln unserer Besatzer befreien wollen, brauchen wir unsere besten Männer und die gründlichste Ausbildung. Wir haben sowohl bei amphibischen als auch bei Luftlandeeinsätzen beeindruckende Erfolge und lächerliche Misserfolge erlebt – wir müssen zu den Ersteren gehören."
SIA_foster_connections_on_the_ground_r56:	"Verbindungen vor Ort pflegen"
SIA_foster_connections_on_the_ground_r56_desc:	"Vielen in unserer Nation fehlte das Glück, unseren Besatzern zu entkommen, und noch viel mehr bleiben aus freien Stücken. Wir müssen unsere Kräfte mit ihren vereinen, wenn wir gegen unsere ungerechten Invasoren erfolgreich sein wollen!"
SIA_take_the_fight_to_our_enemies_soil_r56:	"Den Kampf auf das Gebiet unserer Feinde tragen"
SIA_take_the_fight_to_our_enemies_soil_r56_desc:	"Unsere Kontrolle über die Nation kehrt von Tag zu Tag rasch zurück. Die Zeit ist gekommen, die Rückkehr unserer Regierung zu feiern und diesem Krieg ein für alle Mal ein Ende zu setzen! "
SIA_taking_the_fight_to_our_enemies_soil_r56:	"Den Kampf auf das Gebiet unserer Feinde tragen"
SIA_taking_the_fight_to_our_enemies_soil_r56_desc:	"Da die Befreiung unserer Nation nahe ist, ist die Zeit gekommen, den Kampf über unser Gebiet hinaus auf unsere Feinde zu tragen, damit wir diesen Krieg ein für alle Mal beenden können! "
SIA_the_question_of_combined_arms_warfare_r56:	"Die Frage der kombinierten Waffenführung"
SIA_the_question_of_combined_arms_warfare_r56_desc:	"Der Große Krieg hat viele gewaltige Kriegswaffen auf das moderne Schlachtfeld gebracht, vor allem mechanisierte Fahrzeuge. Wir müssen einen Plan ausarbeiten, um diese lebenswichtigen Errungenschaften in die Ausrüstung unserer treuen Soldaten zu integrieren."
SIA_procure_auxiliary_tanks_r56:	"Beschaffung von Hilfspanzern"
SIA_procure_auxiliary_tanks_r56_desc:	"Panzer sind teuer, und vollständig mechanisierte Divisionen sind unter unseren Umständen einfach nicht praktikabel. Dies soll jedoch die Vorteile moderner Panzer nicht schmälern, denn viele unserer führenden Ingenieure hegen kühne Pläne, Hilfspanzer zu entwickeln, die unsere Infanterie unterstützen und in unserem einzigartigen Umfeld erfolgreich eingesetzt werden können."
SIA_begin_domestic_vehicle_production_r56:	"Inländische Fahrzeugproduktion aufnehmen"
SIA_begin_domestic_vehicle_production_r56_desc:	"Um moderne Fahrzeuge zu produzieren, benötigen wir die Industrie und die Arbeitskräfte, die für deren Herstellung erforderlich sind. Wir müssen Mittel bereitstellen, um dies zu verwirklichen."
SIA_the_legacy_of_clausewitz_r56:	"Das Erbe von Clausewitz"
SIA_the_legacy_of_clausewitz_r56_desc:	"Auch wenn sie sehr teuer sind, dürfen wir nicht vernachlässigen, was zweifellos die Zukunft der Kriegsführung ist. Vollständig mechanisierte Offensiven werden ein wichtiger Bestandteil künftiger Kriege sein, und wir werden zu den Ersten gehören, die sie umsetzen!"
SIA_prepare_defensive_infrastructure_r56:	"Verteidigungsinfrastruktur vorbereiten"
SIA_prepare_defensive_infrastructure_r56_desc:	 "Wenn wir uns gegen einen militärisch überlegenen Feind verteidigen wollen, müssen wir das Beste aus unserem Gelände und unseren Männern in einem verzweifelten Kampf nutzen, um standzuhalten. Eine moderne Verteidigungsinfrastruktur würde genau dabei helfen."
SIA_masters_of_our_terrain_r56:	"Meister unseres Geländes"
SIA_masters_of_our_terrain_r56_desc:	"Die [SIA.GetAdjective] Streitkräfte verfügen über unzählige Jahrhunderte Erfahrung im Kampf in einem Gelände, in dem nur wenige über vergleichbare Fachkenntnisse verfügen. Diese Tatsache muss für alle sichtbar gemacht werden: Durch unsere Ausbildung, unsere Bekleidung und unsere Spezialfahrzeuge werden wir unser rechtmäßiges Land für immer beherrschen!"
SIA_masters_of_our_terrain_r56_tt:	"§Y1x§! §G75 % §!Forschungsbonus für: §YTechnologien für amphibische Traktoren und amphibische Panzerfahrzeuge§!."
SIA_masters_of_our_terrain_r56_tt_2:	"§Y2x§! §G75 %§!Forschungsbonus für: §YTarnmuster, Sommerbekleidung und Dschungelinfanterie-Technologien§!."
SIA_incorporate_combat_engineers_r56:	" "Pioniertruppen einbinden"
SIA_incorporate_combat_engineers_r56_desc:	"Unser Gelände stellt für jede Streitmacht große Schwierigkeiten dar. Pionierregimenter, die unsere Infanterie und Fahrzeuge begleiten können, könnten uns helfen, alle Schwierigkeiten zu umgehen, denen sie an der Front begegnen. "
SIA_modern_troop_support_systems_r56:	"Moderne Truppenunterstützungssysteme"
SIA_modern_troop_support_systems_r56_desc:	"Im letzten Jahrhundert gab es an vielen Fronten bemerkenswerte Innovationen, und wir können es uns nicht leisten, den Anschluss zu verlieren. Eine angemessene Truppenunterstützung sowie Funkgeräte sollten so bald wie möglich in unseren Streitkräften eingeführt werden."
SIA_improve_national_logistics_r56:	"Verbesserung der nationalen Logistik"
SIA_improve_national_logistics_r56_desc:	"Unsere logistische Ausrüstung muss den Gegebenheiten eines Krieges Rechnung tragen, der sowohl auf als auch außerhalb [SIA.GetAdjective] des Landes geführt wird, und sie muss zudem unserem neuen Status als moderne Streitkräfte entsprechen."
SIA_order_pack_bicycles_r56:	"Bestellung von Lastenfahrrädern"
SIA_order_pack_bicycles_r56_desc:	"[JAP.GetNameDefCap] hat in gewissem Umfang Fahrradbataillone in seine Streitkräfte integriert. Im Vergleich zu anderen Formen der Kavallerie sind diese viel besser für unseren Status als relativ arme Nation geeignet, deren Gelände für moderne Fahrzeuge ungeeignet ist."
SIA_acquire_modern_equipment_r56:	"Moderne Ausrüstung beschaffen"
SIA_acquire_modern_equipment_r56_desc:	"Hingabe und Erfahrung reichen nicht aus, damit unsere Nation die Herausforderungen unserer grausamen Welt überstehen kann. Wir müssen ein Programm zur Modernisierung der Rüstung umsetzen, damit wir eine außergewöhnlich gut ausgerüstete Streitmacht sind."
SIA_shift_to_national_designs_r56:	"Umstellung auf nationale Konstruktionen"
SIA_shift_to_national_designs_r56_desc:	"Jeder kennt die Schwächen, die mit der Abhängigkeit von ausländischen Mächten einhergehen. Es ist an der Zeit, dass wir unsere Abhängigkeit von anderen Nationen beenden."
SIA_expand_bangkok_arsenal_r56:	"Ausbau des Arsenals in Bangkok"
SIA_expand_bangkok_arsenal_r56_desc:	"Zwar ist unsere Kernindustrie noch klein, doch unsere Kapazitäten zur Herstellung von militärischer Ausrüstung haben sich verbessert. Wir sollten diese Entwicklungen vorantreiben, wenn wir militärisch autark werden wollen."
SIA_continue_importing_foreign_equipment_r56:	"Weiterhin ausländische Ausrüstung importieren"
SIA_continue_importing_foreign_equipment_r56_desc:	" Unsere Abhängigkeit von ausländischer Ausrüstung ist eine Stärke, keine Schwäche. Unsere Nation wäre sicherlich nicht in der Lage, die Forschung und Entwicklung für all unsere Bedürfnisse zu bewältigen, zumindest derzeit; daher muss der Import ausländischer Ausrüstung fortgesetzt werden."
SIA_cooperation_on_military_projects_r56:	"Zusammenarbeit bei militärischen Projekten"
SIA_cooperation_on_military_projects_r56_desc:	"Unsere wichtigsten militärischen Partner sind uns in mehr Bereichen voraus, als wir uns vorstellen können. Wir sollten darauf hinarbeiten, ihre neuesten Errungenschaften zu integrieren, damit wir eine moderne, mächtige Streitmacht in der Region bleiben."
SIA_asias_innovation_powerhouse_r56:	"Asiens Innovationskraftwerk"
SIA_asias_innovation_powerhouse_r56_desc:	"Im Geiste der technologischen Autarkie müssen wir zu einem Zentrum für militärische Forschung in der Region werden. Um dies zu verwirklichen, sind zahlreiche Investitionen erforderlich. Wenn es um das Wohl der Nation geht, werden wir sicherlich die Ressourcen und den Willen dafür aufbringen können. "
SIA_look_to_new_fields_of_engineering_r56:	"Neue Bereiche der Technik erschließen"
SIA_look_to_new_fields_of_engineering_r56_desc:	"So wie der Große Krieg uns unglaubliche Maschinen zu Lande, zu Wasser und in der Luft bescherte, werden die bevorstehenden Konflikte weitere ihrer Art in den Vordergrund rücken. Wir sollten in einen Bereich unserer Forschungs- und Entwicklungssektoren investieren, der sich der Entdeckung, Weiterentwicklung und Nutzung neuer Technologien widmet."
SIA_amend_the_military_service_act_r56:	"Das Wehrpflichtgesetz ändern"
SIA_amend_the_military_service_act_r56_desc:	"Die Bürokratie, die unser Wehrpflicht-System ausmacht, ist im Vergleich zu den Mächten der Region veraltet. Im Geiste der Leistungsgesellschaft und der Rechtsgleichheit sollten wir das Wehrpflichtgesetz ändern, um Kandidaten, die nicht für den Dienst qualifiziert sein sollten, besser auszusortieren und gleichzeitig Wehrpflichtbefreiungen auf die absolut notwendigsten Fälle zu beschränken."
SIA_specialized_breakthrough_divisions_r56:	"Spezialisierte Durchbruchseinheiten"
SIA_specialized_breakthrough_divisions_r56_desc:	"Ganz gleich, wie viel Zeit wir mit der Verteidigung verbringen – diese allein hat noch nie einen Krieg gewonnen. Wir sind von feindlichem Gelände und großen Ballungszentren umgeben; daher müssen Militäreinheiten gebildet werden, die darauf ausgelegt sind, diese Hindernisse zu umgehen."
SIA_standardize_troop_recruitment_r56:	"Standardisierung der Truppenrekrutierung"
SIA_standardize_troop_recruitment_r56_desc:	"Obwohl unsere Reformen des Wehrdienstgesetzes gute Ergebnisse gezeigt haben, würde eine weitere Standardisierung des Wehrpflicht-Systems es uns ermöglichen, einen immer größeren Teil der Gesellschaft auszubilden und ihm Disziplin zu vermitteln."
SIA_construct_offensive_infrastructure_r56:	"Aufbau einer Offensivinfrastruktur"
SIA_construct_offensive_infrastructure_r56_desc:	"[ROOT.GetNameDefCap] befindet sich in einer strategischen Lage, um Offensivkriege zu führen, und ist in der Gefahr, aus jeder Richtung in Defensivkriege verwickelt zu werden. Wir sollten die Infrastruktur vorbereiten, die erforderlich ist, um über unsere Grenzen hinaus vorzudringen, damit jeglicher Konflikt, an dem unsere Nation beteiligt ist, von unserem Staatsgebiet ferngehalten wird. "
SIA_offensive_infrastructure_investments_r56:	"Investitionen in offensive Infrastruktur"
SIA_offensive_infrastructure_investments_r56_desc:	"[ROOT.GetNameDefCap] befindet sich in einer strategischen Lage, um offensive Kriege zu führen und in Verteidigungskriege aus jeder Richtung verwickelt zu werden. Wir sollten die Infrastruktur vorbereiten, die erforderlich ist, um über unsere Grenzen hinaus vorzustoßen, damit jeder Konflikt, an dem unsere Nation beteiligt ist, von unserem Land ferngehalten wird."
SIA_prepare_calculated_offensives_r56:	"Berechnete Offensiven vorbereiten"
SIA_prepare_calculated_offensives_r56_desc:	"Wir sind unseren Feinden zahlenmäßig, an Nachschub und an Erfahrung unterlegen, doch dies ist kein Grund, die Hoffnung auf positive Ergebnisse in einem Konflikt aufzugeben. Die Ausarbeitung geeigneter Pläne für Rückzüge und Durchbrüche gegen potenzielle Feinde wird sich als unverzichtbar erweisen, um unsere Ressourcen bestmöglich zu nutzen."
SIA_prepare_calculated_offensives_r56_tt:	"Schaltet frei §YAusarbeitung offensiver Schlachtpläne§! Entscheidungen, die §Gvorübergehende Boni§! im Kampf gegen Nachbarländer freischalten."
SIA_forging_offensive_battleplans_r56:	 "Offensive Schlachtpläne schmieden"
SIA_forging_offensive_battleplans_r56_desc:	"Wir sind unseren Feinden zahlenmäßig, an Nachschub und an Erfahrung unterlegen, doch das ist kein Grund, die Hoffnung auf positive Ergebnisse in einem Konflikt aufzugeben. Die Ausarbeitung geeigneter Pläne für Rückzüge und Durchbrüche gegen potenzielle Feinde wird sich als unverzichtbar erweisen, um die uns zur Verfügung stehenden Ressourcen bestmöglich zu nutzen."
SIA_wage_victory_against_paris_r56:	"Erringen Sie den Sieg über Paris"
SIA_wage_victory_against_paris_r56_desc:	"Die Franzosen, die uns im Laufe des letzten Jahrhunderts so viele Probleme bereitet haben, befinden sich endlich in einer Lage, in der wir sie in die Knie zwingen können. Nur noch ein Schritt nach vorne, und sie werden für immer aus der Region vertrieben!"
SIA_push_against_the_chinese_r56:	"Vorstoß gegen die Chinesen"
SIA_push_against_the_chinese_r56_desc:	"Die Chinesen, die einst die alleinige Herrschaft über unsere Heimatregion innehatten, sind erneut Feinde der Nation. Wir werden ihren Vormarsch stoppen und den Kampf auf ihr Land tragen!"
SIA_crush_the_indian_front_r56:	"Die indische Front zerschlagen"
SIA_crush_the_indian_front_r56_desc:	"Die zersplitterten indischen Gebiete westlich von uns beherbergen einige der stärksten Streitkräfte der Region, und die Zeit ist gekommen, ihre Armee zu dezimieren. "
SIA_break_malayan_defenses_r56:	"Durchbrechen Sie die malaiischen Verteidigungslinien"
SIA_break_malayan_defenses_r56_desc:	"Die Malaiischen Gebiete beherbergen einige der wichtigsten Ressourcen der Region. Da sie zersplittert sind, können wir sie im Handumdrehen vernichten!"
SIA_shatter_japans_invincibility_r56:	"Zerschlagen Sie Japans "Unbesiegbarkeit""
SIA_shatter_japans_invincibility_r56_desc:	"Japan hat in den letzten Jahrzehnten eine Reihe entscheidender Siege errungen. Es gibt keine unbesiegbaren Armeen und es hat sie nie gegeben; wir werden der Welt diese Tatsache vor Augen führen, wenn es sonst niemand tut!"
SIA_expand_the_reserve_force_r56:	"Die Reservekräfte ausbauen"
SIA_expand_the_reserve_force_r56_desc:	"Angesichts so vieler potenzieller Feinde jenseits unserer zahlreichen Grenzen, die möglicherweise sogar gleichzeitig angreifen könnten, müssen wir daran arbeiten, den Pool an Soldaten zu vergrößern, die bereit sind, uns zu verteidigen."
SIA_sharpen_training_standards_r56:	"Ausbildungsstandards verschärfen"
SIA_sharpen_training_standards_r56_desc:	"Da andere Nationen jeden ihnen zur Verfügung stehenden Vorteil nutzen, müssen wir unsere Ausbildungsmethoden weiter verbessern, damit unsere Soldaten auf dem modernen Schlachtfeld gefürchtet sind."
SIA_professional_army_r56:	"Berufsarmee"
SIA_professional_army_r56_desc:	"Da andere Nationen jeden ihnen zur Verfügung stehenden Vorteil nutzen, müssen wir unsere Ausbildungsmethoden weiter verbessern, damit unsere Soldaten auf dem modernen Schlachtfeld gefürchtet sind."
SIA_dept_independent_state_commerce_r56:	"Ministerium für unabhängigen Staatshandel"
SIA_dept_independent_state_commerce_r56_desc:	"Wir haben bei der industriellen Entwicklung kaum Fortschritte erzielt, was eindeutig zu unserem Nachteil ist. Wir sollten ein Ministerium einrichten, um zu untersuchen, wie wir unser weitläufiges, unterentwickeltes Land am besten industrialisieren können."
unlocks_decision_privatize_national_assets_which_grants_tt:	"Entscheidung freigeschaltet: §YPrivatisierung staatlicher Vermögenswerte§!, die Folgendes gewährt:"
SIA_privatize_national_assets_r56:	"Privatisierung staatlicher Vermögenswerte"
SIA_privatize_national_assets_r56_desc:	 "Das Abstoßen staatlicher Vermögenswerte verschiedener Art auf dem freien Markt wäre ein schneller Weg, um Einnahmen für unsere Regierung zu generieren und gleichzeitig den Geldfluss in unserer Wirtschaft anzukurbeln."
SIA_issue_economic_mobilization_r56:	"Wirtschaftsmobilisierung ausrufen"
SIA_issue_economic_mobilization_r56_desc:	"Die Zeit ist gekommen: Die Bedrohungen für unsere nationale Sicherheit sind zu groß geworden, um sie zu ignorieren. Unsere Wirtschaft und die Gesellschaft als Ganzes müssen auf das Blutvergießen vorbereitet sein, das bald kommen wird. "
SIA_issue_economic_mobilization_r56_tt:	"Schließt Fokus ab §YThema Wirtschaftsmobilisierung§!, was Folgendes gewährt:"
SIA_issue_economic_mobilization_r56_timer_tt:	"Hat Fokus abgeschlossen: §YThema Wirtschaftsmobilisierung§! vor weniger als 365 Tagen\nAktuelle Tage sind: [?SIA_issue_economic_mobilization_r56_timer_flag:days|Y0]"
SIA_protect_vital_production_r56:	" "Schützen Sie die lebenswichtige Produktion"
SIA_protect_vital_production_r56_desc:	"Wir sind ein Knotenpunkt für viele Ressourcen, die für die Kriegsanstrengungen entscheidend sind. Wir sollten alles in unserer Macht Stehende tun, um deren Produktion auszuweiten und uns auf den schlimmsten Fall vorzubereiten, dass sie uns entgleiten."
SIA_strategic_resource_policies_r56:	"Strategische Ressourcenpolitik"
SIA_strategic_resource_policies_r56_desc:	"Wir sind ein Knotenpunkt für viele Ressourcen, die für die Kriegsführung von entscheidender Bedeutung sind. Wir sollten alles in unserer Macht Stehende tun, um deren Produktion auszuweiten und uns auf den schlimmsten Fall vorzubereiten, in dem sie uns entgleiten."
SIA_expand_military_research_r56:	"Militärforschung ausweiten"
SIA_expand_military_research_r56_desc:	"Es ist unerlässlich, dass wir unseren Feinden auf technologischer Ebene einen Schritt voraus sind. Gelingt uns dies nicht, bedeutet dies, dass wir die Nation und ihre Soldaten nicht vor den Konflikten schützen können, die in Asien toben."
SIA_scale_up_naval_production_r56:	"Ausweitung der Marineproduktion"
SIA_scale_up_naval_production_r56_desc:	"[ROOT.GetNameDefCap] ist eine Nation an zwei Meeren, und wir können an keinem von beiden eine Macht sein, ohne eine Marine, die dies durchsetzen kann. Industrielle Mittel müssen in den Aufbau einer starken Marineindustrie fließen!"
SIA_scaling_up_naval_production_r56:	"Ausweitung der Marineproduktion"
SIA_scaling_up_naval_production_r56_desc:	"[ROOT.GetNameDefCap] ist eine Nation an zwei Meeren, und wir können auf keinem von beiden eine Macht sein, ohne eine Marine, die dies durchsetzt. Industrielle Mittel müssen in den Aufbau einer starken Marineindustrie fließen! "
SIA_bolster_aerial_production_r56:	"Ausbau der Luftfahrtproduktion"
SIA_bolster_aerial_production_r56_desc:	"Flugzeuge sind die Zukunft der Kriegsführung, und es ist an der Zeit, alles darauf zu setzen. Mit unserem für die Verteidigung geeigneten Gelände und der Macht moderner Flugzeuge auf unserer Seite – wer könnte da eine echte Bedrohung für unsere Unabhängigkeit darstellen?"
SIA_expand_the_ground_armaments_industry_r56:	"Ausbau der Bodenwaffenindustrie"
SIA_expand_the_ground_armaments_industry_r56_desc:	" Der größte Teil unserer Militärmittel muss in die Verbesserung der Lage unserer Soldaten am Boden fließen, die sich als Rückgrat unserer Armee verdient gemacht haben. Alle anderen Bereiche unserer Streitkräfte können sicherlich warten, bis diese Bedürfnisse erfüllt sind."
SIA_expanding_the_ground_armaments_industry_r56:	"Ausbau der Bodenwaffenindustrie"
SIA_expanding_the_ground_armaments_industry_r56_desc:	"Die wichtigsten Mittel unserer Militärfinanzen müssen in die Verbesserung der Lage unserer Soldaten an der Front fließen, die sich als Rückgrat unserer Armee mit Auszeichnung erweisen. Alle anderen Bereiche unserer Streitkräfte können sicherlich warten, bis diese Bedürfnisse erfüllt sind."
SIA_process_northern_agricultural_exports_r56:	"Verarbeitung landwirtschaftlicher Exporte aus dem Norden"
SIA_process_northern_agricultural_exports_r56_desc:	" Bis heute ist die Wirtschaft des Landes nach wie vor in entscheidendem Maße von landwirtschaftlichen Ressourcen abhängig, und die ersten industriellen Bemühungen sollten dies widerspiegeln. Bevor wir uns der Schwerindustrie oder dem Konsum zuwenden, sollten wir zunächst Fabriken errichten, um aus unserer großen landwirtschaftlichen Produktion wirtschaftlichen Nutzen zu ziehen."
SIA_bangkok_centered_industrial_development_r56:	"Auf Bangkok ausgerichtete industrielle Entwicklung"
SIA_bangkok_centered_industrial_development_r56_desc:	"Bangkok ist das Herzstück unseres Landes, da es an unseren wichtigen Flussnetzen liegt, über eine lebenswichtige Infrastruktur verfügt und für den kommerziellen Export in der Nähe des Meeres liegt. Wir sollten unsere begrenzten Ressourcen auf weitere Investitionen in diesen wichtigen Bereich konzentrieren, damit wir Südostasien seine erste Stadt auf dem wirtschaftlichen Niveau des Westens bescheren können."
SIA_support_bangkoks_ongoing_urbanization_r56:	"Unterstützung der fortschreitenden Urbanisierung Bangkoks"
SIA_support_bangkoks_ongoing_urbanization_r56_desc:	"Auch wenn der Fortschritt bislang langsam war, wären weitere Finanzmittel für die Industrialisierung des Großraums Bangkok derzeit der schnellste Weg, um unsere Wirtschaftsleistung zu steigern."
SIA_mechanize_the_agrarian_provinces_r56:	"Mechanisierung der landwirtschaftlichen Provinzen"
SIA_mechanize_the_agrarian_provinces_r56_desc:	"Bangkoks Vorrangstellung in der Entwicklung ist ein Hindernis für die Nation und ihre Bevölkerung, und wir sollten dem unverzüglich ein Ende setzen. Auch wenn die Einführung der Industrialisierung auf dem Land gewisse Unruhen mit sich bringen würde, wäre die schrittweise Einführung mechanisierter Werkzeuge ein erster Schritt zur Verbesserung unserer wirtschaftlichen Effizienz."
SIA_support_new_industrial_centers_r56:	"Neue Industriezentren unterstützen"
SIA_support_new_industrial_centers_r56_desc:	"Unsere verstärkten Investitionen in den ländlichen Raum zahlen sich aus. Es ist an der Zeit, diese Mittel aufzustocken und echte moderne Industriezentren im ganzen Land zu schaffen."
SIA_begin_the_national_industrial_plan_r56:	"Den nationalen Industrieplan einleiten"
SIA_begin_the_national_industrial_plan_r56_desc:	"Trotz unserer Bemühungen schreitet unsere Industrialisierung zu langsam voran. Mit der Hilfe unserer talentiertesten Berater ist es an der Zeit, einen Plan zur Massenindustrialisierung zu formulieren, der unsere Wirtschaft am Leben und stabil hält und gleichzeitig Wachstum in großem Maßstab fördert."
upgrade_department_of_independent_state_commerce_r56_tt:	"Upgrades §YIndustriekonzern§!: §YMinisterium für Handel der Unabhängigen Staaten§! zu:"
SIA_fulfill_domestic_consumption_r56:	"Den Binnenkonsum decken"
SIA_fulfill_domestic_consumption_r56_desc:	"Eine Ära raschen Wachstums steht bevor, und mit ihr steigt der Lebensstandard. Wir sollten sicherstellen, dass unsere Wirtschaft in der Lage ist, unserer Bevölkerung einige der Annehmlichkeiten zu bieten, die wir andernfalls nur teuer aus Übersee importieren könnten."
SIA_support_a_tech_industry_boom_r56:	"Förderung eines Booms in der Technologiebranche"
SIA_support_a_tech_industry_boom_r56_desc:	"Wachstum und Frieden werden unsere Wirtschaft verändern. Die Nation, die gestern noch ein industrielles Hinterland war, wird bald eine Nation der Zukunft sein. Angesichts einer großen, stetig wachsenden Bevölkerung werden wir in die Bildung und Industrie investieren, die wir benötigen, um eine Wirtschaftsmacht in Südostasien zu werden."
SIA_link_isan_with_the_strategic_regions_r56:	"Isan mit den strategischen Regionen verbinden"
SIA_link_isan_with_the_strategic_regions_r56_desc:	"Unsere geografische Lage und die damit verbundene Abhängigkeit vom nach Süden fließenden Chao Phraya machen die Entwicklung des Nordostens zur schwierigsten aller unserer Regionen. Auch wenn wir die Natur nicht kontrollieren können, ist der Bau einer modernen Infrastruktur, die Bangkok mit den nordöstlichen Provinzen verbindet, ein wichtiger Anfang."
SIA_irrigate_the_countryside_r56:	"Bewässerung des ländlichen Raums"
SIA_irrigate_the_countryside_r56_desc:	"Gut geplante und durchgeführte Bewässerungsprojekte könnten den Lebens- und Wirtschaftsraum erheblich vergrößern und gleichzeitig die landwirtschaftliche Produktion massiv steigern. Wir sollten bestehende Projekte vorantreiben, um unsere unterentwickelten Regionen zu transformieren."
SIA_begin_laoss_industrialization_r56:	"Die Industrialisierung von Laos einleiten"
SIA_begin_laoss_industrialization_r56_desc:	 "Die laotischen Gebiete am östlichen Ufer des Mekong sind fast vollständig unerschlossen. Doch durch die Anbindung an die neuen Verbindungen nach Isan und durch Investitionen in die frühe Fertigungsindustrie kann sich dies sicherlich schnell ändern!"
SIA_widen_the_central_industrial_region_r56:	"Erweiterung der zentralen Industrieregion"
SIA_widen_the_central_industrial_region_r56_desc:	" Die bestehende Leichtindustrie in unserer Zentralregion hat uns zu einer der am schnellsten wachsenden Volkswirtschaften der Welt gemacht. Wir sollten die Politik zur Förderung dieser Art von Industrie fortsetzen, bis wir eine stabile, industrialisierte und prosperierende Nation sind."
SIA_experiment_with_heavy_industries_r56:	"Experimente mit der Schwerindustrie"
SIA_experiment_with_heavy_industries_r56_desc:	"Eine florierende Schwerindustrie bedeutet einen Überschuss an Maschinen und Ressourcen, die wir benötigen, um moderne Fahrzeuge herzustellen, in großem Umfang preisgünstigen Wohnraum zu schaffen und eine moderne Infrastruktur aufzubauen. Die zentrale Region wäre ein hervorragender Ort, um damit zu experimentieren."
SIA_dam_the_chao_phraya_river_r56:	"Staudamm am Chao-Phraya-Fluss"
SIA_dam_the_chao_phraya_river_r56_desc:	"Wasserkraftprojekte an unseren lebenswichtigen Wasserwegen sind für unsere Unabhängigkeit und Entwicklung von entscheidender Bedeutung. Die Umsetzung eines Projekts an unserem größten Fluss wird ein Testfall für künftige Staudämme im ganzen Land sein!"
SIA_national_road_development_plan_r56:	"Nationaler Straßenausbauplan"
SIA_national_road_development_plan_r56_desc:	"Das vielleicht größte Hindernis für unsere Entwicklung ist die Vorrangstellung Bangkoks und unserer anderen südlichen Häfen. Während unsere großen Flüsse nach Süden fließen, lebt ein Großteil unserer Bevölkerung im Norden und Osten, wo die Transportkosten hoch sind. Wir sollten uns bemühen, Bangkok mit allen Bevölkerungszentren unseres Landes zu verbinden; ein gut ausgebautes Straßennetz wäre ein hervorragender Anfang."
SIA_bolster_strategic_resources_r56:	"Strategische Ressourcen stärken"
SIA_bolster_strategic_resources_r56_desc:	"Trotz unserer starken Abhängigkeit von der Landwirtschaft verfügt unser Land auch über zahlreiche natürliche Ressourcen. Mit ein wenig Investition können wir diese Erträge nutzen, um weitere industrielle Vorhaben zu finanzieren."
SIA_continue_the_national_electrification_r56:	"Die nationale Elektrifizierung fortsetzen"
SIA_continue_the_national_electrification_r56_desc:	"Die Fertigstellung des nationalen Stromnetzes ist ein wichtiger Faktor, um landesweites Wirtschaftswachstum zu ermöglichen. Investitionen in diesem Bereich sind erforderlich, koste es, was es wolle."
SIA_rural_schooling_programs_r56:	"Bildungsprogramme für den ländlichen Raum"
SIA_rural_schooling_programs_r56_desc:	" Zwar modernisieren wir uns in diesem Bereich rasch, [SIA.GetAdjective] doch bleibt Analphabetismus ein Problem für unseren Staat, vor allem, aber nicht nur auf dem Land. Eine gebildete Nation ist eine Nation, die trotz der Bedrohungen unserer modernen Welt nicht ins Straucheln gerät!"
SIA_amend_the_thesaban_organization_act_r56:	"Änderung des Thesaban-Organisationsgesetzes"
SIA_amend_the_thesaban_organization_act_r56_desc:	"Die Nation braucht eine moderne Verwaltung mit einem klar strukturierten Regierungssystem. Wir sollten das veraltete Thesaban-Organisationsgesetz so ändern, dass es die Zuständigkeiten der lokalen Verwaltungen und die Rolle der Zentralregierung darin klar festlegt."
SIA_administrative_reforms_r56:	"Verwaltungsreformen"
SIA_administrative_reforms_r56_desc:	"Das Land braucht eine moderne Verwaltung mit einem klar definierten Regierungssystem, und wir sind auf dem Weg, dies zu verwirklichen. Das Thesaban-Organisationsgesetz soll in ein System umgewandelt werden, das die Zuständigkeiten der lokalen Verwaltungen und die Rolle der Zentralregierung darin klar festlegt."
SIA_exploit_freshwater_gains_r56:	"Nutzung der Vorteile durch Süßwasser"
SIA_exploit_freshwater_gains_r56_desc:	" Die Seen und Flüsse in unseren besetzten Gebieten sind ein großer Segen für unsere Wirtschaft und Sicherheit. Wir sollten uns bemühen, diese Vorteile zu nutzen."
SIA_luang_prabang_shanland_batambang_and_cambodia_will_each_gain_1_building_slot_if_they_are_controlled_by_us_or_a_subject_r56:	"§Y[926.GetName]§!, §Y[1018.GetName]§!, §Y[925.GetName]§! und §Y[741.GetName]§! erhalten jeweils §G1§! einen Bauplatz erhalten, wenn sie von uns oder einem Subjekt kontrolliert werden."
if_we_control_luang_prabang_or_shanland_tt:	"Wenn wir §Y[926.GetName]§! oder §Y[1018.GetName]§! kontrollieren:"
if_we_control_batambang_or_cambodia_tt:	"Wenn wir die Kontrolle über §Y[925.GetName]§! oder §Y[741.GetName]§! haben:"
SIA_expand_control_over_the_mekong_r56:	"Ausweitung der Kontrolle über den Mekong"
SIA_expand_control_over_the_mekong_r56_desc:	"Der Mekong ist nicht nur eine wichtige natürliche Verteidigungslinie im Osten, sondern auch entscheidend für unsere landwirtschaftliche Produktion im Norden und Nordosten. Da wir mehr Kontrolle über die Region haben als je zuvor, sollten wir diese Kontrolle ausweiten und sicherstellen, dass wir wirtschaftlich davon profitieren."
SIA_exploit_the_tonle_sap_r56:	"Den Tonlé Sap nutzen"
SIA_exploit_the_tonle_sap_r56_desc:	"Der Süßwassersee Tonlé Sap ist der größte seiner Art in Asien. Wir sollten sicherstellen, dass dieser große Segen für unsere Landwirtschaft und Industrie seinen Beitrag zu unserer Wirtschaft leisten kann."
SIA_exploiting_the_mekong_r56:	"Den Mekong nutzen"
SIA_exploiting_the_mekong_r56_desc:	"Der Mekong ist nicht nur ein wichtiger natürlicher Schutzwall im Osten, sondern auch entscheidend für unsere landwirtschaftliche Produktion im Norden und Nordosten. Da wir mehr Kontrolle über die Region haben als je zuvor, sollten wir unsere Kontrolle darüber ausweiten und sicherstellen, dass wir wirtschaftlich davon profitieren können."
SIA_exploiting_the_tonle_sap_r56:	"Den Tonlé Sap nutzen"
SIA_exploiting_the_tonle_sap_r56_desc:	"Der Süßwassersee Tonlé Sap ist der größte seiner Art in Asien. Wir sollten sicherstellen, dass dieser große Segen für unsere Landwirtschaft und Industrie seinen Beitrag zu unserer Wirtschaft leisten kann."
SIA_expand_land_clearing_projects_r56:	 "Ausweitung der Rodungsprojekte"
SIA_expand_land_clearing_projects_r56_desc:	"Unsere Binnenwälder, die oft von Malaria heimgesucht werden, sind eine Belastung sowohl für unsere Bevölkerung als auch für die Industrialisierung. Wir sollten zum Wohle der Nation so schnell wie möglich damit beginnen, sie zu roden."
SIA_separate_the_ministry_of_public_health_r56:	"Ausgliederung des Ministeriums für öffentliche Gesundheit"
SIA_separate_the_ministry_of_public_health_r56_desc:	"Mit einer wachsenden Bevölkerung steigen auch die Bedürfnisse, und eines dieser Bedürfnisse ist ein eigenständiges Ministerium für öffentliche Gesundheit, das von anderen Bereichen unserer Verwaltung getrennt ist."
SIA_negotiation_with_the_old_powers_r56:	"Verhandlungen mit den alten Mächten"
SIA_negotiation_with_the_old_powers_r56_desc:	" Die alten Mächte haben sich trotz ihrer Siege und Expansionen im Ersten Weltkrieg in ihren riesigen Kolonialreichen übernommen. Da unsere Länder nun endlich außerhalb ihrer Reichweite liegen, ist es vielleicht an der Zeit, die internationale Diplomatie mit diesen Nationen zu nutzen, um [SIA.GetAdjective] nationale Interessen zu wahren und möglicherweise einen Teil dessen zurückzugewinnen, was wir als unser rechtmäßiges Land bezeichnen! "
SIA_towards_equality_with_the_west_r56:	"Auf dem Weg zur Gleichberechtigung mit dem Westen"
SIA_towards_equality_with_the_west_r56_desc:	"Das Außenministerium der Nation handelt zügig, um uns auferlegte ungleiche Verträge aufzuheben. Wir müssen weiterhin betonen, dass wir ein unabhängiger, gleichberechtigter Akteur in der Region sind."
SIA_look_to_the_waking_giant_r56:	"Blick auf den erwachenden Riesen"
SIA_look_to_the_waking_giant_r56_desc:	"[USA.GetNameDefCap] kehrt auf die globale Bühne zurück, und wir glauben, dass sie gekommen sind, um zu bleiben. Während viele globale Imperien im Niedergang begriffen sind, scheint [USA.GetAdjective] an wirtschaftlicher und internationaler Macht von Tag zu Tag zu wachsen. Wir sollten [USA.GetNameDef] in die Liste der Nationen aufnehmen, mit denen wir aktive diplomatische Beziehungen unterhalten."
SIA_ally_the_united_states_of_america_r56:	"Verbündeter [USA.GetNameDef]"
SIA_ally_the_united_states_of_america_r56_desc:	" Die [USA.GetAdjective] sind als Weltmacht gekommen, um zu bleiben, und wir müssen eine Partnerschaft mit ihnen eingehen, um unsere Verteidigung und Entwicklung zu verbessern."
unlocks_decision_invite_american_economic_advisors_which_grants_tt:	"Entscheidung freigeschaltet: §YAmerikanische Wirtschaftsberater einladen§!, was Folgendes gewährt:"
for_84_days_factory_output_6_dockyard_output_6_tt:	"§YFür 84 Tage:§!\nFabrikproduktion: §G+6, 00 %§!\nWerftproduktion: §G+6,00 %§!"
SIA_invite_american_economic_advisors_r56:	"Wir laden [USA.GetAdjective] Wirtschaftsberater ein"
SIA_invite_american_economic_advisors_r56_desc:	" Da [USA.GetAdjective] die Kontakte gesichert sind, haben wir die Möglichkeit, ihren Einfluss zu nutzen, um einen Wirtschaftsplan zu formulieren, der unseren Bedürfnissen besser entspricht. Wir sollten uns ansehen, was sie uns zu bieten haben."
SIA_expand_british_cooperation_r56:	"Ausbau [ENG.GetAdjective] der Zusammenarbeit"
SIA_expand_british_cooperation_r56_desc:	"Die [ENG.GetAdjective] waren im letzten Jahrhundert die einflussreichste westliche Macht in unserem Land, und ihre Rolle in der Welt wird durch die aktuellen Ereignisse bestimmt werden. Wir [SIA.GetAdjective] werden prüfen, wie diese Entwicklungen unseren gemeinsamen Interessen dienen können!"
SIA_restore_the_anglo_siamese_alliance_r56:	"Wiederherstellung der anglo-[SIA.GetAdjective] Allianz"
SIA_restore_the_anglo_siamese_alliance_r56_desc:	"Die [ENG.GetAdjective] sind ein wichtiger Akteur in der Region und waren in der Vergangenheit zuverlässige Partner von uns. Wir sollten uns bemühen, die Beziehungen zu ihnen wieder zu stärken!"
SIA_request_british_protection_r56:	"Bitten Sie [ENG.GetAdjective] um Schutz"
SIA_request_british_protection_r56_desc:	"Die [ENG.GetAdjective] sind ein wichtiger Akteur in der Region; angesichts der zunehmenden regionalen Spannungen und der gemeinsamen Erkenntnis, dass der Untergang unserer Nation eine Gefährdung für ihre Kolonien bedeutet, wären sie sicherlich bereit, unsere Unabhängigkeit zu garantieren."
siam_r56.16.title:	" [FROM.GetNameDefCap] Bittet um unseren Schutz"
siam_r56.16.desc:	" Der [FROM.GetAdjective] ausländische Botschafter hat sich kürzlich an unseren eigenen gewandt und offiziell um Schutz gebeten, wobei er auf die gemeinsame Bedrohung unserer Sicherheit durch [JAP.GetNameDef] hinwies."\n\nDa sich [FROM.GetNameDef] in unserem historischen Einflussbereich befindet, was sollen wir auf ihre Bitte antworten?"
siam_r56.17.title:	"[FROM.GetNameDefCap] setzt sich für unsere Sicherheit ein"
siam_r56.17.desc:	"[FROM.GetNameDefCap] Der ausländische Botschafter hat unserem eigenen berichtet, dass sie bereit sind, unsere "strategische Unabhängigkeit" zu schützen, sollte ein Krieg gegen uns geführt werden. Dies ist zweifellos ein wichtiger Sieg für unsere nationale Sicherheit. "
siam_r56.18.desc:	"[FROM.GetNameDefCap] Der ausländische Botschafter hat unserem Botschafter mitgeteilt, dass er nicht bereit ist, unsere "strategische Unabhängigkeit" zu schützen , sollte ein Krieg gegen uns geführt werden. Es scheint, als würden wir im Falle eines Krieges auf den Schutz von [FROM.GetNameDef] verzichten müssen."
SIA_request_revision_of_the_northwestern_border_r56:	"Antrag auf Revision der nordwestlichen Grenze"
SIA_request_revision_of_the_northwestern_border_r56_desc:	"Die nordwestliche Grenze zwischen [SIA.GetNameDef] und dem historischen Britisch-Indien ist eine ungerechte Grenze, die unser Volk und unsere natürlichen Verteidigungsanlagen trennt. Ein Fuß zu fassen am Salween-Fluss und die Eingliederung unserer Verwandten in unseren Staat wäre sicherlich eine gerechte Regelung."
SIA_peace_with_the_western_order_r56:	"Frieden mit der westlichen Ordnung"
SIA_peace_with_the_western_order_r56_desc:	"Die Nationen des Westens haben die Vorherrschaft im Pazifik erlangt, so wie sie es bereits einst getan hatten. [SIA.GetNameDefCap] ist mit unserer flexiblen Außenpolitik und unserer wiedergewonnenen Stärke bereit, in dieser neuen, vertrauten Weltordnung dem Westen gleichgestellt zu sein. "
SIA_influx_in_foreign_investment_r56:	"Zustrom ausländischer Investitionen"
SIA_influx_in_foreign_investment_r56_desc:	"Wir treten in eine Übergangsphase ein, um unsere Wirtschaft erneut zu öffnen, und die Auswirkungen davon werden sich sicherlich auszahlen. Wir werden aus dieser Umstrukturierung als stärkere, wachsende Wirtschaftsmacht in der Region."
SIA_address_the_eastern_border_r56:	"Die Ostgrenze angehen"
SIA_address_the_eastern_border_r56_desc:	"Die [FRA.GetAdjective], trotz all der Schwierigkeiten, die sie uns bereitet haben, befinden sich an ihrem verwundbarsten Punkt seit einem Jahrhundert. Wenn wir ihre indochinesischen Besitzungen einschränken oder gänzlich beseitigen wollen, wird es nie einen besseren Zeitpunkt geben als jetzt!"
SIA_address_the_eastern_border_r56_tt:	"Diplomatische Forderungen nach größeren Gebietsabtretungen werden §Rweniger Aussicht auf Erfolg haben§!!"
SIA_r56.6.title:	"Der Umfang unserer Ansprüche"
siam_r56.6.desc:	 "Da sich die Franzosen an ihrem schwächsten Punkt seit einem Jahrhundert befinden und wir auf einem Allzeithoch sind, ist es an der Zeit, einen Blick auf unsere vielen verlorenen Gebiete zu werfen.\n\nZweifellos hätten unsere Diplomaten bessere Chancen, bescheidenere Ansprüche durchzusetzen, doch da unsere nationale Entschlossenheit von Tag zu Tag wächst, wünschen sich viele, dass wir Asien zweiten großen Sieg Asiens gegen eine europäische Macht zu führen.\n\nDie Entscheidung liegt letztendlich bei uns: Wie weit sollen unsere Ansprüche reichen?"
siam_r56.6.a:	"Nur die kürzlich verlorenen Gebiete zurückzugewinnen, wäre sicherlich realistisch."
siam_r56.6.a_tt:	 "Zukünftige Verhandlungen werden nur §Y[926.GetName]§!, §Y[924.GetName]§! und §Y[925.GetName]§! betreffen."
siam_r56.6.b:	 "Es wäre unehrenhaft, unsere laotischen Brüder zurückzulassen."
siam_r56.6.b_tt:	"Zukünftige Verhandlungen werden §Y[925.GetName]§! und alle §Y[LAO.GetAdjective]§! der Kernländer."
SIA_claims_on_laos_r56:	"Ansprüche auf Laos"
siam_r56.6.c:	"Alle Ausländer müssen unser historisches Herrschaftsgebiet verlassen!"
siam_r56.6.c_tt:	" Zukünftige Verhandlungen werden alle §Y[LAO.GetAdjective]§! und §Y[CAM.GetAdjective]§! Startkerne einbeziehen."
SIA_claims_on_laos_and_cambodia_r56:	"Ansprüche auf Laos und Kambodscha"
SIA_is_claiming_small_border_states_only_scriptloc_r56:	"Die [SIA.GetAdjective] Forderung beinhaltet unseren Rückzug aus den kürzlich eingenommenen Provinzen [926.GetName], [924.GetName] und [925.GetName]."
SIA_is_claiming_small_border_states_and_laos_scriptloc_r56:	"Der [SIA.GetAdjective] Antrag sieht vor, dass wir uns aus ganz Laos zurückziehen und gleichzeitig aus den kürzlich eroberten Gebieten [925.GetName] abziehen."
SIA_is_claiming_all_of_laos_and_cambodia_scriptloc_r56:	"Der Antrag [SIA.GetAdjective] sieht vor, dass wir uns aus ganz Laos und Kambodscha zurückziehen und alle indochinesischen Gebiete, die historisch unter der siamesischen Monarchie standen, an [SIA.GetNameDef] zurückgeben. "
SIA_demand_the_western_bank_of_the_mekong_r56:	"Fordern Sie das Westufer des Mekong"
SIA_demand_protector_status_over_laos_r56:	"Fordern Sie den Status eines "Protektorats" über Laos "
SIA_demand_protector_status_over_laos_r56_desc:	"Vor der Kolonialisierung durch Paris stand der größte Teil von Laos unter unserer Herrschaft und diente als natürlicher Pufferstaat, während er unseren Einfluss in der Region stärkte. Da es nun "unabhängig" ist, müssen wir fordern, dass es unter unser Banner zurückkehrt."
SIA_demand_batambang_r56:	 "Forderung [925.GetName]"
SIA_demand_batambang_r56_desc:	"[925.GetName], obwohl es so offensichtlich zu uns gehört, wurde uns aus den Händen gerissen, als wir verwundbar waren. Da nun der richtige Zeitpunkt gekommen ist, werden wir zurückschlagen und die Rückgabe dieses lebenswichtigen Landes fordern!"
SIA_demand_protector_status_over_cambodia_r56:	"Forderung nach dem Status eines "Schutzherrn" über Kambodscha"
SIA_demand_protector_status_over_cambodia_r56_desc:	"Vor der Kolonialisierung durch Paris stand der größte Teil Kambodschas unter unserer Herrschaft und diente als natürlicher Pufferstaat, während wir unseren Einfluss in der Region ausbauten. Da es nun "unabhängig" ist, müssen wir fordern, dass es unter unser Banner zurückkehrt. "
SIA_request_revision_of_the_eastern_border_r56:	"Revision der Ostgrenze beantragen"
SIA_request_revision_of_the_eastern_border_r56_desc:	"Die Zeit ist gekommen, die Provinzen im Osten wieder unter unsere rechtmäßige Kontrolle zu bringen. Mit der gebündelten Stärke und dem entschlossenen Willen müssen wir entscheiden, welche Kompromisse wir gegebenenfalls eingehen werden, und voranschreiten."
SIA_request_revision_of_the_eastern_border_vichy_r56_desc:	"Obwohl unsere Forderungen zuvor abgelehnt wurden, befindet sich Frankreich nun an seinem schwächsten Punkt. Es ist an der Zeit, unseren rechtmäßigen Anspruch geltend zu machen! "
SIA_r56.7.title:	"[FROM.GetNameDefCap] fordert unsere Unterwerfung"
siam_r56.7.desc:	"Nach beunruhigenden Tendenzen, dass sich Diplomaten aus [FROM.GetNameDef] zunehmend aus unserem Land zurückziehen, hat der [FROM.GetAdjective] ausländische Botschafter unserem eigenen ein 10-Tage-Ultimatum übermittelt, sich ihrer Kontrolle "militärisch und politisch zu unterwerfen". Lohnt es sich, im Namen unserer Unabhängigkeit eine zweite Runde zu kämpfen?"
siam_r56.7.a:	"Wir haben keine andere Wahl, als dem nachzukommen."
siam_r56.7.b:	"Wir werden niemals wieder einer fremden Macht angehören!"
SIA_r56.13.title:	"[FROM.GetNameDefCap] hat unsere Forderungen abgelehnt!"
SIA_r56.13.desc:	"Diplomaten, die [FROM.GetName] vertreten, haben unsere gerechten Forderungen nach Oberhoheit über ihre Ländereien abgelehnt. Dafür werden wir unsere Stärke einsetzen, um diese Narren zu vernichten!"
siam_r56.13.a:	"Sie kennen den Preis der Ablehnung."
siam_r56.13.b:	"Dann werden wir abwarten."
SIA_r56.14.title:	"[FROM.GetNameDefCap] hat unsere Forderungen akzeptiert"
siam_r56.14.desc:	"In einer Welle hervorragender Nachrichten haben Diplomaten, die [FROM.GetName] vertreten, offiziell einer "begrenzten Union" zwischen uns und den von uns beanspruchten Gebieten zugestimmt. Unsere Herrschaft über sie hat gerade erst begonnen!"
siam_r56.14.a:	"Hervorragende Nachrichten."
SIA_r56.15.title:	"Verhandlungen um die östlichen Gebiete"
siam_r56.15.desc:	"Nachdem unsere Ansprüche auf das historische Französisch-Indochina geltend gemacht wurden, ist es an der Zeit zu entscheiden, was wir im Austausch für regionalen Frieden und die Rückgabe unserer rechtmäßigen Gebiete anbieten können. Worüber sollten wir verhandeln?"
siam_r56.15.a:	"Wir können einen Nichtangriffspakt als Zeichen des guten Willens anbieten."
SIA_offered_non_aggression_pact_scriptloc_r56:	"Im Austausch für diese Gebiete bietet [FROM.GetNameDef] einen Nichtangriffspakt sowie eine Vereinbarung zur Vermeidung "weiterer Feindseligkeiten" in der Region an."
siam_r56.15.b:	" Wir können das Angebot mit geringfügigen wirtschaftlichen Zugeständnissen versüßen."
siam_r56.15.b_tt:	"Wenn sie zustimmen, werden wir [289.GetName] und allen an uns übertragenen Staaten Nutzungsrechte an den Ressourcen gewähren."
SIA_offered_minor_economic_concessions_scriptloc_r56:	"Im Austausch für diese Gebiete bietet [FROM.GetNameDef] einen Nichtangriffspakt an und bekräftigt zudem den Wunsch, "weitere Feindseligkeiten" in der Region zu vermeiden."
siam_r56.15.c:	"Sie benötigen jede nur erdenkliche Unterstützung für ihre Kriegsanstrengungen; wir können sie bieten."
SIA_offered_alliance_scriptloc_r56:	"Im Austausch für diese Gebiete bietet [FROM.GetNameDef] die Mitgliedschaft in unserer Allianz an."
if_they_accept_we_will_be_called_into_their_wars_and_if_possible_join_their_faction_in_exchange_for_our_claimed_territories_r56_tt:	"Wenn sie zustimmen, §Ywerden wir in ihre Kriege einbezogen§! und, sofern möglich, §Gihrer Fraktion beitreten§!, im Austausch für die von uns beanspruchten Gebiete."
SIA_r56.8.title:	"[SIA.GetNameDefCap] fordert eine Neufestlegung unserer Grenzen"
SIA_r56.8.desc:	 "Heute ist ein Gesandter aus [FROM.GetNameDef] in unserem Land eingetroffen und fordert die Kontrolle über die Provinzen, die wir am Westufer des Mekong halten. Auch wenn es schwierig wäre, diese Provinzen im Falle eines Krieges zu halten, können wir den Forderungen von [SIA.GetAdjective] nachgeben?"
siam_r56.8.a:	" "Das ist vernünftig genug, wir können dem zustimmen."
siam_r56.8.b:	"Unverschämt, sie werden uns in unserer Schwäche nicht ausnutzen!"
siam_r56.19.title:	"[SIA.GetNameDefCap] fordert eine Neufestlegung unserer gemeinsamen Grenze"
siam_r56.19.desc:	"Heute ist ein diplomatischer Gesandter aus [SIA.GetNameDef] bei uns eingetroffen, der darauf abzielt, die "ungerechten Grenzen" rückgängig zu machen, die zu Zeiten ihrer Schwäche als absolute Monarchie festgelegt wurden. [GetSiamLandsDemanded_r56]\n\n[GetSiamDeal_r56]\n\nWie sollen wir dieses [SIA.GetAdjective] Angebot bezüglich eines Gebiets bewerten, das ganz eindeutig unser rechtmäßiges Land ist?"
siam_r56.19_tt:	" Im Austausch für diese Ländereien [SIA.GetNameDef] gewährt §YNutzungsrechte§! an §Y[289.GetName]§! sowie an allen von uns übertragenen Ländereien."
siam_r56.21.desc:	" Heute hat uns ein diplomatischer Gesandter aus [SIA.GetNameDef] erreicht, der darauf abzielt, die "ungerechten Grenzen" rückgängig zu machen, die zu Zeiten ihrer Schwäche als absolute Monarchie festgelegt wurden. Konkret fordert [SIA.GetAdjective] die Kontrolle über den Staat [1018.GetName] im Austausch für einen Nichtangriffspakt. \n\nWas halten wir von diesem Angebot der [SIA.GetAdjective] für ein Gebiet, das so eindeutig unser rechtmäßiges Land ist?"
due_to_its_far_proximity_from_mainland_france_this_action_will_bypass_any_guarantees_that_they_have_tt:	"Aufgrund der §YEntfernung§! vom französischen Festland §Y entfernt ist §!, wird diese Aktion §Gumgehen§! alle §YGarantien§!, die sie haben."
SIA_r56.29.title:	"[FROM.GetNameDefCap] greift unsere Gebiete in Indochina an"
SIA_r56.29.desc:	"Nachdem wir die [FROM.GetAdjective] Forderungen abgelehnt haben, unser rechtmäßiges Land aufzugeben, haben die Kriegstreiber von [SIA.GetNameDef] Offensivoperationen in Französisch-Indochina gestartet. Diese Bedrohung wird mit aller Macht niedergeschlagen!"
SIA_avenge_chulaloks_legacy_r56:	 "Rächt Chulaloks Vermächtnis"
SIA_avenge_chulaloks_legacy_r56_desc:	"Wir haben das vollbracht, was so viele für unmöglich hielten: [SIA.GetNameDef] hat erneut die totale Vorherrschaft in Südostasien erlangt. Diese Heldentat wird noch jahrelang Anlass zum Feiern sein, und der Westen wird uns endlich wieder als gleichberechtigte Partner behandeln!"
you_or_a_subject_contros_all_starting_laotian_cores_r56_tt:	"Sie oder ein Untergebener kontrollieren alle Startkerne §Y[LAO.GetAdjective]§!. "
you_or_a_subject_controls_all_starting_cambodian_cores_r56_tt:	"Sie oder ein Untergebener kontrollieren alle Startkerne §Y[CAM.GetAdjective]§!."
you_or_a_subject_controls_all_starting_vietnamese_cores_r56_tt:	 "Sie oder eine Person kontrollieren alle startenden §Y[VIN.GetAdjective]§! Kerne. "
you_or_a_subject_controls_all_starting_burmese_cores_r56_tt:	"Sie oder ein Untergebener kontrollieren alle Startkerne."
SIA_southeast_asias_regional_power_r56:	 "Südostasiens Regionalmacht"
SIA_southeast_asias_regional_power_r56_desc:	"Wir haben das geschafft, was so viele für unmöglich halten: [SIA.GetNameDef] hat erneut die totale Vorherrschaft in Südostasien erlangt. Diese Leistung wird noch jahrelang Anlass zum Feiern sein, und der Westen wird uns endlich wieder als gleichberechtigte Partner behandeln! "
SIA_the_non_aligned_movement_r56:	"Die Bewegung der Blockfreien Staaten"
SIA_the_non_aligned_movement_r56_desc:	"Da sich [SIA.GetNameDef] erneut als angesehene Macht in Ostasien etabliert hat, ist es an der Zeit, dass wir unseren Platz als gleichberechtigte Macht festigen, die niemandem sonst verpflichtet ist. Die Idee einer Bewegung der Blockfreien entspricht genau diesem unserem Interesse."
SIA_armed_neutrality_r56:	"Bewaffnete Neutralität"
SIA_armed_neutrality_r56_desc:	"Obwohl wir eine aufstrebende Macht in der Region sind, müssen wir dennoch abwarten, was die Zukunft bringt. Die Welt ist instabiler denn je, ebenso wie die Nationen um uns herum eine größere Gefahr darstellen als je zuvor. Wir werden alles in unserer Macht Stehende tun, um sicherzustellen, dass unsere Landesverteidigung für das, was kommen wird, bereit ist."
SIA_towards_a_new_asian_order_r56:	"Auf dem Weg zu einer neuen asiatischen Ordnung"
SIA_towards_a_new_asian_order_r56_desc:	"Das vergangene Jahrhundert war für die sogenannten "Großmächte" der Welt nicht gerade günstig. Wir sollten uns von der Abhängigkeit von einer einzigen Macht lösen, sei es von China, Großbritannien oder einer anderen künftigen "Großmacht". Als eine der wenigen freien Nationen Asiens sind wir in einer hervorragenden Position, Südostasien unter unsere gerechte Obhut zu stellen!"
SIA_recognize_the_soviet_union_r56:	"Anerkennung der Sowjetunion"
SIA_recognize_the_soviet_union_r56_desc:	"Auch wenn wir uns stark von ihnen distanzieren, [SOV.GetNameDef] ist eine von vielen Mächten, die ihre Interessen in Asien vorantreiben wollen. Wir sollten diplomatische Beziehungen zu ihnen aufnehmen und prüfen, ob wir für beide Seiten vorteilhafte Vereinbarungen treffen können."
SIA_request_old_soviet_weapons_r56:	"Alte [SOV.GetAdjective]-Waffen anfordern"
SIA_request_old_soviet_weapons_r56_desc:	"Die [SOV.GetAdjective] verfügen über ein umfangreiches Waffenarsenal, das noch aus ihrer Bürgerkriegszeit stammt. Sicherlich wären sie bereit, einen Teil davon abzugeben, um im Gegenzug größeren Einfluss auf unser Land zu erlangen."
unlocks_decision_request_old_soviet_weapons_which_grants_tt:	"Entscheidung freischalten: §YAlte sowjetische Waffen anfordern§!, was Folgendes gewährt:"
for_84_days_daily_communism_support_004_tt:	"§YFür 84 Tage:§!\nTägliche Unterstützung des Kommunismus: §G+0, 04§!\n"
SIA_invite_soviet_heavy_industry_support_r56:	"Einladen [SOV.GetAdjective] Unterstützung für die Schwerindustrie"
SIA_invite_soviet_heavy_industry_support_r56_desc:	"Trotz der vielen Probleme, die es gab, haben die [SOV.GetAdjective] die vielleicht schnellste Industrialisierungskampagne der Welt erreicht. Wir sollten prüfen, ob einige ihrer talentiertesten Berater uns dabei helfen könnten, dasselbe zu erreichen."
unlocks_decision_invite_soviet_heavy_industry_support_which_grants_tt:	"Entscheidung freischalten: §YEinladen [SOV.GetAdjective] Unterstützung der Schwerindustrie§!, die Folgendes gewährt:"
for_84_days_construction_speed_5_production_efficiency_growth_075_daily_communism_support_006_tt:	"§YFür 84 Tage§!:\nBaugeschwindigkeit: §G+5,00 %§!\nWachstum der Produktionseffizienz: §G+7,50 %§!\nTägliche Unterstützung für den Kommunismus: §G+0,06§!"
SIA_seek_membership_in_the_comintern_r56:	" Beitritt zur [SOV.GetFactionName]"
SIA_seek_membership_in_the_comintern_r56_desc:	"Die [SOV.GetFactionName] waren ein willkommenes Gegengewicht zu den Nationen des Westens, und wir möchten daran teilhaben. Wir sollten prüfen, ob sie bereit sind, unsere Unterstützung anzunehmen."
SIA_anti_imperial_southeast_asia_league_r56:	"Antiimperialistische Südostasien-Liga"
SIA_anti_imperial_southeast_asia_league_r56_desc:	"Da ein Großteil unserer Stärke in der Region wiederhergestellt ist, ist es an der Zeit, den Blick auf die Schaffung einer antikolonialen asiatischen Ordnung zu richten, die verhindern kann, dass wir unter die Oberhoheit einer anderen asiatischen Nation geraten. Wir werden Initiative zeigen, um diese Entwicklung voranzutreiben!"
SIA_southeast_asia_league:	" Südostasien-Liga"
SIA_leaders_of_a_free_southeast_asia_r56:	"Führer eines freien Südostasiens"
SIA_leaders_of_a_free_southeast_asia_r56_desc:	"[SIA.GetNameDefCap] ist erneut eine führende Kraft unter den Nationen Südostasiens. Nur wenn wir zusammenstehen, werden wir nicht nur das Überleben sichern, sondern auch Fortschritt inmitten der Schrecken erzielen, die diese Welt verschlingen!"
SIA_approach_the_empire_of_japan_r56:	"Annäherung [JAP.GetNameDef]"
SIA_approach_the_empire_of_japan_r56_desc:	" [JAP.GetNameDefCap] ist entgegen den Wünschen des Westens zur einflussreichsten Macht in Ostasien geworden. Auch wenn wir niemals erwarten können, dass sie uns als Gleichberechtigte betrachten, können wir sicherlich Gemeinsamkeiten finden oder sie zumindest als einen von vielen Fäden in unserem Netz diplomatischer Beziehungen nutzen."
SIA_ally_the_empire_of_japan_r56:	"Verbündeter [JAP.GetNameDef]"
SIA_r56.10.title:	"[FROM.GetNameDefCap] Bietet Unterstützung im Krieg im Austausch für Frieden"
SIA_r56.10.desc:	"Heute, nach unserer Kriegserklärung an [ROOT.GetNameDef] haben Diplomaten ihres Landes mit Rückendeckung des Premierministers offiziell ein Offensivbündnis im Austausch für Frieden angeboten.\n\nZwar kann [FROM.GetNameDef] in diesem Konflikt sicherlich nicht alleine durchhalten, doch sind sich die meisten unserer Streitkräfte sind sich einig, dass ihr Nutzen für uns vor allem darin besteht, als Basis für Angriffe auf [ENG.GetAdjective]-Gebiete in Indien und Malaya zu dienen.\n\nDie Entscheidung liegt bei uns: Kann [SIA.GetNameDef] ein Partner in den kommenden Ereignissen werden? "
siam_r56.10.b:	"Sie hätten sich früher für die richtige Seite entscheiden sollen."
SIA_r56.11.title:	"[FROM.GetNameDefCap] stimmt unserem Antrag zu"
SIA_r56.11.desc:	"Die [FROM.GetAdjective]-Regierung hat unseren Antrag auf ein Bündnis angenommen, was bedeutet, dass wir an ihre Kriegsbemühungen in ganz Asien gebunden sind. Mögen wir inmitten der bevorstehenden Kämpfe pragmatisch bleiben."
siam_r56.11.a:	"Wir befinden uns auf einem weitaus gefährlicheren Weg als zuvor ..."
SIA_seek_japanese_support_for_territorial_revision_r56:	"Bitten Sie um [JAP.GetAdjective] Unterstützung für Gebietsrevisionen"
SIA_r56.12.title:	"[FROM.GetNameDefCap] Bitten Sie um Unterstützung für Gebietsansprüche in Indochina"
SIA_r56.12.desc:	" Heute ist eine Delegation aus [FROM.GetAdjective] eingetroffen, die um Unterstützung für ihre Gebietsansprüche auf Ländereien bittet, die ihnen einst von den Franzosen weggenommen wurden. Sollten wir ihre territorialen Ambitionen respektieren, während wir daran arbeiten, unseren Einfluss in Asien auszuweiten?"
siam_r56.12.b:	"Was haben sie getan, um diese Ländereien zu verdienen?"
unlocks_decision_invite_japanese_military_advisors_which_grants_tt:	"Entscheidung freischalten: §YJapanische Militärberater einladen§!, was Folgendes gewährt: "
for_84_days_army_experience_gain_02_naval_experience_gain_02_air_experience_gain_02_daily_command_power_gain_multiplier_20_land_doctrine_mastery_gain_20_naval_doctrine_mastery_gain_20_air_doctrine_mastery_gain_20_tt:	"§YFür 84 Tage:§!\nErfahrung der Armee : §G+0,2§!\nErfahrung in der Marine: §G+0,2§!\nErfahrung in der Luftwaffe: §G+0,2§!\nTäglicher Multiplikator für Kommandomachtgewinn: §G+20 %§!\n§YLanddoktrin§!Meisterungsgewinn: §G+20 %§!täglich\n§YSeedoktrin§!Meisterungsgewinn: §G+20 %§! täglich\n§YLuftdoktrin§! Meisterschaftsgewinn: §G+20 %§! täglich"
SIA_invite_japanese_military_advisors_r56:	"Einladen [JAP.GetAdjective] Militärberater"
SIA_invite_japanese_military_advisors_r56_desc:	"In der heutigen Zeit verfügt die [JAP.GetAdjective] bei weitem über die beste Erfolgsbilanz bei Siegen auf dem Schlachtfeld. Wir sollten prüfen, ob ihre Berater uns bei unserer Modernisierung helfen können."
SIA_navigate_asias_new_order_r56:	"Asiens neue Ordnung meistern"
SIA_navigate_asias_new_order_r56_desc:	"Durch eine "aufstrebende" Macht wurden die Kolonialmächte aus Ostasien vertrieben und hinterließen ein Machtvakuum, in dem wir uns einen Platz sichern müssen."
SIA_between_a_rock_and_a_hard_place_r56:	"Zwischen Hammer und Amboss"
SIA_between_a_rock_and_a_hard_place_r56_desc:	" Da die Kolonialmächte weitgehend aus Asien verschwunden sind, steht uns eine neue Ordnung bevor, und es ist unerlässlich, dass wir darauf vorbereitet sind. Wir werden niemals untergehen!"
SIA_address_rama_viis_abdication_r56:	"Die Abdankung von Rama VII. thematisieren"
SIA_address_rama_viis_abdication_r56_desc:	"Die Abdankung von Rama VII. im Jahr 1935 ist noch immer ein frischer Schock, der die Unterstützung durch das Volk und die Stabilität des Staates bedroht. Da sich sein rechtmäßiger Erbe, Mahidol, noch immer im Ausland befindet und das Volk Antworten fordert, ist es an der Zeit, zu klären, warum dies geschehen ist und wie wir eine weitere Katastrophe verhindern wollen."
siam_r56.2.title:	"Der Niedergang der Chakri-Dynastie"
siam_r56.2.desc:	"Der Schock über die Abdankung von Rama VII. im Jahr 1935 warf uns auf unserem Weg zur Wiederherstellung der Ordnung um viele Schritte zurück. Angesichts der nach wie vor bestehenden Gefahr einer royalistischen Konterrevolution stellt sich die Frage, wie wir voranschreiten und die Rolle der Monarchie in der [SIA.GetAdjective] Gesellschaft angehen sollen." "
siam_r56.2.a:	"Die Abdankung des Königs war bedauerlich; wir müssen diejenigen versöhnen, die seine Herrschaft schätzten."
siam_r56.2.b:	"Prajadhipok war schwach und hat die Schwäche der königlichen Kontrolle aufgezeigt. "
SIA_build_rural_popular_support_r56:	"Aufbau einer Unterstützung durch die ländliche Bevölkerung"
SIA_build_rural_popular_support_r56_desc:	"Wenn die neue Ordnung in unserer Gesellschaft Akzeptanz finden soll, wird dies nur durch eine Politik gelingen, die über das städtische Zentrum von Bangkok hinausblickt und sich stattdessen denjenigen zuwendet, die sich auf den Feldern abrackern und deren Leben stärker mit dem Alltag als mit der Politik verbunden ist. Wie sollen wir der Gleichgültigkeit der ländlichen Bevölkerung gegenüber unserer Revolution begegnen?"
SIA_r56.3.title:	"Die Missstände auf dem Land angehen"
siam_r56.3.desc:	"Der avantgardistische Charakter unserer Revolution von 1932 hat dazu geführt, dass es schwierig ist, Unterstützung in unserer stetig wachsenden ländlichen Bevölkerungsschicht zu finden. Die Bedürfnisse des ländlichen Raums in unserem Land sind komplex, da ein Großteil der Bevölkerung nach wie vor von der Landwirtschaft , ungebildet und der modernen Politik gegenüber desinteressiert ist.\n\nBeides: Sowohl die meisten jungen Militärs als auch Pridis Programm unterstützen bescheidene Reformen neben einer raschen Modernisierung des ländlichen Raums, um Einheitlichkeit in allen Teilen der Nation herzustellen.\n\nWeitere traditionalistische Teile des zivilen Flügels sowie der Großteil der ländlichen Bevölkerung wünschen sich eine Konzentration auf die Entlastung ihrer wirtschaftlichen Belastung, beispielsweise durch Steuersenkungen für bestimmte Anbauprodukte.\n\nAngesichts der für diese Aufgabe bereitgestellten Mittel: Was sollte unser vorrangiges Mittel sein, um Unterstützung auf dem Land zu gewinnen?"
siam_r56.3.a:	"Wir müssen hart daran arbeiten, jeden Winkel des [SIA.GetAdjective] Landes zu modernisieren!"
siam_r56.3.b:	"Wir müssen die Bedürfnisse der ländlichen Bevölkerung respektieren und ihnen Gehör schenken."
SIA_strengthen_business_ties_r56:	"Geschäftsbeziehungen stärken"
SIA_strengthen_business_ties_r56_desc:	"Auch wenn sie unseren nationalen Interessen kaum treu gegenüberstehen, hat die [SIA.GetAdjective] Wirtschaftselite das Potenzial, unsere Industrialisierung zu unterstützen. Wir sollten ihre Freundschaft unter Berücksichtigung dieses Interesses suchen."
SIA_stability_centered_policies_r56:	"Stabilitätsorientierte Politik"
SIA_stability_centered_policies_r56_desc:	"Seit den Tagen des Jahres 1932 leidet die Nation unter Instabilität, und wenn wir uns der Unterstützung des Volkes sicher sein wollen, müssen wir die Nation gegen jegliche Vorwürfe verteidigen, wir würden das, was uns widerfahren ist, fördern oder dulden."
SIA_crown_property_bureau_r56:	"Amt für Kronbesitz"
SIA_crown_property_bureau_r56_desc:	"Korruption und übermäßige Ausgaben innerhalb der königlichen Familie haben die Staatsfinanzen belastet. Die Einrichtung einer staatlichen Behörde zur Überwachung und Verwaltung dieser Finanzen würde wesentlich dazu beitragen, eine weitere finanzielle Katastrophe zu verhindern. "
unlocks_decision_stabilize_the_baht_which_grants_tt:	"Entscheidung freischalten: §YBaht stabilisieren§!, was Folgendes gewährt:"
SIA_stabilize_the_baht_r56:	"Baht stabilisieren"
SIA_stabilize_the_baht_r56_desc:	"Aufgrund einer aggressiven Finanzpolitik befindet sich der Baht in einem Zustand übermäßiger Abwertung. Wir sollten das Investitionsniveau und den Geldfluss in unsere Wirtschaft vorübergehend drosseln, bis sich die Lage beruhigt hat."
SIA_move_to_depoliticize_the_army_r56:	"Maßnahmen zur Entpolitisierung der Armee"
SIA_move_to_depoliticize_the_army_r56_desc:	"Phibunsongkhrams Pläne, einen aggressiven Nationalismus innerhalb der Armee zu fördern, sind ein gefährliches Unterfangen, das das Gleichgewicht unserer Regierung bedroht. [SIA.GetNameDefCap] erfordert eine starke Armee, doch wir dürfen nicht zu einer Armee mit einem Staat werden oder zu einem Ort, an dem militärischer Einfluss unsere Nation kontrolliert."
SIA_siamese_ultranationalist_movement_weakened_r56_desc:	"Obwohl die [SIA.GetAdjective] Streitkräfte innerhalb der regierenden Khana Ratsadon über enorme Macht verfügen, steht der ideologischen Einheit wenig im Wege. Durch den Einfluss des aufstrebenden Plaek Phibunsongkhram hat der Ultranationalismus im Stil Italiens und Japans im ganzen Land deutlich an Boden gewonnen.\n\nAufgrund der jüngsten Maßnahmen des Premierministers [SIA.GetLeader] gegen ihn ist Phibunsongkhram der regierenden Regierung feindlich gesinnt, da sein ehemaliges Amt als Verteidigungsminister zu seinem Nachteil an einen anderen übertragen wurde."
SIA_end_the_constitutional_protection_act_r56:	"Beenden Sie das Verfassungsschutzgesetz"
SIA_end_the_constitutional_protection_act_r56_desc:	"Zwar hat das Verfassungsschutzgesetz dem Land zwar die dringend benötigte Stabilität zurückgegeben [SIA.GetNameDef], doch ist es für das Wohl der Nation viel zu drakonisch. Wir sollten unverzüglich seine Aufhebung vorantreiben, damit freiere Stimmen die derzeitige Ordnung hinterfragen und etwas Besseres schaffen können."
SIA_limited_worker_protections_r56:	"Begrenzte Arbeitnehmerschutzmaßnahmen"
SIA_limited_worker_protections_r56_desc:	"Obwohl wir noch am Anfang unserer Industrialisierung stehen, werden unzureichende Arbeitnehmerschutzmaßnahmen zu einer Quelle der Unzufriedenheit für unsere Modernisierung. Wir sollten der Nation klar machen, dass wir Pläne haben, diese Mängel im Zuge unseres industriellen Wandels zu beheben."
SIA_improve_national_education_r56:	"Verbesserung des nationalen Bildungswesens"
SIA_improve_national_education_r56_desc:	" Obwohl wir seit 1932 massiv in die Bildung investiert haben, ist die weit verbreitete Analphabetismusrate, insbesondere auf dem Land, eine Plage, die unseren Status als gleichberechtigter Partner in der Region bedroht. Sowohl der junge Flügel der Armee als auch der zivile Flügel haben einzigartige Vorschläge, wie wir dieser Bedrohung begegnen können; wir sollten ihnen zuhören und auf einen Kompromiss für einen umfassenderen Plan hinarbeiten."
SIA_nationalist_education_policies_r56:	"Nationalistische Bildungspolitik"
SIA_nationalist_education_policies_r56_desc:	"Da Analphabetismus nach wie vor ein Problem in der Nation darstellt und die Notwendigkeit einer starken Verteidigung deutlicher denn je ist, übernimmt das Militär, inspiriert von ausländischen Vorbildern, eine größere Rolle als je zuvor bei der Heranbildung disziplinierter, motivierter Männer, die bereit sind, unser Vaterland um jeden Preis zu verteidigen."
siam_r56.1.title:	"Ein Vorschlag der jungen Militärs"
siam_r56.1.desc:	"Phibunsongkhram und seine junge Fraktion innerhalb der Streitkräfte haben in letzter Zeit verstärkt auf die Finanzierung militärischer Vorhaben gedrängt, die der "Ausbildung in nationalen Fertigkeiten" gewidmet sind. "\n\nZwar sind unsere Streitkräfte für junge Männer im ganzen Land zu einem Ort geworden, an dem sie nützliche Fähigkeiten entwickeln können, doch könnten diese Mittel sicherlich stattdessen in staatliche Schulen fließen."
siam_r56.1.a:	"Moderne Bildung kann nur durch institutionellen Fortschritt erreicht werden."
siam_r56.1.b:	"Angesichts der tragenden Rolle, die unsere Armee spielt, ist eine solche Initiative notwendig."
SIA_military_led_nation_building_r56:	"Militärgeführter Staatsaufbau"
SIA_military_led_nation_building_r56_desc:	"Phibunsongkhram ist einer unserer größten Offiziere und der de facto Anführer der militaristischen Bewegung der Khana Ratsadon, in deren Rahmen er schrittweise die Zentralisierung, Modernisierung und Militarisierung des Staates vorantreibt. Angesichts drohender Gefahren sollten wir seine Vorschläge für die Nation prüfen."
SIA_utilize_the_engineer_corps_r56:	"Das Ingenieurkorps einsetzen"
SIA_utilize_the_engineer_corps_r56_desc:	"Ein Großteil der [SIA.GetAdjective] Landschaft ist nach wie vor unterentwickelt. Unser diszipliniertes Ingenieurkorps könnte möglicherweise eine Rolle bei Projekten spielen, die diese Teile des Landes modernisieren würden."
unlocks_decision_utilize_the_engineer_corps_which_grants_tt:	"Entscheidung freischalten: §YDas Ingenieurkorps einsetzen§!, was Folgendes gewährt:\n§YFür 84 Tage§!:\nTägliche Unterstützung durch die Demokraten: §R -0,02§!\nBaugeschwindigkeit: §G+6,00 %§!\n\n"
SIA_strengthen_the_youth_corps_r56:	"Stärkung des Jugendkorps"
SIA_strengthen_the_youth_corps_r56_desc:	"Viele der modernen europäischen Staaten, zu denen wir aufschauen, haben innerhalb ihrer Streitkräfte eine Kultur der Loyalität und Hingabe geschaffen, insbesondere indem sie durch Jugendprogramme militaristischen Eifer in die heranwachsenden Köpfe ihrer Nationen einflößen. Vielleicht ist es an der Zeit, dass [SIA.GetNameDef] ein eigenes Jugendkorps aufstellt."
SIA_propagandize_the_six_principles_r56:	"Die sechs Prinzipien propagieren"
SIA_propagandize_the_six_principles_r56_desc:	"Die Khana Ratsadon verfügt über eine talentierte Abteilung von Künstlern und Propagandisten. Wir sollten sie nutzen, um Unterstützung für jede Bewegung zu gewinnen, die wir für notwendig erachten. "
SIA_r56.4.title:	"Propaganda für die nationale Revolution"
siam_r56.4.desc:	"Die Gründe, warum unsere Revolution von 1933 eine Notwendigkeit war, sind einem Großteil unserer Bevölkerung noch immer unbekannt. Was sollte angesichts unseres Monopols auf staatliche Propaganda der primäre Kanal für dieses wichtige Instrument sein?"
siam_r56.4.a:	"Wir werden der Nation ihre Stärke zurückgeben und rächen, was uns so teuer zu stehen kam."
siam_r56.4.b:	"Wir streben nach Frieden und Modernität in dieser chaotischen Weltordnung. "
SIA_phahon_steps_down_r56:	"Phahon tritt zurück"
SIA_phahon_steps_down_r56_desc:	"Wir danken ihm zwar auf ewig für seine Dienste an der Nation, doch ist klar, dass die Zeit gekommen ist, dass ein neuer Führer die Khana Ratsadon vorwärts führt. Da sich die Welt erneut rasch auf einen Krieg zubewegt, müssen wir sorgfältig auswählen, wer die Nachfolge antreten und die dringend benötigten Reformen vorantreiben kann. "
SIA_phahon_steps_down_r56_tt:	"Wenn §YPhahon zurücktritt§! durch ein Ereignis, wird dieser Fokus automatisch abgeschlossen"
SIA_traditionalist_opposition_r56:	"Traditionalistische Opposition"
SIA_traditionalist_opposition_r56_desc:	"Der Sturz von Phraya Phonphayuhasena zugunsten eines weniger gemäßigten Premierministers bereitet einem Großteil der Bevölkerung Sorgen. Wir sollten alles in unserer Macht Stehende tun, um diese Unzufriedenheit zu besänftigen."
SIA_r56.5.title:	"Wahlen in der Volksversammlung"
siam_r56.5.desc:	"Nach vielen Monaten politischer Skandale, korrupter Minister, die die Regierungslage verschlechtern, und Gerüchten über Phahons nachlassende Gesundheit hat er zugestimmt, zugunsten eines jüngeren Nachfolgers zurückzutreten. \n\nDer naheliegendste Kandidat für dieses Amt ist Plaek Phibunsongkhram, der sich über Jahre hinweg ein Machtnetzwerk innerhalb der Armee aufgebaut hat. Obwohl er mit Phahon befreundet ist, ist Phibuns Politik weitaus militanter und nationalistischer, und er wird – im Guten wie im Schlechten – die Rolle des Landes auf der Weltbühne wahrscheinlich stärken. \n\nPridi Banomyong ist der reformorientierteste Kandidat für das Amt des Premierministers, da er einer der Hauptbefürworter der institutionellen Reformen war, die in den letzten Jahren von Phahons Amtszeit verabschiedet wurden. Unter einer Regierung unter Pridi ist es wahrscheinlich, dass er [ROOT.GetNameDef] auf interne Reformen und externen Internationalismus ausrichten wird. \n\nSchließlich ist zwar seine Bereitschaft, das Amt zu übernehmen, fraglich, und er steht nicht auf bestem Fuß mit Phahon, ist Phraya Songsuradet das mächtigste Mitglied der Streitkräfte nach Phibunsongkhram und der einzig mögliche Nachfolger am konservativen Ende der [ROOT.GetAdjective]-Politik. Da er weitaus reaktionärer ist als Phahon, ist ein direkter Konflikt mit Pridi und Phibun sehr wahrscheinlich. \n\nZwar ist Phahons Machtbasis in den letzten Monaten weitgehend zusammengebrochen, doch hat seine Meinung in der Volksversammlung nach wie vor Gewicht. Wen wird Phahon unterstützen, um dort weiterzumachen, wo er aufgehört hat? "
SIA_available_option_if_authoritarian_support_is_30_or_higher_tt:	"Verfügbare Option, wenn §gautoritär§! die Unterstützung bei 30 % oder höher liegt:"
SIA_available_option_if_democratic_support_is_30_or_higher_tt:	"Verfügbare Option, wenn §4demokratisch§! die Zustimmung bei 30 % oder höher liegt:"
SIA_available_option_if_fascism_support_is_30_or_higher_tt:	"Verfügbare Option, wenn §8Faschismus§! die Zustimmung 30 % oder mehr beträgt:"
siam_r56.5.a:	"Songsuradet wird unsere Revolution mit den friedlichen Traditionen Siams in Einklang bringen."
SIA_completes_focus_songsuradets_ascendency_which_grants_tt:	"Schließt den Schwerpunkt §YSongsuradets Aufstieg§! ab, der Folgendes gewährt:"
siam_r56.5.b:	"Pridi wird die institutionelle Modernisierung Siams fortsetzen, bis wir eins mit dem Westen sind!"
SIA_completes_focus_pridis_premiership_which_grants_tt:	"Schließt den Fokus §YPridis Amt als Premierminister§! ab, was Folgendes gewährt:"
siam_r56.5.c:	"Phibunsongkhram wird die Ehre der [SIA.GetAdjective] Nation wiederherstellen!"
SIA_completes_focus_phibuns_takeover_which_grants_tt:	"Schließt den Fokus §YPhibuns Machtübernahme§! ab, was Folgendes gewährt:"
SIA_songsuradets_ascendency_r56:	"Songsuradets Aufstieg"
SIA_songsuradets_ascendency_r56_desc:	"Obwohl Songsuradet lange Zeit kein Interesse daran hatte, die Macht zu übernehmen, erfordert die Lage [SIA.GetNameDef] eine starke, bescheidene Führung. Die Modernisierung der Nation soll fortgesetzt werden, diesmal unter unserer weisen Aufsicht!"
SIA_songsuradets_ascendency_r56_tt:	"Wählbar über das Ereignis §YWahlen in der Volksversammlung§!, wenn §gautoritäre§! Unterstützung bei 30 % oder höher liegt."
SIA_songsuradets_ascendency_r56_idea_desc:	"Songsuradets Aufstieg zum Premierminister hat zu Unzufriedenheit unter den Mitgliedern der zivilen Fraktion der Khana Ratsadon geführt. Wir müssen eine gemeinsame Basis finden oder diese Unruhen niederschlagen, wenn wir unsere Pläne für die Nation verwirklichen wollen."
SIA_siamese_ultranationalist_movement_hostile_r56_desc:	"Obwohl unsere Streitkräfte innerhalb der regierenden Khana Ratsadon über enorme Macht verfügen, steht der ideologischen Einheit wenig im Wege. Durch den Einfluss des aufstrebenden Plaek Phibunsongkhram gewinnt der Ultranationalismus nach italienischem und japanischem Vorbild im ganzen Land rasch an Boden."\n\nDerzeit Phibunsongkhram lehnt unsere amtierende Regierung ab und nutzt seine Rolle als Verteidigungsminister, um seinen Einfluss im ganzen Land zu stärken, wahrscheinlich in dem Versuch, das Regime zu stürzen. Er und seine Anhänger müssen entweder auf unsere Seite gebracht oder zerschlagen werden, wenn wir die Rückkehr zur nationalen Stabilität wünschen."
SIA_siamese_ultranationalist_movement_hostile_2_r56_desc:	"Obwohl unsere Streitkräfte innerhalb der regierenden Khana Ratsadon über enorme Macht verfügen, steht der ideologischen Einheit wenig im Wege. Durch den Einfluss des aufstrebenden Plaek Phibunsongkhram gewinnt der Ultranationalismus nach italienischem und japanischem Vorbild im ganzen Land rasch an Boden.\n\nAufgrund seines destabilisierenden Charakters haben wir Phibunsongkhram ins Exil gezwungen, damit er seine Rolle als Verteidigungsminister nicht länger dazu nutzen kann, sich auf Kosten der Nation zu stärken . Seine verbliebenen Anhänger müssen entweder auf unsere Linie gebracht oder vernichtet werden, wenn wir die Rückkehr zur nationalen Stabilität anstreben."
SIA_siamese_youth_corps_r56:	"[SIA.GetAdjective] Jugendkorps"
SIA_siamese_youth_corps_r56_desc:	" In Anlehnung an viele europäische Regime, die Ähnliches getan haben, strebt das [SIA.GetAdjective] Jugendkorps danach, innerhalb der Streitkräfte eine Kultur der Loyalität und Hingabe zu schaffen, insbesondere indem es den heranwachsenden Köpfen der Nation militaristischen Eifer einflößt.\n\nDie ultranationalistische Ausrichtung dieser Organisation beeinflusst derzeit die und führt zu einer breiteren Zustimmung zu solchen politischen Maßnahmen."
SIA_siamese_youth_corps_2_r56_desc:	"Im Schatten vieler europäischer Regime, die Ähnliches getan haben, strebt das [SIA.GetAdjective] Jugendkorps danach, innerhalb der Streitkräfte eine Kultur der Loyalität und Hingabe zu schmieden, insbesondere indem es den heranwachsenden Köpfen der Nation militaristischen Eifer einflößt. "
SIA_return_to_international_prestige_r56:	"Rückkehr zu internationalem Ansehen"
SIA_return_to_international_prestige_r56_desc:	"Durch unsere gerechte Herrschaft haben wir die Nation wieder zu einem regionalen Akteur und Machtfaktor gemacht. Wir sind bereit, dem Chaos und der Instabilität, die Europa erfasst haben, entschlossen entgegenzutreten!"
SIA_remodel_the_fine_arts_department_r56:	"Umstrukturierung der Abteilung für Bildende Künste"
SIA_remodel_the_fine_arts_department_r56_desc:	"Wenn wir die kommenden Zeiten überstehen wollen, brauchen wir ein Propagandaministerium, das den Mächten, denen wir gegenüberstehen, gewachsen ist. Unsere Abteilung für Bildende Künste könnte umgestaltet werden, um dieser wichtigen Mission gerecht zu werden."
unlocks_decision_prepare_a_wartime_mobilization_which_grants_tt:	"Entscheidung freischalten: §YKriegsmobilisierung vorbereiten§!, was Folgendes gewährt: "
SIA_remodel_the_fine_arts_department_r56_tt:	"§YFür 105 Tage: §! §GReduziert§! die Kosten für Wehrpflicht-, Handels- und Wirtschaftsgesetze um §G75 %§!."
SIA_call_for_support_in_our_war_effort_r56:	" Aufruf zur Unterstützung unserer Kriegsanstrengungen"
SIA_call_for_support_in_our_war_effort_r56_desc:	"Ein Krieg steht bevor, und das Volk unserer Nation muss bereit sein. Wir müssen alle dazu aufrufen, im Namen des Sieges und des Überlebens unserer Nation alles zu geben, was sie können."
unlocks_decision_call_for_support_in_our_war_effort_which_grants_tt:	"Entschließung freischalten: §YAufruf zur Unterstützung unserer Kriegsanstrengungen§!, die Folgendes gewährt:"
SIA_propagandize_our_rule_r56:	"Unsere Herrschaft propagieren"
SIA_propagandize_our_rule_r56_desc:	"Eine Zeit der Krise steht uns bevor, eine, die über das Schicksal aller [SIA.GetAdjective] Menschen entscheiden wird. Mit der Partei an unserer Seite werden wir eine strahlende Zukunft für diesen Teil Asiens schmieden!"
SIA_protectors_of_the_nation_r56:	"Beschützer der Nation"
SIA_protectors_of_the_nation_r56_desc:	"Eine Zeit der Krise steht uns bevor, eine, die über das Schicksal aller [SIA.GetAdjective] Menschen entscheiden wird. Mit der Partei an unserer Seite und unserer uneingeschränkten Herrschaft werden wir eine strahlende Zukunft für diesen Teil Asiens schmieden!"
SIA_respond_to_the_international_crisis_r56:	"Auf die internationale Krise reagieren"
SIA_respond_to_the_international_crisis_r56_desc:	"Ein Krieg zieht über Ostasien herein, und unsere Politik muss sich auf das Chaos und das Blutvergießen vorbereiten, das dies mit sich bringen wird. Es müssen Maßnahmen ergriffen werden, um zu zeigen, dass wir eine Macht sind, die auf der Weltbühne gefürchtet wird."
unlocks_decision_expand_national_rice_reserves_which_grants_tt:	"Entscheidung freischalten: §YNationale Reisreserven ausbauen§!, was Folgendes gewährt: "
SIA_expand_national_rice_reserves_r56:	"Nationale Reisreserven ausbauen"
SIA_expand_national_rice_reserves_r56_desc:	"Unsere Nation ist anfällig für Dürren, Bombenangriffe und andere Ursachen für Ernteausfälle. Wir sollten ausreichende Reisreserven anlegen, um Hungersnöte und Instabilität in der Zukunft zu vermeiden."
SIA_prepare_a_wartime_mobilization_r56:	"Vorbereitung einer Kriegsmobilisierung"
SIA_prepare_a_wartime_mobilization_r56_desc:	"Unsere Wirtschaft und die Gesellschaft insgesamt müssen darauf vorbereitet sein, dass bald ein Krieg in unser Heimatland kommen könnte. Wir werden heute alles geben, damit unsere Kinder morgen in einer prosperierenden Nation leben können!"
SIA_promote_national_unity_r56:	" Förderung der nationalen Einheit"
SIA_promote_national_unity_r56_desc:	"Zwar müssen wir stets auf die Bedürfnisse unseres Volkes eingehen, doch ist die Zeit gekommen, alles andere beiseite zu lassen im Namen der Ordnung, die wir gegen das Chaos, das diese Welt erfasst hat, geschaffen haben."
SIA_government_of_national_unity_r56:	"Regierung der nationalen Einheit"
SIA_government_of_national_unity_r56_desc:	"Zwar müssen wir stets auf die Bedürfnisse unseres Volkes eingehen, doch ist nun die Zeit gekommen, alles andere beiseite zu lassen im Namen der Ordnung, die wir gegen das Chaos geschaffen haben, das diese Welt erfasst hat. Wir werden Seite an Seite mit den fähigsten Männern aller Ideologien stehen, die das Beste für unsere Nation anstreben!"
SIA_wartime_economic_policies_r56:	"Wirtschaftspolitik in Kriegszeiten"
SIA_wartime_economic_policies_r56_desc:	"Ein Schritt in Richtung Krieg bedeutet einen Schritt in Richtung einer Wirtschaftspolitik, die unsere Industrie verteidigt und Stabilität gewährleistet. Wir werden auf das, was kommt, vorbereitet sein, komme, was wolle!"
unlocks_decision_implement_price_controls_which_grants_tt:	"Entscheidung freischalten: §YPreiskontrollen einführen§!, was Folgendes gewährt:"
SIA_implement_price_controls_r56:	"Preiskontrollen einführen"
SIA_implement_price_controls_r56_desc:	"Der Grad der wirtschaftlichen Mobilisierung in unserem Land ist eine bedauerliche, aber notwendige Ursache für Preisschwankungen. Auch wenn sie zu Engpässen führen können, können durchdachte Preiskontrollen hoffentlich die Inflationsrate in unserem Land dämpfen und die Popularität wiederherstellen."
unlocks_decision_instill_wartime_taxes_which_grants_tt:	"Entschließt: §YKriegssteuern einführen§!, was Folgendes gewährt:\n§YFür 105 Tage:§!\nBeibehaltung der Produktionseffizienz: §G+8,00 %§!\nWachstum der Produktionseffizienz: §G+8,00 %§!\nMalus bei Ressourcenmangel : §G-16,00 %§!"
SIA_instill_wartime_taxes_r56:	"Kriegssteuern einführen"
SIA_instill_wartime_taxes_r56_desc:	"Auch wenn sie zweifellos Unzufriedenheit hervorrufen werden, sind zusätzliche Steuern letztlich notwendig, um unserer Regierung die Mittel zu verschaffen, die sie benötigt, um unsere Wirtschaft inmitten dieses Krieges am Laufen zu halten."
SIA_open_up_the_economy_r56:	"Öffnung der Wirtschaft"
SIA_open_up_the_economy_r56_desc:	"Die Nationen des Westens konkurrieren um Einfluss in unserem lebenswichtigen Teil der Welt. Wir sollten zu einer Politik der offenen Türen im Handel zurückkehren, damit wir unseren Wohlstand mehren und unsere Unabhängigkeit schützen können."
SIA_stanvac_oil_company_r56:	"Stanvac Oil Company"
SIA_stanvac_oil_company_r56_tt:	"Zusätzliche Ressourcen aus dem Handel mit §Y[USA.GetNameWithFlag]§!: §G+2§!"
SIA_hsbc_r56:	"HSBC"
SIA_hsbc_r56_tt:	"Zusätzliche Ressourcen aus dem Handel mit §Y[ENG.GetNameWithFlag]§!: §G+2§!"
SIA_behn_meyer_co_r56:	"Behn, Meyer & Co."
SIA_behn_meyer_co_r56_tt:	"Zusätzliche Ressourcen aus dem Handel mit §Y[GER.GetNameWithFlag]§!: §G+2§!"
SIA_negotiate_a_mass_development_plan_r56:	"Verhandlung eines Massenentwicklungsplans"
SIA_negotiate_a_mass_development_plan_r56_desc:	"Wir streben zwar den Schutz einer stabilen Ordnung an, doch diese kann nicht erreicht werden, wenn die schlechten Lebensbedingungen der [SIA.GetAdjective] Bauern und Industriearbeiter nicht angegangen werden. Wir sollten mit Vertretern des zivilen Flügels zusammenarbeiten, um einen Entwicklungsplan auszuarbeiten, der die Interessen unseres Volkes schützt und gleichzeitig vor übereilten Veränderungen bewahrt."
SIA_negotiate_a_mass_development_plan_r56_idea:	"Dank unserer Unterstützung für ihre Reformen steht der zivile Flügel unserer nationalen Plattform mittlerweile weitgehend wohlwollend gegenüber. Wir hoffen, dass sich dies durch fortgesetzte Zusammenarbeit zu einer Freundschaft entwickeln kann, die die Nation stabilisiert."
SIA_steady_path_to_rural_development_r56:	"Ein beständiger Weg zur ländlichen Entwicklung"
SIA_steady_path_to_rural_development_r56_desc:	"Die Einführung neuer Arbeits- und Bauernreformen ist ein gutes Zeichen für unsere Stabilität und Wirtschaft. Solange wir unsere Unabhängigkeit weiterhin schützen und an einer klugen Politik festhalten, werden die kommenden Zeiten unsere Nation in eine regionale Wirtschaftsmacht verwandeln!"
SIA_build_a_modest_social_state_r56:	"Aufbau eines bescheidenen Sozialstaats"
SIA_build_a_modest_social_state_r56_desc:	"Ein Teil der Bemühungen, unsere Nation zu Wohlstand zu führen, wird die Schaffung eines sinnvollen Sozialstaates beinhalten, damit unsere Arbeiter und Bauern vor den Auswirkungen des Kapitalismus und unserer industriellen Transformation geschützt sind. Auch wenn wir kein reiches Land sind, sollten wir in der Lage sein, mit den uns zur Verfügung stehenden Ressourcen bescheidene Reformen voranzutreiben."
SIA_build_a_modest_social_state_r56_idea_desc:	 "Dank unserer breiten Unterstützung für ihre Reformen steht der zivile Flügel unserer nationalen Plattform mittlerweile weitgehend positiv gegenüber. Mögen wir gemeinsam die Einheit im ganzen Land wiederherstellen!"
SIA_stabilize_our_economic_course_r56:	"Stabilisierung unseres wirtschaftlichen Kurses"
SIA_stabilize_our_economic_course_r56_desc:	"Da der zivile Flügel weitgehend zerschlagen ist, werden wir der Vorstellung ein Ende setzen, dass Investitionen in unserem Land den Forderungen der Sozialisten nach Umverteilung dessen zum Opfer fallen könnten, was rechtmäßig ihnen gehört."
SIA_address_the_need_for_reforms_r56:	"Den Reformbedarf angehen"
SIA_address_the_need_for_reforms_r56_desc:	"Da die Forderungen nach gewaltsamen Reformen weitgehend zerschlagen sind, sollten wir eigene Pläne verkünden, um die Lebensbedingungen unserer Bauern zu verbessern."
SIA_secure_the_armed_forces_r56:	"Sichern Sie die Streitkräfte"
SIA_secure_the_armed_forces_r56_desc:	"Phibun und seine ultranationalistische Bewegung sind die größte Bedrohung für unsere Herrschaft. Wir müssen ihn und all seine militantesten Verbündeten verbannen und diejenigen, die bereit sind, mit uns zusammenzuarbeiten, an den Verhandlungstisch bringen."
SIA_refine_the_revolutionary_policies_r56:	" Die revolutionären Maßnahmen verfeinern"
SIA_refine_the_revolutionary_policies_r56_desc:	"Ob wir es wollen oder nicht, es wird in der Nation immer Menschen geben, die sich unseren Regierungsidealen widersetzen. Wir können uns sicherlich mit dieser Tatsache abfinden und eine Anpassung unserer ursprünglichen Ziele für die Nation tolerieren."
unlocks_decision_expand_tolerance_for_political_pluralism_which_grants_tt:	"Entschließt: §YToleranz für politischen Pluralismus ausweiten§!, was Folgendes gewährt:\nTägliche demokratische Unterstützung: §G+0,05§!\nTägliche Unterstützung für den Faschismus: §G+0, 01§!\n\n"
SIA_expand_tolerance_for_political_pluralism_r56:	"Toleranz für politischen Pluralismus ausweiten"
SIA_expand_tolerance_for_political_pluralism_r56_desc:	"Ganz gleich, was wir tun, die Herrschaft der Khana Ratsadon wird immer Forderungen nach einer Sache mit sich bringen: Demokratie für die Nation. Wir müssen diese Tatsache tolerieren und prüfen, wo wir bei den von ihnen vorgeschlagenen Reformen Kompromisse eingehen können."
unlocks_decision_push_for_national_order_which_grants_tt:	"Entscheidung freischalten: §YAuf nationale Ordnung drängen§!, was Folgendes gewährt:"
SIA_push_for_national_order_r56:	"Förderung der nationalen Ordnung"
SIA_push_for_national_order_r56_desc:	"Liberale und Kommunisten sind die größte Bedrohung für diese Nation, und wir müssen gegen sie vorgehen. Wir werden Ordnung in der Nation fordern und ihrer Opposition ein Ende setzen!"
SIA_redressment_for_the_june_coup_r56:	"Wiedergutmachung für den Juni-Putsch"
SIA_redressment_for_the_june_coup_r56_desc:	"Dass Phahon 1933 unserer konservativen Koalition ein Ende setzte und den Destabilisator Pridi in unser Land zurückholte, war eine Tragödie für den friedlichen Charakter unserer Revolution. Dies darf unter keinen Umständen wieder geschehen, und wir werden sicherstellen, dass es nicht geschehen kann!"
SIA_focus_on_economic_growth_r56:	"Fokus auf Wirtschaftswachstum"
SIA_focus_on_economic_growth_r56_desc:	"Da die Stabilität im Land wiederhergestellt ist, ist es an der Zeit, Maßnahmen zur Förderung des Wirtschaftswachstums umzusetzen. Mögen die kommenden Jahrzehnte unserem Volk Wohlstand bringen!"
SIA_stability_and_economic_growth_r56:	"Stabilität und Wirtschaftswachstum"
SIA_stability_and_economic_growth_r56_desc:	"Da die Stabilität in unserem Land wiederhergestellt ist, ist es an der Zeit, Maßnahmen zur Förderung des Wirtschaftswachstums umzusetzen. Mögen die kommenden Jahrzehnte unserem Volk Wohlstand bringen!"
SIA_disciplined_separate_army_r56:	"Disziplinierte, von der Politik getrennte Armee"
SIA_disciplined_separate_army_r56_desc:	"Mit der nationalistischen Bewegung an unserer Seite und konservativen, nationalistischen Politikern in unserem Land ist es an der Zeit, die Armee von der Innenpolitik zu trennen, damit sie der wahren Bedrohung für unser Land am besten begegnen kann: der Außenwelt."
SIA_protectors_of_the_old_order_r56:	"Hüter der alten Ordnung"
SIA_protectors_of_the_old_order_r56_desc:	"Das Ende der revolutionären Gewalt wird nur durch eine Umwandlung der Armee in eine Streitmacht erreicht werden, die revolutionäre Aufrufe wie jene, die unsere Nation zerrissen haben, untergraben und kontrollieren kann. Der Einfluss der Armee auf die Politik muss gefestigt werden, wenn Stabilität erhalten bleiben soll."
SIA_absorb_the_nationalist_movement_r56:	"Die nationalistische Bewegung einbinden"
SIA_absorb_the_nationalist_movement_r56_desc:	"Da Phibun das Land verlassen hat, müssen wir uns an diejenigen wenden, die seinen Idealen folgen. Da auch wir Ordnung und Stärke für die Nation anstreben, können wir sicherlich eine ideologische Gemeinsamkeit mit der ultranationalistischen Bewegung finden; alles, was erforderlich ist, ist ein einfacher Dialog!"
SIA_nationalist_conservative_cooperation_r56:	"Zusammenarbeit zwischen Nationalisten und Konservativen"
SIA_nationalist_conservative_cooperation_r56_desc:	"Da Phibun das Land verlassen hat und die Nation unter konservativer Herrschaft steht, arbeiten die verbleibenden ultranationalistischen Kräfte allmählich mit unserer Regierung zusammen, da sie wissen, dass wir nur das Beste für unsere Nation im Sinn haben."
SIA_economy_of_national_defense_r56:	"Wirtschaft der Landesverteidigung"
SIA_economy_of_national_defense_r56_desc:	"Ein Krieg steht Südostasien bevor, und wir müssen bereit sein. Während unser Militär eine relativ starke Streitmacht ist, ist unsere Wirtschaft schwach und unvorbereitet; wir müssen uns dieser Tatsache unverzüglich annehmen."
SIA_restore_the_honor_of_the_chakri_r56:	"Die Ehre der Chakri wiederherstellen"
SIA_restore_the_honor_of_the_chakri_r56_desc:	"Selbst nach der Rückkehr der konservativen Regierung ist ein Großteil der Bevölkerung weiterhin besorgt und misstrauisch gegenüber der Herrschaft von Khana Ratsadon. Die Zeit ist gekommen, die Ehre der Monarchie wiederherzustellen, und damit wird die Nation gedeihen!"
SIA_rama_vii_r56:	"Rama VII."
SIA_rama_vii_r56_desc:	"Nach der Rückkehr des pro-monarchistischen Premierministers ist Rama VII. kürzlich in das Land zurückgekehrt und hat zugestimmt, unter der Regierungsführung von Khana Ratsadon eine zeremonielle Rolle zu übernehmen. Da seine Abdankung ein wesentlicher Faktor für die nationale Instabilität war, ist seine Rückkehr ein gutes Zeichen für die Zukunft."
SIA_utilize_the_royal_opulence_r56:	"Die königliche Opulenz nutzen"
SIA_utilize_the_royal_opulence_r56_desc:	"Die königliche Familie verfügt über einen enormen Reichtum, und dies könnte eine für beide Seiten vorteilhafte Gelegenheit darstellen. Durch Beiträge zu nationalen Projekten und zum Sozialstaat kann die Rama-Dynastie ihren Einfluss und ihre Unterstützung stärken, während sie gleichzeitig die Nation stärkt und Forderungen nach einer Zwangsverteilung ein Ende setzt."
SIA_continue_the_democratic_transition_r56:	"Den demokratischen Wandel fortsetzen"
SIA_continue_the_democratic_transition_r56_desc:	"Songsuradet ist weit davon entfernt, nach Macht zu streben, und es ist an der Zeit, einen Nachfolger zu finden, damit er sich wieder militärischen Angelegenheiten widmen kann."
SIA_end_the_revolutionary_turbulence_r56:	"Beenden Sie die revolutionären Unruhen"
SIA_end_the_revolutionary_turbulence_r56_desc:	"Wir haben der Nation Frieden, Ordnung und Stabilität zurückgebracht. Wir werden aus jedem globalen Konflikt, in den wir uns begeben, als Sieger hervorgehen und der Nation ein goldenes Zeitalter bescheren!"
SIA_consolidate_the_peoples_assembly_r56:	"Konsolidieren Sie die Volksversammlung"
SIA_consolidate_the_peoples_assembly_r56_desc:	"Songsuradet ist zwar keineswegs auf Macht aus, aber er ist derzeit der beste Mann, um die Nation zu regieren. Damit in Siam wieder Stabilität einkehrt, muss er seine Macht festigen und eine gemäßigte Diktatur führen, um Wirtschaftswachstum und Stabilität zu fördern."
SIA_push_wichitwathakan_to_the_forefront_r56:	"Wichitwathakan in den Vordergrund rücken"
SIA_push_wichitwathakan_to_the_forefront_r56_desc:	"Luang Wichitwathakan, obwohl einst ein Verbündeter der ultranationalistischen Bewegung, zeigt im Vergleich zum italophilen Phibun eindeutig weitaus größeren Respekt vor der Monarchie und unseren Traditionen. Angesichts der nach wie vor gespaltenen Armee und der starken nationalistischen und konservativen Fraktionen ist ein ziviler Minister mit einer ideologischen Mischung aus Konservatismus und Nationalismus genau das, was unsere Nation in der kommenden Zeit braucht."
SIA_strengthen_the_anti_communist_act_r56:	"Das Antikommunistengesetz verschärfen"
SIA_strengthen_the_anti_communist_act_r56_desc:	"Schon seit den Tagen von Nitithada ist klar, dass Pridi und sein reformistischer Flügel der Khana Ratsadon eine Bedrohung für die Nation und das darstellen, wofür wir stehen. Wenn wir das Chaos vermeiden wollen, das seine Herrschaft mit sich bringen würde, muss er unverzüglich von der Macht gestürzt werden. "
this_national_spirit_will_be_removed_after_365_days_tt:	"Dieser §YNationalgeist§! wird §Gentfernt§! nach §Y365§! Tagen."
SIA_lingering_civilian_wing_opposition:	"Anhaltender Widerstand des zivilen Flügels"
SIA_lingering_civilian_wing_opposition_desc:	"Unter Anwendung des Antikommunismusgesetzes drängen wir den reformistischsten Flügel der Khana Ratsadon aus unserer Regierung ins Exil. Ihre revolutionären Ideale können in den chaotischen Nationen des Westens bleiben, aus denen sie stammen."
SIA_has_been_purged_by_conservative_or_ultranationalist_forces:	 "Wurde gesäubert durch §gkonservative§! oder §8ultranationalistische§! Kräfte"
SIA_pridis_premiership_r56:	"Pridis Amtszeit als Premierminister"
SIA_pridis_premiership_r56_desc:	" Pridi Banomyong hat sich von einer führenden Kraft unserer Revolution zu einer Person entwickelt, die beinahe aus unserer Nation gesäubert worden wäre; schließlich kehrte er unter Phahons Regierungszeit nach [SIA.GetNameDef] zurück. Wir haben viele großartige Dinge erreicht, aber unter unserer Führung ist eine bessere Zukunft für das [SIA.GetAdjective] Volk möglich!"
SIA_pridis_premiership_r56_tt:	"Wählbar über das Ereignis §YWahlen in der Volksversammlung§!, wenn §4die Unterstützung für die §!Demokratie bei 30 % oder höher liegt. "
SIA_prepare_a_defense_of_the_nation_r56:	"Bereiten Sie die Verteidigung der Nation vor"
SIA_prepare_a_defense_of_the_nation_r56_desc:	"Ein Krieg zieht erneut über die Region herein, und wir müssen bereit sein. Denn wenn wir unterliegen, wäre alles, wofür wir so hart gearbeitet haben, umsonst. Unsere Nation muss bereit sein, sich gegen alles zu verteidigen, was die Großmächte ihr entgegenwerfen werden!"
SIA_the_question_of_the_regency_r56:	"Die Frage der Regentschaft"
SIA_the_question_of_the_regency_r56_desc:	"Die Abdankung von Prajadhipok löste eine Welle der Instabilität im ganzen Land aus, und wir haben uns noch nicht von den Folgen erholt. Da sich die Monarchie auf ihrem Tiefpunkt befindet, sollten wir jetzt entscheiden, welche langfristige Rolle sie für das Land spielen soll."
unlocks_decision_levy_additional_taxes_on_royal_wealth_which_grants_tt:	"Entscheidung freischalten: §YZusätzliche Steuern auf das königliche Vermögen erheben§!, was Folgendes gewährt:"
SIA_levy_additional_taxes_on_royal_wealth_r56:	"Zusätzliche Steuern auf das königliche Vermögen erheben"
SIA_levy_additional_taxes_on_royal_wealth_r56_desc:	" Die königliche Familie verfügt trotz unserer größten Bemühungen nach wie vor über übermäßige finanzielle Mittel. Angesichts der weitgehenden Verarmung der Nation kann diese kleine Elite nicht weiterhin so viel wirtschaftliche Macht über unser Land ausüben."
upon_the_completion_of_focus_prioritize_socioeconomic_progress_r56_tt:	"Nach Abschluss des Schwerpunkts: §YSozioökonomischen Fortschritt priorisieren§!:"
SIA_abolish_the_monarchist_order_r56:	"Die monarchistische Ordnung abschaffen"
SIA_abolish_the_monarchist_order_r56_desc:	"Angesichts der erstarkenden nationalen kommunistischen Bewegung und der Schwäche der meisten oppositionellen Bewegungen ist die Zeit gekommen, die monarchistische Ordnung zu stürzen und ein sozialistisches Paradies in Südostasien zu errichten. "
unlocks_decision_abolish_the_monarchist_order_which_grants_tt:	"Schaltet die Entscheidung frei: §YDie monarchistische Ordnung abschaffen§!, die Folgendes gewährt:"
SIA_r56.30.title:	"Das Schicksal der Chakri-Dynastie"
SIA_r56.30.desc:	"Da ein Großteil der königlichen Familie unserer Herrschaft nach wie vor feindlich gegenübersteht und ihre Macht sich weiterhin auf einem Tiefpunkt befindet, ist es an der Zeit zu entscheiden, wie ihr Schicksal in der Zukunft aussehen soll.\n\nZwar wird es ein langsamer, schmerzhafter Prozess sein, die Gesellschaft von der Chakri-Dynastie zu distanzieren, doch unsere Erfahrung mit der konstitutionellen Monarchie hat gezeigt, dass die Könige unserer Nation einen starken Machtanspruch haben, den wir unter keinen Umständen tolerieren können. \n\nWie soll das Schicksal der Monarchie aussehen?"
siam_r56.30.a:	"Eine Versöhnung mit dem König liegt im Interesse von uns allen!"
siam_r56.30.b:	"Wir brauchen keinen König. Der Einfluss der Königsfamilie muss so gering wie möglich gehalten werden!"
SIA_deal_with_the_armed_forces_r56:	"Umgang mit den Streitkräften"
SIA_deal_with_the_armed_forces_r56_desc:	" Die größte Bedrohung für die demokratische Herrschaft hat sich eindeutig als die Ultranationalisten erwiesen, die sich in unseren immer mächtiger werdenden Streitkräften eingenistet haben. Indem wir den mächtigen Luang Phibunsongkhram und einige seiner treuesten Anhänger verbannen, können wir die Bedrohung durch die Streitkräfte ohne allzu große Folgen neutralisieren."
SIA_rewrite_the_1932_constitution_r56:	"Die Verfassung von 1932 neu verfassen"
SIA_rewrite_the_1932_constitution_r56_desc:	"Mit Phahons Sturz und der Nation, die erneut unter unserer hoffnungsvollen Aufsicht steht, ist die Zeit gekommen, die Lage des Landes zu überprüfen und uns erneut zu fragen, welcher Weg für uns der beste ist."
SIA_towards_a_peoples_democracy_r56:	"Auf dem Weg zu einer Volksdemokratie"
SIA_towards_a_peoples_democracy_r56_desc:	"Nachdem wir das Amt des [SIA.GetAdjective] Staatspräsidenten vor nationalistischen und reaktionären Kräften gesichert haben, ist es an der Zeit, dem Volk einen Vorgeschmack auf die Ideale zu geben, für die wir kämpfen. Eine Regierung, die sich für die Bedürfnisse unseres Volkes einsetzt, ist für die Zukunft unerlässlich!"
SIA_prioritize_socioeconomic_progress_r56:	"Sozioökonomischen Fortschritt priorisieren"
SIA_prioritize_socioeconomic_progress_r56_desc:	" Vielleicht waren unsere Ziele für einen raschen demokratischen Wandel, wie viele Führer vor uns erfahren haben, zu hoch gesteckt für [SIA.GetAdjective] die Gesellschaft. Bevor wir als demokratische Nation des Westens agieren können, müssen wir dafür kämpfen, die nationale Bildung zu verankern, die Gesellschaft zu industrialisieren [SIA.GetAdjective] und eine Öffentlichkeit zu schaffen, die für moderne politische Institutionen bereit ist."
SIA_clamp_down_on_anti_revolutionary_dissent_r56_effects:	" §YFür 56 Tage:§! §GVerringert§! täglich §2Demokratische§! und §8Faschismus§! Unterstützung durch §G0,02§!."
SIA_clamp_down_on_anti_revolutionary_dissent_r56:	"Hartes Durchgreifen gegen antirevolutionäre Dissidenz"
SIA_clamp_down_on_anti_revolutionary_dissent_r56_desc:	"Auch wenn viele dies als unnötig autoritär bezeichnen, ist Widerstand gegen unsere Herrschaft Widerstand gegen den Fortschritt und die langfristige Überlebensfähigkeit unserer Nation. Angemessene Zensur muss herrschen, wenn wir die Nation schmieden wollen, die wir brauchen, um das zu überstehen, was auf uns zukommt. "
SIA_equality_under_our_law_r56:	"Gleichheit vor dem Gesetz"
SIA_equality_under_our_law_r56_desc:	"Nachdem die Konterrevolution innerhalb der Streitkräfte gestoppt wurde, ist es an der Zeit, die institutionellen Reformen fortzusetzen. Nur mit einem modernen Gesetzbuch können wir dem Westen wirklich gleichgestellt werden."
SIA_beacon_of_progress_r56:	"Leuchtfeuer des Fortschritts"
SIA_beacon_of_progress_r56_desc:	"Nachdem Phahon und Phibun von der Macht gestürzt wurden und Pridi an ihre Stelle getreten ist, befindet sich die Nation erneut in einer Phase großer Reformen. Siam ist auf dem Weg, eine moderne Nation zu werden, und nichts kann uns daran hindern!"
SIA_bottom_up_societal_modernization_r56:	"Gesellschaftliche Modernisierung von unten nach oben"
SIA_bottom_up_societal_modernization_r56_desc:	"Zwar wurden bereits Anstrengungen unternommen, um unsere Probleme zu lindern, doch [SIA.GetNameDef] bedarf einer weiteren Modernisierung. Im Schatten anderer Modernisierungsregime können wir aus deren Erfolgen und Misserfolgen lernen und [SIA.GetNameDef] endlich auf Augenhöhe mit dem Westen bringen!"
SIA_industrial_workers_reforms_r56:	"Reformen für Industriearbeiter"
SIA_industrial_workers_reforms_r56_desc:	"Wir stehen noch am Anfang unserer Industrialisierung, und vieles muss gut laufen, damit wir das politische Chaos vermeiden können, das Europa zu dieser Zeit einst heimgesucht hat. Indem wir die Arbeitsbedingungen stetig verbessern und den Lebensstandard hoch halten, können wir sicherlich verhindern, dass eine Welle der Unzufriedenheit die Nation zerstört."
SIA_maintain_the_fire_r56:	"Das Feuer am Leben erhalten"
SIA_maintain_the_fire_r56_desc:	"Die Abhaltung der nationalen Wahlen war ein gutes Zeichen für die Popularität unserer Regierung und hat uns die Macht verliehen, unsere Reformkampagne fortzusetzen. Der Wandel unserer Nation soll weitergehen, diesmal mit einem unbestrittenen Mandat unseres Volkes!"
unlocks_decision_support_laborer_organizations_which_grants_tt:	"Entscheidung freigeschaltet: §YArbeiterorganisationen unterstützen§!, was Folgendes gewährt:"
SIA_support_laborer_organizations_r56:	"Arbeiterorganisationen unterstützen"
SIA_support_laborer_organizations_r56_desc:	"Die Bauernklasse des Landes bildet eine wachsende Basis für unsere Unterstützung, und wenn wir wollen, dass unsere Herrschaft fortbesteht, müssen wir eine Politik umsetzen, die ihren Interessen entspricht. Die Unterstützung ihrer Bemühungen um kollektive Organisation wäre ein guter Weg, dies zu erreichen."
unlocks_decision_support_rural_farmers_which_grants_tt:	"Entscheidung freigeschaltet: §YUnterstützung der Landwirte§!, was Folgendes gewährt:\n§YFür 105 Tage: §!\nFaktor für Konsumgüterfabrik: §Y15,0 %§!\n\n"
SIA_support_rural_farmers_r56:	"Unterstützung für Landwirte"
SIA_support_rural_farmers_r56_desc:	"Zwar haben unsere Entwicklungsprojekte dazu beigetragen, die Zufriedenheit mit unserer Regierung zu steigern, doch es ist noch mehr zu tun. Damit unsere Regierung an Popularität gewinnt, müssen Maßnahmen ergriffen werden, um die Kosten für Strom und Wasser zu senken. Wir müssen uns auch dafür einsetzen, bestimmte Steuern zu senken, die unsere ländliche Bevölkerung übermäßig belasten. Auf diese Weise können wir sicherlich echte Unterstützung in der Bevölkerung auf dem Land gewinnen."
SIA_forge_a_democratic_legacy_r56:	"Ein demokratisches Vermächtnis schaffen"
SIA_forge_a_democratic_legacy_r56_desc:	"Obwohl wir unsere zivilen Institutionen gestärkt haben, ist die Geschichte der [SIA.GetAdjective] Demokratie eine Geschichte von Unruhen, Chaos und Unsicherheit. Durch Zeit und kontinuierliche Reformen können wir sicherlich Stabilität schaffen und ein hoffnungsvolles Bild der Zukunft zeichnen."
SIA_hold_national_elections_r56:	"Nationale Wahlen abhalten"
SIA_hold_national_elections_r56_desc:	"Mit den von uns vorgeschlagenen Reformen ist die Zeit gekommen, landesweite Wahlen abzuhalten und eine neue Ära für [SIA.GetNameDef] einzuläuten."
SIA_asias_liberal_firebrand_r56:	"Asiens demokratischer Rebell"
SIA_asias_liberal_firebrand_r56_desc:	"Siam steht an einem Scheideweg, den viele Führer vor uns bereits erlebt haben. Während viele unter dem Vorwand, ihre Nation auf ideologische Ziele "vorzubereiten", ihre Macht festigen würden, werden wir dem Volk einen Vorgeschmack auf die Freiheit geben, für die wir kämpfen und sterben. Die [SIA.GetAdjective] sollen die freiesten Menschen im Osten sein!"
SIA_stabilize_siams_political_woes_r56:	"Stabilisierung der politischen Unruhen in Siam"
SIA_stabilize_siams_political_woes_r56_desc:	"Seit den Tagen des Jahres 1932 hat große Instabilität das Anliegen unserer Revolution geplagt. Seitdem haben wir die zivile Herrschaft gestärkt und ein Ende der militärischen Einmischung garantiert, und damit wird endlich eine Zeit der Stabilität und des wirtschaftlichen Wachstums über unser Land kommen!"
SIA_phibuns_takeover_r56:	"Phibuns Machtübernahme"
SIA_phibuns_takeover_r56_desc:	" Angesichts zunehmender innenpolitischer Spannungen und einer Rückkehr zu internationalen Konflikten stehen wir an einem Scheideweg, den wir unter starker Führung bewältigen müssen. Phibunsongkhram hat unsere Revolution bereits zuvor gegen den reaktionären Aufstand von Boworadet verteidigt und eine entscheidende Rolle bei der Verbesserung unserer militärischen Bereitschaft gespielt. Die Zeit ist gekommen, ihn zu ernennen und [SIA.GetNameDef]s Entschlossenheit auf der Weltbühne zu demonstrieren!"
SIA_phibuns_takeover_r56_tt:	 "Wählbar über das Ereignis §YWahlen in der Volksversammlung§!, wenn die Unterstützung für §8Faschismus§! bei 30 % oder mehr liegt."
SIA_siamese_national_banking_bureau_r56:	" [SIA.GetAdjective] Nationales Bankamt"
SIA_siamese_national_banking_bureau_r56_desc:	"Trotz der geleisteten Arbeit liegen wir in der gesellschaftlichen und wirtschaftlichen Entwicklung immer noch Jahrzehnte hinter Europa zurück. Moderne Bankinstitute sind der Anfang eines modernen Wirtschaftsplans, der uns die Ressourcen verschaffen kann, um unsere Nation auf das Niveau des Westens zu bringen."
SIA_natl_banking_bureau_r56:	"Nationales Bankamt"
unlocks_decision_inflate_the_baht_which_grants_tt:	"Entscheidung freischalten: §YDen Baht aufwerten§!, was Folgendes gewährt: \n§YFür 140 Tage§!:\nBaugeschwindigkeit: §G+8,00 % §!\nFabrikproduktion: §G+8,00 %§!\nWerftproduktion: §G+8,00§!\n\n"
SIA_inflate_the_baht_r56:	" "Den Baht aufwerten"
SIA_inflate_the_baht_r56_desc:	"Auch wenn dies langfristig nicht die idealste Strategie ist, ist die Aufwertung des [SIA.GetAdjective] Baht eine Strategie, die wir verfolgen müssen, um unsere Schulden in den Griff zu bekommen und unsere Landesverteidigung aufrechtzuerhalten. "
SIA_push_for_universal_education_r56:	"Förderung der allgemeinen Bildung"
SIA_push_for_universal_education_r56_desc:	"Obwohl wir viel getan haben, um das Bildungsniveau im ganzen Land anzuheben, ist der Zugang nach wie vor sehr ungleich verteilt, zum Nachteil unserer ländlichen Provinzen. Wir sollten eine universelle, zentralisierte nationale Bildung als Ziel für die nahe Zukunft im gesamten Staatsgebiet festlegen."
SIA_towards_national_autarky_r56:	"Auf dem Weg zur nationalen Autarkie"
SIA_towards_national_autarky_r56_desc:	"Da der Krieg Asien erreicht, können wir uns keine Abhängigkeit von den Nationen Europas oder anderswo leisten. Wir müssen in der Lage sein, alles zu produzieren, wovon unsere Wirtschaft abhängt."
SIA_escalate_industrial_policy_r56:	"Verstärkung der Industriepolitik"
SIA_escalate_industrial_policy_r56_desc:	"Das Tempo unserer Industrialisierung ist inakzeptabel. Wenn wir eine moderne Nation werden wollen, müssen wir die Errungenschaften anderer Mächte nachahmen und nationales Kapital nutzen, um den Aufbau moderner Fabriken voranzutreiben."
SIA_improve_the_siamese_countryside_r56:	"Verbesserung des [SIA.GetAdjective] ländlichen Raums"
SIA_improve_the_siamese_countryside_r56_desc:	"Das sich rasch modernisierende Bangkok steht in krassem Gegensatz zur verarmten, von der Landwirtschaft abhängigen nördlichen Hälfte unseres Landes. Wir müssen alles in unserer Macht Stehende tun, um die Effizienz und die Lebensgrundlagen unserer Brüder auf dem Land zu verbessern."
SIA_local_industrial_boom_r56:	"Lokaler Industrieboom"
SIA_solidify_governmental_control_r56:	"Festigung der staatlichen Kontrolle"
SIA_solidify_governmental_control_r56_desc:	"Wenn wir eine Großmacht in Asien werden wollen, müssen wir jegliche Vorstellung zunichte machen, dass eine ernsthafte Opposition gegen unsere nationalen Pläne toleriert wird. Alle, die den Ruhm unserer Nation zerstören wollen, müssen zum Wohle von [SIA.GetNameDef] ausgelöscht werden!"
SIA_r56.20.title:	"Sicherung des Khana Ratsadon"
siam_r56.20.desc:	"Nachdem das Amt des Premierministers gesichert ist, ist es an der Zeit, Stabilität in [SIA.GetNameDef] zu bringen. Widerstand findet sich in allen Bereichen der Regierung und konzentriert sich auf zwei Hauptfronten:\n\nErstens die hochrangigen Militärs, die lose von Phraya Songsuradet angeführt werden, der für seine reaktionäre Sozial- und Wirtschaftspolitik bekannt ist, was eine natürliche Opposition gegen unsere vorgeschlagenen Reformen bedeutet. Sie werden von Pridi und seinen reformorientierten Verbündeten ebenfalls abgelehnt, da sie seine nationalen Pläne blockieren.\n\nAndererseits steht der talentierte Liberale Pridi Banomyong nach wie vor im Mittelpunkt und hat in der Vergangenheit bereits Kompromisse mit Phahon geschlossen; aufgrund seiner liberalen Tendenzen wird er sich jedoch wahrscheinlich vielen unserer nationalistischen Reformen widersetzen. Wir können zudem seine Unbeliebtheit bei den hochrangigen Militärs, die ihn als nichts Geringeres als einen Kommunisten betrachten, nutzen, um sie "im Namen der Ausrottung [SIA.GetAdjective] des Marxismus ".\n\nWir verfügen über das politische Kapital und die Popularität, um einem dieser Männer ein Ende zu bereiten. Die einzige Frage, die noch offen bleibt, ist: Welche Fraktion kann an unserer Seite stehen, während wir unseren nationalen Ruhm zurückerobern?"
siam_r56.20.a:	"Im Gegensatz zu Pridi und seinen Verbündeten nützt uns der reaktionäre Flügel von Songsuradet nichts."
SIA_compromise_modernization_front_r56:	"Kompromiss-Modernisierungsfront"
SIA_compromise_modernization_front_r56_desc:	"Auch wenn wir uns uneinig sind, gehören zum zivilen Flügel einige der besten und klügsten Köpfe Thailands. Es wäre eine Schande, sie in einer Zeit zu verlieren, in der die Nation kluge, starke Männer braucht."
siam_r56.20.b:	"Pridis Reformen bedrohen die Interessen des Staates. Wir müssen die hochrangigen Militärs gegen ihn aufbringen."
SIA_united_front_against_socialism_r56:	" Vereinigte Front gegen den Sozialismus"
SIA_united_front_against_socialism_r56_desc:	"Auch wenn wir uns uneinig sind, streben wir – anders als das Schreckgespenst des Kommunismus – nicht danach, die etablierte Ordnung zugunsten von Wahnsinn und Chaos zu stürzen. Sicherlich können wir mit den Traditionalisten innerhalb unserer Regierung eine gewisse gemeinsame Basis finden."
SIA_towards_a_great_thai_empire_r56:	"Auf dem Weg zu einem großen thailändischen Reich"
SIA_towards_a_great_thai_empire_r56_desc:	"Der siamesische Nationalismus hat seit Beginn der Regierungszeit von Chulalongkorn einen allmählichen Aufschwung erlebt, aber wir können ihn zu etwas Besserem machen. Ungeachtet dessen, was andere sagen mögen, wurde unsere Nation geschmiedet und gehört den Thai sprechenden Angehörigen unserer Kultur, von denen sich viele tragischerweise außerhalb der "siamesischen" Grenzen befinden. Wir müssen unsere ethnolinguistische Identität betonen und damit ein Reich schmieden, das Japan und dem Westen ebenbürtig ist!"
SIA_weaken_the_feudalist_institutions_r56:	"Schwächen Sie die feudalen Institutionen"
SIA_weaken_the_feudalist_institutions_r56_desc:	"Da wir den Weg zu einer echten Nation eingeschlagen haben, müssen wir uns der Notwendigkeit der Modernisierung stellen. Als Nation im Schatten der kemalistischen Türkei und des Meiji-Japans verfügen wir über eine Fülle nationaler Strategien, die wir anpassen können, um den besonderen Umständen unseres Landes gerecht zu werden. Egal was passiert, wir müssen weiter voranschreiten."
SIA_towards_a_great_thai_empire_r56_timer_tt:	" Hat vor weniger als 70 Tagen einen weiteren Schwerpunkt im §YAuf dem Weg zu einem großen [SIA.GetAdjective]Reich§! Unterzweig abgeschlossen\nAktuelle Tage sind: [?SIA_towards_a_great_thai_empire_r56_timer_flag:days|Y0]"
SIA_enact_nationalist_policies_r56:	"Nationalistische Politik umsetzen"
SIA_enact_nationalist_policies_r56_desc:	"Zwar findet ein Großteil der Nation Anklang bei den Idealen des [SIA.GetAdjective] Nationalismus, doch reicht dies kaum aus, um unsere Nation wirklich zum Blühen zu bringen. Wir müssen innenpolitische Maßnahmen ergreifen, die den Status unserer neuen Identität fördern."
unlocks_decision_tax_anti_thai_foreign_businesses_which_grants_tt:	"Entscheidung freischalten: §YSteuer auf "anti-[SIA.GetAdjective]" ausländische Unternehmen§!, die Folgendes gewährt:\n§YFür 84 Tage: §!\nFabrikproduktion: §G+8,00 % §!\nWerftproduktion: §G+8,00 %§!\n\n"
SIA_tax_anti_thai_foreign_businesses_r56:	"Besteuern Sie "anti-[SIA.GetAdjective]" ausländische Unternehmen"
SIA_tax_anti_thai_foreign_businesses_r56_desc:	"Ausländische Industrien, die unseren Interessen gegenüber illoyal sind, bleiben mächtig. Durch unverhältnismäßige Besteuerung können wir ihre lukrativen Gewinne sicherlich an das [SIA.GetAdjective] Volk zurückgeben, das sie so viel mehr verdient."
SIA_tighten_the_dictatorship_r56:	"Die Diktatur verschärfen"
SIA_tighten_the_dictatorship_r56_desc:	"Unsere Politik der nationalen Zentralisierung trägt Früchte. Es ist an der Zeit, die Macht des Premierministers weiter auszubauen, damit unsere großartigen Pläne für die Nation nun ungehindert in Angriff genommen werden können!"
unlocks_decision_organize_a_secret_police_crackdown_which_grants_tt:	"Entscheidung freischalten: §YOrganisieren Sie eine Razzia der Geheimpolizei§!, die Folgendes gewährt:\n§YFür 175 Tage:§!\nWöchentliche Stabilität: §G+0,50 %§!\nTägliche Unterstützung für den Faschismus: §G+0,01§!"
SIA_organize_a_secret_police_crackdown_r56:	"Organisieren Sie ein hartes Durchgreifen der Geheimpolizei"
SIA_organize_a_secret_police_crackdown_r56_desc:	"Trotz unserer größten Anstrengungen sind illoyale Elemente immer noch viel zu mächtig. Wenn alles andere versagt, kann unser Sonderdienst schnell mit Verrätern kurzen Prozess machen."
SIA_elevate_the_special_branch_r56:	"Stärken Sie den Sonderdienst"
SIA_elevate_the_special_branch_r56_desc:	"Zwischen den Mächten Europas und des Pazifiks liegen viele Nationen, die das Potenzial besitzen, Spionageinstrumente gegen unsere nationalen Interessen einzusetzen. Wir sollten sicherstellen, dass unsere mächtige Sonderabteilung die erforderlichen Mittel und Werkzeuge erhält, um jegliche Bedrohungen für unsere innere Sicherheit zu beseitigen."
SIA_empowered_special_branch_r56_LAR:	"Gestärkte Sonderabteilung"
SIA_empowered_special_branch_r56_LAR_desc:	"Zwischen den Mächten Europas und des Pazifiks liegen viele Nationen, die das Potenzial besitzen, Spionageinstrumente gegen unsere nationalen Interessen einzusetzen. Wir sollten sicherstellen, dass unsere mächtige Sonderabteilung die erforderlichen Mittel und Werkzeuge erhält, um jegliche Bedrohungen für unsere innere Sicherheit zu beseitigen."
SIA_form_a_cult_of_personality_r56:	"Einen Personenkult schaffen"
SIA_form_a_cult_of_personality_r56_desc:	"Trotz Phibunsongkhrams bewährter Fähigkeiten als Premierminister halten große Teile der Nation weiterhin an anderen Institutionen fest, insbesondere an der Monarchie. Zum Wohle unserer nationalen Entwicklung sollten wir einen Personenkult um Phibunsongkhram aufbauen, damit wir die nötige Dynamik erhalten, um die radikalen Reformen einzuleiten, die die [SIA.GetAdjective] für ihr Überleben benötigt!"
unlocks_decision_demand_public_display_of_the_prime_minister_which_grants_tt:	"Entscheidung freischalten: §YÖffentliche Zurschaustellung des Premierministers fordern§!, was Folgendes gewährt:"
SIA_demand_public_displays_of_the_prime_minister_r56:	"Forderung nach öffentlicher Darstellung des Premierministers"
SIA_demand_public_displays_of_the_prime_minister_r56_desc:	"Entgegen unseren Wünschen übt die Königsfamilie zu großen Einfluss auf unsere Gesellschaft aus, während unser tapferer und hingebungsvoller Premierminister nur eine Randfigur ist. Wir müssen dies korrigieren und allen klar machen, dass wir die wahren Beschützer der Nation sind!"
SIA_restorer_of_thailands_power_and_modernity_r56:	"Wiederhersteller von Thailands Macht und Modernität"
SIA_restorer_of_thailands_power_and_modernity_r56_desc:	"Nach Jahrhunderten des territorialen und militärischen Niedergangs haben wir unter dem willensstarken Eifer von Phibunsongkhram unsere Wirtschaft, innere Stabilität und militärische Bereitschaft in ein neues goldenes Zeitalter geführt! Nur ein Narr würde leugnen, dass wir dem Westen ebenbürtig sind."
SIA_iron_chancellor_of_the_east_r56:	"Eiserner Kanzler des Ostens"
SIA_iron_chancellor_of_the_east_r56_desc:	"Nach Jahrzehnten der Trauer über unsere nationalen Verluste haben wir unter der gerechten Herrschaft von Phibunsongkhram das Schlimmste unserer Verluste rückgängig gemacht und die Tai-Völker hinter unserer Flagge vereint, so wie Bismarck die Deutschen! Wer kann unsere Herrschaft jetzt ernsthaft anzweifeln, nach all dem, was wir erreicht haben?"
all_starting_laotian_cores_are_owned_by_you_or_a_subject_tt:	"Alle Start- §Ylaotischen§! Kerne gehören Ihnen oder einem Untertan"
shanland_is_owned_by_you_or_a_subject_tt:	" §Y[1018.GetName]§! gehört Ihnen oder einem Untertan"
batambang_is_owned_by_you_or_a_subject_tt:	 "§Y[925.GetName]§! gehört Ihnen oder einem Untertan"
SIA_opportunistic_militarization_r56:	"Opportunistische Militarisierung"
SIA_opportunistic_militarization_r56_desc:	"Eine Zeit großer Chancen steht uns bevor, sollten wir uns entschließen, sie zu nutzen. Damit [SIA.GetNameDef] wieder eine aktive Macht in Asien sein kann, müssen wir entscheidende Schritte unternehmen, um unsere militärische Bereitschaft zu stärken! Die Zeit ist gekommen, eine wirtschaftliche Mobilisierung zu veranlassen und unserem Volk klarzumachen, dass wir die letzten Schritte zur Wiederherstellung unserer Macht auf der Weltbühne eingeleitet haben!"
SIA_national_cultural_preservation_act_r56:	"Gesetz zur Erhaltung der nationalen Kultur"
SIA_national_cultural_preservation_act_r56_desc:	"Unsere [SIA.GetAdjective]-nationalistische Politik trägt Früchte, und mit ihr schmieden wir eine stärkere, harmonischere Macht innerhalb Südostasiens. Wir müssen das, was wir begonnen haben, weiter vorantreiben und den Wandel, den wir erst kürzlich eingeleitet haben, beschleunigen!"
unlocks_decision_heavy_handed_assimilation_policies_which_grants_tt:	"Entscheidung freigeschaltet: §YHarte Assimilationspolitik§!, die Folgendes gewährt:"
SIA_heavy_handed_assimilation_policies_r56:	"Harte Assimilationspolitik"
SIA_heavy_handed_assimilation_policies_r56_desc:	"Damit wir eine starke Nation bleiben, brauchen wir eine ebenso starke kulturelle und sprachliche Identität. Alle, die sich hier niedergelassen haben, müssen genauso [SIA.GetAdjective] werden wie der Rest von uns!"
SIA_return_to_the_world_stage_r56:	"Rückkehr auf die Weltbühne"
SIA_return_to_the_world_stage_r56_desc:	"Ein Konflikt steht uns erneut bevor. Wir müssen alles in unserer Macht Stehende tun, um unsere Position in der Welt zu sichern, damit wir nicht erneut in eine Ära der Demütigung geraten, zum Vorteil ausländischer Mächte."
SIA_forced_out_of_neutrality_r56:	"Aus der Neutralität gedrängt"
SIA_forced_out_of_neutrality_r56_desc:	"Trotz unseres Wunsches, im Großen Ostasienkrieg neutral zu bleiben, hat [JAP.GetNameDef] eine Invasion unseres Landes gestartet und uns in einem Moment der Verzweiflung auf unsere Seite gezogen. Wir befinden uns auf einem gefährlichen Weg, doch unter weiser Führung werden wir als stärkere Macht daraus hervorgehen."
SIA_forced_out_of_neutrality_r56_tt:	" §Y[JAP.GetNameDefCap]§! hat unsere Neutralität verletzt, während er sich für einen verhandelten Frieden offen gezeigt hat."
SIA_limit_wartime_activity_r56:	"Kriegsaktivitäten einschränken"
SIA_limit_wartime_activity_r56_desc:	"Eine massive Beteiligung an diesem Krieg liegt nicht in unserem nationalen Interesse. Wir sollten versuchen, uns von diesem Konflikt zu distanzieren."
SIA_focus_on_domestic_stability_r56:	"Fokus auf innenpolitische Stabilität"
SIA_focus_on_domestic_stability_r56_desc:	" Eine massive Beteiligung an diesem Krieg liegt nicht in unserem nationalen Interesse. Wir sollten versuchen, uns von diesem Konflikt zu distanzieren."
SIA_flexible_wartime_policies_r56:	"Flexible Kriegspolitik"
SIA_flexible_wartime_policies_r56_desc:	"[SIA.GetNameDefCap] ist eine Nation, deren Außenpolitik auf dem gleichzeitigen Zusammenspiel vieler Mächte beruht. Da der Krieg Asien verwüstet, müssen wir selbst unsere Verbündeten genau beobachten; welche Seite diesen Krieg auch immer verliert, sie muss unser Feind sein."
siam_r56.22.t:	"Eine neue Richtung für die Nation"
siam_r56.22.desc:	"Die Unzufriedenheit mit unseren Kriegsanstrengungen wächst von Tag zu Tag und beginnt, Phibuns Popularität in der gesamten [ROOT.GetAdjective] Gesellschaft zu schmälern.\n\nWir müssen uns zwei entscheidende Fragen stellen: Ist es [SIA.GetNameDef], bis zum bitteren Ende zu kämpfen, und wenn ja, unter wessen Führung wird dies geschehen?"
unlocks_decision_abandon_the_war_effort_which_grants_tt:	"Schaltet Entscheidung frei: §YKriegsanstrengungen aufgeben§!, was Folgendes gewährt:"
SIA_abandon_the_war_effort_r56:	"Die Kriegsanstrengungen aufgeben"
SIA_abandon_the_war_effort_r56_desc:	"Die Zeit ist gekommen: Dieser Krieg liegt nicht mehr in unserem Interesse. Wir müssen versuchen, ihn so schnell wie möglich zu beenden, zum Wohle des [SIA.GetAdjective] Volkes und der Nation."
siam_r56.23.title:	"[FROM.GetNameDefCap] Bittet um Frieden"
siam_r56.23.desc:	"Heute, nach ihrer "Partnerschaft" mit unserem [JAP.GetAdjective] Feind, haben Diplomaten ihrer Nation mit Rückendeckung des Premierministers, uns offiziell eine bedingte Kapitulation angeboten.\n\nWenn wir zustimmen, werden sie erneut in den Krieg eintreten, diesmal auf unserer Seite, bis zum Ende; gleichzeitig bleiben sie ein Verbündeter in Asien, um bei der Durchsetzung einer Nachkriegsordnung zu helfen. \n\nSollten wir den Friedensversuch von [SIA.GetNameDefCap] gegenüber unserer Nation annehmen?"
siam_r56.23.b:	"Da kommen Sie nicht mit Ausreden davon."
siam_r56.24.title:	"[FROM.GetNameDefCap] nimmt unser Friedensangebot an"
siam_r56.24.desc:	"Heute haben wir eine Antwort von [FROM.GetNameDef] erhalten, in der es heißt, dass wir den Wunsch nach Frieden zwischen unseren Nationen teilen. Mit der Unterstützung unserer neuen, rechtschaffenen Verbündeten werden wir gemeinsam unsere gemeinsamen Feinde vernichten!"
siam_r56.24.a:	"Mögen die kommenden Monate unserer Nation wohlgesonnen sein ..."
siam_r56.25.title:	"[FROM.GetNameDefCap] Lehnt ein Friedensangebot ab"
siam_r56.25.desc:	"Leider haben wir eine Antwort von [FROM.GetNameDef] erhalten, in der sie ihre Weigerung bekunden, Frieden zwischen unseren Nationen zu schließen. Wir werden vorerst weiterkämpfen."
siam_r56.25.a:	"Unsere Lage hat sich gerade von schlecht zu deutlich schlechter verschlechtert ..."
siam_r56.22.a:	"Eine gemäßigtere Kraft wäre … hilfreich für das, was noch kommen wird."
siam_r56.22.a_tt:	" Die Ernennung von §YKhuang Aphaiwong§! wird von ausländischen Mächten als Distanzierung von §Y[JAP.GetNameDef]§! angesehen werden, wodurch ein Angebot für §YFrieden§! §Gwahrscheinlicher§!, dass es gelingt."
siam_r56.22.b:	"Wir müssen Phibuns Autorität stärken! Er weiß, was das Beste für uns ist [SIA.GetAdjective]!"
unlocks_decision_expand_our_commitment_to_the_war_effort_which_grants_tt:	"Entscheidung freischalten: §YUnser Engagement für die Kriegsanstrengungen ausweiten§!, was Folgendes gewährt:"
SIA_expand_our_commitment_to_the_war_effort_r56:	"Unser Engagement für die Kriegsanstrengungen ausweiten"
SIA_expand_our_commitment_to_the_war_effort_r56_desc:	"Zwar war unser Engagement im Krieg bisher gering, doch wendet sich derzeit das Blatt. Wenn wir ein gerechtes Ergebnis dieses Konflikts anstreben, müssen wir unsere Nation bei den kommenden Siegen an die Spitze bringen!"
disables_decision_SIA_abandon_the_war_effort_r56_tt:	" §RDeaktiviert§! Entscheidung §YDie Kriegsanstrengungen aufgeben§!"
completes_focus_prove_thailands_worth_which_grants_tt:	"Schließt Fokus ab §YThailands Wert beweisen§!, was Folgendes gewährt:"
SIA_end_foreign_subversion_r56:	"Beendigung ausländischer Subversion"
SIA_end_foreign_subversion_r56_desc:	"Angesichts der drohenden Kriegsgefahr müssen wir alle möglichen Maßnahmen ergreifen, um jegliche ersten Anzeichen unzulässiger "ausländischer" Einflussnahme in unserem Land im Keim zu ersticken. Unser Land ist das Geburtsrecht des [SIA.GetAdjective] Volkes, es darf niemals untergehen!"
SIA_ensure_wartime_stability_r56:	"Sicherung der Stabilität in Kriegszeiten"
SIA_ensure_wartime_stability_r56_desc:	"Die internationale Krise hat zwar ein Gefühl der Einheit in unserem Land hervorgerufen, doch hat sie auch Tür und Tor für Chaos und Unsicherheit geöffnet. Wir müssen diese Tendenzen umkehren, bevor weitreichende Unruhen unsere Fähigkeit beeinträchtigen, effektiv zu kämpfen."
SIA_united_modernization_front_r56:	"Vereinigte Modernisierungsfront"
SIA_united_modernization_front_r56_desc:	"Obwohl sie weitgehend unter der Kontrolle der Streitkräfte stehen, umfasst die Khana Ratsadon den Großteil der zivilen und militärischen Modernisierungsbefürworter des Landes, die darauf hinarbeiten, [SIA.GetNameDef] als gleichberechtigten Partner unter den westlichen Nationen zu etablieren. "
SIA_prove_thailands_worth_r56:	"Thailands Wert unter Beweis stellen"
SIA_prove_thailands_worth_r56_desc:	"Erneut steht uns eine Krise bevor, und wir haben die Chance erhalten, die Schrecken der Gegenwart in eine Chance für unsere Nation zu verwandeln. Wir werden die Leidenschaft unseres neuen Reiches unter Beweis stellen und uns einen festen Platz in unserer neuen asiatischen Ordnung sichern!"
SIA_everything_for_victory_r56:	"Alles für den Sieg"
SIA_everything_for_victory_r56_desc:	"Ob wir nun hier sein wollten oder nicht, wir haben uns den Kriegsanstrengungen verschrieben. Wenn wir als starke Nation gelten wollen, die in der Lage ist, ihren Willen durchzusetzen, müssen wir diesen Konflikt mit der unnachgiebigen Entschlossenheit angehen, die uns einst zu Größe geführt hat. Ein großes [SIA.GetAdjective] Königreich liegt jenseits dieses Blutvergießens; alles, was wir tun müssen, ist durchzuhalten und weiter für die Freiheit aller thailändischen Menschen zu kämpfen!"
SIA_military_first_policies_r56:	"Militär-zuerst-Politik"
SIA_military_first_policies_r56_desc:	"Die Politiker und Bürokraten unserer Nation sind die Ersten, die fliehen, und die Letzten, die im Namen unseres Vaterlandes standhalten. Die Bedürfnisse des Militärs sollten daher Vorrang vor diesen Narren haben, sollten wir das durchstehen, was auf uns zukommt."
unlocks_decision_requisition_rice_for_military_use_which_grants_tt:	"Entscheidung freischalten: §YReis für militärische Zwecke requirieren§!, was Folgendes gewährt:\n§YFür 140 Tage:§!\nFabrikproduktion: §G+10, 00 %§!\nWerftproduktion: §G+10,00§!\n\n "
SIA_requisition_rice_for_military_use_r56:	"Reis für militärische Zwecke requirieren"
SIA_requisition_rice_for_military_use_r56_desc:	"Auch wenn dies eine gewisse Verachtung hervorrufen wird, würde unser Militär erheblich von einem Teil unserer reichlichen Reisreserven profitieren."
unlocks_decision_nationalize_foreign_industries_which_grants_tt:	"Entscheidung freischalten: §Y"Ausländische" Industrien verstaatlichen§!, was Folgendes gewährt:"
SIA_nationalize_foreign_industries_r56:	""Ausländische" Industrien verstaatlichen"
SIA_nationalize_foreign_industries_r56_desc:	"Wir können niemals hoffen, unsere eigene Nation zu kontrollieren, wenn Personen und Nationen, denen es an höchster Loyalität mangelt, Einfluss auf unsere wichtigsten Sektoren ausüben. Wir müssen den Schaden beheben, den der Internationalismus uns zugefügt hat."
unlocks_decision_lease_foreign_repair_capacity_which_grants_r56_tt:	"Entscheidung freischalten: §YAusländische Reparaturkapazität mieten§!, was Folgendes gewährt:\n§YFür 70 Tage:§!\nZivile Fabriknutzung: §R1§!\nWerften außerhalb der Karte: §G+2§!\nSchiffsreparaturgeschwindigkeit: §G+25 %§!"
SIA_lease_foreign_repair_capacity_r56:	"Ausländische Reparaturkapazitäten anmieten"
SIA_lease_foreign_repair_capacity_r56_desc:	"Als Nation, der es an ausreichender Industrie für diese Aufgabe mangelt, sollten wir uns an unsere wirtschaftlich stärkeren Nachbarn wenden, um unsere Flotte warten zu lassen."
upon_the_completion_of_focus_phahon_steps_down_r56_tt:	"Nach Abschluss des Fokus: §YPhahon tritt zurück§!:"
unlocks_decisions_to_join_factions_in_the_region_r56_tt:	"Schaltet Entscheidungen frei, um §YFraktionen§! in der Region beizutreten."
unlocks_decisions_to_invite_neighbors_to_our_faction_r56_tt:	"Schaltet Entscheidungen frei, um §YNachbarn§! in unsere Fraktion einzuladen."
