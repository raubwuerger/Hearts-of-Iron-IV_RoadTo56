SWA_sobhuza_ii:0	"Sobhuza II."
SWA_sobhuza_ii_desc:0	"Nkhotfotjeni Mona war der einzige Sohn von König Ngwane V. Er wurde 1899 im Dorf Zombodze geboren. Er verlor seinen Vater in einem sehr jungen Alter. Nach dem unerwarteten Tod seines Vaters machte der königliche Rat Nkhotfotjeni im Alter von nur 4 Monaten zum König von Swasiland, und als Auszeichnung erhielt Nkhotfotjeni den Namen Sobhuza II. \n\nAufgrund von Sobhuzas jungem Alter übernahmen seine nahen Verwandten die Rolle der Regenten, bis er Ende 1921 volljährig wurde. Zu diesem Zeitpunkt übertrugen seine Verwandten ihre Macht auf ihn, was offiziell den Beginn von Sobhuzas Herrschaft über Swasiland markierte. \n\nSobhuza und eine Delegation swasiländischer Staatsangehöriger baten König Georg IV. gleich zu Beginn seiner Herrschaft darum, die früheren, an die Briten verlorenen swasiländischen Gebiete dem Königreich Swasiland zurückzugeben. Zwar behielten die Briten die Kontrolle über die Gebiete, doch verschaffte ihm diese selbstbewusste Haltung Unterstützung in seiner Heimat. Auch interne Veränderungen waren zu beobachten und zu spüren. Da Sobhuza weiß, dass die Kolonialherrschaft in Swasiland irgendwann zu Ende gehen wird, hat er sein Volk durch Bildungsmaßnahmen darauf vorbereitet, dass die Bevölkerung bereit ist, die Verantwortung für die Pflege und Führung des Landes zu übernehmen. \n\nDa die weltweiten Spannungen weiter zunehmen, versucht Sobhuza, Swasiland durch eine auf Blockfreiheit ausgerichtete Diplomatie neutral zu halten und nicht in Konflikte außerhalb seiner Grenzen zu verwickeln."
