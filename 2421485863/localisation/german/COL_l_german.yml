COL_affirm_state_role_in_the_economy:0			"Die wirtschaftliche Rolle des Staates bekräftigen"
COL_affirm_state_role_in_the_economy_desc:0			"Viele Wirtschaftswissenschaftler, insbesondere John Maynard Keynes, vertreten die Theorie, dass der Staat in die Wirtschaft eingreifen muss, um sicherzustellen, dass sie für die Menschen gerecht bleibt."
COL_continue_constitutional_reforms:0			"Fortsetzung der Verfassungsreformen"
COL_continue_constitutional_reforms_desc:0			"Mit der Verfassungsreform wurde die Definition von Eigentum durch seine soziale Funktion festgelegt. Zu den bekanntesten Auswirkungen dieser neuen Regelung gehört das Recht des Staates, nach dem Grundsatz der Gemeinnützigkeit Land zu enteignen, insbesondere in den ausgedehnten brachliegenden Gebieten der Grundbesitzer."
COL_workers_protection:0			"Stärkung der Arbeitnehmerinnen und Arbeitnehmer"
COL_workers_protection_desc:0			"Um den Schutz der Arbeitnehmer zu gewährleisten, müssen wir das Streikrecht verteidigen und die Arbeitnehmer ermutigen, sich in Gewerkschaften zu organisieren."
COL_educational_reform:0			"Bildungsreform"
COL_educational_reform_desc:0			"Vor allem auf Initiative des Schriftstellers und Bildungsministers Jorge Zalamea wurden zahlreiche Reformen zur Verbesserung des Zugangs zur Bildung auf den Weg gebracht."
COL_join_the_allies:0			"Schließen Sie sich den Alliierten an"
COL_join_the_allies_desc:0			"Unser Platz ist bei [ENG.GetNameDef], dem Hüter von Liberalismus, Demokratie und Freiheit in diesen turbulenten Zeiten."
COL_liberty_ethos:0			"Die marschierende Revolution"
COL_liberty_ethos_desc:0			"Alfonso López Pumarejo führte zahlreiche wirtschaftliche und soziale Reformen durch, die den Spitznamen Revolución en Marcha (Marschierende Revolution) tragen."
 ### ""

COL_agrarian_economy:0			"Agrarwirtschaft"
COL_agrarian_economy_desc:0			"Die kolumbianische Wirtschaft ist tief in der Landwirtschaft verwurzelt, wobei die Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht das Land jedoch anfällig für globale Preisschwankungen, und der Reichtum konzentriert sich nach wie vor auf die ländlichen Eliten. Im fruchtbaren Hochland gibt es zwar viele Plantagen, doch der Mangel an industrieller Infrastruktur behindert unsere Fähigkeit zur Modernisierung. Die Investitionen in die heimische Produktion sind begrenzt, da ein Großteil der Arbeitskräfte des Landes auf den Feldern gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Setzen wir auf unsere agrarischen Stärken oder gehen wir den schwierigen Weg der Industrialisierung?"
COL_coffee_dependent_economy:0			"Von Kaffee abhängige Wirtschaft"
COL_coffee_dependent_economy_desc:0			"Die kolumbianische Wirtschaft ist tief in der Landwirtschaft verwurzelt, wobei die Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht das Land jedoch anfällig für globale Preisschwankungen, und der Reichtum konzentriert sich nach wie vor auf die ländlichen Eliten. Im fruchtbaren Hochland gibt es zwar viele Plantagen, doch der Mangel an industrieller Infrastruktur behindert unsere Fähigkeit zur Modernisierung. Die Investitionen in die heimische Produktion sind begrenzt, da ein Großteil der Arbeitskräfte des Landes auf den Feldern gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Setzen wir auf unsere agrarischen Stärken oder gehen wir den schwierigen Weg der Industrialisierung?"
COL_coffee_dependent_economy_2:0			"Von Kaffee abhängige Wirtschaft"
COL_coffee_dependent_economy_2_desc:0			"Die kolumbianische Wirtschaft ist tief in der Landwirtschaft verwurzelt, wobei die Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht das Land jedoch anfällig für globale Preisschwankungen, und der Reichtum konzentriert sich nach wie vor auf die ländlichen Eliten. Im fruchtbaren Hochland gibt es zwar viele Plantagen, doch der Mangel an industrieller Infrastruktur behindert unsere Fähigkeit zur Modernisierung. Die Investitionen in die heimische Produktion sind begrenzt, da ein Großteil der Arbeitskräfte des Landes auf den Feldern gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Setzen wir auf unsere agrarischen Stärken oder gehen wir den schwierigen Weg der Industrialisierung?"
