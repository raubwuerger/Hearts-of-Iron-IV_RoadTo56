 COL_tupac_amaru:0 "Etnocacerismo Erreicht"
 COL_yarumos_idea:0 "Yarumos"
 COL_yarumos_idea_desc:0 "Mit der Asche des Yarumo-Baums kann unser Land besser mit der rauen Umgebung umgehen."
 COL_support_focus:0 "Produktionsunterstützung"
 COL_support_focus_desc:0 "Unterstützung für alle."
 COL_simacota_idea:0 "Rache erfüllt"
 COL_simacota_idea_desc:0 "Jetzt, da wir zurückerobert haben, was uns gehört, ist es an der Zeit, es zu verteidigen."
 COL_CAS_focus:0 "CAS-Produktion"
 COL_CAS_focus_desc:0 "CAS für alle."
