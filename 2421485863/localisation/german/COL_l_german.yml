 colombia.1.t:0 "Training im Dschungel"
 colombia.1.d:0 "Das heiße äquatoriale Klima der Amazonas-Regenwälder im Süden unseres Landes sowie das Dschungelgelände in den Küstenprovinzen westlich von Cartagena schaffen raue Bedingungen für die Bevölkerung und erweisen sich als schwerwiegendes Hindernis für unsere Truppen in der Region, insbesondere in Bezug auf Ausbildung und militärische Leistung. Ein paar Budgetkürzungen ermöglichen es uns, unsere Ausbildungseinrichtungen in Dschungelgebieten zu erweitern und die neu eingestellten Kommandeure der Militärakademie auf ihre jeweiligen Posten zu ernennen, für die sie ausdrücklich ausgebildet wurden. Der Dschungel von [COL.GetNameDef] soll zu unserem Kampfgebiet werden, in dem unsere Armee zusammen mit Guerillakämpfern den überlegenen Feind abwehren kann."
 colombia.1.a:0 "Schafft die Grundlagen für diese Trainingslager."
 colombia.2.t:0 "Wiederaufbau von Großkolumbien!"
 colombia.2.d:0 "Die jüngsten Veränderungen in der Regierungsstruktur von [COL.GetNameDef] haben bei unseren Beamten in Caracas und unseren Botschaftern in Bogota viele beunruhigende Fragen zu ihren Absichten und Plänen aufgeworfen. Heute Morgen hat die Regierung von [VEN.GetLeader] ein offizielles Gesuch für die Wiederaufnahme der [VEN.GetAdjektiv]-[ COL.GetAdjektiv] unter der Führung des Letzteren, um das verlorene Erbe von Großkolumbien wiederherzustellen.Die [COL.GetAdjektiv]-Beamten erklären, dass die [VEN.GetAdjektiv]-Regierung bei Einhaltung der Vereinbarung effizient in den Staatsapparat integriert und im Parlament angemessen vertreten sein wird. Sollten wir diese Geste der Unterstützung ablehnen, drohen uns [COL.GetAdjektiv]-Diplomaten, dass ihr Militär bereit sei, unsere Grenze zu überschreiten."
 colombia.2.a:0 "Was sollen wir tun?"
 colombia.2.b:0 "Lasst uns für das Allgemeinwohl zusammenstehen."
 colombia.3.t:0 "Wir wollen unsere Unabhängigkeit bewahren."
 colombia.3.d:0 "Hermano Bolivariano"
 colombia.3.a:0 "Der gestellte Antrag auf Integration sollte heute um 18:00 Uhr ablaufen. Glücklicherweise erhielten wir zehn Stunden vor Ablauf des Ultimatums eine offizielle Antwort von der Regierung von [VEN.GetLeader]. n\nIn dem Telegramm von [VEN.GetNameDef] hieß es: "Der wachsende Einfluss der [USA.GetNameDef] in Südamerika beunruhigt auch die [VEN.GetAdjektiv]-Regierung und ihre Beamten. Nur ein starker, geeinter Staat wie Gran Colombia kann mit dem schlafenden Riesen im Norden konkurrieren.""
 colombia.4.t:0 "Nach einem Jahrhundert haben unsere [VEN.GetAdjektiv]-Brüder dies freudig akzeptiert und sind wieder Teil der Nation Gran Colombia geworden."
 colombia.4.d:0 "Hermanos, willkommen in Gran Colombia!"
 colombia.4.a:0 "Die Invasion von [VEN.GetNameDef]"
 colombia.6.t:0 "Der gestellte Antrag auf Integration sollte heute um 18:00 Uhr ablaufen. Da wir keine offizielle Antwort von den [VEN.GetAdjektiv]-Beamten erhalten haben, können wir davon ausgehen, dass ihre schwache Regierung versucht, Zeit zu schinden, um mehr Streitkräfte zu mobilisieren.Unsere Späher und Aufklärungseinheiten berichten von verstärkter Aktivität der [VEN.GetAdjektiv]-Truppen an unserer Grenze. Sie bereiten ihre Verteidigung vor und mobilisieren Reserven. Auch wenn noch nicht alle unsere Soldaten in Stellung sind, werden wir jetzt zuschlagen, wenn der Feind es am wenigsten erwartet. Zu den Waffen, Volk von [COL.GetNameDef]! Die Zeit ist gekommen, die verlorenen Gebiete von Gran Colombia zurückzuerobern!"
 colombia.6.d:0 "Vorwärts!"
 colombia.6.a:0 "Panama zurückerobert"
 colombia.11.t:0 "Wir sind das Land, das wir kennen"
 colombia.11.d:0 "Gerade noch rechtzeitig"
 colombia.11.a:0 "Neue Amphibieneinheit gegründet"
 colombia11_tt:0 "Jüngste Forschungs- und Entwicklungsarbeiten an Unterstützungsausrüstung haben unser wissenschaftliches Team zu einer brillanten Idee inspiriert, Gelder für die Einrichtung einer neuen, modernen Militäreinheit zu sammeln, die aus amphibischen Infanteriebataillonen besteht, die von Artillerie-, Pionier-, Aufklärungs- und Feldlazarettteams unterstützt werden. Die Ausbildung einer solchen Spezialeinheit wird viel mehr Zeit und Aufwand erfordern als die eines regulären Infanterieregiments. Dennoch wird erwartet, dass sie bei amphibischen Operationen hervorragende Leistungen erbringt und sich auch in feuchten Umgebungen gut bewährt."
 colombia.12.t:0 "Fügen Sie den dokumentierten Vorschlag unserem Streitkräfteverzeichnis hinzu."
 colombia.12.d:0 "Wir erhalten eine Vorlage für Elitesoldaten der Marine namens "YInfantes de Marina"!"
 colombia.12.a:0 "Generäle unterstützen Idee für neue Fallschirmjägereinheit"
 colombia12_tt:0 "Die enge Zusammenarbeit zwischen unserer Forschungs- und Entwicklungsabteilung und dem Generalstab hat zu einem Vorschlag geführt, eine Spezialeinheit zu gründen, die in der Lage ist, hinter der feindlichen Frontlinie aus der Luft abzuspringen und in den feindlichen Stützpunkten zu operieren. Die Fallschirmjäger-Technologie könnte sich als Trumpf in unseren Händen erweisen, wenn wir die Lufthoheit in der Region erlangen. Zu den weiteren Verbesserungen gehören die Ausbildung spezialisierter Ingenieure, Bordwaffen und ein besonders leichtes Funkregiment, das in der Lage ist, feindliche Funkfrequenzen für die Kommunikation unserer gelandeten Truppen zu nutzen, ohne vom Feind entdeckt zu werden."
 colombia.13.t:0 "Fügen Sie ein Portfolio dieser Einheit zur Verwendung durch unsere Streitkräfte hinzu."
 colombia.13.d:0 "Wir erhalten eine Fallschirmjäger-Vorlage "Y. Unitad Condor" mit fünf Fallschirmjäger-Regimentern und mehreren Unterstützungskompanien."
 colombia.13.a:0 "Vorschlag zur Militärpolizei"
 colombia13_tt:0 "Jede offene Rebellion oder Protestaktion, die von der radikalen Opposition und terroristischen Kämpfern durchgeführt wird, darf nicht ungestraft bleiben. Die Regierung muss die Kontrolle über das Land behalten, solange sie dem Willen des Volkes folgt."

 colombia.1001.t:0 "Diese Einheit wird aus fünf Kavallerieeinheiten mit spezialisierten Ausbildern bestehen, die speziell für den Umgang mit Widerstand ausgebildet sind."
 colombia.1001.d:0 "Wir werden sofort mit der Ausbildung des Personals beginnen!"
 colombia.1001.a:0 "Die Militärpolizeivorlage "§YPolicia Militar§!" mit fünf Kavallerieeinheiten und einem Militärpolizeiregiment zur Unterstützung ist jetzt verfügbar."
 guacamaya:0 ""
 ararauna:0 "Neuer Verteidigungsbündnis gegründet"
 titi:0 "Angesichts der wachsenden Ambitionen Gran Kolumbiens der [COL.getAdjektiv]-Regierung haben besorgte Beamte von [ECU.getNameDef] und [PAN.getNameDef] heftige Verhandlungen aufgenommen, die sich auf die Bildung eines Verteidigungsbündnisses gegen den Aufstieg des mehr als toten Staates Gran Colombia konzentrieren."
 mico_titi_designer:0 "Beide Länder bringen Truppen an die Grenzen, bereit, bis zum letzten Mann für ihre Unabhängigkeit zu kämpfen."
 ara_aircraft_manufacturer:0 "Dies soll unsere Staaten für ein wenig länger sichern!"
