 COL_hermano_bolivariano:0 ""
 COL_hermano_bolivariano_desc:0 "Unser katholisches Erbe annehmen"
 COL_industrial_effort:0 "Wir müssen unser katholisches Erbe annehmen und gute Beziehungen zur Kirche sicherstellen."
 COL_industrial_effort_desc:0 "Die PCC legalisieren"
 COL_acerias_pdr:0 "Damit die Stimme der Arbeiter gehört wird, müssen wir die PCC legalisieren."
 COL_acerias_pdr_desc:0 "Los Hermanos Bolivarianos"
 COL_puerto_buenaventura:0 "Unsere bolivarische Vergangenheit ruft uns dazu auf, eine neue und starke Nation zu sein!"
 COL_puerto_buenaventura_desc:0 "Die Industrie stärken"
 COL_indumil:0 "Alle unsere politischen Bemühungen auf den Aufbau der zivilen Industrie in einem großen Sprung nach vorne konzentrieren."
 COL_indumil_desc:0 "Modernisierung der Acerías Paz del Río"
 COL_infrastructure_caribe:0 "Wir haben sowohl Kohle als auch Eisen. Mit ausländischen Investitionen können wir mehr Stahl produzieren."
 COL_infrastructure_caribe_desc:0 "Achse Buenaventura-Cali"
 COL_indumil_2:0 "Es ist an der Zeit, die fruchtbaren Ebenen des Valle del Cauca mit dem Tiefseehafen von Buenaventura zu verbinden."
 COL_indumil_2_desc:0 "Militärindustrie Kolumbiens"
 COL_fortify_caribe:0 "Durch die Gründung eines staatlichen Unternehmens, das für die Herstellung von Munition, Gewehren und Sprengstoffen zuständig ist, wird unsere Armee besser ausgerüstet."
 COL_fortify_caribe_desc:0 "Verbindung zum Atlantik"
 COL_fortify_caribe_aa:0 "Es können viele Anstrengungen unternommen werden, um den Fluss Magdalena mit Cartagena zu verbinden, den Hafen in Barranquilla zu verbessern und die wachsende Industrie in Medellín zu unterstützen."
 COL_fortify_caribe_aa_desc:0 "Ausbau der Militärindustrie"
 COL_infrastructure_harsh:0 "Die aktuelle Situation erfordert die Erweiterung unserer Waffenfähigkeiten, um den wachsenden Bedarf unserer Armee zu decken."
 COL_infrastructure_harsh_desc:0 "Befestigung der Karibikküste"
 COL_industry_effort_2:0 "Die Karibikküste ist der Ort, an dem wir am verwundbarsten sind, insbesondere gegenüber Invasionen auf dem Seeweg. Durch die Installation von Küstenbefestigungen können wir diese Risiken begrenzen."
 COL_industry_effort_2_desc:0 "Verteidigung des nördlichen Luftraums"
 COL_war_with_andeans:0 "Unsere Küste ist auch anfällig für potenzielle Luftangriffe. Wir sollten Flugabwehrbatterien aufstellen, um zusätzlichen Schutz zu gewährleisten."
 COL_war_with_andeans_desc:0 "Verbesserung der nationalen Infrastruktur"
 COL_etnocacerismo:0 "Viele Regionen von [COL.GetNameDef] sind immer noch schlecht angebunden. Durch umfangreiche Arbeiten und den Ausbau der Infrastruktur in diesen Gebieten können wir ihr wirtschaftliches Potenzial schließlich erweitern."
 COL_etnocacerismo_desc:0 "Anschaffung moderner Maschinen"
 COL_etnocacerismo_2:0 "In den letzten Jahren sind neue industrielle Techniken entstanden. Durch die Modernisierung unserer Ausrüstung können wir unser wirtschaftliches Potenzial verbessern."
 COL_etnocacerismo_2_desc:0 "Krieg mit den Andenbewohnern"
 COL_etnocacerismo_2_tt:0 "Es ist an der Zeit, [PRU.GetNameDef] davon zu überzeugen, sich unserer großen Sache anzuschließen. Die Anden sind schwer zu bewältigen. Die neue Condor-Division der Fallschirmjäger wird bei der Kampagne helfen."
 COL_altillanura_ress:0 "Folgt den Etnocaceristas"
 COL_altillanura_ress_desc:0 "Unsere Rückeroberung von Gran Colombia hat sich nun zu einem echten Kreuzzug zur Vereinigung der Völker der Anden entwickelt!"
 COL_gran_colombia:0 "Etnocacerismo Verwirklicht"
 COL_gran_colombia_desc:0 "Wir sind nun kurz davor, eine gewaltige, unzertrennliche Nation zu werden."
 COL_nuclear_effort:0 "§YEtnocacerismo§!"
 COL_nuclear_effort_desc:0 "Erforschen Sie Orinoquia"
 COL_extra_tech_slot:0 "Es ist an der Zeit, in die Region Orinoquia zu investieren, die Gummiproduktion zu verbessern und die Bauxitvorkommen abzubauen."
 COL_extra_tech_slot_desc:0 "Anspruch auf Gran Colombia"
 COL_extra_tech_slot_2:0 "Nur eine große Nation zu sein, ist eine Garantie, um die Bedrohungen in der Welt zu überleben."
 COL_extra_tech_slot_2_desc:0 "Nukleare Anstrengungen"
 COL_technology_sharing:0 "Da wir am Rande einer weltverändernden Entdeckung stehen, können wir nicht zulassen, dass andere das Feuer entfachen, das eines Tages die Erde verzehren könnte."
 COL_technology_sharing_desc:0 "Universitäten finanzieren"
 COL_secret_weapons:0 "Unsere industrielle Expansion und andere jüngste Fortschritte könnten es uns ermöglichen, mehr Forschung und Entwicklung parallel zu betreiben."
 COL_secret_weapons_desc:0 "Forschungszuschüsse"
 COL_political_effort:0 "Die rasche Industrialisierung unserer Nation hat neue Möglichkeiten in Forschung und Entwicklung eröffnet, die wir nutzen sollten."
 COL_political_effort_desc:0 "Technologieaustausch"
 COL_collectivist_ethos:0 "Durch den Austausch technologischer Fortschritte mit unseren Verbündeten wird unsere gesamte Fraktion die Forschung und Entwicklung im Krieg effizienter gestalten können."
 COL_collectivist_ethos_desc:0 "Geheimwaffen"
 COL_militarism:0 "Es ist verlockend, alle zusätzlichen Ressourcen in die Entwicklung von Panzern und Flugzeugen zu stecken, aber das Geheimnis, Kriege zu gewinnen, liegt in ganz neuen Bereichen der Wissenschaft: Elektronik, Raketentechnik und Nuklearforschung."
 COL_militarism_desc:0 "Kongress von Kolumbien"
 COL_political_correctness:0 "Um die Welt zu verändern, müssen wir unser eigenes Land verändern. Die Stärkung unserer politischen Position sollte an erster Stelle stehen."
 COL_political_correctness_desc:0 "López' Reformen ablehnen"
 COL_neutrality_focus:0 "Unsere Feinde mögen kleinere Nationen spalten und unterwerfen, aber unser Volk wird vereint stehen – alle für einen und einer für alle."
 COL_neutrality_focus_desc:0 "Den Staat militarisieren"
 COL_interventionism_focus:0 "Wer das Militär als notwendiges Übel betrachtet, ist dazu verdammt, angesichts eines Krieges zu zögern. Wir werden Militarismus in unserer Kultur verankern, um ein Volk von Soldaten zu werden."
 COL_interventionism_focus_desc:0 "Verstaatlichung der Industrie"
 COL_military_youth:0 "Um die Arbeiter von den kapitalistischen Ketten zu befreien, müssen wir damit beginnen, die Kontrolle über die Produktionsmittel zu übernehmen."
 COL_military_youth_desc:0 "Schwerpunkt Neutralität"
 COL_deterrence:0 "Während andere behaupten mögen, es erfordere Mut und Weisheit, in einem globalen Konflikt Partei zu ergreifen, wissen wir, dass es mehr erfordert, sich zu verweigern."
 COL_deterrence_desc:0 "Schwerpunkt Interventionismus"
 COL_volunteer_corps:0 "Wir schätzen die Freiheit aller Menschen, nicht nur unserer Bürger. Wenn die Verhinderung von Tyrannei Krieg bedeutet, dann soll es so sein."
 COL_volunteer_corps_desc:0 "Militärische Jugendorganisationen"
 COL_paramilitarism:0 "Organisationen zur Förderung der Disziplin und politischen Bildung junger Menschen in unserem Land werden früh Loyalität und Selbstaufopferung fördern."
 COL_paramilitarism_desc:0 "Abschreckung"
 COL_join_the_comintern:0 "Allein profitieren wir selten von einem Krieg. Glücklicherweise wissen wir, dass die beste Verteidigung so bekannt ist, dass man sie nie einsetzen muss."
 COL_join_the_comintern_desc:0 "Freiwilligenkorps"
 COL_soviet_technological_cooperation:0 "Unsere Leute zu zwingen, für die Ideale der Freiheit zu sterben, wäre eine Ironie, aber die Einrichtung von Mitteln für diejenigen, die Menschen im Ausland helfen wollen, ist es nicht."
 COL_soviet_technological_cooperation_desc:0 "Gründung der Juventud Leopardo"
 COL_indoctrination_focus:0 "Militärische Prinzipien lassen sich auch außerhalb des Militärs anwenden. Mehr Menschen werden eine militärische Ausbildung erhalten, wenn wir halbmilitarisierte Einheiten als Ergänzung zu unseren Streitkräften aufbauen."
 COL_indoctrination_focus_desc:0 "Beitritt zur Komintern"
 COL_foreign_expeditions:0 "Wir müssen unseren sozialistischen Kollegen auf der ganzen Welt helfen, den Kapitalismus zu besiegen. [SOV.GetNameDefCap] ist die führende Kraft in diesem Kampf; daher sollten wir zusammenstehen."
 COL_foreign_expeditions_desc:0 "[SOV.GetAdjektiv] Technologische Zusammenarbeit"
 COL_why_we_fight:0 "[SOV.GetNameDefCap] hat in der Wissenschaft große Fortschritte gemacht. Jetzt, da wir Seite an Seite kämpfen, können wir von ihrem Fachwissen profitieren."
 COL_why_we_fight_desc:0 "Einführung politischer Kommissare"
 COL_political_commissars:0 "Die Einführung politischer Kommissare in den Reihen der Armee wird es uns ermöglichen, unsere Truppen an die mutige Sache zu erinnern, für die wir kämpfen."
 COL_political_commissars_desc:0 "Auslandsexpeditionen"
 COL_internationalism_focus:0 "Da unsere Feinde bereit sind, sich im Namen ihrer Ideale in weit entfernte Konflikte einzumischen, müssen wir bereit sein, dasselbe für unsere Ideale zu tun."
 COL_internationalism_focus_desc:0 "Warum wir kämpfen"
 COL_nationalism_focus:0 "Die Welt wird immer unsicherer. Unser Volk muss die Gräueltaten sehen, die von denen begangen werden, die nach Macht streben. Wir werden das Volk für unsere Sache gewinnen und dafür sorgen, dass jeder bereit ist, für unsere Freiheit zu kämpfen."
 COL_nationalism_focus_desc:0 "Politische Kommissare"
 COL_ideological_fanaticism:0 "Um sicherzustellen, dass unsere Richtlinien in der militärischen Praxis befolgt werden, werden wir politisch ernannte Beamte in die militärischen Ränge aufnehmen."
 COL_ideological_fanaticism_desc:0 "La Revolución Popular"
 COL_mosquitos:0 "Ideologie kennt keine Grenzen. Eine andere Nation mag sich als souverän bezeichnen, aber unsere Überzeugungen stehen über solchen Ansprüchen."
 COL_mosquitos_desc:0 "Los Leopardos Coup"
 COL_axis_leanings_focus:0 "Unsere Nation ist einzigartig und unsere politischen Errungenschaften konnten nur hier erreicht werden. Wir müssen um jeden Preis dafür kämpfen."
 COL_axis_leanings_focus_desc:0 "Ideologischer Fanatismus"
 COL_axis_leanings_focus_2:0 "Unsere politisch etablierten Werte und Ziele sind es wert, dafür zu sterben, genauso wie jeder alte Glaube. Jeder Anhänger sollte bereit sein, sich dem Tod zu stellen, und diejenigen, die vom Weg abkommen, sollten besser bereit sein, sich dem Tod zu stellen."
 COL_axis_leanings_focus_2_desc:0 "Gran Colombia legitimieren"
 COL_axis_leanings_focus_3:0 "Da Panama, Ecuador und Venezuela unter unserer Kontrolle stehen, müssen wir damit beginnen, ihre Verwaltung in Gran Colombia zu integrieren."
 COL_axis_leanings_focus_3_desc:0 "Freundet euch mit den Deutschen an"
 COL_montana_effort:0 "Die Achse bringt einige technologische Vorteile mit sich."
 COL_montana_effort_desc:0 "[GER.GetAdjektiv] Ressourcenaustausch"
 COL_intensify_exports:0 "Mehr Technik auf Kosten einiger Exporte."
 COL_intensify_exports_desc:0 "Tretet der Achse bei"
 COL_explore_amazonia:0 "Wenn Kolumbiens Ambitionen in Stein gemeißelt sind, dann müssen wir uns der Achse anschließen und unseren Feinden ein Ende bereiten!"
 COL_explore_amazonia_desc:0 "Alta Montaña-Anstrengung"
 COL_minning:0 "Es ist Zeit, sich auf den Krieg in Los Andes vorzubereiten."
 COL_minning_desc:0 "Intensivierung unserer Exporte"
 COL_hidroelectrics:0 "Unsere Wirtschaft ist stark vom Export von Waren abhängig und wir haben beschlossen, dass dies der beste Weg zum wirtschaftlichen Erfolg ist. Daher müssen wir unseren Handel und unsere Exporte noch weiter intensivieren."
 COL_hidroelectrics_desc:0 "Nutzung des Amazonas"
 COL_coffe_growth:0 "Der Staat hat keine vollständige Kontrolle über die Gummiproduktion in Guaviarie. Es ist an der Zeit, unseren legitimen Staat in die Verantwortung zu nehmen. Außerdem können unsere Truppen einiges über das Überleben im Dschungel lernen."
 COL_coffe_growth_desc:0 "Großflächiger Bergbau"

 #threats# "Entwicklung der Wasserkraft"
 COL_war_with_andean_threat:0 "Die Geographie mit ihren steilen Bergen ist ideal für den Bau von Staudämmen. Jetzt, da unser Energiebedarf steigt."
 COL_aviation_effort:0 "Aufrechterhaltung der Kaffeeabhängigkeit"
 COL_aviation_effort_tt:0 "Kaffee ist einer unserer wichtigsten Exportartikel. Wir werden dafür sorgen, dass wir durch die Aushandlung neuer Handelsabkommen weiterhin mehr verkaufen."
 COL_aviation_effort_desc:0 ""
 COL_aviation_effort_2:0 ""
 COL_aviation_effort_2_desc:0 "Bolivarianische Ambitionen in den Anden"
 COL_CAS_effort:0 "Luftverkehrsbemühungen"
 COL_CAS_effort_desc:0 "Nicht genügend Bauplätze für Luftwaffenstützpunkte"
 COL_rocket_effort:0 "Nirgendwo ist der technologische Fortschritt so rasant wie in der Luftkriegsführung. Die Luftfahrt ist ein Bereich, den jede moderne Nation beherrschen muss."
 COL_rocket_effort_desc:0 "Luftfahrt F&E"
 COL_NAV_effort:0 "Weitere Fortschritte in der Luftfahrt werden notwendig sein, um unsere Luftwaffe gut mit anderen militärischen Bereichen zu integrieren."
 COL_NAV_effort_desc:0 "CAS-Bemühungen"
 COL_naval_effort:0 "Eine moderne Armee braucht Unterstützung durch Fahrzeuge am Boden und in der Luft."
 COL_naval_effort_tt:0 "Raketeneinsatz"
 COL_naval_effort_desc:0 "Raketen- und Düsentriebwerke ermöglichen nie dagewesene Geschwindigkeiten sowohl für Schiffe ohne Besatzung als auch für solche mit Besatzung. Mit diesen bahnbrechenden Technologien können wir den Feind überrumpeln."
 COL_doctrine_navy:0 "NAV-Anstrengungen"
 COL_doctrine_navy_desc:0 "So wie sich die neue Seekriegsführung unter der Wasseroberfläche abspielt, findet ein Teil davon in der Luft über den Gewässern statt."
 COL_naval_equipment:0 "Naval Effort"
 COL_naval_equipment_desc:0 "Nicht genug Bauplätze für Marinewerften"
 COL_navy_production:0 "Der Ausbau unserer Marine sollte unsere Priorität sein. Setzen Sie alle verfügbaren Ressourcen für neue Werften und die Erforschung von leichten Überwasserschiffen ein."
 COL_navy_production_desc:0 "Reform der Marinedoktrin"
 COL_submarine_effort:0 "Die Seekriegsführung hat sich seit Mitte des 19. Jahrhunderts ständig weiterentwickelt; wieder einmal sind wir im Rückstand und müssen den Rückstand gegenüber dem Rest der Welt aufholen."
 COL_submarine_effort_desc:0 "Ausrüstung der Marine"
 COL_heavy_cruisers:0 "Um die Marine für die Bedrohungen unserer Zeit fit zu machen, müssen wir die Ausrüstung unserer Marine verbessern."
 COL_heavy_cruisers_desc:0 "Priorisieren Sie den Ausbau der Marine"
 COL_cruiser_effort:0 "Unsere Produktionskapazitäten sind begrenzt. Es ist an der Zeit, sich zwischen Luft und Wasser zu entscheiden."
 COL_cruiser_effort_desc:0 "U-Boot-Einsatz"
 COL_mobile_effort:0 "Die U-Boot-Kriegsführung ist die aufregendste Entwicklung in der Marine seit der Erfindung des Torpedoboots. Wir tun gut daran, uns gegen U-Boote zu schützen und sie gegen feindliche Schiffe einzusetzen."
 COL_mobile_effort_desc:0 "Schwere Kreuzer im Einsatz"
 COL_carriers_effort:0 "Bevor wir in die fortgeschrittene Schlachtschiffforschung einsteigen, müssen die kleineren Kreuzer durch Großkampfschiffe ersetzt werden."
 COL_carriers_effort_desc:0 "Produktion von schweren Kreuzern"
 COL_armor_support:0 "U-Boote können geeignet sein, aber das eigentliche Problem sind die Großkampfschiffe."
 COL_armor_support_desc:0 "Mobiler Einsatz"
 COL_axis_leanings_focus:0 "Für U-Boote und Zerstörer."
 COL_axis_leanings_focus_desc:0 "Aufwand für Flugzeugträger"
 COL_axis_leanings_focus_2:0 "Die Nation mit den meisten Flugzeugträgern wird die Weltmeere beherrschen. Flugzeugträger stehen für die neue Überlegenheit der Seestreitkräfte."
 COL_axis_leanings_focus_2_desc:0 "Nachschub-Management"
 COL_montana_effort:0 "Lernen Sie einfach, sich nie zu sehr zu verausgaben. Ein Mangel an Nachschub kann tödlich sein."
 COL_montana_effort_desc:0 "Schließen Sie Freundschaft mit den faschistischen Mächten"
 COL_explore_amazonia:0 "Die Achsenmächte haben einige technologische Vorteile."
 COL_explore_amazonia_desc:0 "[[~GER.GetAdjektiv~]] Ressourcentausch"
 COL_minning:0 "Mehr Technologien auf Kosten einiger Exporte."
 COL_minning_desc:0 "Hochgebirge Anstrengung"
 COL_hidroelectrics:0 "Es ist an der Zeit, sich auf den Krieg in Los Andes vorzubereiten."
 COL_hidroelectrics_desc:0 "Erforschung des Amazonasgebiets"
 COL_coffe_growth:0 "Der Staat kontrolliert die Gummiproduktion in Guaviarie nicht vollständig. Es ist an der Zeit, dass unser legitimer Staat die Verantwortung übernimmt. Außerdem können unsere Truppen ein paar Dinge über das Überleben im Dschungel lernen."
 COL_coffe_growth_desc:0 "Groß angelegter Bergbau"

 #threats# "Wasserkraft"
 COL_war_with_andean_threat:0 "Die Geographie mit steilen Bergen ist ideal für den Bau von Staudämmen. Jetzt, wo unser Energiebedarf steigt."
