 COL_affirm_state_role_in_the_economy:0 "Bekräftigung der wirtschaftlichen Rolle des Staates"
 COL_affirm_state_role_in_the_economy_desc:0 "Viele Wirtschaftswissenschaftler, insbesondere John Maynard Keynes, unterstützen die Theorie, dass der Staat in die Wirtschaft eingreifen muss, um sicherzustellen, dass sie für die Menschen fair bleibt."
 COL_continue_constitutional_reforms:0 "Fortsetzung der Verfassungsreformen"
 COL_continue_constitutional_reforms_desc:0 "Die Verfassungsreform legte die Definition von Eigentum anhand seiner sozialen Funktion fest. Zu den bekanntesten Auswirkungen dieser neuen Regelung gehört das Recht des Staates, Land nach dem Prinzip der öffentlichen Nützlichkeit zu enteignen, insbesondere in den ausgedehnten brachliegenden Gebieten der Landbesitzer."
 COL_workers_protection:0 "Arbeitnehmer stärken"
 COL_workers_protection_desc:0 "Um sicherzustellen, dass Arbeitnehmer geschützt sind, müssen wir das Streikrecht verteidigen und Arbeitnehmer dazu ermutigen, sich in Gewerkschaften zu organisieren."
 COL_educational_reform:0 "Bildungsreform"
 COL_educational_reform_desc:0 "Vor allem auf Initiative des Schriftstellers Jorge Zalamea, seines Zeichens Bildungsminister, wurden zahlreiche Reformen zur Verbesserung des Zugangs zu Bildung eingeführt."
 COL_join_the_allies:0 "Schließe dich den Alliierten an"
 COL_join_the_allies_desc:0 "Unser Platz ist an der Seite von [ENG.GetNameDef], dem Hüter des Liberalismus, der Demokratie und der Freiheit in diesen turbulenten Zeiten."
 COL_liberty_ethos:0 "Die Marschierende Revolution"
 COL_liberty_ethos_desc:0 "Alfonso López Pumarejo leitete viele wirtschaftliche und soziale Reformen ein, die den Spitznamen "Revolución en Marcha" oder "Marschierende Revolution" erhielten."
 ### ""

 COL_agrarian_economy:0 "Agrarwirtschaft"
 COL_agrarian_economy_desc:0 "Die Wirtschaft Kolumbiens ist tief in der Landwirtschaft verwurzelt, wobei Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht uns jedoch anfällig für globale Preisschwankungen, und der Wohlstand konzentriert sich weiterhin auf die ländlichen Eliten. Während das fruchtbare Hochland von Plantagen übersät ist, behindert der Mangel an industrieller Infrastruktur unsere Fähigkeit zur Modernisierung. Investitionen in die heimische Fertigung sind begrenzt, da ein Großteil der Arbeitskräfte des Landes an die Felder gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Sollen wir unsere Stärken im Agrarsektor weiter ausbauen oder den schwierigen Weg der Industrialisierung einschlagen?"
 COL_coffee_dependent_economy:0 "Kaffeeabhängige Wirtschaft"
 COL_coffee_dependent_economy_desc:0 "Die Wirtschaft Kolumbiens ist tief in der Landwirtschaft verwurzelt, wobei Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht uns jedoch anfällig für globale Preisschwankungen, und der Wohlstand konzentriert sich weiterhin auf die ländlichen Eliten. Während das fruchtbare Hochland von Plantagen übersät ist, behindert der Mangel an industrieller Infrastruktur unsere Fähigkeit zur Modernisierung. Investitionen in die heimische Fertigung sind begrenzt, da ein Großteil der Arbeitskräfte des Landes auf den Feldern gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Sollen wir auf unsere landwirtschaftlichen Stärken setzen oder den schwierigen Weg der Industrialisierung einschlagen?"
 COL_coffee_dependent_economy_2:0 "Kaffeeabhängige Wirtschaft"
 COL_coffee_dependent_economy_2_desc:0 "Die Wirtschaft Kolumbiens ist tief in der Landwirtschaft verwurzelt, wobei Kaffeeplantagen unsere Exportmärkte dominieren und dringend benötigte Devisen einbringen. Diese Abhängigkeit von einer einzigen Kulturpflanze macht uns jedoch anfällig für globale Preisschwankungen, und der Wohlstand konzentriert sich weiterhin auf die ländlichen Eliten. Während das fruchtbare Hochland von Plantagen übersät ist, behindert der Mangel an industrieller Infrastruktur unsere Fähigkeit zur Modernisierung. Investitionen in die heimische Fertigung sind begrenzt, da ein Großteil der Arbeitskräfte des Landes an die Felder gebunden ist. Um eine stabile Zukunft zu sichern, müssen wir uns entscheiden: Sollen wir unsere Stärken im Agrarsektor weiter ausbauen oder den schwierigen Weg der Industrialisierung einschlagen?"
 COL_coffee_dependent_economy_3:0 "Halbautarke Wirtschaft"

 COL_workers_protection_idea:0 "Schutz der Arbeitnehmer"
 COL_revolution_on_the_march:0 "Revolution auf dem Vormarsch"
 COL_revolution_on_the_march_desc:0 "Der Wind des Wandels weht heftig über Kolumbien, während die Revolution auf dem Vormarsch von Präsident Alfonso López Pumarejo die Herzen der Nation bewegt. Radikale Elemente innerhalb der Gesellschaft fordern umfassende Veränderungen, angetrieben von Forderungen nach sozialer Gerechtigkeit, Arbeitsrechten und Wirtschaftsreformen. Doch nach Pumarejos Vision versprechen diese Ideale auch neue Möglichkeiten: Landumverteilung zur Förderung ländlicher Gemeinden, erweiterter Zugang zu Bildung und eine Stimme für Kolumbiens Arbeitskräfte. Mit zunehmender Spannung wächst auch die Hoffnung und es entsteht eine Ära sowohl tiefgreifender Risiken als auch grenzenlosen Potenzials."
 COL_political_correctness_idea:0 "Verstaatlichte Industrie"
 COL_militarism_idea:0 "Staatsmilitarismus"
 COL_paramilitarism_idea:0 "La Juventud Leopardo"
 COL_growing_political_resistance:0 "Wachsende politische Opposition"
 COL_growing_political_resistance_desc:0 "Nach Jahrzehnten konservativer Herrschaft sieht sich die neu gewählte liberale Regierung Kolumbiens zunehmendem Widerstand gegenüber, während sie versucht, eine Gesellschaft zu reformieren, die zwischen mächtigen Eliten und verarmten Arbeitern gespalten ist. Landreformen, Arbeitnehmerrechte und Bildungsinitiativen stellen den Status quo in Frage und lösen Empörung bei Landbesitzern, Geistlichen und politischen Rivalen aus. Streiks brechen sowohl auf dem Land als auch in den Städten aus, und linke Bewegungen gewinnen unter den Desillusionierten an Boden."
