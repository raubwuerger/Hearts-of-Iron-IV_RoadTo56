COL_workers_protection_idea:0			"Schutz der Arbeitskräfte"
COL_revolution_on_the_march:0			"Revolution im Anmarsch"
COL_revolution_on_the_march_desc:0			"Die Revolution auf dem Marsch" von Präsident Alfonso López Pumarejo erregt die Gemüter in Kolumbien, denn der Wind des Wandels weht heftig durch das Land. Radikale Elemente in der Gesellschaft fordern weitreichende Veränderungen, angetrieben von Forderungen nach sozialer Gerechtigkeit, Arbeitnehmerrechten und Wirtschaftsreformen. Doch unter Pumarejos Vision versprechen diese Ideale auch neue Möglichkeiten: Landumverteilung zur Förderung ländlicher Gemeinden, erweiterter Zugang zu Bildung und eine Stimme für die kolumbianische Arbeiterschaft. In dem Maße, in dem die Spannungen zunehmen, wächst auch die Hoffnung, und es entsteht eine Ära, die sowohl mit großen Risiken als auch mit grenzenlosem Potenzial verbunden ist.""
COL_political_correctness_idea:0			"Verstaatlichte Industrie"
COL_militarism_idea:0			"Staatlicher Militarismus"
COL_paramilitarism_idea:0			"La Juventud Leopardo"
COL_growing_political_resistance:0			"Wachsende politische Opposition"
COL_growing_political_resistance_desc:0			"Nach jahrzehntelanger konservativer Herrschaft sieht sich Kolumbiens neu gegründete liberale Regierung mit zunehmendem Widerstand konfrontiert, wenn sie versucht, eine Gesellschaft zu reformieren, die zwischen mächtigen Eliten und verarmten Arbeitern gespalten ist. Landreformen, Arbeitnehmerrechte und Bildungsinitiativen stellen den Status quo in Frage und lösen bei Grundbesitzern, Geistlichen und politischen Rivalen Empörung aus. Auf dem Land und in den Städten kommt es zu Streiks, und linke Bewegungen gewinnen unter den Desillusionierten an Boden."
