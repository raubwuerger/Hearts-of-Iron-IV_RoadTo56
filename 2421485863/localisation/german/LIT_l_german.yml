LIT_german_rail_tt:0			"§CTwo §!§YInfrastruktur§!§C wird zu §!§Yjedem Staat an der Grenze zu Deutschland hinzugefügt.§!"
LIT_op_mindaugas_tt:0			"§YDiese Entscheidung löst einen Grenzkrieg um [784.GetName]§! aus."
unify_baltics_lithuania_required_states_tt:0			"Besitzt alle §YLitauischen§! Staaten. (Mit Ausnahme von Memel und Wilno)"
unify_baltics_latvia_required_states_tt:0			"Besitzt alle §YLatvian§! Staaten."
unify_baltics_estonia_required_states_tt:0			"Besitzt alle §YEstonian§! Staaten."
form_gdl_ukraine_required_states_tt:0			"Kontrolliert alle §YUkrainischen§! Staaten innerhalb der Sowjetunion außer [199.GetName], [196.GetName], [200.GetName], [227.GetName] und [228.GetName]."
form_gdl_ukraine_cored_states_tt:0			"Gewinnt Kerne auf allen benötigten §YUkrainian§! Staaten."
LIT_disband_nationalist_union_tt:0			"Alle Sitze der §YNationalist Union§! werden an andere Parteien abgetreten, was die Unterstützung aller anderen Parteien ein wenig stärkt."
LIT_oust_key_smetonists_tt:0			"Die §YNationalist Union§! verliert einen Sitz an jede konkurrierende Partei, was die Unterstützung aller anderen Parteien ein wenig erhöht, auf Kosten der Unterstützung der §YNational Union§!."
LIT_kings_party_sd_tt:0			"Die §YSozialdemokraten§! kontrollieren weniger als 10 Sitze."
LIT_Aviation_Effort:0			"Erweitern Sie die [ROOT.GetName] Luftwaffe"
LIT_Aviation_Effort_desc:0			"Die [ROOT.GetAdjective] Luftwaffe kann, wenn sie richtig aufgebaut ist, eine starke Kraft sein, die in der Lage ist, jede angreifende Nation gegen uns zu vernichten. Wir sollten mit dem Bau von Luftwaffenstützpunkten beginnen und unsere Offiziere in der Bedienung dieser Flugmaschinen schulen."
LIT_Foreign_Design:0			"Fokus auf ausländische Designs"
LIT_Foreign_Design_desc:0			"Unsere industrielle Fähigkeit, eigene Flugzeuge zu entwickeln, ist erbärmlich begrenzt. Wir sollten versuchen, mit anderen verbündeten Nationen zusammenzuarbeiten, um unsere Flugzeugkapazitäten an deren Konstruktionen anzupassen."
LIT_Aircraft_England:0			"Studieren Sie britische Flugzeuge"
LIT_Aircraft_England_desc:0			"Einige britische Luftfahrtunternehmen sind mit stillschweigender Unterstützung der derzeitigen Regierung an uns herangetreten und haben uns angeboten, ihre neuesten Exportmodelle zu kaufen. Wir sollten auf ihr Angebot eingehen."
LIT_Aircraft_american:0			"Studieren Sie amerikanische Flugzeuge"
LIT_Aircraft_american_desc:0			"Einige amerikanische Unternehmen haben uns angeboten, uns einige Prototypen von leichten Kampfflugzeugen zu verkaufen. Wenn wir uns diese beschaffen und mit etwas Mühe ihre Blaupausen und Ersatzteilentwürfe erhalten, wird unsere Luftwaffe einen großen Schritt nach vorne machen."
LIT_Aircraft_Italian:0			"Studieren Sie italienische Flugzeuge"
LIT_Aircraft_Italian_desc:0			"Die italienischen Bomber gehören zu den besten der Welt. Eine Annäherung an die derzeitige Regierung Italiens wird es uns ermöglichen, ihre Flugzeugmodelle zu kaufen und zu studieren."
LIT_Aircraft_japanese:0			"Japanische Flugzeuge studieren"
LIT_Aircraft_japanese_desc:0			"Die überraschende Wendigkeit und Geschwindigkeit der japanischen Leichtflugzeuge muss von unseren Ingenieuren eingehend studiert werden."
LIT_Aircraft_Soviet:0			"Sowjetische Flugzeuge studieren"
LIT_Aircraft_Soviet_desc:0			"Was auch immer sie mit uns vorhaben, die Flugzeuge der [SOV.GetAdjective] haben eine hervorragende Bauqualität, die wir studieren und in unsere Entwürfe einbeziehen können."
LIT_Aircraft_German:0			"Deutsche Flugzeuge studieren"
LIT_Aircraft_German_desc:0			"Trotz einiger Meinungsverschiedenheiten mit der [GER.GetAdjective] Regierung sind ihre Flugzeuge robust und effektiv für ihren Zweck. Wir sollten versuchen, einige Konstruktionsspezifikationen zu erhalten und uns ihr Fachwissen über Flugzeuge zunutze zu machen."
LIT_Fighter_Competition:0			"Fighter-Wettbewerb"
LIT_Fighter_Competition_desc:0			"Die Ausrichtung einer Fighter Airshow zur Demonstration der Fähigkeiten moderner Flugzeuge wird es uns ermöglichen, einige der besten heute verfügbaren Flugzeuge auszuwählen und zu erwerben."
LIT_Fighter_Competition_EXPL:0			"Holen Sie sich einige Flugzeuge von Nationen, in denen Sie eine Flugzeugmission durchgeführt haben.\n"
LIT_Close_Air_Support:0			"Close Air Support Modifikationen"
LIT_Close_Air_Support_desc:0			"Da wir nun im Besitz ausländischer Kampfflugzeuglizenzen sind, können wir diese leicht modifizieren, um sie für die Luftnahunterstützung unserer Armee einzusetzen."
LIT_Bomber_Competition:0			"Bomber-Wettbewerb"
LIT_Bomber_Competition_desc:0			"Eine Flugschau aktueller Bomberflugzeuge wird unserer Luftwaffe auch die Möglichkeit geben, einige dieser Bomber zu erwerben."
LIT_German_Rocketry:0			"Deutsche Raketentechnik"
LIT_German_Rocketry_desc:0			"Durch einen Zufall sind wir in den Besitz einiger experimenteller Raketen von unserem freundlichen Nachbarn im Süden gelangt. Wir sollten sie studieren, bevor wir sie an die [GER.GetAdjective]s zurückgeben."
LIT_Shared_Air_Doctrine:0			"Nach dem Muster der ausländischen Luftdoktrin"
LIT_Shared_Air_Doctrine_desc:0			"Unsere moderne Luftwaffe wird ohne die entsprechenden Innovationen in der Luftkriegsdoktrin nur eine Kraft auf dem Papier sein. Einige der Piloten und Luftwaffenoffiziere haben einige vernünftige doktrinäre Änderungen an unserer derzeitigen Lufttaktik vorgeschlagen, die sich im Falle eines Krieges als nützlich erweisen können."
LIT_aircraft_design_cooperation:0			"Zusammenarbeit bei der Entwicklung von Flugzeugen"
LIT_aircraft_design_cooperation_desc:0			"Wir haben viel von unseren Verbündeten zu lernen, während sie auch viel von uns lernen können. Der gegenseitige Nutzen wird unsere Luftforschung noch näher zusammenbringen."
LIT_finish_marshalls_reforms:0			"Beenden Sie die Reformen von Marschall Raštikis"
LIT_finish_marshalls_reforms_desc:0			"Inmitten wachsender Spannungen in Europa können wir unsere Armee nicht unausgebildet und mit minderwertigen Offizieren verrotten lassen. Stasys Raštikis, ein vielversprechender, in Deutschland ausgebildeter Offizier, hat eine Reihe von Reformen vorgeschlagen, die unsere Armee auf eine weitere Expansion und eine effektivere Offiziersausbildung vorbereiten."
LIT_army_expansion:0			"Erweiterung der Armee"
LIT_army_expansion_desc:0			"Der Abschluss der Reformen hat es uns ermöglicht, mehr Truppen parallel auszubilden, und unsere Offiziere sind nun bereit, weitere Verbesserungen der Methoden und Taktiken im Kampf gegen den Feind zu erlernen und anzuwenden."
LIT_fortify_the_border:0			"Die Grenze befestigen"
LIT_fortify_the_border_desc:0			"Wir haben gemeinsame Grenzen mit einigen der unfreundlichsten Nachbarn. Der Aufbau von Verteidigungslinien wird eine ernsthafte Abschreckung gegen ihre zweifellos im Voraus geplanten Offensiven sein."
LIT_prepare_the_mobilization_plans:0			"Bereiten Sie die Mobilisierungspläne vor"
LIT_prepare_the_mobilization_plans_desc:0			"Eine vergrößerte Armee ist nutzlos, wenn sie sich nicht rechtzeitig zum Kampf gegen den Feind versammeln kann. Marschall Raštikis hat Ideen, wie wir die Mobilisierungszeit unserer Armee im Falle eines Krieges gegen [GER.GetName] und [POL.GetName] auf weniger als 48 Stunden reduzieren können."
LIT_doctrine_effort:0			"Änderung der Doktrin"
LIT_doctrine_effort_desc:0			"Moderne Waffen reichen nicht aus, um einen erfolgreichen Verteidigungskrieg zu führen. Wir müssen auch die entsprechenden Ideen entwickeln, wie wir sie auf dem Schlachtfeld einsetzen, um den Erfolg zu garantieren."
LIT_doctrine_effort_2:0			"Kriegssimulationen"
LIT_doctrine_effort_2_desc:0			"Kein Plan überlebt den ersten Kontakt mit dem Feind.'. Unsere Taktik muss in Friedenszeiten praktikabel sein, damit sie in Kriegszeiten effektiv ist."
LIT_expand_the_MAL:0			"Erweitern Sie die MAL"
LIT_expand_the_MAL_desc:0			"Die Militärakademie von Litauen ist der Ort, an dem unsere Offiziere ausgebildet werden, bevor sie in der Armee dienen. Die Pläne für ihre Erweiterung müssen beschleunigt werden, um unseren Bedürfnissen gerecht zu werden."
LIT_equipment_effort:0			"Modernisierung der Ausrüstung"
LIT_equipment_effort_desc:0			"Unsere Truppen kämpfen mit Waffen, die noch aus dem Krieg von 1918 stammen. Dieser traurige Zustand muss genau hier ein Ende haben, mit einem Programm zur Verbesserung der Infanteriewaffen und der Artillerie, um unsere Situation zu verbessern."
LIT_equipment_effort_2:0			"Moderne Artillerie"
LIT_equipment_effort_2_desc:0			"Bessere Artillerie führt zu größeren Schlachten, und mit ihr werden wir siegreich aus ihr hervorgehen."
LIT_army_modernization:0			"Die Armee modernisieren"
LIT_army_modernization_desc:0			"[LIT.GetAdjective] Armee wird eine rasche Erweiterung ihrer unterstützenden Einheiten erfahren, um die Durchhaltefähigkeit unserer Divisionen im Feld zu verbessern."
LIT_equipment_effort_3:0			"Prototypische Ausrüstung"
LIT_equipment_effort_3_desc:0			"Einige der Offiziere in den Artilleriebataillonen haben einige Verbesserungen und Innovationen für ihr Handwerkszeug vorgeschlagen. Die Umsetzung dieser Ideen in neuere Artilleriegeschütze wird uns sicherlich einen Vorteil gegenüber unseren Feinden verschaffen."
LIT_special_forces:0			"Spezialkräfte"
LIT_special_forces_desc:0			"Vielversprechende Offiziere innerhalb der Armee haben die Bildung von Einheiten vorgeschlagen, die in einem Terrain operieren können, das für andere Einheiten als unmöglich gilt. Wir sollten diese Einheiten bilden, um ihre Ideen zu testen."
LIT_establish_a_armor_corp:0			"Panzerkorps schaffen"
LIT_establish_a_armor_corp_desc:0			"Diese neuen gepanzerten Fahrzeuge, die Panzer genannt werden, haben weitreichende taktische Auswirkungen auf die Art und Weise, wie sie im Kampf eingesetzt werden sollten. Wir sollten das [Root.GetName] Armor Corps bilden, um seine Effektivität zu testen und in Zukunft bessere Modelle davon zu bauen."
LIT_signal_companies:0			"Signal-Kompanien"
LIT_signal_companies_desc:0			"Das Funkgerät ermöglicht es unserer Armee, in der Hitze des Gefechts Nachrichten über große Entfernungen zu senden. Die Bildung von Signalkompanien in der Armee wird die Reaktionszeit unserer Einheiten im Kampf erhöhen."
LIT_motorization_effort:0			"Schaffung eines motorisierten Korps"
LIT_motorization_effort_desc:0			"Die Bildung eines motorisierten Korps wird die Mobilität unserer Truppen erhöhen, so dass sie schneller reagieren und sich im ganzen Land bewegen können. Wir sollten diese spannende neue Entwicklung nicht ignorieren."
LIT_mechanization_effort:0			"Mechanisierte Korps schaffen"
LIT_mechanization_effort_desc:0			"Die Infanterie in Lastwagen kann auf dem Weg in die Schlacht erschossen werden. Wenn wir unsere Transporter mit Panzerung ausstatten, haben wir unterwegs und im Kampf mehr Freiheit."
LIT_field_hospitals:0			"Erweitern Sie die Feldsanitäter"
LIT_field_hospitals_desc:0			"Eine kleine Nation wie die unsere kann nicht so viele Verluste verkraften, wie andere größere Nationen. Wir sollten die Truppen mit einem engagierten Sanitätskorps ausstatten, das sie wieder gesund pflegt, nachdem sie beschossen wurden."
LIT_modern_logistics:0			"Moderne Logistik"
LIT_modern_logistics_desc:0			"Die Logistik ist die Lebensader der Armee. Ohne sie verdorren die Truppen an der Kampflinie ohne Nahrung und Munition, was ihre Effektivität mindert. Die Armee wird von oben bis unten die Kunst beherrschen, sich unter schwierigen Bedingungen zu versorgen."
LIT_revive_the_trade_sector:0			"Den Handelssektor wiederbeleben"
LIT_revive_the_trade_sector_desc:0			"Unser globaler Handel und unsere Exporte haben unserer Wirtschaft in früheren Zeiten immer zum Aufschwung verholfen. Wir sollten uns darauf konzentrieren, diesen lukrativen Handel zu stärken, damit es für andere Länder einfacher wird, mit uns im Baltikum Geschäfte zu machen."
LIT_develop_the_fledgling_industry:0			"Die flügge gewordene Industrie entwickeln"
LIT_develop_the_fledgling_industry_desc:0			"Unsere Industriemaschinen und Werkzeuge sind im Vergleich zu anderen Ländern eher klein. Unsere nächste Runde der industriellen Planung wird sich auf den Ausbau dieser Werkzeuge konzentrieren."
LIT_develop_coastal_regions:0			"Entwicklung der Küstenregionen"
LIT_develop_coastal_regions_desc:0			"Siaullai wird mit modernen Häfen und Infrastrukturen weiter ausgebaut, um unseren schnell wachsenden Handel mit den westlichen Ländern zu unterstützen."
LIT_develop_the_banks_holdings:0			"Entwicklung der Beteiligungen der Bank"
LIT_develop_the_banks_holdings_desc:0			"Unsere Nationalbank wird Eigentümerin der neuen Infrastruktur und der Werkzeugmaschinen sein, um das weitere Wirtschaftswachstum in unserem Land zu fördern."
LIT_lithuanian_industrial_boom:0			"Litauischer Industrie-Boom"
LIT_lithuanian_industrial_boom_desc:0			"Unsere jüngsten Investitionsprogramme und industriellen Planungen haben sich ausgezahlt! Ausländische Investoren und Unternehmer strömen in unser Land, um im Baltikum Geschäfte zu machen und Gewinne zu erzielen."
LIT_long_term_investments:0			"Langfristige Investitionen"
LIT_long_term_investments_desc:0			"Wir müssen die wankelmütigen ausländischen Investoren überreden, in unserem Land zu investieren, um die Infrastruktur und die Wirtschaft unseres Landes aufzubauen."
LIT_increase_commercialism:0			"Kommerzialisierung fördern"
LIT_increase_commercialism_desc:0			"Unser internationaler Handel hat unser Ansehen und unseren guten Ruf als das Land, mit dem man in den baltischen Staaten Geschäfte machen kann, verbessert."
LIT_control_the_exports:0			"Kontrolle der Exporte"
LIT_control_the_exports_desc:0			"Wir sollten unsere Exporte stärker kontrollieren und die weltweiten Preisveränderungen bei den von uns gehandelten Rohstoffen überwachen, damit wir besser gegen einen Preisverfall abgesichert sind, der unserem Handel schaden könnte."
LIT_increase_the_currency_value:0			"Den Wert des Litas erhöhen"
LIT_increase_the_currency_value_desc:0			"Der [LIT.GetAdjective] Litas ist heute eine der stärksten und stabilsten Währungen in Europa. Die Erhöhung seines Wertes wird uns helfen und uns einen Vorteil beim Abschluss von Geschäften mit anderen Ländern verschaffen."
LIT_prepare_the_military_industry:0			"Die Rüstungsindustrie vorbereiten"
LIT_prepare_the_military_industry_desc:0			"Der Bau von mehr Fabriken für die Materialproduktion ist für die Landesverteidigung unerlässlich."
LIT_prepare_the_nations_defences:0			"Die Verteidigung der Nation vorbereiten"
LIT_prepare_the_nations_defences_desc:0			"Die jüngsten politischen Umwälzungen um uns herum werden irgendwann auch auf uns zukommen. Wir werden bauen, und dann werden wir verteidigen. Lassen Sie sie kommen."
LIT_all_in:0			"§RAll In!§!"
LIT_all_in_desc:0			"Unsere gesamte Existenz steht jetzt auf dem Spiel. Jeder Mann, jede Frau und jedes Kind in [LIT.GetNameDef] muss Arbeit finden, und jede Fabrik im Land wird Waffen für die Nation produzieren."
LIT_unban_the_LSDP:0			"Die '26er-Koalition' wiederbeleben"
LIT_alliance_with_far_left:0			"Allianz mit der LKP"
LIT_politicize_the_lpm:0			"Politisieren Sie die LPJS"
LIT_collectived_agriculture:0			"Kollektivistische Wirtschaftsreformen"
LIT_crush_latvian_oligarchism:0			"Zerschlagt die lettischen Oligarchen"
LIT_support_vilna_workers:0			"Befreien Sie die Vilnaer Arbeiter"
LIT_forcefully_incorporate_estonia:0			"Estland gewaltsam eingliedern"
LIT_preemptive_strike:0			"Präventivschlag"
LIT_formalize_baltic_unity:0			"Formalisierung der baltischen Einheit"
LIT_soviet_alliance:0			"Sowjetische Allianz"
LIT_support_anti_fascism:0			"Den internationalen Antifaschismus unterstützen"
LIT_strengthen_the_coalition:0			"Die Koalition stärken"
LIT_fund_the_anbo:0			"Finanzieren Sie die ANBO"
LIT_fund_the_anbo_desc:0			"Die ANBO, unter der Leitung von Antanas Gustaitis, war für die Entwicklung und Herstellung vieler einheimischer Flugzeugdesigns verantwortlich. Wenn wir die ANBO mit mehr Ressourcen und Finanzmitteln ausstatten, könnten wir ihre Fähigkeit zur Entwicklung moderner Flugzeuge für die [Root.GetAdjective] Air Force verbessern!"
LIT_import_foreign_engines:0			"Importieren Sie ausländische Triebwerke"
LIT_import_foreign_engines_desc:0			"Die Herstellung von Flugzeugtriebwerken ist sehr teuer und ein komplizierter Prozess. Es wäre viel besser, wenn wir ausländische Triebwerke importieren und uns von einer solchen Last befreien würden."
LIT_modernize_planes:0			"Flugzeuge modernisieren"
LIT_modernize_planes_desc:0			"Der kürzliche Erwerb leistungsstarker Flugzeugtriebwerke hat es uns ermöglicht, unsere Flugzeuge mit leistungsstarken Triebwerken nachzurüsten und so Kampfflugzeuge herzustellen, die ihren ausländischen Gegenstücken ebenbürtig sind!"
LIT_open_pilot_training_facilities:0			"Öffnen Sie Pilotentrainingseinrichtungen"
LIT_open_pilot_training_facilities_desc:0			"Unsere Luftwaffe hat einen lähmenden Mangel an qualifizierten Piloten. Durch die Eröffnung von Ausbildungseinrichtungen und den Einsatz einiger erfahrener Piloten als Fluglehrer sollten wir uns dieses Problems entledigen."
LIT_anbo_viii:0			"ANBO VIII"
LIT_anbo_viii_desc:0			"Ein Vorschlag zur Entwicklung eines Flugzeugs, das zur Luftaufklärung und Luftnahunterstützung fähig ist, mit dem Codenamen ANBO VIII. Es wird das fortschrittlichste Flugzeug Litauens sein, das jemals entwickelt wurde!"
LIT_open_new_aviation_workshops:0			"Neue Werkstätten für Luftfahrt eröffnen"
LIT_open_new_aviation_workshops_desc:0			"In Litauen gibt es mehrere Werkstätten, die für die Produktion und den Zusammenbau von Flugzeugen zuständig sind. Durch die Eröffnung weiterer Werkstätten und die Rationalisierung des Produktionsprozesses könnten wir viel mehr Flugzeuge produzieren, um den Bedarf unserer Luftwaffe zu decken."
LIT_antanas_gustaitis_reforms:0			"Die Reformen von Antanas Gustaitis"
LIT_antanas_gustaitis_reforms_desc:0			"Antanas Gustaitis schlug eine Reihe von Reformen vor, die, wenn sie umgesetzt würden, den Grundstein für unsere Luftfahrtdoktrin legen und sie in zukünftigen Konflikten tragen würden."
LIT_cooperate_with_maritime_organisations:0			"Mit maritimen Organisationen zusammenarbeiten"
LIT_cooperate_with_maritime_organisations_desc:0			"Es gibt viele maritime Organisationen, deren Mitglieder erfahrene Seeleute und Kapitäne sind, die in Litauen tätig sind und von denen viele am Aufbau unserer Marine mitgewirkt haben. Sie könnten uns hilfreiche Einblicke in die Möglichkeiten geben, wie wir unsere Marine wieder verbessern können."
LIT_revisit_naval_doctrine:0			"Überdenken Sie die Marinedoktrin"
LIT_revisit_naval_doctrine_desc:0			"Mit Hilfe unseres neu erworbenen Wissens über die Marinestrategie könnten wir versuchen, unsere Marinedoktrin zu ändern, um sie besser an unsere aktuellen Bedürfnisse anzupassen."
LIT_focus_on_destroyer_production:0			"Konzentration auf die Produktion von Zerstörern"
LIT_focus_on_destroyer_production_desc:0			"Kleinere, aber vielseitigere Zerstörer würden uns viele Vorteile verschaffen, wenn wir sie einsetzen würden, und sollten daher den Großteil unserer Marine ausmachen."
LIT_educate_naval_officers_abroad:0			"Marineoffiziere im Ausland ausbilden"
LIT_educate_naval_officers_abroad_desc:0			"Wenn wir unsere vielversprechenden Offiziere auf die renommiertesten Marineakademien im Ausland schicken, werden sie mit Sicherheit ihr höchstes Potenzial erreichen und uns eine Klasse kompetenter Marineoffiziere bescheren."
LIT_defend_the_coast:0			"Die Küste verteidigen"
LIT_defend_the_coast_desc:0			"Die Fähigkeit, unsere Küste und die Schifffahrtswege zu schützen, ist lebenswichtig und sollte das vorrangige Ziel der Marine sein."
LIT_cruisers_development:0			"Entwicklung von Kreuzern"
LIT_cruisers_development_desc:0			"Kreuzer werden unsere Marine mit einem ausgewogenen Verhältnis von Feuerkraft und Vielseitigkeit ausstatten."
LIT_streamline_submarine_production:0			"Rationalisierung der U-Boot-Produktion"
LIT_streamline_submarine_production_desc:0			"Indem wir die Werften ganz auf die U-Boot-Produktion ausrichten, beseitigen wir alle Engpässe und Ineffizienzen, die die Produktion verlangsamen."
LIT_raiding_fleet:0			"Überfallende Flotte"
LIT_raiding_fleet_desc:0			"Mit U-Booten und Torpedos können wir viel stärkere Seestreitkräfte herausfordern, ohne Zeit und Ressourcen für den Bau großer Schiffe zu verschwenden."
LIT_develop_indigenous_designs:0			"Entwickeln Sie einheimische Entwürfe"
LIT_develop_indigenous_designs_desc:0			"Wir müssen die klügsten Köpfe unseres Landes versammeln, um moderne Marineschiffe zu entwerfen, die für unsere Flotte geeignet sind."
LIT_klaipda_shipyards:0			"Klaipėda Werften"
LIT_klaipda_shipyards_desc:0			"Klaipėda ist die Heimat unseres größten Seehafens und seine Lage am Zusammenfluss der Ostsee und des Kurischen Haffs macht es zu einem idealen Kandidaten für den primären Marinestützpunkt. Trotz aller Vorteile würde die Nähe zu unserer Grenze die Stadt in eine verwundbare Lage bringen."
LIT_ventoji_shipyards:0			"Šventoji-Werften"
LIT_ventoji_shipyards_desc:0			"Obwohl Šventoji im Vergleich zu Klaipėda weniger geeignet ist, unser primärer Marinehafen zu sein, liegt es im Herzen unseres Landes und wäre somit vor jeder ausländischen Aggression geschützt."
LIT_study_foreign_navies:0			"Studieren Sie ausländische Marinen"
LIT_study_foreign_navies_desc:0			"Das ausländische Wissen über die Seekriegsführung und das Know-how im Schiffbau ist dem unseren nicht ebenbürtig. Wir müssen von den führenden Seemächten lernen, wenn wir eine effektive Marine aufbauen wollen."
LIT_expansion_of_naval_facilities:0			"Ausbau der Marineeinrichtungen"
LIT_expansion_of_naval_facilities_desc:0			"Um die Instandhaltung und den Ausbau unserer Marine zu erleichtern, müssen wir die notwendige Marine-Infrastruktur zur Unterstützung unserer Flotte errichten."
LIT_a_separate_branch:0			"Ein separater Zweig"
LIT_a_separate_branch_desc:0			"Bis vor kurzem hat unsere Marine nicht die nötige Anerkennung erhalten und bedarf noch immer einer konzertierten Aktion, um ein wirklich eigenständiger Zweig unserer Streitkräfte zu werden."
LIT_baltic_navy:0			"Baltische Marine"
LIT_baltic_navy_desc:0			"Unsere Marine soll fast ausschließlich in der Ostsee operieren und muss daher auf die Besonderheiten der Geographie und der Seekriegsführung im Küstenbereich zugeschnitten sein."
LIT_found_the_lithuanian_maritime_academy:0			"Gründung der Litauischen Schifffahrtsakademie"
LIT_found_the_lithuanian_maritime_academy_desc:0			"Durch Investitionen in die Gründung der litauischen Seefahrtsakademie könnten wir damit beginnen, hochqualifizierte Seeleute und Offiziere für unsere Marine auszubilden."
LIT_purchase_foreign_ships:0			"Kaufen Sie ausländische Schiffe"
LIT_purchase_foreign_ships_desc:0			"Ausländische Werften können Schiffe viel schneller und besser herstellen, als wir es jemals könnten. Anstatt sie hilflos zu imitieren, könnten wir versuchen, ihre besten Schiffe für unsere eigene Marine zu erwerben."
LIT_purchase_italian_ships:0			"Kaufen Sie italienische Schiffe"
LIT_purchase_italian_ships_desc:0			"Viele unserer Offiziere haben in Italien studiert. Es wäre also nur logisch, dass wir versuchen sollten, eine Ausschreibung zu eröffnen, um eine Reihe moderner Schiffe von den Italienern zu kaufen."
LIT_purchase_french_ships:0			"Kauf von französischen Schiffen"
LIT_purchase_french_ships_desc:0			"Frankreich ist eine der führenden Seemächte und verfügt über eine moderne und schlagkräftige Flotte. Wir sollten in Erwägung ziehen, uns an die französische Regierung zu wenden, um einige ihrer Schiffe zu erwerben."
LIT_announce_upcoming_elections:0			"Kündigen Sie bevorstehende Wahlen an"
LIT_announce_upcoming_elections_desc:0			"Die Öffentlichkeit scheint sich Wahlen zu wünschen und so werden wir sie abhalten. Wie die Ergebnisse aussehen werden, liegt jedoch nicht unbedingt in ihrer Hand."
LIT_force_parties_to_reregister:0			"Zwingen Sie die Parteien zur Neuregistrierung"
LIT_force_parties_to_reregister_desc:0			"Die Forderung nach einer Neuregistrierung politischer Parteien kann dazu führen, dass sie es nicht mehr auf den Stimmzettel schaffen."
LIT_amend_the_electoral_law:0			"Ändern Sie das Wahlgesetz"
LIT_amend_the_electoral_law_desc:0			"Die Änderung des Wahlgesetzes ist notwendig, um Smetonas Griff nach der Macht zu festigen."
LIT_decrease_representation:0			"Verringern Sie die Repräsentation"
LIT_decrease_representation_desc:0			"Die jüngste politische Instabilität unterstreicht die Notwendigkeit einer strafferen Regierungsführung und einer Konsolidierung der Macht inmitten dieser zunehmenden Spannungen. Wir sollten fordern, die Zahl der Abgeordneten von 85 auf 49 zu reduzieren, um eine überschaubarere Legislative zu schaffen, die den Willen des litauischen Volkes besser repräsentieren und Präsident Smetona von möglichen rechtlichen Engpässen befreien kann."
LIT_subsidize_food_industry:0			"Subventionierung der Lebensmittelindustrie"
LIT_subsidize_food_industry_desc:0			"Als größter Industriezweig Litauens und wichtige Exportquelle hat die Lebensmittelindustrie aufgrund hoher Zölle und veralteter Praktiken Mühe, international wettbewerbsfähig zu bleiben. Durch gezielte Subventionen können wir diesen wichtigen Sektor modernisieren und ihn so in die Lage versetzen, Marktschocks zu überstehen und die starke Position unseres Landes auf dem Weltmarkt zu erhalten."
LIT_elect_the_fourth_seimas:0			"Wählen Sie das vierte Seimas"
LIT_elect_the_fourth_seimas_desc:0			"Um Smetonas Herrschaft über Litauen weiter zu festigen, müssen wir den vierten verfassungsmäßigen Seimas wählen, der Smetona gegenüber loyal sein wird."
LIT_form_the_youth_branch:0			"Bilden Sie die Jugendabteilung"
LIT_form_the_youth_branch_desc:0			"Durch die Bildung einer eigenen Jugendabteilung mit Sitzen in der Regierung könnten wir unsere Jugend dazu bringen, sich aktiver an der Politik zu beteiligen und eine neue Generation von litauischen Regierungsbeamten heranzuziehen. Leider könnte dies auch ein Umfeld für radikale Interpretationen unserer Ideologie schaffen."
LIT_expand_riflemans_union:0			"Schützenvereinigung ausbauen"
LIT_expand_riflemans_union_desc:0			"Die 1919 gegründete Litauische Schützenvereinigung ist ein wichtiger Bestandteil der Verteidigung und Sicherheit des Landes. Es ist nur logisch, dass wir diese Institution ausbauen."
LIT_exile_voldemaras:0			"Voldemaras im Exil"
LIT_exile_voldemaras_desc:0			"Augustinas Voldemaras und seine Anhänger stellen eine existenzielle Bedrohung für die Regierung des Landes dar. Mit ihm im Ausland sind wir besser dran."
LIT_adopt_a_new_constitution:0			"Verabschieden Sie eine neue Verfassung"
LIT_adopt_a_new_constitution_desc:0			"Eine neue Verfassung muss ausgearbeitet werden, um die Kontrolle unserer Regierung über das Land zu festigen."
LIT_empower_smetona:0			"Ermächtigen Sie Smetona"
LIT_empower_smetona_desc:0			"Unser Präsident Antanas Smetona hat bei der Führung des litauischen Staates außergewöhnliche Stärke bewiesen. Es ist nun an der Zeit, diese Kontrolle weiter auszubauen."
LIT_arrest_nazi_sympathizers:0			"Verhaften Sie Nazi-Sympathisanten"
LIT_arrest_nazi_sympathizers_desc:0			"Sowohl Italien als auch Deutschland flirten offen mit dem Faschismus und werden nur versuchen, diese Ideen in den Rest Europas zu exportieren. Wir müssen diejenigen verfolgen, die vorhaben, faschistische Ideen in Litauen zu implementieren."
LIT_dissolve_the_klaipda_directorate:0			"Lösen Sie das Direktorat von Klaipeda auf"
LIT_dissolve_the_klaipda_directorate_desc:0			"Die Region [188.GetName] hat seit der Abtretung durch Deutschland immer noch eine Teilautonomie. Es ist an der Zeit, alle Hindernisse für die Kontrolle dieses Teils unseres Territoriums zu beseitigen."
LIT_accept_opposition_in_the_government:0			"Akzeptieren Sie die Opposition in der Regierung"
LIT_accept_opposition_in_the_government_desc:0			"Angesichts des drohenden Krieges müssen wir wichtige politische Persönlichkeiten um Unterstützung bitten, auch solche, die dem Regime nicht wohlgesonnen sind."
LIT_fortify_klaipda:0			"Klaipda befestigen"
LIT_fortify_klaipda_desc:0			"Aufgrund der zunehmenden Spannungen mit Deutschland wegen der Stadt Klaipda kann man davon ausgehen, dass im Falle eines Krieges mit Deutschland Klaipda das Hauptziel einer deutschen Invasion sein würde. Wir müssen diese Region befestigen, wenn wir eine Chance gegen Deutschland haben wollen."
LIT_reinforce_kaunas_fortress:0			"Verstärken Sie die Festung Kaunas"
LIT_reinforce_kaunas_fortress_desc:0			"Die Festung von Kaunas ist ein Festungskomplex, der den größten Teil von Kaunas umfasst. Sie wurde Anfang des 20. Jahrhunderts fertiggestellt und ist nach wie vor eine der größten Verteidigungsanlagen Europas. Umfangreiche Renovierungsarbeiten sind erforderlich, um das Bauwerk zu erhalten und es auf mögliche Angriffe auf Kaunas vorzubereiten."
LIT_offer_our_enemies_support:0			"Bieten Sie unseren Gegnern Unterstützung an"
LIT_offer_our_enemies_support_desc:0			"Wir befinden uns in einer gefährlichen Situation. Umgeben von mächtigen Feinden sind wir gezwungen, unseren Gegnern Zugeständnisse zu machen, was die Spannungen mindert und uns möglicherweise mehr Zeit verschafft, um eine günstigere Vereinbarung mit unserem zum Partner gewordenen Gegner neu auszuhandeln."
LIT_sovietlithuanian_mutual_assistance_treaty:0			"[SOV.GetAdjective]-[ROOT.GetAdjective] Litauischer Beistandsvertrag"
LIT_sovietlithuanian_mutual_assistance_treaty_desc:0			"Die Deutschen versuchen offen, ihre Autorität über ihre Reichsgebiete wiederherzustellen. Es ist daher am besten, wenn wir mit der Regierung in Moskau über gegenseitigen Beistand im Falle eines Krieges sprechen."
LIT_germanlithuanian_mutual_assistance_treaty:0			"Deutsch-[ROOT.GetAdjective] Beistandsvertrag"
LIT_germanlithuanian_mutual_assistance_treaty_desc:0			"Wenn wir die Sowjets allein mit Geist und Tatkraft bekämpfen könnten, wäre die UdSSR schon morgen zerschlagen, aber leider fehlt Litauen einfach die Arbeitskraft, um sich gegen eine solch überwältigende Bedrohung zu verteidigen. Wenn wir uns mit den Deutschen verbünden, können wir vielleicht das nächste Jahrzehnt überleben."
LIT_voldemarininkai_coup:0			"Voldemarininkai Coup"
LIT_voldemarininkai_coup_desc:0			"Smetona plant, in naher Zukunft 'Wahlen' abzuhalten. Wenn wir den Eisernen Wolf jemals als politische Kraft in Litauen etablieren wollen, müssen wir jetzt handeln und unsere Position sichern."
LIT_reform_the_iron_wolf:0			"Den Eisernen Wolf reformieren"
LIT_reform_the_iron_wolf_desc:0			"Die Reform der Eisernen Wölfe ist mehr als nur ein strategischer Schachzug; sie sollte ein Statement sein. Der gefürchtete Eiserne Wolf wird wiedergeboren, um die Autorität der Voldemarininkai durchzusetzen, abweichende Meinungen auszurotten und einen neuen Sinn für nationalistischen Eifer zu wecken. Der Eiserne Wolf ist der Sache Voldemaras treu ergeben. Er wird die Vision, für die er gekämpft hat, vorantreiben - den Traum von einem starken, geeinten Litauen."
LIT_rehabilitate_organisers_of_the_1934_coup:0			"Rehabilitieren Sie die Organisatoren des Putsches von 1934"
LIT_rehabilitate_organisers_of_the_1934_coup_desc:0			"Der gescheiterte Voldemarininkai-Putsch von 1934 hallt noch immer in der aktuellen politischen Landschaft nach. Genau die Männer, die uns einst an die Macht bringen wollten, sitzen heute im Gefängnis und sind geächtet. Die Rehabilitierung der Organisatoren des Putsches war nicht nur ein Akt der Milde, sondern ein strategischer Schachzug, um unsere Autorität zu festigen, uns die treuen Verbündeten zu sichern und sie wieder in die Schranken zu weisen."
LIT_return_of_voldemaras:0			"Die Rückkehr von Voldemaras"
LIT_return_of_voldemaras_desc:0			"Jetzt, da er endlich frei von einer ungerechten Gefängnisstrafe ist, müssen wir eine pompöse Zeremonie für seine rechtmäßige Rückkehr als Führer dieser Nation organisieren."
LIT_hold_the_lnp_commission:0			"Halten Sie die LNP-Kommission"
LIT_hold_the_lnp_commission_desc:0			"Die Voldemarer haben weder eine klare Ideologie noch eine feste Hierarchie. Zankereien zwischen den Putschisten drohen die Stabilität der nationalistischen Sache zu untergraben. Die Organisation der ersten LNP-Kommission würde die Litauische Nationallistenpartei als offizielles Regierungsorgan des neuen litauischen Staates legitimieren und ein offizielles politisches Programm für die noch junge Partei festlegen."
LIT_empower_patriots:0			"Stärkung des patriotischen Flügels"
LIT_empower_patriots_desc:0			"Da der patriotische Flügel weniger widerspenstig ist als der radikale Flügel, wäre es klug, ihn und seine Politik weiter zu stärken, um keine weitere Radikalisierung der litauischen Bevölkerung zu riskieren."
LIT_enforce_lithuaniazation:0			"Litauisierung durchsetzen"
LIT_enforce_lithuaniazation_desc:0			"Litauen ist ein weitgehend homogenes Land, aber es gibt immer noch große deutsche und polnische Minderheiten im Osten und Westen. Die Regierung sollte versuchen, diese Menschen an unsere Lebensweise zu gewöhnen, anstatt zuzulassen, dass sie wieder in ausländische Hände fallen."
LIT_syndicalize_agriculture:0			"Syndikalisierung der Landwirtschaft"
LIT_syndicalize_agriculture_desc:0			"Um die Produktivität des Agrarsektors zu erhöhen und die Stärke unserer ländlichen Wirtschaft zu sichern, können wir die landwirtschaftlichen Kollektive in Syndikaten organisieren. Diese Syndikate werden einen Geist der Einheit und des gemeinsamen Ziels fördern und es Landwirten und Unternehmen ermöglichen, Ressourcen zu bündeln, Praktiken zu standardisieren und Erträge zu steigern."
LIT_battle_for_lithuania:0			"Litauische Wirtschaftskämpfe"
LIT_battle_for_lithuania_desc:0			"Indem wir Mussolinis Wirtschaftsschlachten hier in Litauen nachahmen, könnten wir versuchen, ähnliche Erfolge bei der Beseitigung unserer wirtschaftlichen und demografischen Probleme zu erzielen."
LIT_lithuanian_autarky:0			"Litauische Autarkie"
LIT_lithuanian_autarky_desc:0			"Litauen muss von den Großmächten, die uns umgeben, völlig unabhängig sein. Wir müssen daran arbeiten, unsere eigenen Ressourcen für Litauen allein zu sichern."
LIT_empower_radicals:0			"Stärkung des radikalen Flügels"
LIT_empower_radicals_desc:0			"Der radikale Flügel der LNP vertritt eine ultranationalistische Vision, die stark vom Nationalsozialismus beeinflusst ist. Er setzt sich für ein 'reines' Litauen ein und schließt sich rassistischen Ideologien an, die von den Patrioten bekämpft werden. Die Regierung sollte versuchen, sich dem radikalen Flügel weiter anzunähern und den patriotischen Flügel zu isolieren."
LIT_promote_lithuanian_aryanism:0			"Förderung des litauischen Chauvinismus"
LIT_promote_lithuanian_aryanism_desc:0			"Italiens Ideen der weiblichen Unterwerfung sollten aufgegriffen werden, um die Zukunft der litauischen Jugend zu sichern."
LIT_seize_minority_assets:0			"Vermögen der Minderheit beschlagnahmen"
LIT_seize_minority_assets_desc:0			"Die polnische Minderheit in Litauen hat zu viel Einfluss auf das Vermögen unserer Nation. Dies soll zum Wohle des Großherzogtums korrigiert werden."
LIT_germanlithuanian_credit_agreement:0			"Deutsch-litauisches Kreditabkommen"
LIT_germanlithuanian_credit_agreement_desc:0			"Mit unserer jüngsten rhetorischen Wende ist Deutschland zu einem unserer wichtigsten Verbündeten geworden. Wir sollten auf Berlin mit einem wirtschaftlichen Angebot zugehen, das für beide Länder von Vorteil wäre. "
LIT_german_industrial_aid:0			"Deutsche Industriehilfe"
LIT_german_industrial_aid_desc:0			"Litauen ist bei weitem keine große Nation und bei weitem keine Industrienation. Der beste Weg, dies zu korrigieren, ist, auf unsere deutschen Verbündeten zuzugehen und in Litauen zu investieren."
LIT_lithuanian_antibolshevik_legions:0			"Litauische Antibolschewistische Legionen"
LIT_lithuanian_antibolshevik_legions_desc:0			"Die Kommunisten stellen eine Gefahr für unsere Lebensweise dar. Es ist die Pflicht der Welt, dafür zu sorgen, dass sie keinen Druck auf Nationen ausüben können, die dem Kommunismus zum Opfer fallen könnten."
LIT_form_the_lithuanian_security_police:0			"Litauische Sicherheitspolizei"
LIT_form_the_lithuanian_security_police_desc:0			"Mächte wie Deutschland haben uns gezeigt, wie effektiv eine für die innere Sicherheit zuständige Polizei für eine Nation sein kann. Wir sollten versuchen, diese Idee zu kopieren und sie sofort in unserem neuen Staat umzusetzen."
LIT_militarise_the_iron_wolf:0			"Militarisierung der Eisernen Wölfe"
LIT_militarise_the_iron_wolf_desc:0			"Die Eisernen Wölfe sind trotz ihrer Loyalität recht widerspenstig, was an ihrer dezentralen Kommandostruktur und ihrer schlechten Disziplin liegt. Im Moment sind die Einheiten der Eisernen Wölfe mehr daran interessiert, Gewalt auf der Straße und politische Schikanen zu initiieren, als sich gegen interne Bedrohungen zu wehren. Eine Militarisierung der Eisernen Wölfe würde unsere loyalsten und engagiertesten Soldaten auf Augenhöhe mit dem litauischen Durchschnittssoldaten bringen."
LIT_lithuanian_irridentism:0			"Schüren Sie den litauischen Irredentismus"
LIT_lithuanian_irridentism_desc:0			"Ausländische Mächte halten nicht nur einen Teil unseres rechtmäßigen Landes in Besitz, sondern auch unser rechtmäßiges Kapital. Wir müssen uns dafür einsetzen, dass diese Ungerechtigkeit beseitigt wird!"
LIT_northern_intervention:0			"Intervention im Norden"
LIT_northern_intervention_desc:0			"Trotz unserer Verwandtschaft haben uns unsere nördlichen Nachbarn in unseren dunkelsten Stunden immer wieder verraten. Sie haben sich geweigert, 1919 an unserer Seite gegen die Bolschewiken zu kämpfen, und sie haben sich geweigert, uns während der Meuterei von Zeligowski im Jahr 1920 zu unterstützen. Wir können nicht zulassen, dass solche unzuverlässigen Nachbarn an unseren verwundbarsten Flanken stehen. Das muss sich ändern, ob sie es nun verstehen oder nicht."
LIT_nationalist_education:0			"Nationalistische Bildung"
LIT_nationalist_education_desc:0			"Zahllose junge Menschen besuchen die Universitäten des Landes und wir verpassen eine einmalige Gelegenheit, die Ideale des Litauens, das wir aufbauen, in ihren Köpfen zu verankern. Junge Menschen sollten ermutigt werden, Patrioten, Kämpfer und Bollwerke des litauischen Staates zu werden."
LIT_lead_by_example:0			"Mit gutem Beispiel vorangehen"
LIT_lead_by_example_desc:0			"Wenn wir uns auf technologische Innovationen konzentrieren, werden wir in den nächsten fünfzig Jahren nicht mit dem Rest Europas aufholen müssen."
LIT_operation_mindaugas:0			"Operation Mindaugas"
LIT_operation_mindaugas_desc:0			"Wir werden versuchen, Vilnius mit allen Mitteln zurückzuerobern. Da die Polen durch diplomatische Räusche mit Moskau und Berlin abgelenkt sind, ist jetzt der perfekte Zeitpunkt, um zuzuschlagen."
LIT_r56_demand_vilnius:0			"Fordern Sie Vilnius"
LIT_r56_demand_vilnius_desc:0			"Wir werden nicht tatenlos zusehen, wie Vilnius von fremden Mächten ausgenutzt wird. Wir werden unsere Forderungen stellen, damit es uns rechtmäßig zurückgegeben wird, koste es, was es wolle!"
LIT_greater_lithuania:0			"Groß-Litauen"
LIT_greater_lithuania_desc:0			"Die Idee von 'Groß-Litauen' wurde uns in den 1920er Jahren von den Polen gestohlen. Es ist jetzt an der Zeit, dafür zu sorgen, dass Groß-Litauen verwirklicht wird!"
LIT_unify_baltics_fascist:0			"Die Baltische Union"
LIT_unify_baltics_fascist_desc:0			"Auch wenn die Idee eines einzigen vereinten baltischen Staates etwas abwegig ist, kann man nicht leugnen, dass unsere Brüderlichkeit über die Grenzen hinausgeht. Wenn wir Lettland und Estland unter unserer Kontrolle haben, müssen wir nur noch ihre Verwaltung in die unsere integrieren, und unser Ziel der baltischen Hegemonie wird Wirklichkeit."
LIT_unify_baltics_communist:0			"Bilden Sie eine baltische Sowjetrepublik"
LIT_unify_baltics_communist_desc:0			"Obwohl sie sich in Kultur, Sprache und Identität unterscheiden, gibt es seit langem eine Brüderlichkeit und Kameradschaft zwischen allen drei baltischen Staaten. Wir müssen anerkennen, dass unsere Nachbarn ebenso Genossen sind wie unsere litauischen Kollegen, und die Arbeiter können nur verlieren, wenn wir uns nicht zu einer einzigen Arbeiterrepublik zusammenschließen."
LIT_restore_the_gdl:0			"Das Großherzogtum wiederherstellen"
LIT_restore_the_gdl_desc:0			"1795 war das letzte Mal vor 1918, dass ein litauischer Staat existierte. Es ist nun an der Zeit, sich unserer imperialen Vergangenheit zu stellen und das Großherzogtum in seiner Gesamtheit wiederherzustellen."
LIT_contain_german_agression:0			"Deutsche Aggression eindämmen"
LIT_contain_german_agression_desc:0			"Auch wenn wir ideologisch mit Deutschland vergleichbar sind, sind wir nicht so dumm zu glauben, dass es nicht bald unser eigenes Territorium angreifen wird. Es ist jetzt an der Zeit, sich an andere Mächte in Europa zu wenden, um Litauens Unabhängigkeit zu sichern."
LIT_ally_france:0			"Verbündeter Frankreich"
LIT_ally_france_desc:0			"In den 1920er Jahren hatte Frankreich die Absicht, ein baltisches Bündnis zu schließen, wie seine anderen Verbündeten in Osteuropa. Diese Idee sollte wiederbelebt werden, um die Souveränität Litauens zu bewahren."
LIT_ally_italy:0			"Verbündeter Italien"
LIT_ally_italy_desc:0			"Italien war eine der ersten europäischen Mächte, die unsere Unabhängigkeit anerkannt hat. Jetzt, da unsere Ideologien näher beieinander liegen, sollten wir versuchen, die Beziehungen zu vertiefen, um die litauische Souveränität zu bewahren."
LIT_memel_for_protection:0			"Memel zum Schutz"
LIT_reconvene_the_council_of_lithuania:0			"Berufen Sie den Rat von Litauen wieder ein"
LIT_reconvene_the_council_of_lithuania_desc:0			"Das Gremium, das die Gründung eines unabhängigen litauischen Staates und die Schaffung der ersten modernen litauischen Monarchie beaufsichtigt hat, muss dieses Land nun durch das Chaos des politischen Vakuums führen, das nach der Absetzung Semitones entstanden ist."
LIT_intervene_in_the_german_civil_war:0			"In den deutschen Bürgerkrieg eingreifen"
LIT_intervene_in_the_german_civil_war_desc:0			"Das Eingreifen in den Bürgerkrieg in Deutschland ist die perfekte Gelegenheit für uns, Beziehungen zu der potenziellen zukünftigen Regierung in Deutschland aufzubauen."
LIT_vote_on_monarchy:0			"Über die Monarchie abstimmen"
LIT_vote_on_monarchy_desc:0			"Nachdem der Rat von Litauen wieder einberufen wurde, ist es nun an der Zeit, darüber abzustimmen, ob die Monarchie in Litauen wiederhergestellt werden soll."
LIT_join_central_powers:0			"Beitritt zu den Mittelmächten"
LIT_join_central_powers_desc:0			"Mit einer wiederhergestellten Monarchie in Deutschland sollten wir versuchen, den Schutz des Kaisers zu erlangen."
LIT_break_nationalist_union:0			"Die Nationalistische Union auflösen"
LIT_break_nationalist_union_desc:0			"Die Nationalistische Union hat sich unrechtmäßig an die Macht geputscht. Sie stellt eine Bedrohung für den Rat dar und muss um jeden Preis vernichtet werden."
LIT_banish_smetonists:0			"Stürzen Sie die Key Smetonists"
LIT_banish_smetonists_desc:0			"Der Rat fordert [GetNeutralLeader], feindliche Maßnahmen gegen die Nationalistische Union zu ergreifen. Trotzdem müssen wir gegen sie vorgehen, ohne die Nationalistische Union zu gefährden, die angesichts der aufstrebenden liberal-christlich-sozialdemokratischen Koalition ein zu wertvoller Verbündeter ist."
LIT_dissolve_the_seimas:0			"Lösen Sie den Staatsrat auf"
LIT_dissolve_the_seimas_desc:0			"Der Staatsrat von Litauen wurde nach der Auflösung der 3. Seimas im Jahr 1927 gebildet und übernahm deren gesetzgebende Funktionen. Obwohl er oft die Autorität des Premierministers in Frage stellt, ist der Rat loyal zu Smetona, weshalb seine Auflösung eine notwendige Voraussetzung für die Beendigung von Smetonas Macht ist."
LIT_ensure_german_support:0			"Sichern Sie sich deutsche Unterstützung"
LIT_ensure_german_support_desc:0			"Die politische und militärische Unterstützung von [ROOT.GetNameDef] durch [GER.GetNameDef] würde die Legitimität und Popularität des Regimes stärken."
LIT_invite_karl_gero:0			"Debatte über die Monarchie"
LIT_kings_party:0			"Partei der Könige"
LIT_kings_party_desc:0			"Die litauische Politik wird derzeit von den Kräften blockiert, die mit der Abstimmung über eine Monarchie betraut sind. Ein innerer Zirkel, der sich aus den starken Männern jeder Partei zusammensetzt, jeder mit seinen eigenen Ambitionen und einem bescheidenen Maß an Loyalität gegenüber der Krone, kann diese Parteien beeinflussen, ohne dass eine einzelne Fraktion in der Lage wäre, die Krone herauszufordern."
LIT_new_noble_class:0			"Neue Adelsklasse"
LIT_new_noble_class_desc:0			"Der litauische Adel spielte eine entscheidende Rolle für den Erfolg des Großherzogtums. Diese Adelsfamilien waren maßgeblich an der Gestaltung der politischen und militärischen Landschaft Litauens beteiligt, und viele ihrer Nachkommen sind auch heute noch einflussreich. Die Wiederbelebung der Adelsprivilegien wird sich auf diesen Reichtum an Erfahrung und Loyalität stützen, um Stabilität und Kontinuität in der Regierungsführung zu gewährleisten und gleichzeitig das reiche Erbe Litauens zu ehren."
LIT_support_the_lkma:0			"Unterstützen Sie die LKMA >Litauische Katholische Akademie der Wissenschaften - gekürzt, da zu lang, ich habe das Litauische weggelassen, aber es ist Teil des Namens"
LIT_support_the_lkma_desc:0			"Die Litauische Katholische Akademie der Wissenschaften oder LKMA ist seit ihrer Gründung im Jahr 1922 ein wichtiger Bestandteil des wissenschaftlichen Fortschritts in Litauen. Es ist das Beste, ihre Bemühungen zu unterstützen, um sowohl das Land als auch die Popularität der Monarchie zu verbessern."
LIT_lithuanian_aristocracy:0			"Litauische Aristokratie"
LIT_cooperate_with_the_conservatives:0			"Kooperieren Sie mit den Konservativen"
LIT_cooperate_with_the_conservatives_desc:0			""
LIT_restore_constitutionalism:0			"Konstitutionalismus wiederherstellen"
LIT_restore_constitutionalism_desc:0			""
LIT_restore_the_monarchy:0			"Die Monarchie wiederherstellen"
LIT_royal_adress:0			"Königliche Adresse"
LIT_royal_adress_desc:0			"Jetzt, da die Monarchie fest wiederhergestellt ist, ist es an der Zeit, dass unser glorreicher König sich an das Volk wendet und es mit der Zuversicht erfüllt, dass die neue Ära Litauens bald beginnt!"
LIT_roman_recognition:0			"Römische Anerkennung"
LIT_roman_recognition_desc:0			"Das Konkordat von 1925 untergrub die Legitimität der litauischen Regierung, indem es ausdrücklich die Autorität der polnischen kath. Kirche über Vilnius, Litauens historische und rechtmäßige Hauptstadt, anerkannte. Dies wurde als Verrat des Vatikans angesehen. Die Suche nach einer Annäherung an Rom und die Anerkennung der Erzdiözese Vilnius können das Königreich in den Augen des litauischen Volkes legitimieren."
LIT_fate_of_smetona:0			"Bilden Sie eine Regierung der Loyalität"
LIT_redraft_the_twelve_point_proposal:0			"Neuformulierung des Zwölf-Punkte-Vorschlags"
LIT_redraft_the_twelve_point_proposal_desc:0			"Der ursprüngliche Zwölf-Punkte-Vorschlag war eine Sammlung von Statuten, die das Ausmaß der Befugnisse und Verpflichtungen des Monarchen gegenüber Litauen und dem litauischen Volk umrissen. Im Falle einer Annahme würden die zwölf Punkte als eine Sammlung rechtlicher Statuten dienen, die eine stabile Machtübergabe gewährleisten. Einige glauben jedoch, dass der Vorschlag in Wirklichkeit darauf abzielt, die Autorität des Monarchen einzuschränken."
LIT_kaunas_conference:0			"Kaunas-Konferenz"
LIT_kaunas_conference_desc:0			"Mit deutscher Unterstützung wäre es vielleicht leichter, Vilnius von den ausländischen Unterjochern zurückzuerobern."
LIT_vilnius_procession:0			"Königliche Prozession in Vilnius"
LIT_vilnius_procession_desc:0			"Nun, da Vilnius endlich wieder in litauischer Hand ist, werden wir den Erfolg des Königs dem ganzen Volk unserer großen Nation zeigen!"
LIT_royal_legacy:0			"Königliches Erbe"
LIT_german_capital:0			"Deutsche Hauptstadt"
LIT_german_capital_desc:0			""
LIT_german_railworks_integrated:0			"Integration der deutschen Eisenbahnspur"
LIT_german_railworks_integrated_desc:0			""
LIT_expand_to_markets:0			"Auf Märkte ausdehnen"
LIT_expand_to_markets_desc:0			"In der Vergangenheit waren unsere Exporte in erster Linie auf den heimischen Markt ausgerichtet, was unser Wachstumspotenzial einschränkte. Indem wir uns aktiv um Freihandelsabkommen mit Nachbarländern bemühen und diese sichern, können wir neue Wege für unsere Waren und Unternehmen eröffnen."
LIT_support_domestic_entrepreneurs:0			"Unterstützen Sie inländische Unternehmer"
LIT_support_domestic_entrepreneurs_desc:0			""
LIT_integrate_lithuanian_rail_network:0			"Integration der litauischen Eisenbahnen"
LIT_integrate_lithuanian_rail_network_desc:0			"Die meisten litauischen Eisenbahnen arbeiten immer noch mit einer Spurweite von 1524 mm, während unser wichtigster Handelspartner, Deutschland, mit einer Normalspur von 1435 mm arbeitet. Das bedeutet, dass Güter, die zwischen Litauen und Deutschland verkehren, in Klaipeda häufige und kostspielige Zwischenstopps einlegen müssen, bevor sie ihr endgültiges Ziel erreichen. Die Umstellung auf die 1435 mm Spurweite würde Litauen den Zugang zu mehr deutschen und europäischen Märkten eröffnen."
LIT_mercedes_benz_engine_plant:0			"Mercedes Benz Motorenwerk"
LIT_mercedes_benz_engine_plant_desc:0			""
LIT_new_idea_available_tank:0			"\nNeuer §YTank Designer§! verfügbar:\n"
LIT_db_six_hundred:0			"DB 600"
LIT_db_six_hundred_desc:0			"Der Daimler-Benz-Motor der Baureihe DB 600 ist das Haupttriebwerk für die meisten Jagdflugzeuge und Bomber der Luftwaffe. Stuttgart hat Interesse an einem möglichen Transfer von technischem Know-How im Gegenzug für die Erweiterung seiner Firmengelände in Litauen bekundet."
LIT_three_thousand:0			"L3000"
LIT_three_thousand_desc:0			"Der L3000 wurde zum Rückgrat des Logistiknetzes der Wehrmacht. Seine robuste Konstruktion und sein einfaches Design machen ihn leicht zu reparieren und zu warten. Aufgrund von Dieselknappheit und dem Wunsch nach einer Standardisierung der Lkw-Produktion. Die deutsche Heeresleitung stellte den L3000 ein, so dass eine große Lieferung dieser Lastwagen keinen Abnehmer fand. Vielleicht wären sie bereit, Litauen diese Lastwagen zur Verfügung zu stellen."
LIT_cult_of_vytautas_the_great:0			"Kult von Vytautas dem Großen"
LIT_legacy_of_mindaugas:0			"Das Erbe von Mindaugas I"
LIT_gediminas_heritage:0			"Das Erbe von Gediminas"
LIT_solicit_ratikiss_support:0			"Bitten Sie Ratikis' Unterstützung"
LIT_solicit_ratikiss_support_desc:0			"Da der Marschall sowohl ein hochdekorierter Kriegsheld als auch ein Gegner des derzeitigen Regimes ist, sollten wir ihn dafür gewinnen, sich dem derzeitigen Regime bei den anstehenden Wahlen entgegenzustellen."
LIT_hold_fair_elections:0			"Halten Sie faire Wahlen ab"
LIT_hold_fair_elections_desc:0			"Jetzt, da Smetonas offensichtlicher Trick, eine loyale Regierung zu ernennen, vereitelt wurde, ist es an der Zeit, dass echte Wahlen stattfinden und die Demokratie in Litauen wieder eingeführt wird."
LIT_the_4th_president:0			"Der 4. Präsident"
LIT_the_4th_president_desc:0			"Nachdem die Wahlen nun abgeschlossen sind, ist es offensichtlich, dass das Volk unseren ehemaligen Premierminister Leonas Bistras an der Spitze Litauens sehen möchte."
LIT_reinforce_czechoslovak_ties:0			"Tschechoslowakische Beziehungen verstärken"
LIT_reinforce_czechoslovak_ties_desc:0			"Die Tschechoslowakei ist nicht nur nach wie vor unser wichtigster Waffenexporteur und ein Hauptziel für die Ausbildung unserer jungen Offiziere, sie ist auch, genau wie wir, vom deutschen Expansionismus bedroht. Wir würden von einer engeren Beziehung zu ihnen profitieren, sowohl diplomatisch als auch militärisch"
LIT_propose_a_baltic_union:0			"Schlagen Sie eine Baltische Union vor"
LIT_propose_a_baltic_union_desc:0			"Obwohl unsere Völker unterschiedlich sind, gab es immer eine gemeinsame Brüderlichkeit zwischen den baltischen Nationen. Es ist jetzt an der Zeit, unsere Unterschiede beiseite zu legen, um unser gemeinsames Überleben zu sichern."
LIT_liberalization_of_trade_policies:0			"Liberalisierung der Handelspolitiken"
LIT_liberalization_of_trade_policies_desc:0			"Um unsere Wirtschaft zu beleben und die lokalen Industrien zu stärken, müssen wir unsere Handelspolitik liberalisieren. Durch den Abbau von Zöllen und Handelsschranken können wir ein günstigeres Umfeld für Unternehmen schaffen."
LIT_privatise_lithuanian_railroads:0			"Privatisierung der litauischen Eisenbahnen"
LIT_privatise_lithuanian_railroads_desc:0			"Um unseren Transportsektor wieder zu beleben, ist die Privatisierung der litauischen Eisenbahnen unerlässlich. Durch die Übertragung des Eigentums an private Unternehmen können wir Investitionen und Innovationen anlocken und so die Modernisierung der Eisenbahninfrastruktur und der Lokomotiven ermöglichen."
LIT_model_capitalist_society:0			"Kapitalistische Modellgesellschaft"
LIT_model_capitalist_society_desc:0			"Litauen hat sich durch transformative Reformen, die einen Laissez-faire-Ansatz und das Festhalten an der neoklassischen Wirtschaftslehre betonen, zu einer kapitalistischen Modellgesellschaft entwickelt. Diese Politik hat ein Umfeld geschaffen, das reif für Unternehmertum und Innovation ist und es Unternehmen ermöglicht, bei minimaler staatlicher Einmischung zu florieren."
LIT_remove_martial_law:0			"Aufhebung des Kriegsrechts"
LIT_remove_martial_law_desc:0			"Da die Wahlen abgeschlossen sind und die politische Zukunft Litauens gesichert ist, gibt es keinen Grund mehr für das Kriegsrecht."
LIT_amnesty_to_political_prisoners:0			"Amnestie für politische Gefangene"
LIT_amnesty_to_political_prisoners_desc:0			"Jetzt, da die Demokratie nach Litauen zurückgekehrt ist, ist es an der Zeit, dies durch eine Amnestie für die politischen Dissidenten Litauens zu nutzen."
LIT_remove_cencorship:0			"Abschaffung der Zensur"
LIT_remove_cencorship_desc:0			"Länder wie Deutschland und die Sowjetunion haben alles zensiert, was in ihr Land ein- und ausgeht. Wir sollten ihrem Beispiel nicht folgen und dafür sorgen, dass unsere Bürger tun können, was sie wollen."
LIT_invest_in_public_education:0			"Investieren Sie in die öffentliche Bildung"
LIT_invest_in_public_education_desc:0			"Wenn Litauen auf der internationalen Bühne jemals ernst genommen werden soll, müssen wir sicherstellen, dass wir eine gut ausgebildete Bevölkerung haben, die sich für die Zukunft unseres Landes einsetzt."
LIT_preparing_for_the_inevitable:0			"Sich auf das Unvermeidliche vorbereiten"
LIT_preparing_for_the_inevitable_desc:0			"Es ist kein Geheimnis, dass die Faschisten und die Kommunisten offen versuchen, uns zu vernichten. Wir können uns niemals darauf verlassen, dass irgendjemand unsere Souveränität gewährleistet. Aus diesem Grund müssen wir uns auf uns selbst verlassen, um die Unabhängigkeit Litauens zu erhalten."
LIT_continue_griniuss_presidency:0			"Die Präsidentschaft von Grinius fortsetzen"
LIT_continue_griniuss_presidency_desc:0			"Vor dem Putsch von 1926 war Kazys Grinius der Präsident Litauens. Es ist klar, dass das Volk ihm dieses Amt zurückgeben möchte."
LIT_contact_the_aurininkai:0			"Kontaktieren Sie den Aurininkai"
LIT_contact_the_aurininkai_desc:0			"Grinius war immer ein Befürworter der Sozialpolitik und der Verbesserung der Situation der Armen in Litauen. Eine Zusammenarbeit mit der Aurininkai wird die Popularität der von der Regierung durchgeführten Sozialreformen stärken."
LIT_social_welfare_focus:0			"Die Reformen von Grinius"
LIT_social_welfare_focus_desc:0			"Nachdem Grinius wieder die Kontrolle über Litauen übernommen hat, will er eine Sozialpolitik für die Armen in Litauen einführen."
LIT_griniuss_reforms_1:0			"Soziale Wohlfahrt"
LIT_subsidize_farmers:0			"Landwirte subventionieren"
LIT_subsidize_farmers_desc:0			"Da die Landwirte die tragende Säule Litauens sind, ist es unerlässlich, ihnen gezielte Subventionen zukommen zu lassen. Diese Investitionen werden nicht nur ihren Lebensunterhalt sichern, sondern auch ihre Produktion angesichts von Marktschocks stabilisieren, die zuvor ihre Lebensfähigkeit bedroht haben."
LIT_council_of_lithuania_1:0			"Rat von Litauen"
LIT_council_of_lithuania_2:0			"Rat von Litauen"
LIT_empty_throne:0			"Leerer Thron"
LIT_fragile_monarchy:0			"Fragile Monarchie"
LIT_kings_party_idea:0			"Karaliaus Partija"
LIT_draw_closer_to_finland:0			"Näher an Finnland heranrücken"
LIT_draw_closer_to_finland_desc:0			"Obwohl wir mit Finnland nicht so eng verbunden sind wie mit Estland, sollten wir uns dennoch um positive Beziehungen zu Helsinki bemühen, in der Hoffnung auf ihre Unterstützung in den kommenden Konflikten."
LIT_draw_closer_to_sweden:0			"Näher an Schweden heranrücken"
LIT_draw_closer_to_sweden_desc:0			"Nachdem die Demokratie ihren Weg nach Litauen gefunden hat, sollten wir uns um die Unterstützung anderer starker Demokratien wie Schweden bemühen."
LIT_form_a_baltic_alliance:0			"Bilden Sie ein baltisches Bündnis"
LIT_form_a_baltic_alliance_desc:0			"Obwohl unsere Völker unterschiedlich sind, gab es immer eine gemeinsame Brüderlichkeit zwischen den baltischen Nationen. Jetzt ist es an der Zeit, unsere Unterschiede beiseite zu legen, um unser gemeinsames Überleben zu sichern."
LIT_join_northern_lights:0			"Schließen Sie sich den Nordlichtern an"
LIT_join_northern_lights_desc:0			"Da unsere demokratischen Verbündeten im Norden einen Pakt der gegenseitigen Unterstützung geschlossen haben, sollten wir versuchen, diesem nützlichen Bündnis beizutreten."
LIT_join_allies:0			"Verbündeten beitreten"
LIT_join_allies_desc:0			"Da Großbritannien eine der wenigen großen Demokratien in Europa ist, sollten wir um eine formelle Einladung zu den Alliierten bitten."
LIT_research_cooperative:0			"Forschungskooperation"
LIT_research_cooperative_desc:0			"Wir haben die technologische Kompetenz unseres Landes in den letzten Jahren erheblich verbessert, aber wir können noch viel von unseren Verbündeten lernen. Vielleicht können wir sie dazu ermutigen, ihr Wissen im Austausch gegen unser eigenes zu teilen."
LIT_lcp_resurgence:0			"LCP-Wiederaufschwung"
LIT_lcp_resurgence_desc:0			"Die 1918 gegründete Litauische Kommunistische Partei war fast von Anfang an illegal. Angesichts der derzeitigen Instabilität im Land nach der Ankündigung von Wahlen ist es an der Zeit, eine richtige Revolution wie in Russland zu planen, um die Diktatoren an der Macht zu stürzen!"
LIT_preparing_for_the_uprising:0			"Vorbereitungen für den Aufstand"
LIT_preparing_for_the_uprising_desc:0			"Damit unsere Revolution erfolgreich sein kann, brauchen wir nicht nur die Unterstützung des Volkes, sondern auch jede Unterstützung durch die Sowjetunion wäre uns von großem Nutzen."
LIT_launch_the_revolution:0			"Starten Sie die Revolution"
LIT_launch_the_revolution_desc:0			"Jetzt, wo unsere Unterstützung gesichert ist, ist es mehr denn je an der Zeit, eine Revolution zu beginnen, die Litauen in ein neues Zeitalter führt!"
LIT_collectivisation:0			"Kollektivierung"
LIT_collectivisation_desc:0			"Mit jeder kommunistischen Revolution geht die Notwendigkeit einher, das Land in Litauen zu kollektivieren, um bessere Arbeitsbedingungen und eine bessere Produktion für die Nation zu schaffen!"
LIT_industrialisation:0			"Industrialisierung"
LIT_industrialisation_desc:0			"Litauen war von Anfang an eine industriell schwache Nation. Es ist nun an der Zeit, dass das Proletariat daran arbeitet, diese Tatsache zu ändern."
LIT_urbanisation:0			"Urbanisierung"
LIT_urbanisation_desc:0			"Die Verstädterung ist für den jungen sozialistischen Staat unerlässlich. Indem wir die Menschen aus dem ländlichen Elend in die Städte ziehen lassen, schaffen wir eine effiziente und fähige Arbeitskraft, die für die Industrialisierung der Nation und die Befreiung von der Abhängigkeit von den unterdrückerischen kapitalistischen Märkten unerlässlich ist. "
LIT_new_lithuania:0			"Das neue Litauen"
LIT_new_lithuania_desc:0			"Mit dem neuen revolutionären Bild, das sich in Litauen verbreitet, ist es klar, dass unsere Revolution erfolgreich war und uns als einen weiteren der wachsenden Zahl kommunistischer Staaten in der Welt zementiert hat."
LIT_socialist_science:0			"Sozialistische Wissenschaft"
LIT_socialist_science_desc:0			"Bislang haben die sowjetischen Wissenschaftler bewiesen, dass kommunistische Wissenschaftler begierig auf revolutionäre neue Erfindungen sind. Wir werden ihrem Beispiel folgen und die wachsende wissenschaftliche Bewegung in Litauen unterstützen."
LIT_academy_of_sciences:0			"Gründen Sie die Litauische Akademie der Wissenschaften"
LIT_academy_of_sciences_desc:0			"Die Litauische Wissenschaftliche Gesellschaft setzt sich seit langem für eine Akademie der Wissenschaften ein, wir sollten diese Ideen mit staatlichen Mitteln unterstützen."
LIT_join_comintern:0			"Treten Sie der Komintern bei"
LIT_join_comintern_desc:0			"Angesichts der Nähe zur Sowjetunion ist es nur natürlich, dass wir uns um einen Beitritt zur Kommunistischen Internationale bemühen sollten."
LIT_join_ussr:0			"Treten Sie der Union bei"
LIT_join_ussr_desc:0			"Da wir bereits so enge Beziehungen zur Sowjetunion haben und in der Vergangenheit unter russischer Herrschaft standen, ist es nur logisch, dass wir jetzt den formellen SSR-Status innerhalb der Sowjetunion beantragen."
LIT_peoples_army:0			"Volksarmee"
LIT_peoples_army_desc:0			"Die derzeitige militärische Führung ist durchsetzt mit verschiedenen bürgerlichen und konterrevolutionären Elementen. Eine groß angelegte Reorganisation ist notwendig, um sicherzustellen, dass das neue Militär die Prinzipien der Volksrevolution verkörpert und das bestehende Militär in die Volksarmee umgestaltet wird. Die litauische Volksarmee wird die sozialistischen Ideale der Revolution verteidigen, während wir uns auf äußere Bedrohungen vorbereiten."
LIT_reintegrate_lit_minor:0			"Kleinlitauen reintegrieren"
LIT_reintegrate_lit_minor_desc:0			"Nachdem die deutsche Bedrohung endgültig besiegt ist, sollte es unsere Aufgabe sein, Königsberg und seine litauische Minderheit in das eigentliche Litauen zu integrieren."
LIT_red_volunteers:0			"Rote Freiwillige"
LIT_red_volunteers_desc:0			""
LIT_spread_the_revolution:0			"Verbreiten Sie die Revolution"
LIT_spread_the_revolution_desc:0			"Wir sind zwar keine Trotzkisten, aber an der Idee der 'Permanenten Revolution' ist etwas Wahres dran. Deshalb sollten wir versuchen, den Kommunismus in unsere Nachbarländer zu exportieren."
LIT_red_latvia:0			"Unsere Nachbarn im Norden"
LIT_red_latvia_desc:0			"Da das lettische Volk unter einer Diktatur leidet, ist es jetzt an der Zeit, es zu befreien und ihm zu helfen, sich der kommunistischen Internationale anzuschließen."
LIT_red_estonia:0			"Marsch auf Tallin"
LIT_red_estonia_desc:0			"Die Revolution in Lettland war ein Erfolg und wir sind auf dem besten Weg, eine vom Proletariat geführte baltische Union zu errichten. Es ist nun an der Zeit, die Revolution zum unterdrückten estnischen Volk zu bringen."
LIT_empower_litvak_community:0			"Ermächtigung der litauischen Gemeinschaft"
LIT_empower_litvak_community_desc:0			"Seit den Zeiten des Großherzogtums gibt es in Litauen eine kleine Gemeinschaft von Litaken, die aufgrund nationalistischer Bigotterie zu lange übersehen wurde. Unsere sozialistische Doktrin sollte sich darauf konzentrieren, ihren Beitrag zur litauischen Gesellschaft anzuerkennen und zu fördern."
