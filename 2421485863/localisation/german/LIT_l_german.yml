LIT_council_of_lithuania_decisions:0			"Rat von Litauen"
LIT_council_of_lithuania_decisions_desc:0			"Der Rat von Litauen überwachte einst die Besetzung Litauens während des Ersten Weltkriegs, unterzeichnete 1918 die Unabhängigkeitserklärung und versuchte erfolglos, eine Monarchie zu errichten. Mit dem plötzlichen Regimewechsel im benachbarten Deutschland hat die Möglichkeit einer Wiederbelebung des Königreichs Litauen nach Smetona viel mehr Interesse geweckt. [GetIwValues] [GetNuValues] [GetCdValues] [GetSdValues]"
