LIT_skirpas_coup:0			"Škirpas Putsch"
LIT_skirpas_coup_desc:0			"Äußerst unzufrieden mit der Neutralität Smetonas und seiner prosowjetischen Haltung hat Oberst Škirpa seine Position als Vertreter Litauens in Deutschland genutzt, um eine von Deutschland unterstützte Machtübernahme zu koordinieren. Gemeinsam mit der Litauischen Aktivistenfront können wir Smetonas Absetzung erzwingen und damit das Ende von Smetonas Herrschaft und den Aufstieg einer neuen nationalistischen Regierung einleiten."
LIT_seek_accommodation_with_germany:0			"Suchen Sie die Verständigung mit Deutschland"
LIT_seek_accommodation_with_germany_desc:0			"Da Deutschland offen auf einige unserer Ländereien Anspruch erhebt, sollten wir versuchen, mit Berlin ins Gespräch zu kommen, um unsere Souveränität zu bewahren."
LIT_join_axis:0			"Der Achse beitreten"
LIT_join_axis_desc:0			"Da unsere Beziehungen zu Deutschland gefestigt sind, ist es nun an der Zeit, den Beitritt zur Achse anzustreben."
