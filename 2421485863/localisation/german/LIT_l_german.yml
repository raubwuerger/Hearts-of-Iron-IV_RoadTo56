LIT_constitutional_loophole_desc:0			"Unsere Hauptstadt Kaunas war jahrzehntelang ein Provisorium, seit Polen unsere ursprüngliche Hauptstadt Vilnius im Oktober 1920 mit der Operation unter dem Codenamen 'Żeligowski' besetzt hatte. Da das Problem weder von uns noch von einer dritten Partei wie dem Völkerbund gelöst wurde, besagt unsere Verfassung, dass Vilnius de jure immer noch unsere Hauptstadt ist."
