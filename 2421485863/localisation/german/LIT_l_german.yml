LIT_undercover_snieckus_tt:0			"Sniečkus' Bemühungen werden die Erfolgswahrscheinlichkeit des Aufstandes erhöhen"
LIT_not_completing_elections_tt:0			"Wenn die Wahlen nicht rechtzeitig abgeschlossen werden, wird dies die Unzufriedenheit schüren und den Anhängern radikaler Ideologien Auftrieb geben"
LIT_electoral_law_tt:0			"Die Änderung des Wahlgesetzes ist notwendig, um Smetonas Griff nach der Macht zu festigen"
LIT_ussr_coup_help_tt:0			"Die Ausrüstung wird nach Litauen kommen, sobald der Aufstand/Putsch beginnt"
