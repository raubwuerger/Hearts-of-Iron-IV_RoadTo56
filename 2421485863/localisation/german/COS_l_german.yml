r56_costa_rica_focus:0 "Costa Rica Fokus Baum"

costa_rica.1.t:0 "Allgemeine Wahlen von 1936"
costa_rica.1.d:0 "Nach vier Jahren PRN-Regierung stehen nun endlich die lang erwarteten allgemeinen Wahlen von 1936 an. Obwohl viele enge Verbündete von Präsident Ricardo Jiménez Oreamuno ihm geraten haben, die Verfassung zu missachten und erneut zu kandidieren, hat er diese Angebote und Aufforderungen wiederholt abgelehnt, da er das fragile politische System seines Landes nicht gefährden wollte, wohl wissend, dass die eklatante Missachtung der demokratischen Werte selbst einen überzeugenden Sieg für immer beflecken würde. Daher hat León Cortés Castro beschlossen, selbst anzutreten und für die Partido Republicano Nacional zu kandidieren, während der Richter Octavio Béeche Argüello als Kandidat der Hauptopposition unter dem Banner der Partido Nacional gewählt wurde. \nDie gesamte Wahl gilt als historisches Kuriosum mit einigen ungewöhnlichen Ereignissen, wie dem Beinahe-Zusammenbruch der Partido Nacional und dem ungewöhnlichen Popularitätsschub der Partido Comunista de Costa Rica. Die Institutionen von [COS.GetNonIdeologyName] sind jedoch einfach zu stabil, um durch eine einzige Wahl erschüttert zu werden."
costa_rica.1.a:0 "Die Partido Republicano Nacional erreicht eine Wiederwahl!"
costa_rica.1.b:0 "Ein unerwarteter Sieg für die wiedererstarkte Partido Nacional!"
