#Projects and Related techs
#RDF
sp_air_rdf:0 "Hochfrequenz-Funkrichtung"
sp_air_rdf_desc:0 "Die Hochfrequenz-Funkpeilung nutzt Funkwellen, um den Standort einer Funkquelle mittels Triangulation innerhalb von Sekunden zu bestimmen. Der Bau einer Miniaturversion dieses Geräts würde helfen, große feindliche Geräte wie Schiffe und große Flugzeuge zu orten. Auf diese Weise können wir besser auf Peilungen reagieren, ohne Informationen von einem größeren stationären Array-Gerät weiterleiten zu müssen."
#Only tags that fielded this IRL so only tags with flavor text for it. 
ENG_sp_air_rdf:0 "Watson-Watt DF" 
USA_sp_air_rdf:0 "Hochfrequenz-BTDF" 
#Huff Duff Device
sp_r56_naval_huff_duff_device:0 "Hochfrequenz-Ortungsgerät der Marine"
sp_r56_naval_huff_duff_device_desc:0 "Durch die Entwicklung von Hochfrequenzpeilgeräten, die auf die Ortung feindlicher Funksprüche auf See spezialisiert sind, können wir die Position feindlicher U-Boote mit Hilfe herkömmlicher Sonarsysteme besser bestimmen. Ganz gleich, wie gut sie sich verstecken und wie vorsichtig sie zu sein glauben, um nicht entdeckt zu werden."
ENG_sp_r56_naval_huff_duff_device:0 "FH4 'Huff-Duff' Gerät"
USA_sp_r56_naval_huff_duff_device:0 "FH4 Gerät"
r56_sp_naval_huff_duff_device_tech:0 "Hochfrequenz-Ortungsgerät der Marine"
r56_sp_naval_huff_duff_device_tech_desc:0 "Hochfrequenz-Peilsender, die darauf spezialisiert sind, feindliche Funksprüche auf See zu orten." 
#Friend of Foe 
sp_improved_iff:0 "Verbesserte Identifizierung von Freund und Feind"
sp_improved_iff_desc:0 "Wir können unser Freund-Feind-Erkennungssystem verbessern, indem wir aktive Transponder einsetzen und die neueste Funk- und Radartechnologie kombinieren. Dieses neue Freund-Feind-Identifizierungssystem lässt die derzeitigen Lösungen im Vergleich dazu plump aussehen."
ENG_sp_improved_iff:0 "IFF Mark II"
GER_sp_improved_iff:0 "FuG 25a Erstling"
USA_sp_improved_iff:0 "Bandübergreifende Transponder"
r56_improved_iff_tech:0 "IFF-System der zweiten Generation"
r56_improved_iff_tech_desc:0 "Ein verbessertes Freund-Feind-Erkennungssystem."
#FIDO
sp_air_fido:0 "Nebel-Intensivstreuungsgerät"
ENG_sp_air_fido:0 "FIDO"
sp_air_fido_desc:0 "Nebel ist ein großes Problem beim Starten und Landen von Flugzeugen, vor allem, wenn diese von langen Nachteinsätzen zurückkehren. Die Entwicklung eines Systems, das den Nebel auflösen und die Landebahn beleuchten kann, würde Unfälle verhindern und die Auswirkungen des Nebels auf den Betrieb verringern."
r56_fido_tech:0 "Nebel-Intensivstreuungsgerät"
r56_fido_tech_desc:0 "Ein System, das den Nebel auflöst und die Landebahn beleuchtet, würde Unfälle verhindern und die Auswirkungen des Nebels auf den Flugbetrieb verringern."
#Range Finders
sp_r56_tank_optical_rangefinder:0 "Optische Entfernungsmesser"
USA_sp_r56_tank_optical_rangefinder:0 "M1 Stereoskopischer Entfernungsmesser"
sp_r56_tank_optical_rangefinder_desc:0 "Ein fortschrittlicher Zufallsentfernungsmesser für den Einsatz in Panzern. Verbessert das Zielen und die Zielerfassung auf Distanz. Eine große Verbesserung gegenüber den derzeitigen optischen Lösungen."
r56_improved_optics_tech_1:0 "Optische Entfernungsmesser für Panzer"
r56_improved_optics_tech_1_desc:0 "Ein fortschrittlicher Zufallsentfernungsmesser für den Einsatz in Panzern. Verbessert das Zielen und die Zielerfassung auf Distanz. Eine große Verbesserung gegenüber den derzeitigen optischen Lösungen."
sp_r56_advance_tank_optical_rangefinder:0 "Fortschrittliche optische Entfernungsmesser"
USA_sp_r56_advance_tank_optical_rangefinder:0 "M2 Stereoskopischer Entfernungsmesser"
sp_r56_advance_tank_optical_rangefinder_desc:0 "Ein Generationenwechsel bei den optischen Entfernungsmessern. Verbessert das Zielen und die Zielerfassung auf Distanz erheblich."
r56_improved_optics_tech_2:0 "Fortschrittliche optische Entfernungsmesser"
r56_improved_optics_tech_2_desc:0 "Ein Generationswechsel bei optischen Entfernungsmessern. Verbessert das Zielen und die Zielerfassung auf Distanz erheblich."
#Helicopter observation SP for no DLC plebs
sp_air_r56_helicopter:0 "Hubschrauber Aufklärung"
sp_air_r56_helicopter_desc:0 "Die Fähigkeit des Hubschraubers, an Ort und Stelle zu schweben, kann bei Beobachtungsmissionen hilfreich sein."
r56_sp_helicopter_tech:0 "Hubschrauber-Beobachtung"
r56_sp_helicopter_tech_desc:0 "Die Fähigkeit des Hubschraubers, an Ort und Stelle zu schweben, kann bei Beobachtungsmissionen hilfreich sein."
#Gammon Bomb
sp_r56_gammon_bomb:0 "Anpassungsfähige Granaten"
sp_r56_gammon_bomb_desc:0 "Unsere Spezialeinheiten brauchen einfach zu handhabende Granaten, die leicht sind und sich an viele Kampfsituationen anpassen lassen, insbesondere wenn es um gepanzerte Fahrzeuge geht."
ENG_sp_r56_gammon_bomb:0 "Gammon-Bombe"
USA_sp_r56_gammon_bomb:0 "No. 82 Granate"
r56_gammon_bomb_tech:0 "Anpassungsfähige Granaten"
r56_gammon_bomb_tech_desc:0 "Einfach zu verwendende Granaten, die leicht sind und sich an viele Kampfsituationen anpassen lassen"
#Anti Tank Rifle Grenade
sp_r56_anti_tank_rifle_grenade:0 "Panzerabwehrgewehrgranate"
sp_r56_anti_tank_rifle_grenade_desc:0 "Die Entwicklung von miniaturisierten Hohlladungen für bestehende Gewehrgranatensysteme kann die Fähigkeit eines Trupps, gepanzerte Ziele zu bekämpfen, erheblich verbessern."
r56_anti_tank_rifle_grenade_tech:0 "Panzerabwehrgewehrgranate"
r56_anti_tank_rifle_grenade_tech_desc:0 "Die Entwicklung von miniaturisierten Hohlladungen für bestehende Gewehrgranatensysteme kann die Fähigkeit eines Trupps, gepanzerte Ziele zu bekämpfen, erheblich verbessern."
#Heavy Tank Studies 
sp_r56_heavy_tank_studies:0 "Studien über schwere Panzer"
GER_sp_r56_heavy_tank_studies:0 "WaA's Durchbruchwagen Studien"
SOV_sp_r56_heavy_tank_studies:0 "Durchbruchspanzer Studien"
ENG_sp_r56_heavy_tank_studies:0 "Generalstabsanfrage Panzerungsverbesserung" 
USA_sp_r56_heavy_tank_studies:0 "Empfehlung des Oberbefehlshabers der Infanterie"
sp_r56_heavy_tank_studies_desc:0 "Schwere Panzer sind komplexe Gebilde, die viel mehr Forschung und Entwicklung erfordern, als die Standardverfahren der Industrie bieten können. Die Beauftragung einer umfangreichen Studie über diese großen mechanischen Fahrzeuge könnte zu Konstruktionen führen, die besser für den Kampf gerüstet sind."
sp_r56_heavy_tank_studies_preference:0 "The Studies Scope"
sp_r56_heavy_tank_studies_preference_desc:0 "Einige unserer Offiziere haben sich mit dem Studium und der Entwicklung von Prototypen neuer schwerer Panzer vertraut gemacht. Die Phantasie einiger Offiziere hat sich mit Ideen für größere Panzer mit mehr Panzerung als die aktuellen Prototypen und Entwürfe ausgetobt. Sollen wir diesen Phantasien nachgeben oder den Projektumfang auf dem Boden der Realität halten?"
sp_r56_heavy_tank_studies_focus_preference_go_crazy:0 "Größere Panzer! Und mit mehr Panzerung!"
sp_r56_heavy_tank_studies_focus_preference_be_sane:0 "Bleiben wir bei der Studie auf dem Boden der Tatsachen."
r56_heavy_tank_studies_tech:0 "Verbesserungen für schwere Panzer"
r56_heavy_tank_studies_tech_desc:0 "Schwere Panzerkonstruktionen, die besser auf den Kampf vorbereitet sind."
