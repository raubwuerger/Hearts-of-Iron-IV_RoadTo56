#Projects and Related techs
#RDF
sp_air_rdf:0 "Hochfrequenz-Funkpeilung"
sp_air_rdf_desc:0 "Die Hochfrequenz-Funkpeilung nutzt Funkwellen, um den Standort einer Funkquelle mittels Triangulation innerhalb von Sekunden zu bestimmen. Der Bau einer Miniaturversion dieses Geräts würde die Ortung von großen gegnerischen Geräten wie Schiffen und großen Flugzeugen im Feld erleichtern. Auf diese Weise können wir besser auf Peilungen reagieren, ohne Informationen von einem größeren stationären Peilgerät weiterleiten zu müssen."
#Only tags that fielded this IRL so only tags with flavor text for it. 
ENG_sp_air_rdf:0 "Watson-Watt-Peilung"
USA_sp_air_rdf:0 "Hochfrequenz-BTDF"
#FIDO
sp_air_fido:0 "Gerät zur intensiven Nebelzerstreuung"
ENG_sp_air_fido:0 "FIDO"
sp_air_fido_desc:0 "Nebel ist ein großes Problem beim Start und bei der Landung von Flugzeugen, insbesondere wenn diese von langen Nachteinsätzen zurückkehren. Die Entwicklung eines Systems, das den Nebel auflösen und die Landebahn beleuchten kann, würde Unfälle verhindern und die Auswirkungen des Nebels auf den Flugbetrieb verringern."
r56_fido_tech:0 "Gerät zur intensiven Nebelzerstreuung"
r56_fido_tech_desc:0 "Ein System, das den Nebel auflöst und die Landebahn beleuchtet, würde Unfälle verhindern und die Auswirkungen des Nebels auf den Flugbetrieb verringern."
#Range Finders
sp_r56_tank_optical_rangefinder:0 "Optische Entfernungsmesser"
USA_sp_r56_tank_optical_rangefinder:0 "M1 Stereoskopischer Entfernungsmesser"
sp_r56_tank_optical_rangefinder_desc:0 "Ein fortschrittlicher Koinzidenz-Entfernungsmesser für den Einsatz in Panzern. Verbessert das Zielen und die Zielerfassung auf Entfernung. Eine große Verbesserung gegenüber den derzeitigen optischen Lösungen."
r56_improved_optics_tech_1:0 "Optische Panzer-Entfernungsmesser"
r56_improved_optics_tech_1_desc:0 "Ein fortschrittlicher Koinzidenz-Entfernungsmesser für den Einsatz in Panzern. Verbessert das Zielen und die Zielerfassung auf Entfernung. Eine große Verbesserung gegenüber den derzeitigen optischen Lösungen."
sp_r56_advance_tank_optical_rangefinder:0 "Optische Entfernungsmesser Advance"
USA_sp_r56_advance_tank_optical_rangefinder:0 "M2 Stereoskopischer Entfernungsmesser"
sp_r56_advance_tank_optical_rangefinder_desc:0 "Ein Generationenwechsel bei optischen Entfernungsmessern. Deutliche Verbesserung der Zielerfassung auf die Entfernung."
r56_improved_optics_tech_2:0 "Optische Entfernungsmesser Advance"
r56_improved_optics_tech_2_desc:0 "Ein Generationenwechsel bei optischen Entfernungsmessern. Deutliche Verbesserung der Zielerfassung auf die Entfernung."
#Helicopter observation SP for no DLC plebs
sp_air_r56_helicopter:0 "Hubschrauber-Beobachtung"
sp_air_r56_helicopter_desc:0 "Die Fähigkeit des Hubschraubers, an Ort und Stelle zu schweben, kann bei Beobachtungsmissionen hilfreich sein."
r56_sp_helicopter_tech:0 "Hubschrauber-Beobachtung"
r56_sp_helicopter_tech_desc:0 "Die Fähigkeit des Hubschraubers, an Ort und Stelle zu schweben, kann bei Beobachtungsmissionen hilfreich sein."
#Gammon Bomb
sp_r56_gammon_bomb:0 "Anpassungsfähige Granate"
sp_r56_gammon_bomb_desc:0 "Unsere Spezialeinheiten benötigen einfach zu handhabende Granaten, die leicht und an viele Kampfsituationen anpassbar sind, insbesondere im Umgang mit gepanzerten Fahrzeugen."
ENG_sp_r56_gammon_bomb:0 "Gammon-Bombe"
USA_sp_r56_gammon_bomb:0 "Granate Nr. 82"
r56_gammon_bomb_tech:0 "Anpassungsfähige Granate"
r56_gammon_bomb_tech_desc:0 "Einfach zu verwendende Granaten, die leicht sind und sich an viele Kampfsituationen anpassen lassen"
#Huff Duff Device
sp_r56_naval_huff_duff_device:0 "Hochfrequenz-Ortungsgerät der Marine"
sp_r56_naval_huff_duff_device_desc:0 "Durch die Entwicklung von Hochfrequenzpeilgeräten, die auf die Ortung feindlicher Funksprüche auf See spezialisiert sind, können wir die Position feindlicher U-Boote mit Hilfe herkömmlicher Sonarsysteme besser bestimmen. Ganz gleich, wie gut sie sich verstecken und wie vorsichtig sie zu sein glauben, um nicht entdeckt zu werden."
ENG_sp_r56_naval_huff_duff_device:0 "FH4 'Huff-Duff'-Gerät"
USA_sp_r56_naval_huff_duff_device:0 "FH4-Gerät"
r56_sp_naval_huff_duff_device_tech:0 "Hochfrequenz-Ortungsgerät der Marine"
r56_sp_naval_huff_duff_device_tech_desc:0 "Hochfrequenz-Peilgeräte, die auf die Ortung feindlicher Funksprüche auf See spezialisiert sind."
