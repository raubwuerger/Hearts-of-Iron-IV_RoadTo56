report_reward_no_new_line:0	" Mögliche Belohnungen aus §YEreignis§!: "
CZE_jan_antonin_bata_desc:0	"Jan Antonín Baťa war ein tschechischer Schuhhersteller und nach dem Tod seines Halbbruders Eigentümer und Geschäftsführer der Firma Baťa. \n\nUnter seiner Leitung expandierte das Unternehmen weiter in die Bereiche Schuhmaschinen, Reifen, Textilien, Chemikalien, Bergbau, Kanäle, eine Eisenbahn, Filmstudios, Flugzeugbau, Kaufhäuser und mehr."
CZE_emil_kolben_desc:0	 "Emil Kolben war ein tschechischer Ingenieur, Unternehmer sowie Gründer und Direktor von CKD bis zur Besetzung der Tschechoslowakei durch die Nazis, als er aus seinem Amt abberufen und später im Konzentrationslager Theresienstadt inhaftiert wurde, wo er 1943 starb."
CZE_radola_gajda_desc:0	"Radola Gajda, geboren als Rudolf Geidl, war ein tschechisch-serbischer Militärbefehlshaber und Politiker. Er wurde 1926 stellvertretender Chef des Generalstabs; er wurde jedoch in den Ruhestand versetzt, da er sich öffentlich als Sympathisant des italienischen Faschismus gezeigt hatte.\n\nNoch immer ein junger Mann von 34 Jahren, beschloss Gajda, sich der Politik zuzuwenden. Ende 1926 beteiligte er sich an der Gründung der Nationalfaschistischen Gemeinschaft nach dem Vorbild von Benito Mussolinis Nationalfaschistischer Partei und wurde 1927 deren Vorsitzender."
CZE_karel_husarek_desc:0	"General Karel Husarek bekleidete während der gesamten Existenz der Festungsanlagen das Amt des Direktors."
CZE_jan_netik_desc:0	"General Jan Netík war seit 1927 Leiter der II. Abteilung (Artillerie und Rüstung) des Verteidigungsministeriums. Seine Abteilung spielte eine entscheidende Rolle bei der Ausarbeitung des Rüstungsprogramms der tschechoslowakischen Armee. "
CZE_milan_hodza_desc:0	"Milan Hodža war ein prominenter slowakischer Politiker und Journalist, der von 1935 bis 1938 als Ministerpräsident der Tschechoslowakei amtierte.\n\nAls Befürworter der regionalen Integration war er bekannt für seinen Versuch, eine demokratische Föderation mitteleuropäischer Staaten zu gründen."
CZE_klement_gottwald_desc:0	"Klement Gottwald war ein tschechoslowakischer kommunistischer Politiker und langjähriger Vorsitzender der Kommunistischen Partei der Tschechoslowakei (KSČ). Nach dem kommunistischen Staatsstreich war er von 1946 bis 1948 Ministerpräsident der Tschechoslowakei und von 1948 bis 1953 Staatspräsident."
CZE_prokop_drtina_desc:0	"Prokop Drtina war ein führendes Mitglied der Nationalsozialistischen Partei. Diese einflussreiche Gruppe prägte die politische Szene der Vorkriegs-Tschechoslowakei und unterhielt enge Beziehungen zum zweiten Präsidenten des Landes, Edvard Beneš."
CZE_silvestr_blaha_desc:0	"Tschechischer General und Theoretiker, Leiter des Militärbüros des Präsidenten. Er ist bekannt für seine Veröffentlichungen über Landesverteidigung und Ausrüstung. Er ist ein Befürworter der Verlängerung der Wehrpflicht. "
CZE_louis_eugene_faucher_desc:0	"Louis Eugene Faucher war von 1926 bis 1938 Leiter der französischen Militärmission in der Tschechoslowakei. Nach dem französisch-britischen Ultimatum an die tschechoslowakische Regierung reichte er am 23. September 1938 seinen Rücktritt bei der französischen Regierung ein, blieb jedoch in der Tschechoslowakei.\n\nWährend des Zweiten Weltkriegs gehörte er zur Armée secrète (französischer Widerstand)."
CZE_ludvik_krejci_desc:0	"Ludvík Krejčí war ein tschechoslowakischer General und von 1933 bis 1939 Generalstabschef der Tschechoslowakei."
CZE_vojtech_boris_luza_desc:0	"Vojtěch Boris Luža war ein tschechoslowakischer General, der die Offensivtaktiken des französischen Marschalls Foch und Ludendorffs sowie das Buch "Achtung – Panzer!" des deutschen Generals Heinz Guderian."
CZE_lev_prchala_desc:0	"General Prchala war ein entschiedener Gegner der Münchner Kapitulation und Kommandeur der IV. Armee, die 1938 die kritische südslawische Grenze bewachte. \n\nEr stand zudem im Verdacht, einen Plan für einen Militärputsch ausgearbeitet zu haben."
CZE_jan_syrovy_desc:0	"Jan Syrový war ein General der tschechoslowakischen Armee, ehemaliger Generalstabschef und Ministerpräsident während der Münchner Krise. \n\nWährend des Ersten Weltkriegs kämpfte er in den tschechoslowakischen Legionen der russischen Armee und verlor in der Schlacht von Zborov sein rechtes Auge. Am Ende des Krieges befehligte er die Legionen und die antibolschewistischen Kräfte an der Transsibirischen Eisenbahn."
CZE_jan_rys_rozsevac:0	"Jan Rys-Rozsévač"
CZE_jan_rys_rozsevac_desc:0	"Jan Rys-Rozsévač war ein tschechoslowakischer Journalist, Politiker und Anführer der faschistischen, pro-nazistischen Organisation Vlajka."
CZE.1.t:0	"Probleme im Sudetenland"
CZE.1.d:0	"Mit der [GER.GetAdjective] Besetzung des Rheinlandes werden die Deutschen in den Sudetengebieten von Tag zu Tag unruhiger. Obwohl der Vorsitzende der Sudetendeutschen Partei (SdP), Konrad Henlein, der [CZE.GetAdjective] Regierung die Loyalität der Deutschen in [CZE.GetNameDef] versichert und sich vom deutschen Nationalsozialismus distanziert, besagen Geheimdienstberichte etwas anderes.\n\nDas Selbstbestimmungsrecht für die Sudetendeutschen, der Pangermanismus und sogar offene Sympathie für die Ideale des Nationalsozialismus sind bei politischen Kundgebungen der SdP mehr als nur eine Seltenheit."
CZE.1.a:0	"Keine Sorge. Das ist nur politischer Populismus."
CZE_unruly_minorities:0	"Sudetenland-Problem"
CZE_unruly_minorities_desc:0	" Die Tschechoslowakei war ein multiethnischer Staat, der aus Teilen des ehemaligen Österreich-Ungarischen Reiches entstanden war. Neben Tschechen und Slowaken lebten dort auch viele ethnische Deutsche, Ungarn, Juden und Ruthenen.\n\nDie Folgen der Weltwirtschaftskrise und der zunehmende Faschismus in Europa verursachten dem jungen Land immense Probleme, vor allem die ethnischen Deutschen, die von Hitlers pangermanischen Ideen verführt wurden."
CZE.2.t:0	"Beerdigung von Tomáš Garrigue Masaryk"
CZE.2.d:0	"In Prag, einer Stadt in Trauer, wehten schwarze Fahnen an den Gebäuden der Innenstadt. Büsten und Bilder von Masaryk mit jenem unverwechselbaren, flauschigen, weißen Schnurrbart säumten die Stadt und zierten die Titelseiten zahlreicher Zeitungen.\n\nSchwarze Banner mit der Aufschrift "TGM" schmückten die St.-Veits-Kathedrale und die Gebäude am Wenzelsplatz. Tausende Soldaten und Legionäre marschierten in seinem Trauerzug [GetDateText], während 146 Militärstandarten auftauchten. Mit der [CZE.GetAdjective] Flagge drapiert, wurde sein Sarg auf einer Kanonenlafette durch die Stadt getragen. Auf der letzten Etappe nach Lány wurde der Sarg mit dem Zug befördert, in einem mit Kränzen und Blumen geschmückten Waggon. \n\nTomáš Garrigue Masaryk war ein tschechoslowakischer Politiker, Soziologe und Philosoph, ein eifriger Verfechter der tschechoslowakischen Unabhängigkeit während des Ersten Weltkriegs und wurde zum Gründer und ersten Präsidenten der Tschechoslowakei. Er wurde dreimal zum Präsidenten gewählt. Er trat 1935 aus Alters- und Gesundheitsgründen von seinem Amt zurück, und Edvard Beneš trat seine Nachfolge an."
CZE.2.a:0	"Trauriger Tag für [CZE.GetNameDef]."
CZE.3.t:0	"Ehemaliger tschechoslowakischer Präsident verstorben"
CZE.3.d:0	"In Prag, einer Stadt in Trauer, wehten schwarze Fahnen an den Gebäuden der Innenstadt. Büsten und Bilder von Masaryk mit seinem unverwechselbaren, buschigen, weißen Schnurrbart waren überall in der Stadt zu sehen und zierten die Titelseiten zahlreicher Zeitungen.\n\nSchwarze Banner mit der Aufschrift "TGM" schmückten die St.-Veits-Kathedrale und die Gebäude am Wenzelsplatz. Tausende Soldaten und Legionäre marschierten in seinem Trauerzug [GetDateText], während 146 Militärstandarten auftauchten. Mit der [CZE.GetAdjective] Flagge bedeckt, wurde sein Sarg auf einer Kanonenlafette durch die Stadt getragen. Auf der letzten Etappe nach Lány wurde der Sarg mit dem Zug befördert, in einem mit Kränzen und Blumen geschmückten Waggon."
CZE.3.a:0	"Trauriger Tag für [CZE.GetNameDef]."
CZE.3.b:0	" Ein Kapitalist weniger, um den man sich Sorgen machen muss."
CZE.3.c:0	"Endlich ist der alte Bock tot!"
CZE.4.t:0	"SdP verkündet Karlsbad-Programm "
CZE.4.d:0	"Am [GetDateText] verkündete die SdP das "Karlsbader Programm", das in acht Punkten die vollständige Gleichberechtigung zwischen den Sudetendeutschen und dem tschechischen Volk forderte, einschließlich der Autonomie in von ethnischen Deutschen besiedelten Gebieten.\n\nDie Prager Regierung lehnte dies zunächst ab und behauptete, einige Punkte seien nicht umsetzbar. Unter dem Druck des Vereinigten Königreichs (Lord-Runciman-Mission) willigte sie jedoch schließlich in die meisten Forderungen der Partei Henleins ein. Die Deutschen waren mit diesem Kompromiss jedoch nicht zufrieden. Sie stellten weitere inakzeptable oder nicht umsetzbare Forderungen, um die Situation weiter zu eskalieren und eine regionale Krise herbeizuführen, die schließlich zur Münchner Konferenz führte."
CZE.4.a:0	"Wir müssen etwas unternehmen."
CZE_unruly_minorities_2:0	"Sudetenkrise "
CZE_unruly_minorities_2_desc:0	"Die SdP verkündete das Karlsbad-Programm, und die ethnischen Deutschen forderten Selbstbestimmung."
CZE_karlsbad_program:0	"Die SdP ist nicht radikalisiert."
CZE.5.t:0	" Fünfte Kolonne gegründet in [CZE.GetNameDef]"
CZE.5.d:0	"Einige Wochen vor der Münchner Konferenz hielt Hitler auf einer Kundgebung der NSDAP in Nürnberg eine Rede zur Sudetenkrise, in der er das Vorgehen der tschechoslowakischen Regierung verurteilte.\n\nHitler prangerte die Tschechoslowakei als einen betrügerischen Staat an, der gegen den im Völkerrecht verankerten Grundsatz der nationalen Selbstbestimmung verstoße, und behauptete, es handele sich um eine tschechische Hegemonie, in der weder die Deutschen, noch die Slowaken, noch die Ungarn, noch die Ukrainer, noch die Polen des Landes eine Union mit den Tschechen wünschten. \n\nEine Woche später befahl der Führer die Gründung des Sudetendeutschen Freikorps. Diese paramilitärische Organisation übernahm die Struktur der Ordnersgruppe, einer Organisation ethnischer Deutscher in der Tschechoslowakei, die die tschechoslowakischen Behörden aufgrund ihrer Verwicklung in zahlreiche terroristische Aktivitäten aufgelöst hatten. Die Organisation wurde von deutschen Behörden geschützt, ausgebildet und ausgerüstet und führte grenzüberschreitende Terroroperationen auf tschechoslowakischem Gebiet durch.\n\nViele ethnische -Deutsche weigerten sich, dem Mobilisierungsbefehl der tschechoslowakischen Armee Folge zu leisten, und flohen entweder über die Grenze nach Deutschland, wo sie sich dem Freikorps anschlossen, von dort aus grenzüberschreitende Überfälle fortsetzten, oder sie gründeten Einheiten des "Grün-Freikorps", die von tschechoslowakischen Wäldern aus operierten, Waffen und Ausrüstung aus Deutschland erhielten und bis zur deutschen Besetzung der tschechoslowakischen Grenzgebiete im Anschluss an das Münchner Abkommen Angriffe gegen tschechoslowakische Behörden, Juden und Tschechen fortsetzten."
CZE.5.a:0	"Ruft das Kriegsrecht aus!"
CZE_fifth_column:0	"Fünfte Kolonne"
CZE_fifth_column_desc:0	"Sudetendeutsches Freikorps operiert in der Tschechoslowakei."
CZE_fifth_column_2:0	"Fünfte Kolonne"
CZE_fifth_column_desc_2:0	"Sudetendeutsches Freikorps operiert in der Tschechoslowakei."
CZE.6.t:0	"Mobilmachung!"
CZE.6.d:0	"Die tschechoslowakische Führung lehnt den -französischen Vorschlag, das Sudetenland an [GER.GetNameDef] abzutreten. \n\nKurz darauf wurden der Ausnahmezustand und die allgemeine Mobilmachung ausgerufen. Der Mobilmachungsbefehl galt für etwa 1, 250.000 Soldaten, darunter Reservisten, die zuvor für verschiedene Übungen einberufen worden waren.\n\nDie Reaktion auf die Ankündigung der allgemeinen Mobilmachung erfolgte rasch; zunächst meldeten sich Reservisten bereits wenige Minuten nach dem Hören des Erlasses im Radio zum Dienst. Der Zustrom von Soldaten nahm in den folgenden Stunden rapide zu.\n\nDie Armee übernahm in der Nacht die Kontrolle und bewachte wichtige strategische Gebäude, und die Militäreinheiten formierten sich zu Kriegsverbänden um.\n\nDie Tschechoslowakei war bereit, ihre Unabhängigkeit zu verteidigen."
CZE.6.a:0	"Die Wahrheit siegt!"
CZE_mobilization_1938:0	"Mobilmachung."
CZE_mobilization_1938_desc:0	"Der Befehl zur vollständigen Mobilmachung wurde erteilt. Reservisten versammeln sich bei ihren Einheiten. "
CZE_mobilisation_formation_template_tooltip_reward:0	"§OSonderbonus:§! Neue Divisionsvorlage (§YMobilizační Těleso§! – Mobilisierte Formation)."
CZE_great_depression_aftermath:0	"Nachwirkungen der Weltwirtschaftskrise "
CZE_great_depression_aftermath_desc:0	"Die Tschechoslowakei erbte fast 70 Prozent der österreichisch-ungarischen Industriekapazitäten, doch 1930 traf die Weltwirtschaftskrise den jungen Staat mit voller Wucht. Es dauerte Jahre, bis sich das Land erholte, doch einige Unternehmen expandierten sogar in diesen kritischen Jahren."
CZE_great_depression_aftermath_tooltip_reward:0	"\n§YIndustrie§!bezogener §YForschungsbonus§!."
CZE.100.t:0	"Die Weltwirtschaftskrise in der Tschechoslowakei"
CZE.100.d:0	"Die akiens solide industrielle Tradition reicht bis ins 19. Jahrhundert zurück, als Böhmen und Mähren das wirtschaftliche Herzstück des Österreichisch-Ungarischen Reiches waren. \n\nNach dem Ersten Weltkrieg erbte der neu entstehende unabhängige Staat den Großteil der bestehenden österreichisch-ungarischen Industrieanlagen, und die Industrialisierung setzte sich in der Zwischenkriegszeit noch weiter fort.\n\nDer Index des Bruttosozialprodukts lag 1929 um 52 Punkte über dem von 1913 um 52 Punkte. Zwischen den Weltkriegen gehörte die Tschechoslowakei zu den zehn größten Industrienationen und war der siebtgrößte Rüstungsproduzent der Welt.\n\nEin chronisches Problem während der gesamten Zwischenkriegszeit, das negative nationale und politische Auswirkungen hatte, war die wirtschaftliche und soziale Heterogenität der Tschechoslowakischen Republik. Es gab erhebliche Unterschiede in der Wirtschaftsstruktur der böhmischen Länder und der Slowakei. Bis 1938 waren die Slowakei und das deutlich unterentwickelte Karpatenrussland kaum mehr als ein agrarischer Anhang der böhmischen Länder, der diese mit Rohstoffen versorgte. \n\nMit dem Ausbruch der Weltwirtschaftskrise erlitt die tschechoslowakische Wirtschaft einen Rückschlag, von dem sie sich bis 1937 kaum erholt hatte, vor allem aufgrund der Wiederaufrüstung."
CZE.100.a:0	"Die Krise ist endlich vorbei."
CZE_support_consumer_goods_industry:0	"Unterstützung der Konsumgüterindustrie"
CZE_support_consumer_goods_industry_desc:0	"Die Tschechoslowakei war schon immer ein exportorientiertes Land. Bevor die Weltwirtschaftskrise das Land traf, gehörten zu den wichtigsten Exportgütern verschiedene Lebensmittel (Zucker, Bier, Schinken), Glas, Holzprodukte, Papier, Textilien, Bekleidung, Schuhe und Lederwaren."
CZE_support_consumer_goods_industry_tooltip_reward:0	"\n§YZivile Industrie§!."
CZE.101.t:0	"Das Bata-Phänomen"
CZE.101.d:0	"Tomas Bata, der seit 1894 Schuhe herstellte, baute in Zlin, Mähren, eine große Fabrik in Zlin, Mähren, auf, wobei er die Massenproduktionstechniken der Ford Motor Company und die Grundsätze des Taylorismus nutzte.\n\nSein Unternehmen wurde für fast das gesamte Jahrzehnt vor dem Zweiten Weltkrieg zum weltweit größten Schuhexporteur. Nach dem tragischen Tod von Tomas Bata im Jahr 1932 übernahm sein Halbbruder, Jan Antonin Bata , die Leitung des Unternehmens und erlangte in den folgenden Jahren den Spitznamen "Der König der Schuhe".\n\nAls Bata 1932 starb, beschäftigte das Unternehmen 16.560 Mitarbeiter und unterhielt 1.645 Geschäfte sowie 25 Betriebe. Gemäß den Plänen, die sein Bruder vor seinem Tod festgelegt hatte, vergrößerte Jan Antonin Bata das Unternehmen in der gesamten Tschechoslowakei und weltweit auf mehr als das Sechsfache seiner ursprünglichen Größe.\n\nDie unter Tomas Bata eingeführte Unternehmenspolitik sah vor, für die Arbeiter zu errichten und Schulen sowie Sozialleistungen bereitzustellen. Zu diesen Dörfern gehören beispielsweise Batadorp in den Niederlanden, Batovany und Svit in der Slowakei, Batov in der Tschechischen Republik, Borovo-Bata (heute Borovo Naselje) in Kroatien, Bata Park in der Schweiz (Möhlin), Bataville in Frankreich (Lothringen), Batawa in Kanada, East Tilbury in England, Batapur in Pakistan sowie Batanagar und Bataganj in Indien. Es gab auch eine Fabrik in Belcamp, Maryland, USA, nordöstlich von Baltimore an der U.S. Route 40 im Harford County.\n\nIm Jahr 1934 besaß das Unternehmen 300 Filialen in Nordamerika, tausend in Asien und mehr als 4. 000 in Europa. Im Jahr 1938 beschäftigte die Bata-Gruppe weltweit etwas mehr als 65.000 Mitarbeiter, davon 36 % außerhalb der Tschechoslowakei, und hielt Beteiligungen in den Bereichen Gerberei, Landwirtschaft, Zeitungsverlag, Eisenbahn, Luftverkehr, Textilproduktion, Kohlebergbau und Luftfahrt."
CZE.101.a:0	"Unser Kunde – unser Meister (Bata-Motto) ."
CZE_highway_construction_project:0	"Verbesserung der Autobahnverbindungen"
CZE_highway_construction_project_desc:0	"Im Jahr 1937 veröffentlichte Jan Antonin Bata ein Buch mit dem Titel "Lasst uns einen Staat für 40.000.000 Menschen bauen". Darin beschrieb er seine Visionen für die zukünftige Entwicklung der Tschechoslowakei, darunter eine Autobahnverbindung quer durch das ganze Land von Cheb (Sudeten) nach Chust (Ruthenien)."
CZE_highway_construction_project_tooltip_reward:0	"Verbessert §Ydie Infrastruktur§! der Tschechoslowakei."
CZE_prospect_new_resources:0	" Aussichten auf neue Ressourcen"
CZE_prospect_new_resources_desc:0	"Zu den wichtigsten Bodenschätzen der Tschechoslowakei zählen Holz, Braunkohle, Steinkohle, Graphit und Ton. Eisenerz wurde hauptsächlich in der Slowakei abgebaut, doch die Vorkommen anderer Metalle waren relativ unbedeutend.\n\nIn Rychnov in Böhmen gibt es ein kleines Bauxitvorkommen, und in Südmähren werden seit 1900 kleine, hochwertige Ölvorkommen gefördert."
CZE_prospect_new_resources_tooltip_reward:0	"\n§YNeue Ressourcen§! und §YIndustrie§!bezogener §YForschungsbonus §!."
CZE.102.t:0	"Mineralressourcen der Tschechoslowakei"
CZE.102.d:0	" Die Tschechoslowakei verfügte über beträchtliche Mengen an Kohle und Braunkohle. Im Jahr 1935 war das Land der weltweit zweitgrößte Produzent von Braunkohle und der siebtgrößte von Steinkohle. Abgesehen von einigen wenigen bemerkenswerten Ausnahmen wie Uran war das Land jedoch relativ arm an Bodenschätzen.\n\nEisen-, Kupfer- und Manganerze wurden hauptsächlich im Slovenské rudohorie (Slowakisches Erzgebirge) abgebaut, doch wurden auch in der Nähe von Prag und Pilsen einige Metallvorkommen gefunden. In Mittelböhmen wurden kleine Vorkommen von Blei, Zink und Bauxit entdeckt. Quecksilber, Antimon und Zinn wurden im Erzgebirge (Krusne Hory) abgebaut, das beträchtliche Uranvorkommen enthielt.\n\nDie Öl- und Gasvorkommen waren gering und befanden sich hauptsächlich in Südmähren; allerdings stieg die Förderung in den Vorkriegsjahren langsam an. Während des Zweiten Weltkriegs wurde die Ölförderung aus mährischen Bohrlöchern für die deutschen Kriegsanstrengungen strategisch entscheidend und wurde erheblich ausgeweitet. Das größte Unternehmen, die DEA (Deutsche Erdöl A.G.), betrieb 1. 200 Bohrlöcher allein in der Umgebung der Stadt Hodonín.\n\nIm Jahr 1930 erwarb die Firma Franke und Scholz, die zu dieser Zeit eine Zinn- und Bleiverarbeitungsfabrik besaß, die ehemalige Flachsverarbeitungsfabrik in Friedland (Ostsudeten) und errichtete dort ein florierendes Werk zur Verarbeitung von Nichteisenmetallen. Das Unternehmen lieferte Aluminium- und Duraluminiumbleche für die tschechoslowakische Luft- und Raumfahrtindustrie."
CZE.102.a:0	"Suche nach neuen Lagerstätten."
CZE_expand_heavy_industry:0	"Ausbau der Schwerindustrie"
CZE_expand_heavy_industry_desc:0	" Als einer der wichtigsten Industriezweige mit relativ modernen Anlagen und Ausrüstungen bildete die Metallindustrie die Grundlage für die technisch fortschrittliche Maschinen- und Elektrotechnikindustrie sowie für viele andere Industriezweige in der Tschechoslowakei vor München."
CZE_expand_heavy_industry_tooltip_reward:0	"\n§YNeue Ressourcen§! (Stahl)."
CZE.103.t:0	"Stahlindustrie der Tschechoslowakei"
CZE.103.d:0	 "Zwischen 1929 und 1937 vollzog sich in der tschechoslowakischen Wirtschaft ein Wandel von der Leicht- zur Schwerindustrie, der zu einem erheblichen Teil durch eine steigende Rüstungsproduktion verursacht wurde. Während die Bergbauproduktion zwischen 1923 und 1937 im Durchschnitt etwa 11 % der gesamten Industrieproduktion ausmachte, stieg der Anteil der Metallurgie von 5,4 % im Jahr 1923 auf 8,4 % im Jahr 1937.\n\nInnerhalb der tschechoslowakischen Eisen- und Stahlindustrie entwickelte sich eine gut organisierte Monopolstruktur von nationaler Dimension. Dies war wahrscheinlich das weltweit strengste Monopol in der Stahlproduktion und basierte auf einer effektiven Kartellorganisation.\n\nDie größten Eisen- und Stahlwerke waren in einem Kartell vertreten, das aus den Vitkovice Bergbau- und Gießereiwerken in Ostrava, der Bergbau- und Metallurgiegesellschaft in Trinec und der Prager Eisengesellschaft in Kladno bestand, die als "die Großen Drei" bekannt waren .\n\nIn Europa lag die Tschechoslowakei 1935 bei der Stahlproduktion an siebter Stelle und weltweit an zehnter Stelle."
CZE.103.a:0	"Ausbau der "Großen Drei""
CZE_eastern_urbanization:0	"Ost-Urbanisierungsprojekt"
CZE_eastern_urbanization_desc:0	"Zwischen 1918 und 1938 unternahm die tschechoslowakische Regierung umfangreiche Anstrengungen zur Entwicklung der slowakischen und ruthenischen Region, und Tausende tschechischer Lehrer, Polizisten, Beamte und Geschäftsleute in die Region. "
CZE_eastern_urbanization_tooltip_reward:0	"Erhöht §YBauplätze§! in den Regionen §YSlowakei§! und §YKarpatenrussland§!."
CZE_chemical_industry_development:0	"Entwicklung der chemischen Industrie "
CZE_chemical_industry_development_desc:0	"Die Tschechoslowakei verfügte über eine beachtliche chemische Industrie, die sich hauptsächlich im nordwestlichen Sudetenland befand.\n\nAls Nazideutschland die Tschechoslowakei annektierte, wurde der Bau wichtiger Raffinerien für synthetisches Öl in Most (deutsch: Brüx) abgeschlossen. "
CZE_chemical_industry_development_tooltip_reward:0	"\n§YZivile Industrie§! und §YSynthetisches Öl§! bezogene §YForschungsbonus§!."
CZE.104.t:0	"Chemische Industrie der Tschechoslowakei"
CZE.104.d:0	"Die Anfänge der tschechischen chemischen Industrie reichen bis ins Jahr 1856 zurück, als die Aktiengesellschaft mit dem Namen "Österreichischer Verein für chemische und metallurgische Produktion" im Palast des Herzogs von Schwarzenberg in Wien, dem Zentrum des Österreichischen Kaiserreichs, gegründet wurde.\n\nEs dauerte nur ein Jahr, bis in der kleinen Provinzstadt Aussing (Usti nad Labem) die Chemieproduktion aufgenommen wurde. Das gegründete Unternehmen hatte entscheidenden Einfluss auf die Gestaltung der Struktur böhmischen chemischen Industrie während der industriellen Revolution und im 20. Jahrhundert sowie auf die Entwicklung der Stadt selbst.\n\nSchließlich wurde die Gesellschaft für chemische und metallurgische Produktion zum bedeutendsten Konkurrenten der deutschen IG Farben-Industrie AG in Mitteleuropa und auf dem Balkan und zum viertgrößten Chemiekonzern Europas. Das Unternehmen aus Aussig hatte einen Anteil von mehr als 60 % der tschechischen Chemieproduktion aus.\n\nVor der Besetzung des Sudetenlandes im Jahr 1938 übte die IG Farben erheblichen technischen Einfluss auf die tschechische Chemieindustrie aus, und es wurden mehrere Kartelle zwischen beiden Unternehmen gegründet, darunter Pläne für Fabriken zur Herstellung von synthetischem Öl.\n\nWährend des Zweiten Weltkriegs schloss Deutschland (über die neu gegründete Sudetenländische Treibstoffwerke AG) die Bauarbeiten an Raffinerien in Most (Brux) ab, und 1942 begann die Produktion von synthetischem Öl aus Braunkohle. Aufgrund ihrer Bedeutung wurde die Anlage während der Ölkampagne des Zweiten Weltkriegs wiederholt von den Alliierten bombardiert."
CZE.104.a:0	"Ausbau der chemischen Industrie."
CZE_commercial_tyre_production:0	 "Kommerzielle Reifenproduktion"
CZE_commercial_tyre_production_desc:0	"Die hohen Kosten des Schienenverkehrs veranlassten die Firma Bata, ihre Fahrzeugflotte für den Gütertransport auf der Straße einzusetzen. Um den hohen Kosten für den Import von Reifen für ihre Fahrzeugflotte entgegenzuwirken, beschloss das Unternehmen 1934, diese selbst herzustellen."
CZE_commercial_tyre_production_tooltip_reward:0	 "\n§YZivile Industrie§! und §YNeue Ressourcen§! (Kautschuk) ."
CZE.105.t:0	"Die Anfänge der Firma Barum"
CZE.105.d:0	"Die Tradition der Reifenproduktion in der Tschechoslowakei wurde Anfang der 1930er Jahre von Tomas Bata begründet. Im Januar 1932 wurden Maschinen aus dem Ausland nach Zlin in Mähren geliefert, und im April wurde dort der erste Reifen der Größe 32x6 geformt. Ein Jahr später errichtete Bata in Zlin ein neues Reifenwerk, das in der zweiten Hälfte des Jahres 1934 68.000 Reifen in 43 Größen herstellte. Im Jahr 1935 verdoppelte das Werk seine Produktion, und Bata-Reifen wurden auf allen tschechischen Autos montiert, wodurch der Import von Reifen aus dem Ausland nicht bevorzugt wurde. Im Jahr 1939 stellte Bata jährlich 250.000 Reifen her und führte die Produktion von Keilriemen, Förderbändern und technischem Gummi ein.\n\nNach dem Zweiten Weltkrieg verlor die Familie Bata die Kontrolle über das Unternehmen, als der Staat es beschlagnahmte. Das Unternehmen Barum fusionierte alle anderen großen Gummihersteller in der Tschechoslowakei."
CZE.105.a:0	"Steigerung der Reifenproduktion."
CZE_support_strategic_industry:0	"Unterstützung strategischer Industriezweige "
CZE_support_strategic_industry_desc:0	"Viele kleine Industriebetriebe machten die Tschechoslowakei zu einem breit gefächerten Produzenten von Gütern, doch einige wenige Unternehmen dominierten die Wirtschaft und waren strategisch wichtig."
CZE_support_strategic_industry_tooltip_reward:0	"\n§YRüstungsindustrie§!."
CZE.106.t:0	"Rüstungsindustrie der Tschechoslowakei"
CZE.106.d:0	"Tschechoslowakische Feuerwaffen- und Munitionshersteller spielten eine entscheidende Rolle in der Wirtschaft, insbesondere im Hinblick auf eine positive Handelsbilanz.\n\nCeska Zbrojovka (Zbrojovka Brno) war einer der wichtigsten Akteure in diesem Bereich; das Unternehmen stellte jedoch neben der traditionellen Produktion von Gewehren, Maschinengewehre und andere Feuerwaffen.\n\nNach dem Ersten Weltkrieg wurde das französische Unternehmen Schneider Creusot zum Mehrheitsaktionär der Skoda-Werke und baute seine Aktivitäten im In- und Ausland rasch aus. Skoda begann mit der Herstellung von Automobilen, Flugzeugen, Panzern und gepanzerten Fahrzeugen, setzte aber auch seine traditionelle Produktion von Großgeschützen, Lokomotiven und anderen Maschinen fort. Ende 1930 beschäftigte das Unternehmen fast 30.000 Arbeiter. \n\nDer Hauptkonkurrent von Škoda war CKD, ein Unternehmen, das 1927 durch den Zusammenschluss zweier kleinerer Firmen, Ceskomoravska-Kolben (gegründet 1896, produzierte Maschinen für Wasserkraftwerke) und Breitfeld-Danek (gegründet 1854, produzierte Maschinen für den Bergbau und die Lebensmittelindustrie). CKD expandierte rasch mit der Produktion von Lokomotiven und Panzern.\n\nDer tschechische Ingenieur und Unternehmer Emil Kolben war Gründer und Direktor von CKD bis zur Besetzung der Tschechoslowakei durch die Nazis, als er seines Amtes enthoben und später im Konzentrationslager Theresienstadt inhaftiert wurde, wo er 1943 starb.\n\nWährend der deutschen Besetzung der Tschechoslowakei im Zweiten Weltkrieg wurde das Unternehmen in BMM (Böhmisch-Mährische Maschinenfabrik AG) umbenannt und stellte Waffen für die Wehrmacht her. In dieser Zeit waren die bedeutendsten Produkte waren die Panzer 38(t) und die Jagdpanzer 38(t)."
CZE.106.a:0	"Die Rüstungsindustrie fördern."
CZE_secure_arms_export_deals:0	"Waffenexportverträge sichern"
CZE_secure_arms_export_deals_desc:0	" Die Tschechoslowakei war lange Zeit einer der weltweit führenden Waffenexporteure in die Entwicklungsländer. Durch den Verkauf von Waffen konnte die Tschechoslowakei Gewinne erzielen, ihre Industriewirtschaft ankurbeln und engere politische Beziehungen zu den Staaten aufbauen, die ihre Waffen kauften."
CZE_secure_arms_export_deals_tooltip_reward:0	 "\n§YForschung§! und §YHandel§! im Zusammenhang mit der §Ynationalen Idee§!."
CZE.107.t:0	"Tschechoslowakischer Waffenexport"
CZE.107.d:0	"Die Tschechoslowakei war lange Zeit einer der weltweit führender Exporteure von Waffen in die Entwicklungsländer. Durch den Verkauf von Waffen konnte die Tschechoslowakei Gewinne erzielen, ihre Industriewirtschaft ankurbeln und engere politische Beziehungen zu den Staaten aufbauen, die ihre Waffen kauften.\n\nBereits in den 1920er Jahren war die Tschechoslowakei ein aggressiver Waffenexporteur. Zbrojovka Brno und Škoda waren die wichtigsten Exporteure. Die Produktions- und Exportaktivitäten der Rüstungsunternehmen waren koordiniert und nicht wettbewerbsorientiert und nahmen oft die Form eines Kartells an.\n\nPanzer von CKD (hauptsächlich angepasste Varianten der TNH-Serie) wurden weltweit exportiert; dies setzte sich sogar während des Zweiten Weltkriegs fort, beschränkte sich jedoch auf die Satellitenstaaten der Achsenmächte. Als Deutschland das Land besetzte, nutzte es die umfangreiche Rüstungsproduktion hauptsächlich, um seine Kriegsmaschinerie anzutreiben.\n\nAllerdings beschränkten sie den Export nicht auf Waffenlieferungen, sondern verkauften auch Lizenzrechte zur Herstellung fortschrittlicher tschechoslowakischer Waffen. Das berühmte britische Bren-Maschinengewehr basierte auf einer lizenzierten Version des tschechoslowakischen leichten Maschinengewehrs ZGB-33 (eine modifizierte Version des ZB vz. 26). Die gleiche Waffe wurde auch an Japan lizenziert und war dort als Typ 97 bekannt. Das BESA-Maschinengewehr war die britische Version des tschechoslowakischen schweren Maschinengewehrs ZB -53 (TK vz. 37).\n\nEs ist ein wenig ironisch, dass viele Armeen Waffen aus einem Land einsetzten, das die Franzosen und Briten im Namen des " Frieden für unsere Zeit" geopfert hatten, um Soldaten auf beiden Seiten des Zweiten Weltkriegs zu töten.\n\nDie tschechoslowakische Regierung spielte eine entscheidende Rolle bei der Aushandlung neuer Waffenlieferverträge oder Lizenzproduktionsvereinbarungen."
CZE.107.a:0	"Neue Waffenexportverträge sichern."
CZE_armament_exports_idea:0	"Waffenexporte"
CZE_armament_exports_idea_desc:0	"Die Tschechoslowakei exportierte Waffen oft über Lizenzproduktionsverträge, manchmal sogar im Austausch gegen industrielles Know-how."
CZE_explosives_production:0	"Ausbau der Sprengstoffindustrie"
CZE_explosives_production_desc:0	"Die Tschechoslowakei hatte eine lange Tradition im Sprengstoffgeschäft, die sich bis weit nach dem Zweiten Weltkrieg fortsetzte. Der Plastiksprengstoff Semtex ist wahrscheinlich einer der bekanntesten tschechoslowakischen Sprengstoffe seit dem Kalten Krieg."
CZE_explosives_production_tooltip_reward:0	"\n§Y Zivile Industrie§! ODER §YMilitärindustrie§! mit §YArtillerie§! bezogenem §YForschungsbonus§!."
CZE_skoda_naval_artillery_experience:0	"Skoda-Erfahrung in der Marineartillerie"
CZE_skoda_naval_artillery_experience_desc:0	"Skoda entwarf die Geschütze der österreichisch-ungarischen Marine; es ist an der Zeit, diese Erfahrung erneut gewinnbringend einzusetzen."
CZE.108.t:0	"Tschechoslowakische Sprengstoffindustrie"
CZE.108.d:0	"Im Jahr 1920 beschloss die tschechoslowakische Regierung, in das Sprengstoffgeschäft einzusteigen. Sie gründete die "Tschechoslowakische Aktiengesellschaft für Sprengstoffe" in Pardubice, vor allem wegen der strategisch günstigen Lage in Mittelböhmen.\n\nBis 1922 produzierte die Fabrik Schwarz- und Rauchpulver sowie andere "energetische" Materialien, hauptsächlich für Verteidigungszwecke. In den späten 1930er Jahren wurde das Unternehmen in Explosia um.\n\n1928 wurde in Semtín eine Schwesterfirma namens Synthesia gegründet, die sich auf anorganische Produkte zur Herstellung von Sprengstoffen konzentrierte.\n\nWährend der Besatzungszeit von 1938 bis 1945 produzierte Explosia einen Großteil der Treibstoffe für die deutsche Artillerie sowie Sprengstoffe für zivile und militärische Sprengungen. Alliierte Flugzeuge versuchten, die Fabriken zu bombardieren, verfehlten sie jedoch.\n\nDer Kunststoffsprengstoff Semtex ist wahrscheinlich eines der bekanntesten bekanntesten Produkte von Synthesia, obwohl dieser erst lange nach dem Zweiten Weltkrieg erfunden wurde."
CZE.108.a:0	"Expand Explosia"
CZE.108.b:0	"Expand Synthesia"
CZE_cvut:0	"Tschechische Technische Universität"
CZE_cvut_desc:0	"Die Tschechische Technische Universität in Prag (ČVUT) ist eine der größten Universitäten in der Tschechischen Republik und die älteste technische Hochschule in Mitteleuropa."
CZE_cvut_tooltip_reward:0	"\nErhalte §G1§! Forschungsplatz."
CZE.109.t:0	"Tschechische Technische Universität in Prag"
CZE.109.d:0	"Durch einen Erlass des Ministeriums für Bildung und nationale Aufklärung der Tschechoslowakischen Republik im Jahr 1920 entstand die Tschechische Technische Universität in Prag als Zusammenschluss von sieben technischen Hochschulen: \n\n- Bauingenieurwesen\n- Kulturtechnik\n- Architektur und Hochbau\n - Maschinenbau und Elektrotechnik\n- Chemie- und Verfahrenstechnik\n- Land- und Forstwirtschaft\n- sowie Spezialwissenschaften.\n\nZu den namhaften Absolventen der Universität zählen:\n\n- Christian Doppler (Mathematiker und Physiker)\n- František Křižík (tschechischer Erfinder, Elektrotechniker und Unternehmer)\n - Simon Wiesenthal (Nachkriegs-Nazi-Jäger und Schriftsteller)\n- Vladimir Prelog (Chemiker und Nobelpreisträger von 1975)\n- George Klir (Informatik- und Systemwissenschaftler)\n\nAufgrund einer Entscheidung von Konstantin von Neurath, Reichsprotektor von Böhmen und Mähren, wurden die tschechischen Universitäten (einschließlich der CVUT) am 17. November 1939 geschlossen.\n\nIn dieser Zeit konnten insgesamt 15.172 Studierende ihr Studium nicht abschließen, und 513 Professoren, 475 Dozenten und 345 weitere Lehrkräfte ihre Anstellung. Einige Studierende versuchten, ihr Studium an deutschen Universitäten abzuschließen, wurden jedoch meist nicht zugelassen."
CZE.109.a:0	"Neue Forschungsprogramme finanzieren."
CZE_commercial_uranium_mining:0	"Uranabbau"
CZE_commercial_uranium_mining_desc:0	"Die Tschechoslowakei ist die Wiege des industriellen Uranabbaus. Der Uranabbau in Jáchymov (damals Joachimsthal genannt und zu Österreich-Ungarn gehörend) begann in den 1890er Jahren im industriellen Maßstab, nachdem die Silber- und Kobaltproduktion der Lagerstätte zurückgegangen war."
CZE_commercial_uranium_mining_tooltip_reward:0	"\n§YZivile Industrie§! ODER §YNukleartechnik§!bezogene §YForschungsboni§!."
CZE.110.t:0	"Uran in Jachymov"
CZE.110.d:0	"Im frühen 19. Jahrhundert wurde Uranerz als Nebenprodukt des Bergbaus in Sachsen, Böhmen und Cornwall gewonnen. Der erste gezielte Abbau radioaktiver Erze fand in Jachymov (damals Joachimsthal genannt), einer Silberbergbaustadt im damaligen Österreich-Ungarn. Marie Curie verwendete Pechblende aus Jachymov, um Radium, ein Zerfallsprodukt von Uran, zu isolieren.\n\nBis zum Zweiten Weltkrieg wurde Uran vor allem wegen seines Radiumgehalts abgebaut. Die im Uranerz enthaltenen Radiumquellen wurden für die Verwendung als Leuchtfarbe für Zifferblätter von Uhren und anderen Instrumenten sowie für gesundheitsbezogene Anwendungen gesucht, von denen einige rückblickend zweifellos schädlich waren. Das Nebenprodukt Uran wurde hauptsächlich als gelbes Pigment verwendet.\n\nDer westliche Teil des Landes stand kurz nach dem Krieg im Mittelpunkt des Interesses der Weltmächte – die Landschaft um die Stadt J achymov war der Ort einer weltweiten Exklusivität – des Uranabbaus. Es war der einzige Ort, an dem die Sowjetunion sofort Uranerz beschaffen und mit der Entwicklung von Atomwaffen beginnen konnte, insbesondere nachdem die Vereinigten Staaten die Bomben auf Hiroshima und Nagasaki abgeworfen hatten. So wurde die Tschechoslowakei nach dem Zweiten Weltkrieg zur wichtigsten Uranquelle für die Sowjetunion.\n\nNachdem die Kommunistische Partei 1948 die Macht in der Tschechoslowakei übernommen hatte, wurden in der Stadt und ihrer Umgebung große Gefangenenlager eingerichtet. Gegner des neuen Regimes wurden gezwungen, unter sehr harten Bedingungen Uranerz abzubauen, und die durchschnittliche Lebenserwartung in Jáchymov betrug zu dieser Zeit 42 Jahre. Schließlich wurde der Uranabbau 1964 eingestellt."
CZE.110.a:0	"S ell Uran an Verbündete verkaufen."
CZE.110.b:0	"Das Uran behalten und ein Kernforschungsprogramm initiieren. "
CZE_nuclear_physics_institute:0	"Institut für Kernphysik"
CZE_nuclear_physics_institute_desc:0	"Das Institut für Kernphysik der Tschechoslowakischen Akademie der Wissenschaften wurde lange nach dem Zweiten Weltkrieg, im Jahr 1955, gegründet. Aber vielleicht hätte die Atomforschung in der Tschechoslowakei viel früher begonnen, wenn die historischen Ereignisse einen anderen Verlauf genommen hätten."
CZE_rocket_research:0	"Raketenforschung"
CZE_rocket_research_desc:0	"Raketen- und Strahltriebwerke ermöglichen beispiellose Geschwindigkeiten sowohl für unbemannte als auch für bemannte Schiffe. Die Pionierarbeit bei diesen Technologien ermöglicht es uns, den Feind zu überraschen."
CZE_ministry_of_defense:0	"Reorganisation des Verteidigungsministeriums"
CZE_ministry_of_defense_desc:0	"Das Verteidigungsministerium war eine Organisation, die für Mobilisierungsvorbereitungen gemäß den Richtlinien des Oberkommandos, die Verwaltung der Nachschubgüter und die Koordination des Wiederaufrüstungsprogramms zuständig war."
CZE_ministry_of_defense_tooltip_reward:0	" \nFrei §YBerater des Oberkommandos der Streitkräfte§! ODER §YPolitische Macht§!."
CZE.200.t:0	"Verteidigungsministerium"
CZE.200.d:0	"Das Ministerium für Nationale Verteidigung (MND) war dafür zuständig, alle Angelegenheiten im Zusammenhang mit dem militärischen Aufbau, dessen Unterstützung und der Deckung seiner Bedürfnisse zu regeln. Insbesondere in den ersten Jahren seines Bestehens erlebte das MND häufige organisatorische Veränderungen, wobei seine endgültige Form 1927 erreicht wurde.\n\nDie Kernbereiche des MND waren Abteilungen, die für einen bestimmten Zweig der Streitkräfte und der Verwaltung zuständig waren und sich zudem gemäß den Richtlinien des Generalstabs mit der organisatorischen und mobilisatorischen Bereitschaft befassten, beschafften Waffen und Rüstungsmaterial, kontrollierten die Verwaltung dieses Materials und führten die entsprechenden Aufzeichnungen.\n\nIn den 1930er Jahren bestand die vorrangige Aufgabe darin, die Verteidigung des Staates gegen die Aggressionsgefahr durch Deutschland zu sichern und unter den Bedingungen einer durch Marktstagnation erschwerten Wirtschaftskrise angemessene Finanzmittel bereitzustellen.\n\nEine der entscheidenden Positionen im MND war das Amt des Generalinspektors der tschechoslowakischen Truppen, das direkt dem Minister für Nationale Verteidigung unterstellt war.\n\nZu seinen Aufgaben gehörten in erster Linie die Durchführung von Inspektionen, die Überprüfung der Disziplin, die Einhaltung der Dienstvorschriften und andere. Die Zuständigkeiten wurden 1937 erheblich erweitert.\n\nDer bekannte, erfahrene Kommandeur und ehemalige Generalstabschef, General Jan Syrovy, wurde 1933 zum Generalinspekteur ernannt und bekleidete dieses Amt bis 1938. Während des Ersten Weltkriegs kämpfte er in den tschechoslowakischen Legionen der russischen Armee und verlor in der Schlacht von Zborov sein rechtes Auge. Gegen Ende des Krieges befehligte er die Legionen und die antibolschewistischen Truppen an der Transsibirischen Eisenbahn."
CZE.200.a:0	"Erweiterung der Zuständigkeit des Generalinspektors. "
CZE.200.b:0	"Wir müssen uns auf andere Themen konzentrieren."
CZE_ministry_of_national_defense:0	"Reorganisation des Ministeriums für Nationale Verteidigung"
CZE_rop:0	 "Mittel für die ŘOP bereitstellen"
CZE_rop_desc:0	"Die Vorbereitungen für den Bau einer dauerhaften tschechoslowakischen Befestigungsanlage reichen bis ins Jahr 1934 zurück. Befestigungsprojekte und -arbeiten unterstanden der neu gegründeten Direktion für Befestigungsarbeiten (ŘOP – Ředitelství Opevňovacích Prací). General Karel Husarek bekleidete während des gesamten Bestehens die Position des Direktors der Festungsarbeiten."
CZE_rop_tooltip_reward:0	"\n §OSonderbonus:§! Startet die §YBeneš-Linie§!-Ereigniskette für die tschechoslowakischen Grenzbefestigungen. \n\nDer Abschluss der gesamten Ereigniskette bietet bis zu §YFestungen der Stufe 5§! in bestimmten Regionen."
CZE_rop_idea:0	"Direktion für Befestigungsarbeiten – ŘOP"
CZE_rop_idea_desc:0	"Der ŘOP wurden Mittel zugewiesen, und die Bauarbeiten schreiten wie geplant voran."
CZE.201.t:0	"Die Beneš-Linie"
CZE.201.d:0	"Die Aussicht auf einen Krieg mit Deutschland kam für die tschechoslowakische Regierung der 1930er Jahre nicht überraschend. Prag hatte sich seit Jahren ernsthaft auf den Krieg vorbereitet; einigen Schätzungen zufolge floss mehr als die Hälfte aller Staatsausgaben von 1936 bis 1938 in militärische Zwecke. Ein Großteil davon floss in den Bau eines ausgeklügelten Systems von Bunkern und anderen Verteidigungsanlagen im Sudetenland, der gemeinsamen Grenzregion mit Deutschland.\n\nDie deutsch-tschechoslowakische Grenze war 1545 Kilometer lang und verlängerte sich nach dem Anschluss Österreichs an Deutschland im Jahr 1938 sogar auf 2103 Kilometer. \n\nAuf Empfehlung des verbündeten Frankreichs wurde beschlossen, ein gigantisches Befestigungssystem entlang der deutschen Grenze und im Landesinneren zu errichten. Aufgrund der extremen Länge der Grenze und der strategisch ungünstigen Form der Tschechoslowakei konnte die tschechoslowakische Regierung eine durchgehende Linie schwerer Befestigungsanlagen nicht finanzieren."
CZE.201.a:0	" Beginn des Baus der Odra-Krkonoše-Linie"
CZE_phase_one_tooltip:0	"\n Der Bau von §Y8§! §Ybefestigten Zonen (Stufe 2) §! entlang der nördlichen Grenze zu Deutschland beginnen (geschätzte Dauer: §Y180 Tage§!)."
CZE.202.t:0	"Tschechoslowakei startet Projekt zur Grenzbefestigung"
CZE.202.d:0	"Aufgrund der zunehmenden Spannungen mit Deutschland hat die tschechoslowakische Regierung auf Empfehlung des verbündeten Frankreichs mit dem Bau eines massiven Befestigungssystems im Sudetenland begonnen, um die nordwestliche Grenze vor einer möglichen deutschen Aggression zu schützen.\n\nWichtige Quellen aus Deutschland deuten darauf hin, dass Reichskanzler Hitler wütend ist und dieses Thema auf dem bevorstehenden Parteitag in Nürnberg kurz ansprechen wird."
CZE.202.a:0	"Interessant."
CZE.203.t:0	"Bau von leichten Festungen"
CZE.203.d:0	"Das tschechoslowakische Armeekommando benötigte einen besseren Typ leichter Festung, daher wurde ein neuer Typ namens Mark 37 entworfen, bei dem es sich faktisch um eine Miniaturausgabe einer schweren Festung handelt. Dieser Typ feuerte fast bis zur Flanke. Nur sehr wenige von ihnen verfügten über eine Schießscharte für Frontalfeuer. Wo dies der Fall war, befanden sie sich auf einer Rückseite des Hangs, um zu verhindern, dass die Schießscharte durch direkt beobachtetes Feuer aus großer Entfernung beschossen wurde. Sie waren tatsächlich nicht in der Lage, sich von vorne zu verteidigen, und ihre Verteidigung hing von benachbarten Posten oder Feuer aus offenen Stellungen ab."
CZE.203.a:0	"Priorisieren Sie die westliche Grenze."
CZE.203.b:0	"Priorisieren Sie die südliche Grenze. "
CZE.203.c:0	"Das Projekt abbrechen."
CZE_phase_two_w_tooltip:0	"\n Der Bau von §Y8§! §Ybefestigten Zonen (Stufe 2) §! entlang der westlichen Grenze zu Deutschland beginnen (voraussichtliche Dauer: §Y180 Tage§!)."
CZE_phase_two_s_tooltip:0	"\n Der Bau von §Y9§! §Ybefestigten Zonen (Stufe 1–2) §! wird entlang der südlichen Grenze zu den ehemaligen österreichisch-ungarischen Gebieten beginnen (voraussichtliche Dauer: §Y180 Tage§!)."
CZE_phase_two_stop_tooltip:0	"Das Bauprojekt für die Grenzbefestigungen wird §Yabgebrochen§! und es werden keine weiteren Befestigungen errichtet."
CZE.204.t:0	"Bau schwerer Festungen"
CZE.204.d:0	"Die Tschechoslowakei errichtete schwere Festungen nahe der Grenze zu Deutschland und in der Slowakei nahe der Grenze zu Ungarn. Sie sollten die Hauptangriffe des Feindes durch Panzer und Infanterie abwehren.\n\n Die Bunker wurden in Ketten errichtet (der Abstand zwischen den Festungen betrug zwischen 300 und 600 m). An einigen Stellen errichtete die Tschechoslowakei Artilleriefestungen, um eine Kette unabhängiger Festungen mit Artillerieunterstützung zu versorgen. Zwischen den Jahren 1935 und [GetDateText] wurden in der Tschechoslowakei etwa 250 Blockhäuser errichtet. Jedes Fort wurde individuell entworfen, sodass es ebenso viele Varianten gibt wie gebaute Forts, doch lassen sie sich nach ihren Funktionen, Formen oder Widerstandsklassen unterteilen. Französische Typen beeinflussten die frühen schweren Befestigungen, später jedoch einen neuen Typ, der besser zum tschechischen Verteidigungskonzept passte."
CZE.204.a:0	"Beginn des Baus schwerer Kasematten."
CZE_phase_three_tooltip:0	" \nDer Bau von §Y6§! §Yschweren Kasematten (Stufe 3)§! wird an den kritischsten Punkten entlang der Grenze zu Deutschland beginnen (voraussichtliche Dauer: §Y365 Tage§!). "
CZE.204.b:0	"Das Projekt für §G1!§  weiteres Jahr fortsetzen."
CZE.204.c:0	"Das Projekt einstellen."
CZE.205.t:0	 "Die Arbeiten an den leichten Festungen fortsetzen"
CZE.205.d:0	"Die Direktion für Befestigungsarbeiten berichtet, dass die Bauarbeiten planmäßig voranschreiten. Sollen wir Aufträge für weitere Arbeiten vergeben und mehr Mittel für das Projekt bereitstellen?"
CZE.205.a:0	"Das Bauprojekt fortsetzen."
CZE.205.b:0	"Das Projekt abbrechen."
CZE.206.t:0	"Bericht der Direktion für Befestigungsarbeiten"
CZE.206.d:0	"Die Direktion für Befestigungsarbeiten berichtet, dass alle geplanten Projekte in Kürze abgeschlossen sein werden. Möchten Sie das Mandat von ŘOP verlängern oder das Projekt abbrechen?"
CZE.206.a:0	"Das Projekt fortsetzen."
CZE.206.b:0	"Das Projekt abbrechen."
CZE_phase_four_tooltip:0	"Das Projekt wird fortgesetzt (Sie behalten eine eingeschränkte Variante der §YNationalen Idee§!) für §Y1 Jahr§! fortgesetzt, aber es werden keine weiteren kostenlosen Bunker gebaut."
CZE_rop2_idea:0	"Direktion für Befestigungsarbeiten – ŘOP"
CZE_rop2_idea_desc:0	"ŘOP wurden weitere Mittel für künftige Bauvorhaben zugewiesen."
CZE_engineer_corps:0	"Ausbildung des Pionierkorps"
CZE_engineer_corps_desc:0	"Pionierverbände waren für das Befestigungsbauprojekt von entscheidender Bedeutung und erhielten daher die beste Ausbildung und Ausrüstung."
CZE_military_education:0	"Förderung der militärischen Ausbildung"
CZE_military_education_desc:0	"In der Tschechoslowakei der Vorkriegszeit waren mehrere Militärschulen und -akademien in Betrieb, die stark von der französischen Militärmission beeinflusst waren."
CZE_military_education_tooltip_reward:0	" \n Wahl zwischen drei §Ymilitärbezogenen§! §Ynationalen Konzepten§!."
CZE.207.t:0	" Geschichte der militärischen Ausbildung in der Tschechoslowakei"
CZE.207.d:0	"Im Rahmen der französischen Militärmission wurde am 1. November 1921 in Prag eine neue Kriegsakademie für Offiziere (später bekannt als Vysoká škola Válečná – VŠV) des Generalstabs gegründet. Es war der Militärakademie in Paris nachempfunden, weshalb die Prager Militärakademie in tschechischen Kreisen oft als "kleine Schwester" bezeichnet wurde. Dank des außerordentlichen Engagements der französischen Militärmission erreichte das Ausbildungsniveau schnell das Niveau ähnlicher Schulen aus dem Ausland, die oft auf eine viel längere Tradition zurückblicken konnten.\n\nDie endgültige Form der VŠV in der Zwischenkriegszeit wurde 1934 festgelegt, und General Mikuláš Doležal war bis zur Besetzung 1939 ihr letzter Kommandant. Die Nazis richteten ihn 1941 wegen seiner Beteiligung an der Untergrund-Widerstandsorganisation "Obrana Národa" hin. \n\nWährend ihres gesamten Bestehens schlossen insgesamt 577 Offiziere (darunter 22 Litauer) die Hochschule ab, und 2 69 Generäle und hochrangige Kommandeure der tschechoslowakischen Armee nahmen an den Fortbildungskursen teil.\n\nDen Bereich der höheren Bildung vertrat die Militärakademie (Vojenská Akademie – VA) in Hranice. Sie wurde am 3. Januar 1920 gegründet, und ihre Aufgabe bestand darin, Offiziere (Leutnants) für alle Teilstreitkräfte der tschechoslowakischen Armee auszubilden. Bis 1938 absolvierten Tausende von Offizieren, darunter viele zukünftige Generäle, die Akademie.\n\nDie mittlere Bildungsebene wurde durch Schulen für Reserveoffiziere (Školy Důstojníků v Záloze (ŠDZ)) repräsentiert, , die als Teil der Divisionshauptquartiere organisiert waren und die Ausbildung und Schulung von Offizieren in den unteren Kommandopositionen sicherstellten.\n\nMilitärspezialisten wurden in speziellen Militärschulen ausgebildet, darunter Infanterie, Artillerie, Luftfahrt, Kavallerie, Pionierwesen, Telegrafie, Waffen und seit 1933 auch die Schule für Panzertruppen (Škola Útočné Voz by). Absolventen spezieller Unteroffiziersausbildungsprogramme verstärkten das Unteroffizierskorps."
CZE.207.a:0	"Neue Militärkurse an der Kriegsakademie eröffnen."
CZE.207.b:0	"Die Ausbildungskapazität der Militärakademie erhöhen."
CZE.207.c:0	"Unteroffiziersausbildungsprogramme ausweiten. "
CZE_generals_idea:0	"Kurse an der Kriegsakademie."
CZE_generals_idea_desc:0	"An der Kriegsakademie werden neue Vorlesungen für höhere Offiziere angeboten."
CZE_officers_idea:0	"Absolventen der Kriegsakademie."
CZE_officers_idea_desc:0	"Neue Offiziere haben die Akademie abgeschlossen."
CZE_ncos_idea:0	"Ausgebildetes Unteroffizierskorps "
CZE_ncos_idea_desc:0	"Ausbildungsprogramme für das Unteroffizierskorps gestartet."
CZE_border_brigades:0	"Grenzbrigaden bilden"
CZE_border_brigades_desc:0	"Wir müssen gut ausgebildete Garnisonregimenter für unsere schwer befestigten Grenzobjekte bilden."
CZE_border_brigades_tooltip_reward:0	 "\n §OSonderbonus:§! Neue Divisionsvorlage (§YHraničářská Brigáda§! – Elite-Garnisonsbrigade)."
CZE.208.t:0	"Gründung von Grenzregimentern"
CZE.208.d:0	"Die tschechoslowakische Armee verfügte zwischen 1918 und 1939 über keine echten Elitedivisionen. Die militärische Einheit, die Elitetruppen am ehesten ähnelte, waren die Grenzregimenter, die die schweren Befestigungsanlagen bemannen sollten.\n\nDie ersten Grenzregimenter (auf Tschechisch "Hraničářské Pluky" genannt) wurden im Sommer [GetDateText] aus den Wachbataillonen gebildet, die die neu errichteten Befestigungsanlagen entlang der deutschen Grenze sichern und schützen sollten. Die bestehenden Einheiten mussten durch zusätzliche Männer verstärkt werden, die größtenteils aus Infanterieregimentern sowie den Pionier-, Artillerie- und Fernmeldebataillonen stammten.\n\nNur die körperlich fitesten Soldaten für den Dienst in den Grenzregimentern ausgewählt, und alle Mitglieder mussten ausgezeichnete Schützen sowohl mit Gewehren als auch mit Maschinengewehren sein.\n\nDer entscheidende Faktor war jedoch die Loyalität gegenüber dem Staat. Die überwiegende Mehrheit der Männer in den Grenzregimentern war tschechoslowakischer Nationalität, d. h. Tschechen oder Slowaken, da die Zuverlässigkeit von Soldaten anderer Nationalitäten nicht immer garantiert werden konnte. Es gab jedoch Ausnahmen.\n\nGeeignete Kandidaten mussten eine anspruchsvolle Ausbildung im Umgang mit verschiedener Ausrüstung absolvieren, darunter die Panzerabwehrkanone vz. 36, Maschinengewehre und anderer Ausrüstung, die in schweren Befestigungsanlagen zum Einsatz kam.\n\nDie Angehörigen der Grenztruppen trugen eine besondere militärische Schulterklappe mit einem Hundekopf und der Nummer ihres Regiments in einem Dreieck."
CZE.208.a:0	"Bildung von Grenzbrigaden."
CZE_mobile_army:0	"Schnelle Divisionen bilden"
CZE_mobile_army_desc:0	"Die tschechoslowakische Armee hatte Pläne zur Motorisierung, doch leider bedeuteten die enormen Kosten für die Befestigungsarbeiten, dass das Budget für die Anschaffung neuer Lastwagen begrenzt war."
CZE_mobile_army_tooltip_reward:0	"\n §OSonderbonus:§! Neue Divisionsvorlage (§YRychlá Divize§! – Leichte Panzerdivision)."
CZE.209.t:0	"Tschechoslowakische schnelle Divisionen"
CZE.209.d:0	"Schnelle Divisionen wurden im Herbst 1937 innerhalb der tschechoslowakischen Streitkräfte für Operationen und Einsätze geschaffen, die Schnelligkeit, Wendigkeit und große Schlagkraft erforderten. Sie wurden auf der Grundlage zeitgenössischer Vorstellungen vom strategischen Einsatz von Kavallerie-, motorisierten und mechanisierten Einheiten gebildet, die entsprechend an die tschechoslowakischen Verhältnisse angepasst wurden. Es handelte sich um die letzte Umstrukturierung der mobilen Einheiten im Tschechoslowakei der Zwischenkriegszeit.\n\nDie bestehenden Kavalleriebrigaden (Jezdecké Brigády) und Panzerbrigaden (Brigády Útočné Vozby) wurden in die neu geschaffenen Schnellen Divisionen eingegliedert. \n\nVor der Besetzung der Tschechoslowakei wurden nur vier Divisionen gebildet, die jeweils einem der regionalen Militärhauptquartiere in Prag (1.), Brünn (2.), Bratislava (3.) und Pardubice (4.). Die 1., 2. und 4. Schnellen Divisionen wurden bis Juli 1939 aufgelöst, während die 3. Division für die neu gegründete unabhängige slowakische Armee einsatzbereit blieb. \n\nDie leichten Panzer LT. vz. 35 waren die Arbeitspferde der schnellen Divisionen, wobei sich rund 300 Panzer auf die 1., 2. und 3. Division verteilten. Die Deutschen erbeuteten 244, 52 Panzer wurden in die Slowakei überführt, wobei zwei davon später während des kurzen slowakisch-ungarischen Krieges im März 1939 von ungarischen Truppen erbeutet wurden."
CZE.209.a:0	"Schnelle Divisionen bilden"
CZE_new_doctrines:0	" "Neueste Militärdoktrinen studieren"
CZE_new_doctrines_desc:0	"Die tschechoslowakische Armee muss die neuesten Trends in den Militärdoktrinen übernehmen und moderne Ausbildungsmethoden sowie eine moderne Einheitsorganisation einführen."
CZE_military_science_institute:0	"Militärwissenschaftliches Institut"
CZE_military_science_institute_desc:0	" Das Tschechoslowakische Institut für Militärwissenschaften (Vědecký Ústav Vojenský – VÚV) wurde in den 1920er Jahren aus den ehemaligen Strukturen der Wissenschaftlichen Vereinigung tschechoslowakischer Offiziere gegründet."
CZE_military_science_institute_tooltip_reward:0	"\n§YForschung§! im Zusammenhang mit §Yder nationalen Idee§!."
CZE.210.t:0	"Tschechoslowakisches Institut für Militärwissenschaften"
CZE.210.d:0	"Das Tschechoslowakische Institut für Militärwissenschaften (Vědecký Ústav Vojenský – VÚV) wurde in den 1920er Jahren aus den ehemaligen Strukturen der Wissenschaftlichen Vereinigung tschechoslowakischer Offiziere gegründet. Es änderte mehrmals seinen Namen, war aber schließlich als VÚV bekannt. Das Institut spielte eine entscheidende Rolle bei der Entwicklung von Strategie und Theorie für die tschechoslowakische Armee und das Ministerium für Nationale Verteidigung. Die Vereinigung tschechoslowakischer Offiziere bestand als Verlag weiter und diente als Plattform für den Austausch von Ideen und Meinungen zu militärischen und politischen Themen.\n\nTschechoslowakische Generäle der Vorkriegszeit waren für ihre Veröffentlichungen bekannt, und viele von ihnen verfassten Bücher zu militärischen und politischen Themen. Keine dieser Veröffentlichungen erlangte jedoch die Bedeutung oder das Ansehen von Guderians "Achtung – Panzer!". \n\nGeneral Silvestr Bláha, Leiter des Militärbüros des Präsidenten, bekleidete seit 1932 auch das Amt des Direktors des Militärforschungsinstituts und war für seine umfangreichen publizistischen Aktivitäten bekannt."
CZE.210.a:0	"Aufstockung der Mittel für das Institut für Militärwissenschaften"
CZE_military_science_institute_idea:0	"Institut für Militärwissenschaften"
CZE_military_science_institute_idea_desc:0	"Sicherung der Mittel für das Institut für Militärwissenschaften."
CZE_armament_program:0	"Einleitung eines Rüstungsprogramms"
CZE_armament_program_desc:0	"Die ungünstige materielle Lage der Armee zwang die Regierung, sich ernsthaft mit diesem Thema auseinanderzusetzen. Nach komplexen Verhandlungen beschloss sie schließlich 1936 die Verabschiedung des Rüstungsprogramms, das Prioritäten festlegte und Fristen für die Lieferung verschiedener Ausrüstungsgegenstände bestimmte."
CZE_armament_program_tooltip_reward:0	"\n§YWirtschaftsrecht§! ODER §YPolitische Macht§!."
CZE.211.t:0	"Rüstungsprogramm einleiten"
CZE.211.d:0	"Das Rüstungsprogramm für die tschechoslowakische Armee wurde zu einem wichtigen Thema während einer kollektiven Sicherheitskrise in Europa nach der Remilitarisierung des Rheinlandes durch Deutschland im Jahr 1936. \n\nIm Frühjahr 1936 erarbeitete das Verteidigungsministerium die Anforderungen und Einzelheiten des vorgeschlagenen Rüstungsprogramms. Das Ergebnis war das größte und finanziell aufwendigste Investitionsprojekt der Militärverwaltung seit der Gründung der Republik im Jahr 1918. Das genehmigte Programm legte die Prioritäten für Waffen und anderes Material sowie den Zeitplan für deren Lieferungen fest. \n\nLeider stellte sich schon bald heraus, dass die geplanten Fristen nicht eingehalten werden konnten, und bis Ende 1938 konnten nur 32 % der im Rüstungsprogramm vorgesehenen Lieferungen erfüllt werden.\n\nDennoch verbesserten die Modernisierungsbemühungen die Fähigkeiten der tschechoslowakischen Streitkräfte erheblich. Schätzungen zufolge machten die Verteidigungsausgaben 1937 fast 10 % des BIP des Landes aus, und 1938 lag dieser Anteil bei fast 15 % des BIP.\n\nDie II. Abteilung (Artillerie und ) des Verteidigungsministeriums und dessen Leiter, General Jan Netík, hatten großen Einfluss auf den Umfang und die Umsetzung des Rüstungsprogramms."
CZE.211.a:0	"Rüstungsprogramm genehmigen."
CZE_czechoslovak_firearms:0	"Infanterieausrüstung modernisieren"
CZE_czechoslovak_firearms_desc:0	"Obwohl die Tschechoslowakei jahrzehntelang ein bedeutender Waffenexporteur war, führte die Armee neue moderne Infanteriewaffen nur sehr langsam ein. Sobald das Wiederaufrüstungsprogramm jedoch begann, wurden große Aufträge für Gewehre und moderne Maschinengewehre erteilt. "
CZE_czechoslovak_firearms_tooltip_reward:0	"\n Wahl zwischen §YInfanterieausrüstung§! oder §YUnterstützungsausrüstung§! im Zusammenhang mit §YForschungsbonus§!."
CZE_R56_firearms_deliveries:	 "Waffenlieferungen"
CZE_R56_firearms_deliveries_desc:	"Die Tschechoslowakei war ein bedeutender Waffenexporteur, und die heimische Produktion konnte zuvor den gesamten Bedarf der tschechoslowakischen Streitkräfte problemlos decken. Doch als die Bestellungen der Armee zunahmen, mussten die bestehenden Fabriken erweitert werden."
CZE_R56_secure_armament_contracts:	 "Sichere Rüstungsaufträge"
CZE_R56_secure_armament_contracts_desc:	" Die Tschechoslowakei verließ sich traditionell auf einheimische Firmen, um die Armee mit Ausrüstung und Nachschub zu versorgen. Sowohl Škoda als auch ČKD exportierten moderne Waffen in die ganze Welt, doch vor 1936 gab es für die tschechoslowakische Führung keinen Anreiz, die Ausrüstung der Streitkräfte zu modernisieren."
CZE_R56_order_military_trucks:	"Militärlastwagen bestellen"
CZE_R56_order_military_trucks_desc:	" Die tschechoslowakische Armee hatte Pläne für eine stärkere Motorisierung. Leider bedeuteten die enormen Kosten für Befestigungsarbeiten, dass das Budget für die Beschaffung neuer Lastwagen begrenzt war."
CZE.212.t:0	"Tschechoslowakische Feuerwaffen"
CZE.212.d:0	"Obwohl die Tschechoslowakei über ein Jahrzehnt lang ein bedeutender Waffenexporteur war, führte die tschechoslowakische Armee neue moderne Infanteriewaffen erst 1936 ein. Das änderte sich jedoch, als das Wiederaufrüstungsprogramm eingeleitet wurde und große Aufträge für Gewehre und moderne Maschinengewehre erteilt wurden. Zur Zeit des Münchner Abkommens verfügte die Tschechoslowakei über eine der am besten ausgerüsteten Armeen der Welt und angeblich über die höchste Anzahl an automatischen Waffen pro Soldat (1/7).\n\nDas Gewehr vz.24, das auf dem bewährten Mauser-Design (7,92 mm) basierte, war die Standardwaffe der Infanterie der tschechoslowakischen Armee und später auch der SOS-Einheiten (Staatliche Verteidigungsgarde). Es wurde von Zbrojovka Brno und von [GetDateText] hergestellt, 762.000 Gewehre vom Typ vz. 24 standen mit 424,9 Millionen Schuss Munition für die Mobilmachung bereit, weitere 141,7 Millionen wurden von der ŘOP zur Lagerung in Grenzbefestigungen vorrätig gehalten.\n\nDer Vorläufer des berühmten Bren-Maschinengewehrs, das ZB vz. 26 (7,92 mm), war die Standardwaffe sowohl für Infanterieunterstützungseinheiten als auch für leichte und schwere Befestigungen. Basierend auf dem Entwurf von V. Holek aus den frühen 1920er Jahren wurde das Gewehr oder dessen Lizenzproduktion in mehrere Länder exportiert, darunter Großbritannien und China. Bis 1936 standen der Armee 34.557 Waffen zur Verfügung, und mehrere Tausend wurden für Befestigungsanlagen bestellt.\n\nDas schwere Maschinengewehr TK vz. 37 war eine Weiterentwicklung des zuvor verwendeten vz. 35. Es wurde als Truppunterstützungswaffe, als mitgeführtes Maschinengewehr für Panzer und andere gepanzerte Fahrzeuge sowie an festen Stellungen innerhalb der tschechoslowakischen tschechoslowakischen Grenzbefestigungen. Wie andere tschechische Waffen verwendete auch dieses Modell 7,92-mm-Munition, um die Versorgung und Lagerung in schweren Festungen zu erleichtern. Eine lizenzierte Version dieser Waffe wurde im Vereinigten Königreich als Besa-Maschinengewehr hergestellt.\n\nAus irgendeinem Grund war die Armeeführung nicht daran interessiert, Maschinenpistolen einzuführen , obwohl ein moderner Prototyp einer Waffe, die später als Samopal vz. 38 bekannt wurde, bereits seit 1937 existierte.\n\nFast die gesamte Ausrüstung wurde nach der Besetzung 1939 von den Deutschen "gekauft" (gestohlen) und könnte nach vorsichtigen Schätzungen hätte damit etwa die Hälfte der Wehrmacht ausgerüstet werden können. Ein Großteil der erbeuteten modernen Ausrüstung wurde an SS-Divisionen ausgegeben."
CZE.212.a:0	"Standardwaffen modernisieren."
CZE.212.b:0	" Schwere Maschinengewehre bestellen."
CZE_holek_brothers:0	"Entwicklung neuer Feuerwaffen"
CZE_holek_brothers_desc:0	"Die Brüder Holek entwickelten während ihrer Tätigkeit bei der Firma Zbrojovka Brno die fortschrittlichsten tschechischen Feuerwaffen, die weltweit lizenziert wurden."
CZE_holek_brothers_tooltip_reward:0	"\nFeuerwaffenbezogen §YTheoretiker§!."
CZE.213.t:0	"Die Brüder Holek"
CZE.213.d:0	"Die meisten tschechischen Feuerwaffen der Vorkriegszeit wurden von einer einzigen Familie von Waffenkonstrukteuren entworfen – den Brüdern Holek. \n\nDer älteste der Brüder, Václav Holek, spezialisierte sich auf Maschinengewehre und entwarf die Vorlagen für die von den Briten lizenzierten Bren- und BESA-Gewehre.\n\nDer jüngere Emanuel Holek entwarf mehrere halb , darunter das ZH-29, das von der chinesischen Nationalen Revolutionsarmee eingesetzt wurde.\n\nDer jüngste, František Holek, entwarf zwar keine bestimmte Waffe, doch seine technischen Fähigkeiten halfen dem Trio, viele ihrer Entwürfe in die Serienproduktion bei Zbrojovka Brno zu bringen. \n\nLeider unterbrach der Zweite Weltkrieg die vielversprechenden Karrieren der Brüder; obwohl ihre Söhne und Enkel das Familienerbe weiterführten, beschränkten sich die Entwürfe auf Jagd- und Sportgewehre."
CZE.213.a:0	"Bestellung neuer Feuerwaffenprototypen."
CZE_armament_1:0	"Lieferungen von Feuerwaffen und Munition"
CZE_armament_1_desc:0	"Die Tschechoslowakei war ein bedeutender Waffenexporteur, und die heimische Produktion konnte vor 1936 den gesamten Bedarf der tschechoslowakischen Streitkräfte problemlos decken. Doch als die Aufträge der Armee zunahmen, mussten die bestehenden Fabriken erweitert werden. "
CZE_armament_1_tooltip_reward:0	"\n§YRüstungsindustrie§! und §YInfanterieausrüstung§! – damit verbundener Bonus."
CZE.214.t:0	"Sichere Waffenlieferungen"
CZE.214.d:0	"In den 1930er Jahren wurden tschechoslowakische Waffen weltweit verkauft und exportiert, hauptsächlich an die Kleine Entente (Rumänien und Jugoslawien) sowie an baltische, lateinamerikanische und asiatische Länder. Die Tschechoslowakei gehörte lange vor dem Zweiten Weltkrieg zu den sechs bedeutendsten Waffenexporteuren der Welt.\n\nLange Zeit konnte die tschechoslowakische Industrie sowohl den heimischen Bedarf der Armee decken als auch beträchtliche Mengen an Kriegsmaterial exportieren. Als das Verteidigungsministerium jedoch den Bedarf an Waffen und Munition erhöhte, fehlte den großen tschechoslowakischen Unternehmen die erforderliche Produktionskapazität. Diese musste durch den Bau neuer Fabriken erweitert werden. \n\nČeská Zbrojovka gründete 1936 eine neue Niederlassung in der kleinen mährischen Stadt Uherský Brod, und die neue Fabrik wurde innerhalb von 16 Wochen nach der ersten Entscheidung errichtet. ČZUB stellte eine große Vielfalt an Handfeuerwaffen her, darunter einige berühmte Nachkriegswaffen . \n\n1936 verlegte Sellier & Bellot die gesamte Produktion nach Vlašim, wo seit 1934 ein neuer Komplex im Bau war. Als 1938 ein neuer Auftrag vom Verteidigungsministerium einging, wurde beschlossen, ein neues S & B-Werk in Porúbka in der Slowakei zu errichten. Das Projekt wurde jedoch durch die Unterzeichnung des Münchner Abkommens gestoppt. \n\nDie Eskalation des chinesisch-japanischen Konflikts war ein Glücksfall für tschechoslowakische Unternehmen, insbesondere für Česká Zbrojovka. Britischen Aufzeichnungen zufolge stammte mehr als die Hälfte der Maschinengewehre, die Ende 1938 über Hongkong nach China gelangten, aus der Tschechoslowakei (etwa ein Drittel bei den Infanteriegewehren).\n\nDarüber hinaus erhielt Sellier & Bellot 1937 Aufträge über 200 Millionen Patronen des Kalibers 7,92 mm Mauser aus China; der Vertrag war jedoch vor Ausbruch des Krieges noch nicht erfüllt worden."
CZE.214.a:0	 "Česká Zbrojovka erweitern."
CZE.214.b:0	"Sellier & Bellot erweitern."
CZE_zbrojovka:0	"S & B"
CZE_zbrojovka_desc:0	"Moderne Munitionsfabrik in Vlašim – Böhmen."
CZE_armament_2:0	" Rüstungsaufträge sichern"
CZE_armament_2_desc:0	"Die Tschechoslowakei verließ sich traditionell auf einheimische Firmen, um die Armee mit Ausrüstung und Nachschub zu versorgen.\n\nSowohl Škoda als auch CKD exportierten moderne Waffen in die ganze Welt, doch vor 1936 gab es für die tschechoslowakische Führung keinen Anreiz, die Ausrüstung der Streitkräfte zu modernisieren. "
CZE_armament_2_tooltip_reward:0	"\n§YRüstungsindustrie§! und §YRüstungsproduktion§! im Zusammenhang mit §YNationalidee§!."
CZE.215.t:0	"Verträge der Rüstungsindustrie"
CZE.215.d:0	"Die Tschechoslowakei verließ sich traditionell auf inländische Firmen, um die Armee mit Ausrüstung und Nachschub zu versorgen.\n\nSowohl Skoda und CKD exportierten moderne Waffen in die ganze Welt, darunter einige der fortschrittlichsten Panzer, Haubitzen und Gebirgsgeschütze. Vor 1936 gab es für die tschechoslowakische Führung jedoch keinen Anreiz, die Ausrüstung der Streitkräfte zu modernisieren.\n\nMit der Besetzung des Rheinlandes im Frühjahr 1936 änderte sich alles, und im Rahmen des Rüstungsprogramms begannen Modernisierungsbemühungen. Mit fast jedem Unternehmen der Rüstungsindustrie wurden Verträge über neue Ausrüstung unterzeichnet.\n\nDas ursprüngliche Rüstungsprogramm wurde ausgeweitet, und es war geplant, dass die Armee bis 1942 mit 1050 Panzern, 2420 Feldgeschützen, 680 Mörser, 1740 Panzerabwehrkanonen, fast 700 Flugabwehrkanonen und 850 Flugzeuge ausgestattet sein sollte.\n\nNach Schätzungen des Verteidigungsministeriums lag die Produktionskapazität der tschechoslowakischen Rüstungsindustrie im Jahr 1938 bei etwa 40.000 Gewehren, 3.000 Maschinengewehren, 130 Feldgeschützen, 50–60 Panzern und 100 Flugzeuge pro Monat. \n\nŠkoda und CKD hatten in der Regel eine Kartellvereinbarung, sodass alle Aufträge im Allgemeinen zwischen beiden Unternehmen und ihren Tochtergesellschaften aufgeteilt wurden, aber es mussten Prioritäten gesetzt werden."
CZE.215.a:0	"Neuen Aufträgen für Feldgeschütze Vorrang einräumen."
CZE.215.b:0	"Neuen neue Panzeraufträge priorisieren."
CZE_skoda_works:0	"Škoda-Werke"
CZE_skoda_works_desc:0	"Die Škoda-Werke waren einer der größten europäischen Industriekonzerne des 20. Jahrhunderts."
CZE_ckd_company:0	"ČKD "
CZE_ckd_company_desc:0	"ČKD war eines der größten Maschinenbauunternehmen in der ehemaligen Tschechoslowakei."
