CZE_czechoslovak_industry_dynamic_modifier:	"The Workshop of Central Europe"
CZE_czechoslovak_airforce_modifier:	"[ROOT.GetAdjective] Luftwaffe"
CZE_czechoslovak_airforce_modifier_desc:	"Československé letectvo, die tschechoslowakische Luftwaffe, ist die wichtigste Luftverteidigungskraft von [CZE.GetNameDef]."
CZE_r56_outdated_airforce_research_facilities:	" Veraltete Luftfahrtforschungsanlagen"
CZE_czechoslovak_army_modifier:	"[ROOT.GetAdjective] Armee"
CZE_czechoslovak_army_modifier_desc:	"Československá Branná Moc, die Streitkräfte der Tschechoslowakei, haben die Aufgabe, unser Land vor ausländischen Mächten zu schützen. "
CZE_economic_inequality_idea:	"Wirtschaftliche Ungleichheit"
CZE_economic_inequality_idea_desc:	"Die Weltwirtschaftskrise, die verspätete Abkehr der Regierung vom Goldstandard und der Laissez-faire-Ansatz in der Wirtschaftsentwicklung führten zu einem erheblichen Ungleichheitsproblem, wobei sich der Großteil des Reichtums in den mittelböhmischen Regionen konzentrierte, was die Radikalisierung der Sudetendeutschen anheizte und Ressentiments unter Slowaken und Ungarn schürte. Erschwerend kam hinzu,hat das Sudetenland mit einer schweren Arbeitslosenkrise zu kämpfen, wobei die Zahl der arbeitslosen Sudetendeutschen bis zu fünfmal so hoch ist wie die der Tschechen in den böhmischen und mährischen Regionen."
CZE_slovak_autonomists_idea:	"Slowakische Autonomisten"
CZE_slovak_autonomists_idea_desc:	""
