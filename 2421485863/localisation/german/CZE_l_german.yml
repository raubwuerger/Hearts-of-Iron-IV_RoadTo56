CZE_democratic_reforms:0	"Autonomie für das Sudetenland vorbereiten "
CZE_democratic_reforms_desc:0	"Die Zeit ist gekommen, die Minderheitenfrage in der Tschechoslowakei endgültig zu lösen und eine gewisse Autonomie der von ethnischen Deutschen besiedelten Regionen vorzubereiten, bevor die internen ethnischen Konflikte die Republik verschlingen."
CZE_democratic_reforms_tooltip:0	""Verfassungsreformen" sind abgeschlossen."
CZE_democratic_reforms_tooltip_reward:0	"\n §YPolitisch§! bedingte §Yvorübergehende nationale Idee§! erforderlich, um die deutsch-ethnische Frage verfassungsrechtlich zu lösen ."
CZE.406.t:0	"Sudetenkrise abwenden "
CZE.406.d:0	"Seit der Gründung der Tschechoslowakei im Jahr 1918 sah sich die bedeutende deutsche Minderheit extremer Unterdrückung und der Verweigerung des Wahlrechts ausgesetzt. Die meisten argumentierten, dass das Sudetenland mit seiner überwältigenden ethnisch deutschen Mehrheit und seiner überaus ausgeprägten Kultur und seinem wirtschaftlichen Potenzial seine politischen Angelegenheiten autonom regeln sollte.\n\nDie tschechoslowakische Regierung lehnte jegliche Idee einer Autonomie für die Sudetendeutschen konsequent ab, da es verheerende Auswirkungen gehabt hätte, fast einem Drittel des Landes Autonomie und die Kontrolle über eines der wichtigsten Industriezentren zu gewähren. Die Sudetendeutschen reagierten darauf mit zunehmender politischer Radikalisierung.\n\nDer damit einhergehende Aufstieg des pangermanischen Adolf Hitlers in Deutschland im Jahr 1933, mit seiner Rhetorik von der Vereinigung aller Deutschen in ganz Europa gegen die Perfidie und die " Unterdrückung" durch die Slawen, zog die Sudetendeutschen stark in Richtung rassistischer und rechtsextremer Nationalismus. Die überwiegende Mehrheit der Sudetendeutschen forderte rasch fast vollständige Autonomie oder sogar Unabhängigkeit von der Tschechoslowakei und einen möglichen Anschluss an das Dritte Reich. Die führende Speerspitze der pangermanistischen Bewegung war die Sudetendeutsche Partei (SdP) von Konrad Henlein. \n\nDas friedliche Zusammenleben zwischen Tschechen und Deutschen in der Tschechoslowakei war stets eine Angelegenheit eines relativ kleinen Teils der deutschen und tschechischen Bevölkerung unter der Führung einzelner Politiker. In der angespannten Zeit Anfang 1938 verschärften Wellen extremen Nationalismus auf beiden Seiten die Lage.\n\nEs sei angemerkt, dass die von der tschechoslowakischen Regierung Ende 1938 gemachten Zugeständnisse für die Sudetendeutschen höchstwahrscheinlich ausreichend gewesen wären, wären sie vor 1938 umgesetzt worden.\n\nLeider kamen die Reformen und Entwürfe für Autonomiegesetze zu einem Zeitpunkt, an dem es kein Zurück mehr gab, und konnten nichts mehr ändern. Hitler war entschlossen, die Tschechoslowakei zu zerstören, und Henleins SdP sowie der eskalierte ethnische Konflikt waren entscheidend für seine Pläne."
CZE.406.a:0	"Bereitet die Verfassungsreformen vor."
CZE_constitutional_reforms:0	" Verfassungsreform."
CZE_constitutional_reforms_desc:0	"Die Autonomie des Sudetenlandes wird vorbereitet, und die neuen Verfassungsreformen und Gesetze werden umgesetzt."
CZE_constitutional_reforms_flag:0	"Neue Verfassungsreformen"
CZE_boycott_press_law:0	"Boykott der Änderung des Pressegesetzes"
CZE_boycott_press_law_desc:0	"Obwohl die Tschechoslowakei ein demokratischer Staat war, entwickelte sie sich durch mehrere umstrittene Rechtsnormen allmählich zu einer autoritären Demokratie. Ein solches Gesetz war das sogenannte "Kleine Pressegesetz" ; Gesetz Nr. 126/1933."
CZE_boycott_press_law_tooltip_reward:0	"\n Wahl zwischen zwei Arten von §Ypolitischen§! Belohnungen."
CZE.407.t:0	"Gesetz Nr. 126/1933 – Kontroverse"
CZE.407.d:0	"Angesichts des aufkommenden politischen Extremismus erließ die Tschechoslowakei 1923 zum Schutz der Republik ein Staatsverteidigungsgesetz, das subversive Handlungen unter Strafe stellte.\n\nAuf der Grundlage dieses Gesetzes konnten die tschechoslowakischen Behörden die Veröffentlichung von Zeitschriften aussetzen, den Vertrieb von Druckschriften, die die verfassungsmäßige Integrität sowie das republikanische und demokratische System der Tschechoslowakei untergruben, aussetzen und Materialien obszöner Natur verbieten.\n\nDie Zensur wurde durch das Gesetz Nr. 126/1933, das sogenannte sogenannten "Kleinen Pressegesetzes". Es wurde als "klein" bezeichnet, da es sich um eine Ergänzung der ursprünglichen Pressegesetze handelte, die noch aus der Zeit der österreichisch-ungarischen Monarchie stammten.\n\nIn Verbindung mit dem später verabschiedeten Gesetz Nr. 201/1933 (Auflösung und Aussetzung der Tätigkeit politischer Parteien) und dem Gesetz Nr. 131/136 (Staatsverteidigungsgesetz) verfügte die Regierung über alle Mittel, um sowohl deutsche Nationalisten als auch die Kommunistische Partei zu unterdrücken. \n\nDie Tschechoslowakei verfolgte dieses Konzept einer autoritären Demokratie, um gute Beziehungen zu ihren Verbündeten in Europa zu knüpfen, die Innenpolitik und das politische System zu festigen und eine starke Verteidigung gegen Nazideutschland aufzubauen.\n\nEs überrascht nicht, dass alle nicht-tschechischen politischen Parteien die Änderung des Pressegesetzes heftig kritisierten, da die Regierung häufig deutsche, slowakische und ungarische Presse zensierte. \n\nDie SdP und die Kommunistische Partei bildeten jedoch während der Parlamentsdebatten ein ungewöhnliches Bündnis, da auch die kommunistische Presse oft zensiert wurde. Mehrfach suspendierte die Regierung die offizielle Parteizeitung "Rudé Právo" (Unsere Roten Rechte)."
CZE.407.a:0	"Politische Behinderungen. "
CZE.407.b:0	"Aufruf zu Demonstrationen."
