CZE_state_defense_guard:0	"Gründung einer staatlichen Verteidigungsgarde"
CZE_state_defense_guard_desc:0	" Die Staatsverteidigungsgarde war ein 1936 gegründeter Militärdienst zum Schutz der Grenzen der Tschechoslowakei. Mitglieder der Garde waren örtliche Polizisten, bestehende Finanzwächter und Angehörige der Staatspolizei; später wurden auch loyale Bürger aufgenommen."
CZE_state_defense_guard_tooltip_reward:0	 "\n\n§YAnti-Partisanen§! im Zusammenhang mit §YNationaler Idee§! und §YMilitär Polizei§! bezogene §YForschungsboni§!."
CZE.408.t:0	 "Die Gründung der Staatsverteidigungsgarde"
CZE.408.d:0	"Von 1918 bis 1936 wurde die Grenze der Tschechoslowakei von der "Finanzgarde" geschützt, einem bewaffneten Zweig des Finanzministeriums. Ihre Hauptaufgabe bestand in der Erhebung von Zöllen; der Grenzschutz war zweitrangig. Seit über einem Jahrzehnt hatten die Führung der Armee und der Polizei vorgeschlagen, eine Organisation von höherem militärischem Wert zu gründen. Inmitten internationaler Spannungen richtete die Tschechoslowakei 1937 den neuen Dienst ein.\n\nDie Staatsverteidigungsgarde (auf Tschechisch Straz obrany statu, SOS) war ein im Oktober 1936 gegründeter Militärdienst zum Schutz der Grenzen der Tschechoslowakei. Die neu gegründete Verteidigungsgarde hatte drei Hauptaufgaben: den Schutz der Grenze, die Aufrechterhaltung von Ordnung und Rechtsstaatlichkeit sowie die Unterstützung bei der Erhebung von Zöllen.\n\nMitglieder der Garde waren örtliche Polizisten, bestehende Finanzwächter sowie Angehörige der Staatspolizei. Später wurden auch der Tschechoslowakei loyale Bürger einbezogen (zum Beispiel viele Mitglieder der Sportorganisation Sokol oder aktive antifaschistische Deutsche). Die Regierung plante, die Wache mit Einheiten der regulären Armee zu unterstützen, um lokale Konflikte zu bewältigen. \n\nDie geplante Stärke der Truppe betrug 38 Bataillone, doch nur 31 waren aufgestellt worden (eines davon in Prag). Ihre Ausrüstung bestand aus Pistolen, Gewehren, leichten Maschinengewehren und Granaten. \n\nAls die Spannungen zwischen der Tschechoslowakei, den lokalen Deutschen und Nazideutschland zunahmen, wurde die Garde im Mai 1938 an der Grenze stationiert und blieb dort bis September, als die Alliierten das Sudetenland an Deutschland abtraten. Im September führte die Garde Kleinkrieg gegen lokale deutsche Partisanen (Sudetendeutsche Freikorps) und Kommandos aus Deutschland. Nach dem Verlust des Grenzgebiets rückte die SOS ins Landesinnere auf neue Stellungen vor. Zu Zusammenstößen kam es weiterhin, jedoch in geringerem Ausmaß.\n\nInsgesamt 312 Mitglieder der Verteidigungsgarde verloren während der Existenz des Dienstes zwischen 1936 und 1939 ihr Leben."
CZE.408.a:0	"Gründung der Staatsverteidigungsgarde"
CZE_sos:0	"Staatliche Verteidigungsgarde"
CZE_sos_desc:0	"Die Staatliche Verteidigungsgarde wurde gegründet und bewacht die Grenzen der Tschechoslowakei."
CZE_national_unity_government:0	"Gründung der Partei der Nationalen Einheit"
CZE_national_unity_government_desc:0	"Die Partei der Nationalen Einheit wurde im November 1938 nach der deutschen Besetzung als eine Art letzter Versuch gegründet, die Tschechoslowakei zu retten.\n\nSie umfasste fast alle Mitte-Rechts-Parteien und die Tschechoslowakische Nationalsozialistische Partei."
CZE_national_unity_government_tooltip_trigger:0	"§YDie Konferenz von Jalta§! fand nicht statt"
CZE_national_unity_government_tooltip_reward:0	"\n §OBesonderer Bonus:§! Hebt §YMinderheiten-Malusse§! auf, ändert §YRegierung§!."
CZE.409.t:0	"Partei der Nationalen Einheit gegründet"
CZE.409.d:0	"In der Hoffnung, die Deutschen nach dem Münchner Abkommen zu beschwichtigen, versammelte Rudolf Beran die meisten nicht-sozialistischen Parteien des Landes in der Partei der Nationalen Einheit, deren Vorsitzender er selbst war. Außerdem unterwarf er die Presse einer strengen Zensur. Er setzte jedoch die langjährigen Forderungen der Slowaken und Ruthenen nach Autonomie durch. Keine dieser Maßnahmen reichte jedoch aus, um die Abspaltung der Slowakei am 14. März oder die Besetzung des restlichen Landes durch Deutschland einen Tag später zu verhindern. Anschließend war er bis zu seinem Rücktritt am 27. April 1939 der erste Ministerpräsident des Protektorats Böhmen und Mähren.\n\nNach dem Krieg wurde Beran von den kommunistischen Behörden als Kollaborateur verhaftet und in einem manipulierten politischen Prozess zu zwanzig Jahren Haft verurteilt. Er starb 1954 im Gefängnis von Leopoldov."
CZE.409.a:0	"So sei es."
CZE_national_unity_government_idea:0	"Regierung der nationalen Einheit"
CZE_national_unity_government_idea_desc:0	"In einem letzten verzweifelten Versuch, die Republik zu retten, wurde eine neue Regierung gebildet."
CZE_sudetenland_autonomy:0	"Autonomie für deutsche Regionen"
CZE_sudetenland_autonomy_desc:0	 "Seit den frühen 1920er Jahren gab es Pläne, bestimmten Regionen innerhalb der Tschechoslowakei, darunter dem Sudetenland, eine größere Autonomie zu gewähren, doch die Innenpolitik der Tschechoslowakei blockierte solche Initiativen. Wer weiß, vielleicht hätte die Gewährung größerer Autonomie für die deutschen Regionen Tausende von Menschenleben gerettet, oder vielleicht sogar Millionen."
CZE_levy_liechtenstein_properties:0	 "Levy [LIE.GetAdjective] Immobilien"
CZE_levy_liechtenstein_properties_desc:0	"[LIE.GetNameDefCap] besitzt mehrere Immobilien in unserem Land; wenn wir mehr Steuern darauf erheben, könnten wir davon profitieren. "
CZE_sudetenland_autonomy_tooltip_reward:0	"\n Wahl zwischen zwei Arten von §YAutonomie für das Sudetenland§!."
CZE.410.t:0	 "Autonomie für das Sudetenland gewähren"
CZE.410.d:0	"Nach vielen Monaten politischer Verhandlungen und der Ausarbeitung neuer Verfassungs- und Minderheitenschutzgesetze ist es endlich an der Zeit, Form und Umfang der Autonomie festzulegen, die den überwiegend von ethnischen Deutschen bewohnten Regionen gewährt wird."
CZE.410.a:0	"Ein gewisses Maß an Autonomie wird ausreichen."
CZE.410.b:0	"Das Sudetenland wird eine größere Autonomie benötigen."
CZE_higher_autonomy_reward_1:0	"\n§YDas Sudetenland§! und §Ydas Ostsudetenland§! sind keine Kernregionen der Tschechoslowakei mehr."
CZE_higher_autonomy_reward_2:0	"\nDie verstaatlichte Industrie wird an deutsche Eigentümer zurückgegeben (§G-2§! §YZivile Fabriken§! im §YSudetenland§!)."
CZE_content_minorities:0	"Zufriedene Minderheiten"
CZE_content_minorities_desc:0	"Nachdem die Hauptprobleme im Sudetenland gelöst und den ethnischen Deutschen eine größere Autonomie gewährt wurde, scheint die Tschechoslowakei stärker denn je zu sein."
CZE_partial_mobilization:0	"Teilmobilmachung ausgerufen"
CZE_partial_mobilization_desc:0	"Im Frühjahr 1938 verschlechterte sich die politische Lage in der Tschechoslowakei derart, dass die Regierung eine Teilmobilmachung ankündigte.\n\nReservisten und vorab ausgewählte militärische Fachkräfte wurden einberufen, und die Armee wuchs bald auf etwa 383. 000 Mann an."
CZE_partial_mobilization_tooltip_reward:0	 "\nÄnderung des Gesetzes über die freie §YWirtschaft§!."
CZE.411.t:0	"Teilmobilmachungsbefehl"
CZE.411.d:0	"Unter Berufung auf feindliche Militärmanöver der Wehrmacht während [GetDateText] reagierte die Prager Regierung auf Berichte über deutsche Truppenkonzentrationen entlang der tschechoslowakischen Grenze. Sie erließ ein Dekret, das den Minister für Nationale Verteidigung, František Machník, anwies, Reservisten und vorab ausgewählte militärische Spezialisten einzuberufen.\n\nDie Reservisten meldeten sich unverzüglich und mit Begeisterung zum Dienst; nach vielen Monaten der Passivität, Unsicherheit und Demütigung schien der Kurs nun klar: Die Tschechoslowakei war nicht Österreich; sie würde nicht ausgelöscht werden, ohne dass eine organisierte Verteidigung nach dem Motto "Freiheit oder Tod" stattfände.\n\nHitler war über die Kühnheit der Prager Regierung erzürnt, und die Mai-Krise bestärkte ihn nur noch mehr in seinem Entschluss, die Tschechoslowakei zu vernichten. Er spürte, dass die rasche und entschlossene strategische Konzentration jenseits der Grenze einen Verlust an deutschem und seinem eigenen Ansehen zur Folge hatte. Er setzte sich hin, um die Richtlinie zur Operation Grün umzuschreiben, deren allererster Satz nun lautete: "Es ist meine unveränderliche Absicht, die Tschechoslowakei in naher Zukunft durch militärische Maßnahmen zu zerschlagen ..." "
CZE.411.a:0	 "Wir werden nicht zurücktreten!"
CZE.412.t:0	"Tschechoslowakei ordnete Teilmobilmachung an"
CZE.412.d:0	"Unter Berufung auf feindliche Militärmanöver der Wehrmacht in der Nacht vom [GetDateText] reagierte die Prager Regierung auf Berichte über deutsche Truppenkonzentrationen entlang der tschechoslowakischen Grenze. Sie erließ ein Dekret, das den Verteidigungsminister František Machník anwies, Reservisten und vorab ausgewählte militärische Fachkräfte einzuberufen. \n\nWie zu erwarten war, reagierte die deutsche Diplomatie wütend auf die Teilmobilmachung. Der deutsche Gesandte in Prag, Ernst Eisenlohr, bestritt in einem Gespräch mit dem tschechischen Außenminister Kamil Krofta die Existenz jeglicher Truppenkonzentrationen und entgegnete, die Anschuldigungen seien "grober Unsinn" (Bullshit)."
CZE.412.a:0	"Das wird nicht gut enden."
CZE_partial_mobilization_1938:0	"Mobilisierungsbemühungen"
CZE_partial_mobilization_1938_desc:0	"Die Regierung erließ einen Befehl zur Teilmobilmachung."
CZE_military_coup:0	"Militärputsch"
CZE_military_coup_desc:0	"Unzufrieden mit der politischen Lage und der Beschwichtigungspolitik der westlichen Verbündeten hätten einige hohe Offiziere der tschechoslowakischen Armee in einem letzten verzweifelten Versuch, die Republik zu retten, zu einem Militärputsch greifen können."
CZE_military_coup_tooltip_reward:0	 "\n Wahl zwischen zwei Arten von §YMilitärregierung§!."
CZE_military_coup_tt:0	"Verfügt über mindestens §Y40 % der militärischen Stärke§! im Vergleich zu §YDeutsches Reich§!"
CZE.413.t:0	"Legionärsputsch"
CZE.413.d:0	" Wütend über den Umgang der Diplomaten und Politiker mit der internationalen Krise und angewidert von der Beschwichtigungspolitik der sogenannten westlichen Verbündeten griffen einige radikalere Elemente der tschechoslowakischen Armee  mit allgemeiner Unterstützung der tschechischen Bevölkerung, zu einem friedlichen Putsch, um die Republik zu retten.\n\nGeneral Syrovy wurde auf die Prager Burg beordert, um die Demonstranten zu beruhigen, die "Gebt uns Waffen oder Syrovy" oder " Es lebe die Armee; wir wollen General Syrovy".\n\nDer betagte Held der Schlacht von Zborov willigte widerwillig ein, das Amt des Ministerpräsidenten zu übernehmen, und bildete eine vorübergehende Übergangsregierung."
CZE.413.a:0	"Bildet eine neue Militärregierung. "
CZE_militarism_focus:0	"Regierung der Republik zur Verteidigung"
CZE_militarism_focus_desc:0	"Eine vorübergehende breite Koalitions-Übergangsregierung wurde gebildet."
CZE_militarism_focus_2:0	"Legionärsregierung"
CZE_militarism_focus_2_desc:0	"Radikalere Elemente des Militärs kontrollieren nun die Regierung."
CZE_oppressed_minorities:0	"Kriegsrecht"
CZE_oppressed_minorities_desc:0	"Im Sudetenland und anderen von ethnischen Minderheiten besetzten Regionen wurde das Kriegsrecht verhängt."
CZE_radola_gajda_general_tooltip:0	"§YRadola Gajda§!: Feldmarschall (Offensivdoktrin)\n"
CZE_lev_prchala_general:0	"Lev Prchala"
CZE_lev_prchala_general_desc:0	"General Prchala war ein entschiedener Gegner der Kapitulation von München und Kommandeur der IV. Armee, die 1938 die kritische südslawische Grenze bewachte.\n\nEr stand zudem im Verdacht, einen Plan für einen Militärputsch ausgearbeitet zu haben."
CZE_zaolzie_for_alliance:0	"Zaolzie für das polnische Bündnis"
CZE_zaolzie_for_alliance_desc:0	"Die Region Zaolzie war seit 1920 zwischen der Tschechoslowakei und Polen umstritten. Es ist an der Zeit, diese Frage zu klären und die Kräfte gegen die Faschisten und Kommunisten zu bündeln."
CZE_zaolzie_for_alliance_tooltip_reward_1:0	 "\n§YDiplomatisches Ereignis§! für §YPolen§! mit dem Vorschlag, die Cieszyn-Schlesien-Frage endgültig zu lösen.\n "
CZE_zaolzie_for_alliance_tooltip_reward_2:0	" \n§YPolen§! tritt der §YKleinen Entente§! bei, im Austausch für die §YRegion Zaolzie§! (80 % Wahrscheinlichkeit)."
CZE.414.t:0	"Geschichte des polnisch-tschechoslowakischen Streits um Zaolzie"
CZE.414.d:0	"Der polnisch-tschechoslowakische Krieg war eine lokale militärische Auseinandersetzung zwischen den neu gegründeten Staaten Tschechoslowakei und Polen um das Gebiet von Cieszyn-Schlesien im Jahr 1919. In einigen tschechischen Quellen wird der Konflikt wegen seines schnellen Ausgangs als "Sieben -Tage-Krieg", da er schnell beendet war.\n\nDie größte Bedeutung von Teschen-Schlesien lag im reichen Kohlebecken um Karviná und der wertvollen Eisenbahnstrecke Košice–Bohumín, die die tschechischen Gebiete mit der Slowakei verband. Darüber hinaus diente im nördlichen -westlichen Teil von Teschen-Schlesien diente der Eisenbahnknotenpunkt Bohumín als Drehscheibe für den internationalen Verkehr und die Kommunikation.\n\nDer Kriegsauslöser war die Vorbereitung nationaler Parlamentswahlen durch Polen in dem Gebiet, das im Interimsabkommen als polnisch ausgewiesen war, da in den umstrittenen Gebieten keine souveräne Herrschaft ausgeübt werden sollte.\n\nDie polnische Regierung lehnte die Forderung Prags ab, die Vorbereitungen einzustellen, und die tschechoslowakische Seite beschloss, die Vorbereitungen mit Gewalt zu stoppen. Da die meisten polnischen Truppen in Kämpfe mit der Westukrainischen Volksrepublik um Ostgalizien verwickelt waren, gewannen die tschechoslowakischen Streitkräfte schnell die Oberhand. Die Tschechoslowakei wurde jedoch von der Entente gezwungen, den Vormarsch zu stoppen, und Tschechoslowakei und Polen wurden dazu gezwungen, eine neue Demarkationslinie zu unterzeichnen. Das umstrittene Gebiet wurde unter internationale Kontrolle gestellt.\n\nDie endgültige Aufteilung von Teschen-Schlesien erfolgte im Juli 1 920 im Rahmen der Konferenz von Spa. Im Ergebnis wurden die Eisenbahnlinie, die die tschechischen Gebiete mit der Slowakei verband, sowie das Gebiet südlich davon der Tschechoslowakei zugewiesen, während das Gebiet nördlich der Eisenbahnlinie an Polen überging. Danach war die unter tschechoslowakischer Kontrolle stehende Region als Zaolzie bekannt, ein Name, der "Gebiete jenseits des Flusses Olza" bedeutet .\n\nPolen besetzte die Region während der Münchner Krise kurzzeitig, später wurde sie vom unabhängigen slowakischen Staat annektiert, kehrte aber nach dem Zweiten Weltkrieg unter tschechoslowakische Kontrolle zurück. Die Streitigkeiten um die Region wurden jedoch 1958 endgültig beigelegt."
CZE.414.a:0	 "Lassen Sie uns die Frage um Cieszyn-Schlesien endlich klären."
CZE.415.t:0	"Tschechoslowakei bietet Zaolzie für Militärbündnis an"
CZE.415.d:0	"Die tschechoslowakische Regierung hat uns mitgeteilt, dass sie die Streitigkeiten um die Region Zaolzie lösen möchte. Sie wird zustimmen, das Gebiet im Gegenzug für unsere militärische Unterstützung als Teil des Bündnisses der Kleinen Entente abzutreten."
CZE.415.a:0	"Ausgezeichnet"
CZE.415.b:0	" Auf keinen Fall! Wir werden es schon bald bekommen."
CZE.416.t:0	"Polen stimmt zu"
CZE.416.d:0	"Die polnische Regierung hat uns mitgeteilt, dass sie unserem Vorschlag zustimmt. Wir werden den Übergang der Region unter polnische Kontrolle sowie die Umsiedlung unserer Bürger und unseres Militärpersonals vorbereiten."
CZE.416.a:0	"Ausgezeichnet"
CZE.417.t:0	"Polen lehnt ab"
CZE.417.d:0	"Die polnische Regierung hat uns mitgeteilt, dass sie an unserem Vorschlag nicht interessiert ist. Dennoch hat sie ziemlich deutlich gemacht, dass sie Zaolzie weiterhin als Teil ihres Landes betrachtet und die Region – bedingungslos – fordert."
CZE.417.a:0	"Verdammte Polen!"
CZE_together_against_berlin:0	"Gemeinsam gegen Berlin"
CZE_together_against_berlin_desc:0	"Die deutsche Regierung stellt eine ständige Bedrohung für die kürzlich erlangte Unabhängigkeit sowohl der Tschechoslowakei als auch Polens dar. Die beste Verteidigung gegen dieses große Übel ist ein Präventivschlag, um ihre Expansionspläne zu zerschlagen. "
CZE_czech_fascism_onrise:0	"Vereinigt die Nationalfaschistische Gemeinschaft"
CZE_czech_fascism_onrise_desc:0	"Die dominierende rechtsextreme politische Bewegung in der Tschechoslowakei war die Nationalfaschistische Gemeinschaft, die sich an Benito Mussolinis Nationalfaschistischer Partei orientierte und 1926 etwa 200.000 Anhänger hatte. \n\nIm Gegensatz dazu wurde die slowakische extreme Rechte hauptsächlich von christlichen Nationalisten aus Hlinkas Slowakischer Volkspartei vertreten."
CZE_czech_fascism_onrise_tooltip_reward:0	" \nWahl zwischen zwei Arten der Unterstützung des §Ytschechischen Faschismus§!."
CZE.418.t:0	"Faschismus in der Tschechoslowakei der Zwischenkriegszeit"
CZE.418.d:0	" Die Nationale Faschistische Gemeinschaft (Národní obec fašistická) war eine tschechoslowakische faschistische Bewegung unter der Führung von Radola Gajda, die sich am Faschismus von Benito Mussolini orientierte. Die Partei entstand im März 1926 durch den Zusammenschluss einer Gruppe dissidenter Nationaldemokraten, bekannt als die "Rot-Weißen", mit verschiedenen anderen rechten Gruppierungen in Böhmen und Mähren. \n\nSie zeichnete sich durch eine starke Strömung der Opposition gegen Deutschland aus, die auch nach Adolf Hitlers Machtübernahme fortbestand. Stattdessen orientierte sich die NOF an Italien als Vorbild und stützte sich vollständig auf Mussolinis Nationale Faschistische Partei. In dieser Hinsicht unterschied sie sich deutlich von ihrem Hauptrivalen "Vlajka", der fest im Lager Hitlers stand.\n\nZu den von der NOF kritisierten Gruppen gehörten Juden, Kommunisten, die tschechoslowakische Regierung und die Magyaren. Sie gründete eine Jugendgruppe und eine kleine Gewerkschaftsbewegung. \n\nDie Gruppe befürwortete zudem eine Politik des Panslawismus und hoffte, gemeinsam mit Polen die Führung einer großen slawischen Allianz zu übernehmen, die den Kommunismus in der Sowjetunion stürzen sollte. Sie glaubte auch an eine korporatistische Wirtschaft mit einem großen Agrarsektor. Die NOF fand frühzeitig Unterstützung bei Veteranen der tschechoslowakischen Legionen.\n\nDer Partei gelang es jedoch nicht, diese Unterstützung aufrechtzuerhalten, und sie erhielt bei den Wahlen von 1935 nur 2 % der Stimmen und sieben Sitze im Nationalrat. Sie wurde schließlich während der deutschen Besetzung der Tschechoslowakei aufgelöst. \n\nWährend des größten Teils ihres Bestehens wurde die NOF von dem ehemaligen General und Helden der tschechoslowakischen Legion in Russland, Radola Gajda, geführt. 1933 wurde Gajda aufgrund des sogenannten "Zidenice-Meuterei"-Skandals kurzzeitig inhaftiert und seiner militärischen Ränge sowie seiner Pension enthoben; einem gescheiterten Militärputsch, der von bestimmten faschistischen Elementen im Militär verübt wurde.\n\nGajda wurde während der Besatzungszeit von 1939 bis 1945 an den Rand gedrängt und zog sich aus der Politik zurück. Gelegentlich unterstützte er den tschechischen Widerstand, indem er Armeeoffizieren bei der Flucht nach Polen half und die Widerstandsaktivitäten seines Sohnes verbarg. Er wurde von der Gestapo verhört, konnte jedoch eine Inhaftierung vermeiden. \n\nNach dem Ende des Zweiten Weltkriegs wurde Gajda vom NKWD inhaftiert und unter harten Bedingungen verhört. Im April 1947 wurde er wegen "Verbreitung von Faschismus und Nationalsozialismus" vor Gericht gestellt, wofür der Staatsanwalt eine lebenslange Haftstrafe forderte. Gajdas Schuld war alles andere als eindeutig, und die daraus resultierende Strafe von zwei Jahren ermöglichte es ihm, kurz darauf aus dem Gefängnis entlassen zu werden. Mittellos und vergessen starb er einige Monate später."
CZE.418.a:0	 "Verwende antikommunistische Rhetorik."
CZE.418.b:0	"Mobilisiere antideutsche Anhänger."
CZE.419.t:0	"Tschechischer Faschismus auf dem Vormarsch"
CZE.420.t:0	"Faschistische Sympathien unter ehemaligen Legionären"
CZE.421.t:0	"Faschistischer Putsch"
CZE.422.t:0	"Bürgerkrieg für den tschechischen Faschismus"
CZE.423.t:0	"Gajda-Wachen gebildet"
CZE.424.t:0	"Die Bedrohung durch den Kommunismus"
CZE.425.t:0	"Die Bedrohung durch den Nationalsozialismus"
CZE.425.d:0	" '[Root.GetLeader] möchte euch glauben machen, dass [Root.GetNameDef] sicher und geeint ist. Es ist keine Überraschung, dass solche Lügen die Köpfe unseres Volkes vergiftet haben, wenn sich eine Schlange direkt nebenan zusammenrollt! Schaut nur über unsere Grenze, um zu sehen, wie Landsleute sich im Namen des Nationalsozialismus gegeneinander gewandt haben und und das Ende der Nationen verkünden. Wie lange wird es dauern, bis sie auch unsere Nation für tot erklären? Wird die [Root.GetRulingParty] uns vor dieser Bedrohung schützen?"\n\nHitlers pangermanistische Rhetorik hat das Wachstum der tschechischen faschistischen Bewegung in [ROOT.GetNameDef] beflügelt. Viele Gemäßigte, die den Faschismus normalerweise als ein weiteres fehlgeleitetes ideologisches Experiment abtun würden, empfinden dies als echtes Problem für sich. Hätten sie die Wahl zwischen dem Kommunismus unserer Nachbarn und einem faschistischen Regime, würden sie zugegebenermaßen Letzteres bevorzugen. Sie wären vielleicht sogar bereit, es aktiv zu unterstützen."
CZE.425.a:0	"Wir werden die Vorhut gegen den deutschen Nationalsozialismus sein!"
CZE.426.t:0	"Tschechische Faschisten fordern Referendum"
CZE.427.t:0	"Faschisten marschieren auf Prag"
CZE.428.t:0	"Gajda verspottet"
CZE_ban_communism:0	"Den tschechoslowakischen Staat festigen"
CZE_ban_communism_desc:0	"Die Faschisten in der Tschechoslowakei träumten jahrzehntelang von einem starken Nationalstaat. Endlich ist die Zeit gekommen, Träume in die Realität umzusetzen."
CZE_ban_communism_tooltip_reward:0	" \nWahl zwischen drei §YFaschismus§!bezogenen §Ynationalen Ideen§!."
CZE.429.t:0	"Faschistischer tschechoslowakischer Staat"
CZE.429.d:0	"Die Nationale Faschistische Gemeinschaft (NOF) orientierte sich am italienischen Faschismus und passte diesen an die tschechischen Verhältnisse an. Sie forderte einen starken Nationalstaat auf der Grundlage korporativer Prinzipien und ging mit einer ausgeprägten antideutschen Haltung einher.\n\nDer tschechische Faschismus stellte sich über die etablierten sozialen Klassen. Er forderte die Unterordnung persönlicher und klassenbezogener Interessen unter die Bedürfnisse der Nation als Ganzes, was durch das NOF-Motto "Das Wohl des Volkes soll das oberste Gesetz sein" zum Ausdruck kam.\n\nDer Panslawismus war ein allgemeines Thema unter den tschechischen Faschisten, doch da viele Mitglieder der NOF ehemalige Legionäre waren, war auch die antikommunistische Stimmung in der Bewegung extrem. \n\nVerschiedene Jugendorganisationen sollten eine neue Generation gehorsamer Bürger und Soldaten erziehen und indoktrinieren. \n\nNach den Vorstellungen der NOF-Führer bestand die Regierung aus acht Ministern und Experten ausschließlich tschechischer oder slowakischer Herkunft. Deutschen, Ungarn und Juden war es nicht gestattet, Regierungsmitglieder zu werden; im Übrigen würde die Regierung jedoch ihre Bürgerrechte garantieren.\n\n Darüber hinaus befürwortete die NOF Beschränkungen für Großunternehmen, Kartelle und Monopole. Die staatliche Wirtschaft und der Privatsektor sollten auf Selbstversorgung ausgerichtet sein und ein Gleichgewicht zwischen Produktion und Konsum herstellen.\n\nInsgesamt träumten die tschechischen Faschisten von einem völlig unrealistischen Staat, doch sie erhielten in der Geschichte nie die Chance, das Gegenteil zu beweisen."
CZE.429.a:0	"Vertreter von Minderheiten aus öffentlichen Ämtern entfernen."
CZE.429.b:0	"Faschistische Jugendbewegungen unterstützen."
CZE.429.c:0	"Die Kommunisten ausrotten."
CZE_anti_communism:0	"Verfolgung von Kommunisten"
CZE_anti_communism_desc:0	"Verschiedene faschistische Gruppen in der Tschechoslowakei waren entweder antinazistisch oder pronazistisch, aber alle waren antikommunistisch."
CZE_military_youth_idea:0	" Faschistische Jugendbewegungen"
CZE_military_youth_idea_desc:0	"In der Tschechoslowakei wurden mehrere faschistische Jugendorganisationen gegründet."
CZE_join_axis:0	"Pakt mit dem Teufel"
CZE_join_axis_desc:0	"Abgesehen von den Feindseligkeiten mit Deutschland sollte die Tschechoslowakei dem Anti- -Komintern-Pakt anschließen und wie die tschechoslowakischen Legionen vor zwei Jahrzehnten in Russland die Waffen gegen die Bolschewiken erheben."
CZE_join_axis_tooltip_reward:0	"\n§YDiplomatisches Ereignis§! für das §YDeutsche Reich §! mit Vorschlag zur Lösung der Sudetendeutschen Frage.\n"
CZE_join_axis_tooltip_reward_2:0	"\nChance für §Ydie Tschechoslowakei§!, sich der §YAchse§! anzuschließen."
CZE.430.t:0	"Vasall des Deutschen Reichs"
CZE.430.d:0	"Unsere sogenannten "westlichen Verbündeten" haben uns im Stich gelassen, und wir stehen allein gegen die Macht des Deutschen Reichs. Vielleicht wäre es klüger, das Wohl des Staates über interne politische Querelen zu stellen und mit Hitler zu verhandeln. Schließlich die rote Gefahr scheint weitaus gefährlicher zu sein, woran sich viele brüderliche Legionäre aus den Jahren erinnern, in denen sie in Russland gegen die Bolschewiken kämpften."
CZE.430.a:0	"Laden Sie Herrn Ribbentrop nach Prag ein."
CZE_seek_accommodation_with_germany:0	"Dem Anti-Komintern-Pakt beitreten"
CZE.431.t:0	"Die Tschechoslowakei verhandelt."
CZE.431.d:0	"Interessante Wendung der Ereignisse in der Tschechoslowakei. Unser Botschafter in Prag hat uns kontaktiert, und es scheint, dass die neue tschechoslowakische Führung nach dem Weggang von Edvard Beneš mehr als bereit ist, Kompromisse mit uns einzugehen.\n\nVielleicht würde eine solche Vereinbarung unnötiges Blutvergießen verhindern. Was sollen wir tun? "
CZE.431.a:0	"Ribbentrop nach Prag schicken"
CZE.431.b:0	"Nichts tun; die Tschechoslowakei wird zerstört werden."
CZE.432.t:0	"Diplomatische Verhandlungen in Prag"
CZE.432.d:0	" Nach tagelangen Verhandlungen ist klar, dass die Deutschen nicht an einer rein diplomatischen Lösung des Sudetenland-Problems interessiert sind. Sie haben mehrere harte Forderungen gestellt und mit Krieg gedroht, sollten diese Verhandlungen scheitern."
CZE.432.a:0	"Wir müssen zustimmen."
CZE.432.b:0	"Das ist inakzeptabel! "
CZE_reich_support:0	"Industrielle Unterstützung für das Deutsche Reich"
CZE_reich_support_desc:0	"Die Škoda-Werke und andere Rüstungsunternehmen produzieren nun Ausrüstung für die Wehrmacht."
CZE_czech_industry_bonus:0	"Tschechoslowakische Industrie"
CZE_czech_industry_bonus_desc:0	 "Die tschechoslowakische Industrie produziert Kriegsmaterial für die Wehrmacht."
CZE_svatoplukovy_gardy:0	"Die Svatopluk-Garden"
CZE_svatoplukovy_gardy_desc:0	"Die Svatopluk-Garden (tschechisch: Svatoplukovy Gardy) stellten den paramilitärischen Flügel von Vlajka dar, der der SA nachempfunden war."
CZE_czechoslovak_protectorate:0	"Tschechoslowakisches Protektorat"
CZE_czechoslovak_protectorate_desc:0	"Der Großteil der tschechoslowakischen Rüstungsindustrie arbeitet für die deutsche Kriegsmaschinerie."
CZE_higher_autonomy_reward_1_b:0	 "\n§YSudetenland§! und §YOstsudetenland§! sind keine Kernregionen der Tschechoslowakei mehr.\n\n"
CZE.433.t:0	"Keine Antwort"
CZE.433.d:0	"Wir haben noch keine Antwort von deutscher Seite erhalten. Das bedeutet nur eines."
CZE.433.a:0	"Allgemeine Mobilmachung ausrufen"
CZE_nazi_puppet:0	" Unter dem Schutz des Reichs"
CZE_nazi_puppet_desc:0	"Es ist nun klar, dass wir dem Deutschen Reich nicht länger Widerstand leisten können. Wir müssen mit dem Deutschen Reich eine Einigung aushandeln, um die Tschechoslowakei zu erhalten."
CZE_nazi_puppet_tooltip_reward:0	 "\n §OSonderbonus:§! Pro-nazistische Kollaborationselemente werden mit Unterstützung des §YDeutschen Reichs§! einen Putsch versuchen. Wenn dieser gelingt, wird eine §YMarionettenregierung§! eingesetzt. "
CZE.434.t:0	"Tschechoslowakisches Protektorat"
CZE.434.d:0	"Es ist nun klar, dass wir dem Deutschen Reich nicht länger Widerstand leisten können. Unsere westlichen Verbündeten haben uns verraten, und die Bolschewiken bedrohen uns alle. Einige nationalistische Bewegungen, wie beispielsweise "Vlajka", möchten den derzeitigen Kurs der antideutschen Politik ändern und eine Einigung mit dem Deutschen Reich aushandeln.\n\nManche würden sie als Verräter und Nazi-Kollaborateure bezeichnen, doch Männer wie Jan Rys-Rozsévač wollen eine neue, stärkere Tschechoslowakei aufbauen.\n\nHistorisch gesehen war Vlajka eine radikale faschistische Bewegung, die sich unter dem Einfluss von Jan Rys-Rozsévač vom traditionellen tschechischen antideutschen Chauvinismus zur Kollaboration mit den Nazis und der Gestapo wandte.\n\nZunächst unterstützten die Besatzungsbehörden diese Gruppe von Kollaborateuren und nutzten sie für Propagandazwecke. Als ihre Nützlichkeit jedoch endete, wurde Vlajka Ende 1942 aufgelöst, und die Anführer, darunter Rys-Rozsévač, wurden in das Konzentrationslager Dachau deportiert.\n\nNach dem Krieg wurden Rys-Rozsévač und andere Mitglieder von Vlajka zum Tode verurteilt."
CZE.434.a:0	"Schwört Treue zum Deutschen Reich."
CZE.435.t:0	"Tschechoslowakei sucht Schutz"
CZE.435.d:0	" Die radikalen faschistischen Elemente in der Tschechoslowakei, vertreten durch Herrn Rozsevac von Vlajka, möchten die Macht im Land übernehmen und eine neue Regierung auf der Grundlage nationalsozialistischer Ideen errichten.\n\nDas Land befindet sich in internationaler Isolation, und die innenpolitischen Unruhen bieten eine einmalige Gelegenheit, das Land zu sichern. Allerdings benötigt Vlajka unsere Unterstützung bei der Organisation des Putsches und der Sicherung des Landes im Anschluss daran.\n\nWie lauten Ihre Befehle?"
CZE.435.a:0	"Unterstütze "Vlajka""
CZE.435.b:0	" Wir haben andere Pläne für die Tschechoslowakei."
CZE.436.t:0	"Vlajka übernimmt die Tschechoslowakei"
CZE.436.d:0	"Da die deutsche Unterstützung gesichert ist, wird es nur noch Tage dauern, bis wir das Land unter Kontrolle haben. Stellen wir sicher, dass unsere Milizen alle Unruhestifter verhaften, bevor sie fliehen können. Wir können es uns nicht leisten, sie im Exil als Helden auftreten zu lassen."
CZE.436.a:0	"Führt den Putsch durch."
CZE.437.t:0	"Deutschland ist nicht interessiert"
CZE.437.d:0	"Die deutsche Führung ist an unserem Vorschlag nicht interessiert. Wir sind auf uns allein gestellt."
CZE.437.a:0	"Die Tschechoslowakei ist dem Untergang geweiht."
CZE_petition_league_of_nations:0	"Antrag beim Völkerbund"
CZE_petition_league_of_nations_desc:0	"Da die ethnische Krise abgewendet wurde, sollten wir eine internationale Kommission einladen, um die angebliche Notlage der Deutschen und die ethnische Unterdrückung in der Tschechoslowakei zu untersuchen."
CZE_petition_league_of_nations_tooltip_reward:0	"\n §OBesonderer Bonus:§! Die Briten und Franzosen werden sich während der Münchner Konferenz auf die Seite der Tschechen stellen."
CZE.438.t:0	"Runciman-Mission in der Tschechoslowakei"
CZE.438.d:0	"Die Runciman-Mission in der Tschechoslowakei war eine Initiative der britischen Regierung zur Lösung einer internationalen Krise, die im Sommer 1938 in Europa zu einem Krieg zu führen drohte. Die Mission unter der Leitung des ehemaligen britischen Kabinettsministers Lord Runciman wurde entsandt, um in einem Streit zwischen der tschechoslowakischen Regierung und der Sudetendeutschen Partei (SdP), die die radikalisierte deutsche Minderheit im Land vertrat. Die britischen Vermittler waren im Spätsommer in der Tschechoslowakei tätig und legten ihren Bericht kurz vor der Münchner Konferenz im September vor.\n\nDer Bericht der Runciman-Mission, in Form von Briefen an den britischen und den tschechoslowakischen Premierminister vom [GetDateText], war in seinem Ton gegenüber der tschechoslowakischen Regierung äußerst feindselig und empfahl die sofortige Übergabe der überwiegend von Deutschen bewohnten Gebiete an Deutschland. Der 2000 Wörter umfassende Bericht machte die Führung der SdP eindeutig für das Scheitern der Verhandlungen verantwortlich, da diese den Vorwand ziviler Unruhen in einigen deutschen Gebieten genutzt habe, um die Kontakte abzubrechen. Der Bericht stellte zudem fest, dass die Vorschläge von Beneš’ "Viertem Plan" "fast alle Anforderungen" der Forderungen der SdP erfüllten. Dennoch drückte Runciman bei der Aufzählung der Missstände der deutschen Minderheit äußerte Runciman sein Mitgefühl für die Sudeten und stellte fest, dass es "schwer sei, von einem fremden Volk regiert zu werden". Obwohl er erklärte, die tschechische Herrschaft sei "nicht aktiv unterdrückerisch und sicherlich nicht "terroristisch"" , so der Bericht, "war sie doch von Taktlosigkeit, Unverständnis, kleinlicher Intoleranz und Diskriminierung geprägt".\n\nSollte die tschechoslowakische Regierung das Sudetenland-Problem jedoch vor der Eskalation des ethnischen Konflikts lösen, würde sich der Bericht der Runciman-Mission wahrscheinlich zugunsten der tschechischen Seite ausfallen. So wären das Vereinigte Königreich und Frankreich eher bereit, die Tschechoslowakei gegen eine mögliche Aggression Hitlers zu unterstützen."
CZE.438.a:0	"Laden Sie Lord Runciman ins Sudetenland ein."
CZE_join_allies:0	"Suche die Zusammenarbeit mit den Alliierten"
CZE_join_allies_desc:0	"Wir sollten einem Bündnis beitreten und der Bedrohung durch Nazideutschland gemeinsam entgegentreten und Hitler aufhalten, bevor es zu spät ist. "
CZE_join_allies_tooltip_reward:0	"\n Chance für §Ydie Tschechoslowakei§!, sich den §YAlliierten§! anzuschließen."
CZE_join_allies_tt:0	"Gehört zur Fraktion des §YVereinigten Königreichs§! oder §YFrankreichs§!."
CZE.439.t:0	"Die Tschechoslowakei will sich den Alliierten anschließen"
CZE.439.d:0	"Die Aggression des Deutschen Reichs kennt keine Grenzen. Lord Runciman berichtet, dass die Lage in der Tschechoslowakei weit von dem entfernt ist, was Herr Hitler behauptet.\n\nDie Tschechoslowakei ist die letzte stabile Demokratie in Mitteleuropa und braucht dringend unsere Hilfe gegen die deutsche Aggression. Wie sollen wir antworten?"
CZE.439.a:0	"Laden wir sie zu den Alliierten ein."
CZE.439.b:0	"Die Tschechen sind auf sich allein gestellt. "
CZE_seek_accommodation_with_britain:0	"Tschechoslowakisch-britische diplomatische Bemühungen"
CZE.440.t:0	"Großbritannien nimmt unseren Antrag an"
CZE.440.d:0	"Wir freuen uns, berichten zu können, dass Großbritannien uns in die Alliierten aufgenommen hat."
CZE.440.a:0	"Vielleicht gibt es doch noch Hoffnung."
CZE.441.t:0	"Großbritannien lehnt unseren Antrag ab"
CZE.441.d:0	"Leider scheint es, als wolle Großbritannien uns noch nicht in die Alliierten aufnehmen."
CZE.441.a:0	"Das ist äußerst bedauerlich."
CZE_strengthen_communism:0	"Stärkung der Kommunistischen Partei"
CZE_strengthen_communism_desc:0	"Die Kommunisten wollten schon immer die Macht in der Tschechoslowakei übernehmen. 1929 wurde Klement Gottwald zum Generalsekretär der Partei , nachdem er seine Gegner ausgeschaltet hatte. Obwohl die Partei vor München nicht an der Regierung beteiligt war und 1938 sogar verboten wurde, ergriffen die Kommunisten unter Gottwald schließlich 1948 die Macht."
CZE_strengthen_communism_tooltip_reward:0	"\n Freie §YKommunistische§! Revolutionär."
CZE_five_year_plan_tooltip_trigger:0	"§YJalta-Konferenz§! fand statt"
CZE.442.t:0	"Kommunismus in der Tschechoslowakei der Zwischenkriegszeit"
CZE.442.d:0	"Die Gründung einer kommunistischen Partei in der Tschechoslowakei vollzog sich langsam und erfolgte zwischen 1919 und 1921 unter dem stetigen Druck und der ständigen Anleitung der Kommunistischen Internationale. Als die Kommunistische Partei der Tschechoslowakei (KSC) schließlich im letzteren Jahr gegründet wurde, stellte dieses Ergebnis einen Kompromiss zwischen der extremen, dogmatischen Politik der Komintern und den gemäßigteren, tschechoslowakisch orientierten Ansichten von Bohumil Smeral, dem ersten Parteivorsitzenden.\n\nDie Organisation der KSC basierte auf dem leninistischen Konzept des demokratischen Zentralismus, das die Wahl von Parteiführern auf allen Ebenen vorsah, aber verlangte, dass jede Ebene vollständig der Kontrolle der nächsthöheren Einheit unterworfen war. Dementsprechend wurden Parteiprogramme und -politik von oben vorgegeben, und Beschlüsse höherer Organe waren für alle untergeordneten Organe und einzelne Parteimitglieder bedingungslos bindend. Theoretisch wurden politische Fragen auf Kongressen, Konferenzen, Mitgliederversammlungen und in der Parteipresse frei und offen diskutiert. In der Praxis spiegelten diese Diskussionen jedoch lediglich Entscheidungen wider, die von einer kleinen Gruppe hochrangiger Parteifunktionäre getroffen wurden.\n\n1929 wurde Klement Gottwald zum Generalsekretär der Partei, nachdem verschiedene oppositionelle Elemente aus ihr gesäubert worden waren, von denen sich einige mit Leo Trotzki und der Internationalen Linken Opposition verbündet hatten. \n\nBei den Parlamentswahlen 1935 behielt die Partei ihre ursprünglichen 30 Mandate mit etwas mehr als 10 % der Stimmen. Die Ereignisse von 1938 führten jedoch zum Verbot der Partei, sie existierte jedoch als Untergrundorganisation weiter.\n\nWährend des Zweiten Weltkriegs suchten viele KSC-Führer Zuflucht in der Sowjetunion, wo sie sich darauf vorbereiteten, die Machtbasis der Partei nach Kriegsende zu erweitern. In der frühen Nachkriegszeit starteten die von der Sowjetunion unterstützten tschechoslowakischen Kommunisten eine anhaltende Kampagne, die 1948 in ihrer Machtübernahme gipfelte."
CZE.442.a:0	"Die Partei stärken."
CZE_peoples_revolution:0	"Volksmiliz gründen"
CZE_peoples_revolution_desc:0	"Die Kommunisten kamen 1948 in der Tschechoslowakei an die Macht. Aber wer weiß? Wäre die politische Lage in Europa anders gewesen, wären sie vielleicht schon früher an die Macht gekommen."
CZE_peoples_revolution_tooltip_reward:0	 "\n Verstaatlichung von §YIndustrie§! ODER §YKommunismus§! im Zusammenhang mit §YNationalidee§! ODER §YArbeitskräfte§! bezogene §Ynationale Idee§!"
CZE.443.t:0	"Volksmiliz in der Tschechoslowakei "
CZE.443.d:0	"Volksmilizen, auch "die bewaffnete Faust der Arbeiterklasse" genannt , waren eine Milizorganisation der Kommunistischen Partei der Tschechoslowakei zwischen 1948 und 1989.\n\nDie Vorgänger dieser Milizen waren bewaffnete Gruppen von Fabrikarbeitern, die im Juni 1945 gebildet wurden, um die Fabriken während des Verstaatlichungsprozesses der Industrie nach dem Krieg vor ihren rechtmäßigen Eigentümern zu schützen.\n\nMitte Februar 1948 beschloss das Zentralkomitee der Kommunistischen Partei, aus Parteimitgliedern und Anhängern bewaffnete Einheiten zu bilden. Die Milizen wurden hastig ausgerüstet und während der kommunistischen Machtübernahme Ende Februar in Alarmbereitschaft versetzt. Bald darauf änderten sie ihren Namen in Volksmilizen. \n\nDie Aufgabe der Milizen bestand darin, Schutz vor Guerillakämpfern zu bieten, deren Auftauchen nach der Machtübernahme erwartet wurde, sowie vor in die Tschechoslowakei entsandten Geheimagenten, und mit der Polizei und der Armee zusammenzuarbeiten. Etwa 3.000 Milizionäre schlossen sich den Polizeikräften an. Nichtkommunisten wurden nach und nach aus den Milizen entfernt. Die Kontrolle über die Milizen ging an das Innenministerium über.\n\nIm Februar 1948 erhielten die Milizen 10.000 Gewehre und 2.000 Maschinenpistolen von der Rüstungsfabrik Zbrojovka Brno. Sie modernisierten die Ausrüstung kontinuierlich mit Scharfschützengewehren, Maschinengewehren, Mörsern, Flugabwehrmaschinengewehren und Transportfahrzeugen. Die Munition wurde in Armeelagern aufbewahrt. In den 1970er Jahren wurden rückstoßfreie Geschütze und RPG-7 in die Bewaffnung aufgenommen. \n\nNachdem die kommunistische Partei Ende 1989 die Macht verloren hatte, wurden die Milizen am 21. Dezember 1989 aufgelöst."
CZE.443.a:0	"Verstaatlichung der Industrie in deutschem Besitz."
CZE.443.b:0	"Verfolgung der Bourgeoisie und der demokratischen Intelligenz."
CZE.443.c:0	"Bewaffnung der Volksmiliz"
CZE_collectivist_ethos_idea:0	"Demokratische Säuberungen"
CZE_collectivist_ethos_idea_desc:0	"Nichts kann die Volksrevolution aufhalten!"
CZE_peoples_militia_idea:0	"Volksmiliz"
CZE_peoples_militia_idea_desc:0	"In der Tschechoslowakei wurde die Volksmiliz gegründet. "
CZE_join_commitern:0	"Tritt der Komintern bei"
CZE_join_commitern_desc:0	"Lange Zeit träumten Klement Gottwald und andere tschechoslowakische Kommunisten von einer starken sozialistischen Republik als einem der führenden Mitglieder der Komintern."
CZE_join_commitern_tooltip_reward:0	"\n Chance für §Ydie Tschechoslowakei§!, der §YKomintern§! beizutreten."
CZE_join_comitern_tt:0	"Steht im Konflikt mit der §YSowjetunion§!."
CZE.444.t:0	"Die Tschechoslowakei will der Komintern beitreten"
CZE.444.d:0	"Die Faschisten bedrohen unseren tschechoslowakischen Verbündeten. Die lokalen Kommunisten unter der Führung von Klement Gottwald haben im Land eine starke kommunistische Bewegung aufgebaut und bitten uns nun offiziell, sie in die Komintern aufzunehmen. \n\nWas sollen wir tun, Genosse [SOV.GetName]?"
CZE.444.a:0	"Lade sie in die Komintern ein."
CZE.444.b:0	" Die Tschechen sind auf sich allein gestellt."
CZE_seek_accommodation_with_USSR:0	"Der Komintern beitreten"
CZE.445.t:0	"Die Sowjetunion stimmt zu"
CZE.445.d:0	"Wir freuen uns, berichten zu können, dass die Delegation aus der Sowjetunion uns bezüglich unserer Mitgliedschaft in der Komintern beruhigt hat."
CZE.445.a:0	"Vielleicht gibt es doch noch Hoffnung."
CZE.446.t:0	"Die Sowjetunion lehnt ab"
CZE.446.d:0	"Leider scheint es, als seien wir immer noch nicht würdig, Teil der Komintern zu sein."
CZE.446.a:0	"Das ist äußerst bedauerlich."
CZE_faction_research_exchange:0	"Technologieaustausch"
CZE_faction_research_exchange_desc:0	"Durch den Austausch technologischer Fortschritte mit unseren Verbündeten wird unsere gesamte Fraktion die Forschung und Entwicklung im Krieg effizienter betreiben. "
CZE.447.t:0	"Kommunistische Opposition stellt KSČ-Führung in Frage"
CZE.447.d:0	"Mehrere Mitglieder der Kommunistischen Partei der Tschechoslowakei haben Zweifel an der Führung des derzeitigen Vorsitzenden Klement Gottwald geäußert, dem nachgesagt wird, er halte sich streng an Stalins Politik. Einige schlagen die Rückkehr von Alois Neurath vor, einem trotzkistischen ethnischen Deutschen, der noch immer im Land lebt. Während sein Aufstieg in der Partei ein entscheidender Schritt zur Vereinigung der sozialistischen Fraktionen der Tschechoslowakei sein könnte, betrachten viele die Ausrichtung an Stalins Politik als entscheidend für den Sieg in der Republik."
CZE.447.a:0	"Warum sollten wir diesen kranken Narren an die Macht bringen?"
CZE.447.b:0	"Die internationalistische Sache würde von seiner Einbindung profitieren!"
CZE_expand_soviet_ties:0	"Beziehungen zu [SOV.GetAdjective] ausbauen"
CZE_expand_soviet_ties_desc:0	 "Die [SOV.GetAdjective] haben sich in der sich ständig wandelnden Weltordnung als verlässliche Verbündete erwiesen. Sicherlich würden sie sich über ein Angebot zur Vertiefung unserer Beziehungen freuen, und es würde unsere Nation für die kommenden Herausforderungen stärken."
CZE_friendship_with_USSR:0	"Freundschaftsvertrag"
CZE.448.t:0	" Tschechoslowakei bietet Freundschaftsvertrag an"
CZE.448.d:0	"Die tschechoslowakische Regierung hat in den letzten Tagen eine Delegation entsandt, die um einen formellen Freundschaftsvertrag bittet, der ihrer Meinung nach unsere Beziehungen festigen wird. Was sollen wir unseren Freunden in Prag antworten?"
CZE.448.a:0	"Natürlich werden wir das sofort unterzeichnen!"
CZE.448.b:0	"Nein, danke. "
CZE.449.t:0	"Die [SOV.GetAdjective] haben zugestimmt"
CZE.449.d:0	"Die [SOV.GetAdjective] haben unserem Vorschlag für einen "Freundschaftsvertrag" zugestimmt. Unsere Beziehungen werden durch diese Entwicklung aufblühen."
CZE.449.a:0	"Großartig."
CZE.450.t:0	"Die [SOV.GetAdjective] haben abgelehnt"
CZE.450.d:0	"Die [SOV.GetAdjective] haben unseren Vorschlag für einen "Freundschaftsvertrag" abgelehnt und behauptet, unsere Bedingungen seien zu einseitig. Dies ist zweifellos eine enttäuschende Entwicklung."
CZE.450.a:0	"Bedauerlich ..."
CZE_split_poland:0	"Teilt Polen"
CZE_split_poland_desc:0	"Die Entente war töricht und naiv, als sie Staaten gründete, die sich nicht selbst verteidigen können. Polen, das lange Zeit unter reaktionärer, totalitärer Herrschaft stand, soll von der Landkarte getilgt werden; und unsere westslawischen Genossen in diesen Gebieten sollen unter unseren Schutz gestellt werden. Mit der Hilfe unserer [SOV.GetAdjective] Verbündeten – was soll uns jetzt noch aufhalten!"
CZE.451.t:0	"Tschechoslowakei bietet an, Polen zu teilen"
CZE.451.d:0	"Das tschechoslowakische Außenministerium hat uns kürzlich einen Vorschlag unterbreitet, in dem es anbietet, die kürzlich unabhängig gewordene Nation Polen unter uns aufzuteilen. Als Gegenleistung für unsere Beteiligung an der Invasion bieten sie uns derzeit die vollständige Kontrolle über die Gebiete an, die wir im jüngsten polnisch-sowjetischen Krieg verloren haben. Was sollen wir zu diesem bedeutenden Angebot sagen?"
CZE.451.a:0	"Das wird uns allen zum gegenseitigen Vorteil gereichen!"
CZE.451.b:0	"Wir können es nicht riskieren, den Westen weiter zu verärgern."
CZE.452.t:0	"Die [SOV.GetAdjective] haben zugestimmt!"
CZE.452.d:0	"Die [SOV.GetAdjective] haben unserem Vorschlag zur Aufteilung Polens zugestimmt. Wir sind nun bereit, unverzüglich Pläne für eine gemeinsame Invasion des Landes zu erarbeiten."
CZE.452.a:0	"Ausgezeichnete Neuigkeiten."
CZE.453.t:0	"Die [SOV.GetAdjective] haben abgelehnt!"
CZE.453.d:0	"Die [SOV.GetAdjective] haben unseren Vorschlag zur Teilung Polens abgelehnt und erklärt, sie könnten keinen "unbegrenzten Konflikt" mit der westlichen Welt riskieren, die sie damit ihrer Meinung nach sicherlich gegen sich aufbringen würden."
CZE.453.a:0	" Dann werden wir alleine vorgehen!"
CZE_union_with_warsaw:0	"Union mit Warschau"
CZE_union_with_warsaw_desc:0	"Mit den Arbeitern Polens unter unserem Banner können wir endlich die beliebte, wenn auch gescheiterte Idee einer wahren Union der westslawischen Nationen verwirklichen! Unsere einzige Verteidigung gegen die westliche Welt ist die Kameradschaft mit unseren langjährigen Freunden. "
CZE_union_with_warsaw_trigger_tt:0	"Alle anfänglichen §Ypolnischen§! Staaten, die nicht Kernländer eines anderen Landes sind: \n Zustimmung mehr als §Y50 %§! \n Widerstand weniger als §Y5 % §!"
CZE_union_with_warsaw_effect_tt:0	"Wir werden als §Ydie Demokratische Republik Tschechoslowakei-Polen§! bekannt sein"
CZE.7.t:0	 "Präsident Edvard Beneš tritt zurück"
CZE.7.d:0	"Nach der Besetzung des Sudetenlandes durch Deutschland sah sich Präsident Edvard Beneš am [GetDateText] unter starkem deutschen Druck zum Rücktritt gezwungen. Unseren Berichten zufolge ist er nach Putney bei London ins Exil gegangen und hält sich – vorerst – bedeckt. "
CZE.7.a:0	"Verstanden."
CZE.8.t:0	"Präsidentschaftswahl"
CZE.8.d:0	"Der ehemalige Präsident des Obersten Verwaltungsgerichts, Dr. Emil Hácha, wurde am [GetDateText] von der Nationalversammlung zum Nachfolger von Edvard Beneš als Präsident der Tschechoslowakei gewählt. Er wurde aufgrund seines katholischen Glaubens, seines konservativen Gedankenguts und seiner fehlenden Beteiligung an den Regierungen ausgewählt, die zur katastrophalen Teilung des Landes geführt hatten. \n\nEr blieb auch nach der Errichtung des Protektorats Böhmen und Mähren im Amt, war jedoch nur eine Marionette und verlor den größten Teil seines politischen Einflusses, insbesondere nach der Ermordung von Reinhard Heydrich im Juni 1942."
CZE.8.a:0	"Bereiten Sie die Amtseinführungszeremonie vor."
CZE_new_airplane_prototypes:0	"Neue Jagdflugzeug-Prototypen"
CZE_new_airplane_prototypes_desc:0	"Das Standard-Jagdflugzeug der Tschechoslowakei war die Avia B-534, eines der letzten im Einsatz befindlichen Doppeldecker-Jagdflugzeuge und vielleicht eines der besten, die je gebaut wurden.\n\nIn den entscheidenden Jahren vor dem Zweiten Weltkrieg wurde bei Avia ein Projekt für ein Eindeckerflugzeug initiiert."
CZE_new_airplane_prototypes_tooltip_reward:0	 "\n Wahl zwischen §YJäger§! oder §YSchwerer Jäger§! im Zusammenhang mit §YForschungsbonus§!.""
CZE.223.t:0	"Tschechoslowakische Prototypen von Jagdflugzeugen aus der Vorkriegszeit"
CZE.223.d:0	"Bis 1936 war dem tschechoslowakischen Oberkommando klar, dass die Doppeldeckerflotte der tschechoslowakischen Luftwaffe moderne Eindecker benötigen würde, sollte es jemals zu einem Krieg mit Deutschland kommen. Daher wurde ein neues Modernisierungsprogramm initiiert, und die Tschechoslowakei legte strenge Anforderungen und Spezifikationen sowohl für Jagdflugzeuge als auch für Bomber fest.\n\nDas bekannteste Beispiel für tschechisches modernes Eindecker-Design war der Prototyp Avia B.35, der schließlich 1939 als Avia B. 135 in Serie ging. Ähnlich wie die Hawker Hurricane verfügte das Flugzeug über ein einziehbares Fahrwerk und eine Standardbewaffnung aus einer 20-mm-Kanone, die durch die Propellernabe feuerte, sowie zwei 7,92-mm-Maschinengewehren in den Tragflächen. Die Ingenieure von Avia planten, den unzureichenden Hispano-Suiza-12Ycrs-Motor durch einen stärkeren zu ersetzen, doch der Krieg verhinderte jegliche Modernisierung des Flugzeugs.\n\nEin weiteres interessantes und vielversprechendes Design war die Praga E-51, entwickelt von ČKD Praga. Es handelte sich um ein Aufklärungs- und schwerer Jäger, der auch als leichter Bomber eingesetzt werden konnte und im Design der Fw 189 oder der P-38 Lightning ähnelte. Der einzige bekannte Prototyp flog erstmals im Mai 1938, zu spät, um für die tschechoslowakische Luftwaffe weiterentwickelt und in Serie produziert zu werden. Später wurde er beschlagnahmt und in Rechlin, Deutschland, getestet und ist seitdem spurlos verschwunden."
CZE.223.a:0	"Avia B.135 (Jäger)"
CZE.223.b:0	"Praga E.51 (Schwerer Jäger)"
CZE_new_airplane_prototypes_2:0	"Neue Bomber-Prototypen"
CZE_new_airplane_prototypes_2_desc:0	"Bis 1936 war der einzige nicht völlig veraltete tschechoslowakische Bomber die in Lizenz von der Aero Company hergestellte Bloch MB.200. Einer der interessanten Prototyp-Entwürfe vor dem Zweiten Weltkrieg war die Aero A.300.\n\nLeider unterbrach der Kriegsausbruch die Entwicklung und eine mögliche Produktion."
CZE_new_airplane_prototypes_2_tooltip_reward:0	" \n Wahl zwischen §YLuftnahunterstützung§! oder §YTaktischer Bomber§! oder §YStrategischer Bomber§!-bezogenen §YForschungsbonus§!."
CZE.224.t:0	" Tschechoslowakische Bomber-Prototypen aus der Vorkriegszeit"
CZE.224.d:0	"Spätestens [GetDateText] war dem tschechoslowakischen Oberkommando klar, dass die Doppeldeckerflotte der tschechoslowakischen Luftwaffe moderne Eindecker benötigen würde, sollte es jemals zu einem Krieg mit Deutschland kommen. Daher wurde ein neues Modernisierungsprogramm initiiert, und die Regierung legte strenge Anforderungen und Spezifikationen sowohl für Jagdflugzeuge als auch für Bomber fest.\n\nEiner der vielversprechendsten Bomber-Prototypen, die Aero A.300, war ein moderner Bomber, der von leistungsstarken Bristol Mercury IX-Sternmotoren angetrieben wurde. Er war schneller als jedes andere tschechoslowakische Flugzeug, mit Ausnahme des Prototyps Avia B-35. Die Deutschen erbeuteten das Flugzeug 1939, und es wurde von Focke-Wulf-Ingenieuren in Bremen untersucht und getestet, um nie wieder gesehen zu werden.\n\nAvia stellte einen neuen leichten Bomber vor, eine weiterentwickelte Variante des früheren B-58-Prototyps. Die B.158 war ein dreisitziger Tiefdecker mit umgekehrten Möwenflügeln , ein einziehbares Spornradfahrwerk und 634 kW (850 PS) starke Avia (Hispano-Suiza) 12Ydrs-Motoren, die Mitte 1938 ihren Erstflug absolvierte.\n\nAuch Letov stellte ein neues Modell vor, die Š-50. Als Mehrzweck-Eindecker konzipiert, wurde sie von zwei 420 PS (313 kW) starken Avia Rk.17-Sternmotoren angetrieben und war mit drei Maschinengewehren und bis zu 600 kg Bomben. Es konnte für Aufklärungsaufgaben mit einer Funkstation und Kameras ausgerüstet werden."
CZE.224.a:0	"Aero A.300 (Strategischer Bomber)"
CZE.224.b:0	"Avia B.158 (Taktischer Bomber)"
CZE.224.c:0	"Letov Š.50 (Luftnahunterstützung)"
CZE.145.t:	"Das Erbe der Legionen"
CZE.145.desc:	 "Die tschechoslowakischen Legionen waren Freiwilligentruppen, die sich aus Tschechen und einer kleinen Anzahl von Slowaken zusammensetzten und im Ersten Weltkrieg für die Entente kämpften. Ihr Ziel war es, die Unterstützung der Alliierten für die Unabhängigkeit Böhmens und Mährens vom Österreichischen Reich sowie der slowakischen Gebiete vom Königreich Ungarn zu gewinnen, die damals Teil des Österreichisch- -Ungarischen Reiches gehörten.\n\nIn Russland nahmen sie an mehreren Schlachten teil, darunter denen bei Zborov und Bakhmach. Sie waren stark in den Russischen Bürgerkrieg verwickelt und kämpften sich entlang der Transsibirischen Eisenbahnlinie bis zum Hafen von Wladiwostok vor.\n\nAls der Waffenstillstand mit den Bolschewiki geschlossen wurde, begannen die Legionen mit der langsamen Evakuierung der tschechoslowakischen Truppen aus Wladiwostok, und die letzten Legionäre verließen den Hafen im September 1920. Diese Männer reisten um die ganze Welt, bevor sie ihr neu gegründetes Heimatland erreichten. \n\nNach ihrer Rückkehr in die Tschechoslowakei übernahmen sie Führungspositionen in der Armee, wo sie die höchsten Ämter bekleideten. Aufgrund innenpolitischer Umstände waren die meisten neu ernannten Generäle Legionäre – insbesondere diejenigen, die an der russischen Front gekämpft hatten. "
CZE.145.a:	"Nutzen Sie den Einfluss des Tschechoslowakischen Legionärsverbands."
CZE.145.b:	"Unterstützen Sie militärische Freiwilligenorganisationen. "
CZE.145.c:	"Lehren aus dem Ersten Weltkrieg."
CZE_revitalising_the_danube_flotilla:	"Wiederbelebung der Donauflottille"
CZE_revitalising_the_danube_flotilla_desc:	"Die tschechoslowakische Flussflottille verfügte über mehrere robuste Schiffe, darunter das Flaggschiff der Flottille, "President Masaryk", das dem österreichisch-ungarischen Monitor der Wels-Klasse nachempfunden war. Aufgrund unzureichender Finanzierung erfordert der Rest der Flottille jedoch eine gezielte Initiative, um unsere Schiffe zu renovieren und die gesamte Flottille auf den heutigen Stand zu bringen."
CZE_poldi_steelworks:	"Poldi-Stahlwerke"
CZE_poldi_steelworks_desc:	" Poldi wurde 1889 vom österreichischen Stahlmagnaten K. Wittgenstein gegründet und hat seitdem eine wichtige Rolle beim Bau verschiedener Schiffe gespielt, von den Schlachtschiffen der Habsburg-Klasse bis hin zum Monitor "President Masaryk". Nach dem Verlust der Küstenlinie und dem Ausbleiben von Aufträgen für die zum Bau eines Schlachtschiffs benötigten Stahlmengen hat das Unternehmen seine Größe reduziert. Doch mit dem wiederauflebenden Interesse an der Marine kann das Unternehmen wieder expandieren."
CZE_return_to_the_coastline:	" Rückkehr an die Küste"
CZE_return_to_the_coastline_desc:	"Es ist uns endlich gelungen, unseren Zugang zum Meer zurückzugewinnen – eine bedeutende Errungenschaft, die es uns ermöglichen wird, mit dem Wiederaufbau unserer einstigen Flotte zu beginnen."
cz_tt_2:	"Füge §G2§! Bauplätze und §Y2 Marinewerften§! in einem zufälligen Küstenstaat hinzu."
CZE_buy_back_our_old_ships:	"Unsere alten Schiffe zurückkaufen"
CZE_buy_back_our_old_ships_desc:	"Nach Beendigung der Feindseligkeiten wurde die gesamte österreichisch-ungarische Marine unter den Entente-Mächten aufgeteilt. Italien, Frankreich, Jugoslawien, Rumänien und Griechenland betreiben weiterhin bestimmte Schiffe unserer ehemaligen Flotte. Es könnte sinnvoll sein, über den Erwerb dieser Schiffe von ihren derzeitigen Betreibern zu verhandeln."
CZE_shkoda_heavy_cannons:	"Škoda-Schwergeschütze"
CZE_shkoda_heavy_cannons_desc:	"Das Unternehmen Škoda blickt auf eine lange Tradition in der Herstellung leistungsfähiger Schwergeschütze für Dreadnoughts zurück. Ihre 30,5-cm-Dreifachturmgeschütze wurden in den österreichisch- -ungarischen Schlachtschiffen der Tegetthoff-Klasse eingesetzt und machten diese zu den weltweit ersten Dreiturmschlachtschiffen. Sollte der Staat neue schwere Marinewaffen benötigen, wird Škoda zweifellos der Herausforderung gewachsen sein, diese zu liefern."
CZE_a_new_strategy:	"Eine neue Strategie"
CZE_a_new_strategy_desc:	"Wir können es uns nicht leisten, in ein neues Wettrüsten auf See einzusteigen und riesige Summen für den Bau kolossaler Schiffe zu verschwenden, die wahrscheinlich nie zum Einsatz kommen und dazu bestimmt sind, in Werften vor sich hin zu vegetieren. Stattdessen sollten wir eine neue Strategie verfolgen, die sich auf wirtschaftlichere Alternativen wie U-Boote und Marinebomber konzentriert."
CZE_rebuild_our_navy:	"Unsere Marine neu aufbauen"
CZE_rebuild_our_navy_desc:	"Vor uns liegt eine gewaltige Aufgabe – wir müssen fast aus dem Nichts eine funktionsfähige und moderne Marine aufbauen, und zwar schnell."
CZE_naval_bomber_focus:	"Fokus auf Marinebomber"
CZE_naval_bomber_focus_desc:	"Das Österreichisch-Ungarische Reich stand an der Spitze der Marinebomber-Technologie, wobei sein K.u.K. Seefliegerkorps den ersten Flugzeugsieg über ein Schiff in der Geschichte der Kriegsführung errang. Es ist unerlässlich, dass wir diese Tradition fortsetzen und unsere hochmodernen Marinebomber weiterentwickeln."
CZE_build_the_ersatz_huszar_destroyers:	"Baue die Ersatz-Zerstörer der Triglav-Klasse"
CZE_build_the_ersatz_huszar_destroyers_desc:	"Zerstörer nehmen in jeder Marine eine Position von beträchtlicher Bedeutung ein, da sie in der Lage sind, eine Vielzahl von Missionen zu übernehmen, die von der Begleitschutz- und Minenlegeaufgabe über die U-Boot-Jagd bis hin zum Schutz von Konvois reichen. Durch die Modernisierung des Designs der österreichisch-ungarischen Zerstörer der Triglav-Klasse können wir ihren Bau beschleunigen."
CZE_modernize_the_whitehead_torpedo:	"Modernisieren Sie den Whitehead-Torpedo"
CZE_modernize_the_whitehead_torpedo_desc:	"R. Whiteheads selbstangetriebener Torpedo, der im Stabilimento Tecnico Fiumano in Österreich-Ungarn entwickelt wurde, war bis zum Ende des Ersten Weltkriegs der wichtigste Torpedo aller Marinen. Seitdem wurden jedoch neue Modelle entwickelt, wodurch wir ins Hintertreffen geraten sind. Es ist unsere Pflicht, unsere Anstrengungen zu verdoppeln, um diese technologische Lücke zu schließen. "
CZE_return_to_the_fleet_in_being_doctrine:	"Zurück zur Doktrin der Flottenerhaltung"
CZE_return_to_the_fleet_in_being_doctrine_desc:	"Die von Großadmiral Anton Haus entwickelte Hauptstrategie der österreichisch-ungarischen Flotte konzentrierte sich darauf, die Flotte als existierende Flotte zu erhalten und den Seestreitkräften Italiens, Frankreichs und Großbritanniens entgegenzuwirken. Es könnte einfacher sein, zu dieser Strategie zurückzukehren, als eine völlig neue zu formulieren."
CZE_focus_on_u-boats:	"Fokus auf U-Boote"
CZE_focus_on_u-boats_desc:	"U-Boote haben ihre Wirksamkeit im vorangegangenen Krieg unter Beweis gestellt, und seitdem hat der technologische Fortschritt ihre Durchschlagskraft nur noch verstärkt. "
CZE_modern_anti-torpedo_protection:	"Moderner Torpedoschutz"
CZE_modern_anti-torpedo_protection_desc:	" Wir haben bereits eine äußerst unglückliche Erfahrung mit unzureichendem Torpedoschutz gemacht. Ob es nun an einem Konstruktionsfehler oder einer mangelhaften Umsetzung lag – er versagte und führte zum Untergang des Schlachtschiffs SMS Szent István, nachdem es zwei Torpedotreffer erlitten hatte. Es ist von entscheidender Bedeutung, dass wir eine Wiederholung eines solchen Vorfalls vermeiden."
CZE_a_matter_of_prestige:	 "Eine Frage des Prestiges"
CZE_a_matter_of_prestige_desc:	"Ein Schlachtschiff zu besitzen, ist nicht nur eine militärische Notwendigkeit, sondern auch eine Frage des Nationalstolzes für das Land."
CZE_unrestricted_submarine_warfare:	"Uneingeschränkter U-Boot-Krieg"
CZE_unrestricted_submarine_warfare_desc:	" Wir können es uns nicht leisten, jedes Handelsschiff anzuhalten, bevor wir es versenken, da dies unsere U-Boote unnötigen Gefahren aussetzen würde. Wir haben viele Beispiele gesehen, bei denen solche "Handelsschiffe" versteckte Geschütze mitführen, die sie gegen ein aufgetauchtes U-Boot einsetzen und es beschädigen oder sogar versenken. Deshalb müssen wir zur Strategie der uneingeschränkten U-Boot-Kriegsführung zurückkehren und alles ohne Vorwarnung versenken."
CZE_contesting_the_adriatic:	 "Umkämpfte Adria"
CZE_contesting_the_adriatic_desc:	"Nun, da unsere neue Marine bereit ist, ist es an der Zeit, dass wir unsere Präsenz in der Adria geltend machen."
CZE_begin_building_the_radetzky_battleship:	"Mit dem Bau des Schlachtschiffs Radetzky beginnen"
CZE_begin_building_the_radetzky_battleship_desc:	"Um den wachsenden Bedrohungen entgegenzuwirken, müssen wir den schnellstmöglichen Bau unseres neuen Schlachtschiffs sicherstellen."
CZE_quiet_and_deadly:	"Leise und tödlich"
CZE_quiet_and_deadly_desc:	" Durch die Einführung neuer moderner Torpedotypen und den Einbau von Schnorcheln können wir unsere U-Boote viel unauffälliger und tödlicher als je zuvor machen."
CZE_our_battleship_fleet:	"Unsere Schlachtschiff-Flotte"
CZE_our_battleship_fleet_desc:	"Ein einziges Schlachtschiff reicht nicht aus. Wir müssen mit der Planung einer Erweiterung unserer Flotte beginnen."
CZE_our_own_aircraft_carrier:	"Unser eigener Flugzeugträger"
CZE_our_own_aircraft_carrier_desc:	"Da die Marinefliegerei immer gefährlicher wird, wäre es klug, in einen potenziellen Flugzeugträger zu investieren."
CZE_mediterrenean_wolfpacks:	"Wolfsrudel im Mittelmeer"
CZE_mediterrenean_wolfpacks_desc:	" Die Organisation unserer U-Boote in Gruppen wird es uns ermöglichen, ihre Koordination erheblich zu verbessern und gleichzeitig die Effektivität der U-Boote zu steigern."
CZE_heavy_fighter_cover:	"Schwerer Jagdflugzeugschutz"
CZE_heavy_fighter_cover_desc:	"Technologische Fortschritte haben die Marinefliegerei zu einer ernsthaften Bedrohung selbst für die größten und mächtigsten Kriegsschiffe gemacht. Die Entwicklung schwerer Jagdflugzeuge mit einer Reichweite, die groß genug ist, um unsere Seestreitkräfte abzudecken, muss für uns Priorität haben."
CZE_radar_instalations_in_dalmatia:	"Radarstationen in Dalmatien "
CZE_radar_instalations_in_dalmatia_desc:	"RADAR-Anlagen in Dalmatien verschaffen uns einen Vorteil beim Aufspüren feindlicher Schiffe in der Adria. "
CZE_aero_carrier_fighters:	"Avia-Trägerkampfflugzeuge"
CZE_aero_carrier_fighters_desc:	"Anstelle von schweren Landflugzeugen sollten wir uns auf wendige Trägerkampfflugzeuge konzentrieren, um die Luftüberlegenheit für unsere Marine zu erreichen. Die Firma Avia verfügt über einige vielversprechende Entwürfe, die wir für diese Rolle nutzen könnten."
CZE_R56_devalue_the_koruna:	"Abwertung der Krone"
CZE_R56_devalue_the_koruna_desc:	"Die tschechoslowakische Wirtschaft war schon immer exportorientiert, was einer der Gründe war, warum die Weltwirtschaftskrise das Land so hart traf. Eine Abwertung unserer Währung wird die Preise unserer Exportgüter senken und uns ermöglichen, den Erholungsprozess einzuleiten. Gleichzeitig wird ein solcher Schritt im Inland nicht sehr populär sein."
CZE_R56_support_consumer_goods_industry:	"Unterstützung der Konsumgüterindustrie"
CZE_R56_support_consumer_goods_industry_desc:	"Die Tschechoslowakei war schon immer ein exportorientiertes Land. Bevor die Weltwirtschaftskrise das Land traf, gehörten zu den wichtigsten Exportgütern verschiedene landwirtschaftliche Erzeugnisse wie Zucker, Bier und Schinken sowie Glas, Holzprodukte, Papier, Textilien, Kleidung, Schuhe und Lederwaren. Die Unterstützung dieser Branchen wird unsere Erholung beschleunigen."
CZE_R56_eastern_urbanization_project:	"Projekt zur Urbanisierung des Ostens"
CZE_R56_eastern_urbanization_project_desc:	 "Zwischen 1918 und 1938 unternahm die tschechoslowakische Regierung gewisse Anstrengungen zur Entwicklung der slowakischen und ruthenischen Regionen, und Tausende tschechischer Lehrer, Polizisten, Beamter und Geschäftsleute zogen in diese Gebiete."
CZE_R56_expand_heavy_industry:	"Ausbau der Schwerindustrie"
CZE_R56_expand_heavy_industry_desc:	"Als einer der wichtigsten Industriezweige mit relativ modernen Anlagen und Ausrüstungen bildete die Metallindustrie die Grundlage für die technisch fortschrittlichen Maschinenbau- und Elektrotechnikindustrien sowie viele andere Industriezweige in der Tschechoslowakei vor dem Münchner Abkommen."
CZE_R56_prospect_for_new_resources:	"Aussichten auf neue Ressourcen"
CZE_R56_prospect_for_new_resources_desc:	"Zu den wichtigsten Bodenschätzen der Tschechoslowakei zählen Holz, Braunkohle, Bitumenkohle, Graphit und Ton. Eisenerz wurde hauptsächlich in der Slowakei abgebaut, doch die Vorkommen anderer Metalle waren relativ unbedeutend. Ein kleines Bauxitvorkommen befindet sich in Rychnov, Böhmen, und seit 1900 werden in Südmähren kleine, hochwertige Ölvorkommen gefördert."
CZE_R56_chemical_industry_development:	"Entwicklung der chemischen Industrie"
CZE_R56_chemical_industry_development_desc:	"Die Tschechoslowakei verfügte über eine florierende chemische Industrie, die sich vor allem auf den Nordwesten des Sudetenlandes konzentrierte. Als Nazideutschland die Tschechoslowakei annektierte, wurde der Bau wichtiger Raffinerien für synthetisches Öl in Most/Brüx abgeschlossen."
CZE_R56_ramp_up_cement_production:	"Ausbau der Zementproduktion"
CZE_R56_ramp_up_cement_production_desc:	"Unser Staat plant den Bau zahlreicher Großprojekte, von Autobahnen, die das gesamte Land durchziehen, bis hin zu einer beeindruckenden und modernen Verteidigungslinie zum Schutz unserer Grenzen. Das bedeutet, dass wir schon bald große Mengen an Zement benötigen werden."
CZE_R56_allocate_funds_to_rop:	"Mittel für die ŘOP bereitstellen"
CZE_R56_allocate_funds_to_rop_desc:	" Die Vorbereitungen für den Bau einer permanenten tschechoslowakischen Befestigungsanlage reichen bis ins Jahr 1934 zurück. Befestigungsprojekte und -arbeiten unterstanden der neu gegründeten Direktion für Befestigungsarbeiten (ŘOP – Ředitelství Opevňovacích Prací). General Karel Husarek bekleidete während der gesamten Existenz der Direktion das Amt des Direktors für Befestigungsarbeiten."
CZE_R56_improve_highway_connections:	" Verbesserung der Autobahnanbindungen"
CZE_R56_improve_highway_connections_desc:	"Der Bau einer Autobahn vom westlichsten Teil unseres Landes bis zum östlichsten wird die Mobilität unserer Bürger erhöhen und das Reisen sowie den Gütertransport erleichtern."
CZE_R56_expand_the_praha_ruzyne_airport:	"Ausbau des Flughafens Praha-Ruzyne"
CZE_R56_expand_the_praha_ruzyne_airport_desc:	"Der Flughafen Praha-Ruzyne wird der größte Flughafen in der Tschechoslowakei und einer der größten in der Region sein."
CZE_R56_direct_praha_bratislava_railway_connection:	"Direkte Eisenbahnverbindung Praha-Bratislava"
CZE_R56_direct_praha_bratislava_railway_connection_desc:	"Zu Zeiten des Kaiserreichs war es wirtschaftlich sinnvoller, die Eisenbahnstrecken zwischen Prag und Bratislava über Wien zu verbinden. Nun, da das Kaiserreich nicht mehr existiert und Wien in einem fremden Land liegt, haben wir keine direkte Verbindung mehr zwischen den beiden Städten. Es ist wichtig, dieses Problem zu lösen."
CZE_R56_produce_the_slovenska_strela_railcars:	"Produktion der Slovenská-Strela-Triebwagen"
CZE_R56_produce_the_slovenska_strela_railcars_desc:	"Slovenská Strela war der Name eines Expresszuges, der 1936 erstmals eingeführt wurde. Die Slovenská Strela diente als Flaggschiff der ČSD zwischen den Metropolen der Slowakei und Böhmens, fand jedoch nie breite Verbreitung. Mit einigen Modifikationen am ursprünglichen Design können wir sie als unseren Haupttriebwagen für den Personentransport einsetzen."
CZE_R56_expand_the_commercial_tyre_production:	"Ausbau der kommerziellen Reifenproduktion"
CZE_R56_expand_the_commercial_tyre_production_desc:	"Die hohen Kosten des Schienenverkehrs veranlassten das Unternehmen Bata, seine Fahrzeugflotte für den Gütertransport auf der Straße einzusetzen. Um den hohen Kosten für den Import von Reifen für seine Fahrzeugflotte entgegenzuwirken, beschloss das Unternehmen 1934, diese selbst herzustellen."
CZE_R56_support_strategic_industries:	"Strategische Industrien unterstützen"
CZE_R56_support_strategic_industries_desc:	"Viele kleine Industriebetriebe machten die Tschechoslowakei zu einem breit gefächerten Produzenten von Gütern, doch einige wenige Unternehmen dominierten die Wirtschaft und waren von strategischer Bedeutung."
CZE_R56_complete_the_dubnica_nad_vahom_munition_factory:	"Munitionsfabrik Dubnica nad Váhom"
CZE_R56_complete_the_dubnica_nad_vahom_munition_factory_desc:	"Mit der Fertigstellung einer großen Munitionsfabrik in der Stadt wird die Region sicherlich einen dringend benötigten Zustrom von Investoren erleben, was die Infrastruktur und die Lebensbedingungen in diesem Gebiet verbessern wird."
CZE_R56_fund_praga_plants:	"Praga-Werke"
CZE_R56_fund_praga_plants_desc:	"Das Praga-Konstruktionsbüro ist für die Entwicklung und Herstellung der Motoren verantwortlich, die unsere Panzer antreiben. Staatliche Mittel werden ihnen helfen, ihre Innovationskraft aufrechtzuerhalten."
CZE_R56_czech_technical_university:	"Tschechische Technische Universität"
CZE_R56_czech_technical_university_desc:	"Die Tschechische Technische Universität in Prag (ČVUT) ist eine der ältesten Universitäten in Mitteleuropa und wurde 1707 von Kaiser Joseph I. gegründet. Ihr Ausbau wäre für das Land von großem Nutzen."
CZE_R56_establish_new_uranium_mines:	"Neue Uranminen errichten"
CZE_R56_establish_new_uranium_mines_desc:	"Die Tschechoslowakei ist die Wiege des industriellen Uranabbaus. Der Uranabbau in Jáchymov (damals Joachimsthal genannt und zu Österreich-Ungarn gehörend) begann in den 1890er Jahren im industriellen Maßstab, nachdem die Silber- und Kobaltproduktion der Lagerstätte zurückgegangen war."
CZE_R56_nuclear_physics_institute:	"Institut für Kernphysik"
CZE_R56_nuclear_physics_institute_desc:	 "Das Institut für Kernphysik der Tschechoslowakischen Akademie der Wissenschaften wurde 1955, lange nach dem Zweiten Weltkrieg, gegründet. Hätten die historischen Ereignisse jedoch einen anderen Verlauf genommen, hätte die Atomforschung in der Tschechoslowakei möglicherweise viel früher begonnen."
CZE_R56_rocket_research:	 "Raketenforschung"
CZE_R56_rocket_research_desc:	"Raketen- und Strahltriebwerke ermöglichen beispiellose Geschwindigkeiten sowohl für unbemannte als auch für bemannte Schiffe. Die Pionierarbeit bei diesen Technologien ermöglicht es uns, den Feind zu überraschen."
CZE_modify_bm_tt:	"Ändere §Y$CZE_czechoslovak_army_modifier$§! wie folgt:"
CZE_modify_af_tt:	"Ändere §Y$CZE_czechoslovak_airforce_modifier$§! wie folgt:"
