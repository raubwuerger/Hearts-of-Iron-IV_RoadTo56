CZE_state_defense_law:0	"Änderung des Staatsverteidigungsgesetzes"
CZE_state_defense_law_desc:0	 "Um der Bedrohung durch Hitlers Deutschland zu begegnen, hat die Nationalversammlung der Tschechoslowakischen Republik ein neues, umstrittenes Gesetz zum Schutz der Republik und der nationalen Interessen erlassen – das Gesetz 131/1936, das Staatsverteidigungsgesetz. "
CZE_state_defense_law_tooltip_reward:0	"\n §YPolitische Macht§! ODER Verstaatlichung der §YIndustrie§! ODER §YWirtschaftsgesetz§! und §YHandelsgesetz§! ändern."
CZE.405.t:0	"Gesetz 131/1936 Kontroverse"
CZE.405.d:0	"Gesetz Nr. 131/1936 (bekannt als Staatsverteidigungsgesetz) war die dritte und letzte Novelle des ursprünglichen Gesetzes von 1923, die die Befugnisse der Regierung zur Verteidigung der Republik und zur Wahrung des demokratischen Systems in der Tschechoslowakei in Krisenzeiten weiter stärkte.\n\nDer Hauptzweck dieses Gesetzes bestand darin, einer militärischen Bedrohung der Tschechoslowakischen Republik durch Hitlers Deutschland zu begegnen . Die antideutsche Ausrichtung des Gesetzes verschärfte jedoch den ethnischen Konflikt weiter. Dies war einer der Gründe, warum das Vereinigte Königreich sich weigerte, die Tschechoslowakei während der Sudetenkrise zu unterstützen, und sich faktisch auf die Seite Hitlers stellte (Lord-Runciman-Mission).\n\nEine der (vielen) Kontroversen um das Gesetz betraf die Definition der sogenannten "staatsunzuverlässigen Personen". Eine solche Person unterlag mehreren Einschränkungen; so war es ihr beispielsweise untersagt, ein Unternehmen von strategischer Bedeutung zu führen oder wichtige öffentliche Aufträge zu erhalten, sie konnte aber auch ohne Begründung aus dem Arbeitsverhältnis entlassen werden.\n\nDarüber hinaus waren die Behörden nicht verpflichtet, ihre Entscheidung in dieser Angelegenheit zu begründen, und somit war es zulässig, eine solche Entscheidung ohne jegliche Begründung zu treffen. Eine gerichtliche Überprüfung des "Status als unzuverlässige Person" war nicht möglich. All dies machte das Gesetz in hohem Maße missbrauchsanfällig.\n\nDas Gesetz erlaubte es der Regierung zudem, im Falle eines nationalen Notstands strenge Kontrollen über alle Industrieunternehmen zu verhängen, die sie als wesentlich für ihre Sicherheit erachtete. \n\nObwohl man die Legitimität der Bemühungen, die Tschechoslowakei angemessen gegen äußere Bedrohungen zu verteidigen, nicht leugnen kann, ging das Gesetz weit über das hinaus, was in einem demokratischen Rechtsstaat zulässig ist.\n\nZiemlich ironischerweise erwies sich das Staatsverteidigungsgesetz nach der Besetzung 1939 als wirksames Instrument für die Wehrmacht. Es ermöglichte die rasche Beschlagnahmung der Rüstungsindustrie des neu errichteten Protektorats.\n\nEin deutscher Rüstungsexperte bezeichnete es angeblich als "eines der besten Gesetze zur Kriegswirtschaft in Mitteleuropa" und "ein Musterbeispiel für straffe Organisation, die in einer Hand konzentriert ist", um alle für die Rüstungsproduktion notwendigen Zweige effektiv zu kontrollieren.\n\nDer Minister für Nationale Verteidigung, František Machník, gehörte zu den größten Befürwortern des Staatsverteidigungsgesetzes."
CZE.405.a:0	"Unterdrückung der deutschen politischen Opposition."
CZE.405.b:0	"Durchführung von Notmaßnahmen."
CZE.405.c:0	"Verstaatlichung strategischer Industriezweige."
