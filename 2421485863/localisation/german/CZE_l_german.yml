CZKE_democratic_reforms:0	"Autonomie des Sudetenlandes vorbereiten"
CZKE_democratic_reforms_desc:0	"Es ist an der Zeit, die Minderheitenfrage in der Tschechoslowakei endgültig zu lösen und ein gewisses Maß an Autonomie für die von Deutschen besetzten Gebiete vorzubereiten, bevor die internen ethnischen Konflikte die Republik verschlingen."
CZKE_democratic_reforms_tooltip:0	"Die 'Verfassungsreformen' sind abgeschlossen."
CZKE_democratic_reforms_tooltip_reward:0	"§YPolitischer§! Zusammenhang mit §YVorläufiger Nationaler Gedanke§! erforderlich, um die ethnisch-deutsche Frage verfassungsmäßig zu lösen."
czke.406.t:0	"Sudetendeutsche Krise abwenden"
czke.406.d:0	"Seit der Gründung der Tschechoslowakei im Jahr 1918 empfand die bedeutende deutsche Minderheit extreme Unterdrückung und Verweigerung des Wahlrechts. Die meisten vertraten die Ansicht, dass das Sudetenland mit seiner überwältigenden deutschen Bevölkerungsmehrheit und seiner ausgeprägten Kultur und seinem wirtschaftlichen Potenzial seine politischen Angelegenheiten autonom regeln sollte. Die tschechoslowakische Regierung lehnte konsequent jeden Gedanken an Autonomie für die Sudetendeutschen ab, da es lähmend wirkte, fast einem Drittel des Landes Autonomie und Kontrolle über eines der wichtigsten Industriezentren zu geben. Die Sudetendeutschen reagierten darauf mit einer zunehmenden politischen Radikalisierung: Der gleichzeitige Aufstieg des pangermanischen Adolf Hitler in Deutschland im Jahr 1933 mit seiner Rhetorik, alle Deutschen in ganz Europa gegen die Perfidie und "Unterdrückung" der Slawen zu vereinen, zog die Sudetendeutschen stark zum rassistischen und rechtsextremen Nationalismus hin. Die überwiegende Mehrheit der Sudetendeutschen forderte bald eine fast vollständige Autonomie oder sogar Unabhängigkeit von der Tschechoslowakei und einen möglichen Anschluss an das Dritte Reich. Die führende Avantgarde der pangermanistischen Bewegung war die Sudetendeutsche Partei (SdP) von Konrad Henlein. Das friedliche Zusammenleben zwischen Tschechen und Deutschen in der Tschechoslowakei war immer eine Angelegenheit eines relativ kleinen Teils der deutschen und tschechischen Bevölkerung unter der Führung einzelner Politiker. In der angespannten Zeit Anfang 1938 verschärften Wellen von extremem Nationalismus auf beiden Seiten die Situation.\n\nEs ist anzumerken, dass die Zugeständnisse, die die tschechoslowakische Regierung Ende 1938 machte, für die Sudetendeutschen höchstwahrscheinlich ausgereicht hätten, wenn sie vor 1938 umgesetzt worden wären.\n\nLeider kamen die Reformen und die Entwürfe der Autonomiegesetze an einem Punkt, an dem es kein Zurück mehr gab und nichts mehr ändern konnten. Hitler war entschlossen, die Tschechoslowakei zu zerstören, und Henleins SdP und der eskalierte ethnische Konflikt waren für seine Pläne entscheidend."
czke.406.a:0	"Bereiten Sie die Verfassungsreformen vor."
CZKE_constitutional_reforms:0	"Verfassungsreform."
CZKE_constitutional_reforms_desc:0	"Die Autonomie des Sudetenlandes wird vorbereitet, und die neuen Verfassungsreformen und Gesetze werden umgesetzt."
