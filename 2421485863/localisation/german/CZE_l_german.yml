CZE_empower_internationalism:0	"Rote Gewerkschaften mobilisieren"
CZE_empower_internationalism_desc:0	"Die KSČ war die tschechoslowakische Sektion der Kommunistischen Internationale, und die so sogenannten Roten Gewerkschaften wurden 1922 gegründet. Ab 1928 war die Partei mit geschätzten rund 138.000 Mitgliedern die zweitgrößte Sektion der Internationale. "
CZE_empower_internationalism_tooltip_reward:0	"\nWahl zwischen zwei §Ykommunismusbezogenen §!§Ynationalen Ideen§!."
CZE.404.t:0	"Profintern in der Tschechoslowakei"
CZE.404.d:0	"Die Rote Internationale der Gewerkschaften (RILU), allgemein bekannt als Profintern, war eine internationale Organisation, die von der Kommunistischen Internationale gegründet wurde, um kommunistische Aktivitäten innerhalb der Gewerkschaften zu koordinieren.\n\nIn den 1920er Jahren schlossen sich die meisten Gewerkschaftsmitglieder der Tschechoslowakei der RILU an, nachdem die sozialdemokratische Führung eine Kampagne zur Ausweisung kommunistischer Einzelpersonen und Gewerkschaften durchgeführt hatte. Im Oktober 1922 hielten die tschechischen roten Gewerkschaften einen Kongress ab, auf dem sie die Spaltung von den sozialdemokratischen Gewerkschaften formalisierten.\n\nDie Kommunistische Partei der Tschechoslowakei war in dieser Zeit eine riesige Organisation, die 1922 170.000 Mitglieder zählte und damit alle bis auf wenige kommunistische Parteien weltweit in den Schatten stellte.\n\nWährend der Weltwirtschaftskrise in der ersten Hälfte der 1930er Jahre organisierten die Roten Gewerkschaften eine Reihe von Streiks und Demonstrationen und arbeiteten dabei mit Mitgliedern anderer Gewerkschaften zusammen.\n\nEiner der bedeutendsten Gewerkschaftsstreiks in Mitteleuropa wurde im März 1932 von den Roten Gewerkschaften in Most, Tschechoslowakei, organisiert. Was als kleiner Streik entlassener Bergleute aus den Bergwerken "Nelson" und "Humboldt II" begann, eskalierte schnell zu einem Generalstreik der gesamten Bergbauregion, begleitet von einer Demonstration mit über 40.000 Menschen. Bei Zusammenstößen zwischen den Demonstranten und der örtlichen Polizei sowie den Streitkräften kamen zwei Menschen ums Leben, achtzehn wurden verletzt. \n\nIn der zweiten Hälfte der 1930er Jahre riefen die Roten Gewerkschaften zur Vereinigung der tschechoslowakischen Gewerkschaftsbewegung auf, um eine Einheitsfront gegen den Faschismus zu bilden. Nach der Besetzung durch Deutschland wurden die Roten Gewerkschaften 1939 offiziell aufgelöst."
CZE.404.a:0	"Den Einfluss der Roten Gewerkschaften stärken."
CZE.404.b:0	"Mehr Gewerkschaftsstreiks organisieren!"
