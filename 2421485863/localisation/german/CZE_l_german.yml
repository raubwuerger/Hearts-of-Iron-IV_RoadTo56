generic_mio_increased_performance:	"Leistungssteigerung"
generic_mio_increased_reliability:	"Erhöhte Zuverlässigkeit"
generic_mio_turbojet_experimentation:	"Versuche mit Turbostrahltriebwerken"
CZE_paradesant_brigade:0	"Aufstellung von Fallschirmjägerbrigaden "
CZE_paradesant_brigade_desc:0	"Auf der Grundlage der [SOV.getAdjective] und der französischen Fallschirmjäger-Ausbildungsprogramme beschloss das tschechoslowakische Oberkommando im Sommer 1938, mit den Vorbereitungen für die Gründung von Fallschirmjägereinheiten zu beginnen. Die 3. Abteilung /Luftwaffe/ des Ministeriums für Staatsverteidigung war für die Grundlagenarbeit zuständig."
CZE_advanced_aircraft_prototypes:0	"Entwicklung neuer Flugzeuge"
CZE_advanced_aircraft_prototypes_desc:0	"Tschechoslowakische Unternehmen müssen in der Luft- und Raumfahrtindustrie schnell aufholen, entweder durch die Entwicklung eigener Prototypen oder durch den Erwerb von Lizenzen zur Produktion erfolgreicher ausländischer Flugzeuge."
CZE_jet_engine_research:0	"Forschung an Strahltriebwerken "
CZE_jet_engine_research_desc:0	"Raketen- und Strahltriebwerke ermöglichen beispiellose Geschwindigkeiten sowohl für unbemannte als auch für bemannte Flugzeuge. Die Pionierarbeit bei diesen Technologien ermöglicht es uns, den Feind zu überraschen."
CZE_legacy_of_legions:0	"Das Erbe der Tschechoslowakischen Legion"
CZE_legacy_of_legions_desc:0	"Die Tschechoslowakische Legion war eine freiwillige Streitmacht, die überwiegend aus Tschechen und einer kleinen Anzahl von Slowaken, die im Ersten Weltkrieg gemeinsam mit den Entente-Mächten kämpften. Nach der Gründung der Tschechoslowakei traten viele ehemalige Legionäre in den Dienst der neu gegründeten tschechoslowakischen Armee ein und brachten ihre wertvollen Kampferfahrungen mit."
CZE_legacy_of_legions_tooltip_reward:0	"\n§YPolitische Macht§! ODER §YFreiwillige§! im Zusammenhang mit §YNationale Idee§! ODER §YArmeeerfahrung§!."
CZE_czechoslovak_volunteers_idea:0	"Tschechoslowakischer Freiwilligenverband"
CZE_czechoslovak_volunteers_idea_desc:0	 "Das tschechoslowakische Freiwilligenwesen hat eine lange Tradition. Während des Spanischen Bürgerkriegs kämpften fast 1.000 Tschechoslowaken als Teil der internationalen Brigaden auf der Seite des republikanischen Spaniens."
CZE.300.t:0	"Geschichte der Tschechoslowakischen Legion"
CZE.300.d:0	" Die Tschechoslowakische Legion war eine freiwillige Streitmacht, die sich überwiegend aus Tschechen und einer kleinen Anzahl von Slowaken zusammensetzte und während des Ersten Weltkriegs an der Seite der Entente-Mächte kämpfte. Ihr Ziel war es, die Unterstützung der Alliierten für die Unabhängigkeit Böhmens und Mährens vom Österreichischen Reich sowie der slowakischen Gebiete vom Königreich Ungarn zu gewinnen, die damals Teil des Österreichisch-Ungarischen Reiches waren.\n\nMit Hilfe von im Exil lebenden Intellektuellen und Politikern wie Tomáš Garrigue Masaryk und Milan Rastislav Štefánik wuchs sie zu einer Streitmacht von Zehntausenden heran, die in Freiwilligeneinheiten an allen Fronten kämpften.\n\nIn Russland nahmen sie an mehreren Schlachten teil, darunter die Schlachten von Zborov und Bachm , gegen die Mittelmächte. Sie waren maßgeblich am russischen Bürgerkrieg beteiligt, kämpften gegen die Bolschewiki und kontrollierten die gesamte Transsibirische Eisenbahn sowie mehrere große Städte in Sibirien.\n\nDer Feldzug der Tschechoslowakischen Legion in Sibirien beeindruckte die Politiker der Alliierten und weckte ihr Interesse an der Idee eines unabhängigen tschechoslowakischen Staates. Während die Legionäre von einem Sieg zum nächsten eilten, erhielt der Nationalrat erhielt offizielle Anerkennungserklärungen von verschiedenen alliierten Regierungen.\n\nAls der Waffenstillstand mit den Bolschewiken geschlossen wurde, begann die Legion mit der langsamen Evakuierung der tschechoslowakischen Truppen aus Wladiwostok, und die letzten Legionäre verließen den Hafen im September 1920. Diese Männer reisten um die ganze Welt, bevor sie ihre neu unabhängige Heimat erreichten. \n\nNach ihrer Rückkehr in die Tschechoslowakei bildeten viele von ihnen den Kern der neuen tschechoslowakischen Armee. Sie machten etwa ein Drittel aller Soldaten der neu geschaffenen Armee aus, dominierten jedoch das Oberkommando. Fast alle Generäle waren Legionäre, insbesondere diejenigen aus Russland.\n\nDer Tschechoslowakische Legionärsverband wurde 1921 durch den Zusammenschluss verschiedener Legionärsorganisationen von allen Schlachtfeldern des Ersten Weltkriegs gegründet."
CZE.300.a:0	"Den Einfluss des Tschechoslowakischen Legionärsverbands nutzen."
CZE.300.b:0	"Militärische Freiwilligenorganisationen unterstützen."
CZE.300.c:0	"Lehren aus dem Ersten Weltkrieg."
CZE_reorganize_general_staff:0	"Den Generalstab neu organisieren"
CZE_reorganize_general_staff_desc:0	"Die Organisationsstruktur der tschechoslowakischen Armee basierte ursprünglich auf der französischen Kommandostruktur, und die ersten Generalstabschefs waren französische Generäle. Sobald eine neue Generation tschechischer Offiziere ausgebildet war, wurden französische Offiziere nicht mehr benötigt."
CZE_reorganize_general_staff_tooltip_reward:0	"\nWahl zwischen drei verschiedenen §YGeneralstabschefs§! für die tschechoslowakische Armee. "
CZE.301.t:0	"Generalstab der tschechoslowakischen Armee"
CZE.301.d:0	"Die letzte größere Umstrukturierung des Generalstabs der tschechoslowakischen Armee erfolgte 1933, als der ehemalige Chef General Syrovy zum Generalinspekteur der Streitkräfte ernannt wurde und ein Nachfolger für ihn gefunden werden musste.\n\nEs gab mehrere geeignete Kandidaten, doch zur Überraschung vieler fiel die Wahl auf den fleißigen, aber weitgehend unbekannten Kommandeur des Landheeres in Košice, General Ludvík Krejčí (im Bild) , ausgewählt. Seine Ernennung stellte für die meisten politischen Parteien und die Armeekreise einen tragfähigen Kompromiss dar.\n\nAllerdings wurden auch mehrere andere starke Kandidaten in Betracht gezogen. Für einen Moment war sogar der Leiter der französischen Militärmission, General Fulcher, ein Kandidat, doch dies wäre ein Rückschritt gewesen, weshalb diese Option für die tschechische politische Vertretung nicht akzeptabel war. \n\nEine der interessantesten Optionen war General Lev Prchala, der ehemalige stellvertretende Stabschef unter General Syrový. Er war ein prinzipientreuer und tatkräftiger Mann, offen für moderne Kriegskonzepte und ein Verfechter mobiler Manöver gegenüber statischer Verteidigung. Seine größte "Schwäche" war seine deutsche Ehefrau, was seine Gegner gegen ihn ausnutzten und ihn zu einer inakzeptablen Wahl für das Amt des Stabschef machte.\n\nWährend der Münchner Krise war Prchala Kommandeur der IV. Armee, die Südmähren verteidigte. Er war entschieden gegen die Abtretung des Sudetenlandes, und seine Ansichten führten schließlich dazu, dass er während des Zweiten Weltkriegs von Edvard Beneš abgelehnt wurde. Nach dem Krieg blieb er im Exil und arbeitete mit den sudetendeutschen Organisationen zusammen, die nach der Vertreibung der Deutschen aus der Tschechoslowakei gegründet worden waren.\n\nEs gibt ein interessantes Gerücht über seine angebliche Beteiligung an einem nie realisierten Militärputschversuchs. Seinem Sohn zufolge bereute er sein ganzes Leben lang, dass er Präsident Beneš während der Münchner Krise nicht erschossen hatte.\n\nEin weiterer ernstzunehmender Kandidat war General Vojtìch Luža, damals Leiter der Kriegsakademie in Prag und Befürworter einer offensiven Panzerkriegsführung, die auf den Ideen und Taktiken der französischen Marschälle Foch und Ludendorff und des deutschen Generals Guderian. Luža war während der Münchner Krise Befehlshaber der II. Armee und während der Besatzungszeit Mitglied des Untergrundwiderstands. Er starb bei einem der Feuergefechte mit den Sicherheitskräften des Protektorats."
CZE.301.a:0	" Bestätigen Sie General Krejčí."
CZE.301.b:0	"Ernennen Sie General Prchala."
CZE.301.c:0	"Ernennen Sie General Luža."
CZE_military_maneuvers:0	"Militärmanöver organisieren"
CZE_military_maneuvers_desc:0	 "Die tschechoslowakische Armee testete ihre neue Organisation und ihre Fähigkeiten während großer Militärmanöver, die im August und September 1936 stattfanden. Das gesamte Unterfangen lieferte wertvolle Erkenntnisse und sandte eine klare Botschaft an Europa über die Einsatzbereitschaft der tschechoslowakischen Streitkräfte."
CZE_military_maneuvers_tooltip_reward:0	""
CZE_prepare_new_plan:0	"Neue Verteidigungsstrategie vorbereiten"
CZE_prepare_new_plan_desc:0	"Mit dem Aufstieg Hitlers und seinen Forderungen nach der Vereinigung der deutschen Minderheiten (der Sudetendeutschen) und der Rückgabe anderer beanspruchter Gebiete (des Sudetenlandes) erarbeiteten die alarmierte tschechoslowakische Führung und das Oberkommando neue Verteidigungspläne."
CZE_prepare_new_plan_tooltip_reward:0	""
CZE_2nd_departnment:0	"Erweiterung der 2. Abteilung"
CZE_2nd_departnment_desc:0	"Die 2. Abteilung des Generalstabs war der zwischen 1919 und 1939 in der Tschechoslowakei tätige Militärgeheimdienst, der für Spionage und Spionageabwehr -Spionage sowie für Operationen zuständig."
CZE_2nd_departnment_tooltip_reward:0	"\n §YElektronik und Informatik§!bezogener §YForschungsbonus§!. "
CZE.304.t:0	"2. Abteilung des Generalstabs"
CZE.304.d:0	"Seit ihrer Gründung musste sich die Tschechoslowakische Republik mit einer Reihe von innenpolitischen Problemen auseinandersetzen, die vor allem durch die Aktivitäten zahlreicher nationaler Minderheiten gekennzeichnet waren, die innerhalb der Landesgrenzen lebten und eine fruchtbare Basis für Spionage und potenzielle Sabotageaktivitäten darstellten.\n\nDoch erst die Aufdeckung der Spionagetätigkeit des deutschen Konsuls in Prag, Baron Gabsattel, im Jahr 1919, die das Hauptquartier der tschechoslowakischen Armee dazu veranlasste, einen neuen, eigenständigen Militärgeheimdienst zu gründen: die 2. Abteilung des Generalstabs.\n\nIn den ersten Jahren hatte die 2. Abteilung vor allem mit Personalmangel zu kämpfen, da der Leiter des Militärgeheimdienstes der damaligen österreichisch-ungarischen Armee, Brigadegeneral Max Ronge, dagegen war, Offiziere tschechischer Nationalität in den Geheimdienst der Monarchie aufzunehmen. Es dauerte etwa ein Jahrzehnt, bis eine neue, jüngere Generation von Offizieren an der Militärakademie und der Kriegsakademie ausgebildet wurde. Das Niveau der nachrichtendienstlichen Aktivitäten konnte schrittweise gesteigert werden. Die 2. Abteilung bestand aus zwei Gruppen. Die Suchgruppe war in offensive und defensive Abteilungen unterteilt, und die Planungs- und Studiengruppe hatte mehr oder weniger analytischen Charakter.\n\nIn den turbulenten Jahren vor dem Zweiten Weltkrieg war Oberstleutnant František Moravec von 1937 bis 1939 Leiter der 2. Abteilung, bevor es ihm und zehn seiner Geheimdienskollegen gelang, einen Tag vor der Besetzung der Tschechoslowakei durch Nazideutschland heimlich mit den wertvollsten Geheimdienstakten und Archiven von Prag nach London zu fliegen.\n\nWährend des Krieges spielte eine entscheidende Rolle bei der Planung und Vorbereitung der Operation Anthropoid, der Ermordung von Reichsprotektor Reinhard Heydrich im Jahr 1942."
CZE.304.a:0	"Erweitern Sie die 2. Abteilung."
CZE_intelligence_service_offense:0	"Erweitern Sie die Offensive Sektion"
CZE_intelligence_service_offense_desc:0	 "Die Hauptaufgabe der Offensivabteilung der Suchgruppe bestand darin, externe Informationen über militärische Bedrohungen zu beschaffen, wobei ihr Hauptinteresse militärischen, politischen und wirtschaftlichen Daten galt."
CZE_intelligence_service_defense:0	"Erweitern Sie die Defensivabteilung"
CZE_intelligence_service_defense_desc:0	"Das Hauptziel der Verteidigungsabteilung des Militärgeheimdienstes bestand darin, die Infiltration ausländischer Spionagegruppen in die tschechoslowakische Armee und in Bereiche zu verhindern, die für die Verteidigung der Tschechoslowakei notwendig waren (Rüstungsindustrie, Entwicklung von Verteidigungsanlagen usw.)."
CZE_infiltrate_abwehr:0	"Infiltration der Abwehr"
CZE_infiltrate_abwehr_desc:0	"Die Situation der deutschen Minderheit in der Tschechoslowakei schuf hervorragende operative Voraussetzungen für die Aktivitäten der deutschen Abwehr und deren Spionage. Dies konnte die Abwehr jedoch auch den Versuchen des tschechoslowakischen Spionageabwehrdienstes aussetzen, die Abwehr mit Doppelagenten zu infiltrieren."
CZE_infiltrate_abwehr_tooltip_reward:0	"\n §YNachrichtendienst§! im Zusammenhang mit §Yder nationalen Idee§!."
CZE.305.t:0	"Die Geschichte von Agent A-54 "
CZE.305.d:0	"Paul Thümmel, alias Agent A-54, war ein deutscher Doppelagent, der für die Tschechoslowakei spionierte. Er nahm 1932 Kontakt zur 2. Abteilung auf, hauptsächlich weil er Geld für seinen verschwenderischen Lebensstil benötigte, und bot auf dem Papier seine Zusammenarbeit an.\n\n Er war ein hochrangiges Mitglied der deutschen Militärgeheimdienstorganisation, der Abwehr. Außerdem war er ein hochdekoriertes NSDAP-Mitglied mit guten Verbindungen, die auf seine Tätigkeit als Gründungsmitglied der SA zurückgingen.\n\nEr lieferte tschechischen Agenten eine Vielzahl wichtiger Informationen über die deutschen Geheimdienste, die diese wiederum an den SIS in London weiterleiteten. Thümmel lieferte zudem Einzelheiten zu "militärischen Fähigkeiten und Absichten" sowie "detaillierte Informationen über die Organisation und Struktur der Abwehr und des SD" zusammen mit "der nahezu vollständigen Truppenaufstellung der Wehrmacht und der Luftwaffe sowie deutschen Mobilisierungsplänen". Später soll er zudem Vorwarnungen vor der deutschen Annexion des Sudetenlandes und den Invasionen in die Tschechoslowakei und nach Polen gegeben haben.\n\nIm Oktober 1941 beschuldigte die Gestapo SS-Offizier Paul Thümmel, jugoslawische Beamte über den deutschen Angriff auf ihr Land im April 1941 informiert zu haben. Sie verdächtigten ihn zudem der Zusammenarbeit mit dem tschechischen Widerstandskämpfer Hauptmann Vaclav Moravek. Thümmel versorgte die Abwehr regelmäßig mit geheimen SS-Informationen. Daher trat der Chef der Abwehr, Admiral Canaris, hervor, um ihn als Doppelagenten der Abwehr zu verteidigen. \n\nHistoriker diskutieren bis heute, ob Agent A-54 tatsächlich ein "Ass" unter den Doppelagenten war oder nur ein ausgeklügelter Trick der Abwehr, um dem tschechoslowakischen Geheimdienst und den Alliierten Fehlinformationen zuzuspielen. Nichtsdestotrotz wurde Thümmel schließlich gefasst, wegen Hochverrats angeklagt und später im April 1945 von der SS im Konzentrationslager Theresienstadt hingerichtet."
CZE.305.a:0	"Kontaktieren Sie Agent A-54."
CZE_military_intelligence_service_idea:0	"Militärischer Nachrichtendienst"
CZE_sabotage_anchluss:0	"Sabotage des österreichisch-deutschen Bündnisses"
CZE_sabotage_anchluss_desc:0	"Die Wiederherstellung der Habsburgermonarchie ist für die Tschechoslowakei eine ebenso große Bedrohung wie der Austrofaschismus und ein potenzielles österreichisch-deutsches Bündnis. Wir müssen dies um jeden Preis verhindern."
CZE_sabotage_anchluss_tooltip_reward:0	" \n §OSonderbonus:§! Österreich wird eine viel größere Chance haben, deutschen Versuchen, das Land zu übernehmen, Widerstand zu leisten."
CZE_support_oster:0	"Putsch von Wehrmachtsoffizieren unterstützen"
CZE_support_oster_desc:0	" Unsere Quellen in der Abwehr berichten, dass es möglicherweise Versuche geben könnte, Hitler zu stürzen. Vielleicht könnten wir unseren Informanten nutzen, um diese Initiative stillschweigend zu unterstützen."
CZE_support_oster_tooltip_reward:0	 " \n §OSonderbonus:§! Einige Wehrmachtsoffiziere könnten Hitler töten und einen Bürgerkrieg auslösen, um die Nazis von der Macht zu entfernen."
CZE.309.t:0	"Hitler ist tot!"
CZE.309.d:0	" [Root.GetLeader], es scheint, dass einige Wehrmachtsoffiziere Adolf Hitler ermordet haben und nun verschiedene Fraktionen um die Macht in der NSDAP kämpfen. Ein Teil des deutschen Militärs befindet sich nun in offener Revolte und versucht, die Nationalsozialisten zu entmachten, bevor sie Deutschland zerstören können.\n\nDer Stabschef wartet darauf, die Lage mit Ihnen im Nebenzimmer zu besprechen."
CZE.309.a:0	"Wir sollten sofort eingreifen!"
CZE.309.b:0	"Wir mischen uns nicht in deutsche Angelegenheiten ein."
CZE_soviet_intelligence:0	"VONAPO 20"
CZE_soviet_intelligence_desc:0	 "Eine [SOV.getAdjective] Geheimdienststation mit dem Codenamen VONAPO 20 wurde 1936 in Prag als gemeinsames Projekt zum Informationsaustausch zwischen dem tschechoslowakischen und dem [SOV.getAdjective] Geheimdienst eingerichtet."
CZE_soviet_intelligence_tooltip_reward:0	" \n §YGeheimdienste§! im Zusammenhang mit der §Ynationalen Idee§!."
CZE.310.t:0	"Tschechoslowakisch-[SOV.getAdjective] Geheimdienstzusammenarbeit in der Zwischenkriegszeit"
CZE.310.d:0	"Die Tschechoslowakei gehörte nicht zu den Hauptzielen der sowjetischen Spionage. Der Kreml interessierte sich viel mehr für Polen und Deutschland. Dennoch beobachteten die bolschewistischen Agenten die zahlreichen russischen und ukrainischen Emigranten, die sich in der Tschechoslowakei niedergelassen hatten, streng, und GRU-Agenten betrieben zudem umfangreiche Industriespionage.\nAngesichts der zunehmenden Bedrohung der Republik durch Deutschland begann die zweite Abteilung eine intensive Zusammenarbeit mit dem sowjetischen Militärgeheimdienst GRU. Die Tschechoslowakei war kein Ziel für sowjetische Spione mehr, sondern wurde zu einem "sicheren Brückenkopf" für Aktionen in Deutschland und Westeuropa.\n\nGleichzeitig ging die industrielle Spionage zurück, da die tschechischen Rüstungsunternehmen ihre Produkte an [SOV.getnameDef] lieferten. [SOV.getAdjective] Spezialisten wurden in tschechischen Fabriken ausgebildet.\n\nEine spezielle gemeinsame Operation mit dem Codenamen VONAPO 20, wurde am 27. Mai 1936 ins Leben gerufen, um Geheimdienstinformationen auszutauschen. Abgesehen von zwei Konferenzen verlief der Informationsfluss jedoch nur in eine Richtung: von Prag nach Moskau. Die Russen lieferten in der Regel keine Informationen.\n\nStabskapitän Karel Paleček war bis zur Besetzung der Tschechoslowakei für das Projekt VONAPO 2 0 bis zur Besetzung der Tschechoslowakei verantwortlich. Er war einer der zehn Geheimdienstoffiziere, die Oberst Moravec 1939 bei seiner Flucht nach London begleiteten."
CZE.310.a:0	"VONAPO-20-Treffen organisieren."
CZE_vonapo20_idea:0	"VONAPO 20"
CZE_vonapo20_desc_idea:0	 "Eine gemeinsame [SOV.getAdjective] Geheimdienststation in Prag."
CZE_uranium_for_soviets:0	"Uran für [SOV.getAdjective]s bereitstellen"
CZE_uranium_for_soviets_desc:0	"Der NKWD hat uns mit einem spannenden Angebot bezüglich unseres Urans kontaktiert. Ihre Absichten bleiben ein Rätsel; jedoch bieten die [SOV.getAdjective]s eine beträchtliche Vergütung für die diskrete Beschaffung von Uran außerhalb offizieller Kanäle."
CZE_uranium_for_soviets_tooltip_reward:0	"\n Möglicher Austausch von §YZivilindustrie§! gegen §YRessourcen§!."
CZE.311.t:0	"Uran an [SOV.getnameDef] verkaufen"
CZE.311.d:0	 "Das [SOV.getAdjective]-Projekt zur Entwicklung einer Atombombe begann während des Zweiten Weltkriegs aufgrund der Entdeckung des amerikanischen, britischen und kanadischen Atomprojekts. Das Projekt wurde vom [SOV.getAdjective]-Kernphysiker Igor Kurchatov geleitet, während die militärische Logistik und die nachrichtendienstlichen Maßnahmen vom NKWD-Volkskommissar Lawrenti Beria übernommen und verwaltet wurden. \n\nDas mit Abstand größte Problem in der Anfangsphase des sowjetischen Projekts war die Beschaffung von Uranerz, da die UdSSR zu Beginn des Projekts über keine bekannten heimischen Vorkommen verfügte. Die großen Lagerstätten in Kasachstan und anderen Regionen der Sowjetunion waren noch nicht entdeckt worden, sodass das Projekt auf ausländische Quellen angewiesen war.\n\nEs ist nicht abwegig anzunehmen, dass eine engere Zusammenarbeit zwischen dem tschechoslowakischen Geheimdienst und dem NKWD dazu genutzt werden könnte, heimlich Uranerz aus Jachymov zu beschaffen – im Austausch gegen Öl oder andere Bodenschätze, an denen es der tschechischen Industrie schmerzlich mangelte."
CZE.311.a:0	"Versuchen Sie, einen Deal mit ihren Agenten auszuhandeln"
CZE.312.t:0	"Tschechoslowakisches Uran für das [SOV.getAdjective] Atomprogramm"
CZE_hungarian_alliance:0	"Ungarisches Bündnis "
CZE_hungarian_alliance_desc:0	"Nun, da in Ungarn die Demokratie wiederhergestellt wurde, müssen sie unsere Verbündeten werden und nicht unsere Feinde."
CZE.312.d:0	"Genosse [SOV.GetName], der NKWD berichtet, dass er hochwertiges Uranerz aus der Tschechoslowakei im Austausch gegen Rohöllieferungen und andere Ressourcen für deren Industrie beschaffen kann. Sollten wir das Geschäft aushandeln und uns das Uran sichern?"
CZE.312.a:0	"Da. Sichern Sie so viel wie möglich für unsere Forschung."
CZE.312.b:0	"Besorgen Sie einfach ein paar Proben; wir haben im Moment andere Prioritäten."
CZE.313.t:0	" Die [SOV.getAdjective]s sind an unserem Uran interessiert"
CZE.313.d:0	"Herr Ministerpräsident, unser Militärgeheimdienst berichtet, dass sie das Geschäft mit dem NKWD abgeschlossen haben. Die Lieferungen der Ressourcen werden in Kürze beginnen und in einem gesicherten Militärlager in den ruthenischen Bergen gelagert werden."
CZE.313.a:0	"Ausgezeichnet"
CZE.314.t:0	 "Die [SOV.getAdjective]s haben kein Interesse an unserem Uran."
CZE.314.d:0	"Herr Ministerpräsident, unser Militärgeheimdienst berichtet, dass die [SOV.getAdjective]s kein Interesse an regelmäßigen Uranlieferungen haben. Sie möchten jedoch eine kleine Menge Uran für ihre theoretische Kerntechnologieforschung kaufen."
CZE.314.a:0	"Bedauerlich, aber immer noch besser als nichts."
CZE_french_military_mission:0	"Die französische Militärmission"
CZE_french_military_mission_desc:0	"Auf Ersuchen der Regierung wurde 1919 eine Gruppe von Offizieren der französischen Armee in die Tschechoslowakei entsandt, um beim Aufbau und der Organisation der neu geschaffenen Armee sowie bei der Ausbildung neuer Offiziere zu helfen."
CZE_french_military_mission_tooltip_reward:0	"\n§GFranzösisch-tschechoslowakisches Bündnis§! und Freier §YTheoretiker§! ODER §YArmeeerfahrung§!."
CZE_czech_france_alliance:0	" Französisch-tschechoslowakisches Bündnis"
CZE.315.t:0	"Ursprünge der französischen Militärmission in der Tschechoslowakei"
CZE.315.d:0	"Kurz nach der Unabhängigkeitserklärung wurde eine Militärmission in die Tschechoslowakei entsandt, um beim Aufbau einer Armee und der Ausbildung von Offizieren zu helfen. Die erste Bewährungsprobe für die Armee kam 1919 mit dem kurzen Krieg gegen Ungarn um die Slowakei. Als der Krieg vorbei war, erlebte Pellé eine Phase großer Beliebtheit in der tschechoslowakischen Öffentlichkeit.\n\nUnter dem Kommando des Generals bewies die tschechoslowakische Armee ihre Kampfbereitschaft und gewann ihre Ehre zurück. Pellé beabsichtigte, dies zu seinem Vorteil zu nutzen, um sein Konzept einer ständigen tschechoslowakischen Armee als Teil der Alliierten Armee voranzutreiben. Er wollte dies im neuen tschechoslowakischen Verteidigungsgesetz verankern, was ihm 1920 im Wesentlichen gelang. Die erste tschechoslowakische Militärakademie wurde 1920 eröffnet, um hochrangige einheimische Offiziere auszubilden .\n\nAls Generalstabschef leitete General Pellé von 1919 bis 1920 die französische Mission in der Tschechoslowakei. Als Soldat und Diplomat war er sich seiner einzigartigen Position in der Tschechoslowakei voll bewusst: als Vermittler zwischen der Tschechoslowakei und Frankreich. Mehrfach stellte sich Pellé hinter die Tschechoslowakei und und riskierte damit die Missbilligung seines französischen Vorgesetzten. Er hatte dafür auch persönliche Gründe, denn in Prag lernte er seine zukünftige Frau kennen, die er 1921 heiratete. \n\nGeneral Eugène Mittelhausser löste Pellé 1921 ab und war bis 1926 Leiter der Militärmission, bis er von Louis Eugène Faucher abgelöst wurde, der das Amt bis 1938 innehatte.\n\nIn Paris wurde am 25. Januar 1924 der Bündnis- und Freundschaftsvertrag zwischen Frankreich und der Tschechoslowakei unterzeichnet."
CZE.315.a:0	"Die Kompetenzen der Mission stärken."
CZE.315.b:0	"Die Mittel für Militärakademien aufstocken."
CZE_france_alliance:0	"Wissenschaftlicher und kultureller Austausch"
CZE_france_alliance_desc:0	"In der Zwischenkriegszeit genossen die tschechisch-französischen Beziehungen einen privilegierten Status. Daher wurden die wissenschaftlichen und kulturellen Beziehungen zwischen Frankreich und der Tschechoslowakei als solche strukturiert und entwickelt – als politisch privilegierte Beziehungen. Die frankophile Lobby war in entscheidenden Positionen im tschechoslowakischen Bildungs- und Militärministerium vertreten."
CZE_soviet_treaties:0	" Verbesserung der Verträge mit [SOV.getAdjective]s"
CZE_soviet_treaties_desc:0	"Am 16. Mai 1935 unterzeichneten die Tschechoslowakei und die Sowjetunion aufgrund des sowjetischen Bündnisses mit Frankreich den Bündnisvertrag. In den kritischen Jahren vor München hofften viele in der Tschechoslowakei, dass die Sowjetunion im Falle eines Kriegsausbruchs helfen würde."
CZE_soviet_treaties_tooltip_reward_1:0	"\n§G[SOV.getAdjective] -Tschechoslowakischer Bündnisvertrag§! und §YDiplomatisches Ereignis§!.\n"
CZE_soviet_treaties_tooltip_reward_2:0	 "\nVerhandlungen über §YMilitärtechnologie§!:\n§OTaktischer Bomber I§! (90 % Wahrscheinlichkeit)."
CZE_soviet_treaties_positive:0	"[SOV.getAdjective]-Tschechoslowakischer Bündnisvertrag"
CZE_soviet_treaties_negative:0	"[SOV.getAdjective]-Tschechoslowakischer Bündnisvertrag"
CZE.316.t:0	 "Tschechoslowakisch-[SOV.GetAdjective] Beziehungen"
CZE.316.d:0	"Die Tschechoslowakei und [SOV.GetNameDef] unterhielten komplizierte diplomatische Beziehungen. Die intensive Feindseligkeit zwischen den Ländern rührte von dem bewaffneten Konflikt zwischen den bolschewistischen Behörden und den tschechoslowakischen Legionen in Russland nach dem Ersten Weltkrieg her.\n\nZudem hegte der erste Ministerpräsident der Tschechoslowakei, Karel Kramar, aus persönlichen Gründen eine tiefe Abneigung gegen die Bolschewiki, da seine Frau aus dem russischen Adel stammte. Es überrascht daher nicht, dass die Tschechoslowakei 1934 zu den letzten Ländern gehörte, die die Sowjetunion offiziell anerkannten.\n\nAm 16. Mai 1935 wurde der tschechoslowakisch-sowjetische Bündnisvertrag zwischen den beiden Staaten unterzeichnet, bedingt durch das sowjetische Bündnis mit Frankreich, dem führenden politischen und militärischen Verbündeten der Tschechoslowakei. Auf Drängen der tschechoslowakischen Regierung sah ein Protokoll zur Vertragsunterzeichnung vor, dass der Vertrag nur dann in Kraft treten würde, wenn Frankreich dem Opfer des Angriffs beisteht.\n\nNach dem Münchner Abkommen von 1938 und der Besetzung der Tschechoslowakei durch das faschistische Deutschland im März 1939 weigerte sich die Sowjetunion, das Ende der Unabhängigkeit der Tschechoslowakei anzuerkennen."
CZE.316.a:0	"Die Beziehungen weiter verbessern."
CZE.317.t:0	"Verhandlungen über einen Lizenzproduktionsvertrag"
CZE.317.d:0	 "Die Regierung der Tschechoslowakei schlägt ein Lizenzproduktionsabkommen vor. Wir würden die Rechte für die Produktion der hochwertigen C-5-Gebirgsgeschütze und R-5-Flugabwehrgeschütze von Škoda erwerben, während die Tschechoslowaken an unseren SB-2-Bombern für ihre Luftwaffe interessiert sind. \n\nSollen wir den Vertrag aushandeln, Genosse [SOV.GetLeader]?"
CZE.317.a:0	"Mach weiter."
CZE.317.b:0	"Nein."
CZE.318.t:0	"[SOV.getLeader] Einigung auf einen Lizenzproduktionsvertrag"
CZE.318.d:0	"Die Tschechoslowakei und die UdSSR unterzeichneten ein gegenseitiges Abkommen über die Lizenzproduktion von militärischer Ausrüstung. Škoda erwarb die Rechte für die lizenzierte Produktion von SB -2-Bomber im Austausch gegen Lizenzrechte und Konstruktionsunterlagen für Škodas hochwertige C-5-Gebirgsgeschütze und R-3 (vz. 37)-Flugabwehrgeschütze. \n\nDie SB-2-Bomber werden unter der tschechoslowakischen Bezeichnung B.71 produziert, und die Produktion wird zwischen den Unternehmen Letov, Aero und Avia aufgeteilt."
CZE.318.a:0	"Ausgezeichnet."
CZE.319.t:0	"Die [SOV.getAdjective] haben den Lizenzproduktionsvertrag abgelehnt"
CZE.319.d:0	"Leider müssen wir Ihnen mitteilen, dass die Regierung von [SOV.getnameDef] kein Interesse an unserem Vorschlag für eine Lizenzproduktion hatte."
CZE.319.a:0	"Das ist bedauerlich."
CZE_acquire_access_for_soviets:0	"Verhandeln Sie über militärischen Zugang für [SOV.getAdjective]"
CZE_acquire_access_for_soviets_desc:0	"Der entscheidende Faktor, der die Wirksamkeit des Bündnisses beeinträchtigte, war das Fehlen einer gemeinsamen Grenze zwischen der UdSSR und der Tschechoslowakei. Warschau lehnte jegliche Versuche, der Sowjetunion Zugang zu gewähren, ebenso entschieden ab wie die rumänische Regierung. Aber was wäre geschehen, wenn es der tschechoslowakischen Regierung gelungen wäre, ihre Nachbarn davon zu überzeugen, der Roten Armee Durchmarsch zu gewähren?"
CZE_acquire_access_for_soviets_tooltip_reward:0	" \nVerhandlungen über §Ymilitärischen Zugang§! für die §YSowjetunion§! durch §YPolen§! (30 % Wahrscheinlichkeit) oder §YRumänien§! (50 % Wahrscheinlichkeit). \n\nIm Falle erfolgreicher Verhandlungen wird die §YSowjetunion§! die §YUnabhängigkeit§! der §YTschechoslowakei§! auf Kosten des sowjetischen Einflusses in Osteuropa (Verbreitung des Kommunismus)."
CZE_soviet_military:0	"Sowjetischer militärischer Einfluss"
CZE_soviet_military_desc:0	" Wir können viel von unseren [SOV.getAdjective] Genossen lernen!"
CZE.320.t:0	"Tschechoslowakei bittet um Schutz"
CZE.320.d:0	"Aufgrund der Eskalation der deutsch-tschechoslowakischen politischen Lage versucht die tschechoslowakische Regierung, ihre militärischen Bindungen mit [SOV.getnameDef] gegen die Faschisten zu stärken. Wenn wir unsere Unterstützung garantieren, werden sie versuchen, militärischen Zugang für unsere Truppen durch Nachbarländer auszuhandeln.\n\nDies bietet uns eine einmalige Gelegenheit, die Revolution weiter ins Herz Europas zu tragen."
CZE.320.a:0	"Wir werden die Tschechoslowakei schützen"
CZE.320.b:0	"Die Tschechen sind auf sich allein gestellt. "
CZE.321.t:0	"Die Sowjets werden uns unterstützen"
CZE.321.d:0	"Vertreter von [SOV.getnameDef] haben uns ihre Unterstützung zugesichert. Wir müssen nun den militärischen Zugang entweder über Polen oder Rumänien sichern; andernfalls ist die versprochene sowjetische Unterstützung nutzlos."
CZE.321.a:0	"Versuchen Sie, den militärischen Zugang auszuhandeln."
CZE.322.t:0	"Die Sowjets sind nicht interessiert"
CZE.322.d:0	"Die Sowjets haben uns abgelehnt. Es scheint, dass ein engeres Bündnis zwischen Tschechien und [SOV.getAdjective] in der aktuellen politischen Lage unmöglich ist."
CZE.322.a:0	"Das ist äußerst bedauerlich."
CZE.323.t:0	"Militärischer Zugang für die Sowjetunion"
CZE.323.d:0	"Aufgrund der Eskalation der deutschen -tschechoslowakischen politischen Lage versucht die tschechoslowakische Regierung, ihre militärischen Beziehungen zur Sowjetunion zu stärken.\n\nIhre Regierung bittet uns höflich, sowjetischen Truppen den Durchmarsch durch unser Land zu gestatten, sollte es zu einem Krieg kommen."
CZE.323.a:0	"Einverstanden, Deutschland muss in Schach gehalten werden."
CZE.323.b:0	"Sind die Tschechen verrückt? Auf keinen Fall werden wir zulassen, dass Bolschewiken unser Territorium betreten."
CZE.324.t:0	"Militärischer Zugang für die Sowjetunion"
CZE.324.d:0	"Aufgrund der Eskalation der deutsch-tschechoslowakischen politischen Lage versucht die tschechoslowakische Regierung, ihre militärischen Beziehungen zur Sowjetunion zu stärken.\n\nIhre Regierung bittet uns höflich, sowjetischen Truppen den Durchmarsch durch unser Land zu gestatten, sollte es zum Krieg kommen."
CZE.324.a:0	"Einverstanden, Deutschland muss in Schach gehalten werden."
CZE.324.b:0	"Kein sowjetischer Soldat wird rumänischen Boden betreten."
CZE.325.t:0	"Militärischer Zugang für die Sowjetunion gesichert"
CZE.325.d:0	"Es scheint, als hätten tschechische Diplomaten einen ihrer Nachbarn von unserer Notlage überzeugen können. Mit großer Zurückhaltung haben sie schließlich zugestimmt, der Sowjetunion militärischen Zugang zu gewähren, um die Tschechen im Kampf gegen die Deutschen zu unterstützen."
CZE.325.a:0	"Wir werden gemeinsam gegen die Faschisten stehen."
CZE.326.t:0	"Polen lehnt ab"
CZE.326.d:0	"Die polnische Regierung hat unsere Anträge, sowjetischen Truppen den Durchmarsch durch Polen zu gestatten, offiziell abgelehnt."
CZE.326.a:0	"Verstanden."
CZE.327.t:0	"Bündnis mit den Sowjets"
CZE.327.d:0	"Die Sowjets haben uns zudem versichert, dass sie bereit sind, uns zu Hilfe zu kommen, sollte es zum Krieg kommen."
CZE.327.a:0	"Hoffen wir, dass sie ihr Wort halten."
CZE.328.t:0	"Verstanden."
CZE.328.d:0	"Die rumänische Regierung hat unsere Anträge, sowjetischen Truppen den Durchmarsch durch Polen zu gestatten, offiziell abgelehnt."
CZE.328.a:0	"Wir sind auf uns allein gestellt."
CZE.328.b:0	"Wie können sie es wagen, so etwas überhaupt zu verlangen."
CZE_revive_little_entente:0	" Die Kleine Entente wiederbeleben"
CZE_revive_little_entente_desc:0	"Die Kleine Entente war ein Bündnis, das 1920 und 1921 von der Tschechoslowakei, Rumänien und Jugoslawien zur gemeinsamen Verteidigung gegen ungarische Revisionsbestrebungen und zur Verhinderung einer Habsburger-Restauration geschlossen wurde. Frankreich unterstützte das Bündnis durch die Unterzeichnung von Verträgen mit jedem Mitgliedsland. Die Kleine Entente begann 1936 zu zerfallen und löste sich 1938 vollständig auf."
CZE_revive_little_entente_tooltip_reward:0	"\nErstellt neue Fraktion: §YKleine Entente§!"
CZE_little_entente_alliance:0	"Allianz der Kleinen Entente"
CZE_little_entente_alliance_negative:0	"Allianz der Kleinen Entente"
CZE.329.t:0	"Geschichte der Allianz der Kleinen Entente"
CZE.329.d:0	 "Die Kleine Entente war ein gegenseitiges Verteidigungsabkommen zwischen der Tschechoslowakei, Jugoslawien und Rumänien in der Zwischenkriegszeit. Das Bündnis basierte auf mehreren Verträgen, die zwischen 1920 und 1921 unterzeichnet wurden. Es richtete sich gegen die deutsche und ungarische Vorherrschaft im Donauraum und diente dem Schutz der territorialen Integrität und der politischen Unabhängigkeit der Mitglieder. In den 1920er Jahren strebten die drei Nationen eine wirtschaftliche und politische Zusammenarbeit an und verhandelten Bündnisse mit Frankreich. \n\nNachdem Adolf Hitler 1933 die Macht übernommen hatte, richteten die Mitglieder der Kleinen Entente ein Ständiges Sekretariat und einen Ständigen Rat ein, der sich aus ihren Außenministern zusammensetzte und dreimal jährlich zusammentrat, um eine gemeinsame Politik zu lenken. Dennoch verfolgten die drei Staaten in den 1930er Jahren zunehmend eine eigenständige Außenpolitik, vor allem nachdem Deutschland 1936 das R und die französische Unterstützung, auf die sich die Entente stützte, weitgehend an Wert verlor.\n\nHistorisch gesehen verlor die Entente ihre verbleibende politische Bedeutung, als im April 1937 sowohl Jugoslawien als auch Rumänien eine Bitte der damals von Deutschland bedrohten Tschechoslowakei dass die Entente einem Mitglied, das Opfer einer Aggression geworden war, umfassende militärische Hilfe zusichern sollte. Die Entente brach schließlich zusammen, als Deutschland im September 1938 das Sudetengebiet der Tschechoslowakei annektierte."
CZE.329.a:0	 "Versuchen Sie, die Kleine Entente wiederherzustellen."
CZE.330.t:0	"[Root.GetLeader] Versuche zur Reform der Kleinen Entente"
CZE.330.a:0	"Wir dürfen nicht zulassen, dass sich das wiederholt!"
CZE.330.d:0	"In dem Bestreben, eine Einheitsfront gegen gemeinsame Feinde zu bilden, [From.GetName] hat sich an die Mitglieder der Kleinen Entente gewandt und ihnen angeboten, den Zweck des Bündnisses auszuweiten und sich gegen gemeinsame Feinde zu vereinen.\n\nDie tschechoslowakische Führung hat diplomatische Beziehungen zu anderen Nationen geknüpft, die sich bedroht fühlen könnten, und fördert die Einheit, um das diplomatische Gleichgewicht in Europa zu wahren und künftige Konflikte zu verhindern. Nur die Zeit wird zeigen, ob sie Erfolg haben werden."
CZE.330.b:0	"Vive la L’Entente!"
CZE.330.c:0	" Das könnte unsere Pläne für Europa erschweren."
CZE.330.e:0	"Europa muss sich gegen faschistische Aggressoren vereinen!"
CZE.330.f:0	"Ein Zeichen für zunehmende Spannungen in Europa."
CZE_invite_romania:0	"Rumänien einladen"
CZE_invite_romania_desc:0	"Wir müssen unser Bündnis mit Rumänien stärken. "
CZE_invite_romania_tooltip_reward:0	"\n§YRumänien§! tritt der §YKleinen Entente§! bei (90 % Wahrscheinlichkeit)."
CZE_invite_yugoslavia:0	"Lade Jugoslawien "
CZE_invite_yugoslavia_desc:0	"Wir müssen unser Bündnis mit Jugoslawien stärken."
CZE_invite_yugoslavia_tooltip_reward:0	"\n§YJugoslawien§! tritt der §YKleinen Entente§! (90 % Wahrscheinlichkeit)."
CZE.331.t:0	"Reform der Kleinen Entente"
CZE.331.d:0	"Um die Kleine Entente wiederherzustellen, bittet die Tschechoslowakei darum, dass wir unser Bündnis bekräftigen, um einem möglichen Wiederaufleben aggressiven Expansionismus seitens der alten Mittelmächte oder der Sowjetunion Einhalt zu gebieten."
CZE.331.a:0	"Gerne. Die Kleine Entente muss wieder aufgebaut werden."
CZE.331.b:0	"[Root.GetNameDefCap] geht seinen eigenen Weg."
CZE.332.t:0	"[From.GetNameDefCap] tritt der Kleinen Entente bei"
CZE.332.d:0	"Unser Plan, den Zerfall der Kleinen Entente und deren Abkehr von uns zu verhindern, macht Fortschritte. [From.GetLeader] billigt unsere Bemühungen und hat unseren Vorschlag zur Reform des Bündnisses angenommen."
CZE.332.a:0	"Wir sind dem Wiederaufbau der Kleinen Entente einen Schritt näher gekommen. "
CZE.333.t:0	"[From.GetNameDefCap] Lehnt tschechoslowakischen Vorschlag ab"
CZE.333.d:0	"Trotz unserer größten Bemühungen, die Kleine Entente zu reformieren, stieß unser jüngster Versuch, auf eine der Nationen zuzugehen, auf Skepsis. [From.GetLeader] hat sich geweigert, dem Bündnis beizutreten, vielleicht weil sie unsere Motive anzweifeln oder befürchten, dass eine zu enge Anlehnung an uns sie zur Zielscheibe machen würde."
CZE.333.a:0	"Sie könnten, soweit sie wissen, bereits eine Zielscheibe sein!"
CZE_hungary_intervention:0	"Intervention in Ungarn"
CZE_hungary_intervention_desc:0	" Die Tschechoslowakei hatte ein kompliziertes Verhältnis zu Ungarn. Nach der Unabhängigkeitserklärung im Jahr 1918 führten Grenzkonflikte in der Slowakei zu bewaffneten Auseinandersetzungen. Seitdem war Ungarn für die Tschechoslowakei stets ein Dorn im Auge."
CZE_austria_intervention:0	"Intervention in Österreich"
CZE_austria_intervention_desc:0	" Die tschechoslowakische Führung war sich der wachsenden faschistischen Unterstützung in Österreich durchaus bewusst, und die Befürchtungen vor einer Art österreichisch-deutscher Allianz waren, wie die späteren Jahre zeigen sollten, kein bloßer Aberglaube."
CZE_claims_bohemian_crown:0	"Ansprüche auf ehemalige böhmische Kronländer"
CZE_claims_bohemian_crown_desc:0	" Die slawischen Sorben aus der Lausitz wollten schon immer Teil der Tschechoslowakei sein. Üben wir internationalen Druck auf Deutschland aus, was einige Teile der böhmischen Kronländer betrifft."
CZE_claims_bohemian_crown_tooltip_reward:0	"\nStellt Deutschland ein Ultimatum (§YAnsprüche und begrenztes Kriegsziel§!) wegen Teilen der ehemaligen böhmischen Kronländer (§YNiederschlesien§!)."
CZE.350.t:0	"Ansprüche auf die Lausitz"
CZE.350.d:0	"Während des Ersten Weltkriegs, insbesondere im letzten Kriegsjahr, dachten mehrere tschechische Vertreter aus Politik und Kultur über die Idee einer Wiederherstellung des tschechischen Staates in den historischen Grenzen der ehemaligen tschechischen Kronländer nach.\n\nGleichzeitig fanden Verhandlungen über die Grenzen eines neuen Staates statt. Die endgültige Entscheidung fiel auf der Pariser Friedenskonferenz im Januar 1919. Die tschechische Delegation wurde von Ministerpräsident Karel Kramář und Außenminister Edvard Beneš. Sie bemühten sich intensiv, die Alliierten davon zu überzeugen, dass die Tschechoslowakei ihre historischen Kronlandgrenzen erhalten sollte.\n\nWährend die Verhandlungen über Ruthenien und Oberungarn erfolgreich verliefen, musste die tschechische Delegation in vielen Fällen Zugeständnisse machen, beispielsweise in Kladsko, der Lausitz oder bei einem Korridor nach Jugoslawien.\n\nDie Lausitz spielte in diesem politischen Spiel um Gebietsansprüche eine besondere Rolle. Es gab eine relativ starke Lausitzer Nationalbewegung, die Autonomie innerhalb Deutschlands oder den Anschluss an die neue Tschechoslowakische Republik forderte. Die Lausitzer Frage war für die tschechoslowakischen Diplomaten nicht von entscheidender Bedeutung. Ohne die offene Unterstützung des tschechoslowakischen Staates konnte die inoffizielle Lausitzer Delegation auf der Friedenskonferenz die Lausitzer Forderungen nicht auf die Tagesordnung der Konferenz setzen. Dennoch bestanden während der Ersten Tschechoslowakischen Republik weiterhin gute Beziehungen zwischen den Tschechen und den Sorben.\n\nHistorisch gesehen wurde die Lausitz beim Wiener Kongress 1815 Teil Preußens. Trotz der Germanisierung blieb die ursprüngliche slawische Sprache des Volkes, das als Sorben oder Wenden bekannt ist, bis zu einem gewissen Grad erhalten. Im 19. Jahrhundert wurde in Prag ein sorbisches Seminar gegründet, um Studenten aus der Lausitz zu unterstützen.\n\nNach dem Zweiten Weltkrieg versuchten die Lausitzer, Teil der Tschechoslowakei zu werden, doch die Alliierten unterstützten ihre Bemühungen nicht."
CZE.350.a:0	"Wir müssen unsere sorbischen Freunde vor deutscher Unterdrückung schützen."
CZE_czechoslovak_government_reform:0	 "Reform der tschechoslowakischen Regierung"
CZE_czechoslovak_government_reform_desc:0	"Am 6. November 1935 wurde der damalige Ministerpräsident Jan Malypetr nach dem Tod des ehemaligen Vorsitzenden Bohumír Bradáč zum neuen Vorsitzenden der Abgeordnetenkammer gewählt. Da sich die Ämter des Ministerpräsidenten und des Vorsitzenden der Abgeordnetenkammer gegenseitig ausschlossen, musste ein neuer Ministerpräsident, Milan Hodža, ernannt werden."
CZE_czechoslovak_government_reform_tooltip_reward:0	"\n §YPolitische Macht§!."
CZE.400.t:0	"Wahlergebnisse 1935"
CZE.400.d:0	"Am 19. Mai 1935 fanden in der Ersten Tschechoslowakischen Republik die vierten Parlamentswahlen für beide Kammern des Parlaments statt – für die Abgeordnetenkammer und den Senat der Nationalversammlung der Tschechoslowakischen Republik.\n\nNach den Ergebnissen der Volkszählung von 1930 hatte die damalige Tschechoslowakische Republik insgesamt 14.479.565 Einwohner, wobei sich die Bevölkerung des Staates wie folgt zusammensetzte:\n\n- Tschechen und Slowaken – 66,9 % (9.688.770) \n- Deutsche 22,3 % (3.231.688)\n- Ungarn 4,8 % (691.923) \n- Ruthenen 3,8 % (549.169)\n- Polen 0,6 % (81.737).\n\nDie Zahl der gültigen Stimmen bei der Wahl zur Abgeordnetenkammer betrug 8.231.412, was einer Wahlbeteiligung von fast 92 % der Wahlbeteiligung entspricht.\n\nDie Ergebnisse der Parlamentswahl von 1935 sorgten für eine erhebliche Überraschung. Die oppositionelle Sudetendeutsche Partei (SdP, angeführt von Konrad Henlein) ging auf nationaler Ebene als Siegerin aus der Parlamentswahl hervor, sowohl bei der Wahl zur Abgeordnetenkammer (15,2 %) als auch bei der Wahl zum Senat (15 %). Über zwei Drittel der Stimmen unter den Sudetendeutschen entfielen auf die SdP.\n\nDie stärkste Regierungspartei, die Agrarpartei (Republikanische Partei der Landwirte und Bauern), erhielt 14,3 % der Stimmen, und die Sozialdemokraten kamen auf 12,6 %. Dennoch erhielt die regierende Agrarpartei dank der Wahlmathematik letztlich die meisten Mandate, nämlich 45, während die SdP ein Mandat weniger erhielt.\n\nInfolge der Wahlen verlor die bestehende Regierungskoalition Koalition (unter der Führung von Jan Malypetr) ihre Mehrheit (sie hatte 149 von 300 Abgeordneten) und trat zurück. Im Juli wurde schließlich eine neue breite Koalitionsregierung (ohne SdP) gebildet. Im November 1935 löste jedoch Milan Hodža Jan Malypetr als Ministerpräsidenten ab und nahm in den folgenden Monaten einige Änderungen an seinem Kabinett vor."
CZE.400.a:0	" Regierungsreform"
CZE_extend_military_service:0	"Verlängerung der Wehrpflicht"
CZE_extend_military_service_desc:0	" Die Wehrpflicht in der Tschechoslowakei betrug ursprünglich 14 Monate, wurde später jedoch in den kritischen Vorkriegsjahren auf 18 und sogar 24 Monate verlängert.\n\nSelbst nach seiner Grundausbildung war jeder Mann verpflichtet, an Militärübungen mit einer Gesamtdauer von 14 Wochen teilzunehmen. "
CZE_extend_military_service_tooltip_reward:0	"\nÄnderung des §YWehrpflichtgesetzes§! ODER §YPersonal§!bezogene §YNationalidee§!."
CZE.401.t:0	"Wehrdienst in der Tschechoslowakei"
CZE.401.d:0	"Als die Tschechoslowakei 1918 entstand, betrug die Dauer des Wehrdienstes zunächst 14 Monate. Ab 1924 wurde diese auf 18 Monate erhöht, und 1933 wurde aufgrund der internationalen Lage eine zweijährige Wehrpflicht eingeführt.\n\nDie Wehrpflicht galt für alle männlichen Bürger der Tschechoslowakei, einschließlich ethnischer Deutscher und anderer Minderheiten. Daher mussten die Einberufungs- und Mobilisierungspläne entsprechend angepasst werden, um mögliche Desertionen im Falle eines Konflikts mit Deutschland zu vermeiden.\n\nNach Beendigung ihres Wehrdienstes wurden die Wehrpflichtigen in die aktive Reserve überführt, die in die I. und II. Reserve unterteilt war.\n\nDie I. Reserve bestand aus tauglichen und gesunden Wehrpflichtigen bis zum Alter von 40 Jahren. Sie sollten im Kriegsfall mobilisiert werden und dienten bei Bedarf auch zur Verstärkung der Armee.\n\nDie II. Reserve war für jene Wehrpflichtigen bestimmt, die nicht für die I. Reserve in Frage kamen. Dazu gehörten Personen über 40 Jahre sowie diejenigen, für den aktiven Dienst nicht fit genug waren. Sie sollten Unterstützungsaufgaben übernehmen oder im Hinterland dienen. Wehrpflichtige, die über die jährliche Standardquote hinaus eingezogen wurden, oder solche, denen der volle Dienst erheblichen Schaden zugefügt hätte, gehörten zur sogenannten Ersatzreserve, wurden aber technisch gesehen der II. Reserve zugerechnet.\n\nMitglieder der I. Reserve waren verpflichtet, mehrere militärische Übungen zu absolvieren: zwei mit einer Dauer von vier Wochen und drei mit einer Dauer von drei Wochen. Mitglieder der Ersatzreserve mussten zusätzlich vier Wochen Ausbildung absolvieren.\n\nDas Verteidigungsministerium hatte die zusätzliche Befugnis, die I. und die Ersatzreserve zu weiteren speziellen, bis zu vier Wochen dauernden Übungen einzuberufen. Davon wurde in der Regel Gebrauch gemacht, wenn neue Ausrüstung von der Armee eingeführt wurde, aber konnte auch unter außergewöhnlichen Umständen genutzt werden."
CZE.401.a:0	"Wehrdienst verlängern"
CZE.401.b:0	"Wehrpflicht- und Mobilisierungsplan für Minderheiten vorbereiten"
CZE_minority_mobilization_plan:0	"Wehrpflicht- und Mobilisierungsplan für Minderheiten"
CZE_minority_mobilization_plan_desc:0	" Der Einberufungsplan für Minderheiten ist in Kraft."
CZE_field_medics:0	"Fertigstellung des Masaryk-Militärkrankenhauses"
CZE_field_medics_desc:0	"Die militärmedizinischen Dienste in der Tschechoslowakei bestanden in Friedenszeiten aus einem Netzwerk von 12 Divisionskrankenhäusern.\n\nIm Jahr 925, am 75. Geburtstag von Präsident Tomáš Garrigue Masaryk, beschloss das Parlament den Bau eines neuen Militärkrankenhauses; der Bau begann jedoch erst 1936."
CZE_field_medics_tooltip_reward:0	 "\n§YArmeeerfahrung§! und §YFeldlazarett§! bezogene §YForschungsbonus§! ."
CZE.402.t:0	"Masaryk-Militärkrankenhaus in Prag"
CZE.402.d:0	"Die militärmedizinischen Dienste in Friedenszeiten in der so sogenannten Ersten Republik aus einem Netzwerk von 12 Divisionskrankenhäusern. Das Divisionskrankenhaus Nr. 1 befand sich am Karlsplatz in Prag und wurde zur führenden militärmedizinischen Einrichtung des Landes zu jener Zeit.\n\nIm Jahr 1925, zum 75. Geburtstag von Präsident Tomáš Garrigue Masaryk, beschloss das Parlament den Bau ein neues Militärkrankenhaus zu errichten.\n\nDer Bau der neuen Räumlichkeiten des Masaryk-Militärkrankenhauses begann jedoch erst nach mehr als zehn Jahren. Das überzeugendste Projekt, das 1930 vom Architekten B. Adamek aus dem Prager Stadtteil Dejvice entworfen wurde, erfüllte sowohl die Rolle eines modernen medizinischen als auch eines militärischen Zentrums mit tatsächlichen Mobilisierungsfunktionen. \n\nDie Bauarbeiten begannen im März 1936, und die erste Bauphase wurde 1938 abgeschlossen. Das Hauptkrankenhausgebäude, einschließlich der chirurgischen und internistischen Kliniken, der Heizhäuser sowie Unterkünfte für Militärangehörige, wurde errichtet.\n\nDas Masaryk-Militärkrankenhaus wurde am 1. August 1938 offiziell eröffnet und nahm einen Monat später die ersten Patienten auf. Weitere Erweiterungen waren geplant; doch der Bau wurde durch den Zweiten Weltkrieg unterbrochen, und das Krankenhaus wurde von der deutschen Armee besetzt, die es als Reservekrankenhaus (Reserve Lazaret I, Prag) nutzte .\n\nHeute ist die Einrichtung als Militäruniversitätskrankenhaus Prag bekannt und dient als Ausbildungs-, Bildungs- und medizinische Fachklinik der Armee der Tschechischen Republik, die eine umfassende Gesundheitsversorgung auf dem Niveau von Universitätskliniken bietet. "
CZE.402.a:0	"Eröffnung des Masaryk-Militärkrankenhauses."
CZE_sokol_movement:0	"Unterstützung der Sokol-Bewegung"
CZE_sokol_movement_desc:0	" Die Sokol-Bewegung (vom slawischen Wort für Falke) ist eine Turnorganisation für alle Altersgruppen, die ursprünglich 1862 in Prag von Miroslav Tyrš und Jindřich Fügner gegründet wurde. Sie basierte auf dem Grundsatz "Ein starker Geist in einem gesunden Körper", war aber auch entscheidend für die Wiederbelebung der tschechischen nationalen Identität."
