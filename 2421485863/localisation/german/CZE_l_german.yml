CZE_armament_2b_desc:0	"Die tschechoslowakische Armee hatte Pläne für eine stärkere Motorisierung. Leider bedeuteten die enormen Kosten für Befestigungsarbeiten, dass das Budget für die Beschaffung neuer Lastwagen begrenzt war."
CZE_armament_2b_tooltip_reward:0	 "\n§YRüstungsindustrie§! und §YRüstungsproduktion§! im Zusammenhang mit §Yder nationalen Idee§!."
CZE.216.t:0	"Ringhoffer – Tatra"
CZE.216.d:0	"Die Ursprünge von Tatra reichen bis ins Jahr 1850 zurück, als Ignac Sustala mit zwei Gesellen in Koprivnice (Nesselsdorf).\n\nNach 1918 wurde der Name des Unternehmens in Koprivnice von "Nesselsdorfer Wagenbau" in "Koprivnicka vozovka, a.s." geändert. Zu dieser Zeit verlegte die Unternehmensleitung auf Aufforderung der tschechoslowakischen Staatsbehörden ihren Sitz von Wien nach Prag. Im Jahr 1919 erschien die Marke TATRA erstmals auf Fahrzeugen. \n\nDas Unternehmen wurde 1926 in die Ringhoffer-Gruppe eingegliedert. Nach einer weiteren Annäherung an den Prager Magnaten Ringhoffer wurde 1936 die Ringhoffer TATRA, a.s. gegründet und zwei Jahre später in Ringhoffer TATRA Werke AG umbenannt.\n\nAbgesehen von einigen Aufträgen für Panzerwagen war das Unternehmen bei militärischen Ausschreibungen nie wirklich erfolgreich. Das CKD/Škoda-Kartell sicherte sich fast immer die Aufträge für die tschechoslowakische Armee, oft dank Bestechungsgeldern. Dies hinderte Tatra jedoch nicht daran, neben der traditionellen Pkw-, Lkw- und Lokomotivenproduktion auch gepanzerte Fahrzeuge und sogar experimentelle Panzer zu entwickeln.\n\nWährend des Zweiten Weltkriegs spielte Tatra eine entscheidende Rolle bei der Produktion von Lastwagen und Panzermotoren für die deutsche Kriegsanstrengung, und der berühmte T 111 entstand. Dieser dreiachsige Schwerlastwagen mit einem direkt luftgekühlten Zwölfzylinder-Dieselmotor blieb 16 Jahre lang in Produktion. \n\nEin weiteres erfolgreiches Modell, der Tatra 87, war angeblich während des Zweiten Weltkriegs bei deutschen Offizieren wegen seiner überragenden Geschwindigkeit und seines Fahrverhaltens auf der Autobahn beliebt. Die Tatras beeinflussten sowohl Hitler als auch Porsche. Hitler war ein begeisterter Automobilfan und war während politischer Reisen durch die Tschechoslowakei in Tatras mitgefahren.\n\nViele deutsche Offiziere kamen ums Leben, als sie die schweren Tatras mit Heckmotor schneller durch Kurven fuhren, als sie sie beherrschen konnten. Damals wurde Tatra als Anekdote als das "tschechische Geheimwaffe" " – wegen der zahlreichen Offiziere, die am Steuer ums Leben kamen; zeitweise wurden sogar offizielle Befehle erlassen, die deutschen Offizieren das Fahren untersagten."
CZE.216.a:0	"Neue Lastwagen bestellen."
CZE_motorization_factories:0	"Motorisierungsoffensive"
CZE_motorization_factories_desc:0	"Bestellung neuer Lastwagen bei Tatra."
CZE_new_tanks:0	"Feldtest neuer Panzermodelle"
CZE_new_tanks_desc:0	" 1937 schrieb die tschechoslowakische Armee einen Wettbewerb für einen neuen mittleren Panzer aus; Škoda, ČKD und Tatra nahmen daran teil. Die Armee bestellte schließlich den LT vz.38 bei ČKD/Škoda, den Nazi-Deutschland später gegen Polen und Frankreich einsetzte. Zu den angebotenen Konzepten gehörte auch der mittlere Panzer ST.39 von ČKD."
CZE_new_tanks_tooltip_reward:0	" \nNeue §YLeichtpanzer§!-Variante ODER §YMittlerer Panzer§!-Forschung."
CZE.217.t:0	"Modernisierung der Panzer der tschechoslowakischen Armee "
CZE.217.d:0	"Aufgrund der sich verschärfenden internationalen Lage in Europa schrieb die tschechoslowakische Armee einen Wettbewerb für einen neuen Panzer aus. Von den mehreren vorgestellten Projekten erwiesen sich die modernisierte Version der TNHP-Leichtpanzer und der Prototyp des mittleren Panzers V-8-H in den Testläufen als die vielversprechendsten.\n\nIm Jahr 1935 suchte der tschechoslowakische Panzerhersteller ČKD nach einem Ersatz für den Panzer LT vz. 35, den er gemeinsam mit den Škoda-Werken produzierte. Das daraus resultierende Fahrzeug war zuverlässig und unter dem Namen "TNH" ein Exporterfolg. Mit leichten Abweichungen für jeden Kunden wurden 50 Exemplare in den Iran (TNHP) und je 24 nach Peru (LTP) und in die Schweiz (LTH). Auch Litauen bestellte einige Exemplare (LTL). Eine etwas modernisierte Variante des Panzers, später bekannt als LT vz. 38,  nahm an der Ausschreibung teil.\n\nDas Projekt V-8-H wurde Ende der 1930er Jahre von ČKD ins Leben gerufen, und das daraus resultierende Fahrzeug wurde schließlich als ST vz. 39 bekannt. Aufgrund der sich verschlechternden internationalen Lage bestellte die Armee einige hundert dieser Fahrzeuge. Der Auftrag wurde jedoch nach dem Münchner Abkommen storniert, und das Modell ging nie in Serienproduktion.\n\nWelche Panzer sollten für die tschechoslowakische Armee bestellt werden?"
CZE.217.a:0	"Befiehl die Produktion von leichten Panzern des Typs LT vz. 38."
CZE.217.b:0	"Entwickle das Projekt des mittleren Panzers V-8-H weiter. "
CZE_artillery_focus:0	"Modernisierung der Artillerie"
CZE_artillery_focus_desc:0	"Die Škoda-Werke produzierten viele hervorragende Artillerie-, Panzerabwehr- und Flugabwehrgeschütze, von denen viele von der tschechoslowakischen Armee bestellt und eingesetzt wurden."
CZE_armoured_cars:0	"Modernisierung der Panzerwagen"
CZE_armoured_cars_desc:0	"Die tschechoslowakische Armee hatte seit 1926 verschiedene Tatra-Panzerwagen evaluiert, wobei viele Prototypen gebaut wurden. Schließlich wurden Panzerwagen des Typs OA vz. 30 bestellt, und etwa 50 wurden für die Armee hergestellt.\n\nWährend des Zweiten Weltkriegs entwickelte Tatra seinen ersten luftgekühlten Dieselmotor, einen massiven V12, der ursprünglich für den Panzer SdKfz 234 Puma konzipiert war."
CZE_mechanized_units:0	"Personentransportpanzer"
CZE_mechanized_units_desc:0	"Wir müssen uns auf die Entwicklung spezieller gepanzerter Fahrzeuge für unsere motorisierte Infanterie konzentrieren."
CZE_new_tank_design:0	"Entwicklung neuer Panzer"
CZE_new_tank_design_desc:0	"Wir müssen uns auf die Entwicklung neuer, moderner Panzer konzentrieren."
CZE_R56_air_is_our_sea:0	"Die Luft ist unser Meer"
CZE_R56_air_is_our_sea_desc:0	"Die tschechoslowakische Führung musste eine leistungsfähige Luftwaffe für eine moderne Nation aufbauen, die von potenziell feindlichen Nachbarn umgeben war und keinen Zugang zum Meer hatte. So entstand das Motto "Die Luft ist unser Meer "."
CZE_R56_air_is_our_sea_tooltip_reward:0	"\n§YLuftdoktrinen§! Forschungsbonus."
CZE.218.t:0	"Geschichte der tschechoslowakischen Luftwaffe"
CZE.218.d:0	"Im Oktober 1918 trafen sich ehemalige tschechische Mitglieder österreichisch-ungarischer Geschwader auf der Insel Zofin in Prag. Niemand ahnte, dass sie zu dieser Zeit eine der bedeutendsten Luftstreitkräfte Europas gründeten. Viele begeisterte Männer versammelten sich um Feldwebel Kostrba, doch es gab keine Flugzeuge. Die neue Luftwaffe erhielt erhebliche Unterstützung durch eine französische Spende von 127 Flugzeugen.\n\nDie tschechoslowakische Führung musste eine leistungsfähige Luftwaffe für eine moderne Nation aufbauen, die von potenziell feindlichen Nachbarn umgeben war und keinen Zugang zum Meer hatte. So entstand das Motto "Die Luft ist unser Meer ". Die tschechoslowakische Regierung schuf in der Zwischenkriegszeit ein Gleichgewicht zwischen einer einheimischen Luftfahrtindustrie und der Lizenzierung von Triebwerken und Flugzeugkonstruktionen aus verbündeten Nationen. Mehrere große Flugzeugunternehmen und einige Triebwerkshersteller blühten in den 1930er Jahren in der Tschechoslowakei auf, darunter Avia, Aero und das staatlich kontrollierte Unternehmen Letov.\n\nObwohl Deutschland die Tschechoslowakei kampflos einnahm, leisteten viele tschechoslowakische Piloten während des Krieges hervorragende Arbeit. Sie begannen 1939, das Land zu verlassen, um im Ausland gegen Deutschland zu kämpfen. Sie gingen nach Polen, Jugoslawien und Frankreich. Nach Kriegsbeginn waren sie an allen Fronten, in den unterschiedlichsten Uniformen und Flugzeugen, und halfen dabei, den Angreifer aufzuhalten.\n\nIhren ersten bedeutenden Sieg errangen sie in der Luftschlacht um England als Teil von fünf tschechoslowakischen RAF-Staffeln, den Nummern 68, 310, 311, 312 und 313.\n\nNach einer Vereinbarung zwischen der tschechoslowakischen Exilregierung in London und der Sowjetunion gingen einige tschechische Piloten an die Ostfront. Sie bildeten das erste tschechoslowakische Jagdregiment und waren die ersten tschechoslowakischen Exilsoldaten, die den befreiten tschechoslowakischen Boden betraten.\n\nIn der Zwischenzeit kämpften die Tschechen an der Westfront weiter gegen die Luftwaffe. Sie patrouillierten über dem Atlantik, zerstörten die V1-Raketen und nahmen an der Invasion in der Normandie teil.\n\nEs ist keine Übertreibung zu sagen, dass, während 1918 niemand etwas von tschechischen Piloten wusste, sie 1945 zu den besten der Welt gehörten."
CZE.218.a:0	""Die Luft ist unser Meer" (Motto der tschechoslowakischen Luftwaffe)."
CZE_czechoslovak_airforce:0	"Ausbau der tschechoslowakischen Luftwaffe"
CZE_czechoslovak_airforce_desc:0	"Im Frühjahr 1935 gab Deutschland öffentlich zu, eine starke Luftwaffe aufzubauen; die Tschechoslowakei und Frankreich reagierten darauf mit einer Vertiefung der Zusammenarbeit im Luftfahrtbereich und einem Ausbau der Luftstreitkräfte."
CZE_czechoslovak_airforce_tooltip_reward:0	" \nKostenlos §YChef der Luftwaffe§! und §YLuftwaffenstützpunkt§!."
CZE.219.t:0	" Ausbau der tschechoslowakischen Luftwaffe"
CZE.219.d:0	"Die tschechoslowakische Luftwaffe unterstand direkt dem Verteidigungsministerium als Teil der III. Abteilung (Luftwaffe), die die Angelegenheiten der Luftwaffe und der Luftverteidigung verwaltete. Sie war wahrscheinlich einer der prestigeträchtigsten Zweige der Streitkräfte, obwohl personell nur etwa 4 % der Gesamtstärke ausmachte.\n\nÄhnlich wie die Armee war auch die Luftwaffe bei allen Waffen, Ausrüstungsgegenständen und anderen Avionikinstrumenten ausschließlich auf die heimische Produktion angewiesen. Später wurden jedoch einige neue Lizenzen für moderne Flugzeuge von Frankreich und der Sowjetunion erworben.\n\n1934 beschloss das Verteidigungsministerium, die Luftstreitkräfte mit einem einzigen Jagdflugzeugtyp auszustatten, dem Avia B. 534, der schließlich mit 568 Flugzeugen, die in vier Serien (Versionen) gebaut wurden, zum Rückgrat der tschechoslowakischen Luftwaffe wurde.\n\nAls Deutschland im Frühjahr 1935 öffentlich zugab, eine starke Luftwaffe aufzubauen, reagierten die Tschechoslowakei und Frankreich mit einer Vertiefung der Zusammenarbeit im Luftfahrtbereich. Das tschechoslowakische Oberkommando reagierte auf diese neue Entwicklung mit dem Ausbau von drei auf sieben Flugplätze, von denen jeder zwei Bomberstaffeln versorgen konnte, die im Falle eines Krieges mit Deutschland aus Frankreich eintreffen würden. \n\nAnfang 1936 bestellte das Verteidigungsministerium eine neue Charge von Avia B.534-Flugzeugen, die im Frühjahr 1937 in Dienst gestellt wurden. Die letzte Version des Flugzeugs wies verschiedene Verbesserungen auf, die der IV. Serie eine erhöhte Geschwindigkeit von über 200 mph (320 km/h), womit sie mit den besten Doppeldeckern ihrer Zeit gleichzog.\n\nGeneral Jaroslav Fajfr war seit 1927 Leiter der III. Abteilung des MND und trug maßgeblich zum Ausbau und zur Organisation der tschechoslowakischen Luftwaffe bei."
CZE.219.a:0	"Stellt der III. Abteilung mehr Mittel zur Verfügung."
CZE_air_modernization:0	"Letov-Militärflugzeugfabrik"
CZE_air_modernization_desc:0	" Die tschechoslowakische Regierung schuf in der Zwischenkriegszeit ein Gleichgewicht zwischen einer einheimischen Luftfahrtindustrie und der Lizenzierung von Triebwerken und Flugzeugkonstruktionen aus verbündeten Nationen. Die Letov-Militärfabrik wurde gegründet, um alte Flugzeuge zu reparieren und zu modernisieren, und viele Modelle wurden kontinuierlich umgerüstet, um ihre Lebensdauer zu verlängern."
CZE_air_modernization_tooltip_reward:0	"\nNeues §YKampfflugzeug§! und §YVariante für die Luftnahunterstützung§!."
CZE.220.t:0	"Geschichte der Firma Letov"
CZE.220.d:0	"Die Firma Letov ist der älteste Luftfahrthersteller in der ehemaligen Tschechoslowakei und wurde ursprünglich 1918 vom Verteidigungsministerium als staatlich kontrollierte Flugzeugreparaturfirma für Flugzeuge aus dem Ersten Weltkrieg gegründet, die von der tschechoslowakischen Luftwaffe übernommen worden waren.\n\nDas Unternehmen hatte seinen Sitz in Letnany, Prag, und beschäftigte Ende der 1930er Jahre etwa 1.200 Mitarbeiter, als es den Doppeldecker Š-328 für Aufklärungs- und leichte Bombenangriffe herstellte, von dem über 450 Exemplare produziert wurden. Die gesamte Flugzeugzelle war geschweißt und nicht verschraubt oder vernietet.\n\nDas Letov-Werk war zudem das einzige tschechoslowakische Werk, das Metallpropeller herstellte.\n\nWährend des Zweiten Weltkriegs diente das Werk als Reparaturwerkstatt für die deutsche Luftwaffe. Es wurden auch Produktionslinien für Kampfflugzeugversionen der Ju 290 eingerichtet, beginnend mit der Ju 290 A-2, die für ihren Patrouilleneinsatz mit einem Suchradar ausgestattet war.\n\nViele tschechoslowakische Flugzeugkonstruktionen wurden modernisiert und umgerüstet, um ihre Lebensdauer zu verlängern, darunter die Avia B.534 und die Letov Š -328, die in mehreren Serien produziert wurden, um die ursprünglichen Konstruktionen zu verfeinern und mechanische Probleme zu beheben, die während des Einsatzes aufgetreten waren."
CZE.220.a:0	"Modernisierung tschechoslowakischer Militärflugzeuge."
CZE_pilot_training:0	" Militärflugschule"
CZE_pilot_training_desc:0	"Tschechoslowakische Piloten genossen vor Ausbruch des Zweiten Weltkriegs einen guten Ruf, und viele von ihnen flohen nach der Besetzung der Tschechoslowakei später nach Polen oder Frankreich. Einige gelangten schließlich nach England und nahmen an der Luftschlacht um England teil. "
CZE_pilot_training_tooltip_reward:0	"\nNeuer §YJägerass-§! und §YLuftdoktrinen-§!Forschungsbonus."
CZE.221.t:0	"Militärflugschule in Prostejov"
CZE.221.d:0	"Die Geschichte der tschechoslowakischen militärischen Flugausbildung blickt auf eine fast hundertjährige Tradition zurück und reicht bis ins Jahr 1919 zurück, als die Flugschule in Prag gegründet wurde.\n\nIm Jahr 1920 wurde Cheb zu einem wichtigen Zentrum der militärischen Flugausbildung. Im Jahr 1 927 wurde die Flugschule schließlich in eine neu errichtete Anlage in Prostějov verlegt und in Militärflugschule umbenannt.\n\nDas zweijährige Ausbildungsprogramm brachte perfekt ausgebildete Offiziere und Mechaniker sowie weiteres technisches Personal hervor, das die tschechoslowakische Luftwaffe dringend benötigte. \n\nViele Piloten, die in der Luftschlacht um England kämpften, waren Absolventen der Militärflugschule in Prostějov, darunter Josef František, einer der erfolgreichsten alliierten Fliegerasse."
CZE.221.a:0	"Finanzierung von Ausbildungsprogrammen für die militärische Luftfahrt."
CZE_armament_3:0	"Ausbau Flugzeugproduktion"
CZE_armament_3_desc:0	"Avia wurde 1929 Teil der Škoda-Werke, und in den folgenden Jahren entwickelte sich das Werk zum bedeutendsten Flugzeughersteller in der Tschechoslowakei und zog nach Letňany bei Prag um. \n\nWährend des Zweiten Weltkriegs produzierte Avia Flugzeuge für die deutsche Luftwaffe."
CZE_armament_3_tooltip_reward:0	"\n§YRüstungsindustrie§! und §YMilitärproduktion§! im Zusammenhang mit der §Ynationalen Idee§!."
CZE.222.t:0	"Geschichte von Avia"
CZE.222.d:0	"Avia war das größte Luftfahrtunternehmen in Vorkriegs-Tschechoslowakei. Es wurde 1919 in einer ehemaligen Zuckerfabrik in Vysočany, Prag, als Wartungs- und Reparaturwerkstatt gegründet, doch schon bald folgte die Flugzeugproduktion. Zwischen 1926 und 1929 wurde das Unternehmen schrittweise in die Škoda-Werke eingegliedert und zog schließlich in ein neu errichtetes Werk in Letnany, Prag, um.\n\n1931 wurde der Ingenieur František Novotný zum neuen Chefkonstrukteur ernannt und entwarf den Prototyp für die Doppeldecker B.534, die für die tschechoslowakische Luftwaffe hergestellt wurden. Das Unternehmen fertigte auch eine lizenzierte Version der sowjetischen Tupolev SB-2-Bomber, bekannt unter ihrer Avia-Bezeichnung: B.71.\n\nIn der zweiten Hälfte des Jahres 1936 wurde in Kunovice (Mähren) ein neues Werk errichtet, das als Reparaturwerk dienen sollte, damit die Werke in Prag die Flugzeugproduktion steigern konnten.\n\nWährend des Zweiten Weltkriegs produzierte Avia Flugzeuge und führte Reparaturen für die deutsche Luftwaffe durch."
CZE.222.a:0	"Neues Werk in Kunovice errichten. "
CZE_avia_letnany:0	"Avia Letňany Flugzeugbau"
CZE_avia_letnany_desc:0	"Modernes Flugzeugbauunternehmen mit Sitz in Letňany, Prag."
CZE_complete_the_shift_towards_static_defence:	"Vollendung des Übergangs zur statischen Verteidigung"
CZE_complete_the_shift_towards_static_defence_desc:	" In Zeiten wie diesen müssen wir unsere Verteidigung stärken. Die Zusammenarbeit mit französischen Generälen und Strategen wird es uns ermöglichen, uns auf eine methodische statische Verteidigung zu konzentrieren."
CZE_return_to_mobile_defence:	"Zurück zur mobilen Verteidigung"
CZE_return_to_mobile_defence_desc:	"Zu Beginn der 1930er Jahre wurde eine Doktrin entwickelt, die mobile Verteidigung vor statischer Verteidigung betonte und von Generälen wie Vojtěch Luža, Jaroslav Eminger und anderen vertreten wurde. Und auch wenn unser Generalstab dazu übergegangen ist, die französische Militärschule zu kopieren, ist klar, dass die Zukunft im Manöver liegt."
CZE_integrate_aspects_of_mobile_defence:	"Aspekte der mobilen Verteidigung integrieren"
CZE_integrate_aspects_of_mobile_defence_desc:	" Zwar produzieren unsere Konstruktionsbüros einen der besten Panzer auf dem Markt, doch unsere Doktrin darf sich nicht um Panzer drehen. Das hindert uns jedoch nicht daran, sie einzusetzen. "
CZE_the_central_role_of_artillery_citadels:	"Die zentrale Rolle der Artilleriezitadellen"
CZE_the_central_role_of_artillery_citadels_desc:	"Die vom ŘOP entworfenen Artilleriezitadellen sollen eine der führenden Rollen bei der Verteidigung unseres Landes spielen. Diese riesigen unterirdischen Befestigungsanlagen mit schwerer Artillerie werden unserer Armee Feuerunterstützung bieten und sind dabei nahezu unauslöschlich. Die Fertigstellung der drei Artilleriezitadellen – Grünwald, Stachelberg und Dobrošov im Norden unseres Landes – wird uns einen großen Vorteil verschaffen."
CZE_reform_the_rop:	"Bau der ŘOP-Befestigungsanlagen"
CZE_reform_the_rop_desc:	" Unsere Erfahrung beim Bau von Befestigungslinien hat sich ausgezahlt; wir sind nun in der Lage, bessere Bunker schneller und kostengünstiger zu errichten als andere."
CZE_construct_additional_defence_lines:	"Zusätzliche Verteidigungsanlagen errichten"
CZE_construct_additional_defence_lines_desc:	"Wie ein altes Sprichwort sagt: "Es kann nie genug Befestigungen geben." Sollten unsere Grenzbefestigungen fallen, ermöglichen uns die neuen Verteidigungslinien den Rückzug und die Verteidigung unseres Kernlandes."
CZE_an_impregnable_wall:	"Eine uneinnehmbare Mauer"
CZE_an_impregnable_wall_desc:	" Die Armee wird keinen Zentimeter unseres Territoriums aufgeben, und kein Feind wird in der Lage sein, uns das zu nehmen, was uns gehört."
CZE_indirect_combat:	"Indirekter Kampf"
CZE_indirect_combat_desc:	"Wie manche sagen: "Die Artillerie ist der Gott der Schlacht." Das gilt unabhängig davon, für welche Doktrin man sich entscheidet, und wir dürfen die Artillerieforschung nicht vernachlässigen."
CZE_repurpose_the_rop:	"ŘOP-Pioniere integrieren"
CZE_repurpose_the_rop_desc:	"Die Integration eines separaten Kerns von Befestigungsspezialisten in unsere Divisionen wird es unseren Armeen ermöglichen, sich schneller und effizienter zu verschanzen."
CZE_mobile_artillery:	" Mobile Artillerie"
CZE_mobile_artillery_desc:	"Angesichts des hohen Tempos der modernen Kriegsführung ist es von größter Bedeutung, dass unsere Artillerie nicht hinterherhinkt. Der Einsatz von SPAs wird unserer Armee helfen."
CZE_the_new_sturmbaons:	"Die neuen Sturmbataillone"
CZE_the_new_sturmbaons_desc:	"Im Ersten Weltkrieg entstanden die modernen Stoßtruppen. Österreich -Ungarn folgte diesem Trend und setzte ab 1916 Jagdkommandos ein. Bis 1917 wurden diese Einheiten umstrukturiert und entwickelten sich schließlich zu den gefürchteten Sturmbaons, deren entscheidender Beitrag zum durchschlagenden Sieg in der Schlacht von Caporetto unbestritten ist. Die Wiederbelebung und Integration der Sturmbaons in unser Militär wird von großem Nutzen sein."
CZE_the_legacy_of_kaiserjagers:	"Das Erbe der Kaiserjäger"
CZE_the_legacy_of_kaiserjagers_desc:	"Während des Ersten Weltkriegs bewiesen Spezialtruppen, die in den Tiroler Bergen ausgebildet worden waren, ihre herausragende Wirksamkeit. Auch wenn wir heute nicht mehr über so viel Gebirgsgelände verfügen wie zu Zeiten des Österreichisch-Ungarischen Reiches, könnte das Beispiel der Kaiserjäger sehr nützlich sein."
CZE_an_armoured_army:	"Eine Panzerarmee"
CZE_an_armoured_army_desc:	"Unsere jüngsten Reformen haben unsere Armee in eine moderne und schlagkräftige Panzertruppe verwandelt."
CZE_army_repressions:	"Repressionen in der Armee"
CZE_walter_engines:	"Walter-Motoren"
CZE_walter_engines_desc:	"Die Firma Walter stellt bereits seit den Tagen des Österreichisch-Ungarischen Reiches Flugzeugmotoren her. Da einer der größten Engpässe bei unserer Flugzeugentwicklung das Fehlen moderner Motoren ist, würde sich eine Investition in die Firma Walter für uns als äußerst vorteilhaft erweisen."
CZE_fund_further_monoplane_experiments:	"Weitere Experimente mit Eindeckern finanzieren"
CZE_fund_further_monoplane_experiments_desc:	"Auch wenn unser Doppeldecker Avia B.534 zu den besten derzeit verfügbaren Modellen zählt, ist es offensichtlich, dass Eindecker-Jäger die Zukunft sind. František Novotný, Leiter des Avia-Konstruktionsbüros, hat daran gearbeitet, eine moderne Eindecker-Flugzeugzelle serienreif zu machen, konnte ihn aufgrund von Motorproblemen und fehlender Finanzierung noch bauen. Wir sollten darüber nachdenken, die staatliche Unterstützung für das Programm zu verstärken."
CZE_cas_focus:	"CAS im Fokus"
CZE_cas_focus_desc:	"Es ist offensichtlich, dass die Luftnahunterstützung in den kommenden Konflikten eine große Rolle spielen wird. Und obwohl unsere Letov Š-28 sehr erfolgreich waren, müssen wir weiter innovativ sein ."
CZE_R56_expand_aircraft_production:0	"Ausweitung der Flugzeugproduktion"
CZE_R56_expand_aircraft_production_desc:0	""
CZE_R56_heavy_fighter_experiments:0	"Experimente mit schweren Kampfflugzeugen"
CZE_R56_heavy_fighter_experiments_desc:0	""
CZE_R56_new_bomber_prototypes:0	"Neue Bomber-Prototypen"
CZE_R56_new_bomber_prototypes_desc:0	""
