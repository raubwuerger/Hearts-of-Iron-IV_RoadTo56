####### FUTURE ADDITIONS ""

#######  czke.447.t:0 "Autonomie der Slowakei und Karpatenrutheniens"
#######  czke.447.d:0 "Im Gefolge der Münchner Krise wurde eine größere Autonomie für die östlichen Gebiete der Tschechoslowakei gefordert. Zwei Verfassungsgesetze vom 22. November 1938 (Verfassungsgesetz Nr. 299/1938 Slg. über die Autonomie der Slowakei und das Verfassungsgesetz Nr. 328/1938 Slg. über die Autonomie der Karpatenruthenie) ersetzten den bestehenden einheitlichen Charakter des tschechoslowakischen Staates durch ein asymmetrisches Modell der Autonomie der Slowakei und der Karpatenruthenie, nicht aber der historischen böhmischen Länder. \nIn der Slowakei wurde eine neue lokale Regierung unter Tiso eingesetzt, und der Name des Landes wurde von Tschechoslowakische Republik in Tschecho-Slowakische Republik geändert. Angesichts der Ereignisse von 1939 und der Besetzung der tschechischen Länder durch Deutschland dauerte das Bestehen dieser Föderation jedoch nur wenige Monate, bevor die unabhängige Slowakische Republik als Klientelstaat des nationalsozialistischen Deutschlands gegründet wurde."
#######  czke.447.a:0 "Die Autonomie vorbereiten."

#DECISIONS# ""
CZE_the_second_czechoslovak_republic:0	"Die Zweite Tschechoslowakische Republik"
CZE_the_second_czechoslovak_republic_desc:0	"[CZE.getNameDefCap] ist ein multiethnischer Staat, der 1918 aus dem zerfallenden österreichisch-ungarischen Reich als unabhängige Nation hervorging, die von vielen ethnischen Tschechen, Slowaken, Deutschen, Ungarn, Ruthenen, Polen und vielen anderen bevölkert wurde. \nDiese Vielfalt bringt verschiedene Vorteile und Hindernisse für die junge Republik mit sich. "
CZE_subcarpathian_ruthenia_political_reforms:0	"Politische Reformen in [73.getName]"
CZE_subcarpathian_ruthenia_political_reforms_desc:0	"Die Folgen der Münchner Krise verlangten eine größere Autonomie für die östlichen Regionen von [CZE.getNameDef].\n\n]Zwei Verfassungsgesetze vom 22. November 1938 (Verfassungsgesetz Nr. 299/1938 Slg. über die Autonomie der Slowakei und das Verfassungsgesetz Nr. 328/1938 Slg. über die Autonomie der Karpatenruthenie) ersetzten den bestehenden einheitlichen Charakter des tschechoslowakischen Staates durch ein asymmetrisches Modell der Autonomie der Slowakei und der Karpatenruthenie, nicht aber der historischen tschechischen Gebiete."

CZE_sdp_radicalization:0	"Radikalisierungskrise der SdP"
CZE_sdp_radicalization_desc:0	"Die deutsche Minderheit im Sudetenland strebt aktiv eine engere Bindung an [GER.getNameDef] an. Sie fordert eine größere Autonomie innerhalb des Staates und droht, den Widerstand gegen die staatlichen Behörden in ihren Gebieten zu verstärken."
czke.447.t:0	"Kommunistische Opposition stellt KSČ-Führung in Frage"
czke.447.d:0	"Mehrere Mitglieder der Kommunistischen Partei der Tschechoslowakei haben Zweifel an der Führung des derzeitigen Vorsitzenden Klement Gottwald geäußert, von dem man annimmt, dass er sich eng an die Politik Stalins hält. Einige schlagen die Rückkehr von Alois Neurath vor, einem trotzkistischen Deutschstämmigen, der immer noch im Lande wohnt. Während seine Erhebung in die Partei ein entscheidender Schritt zur Einigung der sozialistischen Fraktionen der Tschechoslowakei sein könnte, halten viele die Angleichung an Stalins Politik für entscheidend für den Sieg in der Republik."
czke.447.a:0	"Warum sollten wir diesen kranken Narren an die Macht bringen?"
czke.447.b:0	"Die internationalistische Sache würde von seiner Einbeziehung profitieren!"
czke.447.t:0	"Kommunistische Opposition stellt KSČ-Führung in Frage"
czke.447.d:0	"Mehrere Mitglieder der Kommunistischen Partei der Tschechoslowakei haben Zweifel an der Führung des derzeitigen Vorsitzenden Klement Gottwald geäußert, von dem man annimmt, dass er sich eng an die Politik Stalins hält. Einige schlagen die Rückkehr von Alois Neurath vor, einem trotzkistischen Deutschstämmigen, der immer noch im Lande wohnt. Während seine Erhebung in die Partei ein entscheidender Schritt zur Einigung der sozialistischen Fraktionen der Tschechoslowakei sein könnte, halten viele die Angleichung an Stalins Politik für entscheidend für den Sieg in der Republik."
czke.447.a:0	"Warum sollten wir diesen kranken Narren an die Macht bringen?"
czke.447.b:0	"Die internationalistische Sache würde von seiner Einbeziehung profitieren!"
