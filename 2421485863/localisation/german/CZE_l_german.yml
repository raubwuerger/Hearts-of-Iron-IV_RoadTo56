CZKE_boycott_press_law:0	"Änderung des Boykottpressegesetzes"
CZKE_boycott_press_law_desc:0	"Obwohl die Tschechoslowakei ein demokratischer Staat war, bewegte sie sich durch mehrere umstrittene Rechtsnormen allmählich in Richtung autoritäre Demokratie. Eines dieser Gesetze war das so genannte "Kleine Pressegesetz"; Gesetz Nr. 126/1933."
CZKE_boycott_press_law_tooltip_reward:0	"\n Wahl zwischen zwei Arten von §YPolitik§! bezogenen Belohnungen."
czke.407.t:0	"Gesetz Nr. 126/1933 Kontroverse"
czke.407.d:0	"Angesichts des aufkommenden politischen Extremismus erließ die Tschechoslowakei 1923 zum Schutz der Republik ein Staatsverteidigungsgesetz, das subversive Handlungen unter Strafe stellte. \nAuf der Grundlage dieses Gesetzes konnten die tschechoslowakischen Behörden die Veröffentlichung von Zeitschriften und die Verbreitung von Druckerzeugnissen, die die verfassungsmäßige Integrität und das republikanische und demokratische System der Tschechoslowakei untergruben, untersagen und Materialien obszöner Natur verbieten. Die Zensur wurde mit dem Gesetz Nr. 126/1933, dem so genannten "Gesetz über die kleine Presse", weiter verschärft. In Verbindung mit dem später verabschiedeten Gesetz Nr. 201/1933 (Auflösung und Suspendierung politischer Parteien) und dem Gesetz Nr. 131/136 (Staatsschutzgesetz) verfügte die Regierung über alle Instrumente zur Unterdrückung sowohl der deutschen Nationalisten als auch der kommunistischen Partei. \nMit dieser Konzeption der autoritären Demokratie wollte die Tschechoslowakei gute Beziehungen zu ihren Verbündeten in Europa knüpfen, die Innenpolitik und das politische System konsolidieren und eine starke Verteidigung gegen Nazi-Deutschland aufbauen. \nEs ist nicht verwunderlich, dass alle nicht-tschechischen politischen Parteien die Pressegesetznovelle heftig kritisierten, wenn man bedenkt, dass die Regierung die deutsche, slowakische und ungarische Presse häufig zensierte. Die SdP und die Kommunistische Partei bildeten jedoch während der Parlamentsdebatten eine ungewöhnliche parlamentarische Allianz, da die kommunistische Presse ebenfalls häufig zensiert wurde. Mehrmals setzte die Regierung die offizielle Parteizeitung "Rudé Právo" (Unsere roten Rechte) aus."
czke.407.a:0	"Politische Behinderungen."
czke.407.b:0	"Aufruf zu Demonstrationen."
