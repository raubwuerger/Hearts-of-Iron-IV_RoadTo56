CZKE_economy:0	"Wirtschaft"
CZKE_auh_branch:0	"AH Vereinheitlichung"
CZKE_national_unity_government_tooltip_trigger:0	"§YYYalta-Konferenz§! hat nicht stattgefunden"
CZKE_together_against_berlin:0	"Gemeinsam gegen Berlin"
CZKE_together_against_berlin_desc:0	"Die deutsche Regierung stellt eine ständige Bedrohung für die kürzlich erlangte Unabhängigkeit der Tschechoslowakei und Polens dar. Die beste Verteidigung gegen dieses große Übel ist ein Präventivschlag, um ihre Expansionspläne zu durchkreuzen."
CZKE_five_year_plan_tooltip_trigger:0	"§YYYalta-Konferenz§! geschehen"
CZKE_expand_soviet_ties:0	"Ausweitung der [SOV.GetAdjective]-Bindungen"
CZKE_expand_soviet_ties_desc:0	"Die [SOV.GetAdjective] haben sich als verlässlicher Verbündeter in der sich ständig verändernden globalen Ordnung erwiesen. Sicherlich würden sie sich über ein Angebot zur Vertiefung unserer Beziehungen freuen, und es würde unsere Nation für das Kommende stärken."
CZE_help_from_sov:0	"Sowjetische Hilfe"
CZKE_friendship_with_USSR:0	"Freundschaftsvertrag"
czke.448.t:0	"Tschechoslowakei bietet Freundschaftsvertrag an"
czke.448.d:0	"Die tschechoslowakische Regierung hat in den letzten Tagen eine Delegation entsandt, die um einen formellen Freundschaftsvertrag bittet, der, wie sie sagt, unsere Beziehungen festigen wird. Was sollen wir unseren Freunden in Prag sagen?"
czke.448.a:0	"Natürlich werden wir ihn sofort unterzeichnen!"
czke.448.b:0	"Nein, danke."
czke.449.t:0	"Die [SOV.GetAdjective]'s haben zugestimmt"
czke.449.d:0	"Die [SOV.GetAdjective]'s haben unserem Vorschlag für einen 'Freundschaftsvertrag' zugestimmt. Unsere Beziehungen werden durch diese Entwicklung aufblühen."
czke.449.a:0	"Großartig."
czke.450.t:0	"Die [SOV.GetAdjective]'s haben abgelehnt"
czke.450.d:0	"Die [SOV.GetAdjective] haben unseren Vorschlag für einen 'Freundschaftsvertrag' mit der Begründung abgelehnt, unsere Bedingungen seien zu einseitig. Das ist ohne Zweifel eine enttäuschende Entwicklung."
czke.450.a:0	"Unglücklich..."
CZKE_split_poland:0	"Polen spalten"
CZKE_split_poland_desc:0	"Die Entente war töricht und naiv bei der Gründung von Staaten, die nicht in der Lage waren, sich selbst zu verteidigen. Polen, das seit langem unter reaktionärer, totalitärer Herrschaft steht, soll von der Landkarte verschwinden und unsere westslawischen Kameraden in diesen Ländern sollen unter unseren Mantel gebracht werden. Mit der Hilfe unserer [SOV.GetAdjective] Verbündeten, was soll uns jetzt noch aufhalten!"
czke.451.t:0	"Tschechoslowakei bietet Teilung Polens an"
czke.451.d:0	"Das tschechoslowakische Außenministerium hat uns kürzlich einen Vorschlag unterbreitet, in dem es uns anbietet, die kürzlich unabhängig gewordene Nation Polen unter uns aufzuteilen. Als Gegenleistung für unsere Beteiligung an der Invasion bieten sie uns derzeit die vollständige Kontrolle über die Gebiete an, die wir im jüngsten polnisch-sowjetischen Krieg verloren haben. Was sollen wir von diesem bedeutenden Angebot halten?"
czke.451.a:0	"Das wird für uns alle von Vorteil sein!"
czke.451.b:0	"Wir können nicht riskieren, den Westen weiter zu verärgern."
czke.452.t:0	"Die [SOV.GetAdjective]'s haben zugestimmt!"
czke.452.d:0	"Die [SOV.GetAdjective]s haben unserem Vorschlag, Polen zu teilen, zugestimmt. Wir sind nun bereit, die bevorstehenden Pläne für eine gemeinsame Invasion der Nation zu veröffentlichen."
czke.452.a:0	"Ausgezeichnete Neuigkeiten."
czke.453.t:0	"Die [SOV.GetAdjective]'s haben abgelehnt!"
czke.453.d:0	"Die [SOV.GetAdjective] haben unseren Vorschlag, Polen zu teilen, mit der Begründung abgelehnt, dass sie keinen unendlichen Konflikt mit der westlichen Welt riskieren können, die sie damit sicherlich verärgern würden."
czke.453.a:0	"Dann werden wir alleine gehen!"
CZKE_union_with_warsaw:0	"Union mit Warschau"
CZKE_union_with_warsaw_desc:0	"Mit den Arbeitern Polens unter unserem Banner können wir endlich die populäre, wenn auch gescheiterte Idee einer echten Union der westslawischen Nationen verwirklichen! Unsere einzige Verteidigung gegen die westliche Welt ist die Kameradschaft mit unseren langjährigen Freunden."
CZKE_union_with_warsaw_trigger_tt:0	"Alle beginnenden §YPolnischen§! Staaten, die keine Kerne eines anderen Landes sind: \n Einhaltung mehr als §Y50%§! \n Widerstand weniger als §Y5%§!"
CZKE_union_with_warsaw_effect_tt:0	"Wir werden als §YDie Demokratische Republik Tschechoslowakei-Polen§! bekannt sein."
end_of_czechoslovakia:0	"Die Tschechoslowakei hat ihr Schicksal gefunden"
