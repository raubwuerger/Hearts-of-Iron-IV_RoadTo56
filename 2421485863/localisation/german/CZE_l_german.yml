CZE.403.t:0	"Geschichte der Sokol-Bewegung"
CZE.403.d:0	"Die Sokol-Bewegung (vom slawischen Wort für Falke) ist eine Turnorganisation für alle Altersgruppen, die ursprünglich 1862 in Prag von Miroslav Tyrš und Jindřich Fügner gegründet wurde. Sie basierte auf dem Grundsatz "Ein starker Geist in einem gesunden Körper" , war aber auch entscheidend für die Wiederbelebung der tschechischen nationalen Identität.\n\nDer Patriotismus von Sokol war von Anfang an zu erkennen. Sokol-Mitglieder unternahmen Ausflüge in Trachten (Kroj) , nahmen an nationalen Feierlichkeiten und öffentlichen Übungen teil und ermutigten die Menschen allgemein dazu, Patriotismus zu zeigen.\n\nDie größte von Sokol organisierte Veranstaltung ist der "všesokolský slet" (Treffen aller Sokol-Mitglieder), der alle sechs Jahre stattfindet. Diese Treffen haben ihren Ursprung im Juni 1882, und beim ersten "Slet" zählte mehr als 700 Sportler.\n\nSokol erlebte in der Zwischenkriegszeit eine Blütezeit, und in dieser Zeit wuchs die Mitgliederzahl auf über eine Million an. Einflussreiche Politiker, darunter die ersten beiden Präsidenten der Tschechoslowakischen Republik, Masaryk und Beneš, waren Mitglieder von Sokol. \n\nIn dieser Zeit nahm der Nationalismus zu, und ethnische Diskriminierung oder gar Antisemitismus -Semitismus waren keine Seltenheit. Sokol-Mitglieder beteiligten sich zudem aktiv an der "Tschechisierung" der ethnischen Deutschen in den Grenzregionen und den deutschsprachigen Inseln und trugen im Allgemeinen gemeinsam mit anderen tschechischen und deutschen Vereinigungen die Verantwortung für den daraus resultierenden nationalen Hass zwischen Tschechen und Deutschen in der Zwischenkriegszeit.\n\nSokol wurde dreimal fast aufgelöst und von allen totalitären Regimes in der tschechoslowakischen Geschichte verboten. Erstens wurde Sokol 1915 während des Ersten Weltkriegs verboten. Zweitens geschah dies während der nationalsozialistischen Besetzung der tschechischen Gebiete. Schließlich wurde Sokol nach 1948 von den Kommunisten verboten. Im Jahr 1968 wurden die Bemühungen um eine Wiederbelebung von Sokol durch die Normalisierung zunichte gemacht, und so wurde Sokol nach 42 Jahren des Stillstands 1990 zum vierten Mal wiederbelebt."
CZE.403.a:0	"Förderung des Patriotismus."
CZE.403.b:0	"Förderung körperlicher Betätigung."
