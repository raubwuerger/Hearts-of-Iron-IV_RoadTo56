JOR_unsupported_war_desc:0		"Wir haben [ISR.GetNameDef] auf eigene Faust angegriffen, und es ist zweifelhaft, dass [ROOT.OVERLORD.GetNameDef] unsere Bemühungen unterstützen wird."
JOR_tribes_desc:0		"Unsere kürzlich errichtete politische Struktur umfasst einen regierenden Monarchen und einen Rat von Stammesvertretern, die das Land zusammenhalten und unsere Völker weiter vereinen. Dies erschwert jedoch jegliche Bemühungen des Emirs, politische Unterstützung zu erlangen oder seine Herrschaft zu stärken. Hinzu kommt, dass die Stämme auch einer Form von starkem Konservatismus folgen, der Jordaniens Modernisierungsprojekte der Armee, der Industrie oder der Außenpolitik verlangsamt, was vom Volk unterstützt wird, jede Abweichung von diesem System könnte zukünftige Probleme verursachen: [JORGetHowitat]\nAl-Utaybah: [JORGetUtaybah]\nBani Sakhr: [JORGetBaniSakhr]\nBani Hamida: [JORGetBaniHamida]\n\n\n§WTotal Tribal Support is: §Y[?JOR_tribal_support]%"
