jordan.1.t:0		"Die Zweite Nationale Konferenz"
jordan.1.desc:0		"Der transjordanische Emir Abdullah hat sich heute zu dem System der Stammesräte geäußert, das eingeführt wurde, um die beduinische Bevölkerung und die zuvor herrschenden mächtigen Stämme zu beschwichtigen. Da Transjordanien jedoch in eine neue Ära eingetreten ist, in der es nicht mehr von Stammesrevolten oder wahhabitischen Übergriffen bedroht ist, muss der Emir entscheiden, welchem Stamm er den Vorrang gibt."
jordan.1.a:0		"Utaybah, die Krieger."
jordan.1.b:0		"Bani Sakhr, die Loyalen"
jordan.1.c:0		"Howitat, die Elite"
jordan.1.d:0		"Die Armee sollte in der Mitte stehen, ohne Stämme, die sich in sie einmischen!"
jordan.2.t:0		"[JOR.GetNameDefCap] Fragt nach Waffenlieferungen"
jordan.2.d:0		"Aus [JOR.GetNameDef] haben sich Gerüchte verbreitet, dass gewisse Elemente im Lande den Sturz der pro-[JOR.OVERLORD.GetAdjective] Regierung vorbereiten. Diese Aufständischen haben uns um Unterstützung bei der Bewaffnung ihrer Truppen gebeten, und wir müssen entscheiden, ob das unsere Zeit wert ist."
jordan.2.a:0		"Ein wichtiger Verbündeter in der Region."
jordan.2.b:0		"Wir lehnen respektvoll ab."
jordan.3.t:0		"[JOR.GetNameDefCap] bittet um Waffenlieferungen"
jordan.3.d:0		"Aus [JOR.GetNameDef] haben sich Gerüchte verbreitet, dass bestimmte Elemente in der Nation den Sturz der pro-[JOR.OVERLORD.GetAdjective] Regierung vorbereiten. Diese Aufständischen haben uns um Unterstützung bei der Bewaffnung ihrer Truppen gebeten, und wir müssen entscheiden, ob das unsere Zeit wert ist."
jordan.3.a:0		"Ein wichtiger Verbündeter in der Region."
jordan.3.b:0		"Wir lehnen respektvoll ab."
jordan.4.t:0		"Irakische Waffenlieferungen"
jordan.4.d:0		"Kurz nachdem wir mehrere verschlüsselte Botschaften an die irakische Regierung geschickt haben, hat sie sich bereit erklärt, uns eine Waffenlieferung über die Mafraq zukommen zu lassen."
jordan.4.a:0		"Wunderbar"
jordan.5.t:0		"Saudi-Waffenlieferungen"
jordan.5.d:0		"Kurz nachdem wir mehrere verschlüsselte Nachrichten an die saudische Regierung geschickt haben, haben sie sich bereit erklärt, uns eine Waffenlieferung über Ma'an zukommen zu lassen."
jordan.5.a:0		"Wunderbar"
jordan.6.t:0		"Das Beschwichtigungsgesetz"
jordan.6.d:0		"Nach einer hitzigen Diskussion zwischen dem Emir Abdullah und seinem Minister hat Seine Majestät der Öffentlichkeit angekündigt, die Stammesräte zu beschwichtigen und weiter zu unterstützen, da sie langsam in die Bedeutungslosigkeit abdriften und das Emirat weiter spalten. [JOR.GetLeader] plant eine Reform des Systems und hat es geschafft, die Beziehungen zum Utaybah-Stamm zu stärken und die Gefahr einer weiteren Adwan-Revolte zu beseitigen."
jordan.6.a:0		"Eine weitere Bedrohung wurde beseitigt."
jordan.7.t:0		"[JOR.GetNameDefCap] bittet um Neuverhandlung des Vertrags"
jordan.7.d:0		"Ein Abgesandter von [JOR.GetAdjective] ist in [GetCapital.GetCapitalVictoryPointName] eingetroffen, um mit dem Hohen Kommissar über den Vertrag von 1928 und die darin enthaltenen Einschränkungen für das transjordanische Militär, die Bürokratie und die Autonomie zu sprechen. [JOR.GetLeader] hat darum gebeten, die Beschränkungen für das Emirat zu lockern, und obwohl wir dadurch unseren Einfluss in der Region verlieren würden, könnte es das wert sein, um ihn als treuen Verbündeten zu gewinnen."
jordan.7.a:0		"Es würde uns nicht schaden."
jordan.7.b:0		"Dummköpfe! Für wen halten sie sich eigentlich?"
jordan.8.t:0		"Britische Weigerung"
jordan.8.d:0		"[ENG.GetLeader] und der Hohe Kommissar haben sich geweigert, den Vertrag von 1928 zu lockern, mit der Begründung, dass sie den Vertrag bereits als sehr milde ansehen."
jordan.8.a:0		"Sie kontrollieren uns nicht!"
jordan.8.b:0		"Wir dürfen den Bären nicht aufstacheln."
jordan.9.t:0		"Neuverhandlung des Vertrags von 1928"
jordan.9.d:0		"Nach der Reise unseres Gesandten nach Jerusalem hat der britische Hochkommissar für Palästina zugestimmt, die Beschränkungen des Vertrags von 1928 zu lockern. Das ist ein großer Erfolg für den Emir, und die Öffentlichkeit ist begeistert!"
jordan.9.a:0		"Wir werden niemals Sklaven sein."
jordan.10.t:0		"Machtkampf in der Nachkriegszeit"
jordan.10.d:0		"Unser Unabhängigkeitskrieg ist vorbei, und wir haben es geschafft, unsere Position auf der Weltbühne zu sichern. Doch obwohl die Armee und die Stämme während des Krieges zusammengearbeitet haben, haben sie begonnen, sich gegenseitig zu bekämpfen.\n\nÜberall im Land sind Scharmützel ausgebrochen, aber da die Sonne in der Wüste untergegangen ist, ist es offensichtlich, dass..."
jordan.10.a:0		"Dem Militär ist es gelungen, die Revolten niederzuschlagen."
jordan.10.b:0		"Die Stämme haben es geschafft, das Militär zu überwältigen!"
