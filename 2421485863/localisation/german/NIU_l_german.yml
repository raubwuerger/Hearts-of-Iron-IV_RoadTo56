# IDEAS
NIU_memories_from_ww1:0					"Erinnerungen an den Großen Krieg"
NIU_memories_from_ww1_desc:0					"1915 schickten wir ein Kontingent von 150 Männern in einen Krieg, an dem wir kein Recht hatten und an dem wir nicht teilnehmen mussten. Die tapferen [NIU.GetAdjective] Soldaten kämpften in Frankreich, mussten aber 1917 aufgrund von Krankheiten nach Hause zurückgeschickt werden. Seitdem sind wir auf unserer Insel geblieben und haben uns nicht in ausländische Konflikte eingemischt. Und das wollen wir auch so beibehalten."
