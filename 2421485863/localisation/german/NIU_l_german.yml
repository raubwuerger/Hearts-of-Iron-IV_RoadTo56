NIU_church_dominance:0			"Starker Einfluss der Kirche"
NIU_church_dominance_desc:0			"Da die Mehrheit unserer Bevölkerung christlichen Glaubens ist, hat die Kirche großen Einfluss auf gesellschaftliche Normen und die öffentliche Meinung. Dies bedroht unsere vollständige Kontrolle über das Land."
NIU_constant_drought:0			"Dürren"
NIU_constant_drought_desc:0			"Unsere Insel ist im Laufe der Jahre mehrfach von Dürren heimgesucht worden, was zu einem weitreichenden Niedergang der Landwirtschaft und zu wirtschaftlichen Schwierigkeiten geführt hat."
NIU_less_droughts:0			"Dürren"
