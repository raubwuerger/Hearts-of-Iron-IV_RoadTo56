SPA_prepare_the_merge_of_falanga_with_carlists_desc:0			"Die Spaltungen unter den antirepublikanischen Gruppen können außer Kontrolle geraten, wenn sie nicht unter Kontrolle gehalten werden. Mit Hilfe des Einflusses einer neuen, vereinigenden politischen Figur können wir den Grundstein für die neue Partei legen, die in der Lage ist, die Interessen aller Mitglieder dieses Zweckbündnisses zu vertreten."
SPA_appease_anti_secular_elements:0			"Anti-Klerikale Elemente besänftigen"
SPA_appease_anti_secular_elements_desc:0			"Die ultrakatholische, antisäkulare Comunión Tradicionalista genießt unter dem Klerus und den traditionell orientierten Elementen des Landes starke Unterstützung. Durch die Verabschiedung einiger antisäkularer Gesetze können wir ihre positive Haltung gegenüber der Regierung noch verstärken."
