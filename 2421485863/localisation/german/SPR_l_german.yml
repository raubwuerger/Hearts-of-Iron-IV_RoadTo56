SPR_proclaim_a_general_strike:0			"Rufen Sie einen Generalstreik aus"
SPR_proclaim_a_general_strike_desc:0			"Rufen Sie einen Generalstreik aus und beginnen Sie mit dem Sammeln und Verteilen von Schusswaffen! Dies wird es uns ermöglichen, die Gewerkschaften zu militärischen Einheiten für den bevorstehenden Kampf zu formen!"
