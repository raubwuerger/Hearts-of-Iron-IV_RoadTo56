SPR_unionify_the_faction:0			"Vereinigen Sie unsere Fraktion"
SPR_unionify_the_faction_desc:0			"Wenn wir diesen Bürgerkrieg gewinnen wollen, müssen wir dafür sorgen, dass alle in unserer Fraktion auf derselben Seite stehen."
SPR_solidify_the_fronts:0			"Die Frontlinien festigen"
SPR_solidify_the_fronts_desc:0			"Nun, da die Fronten des Krieges klar sind, ist es an der Zeit, sich einzugraben und zu festigen, was wir kontrollieren."
SPR_equipment_shipments_r56:0			"Ausrüstungslieferungen"
SPR_equipment_shipments_r56_desc:0			"Viele globale Mächte sind so freundlich, uns Waffen zu 'spenden', um uns zu helfen."
SPR_tackle_the_weak_fronts_r56:0			"Nehmen Sie die schwachen Fronten in Angriff"
SPR_tackle_the_weak_fronts_r56_desc:0			"Wir wissen viel besser als die Republikaner, welche Fronten schwach sind und ausgenutzt werden können. So kann eine neue Offensivkampagne beginnen!"
SPR_new_approach_r56:0			"Eine neue Herangehensweise"
SPR_new_approach_r56_desc:0			"Wenn wir diesen Krieg gewinnen wollen. brauchen wir eine neue Taktik."
SPR_international_brigdes_r56:0			"Internationale Brigaden"
SPR_international_brigdes_r56_desc:0			"Menschen aus der ganzen Welt kommen in die Republik, um das nationalistische Gedränge zu stoppen!"
SPR_excavate_the_gold_reserves:0			"Graben Sie die Goldreserven aus"
SPR_excavate_the_gold_reserves_desc:0			"In der Anfangsphase des Bürgerkriegs ist es uns gelungen, die Goldreserven der Regierung zu beschlagnahmen. Leider werden uns nicht viele Länder etwas geben, wenn wir die Reserven als Zahlungsmittel verwenden, außer den Russen. Die Faschisten bedrängen uns von allen Seiten. Es könnte an der Zeit sein, sie nach Übersee und in die sicheren Hände der [SOV.GetNameDef] zu bringen. Jedenfalls sind sie bereit, uns zu helfen, wenn wir das tun."
SPR_excavated_gold_reserves:0			"Ausgehobene Goldreserven"
SPR_expand_axis_aide:0			"Achsenhilfe ausweiten"
SPR_expand_axis_aide_desc:0			"Die Ausweitung der Hilfe der Achsenmächte ist ein logischer Schritt zur Sicherung des Sieges."
SPR_join_the_communist_opposition:0			"Schließen Sie sich der kommunistischen Opposition an"
SPR_join_the_communist_opposition_desc:0			"Der Stalinismus hat die Ideale der Revolution verraten, aber andere haben ihren wahren Geist getragen."
SPR_unionify_the_faction_idea:0			"Vereinte Fraktion"
SPR_unionify_the_faction_idea_desc:0			"Auch wenn unsere Seite ihre Differenzen hat, sind wir in einem gemeinsamen Ziel vereint: dem Sieg."
SPR_solidify_the_fronts_idea:0			"Gestärkte Fronten"
SPR_solidify_the_fronts_idea_desc:0			"Jetzt, wo die Fronten klar sind. Es ist viel einfacher zu verteidigen als anzugreifen. Wir sollten auf das Angebot eingehen."
SPR_weak_fronts:0			"Die schwachen Fronten in Angriff nehmen"
SPR_international_brigdes_r56_idea:0			"Internationale Brigaden"
SPR_anarchist_insurrection:0			"Anarchistische Insurrektion"
SPR_anarchist_insurrection_desc:0			"Unser Bündnis mit den Anarchisten ist beendet und hat zu einem Aufstand hinter unserer Front geführt, dessen Niederschlagung einige Zeit in Anspruch nehmen wird."
r56_SPR_anarchist_insurrection_mission:0			"Drohende anarchistische Insurrektion"
r56_SPR_anarchist_insurrection_mission_desc:0			"Unser Bündnis mit den Anarchisten wird in Kürze enden. Wenn das geschieht, müssen wir uns mit ihnen auseinandersetzen."
