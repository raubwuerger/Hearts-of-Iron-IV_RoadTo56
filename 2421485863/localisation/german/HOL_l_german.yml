HOL_democratic_tt:0	"Wir müssen entweder dem demokratischen Einfluss nachgegeben haben oder in unserer Handelspolitik neutral geblieben sein."
HOL_monarchist_tt:0	"Wir müssen entweder dem monarchistischen Einfluss nachgegeben haben, oder wir werden einen anderen Regierungstyp als unsere Einflussnehmer verfolgen, um unsere neutrale Politik beizubehalten."
HOL_fascist_tt:0	"Wir müssen entweder dem faschistischen Einfluss nachgegeben haben oder wir werden eine andere Regierungsform als unsere Einflussnehmer verfolgen, um unsere neutrale Politik beizubehalten."
HOL_communist_tt:0	"Wir müssen entweder dem kommunistischen Einfluss nachgegeben haben oder wir werden eine andere Regierungsform als unsere Einflussnehmer anstreben, um unsere neutrale Politik aufrechtzuerhalten."
HOL_can_ENG_or_GER_influence_tt:0	"Wir befinden uns derzeit nicht in einem Prozess des Übergangs zu einer anderen Regierungsform."
HOL_is_placated_changing_gov_tt:0	"befindet sich derzeit nicht in einem Regimewechsel."
HOL_the_new_ideal_MTG_desc:0	"[GER.GetNameDefCap] hat der Welt und vor allem uns zu viel Schaden zugefügt. Sie müssen jetzt den Preis dafür zahlen, indem sie ihre Grenzen nach Osten verlegen."
HOL_base_game_tree_check_fail_tt:0	"Sie verwenden den Nicht-DLC-Baum."
HOL_base_game_tree_check_pass_tt:0	"Unter Verwendung des DLC-Baums."
HOL_anti_pacifist_propaganda_long:0	"Umfassende antipazifistische Propagandakampagne"
HOL_placate_the_japanese:0	"Zugeständnisse an [JAP.GetNameDef]"
HOL_placate_the_japanese_desc:0	"Es ist bekannt, dass die [JAP.GetAdjective] es auf unsere wohlhabenden Kolonien im Osten abgesehen haben. Unsere Streitkräfte wären nicht in der Lage, diese Bedrohung abzuwehren. Vielleicht könnten wir ein günstiges Abkommen schließen."
mtg_netherlands.80.t:0	"[FROM.GetNameDefCap] schlägt Allianz vor"
mtg_netherlands.80.d:0	"[FROM.GetNameDefCap] hat eine Allianz zwischen unseren Nationen vorgeschlagen. Diese Vereinbarung würde eine freundschaftliche Kontrolle über die strategisch wichtigen Ostindischen Inseln bedeuten und uns den Zugang zu ihren Öl- und Kautschukvorkommen nahezu garantieren, ohne einen größeren Konflikt zu riskieren."
mtg_netherlands.80.a:0	"Das wäre von Vorteil."
mtg_netherlands.80.b:0	"Wir könnten diese Ressourcen besser verwalten."
HOL_JAP_new_faction:0	"Erneuerte niederländisch-japanische Allianz"
HOL_restore_naval_cooperation:0	"Wiederherstellung der maritimen Zusammenarbeit"
HOL_restore_naval_cooperation_desc:0	"Die Niederländer haben beim Aufbau der japanischen Marine geholfen. Jetzt hat sich die Situation geändert, und wir hinken in der Entwicklung der Marine hinterher. Eine Zusammenarbeit mit Japan in solchen Fragen könnte unsere Seestreitkräfte stärken."
HOL_jap_research_name:0	"Niederländisch-japanischer Technologieaustausch"
HOL_jap_research_desc:0	"Verkürzte Forschungszeit für Technologien, die von anderen Fraktionsmitgliedern erforscht wurden"
hol_expansionism:0	"Niederländischer Revanchismus"
hol_expansionism_desc:0	"Die Niederländer haben im Laufe der Jahrhunderte viele Gebiete im Flachland und in Übersee unter ihre Kontrolle gebracht, von denen zu viele im Laufe der Zeit verloren gegangen sind. Jetzt ist vielleicht unsere Chance, die Fehler der Revolution, des Krieges und anderer Übertragungen zu korrigieren, die unser Reich im Laufe der Jahre viel zu sehr geschwächt haben."
hol_integrate_flanders:0	"Vlaanderen, Opnieuw van Ons!"
hol_integrate_flanders_desc:0	"Der belgische Aufstand von 1830, der neun Jahre später durch den Vertrag von London zementiert wurde, hat unsere Kontrolle über das niederländischsprachige Flandern erschüttert. Wenn wir sie wieder unter unserer Kontrolle haben, können sie vielleicht wieder integriert werden und der Welt einmal mehr den Willen der vereinigten Niederlande zeigen!"
hol_integrate_wallonie:0	"Wallonien reintegrieren"
hol_integrate_lux:0	"Reintegrieren Sie Luxemburg"
hol_claim_saf:0	"Entfesselt die Buren!"
hol_claim_saf_desc:0	"Vor vielen Jahrhunderten gründete die Niederländische Ostindien-Kompanie mehrere Kolonien am Kap von Südafrika und baute sie im Laufe der Jahre aus. Auch wenn ein Großteil unserer Kontrolle indirekt war, leben viele holländische Siedler heute unter fremder Herrschaft, wir werden unsere Brüder befreien!"
hol_claim_calais:0	"Befreien Sie Französisch-Flandern"
hol_disavow_anglo_dutch_treaty:0	"Verwerfen Sie den anglo-holländischen Vertrag von 1870-1871"
hol_disavow_anglo_dutch_treaty_desc:0	"Die anglo-holländischen Verträge von 1871 zwangen uns unter anderem, den wichtigen westafrikanischen Handelsvorposten der Goldenen Küste abzutreten. Wir werden diesen ungleichen Schlag gegen unser Imperium nicht hinnehmen!"
hol_claim_former_east_indies_possessions:0	"Anspruch auf ehemalige ostindische Besitztümer"
hol_claim_former_east_indies_possessions_desc:0	"Die Niederländische Ostindien-Kompanie kontrollierte einst mehrere wichtige Handelsstützpunkte und Inseln in ganz Asien, die im Laufe der Jahrhunderte unter fremde Herrschaft geraten sind. Wir werden diesen Verlust an unserem rechtmäßigen Territorium nicht länger hinnehmen!"
hol_claim_former_lam_possessions:0	"Erweitern Sie den Besitz der Guianas"
no_shell_shocked_spectator_tt:0	"Does not have §YShell-Shocked Spectator of the Great War§!"
hol_unlocks_integration_decisions_tt:0	"§GUnlocks§! Entscheidungen zur Eingliederung oder Beanspruchung mehrerer historischer §YDutch§! Territorien."
