HOL_abandon_the_gold_standard_not_MTG:0	"Abschaffung des Goldstandards"
HOL_abandon_the_gold_standard_not_MTG_desc:0	"Die Niederlande waren eines der letzten Länder, die den Goldstandard beibehielten. Zwar konnte eine Inflation vermieden werden, doch der Geldmangel strangulierte die Wirtschaft und führte in Verbindung mit der Wirtschaftskrise zu einer Rekordarbeitslosigkeit."
HOL_finish_the_noordoostpolder_not_MTG:0	"Beenden Sie den Noordoostpolder"
HOL_finish_the_noordoostpolder_not_MTG_desc:0	"Die 1936 begonnene Polderisierung des an die Provinz Overijssel angrenzenden IJsselmeeres steht endlich vor dem Abschluss. Aber auch wenn der Prozess abgeschlossen ist, wird es immer noch ungenutzte Flächen geben, die besiedelt und genutzt werden müssen."
